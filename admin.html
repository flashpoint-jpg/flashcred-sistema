<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred Móveis - Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-5xl mx-auto w-full bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 my-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-amber-400">Painel Administrativo</h1>
                <p class="text-sm text-gray-400">Gerenciamento de Propostas e Documentos</p>
            </div>
            <a href="index.html" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm transition">Nova Solicitação</a>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-700 text-xs text-gray-400 uppercase">
                        <th class="p-3">Cliente / CPF</th>
                        <th class="p-3">Valor / Parcelas</th>
                        <th class="p-3">Endereço</th>
                        <th class="p-3">Documentos / Selfie</th>
                        <th class="p-3">Status</th>
                        <th class="p-3 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPropostas" class="divide-y divide-gray-700 text-sm">
                    <tr>
                        <td colspan="6" class="p-4 text-center text-gray-400">Carregando propostas...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function carregarPropostas() {
            try {
                const res = await fetch('/api/admin/propostas');
                const propostas = await res.json();
                const tbody = document.getElementById('listaPropostas');

                if (propostas.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">Nenhuma proposta cadastrada ainda.</td></tr>`;
                    return;
                }

                tbody.innerHTML = propostas.map(p => `
                    <tr class="hover:bg-gray-750">
                        <td class="p-3">
                            <div class="font-bold text-white">${p.nome}</div>
                            <div class="text-xs text-gray-400">CPF: ${p.cpf}</div>
                            <div class="text-xs text-gray-400">Nascimento: ${p.dataNascimento}</div>
                        </td>
                        <td class="p-3">
                            <div class="font-bold text-amber-400">R$ ${p.valorSolicitado}</div>
                            <div class="text-xs text-gray-400">${p.qtdParcelas}x mensais</div>
                        </td>
                        <td class="p-3 text-xs text-gray-300">
                            ${p.rua}, ${p.bairro} - ${p.cidade}/${p.estado}<br>CEP: ${p.cep}
                        </td>
                        <td class="p-3 text-xs space-y-1">
                            ${p.arquivos?.selfie ? `<a href="/uploads/${p.arquivos.selfie}" target="_blank" class="text-amber-400 hover:underline block">📸 Ver Selfie</a>` : ''}
                            ${p.arquivos?.documento ? `<a href="/uploads/${p.arquivos.documento}" target="_blank" class="text-amber-400 hover:underline block">🪪 Ver Documento</a>` : ''}
                            ${p.arquivos?.comprovanteResidencia ? `<a href="/uploads/${p.arquivos.comprovanteResidencia}" target="_blank" class="text-amber-400 hover:underline block">📄 Comprovante Residência</a>` : ''}
                            ${p.arquivos?.comprovanteRenda ? `<a href="/uploads/${p.arquivos.comprovanteRenda}" target="_blank" class="text-amber-400 hover:underline block">💵 Comprovante Renda</a>` : ''}
                        </td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs font-bold ${p.status === 'APROVADO' ? 'bg-green-600 text-white' : p.status === 'REPROVADO' ? 'bg-red-600 text-white' : 'bg-yellow-600 text-gray-950'}">${p.status}</span>
                        </td>
                        <td class="p-3 text-center space-x-1">
                            <button onclick="mudarStatus(${p.id}, 'APROVADO')" class="bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded text-xs font-bold transition">Aprovar</button>
                            <button onclick="mudarStatus(${p.id}, 'REPROVADO')" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs font-bold transition">Reprovar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function mudarStatus(id, status) {
            try {
                const res = await fetch('/api/admin/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status })
                });
                const data = await res.json();
                if (data.sucesso) {
                    carregarPropostas();
                } else {
                    alert('Erro ao atualizar status.');
                }
            } catch (err) {
                alert('Erro de conexão.');
            }
        }

        carregarPropostas();
        setInterval(carregarPropostas, 5000);
    </script>
</body>
</html>
