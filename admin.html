<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred Móveis - Painel Admin Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-6xl mx-auto w-full bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 my-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-amber-400">Painel Administrativo Completo</h1>
                <p class="text-sm text-gray-400">Controle total de propostas, valores e liberação de Pix</p>
            </div>
            <a href="index.html" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm transition">Nova Solicitação</a>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-700 text-xs text-gray-400 uppercase">
                        <th class="p-3">Cliente / CPF</th>
                        <th class="p-3">Valor / Parcelas (Editável)</th>
                        <th class="p-3">Endereço / Docs</th>
                        <th class="p-3">Status / Pix Gerado</th>
                        <th class="p-3 text-center">Ações de Controle</th>
                    </tr>
                </thead>
                <tbody id="listaPropostas" class="divide-y divide-gray-700 text-sm">
                    <tr>
                        <td colspan="5" class="p-4 text-center text-gray-400">Carregando propostas...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function carregarPropostas() {
            try {
                const res = await fetch('/api/admin/propostas');
                const propostas = await res.json();
                const tbody = document.getElementById('listaPropostas');

                if (propostas.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Nenhuma proposta cadastrada ainda.</td></tr>`;
                    return;
                }

                tbody.innerHTML = propostas.map(p => `
                    <tr class="hover:bg-gray-750">
                        <td class="p-3">
                            <div class="font-bold text-white">${p.nome}</div>
                            <div class="text-xs text-gray-400">CPF: ${p.cpf}</div>
                            <div class="text-xs text-gray-400">Nasc: ${p.dataNascimento}</div>
                        </td>
                        <td class="p-3 space-y-1">
                            <div>
                                <span class="text-xs text-gray-400">Valor (R$):</span>
                                <input type="text" id="valor_${p.id}" value="${p.valorSolicitado}" class="w-28 p-1 bg-gray-900 border border-gray-700 rounded text-amber-400 text-xs font-bold">
                            </div>
                            <div>
                                <span class="text-xs text-gray-400">Parcelas:</span>
                                <input type="number" id="parc_${p.id}" value="${p.qtdParcelas}" class="w-16 p-1 bg-gray-900 border border-gray-700 rounded text-white text-xs">
                            </div>
                        </td>
                        <td class="p-3 text-xs space-y-1">
                            <div class="text-gray-300">${p.cidade}/${p.estado} - CEP: ${p.cep}</div>
                            <div class="space-x-1">
                                ${p.arquivos?.selfie ? `<a href="/uploads/${p.arquivos.selfie}" target="_blank" class="text-amber-400 hover:underline">Selfie</a>` : ''}
                                ${p.arquivos?.documento ? `<a href="/uploads/${p.arquivos.documento}" target="_blank" class="text-amber-400 hover:underline">Doc</a>` : ''}
                                ${p.arquivos?.comprovanteResidencia ? `<a href="/uploads/${p.arquivos.comprovanteResidencia}" target="_blank" class="text-amber-400 hover:underline">Residência</a>` : ''}
                                ${p.arquivos?.comprovanteRenda ? `<a href="/uploads/${p.arquivos.comprovanteRenda}" target="_blank" class="text-amber-400 hover:underline">Renda</a>` : ''}
                            </div>
                        </td>
                        <td class="p-3 space-y-2">
                            <span class="px-2 py-1 rounded text-xs font-bold ${p.status === 'APROVADO' ? 'bg-green-600 text-white' : p.status === 'REPROVADO' ? 'bg-red-600 text-white' : 'bg-yellow-600 text-gray-950'}">${p.status}</span>
                            ${p.cobrancaPix ? `
                                <div class="bg-gray-900 p-2 rounded border border-amber-500/50 text-xs">
                                    <p class="text-amber-400 font-bold">Pix Parcela: R$ ${p.cobrancaPix.valorParcela}</p>
                                    <input type="text" readonly value="${p.cobrancaPix.copiaECola}" class="w-full bg-gray-950 p-1 text-[10px] text-gray-300 border border-gray-700 rounded mt-1 select-all" onclick="this.select(); document.execCommand('copy'); alert('Chave Pix Copia e Cola copiada!');">
                                    <span class="text-[10px] text-gray-400">Clique para copiar o Pix</span>
                                </div>
                            ` : ''}
                        </td>
                        <td class="p-3 text-center space-y-2">
                            <button onclick="salvarEAlterar(${p.id}, 'APROVADO')" class="w-full bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs font-bold transition">Aprovar & Gerar Pix</button>
                            <button onclick="salvarEAlterar(${p.id}, 'REPROVADO')" class="w-full bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-bold transition">Reprovar</button>
                            <button onclick="salvarEAlterar(${p.id}, null)" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-bold transition">Salvar Alterações</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function salvarEAlterar(id, status) {
            const valorSolicitado = document.getElementById(`valor_${id}`).value;
            const qtdParcelas = document.getElementById(`parc_${id}`).value;

            const dados = { id, valorSolicitado, qtdParcelas };
            if (status) dados.status = status;

            try {
                const res = await fetch('/api/admin/atualizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                const data = await res.json();
                if (data.sucesso) {
                    carregarPropostas();
                    alert('Proposta atualizada com sucesso!');
                } else {
                    alert('Erro ao atualizar.');
                }
            } catch (err) {
                alert('Erro de conexão.');
            }
        }

        carregarPropostas();
        setInterval(carregarPropostas, 5000);
    </script>
</body>
</html>
