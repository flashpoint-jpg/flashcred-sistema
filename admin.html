<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred Móveis - Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-7xl mx-auto w-full bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 my-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-amber-400">Painel de Controle de Crédito</h1>
                <p class="text-sm text-gray-400">Aprovação com Entrada Obrigatória e Juros de 8% a.m.</p>
            </div>
            <a href="index.html" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm transition">Nova Solicitação</a>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-700 text-xs text-gray-400 uppercase">
                        <th class="p-3">Cliente / CPF</th>
                        <th class="p-3">Valor / Parcelas</th>
                        <th class="p-3">Regras de Entrada (Adm)</th>
                        <th class="p-3">Documentos</th>
                        <th class="p-3">Status / Pix Gerado</th>
                        <th class="p-3 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPropostas" class="divide-y divide-gray-700 text-sm">
                    <tr>
                        <td colspan="6" class="p-4 text-center text-gray-400">Carregando propostas...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function carregarPropostas() {
            try {
                const res = await fetch('/api/admin/propostas');
                const propostas = await res.json();
                const tbody = document.getElementById('listaPropostas');

                if (propostas.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">Nenhuma proposta cadastrada.</td></tr>`;
                    return;
                }

                tbody.innerHTML = propostas.map(p => `
                    <tr class="hover:bg-gray-750">
                        <td class="p-3">
                            <div class="font-bold text-white">${p.nome}</div>
                            <div class="text-xs text-gray-400">CPF: ${p.cpf}</div>
                        </td>
                        <td class="p-3 space-y-1">
                            <div><span class="text-xs text-gray-400">Valor (R$):</span><br><input type="text" id="valor_${p.id}" value="${p.valorSolicitado}" class="w-24 p-1 bg-gray-900 border border-gray-700 rounded text-amber-400 text-xs font-bold"></div>
                            <div><span class="text-xs text-gray-400">Parcelas:</span><br><input type="number" id="parc_${p.id}" value="${p.qtdParcelas}" class="w-16 p-1 bg-gray-900 border border-gray-700 rounded text-white text-xs"></div>
                        </td>
                        <td class="p-3 space-y-1">
                            <div><span class="text-xs text-gray-400">% Entrada:</span><br><input type="number" id="entrada_%${p.id}" value="${p.percentualEntrada || '20'}" class="w-16 p-1 bg-gray-900 border border-gray-700 rounded text-amber-400 text-xs font-bold"></div>
                            <div><span class="text-xs text-gray-400">Venc. Entrada:</span><br><input type="date" id="venc_${p.id}" value="${p.vencimentoEntrada || ''}" class="w-32 p-1 bg-gray-900 border border-gray-700 rounded text-white text-xs"></div>
                        </td>
                        <td class="p-3 text-xs space-y-1">
                            ${p.arquivos?.selfie ? `<a href="/uploads/${p.arquivos.selfie}" target="_blank" class="text-amber-400 hover:underline block">📸 Selfie</a>` : ''}
                            ${p.arquivos?.documento ? `<a href="/uploads/${p.arquivos.documento}" target="_blank" class="text-amber-400 hover:underline block">🪪 Documento</a>` : ''}
                            ${p.arquivos?.comprovanteResidencia ? `<a href="/uploads/${p.arquivos.comprovanteResidencia}" target="_blank" class="text-amber-400 hover:underline block">📄 Residência</a>` : ''}
                            ${p.arquivos?.comprovanteRenda ? `<a href="/uploads/${p.arquivos.comprovanteRenda}" target="_blank" class="text-amber-400 hover:underline block">💵 Renda</a>` : ''}
                        </td>
                        <td class="p-3 space-y-2">
                            <span class="px-2 py-1 rounded text-xs font-bold ${p.status === 'APROVADO' ? 'bg-green-600 text-white' : p.status === 'REPROVADO' ? 'bg-red-600 text-white' : 'bg-yellow-600 text-gray-950'}">${p.status}</span>
                            ${p.cobrancaPix ? `
                                <div class="bg-gray-900 p-2 rounded border border-amber-500/50 text-xs">
                                    <p class="text-amber-400 font-bold">Pix Entrada (${p.cobrancaPix.percentualEntrada}%): R$ ${p.cobrancaPix.valorEntrada}</p>
                                    <p class="text-gray-300">Venc: ${p.cobrancaPix.vencimento}</p>
                                    <p class="text-gray-400">Parcelas (${p.qtdParcelas}x c/ 8% a.m.): R$ ${p.cobrancaPix.valorParcelaMensal}</p>
                                    <input type="text" readonly value="${p.cobrancaPix.copiaECola}" class="w-full bg-gray-950 p-1 text-[10px] text-gray-300 border border-gray-700 rounded mt-1 select-all" onclick="this.select(); document.execCommand('copy'); alert('Pix Copia e Cola copiado!');">
                                </div>
                            ` : ''}
                        </td>
                        <td class="p-3 text-center space-y-1">
                            <button onclick="processar(${p.id}, 'APROVADO')" class="w-full bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded text-xs font-bold transition">Aprovar & Gerar Pix</button>
                            <button onclick="processar(${p.id}, 'REPROVADO')" class="w-full bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs font-bold transition">Reprovar</button>
                            <button onclick="processar(${p.id}, null)" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs font-bold transition">Salvar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function processar(id, status) {
            const valorSolicitado = document.getElementById(`valor_${id}`).value;
            const qtdParcelas = document.getElementById(`parc_${id}`).value;
            const percentualEntrada = document.getElementById(`entrada_%${id}`).value;
            const vencimentoEntrada = document.getElementById(`venc_${id}`).value;

            const dados = { id, valorSolicitado, qtdParcelas, percentualEntrada, vencimentoEntrada };
            if (status) dados.status = status;

            try {
                const res = await fetch('/api/admin/atualizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                const data = await res.json();
                if (data.sucesso) {
                    carregarPropostas();
                    alert('Atualizado com sucesso!');
                } else { alert('Erro ao atualizar.'); }
            } catch (err) { alert('Erro de conexão.'); }
        }

        carregarPropostas();
        setInterval(carregarPropostas, 5000);
    </script>
</body>
</html>
