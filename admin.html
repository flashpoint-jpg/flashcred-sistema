<!-- Exemplo do trecho do card/tabela do cliente no admin.html -->
<div class="bg-gray-900 border border-gray-800 p-6 rounded-3xl space-y-4">
    <div class="flex justify-between items-start">
        <div>
            <h3 class="font-bold text-white text-base" id="adminNome">Nome do Cliente</h3>
            <p class="text-xs text-gray-400">CPF: <span id="adminCpf" class="font-mono">000.000.000-00</span></p>
        </div>
        <span id="adminStatus" class="px-3 py-1 bg-green-500/10 text-green-400 text-xs font-bold rounded-xl">Aprovado</span>
    </div>

    <!-- Informações Completas do Cliente -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs bg-gray-950 p-4 rounded-2xl border border-gray-800">
        <div><span class="text-gray-500 font-semibold">Telefone:</span> <span id="adminTelefone" class="text-gray-200 font-mono">-</span></div>
        <div><span class="text-gray-500 font-semibold">Cor / Produto:</span> <span id="adminCor" class="text-gray-200">-</span></div>
        <div class="sm:col-span-2"><span class="text-gray-500 font-semibold">Endereço:</span> <span id="adminEndereco" class="text-gray-200">-</span></div>
    </div>

    <!-- Botão de Envio de WhatsApp com Mensagem de Parabéns -->
    <div class="flex justify-end pt-2">
        <a id="btnEnviarWhatsapp" href="#" target="_blank" class="bg-green-600 hover:bg-green-500 text-white font-bold px-4 py-2.5 rounded-xl transition text-xs flex items-center gap-2 shadow-lg shadow-green-600/20">
            <span>💬</span> Enviar WhatsApp (Aprovado)
        </a>
    </div>
</div>
