<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Distribuidora Flashpoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#0b0f17] text-gray-100 min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- Tela de Login Admin -->
    <div id="loginModal" class="fixed inset-0 z-50 bg-gray-950 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-gray-900 border border-gray-800 p-8 rounded-3xl shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-gradient-to-tr from-red-600 to-amber-500 rounded-2xl mx-auto flex items-center justify-center font-black text-white shadow-lg">FP</div>
                <h2 class="text-xl font-extrabold text-white">Painel Restrito</h2>
                <p class="text-xs text-gray-400">Faça login para gerenciar propostas e carnês</p>
            </div>
            <form onsubmit="fazerLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block text-gray-400 font-semibold mb-1">Usuário</label>
                    <input type="text" id="loginUsuario" required class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-white outline-none">
                </div>
                <div>
                    <label class="block text-gray-400 font-semibold mb-1">Senha</label>
                    <input type="password" id="loginSenha" required class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-white outline-none">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition uppercase tracking-wide">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <!-- Conteúdo do Painel -->
    <div id="painelConteudo" class="hidden flex flex-col min-h-screen justify-between">
        <header class="border-b border-gray-800/80 bg-[#0b0f17]/80 backdrop-blur-md sticky top-0 z-40 px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-red-600 to-amber-500 rounded-2xl flex items-center justify-center font-black text-white text-sm shadow-lg">FP</div>
                <div>
                    <h1 class="font-bold text-white text-sm tracking-wide">Painel Administrativo</h1>
                    <p class="text-[11px] text-red-500 font-semibold tracking-wider uppercase">Automação e Gestão de Carnês</p>
                </div>
            </div>
            <button onclick="fazerLogout()" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 text-xs text-gray-300 px-4 py-2.5 rounded-xl transition font-semibold">Sair</button>
        </header>

        <main class="max-w-4xl mx-auto w-full p-6 space-y-6 flex-1 my-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-extrabold text-white uppercase tracking-wider">Propostas e Pagamentos</h2>
                <button onclick="carregarPropostas()" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 text-xs text-gray-300 px-4 py-2 rounded-xl transition font-semibold">🔄 Atualizar Lista</button>
            </div>
            <div id="loading" class="text-center py-20 text-gray-400 text-xs">Carregando propostas...</div>
            <div id="listaPropostas" class="space-y-4"></div>
        </main>

        <footer class="py-6 text-center text-gray-600 text-[11px] border-t border-gray-900">
            &copy; 2026 Distribuidora Flashpoint. Painel Restrito.
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem('token_flashpoint');
            if (token) {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('painelConteudo').classList.remove('hidden');
                carregarPropostas();
            }
        });

        async function fazerLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('loginUsuario').value;
            const senha = document.getElementById('loginSenha').value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });
                const data = await res.json();
                if (data.sucesso) {
                    localStorage.setItem('token_flashpoint', data.token);
                    document.getElementById('loginModal').classList.add('hidden');
                    document.getElementById('painelConteudo').classList.remove('hidden');
                    carregarPropostas();
                } else {
                    alert(data.erro);
                }
            } catch (err) {
                alert('Erro de conexão.');
            }
        }

        function fazerLogout() {
            localStorage.removeItem('token_flashpoint');
            location.reload();
        }

        async function carregarPropostas() {
            const token = localStorage.getItem('token_flashpoint');
            const container = document.getElementById('listaPropostas');
            const loading = document.getElementById('loading');

            try {
                const res = await fetch('/api/propostas', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                loading.style.display = 'none';

                if (data.sucesso && data.propostas.length > 0) {
                    container.innerHTML = data.propostas.map(p => `
                        <div class="bg-gray-900 border border-gray-800 p-6 rounded-3xl space-y-3">
                            <div class="flex justify-between">
                                <h3 class="font-bold text-white text-base">${p.nome}</h3>
                                <span class="text-xs font-bold text-amber-400">${p.status}</span>
                            </div>
                            <p class="text-xs text-gray-400">CPF: ${p.cpf} | Tel: ${p.telefone} | Produto: ${p.produto}</p>
                            <p class="text-xs text-amber-300 font-semibold">Valor Solicitado: R$ ${p.valorSolicitado}</p>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="text-center py-20 text-gray-500 text-xs">Nenhuma proposta cadastrada.</div>';
                }
            } catch (err) {
                loading.innerText = 'Erro ao carregar propostas autorizadas.';
            }
        }
    </script>
</body>
</html>
