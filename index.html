<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento da Entrada Pix</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .protocolo-box { background: #eef2f7; padding: 10px; border-radius: 6px; font-weight: bold; margin-bottom: 20px; color: #333; }
        .qr-box img { max-width: 200px; height: auto; margin: 15px 0; }
        .copia-cola-container { display: flex; gap: 10px; margin-top: 15px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #f9f9f9; }
        button { background: #00baf2; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0099cc; }
        .status { margin-top: 15px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pagamento da Entrada Pix</h2>
        
        <!-- Exibição do Código Único / Protocolo -->
        <div class="protocolo-box">
            Protocolo: <span id="spanProtocolo">Gerando...</span>
        </div>

        <p>Escaneie o QR Code abaixo com o aplicativo do seu banco:</p>

        <!-- QR Code -->
        <div class="qr-box">
            <!-- Se estiver gerando a imagem do QR Code via link do Mercado Pago ou API externa -->
            <img id="imgQrCode" src="" alt="QR Code Pix">
        </div>

        <!-- Pix Copia e Cola -->
        <label for="inputCopiaECola" style="font-size: 12px; color: #555; display: block; text-align: left; margin-bottom: 5px;">PIX COPIA E COLA</label>
        <div class="copia-cola-container">
            <input type="text" id="inputCopiaECola" readonly>
            <button onclick="copiarPix()">Copiar</button>
        </div>

        <div class="status" id="divStatus">Aguardando pagamento do Pix de entrada...</div>
    </div>

    <script>
        // Função para copiar o código Pix Copia e Cola ao clicar no botão
        function copiarPix() {
            const input = document.getElementById('inputCopiaECola');
            input.select();
            input.setSelectionRange(0, 99999; // Para dispositivos móveis
            navigator.clipboard.writeText(input.value);
            alert('Código Pix Copia e Cola copiado com sucesso!');
        }

        // Exemplo de como preencher os dados na tela assim que o seu script gerar a proposta:
        function atualizarTelaPagamento(protocolo, codigoCopiaECola, urlQrCode) {
            document.getElementById('spanProtocolo').innerText = protocolo;
            document.getElementById('inputCopiaECola').value = codigoCopiaECola;
            
            // Se o Mercado Pago retornar o link da imagem do QR Code, atribua aqui:
            // Caso queira gerar o QR Code visualmente direto pelo texto copia e cola, você pode usar uma API pública de QR Code no src da imagem:
            document.getElementById('imgQrCode').src = urlQrCode || `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(codigoCopiaECola)}`;
        }
    </script>
</body>
</html>
