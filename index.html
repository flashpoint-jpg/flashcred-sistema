<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred - Solicitação e Consulta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #ffa500; margin-bottom: 5px; }
        p.sub { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        
        /* Abas de navegação */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #ffa500;
            color: #000;
        }
        .secao { display: none; }
        .secao.ativa { display: block; }

        input, button, select {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            box-sizing: border-box;
            font-size: 14px;
        }
        input, select { background: #0f172a; color: #fff; }
        .btn-acao { background: #ffa500; color: #000; font-weight: bold; cursor: pointer; border: none; }
        .btn-acao:hover { background: #e69500; }
        
        .resultado-box {
            margin-top: 15px;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        table { width: 100%; font-size: 12px; text-align: left; color: #fff; border-collapse: collapse; margin-top: 8px; }
        th, td { padding: 6px; border-bottom: 1px solid #334155; }
        th { color: #ffa500; }
    </style>
</head>
<body>

<div class="container">
    <h2>FlashCred</h2>
    <p class="sub">Solicite seu crédito ou acompanhe sua proposta</p>

    <!-- Abas de Navegação (Para não sumir nada) -->
    <div class="tabs">
        <button class="tab-btn active" onclick="mudarAba('consulta', this)">Consultar Status</button>
        <button class="tab-btn" onclick="mudarAba('cadastro', this)">Pedir Empréstimo</button>
    </div>

    <!-- SEÇÃO 1: CONSULTAR STATUS -->
    <div id="secao-consulta" class="secao ativa">
        <label style="font-size: 13px; color: #cbd5e1;">Digite seu CPF:</label>
        <input type="text" id="cpfConsulta" placeholder="000.000.000-00">
        <button class="btn-acao" onclick="consultarProposta()">CONSULTAR</button>
        
        <div id="resultadoConsulta" class="resultado-box" style="display: none;"></div>
    </div>

    <!-- SEÇÃO 2: PEDIR EMPRÉSTIMO (CADASTRO) -->
    <div id="secao-cadastro" class="secao">
        <form id="formProposta">
            <input type="text" id="nome" placeholder="Nome Completo" required>
            <input type="text" id="cpf" placeholder="CPF" required>
            <input type="text" id="whatsapp" placeholder="WhatsApp / Telefone" required>
            <input type="date" id="nascimento" required>
            <input type="text" id="endereco" placeholder="Endereço" required>
            <input type="text" id="numero" placeholder="Número" required>
            <input type="text" id="cep" placeholder="CEP" required>
            <input type="number" id="valorSolicitado" placeholder="Valor Desejado (R$)" required>
            
            <label style="font-size: 12px; color: #94a3b8; display: block; margin-top: 10px;">Comprovante de Renda:</label>
            <input type="file" id="comprovante">
            
            <button type="submit" class="btn-acao" style="margin-top: 15px;">Enviar Proposta</button>
        </form>
    </div>
</div>

<script>
    // Função para alternar entre as abas sem perder nada
    function mudarAba(nomeSecao, elemento) {
        document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById('secao-' + nomeSecao).classList.add('ativa');
        elemento.classList.add('active');
    }

    // Consulta de Proposta com Pix e Parcelas Completas
    async function consultarProposta() {
        const cpfInput = document.getElementById('cpfConsulta').value;
        const cpfLimpo = cpfInput.replace(/\D/g, '');
        const container = document.getElementById('resultadoConsulta');

        if (!cpfLimpo) {
            alert('Digite um CPF válido.');
            return;
        }

        try {
            const response = await fetch(`/api/proposta/consultar?cpf=${cpfLimpo}`);
            const resultado = await response.json();

            if (resultado.sucesso) {
                const proposta = resultado.proposta;
                container.style.display = 'block';
                
                let htmlPix = '';
                if (proposta.cobrancaPix && proposta.cobrancaPix.copiaECola) {
                    htmlPix = `
                        <div style="margin-top: 15px; text-align: center;">
                            <p style="font-size: 12px; color: #ffa500; margin-bottom: 5px; font-weight: bold;">Pix Copia e Cola da Entrada:</p>
                            <input type="text" id="inputCopiaCola" value="${proposta.cobrancaPix.copiaECola}" readonly style="font-size: 11px; text-align: center;" />
                            <button onclick="copiarPix()" class="btn-acao" style="margin-top: 5px; padding: 8px; font-size: 12px;">Copiar Código Pix</button>
                        </div>
                    `;
                }

                let htmlParcelas = '';
                if (proposta.parcelas && proposta.parcelas.length > 0) {
                    htmlParcelas = `
                        <div style="margin-top: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px;">
                            <h4 style="color: #ffa500; margin: 0 0 8px 0; font-size: 14px;">Detalhes do Parcelamento</h4>
                            <p style="margin: 4px 0; font-size: 13px;"><strong>Qtd. Parcelas:</strong> ${proposta.qtdParcelas || 6}x</p>
                            <p style="margin: 4px 0; font-size: 13px;"><strong>Taxa de Juros:</strong> ${proposta.juros || 2.5}% ao mês</p>
                            <div style="max-height: 160px; overflow-y: auto; margin-top: 8px;">
                                <table>
                                    <tr>
                                        <th>Nº</th>
                                        <th>Vencimento</th>
                                        <th>Valor</th>
                                        <th>Status</th>
                                        <th>Ação</th>
                                    </tr>
                                    ${proposta.parcelas.map(p => `
                                        <tr>
                                            <td>${p.numero}º</td>
                                            <td>${p.vencimento}</td>
                                            <td>R$ ${p.valor.toFixed(2)}</td>
                                            <td style="color: ${p.status === 'PAGO' ? '#4CAF50' : '#FFC107'}">${p.status}</td>
                                            <td>
                                                ${p.status !== 'PAGO' ? `<button onclick="pagarParcela('${proposta.cpf}', ${p.numero})" style="padding: 4px 6px; font-size: 11px; margin: 0; background: #ffa500; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Pagar</button>` : 'Pago'}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </table>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <p style="margin: 6px 0;"><strong>Nome:</strong> ${proposta.nome}</p>
                    <p style="margin: 6px 0;"><strong>Status:</strong> <span style="color: #4CAF50; font-weight: bold;">${proposta.status}</span></p>
                    <p style="margin: 6px 0;"><strong>Valor Solicitado:</strong> R$ ${proposta.valorSolicitado}</p>
                    
                    ${proposta.cobrancaPix?.qrcode ? `
                        <div style="text-align: center; margin-top: 15px;">
                            <p style="font-size: 13px; color: #ffa500; margin-bottom: 5px;">QR Code da Entrada</p>
                            <img src="${proposta.cobrancaPix.qrcode}" style="width: 140px; height: 140px; background: #fff; padding: 5px; border-radius: 4px;"/>
                        </div>
                    ` : ''}
                    
                    ${htmlPix}
                    ${htmlParcelas}
                `;
            } else {
                container.style.display = 'block';
                container.innerHTML = `<p style="color: #f87171; text-align: center;">${resultado.mensagem}</p>`;
            }
        } catch (err) {
            alert('Erro de conexão ao consultar proposta.');
        }
    }

    function copiarPix() {
        const input = document.getElementById('inputCopiaCola');
        input.select();
        input.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(input.value);
        alert('Código Pix copiado com sucesso!');
    }

    async function pagarParcela(cpf, numeroParcela) {
        try {
            const response = await fetch('/api/parcelas/pagar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cpf, numeroParcela })
            });
            const resultado = await response.json();
            
            if (resultado.sucesso) {
                alert(`Pix gerado para a parcela ${numeroParcela}!\n\nCopia e Cola:\n` + resultado.parcela.cobrancaPix.copiaECola);
            } else {
                alert('Erro ao gerar pagamento da parcela: ' + resultado.mensagem);
            }
        } catch (err) {
            alert('Erro de conexão ao tentar pagar a parcela.');
        }
    }

    // Envio do Formulário de Cadastro (Pedir Empréstimo)
    document.getElementById('formProposta').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData();
        formData.append('nome', document.getElementById('nome').value);
        formData.append('cpf', document.getElementById('cpf').value);
        formData.append('telefone', document.getElementById('whatsapp').value); // Corrigido para salvar no painel
        formData.append('nascimento', document.getElementById('nascimento').value);
        formData.append('endereco', document.getElementById('endereco').value);
        formData.append('numero', document.getElementById('numero').value);
        formData.append('cep', document.getElementById('cep').value);
        formData.append('valorSolicitado', document.getElementById('valorSolicitado').value);
        
        const fileInput = document.getElementById('comprovante');
        if (fileInput.files[0]) {
            formData.append('comprovante', fileInput.files[0]);
        }

        try {
            const response = await fetch('/api/proposta/criar', {
                method: 'POST',
                body: formData
            });
            const resultado = await response.json();
            if (resultado.sucesso) {
                alert('Proposta enviada com sucesso!');
                document.getElementById('formProposta').reset();
                mudarAba('consulta', document.querySelector('.tab-btn'));
            } else {
                alert('Erro: ' + resultado.mensagem);
            }
        } catch (err) {
            alert('Erro ao enviar proposta.');
        }
    });
</script>

</body>
</html>
