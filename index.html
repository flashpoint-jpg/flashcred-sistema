<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlashCred - Crédito Facilitado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        :root {
            --primaria: #F5A623; --primaria-escura: #E69500; --secundaria: #1A1A1A;
            --fundo: #F8F9FA; --branco: #FFFFFF; --texto: #333333; --texto-claro: #666666;
            --erro: #E53935; --sucesso: #43A047; --borda: #E0E0E0;
            --sombra: 0 2px 8px rgba(0,0,0,0.08); --sombra-forte: 0 4px 16px rgba(0,0,0,0.12);
        }
        html, body { width: 100%; min-height: 100vh; background: linear-gradient(135deg, #F8F9FA 0%, #E9ECEF 100%); padding: 12px 6px; overflow-x: hidden; }
        .container { width: 100%; max-width: 480px; margin: 0 auto; background: var(--branco); padding: 20px 16px; border-radius: 16px; box-shadow: var(--sombra-forte); }
        .cabecalho { text-align: center; margin-bottom: 24px; }
        .logo-icone { width: 56px; height: 56px; background: var(--primaria); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 24px; font-weight: bold; color: var(--branco); }
        h1 { color: var(--secundaria); font-size: clamp(20px, 5vw, 26px); font-weight: 700; margin-bottom: 4px; }
        .slogan { color: var(--texto-claro); font-size: clamp(13px, 3.5vw, 15px); }
        .abas { display: flex; margin-bottom: 20px; background: var(--fundo); border-radius: 12px; padding: 4px; gap: 4px; width: 100%; }
        .aba { flex: 1; padding: 10px 6px; text-align: center; color: var(--texto-claro); font-weight: 600; cursor: pointer; border-radius: 8px; font-size: clamp(12px, 3vw, 14px); transition: all 0.2s ease; }
        .aba.ativa { background: var(--branco); color: var(--primaria); box-shadow: var(--sombra); }
        .conteudo-aba { display: none; width: 100%; }
        .conteudo-aba.ativo { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .campo { margin-bottom: 16px; width: 100%; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: clamp(13px, 3.5vw, 14px); color: var(--texto); }
        input, select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--borda); border-radius: 12px; font-size: clamp(14px, 3.8vw, 15px); background: var(--branco); color: var(--texto); }
        input:focus, select:focus { outline: none; border-color: var(--primaria); box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15); }
        .erro { color: var(--erro); font-size: clamp(12px, 3vw, 13px); margin-top: 4px; display: none; font-weight: 500; }
        .resultado { margin-top: 18px; padding: 16px; border-radius: 12px; display: none; border: 1px solid transparent; width: 100%; }
        .resultado.analise { background: #FFF8E1; border-color: var(--primaria); color: #F57C00; }
        .resultado.reprovado { background: #FFEBEE; border-color: var(--erro); color: var(--erro); }
        .resultado.aprovado { background: #E8F5E9; border-color: var(--sucesso); color: #2E7D32; }
        .resultado h3 { text-align: center; margin-bottom: 14px; font-size: clamp(16px, 4.2vw, 18px); font-weight: 700; }
        .detalhes { background: rgba(255,255,255,0.7); padding: 14px; border-radius: 10px; margin: 10px 0; font-size: clamp(13px, 3.5vw, 14px); line-height: 1.7; }
        .detalhes p { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        button { width: 100%; padding: 13px; background: var(--primaria); color: var(--branco); border: none; border-radius: 12px; font-size: clamp(15px, 4vw, 16px); font-weight: 700; cursor: pointer; margin-top: 6px; box-shadow: 0 2px 6px rgba(245, 166, 35, 0.3); }
        button:hover { background: var(--primaria-escura); }
    </style>
</head>
<body>

<div class="container">
    <div class="cabecalho">
        <div class="logo-icone">FC</div>
        <h1>FlashCred</h1>
        <p class="slogan">Crédito simples, rápido e seguro</p>
    </div>

    <div class="abas">
        <div class="aba ativa" onclick="mudarAba('solicitar', event)">Solicitar</div>
        <div class="aba" onclick="mudarAba('consultar', event)">Consultar</div>
    </div>

    <div id="aba-solicitar" class="conteudo-aba ativo">
        <form id="formCliente">
            <div class="campo"><label>Nome Completo</label><input type="text" id="nome" required placeholder="Digite seu nome completo"></div>
            <div class="campo"><label>CPF</label><input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14"><div id="erroCpf" class="erro">⚠️ CPF inválido</div></div>
            <div class="campo"><label>Data de Nascimento</label><input type="date" id="nascimento" required></div>
            <div class="campo"><label>CEP</label><input type="text" id="cep" required placeholder="00000-000" maxlength="9"></div>
            <div class="campo"><label>Valor Desejado (R$)</label><input type="number" id="valorCredito" step="0.01" required placeholder="Ex: 1500.00"></div>
            <div class="campo"><label>Renda Mensal (R$)</label><input type="number" id="renda" step="0.01" required placeholder="Ex: 1200.00"></div>
            <div class="campo"><label>WhatsApp</label><input type="text" id="whatsapp" required placeholder="(00) 00000-0000"></div>
            <button type="submit">Enviar Solicitação</button>
        </form>
    </div>

    <div id="aba-consultar" class="conteudo-aba">
        <form id="formConsulta">
            <div class="campo"><label>Consultar pelo CPF</label><input type="text" id="cpfConsulta" required placeholder="Digite seu CPF" maxlength="14"></div>
            <button type="submit">Verificar Status</button>
        </form>
        <div id="resultadoConsulta" class="resultado"></div>
    </div>
</div>

<script>
    // URL da API conectada diretamente ao seu Render
    const API_URL = 'https://flashcred-sistema.onrender.com/api';

    function mudarAba(aba, e) {
        document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
        document.querySelectorAll('.conteudo-aba').forEach(c => c.classList.remove('ativo'));
        e.target.classList.add('ativa');
        document.getElementById(`aba-${aba}`).classList.add('ativo');
        document.getElementById('resultadoConsulta').style.display = 'none';
    }

    function validarCPF(cpf) {
        cpf = cpf.replace(/\D/g, '');
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
        let soma = 0;
        for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
        let dig1 = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        soma = 0;
        for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
        let dig2 = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        return dig1 === parseInt(cpf.charAt(9)) && dig2 === parseInt(cpf.charAt(10));
    }

    document.getElementById('formCliente').addEventListener('submit', async e => {
        e.preventDefault();
        const cpfVal = document.getElementById('cpf').value;
        if (!validarCPF(cpfVal)) return alert('Informe um CPF válido!');

        const dados = {
            nome: document.getElementById('nome').value,
            cpf: cpfVal,
            nascimento: document.getElementById('nascimento').value,
            cep: document.getElementById('cep').value,
            valorCredito: parseFloat(document.getElementById('valorCredito').value),
            renda: parseFloat(document.getElementById('renda').value),
            whatsapp: document.getElementById('whatsapp').value
        };

        try {
            const resposta = await fetch(`${API_URL}/solicitacoes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const resultado = await resposta.json();
            if (resposta.ok) {
                alert('✅ Solicitação enviada com sucesso!');
                e.target.reset();
            } else {
                alert('Erro: ' + resultado.erro);
            }
        } catch (err) {
            alert('Erro de conexão com o servidor.');
        }
    });

    document.getElementById('formConsulta').addEventListener('submit', async e => {
        e.preventDefault();
        const cpf = document.getElementById('cpfConsulta').value;
        const resDiv = document.getElementById('resultadoConsulta');
        resDiv.style.display = 'none';

        try {
            const resposta = await fetch(`${API_URL}/solicitacoes/${cpf}`);
            const resultado = await resposta.json();

            if (!resultado.encontrado) {
                resDiv.className = 'resultado analise';
                resDiv.innerHTML = `<h3>Não encontrado</h3><p style="text-align:center;">Nenhuma solicitação para este CPF.</p>`;
            } else {
                const dados = resultado.dados;
                if (dados.status === 'em_analise') {
                    resDiv.className = 'resultado analise';
                    resDiv.innerHTML = `<h3>⏳ Em Análise</h3><p style="text-align:center;">Sua solicitação feita em ${dados.data} está sendo analisada.</p>`;
                } else if (dados.status === 'aprovado') {
                    resDiv.className = 'resultado aprovado';
                    resDiv.innerHTML = `<h3>✅ Crédito Aprovado!</h3><p style="text-align:center;">Seu crédito foi liberado com sucesso.</p>`;
                } else {
                    resDiv.className = 'resultado reprovado';
                    resDiv.innerHTML = `<h3>❌ Reprovado</h3><p style="text-align:center;">Infelizmente não aprovado no momento.</p>`;
                }
            }
            resDiv.style.display = 'block';
        } catch (err) {
            alert('Erro ao consultar o servidor.');
        }
    });
</script>
</body>
</html>
