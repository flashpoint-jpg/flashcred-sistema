<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Pix - FlashCred</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #003366; margin-bottom: 5px; }
        p { color: #555; font-size: 14px; margin-bottom: 20px; }
        .valor { font-size: 24px; font-weight: bold; color: #28a745; margin-bottom: 20px; }
        #qrcode-container { margin: 20px 0; }
        #qrcode-container img { max-width: 200px; height: auto; }
        textarea { width: 100%; height: 80px; resize: none; font-size: 12px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; background: #f9f9f9; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #004085; }
        .btn-copiar { background-color: #28a745; margin-top: 5px; }
        .btn-copiar:hover { background-color: #218838; }
        .loading { color: #0056b3; font-weight: bold; margin: 30px 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="card">
        <h2>Pagamento de Entrada Pix</h2>
        <p>Escaneie o QR Code abaixo com o aplicativo do seu banco ou utilize o Pix Copia e Cola:</p>
        
        <div class="valor" id="txtValor">R$ 150,00</div>

        <div id="loadingDiv" class="loading">Gerando Pix seguro de produção, aguarde...</div>
        
        <div id="qrcode-container" style="display: none;">
            <div id="qrcode"></div>
        </div>

        <div id="dadosPix" style="display: none;">
            <textarea id="pixCopiaECola" readonly></textarea>
            <button class="btn-copiar" onclick="copiarPix()">Copiar Código Pix</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            MERCADO_PAGO_TOKEN: "APP_USR-8158139097874832-072720-d200da044f05a1dd8eb75f90e0551431-18499471" 
        };

        async function gerarPixAutomatico() {
            const valorEntrada = 150.00;
            const protocolo = "PROT-" + Math.floor(Math.random() * 100000);

            try {
                const response = await fetch('https://api.mercadopago.com/v1/payments', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.MERCADO_PAGO_TOKEN}`,
                        'Content-Type': 'application/json',
                        'X-Idempotency-Key': protocolo + '-' + Date.now()
                    },
                    body: JSON.stringify({
                        transaction_amount: Number(valorEntrada),
                        description: `Entrada FlashCred - Protocolo ${protocolo}`,
                        payment_method_id: 'pix',
                        payer: {
                            email: 'cliente@flashcred.com',
                            first_name: 'Cliente',
                            last_name: 'FlashCred',
                            identification: {
                                type: "CPF",
                                number: "19119119119"
                            }
                        }
                    })
                });

                const data = await response.json();
                
                if (response.ok && data && data.point_of_interaction) {
                    const copiaECola = data.point_of_interaction.transaction_data.qr_code;
                    const base64QrCode = data.point_of_interaction.transaction_data.qr_code_base64;

                    document.getElementById('loadingDiv').style.display = 'none';
                    document.getElementById('qrcode-container').style.display = 'block';
                    document.getElementById('dadosPix').style.display = 'block';

                    document.getElementById('pixCopiaECola').value = copiaECola;
                    document.getElementById('qrcode').innerHTML = `<img src="data:image/jpeg;base64,${base64QrCode}" alt="QR Code Pix">`;
                } else {
                    document.getElementById('loadingDiv').innerHTML = "Erro ao gerar Pix. Verifique os dados.";
                    console.error('Erro Mercado Pago:', data);
                }
            } catch (e) {
                document.getElementById('loadingDiv').innerHTML = "Erro de conexão com a API.";
                console.error('Erro de rede:', e);
            }
        }

        function copiarPix() {
            const campoCopia = document.getElementById('pixCopiaECola');
            campoCopia.select();
            campoCopia.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(campoCopia.value);
            alert('Código Pix Copia e Cola copiado com sucesso!');
        }

        window.onload = function() {
            gerarPixAutomatico();
        };
    </script>
</body>
</html>
