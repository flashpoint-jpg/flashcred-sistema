<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Flash Point - Sistema FlashCred Produção</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        const CONFIG = {
            SUPABASE_URL: 'https://rgcclordmqjmwuzrrfbd.supabase.co',
            SUPABASE_ANON_KEY: 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi',
            MERCADO_PAGO_TOKEN: 'APP_USR-8158139097874832-072720-d200da044f05a1dd8eb75f90e0551431-18499471',
            WHATSAPP_CONTATO: '5511973294235'
        };

        let supabaseClient = null;
        try {
            if (CONFIG.SUPABASE_URL) {
                supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn('Supabase local/offline fallback ativado.');
        }

        let listaClientes = [];
        let adminLogado = localStorage.getItem('flash_admin_logado') === 'true';

        async function carregarDadosDoBanco() {
            let dadosRemotos = [];
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('clientes').select('*').order('id', { ascending: false });
                    if (!error && data) {
                        dadosRemotos = data;
                    }
                } catch (e) {
                    console.warn('Erro ao buscar dados remotos.');
                }
            }

            const locais = JSON.parse(localStorage.getItem('flash_clientes_locais') || '[]');
            const mapa = new Map();
            
            [...dadosRemotos, ...locais].forEach(item => {
                const chave = item.protocolo || item.id;
                if (chave && !mapa.has(chave)) {
                    mapa.set(chave, item);
                }
            });

            listaClientes = Array.from(mapa.values());
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosDoBanco();
            
            if (supabaseClient) {
                supabaseClient
                    .channel('public:clientes_realtime')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'clientes' }, async () => {
                        await carregarDadosDoBanco();
                        const inputBusca = document.getElementById('busca-cpf');
                        if (inputBusca && inputBusca.value.trim() !== '') {
                            consultarProposta(true);
                        }
                        if (adminLogado) {
                            renderizarPainelAdmin();
                        }
                    })
                    .subscribe();
            }

            const hashAtual = window.location.hash.replace('#', '');
            const abaSalva = hashAtual || localStorage.getItem('flash_aba_ativa') || 'solicitar';
            
            if (abaSalva === 'painel' && !adminLogado) {
                switchTab('solicitar', false);
            } else {
                switchTab(abaSalva, false);
            }

            if (adminLogado && abaSalva === 'painel') {
                renderizarPainelAdmin();
            }
        });

        function switchTab(tabId, atualizarUrl = true) {
            localStorage.setItem('flash_aba_ativa', tabId);
            if (atualizarUrl) {
                window.location.hash = tabId;
            }

            if (tabId === 'painel' && !adminLogado) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
                const elLogin = document.getElementById('tab-login-admin');
                if (elLogin) elLogin.classList.remove('hidden');
                atualizarBotoesNav('painel');
                return;
            }

            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const abaAlvo = document.getElementById('tab-' + tabId);
            if (abaAlvo) abaAlvo.classList.remove('hidden');
            atualizarBotoesNav(tabId);

            if (tabId === 'painel' && adminLogado) {
                renderizarPainelAdmin();
            }
        }

        function atualizarBotoesNav(tabId) {
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-blue-950', 'text-white', 'shadow-lg', 'border-blue-800');
                el.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            const btn = document.getElementById('btn-' + tabId);
            if (btn) {
                btn.classList.remove('text-slate-600', 'hover:bg-slate-100');
                btn.classList.add('bg-blue-950', 'text-white', 'shadow-lg', 'border-blue-800');
            }
        }

        function verificarSenhaAdmin(event) {
            event.preventDefault();
            const senha = document.getElementById('senha-admin').value;
            if (senha === 'flash@2026') {
                adminLogado = true;
                localStorage.setItem('flash_admin_logado', 'true');
                document.getElementById('senha-admin').value = '';
                document.getElementById('erro-senha').classList.add('hidden');
                switchTab('painel');
            } else {
                document.getElementById('erro-senha').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            adminLogado = false;
            localStorage.removeItem('flash_admin_logado');
            switchTab('solicitar');
        }

        async function consultarCEP(cep) {
            const cepLimpo = cep.replace(/\D/g, '');
            if (cepLimpo.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                    const data = await response.json();
                    if (!data.erro) {
                        const logradouro = data.logradouro ? data.logradouro + ', ' : '';
                        const elEnd = document.getElementById('endereco');
                        if (elEnd) elEnd.value = `${logradouro}Bairro: ${data.bairro || ''} - ${data.localidade}/${data.uf}`;
                    }
                } catch (e) {
                    console.error('Erro ao buscar CEP');
                }
            }
        }

        async function criarPagamentoPixMercadoPago(valorEntrada, protocolo, nome, cpf) {
            try {
                const response = await fetch('https://api.mercadopago.com/v1/payments', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.MERCADO_PAGO_TOKEN}`,
                        'Content-Type': 'application/json',
                        'X-Idempotency-Key': protocolo + '-' + Date.now()
                    },
                    body: JSON.stringify({
                        transaction_amount: Number(valorEntrada),
                        description: `Entrada FlashCred - Protocolo ${protocolo}`,
                        payment_method_id: 'pix',
                        payer: {
                            email: cpf.replace(/\D/g, '') + '@flashcred.com',
                            first_name: nome.split(' ')[0],
                            last_name: nome.split(' ').slice(1).join(' ') || 'Cliente'
                        }
                    })
                });

                const data = await response.json();
                if (data && data.point_of_interaction) {
                    return {
                        copiaECola: data.point_of_interaction.transaction_data.qr_code,
                        idTransacao: data.id
                    };
                }
            } catch (e) {
                console.error('Erro ao gerar Pix real:', e);
            }
            return null;
        }

        async function enviarProposta(event) {
            event.preventDefault();
            const valor = parseFloat(document.getElementById('valor').value) || 1500;
            const protocolo = 'FP-' + Math.floor(100000 + Math.random() * 900000);
            const valorEntradaCalc = valor * 0.10;
            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;

            // Gera o Pix Real via Mercado Pago
            const dadosPix = await criarPagamentoPixMercadoPago(valorEntradaCalc, protocolo, nome, cpf);

            const novaProposta = {
                protocolo: protocolo,
                nome: nome,
                cpf: cpf,
                whatsapp: document.getElementById('whatsapp').value,
                cep: document.getElementById('cep').value,
                endereco: document.getElementById('endereco').value,
                limite: valor,
                valorEntrada: valorEntradaCalc,
                porcentagemEntrada: 10,
                parcelas: 48,
                periodicidade: '30',
                jurosParcelamento: 2.5,
                descontoAntecipado: 10,
                status: 'analise',
                entradaPaga: false,
                pixCopiaECola: dadosPix ? dadosPix.copiaECola : 'Erro ao gerar Pix real',
                id_transacao_pix: dadosPix ? String(dadosPix.idTransacao) : ''
            };

            const locais = JSON.parse(localStorage.getItem('flash_clientes_locais') || '[]');
            locais.unshift(novaProposta);
            localStorage.setItem('flash_clientes_locais', JSON.stringify(locais));

            if (supabaseClient) {
                try {
                    await supabaseClient.from('clientes').insert([novaProposta]);
                } catch (err) {
                    console.error('Erro Supabase:', err);
                }
            }

            await carregarDadosDoBanco();
            if (adminLogado) renderizarPainelAdmin();

            alert('Solicitação enviada com sucesso! Seu protocolo é: ' + protocolo);
            document.getElementById('form-proposta').reset();

            switchTab('acompanhar');
            const elBusca = document.getElementById('busca-cpf');
            if (elBusca) elBusca.value = protocolo;
            consultarProposta();
        }

        async function consultarProposta(silencioso = false) {
            const termo = document.getElementById('busca-cpf').value.trim();
            const containerRes = document.getElementById('resultado-consulta');
            if (!termo) {
                if (!silencioso) alert('Digite o CPF ou Protocolo.');
                return;
            }

            await carregarDadosDoBanco();
            const cliente = listaClientes.find(c => 
                (c.cpf && c.cpf.replace(/\D/g, '') === termo.replace(/\D/g, '')) || 
                (c.protocolo && c.protocolo.toLowerCase() === termo.toLowerCase())
            );

            if (!cliente) {
                if (!silencioso) {
                    containerRes.innerHTML = `<div class="p-6 bg-red-50 text-red-600 rounded-2xl text-center text-sm font-semibold">Nenhuma proposta encontrada para este CPF ou Protocolo.</div>`;
                    containerRes.classList.remove('hidden');
                }
                return;
            }

            const statusMap = {
                'analise': { label: 'Em Análise Cadastral', color: 'bg-amber-100 text-amber-800 border-amber-300' },
                'aprovado': { label: 'Aprovado / Aguardando Entrada', color: 'bg-blue-100 text-blue-800 border-blue-300' },
                'liberado': { label: 'Crédito Liberado com Sucesso', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
                'reprovado': { label: 'Reprovado', color: 'bg-red-100 text-red-800 border-red-300' }
            };
            const stInfo = statusMap[cliente.status] || { label: cliente.status, color: 'bg-slate-100 text-slate-800' };

            const limite = cliente.limite || 1500;
            const valorEntrada = cliente.valorEntrada || (limite * 0.1);
            const parcelas = cliente.parcelas || 48;
            const juros = cliente.jurosParcelamento || 2.5;
            
            const saldoDevedor = limite - valorEntrada;
            const totalComJuros = saldoDevedor * (1 + (juros / 100));
            const valorParcela = parcelas > 0 ? (totalComJuros / parcelas) : 0;

            let htmlQrCode = '';
            if (cliente.status === 'aprovado' || cliente.status === 'liberado') {
                htmlQrCode = `
                    <div class="mt-6 p-6 bg-blue-50 rounded-2xl border border-blue-200 text-center space-y-4">
                        <h4 class="font-bold text-blue-950 text-base"><i class="fa-solid fa-qrcode mr-2"></i> Pagamento da Entrada Pix</h4>
                        <p class="text-xs text-slate-600">Escaneie o QR Code abaixo com o aplicativo do seu banco para pagar a entrada de <strong>R$ ${valorEntrada.toFixed(2)}</strong>:</p>
                        <div class="flex justify-center">
                            <div id="qrcode-container-${cliente.protocolo}" class="bg-white p-3 rounded-xl shadow-md border border-blue-100 inline-block"></div>
                        </div>
                        <div class="space-y-1">
                            <span class="text-[11px] font-bold text-slate-500 uppercase">Pix Copia e Cola</span>
                            <div class="flex gap-2">
                                <input type="text" readonly value="${cliente.pixCopiaECola || ''}" id="input-copia-cola-${cliente.protocolo}" class="w-full text-xs p-2 bg-white border border-slate-300 rounded-lg select-all">
                                <button onclick="navigator.clipboard.writeText(document.getElementById('input-copia-cola-${cliente.protocolo}').value); alert('Chave Pix copiada com sucesso!');" class="px-4 py-2 bg-blue-900 text-white rounded-lg text-xs font-bold hover:bg-blue-800 shrink-0">Copiar</button>
                            </div>
                        </div>
                        ${cliente.entradaPaga ? '<div class="p-3 bg-emerald-100 text-emerald-800 rounded-xl text-xs font-bold"><i class="fa-solid fa-check-circle mr-1"></i> Entrada Confirmada Automaticamente!</div>' : '<div class="p-3 bg-amber-100 text-amber-800 rounded-xl text-xs font-bold">Aguardando pagamento do Pix de entrada.</div>'}
                    </div>
                `;
            }

            containerRes.innerHTML = `
                <div class="p-6 sm:p-8 bg-white rounded-2xl border border-slate-200 shadow-xl space-y-6">
                    <div class="flex flex-wrap justify-between items-center gap-4 border-b pb-4">
                        <div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Protocolo</span>
                            <div class="text-lg font-black text-blue-950">${cliente.protocolo}</div>
                        </div>
                        <span class="px-4 py-1.5 rounded-full text-xs font-extrabold border ${stInfo.color}">${stInfo.label}</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                        <div class="p-4 bg-slate-50 rounded-xl border"><span class="text-slate-400 block font-bold">Nome</span><strong class="text-slate-800 text-sm">${cliente.nome}</strong></div>
                        <div class="p-4 bg-slate-50 rounded-xl border"><span class="text-slate-400 block font-bold">CPF</span><strong class="text-slate-800 text-sm">${cliente.cpf}</strong></div>
                        <div class="p-4 bg-slate-50 rounded-xl border"><span class="text-slate-400 block font-bold">Crédito Aprovado / Solicitado</span><strong class="text-emerald-700 text-sm font-black">R$ ${limite.toFixed(2)}</strong></div>
                        <div class="p-4 bg-slate-50 rounded-xl border"><span class="text-slate-400 block font-bold">Valor da Entrada (10%)</span><strong class="text-blue-900 text-sm font-black">R$ ${valorEntrada.toFixed(2)}</strong></div>
                    </div>

                    <div class="p-5 bg-slate-900 text-white rounded-2xl space-y-3">
                        <h5 class="text-xs font-bold uppercase tracking-wider text-blue-400"><i class="fa-solid fa-calculator mr-1"></i> Simulação das Parcelas</h5>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                            <div><span class="opacity-70 block">Quantidade</span><strong>${parcelas}x</strong></div>
                            <div><span class="opacity-70 block">Valor da Parcela</span><strong class="text-emerald-400 font-bold">R$ ${valorParcela.toFixed(2)} / mês</strong></div>
                            <div><span class="opacity-70 block">Taxa de Juros</span><strong>${juros}% a.m.</strong></div>
                        </div>
                    </div>

                    ${htmlQrCode}
                </div>
            `;
            containerRes.classList.remove('hidden');

            if ((cliente.status === 'aprovado' || cliente.status === 'liberado') && cliente.pixCopiaECola) {
                const elQrDiv = document.getElementById(`qrcode-container-${cliente.protocolo}`);
                if (elQrDiv) {
                    elQrDiv.innerHTML = "";
                    new QRCode(elQrDiv, {
                        text: cliente.pixCopiaECola,
                        width: 180,
                        height: 180,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                }
            }
        }

        async function alterarStatusAdmin(protocolo, novoStatus) {
            const locais = JSON.parse(localStorage.getItem('flash_clientes_locais') || '[]');
            const idx = locais.findIndex(c => c.protocolo === protocolo);
            if (idx !== -1) {
                locais[idx].status = novoStatus;
                if (novoStatus === 'reprovado') locais[idx].entradaPaga = false;
                localStorage.setItem('flash_clientes_locais', JSON.stringify(locais));
            }

            if (supabaseClient) {
                try {
                    const updatePayload = { status: novoStatus };
                    if (novoStatus === 'reprovado') updatePayload.entradaPaga = false;
                    await supabaseClient.from('clientes').update(updatePayload).eq('protocolo', protocolo);
                } catch (e) {
                    console.warn('Erro Supabase status.');
                }
            }

            await carregarDadosDoBanco();
            renderizarPainelAdmin();
            alert('Status alterado com sucesso!');
        }

        async function excluirPropostaAdmin(protocolo) {
            if (!confirm(`Tem certeza que deseja excluir permanentemente a proposta ${protocolo}?`)) return;

            const locais = JSON.parse(localStorage.getItem('flash_clientes_locais') || '[]');
            const filtrados = locais.filter(c => c.protocolo !== protocolo);
            localStorage.setItem('flash_clientes_locais', JSON.stringify(filtrados));

            if (supabaseClient) {
                try {
                    await supabaseClient.from('clientes').delete().eq('protocolo', protocolo);
                } catch (e) {
                    console.warn('Erro ao excluir no Supabase');
                }
            }

            await carregarDadosDoBanco();
            renderizarPainelAdmin();
        }

        function renderizarPainelAdmin() {
