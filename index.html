<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred - Sistema</title>
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; background: #fff; margin: 0 auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0066cc; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #0066cc; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #004999; }
        .result-box { margin-top: 20px; padding: 15px; background: #eef2f7; border-radius: 4px; text-align: center; display: none; }
        .result-box img { width: 180px; height: 180px; margin-top: 10px; border: 1px solid #ddd; background: #fff; padding: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>FlashCred - Cadastro e Consulta</h2>
    
    <!-- Formulário de Cadastro -->
    <div id="secao-cadastro">
        <h3>Novo Cadastro</h3>
        <div class="form-group">
            <label>Protocolo:</label>
            <input type="text" id="cad-protocolo" placeholder="Ex: 2026001">
        </div>
        <div class="form-group">
            <label>Nome Completo:</label>
            <input type="text" id="cad-nome" placeholder="Nome do cliente">
        </div>
        <div class="form-group">
            <label>WhatsApp:</label>
            <input type="text" id="cad-whatsapp" placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
            <label>CPF:</label>
            <input type="text" id="cad-cpf" placeholder="000.000.000-00">
        </div>
        <div class="form-group">
            <label>Payload Pix (Copia e Cola para teste):</label>
            <input type="text" id="cad-pix" placeholder="Cole o código Pix aqui para gerar o QR Code">
        </div>
        <button onclick="cadastrarCliente()">Salvar na Nuvem</button>
    </div>

    <hr style="margin: 30px 0;">

    <!-- Área de Consulta / Resultado -->
    <div id="secao-consulta">
        <h3>Consultar Proposta</h3>
        <div class="form-group">
            <label>Digite o CPF ou Protocolo:</label>
            <input type="text" id="busca-termo" placeholder="Pesquisar...">
        </div>
        <button onclick="consultarCliente()" style="background: #28a745;">Buscar</button>

        <div id="resultado-busca" class="result-box">
            <h4>Dados Encontrados:</h4>
            <p id="info-cliente"></p>
            <div>
                <strong>QR Code do Pix:</strong><br>
                <img id="img-qrcode" src="" alt="QR Code Pix">
            </div>
        </div>
    </div>
</div>

<script>
    // Configuração oficial do Supabase
    const SUPABASE_URL = "https://rgcclordmqjmwuzrrfbd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi";

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Função para Cadastrar e Salvar na Nuvem
    async function cadastrarCliente() {
        const protocolo = document.getElementById('cad-protocolo').value;
        const nome = document.getElementById('cad-nome').value;
        const whatsapp = document.getElementById('cad-whatsapp').value;
        const cpf = document.getElementById('cad-cpf').value;
        const pixPayload = document.getElementById('cad-pix').value;

        if (!cpf || !nome) {
            alert("Preencha pelo menos o Nome e o CPF!");
            return;
        }

        const { data, error } = await _supabase
            .from('clientes')
            .insert([{ protocolo, nome, whatsapp, cpf, cep: pixPayload }]); // Usando cep temporariamente para guardar o pix se precisar

        if (error) {
            console.error("Erro:", error);
            alert("Erro ao salvar no Supabase: " + error.message);
        } else {
            alert("Cadastrado com sucesso na nuvem!");
            document.getElementById('cad-protocolo').value = '';
            document.getElementById('cad-nome').value = '';
            document.getElementById('cad-whatsapp').value = '';
            document.getElementById('cad-cpf').value = '';
            document.getElementById('cad-pix').value = '';
        }
    }

    // Função para Consultar na Nuvem (Funciona em qualquer aparelho)
    async function consultarCliente() {
        const termo = document.getElementById('busca-termo').value.trim();
        const boxResultado = document.getElementById('resultado-busca');
        const infoCliente = document.getElementById('info-cliente');
        const imgQrcode = document.getElementById('img-qrcode');

        if (!termo) {
            alert("Digite algo para buscar!");
            return;
        }

        const { data, error } = await _supabase
            .from('clientes')
            .select('*')
            .or(`cpf.eq.${termo},protocolo.eq.${termo}`);

        if (error) {
            console.error("Erro na busca:", error);
            alert("Erro ao buscar.");
            return;
        }

        if (data && data.length > 0) {
            const cliente = data[0];
            infoCliente.innerHTML = `<strong>Nome:</strong> ${cliente.nome} <br> <strong>Protocolo:</strong> ${cliente.protocolo || 'N/A'} <br> <strong>WhatsApp:</strong> ${cliente.whatsapp || 'N/A'}`;
            
            // Gera o QR Code visualmente se houver payload salvo
            if (cliente.cep) {
                const urlEncoder = encodeURIComponent(cliente.cep);
                imgQrcode.src = `https://qrcode.tec-it.com/API/QRCode?data=${urlEncoder}`;
            } else {
                imgQrcode.src = "";
            }

            boxResultado.style.display = "block";
        } else {
            alert("Nenhum registro encontrado.");
            boxResultado.style.display = "none";
        }
    }
</script>

</body>
</html>
