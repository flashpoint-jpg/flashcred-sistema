<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred Móveis - Solicitação de Empréstimo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-xl mx-auto w-full bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 my-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">FlashCred Móveis</h1>
            <p class="text-sm text-gray-400">Preencha seus dados e envie os documentos para análise</p>
        </div>

        <form id="formProposta" class="space-y-4" enctype="multipart/form-data">
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Nome Completo</label>
                <input type="text" name="nome" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">CPF (Apenas números)</label>
                    <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Data de Nascimento (Mín. 18 anos)</label>
                    <input type="date" name="dataNascimento" id="dataNascimento" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Celular / WhatsApp</label>
                    <input type="text" name="celular" placeholder="(00) 00000-0000" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">E-mail</label>
                    <input type="email" name="email" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                </div>
            </div>

            <hr class="border-gray-700 my-4">

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">CEP</label>
                    <input type="text" name="cep" id="cep" placeholder="00000-000" maxlength="9" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Estado (UF)</label>
                    <input type="text" name="estado" id="estado" readonly class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-gray-400">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Rua / Logradouro</label>
                    <input type="text" name="rua" id="rua" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Bairro</label>
                    <input type="text" name="bairro" id="bairro" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Cidade</label>
                    <input type="text" name="cidade" id="cidade" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                </div>
            </div>

            <hr class="border-gray-700 my-4">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Valor Desejado (R$)</label>
                    <input type="number" name="valorSolicitado" value="1000" min="200" step="50" required class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Quantidade de Parcelas</label>
                    <select name="qtdParcelas" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
                        <option value="6">6x Mensais</option>
                        <option value="10">10x Mensais</option>
                        <option value="12" selected>12x Mensais</option>
                        <option value="18">18x Mensais</option>
                    </select>
                </div>
            </div>

            <hr class="border-gray-700 my-4">

            <h3 class="text-sm font-bold text-amber-400 uppercase tracking-wide">Envio de Documentos e Selfie</h3>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">📸 Selfie com o Rosto (Boa iluminação)</label>
                    <input type="file" name="selfie" accept="image/*" required class="w-full p-2 bg-gray-900 border border-gray-700 rounded-lg text-sm text-gray-300">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">🪪 Foto da CNH ou RG (Frente e Verso)</label>
                    <input type="file" name="documento" accept="image/*" required class="w-full p-2 bg-gray-900 border border-gray-700 rounded-lg text-sm text-gray-300">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">📄 Comprovante de Residência</label>
                    <input type="file" name="comprovanteResidencia" accept="image/*,.pdf" required class="w-full p-2 bg-gray-900 border border-gray-700 rounded-lg text-sm text-gray-300">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">💵 Comprovante de Renda (Holerite / Extrato)</label>
                    <input type="file" name="comprovanteRenda" accept="image/*,.pdf" required class="w-full p-2 bg-gray-900 border border-gray-700 rounded-lg text-sm text-gray-300">
                </div>
            </div>

            <button type="submit" id="btnEnviar" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold p-3 rounded-lg transition duration-200 mt-4">
                Enviar Pedido para Análise
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="consultar.html" class="text-sm text-amber-400 hover:underline">Já tem uma proposta? Consulte aqui</a> | 
            <a href="admin.html" class="text-sm text-gray-400 hover:underline">Painel Admin</a>
        </div>
    </div>

    <script>
        document.getElementById('cep').addEventListener('blur', function() {
            let cep = this.value.replace(/\D/g, '');
            if (cep.length === 8) {
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                    .then(res => res.json())
                    .then(data => {
                        if (!data.erro) {
                            document.getElementById('rua').value = data.logradouro;
                            document.getElementById('bairro').value = data.bairro;
                            document.getElementById('cidade').value = data.localidade;
                            document.getElementById('estado').value = data.uf;
                        }
                    });
            }
        });

        document.getElementById('formProposta').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.innerText = 'Enviando documentos...';

            const formData = new FormData(this);

            try {
                const response = await fetch('/api/propostas', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.sucesso) {
                    alert('Proposta enviada com sucesso!');
                    window.location.href = `consultar.html?cpf=${document.getElementById('cpf').value}`;
                } else {
                    alert('Erro: ' + result.erro);
                    btn.disabled = false;
                    btn.innerText = 'Enviar Pedido para Análise';
                }
            } catch (err) {
                alert('Erro de conexão.');
                btn.disabled = false;
                btn.innerText = 'Enviar Pedido para Análise';
            }
        });
    </script>
</body>
</html>
