<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Solicitação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
        .btn-copy {
            background-color: #007bff;
            color: white;
        }
        .btn-copy:hover {
            background-color: #0056b3;
        }
        #feedback {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulário de Solicitação</h2>
    
    <form id="solicitacaoForm">
        
        <div class="form-group">
            <label for="codigo">Código</label>
            <input type="text" id="codigo" placeholder="Ex: 00123">
        </div>

        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" required placeholder="Digite o nome completo">
        </div>

        <div class="row">
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00">
            </div>
            <div class="form-group">
                <label for="nascimento">Data de Nascimento</label>
                <input type="date" id="nascimento" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000">
            </div>
            <div class="form-group">
                <label for="valor">Valor Desejado (R$)</label>
                <input type="text" id="valor" required placeholder="0,00">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="cep">CEP</label>
                <input type="text" id="cep" maxlength="9" required placeholder="00000-000">
            </div>
            <div class="form-group">
                <label for="numero">Número da Residência</label>
                <input type="text" id="numero" required placeholder="Nº">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="logradouro">Logradouro (Rua)</label>
                <input type="text" id="logradouro" readonly placeholder="Preenchimento automático">
            </div>
            <div class="form-group">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" readonly placeholder="Preenchimento automático">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" readonly placeholder="Preenchimento automático">
            </div>
            <div class="form-group">
                <label for="uf">UF</label>
                <input type="text" id="uf" readonly placeholder="--">
            </div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-copy" onclick="copiarDados()">📋 Copiar Dados</button>
            <button type="submit" class="btn-submit" id="btnEnviar">Enviar Solicitação</button>
        </div>
        
        <div id="feedback"></div>
    </form>
</div>

<script>
    // --- BUSCA AUTOMÁTICA DE CEP (ViaCEP) ---
    document.getElementById('cep').addEventListener('blur', function() {
        let cep = this.value.replace(/\D/g, '');
        if (cep.length === 8) {
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(response => response.json())
                .then(data => {
                    if (!data.erro) {
                        document.getElementById('logradouro').value = data.logradouro;
                        document.getElementById('bairro').value = data.bairro;
                        document.getElementById('cidade').value = data.localidade;
                        document.getElementById('uf').value = data.uf;
                        document.getElementById('numero').focus();
                    } else {
                        alert('CEP não encontrado.');
                    }
                })
                .catch(() => alert('Erro ao buscar o CEP.'));
        }
    });

    // --- ENVIO DIRETO PARA O SEU BANCO DE DADOS ---
    document.getElementById('solicitacaoForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btnEnviar = document.getElementById('btnEnviar');
        const feedback = document.getElementById('feedback');
        
        btnEnviar.disabled = true;
        btnEnviar.textContent = 'Enviando...';

        const dadosCliente = {
            codigo: document.getElementById('codigo').value,
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            nascimento: document.getElementById('nascimento').value,
            telefone: document.getElementById('telefone').value,
            valor: document.getElementById('valor').value,
            cep: document.getElementById('cep').value,
            numero: document.getElementById('numero').value,
            logradouro: document.getElementById('logradouro').value,
            bairro: document.getElementById('bairro').value,
            cidade: document.getElementById('cidade').value,
            uf: document.getElementById('uf').value
        };

        // ATENÇÃO: Substitua apenas este texto abaixo pelo link da API do seu sistema
        const URL_DO_SEU_BACKEND = 'SUA_URL_DO_BANCO_OU_API';

        fetch(URL_DO_SEU_BACKEND, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dadosCliente)
        })
        .then(response => {
            if (response.ok) {
                feedback.style.color = '#28a745';
                feedback.textContent = '🚀 Solicitação enviada e salva no banco com sucesso!';
                document.getElementById('solicitacaoForm').reset();
            } else {
                throw new Error('Falha ao salvar no servidor.');
            }
        })
        .catch(error => {
            feedback.style.color = '#dc3545';
            feedback.textContent = '❌ Erro ao enviar. Verifique a conexão com o banco.';
            console.error('Erro:', error);
        })
        .finally(() => {
            btnEnviar.disabled = false;
            btnEnviar.textContent = 'Enviar Solicitação';
        });
    });

    // --- FUNÇÃO PARA COPIAR DADOS MANUALMENTE ---
    function copiarDados() {
        const codigo = document.getElementById('codigo').value;
        const nome = document.getElementById('nome').value;
        const cpf = document.getElementById('cpf').value;
        const nascimento = document.getElementById('nascimento').value;
        const telefone = document.getElementById('telefone').value;
        const valor = document.getElementById('valor').value;
        const cep = document.getElementById('cep').value;
        const numero = document.getElementById('numero').value;
        const logradouro = document.getElementById('logradouro').value;
        const bairro = document.getElementById('bairro').value;
        const cidade = document.getElementById('cidade').value;
        const uf = document.getElementById('uf').value;

        const textoCopia = `--- DADOS DO CLIENTE ---\nCódigo: ${codigo}\nNome: ${nome}\nCPF: ${cpf}\nData de Nascimento: ${nascimento}\nTelefone: ${telefone}\nValor Desejado: R$ ${valor}\nCEP: ${cep}\nEndereço: ${logradouro}, Nº ${numero}\nBairro: ${bairro}\nCidade/UF: ${cidade} - ${uf}`;

        navigator.clipboard.writeText(textoCopia).then(() => {
            const feedback = document.getElementById('feedback');
            feedback.style.color = '#007bff';
            feedback.textContent = '📋 Dados copiados para a área de transferência!';
            setTimeout(() => { feedback.textContent = ''; }, 4000);
        });
    }
</script>

</body>
</html>
