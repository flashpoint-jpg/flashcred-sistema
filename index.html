<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlashCred - Crédito Facilitado</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }

        :root {
            --primaria: #F5A623;
            --primaria-escura: #E69500;
            --secundaria: #1A1A1A;
            --fundo: #F8F9FA;
            --branco: #FFFFFF;
            --texto: #333333;
            --texto-claro: #666666;
            --erro: #E53935;
            --sucesso: #43A047;
            --borda: #E0E0E0;
            --sombra: 0 2px 8px rgba(0,0,0,0.08);
            --sombra-forte: 0 4px 16px rgba(0,0,0,0.12);
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #F8F9FA 0%, #E9ECEF 100%);
            padding: 16px 8px;
        }

        .container { 
            width: 100%;
            max-width: 480px; 
            margin: 0 auto; 
            background: var(--branco); 
            padding: 28px 24px; 
            border-radius: 16px; 
            box-shadow: var(--sombra-forte);
        }

        .cabecalho { 
            text-align: center; 
            margin-bottom: 32px; 
        }

        .logo-icone {
            width: 64px;
            height: 64px;
            background: var(--primaria);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 28px;
            font-weight: bold;
            color: var(--branco);
        }

        h1 { 
            color: var(--secundaria); 
            font-size: clamp(22px, 5vw, 28px); 
            font-weight: 700; 
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .slogan { 
            color: var(--texto-claro); 
            font-size: clamp(14px, 3.5vw, 16px); 
            font-weight: 400;
        }

        .abas { 
            display: flex; 
            margin-bottom: 24px; 
            background: var(--fundo);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .aba { 
            flex: 1; 
            padding: 12px 8px; 
            text-align: center; 
            color: var(--texto-claro); 
            font-weight: 600; 
            cursor: pointer; 
            border-radius: 8px;
            font-size: clamp(13px, 3.2vw, 15px); 
            transition: all 0.2s ease;
        }

        .aba.ativa { 
            background: var(--branco);
            color: var(--primaria); 
            box-shadow: var(--sombra);
        }

        .conteudo-aba { 
            display: none; 
        }

        .conteudo-aba.ativo { 
            display: block; 
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .campo { 
            margin-bottom: 18px; 
        }

        .campo-menor { 
            max-width: 180px; 
            width: 60%;
        }

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: clamp(13px, 3.5vw, 14px); 
            color: var(--texto);
        }

        input, select { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1.5px solid var(--borda); 
            border-radius: 12px; 
            font-size: clamp(14px, 3.8vw, 15px); 
            background: var(--branco); 
            color: var(--texto);
            transition: all 0.2s ease;
        }

        input::placeholder { 
            color: #BDBDBD; 
        }

        input:focus, select:focus { 
            outline: none; 
            border-color: var(--primaria); 
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15); 
        }

        .erro { 
            color: var(--erro); 
            font-size: clamp(12px, 3vw, 13px); 
            margin-top: 4px; 
            display: none;
            font-weight: 500;
        }

        .resultado { 
            margin-top: 20px; 
            padding: 20px; 
            border-radius: 12px; 
            display: none; 
            border: 1px solid transparent;
        }

        .resultado.analise { 
            background: #FFF8E1; 
            border-color: var(--primaria); 
            color: #F57C00; 
        }

        .resultado.reprovado { 
            background: #FFEBEE; 
            border-color: var(--erro); 
            color: var(--erro); 
        }

        .resultado.aprovado { 
            background: #E8F5E9; 
            border-color: var(--sucesso); 
            color: #2E7D32; 
        }

        .resultado h3 { 
            text-align: center; 
            margin-bottom: 16px; 
            font-size: clamp(18px, 4.2vw, 20px); 
            font-weight: 700;
        }

        .detalhes { 
            background: rgba(255,255,255,0.7); 
            padding: 16px; 
            border-radius: 10px; 
            margin: 12px 0; 
            font-size: clamp(13px, 3.5vw, 14px); 
            line-height: 1.8;
        }

        .detalhes p { 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 0; 
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .detalhes p:last-child { border-bottom: none; }

        .detalhes strong { 
            color: var(--secundaria); 
            font-weight: 600;
        }

        .pix-area { 
            margin-top: 16px; 
            padding-top: 16px; 
            border-top: 1px solid rgba(0,0,0,0.1); 
            text-align: center; 
            font-size: clamp(13px, 3.5vw, 14px);
        }

        .pix-codigo { 
            background: var(--branco); 
            padding: 12px; 
            border-radius: 10px; 
            font-size: clamp(11px, 3vw, 12px); 
            word-break: break-all; 
            margin: 10px 0; 
            color: var(--texto);
            font-family: monospace;
            border: 1px dashed var(--borda);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--primaria); 
            color: var(--branco); 
            border: none; 
            border-radius: 12px; 
            font-size: clamp(15px, 4vw, 16px); 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 8px; 
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(245, 166, 35, 0.3);
        }

        button:hover { 
            background: var(--primaria-escura); 
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(245, 166, 35, 0.4);
        }

        button:active { transform: translateY(0); }

        button.btn-copiar { 
            padding: 10px 16px; 
            font-size: clamp(13px, 3.5vw, 14px); 
            margin-top: 8px;
            background: var(--branco);
            color: var(--primaria);
            border: 1.5px solid var(--primaria);
            box-shadow: none;
        }

        button.btn-copiar:hover { 
            background: #FFF3E0;
            transform: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="cabecalho">
        <div class="logo-icone">FC</div>
        <h1>FlashCred</h1>
        <p class="slogan">Crédito simples, rápido e seguro</p>
    </div>

    <div class="abas">
        <div class="aba ativa" onclick="mudarAba('solicitar')">Solicitar</div>
        <div class="aba" onclick="mudarAba('consultar')">Consultar</div>
    </div>

    <div id="aba-solicitar" class="conteudo-aba ativo">
        <form id="formCliente">
            <div class="campo">
                <label>Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>
            
            <div class="campo">
                <label>CPF</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14">
                <div id="erroCpf" class="erro">⚠️ CPF inválido</div>
            </div>
            
            <div class="campo">
                <label>Data de Nascimento</label>
                <input type="date" id="nascimento" required>
                <div id="erroIdade" class="erro">⚠️ É necessário ter mais de 17 anos</div>
            </div>
            
            <div class="campo">
                <label>CEP</label>
                <input type="text" id="cep" required placeholder="00000-000" maxlength="9">
            </div>
            
            <div class="campo">
                <label>Valor Desejado (R$)</label>
                <input type="number" id="valorCredito" step="0.01" required placeholder="Ex: 1.500,00">
            </div>
            
            <div class="campo">
                <label>Renda Mensal (R$)</label>
                <input type="number" id="renda" step="0.01" required placeholder="Ex: 1.200,00">
            </div>
            
            <div class="campo">
                <label>Situação de Trabalho</label>
                <select id="trabalho" required>
                    <option value="">Selecione uma opção</option>
                    <option value="clt">CLT</option>
                    <option value="aposentado">Aposentado / Pensionista</option>
                    <option value="autonomo">Autônomo / MEI</option>
                </select>
            </div>
            
            <div class="campo">
                <label>Endereço</label>
                <input type="text" id="endereco" required readonly placeholder="Preenchido automaticamente">
            </div>
            
            <div class="campo campo-menor">
                <label>Número</label>
                <input type="text" id="numero" required placeholder="Ex: 123">
            </div>
            
            <div class="campo">
                <label>Bairro</label>
                <input type="text" id="bairro" required readonly placeholder="Preenchido automaticamente">
            </div>
            
            <div class="campo">
                <label>Cidade / UF</label>
                <input type="text" id="cidade" required readonly placeholder="Preenchido automaticamente">
            </div>
            
            <div class="campo">
                <label>WhatsApp</label>
                <input type="text" id="whatsapp" required placeholder="(00) 00000-0000" maxlength="16">
            </div>
            
            <button type="submit">Enviar Solicitação</button>
        </form>
    </div>

    <div id="aba-consultar" class="conteudo-aba">
        <form id="formConsulta">
            <div class="campo">
                <label>Consultar solicitação pelo CPF</label>
                <input type="text" id="cpfConsulta" required placeholder="Digite seu CPF" maxlength="14">
            </div>
            <button type="submit">Verificar Status</button>
        </form>
        <div id="resultadoConsulta" class="resultado"></div>
    </div>
</div>

<script>
    const CHAVE_PIX = '3552949852';

    function mudarAba(aba) {
        document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
        document.querySelectorAll('.conteudo-aba').forEach(c => c.classList.remove('ativo'));
        event.target.classList.add('ativa');
        document.getElementById(`aba-${aba}`).classList.add('ativo');
        document.getElementById('resultadoConsulta').style.display = 'none';
    }

    function aplicarMascaraCpf(cpfInput) {
        cpfInput.addEventListener('input', e => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0,11);
            v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v;
        });
    }
    aplicarMascaraCpf(document.getElementById('cpf'));
    aplicarMascaraCpf(document.getElementById('cpfConsulta'));

    function validarCPF(cpf) {
        cpf = cpf.replace(/\D/g, '');
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
        let soma = 0;
        for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
        let dig1 = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        soma = 0;
        for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
        let dig2 = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        return dig1 === parseInt(cpf.charAt(9)) && dig2 === parseInt(cpf.charAt(10));
    }

    document.getElementById('cpf').addEventListener('blur', function() {
        document.getElementById('erroCpf').style.display = validarCPF(this.value) ? 'none' : 'block';
    });

    document.getElementById('nascimento').addEventListener('change', function() {
        const nasc = new Date(this.value), hoje = new Date();
        let idade = hoje.getFullYear() - nasc.getFullYear();
        const m = hoje.getMonth() - nasc.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
        document.getElementById('erroIdade').style.display = idade >= 18 ? 'none' : 'block';
    });

    document.getElementById('cep').addEventListener('blur', function() {
        let cep = this.value.replace(/\D/g, '');
        if (cep.length === 8) {
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(res => res.json())
            .then(dados => {
                if (!dados.erro) {
                    document.getElementById('endereco').value = dados.logradouro || '';
                    document.getElementById('bairro').value = dados.bairro || '';
                    document.getElementById('cidade').value = dados.localidade + '/' + (dados.uf || '');
                }
            }).catch(() => {
                console.log('Serviço de CEP indisponível no momento');
            });
        }
    });

    document.getElementById('cep').addEventListener('input', e => {
        let v = e.target.value.replace(/\D/g, '');
        if (v.length > 8) v = v.slice(0,8);
        e.target.value = v.replace(/(\d{5})(\d)/, '$1-$2');
    });

    document.getElementById('formCliente').addEventListener('submit', e => {
        e.preventDefault();
        if (!validarCPF(document.getElementById('cpf').value)) return alert('Informe um CPF válido!');
        const nasc = new Date(document.getElementById('nascimento').value), hoje = new Date();
        let idade = hoje.getFullYear() - nasc.getFullYear();
        const m = hoje.getMonth() - nasc.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
        if (idade < 18) return alert('É necessário ter mais de 17 anos para solicitar!');

        const cpfLimpo = document.getElementById('cpf').value.replace(/\D/g,'');
        const solicitacao = {
            cpf: cpfLimpo,
            nome: document.getElementById('nome').value,
            valorSolicitado: parseFloat(document.getElementById('valorCredito').value),
            renda: parseFloat(document.getElementById('renda').value),
            status: 'em_analise',
            data: new Date().toLocaleDateString('pt-BR'),
            detalhes: {}
        };
        localStorage.setItem(`flashcred_${cpfLimpo}`, JSON.stringify(solicitacao));
        alert('✅ Solicitação enviada com sucesso! Em breve retornaremos com o resultado.');
        e.target.reset();
    });

    document.getElementById('formConsulta').addEventListener('submit', e => {
        e.preventDefault();
        const cpf = document.getElementById('cpfConsulta').value.replace(/\D/g,'');
        const resultado = document.getElementById('resultadoConsulta');
        resultado.style.display = 'none';
        if (!validarCPF(cpf)) return alert('Informe um CPF válido!');

        const dados = JSON.parse(localStorage.getItem(`flashcred_${cpf}`) || 'null');
        
        if (!dados) {
            resultado.className = 'resultado analise';
            resultado.innerHTML = `<h3>Solicitação não encontrada</h3><p style="text-align:center;">Não localizamos nenhum pedido com este CPF. Verifique se digitou corretamente ou envie uma nova solicitação.</p>`;
        } else if (dados.status === 'em_analise') {
            resultado.className = 'resultado analise';
            resultado.innerHTML = `<h3>⏳ Em Análise</h3><p style="text-align:center;">Recebemos sua solicitação em ${dados.data}. Nossa equipe está analisando seus dados e em breve você receberá o retorno.</p>`;
        } else if (dados.status === 'reprovado') {
            resultado.className = 'resultado reprovado';
            resultado.innerHTML = `<h3>❌ Crédito Reprovado</h3><p style="text-align:center;">Infelizmente não foi possível aprovar o crédito no momento. Você pode tentar novamente após 30 dias ou com um valor menor.</p>`;
        } else if (dados.status === 'aprovado') {
            resultado.className = 'resultado aprovado';
            const d = dados.detalhes;
            const codigoPix = `00020126580014BR.GOV.BCB.PIX0136${CHAVE_PIX}0214FlashCred+Pagamento5204000053039865802BR5925FlashCred+Móveis6009Santo+André62070503***6304${Math.random().toString(36).substring(2,10).toUpperCase()}`;
            
            resultado.innerHTML = `
                <h3>✅ Crédito Aprovado!</h3>
                <div class="detalhes">
                    <p><span>Valor Liberado</span> <strong>R$ ${parseFloat(d.valorLiberado||0).toFixed(2)}</strong></p>
                    <p><span>Entrada de</span> <strong>${d.percEntrada||0}% = R$ ${parseFloat(d.valorEntrada||0).toFixed(2)}</strong></p>
                    <p><span>Parcelas</span> <strong>${d.qtdParcelas||0}x de R$ ${parseFloat(d.valorParcela||0).toFixed(2)}</strong></p>
                    <p><span>Juros mensais</span> <strong>${d.percJuros||0}%</strong></p>
                    <p><span>Total a pagar</span> <strong>R$ ${parseFloat(d.totalFinal||0).toFixed(2)}</strong></p>
                </div>
                <div class="pix-area">
                    <p>Pague a entrada para confirmar e liberar o valor:</p>
                    <div class="pix-codigo" id="codigoPix">${codigoPix}</div>
                    <button type="button" class="btn-copiar" onclick="navigator.clipboard.writeText('${codigoPix}').then(() => alert('✅ Código Pix copiado!'))">Copiar Código Pix</button>
                </div>
            `;
        }
        resultado.style.display = 'block';
    });

    function aprovarCredito(cpf, valorLiberado, percEntrada, percJuros, qtdParcelas) {
        const valorEntrada = valorLiberado * (percEntrada / 100);
        const saldo = valorLiberado - valorEntrada;
        const totalFinal = saldo * (1 + (percJuros / 100) * qtdParcelas);
        const valorParcela = totalFinal / qtdParcelas;

        const solicitacao = JSON.parse(localStorage.getItem(`flashcred_${cpf.replace(/\D/g,'')}`));
        solicitacao.status = 'aprovado';
        solicitacao.detalhes = {
            valorLiberado, percEntrada, valorEntrada, qtdParcelas, percJuros, valorParcela, totalFinal
        };
        localStorage.setItem(`flashcred_${cpf.replace(/\D/g,'')}`, JSON.stringify(solicitacao));
        alert('✅ Crédito aprovado com sucesso! O cliente já pode consultar o resultado.');
    }
</script>

</body>
</html>
