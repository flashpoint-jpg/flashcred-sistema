<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred - Sistema de Propostas</title>
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>FlashCred - Propostas</h1>
    <div id="status">Conectando ao banco de dados...</div>

    <script>
        // Configuração do Supabase com a URL corrigida
        const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testarConexao() {
            const statusDiv = document.getElementById('status');
            try {
                const { data, error } = await _supabase.from('propostas').select('*').limit(1);
                
                if (error) {
                    throw error;
                }

                statusDiv.innerHTML = 'Conexão com o Supabase estabelecida com sucesso!';
                statusDiv.style.color = 'green';
            } catch (err) {
                statusDiv.innerHTML = 'Erro ao conectar: ' + err.message;
                statusDiv.style.color = 'red';
                console.error(err);
            }
        }

        testarConexao();
    </script>
</body>
</html>
