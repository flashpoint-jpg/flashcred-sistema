<!-- Seção de Pix Parcelado -->
<div id="secao-pix-parcelado" class="max-w-xl mx-auto p-6 bg-white border border-gray-200 rounded-lg shadow-sm">
  <button id="btn-consultar-pix" onclick="executarConsultaPixParcelado()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-md transition duration-150">
    Consultar Limite de Pix Parcelado
  </button>

  <!-- Estado de Processamento Discreto (Sem animações artificiais) -->
  <div id="loading-pix" class="hidden text-center py-6 text-slate-600">
    <p class="text-sm font-medium">Consultando limite para compras na loja...</p>
  </div>

  <!-- Resultado Instantâneo: Limite de Pix Parcelado Liberado na Hora -->
  <div id="resultado-pix-liberado" class="hidden mt-4 p-5 bg-slate-50 border border-slate-200 rounded-md">
    <h3 class="text-base font-semibold text-slate-900">Limite de Pix Parcelado Disponível</h3>
    <p class="text-sm text-slate-600 mt-1">
      Consulta realizada com sucesso para compras em nossa loja. Veja abaixo o seu limite pré-autorizado para Pix Parcelado em até 48x (com entrada).
    </p>
    
    <div class="mt-4 p-4 bg-white border border-slate-200 rounded-md">
      <span class="block text-xs uppercase tracking-wider text-slate-400 font-semibold">Limite Disponível</span>
      <span id="valor-limite-pix" class="text-2xl font-bold text-slate-900">R$ 0,00</span>
      <span class="block text-xs text-slate-500 mt-1">Condição: Entrada + parcelamento em até 48x</span>
    </div>

    <!-- Botão opcional para prosseguir com a compra usando o limite -->
    <button onclick="prosseguirComprando()" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-md text-sm transition">
      Usar Limite nas Compras
    </button>
  </div>
</div>

<script>
async function executarConsultaPixParcelado() {
  const btn = document.getElementById('btn-consultar-pix');
  const loading = document.getElementById('loading-pix');
  const resultado = document.getElementById('resultado-pix-liberado');
  const valorLimiteEl = document.getElementById('valor-limite-pix');

  // Esconde o botão e exibe carregamento institucional limpo
  btn.classList.add('hidden');
  loading.classList.remove('hidden');

  // Simula o tempo de consulta ao motor de regras (sem efeitos exagerados)
  await new Promise(resolve => setTimeout(resolve, 1500));

  // Simulação do retorno do limite calculado para Pix Parcelado
  const limiteCalculado = "R$ 12.500,00";
  valorLimiteEl.textContent = limiteCalculado;

  loading.classList.add('hidden');
  resultado.classList.remove('hidden');

  // Aqui você faria o insert/update no Supabase salvando o limite de pix parcelado gerado
}

function prosseguirComprando() {
  alert("Redirecionando para o catálogo/checkout com o limite de Pix Parcelado aplicado.");
}
</script>
