<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Produção</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #333;
        }
        #qrcode-container {
            margin: 20px 0;
        }
        #qrcode-img {
            max-width: 250px;
            height: auto;
        }
        .btn {
            background-color: #009ee3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover {
            background-color: #007eb5;
        }
        .copia-cola {
            font-size: 12px;
            word-break: break-all;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Finalizar Pagamento</h2>
        <p>Clique no botão abaixo para gerar o QR Code Pix de produção.</p>
        
        <button class="btn" onclick="gerarPagamentoPix()">Gerar QR Code Pix</button>

        <div id="qrcode-container" style="display: none;">
            <p>Escaneie o QR Code abaixo:</p>
            <img id="qrcode-img" src="" alt="QR Code Pix">
            <div class="copia-cola" id="copia-cola-text"></div>
        </div>
    </div>

    <script>
        async function gerarPagamentoPix() {
            // Utilizando o token de produção fornecido
            const ACCESS_TOKEN = "APP_USR-8158139097874832-072720-d200da044f05a1dd8eb75f90e0551431-18499471";
            
            const dadosPagamento = {
                transaction_amount: 10.00, // Altere o valor conforme necessário
                description: "Produto de Produção",
                payment_method_id: "pix",
                payer: {
                    email: "comprador@email.com",
                    first_name: "Cliente",
                    last_name: "Teste",
                    identification: {
                        type: "CPF",
                        number: "19119119119" // Substitua por um CPF válido real se exigido pelo ambiente
                    }
                }
            };

            try {
                const response = await fetch("https://api.mercadopago.com/v1/payments", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${ACCESS_TOKEN}`
                    },
                    body: JSON.stringify(dadosPagamento)
                });

                const data = await response.json();

                if (response.ok && data.point_of_interaction) {
                    const qrCodeBase64 = data.point_of_interaction.transaction_data.qr_code_base64;
                    const qrCodeCopyPaste = data.point_of_interaction.transaction_data.qr_code;

                    // Exibir imagem do QR Code
                    document.getElementById("qrcode-img").src = `data:image/png;base64,${qrCodeBase64}`;
                    document.getElementById("copia-cola-text").innerText = qrCodeCopyPaste;
                    document.getElementById("qrcode-container").style.display = "block";
                } else {
                    alert("Erro ao gerar pagamento: " + (data.message || "Verifique os dados."));
                    console.error(data);
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro de conexão com o Mercado Pago.");
            }
        }
    </script>
</body>
</html>
