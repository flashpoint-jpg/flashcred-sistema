        </div>
        <div class="space-y-3 text-sm">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-700">Descrição da Saída / Despesa</label>
                <input type="text" id="descDespesa" placeholder="Ex: Compra de Material, Logística, Aluguel" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-rose-600 font-medium text-slate-900">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-700">Valor da Saída (R$)</label>
                <input type="text" id="valorDespesa" placeholder="0,00" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-rose-600 font-medium text-slate-900">
            </div>
            <button onclick="salvarDespesa()" class="btn-danger w-full py-3 rounded-xl text-sm font-bold shadow-md mt-2">Confirmar e Registrar Saída</button>
        </div>
    </div>
</div>

<script>
// --- FUNÇÕES DE MÁSCARA E FORMATAÇÃO ---
function formatarMoedaInput(e) {
    let v = e.target.value.replace(/\D/g, '');
    v = (v / 100).toFixed(2) + '';
    v = v.replace(".", ",");
    v = v.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    e.target.value = v;
}

function mascaraCPF(e) {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    e.target.value = v;
}

function mascaraCEP(e) {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length > 8) v.slice(0, 8);
    v = v.replace(/(\d{5})(\d)/, '$1-$2');
    e.target.value = v;
}

function mascaraWhatsApp(e) {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);
    v = v.replace(/^(\d{2})(\d)/g, '($1) $2');
    v = v.replace(/(\d)(\d{4})$/, '$1-$2');
    e.target.value = v;
}

document.getElementById('renda').addEventListener('input', formatarMoedaInput);
document.getElementById('valor').addEventListener('input', formatarMoedaInput);
document.getElementById('cpf').addEventListener('input', mascaraCPF);
document.getElementById('cpfConsulta').addEventListener('input', mascaraCPF);
document.getElementById('cep').addEventListener('input', mascaraCEP);
document.getElementById('whatsapp').addEventListener('input', mascaraWhatsApp);

// --- CONSULTAR CEP VIA VIACEP ---
async function consultarCEP(cepVal) {
    let cepLimpo = cepVal.replace(/\D/g, '');
    if (cepLimpo.length !== 8) return;
    try {
        let res = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
        let data = await res.json();
        if (!data.erro) {
            document.getElementById('endereco').value = `${data.logradouro}, ${data.bairro} - ${data.localidade}/${data.uf}`;
        } else {
            alert('CEP não encontrado.');
        }
    } catch (err) {
        console.error(err);
    }
}

// --- NAVEGAÇÃO DE ABAS ---
function mostrarAba(nomeAba) {
    document.querySelectorAll('.aba').forEach(el => el.classList.remove('ativa'));
    document.querySelectorAll('.nav-btn').forEach(el => {
        el.classList.remove('text-blue-900', 'bg-blue-50');
        el.classList.add('text-slate-500');
    });

    if (nomeAba === 'cliente') {
        document.getElementById('aba-cliente').classList.add('ativa');
        document.querySelector('.nav-btn-cliente').classList.add('text-blue-900', 'bg-blue-50');
        document.querySelector('.nav-btn-cliente').classList.remove('text-slate-500');
    } else if (nomeAba === 'consulta') {
        document.getElementById('aba-consulta').classList.add('ativa');
        document.querySelector('.nav-btn-consulta').classList.add('text-blue-900', 'bg-blue-50');
        document.querySelector('.nav-btn-consulta').classList.remove('text-slate-500');
    } else if (nomeAba === 'admin') {
        document.getElementById('aba-admin').classList.add('ativa');
        document.querySelector('.nav-btn-login').classList.add('text-blue-900', 'bg-blue-50');
        document.querySelector('.nav-btn-login').classList.remove('text-slate-500');
        carregarLista();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- LOGOUT / BLOQUEIO ADMIN ---
function sairLogin() {
    mostrarAba('cliente');
}

function tentarAbrirPainelAdmin() {
    let senha = prompt('Digite a senha administrativa do sistema:');
    if (senha === CONFIG.SENHA_ADMIN) {
        mostrarAba('admin');
    } else if (senha !== null) {
        alert('Senha incorreta!');
    }
}

// --- SISTEMA DE DADOS (LOCALSTORAGE) ---
function obterPropostas() {
    let propostas = localStorage.getItem('flashcred_propostas');
    return propostas ? JSON.parse(propostas) : [];
}

function salvarPropostas(propostas) {
    localStorage.setItem('flashcred_propostas', JSON.stringify(propostas));
}

function obterDespesas() {
    let desp = localStorage.getItem('flashcred_despesas');
    return desp ? JSON.parse(desp) : [];
}

function salvarDespesas(desp) {
    localStorage.setItem('flashcred_despesas', JSON.stringify(desp));
}

// --- FORMULÁRIO CLIENTE: SUBMIT ---
document.getElementById('formSolicitacao').addEventListener('submit', function(e) {
    e.preventDefault();
    let nome = document.getElementById('nome').value;
    let cpf = document.getElementById('cpf').value;
    let cep = document.getElementById('cep').value;
    let numRes = document.getElementById('numeroResidencia').value;
    let endereco = document.getElementById('endereco').value;
    let nascimento = document.getElementById('nascimento').value;
    let renda = document.getElementById('renda').value;
    let valorStr = document.getElementById('valor').value;
    let whatsapp = document.getElementById('whatsapp').value;

    let valorNum = parseFloat(valorStr.replace(/\./g, '').replace(',', '.')) || 0;
    
    // Cálculo de parcelas padrão
    let juros = CONFIG.JUROS_PADRAO / 100;
    let totalComJuros = valorNum * (1 + juros);
    let valorParcela = totalComJuros / CONFIG.PARCELAS_MAX;

    let novaProposta = {
        id: 'FC-' + Math.floor(100000 + Math.random() * 900000),
        dataCriacao: new Date().toLocaleDateString('pt-BR'),
        nome, cpf, cep, numRes, endereco, nascimento, renda, 
        valorSolicitado: valorNum,
        valorFormatado: valorStr,
        whatsapp,
        status: 'Em Análise', // Em Análise, Aprovado, Rejeitado, Pago Pix
        entradaPadrao: CONFIG.ENTRADA_PADRAO,
        jurosAplicados: CONFIG.JUROS_PADRAO,
        descontoPix: CONFIG.DESCONTO_PIX_ANTECIPADO_PADRAO,
        parcelasQtd: CONFIG.PARCELAS_MAX,
        valorParcela: valorParcela.toFixed(2),
        totalComJuros: totalComJuros.toFixed(2),
        modoPagamento: 'Parcelado', // Parcelado ou Pix Antecipado
        comprovantePixEnviado: false
    };

    let propostas = obterPropostas();
    // Remover duplicata pelo CPF se houver, ou manter histórico. Vamos adicionar nova.
    propostas.unshift(novaProposta);
    salvarPropostas(propostas);

    alert('Solicitação enviada com sucesso! Código ID: ' + novaProposta.id);
    this.reset();
    document.getElementById('endereco').value = '';
    mostrarAba('consulta');
    document.getElementById('cpfConsulta').value = cpf;
    consultarProposta();
});

// --- CONSULTAR PROPOSTA PELO CLIENTE ---
function consultarProposta() {
    let cpfInput = document.getElementById('cpfConsulta').value.trim();
    let container = document.getElementById('resultadoConsulta');
    container.classList.remove('hidden');

    if (!cpfInput) {
        container.innerHTML = `<div class="p-4 bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl text-center font-bold text-xs">Por favor, digite o seu CPF.</div>`;
        return;
    }

    let propostas = obterPropostas();
    let filtradas = propostas.filter(p => p.cpf === cpfInput);

    if (filtradas.length === 0) {
        container.innerHTML = `<div class="p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl text-center font-bold text-xs">Nenhuma proposta encontrada para o CPF informado. Verifique os dados ou preencha o formulário de solicitação.</div>`;
        return;
    }

    let html = '';
    filtradas.forEach(p => {
        let badgeColor = 'bg-amber-100 text-amber-800 border-amber-200';
        if (p.status === 'Aprovado' || p.status === 'Pago Pix') badgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-200';
        if (p.status === 'Rejeitado') badgeColor = 'bg-rose-100 text-rose-800 border-rose-200';

        let valorVal = parseFloat(p.valorSolicitado) || 0;
        let descPixVal = valorVal * ((100 - (p.descontoPix || 2.0)) / 100);

        html += `
            <div class="glass-panel p-5 rounded-2xl border border-slate-200 mb-4 space-y-3 bg-white shadow-sm">
                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <span class="text-xs font-bold text-slate-500">ID: ${p.id}</span>
                    <span class="px-3 py-1 rounded-full text-xs font-bold border ${badgeColor}">${p.status}</span>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div><strong class="text-slate-400">Cliente:</strong> <span class="text-slate-800 font-bold">${p.nome}</span></div>
                    <div><strong class="text-slate-400">Valor Solic.:</strong> <span class="text-blue-900 font-extrabold">R$ ${p.valorFormatado}</span></div>
                    <div><strong class="text-slate-400">Endereço:</strong> <span class="text-slate-800">${p.endereco}, Nº ${p.numRes}</span></div>
                    <div><strong class="text-slate-400">Data:</strong> <span class="text-slate-800">${p.dataCriacao}</span></div>
                </div>

                ${p.status === 'Aprovado' ? `
                    <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl space-y-3 mt-3">
                        <div class="flex items-center gap-2 text-blue-900 font-bold text-xs">
                            <span>💳</span> Proposta Aprovada! Escolha sua modalidade de liberação:
                        </div>

                        <!-- OPÇÃO 1: ENTRADA + PARCELAS -->
                        <div class="bg-white p-3 rounded-xl border border-blue-100 space-y-2">
                            <p class="text-xs font-bold text-slate-800">Opção Parcelada (Boleto/Cartão/Pix Parcelado):</p>
                            <p class="text-xs text-slate-600">• Entrada de <strong>${p.entradaPadrao}%</strong> (Taxa de Cadastro e Reserva Logística)</p>
                            <p class="text-xs text-slate-600">• Restante em até <strong>${p.parcelasQtd}x</strong> de <strong>R$ ${p.valorParcela}</strong></p>
                            <a href="https://api.whatsapp.com/send?phone=55${CONFIG.WHATSAPP_SUPORTE}&text=Olá,%20gostaria%20de%20prosseguir%20com%20a%20opção%20parcelada%20da%20proposta%20ID:%20${p.id}%20(Cliente:%20${encodeURIComponent(p.nome)})" target="_blank" class="btn-whatsapp block text-center py-2.5 rounded-xl text-xs font-bold shadow-sm">
                                💬 Pagar Entrada (${p.entradaPadrao}%) via WhatsApp
                            </a>
                        </div>

                        <!-- OPÇÃO 2: PIX ANTECIPADO COM DESCONTO -->
                        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 space-y-2">
                            <p class="text-xs font-bold text-emerald-900">⚡ PIX Antecipado (${p.descontoPix}% de Desconto):</p>
                            <p class="text-xs text-emerald-700">De R$ ${p.valorFormatado} por apenas <strong class="text-emerald-900 text-sm">R$ ${descPixVal.toFixed(2).replace('.', ',')} à vista</strong> com liberação imediata e frete grátis.</p>
                            <div class="p-3 bg-white rounded-xl border border-emerald-200 text-center space-y-2">
                                <p class="text-[10px] text-slate-500 font-bold uppercase">Chave Pix CNPJ Oficial:</p>
                                <div class="flex items-center justify-center gap-2">
                                    <code class="bg-slate-100 px-3 py-1.5 rounded-lg text-blue-900 font-bold text-xs select-all">${CONFIG.CHAVE_PIX}</code>
                                    <button onclick="copiarChave('${CONFIG.CHAVE_PIX}')" class="btn-primary px-3 py-1.5 rounded-lg text-xs font-bold">Copiar</button>
                                </div>
                                <p class="text-[10px] text-slate-500">Razão Social: FLASH POINT LTDA • CNPJ: ${CONFIG.CNPJ}</p>
                            </div>
                            <a href="https://api.whatsapp.com/send?phone=55${CONFIG.WHATSAPP_SUPORTE}&text=Olá,%20fiz%20o%20PIX%20Antecipado%20da%20proposta%20ID:%20${p.id}%20(Cliente:%20${encodeURIComponent(p.nome)}).%20Segue%20o%20comprovante!" target="_blank" class="btn-success block text-center py-2.5 rounded-xl text-xs font-bold shadow-sm">
                                ✅ Enviar Comprovante Pix no WhatsApp
                            </a>
                        </div>
                    </div>
                ` : ''}

                ${p.status === 'Pago Pix' ? `
                    <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-center space-y-2">
                        <p class="text-xs font-bold text-emerald-900">✅ Pagamento Verificado & Confirmado pelo Sistema!</p>
                        <p class="text-xs text-emerald-700">Seu pedido foi encaminhado para a expedição com garantia integral de entrega e emissão de recibo oficial.</p>
                    </div>
                ` : ''}
            </div>
        `;
    });
    container.innerHTML = html;
}

function copiarChave(chave) {
    navigator.clipboard.writeText(chave);
    alert('Chave Pix copiada com sucesso!');
}

// --- PAINEL ADMIN: CARREGAR LISTA & CAIXA ---
function carregarLista() {
    let propostas = obterPropostas();
    let despesas = obterDespesas();

    // Atualizar resumos contadores
    document.getElementById('resumoTotal').innerText = propostas.length;
    document.getElementById('resumoAnalise').innerText = propostas.filter(p => p.status === 'Em Análise').length;
    document.getElementById('resumoAprovado').innerText = propostas.filter(p => p.status === 'Aprovado' || p.status === 'Pago Pix').length;
    document.getElementById('resumoRejeitado').innerText = propostas.filter(p => p.status === 'Rejeitado').length;

    // Calcular financeiro
    let totalEntradas = 0;
    let totalDevendo = 0;
    propostas.forEach(p => {
        let v = parseFloat(p.valorSolicitado) || 0;
        if (p.status === 'Pago Pix') {
            totalEntradas += v;
        } else if (p.status === 'Aprovado') {
            totalDevendo += v; // Conta como fiado/pendente de recebimento
        }
    });

    let totalSaidas = 0;
    despesas.forEach(d => {
        totalSaidas += parseFloat(d.valor) || 0;
    });

    let lucroLiquido = totalEntradas - totalSaidas;

    document.getElementById('finTotalEntradas').innerText = `R$ ${totalEntradas.toFixed(2).replace('.', ',')}`;
    document.getElementById('finTotalSaidas').innerText = `R$ ${totalSaidas.toFixed(2).replace('.', ',')}`;
    document.getElementById('finLucroLiquido').innerText = `R$ ${lucroLiquido.toFixed(2).replace('.', ',')}`;
    document.getElementById('finTotalDevendo').innerText = `R$ ${totalDevendo.toFixed(2).replace('.', ',')}`;

    let grid = document.getElementById('listaPropostasGrid');
    if (propostas.length === 0) {
        grid.innerHTML = `<div class="p-6 text-center text-slate-500 font-medium text-xs">Nenhuma proposta cadastrada no sistema.</div>`;
        return;
    }

    let html = '';
    propostas.forEach(p => {
        let badgeColor = 'bg-amber-100 text-amber-800 border-amber-200';
        if (p.status === 'Aprovado' || p.status === 'Pago Pix') badgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-200';
        if (p.status === 'Rejeitado') badgeColor = 'bg-rose-100 text-rose-800 border-rose-200';

        html += `
            <div class="glass-panel p-5 rounded-2xl border border-slate-200 space-y-3 bg-white shadow-sm">
                <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-100 pb-2">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-400">${p.id}</span>
                        <span class="text-xs font-bold text-slate-800">${p.nome}</span>
                        <span class="text-[10px] text-slate-500 font-mono">(${p.cpf})</span>
                    </div>
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${badgeColor}">${p.status}</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                    <div><strong class="text-slate-400">Valor:</strong> <span class="text-blue-900 font-extrabold">R$ ${p.valorFormatado}</span></div>
                    <div><strong class="text-slate-400">WhatsApp:</strong> <span class="text-slate-800">${p.whatsapp}</span></div>
                    <div><strong class="text-slate-400">Endereço:</strong> <span class="text-slate-800">${p.endereco}, Nº ${p.numRes}</span></div>
                    <div><strong class="text-slate-400">Renda:</strong> <span class="text-slate-800">R$ ${p.renda}</span></div>
                </div>
                <div class="flex flex-wrap items-center justify-end gap-2 pt-2 border-t border-slate-100">
                    <button onclick="mudarStatus('${p.id}', 'Em Análise')" class="bg-amber-100 text-amber-800 hover:bg-amber-200 px-3 py-1.5 rounded-xl text-xs font-bold transition">Análise</button>
                    <button onclick="mudarStatus('${p.id}', 'Aprovado')" class="btn-success px-3 py-1.5 rounded-xl text-xs font-bold">Aprovar</button>
                    <button onclick="mudarStatus('${p.id}', 'Rejeitado')" class="btn-danger px-3 py-1.5 rounded-xl text-xs font-bold">Rejeitar</button>
                    <button onclick="mudarStatus('${p.id}', 'Pago Pix')" class="btn-whatsapp px-3 py-1.5 rounded-xl text-xs font-bold">⚡ Baixa Pix</button>
                    <button onclick="abrirModalEditar('${p.id}')" class="btn-info px-3 py-1.5 rounded-xl text-xs font-bold">✏️ Editar Benefícios</button>
                    <button onclick="excluirProposta('${p.id}')" class="bg-slate-200 hover:bg-rose-600 hover:text-white text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold transition">🗑️ Excluir</button>
                </div>
            </div>
        `;
    });
    grid.innerHTML = html;
}

function mudarStatus(id, novoStatus) {
    let propostas = obterPropostas();
    let p = propostas.find(item => item.id === id);
    if (p) {
        p.status = novoStatus;
        salvarPropostas(propostas);
        carregarLista();
    }
}

function excluirProposta(id) {
    if (confirm('Deseja realmente excluir esta proposta?')) {
        let propostas = obterPropostas();
        propostas = propostas.filter(item => item.id !== id);
        salvarPropostas(propostas);
        carregarLista();
    }
}

// --- MODAL DE EDIÇÃO DE BENEFÍCIOS ---
function abrirModalEditar(id) {
    let propostas = obterPropostas();
    let p = propostas.find(item => item.id === id);
    if (!p) return;

    let conteudo = `
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-700">ID da Proposta</label>
                <input type="text" readonly value="${p.id}" class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-500">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-700">Entrada Padrão (%)</label>
                <input type="number" id="editEntrada" value="${p.entradaPadrao || 39}" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium text-slate-900 outline-none focus:border-blue-900">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-700">Juros Aplicados (%)</label>
                <input type="number" id="editJuros" value="${p.jurosAplicados || 6}" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium text-slate-900 outline-none focus:border-blue-900">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-slate-700">Desconto Pix Antecipado (%)</label>
                <input type="number" step="0.1" id="editDesconto" value="${p.descontoPix || 2.0}" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium text-slate-900 outline-none focus:border-blue-900">
            </div>
            <button onclick="salvarEdicaoProposta('${p.id}')" class="btn-primary w-full py-3 rounded-xl text-xs font-bold shadow-md mt-2">Salvar Alterações</button>
        </div>
    `;
    document.getElementById('conteudoModal').innerHTML = conteudo;
    document.getElementById('modalEditar').classList.add('active');
}

function fecharModal() {
    document.getElementById('modalEditar').classList.remove('active');
}

function salvarEdicaoProposta(id) {
    let propostas = obterPropostas();
    let p = propostas.find(item => item.id === id);
    if (p) {
        let entrada = parseFloat(document.getElementById('editEntrada').value) || 39;
        let juros = parseFloat(document.getElementById('editJuros').value) || 6;
        let desconto = parseFloat(document.getElementById('editDesconto').value) || 2.0;

        p.entradaPadrao = entrada;
        p.jurosAplicados = juros;
        p.descontoPix = desconto;

        let valorNum = parseFloat(p.valorSolicitado) || 0;
        let jurosDecimal = juros / 100;
        let totalComJuros = valorNum * (1 + jurosDecimal);
        let valorParcela = totalComJuros / (p.parcelasQtd || 12);

        p.totalComJuros = totalComJuros.toFixed(2);
        p.valorParcela = valorParcela.toFixed(2);

        salvarPropostas(propostas);
        fecharModal();
        carregarLista();
        alert('Configurações atualizadas com sucesso!');
    }
}

// --- MODAL DESPESAS ---
function abrirModalDespesa() {
    document.getElementById('modalDespesa').classList.add('active');
}

function fecharModalDespesa() {
    document.getElementById('modalDespesa').classList.remove('active');
}

function salvarDespesa() {
    let desc = document.getElementById('descDespesa').value;
    let valorStr = document.getElementById('valorDespesa').value;
    let valorNum = parseFloat(valorStr.replace(/\./g, '').replace(',', '.')) || 0;

    if (!desc || valorNum <= 0) {
        alert('Preencha a descrição e um valor válido para a despesa.');
        return;
    }

    let despesas = obterDespesas();
    despesas.push({
        id: Date.now(),
        descricao: desc,
        valor: valorNum,
        data: new Date().toLocaleDateString('pt-BR')
    });
    salvarDespesas(despesas);

    document.getElementById('descDespesa').value = '';
    document.getElementById('valorDespesa').value = '';
    fecharModalDespesa();
    carregarLista();
}
</script>
