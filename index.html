<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred - Simulação de Crédito</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #00ff88;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #00cc6a;
        }
        #resultado {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>FlashCred</h2>
        <form id="formSimulacao">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required>

            <label for="whatsapp">WhatsApp</label>
            <input type="text" id="whatsapp" placeholder="(00) 00000-0000" required>

            <label for="valor">Valor Desejado (R$)</label>
            <input type="number" id="valor" step="0.01" required>

            <button type="submit">Simular Empréstimo</button>
        </form>
        <div id="resultado"></div>
    </div>

    <script>
        // Suas chaves já configuradas automaticamente
        const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('formSimulacao').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const dataAtual = new Date().toISOString();

            const { data, error } = await _supabase
                .from('propostas')
                .upsert([
                    { 
                        cpf: cpf, 
                        nome: nome, 
                        whatsapp: whatsapp, 
                        valor_solicitado: valor,
                        status: 'pendente',
                        data: dataAtual,
                        entrada_paga: false
                    }
                ]);

            const resultadoDiv = document.getElementById('resultado');

            if (error) {
                console.error(error);
                resultadoDiv.style.color = '#ff4444';
                resultadoDiv.innerText = 'Erro ao salvar a simulação. Tente novamente.';
            } else {
                resultadoDiv.style.color = '#00ff88';
                resultadoDiv.innerText = 'Simulação enviada e salva com sucesso!';
                document.getElementById('formSimulacao').reset();
            }
        });
    </script>
</body>
</html>
