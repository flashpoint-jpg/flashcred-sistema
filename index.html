<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred - Crédito Facilitado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #111; padding: 16px; }
        .container { max-width: 520px; margin: 0 auto; background: #000; padding: 24px 20px; border-radius: 12px; border: 2px solid #FFCC00; }
        .cabecalho { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        h1 { color: #FFCC00; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .slogan { color: #FFCC00; font-size: 15px; font-weight: 500; }
        .abas { display: flex; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .aba { flex: 1; padding: 12px; text-align: center; color: #888; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; font-size: 14px; }
        .aba.ativa { color: #FFCC00; border-bottom-color: #FFCC00; }
        .conteudo-aba { display: none; }
        .conteudo-aba.ativo { display: block; }
        .campo { margin-bottom: 14px; }
        .campo-menor { max-width: 180px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #FFCC00; }
        input, select { width: 100%; padding: 11px 12px; border: 1px solid #FFCC00; border-radius: 8px; font-size: 15px; background: #111; color: #FFF; }
        input::placeholder { color: #888; }
        input:focus, select:focus { outline: none; border-color: #FFE066; box-shadow: 0 0 0 2px rgba(255,204,0,0.3); }
        .erro { color: #ff4d4d; font-size: 12px; margin-top: 3px; display: none; }
        .resultado { margin-top: 16px; padding: 16px; border-radius: 8px; display: none; }
        .resultado.analise { background: rgba(255,204,0,0.08); border: 1px solid #FFCC00; color: #FFCC00; }
        .resultado.reprovado { background: rgba(220,53,69,0.08); border: 1px solid #dc3545; color: #ff6b7a; }
        .resultado.aprovado { background: rgba(255,204,0,0.12); border: 1px solid #FFCC00; color: #FFF; }
        .resultado h3 { text-align: center; margin-bottom: 12px; font-size: 18px; }
        .detalhes { background: #111; padding: 12px; border-radius: 6px; margin: 10px 0; font-size: 14px; line-height: 1.8; }
        .detalhes p { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 4px 0; }
        .detalhes strong { color: #FFCC00; }
        .pix-area { margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; text-align: center; }
        .pix-codigo { background: #111; padding: 10px; border-radius: 6px; font-size: 12px; word-break: break-all; margin: 8px 0; color: #ddd; }
        button { width: 100%; padding: 13px; background: #FFCC00; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
        button:hover { background: #FFE066; }
        button.btn-copiar { padding: 10px; font-size: 14px; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="cabecalho">
        <h1>FlashCred</h1>
        <p class="slogan">Crédito facilitado porque nós confiamos em você</p>
    </div>

    <div class="abas">
        <div class="aba ativa" onclick="mudarAba('solicitar')">Solicitar Crédito</div>
        <div class="aba" onclick="mudarAba('consultar')">Consultar Solicitação</div>
    </div>

    <div id="aba-solicitar" class="conteudo-aba ativo">
        <form id="formCliente">
            <div class="campo"><label>Nome Completo:</label><input type="text" id="nome" required></div>
            <div class="campo"><label>CPF:</label><input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14"><div id="erroCpf" class="erro">CPF inválido!</div></div>
            <div class="campo"><label>Data de Nascimento:</label><input type="date" id="nascimento" required><div id="erroIdade" class="erro">É necessário ter mais de 17 anos!</div></div>
            <div class="campo"><label>CEP:</label><input type="text" id="cep" required placeholder="00000-000" maxlength="9"></div>
            <div class="campo"><label>Valor de Crédito Desejado (R$):</label><input type="number" id="valorCredito" step="0.01" required placeholder="Ex: 1500,00"></div>
            <div class="campo"><label>Renda Mensal (R$):</label><input type="number" id="renda" step="0.01" required placeholder="Ex: 1200,00"></div>
            <div class="campo"><label>Situação de Trabalho:</label><select id="trabalho" required><option value="">Selecione</option><option value="clt">CLT</option><option value="aposentado">Aposentado</option><option value="autonomo">Autônomo</option></select></div>
            <div class="campo"><label>Endereço:</label><input type="text" id="endereco" required readonly></div>
            <div class="campo campo-menor"><label>Número:</label><input type="text" id="numero" required></div>
            <div class="campo"><label>Bairro:</label><input type="text" id="bairro" required readonly></div>
            <div class="campo"><label>Cidade:</label><input type="text" id="cidade" required readonly></div>
            <div class="campo"><label>Número do WhatsApp:</label><input type="text" id="whatsapp" required placeholder="(00) 00000-0000" maxlength="16"></div>
            <button type="submit">Enviar Solicitação</button>
        </form>
    </div>

    <div id="aba-consultar" class="conteudo-aba">
        <form id="formConsulta">
            <div class="campo"><label>Digite seu CPF para consultar:</label><input type="text" id="cpfConsulta" required placeholder="000.000.000-00" maxlength="14"></div>
            <button type="submit">Verificar Status</button>
        </form>
        <div id="resultadoConsulta" class="resultado"></div>
    </div>
</div>

<script>
    const CHAVE_PIX = '3552949852';

    function mudarAba(aba) {
        document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
        document.querySelectorAll('.conteudo-aba').forEach(c => c.classList.remove('ativo'));
        event.target.classList.add('ativa');
        document.getElementById(`aba-${aba}`).classList.add('ativo');
        document.getElementById('resultadoConsulta').style.display = 'none';
    }

    function aplicarMascaraCpf(cpfInput) {
        cpfInput.addEventListener('input', e => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0,11);
            v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v;
        });
    }
    aplicarMascaraCpf(document.getElementById('cpf'));
    aplicarMascaraCpf(document.getElementById('cpfConsulta'));

    function validarCPF(cpf) {
        cpf = cpf.replace(/\D/g, '');
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
        let soma = 0;
        for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
        let dig1 = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        soma = 0;
        for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
        let dig2 = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        return dig1 === parseInt(cpf.charAt(9)) && dig2 === parseInt(cpf.charAt(10));
    }

    document.getElementById('cpf').addEventListener('blur', function() {
        document.getElementById('erroCpf').style.display = validarCPF(this.value) ? 'none' : 'block';
    });

    document.getElementById('nascimento').addEventListener('change', function() {
        const nasc = new Date(this.value), hoje = new Date();
        let idade = hoje.getFullYear() - nasc.getFullYear();
        const m = hoje.getMonth() - nasc.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
        document.getElementById('erroIdade').style.display = idade >= 18 ? 'none' : 'block';
    });

    document.getElementById('cep').addEventListener('blur', function() {
        let cep = this.value.replace(/\D/g, '');
        if (cep.length === 8) {
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(res => res.json())
            .then(dados => {
                if (!dados.erro) {
                    document.getElementById('endereco').value = dados.logradouro || '';
                    document.getElementById('bairro').value = dados.bairro || '';
                    document.getElementById('cidade').value = dados.localidade || '';
                }
            });
        }
    });
    document.getElementById('cep').addEventListener('input', e => {
        let v = e.target.value.replace(/\D/g, '');
        if (v.length > 8) v = v.slice(0,8);
        e.target.value = v.replace(/(\d{5})(\d)/, '$1-$2');
    });

    document.getElementById('formCliente').addEventListener('submit', e => {
        e.preventDefault();
        if (!validarCPF(document.getElementById('cpf').value)) return alert('Informe um CPF válido!');
        const nasc = new Date(document.getElementById('nascimento').value), hoje = new Date();
        let idade = hoje.getFullYear() - nasc.getFullYear();
        const m = hoje.getMonth() - nasc.getMonth();
        if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
        if (idade < 18) return alert('É necessário ter mais de 17 anos!');

        const solicitacao = {
            cpf: document.getElementById('cpf').value.replace(/\D/g,''),
            nome: document.getElementById('nome').value,
            valorSolicitado: parseFloat(document.getElementById('valorCredito').value),
            renda: parseFloat(document.getElementById('renda').value),
            status: 'em_analise',
            data: new Date().toLocaleDateString('pt-BR'),
            detalhes: {}
        };
        localStorage.setItem(`flashcred_${solicitacao.cpf}`, JSON.stringify(solicitacao));
        alert('Solicitação enviada! Nós definiremos os valores e o sistema calcula tudo automaticamente.');
        e.target.reset();
    });

    document.getElementById('formConsulta').addEventListener('submit', e => {
        e.preventDefault();
        const cpf = document.getElementById('cpfConsulta').value.replace(/\D/g,'');
        const resultado = document.getElementById('resultadoConsulta');
        resultado.style.display = 'none';
        if (!validarCPF(cpf)) return alert('Informe um CPF válido!');

        const dados = JSON.parse(localStorage.getItem(`flashcred_${cpf}`) || 'null');
        
        if (!dados) {
            resultado.className = 'resultado analise';
            resultado.innerHTML = `<h3>Solicitação não encontrada</h3><p style="text-align:center;">Não localizamos nenhum pedido com este CPF.</p>`;
        } else if (dados.status === 'em_analise') {
            resultado.className = 'resultado analise';
            resultado.innerHTML = `<h3>⏳ EM ANÁLISE</h3><p style="text-align:center;">Recebemos sua solicitação em ${dados.data}. Assim que aprovado, os valores são calculados automaticamente.</p>`;
        } else if (dados.status === 'reprovado') {
            resultado.className = 'resultado reprovado';
            resultado.innerHTML = `<h3>❌ CRÉDITO REPROVADO</h3><p style="text-align:center;">Infelizmente não foi possível aprovar no momento.</p>`;
        } else if (dados.status === 'aprovado') {
            resultado.className = 'resultado aprovado';
            const d = dados.detalhes;
            const codigoPix = `00020126580014BR.GOV.BCB.PIX0136${CHAVE_PIX}0214FlashCred+Pagamento5204000053039865802BR5925FlashCred+Móveis6009Santo+André62070503***6304${Math.random().toString(36).substring(2,10).toUpperCase()}`;
            
            resultado.innerHTML = `
                <h3>✅ CRÉDITO APROVADO!</h3>
                <div class="detalhes">
                    <p><span>Valor Liberado:</span> <strong>R$ ${parseFloat(d.valorLiberado||0).toFixed(2)}</strong></p>
                    <p><span>% de Entrada:</span> <strong>${d.percEntrada||0}%</strong></p>
                    <p><span>Valor da Entrada:</span> <strong>R$ ${parseFloat(d.valorEntrada||0).toFixed(2)}</strong></p>
                    <p><span>Quantidade de Parcelas:</span> <strong>${d.qtdParcelas||0}x</strong></p>
                    <p><span>% de Juros:</span> <strong>${d.percJuros||0}% ao mês</strong></p>
                    <p><span>Valor da Parcela:</span> <strong>R$ ${parseFloat(d.valorParcela||0).toFixed(2)}</strong></p>
                    <p><span>Total com Juros:</span> <strong>R$ ${parseFloat(d.totalFinal||0).toFixed(2)}</strong></p>
                </div>
                <div class="pix-area">
                    <p>Pague a entrada para liberar seu crédito:</p>
                    <div class="pix-codigo" id="codigoPix">${codigoPix}</div>
                    <button type="button" class="btn-copiar" onclick="navigator.clipboard.writeText('${codigoPix}'); alert('Código Pix copiado!')">Copiar Código Pix</button>
                </div>
            `;
        }
        resultado.style.display = 'block';
    });

    // FUNÇÃO PARA VOCÊ USAR NA HORA DE APROVAR:
    function aprovarCredito(cpf, valorLiberado, percEntrada, percJuros, qtdParcelas) {
        const valorEntrada = valorLiberado * (percEntrada / 100);
        const saldo = valorLiberado - valorEntrada;
        const totalFinal = saldo * (1 + (percJuros / 100) * qtdParcelas);
        const valorParcela = totalFinal / qtdParcelas;

        const solicitacao = JSON.parse(localStorage.getItem(`flashcred_${cpf.replace(/\D/g,'')}`));
        solicitacao.status = 'aprovado';
        solicitacao.detalhes = {
            valorLiberado, percEntrada, valorEntrada, qtdParcelas, percJuros, valorParcela, totalFinal
        };
        localStorage.setItem(`flashcred_${cpf.replace(/\D/g,'')}`, JSON.stringify(solicitacao));
        alert('Crédito aprovado! Os valores foram calculados automaticamente.');
    }
</script>

</body>
</html>
