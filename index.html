<script>
    function carregarPainelAdmin() {
        if (!adminLogado) return;

        const lista = document.getElementById('lista-admin');
        lista.innerHTML = '';

        let totalAprovadoVendas = 0;

        if (listaClientes.length === 0) {
            lista.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-500 text-sm border border-slate-200">Nenhuma proposta cadastrada.</div>`;
            document.getElementById('fin-entradas').innerText = `R$ 0,00`;
            document.getElementById('fin-balanco').innerText = `R$ 0,00`;
            return;
        }

        listaClientes.forEach(cliente => {
            if (cliente.status === 'aprovado') {
                totalAprovadoVendas += cliente.limite || 0;
            }

            if (cliente.valorEntrada === undefined) cliente.valorEntrada = (cliente.limite || 1000) * 0.10;
            if (cliente.porcentagemEntrada === undefined) cliente.porcentagemEntrada = 10;
            if (cliente.parcelas === undefined) cliente.parcelas = 1;
            if (cliente.jurosParcelamento === undefined) cliente.jurosParcelamento = 0;

            let semaforoBg = 'bg-amber-500';
            if (cliente.status === 'aprovado') {
                semaforoBg = 'bg-emerald-500';
            } else if (cliente.status === 'cancelado') {
                semaforoBg = 'bg-rose-500';
            }

            const card = document.createElement('div');
            card.className = "bg-white border border-slate-200 p-5 rounded-2xl shadow-sm space-y-4";
            card.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-100 pb-3">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="w-3.5 h-3.5 rounded-full ${semaforoBg} inline-block shadow-sm"></span>
                        <span class="bg-slate-100 text-slate-800 text-xs font-bold px-2 py-0.5 rounded">${cliente.protocolo}</span>
                        <span class="text-xs text-slate-500 font-semibold">Status: <strong>${cliente.status}</strong></span>
                        <span class="text-xs text-slate-600 font-semibold">Entrada: <strong class="${cliente.entradaPaga ? 'text-emerald-600' : 'text-amber-600'}">${cliente.entradaPaga ? '🟢 Paga' : '🟡 Pendente'}</strong></span>
                    </div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <button onclick="gerarPixViaAPI(${cliente.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer" title="Aprovar e Gerar Pix via API">Aprovar + Pix API</button>
                        <button onclick="mudarStatus(${cliente.id}, 'cancelado')" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer">Reprovar</button>
                        <button onclick="toggleEntradaPaga(${cliente.id})" class="bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer">Entrada Paga</button>
                        <button onclick="excluirCliente(${cliente.id})" class="bg-slate-700 hover:bg-slate-800 text-white px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>

                <!-- DADOS CADASTRAIS EDITÁVEIS (Nome, CPF, WhatsApp) -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Nome do Cliente</label>
                        <input type="text" id="nome-${cliente.id}" value="${cliente.nome || ''}" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-900 w-full focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">CPF</label>
                        <input type="text" id="cpf-${cliente.id}" value="${cliente.cpf || ''}" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-900 w-full focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">WhatsApp</label>
                        <input type="text" id="whatsapp-${cliente.id}" value="${cliente.whatsapp || ''}" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-900 w-full focus:outline-none focus:border-emerald-600">
                    </div>
                </div>

                <!-- VALORES, PARCELAS E JUROS EDITÁVEIS -->
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200 items-end">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Limite Total (R$)</label>
                        <input type="number" step="0.01" id="limite-${cliente.id}" value="${cliente.limite}" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-900 w-full focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Valor Entrada (R$)</label>
                        <input type="number" step="0.01" id="valorentrada-${cliente.id}" value="${cliente.valorEntrada}" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-900 w-full focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Entrada (%)</label>
                        <input type="number" step="0.1" id="porcentagem-${cliente.id}" value="${cliente.porcentagemEntrada}" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-900 w-full focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Parcelas</label>
                        <input type="number" min="1" max="24" id="parcelas-${cliente.id}" value="${cliente.parcelas}" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-900 w-full focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Juros (%)</label>
                        <input type="number" step="0.1" id="juros-${cliente.id}" value="${cliente.jurosParcelamento}" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-900 w-full focus:outline-none focus:border-emerald-600">
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row items-center justify-between gap-2 pt-1">
                    <button onclick="salvarEdicoes(${cliente.id})" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold transition cursor-pointer">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> Salvar Todas as Alterações
                    </button>
                    <div class="flex items-center gap-2">
                        <a href="https://wa.me/55${cliente.whatsapp.replace(/\D/g, '')}?text=Olá%20${cliente.nome},%20sobre%20seu%20limite%20Pix..." target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                            <i class="fa-brands fa-whatsapp"></i> WhatsApp
                        </a>
                    </div>
                </div>
            `;
            lista.appendChild(card);
        });

        document.getElementById('fin-entradas').innerText = `R$ ${totalAprovadoVendas.toFixed(2)}`;
        document.getElementById('fin-balanco').innerText = `R$ ${totalAprovadoVendas.toFixed(2)}`;
    }

    function salvarEdicoes(id) {
        const novoNome = document.getElementById('nome-' + id).value;
        const novoCpf = document.getElementById('cpf-' + id).value;
        const novoWhatsapp = document.getElementById('whatsapp-' + id).value;
        const novoLimite = parseFloat(document.getElementById('limite-' + id).value) || 0;
        const novoValorEntrada = parseFloat(document.getElementById('valorentrada-' + id).value) || 0;
        const novaPorcentagem = parseFloat(document.getElementById('porcentagem-' + id).value) || 0;
        const novasParcelas = parseInt(document.getElementById('parcelas-' + id).value) || 1;
        const novosJuros = parseFloat(document.getElementById('juros-' + id).value) || 0;

        const cliente = listaClientes.find(c => c.id === id);
        if (cliente) {
            cliente.nome = novoNome;
            cliente.cpf = novoCpf;
            cliente.whatsapp = novoWhatsapp;
            cliente.limite = novoLimite;
            cliente.valorEntrada = novoValorEntrada;
            cliente.porcentagemEntrada = novaPorcentagem;
            cliente.parcelas = novasParcelas;
            cliente.jurosParcelamento = novosJuros;
            
            salvarDadosLocal();
            carregarPainelAdmin();
            alert('Proposta atualizada e salva com sucesso!');
        }
    }
</script>
