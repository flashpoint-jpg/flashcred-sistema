<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Flash Point - Sistema FlashCred Completo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        const CONFIG = {
            SUPABASE_URL: 'https://rgcclordmqmwuzrrfbd.supabase.co',
            SUPABASE_ANON_KEY: 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi',
            CHAVE_PIX_RECEBIMENTO: '33552949852',
            NOME_RECEBEDOR: 'DISTRIBUIDORA FLASH POINT',
            CIDADE_RECEBEDOR: 'SAO PAULO',
            WHATSAPP_CONTATO: '5511973294235'
        };

        let listaClientes = [];
        let adminLogado = localStorage.getItem('flash_admin_logado') === 'true';

        // Algoritmo CRC16 Oficial para o Pix
        function calcularCRC16(payload) {
            let polinomio = 0x1021;
            let resultado = 0xFFFF;
            for (let i = 0; i < payload.length; i++) {
                resultado ^= (payload.charCodeAt(i) << 8);
                for (let j = 0; j < 8; j++) {
                    if ((resultado & 0x8000) !== 0) {
                        resultado = ((resultado << 1) ^ polinomio) & 0xFFFF;
                    } else {
                        resultado = (resultado << 1) & 0xFFFF;
                    }
                }
            }
            return resultado.toString(16).toUpperCase().padStart(4, '0');
        }

        function gerarPayloadPix(valor, chave, nome, cidade, txid = '***') {
            function formatField(id, value) {
                const len = value.length.toString().padStart(2, '0');
                return id + len + value;
            }

            const gui = formatField('00', 'br.gov.bcb.pix');
            const chaveField = formatField('01', chave);
            const merchantAccount = formatField('26', gui + chaveField);
            
            const mcc = formatField('52', '0000');
            const moeda = formatField('53', '986');
            const valorStr = formatField('54', valor.toFixed(2));
            const pais = formatField('58', 'BR');
            const nomeField = formatField('59', nome.substring(0, 25));
            const cidadeField = formatField('60', cidade.substring(0, 15));
            const additionalData = formatField('62', formatField('05', txid));

            let payload = 
                formatField('01', '12') + 
                merchantAccount + 
                mcc + 
                moeda + 
                valorStr + 
                pais + 
                nomeField + 
                cidadeField + 
                additionalData + 
                '6304';

            const crc = calcularCRC16(payload);
            return payload + crc;
        }

        async function carregarDadosDoBanco() {
            try {
                const response = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/propostas?select=*&order=id.desc`, {
                    headers: {
                        'apikey': CONFIG.SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    listaClientes = data;
                }
            } catch (e) {
                console.warn('Erro ao carregar dados do banco.');
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosDoBanco();

            const hashAtual = window.location.hash.replace('#', '');
            const abaSalva = hashAtual || 'solicitar';
            switchTab(abaSalva, false);
            if (adminLogado && abaSalva === 'painel') {
                renderizarPainelAdmin();
            }
        });

        function switchTab(tabId, atualizarUrl = true) {
            if (atualizarUrl) window.location.hash = tabId;

            if (tabId === 'painel' && !adminLogado) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
                const elLogin = document.getElementById('tab-login-admin');
                if (elLogin) elLogin.classList.remove('hidden');
                atualizarBotoesNav('painel');
                return;
            }

            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const abaAlvo = document.getElementById('tab-' + tabId);
            if (abaAlvo) abaAlvo.classList.remove('hidden');
            atualizarBotoesNav(tabId);

            if (tabId === 'painel' && adminLogado) {
                renderizarPainelAdmin();
            }
        }

        function atualizarBotoesNav(tabId) {
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-blue-950', 'text-white', 'shadow-lg');
                el.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            const btn = document.getElementById('btn-' + tabId);
            if (btn) {
                btn.classList.remove('text-slate-600', 'hover:bg-slate-100');
                btn.classList.add('bg-blue-950', 'text-white', 'shadow-lg');
            }
        }

        function verificarSenhaAdmin(event) {
            event.preventDefault();
            const senha = document.getElementById('senha-admin').value;
            if (senha === 'flash@2026') {
                adminLogado = true;
                localStorage.setItem('flash_admin_logado', 'true');
                document.getElementById('senha-admin').value = '';
                document.getElementById('erro-senha').classList.add('hidden');
                switchTab('painel');
            } else {
                document.getElementById('erro-senha').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            adminLogado = false;
            localStorage.removeItem('flash_admin_logado');
            switchTab('solicitar');
        }

        async function consultarCEP(cep) {
            const cepLimpo = cep.replace(/\D/g, '');
            if (cepLimpo.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                    const data = await response.json();
                    if (!data.erro) {
                        const logradouro = data.logradouro ? data.logradouro + ', ' : '';
                        const elEnd = document.getElementById('endereco');
                        if (elEnd) elEnd.value = `${logradouro}Bairro: ${data.bairro || ''} - ${data.localidade}/${data.uf}`;
                    }
                } catch (e) {
                    console.error('Erro ao buscar CEP');
                }
            }
        }

        async function enviarProposta(event) {
            event.preventDefault();
            const valor = parseFloat(document.getElementById('valor').value) || 1500;
            const protocolo = 'FP-' + Math.floor(100000 + Math.random() * 900000);
            const valorEntradaCalc = valor * 0.10;

            const pixGerado = gerarPayloadPix(
                valorEntradaCalc, 
                CONFIG.CHAVE_PIX_RECEBIMENTO, 
                CONFIG.NOME_RECEBEDOR, 
                CONFIG.CIDADE_RECEBEDOR, 
                protocolo
            );

            const novaProposta = {
                protocolo: protocolo,
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                whatsapp: document.getElementById('whatsapp').value,
                cep: document.getElementById('cep').value,
                endereco: document.getElementById('endereco').value,
                limite: valor,
                valorEntrada: valorEntradaCalc,
                status: 'analise',
                entradaPaga: false,
                pixCopiaECola: pixGerado
            };

            try {
                const response = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/propostas`, {
                    method: 'POST',
                    headers: {
                        'apikey': CONFIG.SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(novaProposta)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    alert('Erro ao salvar no banco: ' + errText);
                    return;
                }
            } catch (err) {
                alert('Erro de conexão: ' + err.message);
                return;
            }

            await carregarDadosDoBanco();
            alert('Solicitação enviada com sucesso! Seu protocolo é: ' + protocolo);
            document.getElementById('form-proposta').reset();
            switchTab('acompanhar');
            document.getElementById('busca-cpf').value = protocolo;
            consultarProposta();
        }

        async function consultarProposta(silencioso = false) {
            const termo = document.getElementById('busca-cpf').value.trim();
            const resultadoDiv = document.getElementById('resultado-busca');
            if (!termo) {
                if (!silencioso) alert('Digite o CPF ou Protocolo para buscar.');
                return;
            }

            await carregarDadosDoBanco();
            const cliente = listaClientes.find(c => c.cpf === termo || c.protocolo === termo);

            if (!cliente) {
                resultadoDiv.innerHTML = `<div class="p-4 bg-amber-50 text-amber-700 rounded-xl text-center text-sm font-bold">Nenhuma proposta encontrada.</div>`;
                resultadoDiv.classList.remove('hidden');
                return;
            }

            let badgeStatus = '';
            if (cliente.status === 'analise') badgeStatus = `<span class="px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-bold">Em Análise</span>`;
            if (cliente.status === 'aprovado') badgeStatus = `<span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">Aprovado / Liberado</span>`;
            if (cliente.status === 'reprovado') badgeStatus = `<span class="px-3 py-1 bg-rose-100 text-rose-800 rounded-full text-xs font-bold">Reprovado</span>`;

            resultadoDiv.innerHTML = `
                <div class="p-6 bg-slate-50 border border-slate-200 rounded-2xl space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-black text-slate-500">Protocolo: ${cliente.protocolo}</span>
                        ${badgeStatus}
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 text-base">${cliente.nome}</h4>
                        <p class="text-xs text-slate-500">CPF: ${cliente.cpf} | WhatsApp: ${cliente.whatsapp}</p>
                    </div>
                    <div class="p-4 bg-white border border-slate-100 rounded-xl space-y-2">
                        <div class="flex justify-between text-xs font-medium"><span class="text-slate-500">Crédito Solicitado:</span><span class="font-bold text-slate-800">R$ ${(cliente.limite || 0).toFixed(2)}</span></div>
                        <div class="flex justify-between text-xs font-medium"><span class="text-slate-500">Valor da Entrada:</span><span class="font-bold text-blue-600">R$ ${(cliente.valorEntrada || 0).toFixed(2)}</span></div>
                        <div class="flex justify-between text-xs font-medium"><span class="text-slate-500">Status do Pagamento:</span><span class="font-bold ${cliente.entradaPaga ? 'text-emerald-600' : 'text-amber-600'}">${cliente.entradaPaga ? 'Confirmado' : 'Pendente'}</span></div>
                    </div>
                    ${cliente.status === 'aprovado' && !cliente.entradaPaga ? `
                        <div class="p-4 bg-blue-50 border border-blue-100 rounded-xl space-y-3 text-center">
                            <p class="text-xs font-bold text-blue-900">Proposta Aprovada! Copie o Pix abaixo:</p>
                            <div class="bg-white p-3 rounded border text-xs font-mono break-all text-slate-600">${cliente.pixCopiaECola}</div>
                            <button onclick="copiarPix('${cliente.pixCopiaECola}')" class="w-full py-2 bg-blue-600 text-white rounded-lg text-xs font-bold shadow hover:bg-blue-700">Copiar Código Pix</button>
                        </div>
                    ` : ''}
                </div>
            `;
            resultadoDiv.classList.remove('hidden');
        }

        function copiarPix(texto) {
            navigator.clipboard.writeText(texto);
            alert('Código Pix copiado com sucesso!');
        }

        async function alterarStatusAdmin(id, novoStatus) {
            try {
                const response = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/propostas?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': CONFIG.SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ status: novoStatus })
                });
                if (!response.ok) {
                    alert('Erro ao atualizar status.');
                    return;
                }
            } catch (e) {
                alert('Erro de conexão.');
                return;
            }
            await carregarDadosDoBanco();
            renderizarPainelAdmin();
            alert('Status atualizado com sucesso!');
        }

        async function marcarPagoAdmin(id) {
            try {
                const response = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/propostas?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': CONFIG.SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ entradaPaga: true, status: 'aprovado' })
                });
                if (!response.ok) {
                    alert('Erro ao confirmar pagamento.');
                    return;
                }
            } catch (e) {
                alert('Erro de conexão.');
                return;
            }
            await carregarDadosDoBanco();
            renderizarPainelAdmin();
            alert('Pagamento confirmado com sucesso!');
        }

        async function excluirPropostaAdmin(id) {
            if (!confirm('Deseja excluir esta proposta?')) return;
            try {
                await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/propostas?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': CONFIG.SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`
                    }
                });
            } catch (e) {
                console.error(e);
            }
            await carregarDadosDoBanco();
            renderizarPainelAdmin();
        }

        function renderizarPainelAdmin() {
            const container = document.getElementById('lista-propostas-admin');
            if (!container) return;

            if (listaClientes.length === 0) {
                container.innerHTML = `<div class="p-8 text-center bg-slate-50 rounded-2xl text-slate-500 text-xs">Nenhuma proposta registrada na nuvem.</div>`;
                return;
            }

            let html = '';
            listaClientes.forEach(c => {
                html += `
                    <div class="p-5 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-blue-600">Protocolo: ${c.protocolo}</span>
                            <span class="text-xs font-bold uppercase px-2 py-0.5 rounded bg-slate-100 text-slate-700">${c.status}</span>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-800 text-sm">${c.nome}</h4>
                            <p class="text-xs text-slate-500">CPF: ${c.cpf} | WhatsApp: ${c.whatsapp} | Entrada: R$ ${(c.valorEntrada || 0).toFixed(2)}</p>
                        </div>
                        <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
                            <button onclick="alterarStatusAdmin(${c.id}, 'aprovado')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-700">Aprovar Proposta</button>
                            <button onclick="marcarPagoAdmin(${c.id})" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700">Confirmar Pagamento</button>
                            <button onclick="alterarStatusAdmin(${c.id}, 'reprovado')" class="px-3 py-1.5 bg-amber-600 text-white rounded-lg text-xs font-bold hover:bg-amber-700">Reprovar</button>
                            <button onclick="excluirPropostaAdmin(${c.id})" class="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-xs font-bold hover:bg-rose-700">Excluir</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4">
    <div class="max-w-3xl mx-auto space-y-6">
        <!-- Menu de Navegação -->
        <div class="bg-white p-2 rounded-2xl shadow-sm flex justify-around gap-2">
            <button id="btn-solicitar" onclick="switchTab('solicitar')" class="tab-btn flex-1 py-2 text-xs font-bold rounded-xl transition">Solicitar Crédito</button>
            <button id="btn-acompanhar" onclick="switchTab('acompanhar')" class="tab-btn flex-1 py-2 text-xs font-bold rounded-xl transition">Acompanhar Pedido</button>
            <button id="btn-painel" onclick="switchTab('painel')" class="tab-btn flex-1 py-2 text-xs font-bold rounded-xl transition">Painel Admin</button>
        </div>

        <!-- Aba Solicitar -->
        <div id="tab-solicitar" class="tab-content bg-white p-6 rounded-2xl shadow-sm space-y-4">
            <h2 class="text-lg font-black text-slate-800 text-center">Distribuidora Flash Point</h2>
            <form id="form-proposta" onsubmit="enviarProposta(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nome Completo</label>
                    <input type="text" id="nome" required class="w-full p-3 border border-slate-200 rounded-xl text-sm" placeholder="Seu nome completo">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">CPF</label>
                        <input type="text" id="cpf" required class="w-full p-3 border border-slate-200 rounded-xl text-sm" placeholder="000.000.000-00">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">WhatsApp</label>
                        <input type="text" id="whatsapp" required class="w-full p-3 border border-slate-200 rounded-xl text-sm" placeholder="(00) 00000-0000">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">CEP</label>
                        <input type="text" id="cep" onblur="consultarCEP(this.value)" required class="w-full p-3 border border-slate-200 rounded-xl text-sm" placeholder="00000-000">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Valor Desejado (R$)</label>
                        <input type="number" id="valor" value="1500" required class="w-full p-3 border border-slate-200 rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Endereço Completo</label>
                    <input type="text" id="endereco" required class="w-full p-3 border border-slate-200 rounded-xl text-sm" placeholder="Rua, número, bairro, cidade">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-950 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-blue-900">Enviar Proposta</button>
            </form>
        </div>

        <!-- Aba Acompanhar -->
        <div id="tab-acompanhar" class="tab-content hidden bg-white p-6 rounded-2xl shadow-sm space-y-4">
            <h2 class="text-lg font-black text-slate-800 text-center">Consultar Proposta</h2>
            <div class="flex gap-2">
                <input type="text" id="busca-cpf" placeholder="Digite seu CPF ou Protocolo" class="w-full p-3 border border-slate-200 rounded-xl text-sm">
                <button onclick="consultarProposta()" class="px-5 py-3 bg-blue-950 text-white rounded-xl text-sm font-bold shadow">Buscar</button>
            </div>
            <div id="resultado-busca" class="hidden"></div>
        </div>

        <!-- Login Admin -->
        <div id="tab-login-admin" class="tab-content hidden bg-white p-6 rounded-2xl shadow-sm space-y-4 text-center">
            <h2 class="text-lg font-black text-slate-800">Acesso Restrito ao Gestor</h2>
            <form onsubmit="verificarSenhaAdmin(event)" class="space-y-4 max-w-sm mx-auto">
                <input type="password" id="senha-admin" placeholder="Senha de acesso" required class="w-full p-3 border border-slate-200 rounded-xl text-sm">
                <p id="erro-senha" class="hidden text-xs font-bold text-rose-600">Senha incorreta!</p>
                <button type="submit" class="w-full py-3 bg-blue-950 text-white rounded-xl text-sm font-bold shadow">Entrar no Painel</button>
            </form>
        </div>

        <!-- Painel Admin -->
        <div id="tab-painel" class="tab-content hidden bg-white p-6 rounded-2xl shadow-sm space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-black text-slate-800">Painel de Gestão</h2>
                <button onclick="logoutAdmin()" class="px-3 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold">Sair</button>
            </div>
            <div id="lista-propostas-admin" class="space-y-4"></div>
        </div>
    </div>
</body>
</html>
