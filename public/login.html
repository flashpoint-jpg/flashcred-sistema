<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Flashpoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    primary: '#C8102E',
                    primaryDark: '#A00D25',
                    fundo: '#F8FAFC'
                }
            }
        }
    </script>
    <style>
        * { font-family: Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #C8102E 0%, #9B0000 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 1rem;
        }
        .card-login { 
            background: white; 
            border-radius: 1.25rem; 
            padding: 2rem; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.2); 
        }
        .titulo { 
            font-size: 1.5rem; 
            font-weight: 700; 
            color: #C8102E; 
            text-align: center; 
            margin-bottom: 0.5rem; 
        }
        .subtitulo { 
            text-align: center; 
            color: #64748B; 
            margin-bottom: 1.5rem; 
            font-size: 0.9rem; 
        }
        .input { 
            width: 100%; 
            padding: 0.875rem; 
            border: 1px solid #CBD5E1; 
            border-radius: 0.75rem; 
            font-size: 1rem; 
            outline: none; 
            margin-bottom: 1rem; 
        }
        .input:focus { 
            border-color: #C8102E; 
            box-shadow: 0 0 0 3px rgba(200,16,46,0.1); 
        }
        .btn-entrar { 
            width: 100%; 
            padding: 0.875rem; 
            background: #C8102E; 
            color: white; 
            border: none; 
            border-radius: 0.75rem; 
            font-weight: 600; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .btn-entrar:hover { background: #A00D25; }
        .erro { 
            color: #EF4444; 
            text-align: center; 
            margin-top: 0.75rem; 
            display: none; 
            font-size: 0.9rem; 
        }
    </style>
</head>
<body>
    <div class="card-login">
        <div class="text-center mb-4">
            <h1 class="titulo">📦 FLASHPOINT</h1>
            <p class="subtitulo">Sistema de Crediário — Acesso Restrito</p>
        </div>

        <form id="formLogin">
            <input type="text" id="usuario" class="input" placeholder="Usuário" required>
            <input type="password" id="senha" class="input" placeholder="Senha" required>
            <button type="submit" class="btn-entrar">🔑 Entrar no Sistema</button>
            <div class="erro" id="msgErro">Usuário ou senha incorretos!</div>
        </form>
    </div>

<script>
// ✅ ALTERE AQUI SEUS DADOS DE ACESSO QUANDO QUISER
const USUARIO_PERMITIDO = "felipe.flashpoint";
const SENHA_PERMITIDA = "flashpoint@2026";

// Se já estiver logado, vai direto para o painel
if(sessionStorage.getItem('logadoFlashpoint') === 'sim'){
    window.location.href = 'index.html';
}

document.getElementById('formLogin').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = document.getElementById('usuario').value.trim();
    const pass = document.getElementById('senha').value.trim();
    
    if(user === USUARIO_PERMITIDO && pass === SENHA_PERMITIDA){
        sessionStorage.setItem('logadoFlashpoint', 'sim');
        sessionStorage.setItem('usuarioLogado', user);
        window.location.href = 'index.html';
    } else {
        document.getElementById('msgErro').style.display = 'block';
        document.getElementById('senha').value = '';
    }
});
</script>
</body>
</html>
