<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FlashCred - Painel Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        fundo: '#F8FAFC',
                    }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #0A2463 0%, #051438 100%); min-height: 100vh; }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-primary">FlashCred</h1>
            <p class="text-gray-500">Acesso ao Painel Administrativo</p>
        </div>

        <div id="avisoErro" class="hidden bg-red-50 text-red-700 p-3 rounded-xl mb-4 text-sm text-center"></div>

        <form id="formLogin" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Usuário</label>
                <input type="text" id="usuario" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none" placeholder="Digite seu usuário" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Senha</label>
                <input type="password" id="senha" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" id="btnEntrar" class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3 rounded-xl transition-all">
                Entrar
            </button>
        </form>
    </div>

    <script>
        // 🔐 DADOS DE ACESSO - ALTERE AQUI SE QUISER
        const USUARIO_CORRETO = 'admin';
        const SENHA_CORRETA = 'flashcred2026';

        // Se já estiver logado, vai direto para o painel
        if(localStorage.getItem('logado_flashcred') === 'sim') {
            window.location.href = '/painel';
        }

        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const aviso = document.getElementById('avisoErro');
            const btn = document.getElementById('btnEntrar');

            aviso.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Verificando...';

            setTimeout(() => {
                if(usuario === USUARIO_CORRETO && senha === SENHA_CORRETA) {
                    localStorage.setItem('logado_flashcred', 'sim');
                    window.location.href = '/painel';
                } else {
                    aviso.textContent = 'Usuário ou senha incorretos!';
                    aviso.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                }
            }, 800);
        });
    </script>
</body>
</html>
