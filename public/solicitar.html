<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Crediário - Flashpoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C8102E',
                        primaryDark: '#A00D25',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        .card { @apply bg-white rounded-2xl shadow-lg p-6; }
        .input { @apply w-full p-3 border border-gray-200 rounded-xl outline-none transition-all focus:ring-2 focus:ring-primary/30 focus:border-primary; }
        .btn { @apply w-full py-3 rounded-xl font-bold transition-all; }
        .btn-primary { @apply bg-primary hover:bg-primaryDark text-white; }
    </style>
</head>
<body class="bg-fundo min-h-screen p-4">
    <div class="max-w-lg mx-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-primary">🛋️ FLASHPOINT DISTRIBUIDORA</h1>
            <p class="text-gray-600 mt-1">Solicitação de Crediário</p>
        </div>

        <div class="card">
            <form id="formProposta">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                        <input type="text" id="nome" class="input" required placeholder="Digite seu nome completo">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
                        <input type="text" id="cpf" class="input" required placeholder="000.000.000-00" maxlength="14">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Data de Nascimento</label>
                        <input type="date" id="nascimento" class="input" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp com DDD</label>
                        <input type="text" id="whatsapp" class="input" required placeholder="(11) 99999-9999" maxlength="15">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Endereço Completo</label>
                        <input type="text" id="endereco" class="input" required placeholder="Rua, Número, Bairro">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">CEP</label>
                            <input type="text" id="cep" class="input" required placeholder="00000-000" maxlength="9">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Valor da Compra</label>
                            <input type="number" id="valor" class="input" required placeholder="R$ 0,00" min="50">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary mt-6">Enviar Solicitação</button>
                <p id="mensagem" class="text-center text-sm mt-4 hidden"></p>
            </form>
        </div>
    </div>

    <script>
        // Valida CPF
        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
            let soma = 0, resto;
            for (let i = 1; i <= 9; i++) soma += parseInt(cpf[i-1]) * (11 - i);
            resto = (soma * 10) % 11;
            if ([10,11].includes(resto)) resto = 0;
            if (resto !== parseInt(cpf[9])) return false;
            soma = 0;
            for (let i = 1; i <= 10; i++) soma += parseInt(cpf[i-1]) * (12 - i);
            resto = (soma * 10) % 11;
            if ([10,11].includes(resto)) resto = 0;
            return resto === parseInt(cpf[10]);
        }

        // Valida idade mínima ≥17 anos
        function validarIdade(dataNasc) {
            if (!dataNasc) return false;
            const nasc = new Date(dataNasc);
            const hoje = new Date();
            let idade = hoje.getFullYear() - nasc.getFullYear();
            const mes = hoje.getMonth() - nasc.getMonth();
            if (mes < 0 || (mes === 0 && hoje.getDate() < nasc.getDate())) idade--;
            return idade >= 17;
        }

        document.getElementById('formProposta').addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = document.getElementById('mensagem');
            msg.classList.remove('hidden','text-red-500','text-green-600');

            const dados = {
                nome: document.getElementById('nome').value.trim(),
                cpf: document.getElementById('cpf').value.trim(),
                nascimento: document.getElementById('nascimento').value,
                whatsapp: document.getElementById('whatsapp').value.trim(),
                endereco: document.getElementById('endereco').value.trim(),
                cep: document.getElementById('cep').value.trim(),
                valorSolicitado: parseFloat(document.getElementById('valor').value)
            };

            if (!validarCPF(dados.cpf)) {
                msg.textContent = '❌ CPF inválido!';
                msg.classList.add('text-red-500');
                return;
            }
            if (!validarIdade(dados.nascimento)) {
                msg.textContent = '❌ É necessário ter pelo menos 17 anos!';
                msg.classList.add('text-red-500');
                return;
            }

            // Salva localmente (funciona offline)
            const propostas = JSON.parse(localStorage.getItem('propostasFlashpoint') || '[]');
            propostas.push({
                ...dados,
                status: 'EM_ANALISE',
                dataEnvio: new Date().toLocaleDateString('pt-BR')
            });
            localStorage.setItem('propostasFlashpoint', JSON.stringify(propostas));

            msg.textContent = '✅ Solicitação enviada com sucesso! Entraremos em contato em breve.';
            msg.classList.add('text-green-600');
            e.target.reset();
            msg.classList.remove('hidden');
        });
    </script>
</body>
</html>
