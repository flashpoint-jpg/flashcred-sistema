<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta e Edição de Cliente | FlashCred ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C8102E',
                        secundaria: '#1E293B',
                        destaque: '#059669',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        menu: '#0F172A'
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F8FAFC; min-height: 100vh; }
        .sidebar { background: #0F172A; min-height: 100vh; width: 220px; padding: 1.5rem 1rem; position: fixed; left: 0; top: 0; }
        .logo h1 { color: white; font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
        .logo p { color: #94A3B8; font-size: 0.75rem; margin-bottom: 2rem; }
        .nav-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem; border-radius: 0.75rem; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 0.9rem; margin-bottom: 0.4rem; transition: all 0.2s; }
        .nav-item:hover { background: rgba(200,16,46,0.15); color: white; }
        .nav-item.ativo { background: #C8102E; color: white; }
        .btn-sair { margin-top: 2rem; width: 100%; padding: 0.75rem; border: 1px solid #EF4444; background: transparent; color: #EF4444; border-radius: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-sair:hover { background: #EF4444; color: white; }
        .conteudo { margin-left: 220px; padding: 1.5rem 2rem; }
        .cabecalho { margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .cabecalho h2 { font-size: 1.6rem; font-weight: 700; color: #1E293B; }
        .btn-voltar { padding: 0.65rem 1.2rem; background: #64748B; color: white; border-radius: 0.65rem; text-decoration: none; font-weight: 500; transition: background 0.2s; }
        .btn-voltar:hover { background: #475569; }
        .card { background: white; border-radius: 1rem; padding: 1.75rem; box-shadow: 0 3px 15px rgba(0,0,0,0.05); }
        .grupo-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .campo { display: flex; flex-direction: column; gap: 0.35rem; }
        .campo label { font-weight: 500; color: #475569; font-size: 0.9rem; }
        .campo input, .campo select { padding: 0.8rem; border: 1px solid #CBD5E1; border-radius: 0.65rem; font-size: 0.95rem; outline: none; transition: border 0.2s; }
        .campo input:focus, .campo select:focus { border-color: #C8102E; box-shadow: 0 0 0 3px rgba(200,16,46,0.1); }
        .campo input[readonly] { background: #F1F5F9; color: #334155; }
        .btn-salvar { padding: 0.8rem 2rem; background: #059669; color: white; border: none; border-radius: 0.65rem; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .btn-salvar:hover { background: #047857; }
        .aviso { text-align: center; padding: 2.5rem; color: #64748B; font-weight: 500; }
    </style>
</head>
<body>
<!-- 🔒 PROTEÇÃO DE LOGIN -->
<script>
if(sessionStorage.getItem('logadoFlashCred') !== 'sim'){
    window.location.href = 'login.html';
}
</script>

    <!-- Menu Lateral -->
    <aside class="sidebar">
        <div class="logo">
            <h1>ADMINISTRATIVO</h1>
            <p>Flashpoint Distribuidora</p>
        </div>
        <a href="index.html" class="nav-item"><i class="fa fa-home"></i> Painel Inicial</a>
        <a href="clientes.html" class="nav-item"><i class="fa fa-users"></i> Clientes</a>
        <a href="admin.html" class="nav-item ativo"><i class="fa fa-file-text-o"></i> Gerenciar Propostas</a>
        <a href="financeiro.html" class="nav-item"><i class="fa fa-money"></i> Financeiro</a>
        <button onclick="sairDoSistema()" class="btn-sair"><i class="fa fa-sign-out"></i> Sair</button>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="conteudo">
        <div class="cabecalho">
            <h2>Dados do Cliente</h2>
            <a href="admin.html" class="btn-voltar"><i class="fa fa-arrow-left"></i> Voltar</a>
        </div>

        <div id="conteudoForm">
            <div class="aviso">Carregando dados do cliente...</div>
        </div>
    </main>

<script>
const cpfCliente = new URLSearchParams(window.location.search).get('cpf');

async function carregarDados(){
    if(!cpfCliente){
        document.getElementById('conteudoForm').innerHTML = `<div class="aviso text-perigo">❌ Nenhum cliente informado</div>`;
        return;
    }

    try {
        const res = await fetch('/api/propostas');
        const dados = await res.json();
        const proposta = (dados.propostas || []).find(p => p.cpf.replace(/\D/g,'') === cpfCliente.replace(/\D/g,''));
        
        if(!proposta){
            document.getElementById('conteudoForm').innerHTML = `<div class="aviso text-perigo">❌ Cliente não encontrado</div>`;
            return;
        }

        montarFormulario(proposta);

    } catch {
        document.getElementById('conteudoForm').innerHTML = `<div class="aviso text-perigo">❌ Erro ao carregar dados</div>`;
    }
}

function montarFormulario(dados){
    document.getElementById('conteudoForm').innerHTML = `
    <div class="card">
        <form id="formEdicao">
            <div class="grupo-campos">
                <div class="campo">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" value="${dados.nome || ''}" placeholder="Digite o nome" required>
                </div>
                <div class="campo">
                    <label>CPF</label>
                    <input type="text" id="cpf" value="${dados.cpf || ''}" readonly>
                </div>
            </div>

            <div class="grupo-campos">
                <div class="campo">
                    <label>Data de Nascimento</label>
                    <input type="date" id="nascimento" value="${dados.nascimento || ''}">
                </div>
                <div class="campo">
                    <label>WhatsApp</label>
                    <input type="text" id="whatsapp" value="${dados.whatsapp || ''}" placeholder="(00) 00000-0000">
                </div>
            </div>

            <div class="grupo-campos">
                <div class="campo">
                    <label>Valor Solicitado (R$)</label>
                    <input type="number" step="0.01" id="valorSolicitado" value="${dados.valorSolicitado || ''}" placeholder="0,00" oninput="calcularValores()">
                </div>
                <div class="campo">
                    <label>% de Entrada</label>
                    <input type="number" step="0.01" id="porcEntrada" value="${dados.porcEntrada || ''}" placeholder="0" min="0" max="100" oninput="calcularValores()">
                </div>
            </div>

            <div class="grupo-campos">
                <div class="campo">
                    <label>Valor da Entrada (R$)</label>
                    <input type="number" step="0.01" id="valorEntrada" value="${dados.valorEntrada || ''}" placeholder="Calculado" readonly>
                </div>
                <div class="campo">
                    <label>Taxa de Juros Mensal (%)</label>
                    <input type="number" step="0.01" id="taxaJuros" value="${dados.taxaJuros || ''}" placeholder="0,00" min="0" oninput="calcularValores()">
                </div>
            </div>

            <div class="grupo-campos">
                <div class="campo">
                    <label>Quantidade de Parcelas</label>
                    <input type="number" id="qtdParcelas" min="3" max="12" value="${dados.qtdParcelas || ''}" placeholder="3 a 12" oninput="calcularValores()">
                </div>
                <div class="campo">
                    <label>Valor de Cada Parcela (R$)</label>
                    <input type="number" step="0.01" id="valorParcela" value="${dados.valorParcela || ''}" placeholder="Calculado" readonly>
                </div>
            </div>

            <div class="grupo-campos">
                <div class="campo">
                    <label>Valor Total com Juros (R$)</label>
                    <input type="number" step="0.01" id="valorTotalJuros" value="${dados.valorTotalJuros || ''}" placeholder="Calculado" readonly>
                </div>
                <div class="campo">
                    <label>Status da Proposta</label>
                    <select id="status">
                        <option value="">Selecione</option>
                        <option value="EM_ANALISE" ${dados.status === 'EM_ANALISE' ? 'selected' : ''}>Em Análise</option>
                        <option value="APROVADO" ${dados.status === 'APROVADO' ? 'selected' : ''}>Aprovado</option>
                        <option value="REPROVADO" ${dados.status === 'REPROVADO' ? 'selected' : ''}>Reprovado</option>
                    </select>
                </div>
            </div>

            <div class="campo mb-4">
                <label>Endereço Completo</label>
                <input type="text" id="endereco" value="${dados.endereco || ''}" placeholder="Rua, número, bairro, cidade...">
            </div>

            <div class="text-right">
                <button type="submit" class="btn-salvar"><i class="fa fa-save"></i> Salvar Alterações</button>
            </div>
        </form>
    </div>
    `;

    document.getElementById('formEdicao').addEventListener('submit', salvarAlteracoes);
}

// Cálculo automático
function calcularValores(){
    const valorTotal = parseFloat(document.getElementById('valorSolicitado').value) || 0;
    const porcEntrada = parseFloat(document.getElementById('porcEntrada').value) || 0;
    const taxaJuros = parseFloat(document.getElementById('taxaJuros').value) || 0;
    const qtdParcelas = parseInt(document.getElementById('qtdParcelas').value) || 0;

    if(!valorTotal || !porcEntrada || !taxaJuros || !qtdParcelas){
        document.getElementById('valorEntrada').value = '';
        document.getElementById('valorParcela').value = '';
        document.getElementById('valorTotalJuros').value = '';
        return;
    }

    const valorEntrada = valorTotal * (porcEntrada / 100);
    const valorFinanciado = valorTotal - valorEntrada;
    const jurosTotal = valorFinanciado * (taxaJuros / 100) * qtdParcelas;
    const valorParcela = (valorFinanciado + jurosTotal) / qtdParcelas;
    const valorTotalFinal = valorEntrada + valorFinanciado + jurosTotal;

    document.getElementById('valorEntrada').value = valorEntrada.toFixed(2);
    document.getElementById('valorParcela').value = valorParcela.toFixed(2);
    document.getElementById('valorTotalJuros').value = valorTotalFinal.toFixed(2);
}

// Salvar alterações
async function salvarAlteracoes(e){
    e.preventDefault();
    if(!confirm('✅ Deseja salvar todas as alterações?')) return;

    const dadosAtualizados = {
        cpf: cpfCliente,
        nome: document.getElementById('nome').value.trim(),
        nascimento: document.getElementById('nascimento').value,
        whatsapp: document.getElementById('whatsapp').value.trim(),
        valorSolicitado: parseFloat(document.getElementById('valorSolicitado').value) || 0,
        porcEntrada: parseFloat(document.getElementById('porcEntrada').value) || 0,
        valorEntrada: parseFloat(document.getElementById('valorEntrada').value) || 0,
        taxaJuros: parseFloat(document.getElementById('taxaJuros').value) || 0,
        qtdParcelas: parseInt(document.getElementById('qtdParcelas').value) || 0,
        valorParcela: parseFloat(document.getElementById('valorParcela').value) || 0,
        valorTotalJuros: parseFloat(document.getElementById('valorTotalJuros').value) || 0,
        status: document.getElementById('status').value,
        endereco: document.getElementById('endereco').value.trim()
    };

    try {
        const res = await fetch('/api/propostas/status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(dadosAtualizados)
        });

        if(res.ok){
            alert('✅ Dados atualizados com sucesso!');
            window.location.href = 'admin.html';
        } else {
            alert('⚠️ Erro ao salvar. Tente novamente.');
        }
    } catch {
        alert('⚠️ Falha na conexão. Tente novamente.');
    }
}

function sairDoSistema(){
    if(confirm('🚪 Deseja realmente sair?')){
        sessionStorage.clear();
        window.location.href = 'login.html';
    }
}

// Inicia
carregarDados();
</script>
</body>
</html>
