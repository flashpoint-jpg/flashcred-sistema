<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Proposta de Crédito | Flashpoint Distribuidora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C8102E',
                        fundo: '#F8FAFC',
                        texto: '#1E293B'
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F8FAFC; min-height: 100vh; padding: 1.5rem 1rem; }
        .container { max-width: 550px; margin: 0 auto; background: white; border-radius: 1.25rem; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .cabecalho { text-align: center; margin-bottom: 2rem; }
        .cabecalho h1 { color: #C8102E; font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
        .cabecalho p { color: #64748B; font-size: 0.95rem; }
        .grupo-campos { margin-bottom: 1.25rem; }
        .linha-dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label { display: block; font-weight: 500; color: #374151; margin-bottom: 0.4rem; font-size: 0.9rem; }
        .campo { width: 100%; padding: 0.9rem; border: 1px solid #CBD5E1; border-radius: 0.75rem; font-size: 1rem; outline: none; transition: border 0.2s; }
        .campo:focus { border-color: #C8102E; box-shadow: 0 0 0 3px rgba(200,16,46,0.1); }
        .campo[readonly] { background: #F8FAFC; color: #6B7280; }
        .btn-enviar { width: 100%; padding: 1rem; background: #C8102E; color: white; border: none; border-radius: 0.75rem; font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
        .btn-enviar:hover { background: #9B0000; }
        .aviso { font-size: 0.85rem; color: #EF4444; margin-top: 0.3rem; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="cabecalho">
            <h1>Flashpoint Distribuidora</h1>
            <p>Preencha seus dados para solicitar a proposta</p>
        </div>

        <form id="formProposta">
            <div class="grupo-campos">
                <label>Nome Completo *</label>
                <input type="text" id="nome" class="campo" placeholder="Seu nome completo" required>
            </div>

            <div class="grupo-campos">
                <label>CPF *</label>
                <input type="text" id="cpf" class="campo" placeholder="000.000.000-00" maxlength="14" required>
            </div>

            <div class="grupo-campos">
                <label>WhatsApp com DDD *</label>
                <input type="text" id="whatsapp" class="campo" placeholder="(00) 00000-0000" maxlength="15" required>
            </div>

            <div class="linha-dupla">
                <div class="grupo-campos">
                    <label>CEP *</label>
                    <input type="text" id="cep" class="campo" placeholder="00000-000" maxlength="9" required>
                </div>
                <div class="grupo-campos">
                    <label>Número *</label>
                    <input type="text" id="numero" class="campo" placeholder="Ex: 123" required>
                </div>
            </div>

            <div class="grupo-campos">
                <label>Endereço</label>
                <input type="text" id="endereco" class="campo" placeholder="Preenchido automaticamente" readonly>
            </div>

            <div class="linha-dupla">
                <div class="grupo-campos">
                    <label>Bairro</label>
                    <input type="text" id="bairro" class="campo" placeholder="Preenchido automaticamente" readonly>
                </div>
                <div class="grupo-campos">
                    <label>Cidade/UF</label>
                    <input type="text" id="cidadeUf" class="campo" placeholder="Preenchido automaticamente" readonly>
                </div>
            </div>

            <div class="grupo-campos">
                <label>Valor Total da Compra *</label>
                <input type="number" step="0.01" id="valorTotal" class="campo" placeholder="R$ 0,00" required>
            </div>

            <button type="submit" class="btn-enviar">Enviar Solicitação</button>
            <div id="msgErro" class="aviso">Preencha todos os campos corretamente!</div>
        </form>
    </div>

<script>
// Máscara CPF
document.getElementById('cpf').addEventListener('input', function(e){
    let v = e.target.value.replace(/\D/g,'');
    if(v.length > 11) v = v.substring(0,11);
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    e.target.value = v;
});

// Máscara WhatsApp
document.getElementById('whatsapp').addEventListener('input', function(e){
    let v = e.target.value.replace(/\D/g,'');
    if(v.length > 11) v = v.substring(0,11);
    v = v.replace(/(\d{2})(\d)/, '($1) $2');
    v = v.replace(/(\d{5})(\d{4})$/, '$1-$2');
    e.target.value = v;
});

// Máscara e busca automática CEP
const campoCep = document.getElementById('cep');
campoCep.addEventListener('input', function(e){
    let valor = e.target.value.replace(/\D/g, '');
    if(valor.length > 8) valor = valor.substring(0,8);
    if(valor.length >= 5) valor = valor.replace(/(\d{5})(\d)/, '$1-$2');
    e.target.value = valor;
});

campoCep.addEventListener('blur', buscarEndereco);
campoCep.addEventListener('keyup', function(e){
    if(e.key === 'Enter' && this.value.length === 9){
        buscarEndereco();
    }
});
