<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Crédito | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        verdeLogo: '#10B981',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; padding: 20px 16px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(10, 36, 99, 0.08); padding: 24px; max-width: 520px; margin: 0 auto; border: 1px solid #E2E8F0; }
        .titulo { text-align: center; margin-bottom: 24px; }
        .titulo h1 { color: #0A2463; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .titulo p { color: #64748B; font-size: 14px; }
        .grupo { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #334155; }
        .input { width: 100%; padding: 12px 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; background: #FAFBFC; transition: border 0.2s; }
        .input:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10, 36, 99, 0.12); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, #0A2463, #2563EB); color: white; }
        .loading { display: inline-block; width: 24px; height: 24px; border: 3px solid #E2E8F0; border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .oculto { display: none !important; }
        .aviso { padding: 14px; border-radius: 10px; margin-bottom: 16px; text-align: center; font-weight: 500; }
        .aviso-sucesso { background: #ECFDF5; border: 1px solid #10B981; color: #065F46; }
        .aviso-erro { background: #FEF2F2; border: 1px solid #EF4444; color: #991B1B; }
    </style>
</head>
<body>

<div class="card">
    <div class="titulo">
        <h1>🛋️ FlashCred | Solicitar Proposta</h1>
        <p>Preencha os dados para solicitar seu crédito sem complicações</p>
    </div>

    <div id="areaAviso"></div>

    <form id="formProposta">
        <div class="grupo">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" class="input" placeholder="Seu nome completo" required>
        </div>

        <div class="grupo">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" name="cpf" class="input" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCpf(this)" required>
        </div>

        <div class="grupo">
            <label for="nascimento">Data de Nascimento *</label>
            <input type="date" id="nascimento" name="nascimento" class="input" required>
        </div>

        <div class="grupo">
            <label for="whatsapp">WhatsApp com DDD *</label>
            <input type="text" id="whatsapp" name="whatsapp" class="input" placeholder="(00) 00000-0000" maxlength="15" oninput="mascaraTel(this)" required>
        </div>

        <div class="grupo">
            <label for="cep">CEP *</label>
            <input type="text" id="cep" name="cep" class="input" placeholder="00000-000" maxlength="9" oninput="mascaraCep(this)" required>
        </div>

        <div class="grupo">
            <label for="endereco">Endereço Completo *</label>
            <input type="text" id="endereco" name="endereco" class="input" placeholder="Rua, Número, Bairro, Cidade-UF" required>
        </div>

        <div class="grupo">
            <label for="valor_solicitado">Valor Desejado (R$) *</label>
            <input type="text" id="valor_solicitado" name="valor_solicitado" class="input" placeholder="Ex: R$ 500,00" oninput="mascaraMoeda(this)" required>
        </div>

        <button type="submit" id="btnEnviar" class="btn btn-primary">
            <span id="textoBtn">Enviar Proposta</span>
            <span id="carregandoBtn" class="loading oculto"></span>
        </button>
    </form>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// FUNÇÕES DE MÁSCARA
function mascaraCpf(i) { i.value = i.value.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'); }
function mascaraTel(i) { i.value = i.value.replace(/\D/g,'').replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3'); }
function mascaraCep(i) { i.value = i.value.replace(/\D/g,'').replace(/(\d{5})(\d{3})/,'$1-$2'); }
function mascaraMoeda(i) {
    let v = i.value.replace(/\D/g,'');
    v = (v/100).toFixed(2) + '';
    v = v.replace('.', ',');
    i.value = v;
}

// ✅ CONVERTE MOEDA PARA NÚMERO AO SALVAR
function limparValor(valor) {
    return parseFloat(String(valor).replace(/\./g, '').replace(',', '.')) || 0;
}

function mostrarAviso(texto, tipo = 'sucesso') {
    const area = document.getElementById('areaAviso');
    area.innerHTML = `<div class="aviso aviso-${tipo}">${texto}</div>`;
}

document.getElementById('formProposta').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('btnEnviar');
    const textoBtn = document.getElementById('textoBtn');
    const carregando = document.getElementById('carregandoBtn');
    
    btn.disabled = true;
    textoBtn.classList.add('oculto');
    carregando.classList.remove('oculto');
    mostrarAviso('Enviando sua proposta, aguarde...', 'alerta');

    const dados = {
        nome: document.getElementById('nome').value.trim(),
        cpf: document.getElementById('cpf').value.replace(/\D/g, ''),
        nascimento: document.getElementById('nascimento').value,
        whatsapp: document.getElementById('whatsapp').value.replace(/\D/g, ''),
        cep: document.getElementById('cep').value.replace(/\D/g, ''),
        endereco: document.getElementById('endereco').value.trim(),
        valor_solicitado: limparValor(document.getElementById('valor_solicitado').value),
        percentual_entrada: 40,
        juros: 6,
        quantidade_parcelas: 48,
        status: 'nova',
        entrada_paga: false,
        created_at: new Date().toISOString()
    };

    // VALIDAÇÃO DO VALOR
    if(dados.valor_solicitado < 10) {
        mostrarAviso('❌ O valor solicitado deve ser no mínimo R$ 10,00', 'erro');
        btn.disabled = false;
        textoBtn.classList.remove('oculto');
        carregando.classList.add('oculto');
        return;
    }

    try {
        const { error } = await supabase.from('propostas').insert([dados]);
        
        if(error) throw error;

        mostrarAviso('✅ Proposta enviada com sucesso! Em breve entraremos em contato.', 'sucesso');
        document.getElementById('formProposta').reset();
        
        setTimeout(() => {
            window.location.href = 'consultar.html';
        }, 2500);

    } catch (erro) {
        console.error(erro);
        mostrarAviso('❌ Erro ao enviar proposta. Tente novamente.', 'erro');
    } finally {
        btn.disabled = false;
        textoBtn.classList.remove('oculto');
        carregando.classList.add('oculto');
    }
});
</script>
</body>
</html>
