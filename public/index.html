<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashCred | Limite no Pix - Distribuidora Flash Point</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
tailwind.config={theme:{extend:{colors:{primary:'#0A2463',azulLogo:'#2563EB',verdeLogo:'#10B981',neutro:'#475569',fundo:'#F8FAFC'}}}}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 8% 8%,rgba(37,99,235,.10),transparent 28%),radial-gradient(circle at 92% 22%,rgba(16,185,129,.09),transparent 25%),linear-gradient(180deg,#f8fbff 0%,#f8fafc 55%,#eef4fb 100%);color:#1e293b;line-height:1.6}
nav{background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50;box-shadow:0 8px 30px rgba(7,27,77,.07)}
nav>div{min-height:72px}
.nav-link{font-weight:600;color:#475569;transition:.25s;padding:9px 14px;border-radius:12px;text-decoration:none;border:1px solid transparent}
.nav-link:hover{color:#0A2463;background:#eff6ff;border-color:#dbeafe;transform:translateY(-1px)}
.logo-nome{font-size:30px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#0A2463,#2563EB);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
.logo-slogan{font-size:13px;color:#2563EB;font-weight:700;letter-spacing:.2px;opacity:.78}
main{padding-top:48px}
.destaque-container{width:100%;max-width:980px;margin:0 auto 38px;border-radius:28px;overflow:hidden;box-shadow:0 22px 60px rgba(10,36,99,.13);background:#fff;border:1px solid #e2e8f0;transition:.3s}
.destaque-container:hover{transform:translateY(-3px);box-shadow:0 28px 70px rgba(10,36,99,.16)}
.destaque-imagem{width:100%;height:auto;display:block}
.card{background:rgba(255,255,255,.97);border-radius:28px;box-shadow:0 18px 50px rgba(15,23,42,.075);padding:34px;border:1px solid rgba(226,232,240,.95);transition:.25s}
.card:hover{transform:translateY(-3px);box-shadow:0 24px 60px rgba(15,23,42,.11)}
.btn{width:100%;padding:15px 20px;border-radius:15px;font-weight:700;font-size:16px;border:0;cursor:pointer;transition:.25s}
.btn-primary{background:linear-gradient(135deg,#0A2463,#2563EB);color:#fff;box-shadow:0 14px 28px rgba(37,99,235,.22);min-height:54px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 34px rgba(37,99,235,.30)}
.btn-primary:disabled{opacity:.7;cursor:not-allowed;transform:none}
.spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:girar .8s linear infinite;display:none}
@keyframes girar{to{transform:rotate(360deg)}}
.input{width:100%;padding:14px 16px;border:1px solid #d7e0eb;border-radius:14px;font-size:15px;background:#f8fafc;margin-bottom:17px;transition:.2s}
.input:hover{border-color:#9fb0c5}
.input:focus{outline:none;border-color:#2563EB;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.11);transform:translateY(-1px)}
label{font-weight:700;font-size:11px;color:#334155;display:block;margin-bottom:7px;text-transform:uppercase;letter-spacing:.7px}
.erro{color:#dc2626;font-size:13px;margin:-10px 0 12px;display:none}
#valor_desejado{border:2px solid rgba(16,185,129,.35);background:#f0fdf9;font-size:17px;font-weight:700}
.aviso-exclusivo{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;border-radius:16px;padding:15px;color:#92400e;font-size:14px;font-weight:600;margin-bottom:22px;box-shadow:0 10px 25px rgba(146,64,14,.07)}
.beneficio{display:flex;align-items:flex-start;gap:10px;padding:13px 0;border-bottom:1px solid #f1f5f9;font-size:14px;color:#334155}
.check-icon{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#ecfdf5;color:#059669;font-weight:800;flex:0 0 25px}
.secao-limite-pix{position:relative;overflow:hidden;border-radius:26px;margin:42px auto;max-width:980px;box-shadow:0 25px 65px rgba(7,27,77,.22);border:0;background:linear-gradient(135deg,#071b4d 0%,#123f9b 48%,#12a98f 100%)}
.elementos-decorativos{position:absolute;inset:0;opacity:.055;pointer-events:none}
.decor-1{position:absolute;top:-15px;left:-5px;font-size:120px}
.decor-2{position:absolute;bottom:5px;right:20px;font-size:100px}
.decor-3{position:absolute;top:40%;right:40px;font-size:90px}
.conteudo-destaque{position:relative;z-index:10;padding:38px 24px;color:#fff;max-width:900px;margin:auto}
.titulo-destaque{font-size:clamp(2rem,5vw,3rem);font-weight:900;text-align:center;margin-bottom:8px;line-height:1.15;letter-spacing:-1px}
.subtitulo-destaque{font-size:clamp(1.05rem,3vw,1.4rem);font-weight:600;text-align:center;margin-bottom:30px;opacity:.96}
.bloco-como-funciona,.bloco-vantagens{background:rgba(255,255,255,.095);backdrop-filter:blur(10px);border-radius:18px;padding:24px;margin-bottom:24px;border:1px solid rgba(255,255,255,.18)}
.titulo-bloco{font-size:1.35rem;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.passo-item{display:flex;align-items:flex-start;gap:13px;padding:13px;background:rgba(255,255,255,.06);border-radius:13px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06);transition:.22s}
.passo-item:hover{background:rgba(255,255,255,.12);transform:translateX(4px)}
.numero-passo{font-size:1.35rem;font-weight:900;color:#fde047;min-width:42px;width:42px;height:42px;border-radius:13px;background:rgba(253,224,71,.15);display:grid;place-items:center}
.vantagem-item{display:flex;align-items:center;gap:10px;padding:11px;background:rgba(16,185,129,.18);border-radius:11px;margin-bottom:8px;border:1px solid rgba(255,255,255,.08);transition:.22s}
.vantagem-item:hover{transform:translateX(4px);background:rgba(16,185,129,.28)}
.resumo-final{background:rgba(253,224,71,.17);border:2px solid #fde047;border-radius:17px;padding:22px;text-align:center;margin-top:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.texto-resumo{font-size:1.2rem;font-weight:700;font-style:italic;line-height:1.55}

/* SIMULADOR */
.simulador{max-width:980px;margin:0 auto 42px;border-radius:28px;padding:2px;background:linear-gradient(135deg,#2563eb,#10b981);box-shadow:0 24px 60px rgba(7,27,77,.16)}
.simulador-inner{background:#fff;border-radius:26px;padding:32px}
.simulador-titulo{text-align:center;color:#0A2463;font-size:clamp(1.7rem,4vw,2.25rem);font-weight:900;letter-spacing:-.6px}
.simulador-sub{text-align:center;color:#64748b;margin:6px auto 24px}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sim-field{background:#f8fafc;border:1px solid #e2e8f0;border-radius:17px;padding:18px}
.sim-field label{margin-bottom:8px}
.sim-field input,.sim-field select{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;background:#fff;font-size:16px;font-weight:700;color:#0f172a;outline:none}
.sim-field input:focus,.sim-field select:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.10)}
.sim-info{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.sim-mini{flex:1;min-width:180px;padding:15px;border-radius:15px;background:#f0fdf9;border:1px solid #bbf7d0}
.sim-mini span{display:block;color:#64748b;font-size:12px;font-weight:700;text-transform:uppercase}
.sim-mini strong{display:block;color:#047857;font-size:20px;margin-top:2px}
.sim-analise{display:none;margin-top:22px;border-radius:19px;padding:22px;background:linear-gradient(135deg,#071b4d,#123f9b);color:#fff;text-align:center;overflow:hidden}
.sim-analise.ativo{display:block;animation:simFade .25s ease}
.sim-loader{width:58px;height:58px;margin:0 auto 13px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:#10b981;animation:simSpin .8s linear infinite}
.sim-analise h3{font-size:21px;font-weight:800}
.sim-analise p{opacity:.82;font-size:14px}
.sim-result{display:none;margin-top:22px;border-radius:20px;padding:23px;background:linear-gradient(135deg,#ecfdf5,#eff6ff);border:1px solid #bbf7d0;animation:simResult .55s cubic-bezier(.2,.8,.2,1)}
.sim-result.ativo{display:block}
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.result-box{padding:15px;border-radius:15px;background:rgba(255,255,255,.86);border:1px solid #e2e8f0}
.result-box span{display:block;font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase}
.result-box strong{display:block;font-size:20px;color:#0A2463;margin-top:3px}
.result-parcela{margin-top:15px;padding:20px;border-radius:18px;text-align:center;background:linear-gradient(135deg,#0A2463,#2563EB);color:#fff;box-shadow:0 14px 30px rgba(37,99,235,.20)}
.result-parcela span{display:block;font-size:12px;font-weight:700;opacity:.8;text-transform:uppercase}
.result-parcela strong{font-size:34px;line-height:1.2}
.sim-alert{margin-top:14px;text-align:center;color:#64748b;font-size:12px}
@keyframes simSpin{to{transform:rotate(360deg)}}
@keyframes simFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes simResult{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

footer{background:linear-gradient(135deg,#071b4d,#0A2463);color:#cbd5e1;border-radius:34px 34px 0 0;margin-top:55px;padding:30px;text-align:center;font-size:14px}

/* ENVIO */
#overlayEnvio{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(3,15,42,.72);backdrop-filter:blur(12px)}
#overlayEnvio.ativo{display:flex;animation:fcFadeIn .28s ease}
.envio-card{width:min(460px,100%);padding:38px 28px 30px;border-radius:28px;background:rgba(255,255,255,.97);box-shadow:0 30px 100px rgba(0,0,0,.28);text-align:center;animation:fcCardIn .45s cubic-bezier(.2,.8,.2,1)}
.envio-icon{width:92px;height:92px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#dcfce7);position:relative}
.envio-icon:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(37,99,235,.18);animation:fcPulse 1.4s infinite}
.envio-icon svg{width:46px;height:46px;stroke:#10b981;stroke-width:2.8;fill:none}
.envio-card h2{font-size:26px;font-weight:800;color:#0A2463;margin-bottom:7px}
.envio-card p{color:#64748b;font-size:15px}
.envio-status{margin-top:24px;padding:15px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0;text-align:left}
.envio-linha{display:flex;align-items:center;gap:10px;font-size:14px;color:#475569;margin:9px 0}
.envio-bolinha{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#10b981;color:#fff;font-size:12px;font-weight:800;flex:0 0 21px}
.envio-barra{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:17px}
.envio-barra span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#2563eb,#10b981);animation:fcProgress 1.65s ease forwards}
.envio-destino{margin-top:18px;font-size:13px;font-weight:700;color:#2563eb;animation:fcBlink 1s infinite alternate}
@keyframes fcFadeIn{from{opacity:0}to{opacity:1}}
@keyframes fcCardIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fcPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:.2}}
@keyframes fcProgress{to{width:100%}}
@keyframes fcBlink{from{opacity:.45}to{opacity:1}}

@media(max-width:640px){
  main{padding-top:28px}
  .logo-nome{font-size:25px}
  .nav-link{font-size:13px;padding:8px 9px}
  .card{padding:23px;border-radius:22px}
  .secao-limite-pix{border-radius:24px;margin:28px auto}
  .conteudo-destaque{padding:28px 16px}
  .destaque-container{border-radius:20px;margin-bottom:28px}
  .simulador{border-radius:23px}
  .simulador-inner{padding:22px;border-radius:21px}
  .sim-grid,.result-grid{grid-template-columns:1fr}
}


</body>
</html>
