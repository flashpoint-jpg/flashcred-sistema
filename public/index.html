<script>
const supabaseUrl = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const supabaseKey = 'sb_publishable_g5Tcimge2aiMX8JE3mlU3W55Y2s0CjZtxXkT2VjR3K9Rz0NnI2s1M3p5X7z6bX7kY5aQ3dF2gH9jK8lL7mN6bV8cX7z9';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// Buscar endereço pelo CEP
async function buscarCep() {
    const cep = document.getElementById('cep').value.replace(/\D/g, '');
    if(cep.length !== 8) return;
    try {
        const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const dados = await res.json();
        if(!dados.erro) {
            document.getElementById('endereco').value = `${dados.logradouro}, ${dados.bairro}, ${dados.localidade}/${dados.uf}`;
        }
    } catch(e) {}
}

// Validar CPF
function validarCpf(cpf) {
    cpf = cpf.replace(/\D/g, '');
    if(cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
    let soma = 0;
    for(let i=0; i<9; i++) soma += parseInt(cpf[i]) * (10 - i);
    let dig1 = (soma * 10) % 11;
    if(dig1 === 10 || dig1 === 11) dig1 = 0;
    if(dig1 !== parseInt(cpf[9])) return false;
    soma = 0;
    for(let i=0; i<10; i++) soma += parseInt(cpf[i]) * (11 - i);
    let dig2 = (soma * 10) % 11;
    if(dig2 === 10 || dig2 === 11) dig2 = 0;
    return dig2 === parseInt(cpf[10]);
}

// Validar idade (mínimo 17 anos)
function validarIdade(dataNasc) {
    const nasc = new Date(dataNasc);
    const hoje = new Date();
    let idade = hoje.getFullYear() - nasc.getFullYear();
    const mes = hoje.getMonth() - nasc.getMonth();
    if (mes < 0 || (mes === 0 && hoje.getDate() < nasc.getDate())) idade--;
    return idade >= 17;
}

// Enviar formulário - EXATAMENTE COMO VOCÊ PEDIU
document.getElementById('formSolicitacao').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnEnviar');
    const aviso = document.getElementById('avisoForm');
    aviso.style.display = 'none';
    
    // ✅ Efeito de carregamento no botão
    btn.disabled = true;
    btn.innerHTML = '<span style="display:inline-block; animation: girar 0.8s linear infinite;">⏳</span> Enviando...';

    const dados = {
        nome: document.getElementById('nome').value.trim(),
        cpf: document.getElementById('cpf').value.trim(),
        nascimento: document.getElementById('nascimento').value,
        telefone: document.getElementById('telefone').value.trim(),
        cep: document.getElementById('cep').value.trim(),
        endereco: document.getElementById('endereco').value.trim(),
        valor_solicitado: parseFloat(document.getElementById('valor_solicitado').value),
        status: 'Nova',
        data_solicitacao: new Date().toISOString()
    };

    // Validações
    if(!validarCpf(dados.cpf)) {
        aviso.textContent = 'CPF inválido! Verifique os números.';
        aviso.className = 'aviso erro';
        aviso.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '📤 Enviar Solicitação';
        return;
    }

    if(!validarIdade(dados.nascimento)) {
        aviso.textContent = 'É preciso ter pelo menos 17 anos para solicitar.';
        aviso.className = 'aviso erro';
        aviso.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '📤 Enviar Solicitação';
        return;
    }

    // Salvar no banco
    const { error } = await supabase.from('propostas').insert([dados]);

    if(error) {
        aviso.textContent = 'Erro ao enviar. Tente novamente em instantes.';
        aviso.className = 'aviso erro';
        aviso.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '📤 Enviar Solicitação';
        return;
    }

    // ✅ MENSAGEM EXATA QUE VOCÊ QUER
    aviso.innerHTML = `
        <strong>✅ Solicitação enviada com sucesso!</strong><br>
        Você está sendo redirecionado para a página de acompanhamento...
    `;
    aviso.className = 'aviso sucesso';
    aviso.style.display = 'block';
    
    // ✅ Redirecionamento com CPF já preenchido
    setTimeout(() => {
        window.location.href = `consultar.html?cpf=${dados.cpf.replace(/\D/g, '')}`;
    }, 2000);
});

// Adiciona a animação de giro
const estiloAnimacao = document.createElement('style');
estiloAnimacao.textContent = `
    @keyframes girar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
`;
document.head.appendChild(estiloAnimacao);
</script>
