<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolicitaÃ§Ã£o de CrediÃ¡rio - Flashcred MÃ³veis</title>
    <style>
        :root {
            --primary: #0047AB;
            --secondary: #002B66;
            --accent: #FFD700;
            --success: #28a745;
            --bg: #F4F6F9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .simulacao-box {
            background-color: #EBF3FF;
            border: 1px solid #B8D5FF;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .simulacao-box h3 {
            margin-top: 0;
            color: var(--primary);
        }

        .canvas-container {
            border: 2px dashed #0047AB;
            border-radius: 6px;
            background: #fff;
            position: relative;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 150px;
            display: block;
        }

        .btn-clear {
            background: #6c757d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
        }

        button.btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: var(--secondary);
        }

        .status-container {
            text-align: center;
            display: none;
        }

        .qr-code-img {
            max-width: 200px;
            margin: 15px 0;
        }

        .copy-box {
            background: #eee;
            padding: 10px;
            border-radius: 6px;
            word-break: break-all;
            font-size: 12px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Flashcred MÃ³veis ðŸª‘</h1>
        <p>Solicite seu crediÃ¡rio sem complicaÃ§Ã£o</p>
    </div>

    <!-- FORMULÃRIO DO CLIENTE -->
    <form id="formCrediario">
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Ex: JoÃ£o da Silva">
        </div>

        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" required placeholder="000.000.000-00">
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
            <label for="produto">MÃ³vel / Produto Desejado:</label>
            <input type="text" id="produto" required placeholder="Ex: SofÃ¡ RetrÃ¡til 3 Lugares">
        </div>

        <div class="form-group">
            <label for="valorTotal">Valor Total do Produto (R$):</label>
            <input type="number" id="valorTotal" step="0.01" required placeholder="1000.00" oninput="calcularSimulacao()">
        </div>

        <div class="form-group">
            <label for="parcelasSaldo">Parcelamento do Saldo:</label>
            <select id="parcelasSaldo" onchange="calcularSimulacao()">
                <option value="3">3x parcelas</option>
                <option value="4">4x parcelas</option>
                <option value="5">5x parcelas</option>
                <option value="6">6x parcelas</option>
            </select>
        </div>

        <!-- BOX DE SIMULAÃ‡ÃƒO -->
        <div class="simulacao-box">
            <h3>Resumo do CrediÃ¡rio</h3>
            <p> Entrada Obrigatoria (39%): <b id="lblEntrada">R$ 0,00</b></p>
            <p> Saldo Financiado em <span id="lblQtdParcelas">3</span>x: <b id="lblValorParcela">R$ 0,00</b> / mÃªs</p>
        </div>

        <!-- ASSINATURA DIGITAL -->
        <div class="form-group">
            <label>Assine no quadro abaixo:</label>
            <div class="canvas-container">
                <canvas id="canvasAssinatura"></canvas>
            </div>
            <button type="button" class="btn-clear" onclick="limparAssinatura()">Limpar Assinatura</button>
        </div>

        <button type="submit" class="btn-submit" id="btnEnviar">Enviar Proposta para AnÃ¡lise</button>
    </form>

    <!-- TELA DE STATUS APÃ“S ENVIAR -->
    <div id="statusContainer" class="status-container">
        <h2 id="statusTitulo">Proposta Enviada!</h2>
        <p id="statusMensagem">Aguarde a anÃ¡lise da loja para liberaÃ§Ã£o do Pix de entrada.</p>

        <div id="pixBox" style="display: none;">
            <h3>Pague a entrada para finalizar seu pedido:</h3>
            <img id="qrCodeImg" class="qr-code-img" src="" alt="QR Code Pix">
            <div id="copiaECola" class="copy-box"></div>
            <button class="btn-submit" onclick="copiarPix()">Copiar CÃ³digo Pix</button>
        </div>
    </div>
</div>

<script>
    // ConfiguraÃ§Ã£o do Canvas para Assinatura
    const canvas = document.getElementById('canvasAssinatura');
    const ctx = canvas.getContext('2d');
    let desenhando = false;

    function redimensionarCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 150;
        ctx.strokeStyle = '#0047AB';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
    }
    window.addEventListener('resize', redimensionarCanvas);
    redimensionarCanvas();

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => { desenhando = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
    canvas.addEventListener('mousemove', (e) => { if (!desenhando) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); });
    canvas.addEventListener('mouseup', () => desenhando = false);
    canvas.addEventListener('touchstart', (e) => { desenhando = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
    canvas.addEventListener('touchmove', (e) => { if (!desenhando) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); e.preventDefault(); });
    canvas.addEventListener('touchend', () => desenhando = false);

    function limparAssinatura() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // CÃ¡lculo da SimulaÃ§Ã£o
    function calcularSimulacao() {
        const valorTotal = parseFloat(document.getElementById('valorTotal').value) || 0;
        const parcelas = parseInt(document.getElementById('parcelasSaldo').value) || 3;

        const entrada = valorTotal * 0.39;
        const saldo = valorTotal - entrada;
        const saldoComJuros = saldo * Math.pow(1.07, parcelas);
        const valorParcela = saldoComJuros / parcelas;

        document.getElementById('lblEntrada').innerText = `R$ ${entrada.toFixed(2)}`;
        document.getElementById('lblQtdParcelas').innerText = parcelas;
        document.getElementById('lblValorParcela').innerText = `R$ ${valorParcela.toFixed(2)}`;
    }

    // Envio do FormulÃ¡rio
    document.getElementById('formCrediario').addEventListener('submit', async (e) => {
        e.preventDefault();

        const assinaturaBase64 = canvas.toDataURL();
        const valorTotal = parseFloat(document.getElementById('valorTotal').value);

        const dados = {
            cliente: {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                email: document.getElementById('email').value
            },
            produto: document.getElementById('produto').value,
            valorTotal,
            parcelasSaldo: document.getElementById('parcelasSaldo').value,
            assinaturaBase64
        };

        document.getElementById('btnEnviar').innerText = "Enviando...";
        document.getElementById('btnEnviar').disabled = true;

        try {
            const res = await fetch('/api/cliente/enviar-proposta', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            const result = await res.json();
            if (result.sucesso) {
                document.getElementById('formCrediario').style.display = 'none';
                document.getElementById('statusContainer').style.display = 'block';
                iniciarMonitoramento(result.idProposta);
            } else {
                alert(result.erro || 'Erro ao enviar proposta.');
                document.getElementById('btnEnviar').innerText = "Enviar Proposta para AnÃ¡lise";
                document.getElementById('btnEnviar').disabled = false;
            }
        } catch (e) {
            alert('Erro ao conectar ao servidor.');
            document.getElementById('btnEnviar').innerText = "Enviar Proposta para AnÃ¡lise";
            document.getElementById('btnEnviar').disabled = false;
        }
    });

    // Acompanhar aprovaÃ§Ã£o em tempo real
    function iniciarMonitoramento(idProposta) {
        setInterval(async () => {
            try {
                const res = await fetch(`/api/cliente/status-proposta/${idProposta}`);
                const data = await res.json();

                if (data.status === 'APROVADO' && data.pix) {
                    document.getElementById('statusTitulo').innerText = "Proposta Aprovada! ðŸŽ‰";
                    document.getElementById('statusMensagem').innerText = "Efetue o pagamento da entrada abaixo para liberar o carnÃª:";
                    document.getElementById('pixBox').style.display = 'block';
                    document.getElementById('qrCodeImg').src = `data:image/png;base64,${data.pix.qrCodeBase64}`;
                    document.getElementById('copiaECola').innerText = data.pix.copiaECola;
                } else if (data.status === 'ENTRADA_PAGA') {
                    document.getElementById('statusTitulo').innerText = "Entrada Confirmada! âœ…";
                    document.getElementById('statusMensagem').innerText = "Seu crediÃ¡rio foi aprovado e o pedido estÃ¡ em preparaÃ§Ã£o. Obrigado!";
                    document.getElementById('pixBox').style.display = 'none';
                } else if (data.status === 'REJEITADO') {
                    document.getElementById('statusTitulo').innerText = "Proposta NÃ£o Aprovada";
                    document.getElementById('statusMensagem').innerText = "Infelizmente sua proposta nÃ£o foi aceita no momento.";
                }
            } catch (err) {
                console.error(err);
            }
        }, 3000);
    }

    function copiarPix() {
        const texto = document.getElementById('copiaECola').innerText;
        navigator.clipboard.writeText(texto);
        alert('CÃ³digo Pix copiado para a Ã¡rea de transferÃªncia!');
    }
</script>

</body>
</html>
