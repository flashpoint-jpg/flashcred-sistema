<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred | Solicitação de Limite no Pix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        fundo: '#F8FAFC',
                        erro: '#EF4444',
                        sucesso: '#10B981',
                        alerta: '#F59E0B'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; padding: 16px; min-height: 100vh; }
        .cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; max-width: 480px; margin-left: auto; margin-right: auto; }
        .titulo-topo { font-size: 24px; font-weight: 800; color: #0A2463; }
        .sub-topo { font-size: 12px; color: #64748B; font-weight: 500; }
        .menu-topo { display: flex; gap: 8px; }
        .btn-topo { padding: 8px 12px; border-radius: 10px; border: none; font-weight: 500; cursor: pointer; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; }
        .btn-consulta { background: white; color: #0A2463; border: 1px solid #0A2463; }
        .btn-admin { background: #0A2463; color: white; }

        .card { max-width: 480px; margin: 0 auto; background: white; border-radius: 20px; padding: 28px; box-shadow: 0 4px 20px rgba(10,36,99,0.08); }
        .titulo-card { text-align: center; font-size: 20px; font-weight: 700; color: #0A2463; margin-bottom: 20px; }
        
        .label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input { width: 100%; padding: 14px 16px; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 16px; margin-bottom: 16px; outline: none; background: #FFF; transition: 0.2s; }
        .input:focus { border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10,36,99,0.1); }
        
        .btn-enviar { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #0A2463; color: white; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-enviar:hover { background: #081C49; }
        .btn-enviar:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="cabecalho">
    <div>
        <h1 class="titulo-topo">FlashCred</h1>
        <p class="sub-topo">Limite no Pix</p>
    </div>
    <div class="menu-topo">
        <a href="consultar.html" class="btn-topo btn-consulta">Consultar</a>
        <a href="painel.html" class="btn-topo btn-admin">Painel</a>
    </div>
</div>

<div class="card">
    <h2 class="titulo-card">Solicitar Análise de Limite</h2>
    
    <form id="formProposta" onsubmit="enviarProposta(event)">
        <label class="label" for="nome">Nome Completo</label>
        <input type="text" id="nome" class="input" placeholder="Digite seu nome completo" required>

        <label class="label" for="cpf">CPF</label>
        <input type="text" id="cpf" class="input" placeholder="000.000.000-00" maxlength="14" required oninput="mascaraCpf(this)">

        <label class="label" for="telefone">Telefone / WhatsApp</label>
        <input type="text" id="telefone" class="input" placeholder="(00) 00000-0000" maxlength="15" required oninput="mascaraTelefone(this)">

        <label class="label" for="valor">Valor Desejado para Compra (R$)</label>
        <input type="number" id="valor" class="input" placeholder="Ex: 1000" step="0.01" min="50" required>

        <button type="submit" id="btnEnviar" class="btn-enviar">Enviar Solicitação</button>
    </form>
</div>

<script>
// Máscara automática para CPF
function mascaraCpf(i) {
    let v = i.value.replace(/\D/g, "");
    if (v.length > 11) v = v.slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    i.value = v;
}

// Máscara automática para Telefone
function mascaraTelefone(i) {
    let v = i.value.replace(/\D/g, "");
    if (v.length > 11) v = v.slice(0, 11);
    if (v.length > 10) {
        v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3");
    } else if (v.length > 5) {
        v = v.replace(/^(\d{2})(\d{4})(\d{4}).*/, "($1) $2-$3");
    } else if (v.length > 2) {
        v = v.replace(/^(\d{2})(\d*)/, "($1) $2");
    } else {
        v = v.replace(/^(\d*)/, "($1");
    }
    i.value = v;
}

// Envio integrando diretamente com o servidor backend
async function enviarProposta(event) {
    event.preventDefault();

    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.textContent = 'Enviando para o servidor...';

    const dadosProposta = {
        nome: document.getElementById('nome').value.trim(),
        cpf: document.getElementById('cpf').value.trim(),
        telefone: document.getElementById('telefone').value.trim(),
        valor_desejado: parseFloat(document.getElementById('valor').value) || 0
    };

    try {
        // Envia via POST para o servidor Node.js/Render
        const resposta = await fetch('/api/propostas', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(dadosProposta)
        });

        const resultado = await resposta.json();

        if (resposta.ok && resultado.success) {
            alert('Solicitação enviada com sucesso!');
            // Redireciona para a página de consulta levando o CPF limpo
            const cpfLimpo = dadosProposta.cpf.replace(/\D/g, '');
            window.location.href = `consultar.html?cpf=${cpfLimpo}`;
        } else {
            throw new Error(resultado.error || 'Erro desconhecido ao salvar.');
        }

    } catch (erro) {
        console.error('Erro ao enviar:', erro);
        alert('Erro ao salvar proposta no servidor. Verifique sua conexão.');
        btn.disabled = false;
        btn.textContent = 'Enviar Solicitação';
    }
}
</script>
</body>
</html>
