<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Limite Pix Parcelado | FlashCred</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0A2463;
            --pix-green: #32BCAD;
            --bg-body: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --sucesso: #10B981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; }

        /* Cabeçalho */
        header { background: #FFFFFF; border-bottom: 1px solid var(--border-color); padding: 16px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: sticky; top:0; z-index: 50; }
        .logo-area { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .logo-nome { font-size: 20px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .logo-slogan { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: var(--primary); font-weight: 600; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 8px; background: #F1F5F9; }
        .nav-links a:hover { background: #E2E8F0; }

        .container { max-width: 600px; margin: 40px auto; padding: 0 16px; }

        /* Cards */
        .card { background: #FFFFFF; border-radius: 20px; padding: 28px; box-shadow: 0 4px 16px rgba(10,36,99,0.08); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .card-titulo { font-size: 20px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
        .card-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }

        /* Formulários e Botões */
        .grupo-linha { margin-bottom: 16px; }
        label { font-weight: 600; font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; text-transform: uppercase; }
        .input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 15px; background: #FAFBFC; }
        .input:focus { outline: none; border-color: var(--primary); background: #FFF; }

        .btn-pix { 
            background: var(--pix-green); 
            color: #04203a; 
            width: 100%; 
            margin-top: 10px; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
        }
        .btn-pix:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-pix:disabled { opacity: 0.7; cursor: not-allowed; }

        /* 🔄 ANIMAÇÃO DE CARREGAMENTO (SPINNER) */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(4, 32, 58, 0.2);
            border-top: 3px solid #04203a;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
            display: none;
        }
        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .aviso-sucesso { background: #ECFDF5; color: #065F46; padding: 12px; border-radius: 10px; text-align: center; margin-top: 12px; display: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <div>
            <a href="/" class="logo-nome">FlashCred | Solicitação de Limite</a>
            <div class="logo-slogan">Distribuidora Flash Point</div>
        </div>
        <div class="nav-links">
            <a href="painel.html">Painel</a>
            <a href="consultar.html">Consultar</a>
        </div>
    </div>
</header>

<div class="container">
    <div class="card">
        <h2 class="card-titulo">📋 Formulário de Solicitação</h2>
        <p class="card-sub">Preencha seus dados para receber uma análise imediata do seu limite Pix Parcelado.</p>

        <form id="formCliente" onsubmit="enviarProposta(event)">
            <div class="grupo-linha">
                <label>Nome Completo</label>
                <input type="text" id="nome" class="input" placeholder="Digite seu nome completo" required>
            </div>

            <div class="grupo-linha">
                <label>CPF</label>
                <input type="text" id="cpf" class="input" placeholder="000.000.000-00" required>
            </div>

            <div class="grupo-linha">
                <label>Telefone / WhatsApp</label>
                <input type="text" id="telefone" class="input" placeholder="(00) 00000-0000" required>
            </div>

            <div class="grupo-linha">
                <label>CEP</label>
                <input type="text" id="cep" class="input" placeholder="00000-000" onblur="buscarCep()" required>
            </div>

            <div class="grupo-linha">
                <label>Endereço Completo</label>
                <input type="text" id="endereco" class="input" placeholder="Rua, Número, Bairro, Cidade - UF" required>
            </div>

            <div class="grupo-linha">
                <label>Valor Desejado (R$)</label>
                <input type="number" id="valorTotal" class="input" min="100" step="0.01" value="2100.00" required>
            </div>

            <button type="submit" class="btn-pix" id="btnSubmit">
                <span id="btnText">Enviar Solicitação</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
            <div id="aviso" class="aviso-sucesso"></div>
        </form>
    </div>
</div>

<script>
const supabaseUrl = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const supabaseKey = 'sb_publishable_g5Tcimge2aiMX8JE3mlU3W55Y2s0CjZtxXkT2VjR3K9Rz0NnI2s1M3p5X7z6bX7kY5aQ3dF2gH9jK8lL7mN6bV8cX7z9';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function buscarCep() {
    const cep = document.getElementById('cep').value.replace(/\D/g, '');
    if(cep.length !== 8) return;

    try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await response.json();
        if(!data.erro) {
            document.getElementById('endereco').value = `${data.logradouro}, Bairro: ${data.bairro}, ${data.localidade} - ${data.uf}`;
        }
    } catch (e) {
        console.error("Erro ao buscar CEP");
    }
}

async function enviarProposta(event) {
    event.preventDefault();

    const btn = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('btnSpinner');

    // Ativa animação no botão
    btn.disabled = true;
    btnText.textContent = 'Enviando...';
    spinner.style.display = 'block';

    const nome = document.getElementById('nome').value.trim();
    const cpf = document.getElementById('cpf').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const cep = document.getElementById('cep').value.trim();
    const endereco = document.getElementById('endereco').value.trim();
    const valorSolicitado = document.getElementById('valorTotal').value;

    const dataAtual = new Date().toLocaleDateString('pt-BR');

    const dadosProposta = {
        nome: nome,
        cpf: cpf,
        telefone: telefone,
        cep: cep,
        endereco: endereco,
        valor_solicitado: valorSolicitado,
        status: 'Nova',
        data_solicitacao: dataAtual
    };

    const { error } = await supabase
        .from('propostas')
        .insert([dadosProposta]);

    if (error) {
        console.error('Erro ao salvar no banco:', error);
        alert('Erro ao enviar solicitação: ' + error.message);
        
        // Restaura o botão em caso de falha
        btn.disabled = false;
        btnText.textContent = 'Enviar Solicitação';
        spinner.style.display = 'none';
    } else {
        // Redireciona para a página de consulta com sucesso
        window.location.href = 'consultar.html';
    }
}
</script>
</body>
</html>
