<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred | Nova Solicitação</title>
    <style>
        :root {
            --primary: #0A2463;
            --accent: #32BCAD;
            --accent-hover: #299e91;
            --bg-body: #F4F7FA;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); line-height: 1.5; }
        nav { background: rgba(255, 255, 255, 0.95); padding: 16px 24px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .nav-conteudo { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; color: var(--primary); font-size: 18px; text-decoration: none; }
        .nav-links { display: flex; gap: 12px; }
        .nav-links a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--border-color); background: #fff; }
        .nav-links a:hover { background: var(--primary); color: #fff; }
        main { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 35px; border-radius: 24px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.04); }
        .card h2 { color: var(--primary); margin-bottom: 8px; font-size: 22px; }
        .card p { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border-color); border-radius: 16px; font-size: 15px; background: #F8FAFC; }
        input:focus { outline: none; border-color: var(--accent); background: white; }
        .btn-enviar { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent) 0%, #299e91 100%); color: #04203a; border: none; border-radius: 16px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .erro { color: #EF4444; font-size: 13px; font-weight: 600; margin-top: 10px; display: none; }
        .sucesso { color: #059669; font-size: 14px; font-weight: 600; margin-top: 15px; text-align: center; display: none; }
        footer { background: var(--primary); color: #94A3B8; text-align: center; padding: 20px; margin-top: 60px; font-size: 13px; }
    </style>
</head>
<body>
<nav>
    <div class="nav-conteudo">
        <a href="/" class="logo">FlashCred</a>
        <div class="nav-links">
            <a href="/consultar">Consultar Proposta</a>
            <a href="/painel">Painel Admin</a>
        </div>
    </div>
</nav>
<main>
    <div class="card">
        <h2>Solicite seu Limite</h2>
        <p>Preencha os dados abaixo para enviar sua solicitação de análise de crédito.</p>
        <form id="formSolicitar">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" placeholder="Seu nome completo" required>
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>
            </div>
            <div class="form-group">
                <label>Telefone / WhatsApp</label>
                <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
            </div>
            <div class="form-group">
                <label>Valor Desejado (R$)</label>
                <input type="text" id="valor" placeholder="0,00" required>
            </div>
            <button type="submit" class="btn-enviar">Enviar Solicitação</button>
            <div class="erro" id="erroMsg"></div>
            <div class="sucesso" id="sucessoMsg">Solicitação enviada com sucesso! Redirecionando...</div>
        </form>
    </div>
</main>
<footer>
    <p>© 2026 FlashCred. Todos os direitos reservados.</p>
</footer>
<script>
document.getElementById('cpf').addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g,'');
    if (v.length > 11) v = v.slice(0, 11);
    e.target.value = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
});

document.getElementById('valor').addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g,'');
    v = (Number(v) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    e.target.value = v;
});

document.getElementById('formSolicitar').addEventListener('submit', e => {
    e.preventDefault();
    const nome = document.getElementById('nome').value;
    const cpf = document.getElementById('cpf').value;
    const telefone = document.getElementById('telefone').value;
    let valorStr = document.getElementById('valor').value.replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
    const valor_desejado = Number(valorStr);

    fetch('/api/propostas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, cpf, telefone, valor_desejado })
    })
    .then(res => res.json())
    .then(result => {
        if(result.success) {
            document.getElementById('sucessoMsg').style.display = 'block';
            setTimeout(() => { window.location.href = '/consultar'; }, 2000);
        } else {
            document.getElementById('erroMsg').textContent = "Erro ao enviar solicitação.";
            document.getElementById('erroMsg').style.display = 'block';
        }
    });
});
</script>
</body>
</html>
