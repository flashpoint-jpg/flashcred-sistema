<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Crédito - FlashCred | Distribuidora Flash Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        fundo: '#F8FAFC',
                        texto: '#1E293B'
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .card { border-radius: 20px; box-shadow: 0 4px 20px rgba(10,36,99,0.1); }
        .btn { border-radius: 12px; font-weight: 600; transition: 0.2s; }
        .btn:hover { transform: translateY(-1px); opacity: 0.95; }
        .input { border-radius: 12px; border: 1.5px solid #E2E8F0; padding: 12px; width: 100%; outline: none; }
        .input:focus { border-color: #0A2463; background: #FFF; }
    </style>
</head>
<body class="bg-fundo text-texto min-h-screen p-4">
    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,4vw,2.2rem)] font-extrabold text-primary">FlashCred</h1>
            <p class="text-sm text-gray-600">Limite Pix Parcelado - Distribuidora Flash Point</p>
            <div class="mt-4 bg-white card p-4">
                <p class="text-sm text-gray-700">✅ Sem cartão de crédito • ✅ Mesmo com restrição • ✅ Entrada flexível • ✅ Até 48x</p>
            </div>
        </header>

        <div class="bg-white card p-6 mb-6">
            <h2 class="text-xl font-bold text-primary mb-4">Preencha sua solicitação</h2>
            
            <div class="grid md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">Nome Completo *</label>
                    <input type="text" id="nome" class="input" placeholder="Digite seu nome" required>
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">CPF *</label>
                    <input type="text" id="cpf" class="input" placeholder="000.000.000-00" maxlength="14" required>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">Data de Nascimento *</label>
                    <input type="date" id="nascimento" class="input" required>
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">WhatsApp *</label>
                    <input type="text" id="whatsapp" class="input" placeholder="(00) 00000-0000" maxlength="15" required>
                </div>
            </div>

            <div class="grid md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">CEP *</label>
                    <input type="text" id="cep" class="input" placeholder="00000-000" maxlength="9" required onblur="buscarCep()">
                </div>
                <div class="md:col-span-2">
                    <label class="text-sm font-semibold text-gray-600 block mb-1">Endereço</label>
                    <input type="text" id="endereco" class="input" placeholder="Rua, Avenida" readonly>
                </div>
            </div>

            <div class="grid md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">Número *</label>
                    <input type="text" id="numero" class="input" placeholder="Nº" required>
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">Bairro</label>
                    <input type="text" id="bairro" class="input" readonly>
                </div>
                <div>
                    <label class="text-sm font-semibold text-gray-600 block mb-1">Cidade/UF</label>
                    <input type="text" id="cidade_uf" class="input" readonly>
                </div>
            </div>

            <div class="mb-4">
                <label class="text-sm font-semibold text-gray-600 block mb-1">Valor que deseja comprar (R$) *</label>
                <input type="number" id="valor_solicitado" class="input" min="100" step="0.01" placeholder="0,00" required>
            </div>

            <button onclick="enviarSolicitacao()" class="btn w-full bg-primary text-white py-3 mt-2">📤 Enviar Solicitação</button>
            <div id="avisoForm" class="mt-3 text-center text-sm font-medium hidden"></div>
        </div>

        <div class="flex justify-center gap-3">
            <a href="consultar.html" class="btn bg-white border border-primary text-primary px-4 py-2">🔍 Consultar Proposta</a>
            <a href="painel.html" class="btn bg-gray-100 text-gray-700 px-4 py-2">🔐 Painel Admin</a>
        </div>
    </div>

<script>
// Busca CEP automático
async function buscarCep() {
    const cep = document.getElementById('cep').value.replace(/\D/g, '');
    if(cep.length !== 8) return;
    try {
        const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const dados = await res.json();
        if(!dados.erro) {
            document.getElementById('endereco').value = dados.logradouro;
            document.getElementById('bairro').value = dados.bairro;
            document.getElementById('cidade_uf').value = `${dados.localidade}/${dados.uf}`;
        }
    } catch(e) {}
}

// Valida CPF
function validarCpf(cpf) {
    cpf = cpf.replace(/\D/g, '');
    if(cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
    let soma = 0, resto;
    for(let i=1; i<=9; i++) soma += parseInt(cpf[i-1]) * (11 - i);
    resto = (soma * 10) % 11;
    if(resto === 10 || resto === 11) resto = 0;
    if(resto !== parseInt(cpf[9])) return false;
    soma = 0;
    for(let i=1; i<=10; i++) soma += parseInt(cpf[i-1]) * (12 - i);
    resto = (soma * 10) % 11;
    if(resto === 10 || resto === 11) resto = 0;
    return resto === parseInt(cpf[10]);
}

// Valida Idade (mínimo 18 anos)
function validarIdade(dataNasc) {
    const nasc = new Date(dataNasc);
    const hoje = new Date();
    let idade = hoje.getFullYear() - nasc.getFullYear();
    const mes = hoje.getMonth() - nasc.getMonth();
    if (mes < 0 || (mes === 0 && hoje.getDate() < nasc.getDate())) idade--;
    return idade >= 18;
}

// Envia solicitação para o painel
function enviarSolicitacao() {
    const aviso = document.getElementById('avisoForm');
    aviso.style.display = 'none';

    const dados = {
        nome: document.getElementById('nome').value.trim(),
        cpf: document.getElementById('cpf').value.trim(),
        nascimento: document.getElementById('nascimento').value,
        whatsapp: document.getElementById('whatsapp').value.trim(),
        cep: document.getElementById('cep').value.trim(),
        endereco: document.getElementById('endereco').value.trim(),
        numero: document.getElementById('numero').value.trim(),
        bairro: document.getElementById('bairro').value.trim(),
        cidade_uf: document.getElementById('cidade_uf').value.trim(),
        valor_solicitado: document.getElementById('valor_solicitado').value,
        status: 'Nova',
        data_solicitacao: new Date().toLocaleDateString('pt-BR')
    };

    // Validações
    if(!dados.nome || !dados.cpf || !dados.nascimento || !dados.whatsapp || !dados.numero || !dados.valor_solicitado) {
        aviso.textContent = '⚠️ Preencha todos os campos obrigatórios!';
        aviso.className = 'mt-3 text-center text-sm font-medium text-red-600';
        aviso.style.display = 'block';
        return;
    }
    if(!validarCpf(dados.cpf)) {
        aviso.textContent = '⚠️ CPF inválido!';
        aviso.className = 'mt-3 text-center text-sm font-medium text-red-600';
        aviso.style.display = 'block';
        return;
    }
    if(!validarIdade(dados.nascimento)) {
        aviso.textContent = '⚠️ É necessário ter pelo menos 18 anos!';
        aviso.className = 'mt-3 text-center text-sm font-medium text-red-600';
        aviso.style.display = 'block';
        return;
    }

    // Salva para aparecer no painel
    const todas = JSON.parse(localStorage.getItem('propostas_clientes') || '[]');
    todas.unshift(dados);
    localStorage.setItem('propostas_clientes', JSON.stringify(todas));

    aviso.textContent = '✅ Solicitação enviada com sucesso! Aguardamos análise em até 24h.';
    aviso.className = 'mt-3 text-center text-sm font-medium text-green-600';
    aviso.style.display = 'block';

    // Limpa formulário
    setTimeout(() => {
        document.querySelectorAll('.input').forEach(i => i.value = '');
    }, 3000);
}
</script>
</body>
</html>
