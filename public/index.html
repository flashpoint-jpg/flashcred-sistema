<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        fundo: '#F8FAFC',
                        texto: '#1E293B',
                        borda: '#E2E8F0',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; padding: 20px 12px; }
        .container { max-width: 550px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(10, 36, 99, 0.08); padding: 28px; border: 1px solid #E2E8F0; }
        .titulo { font-size: 24px; font-weight: 700; color: #0A2463; text-align: center; margin-bottom: 24px; }
        .subtitulo { text-align: center; color: #64748B; margin-bottom: 28px; font-size: 14px; }
        .campo { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .campo label { font-weight: 500; font-size: 14px; color: #334155; }
        .campo input, .campo textarea { padding: 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; background: #FAFBFC; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(10, 36, 99, 0.15); }
        .btn-enviar { background: #0A2463; color: white; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .aviso { padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; text-align: center; }
        .aviso-alerta { background: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; }
        .aviso-erro { background: #FEE2E2; color: #B91C1C; border: 1px solid #EF4444; }
        .aviso-sucesso { background: #D1FAE5; color: #065F46; border: 1px solid #10B981; }
        .hidden { display: none !important; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 2px solid #E2E8F0; border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 class="titulo">📋 Solicitar Proposta</h1>
        <p class="subtitulo">Preencha os dados abaixo para solicitar seus móveis sem complicações</p>

        <div id="mensagem" class="aviso hidden"></div>

        <form id="formSolicitacao">
            <div class="campo">
                <label>Nome Completo *</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="campo">
                <label>CPF * (somente números)</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
            </div>

            <div class="campo">
                <label>WhatsApp / Telefone *</label>
                <input type="text" id="whatsapp" placeholder="(00) 00000-0000" maxlength="15" required>
            </div>

            <div class="campo">
                <label>CEP *</label>
                <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>
            </div>

            <div class="campo">
                <label>Endereço Completo</label>
                <input type="text" id="endereco" placeholder="Rua, Número, Bairro, Cidade/UF" required>
            </div>

            <div class="campo">
                <label>Valor Desejado / Valor dos Móveis R$ *</label>
                <input type="number" step="0.01" id="valor_solicitado" placeholder="0,00" required>
            </div>

            <button type="submit" id="btnEnviar" class="btn btn-enviar">
                <span>Enviar Solicitação</span>
            </button>
        </form>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById('formSolicitacao');
const btnEnviar = document.getElementById('btnEnviar');
const msgEl = document.getElementById('mensagem');

// Máscaras simples
document.getElementById('cpf').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '');
    if(v.length > 11) v = v.slice(0,11);
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d)/, '$1.$2');
    v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    e.target.value = v;
});

document.getElementById('whatsapp').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '');
    if(v.length > 11) v = v.slice(0,11);
    v = v.replace(/(\d{2})(\d)/, '($1) $2');
    v = v.replace(/(\d{5})(\d)/, '$1-$2');
    e.target.value = v;
});

document.getElementById('cep').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '');
    if(v.length > 8) v = v.slice(0,8);
    v = v.replace(/(\d{5})(\d)/, '$1-$2');
    e.target.value = v;
});

// ✅ VERIFICA SE CPF JÁ EXISTE
async function verificarCpfJaCadastrado(cpfLimpo) {
    try {
        const { data, error } = await supabase
            .from('propostas')
            .select('id')
            .eq('cpf', cpfLimpo)
            .limit(1);
        
        if(error) throw error;
        return data && data.length > 0;
    } catch (erro) {
        console.log('Erro ao verificar CPF:', erro);
        return false;
    }
}

function mostrarMensagem(texto, tipo = 'alerta') {
    msgEl.textContent = texto;
    msgEl.className = `aviso aviso-${tipo}`;
    msgEl.classList.remove('hidden');
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btnEnviar.disabled = true;
    btnEnviar.innerHTML = '<span class="loading"></span> Enviando...';
    msgEl.classList.add('hidden');

    try {
        // Pegar e limpar dados
        const cpf = document.getElementById('cpf').value;
        const cpfLimpo = cpf.replace(/\D/g, '');

        // Validações básicas
        if(cpfLimpo.length !== 11) throw new Error('Informe um CPF válido com 11 números');

        // 🚫 BLOQUEIA CPF REPETIDO
        const cpfExiste = await verificarCpfJaCadastrado(cpfLimpo);
        if(cpfExiste) {
            throw new Error('⚠️ Este CPF já possui uma solicitação cadastrada! Acompanhe pelo botão "Consultar Proposta" ou entre em contato conosco.');
        }

        const dados = {
            nome: document.getElementById('nome').value.trim(),
            cpf: cpfLimpo,
            whatsapp: document.getElementById('whatsapp').value.replace(/\D/g, ''),
            cep: document.getElementById('cep').value.replace(/\D/g, ''),
            endereco: document.getElementById('endereco').value.trim(),
            valor_solicitado: parseFloat(document.getElementById('valor_solicitado').value) || 0,
            status: 'pendente',
            created_at: new Date().toISOString()
        };

        if(!dados.nome) throw new Error('Informe seu nome completo');
        if(!dados.whatsapp || dados.whatsapp.length < 10) throw new Error('Informe um WhatsApp válido');
        if(!dados.valor_solicitado || dados.valor_solicitado <= 0) throw new Error('Informe o valor dos móveis');

        // Salvar no Supabase
        const { error } = await supabase.from('propostas').insert([dados]);
        if(error) throw error;

        mostrarMensagem('✅ Solicitação enviada com sucesso! Você receberá retorno em breve pelo WhatsApp.', 'sucesso');
        form.reset();

        setTimeout(() => {
            window.location.href = 'consultar.html';
        }, 2500);

    } catch (erro) {
        mostrarMensagem(erro.message || 'Erro ao enviar solicitação, tente novamente', 'erro');
    } finally {
        btnEnviar.disabled = false;
        btnEnviar.innerHTML = '<span>Enviar Solicitação</span>';
    }
});
</script>
</body>
</html>
