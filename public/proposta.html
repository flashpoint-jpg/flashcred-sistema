<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashpoint - Todas Propostas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    primary: '#C8102E',
                    secundaria: '#1E293B',
                    sucesso: '#10B981',
                    alerta: '#F59E0B',
                    perigo: '#EF4444',
                    fundo: '#F8FAFC'
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; display: flex; }

        /* MENU LATERAL PADRONIZADO */
        .sidebar {
            width: 220px;
            background: #1E293B;
            color: white;
            padding: 1.2rem;
            position: fixed;
            height: 100vh;
        }
        .sidebar h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
        }
        .sidebar .grupo-titulo {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94A3B8;
            margin: 1.5rem 0 0.5rem;
            font-weight: 600;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: #CBD5E1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .sidebar a.ativo { background: #C8102E; color: white; }
        .sidebar a:hover:not(.ativo) { background: #334155; }

        /* CONTEÚDO */
        .conteudo {
            flex: 1;
            margin-left: 220px;
            padding: 2rem 3rem;
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .cabecalho h2 { font-size: 1.7rem; font-weight: 700; color: #1E293B; }
        .campo-busca {
            padding: 0.7rem 1rem;
            border: 1px solid #CBD5E1;
            border-radius: 0.6rem;
            width: 280px;
            outline: none;
        }
        .campo-busca:focus { border-color: #C8102E; }

        .filtros {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .btn-filtro {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-todos { background: #E5E7EB; }
        .btn-analise { background: #FEF3C7; color: #92400E; }
        .btn-aprovado { background: #D1FAE5; color: #065F46; }
        .btn-reprovado { background: #FEE2E2; color: #991B1B; }

        .card-proposta {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 1rem;
        }
        .cab-proposta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .nome-cliente { font-size: 1.1rem; font-weight: 600; color: #1E293B; }
        .tag-status {
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .tag-analise { background: #FEF3C7; color: #92400E; }
        .tag-aprovado { background: #D1FAE5; color: #065F46; }
        .tag-reprovado { background: #FEE2E2; color: #991B1B; }

        .dados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        .dado span { font-weight: 500; color: #64748B; }

        .acoes {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .btn-acao {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-ver { background: #3B82F6; color: white; }
        .btn-aprovar { background: #10B981; color: white; }
        .btn-reprovar { background: #EF4444; color: white; }
        .btn-excluir { background: #6B7280; color: white; }

        .vazio { text-align: center; padding: 3rem; color: #64748B; }

        .rodape {
            margin-left: 220px;
            text-align: center;
            padding: 1.5rem;
            color: #64748B;
            font-size: 0.85rem;
            border-top: 1px solid #E2E8F0;
            background: white;
            margin-top: 2rem;
        }
        .rodape strong { color: #C8102E; }
    </style>
</head>
<body>
    <!-- MENU LATERAL -->
    <div class="sidebar">
        <h2>📦 Flashpoint</h2>

        <div class="grupo-titulo">PRINCIPAL</div>
        <a href="index.html"><i class="fa fa-home"></i> Início</a>
        <a href="proposta.html"><i class="fa fa-user-plus"></i> Nova Proposta</a>
        <a href="clientes.html"><i class="fa fa-users"></i> Lista de Clientes</a>

        <div class="grupo-titulo">FINANCEIRO</div>
        <a href="propostas.html" class="ativo"><i class="fa fa-list"></i> Todas Propostas</a>
        <a href="parcelas.html"><i class="fa fa-calendar-check-o"></i> Controle Parcelas</a>
        <a href="relatorios.html"><i class="fa fa-bar-chart"></i> Relatórios</a>

        <div class="grupo-titulo">CONFIGURAÇÕES</div>
        <a href="configuracoes.html"><i class="fa fa-cog"></i> Sistema</a>
    </div>

    <div class="conteudo">
        <div class="cabecalho">
            <h2>📋 Todas as Propostas</h2>
            <input type="text" id="busca" class="campo-busca" placeholder="Buscar por nome, CPF ou valor..." oninput="filtrarPropostas()">
        </div>

        <div class="filtros">
            <button class="btn-filtro btn-todos" onclick="aplicarFiltro('todos')">Todos</button>
            <button class="btn-filtro btn-analise" onclick="aplicarFiltro('EM_ANALISE')">Em Análise</button>
            <button class="btn-filtro btn-aprovado" onclick="aplicarFiltro('APROVADO')">Aprovadas</button>
            <button class="btn-filtro btn-reprovado" onclick="aplicarFiltro('REPROVADO')">Reprovadas</button>
        </div>

        <div id="listaPropostas"></div>
    </div>

    <div class="rodape">
        💻 <strong>Sistema desenvolvido por Felipe Costa</strong> © Todos os direitos reservados.
    </div>

<script>
let filtroAtual = 'todos';

function carregarPropostas() {
    const propostas = JSON.parse(localStorage.getItem('propostasFlashpoint') || '[]');
    const lista = document.getElementById('listaPropostas');
    lista.innerHTML = '';

    if(propostas.length === 0) {
        lista.innerHTML = `<div class="vazio"><i class="fa fa-inbox fa-2x mb-3"></i><p>Nenhuma proposta recebida ainda.</p></div>`;
        return;
    }

    let filtradas = propostas;
    if(filtroAtual !== 'todos') {
        filtradas = propostas.filter(p => p.status === filtroAtual);
    }

    const termoBusca = document.getElementById('busca').value.toLowerCase();
    if(termoBusca) {
        filtradas = filtradas.filter(p => 
            p.nome.toLowerCase().includes(termoBusca) ||
            p.cpf.includes(termoBusca) ||
            (p.valorSolicitado || '').toString().includes(termoBusca)
        );
    }

    if(filtradas.length === 0) {
        lista.innerHTML = `<div class="vazio"><i class="fa fa-search fa-2x mb-3"></i><p>Nenhuma proposta encontrada com esse filtro.</p></div>`;
        return;
    }

    filtradas.forEach((proposta, indice) => {
        const tagClasse = {
            'EM_ANALISE': 'tag-analise',
            'APROVADO': 'tag-aprovado',
            'REPROVADO': 'tag-reprovado'
        }[proposta.status];
        const statusTexto = {
            'EM_ANALISE': 'Em Análise',
            'APROVADO': 'Aprovado',
            'REPROVADO': 'Reprovado'
        }[proposta.status];

        lista.innerHTML += `
        <div class="card-proposta">
            <div class="cab-proposta">
                <span class="nome-cliente">${proposta.nome}</span>
                <span class="tag-status ${tagClasse}">${statusTexto}</span>
            </div>
            <div class="dados-grid">
                <div><span>CPF:</span> ${proposta.cpf}</div>
                <div><span>WhatsApp:</span> ${proposta.whatsapp || '-'}</div>
                <div><span>Data Nasc.:</span> ${proposta.nascimento}</div>
                <div><span>Valor Solicitado:</span> R$ ${(proposta.valorSolicitado || 0).toFixed(2).replace('.', ',')}</div>
                <div><span>Data Envio:</span> ${proposta.dataEnvio || '-'}</div>
                <div><span>CEP:</span> ${proposta.cep}</div>
            </div>
            <div class="acoes">
                ${proposta.status === 'EM_ANALISE' ? `
                <button class="btn-acao btn-aprovar" onclick="alterarStatus(${indice}, 'APROVADO')">
                    <i class="fa fa-check"></i> Aprovar
                </button>
                <button class="btn-acao btn-reprovar" onclick="alterarStatus(${indice}, 'REPROVADO')">
                    <i class="fa fa-times"></i> Reprovar
                </button>
                ` : ''}
                <button class="btn-acao btn-excluir" onclick="excluirProposta(${indice})">
                    <i class="fa fa-trash"></i> Excluir
                </button>
            </div>
        </div>`;
    });
}

function aplicarFiltro(filtro) {
    filtroAtual = filtro;
    carregarPropostas();
}

function filtrarPropostas() {
    carregarPropostas();
}

function alterarStatus(indice, novoStatus) {
    if(!confirm(novoStatus === 'APROVADO' ? 'Confirmar aprovação dessa proposta?' : 'Confirmar reprovação dessa proposta?')) return;
    const propostas = JSON.parse(localStorage.getItem('propostasFlashpoint') || '[]');
    propostas[indice].status = novoStatus;
    localStorage.setItem('propostasFlashpoint', JSON.stringify(propostas));
    carregarPropostas();
    alert(`✅ Proposta ${novoStatus === 'APROVADO' ? 'aprovada' : 'reprovada'} com sucesso!`);
}

function excluirProposta(indice) {
    if(!confirm('Tem certeza que deseja excluir esta proposta?')) return;
    const propostas = JSON.parse(localStorage.getItem('propostasFlashpoint') || '[]');
    propostas.splice(indice, 1);
    localStorage.setItem('propostasFlashpoint', JSON.stringify(propostas));
    carregarPropostas();
}

// Carrega ao abrir
carregarPropostas();
</script>
</body>
</html>
