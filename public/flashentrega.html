<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashEntregas | Muzambinho-MG</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    body{font-family:'Inter',sans-serif;background:#FBF5EA;color:#241C15}
    .painel{background:#fff;border-radius:22px;box-shadow:0 16px 40px rgba(36,28,21,.08);border:1px solid #E8DFCB;padding:26px}
    .rotulo{display:block;margin-bottom:6px;font-weight:700;font-size:13px;color:#241C15}
    .campo{width:100%;border:1.5px solid #E8DFCB;border-radius:12px;padding:12px 14px;background:#FBF5EA;font-size:15px}
    .btn-marca{font-weight:700;border-radius:14px;border:none;cursor:pointer;color:white}
    .selo-preco{background:rgba(47,107,79,.07);border:1.5px dashed #2F6B4F;border-radius:16px;padding:16px;text-align:center}
</style>
</head>
<body class="p-4">
<main class="max-w-lg mx-auto">
    <div id="formCliente" class="painel mb-6">
        <h3 class="text-lg font-bold mb-4 text-chapa flex items-center gap-2"><i class="fa-solid fa-location-arrow text-terra"></i> Pedir Entrega</h3>
        <div class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="rotulo">Nome de quem está enviando 👤</label>
                    <input type="text" id="nomeRemetente" class="campo" placeholder="Seu nome">
                </div>
                <div>
                    <label class="rotulo">Nome de quem vai receber 🎯</label>
                    <input type="text" id="nomeDestinatario" class="campo" placeholder="Nome do destinatário">
                </div>
            </div>
            <div>
                <label class="rotulo">De onde sai (Origem) 📍</label>
                <input type="text" id="enderecoOrigem" class="campo" placeholder="Rua, número, bairro">
            </div>
            <div>
                <label class="rotulo">Pra onde vai (Destino) 🎯</label>
                <input type="text" id="enderecoDestino" class="campo" placeholder="Rua, número, bairro">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="rotulo">O que levar 📦</label>
                    <select id="tipoItem" class="campo">
                        <option>📦 Caixa / Encomenda pequena</option>
                        <option>🛋️ Objeto médio / Móvel</option>
                        <option>🍔 Comida / Refeição</option>
                        <option>📦 Grande / Volumoso (Ajudante)</option>
                    </select>
                </div>
                <div>
                    <label class="rotulo">Qtd. volumes 🔢</label>
                    <input type="number" id="qtdCaixas" class="campo" min="1" value="1">
                </div>
            </div>
            <div>
                <label class="rotulo">Telefone 📲</label>
                <input type="tel" id="telefoneCliente" class="campo" placeholder="(35) 9XXXX-XXXX">
            </div>
            <div>
                <label class="rotulo">Observações 📝</label>
                <input type="text" id="observacaoPedido" class="campo" placeholder="Dicas para o entregador...">
            </div>
            <div class="rounded-2xl p-4 border-2 border-[#2F6B4F] bg-[#f0f7f3]">
                <p class="font-bold text-[#2F6B4F] mb-1"><i class="fa-brands fa-pix"></i> Pagamento via Pix</p>
                <p class="text-xs text-gray-700">O pedido é liberado automaticamente após confirmação.</p>
                <p class="font-mono font-bold text-center mt-2 bg-white p-2 rounded">pix@flashentregas.com.br</p>
            </div>
            <div class="selo-preco">
                <p class="text-gray-600">Valor estimado</p>
                <p class="text-2xl font-bold text-[#2F6B4F]" id="valorEstimadoTexto">Preencha os endereços</p>
            </div>
            <button onclick="confirmarEntrega()" id="btnConfirmarEntrega" class="btn-marca w-full py-4" style="background:#2F6B4F">
                💳 Pagar com Pix e Enviar
            </button>
        </div>
    </div>
</main>
<script>
    async function geocodificarEndereco(endereco) {
        const viewbox = "-46.65,-21.50,-46.30,-21.20"; 
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(endereco + ', Muzambinho, MG, Brasil')}&viewbox=${viewbox}&bounded=1`;
        const resp = await fetch(url);
        const dados = await resp.json();
        if (dados && dados[0]) return { lat: parseFloat(dados[0].lat), lng: parseFloat(dados[0].lon) };
        alert('Ops! Só atendemos em Muzambinho e região próxima.');
        return null;
    }
    
    async function confirmarEntrega() {
        alert('Pedido processado com sucesso! Aguardando confirmação do Pix.');
    }
</script>
</body>
</html>
