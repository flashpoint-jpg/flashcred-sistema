<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashpoint - Solicitar Proposta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C8102E',
                        secundaria: '#1E293B',
                        claro: '#F8FAFC',
                        cinza: '#64748B'
                    },
                    fontFamily: {
                        sans: ['Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card-form {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 1.2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            padding: 2.5rem 2rem;
        }
        .titulo-principal {
            font-size: 1.8rem;
            font-weight: 800;
            color: #C8102E;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .subtitulo {
            text-align: center;
            color: #64748B;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        .grupo-campo {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            font-weight: 500;
            color: #1E293B;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1.5px solid #E2E8F0;
            border-radius: 0.7rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #FAFBFC;
        }
        input:focus {
            outline: none;
            border-color: #C8102E;
            background: white;
            box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.1);
        }
        input::placeholder {
            color: #94A3B8;
        }
        .linha-dupla {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
        }
        .btn-enviar {
            width: 100%;
            padding: 1rem;
            background: #C8102E;
            color: white;
            border: none;
            border-radius: 0.7rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 1rem;
        }
        .btn-enviar:hover {
            background: #A00D25;
        }
        .rodape-pagina {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #94A3B8;
        }
        .rodape-pagina strong {
            color: #C8102E;
        }

        /* Ajuste para celular */
        @media (max-width: 500px) {
            .linha-dupla {
                grid-template-columns: 1fr;
            }
            .card-form {
                padding: 1.8rem 1.2rem;
            }
            .titulo-principal {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="card-form">
        <h1 class="titulo-principal">Flashpoint Distribuidora</h1>
        <p class="subtitulo">Preencha seus dados para solicitar uma proposta</p>

        <form>
            <div class="grupo-campo">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="grupo-campo">
                <label for="cpf">CPF *</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
            </div>

            <div class="grupo-campo">
                <label for="whatsapp">WhatsApp com DDD *</label>
                <input type="text" id="whatsapp" placeholder="(00) 00000-0000" required>
            </div>

            <div class="linha-dupla">
                <div class="grupo-campo">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" placeholder="00000-000" required>
                </div>
                <div class="grupo-campo">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" placeholder="Nº">
                </div>
            </div>

            <div class="grupo-campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" placeholder="Rua, Bairro, Cidade/UF">
            </div>

            <button type="submit" class="btn-enviar">Solicitar Proposta</button>
        </form>

        <div class="rodape-pagina">
            💻 <strong>Sistema desenvolvido por Felipe Costa</strong> © Todos os direitos reservados.
        </div>
    </div>
</body>
</html>
