<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar Flash Trocas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(180deg,#f8fbff,#eef4fb)}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 18px 50px rgba(15,23,42,.08)}.step{display:flex;gap:14px;position:relative;padding-bottom:28px}.dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e2e8f0;z-index:2;font-weight:800}.step.done .dot{background:#10b981;color:white}.step.active .dot{background:#2563eb;color:white;box-shadow:0 0 0 8px #dbeafe;animation:pulse 1.6s infinite}.line{position:absolute;left:16px;top:36px;height:calc(100% - 20px);width:4px;background:#e2e8f0}.step.done .line{background:#10b981}@keyframes pulse{50%{box-shadow:0 0 0 13px rgba(37,99,235,.04)}}.progress{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#10b981);transition:width .8s}</style></head><body><main class="max-w-3xl mx-auto p-4 py-8"><header class="text-center mb-6"><div class="text-3xl font-black text-blue-900">FLASH <span class="text-blue-600">TROCAS</span></div><p class="text-slate-500">Acompanhe sua solicitação em tempo real</p></header><div id="login" class="card p-6"><h1 class="text-2xl font-black text-blue-900">Acompanhar minha troca</h1><p class="text-slate-500 mt-2">Cole o código ou use o link recebido após o envio.</p><input id="id" class="w-full border rounded-xl px-4 py-3 mt-5" placeholder="Código/ID da solicitação"><button onclick="buscar()" class="w-full mt-3 bg-blue-700 text-white font-bold py-3 rounded-xl">Consultar</button><p id="err" class="text-red-600 text-sm mt-3 hidden"></p></div><div id="app" class="hidden"><div class="card p-6 mb-5"><div class="flex justify-between gap-3"><div><p class="text-slate-500">Olá, <b id="nome"></b></p><h2 class="text-2xl font-black text-blue-900">Acompanhamento da sua troca</h2></div><span id="status" class="px-3 py-1 rounded-full bg-blue-50 text-blue-700 font-bold h-fit"></span></div><div class="mt-6 flex justify-between text-sm font-bold"><span>Evolução</span><span id="pct"></span></div><div class="progress mt-2"><div id="bar"></div></div></div><div class="card p-6 mb-5"><h3 class="text-xl font-black text-blue-900 mb-5">Etapas</h3><div id="steps"></div></div><div class="card p-6 mb-5"><h3 class="text-xl font-black text-blue-900 mb-4">Resumo da solicitação</h3><div class="grid md:grid-cols-2 gap-4 text-sm"><div><span class="text-slate-500">Equipamento</span><p id="equip" class="font-bold"></p></div><div><span class="text-slate-500">Valor avaliado</span><p id="valor" class="font-bold"></p></div><div><span class="text-slate-500">Móveis desejados</span><p id="moveis" class="font-bold"></p></div><div><span class="text-slate-500">Observação</span><p id="obs" class="font-bold"></p></div></div></div><a href="https://wa.me/5511973294235" target="_blank" class="block text-center bg-green-600 text-white font-bold py-3 rounded-xl">Falar com a Flash Point</a></div></main><script>
const db=window.supabase.createClient('https://rgcclordmqjmwuzrrfbd.supabase.co','sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi');
const stages=['Nova','Em avaliação','Aprovada','Negociação','Concluída'];const names=['Solicitação enviada','Equipamento em análise','Avaliação do valor','Negociação dos móveis','Troca aprovada'];
function money(v){return v==null||v===''?'Aguardando avaliação':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function buscar(id0){const id=id0||document.getElementById('id').value.trim();if(!id)return;const {data,error}=await db.from('flash_trocas').select('*').eq('id',id).maybeSingle();if(error||!data){document.getElementById('err').textContent=error?.message||'Solicitação não encontrada.';document.getElementById('err').classList.remove('hidden');return}render(data)}
function render(d){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('nome').textContent=d.nome||'cliente';document.getElementById('status').textContent=d.status||'Nova';document.getElementById('equip').textContent=[d.tipo_equipamento,d.marca_modelo,d.ano].filter(Boolean).join(' • ');document.getElementById('valor').textContent=money(d.valor_avaliado);document.getElementById('moveis').textContent=d.moveis_interesse||'-';document.getElementById('obs').textContent=d.observacoes||'Nossa equipe está analisando sua solicitação.';let i=stages.indexOf(d.status);if(d.status==='Recusada')i=-1;const pct=i<0?0:Math.round(i/4*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';document.getElementById('steps').innerHTML=names.map((n,k)=>`<div class="step ${k<i?'done':''} ${k===i?'active':''}">${k<4?'<div class="line"></div>':''}<div class="dot">${k<i?'✓':k+1}</div><div><b class="${k===i?'text-blue-700':''}">${n}</b><p class="text-sm text-slate-500">${k===i?esc(d.observacoes||'Etapa atual da sua solicitação.'):k<i?'Concluída.':'Aguardando esta etapa.'}</p></div></div>`).join('')}
const q=new URLSearchParams(location.search);if(q.get('id'))buscar(q.get('id'));setInterval(async()=>{const id=q.get('id')||document.getElementById('id').value.trim();if(id&&!document.getElementById('app').classList.contains('hidden')){const {data}=await db.from('flash_trocas').select('*').eq('id',id).maybeSingle();if(data)render(data)}},15000);
</script></body></html>
