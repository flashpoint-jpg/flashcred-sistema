<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #F8FAFC; min-height: 100vh; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 28px; max-width: 520px; margin: 0 auto; box-shadow: 0 4px 20px rgba(10,36,99,0.1); }
        .titulo { text-align: center; color: #0A2463; margin-bottom: 20px; font-size: 24px; font-weight: 700; }
        .input { width: 100%; padding: 14px; border: 1px solid #CBD5E1; border-radius: 12px; margin-bottom: 16px; font-size: 16px; }
        .input:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10,36,99,0.15); }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-primary:hover { background: #081C4A; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .resultado { margin-top: 20px; padding: 16px; border-radius: 12px; display: none; }
        .status { font-weight: 700; font-size: 18px; text-align: center; margin-bottom: 12px; }
        .carregando { display: inline-block; width: 18px; height: 18px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: rodar 0.8s linear infinite; margin-right: 8px; }
        @keyframes rodar { to { transform: rotate(360deg); } }
        .dado { margin: 8px 0; font-size: 15px; }
        .dado strong { color: #0A2463; }
        .aviso-erro { background: #FEF2F2; color: #DC2626; padding: 14px; border-radius: 12px; text-align: center; display: none; }
    </style>
</head>
<body>
<div class="card">
    <h1 class="titulo">🔍 Acompanhar Proposta</h1>

    <form id="formConsultar">
        <label style="font-weight: 600; color: #0A2463; display: block; margin-bottom: 6px;">Digite seu CPF</label>
        <input type="text" id="cpfConsulta" class="input" placeholder="000.000.000-00" maxlength="14" required>
        
        <button type="submit" id="btnConsultar" class="btn btn-primary">
            <span id="textoBtnConsultar">Verificar Situação</span>
            <span id="spinnerConsultar" class="carregando" style="display: none;"></span>
        </button>
    </form>

    <div id="avisoErro" class="aviso-erro">
        ❌ Nenhuma proposta encontrada. Verifique o CPF ou aguarde nosso contato.
    </div>

    <div id="resultadoProposta" class="resultado">
        <div id="statusProposta" class="status"></div>
        <div class="dado"><strong>Nome:</strong> <span id="resNome"></span></div>
        <div class="dado"><strong>CPF:</strong> <span id="resCpf"></span></div>
        <div class="dado"><strong>Data de Nascimento:</strong> <span id="resNascimento"></span></div>
        <div class="dado"><strong>Valor Solicitado:</strong> R$ <span id="resValor"></span></div>
        <div class="dado"><strong>Data de Envio:</strong> <span id="resData"></span></div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Máscara e remoção de caracteres para busca
document.getElementById('cpfConsulta').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
});

// Pega CPF que veio pelo link direto do formulário
window.addEventListener('load', () => {
    const parametros = new URLSearchParams(window.location.search);
    const cpfUrl = parametros.get('cpf');
    if(cpfUrl) {
        document.getElementById('cpfConsulta').value = cpfUrl.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        buscarProposta(cpfUrl.replace(/\D/g, ''));
    }
});

document.getElementById('formConsultar').addEventListener('submit', async e => {
    e.preventDefault();
    const cpfLimpo = document.getElementById('cpfConsulta').value.replace(/\D/g, '');
    buscarProposta(cpfLimpo);
});

async function buscarProposta(cpfSemMascara) {
    const btn = document.getElementById('btnConsultar');
    const textoBtn = document.getElementById('textoBtnConsultar');
    const spinner = document.getElementById('spinnerConsultar');
    const avisoErro = document.getElementById('avisoErro');
    const resultado = document.getElementById('resultadoProposta');

    btn.disabled = true;
    textoBtn.textContent = 'Buscando...';
    spinner.style.display = 'inline-block';
    avisoErro.style.display = 'none';
    resultado.style.display = 'none';

    try {
        // BUSCA EXATA PELO CPF SEM MÁSCARA, IGUAL FOI SALVO
        const { data, error } = await supabase
            .from('propostas')
            .select('*')
            .eq('cpf', cpfSemMascara)
            .order('id', { ascending: false })
            .limit(1);

        if(error) throw error;

        if(!data || data.length === 0) {
            avisoErro.style.display = 'block';
            return;
        }

        const proposta = data[0];
        // PREENCHE OS DADOS
        document.getElementById('resNome').textContent = proposta.nome;
        document.getElementById('resCpf').textContent = proposta.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        document.getElementById('resNascimento').textContent = new Date(proposta.nascimento).toLocaleDateString('pt-BR');
        document.getElementById('resValor').textContent = parseFloat(proposta.valor_desejado).toFixed(2).replace('.', ',');
        document.getElementById('resData').textContent = new Date(proposta.created_at || new Date()).toLocaleDateString('pt-BR');

        // COR DO STATUS
        const statusEl = document.getElementById('statusProposta');
        statusEl.textContent = `📋 ${proposta.status || 'Nova'}`;
        if(proposta.status === 'Aprovada') statusEl.style.color = '#10B981';
        else if(proposta.status === 'Reprovada') statusEl.style.color = '#EF4444';
        else statusEl.style.color = '#F59E0B';

        resultado.style.display = 'block';

    } catch(erro) {
        avisoErro.textContent = '⚠️ Erro ao buscar: ' + erro.message;
        avisoErro.style.display = 'block';
    } finally {
        btn.disabled = false;
        textoBtn.textContent = 'Verificar Situação';
        spinner.style.display = 'none';
    }
}
</script>
</body>
</html>
