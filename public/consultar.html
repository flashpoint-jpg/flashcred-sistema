<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%); color: #1E293B; padding: 16px; max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .cartao { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.08); margin-bottom: 16px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .botao { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-size: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .botao:hover { transform: translateY(-1px); filter: brightness(1.05); }
        .botao:active { transform: translateY(1px); }
        .botao-pix { background: #32BCAD; color: white; }
        .botao-sucesso { background: #10B981; color: white; }
        .botao-voltar { background: #64748B; color: white; margin-bottom: 12px; }
        .botao-pequeno { width: auto; padding: 8px 16px; font-size: 14px; box-shadow: none; }
        .campo { width: 100%; padding: 14px; border: 2px solid #CBD5E1; border-radius: 10px; font-size: 16px; margin-bottom: 16px; outline: none; transition: border-color 0.2s; }
        .campo:focus { border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10,36,99,0.1); }
        
        /* Animações e Transições das Etapas */
        .barra-etapas { display: flex; justify-content: space-between; margin-bottom: 24px; position: relative; padding: 0 4px; }
        .barra-etapas::before { content: ''; position: absolute; top: 12px; left: 8%; right: 8%; height: 3px; background: #E2E8F0; z-index: 0; }
        .etapa { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; font-size: 10px; font-weight: 500; color: #94A3B8; text-align: center; width: 18%; transition: all 0.4s ease; }
        .etapa.ativa { color: #0A2463; font-weight: 700; transform: scale(1.08); }
        .etapa.concluida { color: #10B981; }
        .bolinha { width: 28px; height: 28px; border-radius: 50%; background: #E2E8F0; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; font-size: 13px; font-weight: bold; transition: all 0.4s ease; }
        .etapa.ativa .bolinha { background: #0A2463; color: white; box-shadow: 0 0 15px rgba(10, 36, 99, 0.5); }
        .etapa.concluida .bolinha { background: #10B981; color: white; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

        /* Animação charmosa de carregamento do cartão de consulta */
        @keyframes ondaEntrada { 0% { transform: scale(1); box-shadow: 0 10px 25px rgba(0,0,0,0.08); } 50% { transform: scale(0.97); box-shadow: 0 5px 15px rgba(10,36,99,0.15); filter: brightness(0.98); } 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(0,0,0,0.08); } }
        .animando-busca { animation: ondaEntrada 0.7s infinite ease-in-out; }

        .bloco-entrega { background: #FFFBEB; border: 2px solid #F59E0B; border-radius: 12px; padding: 16px; margin: 16px 0; text-align: center; }
        .resumo-contrato { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 12px; padding: 16px; margin: 16px 0; }
        .resumo-contrato p { margin: 8px 0; font-size: 15px; }
        .resumo-contrato strong { color: #0A2463; }
        .contrato { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 16px; max-height: 220px; overflow-y: auto; margin: 16px 0; font-size: 13px; line-height: 1.6; text-align: justify; }
        .codigo-pix { background: #ECFDF5; border: 2px solid #10B981; border-radius: 12px; padding: 16px; text-align: center; font-weight: 600; margin: 16px 0; word-break: break-all; font-size: 12px; }
        .item-parcela { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
        .item-parcela:last-child { border-bottom: none; }
        .luz { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .luz-verde { background: #10B981; }
        .luz-amarela { background: #F59E0B; animation: piscar 1.2s infinite; }
        .luz-vermelha { background: #EF4444; animation: piscar 1s infinite; }
        @keyframes piscar { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
        .tela { display: none; }
        .tela.visivel { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .oculto { display: none !important; }
        .sucesso-box { background: #ECFDF5; border: 2px solid #10B981; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; }
        .sucesso-box i { font-size: 48px; color: #10B981; margin-bottom: 12px; }
    </style>
</head>
<body>

<div id="telaConsulta" class="tela visivel">
    <div class="cartao text-center" id="cardConsulta">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 text-primary rounded-full mb-4 shadow-inner">
            <i class="fas fa-search text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2 text-primary">FlashCred</h2>
        <p class="text-slate-500 text-sm mb-6">Digite seu CPF para acompanhar a proposta</p>
        <input type="text" id="cpfConsulta" placeholder="000.000.000-00" maxlength="11" class="campo text-center font-bold tracking-widest">
        <button id="btnConsultar" onclick="consultar()" class="botao botao-pix flex items-center justify-center gap-2">
            <span>Consultar Proposta</span>
        </button>
    </div>
</div>

<div id="telaProposta" class="tela">
    <div class="flex justify-between items-center mb-2">
        <button onclick="voltarInicio()" class="botao botao-voltar w-auto px-4 py-2 text-sm"><i class="fas fa-arrow-left"></i> Voltar</button>
        <button onclick="recarregarDados()" class="botao botao-pequeno bg-blue-50 text-primary border border-blue-200"><i class="fas fa-sync-alt"></i> Atualizar Status</button>
    </div>
    <div class="barra-etapas" id="barraEtapas"></div>
    <div class="cartao" id="conteudoProposta"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

// ⚠️ ATENÇÃO: Substitua abaixo pela URL correta do seu backend publicado no Render (ex: https://seu-projeto.onrender.com)
const BACKEND_URL = 'https://COLOQUE_SUA_URL_REAL_DO_RENDER_AQUI.onrender.com';

let propostaAtual = null;
let inscricaoTempoReal = null;

window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const cpfUrl = params.get('cpf');
    if(cpfUrl) {
        document.getElementById('cpfConsulta').value = cpfUrl.replace(/\D/g,'');
        consultar();
    }
};

function voltarInicio() {
    if(inscricaoTempoReal) supabase.removeChannel(inscricaoTempoReal);
    propostaAtual = null;
    document.getElementById('cpfConsulta').value = '';
    document.getElementById('telaProposta').classList.remove('visivel');
    document.getElementById('telaConsulta').classList.add('visivel');
}

async function consultar() {
    const cpf = document.getElementById('cpfConsulta').value.trim().replace(/\D/g,'');
    if(cpf.length !== 11) return alert('Digite o CPF completo!');

    const btn = document.getElementById('btnConsultar');
    const card = document.getElementById('cardConsulta');
    
    // Animação charmosa de transição ao buscar
    card.classList.add('animando-busca');
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Buscando no sistema...`;
    btn.disabled = true;

    await new Promise(r => setTimeout(r, 800)); // Tempo da animação fluida

    const {data, error} = await supabase.from('propostas').select('*').eq('cpf', cpf).single();
    
    card.classList.remove('animando-busca');
    btn.innerHTML = `Consultar Proposta`;
    btn.disabled = false;

    if(error || !data) return alert('Proposta não encontrada! Verifique o CPF.');

    propostaAtual = data;
    mostrarProposta(data);
    
    if(inscricaoTempoReal) supabase.removeChannel(inscricaoTempoReal);
    inscricaoTempoReal = supabase.channel(`proposta_${propostaAtual.id}`)
        .on('postgres_changes', {event:'UPDATE', schema:'public', table:'propostas', filter:`id=eq.${propostaAtual.id}`}, (res)=>{
            propostaAtual = res.new;
            mostrarProposta(res.new);
        }).subscribe();
}

// Botão para forçar busca atualizada caso a entrada já tenha sido paga e o Webhook demore
async function recarregarDados() {
    if(!propostaAtual) return;
    const {data} = await supabase.from('propostas').select('*').eq('id', propostaAtual.id).single();
    if(data) {
        propostaAtual = data;
        mostrarProposta(data);
        alert('Status atualizado com sucesso!');
    }
}

function formatarValor(v) {
    return Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function calcularDiasUteisRestantes(dataInicio, prazoTotalDias) {
    if (!dataInicio) return prazoTotalDias;
    let inicio = new Date(dataInicio);
    let hoje = new Date();
    let diasUteisPassados = 0;
    let atual = new Date(inicio);
    
    while (atual < hoje) {
        let diaSemana = atual.getDay();
        if (diaSemana !== 0 && diaSemana !== 6) diasUteisPassados++;
        atual.setDate(atual.getDate() + 1);
    }
    let restante = prazoTotalDias - diasUteisPassados;
    return restante > 0 ? restante : 0;
}

function mostrarProposta(p) {
    document.getElementById('telaConsulta').classList.remove('visivel');
    document.getElementById('telaProposta').classList.add('visivel');

    const entradaPaga = p.entrada_paga === true || p.entrada_paga === 'true' || p.entrada_paga === 1;
    const contratoAssinado = p.contrato_assinado === true || p.contrato_assinado === 'true' || p.contrato_assinado === 1;
    const entregaConcluida = p.entrega_concluida === true || p.entrega_concluida === 'true' || p.entrega_concluida === 1;

    let etapa = 1;
    if(p.status === 'Aprovada') etapa = 2;
    if(contratoAssinado) etapa = 3;
    if(entradaPaga) etapa = 4;
    if(entregaConcluida) etapa = 5;

    document.getElementById('barraEtapas').innerHTML = `
        <div class="etapa ${etapa>=1?(etapa>1?'concluida':'ativa'):''}"><div class="bolinha">${etapa>1?'✓':'1'}</div><span>Análise</span></div>
        <div class="etapa ${etapa>=2?(etapa>2?'concluida':'ativa'):''}"><div class="bolinha">${etapa>2?'✓':'2'}</div><span>Parcelas</span></div>
        <div class="etapa ${etapa>=3?(etapa>3?'concluida':'ativa'):''}"><div class="bolinha">${etapa>3?'✓':'3'}</div><span>Contrato</span></div>
        <div class="etapa ${etapa>=4?(etapa>4?'concluida':'ativa'):''}"><div class="bolinha">${etapa>4?'✓':'4'}</div><span>Entrada</span></div>
        <div class="etapa ${etapa>=5?'concluida':'ativa'}"><div class="bolinha">${etapa>=5?'✓':'5'}</div><span>Entrega</span></div>
    `;

    const v=Number(p.valor_desejado||0), e=Number(p.valor_entrada||0), j=Number(p.juros_mensal||5), q=Number(p.qtd_parcelas_escolhida||p.quantidade_parcelas||0);
    const total = v*(1 + j/100);
    const valorParcela = q > 0 ? ((total - e) * (Math.pow(1 + j/100, q) * (j/100)) / (Math.pow(1 + j/100, q) - 1)) : 0;
    
    const diasTotal = p.dias_entrega || 7;
    const diasRestantes = entradaPaga ? calcularDiasUteisRestantes(p.data_aprovacao_entrada || p.updated_at, diasTotal) : diasTotal;

    let html = `<h2 class="text-xl font-bold text-center mb-4 text-primary">Olá, ${p.nome}!</h2>`;

    if(p.status === 'Nova') {
        html += `<div class="text-center p-6 bg-yellow-50 rounded-lg"><i class="fas fa-clock text-4xl text-alerta mb-4"></i><p class="font-bold text-lg">Aguardando aprovação da proposta...</p></div>`;
    }

    if(p.status === 'Aprovada' && !p.qtd_parcelas_escolhida) {
        html += `
        <div class="bloco-entrega"><p class="font-bold">ENTREGA EM ATÉ ${diasTotal} DIAS ÚTEIS APÓS ENTRADA!</p></div>
        <p class="font-bold mt-4 mb-2">Escolha a quantidade de parcelas:</p>
        <select id="qtdEscolhida" class="campo">
            ${Array.from({length:q}, (_,i)=>{
                const n=i+1;
                const val = ((total-e)*(Math.pow(1+j/100,n)*(j/100))/(Math.pow(1+j/100,n)-1));
                return `<option value="${n}">${n}x de R$ ${formatarValor(val)}</option>`;
            }).join('')}
        </select>
        <button onclick="confirmarParcelas()" class="botao botao-sucesso mt-2">Continuar para o Contrato</button>`;
    }

    if(p.status === 'Aprovada' && p.qtd_parcelas_escolhida && !contratoAssinado) {
        const qtdEsc = p.qtd_parcelas_escolhida;
        const valParc = ((total-e)*(Math.pow(1+j/100,qtdEsc)*(j/100))/(Math.pow(1+j/100,qtdEsc)-1));
        html += `
        <div class="resumo-contrato">
            <h4 class="font-bold mb-2">📋 Resumo</h4>
            <p><strong>Total:</strong> R$ ${formatarValor(total)} | <strong>Entrada:</strong> R$ ${formatarValor(e)}</p>
            <p><strong>${qtdEsc}x de:</strong> R$ ${formatarValor(valParc)}</p>
        </div>
        <div class="mt-4 bg-white p-4 border border-slate-200 rounded-lg">
            <label class="flex items-center gap-2 mb-4 font-bold text-sm text-primary"><input type="checkbox" id="aceitoContrato"> Li e concordo com os termos.</label>
            <button onclick="assinarContrato()" class="botao botao-sucesso mt-3">✍️ Confirmar Assinatura</button>
        `;
    }

    if(contratoAssinado && !entradaPaga) {
        html += `
        <div class="sucesso-box"><i class="fas fa-check-circle"></i><h3 class="text-xl font-bold">CONTRATO ASSINADO!</h3></div>
        <button onclick="gerarPixAPI(${e}, 'entrada', ${p.id})" class="botao botao-pix mt-4">Gerar Pix da Entrada (API)</button>
        <div id="areaPix" class="oculto"></div>`;
    }

    if(entradaPaga) {
        let datasParcelas = p.datas_parcelas;
        if (!datasParcelas || !Array.isArray(datasParcelas) || datasParcelas.length === 0) {
            datasParcelas = [];
            let dataBase = new Date();
            for (let i = 1; i <= q; i++) {
                dataBase.setMonth(dataBase.getMonth() + 1);
                datasParcelas.push(new Date(dataBase).toISOString().split('T')[0]);
            }
        }

        html += `<div class="sucesso-box"><i class="fas fa-check-double"></i><h3 class="text-xl font-bold">✅ ENTRADA CONFIRMADA!</h3></div>`;
        
        if(entregaConcluida) {
            html += `<div class="bloco-entrega" style="background: #ECFDF5; border-color: #10B981;"><p class="font-bold text-xl text-sucesso">ENTREGA CONCLUÍDA!</p></div>`;
        } else {
            html += `<div class="bloco-entrega" style="background: #ECFDF5; border-color: #10B981;"><p class="font-bold text-sucesso">PRAZO DE ENTREGA: RESTAM ${diasRestantes} DIAS ÚTEIS</p></div>`;
        }

        html += `
        <h3 class="font-bold text-lg mt-4 mb-2">📅 SUAS PARCELAS</h3>
        ${datasParcelas.map((dt,idx)=>{
            const valor = Number(valorParcela);
            const numeroParcela = idx + 1;
            const parcelasPagas = p.parcelas_pagas || 0;
            const pg = numeroParcela <= parcelasPagas;
            const hoje = new Date();
            const vencto = new Date(dt + 'T00:00:00');
            let cor = 'luz-amarela';
            if(pg) cor='luz-verde';
            else if(vencto < hoje) cor='luz-vermelha';

            return `<div class="item-parcela">
                <div><span class="luz ${cor}"></span>${numeroParcela}ª Parcela: R$ ${formatarValor(valor)} <br> Venc: ${vencto.toLocaleDateString('pt-BR')}</div>
                <div>
                    ${pg ? '<span class="text-sucesso font-bold">Pago</span>' : `<button onclick="gerarPixParcelaAPI(${numeroParcela}, ${valor}, ${p.id})" class="botao botao-pequeno bg-pix text-white">Gerar Pix API</button>`}
                </div>
            </div>`;
        }).join('')}
        <div id="areaPixParcela" class="oculto mt-4"></div>`;
    }

    document.getElementById('conteudoProposta').innerHTML = html;
}

async function gerarPixAPI(valor, tipo, propostaId) {
    const areaPix = tipo === 'entrada' ? document.getElementById('areaPix') : document.getElementById('areaPixParcela');
    areaPix.classList.remove('oculto');
    areaPix.innerHTML = `<div class="text-center p-4 text-primary font-bold"><i class="fas fa-spinner fa-spin"></i> Gerando Pix via API do Render...</div>`;

    try {
        const response = await fetch(`${BACKEND_URL}/api/gerar-pix`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ valor, tipo, propostaId })
        });
        const data = await response.json();

        if(data.erro) throw new Error(data.erro);

        areaPix.innerHTML = `
            <div class="codigo-pix">
                <p class="mb-2 text-primary font-bold">QR Code Pix - ${tipo.toUpperCase()}:</p>
                ${data.qrCodeBase64 ? `<img src="data:image/png;base64,${data.qrCodeBase64}" class="mx-auto mb-2" style="max-width:180px;">` : ''}
                <p class="mb-2 text-xs text-slate-600">Copia e Cola:</p>
                <p style="font-size: 10px; word-break: break-all; user-select: all; background: #fff; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">${data.copiaECola}</p>
                <p class="mt-2 text-xs text-sucesso font-bold">🔄 A baixa é automática via Webhook!</p>
            </div>`;
    } catch(err) {
        areaPix.innerHTML = `
            <div class="p-4 bg-red-50 border border-red-200 rounded-lg text-center">
                <p class="text-perigo font-bold text-sm mb-1"><i class="fas fa-exclamation-triangle"></i> Erro de Comunicação com a API</p>
                <p class="text-xs text-slate-600 mb-2">Verifique se trocou <code>BACKEND_URL</code> no topo do script pela URL real do seu serviço no Render.</p>
                <p class="text-xs text-slate-500 font-mono">Detalhes: ${err.message}</p>
            </div>`;
    }
}

async function gerarPixParcelaAPI(numero, valor, propostaId) {
    await gerarPixAPI(valor, `parcela_${numero}`, propostaId);
}

async function confirmarParcelas() {
    const qtd = document.getElementById('qtdEscolhida').value;
    const {error} = await supabase.from('propostas').update({ qtd_parcelas_escolhida: parseInt(qtd) }).eq('id', propostaAtual.id);
    if(error) alert('Erro ao salvar parcelas: ' + error.message);
}

async function assinarContrato() {
    if(!document.getElementById('aceitoContrato').checked) return alert('Aceite os termos do contrato.');
    const {error} = await supabase.from('propostas').update({ contrato_assinado: true }).eq('id', propostaAtual.id);
    if(error) alert('Erro ao assinar: ' + error.message);
}
</script>
</body>
</html>
