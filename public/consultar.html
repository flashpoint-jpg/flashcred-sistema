<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #F8FAFC; min-height: 100vh; padding: 12px; }
        .cartao { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .botao { padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .botao-primario { background: #0A2463; color: white; }
        .botao-sucesso { background: #10B981; color: white; }
        .barra-progresso { height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; margin: 12px 0; }
        .barra-progresso > div { height: 100%; background: #0A2463; width: 0%; transition: 0.3s; }
        .etapas { display: flex; justify-content: space-between; font-size: 11px; color: #64748B; margin-bottom: 8px; }
        .etapas span.ativo { color: #0A2463; font-weight: bold; }
        .opcao-parcela { border: 2px solid #E2E8F0; border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
        .opcao-parcela.selecionada { border-color: #0A2463; background: #EFF6FF; }
    </style>
</head>
<body class="max-w-md mx-auto">

    <div class="etapas">
        <span id="e1" class="ativo">1. Escolha</span>
        <span id="e2">2. Contrato</span>
        <span id="e3">3. Pix</span>
        <span id="e4">4. Final</span>
    </div>
    <div class="barra-progresso"><div id="barra" style="width: 25%"></div></div>

    <div id="conteudo"></div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ✅ IMPORTANTE: Verifique se este TOKEN está completo
const MP_TOKEN = 'SEU_TOKEN_AQUI'; 
const WHATSAPP_SUPORTE = '5511973294235';

let proposta = null;
let qtdParcelasEscolhida = null;

window.onload = async () => {
    const params = new URLSearchParams(window.location.search);
    const cpf = params.get('cpf');
    if(!cpf) {
        document.getElementById('conteudo').innerHTML = `
            <div class="cartao text-center">
                <h3 class="font-bold mb-3">Consultar Proposta</h3>
                <input type="text" id="cpf" placeholder="Digite seu CPF" class="w-full p-3 border rounded mb-3">
                <button onclick="buscar()" class="botao botao-primario w-full">Consultar</button>
            </div>`;
    } else {
        await carregar(cpf);
    }
};

async function buscar() {
    const cpf = document.getElementById('cpf').value.replace(/\D/g,'');
    window.location.search = `?cpf=${cpf}`;
}

async function carregar(cpf) {
    const {data} = await supabase.from('propostas').select('*').ilike('cpf', cpf).single();
    if(!data) return document.getElementById('conteudo').innerHTML = `<p class="text-center">Proposta não encontrada.</p>`;
    proposta = data;
    mostrarEtapa1();
}

function mostrarEtapa1() {
    document.getElementById('barra').style.width = '25%';
    document.getElementById('conteudo').innerHTML = `
        <div class="cartao">
            <h2 class="font-bold mb-2">Olá, ${proposta.nome}</h2>
            <p class="mb-4">Valor entrada: R$ ${Number(proposta.valor_entrada).toFixed(2)}</p>
            <div class="opcao-parcela" onclick="selecionar(this, 1)">1x no Pix/Cartão</div>
            <div class="opcao-parcela" onclick="selecionar(this, 2)">2x parcelado</div>
            <button id="btnProx" onclick="irContrato()" class="botao botao-primario w-full mt-4" disabled>Continuar</button>
        </div>`;
}

function selecionar(el, qtd) {
    document.querySelectorAll('.opcao-parcela').forEach(x=>x.classList.remove('selecionada'));
    el.classList.add('selecionada');
    qtdParcelasEscolhida = qtd;
    document.getElementById('btnProx').disabled = false;
}

function irContrato() {
    document.getElementById('barra').style.width = '50%';
    document.getElementById('conteudo').innerHTML = `
        <div class="cartao">
            <h2 class="font-bold mb-2">Contrato</h2>
            <p class="text-sm mb-4">Ao clicar abaixo, você concorda com o parcelamento de R$ ${proposta.valor_desejado}...</p>
            <button onclick="iniciarPix()" class="botao botao-sucesso w-full">Aceitar e Pagar Entrada</button>
        </div>`;
}

async function iniciarPix() {
    document.getElementById('barra').style.width = '75%';
    document.getElementById('conteudo').innerHTML = `<div class="cartao text-center"><i class="fa fa-spinner fa-spin"></i> Gerando Pix...</div>`;
    
    // CORREÇÃO: Usando Proxy para evitar erro de CORS
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://api.mercadopago.com/v1/payments');
    
    try {
        const resp = await fetch(proxyUrl, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${MP_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                transaction_amount: Number(proposta.valor_entrada),
                description: 'Entrada FlashCred',
                payment_method_id: 'pix',
                payer: { email: 'cliente@flashcred.com.br' }
            })
        });
        const res = await resp.json();
        
        document.getElementById('conteudo').innerHTML = `
            <div class="cartao text-center">
                <img src="data:image/png;base64,${res.point_of_interaction.transaction_data.qr_code_base64}" class="w-48 mx-auto">
                <p class="mt-4">Pix gerado com sucesso!</p>
            </div>`;
    } catch(e) {
        alert("Erro ao conectar: " + e.message);
    }
}
</script>
</body>
</html>
