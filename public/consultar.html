// ✅ PEGA CPF DA URL

function pegarCPFdaURL() {

    return cpf.replace(/\D/g, '');
}

    const cpf = pegarCPFdaURL();

            </div>
        `;
        return;
    }
    await buscarPorCPF(cpf);
}

async function buscarProposta() {
    let cpf = document.getElementById('cpfInput').value.replace(/\D/g, '');
    if(!cpf || cpf.length !== 11) { alert('Digite um CPF válido!'); return; }

async function buscarPorCPF(cpfLimpo) {
    try {
        const {data, error} = await supabase
            .from('propostas')
            .select('*')
            .ilike('cpf', '%' + cpfLimpo + '%')
            .order('created_at', {ascending:false})
            .limit(1);

        if(!data || data.length === 0) {

// ==============================================
// ✅ CÁLCULO CORRIGIDO
// ==============================================
function calcularValores(valor, entrada, jurosPct, qtd) {
    const valorTotal = valor * (1 + jurosPct / 100);
    const saldo = valorTotal - entrada;
    
    let valorParcela = 0;
    if(qtd === 1) {
        valorParcela = valorTotal;
    } else if(saldo > 0 && qtd > 0) {
        const taxa = jurosPct / 100;
        valorParcela = saldo * Math.pow(1 + taxa, qtd) * taxa / (Math.pow(1 + taxa, qtd) - 1);
    }
    return { valorTotal, saldo, valorParcela };
}

// ==============================================
// ✅ ESCOLHER PARCELA
// ==============================================
function escolherParcela(qtd) {
    qtdParcelasEscolhida = qtd;
    document.querySelectorAll('.opcao-parcela').forEach((el, i) => {
        el.classList.toggle('selecionada', i + 1 === qtd);
    });
    document.getElementById('btnAvancar1').disabled = false;
}

// ==============================================
// ✅ NAVEGAÇÃO DE ETAPAS
// ==============================================
function proximaEtapa() {
    document.getElementById(`etapa${etapaAtual + 1}`).classList.remove('ativa');
    etapaAtual++;
    document.getElementById(`etapa${etapaAtual + 1}`).classList.add('ativa');
    window.scrollTo(0,0);
}

function etapaAnterior() {
    document.getElementById(`etapa${etapaAtual + 1}`).classList.remove('ativa');
    etapaAtual--;
    document.getElementById(`etapa${etapaAtual + 1}`).classList.add('ativa');
    window.scrollTo(0,0);
}

// ==============================================
// ✅ CONTRATO E ASSINATURA
// ==============================================
function verificarContrato() {
    const aceito = document.getElementById('aceitoContrato').checked;
    // Libera se assinatura tem conteúdo OU alternativa
    const temAssinatura = assinaturaCanvas && assinaturaContext && assinaturaContext.getImageData(10,10,1,1).data[3] > 0;
    document.getElementById('btnAvancar2').disabled = !aceito;
}

function initAssinatura() {
    assinaturaCanvas = document.getElementById('assinatura');
    assinaturaContext = assinaturaCanvas.getContext('2d');
    assinaturaContext.lineWidth = 3;
    assinaturaContext.lineCap = 'round';
    assinaturaContext.strokeStyle = '#000';

    function posicao(e) {
        const rect = assinaturaCanvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        return {x, y};
    }

    assinaturaCanvas.onmousedown = assinaturaCanvas.ontouchstart = (e) => {
        e.preventDefault();
        assinando = true;
        const p = posicao(e);
        assinaturaContext.beginPath();
        assinaturaContext.moveTo(p.x, p.y);
    };
    assinaturaCanvas.onmousemove = assinaturaCanvas.ontouchmove = (e) => {
        if(!assinando) return;
        e.preventDefault();
        const p = posicao(e);
        assinaturaContext.lineTo(p.x, p.y);
        assinaturaContext.stroke();
    };
    assinaturaCanvas.onmouseup = assinaturaCanvas.ontouchend = () => {
        assinando = false;
        verificarContrato();
    };
}

function limparAssinatura() {
    if(assinaturaCanvas && assinaturaContext) {
        assinaturaContext.clearRect(0,0,assinaturaCanvas.width,assinaturaCanvas.height);
        verificarContrato();
    }
}

// ==============================================
// ✅ CÂMERA E SELFIE

let streamCamera = null;

async function iniciarCamera() {
    try {
        streamCamera = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
        const video = document.getElementById('camera');
        if(video) video.srcObject = streamCamera;
    } catch(e) {
        console.log('Sem câmera');
    }
}

function tirarFoto() {
    const video = document.getElementById('camera');
    if(!video || !streamCamera) {
        alert('Câmera não disponível. Use a opção "Sem Câmera".');
        return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0);
    selfieImagem = canvas.toDataURL('image/jpeg');
    
    document.getElementById('imagemSelfie').src = selfieImagem;
    document.getElementById('fotoTirada').classList.remove('hidden');
    document.getElementById('btnAvancar3').disabled = false;
    
    // Para câmera
    if(streamCamera) streamCamera.getTracks().forEach(t=>t.stop());
}

function usarAssinaturaAlternativa() {

    document.getElementById('btnAvancar3').disabled = false;
    alert('✅ Confirmado! Seguindo...');
}

    setTimeout(() => {

}

function copiarChave() {

}

// ✅ CRC16 simplificado
function calcularCRC16(str) {
    let crc = 0xFFFF;
    for(let i=0; i<str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for(let j=0; j<8; j++) crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1;
    }
    return ((crc ^ 0xFFFF) & 0xFFFF).toString(16).toUpperCase().padStart(4,'0');
}

        const textoStatus = status === 'paga' ? '✅ Paga' : '⏳ Pendente';
        
        htmlParcelas += `
        <div class="parcela-item ${classe}">
            <div>
                <strong>Parcela ${numParcela}/${qtd}</strong><br>
                <span class="text-sm">R$ ${calc.valorParcela.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>
            </div>
            <div>
                ${status === 'pendente' 
                    ? `<button onclick="alert('Gerando Pix...')" class="botao botao-sucesso" style="padding:6px 10px; font-size:12px; margin:0;">Pagar</button>` 
                    : `<span class="text-sucesso font-bold">${textoStatus}</span>`}
            </div>
        </div>`;
    }

    document.getElementById('listaParcelas').innerHTML = htmlParcelas;
    window.scrollTo(0,0);
}

// ✅ INICIA AO CARREGAR
window.onload = carregarProposta;
</script>
</body>
</html>
