<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        pendente: '#94A3B8',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-fundo min-h-screen pb-8">

<div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-primary text-center mb-6">🔍 Acompanhar Proposta</h1>

    <!-- CAMPO DE CONSULTA -->
    <div class="bg-white p-5 rounded-xl shadow mb-6">
        <label class="block font-semibold mb-2 text-gray-700">Digite seu CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" 
            class="w-full p-3 border-2 border-gray-200 rounded-lg text-lg focus:border-primary focus:outline-none">
        <button onclick="consultar()" class="w-full mt-4 bg-primary text-white p-3 rounded-lg font-bold text-lg hover:bg-opacity-90">
            🔍 Consultar
        </button>
    </div>

    <!-- BARRA DE PROGRESSO -->
    <div id="progresso" class="hidden bg-white p-5 rounded-xl shadow mb-6">
        <h3 class="font-bold text-primary mb-4 text-center">📋 Andamento da Proposta</h3>
        <div class="flex justify-between items-center mb-3 text-xs font-semibold text-center">
            <div id="etapa1" class="flex-1">
                <div class="w-10 h-10 mx-auto rounded-full flex items-center justify-center text-white bg-pendente">1</div>
                <span class="block mt-1">Analisando</span>
            </div>
            <div id="etapa2" class="flex-1">
                <div class="w-10 h-10 mx-auto rounded-full flex items-center justify-center text-white bg-pendente">2</div>
                <span class="block mt-1">Parcelas</span>
            </div>
            <div id="etapa3" class="flex-1">
                <div class="w-10 h-10 mx-auto rounded-full flex items-center justify-center text-white bg-pendente">3</div>
                <span class="block mt-1">Contrato</span>
            </div>
            <div id="etapa4" class="flex-1">
                <div class="w-10 h-10 mx-auto rounded-full flex items-center justify-center text-white bg-pendente">4</div>
                <span class="block mt-1">Pagamento</span>
            </div>
            <div id="etapa5" class="flex-1">
                <div class="w-10 h-10 mx-auto rounded-full flex items-center justify-center text-white bg-pendente">5</div>
                <span class="block mt-1">Liberado</span>
            </div>
        </div>
        <div class="h-2 bg-gray-200 rounded-full overflow-hidden mt-2">
            <div id="barra" class="h-full bg-sucesso transition-all duration-700" style="width: 0%"></div>
        </div>
    </div>

    <!-- RESULTADO -->
    <div id="resultado"></div>
</div>

<script>
// ==============================================
// CONFIGURAÇÕES
// ==============================================
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

let cpfAtual = '';
let canalRealtime = null;

// ==============================================
// ✅ INICIALIZAÇÃO — LER CPF DA URL
// ==============================================
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    let cpfUrl = (params.get('cpf') || '').replace(/\D/g, '');
    
    if(cpfUrl.length === 11) {
        cpfAtual = cpfUrl;
        document.getElementById('cpf').value = cpfUrl.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        consultar();
    }
};

// ==============================================
// ✅ ATUALIZAÇÃO EM TEMPO REAL — SEM PRECISAR F5!
// ==============================================
function ativarRealtime() {
    if(!cpfAtual) return;
    if(canalRealtime) supabase.removeChannel(canalRealtime);
    
    canalRealtime = supabase.channel('atualizacao_proposta')
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'propostas', filter:`cpf=eq.${cpfAtual}` }, () => {
            console.log('🔄 Proposta atualizada! Atualizando...');
            consultar();
        })
        .subscribe();
}

// ==============================================
// ✅ ATUALIZAR BARRA DE PROGRESSO
// ==============================================
function atualizarProgresso(p) {
    const etapas = [
        { id:'etapa1', condicao: true }, // Sempre ativa
        { id:'etapa2', condicao: p.quantidade_parcelas > 0 },
        { id:'etapa3', condicao: !!p.contrato_assinado },
        { id:'etapa4', condicao: !!p.qr_code_entrada || p.entrada_paga },
        { id:'etapa5', condicao: p.entrada_paga }
    ];

    let concluida = 0;
    etapas.forEach((etapa, idx) => {
        const el = document.getElementById(etapa.id).querySelector('div');
        if(etapa.condicao) {
            el.classList.remove('bg-pendente', 'bg-alerta');
            el.classList.add('bg-sucesso');
            concluida = idx + 1;
        } else {
            el.classList.remove('bg-sucesso');
            el.classList.add('bg-alerta');
        }
    });

    const porcentagem = (concluida / 5) * 100;
    document.getElementById('barra').style.width = porcentagem + '%';
    document.getElementById('progresso').classList.remove('hidden');
}

// ==============================================
// CONSULTAR PROPOSTA
// ==============================================
async function consultar() {
    let cpf = document.getElementById('cpf').value.replace(/\D/g, '');
    
    if(cpf.length !== 11) {
        alert('Digite um CPF válido!');
        return;
    }

    cpfAtual = cpf;
    document.getElementById('resultado').innerHTML = '<p class="text-center p-6 text-gray-500"><i class="fas fa-spinner fa-spin text-2xl"></i><br>Buscando proposta...</p>';

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .eq('cpf', cpf)
        .order('created_at', { ascending: false })
        .limit(1);

    if(error) {
        document.getElementById('resultado').innerHTML = '<p class="text-center p-6 text-red-500">❌ Erro ao buscar.</p>';
        return;
    }

    if(!data || data.length === 0) {
        document.getElementById('resultado').innerHTML = '<p class="text-center p-6 text-gray-500">❌ Nenhuma proposta encontrada.</p>';
        document.getElementById('progresso').classList.add('hidden');
        if(canalRealtime) supabase.removeChannel(canalRealtime);
        return;
    }

    exibirProposta(data[0]);
    ativarRealtime(); // 🔄 MONITORA ALTERAÇÕES AUTOMATICAMENTE!
}

// ==============================================
// EXIBIR PROPOSTA — VALORES CORRIGIDOS
// ==============================================
function exibirProposta(p) {
    atualizarProgresso(p); // ✅ ATUALIZA BARRA DE PROGRESSO

    const status = p.status || 'Nova';
    const valorTotal = Number(p.valor_desejado || 0);
    const percEnt = Number(p.percentual_entrada || 0);
    const valorEntrada = Number(p.valor_entrada) || (valorTotal * percEnt / 100); // ✅ CORRIGIDO!
    const qtd = Number(p.quantidade_parcelas || 0);
    const juros = Number(p.juros || 0);
    const saldo = valorTotal - valorEntrada;
    const valParc = qtd > 0 ? saldo * Math.pow(1 + juros/100, 1) / qtd : 0;

    const statusCor = status === 'Aprovada' ? 'bg-green-100 text-green-700' : 
                      status === 'Reprovada' ? 'bg-red-100 text-red-700' : 
                      'bg-yellow-100 text-yellow-700';

    const dados = p.dados_parcelas || [];
    let listaParcelas = '';
    if(dados.length > 0) {
        listaParcelas = `
        <div class="mt-4">
            <h4 class="font-bold text-gray-700 mb-2">📋 Suas Parcelas</h4>
            <div class="space-y-2">`;
        dados.forEach(parc => {
            const dt = parc.vencimento ? parc.vencimento.split('-').reverse().join('/') : '---';
            const vlr = Number(parc.valor||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            const paga = parc.paga;
            listaParcelas += `
            <div class="p-3 rounded-lg border ${paga?'bg-green-50 border-green-200':'bg-gray-50 border-gray-200'}">
                <div class="flex justify-between font-semibold">
                    <span>${parc.numero}ª Parcela</span>
                    <span class="${paga?'text-green-600':''}">${vlr}</span>
                </div>
                <div class="flex justify-between text-sm text-gray-500 mt-1">
                    <span>Venc: ${dt}</span>
                    <span>${paga?'✅ Paga':'⏳ A vencer'}</span>
                </div>
            </div>`;
        });
        listaParcelas += `</div></div>`;
    }

    // QR CODE PIX
    let qrHtml = '';
    if(p.qr_code_entrada && !p.entrada_paga) {
        qrHtml = `
        <div class="mt-6 bg-pix/10 p-5 rounded-xl text-center border border-pix/30">
            <h3 class="font-bold text-lg mb-2">💳 Pagamento da Entrada</h3>
            <p class="text-2xl font-bold text-pix mb-3">${valorEntrada.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>
            <div id="qrcode" class="flex justify-center my-4"></div>
            <p class="text-sm text-gray-500 mb-2">Escaneie ou copie o código Pix abaixo:</p>
            <textarea readonly class="w-full p-3 text-xs border rounded-lg bg-gray-50" rows="4">${p.qr_code_entrada}</textarea>
            <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value); alert('✅ Código copiado!')" 
                class="mt-3 bg-pix text-white px-6 py-2.5 rounded-lg font-bold text-lg">
                📋 Copiar Código Pix
            </button>
        </div>`;
    } else if(p.entrada_paga) {
        qrHtml = `
        <div class="mt-6 bg-green-50 p-5 rounded-xl text-center border border-green-200">
            <h3 class="font-bold text-lg text-sucesso">✅ ENTRADA PAGA!</h3>
            <p class="text-gray-600 mt-2">Pagamento confirmado! Aproveite suas parcelas abaixo.</p>
        </div>`;
    } else if(status === 'Aprovada' && !p.qr_code_entrada) {
        qrHtml = `
        <div class="mt-6 bg-yellow-50 p-5 rounded-xl text-center border border-yellow-200">
            <h3 class="font-bold text-lg text-alerta">⏳ Aguardando geração do Pix...</h3>
            <p class="text-gray-600 mt-2">Aguarde um momento e recarregue a página se necessário.</p>
        </div>`;
    }

    // CONTRATO
    let contratoHtml = '';
    if(p.contrato_assinado) {
        contratoHtml = `
        <div class="mt-6 bg-white p-5 rounded-xl border border-green-200">
            <h3 class="font-bold text-lg mb-2">📄 Contrato Assinado</h3>
            <p class="text-green-600 font-semibold mb-3">✅ Assinado e validado</p>
            <a href="${p.contrato_assinado}" target="_blank" class="inline-block bg-primary text-white px-4 py-2 rounded-lg font-bold">
                📄 Ver / Imprimir Contrato
            </a>
        </div>`;
    } else if(status === 'Aprovada') {
        contratoHtml = `
        <div class="mt-6 bg-yellow-50 p-5 rounded-xl border border-yellow-200">
            <h3 class="font-bold text-lg mb-2">✍️ Assinar Contrato</h3>
            <p class="text-gray-600 mb-3">Leia e assine para liberar o pagamento</p>
            <button onclick="window.location.href='assinatura.html?cpf=${p.cpf}'" class="bg-alerta text-white px-4 py-2 rounded-lg font-bold">
                ✍️ Assinar Agora
            </button>
        </div>`;
    }

    const resultado = `
    <div class="bg-white p-5 rounded-xl shadow">
        <div class="flex justify-between items-start mb-4 pb-3 border-b">
            <div>
                <h2 class="text-xl font-bold text-primary">👤 ${p.nome || 'Proposta'}</h2>
                <p class="text-gray-500 text-sm">CPF: ${(p.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-sm font-bold ${statusCor}">${status}</span>
        </div>

        <!-- VALORES CORRIGIDOS -->
        <div class="grid grid-cols-2 gap-3 mt-2">
            <div class="bg-gray-50 p-3 rounded-lg">
                <p class="text-sm text-gray-500">Valor Total</p>
                <p class="font-bold text-lg">${valorTotal.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>
            </div>
            <div class="bg-pix/5 p-3 rounded-lg border border-pix/20">
                <p class="text-sm text-gray-500">Entrada (${percEnt}%)</p>
                <p class="font-bold text-lg text-pix">${valorEntrada.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg">
                <p class="text-sm text-gray-500">Parcelas</p>
                <p class="font-bold text-lg">${qtd}x</p>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg">
                <p class="text-sm text-gray-500">Juros</p>
                <p class="font-bold text-lg">${juros}% ao mês</p>
            </div>
            ${qtd>0?`
            <div class="bg-green-50 p-3 rounded-lg border border-green-100 col-span-2">
                <p class="text-sm text-gray-500">Valor de cada parcela</p>
                <p class="font-bold text-lg text-center text-sucesso">${valParc.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>
            </div>`:''}
        </div>

        ${listaParcelas}
        ${contratoHtml}
        ${qrHtml}
    </div>`;

    document.getElementById('resultado').innerHTML = resultado;

    // GERAR QR CODE
    if(p.qr_code_entrada && !p.entrada_paga) {
        setTimeout(() => {
            const c = document.getElementById('qrcode');
            if(c) { c.innerHTML=''; new QRCode(c, { text:p.qr_code_entrada, width:180, height:180 }); }
        }, 100);
    }
}
</script>
</body>
</html>
