<style>
* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body {
    background:#F4F7FB;
    color:#1E293B;
    font-family:"Segoe UI",Arial,sans-serif;

}

.cartao {

}

.cabecalho {
    background:linear-gradient(135deg,#071D4D,#0A2463);

}

.botao {
    width:100%;
    border:0;

    padding:13px 16px;

}

.botao:disabled {

}

.botao-primary {

}

.botao-sucesso {

}

.botao-pix {

}

.botao-cinza {

}

.botao-wpp {

}

.campo {
    width:100%;
    padding:13px;
    border:1px solid #CBD5E1;

    font-size:16px;

    outline:none;
}

.campo:focus {
    border-color:#0A2463;

}

/* ETAPAS */

.barra-etapas {
    display:flex;
    justify-content:space-between;
    position:relative;
    margin-bottom:18px;
}

.barra-etapas:before {

}

.etapa.concluida {

}

.etapa.concluida .bolinha {

}

/* INFORMAÇÕES */

.linha {
    display:flex;
    justify-content:space-between;
    gap:15px;

    border-bottom:1px solid #E5E7EB;
}

.linha:last-child {

}

.rotulo {

}

.valor {
    font-weight:700;
    text-align:right;
}

/* PARCELAS */

.lista-parcelas {
    display:flex;
    flex-direction:column;
    gap:12px;
}

.parcela {
    background:white;
    border:1px solid #DDE5EF;

    box-shadow:0 3px 12px rgba(15,23,42,.05);
}

.parcela-topo {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.parcela-numero {
    font-size:17px;

}

.status {
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

.status-pendente {
    background:#FEF3C7;
    color:#92400E;
}

.status-pago {
    background:#DCFCE7;
    color:#166534;
}

.status-vencido {
    background:#FEE2E2;
    color:#991B1B;
}

.status-proxima {
    background:#DBEAFE;
    color:#1E40AF;
}

.parcela-info {
    display:grid;
    grid-template-columns:1fr 1fr;

}

.info-parcela {
    background:#F8FAFC;

}

.info-parcela small {
    display:block;
    color:#64748B;

}

.info-parcela strong {

}

.pix-area {

}

.qrcode {
    display:flex;
    justify-content:center;
    background:white;

    border:1px solid #E2E8F0;

}

.pix-copia {
    background:#ECFDF5;
    border:1px solid #6EE7B7;
    border-radius:10px;
    padding:11px;
    font-size:11px;
    word-break:break-all;
    color:#065F46;
    margin-bottom:8px;
}

.botao-pequeno {
    width:auto;
    padding:8px 12px;
    font-size:12px;
}

/* CONTRATO */

.contrato {
    background:#FCFCFD;
    border:1px solid #CBD5E1;
    border-radius:12px;
    padding:18px;
    max-height:390px;
    overflow-y:auto;
    line-height:1.7;
    font-size:13px;
    text-align:justify;
}

.contrato h3 {
    text-align:center;
    color:#0A2463;
    margin-bottom:15px;
}

.resumo {
    background:#EFF6FF;
    border:1px solid #BFDBFE;
    border-radius:12px;
    padding:16px;
    margin:15px 0;
}

.resumo p {
    margin:8px 0;
}

.resumo strong {
    color:#0A2463;
}

.pix-box {
    background:#ECFDF5;
    border:2px solid #32BCAD;
    border-radius:15px;
    padding:18px;
    text-align:center;
}

.entrega {
    background:#FFFBEB;
    border:2px solid #F59E0B;
    border-radius:14px;
    padding:16px;
    margin:16px 0;
}

.barra-progresso {
    width:100%;
    height:12px;
    background:#E2E8F0;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.barra-preenchida {
    height:100%;
    background:#F59E0B;

}

.sucesso {
    background:#ECFDF5;
    border:2px solid #10B981;
    color:#065F46;
    border-radius:14px;
    padding:18px;
    text-align:center;
    margin-bottom:16px;
}

.oculto {
    display:none!important;
}

.tela {
    display:none;
}

.tela.visivel {
    display:block;
}

.spinner {
    width:20px;
    height:20px;
    border:3px solid rgba(255,255,255,.4);
    border-top-color:white;
    border-radius:50%;
    animation:girar .8s linear infinite;
}

@keyframes girar {
    to { transform:rotate(360deg); }
}

@media(max-width:480px) {
    body {
        padding:10px;
    }

    .cartao {
        padding:17px;
    }

    .parcela-info {
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     CONSULTA
===================================================== -->

<section id="telaConsulta" class="tela visivel">

    <div class="cabecalho">

        <div class="text-xs opacity-70">
            FLASHCRED
        </div>

        <h1 class="text-2xl font-bold mt-1">
            Acompanhar Proposta
        </h1>

        <p class="text-sm opacity-80 mt-1">
            Consulte sua proposta pelo CPF
        </p>

    </div>

    <div class="cartao">

        <h2 class="text-xl font-bold mb-2">
            Consultar proposta
        </h2>

        <p class="text-sm text-slate-500 mb-5">
            Digite os 11 números do seu CPF.
        </p>

        <input
            id="cpfConsulta"
            class="campo"
            inputmode="numeric"
            maxlength="11"
            placeholder="CPF — somente números"
        >

        <button
            id="btnConsultar"
            class="botao botao-primary"
            onclick="executarConsulta()"
        >
            <i class="fas fa-search"></i>
            Consultar proposta
        </button>

    </div>

</section>


<!-- =====================================================
     PROPOSTA
===================================================== -->

<section id="telaProposta" class="tela">

    <div class="cabecalho">

        <div class="flex justify-between items-center">

            <div>
                <div class="text-xs opacity-70">
                    FLASHCRED
                </div>

                <h1 class="text-2xl font-bold">
                    Minha Proposta
                </h1>
            </div>

            <i class="fas fa-file-contract text-3xl opacity-80"></i>

        </div>

    </div>

    <div class="cartao">

        <div
            id="barraEtapas"
            class="barra-etapas">
        </div>

    </div>

    <div id="conteudoProposta">
    </div>

    <button
        onclick="voltarInicio()"
        class="botao botao-cinza"
    >
        <i class="fas fa-arrow-left"></i>
        Consultar outro CPF
    </button>

</section>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    { realtime:true }
);


/* =====================================================
   VARIÁVEIS
===================================================== */

let propostaAtual = null;
let canalRealtime = null;
let webcamStream = null;
let modoAssinatura = 'texto';


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    'DOMContentLoaded',
    async () => {

        const cpfSalvo =
            localStorage.getItem(
                'flashcred_cpf'
            );

        if(cpfSalvo) {

            document.getElementById(
                'cpfConsulta'
            ).value = cpfSalvo;

            await executarConsulta(
                cpfSalvo
            );
        }

        document
            .getElementById('cpfConsulta')
            .addEventListener(
                'keydown',
                e => {

                    if(e.key === 'Enter') {
                        executarConsulta();
                    }

                }
            );
    }
);


/* =====================================================
   CONSULTA CPF
===================================================== */

async function executarConsulta(
    cpfInformado = null
) {

    let cpf =
        cpfInformado ||
        document.getElementById(
            'cpfConsulta'
        ).value;

    cpf =
        cpf.replace(/\D/g,'');

    if(cpf.length !== 11) {

        alert(
            'Digite os 11 números do CPF.'
        );

        return;
    }

    const botao =
        document.getElementById(
            'btnConsultar'
        );

    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';

    try {

        const {data,error} =
            await supabase
                .from('propostas')
                .select('*')
                .eq('cpf',cpf)
                .limit(1);

        if(error)
            throw error;

        if(!data || !data.length) {

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );
        }

        propostaAtual =
            data[0];

        localStorage.setItem(
            'flashcred_cpf',
            cpf
        );

        localStorage.setItem(
            'flashcred_proposta_id',
            propostaAtual.id
        );

        abrirProposta();

        configurarRealtime();

    } catch(error) {

        console.error(error);

        alert(
            error.message ||
            'Erro ao consultar proposta.'
        );

    } finally {

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';
    }
}


/* =====================================================
   REALTIME
===================================================== */

function configurarRealtime() {

    if(!propostaAtual)
        return;

    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );
    }

    canalRealtime =
        supabase
        .channel(
            'flashcred_' +
            propostaAtual.id
        )
        .on(
            'postgres_changes',
            {
                event:'UPDATE',
                schema:'public',
                table:'propostas',
                filter:
                    `id=eq.${propostaAtual.id}`
            },
            payload => {

                propostaAtual =
                    payload.new;

                mostrarProposta(
                    propostaAtual
                );
            }
        )
        .subscribe();
}


/* =====================================================
   ABRIR
===================================================== */

function abrirProposta() {

    document
        .getElementById('telaConsulta')
        .classList.remove('visivel');

    document
        .getElementById('telaProposta')
        .classList.add('visivel');

    mostrarProposta(
        propostaAtual
    );
}


/* =====================================================
   VOLTAR
===================================================== */

function voltarInicio() {

    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;
    }

    if(webcamStream) {

        webcamStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        webcamStream = null;
    }

    propostaAtual = null;

    localStorage.removeItem(
        'flashcred_cpf'
    );

    localStorage.removeItem(
        'flashcred_proposta_id'
    );

    document
        .getElementById('telaProposta')
        .classList.remove('visivel');

    document
        .getElementById('telaConsulta')
        .classList.add('visivel');

    document
        .getElementById('cpfConsulta')
        .value = '';
}


/* =====================================================
   UTILITÁRIOS
===================================================== */

function moeda(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}


function escapar(texto) {

    return String(
        texto || ''
    )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


function dataBR(data) {

    if(!data)
        return '-';

    const d =
        new Date(
            data + (
                String(data).includes('T')
                ? ''
                : 'T00:00:00'
            )
        );

    if(isNaN(d))
        return '-';

    return d.toLocaleDateString(
        'pt-BR'
    );
}


/* =====================================================
   CÁLCULO PARCELA
===================================================== */

function calcularParcela(
    saldo,
    quantidade,
    juros
) {

    if(
        !quantidade ||
        quantidade <= 0
    )
        return 0;

    const taxa =
        Number(juros || 0) / 100;

    if(taxa === 0)
        return saldo / quantidade;

    return (
        saldo *
        (
            taxa *
            Math.pow(
                1 + taxa,
                quantidade
            )
        )
    ) /
    (
        Math.pow(
            1 + taxa,
            quantidade
        ) - 1
    );
}


/* =====================================================
   DATAS DAS PARCELAS
===================================================== */

function gerarDatasParcelas(
    quantidade,
    dataBase
) {

    const datas = [];

    const inicio =
        new Date(
            dataBase || new Date()
        );

    for(
        let i = 1;
        i <= quantidade;
        i++
    ) {

        const d =
            new Date(inicio);

        d.setMonth(
            d.getMonth() + i
        );

        datas.push(
            d.toISOString()
                .split('T')[0]
        );
    }

    return datas;
}


/* =====================================================
   ETAPA CORRETA
===================================================== */

function determinarEtapa(p) {

    if(!p)
        return 1;

    const status =
        String(
            p.status || ''
        ).toLowerCase()
        .trim();

    const aprovada =
        status === 'aprovada' ||
        status === 'aprovado';

    const parcelas =
        Number(
            p.qtd_parcelas_escolhida || 0
        );

    const contrato =
        p.contrato_assinado === true;

    const entradaPaga =
        p.entrada_paga === true;

    if(!aprovada)
        return 1;

    if(!parcelas)
        return 2;

    if(!contrato)
        return 3;

    if(!entradaPaga)
        return 4;

    return 5;
}


/* =====================================================
   BARRA DE ETAPAS
===================================================== */

function montarEtapas(
    etapaAtual
) {

    const etapas = [
        ['Análise','fa-search'],
        ['Parcelas','fa-list-check'],
        ['Contrato','fa-file-signature'],
        ['Pix','fa-qrcode'],
        ['Entrega','fa-truck']
    ];

    document.getElementById(
        'barraEtapas'
    ).innerHTML =
        etapas.map(
            (etapa,index) => {

                const numero =
                    index + 1;

                let classe = '';

                if(
                    numero < etapaAtual
                ) {
                    classe =
                        'concluida';
                }

                if(
                    numero === etapaAtual
                ) {
                    classe =
                        'ativa';
                }

                return `

                    <div class="etapa ${classe}">

                        <div class="bolinha">

                            ${
                                numero < etapaAtual
                                ? '<i class="fas fa-check"></i>'
                                : numero
                            }

                        </div>

                        <span>
                            ${etapa[0]}
                        </span>

                    </div>

                `;
            }
        ).join('');
}


/* =====================================================
   MOSTRAR PROPOSTA
===================================================== */

function mostrarProposta(p) {

    const etapa =
        determinarEtapa(p);

    montarEtapas(
        etapa
    );

    const nome =
        escapar(
            p.nome ||
            'Cliente'
        );

    const valor =
        Number(
            p.valor_desejado || 0
        );

    const entrada =
        Number(
            p.valor_entrada || 0
        );

    const juros =
        Number(
            p.juros_mensal || 5
        );

    const limite =
        Number(
            p.quantidade_parcelas ||
            p.qtd_parcelas ||
            0
        );

    const escolhida =
        Number(
            p.qtd_parcelas_escolhida ||
            0
        );

    const status =
        String(
            p.status || ''
        ).toLowerCase()
        .trim();

    const aprovada =
        status === 'aprovada' ||
        status === 'aprovado';

    const contratoAssinado =
        p.contrato_assinado === true;

    const entradaPaga =
        p.entrada_paga === true;

    const total =
        valor *
        (
            1 +
            juros / 100
        );

    let html = `

        <div class="cartao">

            <div class="flex justify-between items-center mb-4">

                <div>

                    <div class="text-xs text-slate-400">
                        CLIENTE
                    </div>

                    <h2 class="text-xl font-bold">
                        ${nome}
                    </h2>

                </div>

                <span class="status status-proxima">
                    FLASHCRED
                </span>

            </div>

            <div class="linha">
                <span class="rotulo">
                    Valor solicitado
                </span>

                <span class="valor">
                    R$ ${moeda(valor)}
                </span>
            </div>

            <div class="linha">
                <span class="rotulo">
                    Entrada
                </span>

                <span class="valor">
                    R$ ${moeda(entrada)}
                </span>
            </div>

            <div class="linha">
                <span class="rotulo">
                    Juros
                </span>

                <span class="valor">
                    ${moeda(juros)}% a.m.
                </span>
            </div>

            <div class="linha">
                <span class="rotulo">
                    Valor total
                </span>

                <span class="valor">
                    R$ ${moeda(total)}
                </span>
            </div>

        </div>

    `;


    /* =================================================
       EM ANÁLISE
    ================================================= */

    if(!aprovada) {

        html += `

            <div class="cartao">

                <div class="text-center p-5">

                    <i class="fas fa-clock text-4xl text-alerta"></i>

                    <h3 class="font-bold text-lg mt-3">
                        Proposta em análise
                    </h3>

                    <p class="text-sm text-slate-500 mt-2">
                        Aguarde a conclusão da análise.
                    </p>

                </div>

            </div>

        `;

        document.getElementById(
            'conteudoProposta'
        ).innerHTML = html;

        return;
    }


    /* =================================================
       ETAPA 2 — ESCOLHER PARCELAS
    ================================================= */

    if(
        aprovada &&
        !escolhida
    ) {

        const limiteSeguro =
            Math.max(
                1,
                Math.min(
                    limite || 24,
                    48
                )
            );

        let opcoes = '';

        for(
            let n = 1;
            n <= limiteSeguro;
            n++
        ) {

            const parcela =
                calcularParcela(
                    total - entrada,
                    n,
                    juros
                );

            opcoes += `

                <option value="${n}">
                    ${n}x de R$ ${moeda(parcela)}
                </option>

            `;
        }

        html += `

            <div class="cartao">

                <h3 class="text-xl font-bold text-primary mb-2">
                    Escolha suas parcelas
                </h3>

                <p class="text-sm text-slate-500 mb-4">
                    Selecione a quantidade de parcelas para continuar.
                </p>

                <div class="resumo">

                    <p>
                        Valor financiado:
                        <strong>
                            R$ ${moeda(total - entrada)}
                        </strong>
                    </p>

                    <p>
                        Entrada:
                        <strong>
                            R$ ${moeda(entrada)}
                        </strong>
                    </p>

                    <p>
                        Juros:
                        <strong>
                            ${moeda(juros)}% a.m.
                        </strong>
                    </p>

                </div>

                <select
                    id="qtdEscolhida"
                    class="campo"
                >
                    ${opcoes}
                </select>

                <button
                    onclick="confirmarParcelas()"
                    class="botao botao-sucesso"
                >
                    <i class="fas fa-arrow-right"></i>
                    Continuar para o contrato
                </button>

            </div>

        `;

        document.getElementById(
            'conteudoProposta'
        ).innerHTML = html;

        return;
    }


    /* =================================================
       ETAPA 3 — CONTRATO
    ================================================= */

    if(
        escolhida &&
        !contratoAssinado
    ) {

        const parcela =
            calcularParcela(
                total - entrada,
                escolhida,
                juros
            );

        html += `

            <div class="cartao">

                <h3 class="text-xl font-bold text-primary mb-4">
                    Contrato da proposta
                </h3>

                <div class="resumo">

                    <p>
                        Valor total:
                        <strong>
                            R$ ${moeda(total)}
                        </strong>
                    </p>

                    <p>
                        Entrada:
                        <strong>
                            R$ ${moeda(entrada)}
                        </strong>
                    </p>

                    <p>
                        Parcelamento:
                        <strong>
                            ${escolhida}x de R$ ${moeda(parcela)}
                        </strong>
                    </p>

                    <p>
                        Juros:
                        <strong>
                            ${moeda(juros)}% ao mês
                        </strong>
                    </p>

                </div>

                <div class="contrato">

                    <h3>
                        CONTRATO DE CRÉDITO
                    </h3>

                    <p>
                        Pelo presente instrumento, o cliente declara
                        estar ciente das condições apresentadas nesta
                        proposta e manifesta sua concordância com os
                        valores, quantidade de parcelas, encargos,
                        vencimentos e demais condições informadas.
                    </p>

                    <p>
                        Valor total da operação:
                        <strong>
                            R$ ${moeda(total)}
                        </strong>.
                    </p>

                    <p>
                        Valor da entrada:
                        <strong>
                            R$ ${moeda(entrada)}
                        </strong>.
                    </p>

                    <p>
                        O saldo será dividido em
                        <strong>
                            ${escolhida} parcelas
                        </strong>
                        de aproximadamente
                        <strong>
                            R$ ${moeda(parcela)}
                        </strong>,
                        conforme as condições apresentadas.
                    </p>

                    <p>
                        O cliente declara que leu as informações
                        apresentadas, compreendeu as condições da
                        operação e concorda com elas antes de realizar
                        a assinatura eletrônica.
                    </p>

                    <p>
                        A assinatura somente será registrada após a
                        confirmação expressa do cliente.
                    </p>

                </div>

                <label class="flex items-center gap-2 mb-4">

                    <input

                    <span class="text-sm">

                    </span>

                </label>

                <div class="mb-3">

                    <button
                        onclick="alternarModo('texto')"

                    >

                <button
                    onclick="assinarContrato()"

                >

                    Assinar contrato
                </button>

            </div>

        `;

        document.getElementById(
            'conteudoProposta'
        ).innerHTML = html;

        return;
    }


    /* =================================================
       ETAPA 4 — PIX ENTRADA
    ================================================= */

    if(
        contratoAssinado &&
        !entradaPaga
    ) {

        html += `

            <div class="cartao">

                <div class="sucesso">

                    <i class="fas fa-file-signature text-4xl"></i>

                    <h3 class="font-bold text-lg mt-2">
                        CONTRATO ASSINADO
                    </h3>

                    <p class="text-sm mt-1">

                    </p>

                </div>

                <div class="resumo">

                    <p>
                        Entrada:
                        <strong>
                            R$ ${moeda(entrada)}
                        </strong>
                    </p>

                    <p>

                </button>

                <div

            </div>

        `;

        document.getElementById(
            'conteudoProposta'
        ).innerHTML = html;

        return;
    }


    /* =================================================
       ETAPA 5 — PARCELAS
    ================================================= */

    if(entradaPaga) {

        const datas =
            obterDatasParcelas(
                p,
                escolhida
            );

        const parcela =
            calcularParcela(
                total - entrada,
                escolhida,
                juros
            );

        const pagas =
            Number(
                p.parcelas_pagas || 0

        html += `

            <div class="cartao">

                <div class="sucesso">

                <div class="resumo">

                    <p>

                        Quantidade:

            let i = 0;
            i < escolhida;

            const pago =
                numero <= pagas;

            const hoje =
                new Date();

            hoje.setHours(
                0,0,0,0
            );

            const dataVenc =
                new Date(
                    vencimento +
                    'T00:00:00'
                );

            let classeStatus =
                'status-proxima';

            let textoStatus =
                'Próxima';

            if(pago) {

                classeStatus =
                    'status-pago';

                textoStatus =
                    'PAGO';

            } else if(
                dataVenc < hoje
            ) {

                classeStatus =
                    'status-vencido';

                textoStatus =
                    'VENCIDA';

            } else if(
                numero === pagas + 1
            ) {

                classeStatus =
                    'status-pendente';

                textoStatus =
                    'PENDENTE';
            }

            html += `

                <div class="parcela">

                    <div class="parcela-topo">

                            <small>
                                Valor
                            </small>

                            <strong>

                            </strong>

                        </div>

                        <div class="info-parcela">

                            <small>
                                Vencimento
                            </small>

                            <strong>

                            </strong>

                        </div>

                    </div>

                    ${

                        ?
                        `
                            <div class="text-center text-green-600 font-bold text-sm">
                                <i class="fas fa-circle-check"></i>
                                Parcela paga
                            </div>
                        `
                        :
                        `
                            <button
                                onclick="gerarPixParcela(
                                    ${parcela},
                                    ${numero}
                                )"
                                class="botao botao-pix"
                            >
                                <i class="fas fa-qrcode"></i>
                                Gerar Pix para pagar
                            </button>

                            <div
                                id="pixParcela${numero}"
                                class="pix-area oculto"
                            ></div>
                        `
                    }

                </div>

            `;
        }

        html += `

                </div>

            </div>

        `;

        document.getElementById(
            'conteudoProposta'
        ).innerHTML = html;
    }
}


/* =====================================================
   DATAS SALVAS / CRIAÇÃO
===================================================== */

function obterDatasParcelas(
    p,
    quantidade
) {

    if(
        Array.isArray(
            p.datas_parcelas
        ) &&
        p.datas_parcelas.length >= quantidade
    ) {

        return p.datas_parcelas
            .slice(0,quantidade);
    }

    const base =
        p.data_pagamento_entrada ||
        p.data_entrada_paga ||
        p.updated_at ||
        new Date()
            .toISOString();

    return gerarDatasParcelas(
        quantidade,
        base
    );
}


/* =====================================================
   CONFIRMAR PARCELAS
===================================================== */

async function confirmarParcelas() {

    const campo =
        document.getElementById(
            'qtdEscolhida'
        );

    if(!campo)
        return;

    const quantidade =
        Number(
            campo.value
        );

    if(
        !quantidade ||
        quantidade < 1
    ) {

        alert(
            'Selecione a quantidade de parcelas.'
        );

        return;
    }

    const btn =
        document.querySelector(
            '#conteudoProposta .botao-sucesso'
        );

    if(btn) {

        btn.disabled = true;

        btn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Salvando...';
    }

    try {

        /*
         * As datas são criadas provisoriamente.
         * Quando a entrada for efetivamente paga,
         * o sistema poderá recalcular a partir
         * da data real do pagamento.
         */

        const datas =
            gerarDatasParcelas(
                quantidade,
                new Date()
            );

        const {error} =
            await supabase
                .from('propostas')
                .update({
                    qtd_parcelas_escolhida:
                        quantidade,

                    datas_parcelas:
                        datas
                })
                .eq(
                    'id',
                    propostaAtual.id
                );

        if(error)
            throw error;

        propostaAtual.qtd_parcelas_escolhida =
            quantidade;

        propostaAtual.datas_parcelas =
            datas;

        mostrarProposta(
            propostaAtual
        );

    } catch(error) {

        console.error(error);

        alert(
            'Não foi possível salvar a quantidade de parcelas: ' +
            (
                error.message ||
                error
            )
        );

        if(btn) {

            btn.disabled = false;

            btn.innerHTML =
                '<i class="fas fa-arrow-right"></i> Continuar para o contrato';
        }
    }
}


/* =====================================================
   ASSINATURA
===================================================== */

function alternarModo(
    modo
) {

    modoAssinatura =
        modo;
}


async function assinarContrato() {

    const aceite =
        document.getElementById(
            'aceitoContrato'
        );

    const nome =
        document.getElementById(
            'assTxt'
        );

    if(
        !aceite ||
        !aceite.checked
    ) {

        alert(
            'É necessário aceitar os termos do contrato.'
        );

        return;
    }

    const assinatura =
        nome
        ? nome.value.trim()
        : '';

    if(!assinatura) {

        alert(
            'Digite seu nome completo para assinar.'
        );

        return;
    }

    try {

        const {error} =
            await supabase
                .from('propostas')
                .update({

                    contrato_assinado:
                        true,

                    assinatura:
                        assinatura,

                    data_assinatura:
                        new Date()
                            .toISOString()

                })
                .eq(
                    'id',
                    propostaAtual.id
                );

        if(error)
            throw error;

        propostaAtual.contrato_assinado =
            true;

        propostaAtual.assinatura =
            assinatura;

        propostaAtual.data_assinatura =
            new Date()
                .toISOString();

        mostrarProposta(
            propostaAtual
        );

    } catch(error) {

        console.error(error);

        alert(
            'Erro ao assinar contrato: ' +
            (
                error.message ||
                error
            )
        );
    }
}

/* =====================================================
   API PIX
===================================================== */

async function buscarPix(
    valor,
    descricao
) {

    const resposta =
        await fetch(
            '/api/gerar-pix',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json'
                },

                body:JSON.stringify({

                    valor:
                        Number(valor)
                        .toFixed(2),

                    descricao:
                        descricao

                })
            }
        );

    if(!resposta.ok) {

        throw new Error(
            'Erro ao gerar Pix.'
        );
    }

    const json =
        await resposta.json();

    const codigo =
        json.qr_code ||
        json.copia_cola ||
        json.pixCopiaECola ||
        json.codigo;

    if(!codigo) {

        throw new Error(
            'A API não retornou o código Pix.'
        );
    }

    return codigo;
}


/* =====================================================
   COPIAR PIX
===================================================== */

async function copiarPix(
    codigo
) {

    try {

        await navigator
            .clipboard
            .writeText(codigo);

        alert(
            'Pix Copia e Cola copiado!'
        );

    } catch(error) {

        alert(
            'Não foi possível copiar automaticamente.'
        );
    }
}


/* =====================================================
   ESCAPE PARA JS
===================================================== */

function escaparJS(
    texto
) {

    return String(texto)
        .replace(/\\/g,'\\\\')
        .replace(/'/g,"\\'")
        .replace(/\n/g,'\\n')
        .replace(/\r/g,'\\r');
}
