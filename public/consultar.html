<script>
async function irEtapa3() {
    etapaAtual = 3;
    atualizarBarra();
    const entrada = Number(proposta.valor_entrada || 0);

    document.getElementById('conteudo').innerHTML = `
        <div class="cartao p-5 text-center">
            <h2 class="text-lg font-bold mb-3 text-primary">💳 Pagamento da Entrada</h2>
            <p class="text-2xl font-bold text-sucesso mb-4">R$ ${entrada.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
            <p class="text-sm text-gray-600 mb-6">Você será redirecionado para o ambiente seguro do Mercado Pago para finalizar seu PIX.</p>
            <button onclick="gerarCheckoutMP()" class="botao botao-sucesso">Pagar com PIX no Mercado Pago</button>
            <button onclick="irEtapa2()" class="botao botao-cinza mt-3">Voltar</button>
        </div>
    `;
}

async function gerarCheckoutMP() {
    const entrada = Number(proposta.valor_entrada || 0);
    try {
        const res = await fetch('https://api.mercadopago.com/checkout/preferences', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${MP_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                items: [{ title: `Entrada Proposta #${proposta.id}`, unit_price: entrada, quantity: 1, currency_id: 'BRL' }],
                payment_methods: { excluded_payment_types: [{ id: "credit_card" }, { id: "debit_card" }] },
                external_reference: `${proposta.id}`,
                back_urls: { success: window.location.href, failure: window.location.href, pending: window.location.href },
                auto_return: "approved"
            })
        });
        const data = await res.json();
        if(data.init_point) window.location.href = data.init_point;
    } catch(e) { alert('Erro ao abrir checkout. Tente novamente.'); }
}
</script>
