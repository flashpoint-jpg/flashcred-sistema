<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <style>
        :root {
            --primary: #0A2463;
            --pix-green: #32BCAD;
            --pix-green-dark: #239e91;
            --bg-body: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; }

        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .bolinha-carregando {
            width: 20px;
            height: 20px;
            border: 3px solid #E2E8F0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: girar 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        nav { background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-color); padding: 16px 24px; position: sticky; top:0; z-index:50; }
        .nav-container { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 12px; }
        .nav-links a { font-weight: 600; color: var(--primary); text-decoration: none; font-size: 13px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--border-color); background: #fff; transition: all 0.2s ease; }
        .nav-links a:hover { background: var(--primary); color: #fff; }

        main { max-width: 720px; margin: 30px auto; padding: 0 20px; }

        /* Estilo do Banner em Alta Definição */
        .destaque-container {
            width: 100%;
            margin-bottom: 24px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(10, 36, 99, 0.08);
            background: #FFFFFF;
            border: 1px solid var(--border-color);
        }
        .destaque-imagem {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .card { background: #FFFFFF; border-radius: 24px; padding: 36px; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.04); border: 1px solid var(--border-color); }

        .status { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 16px; background: #F1F5F9; color: var(--primary); font-weight: 700; font-size: 18px; margin-bottom: 30px; text-align: center; }
        
        .dados-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
        @media(max-width: 520px) { .dados-grid { grid-template-columns: 1fr; gap: 16px; } }
        .rotulo { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        .valor { font-size: 16px; font-weight: 700; color: var(--primary); }
        .protocolo { margin-top: 10px; padding-top: 16px; border-top: 1px solid var(--border-color); font-size: 14px; color: var(--text-muted); }
        .protocolo strong { color: var(--primary); }

        .btn-acao { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--pix-green) 0%, var(--pix-green-dark) 100%); color: #04203a; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 20px; text-align: center; text-decoration: none; display: block; }
        .btn-acao:hover { opacity: 0.95; }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="/" class="logo">FlashCred</a>
        <div class="nav-links">
            <a href="/">Nova Solicitação</a>
            <a href="/painel">Painel Admin</a>
        </div>
    </div>
</nav>

<main>
    <!-- 🖼️ BANNER DE ALTA RESOLUÇÃO NA PÁGINA DE CONSULTA -->
    <div class="destaque-container">
        <img 
            src="/banner.png" 
            alt="FlashCred Banner" 
            class="destaque-imagem"
            onerror="this.parentElement.style.display='none'; document.getElementById('erro-img-consultar').style.display='block';"
        >
    </div>
    <div id="erro-img-consultar" style="display:none;" class="mb-6 p-4 bg-amber-50 border border-amber-300 text-amber-800 rounded-2xl text-center text-sm mb-4">
        ⚠️ O arquivo <strong>banner.png</strong> não foi encontrado na pasta <strong>public</strong> do GitHub.
    </div>

    <div class="card">
        <!-- Status dinâmico -->
        <div class="status" id="statusBox">
            <span class="bolinha-carregando" id="spinner"></span>
            <span id="statusTexto">BUSCANDO PROPOSTA...</span>
        </div>

        <div class="dados-grid">
            <div>
                <div class="rotulo">Nome do Solicitante</div>
                <div class="valor" id="nomeCliente">Carregando...</div>
            </div>
            <div>
                <div class="rotulo">CPF</div>
                <div class="valor" id="cpfCliente">---</div>
            </div>
            <div>
                <div class="rotulo">Telefone / WhatsApp</div>
                <div class="valor" id="telCliente">---</div>
            </div>
            <div>
                <div class="rotulo">Valor Solicitado</div>
                <div class="valor" id="valorCliente">---</div>
            </div>
        </div>

        <div class="protocolo">
            <strong>Nº Protocolo:</strong> <span id="protocoloNum">FL-2026-0000</span>
        </div>

        <a href="#" id="btnWhats" class="btn-acao" target="_blank">
            📱 Agilizar Análise via WhatsApp
        </a>
    </div>
</main>

<script>
window.addEventListener('load', () => {
    fetch('/api/propostas')
        .then(res => res.json())
        .then(resJson => {
            if(resJson.success && resJson.data.length > 0) {
                // Pega a última proposta enviada
                const p = resJson.data[resJson.data.length - 1];
                
                document.getElementById('nomeCliente').textContent = p.nome;
                document.getElementById('cpfCliente').textContent = p.cpf;
                document.getElementById('telCliente').textContent = p.telefone;
                
                let valFmt = Number(p.valor_desejado || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                document.getElementById('valorCliente').textContent = valFmt;
                
                const protocolo = `FL2026-${p.id.toString().padStart(5, '0')}`;
                document.getElementById('protocoloNum').textContent = protocolo;

                const status = p.status || 'Em Análise';
                document.getElementById('statusTexto').textContent = status.toUpperCase();

                if(status === 'Aprovada') {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('statusBox').style.background = '#D1FAE5';
                    document.getElementById('statusBox').style.color = '#065F46';
                } else if(status === 'Recusada') {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('statusBox').style.background = '#FEE2E2';
                    document.getElementById('statusBox').style.color = '#B91C1C';
                }

                const msg = encodeURIComponent(`Olá! Gostaria de agilizar a análise da minha proposta (${protocolo}) em nome de ${p.nome}.`);
                document.getElementById('btnWhats').href = `https://wa.me/5535999998888?text=${msg}`;
            } else {
                document.getElementById('statusTexto').textContent = "NENHUMA SOLICITAÇÃO ENCONTRADA";
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('nomeCliente').textContent = "Faça uma nova solicitação";
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById('statusTexto').textContent = "ERRO DE CONEXÃO";
            document.getElementById('spinner').style.display = 'none';
        });
});
</script>
</body>
</html>
