<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #F8FAFC; min-height: 100vh; }
        .cartao { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .destaque { background: #F0FDF4; border-left: 4px solid #10B981; }
        .opcao-parcela { border: 2px solid #E2E8F0; border-radius: 10px; padding: 14px; cursor: pointer; transition: all 0.2s; }
        .opcao-parcela:hover { border-color: #3B82F6; background: #EFF6FF; }
        .opcao-parcela.selecionada { border-color: #0A2463; background: #DBEAFE; font-weight: bold; }
        .botao-avancar { background: #0A2463; color: white; padding: 14px; border-radius: 10px; font-weight: bold; border: none; width: 100%; font-size: 16px; }
        .botao-avancar:disabled { background: #94A3B8; cursor: not-allowed; }
    </style>
</head>
<body class="p-4">

<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-center text-primary mb-6">📋 Minha Proposta</h1>
    <div id="conteudo"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let proposta = null;
let qtdParcelasEscolhida = null;

// ✅ PEGA O CPF DA URL
function pegarCPFdaURL() {
    const params = new URLSearchParams(window.location.search);
    let cpf = params.get('cpf') || '';
    return cpf.replace(/\D/g, '');
}

// ✅ CARREGA A PROPOSTA
async function carregarProposta() {
    const cpf = pegarCPFdaURL();
    if(!cpf) {
        document.getElementById('conteudo').innerHTML = `
            <div class="cartao p-6 text-center">
                <i class="fas fa-user-search text-4xl text-gray-400 mb-4"></i>
                <p class="text-lg">Digite seu CPF para consultar sua proposta:</p>
                <input type="text" id="cpfInput" placeholder="000.000.000-00" class="w-full p-3 border rounded-lg mt-4 text-center text-lg" maxlength="14">
                <button onclick="buscarProposta()" class="botao-avancar mt-4">Consultar</button>
            </div>
        `;
        return;
    }
    await buscarPorCPF(cpf);
}

async function buscarProposta() {
    let cpf = document.getElementById('cpfInput').value.replace(/\D/g, '');
    if(!cpf || cpf.length !== 11) { alert('Digite um CPF válido!'); return; }
    window.location.search = '?cpf=' + cpf;
}

async function buscarPorCPF(cpfLimpo) {
    try {
        const {data, error} = await supabase
            .from('propostas')
            .select('*')
            .ilike('cpf', '%' + cpfLimpo + '%')
            .order('created_at', {ascending:false})
            .limit(1);

        if(error) throw error;
        if(!data || data.length === 0) {
            document.getElementById('conteudo').innerHTML = `
                <div class="cartao p-6 text-center">
                    <i class="fas fa-exclamation-circle text-4xl text-red-400 mb-4"></i>
                    <p class="text-lg font-bold text-red-600">Proposta não encontrada!</p>
                    <p class="text-gray-500 mt-2">Verifique o CPF digitado.</p>
                    <a href="consulta.html" class="inline-block mt-4 text-primary underline">← Tentar novamente</a>
                </div>
            `;
            return;
        }

        proposta = data[0];
        renderizarProposta();

    } catch(e) {
        document.getElementById('conteudo').innerHTML = `
            <div class="cartao p-6 text-center">
                <p class="text-red-600">Erro ao carregar: ${e.message}</p>
            </div>
        `;
    }
}

// ✅ CÁLCULO CORRIGIDO — SEM VALOR NEGATIVO!
function calcularValores(valor, entrada, juros, qtd) {
    const valorTotal = valor * (1 + juros / 100);
    const saldo = valorTotal - entrada; // ✅ VALOR - ENTRADA (NÃO INVERTE!)
    
    let valorParcela = 0;
    if(qtd === 1) {
        valorParcela = valorTotal;
    } else if(saldo > 0 && qtd > 0) {
        valorParcela = saldo * Math.pow(1 + juros/100, qtd) * (juros/100) / (Math.pow(1 + juros/100, qtd) - 1);
    }
    return { valorTotal, saldo, valorParcela };
}

// ✅ EXIBE TUDO CORRETAMENTE
function renderizarProposta() {
    const valor = Number(proposta.valor_desejado || 0);
    const entrada = Number(proposta.valor_entrada || 0);
    const juros = Number(proposta.juros_mensal || 5);
    const qtdMax = Number(proposta.quantidade_parcelas || 1);
    const status = proposta.status || 'Nova';

    let html = `
    <div class="cartao p-6">
        <h2 class="text-xl font-bold text-primary mb-4">👤 ${proposta.nome || 'Cliente'}</h2>
        <div class="space-y-3 text-lg">
            <div class="flex justify-between"><span class="text-gray-600">CPF:</span><span class="font-bold">${(proposta.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</span></div>
            <div class="flex justify-between"><span class="text-gray-600">Valor do Produto:</span><span class="font-bold">R$ ${valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span></div>
            <div class="flex justify-between destaque p-2 rounded"><span class="text-gray-600">Entrada:</span><span class="font-bold text-sucesso">R$ ${entrada.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span></div>
    `;

    if(status !== 'Aprovada') {
        html += `
            <div class="mt-4 p-4 bg-amber-50 rounded-lg text-center">
                <i class="fas fa-clock text-amber-500 text-2xl mb-2"></i>
                <p class="font-bold text-amber-700">Aguardando aprovação</p>
                <p class="text-sm text-amber-600 mt-1">Sua proposta está em análise.</p>
            </div>
        `;
    } else {
        // ✅ PROPOSTA APROVADA → MOSTRA PARCELAS
        const calc1 = calcularValores(valor, entrada, juros, 1);
        const calc2 = qtdMax >= 2 ? calcularValores(valor, entrada, juros, 2) : null;

        html += `
            <div class="flex justify-between border-t pt-3 mt-3">
                <span class="text-gray-600 font-bold">💰 Valor Total com Juros:</span>
                <span class="font-bold text-xl text-primary">R$ ${calc1.valorTotal.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>
            </div>
            <div class="text-sm text-gray-500 mt-2">Escolha em quantas vezes deseja pagar:</div>
            <div class="space-y-3 mt-2">
                <div class="opcao-parcela" onclick="escolherParcela(1)">
                    <span class="font-bold">1x de R$ ${calc1.valorParcela.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>
                </div>
                ${calc2 ? `
                <div class="opcao-parcela" onclick="escolherParcela(2)">
                    <span class="font-bold">2x de R$ ${calc2.valorParcela.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>
                </div>
                ` : ''}
            </div>
            <button id="btnAvancar" class="botao-avancar mt-6" disabled>Avançar → Confirmar Entrega</button>
        `;
    }

    html += `</div></div>`;
    document.getElementById('conteudo').innerHTML = html;
}

// ✅ ESCOLHE PARCELA
function escolherParcela(qtd) {
    qtdParcelasEscolhida = qtd;
    document.querySelectorAll('.opcao-parcela').forEach((el, i) => {
        el.classList.toggle('selecionada', i+1 === qtd);
    });
    document.getElementById('btnAvancar').disabled = false;
}

// ✅ CARREGA AO ABRIR
window.onload = carregarProposta;
</script>
</body>
</html>
