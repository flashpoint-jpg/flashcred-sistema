<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: #F8FAFC; 
            color: #1E293B; 
            padding: 16px; 
            max-width: 600px; 
            margin: 0 auto; 
            min-height: 100vh;
        }
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 24px; 
            margin-bottom: 16px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
            width: 100%;
        }
        .btn { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: none; 
            font-weight: 600; 
            cursor: pointer !important; 
            margin: 8px 0; 
            font-size: 16px; 
            pointer-events: auto !important;
            position: relative;
            z-index: 10;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #0A2463; color: white; }
        .btn-success { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-pix { background: #32BCAD; color: white; }
        .btn-cam { background: #8B5CF6; color: white; }
        .loading { text-align: center; padding: 20px; color: #64748B; width: 100%; }
        .oculto { display: none !important; }

        /* ✅ BARRA DE ETAPAS */
        .progresso-etapas { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; width: 100%; }
        .progresso-etapas::before { content: ''; position: absolute; top: 12px; left: 10%; right: 10%; height: 3px; background: #E2E8F0; z-index: 0; }
        .etapa { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; font-size: 12px; font-weight: 500; color: #94A3B8; }
        .etapa.ativo { color: #0A2463; font-weight: 700; }
        .etapa.concluido { color: #10B981; }
        .bolinha-etapa { width: 24px; height: 24px; border-radius: 50%; background: #E2E8F0; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; font-size: 12px; font-weight: bold; }
        .etapa.ativo .bolinha-etapa { background: #0A2463; color: white; }
        .etapa.concluido .bolinha-etapa { background: #10B981; color: white; }

        /* ✅ BARRA DE ENTREGA E PARCELAS */
        .barra-entrega, .barra-parcelas { margin: 16px 0; }
        .texto-barra { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .fundo-barra { width: 100%; height: 10px; background: #E2E8F0; border-radius: 5px; overflow: hidden; }
        .preenchimento-entrega { height: 100%; background: #F59E0B; transition: 0.3s; }
        .preenchimento-parcelas { height: 100%; background: #10B981; transition: 0.3s; }

        .aviso-entrega {
            background: #FFFBEB;
            border: 3px solid #F59E0B;
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #92400E;
            width: 100%;
        }
        .texto-contrato { max-height: 220px; overflow-y: auto; padding: 12px; background: #F8FAFC; border-radius: 8px; border: 1px solid #E2E8F0; margin: 12px 0; font-size: 14px; line-height: 1.6; width: 100%; }
        .campo-assinatura { width: 100%; padding: 12px; border: 2px dashed #64748B; border-radius: 8px; text-align: center; font-size: 18px; margin: 12px 0; background: #fff; }
        .area-cam { border: 2px solid #E2E8F0; border-radius: 8px; padding: 10px; margin: 12px 0; text-align: center; width: 100%; }
        video { width: 100%; max-height: 300px; border-radius: 8px; }
        .chave-pix { 
            background: #ECFDF5; 
            border: 2px solid #10B981; 
            border-radius: 8px; 
            padding: 16px; 
            text-align: center; 
            font-weight: 600; 
            margin: 16px 0; 
            word-break: break-all;
            width: 100%;
        }
        .qrcode-pix { display: flex; justify-content: center; align-items: center; margin: 20px 0; width: 100%; }
        .item-parcela { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #E2E8F0; font-size: 14px; width: 100%; }
        .item-parcela:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div id="areaConsulta" class="card">
    <h2 class="text-xl font-bold text-center mb-4 text-primary">🔍 Acompanhar Proposta</h2>
    <input type="text" id="cpfConsulta" placeholder="Digite seu CPF (apenas números)" maxlength="11" class="w-full p-3 border border-gray-300 rounded-lg mb-4 text-center text-lg">
    <button onclick="buscarProposta()" class="btn btn-primary">Consultar</button>
</div>

<div id="conteudoProposta" class="hidden"></div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

let inscricao = null, dadosProposta = null, qtdEscolhida = 0, streamCam = null;

window.onload = () => {
    const cpfUrl = new URLSearchParams(window.location.search).get('cpf');
    if(cpfUrl) {
        document.getElementById('cpfConsulta').value = cpfUrl.replace(/\D/g,'');
        buscarProposta();
    }
};

async function gerarPixViaAPI(valor, descricao) {
    try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/gerar-pix`, {
            method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_KEY}`},
            body:JSON.stringify({cpf:dadosProposta.cpf, nome:dadosProposta.nome, valor:Number(valor), descricao})
        });
        const json = await res.json();
        if(json && (json.copia_e_cola || json.pix_copia_e_cola)) return json.copia_e_cola || json.pix_copia_e_cola;
    } catch {}
    const v = Number(valor).toFixed(2), chave='33552949852', nome='FELIPE COSTA', cidade='MUZAMBINHO';
    const crc = t => {let r=0xFFFF,p=0x1021;for(let i=0;i<t.length;i++){r^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)r=(r&0x8000)?(r<<1^p)&0xFFFF:(r<<1)&0xFFFF;}return r.toString(16).toUpperCase().padStart(4,'0')};
    return `00020126580014br.gov.bcb.pix0111${chave}5204000053039865802BR59${String(nome.length).padStart(2,'0')}${nome}60${String(cidade.length).padStart(2,'0')}${cidade}62070503***5406${v}6304${crc(`00020126580014br.gov.bcb.pix0111${chave}5204000053039865802BR59${String(nome.length).padStart(2,'0')}${nome}60${String(cidade.length).padStart(2,'0')}${cidade}62070503***5406${v}6304`)}`;
}

async function buscarProposta() {
    const cpf = document.getElementById('cpfConsulta').value.replace(/\D/g,'');
    if(cpf.length!==11) { alert('Digite um CPF válido!'); return; }

    document.getElementById('areaConsulta').classList.add('hidden');
    document.getElementById('conteudoProposta').innerHTML = `<div class="loading"><i class="fas fa-spinner fa-spin text-2xl"></i><br>Carregando...</div>`;
    document.getElementById('conteudoProposta').classList.remove('hidden');

    const {data, error} = await supabase.from('propostas').select('*').eq('cpf',cpf).single();
    if(error||!data){document.getElementById('conteudoProposta').innerHTML=`<div class="card text-center"><i class="fas fa-exclamation-circle text-red-500 text-3xl"></i><br>Proposta não encontrada.</div>`;return;}

    dadosProposta=data; await montarTela(data); ativarTempoReal(cpf);
}

async function montarTela(p) {
    const v=Number(p.valor_desejado||0), e=Number(p.valor_entrada||0), j=Number(p.juros_mensal||5), q=Number(p.quantidade_parcelas||1), qtd=Number(p.qtd_parcelas_escolhida||q), total=v*(1+j/100), dias=p.dias_entrega||7, datas=p.datas_parcelas||[], pagas=Number(p.parcelas_pagas||0), perc=Math.round((pagas/qtd)*100);
    let passo=1; if(p.status==='Aprovada')passo=2; if(p.contrato_assinado)passo=3; if(p.entrada_paga)passo=4;

    let html=`
    <div class="card">
        <h2 class="text-xl font-bold text-primary mb-2 text-center">Olá, ${p.nome}!</h2>
        <p class="mb-3 text-center">Status: <strong class="${p.status==='Aprovada'?'text-green-600':'text-orange-500'}">${p.status}</strong></p>

        <div class="progresso-etapas">
            <div class="etapa ${passo>=1?'concluido':''}"><div class="bolinha-etapa">${passo>1?'✓':'1'}</div><span>Proposta</span></div>
            <div class="etapa ${passo>=2?(passo>2?'concluido':'ativo'):''}"><div class="bolinha-etapa">${passo>2?'✓':'2'}</div><span>Aprovada</span></div>
            <div class="etapa ${passo>=3?(passo>3?'concluido':'ativo'):''}"><div class="bolinha-etapa">${passo>3?'✓':'3'}</div><span>Contrato</span></div>
            <div class="etapa ${passo>=4?'ativo':''}"><div class="bolinha-etapa">4</div><span>Pagamento</span></div>
        </div>

        ${p.status==='Aprovada'?`
        <div class="aviso-entrega"><i class="fas fa-truck"></i> ENTREGA EM ATÉ ${dias} DIAS ÚTEIS APÓS PAGAMENTO!</div>
        <div class="barra-entrega"><div class="texto-barra"><span>Entrega</span><span>${dias} dias úteis</span></div><div class="fundo-barra"><div class="preenchimento-entrega" style="width:${p.entrada_paga?'0%':'100%'}"></div></div></div>`:''}

        <div class="bg-gray-50 p-3 rounded-lg mb-3">
            <p><strong>Cliente:</strong> ${p.nome}</p>
            <p><strong>CPF:</strong> ${p.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')}</p>
            <p><strong>WhatsApp:</strong> ${p.whatsapp||'Não informado'}</p>
            <p><strong>Valor:</strong> R$ ${v.toLocaleString('pt-BR',2)}</p>
            <p><strong>Entrada:</strong> R$ ${e.toLocaleString('pt-BR',2)}</p>
            <p><strong>Parcelas:</strong> ${qtd}x</p>
            <p><strong>Total:</strong> R$ ${total.toLocaleString('pt-BR',2)}</p>
        </div>`;

    if(p.status==='Nova'||p.status==='Em Análise') html+=`<div class="text-center p-4 bg-yellow-50 rounded-lg"><i class="fas fa-clock text-yellow-500 text-2xl"></i><p class="font-semibold mt-2">Aguardando análise...</p></div>`;

    if(p.status==='Aprovada'&&!p.contrato_assinado&&!p.entrada_paga) html+=`
        <div class="card">
            <h3 class="font-bold text-lg mb-2 text-center">Escolha as parcelas:</h3>
            <select id="qtdParcelas" class="w-full p-3 border rounded-lg mb-3">
                ${Array.from({length:q},(_,i)=>{const n=i+1,val=((total-e)*(Math.pow(1+j/100,n)*(j/100))/(Math.pow(1+j/100,n)-1));return`<option value="${n}">${n}x de R$ ${val.toLocaleString('pt-BR',2)}</option>`}).join('')}
            </select>
            <button onclick="abrirContrato()" class="btn btn-success">✅ Continuar</button>
        </div>
        <div id="blocoContrato" class="oculto">
            <h3 class="font-bold text-lg mb-2 text-center">📄 Contrato</h3>
            <div class="texto-contrato">Valor total R$ ${total.toLocaleString('pt-BR',2)}<br>Entrada R$ ${e.toLocaleString('pt-BR',2)}<br>Entrega em ${dias} dias úteis.<br>Ao assinar concorda com os termos.</div>
            <label class="flex items-center gap-2 mb-3 font-medium"><input type="checkbox" id="aceitoContrato"> Li e aceito</label>
            <button onclick="mostrarOpcoes()" class="btn btn-primary">✍️ Assinar</button>
            <div id="opcoesAssinatura" class="oculto mt-4">
                <button onclick="mostrarTexto()" class="btn btn-success mb-2">✍️ Nome</button>
                <button onclick="abrirCam()" class="btn btn-cam">📸 Foto</button>
                <div id="assinaturaTexto" class="oculto mt-3"><input type="text" id="txtAssinatura" class="campo-assinatura" placeholder="Seu nome"><button onclick="confirmarTexto()" class="btn btn-success mt-2">Confirmar</button></div>
                <div id="camArea" class="area-cam oculto mt-3"><video id="video" autoplay playsinline></video><button onclick="tirar()" class="btn btn-success mt-2">Confirmar</button></div>
            </div>
        </div>`;

    if(p.contrato_assinado&&!p.entrada_paga) html+=`
        <div class="card text-center">
            <div class="text-green-600 text-xl font-bold mb-3"><i class="fas fa-check-circle"></i> CONTRATO ASSINADO!</div>
            <p class="mb-3">Entrada: <strong>R$ ${e.toLocaleString('pt-BR',2)}</strong></p>
            <button onclick="gerarPixEntrada(${e})" class="btn btn-pix mb-3"><i class="fas fa-qrcode"></i> Gerar Pix</button>
            <div id="pixGerado" class="oculto"><div class="qrcode-pix" id="qrcode"></div><div class="chave-pix">Código Pix</div><button id="copiarPix" class="btn btn-pix">📋 Copiar</button></div>
        </div>`;

    if(p.entrada_paga) html+=`
        <div class="card text-center">
            <div class="text-green-600 text-xl font-bold mb-3"><i class="fas fa-check-double"></i> PAGAMENTO CONFIRMADO!</div>
            <div class="barra-parcelas"><div class="texto-barra"><span>Progresso Pagamento</span><span>${pagas} de ${qtd} parcelas (${perc}%)</span></div><div class="fundo-barra"><div class="preenchimento-parcelas" style="width:${perc}%"></div></div></div>
            <h3 class="font-bold text-lg mb-2 mt-4">📋 Parcelas</h3>
            ${Array.from({length:qtd},(_,i)=>{const n=i+1,dt=datas[i]?new Date(datas[i]).toLocaleDateString('pt-BR'):'A definir',ok=n<=pagas,val=((total-e)*(Math.pow(1+j/100,qtd)*(j/100))/(Math.pow(1+j/100,qtd)-1));return`<div class="item-parcela"><div><strong>${n}ª</strong> • R$ ${val.toLocaleString('pt-BR',2)} • Venc: ${dt}</div><span class="font-bold ${ok?'text-green-600':'text-orange-500'}">${ok?'PAGA':'PENDENTE'}</span>${!ok?`<button onclick="pagarParcela(${n},${val})" class="btn btn-pix" style="padding:8px;font-size:14px;margin:0;">Gerar Pix</button>`:''}</div>`}).join('')}
        </div>`;

    html+=`<div class="mt-4"><a href="https://wa.me/5511973294235?text=Suporte CPF:${p.cpf}" target="_blank" class="btn" style="background:#25D366;color:white;"><i class="fab fa-whatsapp"></i> Suporte</a><button onclick="buscarProposta()" class="btn btn-alerta">🔄 Atualizar</button></div></div>`;
    document.getElementById('conteudoProposta').innerHTML=html;
}

async function gerarPixEntrada(v){const b=event.target;b.innerHTML=`<i class="fas fa-spinner fa-spin"></i> Gerando...`;const c=await gerarPixViaAPI(v,'Entrada');document.getElementById('pixGerado').classList.remove('oculto');new QRCode(document.getElementById('qrcode'),{text:c,width:220,height:220});document.getElementById('copiarPix').onclick=()=>{navigator.clipboard.writeText(c);alert('Copiado! ✅')};b.classList.add('oculto');}
async function pagarParcela(n,v){const c=await gerarPixViaAPI(v,`${n}ª Parcela`);alert(`Pix gerado! Copie o código e pague no app do banco.`);}
function abrirContrato(){if(!document.getElementById('qtdParcelas').value){alert('Escolha as parcelas!');return;}qtdEscolhida=Number(document.getElementById('qtdParcelas').value);document.getElementById('blocoContrato').classList.remove('oculto');}
function mostrarOpcoes(){if(!document.getElementById('aceitoContrato').checked){alert('Aceite os termos!');return;}document.getElementById('opcoesAssinatura').classList.remove('oculto');}
function mostrarTexto(){document.getElementById('assinaturaTexto').classList.remove('oculto');document.getElementById('camArea').classList.add('oculto');}
async function abrirCam(){document.getElementById('camArea').classList.remove('oculto');document.getElementById('assinaturaTexto').classList.add('oculto');try{streamCam=await navigator.mediaDevices.getUserMedia({video:true});document.getElementById('video').srcObject=streamCam;}catch{alert('Câmera indisponível, use texto.');}}
async function confirmarTexto(){const a=document.getElementById('txtAssinatura').value.trim();if(!a){alert('Digite a assinatura!');return;}await supabase.from('propostas').update({contrato_assinado:true,assinatura_texto:a}).eq('id',dadosProposta.id);await buscarProposta();}
async function tirar(){if(!streamCam)return;const c=document.createElement('canvas');c.width=400;c.height=300;c.getContext('2d').drawImage(document.getElementById('video'),0,0);const f=c.toDataURL('image/png');streamCam.getTracks().forEach(t=>t.stop());await supabase.from('propostas').update({contrato_assinado:true,foto_assinatura:f}).eq('id',dadosProposta.id);await buscarProposta();}
function ativarTempoReal(cpf){if(inscricao)supabase.removeChannel(inscricao);inscricao=supabase.channel(`prop-${cpf}`).on('postgres_changes',{event:'*',schema:'public',table:'propostas',filter:`cpf=eq.${cpf}`},()=>buscarProposta()).subscribe();}
</script>
</body>
</html>
