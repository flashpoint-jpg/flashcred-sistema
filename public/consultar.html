<script>

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let propostaAtual = null;
let canalAtual = null;
let webcamStream = null;
let assinaturaFoto = null;
let gerandoPix = false;


/* =========================
   UTILITÁRIOS
========================= */

function somenteNumeros(valor){
    return String(valor || '').replace(/\D/g,'');
}

function formatarCPF(valor){

    let cpf = somenteNumeros(valor).substring(0,11);

    if(cpf.length > 9){
        return cpf.replace(
            /(\d{3})(\d{3})(\d{3})(\d{2})/,
            '$1.$2.$3-$4'
        );
    }

    if(cpf.length > 6){
        return cpf.replace(
            /(\d{3})(\d{3})(\d+)/,
            '$1.$2.$3'
        );
    }

    if(cpf.length > 3){
        return cpf.replace(
            /(\d{3})(\d+)/,
            '$1.$2'
        );
    }

    return cpf;
}

function formatarValor(valor){

    let n = Number(valor);

    if(!Number.isFinite(n)){
        n = 0;
    }

    return n.toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}

function dinheiro(valor){

    return `R$ ${formatarValor(valor)}`;

}

function mostrarErroConsulta(msg){

    const el =
        document.getElementById('erroConsulta');

    el.textContent = msg;
    el.classList.remove('hidden');

}

function esconderErroConsulta(){

    document
        .getElementById('erroConsulta')
        .classList.add('hidden');

}


/* =========================
   CÁLCULO
========================= */

function calcularParcela(valorFinanciado, juros, quantidade){

    valorFinanciado =
        Number(valorFinanciado) || 0;

    juros =
        Number(juros) || 0;

    quantidade =
        parseInt(quantidade) || 0;

    if(quantidade <= 0){
        return 0;
    }

    if(juros <= 0){
        return valorFinanciado / quantidade;
    }

    const taxa = juros / 100;

    return valorFinanciado *
        (
            taxa *
            Math.pow(1 + taxa, quantidade)
        ) /
        (
            Math.pow(1 + taxa, quantidade) - 1
        );
}


/*
    Pega quantidade máxima de parcelas.
    Primeiro tenta campos normais.
    Depois tenta JSONB.
*/

function obterQuantidadeMaxima(p){

    const candidatos = [
        p.quantidade_parcelas,
        p.qtd_parcelas,
        p.numero_parcelas,
        p.max_parcelas
    ];

    for(const valor of candidatos){

        const n = parseInt(valor);

        if(Number.isFinite(n) && n > 0 && n <= 100){
            return n;
        }
    }

    const fontes = [
        p.parcelas,
        p.dados_parcelas
    ];

    for(const fonte of fontes){

        if(!fonte) continue;

        try{

            const obj =
                typeof fonte === 'string'
                    ? JSON.parse(fonte)
                    : fonte;

            if(Array.isArray(obj) && obj.length){

                return obj.length;
            }

            if(obj && typeof obj === 'object'){

                const possiveis = [
                    obj.quantidade,
                    obj.quantidade_parcelas,
                    obj.qtd_parcelas,
                    obj.max_parcelas,
                    obj.numero_parcelas
                ];

                for(const valor of possiveis){

                    const n = parseInt(valor);

                    if(Number.isFinite(n) && n > 0 && n <= 100){
                        return n;
                    }
                }
            }

        }catch(e){}
    }

    /*
      Se não encontrou no JSON,
      usa 1 como segurança.
    */

    return 1;
}


/* =========================
   DATAS
========================= */

function adicionarMes(data, meses){

    const d = new Date(data);

    const dia =
        d.getDate();

    d.setDate(1);

    d.setMonth(
        d.getMonth() + meses
    );

    const ultimoDia =
        new Date(
            d.getFullYear(),
            d.getMonth()+1,
            0
        ).getDate();

    d.setDate(
        Math.min(dia, ultimoDia)
    );

    return d;
}

function formatarData(data){

    if(!data) return '-';

    const d =
        new Date(data);

    if(Number.isNaN(d.getTime())){
        return '-';
    }

    return d.toLocaleDateString('pt-BR');

}

function calcularDiasUteis(inicio, total){

    total =
        parseInt(total) || 0;

    if(total <= 0){
        return {
            restante:0,
            porcentagem:0
        };
    }

    const inicioData =
        new Date(inicio);

    if(Number.isNaN(inicioData.getTime())){
        return {
            restante:total,
            porcentagem:0
        };
    }

    const hoje =
        new Date();

    inicioData.setHours(0,0,0,0);
    hoje.setHours(0,0,0,0);

    let diasPassados = 0;

    const atual =
        new Date(inicioData);

    while(atual < hoje){

        const dia =
            atual.getDay();

        if(dia !== 0 && dia !== 6){
            diasPassados++;
        }

        atual.setDate(
            atual.getDate()+1
        );
    }

    const restante =
        Math.max(
            0,
            total - diasPassados
        );

    const porcentagem =
        Math.min(
            100,
            (diasPassados / total) * 100
        );

    return {
        restante,
        porcentagem
    };
}


/* =========================
   CONSULTA
========================= */

async function executarConsulta(){

    esconderErroConsulta();

    const input =
        document.getElementById('cpfConsulta');

    const btn =
        document.getElementById('btnConsultar');

    const cpf =
        somenteNumeros(input.value);

    if(cpf.length !== 11){

        mostrarErroConsulta(
            'Digite os 11 números do CPF.'
        );

        return;
    }

    btn.disabled = true;

    btn.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';

    try{

        const {data,error} =
            await supabaseClient
                .from('propostas')
                .select('*')
                .eq('cpf',cpf)
                .limit(1);

        if(error){

            console.error(error);

            throw new Error(
                'Não foi possível consultar a proposta.'
            );
        }

        if(!data || !data.length){

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );
        }

        propostaAtual =
            data[0];

        sessionStorage.setItem(
            'ultimo_cpf',
            cpf
        );

        mostrarProposta(
            propostaAtual
        );

        iniciarTempoReal();

    }catch(error){

        mostrarErroConsulta(
            error.message ||
            'Erro ao consultar proposta.'
        );

    }finally{

        btn.disabled = false;

        btn.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';
    }
}


/* =========================
   TEMPO REAL
========================= */

function iniciarTempoReal(){

    if(canalAtual){

        supabaseClient.removeChannel(
            canalAtual
        );
    }

    if(!propostaAtual?.id) return;

    canalAtual =
        supabaseClient
            .channel(
                'proposta-' +
                propostaAtual.id
            )
            .on(
                'postgres_changes',
                {
                    event:'UPDATE',
                    schema:'public',
                    table:'propostas',
                    filter:
                        `id=eq.${propostaAtual.id}`
                },
                payload => {

                    propostaAtual =
                        payload.new;

                    mostrarProposta(
                        propostaAtual
                    );
                }
            )
            .subscribe();
}


/* =========================
   ETAPAS
========================= */

function determinarEtapa(p){

    const status =
        String(p.status || '').toLowerCase();

    const assinada =
        p.assinatura_assinada === true ||
        !!p.selfie_cliente ||
        !!p.contrato_assinado;

    const entradaPaga =
        p.valor_entrada_pago === true;

    if(entradaPaga) return 5;

    if(assinada) return 4;

    if(
        status === 'aprovada' ||
        status === 'aprovado'
    ){
        return 2;
    }

    return 1;
}

function desenharEtapas(etapa){

    const nomes = [
        'Análise',
        'Parcelas',
        'Contrato',
        'Entrada',
        'Entrega'
    ];

    let html = '';

    nomes.forEach((nome,i)=>{

        const numero =
            i+1;

        let classe = '';

        if(numero < etapa){
            classe = 'ok';
        }

        if(numero === etapa){
            classe = 'ativa';
        }

        html += `
            <div class="etapa ${classe}">
                <div class="circle">
                    ${numero < etapa ? '✓' : numero}
                </div>
                <div style="margin-top:5px">
                    ${nome}
                </div>
            </div>
        `;
    });

    document
        .getElementById('barraEtapas')
        .innerHTML = html;
}


/* =========================
   PROPOSTA
========================= */

function mostrarProposta(p){

    document
        .getElementById('telaConsulta')
        .classList.add('hidden');

    document
        .getElementById('telaProposta')
        .classList.remove('hidden');

    const etapa =
        determinarEtapa(p);

    desenharEtapas(etapa);

    const nome =
        p.nome || 'Cliente';

    const valorProduto =
        Number(
            p.valor_desejado ||
            p.valor_total_final ||
            0
        );

    const entrada =
        Number(
            p.valor_entrada ||
            0
        );

    const juros =
        Number(
            p.juros_mensal ||
            0
        );

    const totalBanco =
        Number(
            p.valor_total_final ||
            0
        );

    const total =
        totalBanco > 0
            ? totalBanco
            : valorProduto;

    const maxParcelas =
        obterQuantidadeMaxima(p);

    const entradaPaga =
        p.valor_entrada_pago === true;

    const assinada =
        p.assinatura_assinada === true ||
        !!p.selfie_cliente ||
        !!p.contrato_assinado;

    const status =
        String(p.status || '');

    let html = '';

    html += `
        <div class="card">

            <div class="title">
                Olá, ${escapeHTML(nome)}!
            </div>

            <div class="status status-azul">
                <strong>Status da proposta:</strong><br>
                ${escapeHTML(status || 'Em análise')}
            </div>
    `;


    /* ======================
       AGUARDANDO ANÁLISE
    ====================== */

    if(
        status.toLowerCase() !== 'aprovada' &&
        status.toLowerCase() !== 'aprovado'
    ){

        html += `
            <div class="status status-amarelo">

                <i class="fas fa-clock"
                   style="font-size:28px;margin-bottom:8px"></i>

                <div style="font-weight:800;font-size:17px">
                    Proposta em análise
                </div>

                <div style="font-size:13px;margin-top:5px">
                    Aguarde a análise da sua proposta.
                </div>

            </div>
        `;

        html += '</div>';

        document
            .getElementById('conteudoProposta')
            .innerHTML = html;

        return;
    }


    /* ======================
       ESCOLHA DAS PARCELAS
    ====================== */

    if(
        !assinada &&
        !p.qtd_parcelas_escolhida &&
        !entradaPaga
    ){

        const financiado =
            Math.max(
                0,
                total - entrada
            );

        html += `
            <div class="resumo">

                <div class="linha">
                    <span>Valor do produto</span>
                    <strong class="valor">
                        ${dinheiro(valorProduto)}
                    </strong>
                </div>

                <div class="linha">
                    <span>Entrada</span>
                    <strong class="valor">
                        ${dinheiro(entrada)}
                    </strong>
                </div>

                <div class="linha">
                    <span>Juros mensais</span>
                    <strong class="valor">
                        ${formatarValor(juros)}%
                    </strong>
                </div>

                <div class="linha">
                    <span>Valor financiado</span>
                    <strong class="valor">
                        ${dinheiro(financiado)}
                    </strong>
                </div>

                <div class="linha">
                    <span>Máximo de parcelas</span>
                    <strong class="valor">
                        ${maxParcelas}x
                    </strong>
                </div>

            </div>

            <label style="font-weight:700;font-size:14px">
                Escolha a quantidade de parcelas
            </label>

            <select
                id="qtdEscolhida"
                class="input"
                style="margin-top:8px"
            >
        `;

        for(
            let n=1;
            n<=maxParcelas;
            n++
        ){

            const parcela =
                calcularParcela(
                    financiado,
                    juros,
                    n
                );

            html += `
                <option value="${n}">
                    ${n}x de ${dinheiro(parcela)}
                </option>
            `;

/* =========================
   QUANTIDADE ESCOLHIDA
========================= */

function obterQuantidadeEscolhida(p){

    const fontes = [
        p.dados_parcelas,
        p.parcelas
    ];

    for(const fonte of fontes){

        if(!fonte) continue;

        try{

            const obj =
                typeof fonte === 'string'
                    ? JSON.parse(fonte)
                    : fonte;

            if(
                obj &&
                !Array.isArray(obj)
            ){

                const n =
                    parseInt(
                        obj.quantidade_escolhida ||
                        obj.qtd_escolhida ||
                        obj.parcelas_escolhidas ||
                        obj.quantidade_parcelas
                    );

                if(n > 0){
                    return n;
                }
            }

        }catch(e){}
    }

    return 1;
}


/* =========================
   SALVAR PARCELAMENTO
========================= */

async function confirmarParcelas(){

    const select =
        document.getElementById(
            'qtdEscolhida'
        );

    const btn =
        document.getElementById(
            'btnContinuarParcelas'
        );

    if(!select) return;

    const quantidade =
        parseInt(select.value);

    if(
        !Number.isFinite(quantidade) ||
        quantidade <= 0
    ){
        alert(
            'Selecione uma quantidade válida de parcelas.'
        );

        return;
    }

    btn.disabled = true;

    btn.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Salvando...';

    try{

        /*
          Como seu banco possui dados_parcelas
          como JSONB, guardamos a escolha nele.
        */

        const atual =
            propostaAtual.dados_parcelas || {};

        let dados;

        if(typeof atual === 'string'){

            try{
                dados = JSON.parse(atual);
            }catch(e){
                dados = {};
            }

        }else{

            dados = {
                ...atual
            };
        }

        dados.quantidade_escolhida =
            quantidade;

        dados.qtd_escolhida =
            quantidade;

        const {data,error} =
            await supabaseClient
                .from('propostas')
                .update({
                    dados_parcelas:dados
                })
                .eq(
                    'id',
                    propostaAtual.id
                )
                .select()
                .single();

        if(error){

            console.error(error);

            throw new Error(
                'Não foi possível salvar a quantidade de parcelas.'
            );
        }

        propostaAtual =
            data;

        /*
          Mantém também em memória para
          a tela atual.
        */

        propostaAtual.qtd_parcelas_escolhida =
            quantidade;

        mostrarProposta(
            propostaAtual
        );

    }catch(error){

        alert(
            error.message ||
            'Erro ao salvar parcelas.'
        );

        btn.disabled = false;

        btn.innerHTML =
            'Continuar <i class="fas fa-arrow-right"></i>';
    }
}

async function assinarContrato(){

    const erro =
        document.getElementById(
            'erroAssinatura'
        );

    erro.classList.add('hidden');

    const aceite =
        document.getElementById(
            'aceitoContrato'
        );

    if(
        !aceite ||
        !aceite.checked
    ){

        erro.textContent =
            'Você precisa aceitar o contrato antes de assinar.';

        erro.classList.remove('hidden');

        return;
    }

    let assinatura = '';

    if(
        !document
            .getElementById('areaSelfie')
            .classList.contains('hidden')
    ){

        if(!assinaturaFoto){

            erro.textContent =
                'Primeiro capture sua selfie para assinar.';

            erro.classList.remove('hidden');

            return;
        }

        assinatura =
            assinaturaFoto;

    }else{

        const nome =
            document
                .getElementById('assTxt')
                .value
                .trim();

        if(!nome){

            erro.textContent =
                'Digite seu nome completo para assinar.';

            erro.classList.remove('hidden');

            return;
        }

        assinatura =
            nome;
    }

    const btn =
        document.getElementById(
            'btnAssinar'
        );

    btn.disabled = true;

    btn.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Registrando assinatura...';

    try{

        /*
          CAMPOS CORRETOS DA SUA TABELA:

          assinatura_assinada = boolean
          selfie_cliente      = text
          contrato_assinado   = text
        */

        const contratoTexto =
            `Contrato assinado eletronicamente pelo cliente ${propostaAtual.nome || ''} em ${new Date().toLocaleString('pt-BR')}.`;

        const update = {
            assinatura_assinada:true,
            selfie_cliente:assinatura,
            contrato_assinado:contratoTexto
        };

        const {data,error} =
            await supabaseClient
                .from('propostas')
                .update(update)
                .eq(
                    'id',
                    propostaAtual.id
                )
                .select()
                .single();

        if(error){

            console.error(
                'Erro Supabase:',
                error
            );

            throw new Error(
                error.message ||
                'O banco recusou o registro da assinatura.'
            );
        }

        propostaAtual =
            data;

        pararCamera();

        assinaturaFoto =
            null;

        mostrarProposta(
            propostaAtual
        );

    }catch(error){

        console.error(error);

        erro.textContent =
            'Não foi possível registrar a assinatura: ' +
            error.message;

        erro.classList.remove('hidden');

        btn.disabled = false;

        btn.innerHTML =
            '<i class="fas fa-file-signature"></i> Assinar contrato';
    }
}


/* =========================
   CÂMERA
========================= */

async function iniciarCamera(){

    if(
        document
            .getElementById('areaSelfie')
            ?.classList
            .contains('hidden')
    ){
        return;
    }

    try{

        if(!navigator.mediaDevices?.getUserMedia){

            throw new Error(
                'Câmera não suportada.'
            );
        }

        pararCamera();

        webcamStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:'user'
                },
                audio:false
            });

        const video =
            document.getElementById('vid');

        if(video){

            video.srcObject =
                webcamStream;

            await video.play();
        }

    }catch(error){

        console.error(error);

        /*
          Se câmera não funcionar,
          muda automaticamente para assinatura
          por nome.
        */

        alternarModo('texto');

        const erro =
            document.getElementById(
                'erroAssinatura'
            );

        if(erro){

            erro.textContent =
                'Não foi possível acessar a câmera. Você pode assinar digitando seu nome.';

            erro.classList.remove(
                'hidden'
            );
        }
    }
}

function pararCamera(){

    if(webcamStream){

        webcamStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        webcamStream =
            null;
    }
}

function tirarFoto(){

    const video =
        document.getElementById('vid');

    if(
        !video ||
        !video.videoWidth
    ){

        alert(
            'A câmera ainda não está pronta.'
        );

        return;
    }

    const canvas =
        document.createElement('canvas');

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const ctx =
        canvas.getContext('2d');

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    assinaturaFoto =
        canvas.toDataURL(
            'image/jpeg',
            0.75
        );

    document
        .getElementById('img')
        .src =
        assinaturaFoto;

    document
        .getElementById('preview')
        .classList
        .remove('hidden');

    pararCamera();

    document
        .getElementById('btnRefazer')
        .classList
        .remove('hidden');
}

function refazerFoto(){

    assinaturaFoto =
        null;

    document
        .getElementById('preview')
        .classList
        .add('hidden');

    iniciarCamera();
}

/* =========================
   PIX
========================= */

async function buscarPix(
    valor,
    descricao
){

    const resposta =
        await fetch(
            '/api/gerar-pix',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json'
                },

                body:JSON.stringify({
                    valor:Number(valor)
                        .toFixed(2),

                    descricao
                })
            }
        );

    if(!resposta.ok){

        throw new Error(
            'Não foi possível gerar o PIX.'
        );
    }

    const json =
        await resposta.json();

    const codigo =
        json.qr_code ||
        json.copia_cola ||
        json.pixCopiaECola ||
        json.codigo;

    if(!codigo){

        throw new Error(
            'A API não retornou o código PIX.'
        );
    }

    return codigo;
}

   COPIAR PIX
========================= */

async function copiarPix(codigo){

    try{

        await navigator.clipboard.writeText(
            codigo
        );

        alert(
            'Código PIX copiado!'
        );

    }catch(error){

        const textarea =
            document.createElement(
                'textarea'
            );

        textarea.value =
            codigo;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            'copy'
        );

        textarea.remove();

        alert(
            'Código PIX copiado!'
        );
    }
}


/* =========================
   DATAS PARCELAS
========================= */

function obterDatasParcelas(
    p,
    quantidade
){

    let fonte =
        p.datas_parcelas;

    if(
        typeof fonte === 'string'
    ){

        try{
            fonte =
                JSON.parse(fonte);
        }catch(e){
            fonte = [];
        }
    }

    if(
        Array.isArray(fonte) &&
        fonte.length >= quantidade
    ){

        return fonte
            .slice(0,quantidade);
    }

    const inicio =
        p.data_aprovacao_entrada ||
        p.updated_at ||
        new Date();

    const resultado = [];

    for(
        let i=1;
        i<=quantidade;
        i++
    ){

        resultado.push(
            adicionarMes(
                inicio,
                i
            ).toISOString()
        );
    }

    return resultado;
}


/* =========================
   SEGURANÇA HTML
========================= */

function escapeHTML(valor){

    return String(
        valor ?? ''
    )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


/* =========================
   VOLTAR
========================= */

function voltarInicio(){

    pararCamera();

    if(canalAtual){

        supabaseClient.removeChannel(
            canalAtual
        );

        canalAtual = null;
    }

    propostaAtual =
        null;

    assinaturaFoto =
        null;

    sessionStorage.removeItem(
        'ultimo_cpf'
    );

    document
        .getElementById(
            'cpfConsulta'
        )
        .value = '';

    document
        .getElementById(
            'telaProposta'
        )
        .classList
        .add('hidden');

    document
        .getElementById(
            'telaConsulta'
        )
        .classList
        .remove('hidden');

    esconderErroConsulta();
}


/* =========================
   INICIALIZAÇÃO
========================= */

document.addEventListener(
    'DOMContentLoaded',
    ()=>{

        const cpf =
            document.getElementById(
                'cpfConsulta'
            );

        cpf.addEventListener(
            'input',
            ()=>{
                cpf.value =
                    formatarCPF(
                        cpf.value
                    );
            }
        );

        cpf.addEventListener(
            'keydown',
            event => {

                if(
                    event.key === 'Enter'
                ){

                    executarConsulta();
                }
            }
        );

        const salvo =
            sessionStorage.getItem(
                'ultimo_cpf'
            );

        if(salvo){

            cpf.value =
                formatarCPF(
                    salvo
                );

            executarConsulta();
        }
    }
);

window.addEventListener(
    'beforeunload',
    pararCamera
);

</script>
