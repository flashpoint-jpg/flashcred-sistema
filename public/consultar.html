<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        linear-gradient(180deg, #f1f5f9 0%, #f8fafc 100%);

}

button,
input,
select {
    font-family: inherit;
}

.container-app {
    width: 100%;
    max-width: 680px;
    margin: auto;
    padding: 18px 14px 40px;
}

.card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(15, 23, 42, .07);
    overflow: hidden;
}

.header {
    background:
        linear-gradient(135deg, #071a49, #0A2463 60%, #123d91);
    color: #fff;
    padding: 24px 20px;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: rgba(255,255,255,.14);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
    font-size: 22px;
}

.btn {
    border: 0;
    border-radius: 12px;
    min-height: 48px;
    padding: 12px 18px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    transition: .2s;
}

.btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.btn-primary {
    background: #0A2463;
    color: white;
    width: 100%;
}

.btn-primary:hover {
    background: #071a49;
}

.btn-success {
    background: #10B981;
    color: white;
    width: 100%;
}

.btn-pix {
    background: #32BCAD;
    color: white;
    width: 100%;
}

.btn-secondary {
    background: #e2e8f0;
    color: #334155;
    width: 100%;
}

.input,
.select {
    width: 100%;
    border: 1px solid #cbd5e1;
    background: white;
    padding: 13px 14px;
    border-radius: 11px;
    font-size: 16px;
    outline: none;
}

.input:focus,
.select:focus {
    border-color: #0A2463;
    box-shadow: 0 0 0 3px rgba(10,36,99,.10);
}

.step-wrapper {
    padding: 20px 14px 8px;
}

.steps {
    display: flex;
    position: relative;
    justify-content: space-between;
}

.steps:before {
    content: "";
    position: absolute;
    top: 16px;
    left: 7%;
    right: 7%;
    height: 3px;
    background: #e2e8f0;
}

.step-line {
    position: absolute;
    top: 16px;
    left: 7%;
    height: 3px;
    background: #10B981;
    width: 0%;
    transition: .4s;
}

.step {
    position: relative;
    z-index: 2;
    width: 14%;
    text-align: center;
    color: #94a3b8;
    font-size: 9px;
    font-weight: 600;
}

.step-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #e2e8f0;
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto auto 5px;
    font-weight: 800;
    border: 3px solid #f8fafc;
}

.step.active {
    color: #0A2463;
}

.step.active .step-circle {
    background: #0A2463;
    color: #fff;
}

.step.done {
    color: #10B981;
}

.step.done .step-circle {
    background: #10B981;
    color: #fff;
}

.section {
    padding: 20px;
}

.section-title {
    font-size: 18px;
    font-weight: 800;
    color: #0A2463;
    margin-bottom: 15px;
}

.status-box {
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    margin-bottom: 18px;
}

.status-analysis {
    background: #fffbeb;
    border: 1px solid #fde68a;
}

.status-success {
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
}

.status-info {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
}

.status-danger {
    background: #fef2f2;
    border: 1px solid #fecaca;
}

.status-icon {
    font-size: 38px;
    margin-bottom: 8px;
}

.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.info-item {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 13px;
}

.info-label {
    color: #64748b;
    font-size: 11px;
    margin-bottom: 4px;
}

.info-value {
    color: #0f172a;
    font-size: 15px;
    font-weight: 800;
}

.highlight {
    background: linear-gradient(135deg,#eff6ff,#f8fafc);
    border: 1px solid #bfdbfe;
    border-radius: 14px;
    padding: 17px;
    margin-bottom: 16px;
}

.parcela-option {
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: .2s;
}

.parcela-option:hover {
    border-color: #93c5fd;
}

.parcela-option.selecionada {
    border-color: #0A2463;
    background: #eff6ff;
}

.parcela-option input {
    accent-color: #0A2463;
}

.contract {
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 18px;
    max-height: 380px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.7;
}

.contract h4 {
    color: #0A2463;
    font-weight: 800;
    margin-top: 15px;
    margin-bottom: 5px;
}

.signature-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 16px;
    margin-top: 15px;
}

.pix-box {
    background: #ecfdf5;
    border: 2px solid #32BCAD;
    border-radius: 16px;
    padding: 18px;
    text-align: center;
}

.qr {
    background: white;
    padding: 12px;
    width: fit-content;
    margin: 15px auto;
    border-radius: 12px;
}

.pix-code {
    background: white;
    border: 1px solid #a7f3d0;
    border-radius: 10px;
    padding: 12px;
    font-size: 11px;
    word-break: break-all;
    text-align: left;
}

.parcela {
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 10px;
}

.parcela-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.badge {
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 10px;
    font-weight: 800;
}

.badge-pago {
    background: #dcfce7;
    color: #166534;
}

.badge-pendente {
    background: #fef3c7;
    color: #92400e;
}

.badge-atrasada {
    background: #fee2e2;
    color: #991b1b;
}

.delivery {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 14px;
    padding: 16px;
}

.progress {
    height: 9px;
    background: #dbeafe;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 10px;
}

.progress-bar {
    height: 100%;
    background: #0A2463;
    transition: .5s;
}

.footer {
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
    padding: 18px 0;
}

.hidden {
    display: none !important;
}

.divider {
    height: 1px;
    background: #e2e8f0;
    margin: 18px 0;
}

@media(max-width:480px) {
    .info-grid {
        grid-template-columns: 1fr;
    }

    .step {
        font-size: 8px;
    }
}

</style>
</head>

<body>

<div class="container-app">

    <!-- CONSULTA -->
    <div id="telaConsulta" class="card">

        <div class="header text-center">

            <div class="logo mb-3">
                <i class="fas fa-shield-halved"></i>
            </div>

            <h1 class="text-2xl font-bold">
                FlashCred
            </h1>

            <p class="text-sm opacity-80 mt-1">
                Acompanhe sua proposta
            </p>

        </div>

        <div class="section">

            <label class="block text-sm font-semibold mb-2">
                CPF do cliente
            </label>

            <input
                id="cpfConsulta"
                class="input"
                maxlength="11"
                inputmode="numeric"
                placeholder="Digite os 11 números do CPF">

            <button
                id="btnConsultar"
                onclick="executarConsulta()"
                class="btn btn-primary mt-3">

                <i class="fas fa-search"></i>

                Consultar proposta

            </button>

            <div class="text-center text-xs text-slate-400 mt-4">
                Consulta segura da sua proposta FlashCred.
            </div>

        </div>

    </div>


    <!-- PROPOSTA -->
    <div id="telaProposta" class="hidden">

        <!-- TOPO -->
        <div class="card mb-3">

            <div class="header text-center">

                <div class="logo mb-2">
                    <i class="fas fa-file-signature"></i>
                </div>

                <h1 class="text-xl font-bold">
                    FlashCred
                </h1>

                <p class="text-xs opacity-80">
                    Acompanhamento da proposta
                </p>

            </div>

            <!-- ETAPAS -->
            <div class="step-wrapper">

                <div class="steps">

                    <div id="linhaProgresso" class="step-line"></div>

                    <div class="step" id="step1">
                        <div class="step-circle">1</div>
                        Análise
                    </div>

                    <div class="step" id="step2">
                        <div class="step-circle">2</div>
                        Aprovado
                    </div>

                    <div class="step" id="step3">
                        <div class="step-circle">3</div>
                        Parcelas
                    </div>

                    <div class="step" id="step4">
                        <div class="step-circle">4</div>
                        Contrato
                    </div>

                    <div class="step" id="step5">
                        <div class="step-circle">5</div>
                        Pix
                    </div>

                    <div class="step" id="step6">
                        <div class="step-circle">6</div>
                        Liberado
                    </div>

                </div>

            </div>

        </div>


        <!-- CONTEÚDO -->
        <div id="conteudoProposta" class="card"></div>

        <div class="footer">
            FlashCred • Sistema eletrônico de acompanhamento
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        { realtime: true }
    );

let propostaAtual = null;
let canalRealtime = null;
let pixProcessando = false;


/* ==========================================================
   CONSULTA
========================================================== */

async function executarConsulta() {

    const input =
        document.getElementById('cpfConsulta');

    const cpf =
        input.value.replace(/\D/g,'');

    if(cpf.length !== 11) {

        alert('Digite os 11 números do CPF.');

        return;
    }

    const botao =
        document.getElementById('btnConsultar');

    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';

    try {

        const {data,error} =
            await supabase
                .from('propostas')
                .select('*')
                .eq('cpf',cpf)
                .limit(1);

        if(error)
            throw error;

        if(!data || !data.length)
            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );

        propostaAtual = data[0];

        sessionStorage.setItem(
            'ultimo_cpf',
            cpf
        );

        mostrarProposta(
            propostaAtual
        );

        iniciarRealtime(
            propostaAtual.id
        );

    } catch(e) {

        alert(
            e.message ||
            'Não foi possível consultar a proposta.'
        );

    } finally {

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';
    }
}


/* ==========================================================
   REALTIME
========================================================== */

function iniciarRealtime(id) {

    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );
    }

    canalRealtime =
        supabase
            .channel(
                'flashcred-proposta-' + id
            )
            .on(
                'postgres_changes',
                {
                    event:'UPDATE',
                    schema:'public',
                    table:'propostas',
                    filter:`id=eq.${id}`
                },
                payload => {

                    propostaAtual =
                        payload.new;

                    mostrarProposta(
                        propostaAtual
                    );

                }
            )
            .subscribe();
}


/* ==========================================================
   FORMATADORES
========================================================== */

function moeda(valor) {

    return Number(valor || 0)
        .toLocaleString(
            'pt-BR',
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );
}


function numero(valor) {

    return Number(valor || 0)
        .toLocaleString(
            'pt-BR',
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );
}


function dataBR(data) {

    if(!data)
        return '-';

    const d =
        new Date(data);

    if(isNaN(d))
        return '-';

    return d.toLocaleString(
        'pt-BR'
    );
}


/* ==========================================================
   CÁLCULO
========================================================== */

function calcularParcela(
    saldo,
    juros,
    quantidade
) {

    if(
        !quantidade ||
        quantidade <= 0
    )
        return 0;

    const i =
        Number(juros || 0) / 100;

    if(i === 0)
        return saldo / quantidade;

    return (
        saldo *
        (
            Math.pow(
                1+i,
                quantidade
            ) * i
        )
    ) /
    (
        Math.pow(
            1+i,
            quantidade
        ) - 1
    );
}


/* ==========================================================
   ETAPAS
========================================================== */

function descobrirEtapa(p) {

    if(p.entrada_paga)
        return 6;

    if(p.contrato_assinado)
        return 5;

    if(p.qtd_parcelas_escolhida)
        return 4;

    if(
        String(p.status || '')
            .toLowerCase()
            === 'aprovada'
    )
        return 3;

    return 1;
}


function atualizarEtapas(etapa) {

    for(let i=1;i<=6;i++) {

        const el =
            document.getElementById(
                'step'+i
            );

        if(!el)
            continue;

        el.classList.remove(
            'active',
            'done'
        );

        const circle =
            el.querySelector(
                '.step-circle'
            );

        if(i < etapa) {

            el.classList.add('done');

            circle.innerHTML =
                '<i class="fas fa-check"></i>';

        }

        else if(i === etapa) {

            el.classList.add('active');

            circle.textContent =
                i;

        }

        else {

            circle.textContent =
                i;

        }
    }

    const percentual =
        ((etapa-1)/5)*86;

    document.getElementById(
        'linhaProgresso'
    ).style.width =
        percentual + '%';
}


/* ==========================================================
   MOSTRAR PROPOSTA
========================================================== */

function mostrarProposta(p) {

    document.getElementById(
        'telaConsulta'
    ).classList.add('hidden');

    document.getElementById(
        'telaProposta'
    ).classList.remove('hidden');

    const etapa =
        descobrirEtapa(p);

    atualizarEtapas(
        etapa
    );

    const valor =
        Number(
            p.valor_desejado || 0
        );

    const entrada =
        Number(
            p.valor_entrada || 0
        );

    const juros =
        Number(
            p.juros_mensal || 0
        );

    const limiteParcelas =
        Number(
            p.quantidade_parcelas ||
            p.qtd_parcelas ||
            0
        );

    const escolhida =
        Number(
            p.qtd_parcelas_escolhida ||
            0
        );

    const total =
        valor *
        (1 + juros/100);

    const saldo =
        Math.max(
            total - entrada,
            0
        );

    const quantidade =
        escolhida ||
        limiteParcelas;

    const parcela =
        quantidade
            ? calcularParcela(
                saldo,
                juros,
                quantidade
            )
            : 0;

    let html = `

        <div class="section">

            <div class="mb-5">

                <p class="text-xs text-slate-400 uppercase font-bold">
                    Cliente
                </p>

                <h2 class="text-xl font-bold text-slate-800">
                    Olá, ${escapar(p.nome || 'Cliente')}
                </h2>

            </div>

            ${gerarResumo(
                valor,
                entrada,
                juros,
                total
            )}

            ${gerarConteudoEtapa(
                p,
                etapa,
                valor,
                entrada,
                juros,
                total,
                saldo,
                limiteParcelas,
                escolhida,
                parcela
            )}

        </div>

    `;

    document.getElementById(
        'conteudoProposta'
    ).innerHTML = html;

    if(
        p.contrato_assinado &&
        !p.entrada_paga &&
        !document.getElementById(
            'pixAutomatico'
        )
    ) {

        setTimeout(
            gerarPixAutomatico,
            300
        );
    }
}


/* ==========================================================
   RESUMO
========================================================== */

function gerarResumo(
    valor,
    entrada,
    juros,
    total
) {

    return `

        <div class="highlight">

            <div class="flex justify-between mb-3">

                <span class="text-sm text-slate-500">
                    Valor solicitado
                </span>

                <strong>
                    R$ ${moeda(valor)}
                </strong>

            </div>

            <div class="flex justify-between mb-3">

                <span class="text-sm text-slate-500">
                    Entrada
                </span>

                <strong>
                    R$ ${moeda(entrada)}
                </strong>

            </div>

            <div class="flex justify-between mb-3">

                <span class="text-sm text-slate-500">
                    Juros
                </span>

                <strong>
                    ${numero(juros)}% a.m.
                </strong>

            </div>

            <div class="flex justify-between pt-3 border-t">

                <span class="font-bold">
                    Valor total
                </span>

                <strong class="text-primary text-lg">
                    R$ ${moeda(total)}
                </strong>

            </div>

        </div>

    `;
}


/* ==========================================================
   CONTEÚDO DAS ETAPAS
========================================================== */

function gerarConteudoEtapa(
    p,
    etapa,
    valor,
    entrada,
    juros,
    total,
    saldo,
    limiteParcelas,
    escolhida,
    parcela
) {

    const status =
        String(
            p.status || ''
        ).toLowerCase();


    /* ---------------------------------------------
       EM ANÁLISE
    --------------------------------------------- */

    if(
        status !== 'aprovada' &&
        !p.contrato_assinado &&
        !p.entrada_paga
    ) {

        return `

            <div class="status-box status-analysis">

                <div class="status-icon text-alerta">
                    <i class="fas fa-hourglass-half"></i>
                </div>

                <h3 class="font-bold text-lg">
                    Proposta em análise
                </h3>

                <p class="text-sm text-slate-600 mt-2">
                    Sua proposta está sendo analisada.
                    Aguarde a conclusão da análise.
                </p>

                <div class="mt-4 text-xs text-slate-500">
                    O status será atualizado automaticamente.
                </div>

            </div>

        `;
    }


    /* ---------------------------------------------
       APROVADA — ESCOLHA PARCELAS
    --------------------------------------------- */

    if(
        status === 'aprovada' &&
        !escolhida
    ) {

        let opcoes = '';

        for(
            let i=1;
            i<=limiteParcelas;
            i++
        ) {

            const valorParcela =
                calcularParcela(
                    saldo,
                    juros,
                    i
                );

            opcoes += `

                <label
                    class="parcela-option"
                    onclick="selecionarParcelaVisual(this)"
                >

                    <div class="flex items-center gap-3">

                        <input
                            type="radio"
                            name="parcelas"
                            value="${i}"
                            onchange="window.parcelaSelecionada=${i}"
                        >

                        <div class="flex-1">

                            <div class="font-bold text-primary">
                                ${i}x
                            </div>

                            <div class="text-sm text-slate-500">
                                R$ ${moeda(valorParcela)}
                                por parcela
                            </div>

                        </div>

                        <i class="fas fa-chevron-right text-slate-300"></i>

                    </div>

                </label>

            `;
        }

        return `

            <div class="status-box status-success">

                <div class="status-icon text-sucesso">
                    <i class="fas fa-circle-check"></i>
                </div>

                <h3 class="font-bold text-lg">
                    Proposta aprovada
                </h3>

                <p class="text-sm text-slate-600 mt-2">
                    Sua proposta foi aprovada.
                </p>

            </div>

            <div class="section-title">
                Escolha seu parcelamento
            </div>

            <p class="text-sm text-slate-500 mb-4">
                A seleção é obrigatória para continuar.
                Confira os valores antes de prosseguir.
            </p>

            ${opcoes}

            <button
                onclick="confirmarParcelas()"
                class="btn btn-primary mt-3">

                <i class="fas fa-arrow-right"></i>

                Continuar para o contrato

            </button>

        `;
    }


    /* ---------------------------------------------
       CONTRATO
    --------------------------------------------- */

    if(
        escolhida &&
        !p.contrato_assinado
    ) {

        return gerarContrato(
            p,
            valor,
            entrada,
            juros,
            total,
            escolhida,
            parcela
        );
    }


    /* ---------------------------------------------
       PIX
    --------------------------------------------- */

    if(
        p.contrato_assinado &&
        !p.entrada_paga
    ) {

        return `

            <div class="status-box status-success">

                <div class="status-icon text-sucesso">
                    <i class="fas fa-file-circle-check"></i>
                </div>

                <h3 class="font-bold text-lg">
                    Contrato assinado
                </h3>

                <p class="text-sm text-slate-600 mt-2">
                    O contrato foi registrado eletronicamente.
                </p>

            </div>

            <div id="pixAutomatico">

                <div class="pix-box">

                    <i class="fas fa-qrcode text-4xl text-pix"></i>

                    <h3 class="font-bold text-lg mt-3">
                        Gerando seu Pix...
                    </h3>

                    <p class="text-sm text-slate-500 mt-1">
                        Aguarde enquanto o pagamento é preparado.
                    </p>

                    <div class="mt-4">
                        <i class="fas fa-spinner fa-spin text-primary"></i>
                    </div>

                </div>

            </div>

        `;
    }


    /* ---------------------------------------------
       PAGAMENTO CONFIRMADO
    --------------------------------------------- */

    if(
        p.entrada_paga
    ) {

        return gerarAreaLiberada(
            p,
            total,
            entrada,
            juros,
            escolhida,
            parcela
        );
    }


    return '';

}

/* ==========================================================
   CONFIRMAR PARCELAS
========================================================== */

window.parcelaSelecionada = null;

function selecionarParcelaVisual(elemento) {

    document
        .querySelectorAll('.parcela-option')
        .forEach(el =>
            el.classList.remove(
                'selecionada'
            )
        );

    elemento.classList.add(
        'selecionada'
    );
}


async function confirmarParcelas() {

    const q =
        Number(
            window.parcelaSelecionada
        );

    if(!q) {

        alert(
            'Selecione obrigatoriamente a quantidade de parcelas.'
        );

        return;
    }

    const botoes =
        document.querySelectorAll(
            '.btn'
        );

    botoes.forEach(
        b => b.disabled = true
    );

    try {

        const {data,error} =
            await supabase
                .from('propostas')
                .update({
                    qtd_parcelas_escolhida:q
                })
                .eq(
                    'id',
                    propostaAtual.id
                )
                .select()
                .maybeSingle();

        if(error)
            throw error;

        if(!data)
            throw new Error(
                'Não foi possível registrar a escolha das parcelas.'
            );

        propostaAtual =
            data;

        mostrarProposta(
            propostaAtual
        );

    } catch(e) {

        alert(
            e.message ||
            'Erro ao registrar parcelamento.'
        );

        botoes.forEach(
            b => b.disabled = false
        );
    }
}


/* ==========================================================
   ASSINAR CONTRATO
========================================================== */

async function assinarContrato() {

    const aceite =
        document.getElementById(
            'aceitoContrato'
        );

    const assinatura =
        document.getElementById(
            'assinaturaTexto'
        );

    if(!aceite || !aceite.checked) {

        alert(
            'Você precisa ler e aceitar o contrato.'
        );

        return;
    }

    const nome =
        assinatura.value.trim();

    if(!nome) {

        alert(
            'Digite seu nome completo para assinar.'
        );

        assinatura.focus();

        return;
    }

    if(
        !propostaAtual ||
        !propostaAtual.id
    ) {

        alert(
            'Proposta não identificada.'
        );

        return;
    }

    const botoes =
        document.querySelectorAll(
            '.btn'
        );

    botoes.forEach(
        b => b.disabled = true
    );

    try {

        const agora =
            new Date().toISOString();

        const {data,error} =
            await supabase
                .from('propostas')
                .update({

                    contrato_assinado:true,

                    assinatura:nome,

                    assinado_em:agora

                })
                .eq(
                    'id',
                    propostaAtual.id
                )
                .select()
                .maybeSingle();

        if(error)
            throw error;

        if(!data)
            throw new Error(
                'O contrato não pôde ser registrado.'
            );

        propostaAtual =
            data;

        mostrarProposta(
            propostaAtual
        );

    } catch(e) {

        alert(
            e.message ||
            'Não foi possível assinar o contrato.'
        );

        botoes.forEach(
            b => b.disabled = false
        );
    }
}

/* ==========================================================
   BUSCAR PIX — SUA API ORIGINAL
========================================================== */

async function buscarPix(
    valor,
    descricao
) {

    const resposta =
        await fetch(
            '/api/gerar-pix',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json'
                },

                body:JSON.stringify({

                    valor:
                        parseFloat(
                            valor
                        ).toFixed(2),

                    descricao:
                        descricao

                })
            }
        );

    if(!resposta.ok) {

        throw new Error(
            'Erro ao gerar Pix.'
        );
    }

    const json =
        await resposta.json();

    const codigo =
        json.qr_code ||
        json.copia_cola ||
        json.pixCopiaECola ||
        json.codigo;

    if(!codigo)
        throw new Error(
            'A API não retornou o código Pix.'
        );

    return codigo;
}


/* ==========================================================
   COPIAR PIX
========================================================== */

function copiarPix() {

    if(!window.codigoPixAtual)
        return;

    navigator.clipboard
        .writeText(
            window.codigoPixAtual
        )
        .then(
            () =>
                alert(
                    'Código Pix copiado!'
                )
        )
        .catch(
            () =>
                alert(
                    'Não foi possível copiar automaticamente.'
                )
        );
}


/* ==========================================================
   ÁREA LIBERADA
========================================================== */

function gerarAreaLiberada(
    p,
    total,
    entrada,
    juros,
    quantidade,
    parcela
) {

    let datas =
        Array.isArray(
            p.datas_parcelas
        )
        ? p.datas_parcelas
        : [];

    if(
        !datas.length &&
        quantidade
    ) {

        const hoje =
            new Date();

        for(
            let i=1;
            i<=quantidade;
            i++
        ) {

            const d =
                new Date(hoje);

            d.setMonth(
                d.getMonth()+i
            );

            datas.push(
                d.toISOString()
                 .split('T')[0]
            );
        }
    }

    let lista = '';

    datas.forEach(
        (data,index) => {

            const numero =
                index+1;

            const pagas =
                Number(
                    p.parcelas_pagas || 0
                );

            const paga =
                numero <= pagas;

            const vencimento =
                new Date(
                    data + 'T00:00:00'
                );

            const atrasada =
                !paga &&
                vencimento <
                new Date();

            let badge = '';

            if(paga) {

                badge =
                    `<span class="badge badge-pago">
                        PAGA
                    </span>`;

            } else if(atrasada) {

                badge =
                    `<span class="badge badge-atrasada">
                        VENCIDA
                    </span>`;

            } else {

                badge =
                    `<span class="badge badge-pendente">
                        PENDENTE
                    </span>`;
            }

            lista += `

                <div class="parcela">

                    <div class="parcela-header">

                        <div>

                            <div class="font-bold text-primary">
                                ${numero}ª parcela
                            </div>

                            <div class="text-sm text-slate-500 mt-1">
                                Vencimento:
                                ${vencimento.toLocaleDateString('pt-BR')}
                            </div>

                            <div class="font-bold mt-2">
                                R$ ${moeda(parcela)}
                            </div>

                        </div>

                        <div>
                            ${badge}
                        </div>

                    </div>

                    ${
                        !paga
                        ?
                        `
                        <button
                            onclick="gerarPixParcela(
                                ${parcela},
                                ${numero}
                            )"
                            class="btn btn-pix mt-3">

                            <i class="fas fa-qrcode"></i>

                            Gerar Pix da parcela

                        </button>

                        <div
                            id="pixParcela${numero}"
                            class="mt-3">
                        </div>
                        `
                        :
                        `
                        <div class="mt-3 text-sm text-emerald-600 font-bold">

                            <i class="fas fa-circle-check"></i>

                            Pagamento confirmado

                        </div>
                        `
                    }

                </div>

            `;
        }
    );

    return `

        <div class="status-box status-success">

            <div class="status-icon text-sucesso">
                <i class="fas fa-unlock"></i>
            </div>

            <h3 class="font-bold text-lg">
                Pagamento confirmado
            </h3>

            <p class="text-sm text-slate-600 mt-2">
                A operação foi liberada para acompanhamento
                das parcelas.
            </p>

        </div>


        <div class="delivery mb-5">

            <div class="flex justify-between">

                <span class="text-sm text-slate-500">
                    Status da operação
                </span>

                <strong class="text-sucesso">
                    LIBERADA
                </strong>

            </div>

        </div>


        <div class="section-title">
            Resumo financeiro
        </div>

        <div class="info-grid mb-5">

            <div class="info-item">
                <div class="info-label">
                    Total
                </div>
                <div class="info-value">
                    R$ ${moeda(total)}
                </div>
            </div>

            <div class="info-item">
                <div class="info-label">
                    Entrada paga
                </div>
                <div class="info-value">
                    R$ ${moeda(entrada)}
                </div>
            </div>

            <div class="info-item">
                <div class="info-label">
                    Parcelas
                </div>
                <div class="info-value">
                    ${quantidade}x
                </div>
            </div>

            <div class="info-item">
                <div class="info-label">
                    Valor da parcela
                </div>
                <div class="info-value">
                    R$ ${moeda(parcela)}
                </div>
            </div>

        </div>


        <div class="section-title">
            Suas parcelas
        </div>

        ${lista}

    `;
}


/* ==========================================================
   PIX DAS PARCELAS
========================================================== */

async function gerarPixParcela(
    valor,

) {

    const area =

            `pixParcela${numero}`

    if(!area)

    area.innerHTML =
        `
        <div class="text-center p-3 text-slate-500">

        `;

        const codigo =
            await buscarPix(

            <div class="pix-box">

        new QRCode(

        );

    } catch(e) {

        area.innerHTML = `

            <div class="status-box status-danger">

                <p class="text-sm">
                    ${escapar(
                        e.message ||
                        String(e)
                    )}
                </p>

            </div>

        `;
    }
}


/* ==========================================================
   SEGURANÇA HTML
========================================================== */

function escapar(texto) {

    return String(
        texto ?? ''
    )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


/* ==========================================================
   VOLTAR
========================================================== */

function voltarInicio() {

    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;
    }

    propostaAtual = null;

    sessionStorage.removeItem(
        'ultimo_cpf'
    );

    document.getElementById(
        'telaProposta'
    ).classList.add('hidden');

    document.getElementById(
        'telaConsulta'
    ).classList.remove('hidden');

    document.getElementById(
        'cpfConsulta'
    ).value = '';
}

   ENTER NO CPF

document.addEventListener(

        const cpf =
            document.getElementById(
                'cpfConsulta'
            );

        cpf.addEventListener(
            'keydown',
            e => {

                if(
                    e.key === 'Enter'
                )

            }
        );

    }
);
