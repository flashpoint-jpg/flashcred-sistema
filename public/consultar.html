<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Proposta | FlashCred</title>
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
            --bg-body: #F8FAFC;
            --borda: #E2E8F0;
            --texto: #334155;
            --texto-claro: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); padding: 16px; line-height: 1.5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .container { width: 100%; max-width: 500px; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(10,36,99,0.06); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 20px; }

        .busca-bloco { margin-bottom: 20px; }
        .busca-bloco label { font-size: 13px; font-weight: 600; color: var(--texto-claro); display: block; margin-bottom: 6px; }
        .busca-linha { display: flex; gap: 8px; }
        input { width: 100%; padding: 11px 14px; border: 1px solid var(--borda); border-radius: 8px; font-size: 15px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10,36,99,0.08); }
        .btn-consultar { padding: 11px 18px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .btn-consultar:hover { background: #0c3499; }

        .resultado { display: none; margin-top: 20px; border-top: 1px solid var(--borda); padding-top: 20px; }
        .status-box { padding: 14px; border-radius: 10px; text-align: center; font-weight: 600; margin-bottom: 16px; font-size: 14px; }
        .status-pendente { background: #FEF3C7; color: #92400E; border: 1px solid #FCD34D; }
        .status-aprovada { background: #D1FAE5; color: #065F46; border: 1px solid #6EE7B7; }
        .status-reprovada { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }

        /* Barra de carregamento para análise */
        .barra-carregando { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-top: 10px; position: relative; }
        .barra-progresso-animada { width: 40%; height: 100%; background: var(--alerta); border-radius: 3px; position: absolute; animation: vaiVem 1.5s infinite ease-in-out; }
        @keyframes vaiVem {
            0% { left: -40%; }
            50% { left: 60%; }
            100% { left: -40%; }
        }

        .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .campo label { font-size: 12px; color: var(--texto-claro); font-weight: 600; display: block; margin-bottom: 3px; }
        .campo input { background: #F8FAFC; color: var(--texto); font-weight: 600; }

        /* Estilo para a bolinha rodando */
        .spinner-container { display: flex; align-items: center; justify-content: center; height: 44px; background: #F8FAFC; border: 1px solid var(--borda); border-radius: 8px; }
        .spinner { width: 20px; height: 20px; border: 3px solid #cbd5e1; border-top: 3px solid var(--primary); border-radius: 50%; animation: girar 0.8s linear infinite; }
        @keyframes girar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .erro { color: var(--perigo); text-align: center; margin-top: 10px; font-size: 14px; display: none; }
        .detalhe-nome { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 12px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 Consultar Proposta</h2>
    
    <div class="busca-bloco">
        <label>Digite seu CPF</label>
        <div class="busca-linha">
            <input type="text" id="cpfConsulta" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCpf(this)">
            <button onclick="buscarProposta()" class="btn-consultar">Consultar</button>
        </div>
        <p id="erroMsg" class="erro">Proposta não encontrada para este CPF.</p>
    </div>

    <div id="resultadoProposta" class="resultado">
        <div id="detalheNome" class="detalhe-nome"></div>
        
        <div id="caixaStatus" class="status-box"></div>

        <div class="grade">
            <div class="campo">
                <label>Valor Solicitado</label>
                <input type="text" id="resValor" readonly>
            </div>
            <div class="campo">
                <label>Entrada (20%)</label>
                <div class="spinner-container" id="spinnerEntrada">
                    <div class="spinner"></div>
                </div>
                <input type="text" id="resEntrada" style="display:none;" readonly>
            </div>
        </div>

        <div class="grade">
            <div class="campo">
                <label>Quantidade de Parcelas</label>
                <div class="spinner-container" id="spinnerParcelas">
                    <div class="spinner"></div>
                </div>
                <input type="text" id="resParcelas" style="display:none;" readonly>
            </div>
            <div class="campo">
                <label>Valor da Parcela</label>
                <div class="spinner-container" id="spinnerValParc">
                    <div class="spinner"></div>
                </div>
                <input type="text" id="resValParc" style="display:none;" readonly>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Se houver CPF na URL (vindo do link do WhatsApp), busca automaticamente
window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const cpfUrl = urlParams.get('cpf');
    if (cpfUrl) {
        document.getElementById('cpfConsulta').value = cpfUrl.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        buscarProposta();
    }
};

function mascaraCpf(i) {
    let v = i.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);
    v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    i.value = v;
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

async function buscarProposta() {
    const cpfLimpo = document.getElementById('cpfConsulta').value.replace(/\D/g, '');
    const erroEl = document.getElementById('erroMsg');
    const resEl = document.getElementById('resultadoProposta');

    if (cpfLimpo.length < 11) {
        erroEl.textContent = 'Digite um CPF válido com 11 dígitos.';
        erroEl.style.display = 'block';
        resEl.style.display = 'none';
        return;
    }

    erroEl.style.display = 'none';

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .eq('cpf', cpfLimpo)
        .order('created_at', { ascending: false })
        .limit(1);

    if (error || !data || data.length === 0) {
        erroEl.textContent = 'Nenhuma proposta encontrada para este CPF.';
        erroEl.style.display = 'block';
        resEl.style.display = 'none';
        return;
    }

    const p = data[0];
    resEl.style.display = 'block';
    document.getElementById('detalheNome').textContent = `Cliente: ${p.nome}`;

    // Mostra o valor solicitado que o cliente preencheu
    document.getElementById('resValor').value = real(p.valor_desejado);

    const caixaStatus = document.getElementById('caixaStatus');
    
    // Esconde os spinners e exibe os dados reais apenas se já estiver Aprovada
    if (p.status === 'Aprovada') {
        caixaStatus.className = 'status-box status-aprovada';
        caixaStatus.innerHTML = '✅ Proposta Aprovada!';

        const valorTotal = Number(p.valor_desejado || 0);
        const percEnt = Number(p.percentual_entrada || 20);
        const valorEnt = valorTotal * percEnt / 100;
        const parcelasQtd = Number(p.quantidade_parcelas || 1);
        const juros = Number(p.juros || 0);
        const resto = valorTotal - valorEnt;
        const valParc = parcelasQtd > 0 ? resto * (1 + juros/100) / parcelasQtd : 0;

        document.getElementById('resEntrada').value = real(valorEnt);
        document.getElementById('resParcelas').value = `${parcelasQtd}x`;
        document.getElementById('resValParc').value = real(valParc);

        document.getElementById('spinnerEntrada').style.display = 'none';
        document.getElementById('resEntrada').style.display = 'block';

        document.getElementById('spinnerParcelas').style.display = 'none';
        document.getElementById('resParcelas').style.display = 'block';

        document.getElementById('spinnerValParc').style.display = 'none';
        document.getElementById('resValParc').style.display = 'block';

    } else if (p.status === 'Reprovada') {
        caixaStatus.className = 'status-box status-reprovada';
        caixaStatus.innerHTML = '❌ Proposta Reprovada.';
        mostrarSpinners();
    } else {
        // Aguardando análise com barrinha carregando e bolinhas nos demais campos
        caixaStatus.className = 'status-box status-pendente';
        caixaStatus.innerHTML = `
            ⏳ Aguardando análise do operador...
            <div class="barra-carregando">
                <div class="barra-progresso-animada"></div>
            </div>
        `;
        mostrarSpinners();
    }
}

function mostrarSpinners() {
    document.getElementById('spinnerEntrada').style.display = 'flex';
    document.getElementById('resEntrada').style.display = 'none';

    document.getElementById('spinnerParcelas').style.display = 'flex';
    document.getElementById('resParcelas').style.display = 'none';

    document.getElementById('spinnerValParc').style.display = 'flex';
    document.getElementById('resValParc').style.display = 'none';
}
</script>
</body>
</html>
