<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0A2463', sucesso: '#10B981', alerta: '#F59E0B' }
                }
            }
        };

        // ✅ NENHUMA VARIAVEL GLOBAL QUE CAUSE LOOP
        async function iniciar() {
            const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const cpf = new URLSearchParams(window.location.search).get('cpf');

            // ✅ NÃO TEM NENHUM OUTRO CHAMADA, NENHUM EVENTO, NENHUM LOOP
            if(!cpf) { window.location.href='consultar.html'; return; }

            try {
                const {data:p} = await supabase.from('propostas').select('*').eq('cpf', cpf.replace(/\D/g,'')).single();
                if(!p) throw new Error('Proposta não encontrada');

                const v=Number(p.valor_desejado||0), e=Number(p.valor_entrada||0), j=Number(p.juros_mensal||5), q=Number(p.quantidade_parcelas||1);
                const total=v*(1+j/100), parc=q>0?(total-e)/q:0;
                const dias=Number(p.dias_entrega||8);

                document.body.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-5 rounded-xl shadow my-4">
                    <h2 class="text-xl font-bold text-center text-primary mb-4">Olá, ${p.nome}!</h2>
                    <div class="bg-blue-50 p-4 rounded-lg mb-4">
                        <p>Valor Total: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                        <p>Entrada: R$ ${e.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                        <p>Parcelamento: ${q}x de R$ ${parc.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                        <p>Juros: ${j}% ao mês</p>
                        <p>Prazo de Entrega: ${dias} dias úteis</p>
                    </div>
                    <p class="text-sm mb-4">Ao assinar concorda com todos os termos.</p>
                    <label class="flex items-center gap-2 mb-4"><input type="checkbox" id="ok"> Li e concordo</label>
                    <button onclick="alert('Assinado!')" class="w-full bg-primary text-white py-3 rounded-lg font-bold">Assinar</button>
                    <div class="text-center mt-4"><a href="https://wa.me/5511973294235" class="text-primary">Suporte</a></div>
                </div>`;

            } catch (erro) {
                document.body.innerHTML = `<div class="text-center p-10 text-red-600">${erro.message}<br><a href="consultar.html">Voltar</a></div>`;
            }
        }

        // ✅ CHAMA UMA VEZ SÓ E PARA
        document.addEventListener('DOMContentLoaded', iniciar);
    </script>
</head>
<body class="bg-gray-100">
    <div class="text-center p-10">
        <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
        <p>Carregando...</p>
    </div>
</body>
</html>
