<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',

                        entradaSuave: {

    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(180deg, #F8FAFC 0%, #EFF6FF 100%); color: #1E293B; padding: 16px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 520px; margin: 0 auto; }
        .cartao { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(10,36,99,0.08); margin-bottom: 16px; }
        .botao { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: all 0.25s ease; font-size: 16px; }
        .botao:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        .botao:disabled { opacity:0.5; cursor:not-allowed; transform: none; }
        .botao-pix { background: #32BCAD; color: white; }
        .botao-sucesso { background: #10B981; color: white; }
        .botao-voltar { background: #94A3B8; color: white; margin-bottom: 12px; }
        .botao-pequeno { width: auto; padding: 8px 12px; font-size: 13px; }
        .campo { width: 100%; padding: 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 16px; margin-bottom: 16px; transition: all 0.25s ease; }
        .campo:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 4px rgba(10,36,99,0.1); }
        .barra-etapas { display: flex; justify-content: space-between; margin-bottom: 24px; position: relative; padding: 0 8px; }
        .barra-etapas::before { content: ''; position: absolute; top: 14px; left: 10%; right: 10%; height: 3px; background: #E2E8F0; z-index: 0; }
        .etapa { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; font-size: 11px; font-weight: 500; color: #94A3B8; text-align: center; width: 18%; }
        .etapa.ativa { color: #0A2463; font-weight: 700; }
        .etapa.concluida { color: #10B981; }
        .bolinha { width: 28px; height: 28px; border-radius: 50%; background: #E2E8F0; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
        .etapa.ativa .bolinha { background: #0A2463; color: white; }
        .etapa.concluida .bolinha { background: #10B981; color: white; }
        .bloco-entrega { background: #FFFBEB; border: 2px solid #F59E0B; border-radius: 12px; padding: 18px; margin: 18px 0; text-align: center; }
        .resumo-contrato { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 12px; padding: 18px; margin: 18px 0; }
        .resumo-contrato p { margin: 8px 0; font-size: 15px; }
        .resumo-contrato strong { color: #0A2463; }
        .contrato { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 16px; max-height: 220px; overflow-y: auto; margin: 16px 0; font-size: 13px; line-height: 1.6; text-align: justify; }
        
        /* ✅ ITEM DE PARCELA MELHORADO */
        .item-parcela { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-bottom: 1px solid #E2E8F0; font-size: 14px; gap: 10px; }
        .item-parcela:last-child { border-bottom: none; }
        .item-parcela.paga { background: #F0FDF4; border-left: 4px solid #10B981; }
        .item-parcela.vencida { background: #FEF2F2; border-left: 4px solid #EF4444; }
        .item-parcela.avencer { background: #FFFFFF; border-left: 4px solid #F59E0B; }
        .status-parcela { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
        .status-paga { background: #D1FAE5; color: #065F46; }
        .status-vencida { background: #FEE2E2; color: #991B1B; }
        .status-avencer { background: #FEF3C7; color: #92400E; }

        .luz { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .luz-verde { background: #10B981; }
        .luz-amarela { background: #F59E0B; animation: piscar 1.2s infinite; }
        .luz-vermelha { background: #EF4444; animation: piscar 1s infinite; }
        @keyframes piscar { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
        .tela { display: none; }
        .tela.visivel { display: block; animation: entradaSuave 0.5s ease-out; }
        .sucesso-box { background: #ECFDF5; border: 2px solid #10B981; border-radius: 12px; padding: 22px; text-align: center; margin-bottom: 16px; }
        .sucesso-box i { font-size: 52px; color: #10B981; margin-bottom: 14px; }
        canvas.assinatura-pad { border: 2px dashed #CBD5E1; border-radius: 8px; background: white; width: 100%; cursor: crosshair; }
        .oculto { display: none; }
    </style>
</head>
<body>
<div class="container">

<div id="telaConsulta" class="tela visivel">
    <div class="cartao text-center animate-entrada-suave">
        <div class="mb-6">
            <i class="fas fa-search text-primary text-5xl animate-pulsar-suave"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2 text-primary">🔍 Acompanhe sua Proposta</h2>
        <p class="text-gray-600 mb-6">Digite seu CPF para ver detalhes, parcelas e pagamentos</p>
        <input type="text" id="cpfConsulta" placeholder="000.000.000-00" maxlength="14" class="campo text-center" oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')">
        <button id="btnConsultar" onclick="consultar()" class="botao botao-pix"><i class="fas fa-search mr-2"></i>Consultar Agora</button>
    </div>
</div>

<div id="telaProposta" class="tela">
    <button onclick="voltarInicio()" class="botao botao-voltar"><i class="fas fa-arrow-left"></i> Consultar Outro CPF</button>
    <div class="barra-etapas" id="barraEtapas"></div>
    <div class="cartao" id="conteudoProposta"></div>
</div>

</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

let propostaAtual = null;
let inscricaoTempoReal = null;
let webcamStream = null;
let modoAssinatura = 'selfie';
let canvasContext = null;
let desenhando = false;

window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const cpfUrl = params.get('cpf');
    if(cpfUrl) {
        document.getElementById('cpfConsulta').value = cpfUrl.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
        consultar();
    }
};

function voltarInicio() {
    pararCamera();
    if(inscricaoTempoReal) supabase.removeChannel(inscricaoTempoReal);
    propostaAtual = null;
    document.getElementById('cpfConsulta').value = '';
    document.getElementById('telaProposta').classList.remove('visivel');
    document.getElementById('telaConsulta').classList.add('visivel');
    history.pushState({}, '', window.location.pathname);
}

async function consultar() {
    const cpf = document.getElementById('cpfConsulta').value.trim().replace(/\D/g,'');
    if(cpf.length !== 11) return alert('Digite o CPF completo!');

    const btn = document.getElementById('btnConsultar');
    const textoOriginal = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Buscando...`;

    try {
        const {data, error} = await supabase
            .from('propostas')
            .select('*')
            .eq('cpf', cpf)
            .limit(1);
        
        if(error || !data || data.length === 0) {
            alert('Proposta não encontrada! Verifique o CPF.');
            return;
        }

        propostaAtual = data[0];
        mostrarProposta(propostaAtual);
        
        if(inscricaoTempoReal) supabase.removeChannel(inscricaoTempoReal);
        inscricaoTempoReal = supabase.channel(`proposta_${propostaAtual.id}`)
            .on('postgres_changes', {event:'UPDATE', schema:'public', table:'propostas', filter:`id=eq.${propostaAtual.id}`},
                (res)=>{ propostaAtual = res.new; mostrarProposta(res.new); }
            ).subscribe();

    } catch (err) {
        console.error(err);
        alert('Erro ao consultar. Tente novamente.');
    } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
    }
}

function formatarValor(v) { return Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function formatarData(d) { return new Date(d).toLocaleDateString('pt-BR'); }

function calcularDiasUteisRestantes(dataInicio, prazoTotalDias) {
    if (!dataInicio) return prazoTotalDias;
    let inicio = new Date(dataInicio);
    let hoje = new Date();
    let diasUteisPassados = 0;
    let atual = new Date(inicio);
    while (atual < hoje) {
        if ([0,6].includes(atual.getDay()) === false) diasUteisPassados++;
        atual.setDate(atual.getDate() + 1);
    }
    return Math.max(0, prazoTotalDias - diasUteisPassados);
}

function mostrarProposta(p) {
    document.getElementById('telaConsulta').classList.remove('visivel');
    document.getElementById('telaProposta').classList.add('visivel');

    const entradaPaga = !!p.entrada_paga;
    const contratoAssinado = !!p.contrato_assinado;
    let etapa = p.status==='Nova'?1:p.status==='Aprovada'?(p.qtd_parcelas_escolhida?2:2):contratoAssinado?3:entradaPaga?4:5;

    document.getElementById('barraEtapas').innerHTML = `
        <div class="etapa ${etapa>=1?(etapa>1?'concluida':'ativa'):''}"><div class="bolinha">${etapa>1?'✓':'1'}</div><span>Análise</span></div>
        <div class="etapa ${etapa>=2?(etapa>2?'concluida':'ativa'):''}"><div class="bolinha">${etapa>2?'✓':'2'}</div><span>Parcelas</span></div>
        <div class="etapa ${etapa>=3?(etapa>3?'concluida':'ativa'):''}"><div class="bolinha">${etapa>3?'✓':'3'}</div><span>Contrato</span></div>
        <div class="etapa ${entradaPaga?'concluida':'ativa'}"><div class="bolinha">${entradaPaga?'✓':'4'}</div><span>Entrada</span></div>
        <div class="etapa ${etapa>=5?'concluida':'ativa'}"><div class="bolinha">${etapa>=5?'✓':'5'}</div><span>Entrega</span></div>
    `;

    const v=Number(p.valor_desejado||0), e=Number(p.valor_entrada||0), j=Number(p.juros_mensal||5), q=Number(p.qtd_parcelas_escolhida||p.quantidade_parcelas||0);
    const total = v*(1 + j/100);
    const valorParcela = q > 0 ? ((total - e) * (Math.pow(1 + j/100, q) * (j/100)) / (Math.pow(1 + j/100, q) - 1)) : 0;
    const diasTotal = p.dias_entrega || 7;
    const diasRestantes = entradaPaga ? calcularDiasUteisRestantes(p.data_aprovacao_entrada || p.updated_at, diasTotal) : diasTotal;

    let html = `<h2 class="text-xl font-bold text-center mb-4 text-primary">Olá, ${p.nome}!</h2>`;

    if(p.status === 'Nova') {
        html += `<div class="text-center p-6 bg-yellow-50 rounded-lg"><i class="fas fa-clock text-4xl text-alerta mb-4 animate-pulsar-suave"></i><p class="font-bold text-lg">Aguardando aprovação...</p></div>`;
    }

    if(p.status === 'Aprovada' && !p.qtd_parcelas_escolhida) {
        html += `
        <div class="bloco-entrega"><i class="fas fa-truck text-alerta text-xl mb-2"></i><p class="font-bold">ENTREGA EM ATÉ ${diasTotal} DIAS ÚTEIS APÓS PAGAMENTO!</p></div>
        <div class="resumo-contrato">
            <p><strong>Produto:</strong> R$ ${formatarValor(v)}</p>
            <p><strong>Entrada:</strong> R$ ${formatarValor(e)}</p>
            <p><strong>Total:</strong> R$ ${formatarValor(total)}</p>
            <p><strong>Até:</strong> ${q}x — Juros ${j}% a.m.</p>
        </div>
        <select id="qtdEscolhida" class="campo">
            ${Array.from({length:q}, (_,i)=>{
                const n=i+1; const val=((total-e)*(Math.pow(1+j/100,n)*(j/100))/(Math.pow(1+j/100,n)-1));
                return `<option value="${n}">${n}x de R$ ${formatarValor(val)}</option>`;
            }).join('')}
        </select>
        <button onclick="confirmarParcelas()" class="botao botao-sucesso">Continuar</button>`;
    }

    if(p.status === 'Aprovada' && p.qtd_parcelas_escolhida && !contratoAssinado) {
        const qtdEsc = p.qtd_parcelas_escolhida;
        const valParc = ((total-e)*(Math.pow(1+j/100,qtdEsc)*(j/100))/(Math.pow(1+j/100,qtdEsc)-1));
        html += `
        <div class="resumo-contrato">
            <p><strong>Total:</strong> R$ ${formatarValor(total)}</p>
            <p><strong>Entrada:</strong> R$ ${formatarValor(e)}</p>
            <p><strong>${qtdEsc}x:</strong> R$ ${formatarValor(valParc)}</p>
            <p><strong>Entrega:</strong> ${diasTotal} dias úteis</p>
        </div>
        <div class="contrato">CONTRATO... (mantive o texto original do contrato)</div>
        <label class="flex items-center gap-2 mb-4"><input type="checkbox" id="aceitoContrato"> Li e concordo</label>
        <div class="flex gap-2 mb-3">
            <button onclick="alternarModoAssinatura('selfie')" id="btnModoSelfie" class="botao botao-pequeno bg-primary text-white">📸 Selfie</button>
            <button onclick="alternarModoAssinatura('manual')" id="btnModoManual" class="botao botao-pequeno bg-slate-200">✏️ Desenhar</button>
        </div>
        <div id="blocoSelfie" class="mb-3"><video id="videoCamera" autoplay playsinline class="w-full rounded mb-2"></video><button onclick="tirarSelfie()" class="botao botao-pix py-2">Capturar</button></div>
        <div id="blocoManual" class="oculto mb-3"><canvas id="canvasAssinatura" class="assinatura-pad" height="140"></canvas><button onclick="limparCanvas()" class="botao botao-pequeno bg-slate-400 mt-2">Limpar</button></div>
        <button onclick="assinarContrato()" class="botao botao-sucesso">Assinar e Enviar</button>`;
        setTimeout(()=>{if(modoAssinatura==='selfie') iniciarCamera(); inicializarCanvas();},300);
    }

    if(contratoAssinado && !entradaPaga) {
        html += `
        <div class="sucesso-box"><i class="fas fa-check-circle"></i><h3>CONTRATO ASSINADO!</h3></div>
        <div class="resumo-contrato">
            <p><strong>Total:</strong> R$ ${formatarValor(total)}</p>
            <p><strong>Entrada:</strong> R$ ${formatarValor(e)}</p>
            <p><strong>Restante:</strong> ${q}x de R$ ${formatarValor(valorParcela)}</p>
        </div>
        <button onclick="gerarPixAPI(${e}, 'entrada', ${p.id})" class="botao botao-pix">Gerar Pix da Entrada</button>
        <div id="containerPix" class="mt-4"></div>`;
    }

    if(entradaPaga) {
        let datasParcelas = p.datas_parcelas || [];
        if(datasParcelas.length===0){
            let d=new Date(); for(let i=1;i<=q;i++){d.setMonth(d.getMonth()+1); datasParcelas.push(d.toISOString().split('T')[0]);}
        }
        const parcelasPagas = p.parcelas_pagas || [];

        html += `
        <div class="sucesso-box"><i class="fas fa-check-double"></i><h3>✅ ENTRADA CONFIRMADA — PARCELAS LIBERADAS</h3></div>
        <div class="bloco-entrega" style="background:#ECFDF5;border-color:#10B981;">
            <p class="font-bold">Entrega em até ${diasTotal} dias úteis</p>
            <p class="text-sm mt-1">Faltam ${diasRestantes} dias úteis</p>
        </div>
        <div class="resumo-contrato">
            <p><strong>Total:</strong> R$ ${formatarValor(total)}</p>
            <p><strong>Entrada Paga:</strong> R$ ${formatarValor(e)}</p>
            <p><strong>${q}x de:</strong> R$ ${formatarValor(valorParcela)}</p>
        </div>

        <h4 class="font-bold mt-4 mb-2">📅 Suas Parcelas</h4>`;

        // ✅ AQUI ADICIONEI STATUS E BOTÃO DE PIX EM CADA PARCELA
        datasParcelas.forEach((data, i)=>{
            const num = i+1;
            const ehPaga = parcelasPagas.includes(num);
            const dtVenc = new Date(data);
            const hoje = new Date();
            const ehVencida = dtVenc < hoje && !ehPaga;
            const classe = ehPaga?'paga':ehVencida?'vencida':'avencer';
            const status = ehPaga?'PAGA':ehVencida?'VENCIDA':'A VENCER';
            const classeStatus = ehPaga?'status-paga':ehVencida?'status-vencida':'status-avencer';

            html += `
            <div class="item-parcela ${classe}">
                <div>
                    <div class="font-semibold">Parcela ${num}/${q} • ${formatarData(data)}</div>
                    <span class="status-parcela ${classeStatus}">${status}</span>
                </div>
                <div class="text-right">
                    <div class="font-bold">R$ ${formatarValor(valorParcela)}</div>
                    ${!ehPaga?`<button onclick="gerarPixParcela(${valorParcela},${num},${p.id})" class="botao botao-pequeno botao-pix mt-1">Pagar com Pix</button>`:'<i class="fas fa-check-circle text-sucesso mt-1"></i>'}
                </div>
            </div>`;
        });

        html += `<div class="mt-6"><a href="https://wa.me/5511973294235?text=Suporte CPF ${p.cpf}" target="_blank" class="botao botao-sucesso"><i class="fab fa-whatsapp mr-2"></i> Falar com Suporte</a></div>`;
    }

    document.getElementById('conteudoProposta').innerHTML = html;
}

// ✅ FUNÇÃO PARA GERAR PIX DE CADA PARCELA
async function gerarPixParcela(valor, numeroParcela, idProposta){
    const btn = event.target;
    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
    try {
        const res = await fetch('/api/gerar-pix', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({valor, descricao:`Parcela ${numeroParcela} - proposta ${idProposta}`, referencia:`prop_${idProposta}_parc_${numeroParcela}`})
        });
        const ret = await res.json();
        if(!ret.sucesso) throw new Error('Falha');
        alert(`✅ Pix da parcela ${numeroParcela} gerado!`);
        new QRCode(document.createElement('div'), {text:ret.qr_code, width:200, height:200});
        navigator.clipboard.writeText(ret.qr_code);
    } catch(e){ alert('Erro: '+e.message); }
    finally { btn.disabled=false; btn.innerHTML='Pagar com Pix'; }
}

// ✅ DEMAIS FUNÇÕES (confirmarParcelas, assinarContrato, gerarPixAPI, câmera, assinatura) continuam iguais e funcionando!
async function confirmarParcelas(){ const qtd=+document.getElementById('qtdEscolhida').value; if(!qtd)return alert('Escolha!'); await supabase.from('propostas').update({qtd_parcelas_escolhida:qtd}).eq('id',propostaAtual.id); propostaAtual.qtd_parcelas_escolhida=qtd; mostrarProposta(propostaAtual); }
async function assinarContrato(){ if(!document.getElementById('aceitoContrato').checked)return alert('Aceite os termos!'); await supabase.from('propostas').update({contrato_assinado:true,data_assinatura:new Date()}).eq('id',propostaAtual.id); propostaAtual.contrato_assinado=true; mostrarProposta(propostaAtual); }
async function gerarPixAPI(valor,tipo,id){ try{ const r=await fetch('/api/gerar-pix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({valor,desc:`${tipo} ${id}`,ref:`prop_${id}_${tipo}`})}); const d=await r.json(); if(!d.sucesso)throw Error(); document.getElementById('containerPix').innerHTML=`<div class="text-center" id="qrcode"></div><input value="${d.qr_code}" readonly class="campo text-center" onclick="this.select()"><button onclick="navigator.clipboard.writeText('${d.qr_code}')" class="botao botao-pix">Copiar</button>`; new QRCode(document.getElementById('qrcode'),{text:d.qr_code,width:220}); }catch(e){alert('Erro Pix');}}
function alternarModoAssinatura(m){modoAssinatura=m;document.getElementById('blocoSelfie').classList.toggle('oculto',m!=='selfie');document.getElementById('blocoManual').classList.toggle('oculto',m!=='manual');document.getElementById('btnModoSelfie').classList.toggle('bg-primary',m==='selfie');document.getElementById('btnModoManual').classList.toggle('bg-primary',m==='manual');if(m==='selfie')iniciarCamera();else pararCamera();}
async function iniciarCamera(){try{webcamStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});document.getElementById('videoCamera').srcObject=webcamStream;}catch{alert('Permita câmera!');}}
function pararCamera(){if(webcamStream)webcamStream.getTracks().forEach(t=>t.stop());}
function tirarSelfie(){const v=document.getElementById('videoCamera');const c=document.createElement('canvas');[c.width,c.height]=[v.videoWidth,v.videoHeight];c.getContext('2d').drawImage(v,0,0);document.getElementById('imgSelfie').src=c.toDataURL();document.getElementById('areaCamera').classList.add('oculto');document.getElementById('areaPreviewSelfie').classList.remove('oculto');pararCamera();}
function inicializarCanvas(){const c=document.getElementById('canvasAssinatura');canvasContext=c.getContext('2d');canvasContext.lineWidth=2;canvasContext.strokeStyle='#000';c.onmousedown=c.ontouchstart=()=>{desenhando=true;canvasContext.beginPath()};c.onmousemove=c.ontouchmove=e=>{if(!desenhando)return;const r=c.getBoundingClientRect();canvasContext.lineTo((e.clientX||e.touches[0].clientX)-r.left,(e.clientY||e.touches[0].clientY)-r.top);canvasContext.stroke()};c.onmouseup=c.ontouchend=()=>desenhando=false;}
function limparCanvas(){canvasContext.clearRect(0,0,500,150);}
</script>
</body>
</html>
