<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        whatsapp: '#25D366',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        .bolinha-girando { animation: girar 1s linear infinite; }
        @keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        canvas { border: 2px solid #CBD5E1; border-radius: 8px; background: white; touch-action: none; }
        video { border-radius: 8px; background: #000; }
        .etapa-pendente { opacity: 0.5; }
        .etapa-concluida { border-color: #10B981; background: #F0FDF4; }
        .etapa-ativa { border-color: #2563EB; background: #EFF6FF; }
        .oculto { display: none !important; }
    </style>
</head>
<body class="bg-fundo min-h-screen pb-8">

<div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-primary text-center mb-6">🔍 Acompanhar Proposta</h1>

    <!-- CONSULTA CPF -->
    <div class="bg-white p-5 rounded-xl shadow mb-6" id="areaConsulta">
        <label class="block font-semibold mb-2 text-gray-700">Digite seu CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" 
            class="w-full p-3 border-2 border-gray-200 rounded-lg text-lg focus:border-primary focus:outline-none">
        <button onclick="consultar()" class="w-full mt-4 bg-primary text-white p-3 rounded-lg font-bold text-lg">
            🔍 Consultar
        </button>
    </div>

    <!-- RESULTADO -->
    <div id="resultado"></div>

    <!-- BOTÃO SUPORTE WHATSAPP -->
    <div class="mt-8 text-center">
        <a href="https://wa.me/5511973294235?text=Olá! Preciso de ajuda com minha proposta." 
           target="_blank" 
           class="inline-flex items-center gap-2 bg-whatsapp text-white px-6 py-3 rounded-full font-bold text-lg shadow-lg">
            <i class="fab fa-whatsapp text-xl"></i> Falar com Suporte
        </a>
    </div>
</div>

<script>
// ==============================================
// ✅ CONFIGURAÇÕES
// ==============================================
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

const CHAVE_PIX = '33552949852'; // ✅ Sua chave Pix
const NOME_RECEBEDOR = 'FLASH POINT';
const CIDADE = 'SAO PAULO';

let cpfAtual = localStorage.getItem('ultimoCpf') || '';
let canalRealtime = null;
let propostaAtual = null;
let hashAnterior = ''; // ✅ PARA DE PISCAR — COMPARA DADOS

// ==============================================
// ✅ GERA PIX 100% VÁLIDO — PADRÃO BCB
// ==============================================
function gerarCodigoPix(valor, descricao = '') {
    const valorNumerico = Number(valor) || 0;
    if(valorNumerico <= 0) return '';
    const valorStr = valorNumerico.toFixed(2);

    function campo(id, conteudo) {
        const texto = String(conteudo || '').toUpperCase().substring(0,25);
        return id + String(texto.length).padStart(2,'0') + texto;
    }

    let pix = '';
    pix += campo('00', '01');
    pix += campo('26', '0014br.gov.bcb.pix01' + String(CHAVE_PIX.length).padStart(2,'0') + CHAVE_PIX);
    pix += campo('52', '0000');
    pix += campo('53', '986');
    pix += campo('54', valorStr);
    pix += campo('58', 'BR');
    pix += campo('59', NOME_RECEBEDOR);
    pix += campo('60', CIDADE);
    if(descricao) pix += campo('62', '05***');
    pix += '6304';

    function calcularCRC16(texto) {
        let crc = 0xFFFF;
        for(let i=0; i<texto.length; i++) {
            crc ^= texto.charCodeAt(i) << 8;
            for(let j=0; j<8; j++) {
                crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
            }
        }
        return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4,'0');
    }
    return pix + calcularCRC16(pix);
}

// ==============================================
// ✅ INÍCIO — MANTER SESSÃO
// ==============================================
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    let cpfUrl = (params.get('cpf') || '').replace(/\D/g, '');
    if(cpfUrl.length === 11) {
        cpfAtual = cpfUrl;
        localStorage.setItem('ultimoCpf', cpfAtual);
    }
    if(cpfAtual.length === 11) {
        document.getElementById('cpf').value = cpfAtual.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        consultar();
    }
};

// ==============================================
// ✅ TEMPO REAL — NÃO PISCA!
// ==============================================
function ativarRealtime() {
    if(!cpfAtual) return;
    if(canalRealtime) supabase.removeChannel(canalRealtime);
    canalRealtime = supabase.channel('cliente_' + cpfAtual)
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'propostas', filter:`cpf=eq.${cpfAtual}` }, (mudanca) => {
            const hashNova = JSON.stringify(mudanca.new);
            if(hashNova !== hashAnterior) { // ✅ SÓ ATUALIZA SE MUDOU
                hashAnterior = hashNova;
                exibirProposta(mudanca.new);
            }
        })
        .subscribe();
}

// ==============================================
// ✅ CONSULTAR — BLOQUEIA ENTRADA PAGA!
// ==============================================
async function consultar() {
    let cpf = document.getElementById('cpf').value.replace(/\D/g, '');
    if(cpf.length !== 11) { alert('Digite um CPF válido!'); return; }
    cpfAtual = cpf;
    localStorage.setItem('ultimoCpf', cpf);

    document.getElementById('areaConsulta').classList.add('oculto');
    document.getElementById('resultado').innerHTML = '<p class="text-center p-8 text-gray-500"><i class="fas fa-spinner fa-spin text-2xl"></i><br>Buscando...</p>';

    const {data, error} = await supabase
        .from('propostas').select('*').eq('cpf', cpf)
        .order('created_at', {ascending:false}).limit(1);

    if(error || !data || data.length === 0) {
        document.getElementById('resultado').innerHTML = '<p class="text-center p-8 text-red-500">❌ Proposta não encontrada.</p>';
        document.getElementById('areaConsulta').classList.remove('oculto');
        return;
    }

    propostaAtual = data[0];
    hashAnterior = JSON.stringify(data[0]);
    exibirProposta(propostaAtual);
    ativarRealtime();
}

// ==============================================
// ✅ EXIBIR PROPOSTA — ENTRADA PAGA = BLOQUEIA PAGAMENTO!
// ==============================================
function exibirProposta(p) {
    propostaAtual = p;
    const status = p.status || 'Nova';
    const foiAprovada = status === 'Aprovada';
    const temContrato = !!p.contrato_assinado;
    const entradaPaga = !!p.entrada_paga;
    const valorTotal = Number(p.valor_desejado || 0);
    const valorEntrada = Number(p.valor_entrada || 0);
    const qtdMaxima = Number(p.quantidade_parcelas || 1);
    const juros = Number(p.juros || 0);
    const dadosParcelas = p.dados_parcelas || [];
    const qtdEscolhida = Number(p.quantidade_escolhida || qtdMaxima);

    // AGUARDANDO APROVAÇÃO
    if(!foiAprovada) {
        document.getElementById('resultado').innerHTML = `
        <div class="bg-white p-6 rounded-xl shadow text-center">
            <div class="w-20 h-20 mx-auto mb-4 flex items-center justify-center rounded-full bg-blue-100">
                <i class="fas fa-circle-notch text-4xl text-primary bolinha-girando"></i>
            </div>
            <h2 class="text-xl font-bold text-primary mb-2">🔔 Aguardando Aprovação</h2>
            <p class="text-gray-600 mb-4">Olá, ${p.nome || 'Cliente'}! Estamos analisando sua proposta.</p>
        </div>`;
        return;
    }

    // ✅ ENTRADA PAGA → JÁ MOSTRA PARCELAS, NÃO MOSTRA PAGAMENTO DA ENTRADA NOVAMENTE!
    if(entradaPaga) {
        mostrarTelaParcelas(p, dadosParcelas);
        return;
    }

    let html = `
    <div class="bg-white p-5 rounded-xl shadow">
        <div class="text-center mb-6">
            <span class="inline-block bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold text-lg">✅ PROPOSTA APROVADA!</span>
        </div>
        <div class="mb-4">
            <h2 class="text-xl font-bold text-primary">👤 ${p.nome || 'Cliente'}</h2>
            <p class="text-sm text-gray-500">CPF: ${(p.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</p>
        </div>
        <div class="bg-gray-50 p-4 rounded-lg mb-4 border">
            <h3 class="font-bold text-primary mb-3">💰 Valores Contratados</h3>
            <div class="grid grid-cols-2 gap-3">
                <div><p class="text-sm text-gray-500">Valor Total</p><p class="font-bold text-lg">${valorTotal.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p></div>
                <div><p class="text-sm text-gray-500">Entrada</p><p class="font-bold text-lg text-pix">${valorEntrada.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p></div>
                <div><p class="text-sm text-gray-500">Juros</p><p class="font-bold text-lg">${juros}% ao mês</p></div>
                <div><p class="text-sm text-gray-500">Máximo de parcelas</p><p class="font-bold text-lg">${qtdMaxima}x</p></div>
            </div>
        </div>`;

    // ESCOLHER PARCELAS
    if(!temContrato) {
        html += `
        <div class="border-2 rounded-xl p-4 mb-4 etapa-ativa">
            <h3 class="font-bold text-lg text-primary mb-3">📋 Escolha em quantas vezes quer pagar</h3>
            <select id="selParcelas" onchange="calcularParcelaCliente(${qtdMaxima}, ${valorEntrada}, ${juros})" 
                class="w-full p-3 border-2 border-primary rounded-lg text-lg font-bold">`;
        const saldo = valorTotal - valorEntrada;
        for(let i=1; i<=qtdMaxima; i++) {
            const taxa = juros/100;
            const valorParc = taxa===0 ? saldo/i : saldo*(taxa*Math.pow(1+taxa,i))/(Math.pow(1+taxa,i)-1);
            html += `<option value="${i}" ${i==qtdEscolhida?'selected':''}>${i}x de ${valorParc.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</option>`;
        }
        html += `</select>
            <button onclick="salvarEscolhaParcelas(${p.id})" class="w-full mt-3 bg-primary text-white p-3 rounded-lg font-bold">✅ Confirmar</button>
        </div>`;
    }

    // PAGAMENTO DA ENTRADA — SÓ APARECE SE AINDA NÃO PAGOU!
    if(temContrato && !entradaPaga) {
        html += `
        <div class="border-2 rounded-xl p-4 bg-pix/10 border-pix mb-4">
            <h3 class="font-bold text-lg text-pix mb-3 text-center">💳 Pagamento da Entrada</h3>
            <p class="text-3xl font-bold text-pix text-center mb-4">${valorEntrada.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>`;
        if(p.qr_code_entrada) {
            html += `
                <div class="text-center">
                    <div id="qrcode" class="flex justify-center my-4"></div>
                    <textarea readonly class="w-full p-3 text-xs border rounded-lg bg-white" rows="4">${p.qr_code_entrada}</textarea>
                    <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value); alert('✅ Código copiado! Pague pelo app do seu banco.')" 
                        class="mt-3 bg-pix text-white px-6 py-3 rounded-lg font-bold text-lg w-full">📋 Copiar Código Pix</button>
                </div>`;
        }
        html += `</div>`;
    }

    html += `</div>`;
    document.getElementById('resultado').innerHTML = html;

    if(temContrato && !entradaPaga && p.qr_code_entrada) {
        setTimeout(() => {
            const c = document.getElementById('qrcode');
            if(c) { c.innerHTML=''; new QRCode(c, { text:p.qr_code_entrada, width:200, height:200 }); }
        }, 100);
    }
}

// ==============================================
// ✅ TELA DE PARCELAS — APARECE APÓS PAGAR A ENTRADA
// ==============================================
function mostrarTelaParcelas(p, dadosParcelas) {
    const valorTotal = Number(p.valor_desejado || 0);
    const valorEntrada = Number(p.valor_entrada || 0);
    const qtd = Number(p.quantidade_escolhida || p.quantidade_parcelas || 0);
    const prazo = p.prazo_entrega || p.prazo || 18;

    let html = `
    <div class="bg-white p-5 rounded-xl shadow">
        <div class="text-center mb-6">
            <div class="text-5xl text-sucesso mb-2">✅</div>
            <h2 class="text-2xl font-bold text-sucesso mb-2">ENTRADA PAGA!</h2>
            <p class="text-gray-600">Pagamento confirmado! Suas parcelas estão abaixo.</p>
            <div class="bg-blue-50 p-3 rounded-lg mt-3 text-left">
                <p><strong>Valor Total:</strong> ${valorTotal.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>
                <p><strong>Entrada Paga:</strong> ${valorEntrada.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>
                <p><strong>Parcelamento:</strong> ${qtd}x</p>
                <p><strong>Prazo de entrega:</strong> até ${prazo} dias úteis</p>
            </div>
        </div>
        <hr class="my-4">
        <h3 class="font-bold text-lg text-primary mb-4">📋 Suas Parcelas a Pagar</h3>
        <div class="space-y-3">`;

    dadosParcelas.forEach((parc, idx) => {
        const dt = parc.vencimento ? parc.vencimento.split('-').reverse().join('/') : '---';
        const vlr = Number(parc.valor || 0);
        const vlrFormatado = vlr.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
        const paga = parc.paga;
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const venc = parc.vencimento ? new Date(parc.vencimento+'T00:00:00') : null;
        const dias = venc ? Math.ceil((venc - hoje)/(1000*60*60*24)) : 999;
        const atrasada = venc && dias < 0 && !paga;
        const proximo = !paga && dias >=0 && dias <=5;
        const corBorda = paga ? 'border-green-400' : atrasada ? 'border-red-400' : proximo ? 'border-yellow-400' : 'border-blue-300';
        const corFundo = paga ? 'bg-green-50' : atrasada ? 'bg-red-50' : proximo ? 'bg-yellow-50/20' : 'bg-blue-50/20';
        const statusTexto = paga ? '✅ PAGA' : atrasada ? `⚠️ Atrasada há ${-dias} dia(s)` : proximo ? `⏳ Vence em ${dias} dia(s)` : `📅 Vence em ${dias} dias`;

        html += `
        <div class="p-4 rounded-lg border-2 ${corBorda} ${corFundo}">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold text-lg">${parc.numero}ª Parcela</span>
                <span class="font-bold text-xl text-primary">${vlrFormatado}</span>
            </div>
            <div class="flex justify-between items-center text-sm mb-3">
                <span>Vencimento: ${dt}</span>
                <span class="font-semibold">${statusTexto}</span>
            </div>`;

        if(!paga) {
            const codigoPixParcela = gerarCodigoPix(vlr, `${parc.numero}a Parcela`);
            html += `
            <div>
                <button onclick="document.getElementById('pix-parcela-${idx}').classList.toggle('oculto')" 
                    class="w-full bg-pix text-white p-3 rounded-lg font-bold text-lg">
                    💳 Gerar Pix para Pagamento
                </button>
                <div id="pix-parcela-${idx}" class="oculto mt-3 p-3 bg-white rounded-lg border">
                    <p class="text-sm text-gray-600 mb-2">Copie o código abaixo e pague pelo app do seu banco:</p>
                    <textarea readonly class="w-full p-3 text-xs border rounded bg-gray-50" rows="5">${codigoPixParcela || '⚠️ Valor inválido'}</textarea>
                    <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value); alert('✅ Código copiado! Valor: ${vlrFormatado} — Cole no app do seu banco.')" 
                        class="w-full mt-2 bg-sucesso text-white p-3 rounded-lg font-bold">
                        📋 Copiar Código Pix
                    </button>
                </div>
            </div>`;
        } else {
            html += `<p class="text-center text-green-600 font-bold text-lg">✅ Pagamento Confirmado!</p>`;
        }
        html += `</div>`;
    });

    html += `</div>
        <hr class="my-4">
        <div class="text-center space-y-2">
            <button onclick="window.print()" class="w-full bg-gray-200 text-gray-800 p-3 rounded-lg font-bold">🖨️ Imprimir Contrato</button>
            <button onclick="localStorage.removeItem('ultimoCpf'); window.location.href='${window.location.pathname}'" class="w-full bg-gray-100 text-gray-600 p-3 rounded-lg font-bold">🔍 Consultar outro CPF</button>
        </div>
    </div>`;

    document.getElementById('resultado').innerHTML = html;
    document.getElementById('areaConsulta').classList.add('oculto');
}

// ==============================================
// ✅ CALCULAR PARCELAS — FÓRMULA CORRIGIDA!
// ==============================================
function calcularParcelaCliente(qtdMax, valorEntrada, juros) {
    const qtd = parseInt(document.getElementById('selParcelas').value);
    const valorTotal = propostaAtual.valor_desejado;
    const saldo = valorTotal - valorEntrada;
    const taxa = juros / 100;
    const valorParc = taxa === 0 ? saldo / qtd : saldo * (taxa * Math.pow(1+taxa, qtd)) / (Math.pow(1+taxa, qtd) - 1);
    alert(`✅ ${qtd}x de ${valorParc.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}`);
}

// ==============================================
// ✅ SALVAR ESCOLHA DE PARCELAS
// ==============================================
async function salvarEscolhaParcelas(idProposta) {
    const qtd = parseInt(document.getElementById('selParcelas').value);
    if(!qtd) return alert('Selecione a quantidade!');

    const valorTotal = Number(propostaAtual.valor_desejado || 0);
    const valorEntrada = Number(propostaAtual.valor_entrada || 0);
    const juros = Number(propostaAtual.juros || 0);
    const saldo = valorTotal - valorEntrada;
    const taxa = juros / 100;
    const valorParc = taxa === 0 ? saldo / qtd : saldo * (taxa * Math.pow(1+taxa, qtd)) / (Math.pow(1+taxa, qtd) - 1);

    const hoje = new Date();
    hoje.setMonth(hoje.getMonth() + 1);
    hoje.setDate(5);

    const novasParcelas = [];
    for(let i=1; i<=qtd; i++) {
        const dt = new Date(hoje);
        dt.setMonth(hoje.getMonth() + i - 1);
        const dataStr = dt.toISOString().split('T')[0];
        novasParcelas.push({
            numero: i,
            valor: parseFloat(valorParc.toFixed(2)),
            vencimento: dataStr,
            paga: false
        });
    }

    const { error } = await supabase.from('propostas').update({
        quantidade_escolhida: qtd,
        dados_parcelas: novasParcelas
    }).eq('id', idProposta);

    if(error) return alert('❌ Erro: ' + error.message);
    alert(`✅ ${qtd} parcelas confirmadas! Agora leia e assine o contrato para gerar o Pix da entrada.`);
}
</script>
</body>
</html>
