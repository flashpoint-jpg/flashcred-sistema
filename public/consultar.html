<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Proposta | FlashCred</title>
    <!-- Importação correta do Supabase e Ícones -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --bg-body: #F0F4F8;
            --borda: #D1D9E6;
            --texto: #1E293B;
            --sombra: 0 4px 12px rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); line-height: 1.5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .cartao { background: white; border-radius: 12px; padding: 24px; box-shadow: var(--sombra); margin-bottom: 20px; text-align: center; }
        .botao { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; font-size: 14px; width: 100%; margin-top: 10px; }
        .botao-sucesso { background: var(--sucesso); color: white; }
        .campo { width: 100%; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; margin-bottom: 10px; font-size: 14px; background: white; }
        #qrcode-img { max-width: 200px; border: 8px solid white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin: 15px auto; display: block; }
        .copia-cola { background: #F8FAFC; border: 1px dashed var(--borda); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; word-break: break-all; margin: 15px 0; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div class="cartao" id="painelBusca">
        <h2 style="color: var(--primary); margin-bottom: 15px;">🔍 Consultar Proposta</h2>
        <input type="text" id="cpfConsulta" placeholder="Digite seu CPF (apenas números)" class="campo" maxlength="11">
        <button onclick="buscarProposta()" class="botao botao-sucesso">Consultar</button>
    </div>

    <div class="cartao" id="painelDetalhes" style="display:none;">
        <h2 id="clienteNome" style="color: var(--primary); margin-bottom: 10px;"></h2>
        <p id="clienteStatus" style="font-weight: 600; margin-bottom: 20px;"></p>
        
        <div id="areaPagamento" style="display:none;">
            <hr style="border: 0; border-top: 1px solid var(--borda); margin: 15px 0;">
            <h3 style="color: var(--primary); margin-bottom: 10px;">💳 Pagamento Pix Dinâmico</h3>
            <p style="font-size: 14px; color: #64748B; margin-bottom: 10px;">Escaneie o QR Code ou copie o código abaixo:</p>
            
            <img id="qrcode-img" src="" alt="QR Code Pix">
            
            <div id="pixCopiaCola" class="copia-cola"></div>
            <button onclick="copiarPix()" class="botao botao-sucesso"><i class="fas fa-copy"></i> Copiar Pix Copia e Cola</button>
        </div>
        
        <div id="mensagemPago" style="display:none; padding: 15px; background: #ECFDF5; color: #065F46; border-radius: 8px; font-weight: bold; margin-top: 15px;">
            ✅ Pagamento aprovado com sucesso!
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function buscarProposta() {
    const cpf = document.getElementById('cpfConsulta').value.trim();
    if(!cpf) return alert('Digite o CPF!');

    const { data, error } = await supabase.from('propostas').select('*').eq('cpf', cpf).single();
    if(error || !data) return alert('Proposta não encontrada!');

    document.getElementById('painelBusca').style.display = 'none';
    document.getElementById('painelDetalhes').style.display = 'block';

    document.getElementById('clienteNome').innerText = `Olá, ${data.nome}`;
    document.getElementById('clienteStatus').innerText = `Status: ${data.status} | Entrada Paga: ${data.entrada_paga ? 'Sim' : 'Não'}`;

    if(data.entrada_paga) {
        document.getElementById('mensagemPago').style.display = 'block';
    } else {
        document.getElementById('areaPagamento').style.display = 'block';
        gerarPixMercadoPago(data);
    }
}

async function gerarPixMercadoPago(proposta) {
    try {
        const valorEntrada = proposta.valor_entrada || 150.00;
        
        // Como o site está rodando no próprio Render, usamos URL relativa para a API
        const resposta = await fetch('/api/criar-pix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                proposta_id: proposta.id,
                valor: valorEntrada,
                nome: proposta.nome
            })
        });

        const resultado = await resposta.json();
        if(resultado.sucesso) {
            document.getElementById('qrcode-img').src = `data:image/png;base64,${resultado.qr_code_base64}`;
            document.getElementById('pixCopiaCola').innerText = resultado.qr_code;
        } else {
            alert('Erro ao gerar Pix: ' + resultado.erro);
        }
    } catch(e) {
        console.error('Erro de conexão:', e);
    }
}

function copiarPix() {
    const texto = document.getElementById('pixCopiaCola').innerText;
    navigator.clipboard.writeText(texto);
    alert('Código Pix copiado!');
}
</script>
</body>
</html>
