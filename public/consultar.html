<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0A2463', sucesso: '#10B981', alerta: '#F59E0B' } } } }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-bold text-center text-primary mb-6">🔍 Acompanhar Proposta</h2>
        
        <input type="text" id="cpf" placeholder="Digite seu CPF (apenas números)" maxlength="11" class="w-full p-3 border rounded mb-4">
        
        <!-- ✅ BOTÃO COM CLIQUE CERTO -->
        <button onclick="buscarProposta()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold p-3 rounded transition">
            Consultar
        </button>

        <div id="resultado" class="mt-6"></div>
    </div>

    <script>
        // ✅ SUPABASE CERTO
        const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function buscarProposta(){
            const cpf = document.getElementById('cpf').value.replace(/\D/g,'');
            const resDiv = document.getElementById('resultado');

            if(cpf.length !== 11) {
                resDiv.innerHTML = `<p class="text-red-500 text-center">Digite um CPF válido com 11 números!</p>`;
                return;
            }

            resDiv.innerHTML = `<p class="text-center text-gray-600"><i class="fas fa-spinner fa-spin"></i> Buscando...</p>`;

            try {
                const {data, error} = await supabase
                    .from('propostas')
                    .select('*')
                    .eq('cpf', cpf)
                    .single();

                if(error || !data) throw "Proposta não encontrada!";

                resDiv.innerHTML = `
                    <div class="p-4 border rounded bg-gray-50">
                        <p><strong>Nome:</strong> ${data.nome}</p>
                        <p><strong>CPF:</strong> ${data.cpf}</p>
                        <p><strong>Valor Solicitado:</strong> R$ ${Number(data.valor_desejado||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                        <p><strong>Status:</strong> ${data.status}</p>
                    </div>
                `;

            } catch(erro) {
                resDiv.innerHTML = `<p class="text-red-500 text-center">❌ ${erro}</p>`;
            }
        }
    </script>
</body>
</html>
