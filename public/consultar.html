<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: #F8FAFC; 
            color: #1E293B; 
            padding: 16px; 
            max-width: 600px; 
            margin: 0 auto; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 24px; 
            margin-bottom: 16px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
            width: 100%;
        }
        .btn { 
            width: 100%; 
            padding: 16px; 
            border-radius: 8px; 
            border: none; 
            font-weight: 700; 
            cursor: pointer !important; 
            margin: 8px 0; 
            font-size: 18px; 
            transition: 0.1s;
            pointer-events: auto !important;
            position: relative;
            z-index: 999;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #0A2463; color: white; }
        .btn-success { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-pix { background: #32BCAD; color: white; }
        .btn-cam { background: #8B5CF6; color: white; }
        .loading { text-align: center; padding: 20px; color: #64748B; width: 100%; }
        .aviso-erro { color: #EF4444; font-weight: 600; text-align: center; margin-bottom: 10px; padding: 8px; }
        input { font-size: 18px !important; padding: 14px !important; }
        .oculto { display: none !important; }

        .progresso { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; width: 100%; }
        .progresso::before { content: ''; position: absolute; top: 12px; left: 10%; right: 10%; height: 3px; background: #E2E8F0; z-index: 0; }
        .passo { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; font-size: 12px; font-weight: 500; color: #94A3B8; }
        .passo.ativo { color: #0A2463; font-weight: 700; }
        .passo.concluido { color: #10B981; }
        .bolinha { width: 24px; height: 24px; border-radius: 50%; background: #E2E8F0; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; font-size: 12px; font-weight: bold; }
        .passo.ativo .bolinha { background: #0A2463; color: white; }
        .passo.concluido .bolinha { background: #10B981; color: white; }

        .aviso-entrega {
            background: #FFFBEB;
            border: 3px solid #F59E0B;
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #92400E;
            width: 100%;
        }

        .texto-contrato { max-height: 220px; overflow-y: auto; padding: 12px; background: #F8FAFC; border-radius: 8px; border: 1px solid #E2E8F0; margin: 12px 0; font-size: 14px; line-height: 1.6; width: 100%; }
        .campo-assinatura { width: 100%; padding: 12px; border: 2px dashed #64748B; border-radius: 8px; text-align: center; font-size: 18px; margin: 12px 0; background: #fff; }
        .area-cam { border: 2px solid #E2E8F0; border-radius: 8px; padding: 10px; margin: 12px 0; text-align: center; width: 100%; }
        video { width: 100%; max-height: 300px; border-radius: 8px; }
        .chave-pix { 
            background: #ECFDF5; 
            border: 2px solid #10B981; 
            border-radius: 8px; 
            padding: 16px; 
            text-align: center; 
            font-weight: 600; 
            margin: 16px 0; 
            word-break: break-all;
            width: 100%;
        }
        .qrcode-pix { display: flex; justify-content: center; align-items: center; margin: 20px 0; width: 100%; }
        .item-parcela { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #E2E8F0; font-size: 14px; width: 100%; }
        .item-parcela:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div id="areaConsulta" class="card">
    <h2 class="text-xl font-bold text-center mb-4 text-primary">🔍 Acompanhar Proposta</h2>
    <div id="avisoErro" class="aviso-erro oculto"></div>
    <input type="text" id="cpfConsulta" placeholder="Digite seu CPF (apenas números, 11 dígitos)" maxlength="11" class="w-full p-3 border border-gray-300 rounded-lg mb-4 text-center text-lg">
    <button id="btnConsultar" class="btn btn-primary">
        <i class="fas fa-search"></i> CONSULTAR
    </button>
</div>

<div id="conteudoProposta" class="hidden"></div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

let inscricao = null;
let dadosProposta = null;
let qtdEscolhida = 0;
let streamCam = null;

// ✅ CLIQUE GARANTIDO — NÃO TRAVA MAIS
document.getElementById('btnConsultar').addEventListener('click', function(){
    buscarProposta();
});

window.onload = () => {
    const cpfUrl = new URLSearchParams(window.location.search).get('cpf');
    if(cpfUrl) {
        document.getElementById('cpfConsulta').value = cpfUrl.replace(/\D/g,'');
        buscarProposta();
    }
};

async function gerarPixViaAPI(valor, descricao) {
    try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/gerar-pix`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
            body: JSON.stringify({ cpf: dadosProposta.cpf, nome: dadosProposta.nome, whatsapp: dadosProposta.whatsapp, valor: Number(valor), descricao: descricao })
        });
        const resultado = await response.json();
        if(resultado && (resultado.copia_e_cola || resultado.pix_copia_e_cola)) return resultado.copia_e_cola || resultado.pix_copia_e_cola;
        throw new Error(resultado.erro || 'Erro ao gerar Pix');
    } catch (err) {
        console.error('Erro Pix:', err);
        const valorStr = Number(valor).toFixed(2);
        const chave = '33552949852';
        const nome = 'FELIPE COSTA';
        const cidade = 'MUZAMBINHO';
        const gui = 'br.gov.bcb.pix';
        const sub26 = '00' + String(gui.length).padStart(2, '0') + gui + '01' + String(chave.length).padStart(2, '0') + chave;
        const campo26 = '26' + String(sub26.length).padStart(2, '0') + sub26;
        const payloadSemCrc = '000201' + campo26 + '5204000053039865802BR59' + String(nome.length).padStart(2, '0') + nome + '60' + String(cidade.length).padStart(2, '0') + cidade + '62070503***54' + String(valorStr.length).padStart(2, '0') + valorStr + '6304';
        
        function calculaCRC16(payload) {
            let polinomio = 0x1021; let res = 0xFFFF; let dados = new TextEncoder().encode(payload);
            for (let i = 0; i < dados.length; i++) { res ^= (dados[i] << 8); for (let j = 0; j < 8; j++) res = ((res << 1) ^ polinomio) & 0xFFFF; else res = (res << 1) & 0xFFFF; }
            return res.toString(16).toUpperCase().padStart(4, '0');
        }
        return payloadSemCrc + calculaCRC16(payloadSemCrc);
    }
}

async function buscarProposta() {
    const cpf = document.getElementById('cpfConsulta').value.replace(/\D/g,'');
    const aviso = document.getElementById('avisoErro');
    aviso.classList.add('oculto');

    if(cpf.length !== 11) {
        aviso.textContent = `⚠️ CPF tem ${cpf.length} números — precisa de 11 dígitos!`;
        aviso.classList.remove('oculto');
        return;
    }

    document.getElementById('areaConsulta').classList.add('hidden');
    document.getElementById('conteudoProposta').innerHTML = `<div class="loading"><i class="fas fa-spinner fa-spin text-2xl"></i><br>Carregando sua proposta...</div>`;
    document.getElementById('conteudoProposta').classList.remove('hidden');

    const {data, error} = await supabase.from('propostas').select('*').eq('cpf',cpf).single();
    if(error || !data) {
        document.getElementById('conteudoProposta').innerHTML = `<div class="card text-center"><i class="fas fa-exclamation-circle text-red-500 text-3xl"></i><br>Proposta não encontrada.</div>`;
        return;
    }

    dadosProposta = data;
    await montarTela(data);
    ativarTempoReal(cpf);
}

async function montarTela(p) {
    const v = Number(p.valor_desejado || 0);
    const e = Number(p.valor_entrada || 0);
    const j = Number(p.juros_mensal || 5);
    const q = Number(p.quantidade_parcelas || 1);
    const qtdEscolhidaFinal = Number(p.qtd_parcelas_escolhida || q);
    const total = v * (1 + j / 100);
    const dias = p.dias_entrega || 7;
    const datas = p.datas_parcelas || [];
    const pagas = Number(p.parcelas_pagas || 0);

    let passo = 1;
    if(p.status === 'Aprovada') passo = 2;
    if(p.contrato_assinado) passo = 3;
    if(p.entrada_paga) passo = 4;

    let html = `
    <div class="card">
        <h2 class="text-xl font-bold text-primary mb-2 text-center">Olá, ${p.nome || 'Cliente'}!</h2>
        <p class="mb-3 text-center">Sua proposta está: <strong class="${p.status==='Aprovada'?'text-green-600':'text-orange-500'}">${p.status}</strong></p>

        <div class="progresso">
            <div class="passo ${passo>=1?'concluido':''}"><div class="bolinha">${passo>1?'✓':'1'}</div><span>Proposta</span></div>
            <div class="passo ${passo>=2?(passo>2?'concluido':'ativo'):''}"><div class="bolinha">${passo>2?'✓':'2'}</div><span>Aprovada</span></div>
            <div class="passo ${passo>=3?(passo>3?'concluido':'ativo'):''}"><div class="bolinha">${passo>3?'✓':'3'}</div><span>Contrato</span></div>
            <div class="passo ${passo>=4?'ativo':''}"><div class="bolinha">4</div><span>Pagamento</span></div>
        </div>

        ${p.status === 'Aprovada' ? `
        <div class="aviso-entrega">
            <i class="fas fa-truck"></i> 🚚 AVISO IMPORTANTE:<br>
            A ENTREGA SERÁ FEITA EM ATÉ <span class="text-2xl">${dias}</span> DIAS ÚTEIS APÓS CONFIRMAÇÃO DO PAGAMENTO!
        </div>` : ''}

        <div class="bg-gray-50 p-3 rounded-lg mb-3">
            <p><strong>👤 Cliente:</strong> ${p.nome}</p>
            <p><strong>📄 CPF:</strong> ${String(p.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')}</p>
            <p><strong>📱 WhatsApp:</strong> ${p.whatsapp || 'Não informado'}</p>
            <p><strong>🏠 Endereço:</strong> ${p.endereco || 'Não informado'}</p>
            <hr class="my-2 border-gray-300">
            <p><strong>Valor do pedido:</strong> R$ ${v.toLocaleString('pt-BR', 2)}</p>
            <p><strong>Entrada:</strong> R$ ${e.toLocaleString('pt-BR', 2)}</p>
            <p><strong>Quantidade de parcelas:</strong> ${qtdEscolhidaFinal}x</p>
            <p><strong>Total com juros:</strong> R$ ${total.toLocaleString('pt-BR', 2)}</p>
        </div>
    `;

    if(p.status === 'Nova' || p.status === 'Em Análise') {
        html += `<div class="text-center p-4 bg-yellow-50 rounded-lg"><i class="fas fa-clock text-yellow-500 text-2xl mb-2"></i><p class="font-semibold">Aguardando análise da proposta...</p></div>`;
    }

    if(p.status === 'Aprovada' && !p.contrato_assinado && !p.entrada_paga) {
        html += `
        <div class="card">
            <h3 class="font-bold text-lg mb-2 text-center">Escolha a quantidade de parcelas:</h3>
            <select id="qtdParcelas" class="w-full p-3 border rounded-lg mb-3">
                ${Array.from({length: q}, (_, i) => {
                    const n = i + 1;
                    const val = ((total - e) * (Math.pow(1 + j/100, n) * (j/100)) / (Math.pow(1 + j/100, n) - 1));
                    return `<option value="${n}">${n}x de R$ ${val.toLocaleString('pt-BR', 2)}</option>`;
                }).join('')}
            </select>
            <button onclick="abrirContrato()" class="btn btn-success">✅ Continuar para o Contrato</button>
        </div>

        <div id="blocoContrato" class="oculto">
            <h3 class="font-bold text-lg mb-2 text-center">📄 Termos do Contrato</h3>
            <div class="texto-contrato">
                <strong>CONTRATO DE CRÉDITO E COMPRA</strong><br><br>
                Partes: FlashCred e ${p.nome}.<br>
                Valor total: R$ ${total.toLocaleString('pt-BR', 2)}<br>
                Entrada: R$ ${e.toLocaleString('pt-BR', 2)}<br>
                Prazo de entrega: ${dias} dias úteis após confirmação do pagamento.<br><br>
                Ao assinar, o cliente declara estar ciente e de acordo com todos os valores, condições e encargos contratados.
            </div>
            <label class="flex items-center gap-2 mb-3 font-medium">
                <input type="checkbox" id="aceitoContrato"> Li e aceito todos os termos do contrato
            </label>
            <button onclick="mostrarOpcoesAssinatura()" class="btn btn-primary">✍️ Assinar Contrato</button>

            <div id="opcoesAssinatura" class="oculto mt-4">
                <p class="font-semibold mb-2 text-center">Escolha como assinar:</p>
                <button onclick="mostrarAssinaturaTexto()" class="btn btn-success mb-2">✍️ Escrever Assinatura</button>
                <button onclick="abrirCamera()" class="btn btn-cam">📸 Tirar Foto do Rosto</button>

                <div id="areaAssinaturaTexto" class="oculto mt-3">
                    <input type="text" id="assinaturaTexto" class="campo-assinatura" placeholder="Digite seu nome completo como assinatura">
                    <button onclick="confirmarAssinatura()" class="btn btn-success mt-2">✅ Confirmar Assinatura</button>
                </div>

                <div id="areaCamera" class="area-cam oculto mt-3">
                    <video id="videoCam" autoplay playsinline></video>
                    <button onclick="tirarFoto()" class="btn btn-success mt-2">📸 Confirmar</button>
                </div>
            </div>
        </div>`;
    }

    if(p.contrato_assinado && !p.entrada_paga) {
        html += `
        <div class="card text-center">
            <div class="text-green-600 text-xl font-bold mb-3"><i class="fas fa-check-circle"></i> CONTRATO ASSINADO COM SUCESSO!</div>
            <p class="mb-3">Sua entrada é no valor de <strong>R$ ${e.toLocaleString('pt-BR', 2)}</strong>.</p>
            <button onclick="carregarPixEntrada(${e})" class="btn btn-pix mb-3"><i class="fas fa-qrcode"></i> Pagar / Gerar Pix da Entrada</button>
            <div id="areaPixGerado" class="oculto">
                <div class="qrcode-pix" id="qrcode-pix"></div>
                <div class="chave-pix">
                    <strong>Chave Pix Gerada</strong><br>
                    <small>Sistema Seguro FlashCred</small>
                </div>
                <button id="btnCopiarPix" class="btn btn-pix">📋 Copiar Código Pix</button>
            </div>
            <p class="text-sm mt-2">Assim que o pagamento for confirmado, nós seremos avisados automaticamente e você verá suas parcelas aqui.</p>
        </div>`;
    }

    if(p.entrada_paga) {
        html += `
        <div class="card text-center">
            <div class="text-green-600 text-xl font-bold mb-3"><i class="fas fa-check-double"></i> PAGAMENTO CONFIRMADO!</div>
            <p class="mb-4">Sua entrada foi paga com sucesso! Abaixo todos os detalhes do seu contrato e parcelas:</p>
            
            <h3 class="font-bold text-lg mb-2 text-primary">📋 CRONOGRAMA DE PAGAMENTO</h3>
            ${Array.from({length: qtdEscolhidaFinal}, (_, i) => {
                const n = i + 1;
                const dt = datas[i] ? new Date(datas[i]).toLocaleDateString('pt-BR') : 'A definir';
                const ok = n <= pagas;
                const valorParcela = ((total - e) * (Math.pow(1 + j/100, qtdEscolhidaFinal) * (j/100)) / (Math.pow(1 + j/100, qtdEscolhidaFinal) - 1));
                return `<div class="item-parcela" style="flex-direction: column; align-items: stretch; gap: 8px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span><strong>${n}ª Parcela</strong> • R$ ${valorParcela.toLocaleString('pt-BR', 2)} • Venc: ${dt}</span>
                        <span class="font-bold ${ok?'text-green-600':'text-orange-500'}">${ok?'PAGA':'PENDENTE'}</span>
                    </div>
                    ${!ok ? `<button onclick="pagarParcela(${n}, ${valorParcela})" class="btn btn-pix" style="padding: 8px; font-size: 14px; margin: 0;"><i class="fas fa-qrcode"></i> Gerar Pix / Pagar</button>` : ''}
                </div>`;
            }).join('')}

            <div id="areaPixParcelaGerado" class="oculto mt-4">
                <div class="qrcode-pix" id="qrcode-pix-parcela"></div>
                <div class="chave-pix">
                    <strong>Pix da Parcela Gerado</strong><br>
                    <small>Sistema Seguro FlashCred</small>
                </div>
                <button id="btnCopiarPixParcela" class="btn btn-pix">📋 Copiar Código Pix</button>
            </div>
        </div>`;
    }

    html += `
        <div class="mt-4">
            <a href="https://wa.me/5511973294235?text=Olá, preciso de suporte sobre minha proposta CPF: ${p.cpf}" target="_blank" class="btn" style="background:#25D366;color:white;">
                <i class="fab fa-whatsapp"></i> Falar com Suporte
            </a>
            <button onclick="window.location.reload()" class="btn btn-alerta">🔄 Atualizar</button>
        </div>
    </div>`;

    document.getElementById('conteudoProposta').innerHTML = html;
}

async function carregarPixEntrada(valor) {
    const btn = event.currentTarget;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Gerando Pix...`;
    const codigo = await gerarPixViaAPI(valor, 'Pagamento Entrada FlashCred');
    document.getElementById('areaPixGerado').classList.remove('oculto');
    document.getElementById('qrcode-pix').innerHTML = '';
    new QRCode(document.getElementById("qrcode-pix"), { text: codigo, width: 220, height: 220 });
    document.getElementById('btnCopiarPix').onclick = () => { navigator.clipboard.writeText(codigo); alert('Código copiado! ✅'); };
    btn.classList.add('oculto');
}

async function pagarParcela(numParcela, valor) {
    const btn = event.currentTarget;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Gerando Pix...`;
    const codigo = await gerarPixViaAPI(valor, `${numParcela}ª Parcela FlashCred`);
    document.getElementById('areaPixParcelaGerado').classList.remove('oculto');
    document.getElementById('qrcode-pix-parcela').innerHTML = '';
    new QRCode(document.getElementById("qrcode-pix-parcela"), { text: codigo, width: 220, height: 220 });
    document.getElementById('btnCopiarPixParcela').onclick = () => { navigator.clipboard.writeText(codigo); alert('Código copiado! ✅'); };
}

function abrirContrato() {
    if(!document.getElementById('qtdParcelas').value) { alert('Escolha a quantidade de parcelas!'); return; }
    qtdEscolhida = Number(document.getElementById('qtdParcelas').value);
    dadosProposta.qtd_parcelas_escolhida = qtdEscolhida;
    document.getElementById('blocoContrato').classList.remove('oculto');
}
function mostrarOpcoesAssinatura() { if(!document.getElementById('aceitoContrato').checked) { alert('Aceite os termos do contrato!'); return; } document.getElementById('opcoesAssinatura').classList.remove('oculto'); }
function mostrarAssinaturaTexto() { document.getElementById('areaAssinaturaTexto').classList.remove('oculto'); document.getElementById('areaCamera').classList.add('oculto'); }
async function abrirCamera() { document.getElementById('areaCamera').classList.remove('oculto'); document.getElementById('areaAssinaturaTexto').classList.add('oculto'); try { streamCam = await navigator.mediaDevices.getUserMedia({video:true}); document.getElementById('videoCam').srcObject = streamCam; } catch { alert('Não foi possível acessar a câmera, use a assinatura por texto.'); } }
async function tirarFoto() { if(!streamCam) return; const c = document.createElement('canvas'); c.width=400; c.height=300; c.getContext('2d').drawImage(document.getElementById('videoCam'),0,0); const foto = c.toDataURL('image/png'); streamCam.getTracks().forEach(t=>t.stop()); await supabase.from('propostas').update({contrato_assinado:true, foto_assinatura:foto}).eq('id',dadosProposta.id); await buscarProposta(); }
async function confirmarAssinatura() { const a = document.getElementById('assinaturaTexto').value.trim(); if(!a) { alert('Digite sua assinatura!'); return; } await supabase.from('propostas').update({contrato_assinado:true, assinatura_texto:a}).eq('id',dadosProposta.id); await buscarProposta(); }

function ativarTempoReal(cpf) {
    if(inscricao) supabase.removeChannel(inscricao);
    inscricao = supabase.channel(`proposta_${cpf}`)
    .on('postgres_changes', {event:'*',schema:'public',table:'propostas',filter:`cpf=eq.${cpf}`}, ()=>buscarProposta()).subscribe();
}
</script>
</body>
</html>
