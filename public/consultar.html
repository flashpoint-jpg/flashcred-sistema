<style>

<body>

<div class="app">

                <div class="text-xs opacity-70">

<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        realtime:true
    }
);


/* ==========================================================
   VARIÁVEIS
========================================================== */

let propostaAtual = null;
let canalRealtime = null;
let webcamStream = null;
let modoAssinatura = 'texto';


/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

document.addEventListener(
    'DOMContentLoaded',
    iniciar
);


async function iniciar() {

    const cpf =
        localStorage.getItem(
            'flashcred_cpf'
        );

    const id =
        localStorage.getItem(
            'flashcred_proposta_id'
        );


    document
        .getElementById('cpfConsulta')
        .addEventListener(
            'keydown',
            function(e) {

                if(e.key === 'Enter') {
                    executarConsulta();
                }

            }
        );


    if(cpf) {

        document
            .getElementById(
                'cpfConsulta'
            )
            .value = cpf;

        await executarConsulta(cpf);

        return;
    }


    if(id) {

        await carregarPorId(id);

    }

}


/* ==========================================================
   NORMALIZA CPF
========================================================== */

function limparCPF(valor) {

    return String(valor || '')
        .replace(/\D/g,'')
        .slice(0,11);

}


/* ==========================================================
   CONSULTAR
========================================================== */

async function executarConsulta(
    cpfInformado = null
) {

    let cpf =
        cpfInformado ||
        document
            .getElementById(
                'cpfConsulta'
            )
            .value;


    cpf = limparCPF(cpf);


    if(cpf.length !== 11) {

        mostrarErroConsulta(
            'Digite os 11 números do CPF.'
        );

        return;
    }


    const botao =
        document.getElementById(
            'btnConsultar'
        );


    esconderErroConsulta();


    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';


    try {

        const resposta =
            await supabase
                .from('propostas')
                .select('*')
                .eq('cpf',cpf)
                .order(
                    'created_at',
                    {
                        ascending:false
                    }
                )
                .limit(1);


        if(resposta.error)
            throw resposta.error;


        if(
            !resposta.data ||
            resposta.data.length === 0
        ) {

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );

        }


        propostaAtual =
            resposta.data[0];


        salvarSessao();


        abrirProposta();


        configurarRealtime();


    } catch(error) {

        console.error(
            'Erro consulta:',
            error
        );


        mostrarErroConsulta(
            error.message ||
            'Não foi possível consultar a proposta.'
        );


    } finally {

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';

    }

}


/* ==========================================================
   CARREGAR POR ID
========================================================== */

async function carregarPorId(id) {

    try {

        const resposta =
            await supabase
                .from('propostas')
                .select('*')
                .eq('id',id)
                .maybeSingle();


        if(resposta.error)
            throw resposta.error;


        if(!resposta.data) {

            limparSessao();

            return;

        }


        propostaAtual =
            resposta.data;


        salvarSessao();


        abrirProposta();


        configurarRealtime();


    } catch(error) {

        console.error(
            error
        );

        limparSessao();

    }

}


/* ==========================================================
   SESSÃO
========================================================== */

function salvarSessao() {

    if(!propostaAtual)
        return;


    localStorage.setItem(
        'flashcred_proposta_id',
        propostaAtual.id
    );


    if(propostaAtual.cpf) {

        localStorage.setItem(
            'flashcred_cpf',
            limparCPF(
                propostaAtual.cpf
            )
        );

    }

}


function limparSessao() {

    localStorage.removeItem(
        'flashcred_proposta_id'
    );

    localStorage.removeItem(
        'flashcred_cpf'
    );

}


/* ==========================================================
   REALTIME
========================================================== */

function configurarRealtime() {

    if(!propostaAtual)
        return;


    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;

    }


    canalRealtime =
        supabase
            .channel(
                'flashcred-proposta-' +
                propostaAtual.id
            )
            .on(
                'postgres_changes',
                {
                    event:'*',
                    schema:'public',
                    table:'propostas',
                    filter:
                        `id=eq.${propostaAtual.id}`
                },
                function(payload) {

                    if(
                        payload.eventType ===
                        'DELETE'
                    ) {

                        return;

                    }


                    if(
                        payload.new
                    ) {

                        propostaAtual =
                            payload.new;


                        salvarSessao();


                        mostrarProposta(
                            propostaAtual
                        );

                    }

                }
            )
            .subscribe();

}


/* ==========================================================
   ABRIR
========================================================== */

function abrirProposta() {

    document
        .getElementById(
            'telaConsulta'
        )
        .classList.add(
            'hidden'
        );


    document
        .getElementById(
            'telaProposta'
        )
        .classList.remove(
            'hidden'
        );


    mostrarProposta(
        propostaAtual
    );

}


/* ==========================================================
   VOLTAR
========================================================== */

function voltarInicio() {

    pararCamera();


    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;

    }


    propostaAtual = null;


    limparSessao();


    document
        .getElementById(
            'telaProposta'
        )
        .classList.add(
            'hidden'
        );


    document
        .getElementById(
            'telaConsulta'
        )
        .classList.remove(
            'hidden'
        );


    document
        .getElementById(
            'cpfConsulta'
        )
        .value = '';

}


/* ==========================================================
   ERROS
========================================================== */

function mostrarErroConsulta(
    mensagem
) {

    const el =
        document.getElementById(
            'erroConsulta'
        );


    el.innerHTML =
        '<i class="fas fa-circle-exclamation"></i> ' +
        escapar(mensagem);


    el.classList.remove(
        'hidden'
    );

}


function esconderErroConsulta() {

    document
        .getElementById(
            'erroConsulta'
        )
        .classList.add(
            'hidden'
        );

}


/* ==========================================================
   FORMATAÇÕES
========================================================== */

function moeda(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


function numero(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        'pt-BR',
        {
            maximumFractionDigits:2
        }
    );

}


function escapar(valor) {

    return String(
        valor ?? ''
    )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function dataBR(valor) {

    if(!valor)
        return 'Não informado';


    const d =
        new Date(valor);


    if(
        Number.isNaN(
            d.getTime()
        )
    )
        return String(valor);


    return d.toLocaleDateString(
        'pt-BR'
    );

}


/* ==========================================================
   PEGAR CAMPO ALTERNATIVO
========================================================== */

function campo(
    objeto,
    nomes,
    padrao = ''
) {

    for(
        const nome of nomes
    ) {

        if(
            objeto &&
            objeto[nome] !== null &&
            objeto[nome] !== undefined &&
            objeto[nome] !== ''
        ) {

            return objeto[nome];

        }

    }


    return padrao;

}


/* ==========================================================
   STATUS
========================================================== */

function statusNormalizado(p) {

    return String(
        campo(
            p,
            [
                'status',
                'situacao',
                'status_proposta'
            ],
            ''
        )
    )
    .trim()
    .toLowerCase();

}


function isAprovada(p) {

    const s =
        statusNormalizado(p);


    return [
        'aprovada',

}

                'entrada_pago'

function isAssinado(p) {

/* ==========================================================
   ETAPA
========================================================== */

function determinarEtapa(p) {

    if(!p)
        return 1;


    if(!isAprovada(p))
        return 1;


    const parcelas =
        Number(
            campo(
                p,
                [
                    'qtd_parcelas_escolhida',
                    'parcelas_escolhidas'
                ],
                0
            )
        );


    if(!parcelas)
        return 2;


    if(!isAssinado(p))
        return 3;


    if(!isPaga(p))
        return 4;


    return 5;

}

}


/* ==========================================================
   CÁLCULO DE PARCELA
========================================================== */

function calcularParcela(
    principal,
    juros,
    quantidade
) {

    principal =
        Number(principal || 0);


    juros =
        Number(juros || 0) / 100;


    quantidade =
        Number(quantidade || 0);


    if(
        principal <= 0 ||
        quantidade <= 0
    )
        return 0;


    if(juros === 0)
        return principal / quantidade;


    const fator =
        Math.pow(
            1 + juros,
            quantidade
        );


    return (
        principal *
        fator *
        juros
    ) /
    (
        fator - 1
    );

}


/* ==========================================================
   DIAS ÚTEIS
========================================================== */

function adicionarDiasUteis(
    dataInicial,
    quantidade
) {

    const data =
        new Date(
            dataInicial
        );


    if(
        Number.isNaN(
            data.getTime()
        )
    )
        return null;


    let adicionados = 0;


    while(
        adicionados <
        Number(
            quantidade || 0
        )
    ) {

        data.setDate(
            data.getDate() + 1
        );


        const dia =
            data.getDay();


        if(
            dia !== 0 &&
            dia !== 6
        ) {

            adicionados++;

        }

    }


    return data;

}


function contarDiasUteis(
    inicio,
    fim
) {

    const a =
        new Date(inicio);


    const b =
        new Date(fim);


    a.setHours(
        0,0,0,0
    );

    b.setHours(
        0,0,0,0
    );


    if(a >= b)
        return 0;


    let total = 0;


    while(a < b) {

        a.setDate(
            a.getDate() + 1
        );


        const dia =
            a.getDay();


        if(
            dia !== 0 &&
            dia !== 6
        ) {

            total++;

        }

    }


    return total;

}


/* ==========================================================
   ENTREGA
========================================================== */

function calcularEntrega(p) {

    const dias =
        Number(
            campo(
                p,
                [
                    'dias_entrega',
                    'prazo_entrega',
                    'dias_uteis_entrega'
                ],
                0
            )
        );


    if(!dias) {

        return {
            dias,
            inicio:null,
            fim:null,
            restantes:null,
            progresso:0
        };

    }


    const inicio =
        campo(
            p,
            [
                'data_inicio_entrega',
                'data_pagamento_entrada',
                'data_aprovacao_entrada',
                'data_inicio',
                'updated_at'
            ],
            null
        );


    if(!inicio) {

        return {
            dias,
            inicio:null,
            fim:null,
            restantes:dias,
            progresso:0
        };

    }


    const inicioData =
        new Date(inicio);


    const fim =
        adicionarDiasUteis(
            inicioData,
            dias
        );


    const hoje =
        new Date();


    let decorridos =
        contarDiasUteis(
            inicioData,
            hoje
        );


    if(decorridos < 0)
        decorridos = 0;


    if(decorridos > dias)
        decorridos = dias;


    const progresso =
        dias > 0
        ? Math.round(
            (
                decorridos /
                dias
            ) * 100
        )
        : 0;


    const restantes =
        Math.max(
            0,
            dias - decorridos
        );


    return {
        dias,
        inicio:inicioData,
        fim,
        restantes,
        progresso
    };

}

function selecionarParcelaVisual(

/* ==========================================================
   CONFIRMAR PARCELAS
========================================================== */

async function confirmarParcelas() {

    const radio =
        document.querySelector(
            'input[name="parcelas"]:checked'
        );


    if(!radio) {

        alert(
            'Selecione uma quantidade de parcelas.'
        );

        return;

    }


    const quantidade =
        Number(
            radio.value
        );


    try {

        const resposta =
            await supabase
                .from('propostas')
                .update({
                    qtd_parcelas_escolhida:
                        quantidade
                })
                .eq(
                    'id',
                    propostaAtual.id
                );


        if(resposta.error)
            throw resposta.error;


        propostaAtual.qtd_parcelas_escolhida =
            quantidade;


        salvarSessao();


        mostrarProposta(
            propostaAtual
        );


    } catch(error) {

        console.error(error);

        alert(
            'Não foi possível salvar a escolha das parcelas.'
        );

    }

}

/* ==========================================================
   ASSINATURA
========================================================== */

function iniciarAssinatura() {

    modoAssinatura = 'texto';

    atualizarModoAssinatura();

}


function alternarModo(
    modo
) {

    modoAssinatura =
        modo === 'selfie'
        ? 'selfie'
        : 'texto';


    atualizarModoAssinatura();


    if(
        modoAssinatura ===
        'selfie'
    ) {

        iniciarCamera();

    } else {

        pararCamera();

    }

}


function atualizarModoAssinatura() {

    const texto =
        document.getElementById(
            'areaAssinaturaTexto'
        );


    const selfie =
        document.getElementById(
            'areaAssinaturaSelfie'
        );


    if(!texto || !selfie)
        return;


    texto.classList.toggle(
        'hidden',
        modoAssinatura !== 'texto'
    );


    selfie.classList.toggle(
        'hidden',
        modoAssinatura !== 'selfie'
    );

}


/* ==========================================================
   CAMERA
========================================================== */

async function iniciarCamera() {

    try {

        pararCamera();


        webcamStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    video:true
                });


        const video =
            document.getElementById(
                'vid'
            );


        if(video)
            video.srcObject =
                webcamStream;


    } catch(error) {

        alert(
            'Não foi possível acessar a câmera. Você pode usar a assinatura por nome.'
        );


        alternarModo(
            'texto'
        );

    }

}


function pararCamera() {

    if(
        webcamStream
    ) {

        webcamStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        webcamStream = null;

    }

}


function tirarFoto() {

    const video =
        document.getElementById(
            'vid'
        );


    if(
        !video ||
        !video.videoWidth
    ) {

        alert(
            'A câmera ainda não está pronta.'
        );

        return;

    }


    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext(
            '2d'
        );


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const imagem =
        canvas.toDataURL(
            'image/jpeg',
            .85
        );


    document
        .getElementById(
            'imgSelfie'
        )
        .src = imagem;


    document
        .getElementById(
            'previewFoto'
        )
        .classList.remove(
            'hidden'
        );


    pararCamera();

}


function refazerFoto() {

    document
        .getElementById(
            'previewFoto'
        )
        .classList.add(
            'hidden'
        );


    iniciarCamera();

}


/* ==========================================================
   SALVAR ASSINATURA
========================================================== */

async function assinarContrato() {

    const aceite =
        document.getElementById(
            'aceitoContrato'
        );


    if(
        !aceite ||
        !aceite.checked
    ) {

        alert(
            'Marque que você leu e concorda com o contrato.'
        );

        return;

    }


    let assinatura = '';


    if(
        modoAssinatura ===
        'texto'
    ) {

        assinatura =
            document
                .getElementById(
                    'assTxt'
                )
                .value
                .trim();


        if(
            assinatura.length < 3
        ) {

            alert(
                'Digite seu nome completo para assinar.'
            );

            return;

        }

    } else {

        assinatura =
            document
                .getElementById(
                    'imgSelfie'
                )
                .src;


        if(
            !assinatura ||
            assinatura ===
            window.location.href
        ) {

            alert(
                'Capture a selfie antes de assinar.'
            );

            return;

        }

    }


    try {

        const resposta =
            await supabase
                .from('propostas')
                .update({

                    contrato_assinado:true,

                    assinatura:assinatura,

                    data_assinatura:
                        new Date()
                            .toISOString()

                })
                .eq(
                    'id',
                    propostaAtual.id
                );


        if(resposta.error)
            throw resposta.error;


        propostaAtual.contrato_assinado =
            true;


        propostaAtual.assinatura =
            assinatura;


        propostaAtual.data_assinatura =
            new Date().toISOString();


        salvarSessao();


        pararCamera();


        mostrarProposta(
            propostaAtual
        );


    } catch(error) {

        console.error(error);

        alert(
            'Não foi possível registrar a assinatura.'
        );

    }

}

/* ==========================================================
   API PIX
========================================================== */

async function buscarPix(
    valor,
    descricao
) {

    /*
     * MANTIDO O MESMO ENDPOINT
     * QUE VOCÊ JÁ UTILIZA.
     */

    const resposta =
        await fetch(
            '/api/gerar-pix',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json'
                },

                body:JSON.stringify({

                    valor:
                        Number(valor)
                            .toFixed(2),

                    descricao:
                        descricao

                })

            }
        );


    if(!resposta.ok) {

        let mensagem =
            'Erro ao gerar Pix';


        try {

            const erro =
                await resposta.json();


            mensagem =
                erro.message ||
                erro.error ||
                mensagem;

        } catch(e) {}


        throw new Error(
            mensagem
        );

    }


    const dados =
        await resposta.json();


    return (
        dados.qr_code ||
        dados.copia_cola ||
        dados.pixCopiaECola ||
        dados.codigo ||
        dados.qrCode ||
        dados.payload
    );

}

function montarPagamentoConfirmado(
    p,
    valor,
    entrada,
    juros,
    quantidade,
    total
) {

    const principal =
        Math.max(
            0,
            valor - entrada
        );


    const parcela =
        calcularParcela(
            principal,
            juros,
            quantidade
        );


    const entrega =
        calcularEntrega(
            p
        );


    const quantidadePagas =
        Number(
            campo(
                p,
                [
                    'parcelas_pagas',
                    'qtd_parcelas_pagas'

                0

    let html = `

            </p>

            entrega.progresso || 0;

            percentual >= 100;


        html += `

                    </div>


                    <div class="entrega-info">

                        <span>

                                entrega.inicio
                                ? dataBR(entrega.inicio)
                                : 'Aguardando'

                                entrega.fim

                                  dataBR(entrega.fim)
                                : ''
                            }

                </div>

    /* RESUMO */

    html += `

                    Valor de cada parcela
                </span>

                <span class="value">
                    R$ ${moeda(parcela)}
                </span>

            </div>

    html += `

            <h3 class="font-bold text-lg mb-3">

                    target="_blank"
                    class="btn"
                    style="background:#25D366;color:white;"
                >

                    <i class="fab fa-whatsapp"></i>

                    Falar com o suporte

                </a>

            </div>

        `;

    }


    return html;

}


/* ==========================================================
   DATAS DAS PARCELAS
========================================================== */

function obterDatasParcelas(
    p,
    quantidade
) {

    const informadas =
        campo(
            p,
            [
                'datas_parcelas',
                'vencimentos',
                'datas_vencimento'
            ],
            []
        );


    if(
        Array.isArray(
            informadas
        ) &&
        informadas.length >= quantidade
    ) {

        return informadas;

    }


    const datas = [];


    const inicio =
        new Date(
            campo(
                p,
                [
                    'data_pagamento_entrada',
                    'data_aprovacao_entrada',
                    'updated_at'
                ],
                new Date()
            )
        );


    for(
        let i=1;
        i<=quantidade;
        i++
    ) {

        const d =
            new Date(
                inicio
            );


        d.setMonth(
            d.getMonth() + i
        );


        datas.push(
            d.toISOString()
                .split('T')[0]
        );

    }


    return datas;

}


/* ==========================================================
   CPF
========================================================== */

function formatarCPF(
    cpf
) {

    const n =
        limparCPF(cpf);


    if(n.length !== 11)
        return escapar(
            cpf || 'Não informado'
        );


    return (
        n.substring(0,3) +
        '.' +
        n.substring(3,6) +
        '.' +
        n.substring(6,9) +
        '-' +
        n.substring(9,11)
    );

}


/* ==========================================================
   CEP
========================================================== */

function formatarCEP(
    cep
) {

    const n =
        String(
            cep || ''
        )
        .replace(
            /\D/g,
            ''
        );


    if(n.length !== 8)
        return escapar(
            cep || 'Não informado'
        );


    return (
        n.substring(0,5) +
        '-' +
        n.substring(5)
    );

}
