<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        .contrato {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.7;
        }
        .contrato h3 {
            text-align: center;
            color: #0A2463;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid #0A2463;
            padding-bottom: 10px;
        }
        .contrato .linha { margin: 8px 0; }
        .contrato .destaque { font-weight: 600; color: #0A2463; }
        .assinatura-area {
            border: 2px dashed #94a3b8;
            border-radius: 8px;
            height: 120px;
            margin: 16px 0;
            position: relative;
            background: #fafafa;
            touch-action: none;
        }
        .assinatura-canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .parcelas-tabela {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        .parcelas-tabela th {
            background: #f1f5f9;
            padding: 10px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .parcelas-tabela td {
            padding: 10px;
            border-top: 1px solid #e2e8f0;
        }
        .parcela-paga { color: #10B981; font-weight: 600; }
        .parcela-pendente { color: #f59e0b; font-weight: 600; }
        .parcela-verde { border-left: 4px solid #22C55E; }
        .parcela-amarela { border-left: 4px solid #F59E0B; }
        .parcela-vermelha { border-left: 4px solid #EF4444; }
        .pix-copia {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 12px;
            word-break: break-all;
            font-size: 12px;
            color: #166534;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pix-copia:hover { background: #dcfce7; }
        .pagamento-entrada {
            border: 2px solid #32BCAD;
            border-radius: 12px;
            padding: 20px;
            background: #f0fdfa;
        }
        .oculto { display: none !important; }
        .qrcode-box {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 12px;
            margin: 12px 0;
        }
        .aviso {
            background: #FEF3C7;
            border-left: 3px solid #F59E0B;
            padding: 10px 14px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 14px;
        }
        .botao {
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            margin: 6px 0;
            font-size: 15px;
            transition: all 0.2s;
        }
        .botao-principal { background: #0A2463; color: white; }
        .botao-principal:hover { background: #0c3499; }
        .botao-sucesso { background: #10B981; color: white; }
        .botao-sucesso:hover { background: #059669; }
        .botao-pix { background: #32BCAD; color: white; }
        .botao-pix:hover { background: #0d9488; }
        .botao:disabled { opacity: 0.5; cursor: not-allowed; }
        .copia-nota {
            font-size: 12px;
            color: #166534;
            margin-top: 6px;
        }
        .lido-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
            padding: 10px;
            background: #EFF6FF;
            border-radius: 8px;
        }
        .lido-check input { width: 20px; height: 20px; cursor: pointer; }
        .lido-check label { font-weight: 600; color: #1E40AF; cursor: pointer; }
        @media print {
            body * { visibility: hidden; }
            .contrato, .contrato * { visibility: visible; }
            .contrato { position: absolute; left: 0; top: 0; width: 100%; border: none; }
            .nao-imprimir { display: none !important; }
        }
    </style>
</head>
<body class="bg-fundo text-slate-700 min-h-screen">

<div class="max-w-2xl mx-auto p-4">
    <h1 class="text-[clamp(1.5rem,4vw,1.8rem)] font-bold text-primary mb-6 text-center">🔍 Consultar Proposta</h1>

    <div id="telaConsulta" class="bg-white rounded-xl shadow p-6 mb-6">
        <label class="block font-semibold text-sm text-slate-500 mb-2">Digite seu CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" 
            class="w-full p-3 border border-slate-200 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
        <button onclick="consultar()" class="botao botao-principal mt-4">
            Consultar
        </button>
    </div>

    <div id="resultado" class="hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CHAVE_PIX_FIXA = '33552949852';
const NOME_RECEBEDOR = 'FLASH POINT';

let proposta = null;
let assinaturaCanvas = null;
let assinaturaCtx = null;
let assinando = false;
let assinaturaFeita = false;

function formatarCPF(cpf) {
    cpf = cpf.replace(/\D/g, '');
    return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
}

function formatarData(data) {
    if (!data) return '---';
    const d = new Date(data);
    return d.toLocaleDateString('pt-BR');
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function calcularCorVencimento(dataVenc) {
    if (!dataVenc) return 'parcela-verde';
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const ven = new Date(dataVenc); ven.setHours(0,0,0,0);
    const dias = Math.ceil((ven - hoje) / (1000*60*60*24));
    if (dias < 0) return 'parcela-vermelha';
    if (dias <= 7) return 'parcela-vermelha';
    if (dias <= 14) return 'parcela-amarela';
    return 'parcela-verde';
}

function gerarCodigoPix(valor, descricao = 'Pagamento') {
    const valorStr = Number(valor || 0).toFixed(2);
    const chave = CHAVE_PIX_FIXA;
    const nome = NOME_RECEBEDOR;
    const cidade = 'SAO PAULO';
    const txId = '***';

    function montarParte(id, conteudo) {
        const s = String(conteudo || '');
        return id + String(s.length).padStart(2, '0') + s;
    }

    const brCod = montarParte('00', 'BR-GOV.BCB.PIX') + montarParte('01', chave);
    const merConta = montarParte('00', nome) + montarParte('01', cidade);
    const valorParte = valorStr !== '0.00' ? montarParte('05', valorStr) : '';

    let payload = montarParte('00', '01')
        + montarParte('26', brCod)
        + montarParte('52', '0000')
        + montarParte('53', '986')
        + valorParte
        + montarParte('59', nome)
        + montarParte('60', cidade)
        + montarParte('62', montarParte('05', txId));

    function calcularCRC16(s) {
        let crc = 0xFFFF;
        for (let i = 0; i < s.length; i++) {
            crc ^= s.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1;
            }
        }
        return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }
    return payload + '6304' + calcularCRC16(payload + '6304');
}

async function consultar() {
    let cpf = document.getElementById('cpf').value.replace(/\D/g, '');
    if (cpf.length !== 11) { alert('⚠️ Digite um CPF válido com 11 dígitos!'); return; }

    document.getElementById('resultado').innerHTML = '<p class="text-center p-6 text-slate-500">🔎 Buscando proposta...</p>';
    document.getElementById('resultado').classList.remove('hidden');

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .filter('cpf', 'ilike', '%' + cpf + '%')
        .order('created_at', { ascending: false })
        .limit(1);

    if (error) {
        document.getElementById('resultado').innerHTML = `<div class="aviso">❌ Erro na busca: ${error.message}</div>`;
        return;
    }

    if (!data || data.length === 0) {
        document.getElementById('resultado').innerHTML = `<div class="aviso">⚠️ Proposta não encontrada! Verifique o CPF digitado.</div>`;
        return;
    }

    proposta = data[0];
    mostrarProposta();
}

function mostrarProposta() {
    const valorTotal = Number(proposta.valor_desejado || 0);
    const percEnt = Number(proposta.percentual_entrada || 20);
    const valorEntrada = valorTotal * percEnt / 100;
    const parcelas = proposta.lista_parcelas || [];
    const codigoPixEntrada = gerarCodigoPix(valorEntrada, 'Entrada');

    let statusTexto, statusCor;
    if (proposta.status === 'Entrada Paga') {
        statusTexto = '✅ Entrada Paga'; statusCor = 'text-green-600';
    } else if (proposta.status === 'Aprovada') {
        statusTexto = '✅ Aprovada — Aguarda Pagamento'; statusCor = 'text-blue-600';
    } else if (proposta.status === 'Reprovada') {
        statusTexto = '❌ Reprovada'; statusCor = 'text-red-600';
    } else {
        statusTexto = '⏳ Aguardando Análise'; statusCor = 'text-yellow-600';
    }

    const jaAssinou = proposta.assinatura && proposta.assinatura_assinada;
    const entradaPaga = proposta.status === 'Entrada Paga';

    let html = `
    <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-bold text-primary mb-4">📋 Proposta de ${proposta.nome}</h2>
        <p class="${statusCor} font-semibold mb-4">${statusTexto}</p>
        <p class="text-sm text-slate-500 mb-4">Código: ${proposta.codigo_unico || '---'}</p>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-slate-50 p-3 rounded-lg">
                <div class="text-xs text-slate-500">Valor Total</div>
                <div class="font-bold text-lg">${real(valorTotal)}</div>
            </div>
            <div class="bg-green-50 p-3 rounded-lg">
                <div class="text-xs text-green-600">Entrada (${percEnt}%)</div>
                <div class="font-bold text-lg text-green-700">${real(valorEntrada)}</div>
            </div>
        </div>`;

    if (!entradaPaga && proposta.status === 'Aprovada') {
        html += `
        <div class="pagamento-entrada">
            <h3 class="text-lg font-bold text-pix mb-4 text-center">💳 PAGAMENTO DA ENTRADA</h3>
            <p class="text-center font-semibold mb-2">Valor: ${real(valorEntrada)}</p>
            
            <div class="qrcode-box">
                <div id="qrcode-entrada"></div>
                <p class="text-sm text-slate-500 mt-2">📱 Escaneie ou copie o código abaixo</p>
            </div>

            <div class="pix-copia" onclick="copiarPix('${codigoPixEntrada}')">
                <strong>Chave Pix:</strong> ${CHAVE_PIX_FIXA}<br>
                <span class="copia-nota">👆 Clique para copiar o código Pix</span>
            </div>
        </div>

        <div class="lido-check">
            <input type="checkbox" id="liContrato" onchange="verificarLido()">
            <label for="liContrato">Declaro que li e concordo com o contrato abaixo</label>
        </div>

        <div id="areaAssinatura" class="oculto">
            <p class="font-semibold text-sm text-slate-600 mb-2">✍️ Assine abaixo:</p>
            <div class="assinatura-area">
                <canvas id="assinaturaCanvas" class="assinatura-canvas"></canvas>
            </div>
            <div class="flex gap-3 mt-2">
                <button onclick="limparAssinatura()" class="botao bg-slate-200 text-slate-700 flex-1">Limpar</button>
                <button onclick="confirmarAssinatura()" id="btnConfirmarAssinatura" class="botao botao-sucesso flex-1" disabled>Confirmar Assinatura</button>
            </div>
        </div>`;
    }

    if (entradaPaga && parcelas.length > 0) {
        html += `
        <h3 class="text-lg font-bold text-primary mt-6 mb-4">📊 Suas Parcelas</h3>
        <table class="parcelas-tabela">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Vencimento</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>`;
        parcelas.forEach(p => {
            const cor = calcularCorVencimento(p.vencimento);
            html += `
            <tr class="${cor}">
                <td>${p.numero}</td>
                <td>${formatarData(p.vencimento)}</td>
                <td>${real(p.valor)}</td>
                <td class="${p.status === 'Paga' ? 'parcela-paga' : 'parcela-pendente'}">
                    ${p.status === 'Paga' ? '✅ Paga' : '⏳ Pendente'}
                </td>
            </tr>`;
        });
        html += `</tbody></table>`;
    }

    html += `
        <div class="contrato">
            <h3>📄 CONTRATO DE PRESTAÇÃO</h3>
            <p class="linha">Pelo presente instrumento, <span class="destaque">${proposta.nome}</span>, CPF ${formatarCPF(proposta.cpf || '')}, aceita as condições abaixo:</p>
            <p class="linha">1. Valor Total: <span class="destaque">${real(valorTotal)}</span></p>
            <p class="linha">2. Entrada de <span class="destaque">${percEnt}% (${real(valorEntrada)})</span> e ${parcelas.length} parcelas mensais.</p>
            <p class="linha">3. O não pagamento no vencimento implicará em multa e juros legais.</p>
            <p class="linha">4. Declaro que os dados informados são verdadeiros e autorizo a cobrança.</p>
            <p class="linha">5. A FlashCred se responsabiliza pela entrega dos móveis conforme combinado.</p>
            <p class="linha mt-6">São Paulo, ${new Date().toLocaleDateString('pt-BR')}.</p>
            <p class="linha mt-8">Assinatura: ________________________________________</p>
            <p class="linha">${proposta.nome}</p>
        </div>

        <button onclick="window.print()" class="botao botao-principal mt-4 nao-imprimir">🖨️ Imprimir Contrato</button>
    </div>`;

    document.getElementById('resultado').innerHTML = html;
    document.getElementById('resultado').classList.remove('hidden');

    if (!entradaPaga && proposta.status === 'Aprovada') {
        setTimeout(() => {
            new QRCode(document.getElementById('qrcode-entrada'), {
                text: codigoPixEntrada,
                width: 200,
                height: 200
            });
            inicializarAssinatura();
        }, 300);
    }
}

function copiarPix(codigo) {
    navigator.clipboard.writeText(codigo).then(() => {
        alert('✅ Código Pix copiado! Abra o app do banco e cole.');
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = codigo;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('✅ Código Pix copiado! Abra o app do banco e cole.');
    });
}

function verificarLido() {
    const lido = document.getElementById('liContrato').checked;
    document.getElementById('areaAssinatura').classList.toggle('oculto', !lido);
}

function inicializarAssinatura() {
    const canvas = document.getElementById('assinaturaCanvas');
    if (!canvas) return;
    assinaturaCanvas = canvas;
    assinaturaCtx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    assinaturaCtx.lineWidth = 2;
    assinaturaCtx.lineCap = 'round';
    assinaturaCtx.strokeStyle = '#000';

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        return { x, y };
    }

    function iniciar(e) {
        e.preventDefault();
        assinando = true;
        assinaturaFeita = false;
        const pos = getPos(e);
        assinaturaCtx.beginPath();
        assinaturaCtx.moveTo(pos.x, pos.y);
    }

    function desenhar(e) {
        if (!assinando) return;
        e.preventDefault();
        assinaturaFeita = true;
        const pos = getPos(e);
        assinaturaCtx.lineTo(pos.x, pos.y);
        assinaturaCtx.stroke();
    }

    function parar() {
        assinando = false;
        document.getElementById('btnConfirmarAssinatura').disabled = !assinaturaFeita;
    }

    canvas.addEventListener('mousedown', iniciar);
    canvas.addEventListener('mousemove', desenhar);
    canvas.addEventListener('mouseup', parar);
    canvas.addEventListener('mouseout', parar);
    canvas.addEventListener('touchstart', iniciar);
    canvas.addEventListener('touchmove', desenhar);
    canvas.addEventListener('touchend', parar);
}

function limparAssinatura() {
    if (assinaturaCanvas && assinaturaCtx) {
        assinaturaCtx.clearRect(0, 0, assinaturaCanvas.width, assinaturaCanvas.height);
        assinaturaFeita = false;
        document.getElementById('btnConfirmarAssinatura').disabled = true;
    }
}

async function confirmarAssinatura() {
    if (!assinaturaFeita) { alert('Assine primeiro!'); return; }
    if (!confirm('✅ Confirmar assinatura?')) return;

    const { error } = await supabase.from('propostas').update({
        assinatura_assinada: true,
        data_assinatura: new Date().toISOString()
    }).eq('id', proposta.id);

    if (error) alert('❌ Erro: ' + error.message);
    else {
        alert('✅ Contrato assinado! Agora faça o pagamento da entrada pelo Pix.');
        mostrarProposta();
    }
}
</script>
</body>
</html>
