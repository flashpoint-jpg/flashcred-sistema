<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0A2463', sucesso: '#10B981', alerta: '#F59E0B' } } } }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-center text-primary mb-6">🔍 Acompanhar Proposta</h2>

        <input type="text" id="cpf" placeholder="Digite seu CPF (apenas números)" maxlength="11"
            class="w-full p-3 border-2 border-gray-200 rounded-lg mb-4 text-center text-lg">

        <button id="btnBuscar" class="w-full bg-primary hover:bg-blue-900 text-white font-bold p-3 rounded-lg text-lg transition">
            <i class="fas fa-search mr-2"></i> Consultar
        </button>

        <div id="resultado" class="mt-6"></div>
    </div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('btnBuscar').addEventListener('click', async () => {
    const cpfLimpo = document.getElementById('cpf').value.replace(/\D/g,'');
    const resDiv = document.getElementById('resultado');

    if(cpfLimpo.length !== 11) {
        resDiv.innerHTML = `<p class="text-red-500 text-center font-bold">❌ Digite CPF com 11 números!</p>`;
        return;
    }

    resDiv.innerHTML = `<p class="text-center text-gray-600 py-4"><i class="fas fa-spinner fa-spin text-2xl"></i> Buscando...</p>`;

    try {
        // ✅ SE A TABELA FOR OUTRO NOME, ALTERE ABAIXO EX: .from('sua_tabela_aqui')
        const {data, error} = await supabase
            .from('propostas')
            .select('*')
            .eq('cpf', cpfLimpo)
            .limit(1);

        if(error) throw error.message;
        if(!data || data.length === 0) throw "Nenhuma proposta encontrada para esse CPF!";

        resDiv.innerHTML = `
        <div class="p-4 border border-green-200 rounded-lg bg-green-50">
            <p class="font-bold text-lg text-sucesso mb-2">✅ Proposta Encontrada!</p>
            <p><strong>Nome:</strong> ${data[0].nome || 'Não informado'}</p>
            <p><strong>CPF:</strong> ${data[0].cpf}</p>
            <p><strong>Status:</strong> ${data[0].status || 'Sem status'}</p>
            <p><strong>Valor:</strong> R$ ${Number(data[0].valor_desejado||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
        </div>`;

    } catch(erro) {
        resDiv.innerHTML = `<p class="text-red-500 text-center font-bold py-4">❌ ${erro}</p>`;
    }
});
</script>
</body>
</html>
