<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Busca | FlashCred</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <style>
        body {font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px;}
        input {width: 100%; padding: 10px; margin-bottom: 10px; font-size: 16px;}
        button {padding: 10px 20px; background: #0A2463; color: white; border: none; cursor: pointer; font-size: 16px;}
        #resultado {margin-top: 20px; padding: 10px; border: 1px solid #ccc;}
    </style>
</head>
<body>

<input type="text" id="cpf" placeholder="Digite CPF só números" maxlength="11">
<button onclick="testarBusca()">TESTAR BUSCA</button>
<div id="resultado"></div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function testarBusca(){
    const cpfLimpo = document.getElementById('cpf').value.replace(/\D/g,'');
    const res = document.getElementById('resultado');

    if(cpfLimpo.length !== 11){
        res.innerHTML = '<p style="color:red;">❌ CPF precisa ter 11 números!</p>';
        return;
    }

    res.innerHTML = '<p>🔍 Buscando...</p>';

    try {
        // ✅ SE NÃO FUNCIONAR, ME DIZ: qual o nome EXATO da tabela e do campo CPF no seu Supabase?
        const {data, error} = await supabase
            .from('propostas')
            .select('nome,cpf,status,valor_desejado')
            .eq('cpf', cpfLimpo)
            .limit(1);

        if(error) throw error;
        if(data.length === 0) throw "Nenhuma proposta encontrada!";

        res.innerHTML = `
        <p style="color:green;">✅ ENCONTRADO!</p>
        <p>Nome: ${data[0].nome}</p>
        <p>CPF: ${data[0].cpf}</p>
        <p>Status: ${data[0].status}</p>
        <p>Valor: R$ ${data[0].valor_desejado}</p>
        `;

    } catch(erro) {
        res.innerHTML = `<p style="color:red;">❌ ERRO: ${erro.message || erro}</p>`;
    }
}
</script>
</body>
</html>
