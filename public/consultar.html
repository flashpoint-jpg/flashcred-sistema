<script>

/* ============================================================
   CONFIGURAÇÃO
============================================================ */

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        realtime:true
    }
);


/* ============================================================
   VARIÁVEIS
============================================================ */

let propostaAtual = null;
let canalRealtime = null;
let webcamStream = null;
let fotoCapturada = '';
let modoAssinatura = 'texto';


/* ============================================================
   CONSULTA
============================================================ */

async function executarConsulta(){

    const input =
        document.getElementById('cpfConsulta');

    const cpf =
        input.value.replace(/\D/g,'');

    if(cpf.length !== 11){

        alert('Digite os 11 números do CPF.');

        return;
    }

    mostrarLoading();

    try{

        const {data,error} =
            await supabaseClient
            .from('propostas')
            .select('*')
            .eq('cpf',cpf)
            .order('created_at',{ascending:false})
            .limit(1);

        if(error){

            console.error(error);

            throw new Error(
                'Erro ao consultar a proposta.'
            );
        }

        if(!data || !data.length){

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );
        }

        propostaAtual = data[0];

        sessionStorage.setItem(
            'ultimo_cpf',
            cpf
        );

        mostrarProposta(propostaAtual);

        iniciarRealtime();

    }catch(error){

        alert(error.message || error);

        document.getElementById(
            'conteudoProposta'
        ).innerHTML='';

        document.getElementById(
            'telaProposta'
        ).classList.add('hidden');

        document.getElementById(
            'telaConsulta'
        ).classList.remove('hidden');
    }
}


/* ============================================================
   REALTIME
============================================================ */

function iniciarRealtime(){

    if(canalRealtime){

        supabaseClient.removeChannel(
            canalRealtime
        );
    }

    canalRealtime =
        supabaseClient
        .channel(
            'proposta-' + propostaAtual.id
        )
        .on(
            'postgres_changes',
            {
                event:'UPDATE',
                schema:'public',
                table:'propostas',
                filter:`id=eq.${propostaAtual.id}`
            },
            payload => {

                propostaAtual =
                    payload.new;

                mostrarProposta(
                    propostaAtual
                );
            }
        )
        .subscribe();
}


/* ============================================================
   VOLTAR
============================================================ */

function voltarInicio(){

    if(webcamStream){

        webcamStream
        .getTracks()
        .forEach(track=>track.stop());

        webcamStream=null;
    }

    if(canalRealtime){

        supabaseClient.removeChannel(
            canalRealtime
        );

        canalRealtime=null;
    }

    propostaAtual=null;

    sessionStorage.removeItem(
        'ultimo_cpf'
    );

    document.getElementById(
        'cpfConsulta'
    ).value='';

    document.getElementById(
        'telaProposta'
    ).classList.add('hidden');

    document.getElementById(
        'telaConsulta'
    ).classList.remove('hidden');
}


/* ============================================================
   UTILITÁRIOS
============================================================ */

function moeda(valor){

    const n=Number(valor||0);

    return n.toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}


function dataBR(data){

    if(!data) return '-';

    const d =
        new Date(data);

    if(isNaN(d.getTime()))
        return '-';

    return d.toLocaleDateString(
        'pt-BR'
    );
}


/*
   Aceita vários formatos possíveis do campo parcelas JSONB.

   Exemplos:

   [4,8,12,24]

   {"4":true,"8":true,"12":true}

   {"quantidades":[4,8,12,24]}

   [{"parcelas":4},{"parcelas":8}]

   {"4":"R$ 100","8":"R$ 60"}
*/

function extrairParcelas(valor){

    let resultado=[];

    if(valor===null || valor===undefined)
        return resultado;

    if(typeof valor === 'string'){

        try{

            valor=JSON.parse(valor);

        }catch{

            const numeros =
                valor.match(/\d+/g);

            if(numeros){

                resultado =
                    numeros.map(Number);
            }
        }
    }

    function percorrer(obj){

        if(obj===null ||
           obj===undefined)
            return;

        if(typeof obj==='number'){

            if(
                Number.isInteger(obj) &&
                obj>0 &&
                obj<=120
            ){

                resultado.push(obj);
            }

            return;
        }

        if(Array.isArray(obj)){

            obj.forEach(item =>
                percorrer(item)
            );

            return;
        }

        if(typeof obj==='object'){

            Object.entries(obj)
            .forEach(([chave,valor])=>{

                /*
                   Se a chave for "4", "8", "12",
                   ela pode representar a quantidade
                   de parcelas.
                */

                const numeroChave =
                    Number(
                        String(chave)
                        .replace(/\D/g,'')
                    );

                if(
                    Number.isInteger(numeroChave) &&
                    numeroChave>0 &&
                    numeroChave<=120
                ){

                    resultado.push(
                        numeroChave
                    );
                }

                percorrer(valor);

            });
        }
    }

    percorrer(valor);

    /*
       Remove duplicados.
    */

    resultado =
        [...new Set(resultado)]
        .sort((a,b)=>a-b);

    return resultado;
}


/* ============================================================
   BUSCAR QUANTIDADE DE PARCELAS
============================================================ */

function obterOpcoesParcelas(p){

    /*
       PRIMEIRO:
       usa parcelas do painel.
    */

    let opcoes =
        extrairParcelas(
            p.parcelas
        );

    /*
       Caso exista qtd_parcelas ou
       quantidade_parcelas.
    */

    if(!opcoes.length){

        const possiveis=[
            p.qtd_parcelas,
            p.quantidade_parcelas,
            p.limite_parcelas
        ];

        possiveis.forEach(v=>{

            const n=Number(v);

            if(
                Number.isInteger(n) &&
                n>0
            ){

                for(
                    let i=1;
                    i<=n;
                    i++
                ){

                    opcoes.push(i);
                }
            }
        });
    }

    return [
        ...new Set(opcoes)
    ].sort((a,b)=>a-b);
}


/* ============================================================
   JUROS / PARCELA
============================================================ */

function calcularParcela(
    total,
    entrada,
    juros,
    quantidade
){

    const principal =
        Math.max(
            Number(total||0) -
            Number(entrada||0),
            0
        );

    const taxa =
        Number(juros||0)/100;

    if(!quantidade)
        return 0;

    /*
       Sem juros:
       divide normalmente.
    */

    if(taxa===0){

        return principal/
            quantidade;
    }

    /*
       Sistema de parcelas
       com juros mensais.
    */

    const fator =
        Math.pow(
            1+taxa,
            quantidade
        );

    return (
        principal *
        (
            fator*taxa
        ) /
        (
            fator-1
        )
    );
}


/* ============================================================
   STATUS
============================================================ */

function statusAprovado(p){

    const status =
        String(
            p.status||''
        )
        .trim()
        .toLowerCase();

    return [
        'aprovada',
        'aprovado',
        'aprovada ',
        'aprovado '
    ].includes(status);
}


function contratoAssinado(p){

    /*
       O banco mostra:
       contrato_assinado = TEXT

       e também:
       assinatura_assinada = BOOLEAN
    */

    if(p.assinatura_assinada===true)
        return true;

    if(
        p.contrato_assinado &&
        String(
            p.contrato_assinado
        ).trim()!==''
    )
        return true;

    return false;
}


function entradaPaga(p){

    return (
        p.valor_entrada_pago===true ||
        p.valor_entrada_pago==='true' ||
        p.valor_entrada_pago===1
    );
}


/* ============================================================
   ETAPAS
============================================================ */

function atualizarEtapas(p){

    const aprovado =
        statusAprovado(p);

    const escolhido =
        !!p.qtd_parcelas_escolhida;

    const assinado =
        contratoAssinado(p);

    const pago =
        entradaPaga(p);

    let etapa=1;

    if(aprovado)
        etapa=2;

    if(escolhido)
        etapa=3;

    if(assinado)
        etapa=4;

    if(pago)
        etapa=5;

    const etapas=[
        'Análise',
        'Parcelas',
        'Contrato',
        'Entrada',
        'Liberado'
    ];

    document.getElementById(
        'barraEtapas'
    ).innerHTML =
        etapas.map(
            (nome,index)=>{

                const numero=index+1;

                let classe='';

                if(numero<etapa)
                    classe='done';

                if(numero===etapa)
                    classe='active';

                return `
                <div class="step ${classe}">
                    <div class="circle">
                        ${
                            numero<etapa
                            ? '✓'
                            : numero
                        }
                    </div>
                    <div>${nome}</div>
                </div>
                `;
            }
        ).join('');
}


/* ============================================================
   MOSTRAR PROPOSTA
============================================================ */

function mostrarProposta(p){

    document.getElementById(
        'telaConsulta'
    ).classList.add('hidden');

    document.getElementById(
        'telaProposta'
    ).classList.remove('hidden');

    atualizarEtapas(p);

    const nome =
        p.nome ||
        'Cliente';

    const valorProduto =
        Number(
            p.valor_desejado ||
            p.valor_produto ||
            0
        );

    const entrada =
        Number(
            p.valor_entrada||0
        );

    const juros =
        Number(
            p.juros_mensal||0
        );

    /*
       MUITO IMPORTANTE:

       Se o painel já informou
       valor_total_final,
       usamos ele.

       Não recalculamos o valor.
    */

    let total =
        Number(
            p.valor_total_final||0
        );

    if(total<=0){

        total =
            valorProduto *
            (
                1 +
                juros/100
            );
    }

    const dias =
        Number(
            p.dias_entrega||0
        );

    const aprovado =
        statusAprovado(p);

    const assinado =
        contratoAssinado(p);

    const pago =
        entradaPaga(p);

    const escolhido =
        Number(
            p.qtd_parcelas_escolhida||0
        );

    let html='';

    html += `
    <div class="card">

        <div class="flex justify-between items-center gap-3">

            <div>
                <div class="small">
                    PROPOSTA #${p.id}
                </div>

                <h1 class="text-2xl font-bold text-primary">
                    Olá, ${nome}
                </h1>
            </div>

            ${
                aprovado
                ?
                `<span class="badge badge-green">
                    <i class="fas fa-check"></i>
                    APROVADA
                </span>`
                :
                `<span class="badge badge-yellow">
                    <i class="fas fa-clock"></i>
                    ${p.status||'EM ANÁLISE'}
                </span>`
            }

        </div>

    </div>
    `;


    /* ========================================================
       NÃO APROVADA
    ======================================================== */

    if(!aprovado){

        html += `
        <div class="card">

            <div class="alert alert-warning text-center">

                <i class="fas fa-hourglass-half text-3xl"></i>

                <h2 class="font-bold text-lg mt-2">
                    Sua proposta está em análise
                </h2>

                <p class="mt-2">
                    Assim que houver uma atualização,
                    ela aparecerá automaticamente nesta página.
                </p>

            </div>

        </div>
        `;

        document.getElementById(
            'conteudoProposta'
        ).innerHTML=html;

        return;
    }


    /* ========================================================
       PARCELAS AINDA NÃO ESCOLHIDAS
    ======================================================== */

    if(!escolhido){

        const opcoes =
            obterOpcoesParcelas(p);

        html += `
        <div class="card">

            <h2 class="title">
                <i class="fas fa-list-ol"></i>
                Escolha suas parcelas
            </h2>

            <p class="text-sm text-slate-600 mb-4">
                Sua proposta foi aprovada.
                Selecione uma das opções de parcelamento
                disponibilizadas pela FlashCred.
            </p>

            <div class="highlight">

                <div class="info">
                    <span>Valor do produto</span>
                    <strong>
                        R$ ${moeda(valorProduto)}
                    </strong>
                </div>

                <div class="info">
                    <span>Entrada</span>
                    <strong>
                        R$ ${moeda(entrada)}
                    </strong>
                </div>

                <div class="info">
                    <span>Juros mensais</span>
                    <strong>
                        ${moeda(juros)}%
                    </strong>
                </div>

                <div class="info">
                    <span>Valor total</span>
                    <strong>
                        R$ ${moeda(total)}
                    </strong>
                </div>

            </div>

            ${
                opcoes.length
                ?
                `
                <label class="font-bold block mb-2">
                    Quantidade de parcelas
                </label>

                <select
                    id="qtdParcelas"
                    class="parcelas-select"
                    onchange="mostrarPreviaParcela()"
                >

                    <option value="">
                        Selecione uma opção
                    </option>

                    ${
                        opcoes.map(q=>{

                            const valor =
                                calcularParcela(
                                    total,
                                    entrada,
                                    juros,
                                    q
                                );

                            return `
                            <option value="${q}">
                                ${q}x de R$ ${moeda(valor)}
                            </option>
                            `;

                        }).join('')
                    }

                </select>

                <div
                    id="previaParcela"
                    class="hidden highlight text-center"
                ></div>

                <button
                    class="btn btn-success"
                    onclick="confirmarParcelas()"

async function confirmarParcelas(){

    const select =
        document.getElementById(
            'qtdParcelas'
        );

    if(!select || !select.value){

        alert(
            'Selecione a quantidade de parcelas.'
        );

        return;
    }

    const quantidade =
        Number(select.value);

    const btn =
        event.currentTarget;

    btn.disabled=true;

    btn.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Salvando...';

    try{

        const {error} =
            await supabaseClient
            .from('propostas')
            .update({
                qtd_parcelas_escolhida:
                    quantidade
            })
            .eq(
                'id',
                propostaAtual.id
            );

            throw error;

        propostaAtual.qtd_parcelas_escolhida =
            quantidade;

        mostrarProposta(
            propostaAtual
        );

    }catch(error){

        console.error(error);

        alert(
            'Não foi possível salvar a quantidade de parcelas.'
        );

        btn.disabled=false;

        btn.innerHTML =
            'Continuar para o contrato';
    }

async function usarSelfie(){

    ).classList.remove('hidden');

            await navigator

            .getUserMedia({
                video:{
                    facingMode:'user'
                },
                audio:false
            });

        document.getElementById(
            'camera'
        ).srcObject =
            webcamStream;

    }catch(error){

        alert(
            'Não foi possível acessar a câmera. Use a assinatura digitando seu nome.'
        );

function capturarSelfie(){

    const video =
        document.getElementById(
            'camera'
        );

    const canvas =
        document.getElementById(
            'canvas'
        );

    if(!video.videoWidth){

        alert(
            'A câmera ainda não está pronta.'
        );

        return;
    }

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    canvas
    .getContext('2d')
    .drawImage(
        video,
        0,
        0
    );

    fotoCapturada =
        canvas.toDataURL(
            'image/jpeg',
            .8
        );

    const preview =
        document.getElementById(
            'fotoPreview'
        );

    preview.src =
        fotoCapturada;

    preview.classList.remove(
        'hidden'
    );

    document.getElementById(
        'btnAssinarSelfie'
    ).classList.remove(
        'hidden'
    );
}


function pararCamera(){

    if(webcamStream){

        webcamStream
        .getTracks()
        .forEach(track =>
            track.stop()
        );

        webcamStream=null;
    }
}

async function assinarContrato(){

    const aceite =
        document.getElementById(
            'aceiteContrato'
        );

    const nome =
        document.getElementById(
            'nomeAssinatura'
        );

    if(!aceite.checked){

        alert(
            'Você precisa aceitar o contrato antes de assinar.'
        );

        return;
    }

    if(!nome.value.trim()){

        alert(
            'Digite seu nome completo.'
        );

        return;
    }

    const assinatura =
        nome.value.trim();

    try{

        /*
           contrato_assinado é TEXT no seu banco.
           assinatura_assinada é BOOLEAN.
        */

        const {error} =
            await supabaseClient
            .from('propostas')
            .update({

                contrato_assinado:
                    assinatura,

                assinatura_assinada:
                    true

            })
            .eq(
                'id',
                propostaAtual.id
            );

        if(error)
            throw error;

        propostaAtual.contrato_assinado =
            assinatura;

        propostaAtual.assinatura_assinada =
            true;

        pararCamera();

        mostrarProposta(
            propostaAtual
        );

    }catch(error){

        console.error(error);

        alert(
            'Erro ao registrar a assinatura: ' +
            (error.message||error)
        );
    }
}

/* ============================================================
   GERAR PIX
============================================================ */

async function buscarPix(
    valor,
    descricao
){

    const response =
        await fetch(
            '/api/gerar-pix',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json'
                },

                body:JSON.stringify({

                    valor:
                        Number(valor)
                        .toFixed(2),

                    descricao:
                        descricao

                })
            }
        );

    if(!response.ok){

        throw new Error(
            'Servidor de Pix retornou erro.'
        );
    }

    const json =
        await response.json();

    const codigo =
        json.qr_code ||
        json.copia_cola ||
        json.pixCopiaECola ||
        json.codigo ||
        json.qrCode;

    if(!codigo){

        console.error(
            'Resposta Pix:',
            json
        );

        throw new Error(
            'A API não retornou o código Pix.'
        );
    }

    return codigo;
}

============================================================ */

async function copiarPix(codigo){

    try{

        await navigator.clipboard
        .writeText(codigo);

        alert(
            'Código Pix copiado!'
        );

    }catch{

        prompt(
            'Copie o código Pix:',
            codigo
        );
    }
}


/* ============================================================
   DADOS DAS PARCELAS
============================================================ */

function obterDadosParcelas(p){

    let dados =
        p.dados_parcelas;

    if(!dados)
        return [];

    if(typeof dados==='string'){

        try{

            dados =
                JSON.parse(dados);

        }catch{

            return [];
        }
    }

    if(Array.isArray(dados))
        return dados;

    if(
        dados &&
        Array.isArray(dados.parcelas)
    ){

        return dados.parcelas;
    }

    return [];
}


/* ============================================================
   VENCIMENTO
============================================================ */

function calcularVencimento(numero){

    const data =
        new Date();

    data.setMonth(
        data.getMonth() + numero
    );

    return data
        .toISOString()
        .split('T')[0];
}


/* ============================================================
   LOADING
============================================================ */

function mostrarLoading(){

    document.getElementById(
        'telaConsulta'
    ).classList.add('hidden');

    document.getElementById(
        'telaProposta'
    ).classList.remove('hidden');

    document.getElementById(
        'conteudoProposta'
    ).innerHTML=`

        <div class="card loading">

            <i class="fas fa-spinner fa-spin text-3xl text-primary"></i>

            <p class="mt-3 font-bold">
                Consultando sua proposta...
            </p>

        </div>

    `;
}


/* ============================================================
   ENTER NO CPF
============================================================ */

document.addEventListener(
    'DOMContentLoaded',
    ()=>{

        const input =
            document.getElementById(
                'cpfConsulta'
            );

        input.addEventListener(
            'input',
            ()=>{
                input.value =
                    input.value
                    .replace(/\D/g,'')
                    .slice(0,11);
            }
        );

        input.addEventListener(
            'keydown',
            event=>{

                if(event.key==='Enter')
                    executarConsulta();

            }
        );


        const ultimo =
            sessionStorage.getItem(
                'ultimo_cpf'
            );

        if(ultimo){

            input.value =
                ultimo;

            executarConsulta();
        }

    }
);

</script>
