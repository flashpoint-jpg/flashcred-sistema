<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #F8FAFC; min-height: 100vh; }
        .cartao { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .botao { padding: 12px; border-radius: 8px; font-weight: bold; border: none; width: 100%; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .botao:disabled { background: #ccc; cursor: not-allowed; }
        .botao-primario { background: #0A2463; color: white; }
        .botao-sucesso { background: #10B981; color: white; }
        .contrato { background: #f9fafb; border: 1px solid #ddd; border-radius: 8px; padding: 15px; max-height: 250px; overflow-y: auto; font-size: 14px; line-height: 1.5; }
        canvas { border: 2px solid #ccc; border-radius: 8px; background: white; width: 100%; max-width: 380px; }
        .qrcode { text-align: center; padding: 15px; }
        .chave-pix { background: #f0fdf4; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; word-break: break-all; margin-top: 10px; }
        .etapa { display: none; }
        .etapa.ativa { display: block; }
        .carregando { text-align: center; padding: 20px; }
        .erro { color: #EF4444; text-align: center; padding: 15px; }
    </style>
</head>
<body class="p-4">

<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-center text-primary mb-6">📋 Consultar Proposta</h1>
    <div id="conteudo"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

// ✅ SEU TOKEN DO MERCADO PAGO DE PRODUÇÃO
const MP_TOKEN = 'APP_USR-8158139097874832-072720-d200da044f05a1dd8eb75f90e0551431-18499471';
const CHAVE_PIX = '33552949852';
const WHATSAPP = '5511973294235';

let proposta = null;
let etapa = 0;
let assinaturaCanvas = null;
let assinaturaContext = null;
let assinando = false;
let cobrancaMP = null;

window.onload = async () => {
    const params = new URLSearchParams(window.location.search);
    let cpf = (params.get('cpf') || '').replace(/\D/g, '');
    
    if(!cpf || cpf.length !== 11) {
        document.getElementById('conteudo').innerHTML = `
            <div class="cartao p-5 text-center">
                <p class="mb-3">Digite seu CPF:</p>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" class="w-full p-3 border rounded-lg text-center text-lg">
                <button onclick="buscar()" class="botao botao-primario">Consultar</button>
            </div>
        `;
        return;
    }
    await carregar(cpf);
};

async function buscar() {
    let cpf = document.getElementById('cpf').value.replace(/\D/g, '');
    if(cpf.length !== 11) { alert('CPF inválido!'); return; }
    window.location.search = '?cpf=' + cpf;
}

async function carregar(cpf) {
    const {data, error} = await supabase
        .from('propostas')
        .select('*')
        .ilike('cpf', '%' + cpf + '%')
        .order('created_at', {ascending:false})
        .limit(1);

    if(error || !data || data.length === 0) {
        document.getElementById('conteudo').innerHTML = `
            <div class="cartao p-5 text-center">
                <p class="text-red-600 font-bold">Proposta não encontrada!</p>
                <a href="consultar.html" class="inline-block mt-4 text-primary">← Tentar novamente</a>
            </div>
        `;
        return;
    }

    proposta = data[0];
    
    if(proposta.entrada_paga) {
        mostrarParcelas();
        return;
    }

    renderizar();
    monitorarPagamento();
}

function calcular(valor, entrada, juros, qtd) {
    const total = valor * (1 + juros / 100);
    const saldo = total - entrada;
    let parcela = 0;
    if(qtd === 1) parcela = total;
    else if(saldo > 0 && qtd > 0) {
        const tx = juros / 100;
        parcela = saldo * Math.pow(1+tx, qtd) * tx / (Math.pow(1+tx, qtd) - 1);
    }
    return {total, parcela};
}

function renderizar() {
    const valor = Number(proposta.valor_desejado || 0);
    const entrada = Number(proposta.valor_entrada || 0);
    const juros = Number(proposta.juros_mensal || 5);
    const qtd = Number(proposta.quantidade_parcelas || 1);
    const status = proposta.status || 'Nova';

    if(status !== 'Aprovada') {
        document.getElementById('conteudo').innerHTML = `
            <div class="cartao p-5 text-center">
                <p class="text-lg font-bold text-amber-600">⏳ Aguardando Aprovação</p>
                <p class="text-gray-600 mt-2">Sua proposta está em análise.</p>
                <a href="https://wa.me/${WHATSAPP}" target="_blank" class="botao botao-sucesso mt-4">Falar no WhatsApp</a>
            </div>
        `;
        return;
    }

    const calc = calcular(valor, entrada, juros, qtd);

    document.getElementById('conteudo').innerHTML = `
    <!-- ETAPA 1: DADOS -->
    <div id="etapa1" class="etapa ativa">
        <div class="cartao p-5">
            <h2 class="text-xl font-bold text-primary mb-4">Proposta de ${proposta.nome || 'Cliente'}</h2>
            <div class="space-y-2 text-sm">
                <p><strong>CPF:</strong> ${(proposta.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</p>
                <p><strong>Valor Solicitado:</strong> R$ ${valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                <p class="text-sucesso font-bold">💵 Entrada: R$ ${entrada.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                <p><strong>Total com Juros:</strong> R$ ${calc.total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                <p><strong>${qtd}x de:</strong> R$ ${calc.parcela.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
            </div>
            <button onclick="irEtapa(2)" class="botao botao-primario">Continuar → Ler e Assinar Contrato</button>
        </div>
    </div>

    <!-- ETAPA 2: CONTRATO -->
    <div id="etapa2" class="etapa">
        <div class="cartao p-5">
            <h2 class="text-lg font-bold mb-3">📄 Contrato</h2>
            <div class="contrato mb-4">
                <p>Eu, <strong>${proposta.nome || 'Cliente'}</strong>, CPF ${(proposta.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}, declaro que li e aceito:</p>
                <p class="mt-2">Valor: R$ ${valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                <p>Entrada: R$ ${entrada.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                <p>Total: R$ ${calc.total.toLocaleString('pt-BR',{minimumFractionDigits:2})} em ${qtd}x</p>
                <p class="mt-3">Declaro que ao deixar de pagar estarei prejudicando a confiança concedida. Pense bem antes de assumir este compromisso. Conte comigo. Vamos fazer um mundo melhor.</p>
            </div>

            <label class="flex items-center mb-3">
                <input type="checkbox" id="aceito" onchange="verificar()">
                <span class="ml-2">Li e concordo</span>
            </label>

            <p class="font-bold mb-2">✍️ Assine abaixo:</p>
            <canvas id="assinatura" width="360" height="140"></canvas>
            <button onclick="limparAssinatura()" class="botao" style="background:#eee; color:#333; padding:8px; font-size:14px;">Limpar</button>

            <button id="btnAvancar" class="botao botao-primario mt-4" onclick="irEtapa(3)" disabled>Continuar → Pagamento</button>
            <button onclick="irEtapa(1)" class="botao" style="background:#eee; color:#333;">← Voltar</button>
        </div>
    </div>

    <!-- ETAPA 3: PAGAMENTO PIX VIA API MERCADO PAGO -->
    <div id="etapa3" class="etapa">
        <div class="cartao p-5">
            <h2 class="text-lg font-bold mb-3">💳 Pagamento da Entrada</h2>
            <p class="text-center text-xl font-bold text-sucesso mb-4">R$ ${entrada.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
            
            <div id="areaPix" class="carregando">
                <i class="fas fa-circle-notch fa-spin text-2xl text-primary"></i>
                <p class="mt-2">Gerando QR Code...</p>
            </div>

            <p class="text-sm text-gray-600 mt-4 text-center">Após pagar, aguarde a confirmação automática. As parcelas aparecerão em breve.</p>

            <button onclick="irEtapa(2)" class="botao" style="background:#eee; color:#333;">← Voltar</button>
            <a href="https://wa.me/${WHATSAPP}" target="_blank" class="botao botao-sucesso">Preciso de Ajuda</a>
        </div>
    </div>
    `;

    setTimeout(() => {
        initAssinatura();
        gerarPixMercadoPago();
    }, 100);
}

function irEtapa(n) {
    document.querySelectorAll('.etapa').forEach(e => e.classList.remove('ativa'));
    etapa = n;
    document.getElementById('etapa'+n).classList.add('ativa');
    window.scrollTo(0,0);
}

function verificar() {
    const aceito = document.getElementById('aceito').checked;
    const temAssinatura = assinaturaContext && assinaturaContext.getImageData(10,10,1,1).data[3] > 0;
    document.getElementById('btnAvancar').disabled = !aceito || !temAssinatura;
}

function initAssinatura() {
    assinaturaCanvas = document.getElementById('assinatura');
    if(!assinaturaCanvas) return;
    assinaturaContext = assinaturaCanvas.getContext('2d');
    assinaturaContext.lineWidth = 3;
    assinaturaContext.lineCap = 'round';
    assinaturaContext.strokeStyle = '#000';

    function pos(e) {
        const r = assinaturaCanvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
        return {x, y};
    }

    assinaturaCanvas.onmousedown = assinaturaCanvas.ontouchstart = e => {
        e.preventDefault(); assinando = true;
        const p = pos(e);
        assinaturaContext.beginPath();
        assinaturaContext.moveTo(p.x, p.y);
    };
    assinaturaCanvas.onmousemove = assinaturaCanvas.ontouchmove = e => {
        if(!assinando) return; e.preventDefault();
        const p = pos(e);
        assinaturaContext.lineTo(p.x, p.y);
        assinaturaContext.stroke();
        verificar();
    };
    assinaturaCanvas.onmouseup = assinaturaCanvas.ontouchend = () => { assinando = false; verificar(); };
}

function limparAssinatura() {
    if(assinaturaContext) {
        assinaturaContext.clearRect(0,0,assinaturaCanvas.width,assinaturaCanvas.height);
        verificar();
    }
}

// ✅ GERA PIX REAL VIA API DO MERCADO PAGO
async function gerarPixMercadoPago() {
    const valor = Number(proposta.valor_entrada || 0);
    const descricao = `Entrada - ${proposta.nome || 'Cliente'}`;
    const cpfLimpo = (proposta.cpf || '').replace(/\D/g, '');

    try {
        const resposta = await fetch('https://api.mercadopago.com/v1/payments', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${MP_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                transaction_amount: valor,
                description: descricao.substring(0,60),
                payment_method_id: 'pix',
                payer: {
                    email: 'pagamento@flashcred.com.br',
                    identification: { type: 'CPF', number: cpfLimpo.substring(0,11) || '00000000000' }
                },
                notification_url: 'https://rgcclordmqjmwuzrrfbd.supabase.co/rest/v1/rpc/webhook_mp',
                external_reference: `PROP-${proposta.id}`
            })
        });

        const resultado = await resposta.json();

        if(resultado.error) throw resultado.error;

        cobrancaMP = resultado;

        if(resultado.point_of_interaction && resultado.point_of_interaction.transaction_data) {
            const qrCodeBase64 = resultado.point_of_interaction.transaction_data.qr_code_base64;
            const chavePixCopiar = resultado.point_of_interaction.transaction_data.qr_code;

            document.getElementById('areaPix').innerHTML = `
                <div class="qrcode">
                    <img src="data:image/png;base64,${qrCodeBase64}" alt="QR Code Pix" style="width:220px; height:220px;">
                </div>
                <p class="font-bold mt-3 mb-1">Chave Pix / Código:</p>
                <div class="chave-pix" onclick="copiarPix('${chavePixCopiar.replace(/'/g, "\\'")}')">
                    Clique para copiar
                </div>
                <p class="text-sucesso font-bold mt-3 text-center">✅ QR Code gerado pelo Mercado Pago!</p>
            `;
        } else {
            throw new Error('Dados do Pix não retornados');
        }

    } catch(erro) {
        console.error('Erro MP:', erro);
        document.getElementById('areaPix').innerHTML = `
            <div class="erro">
                <p>⚠️ Usando chave Pix direta:</p>
                <div class="qrcode" id="qrcode"></div>
                <p class="font-bold mt-3 mb-1">Chave Pix:</p>
                <div class="chave-pix" onclick="copiarPix('${CHAVE_PIX}')">${CHAVE_PIX}</div>
            </div>
        `;
        setTimeout(() => gerarPixFixo(), 200);
    }
}

function gerarPixFixo() {
    const entrada = Number(proposta.valor_entrada || 0);
    const valor = entrada.toFixed(2);
    const pix = `00020126330014br.gov.bcb.pix0111${CHAVE_PIX}52040000530398654030105802BR5913FLASH POINT6009SAO PAULO62070503***6304XXXX`;
    
    if(window.QRCode) {
        new QRCode(document.getElementById('qrcode'), { 
            text: pix.replace('XXXX', calcularCRC(pix.replace('XXXX',''))), 
            width: 200, height: 200 
        });
    }
}

function calcularCRC(str) {
    let crc = 0xFFFF;
    for(let i=0; i<str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for(let j=0; j<8; j++) crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1;
    }
    return ((crc ^ 0xFFFF) & 0xFFFF).toString(16).toUpperCase().padStart(4,'0');
}

function copiarPix(texto) {
    navigator.clipboard.writeText(texto).then(() => alert('✅ Copiado! Pague pelo app do seu banco.'));
}

function mostrarParcelas() {
    const valor = Number(proposta.valor_desejado || 0);
    const entrada = Number(proposta.valor_entrada || 0);
    const juros = Number(proposta.juros_mensal || 5);
    const qtd = Number(proposta.quantidade_parcelas || 1);
    const calc = calcular(valor, entrada, juros, qtd);

    let lista = '';
    for(let i=1; i<=qtd; i++) {
        lista += `<div class="p-3 border rounded mb-2 flex justify-between items-center">
            <span>Parcela ${i}/${qtd}</span>
            <span class="font-bold">R$ ${calc.parcela.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>
        </div>`;
    }

    document.getElementById('conteudo').innerHTML = `
        <div class="cartao p-5">
            <p class="text-center text-lg font-bold text-sucesso mb-4">✅ ENTRADA PAGA!</p>
            <h3 class="font-bold mb-3">Suas Parcelas:</h3>
            ${lista}
            <a href="https://wa.me/${WHATSAPP}" target="_blank" class="botao botao-sucesso mt-4">Falar no WhatsApp</a>
        </div>
    `;
}

function monitorarPagamento() {
    supabase.channel('propostas')
        .on('postgres_changes', {event:'UPDATE', schema:'public', table:'propostas'}, p => {
            if(p.new.id === proposta.id && p.new.entrada_paga) {
                alert('✅ PAGAMENTO CONFIRMADO!');
                mostrarParcelas();
            }
        })
        .subscribe();
}
</script>
</body>
</html>
