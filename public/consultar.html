<style>

* {

}

html {

/* CARD */

.card {

/* INPUT */

.input:focus,

/* BUTTONS */

.btn-success {

.btn-secondary {

.sucesso-box {

</style>

<body>

<div class="app">

        <div class="flex items-center justify-between">

            <div>

                <div class="text-xs opacity-70">
                    FLASHCRED
                </div>

                <h1 class="text-2xl font-bold">
                    Minha Proposta
                </h1>

            </div>

            <i class="fas fa-file-contract text-3xl opacity-80"></i>

<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        realtime:true
    }
);


/* ==========================================================
   VARIÁVEIS
========================================================== */

let propostaAtual = null;
let canalRealtime = null;
let webcamStream = null;
let modoAssinatura = 'texto';


/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

document.addEventListener(
    'DOMContentLoaded',
    iniciar
);


async function iniciar() {

    const cpf =
        localStorage.getItem(
            'flashcred_cpf'
        );

    const id =
        localStorage.getItem(
            'flashcred_proposta_id'
        );


    document
        .getElementById('cpfConsulta')
        .addEventListener(
            'keydown',
            function(e) {

                if(e.key === 'Enter') {
                    executarConsulta();
                }

            }
        );


    if(cpf) {

        document
            .getElementById(
                'cpfConsulta'
            )
            .value = cpf;

        await executarConsulta(cpf);

        return;
    }


    if(id) {

        await carregarPorId(id);

    }

}


/* ==========================================================
   NORMALIZA CPF
========================================================== */

function limparCPF(valor) {

    return String(valor || '')
        .replace(/\D/g,'')
        .slice(0,11);

}


/* ==========================================================
   CONSULTAR
========================================================== */

async function executarConsulta(
    cpfInformado = null
) {

    let cpf =
        cpfInformado ||
        document
            .getElementById(
                'cpfConsulta'
            )
            .value;


    cpf = limparCPF(cpf);


    if(cpf.length !== 11) {

        mostrarErroConsulta(
            'Digite os 11 números do CPF.'
        );

        return;
    }


    const botao =
        document.getElementById(
            'btnConsultar'
        );


    esconderErroConsulta();


    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';


    try {

        const resposta =
            await supabase
                .from('propostas')
                .select('*')
                .eq('cpf',cpf)
                .order(
                    'created_at',
                    {
                        ascending:false
                    }
                )
                .limit(1);


        if(resposta.error)
            throw resposta.error;


        if(
            !resposta.data ||
            resposta.data.length === 0
        ) {

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );

        }


        propostaAtual =
            resposta.data[0];


        salvarSessao();


        abrirProposta();


        configurarRealtime();


    } catch(error) {

        console.error(
            'Erro consulta:',
            error
        );


        mostrarErroConsulta(
            error.message ||
            'Não foi possível consultar a proposta.'
        );


    } finally {

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';

    }

}


/* ==========================================================
   CARREGAR POR ID
========================================================== */

async function carregarPorId(id) {

    try {

        const resposta =
            await supabase
                .from('propostas')
                .select('*')
                .eq('id',id)
                .maybeSingle();


        if(resposta.error)
            throw resposta.error;


        if(!resposta.data) {

            limparSessao();

            return;

        }


        propostaAtual =
            resposta.data;


        salvarSessao();


        abrirProposta();


        configurarRealtime();


    } catch(error) {

        console.error(
            error
        );

        limparSessao();

    }

}


/* ==========================================================
   SESSÃO
========================================================== */

function salvarSessao() {

    if(!propostaAtual)
        return;


    localStorage.setItem(
        'flashcred_proposta_id',
        propostaAtual.id
    );


    if(propostaAtual.cpf) {

        localStorage.setItem(
            'flashcred_cpf',
            limparCPF(
                propostaAtual.cpf
            )
        );

    }

}


function limparSessao() {

    localStorage.removeItem(
        'flashcred_proposta_id'
    );

    localStorage.removeItem(
        'flashcred_cpf'
    );

}


/* ==========================================================
   REALTIME
========================================================== */

function configurarRealtime() {

    if(!propostaAtual)
        return;


    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;

    }


    canalRealtime =
        supabase
            .channel(
                'flashcred-proposta-' +
                propostaAtual.id
            )
            .on(
                'postgres_changes',
                {
                    event:'*',
                    schema:'public',
                    table:'propostas',
                    filter:
                        `id=eq.${propostaAtual.id}`
                },
                function(payload) {

                    if(
                        payload.eventType ===
                        'DELETE'
                    ) {

                        return;

                    }


                    if(
                        payload.new
                    ) {

                        propostaAtual =
                            payload.new;


                        salvarSessao();


                        mostrarProposta(
                            propostaAtual
                        );

                    }

                }
            )
            .subscribe();

}


/* ==========================================================
   ABRIR
========================================================== */

function abrirProposta() {

    document
        .getElementById(
            'telaConsulta'
        )
        .classList.add(
            'hidden'
        );


    document
        .getElementById(
            'telaProposta'
        )
        .classList.remove(
            'hidden'
        );


    mostrarProposta(
        propostaAtual
    );

}


/* ==========================================================
   VOLTAR
========================================================== */

function voltarInicio() {

    pararCamera();


    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;

    }


    propostaAtual = null;


    limparSessao();


    document
        .getElementById(
            'telaProposta'
        )
        .classList.add(
            'hidden'
        );


    document
        .getElementById(
            'telaConsulta'
        )
        .classList.remove(
            'hidden'
        );


    document
        .getElementById(
            'cpfConsulta'
        )
        .value = '';

}


/* ==========================================================
   ERROS
========================================================== */

function mostrarErroConsulta(
    mensagem
) {

    const el =
        document.getElementById(
            'erroConsulta'
        );


    el.innerHTML =
        '<i class="fas fa-circle-exclama
