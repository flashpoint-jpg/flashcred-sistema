<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        texto: '#1E293B',
                        textoClaro: '#64748B'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; padding: 20px 16px; }
        
        .card { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 4px 16px rgba(10, 36, 99, 0.08); 
            padding: 24px; 
            max-width: 520px; 
            margin: 0 auto; 
            border: 1px solid #E2E8F0; 
        }
        .btn { 
            padding: 12px 16px; 
            border-radius: 12px; 
            font-weight: 600; 
            border: none; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 15px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            width: 100%; 
            margin: 6px 0;
        }
        .btn:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-primary { background: #0A2463; color: white; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-imprimir { background: #8B5CF6; color: white; }
        
        .input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid #CBD5E1; 
            border-radius: 12px; 
            font-size: 16px; 
            background: #FAFBFC; 
            margin-bottom: 16px; 
        }
        .input:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10, 36, 99, 0.1); }
        
        .bolinha-carregando {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #E2E8F0;
            border-top-color: #0A2463;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes girar {
            to { transform: rotate(360deg); }
        }
        
        .status-badge {
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 16px;
            display: inline-block;
            margin: 12px 0;
        }
        .status-nova { background: #FEF3C7; color: #92400E; }
        .status-aprovada { background: #D1FAE5; color: #065F46; }
        .status-reprovada { background: #FEE2E2; color: #991B1B; }
        
        .dados-proposta {
            background: #F8FAFC;
            border-radius: 16px;
            padding: 18px;
            margin: 16px 0;
            border-left: 4px solid #0A2463;
        }
        .dados-proposta p {
            padding: 7px 0;
            border-bottom: 1px dashed #E2E8F0;
            font-size: 15px;
        }
        .dados-proposta p:last-child { border-bottom: none; }
        .dados-proposta strong { color: #0A2463; font-weight: 600; }
        
        .qrcode-area {
            text-align: center;
            padding: 22px;
            background: white;
            border-radius: 16px;
            margin: 18px 0;
            border: 2px solid #E2E8F0;
        }
        .contrato-area {
            background: #FFFBEB;
            border-radius: 16px;
            padding: 18px;
            margin: 16px 0;
            border-left: 4px solid #F59E0B;
        }
        .aviso {
            font-size: 14px;
            color: #64748B;
            text-align: center;
            margin-top: 12px;
            line-height: 1.5;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-primar
