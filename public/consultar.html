<body>

<div class="app">

<section id="telaConsulta">

    <div class="header">

        <div class="logo">
            <i class="fas fa-building-columns"></i>
        </div>

        <div class="text-xs opacity-70">
            FLASHCRED
        </div>

        <h1 class="text-2xl font-bold">
            Acompanhe sua proposta
        </h1>

        <p class="text-sm opacity-80 mt-1">
            Consulte sua proposta utilizando seu CPF.
        </p>

    </div>

    <div class="card">

        <h2 class="text-xl font-bold mb-2">
            Consultar proposta
        </h2>

        <p class="text-sm text-slate-500 mb-5">
            Digite seu CPF para acessar sua proposta.
        </p>

        <input
            id="cpfConsulta"
            class="input mb-3"
            maxlength="11"
            inputmode="numeric"
            autocomplete="off"
            placeholder="CPF — somente números"
        >

        <button
            id="btnConsultar"
            class="btn btn-primary"
            onclick="executarConsulta()"
        >
            <i class="fas fa-search"></i>
            Consultar proposta
        </button>

    </div>

</section>


<section id="telaProposta" class="hidden">

    <div class="header">

        <div class="flex items-center justify-between">

            <div>

                <div class="text-xs opacity-70">
                    FLASHCRED
                </div>

                <h1 class="text-2xl font-bold">
                    Minha Proposta
                </h1>

            </div>

            <i class="fas fa-file-contract text-3xl opacity-80"></i>

        </div>

    </div>

    <div class="card">

        <div id="barraEtapas" class="stepper"></div>

    </div>

    <div id="conteudoProposta"></div>

    <button
        onclick="voltarInicio()"
        class="btn btn-secondary"
    >
        <i class="fas fa-arrow-left"></i>
        Consultar outro CPF
    </button>

</section>

<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        realtime: true
    }
);


/* ==========================================================
   VARIÁVEIS
========================================================== */

let propostaAtual = null;
let canalRealtime = null;
let webcamStream = null;
let modoAssinatura = 'texto';


/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

document.addEventListener(
    'DOMContentLoaded',
    iniciar
);


async function iniciar() {

    const cpf =
        localStorage.getItem(
            'flashcred_cpf'
        );

    const id =
        localStorage.getItem(
            'flashcred_proposta_id'
        );

    const campo =
        document.getElementById(
            'cpfConsulta'
        );

    campo.addEventListener(
        'keydown',
        function(e) {

            if(e.key === 'Enter') {
                executarConsulta();
            }

        }
    );
    /* Mantém a tela de consulta disponível ao abrir a página.
       A sessão anterior não deve pular a consulta automaticamente. */
    if(cpf) {
        campo.value = cpf;
    }

    /* A consulta só ocorre ao clicar no botão ou pressionar Enter. */
}


/* ==========================================================
   CONSULTA CPF
========================================================== */

async function executarConsulta(cpfInformado = null) {

    let cpf =
        cpfInformado ||
        document
            .getElementById('cpfConsulta')
            .value;

    cpf =
        String(cpf)
        .replace(/\D/g,'');


    if(cpf.length !== 11) {

        alert(
            'Digite os 11 números do CPF.'
        );

        return;
    }


    const botao =
        document.getElementById(
            'btnConsultar'
        );

    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';


    try {

        const { data, error } =
            await supabase
                .from('propostas')
                .select('*')
                .eq('cpf', cpf)
                .limit(1);


        if(error) {
            throw new Error(
                error.message
            );
        }


        if(!data || !data.length) {

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );
        }


        propostaAtual =
            data[0];


        salvarSessao();

        abrirProposta();

        configurarRealtime();


    } catch(error) {

        console.error(
            'Erro consulta:',
            error
        );

        alert(
            error.message ||
            'Não foi possível consultar a proposta.'
        );

    } finally {

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';
    }
}


/* ==========================================================
   CARREGAR POR ID
========================================================== */

async function carregarPorId(id) {

    try {

        const { data, error } =
            await supabase
                .from('propostas')
                .select('*')
                .eq('id', id)
                .maybeSingle();


        if(error) {

            throw new Error(
                error.message
            );
        }


        if(!data) {

            localStorage.removeItem(
                'flashcred_proposta_id'
            );

            localStorage.removeItem(
                'flashcred_cpf'
            );

            return;
        }


        propostaAtual =
            data;

        salvarSessao();

        abrirProposta();

        configurarRealtime();


    } catch(error) {

        console.error(error);

        localStorage.removeItem(
            'flashcred_proposta_id'
        );

        localStorage.removeItem(
            'flashcred_cpf'
        );

        alert(
            'Não foi possível recuperar a proposta.'
        );
    }
}


/* ==========================================================
   SESSÃO
========================================================== */

function salvarSessao() {

    if(!propostaAtual)
        return;


    if(propostaAtual.id) {

        localStorage.setItem(
            'flashcred_proposta_id',
            propostaAtual.id
        );
    }


    if(propostaAtual.cpf) {

        localStorage.setItem(
            'flashcred_cpf',
            propostaAtual.cpf
        );
    }
}


/* ==========================================================
   VERIFICAR BOOLEANO
========================================================== */

function booleano(valor) {

    if(
        valor === true ||
        valor === 1
    ) {
        return true;
    }


    if(
        typeof valor === 'string'
    ) {

        const v =
            valor.trim().toLowerCase();

        return (
            v === 'true' ||
            v === '1' ||
            v === 'sim' ||
            v === 'pago'
        );
    }


    return false;
}


/* ==========================================================
   REALTIME
========================================================== */

function configurarRealtime() {

    if(!propostaAtual)
        return;


    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;
    }


    canalRealtime =
        supabase
        .channel(
            'flashcred_' +
            String(propostaAtual.id) +
            '_' +
            Date.now()
        )
        .on(
            'postgres_changes',
            {
                event: 'UPDATE',
                schema: 'public',
                table: 'propostas',
                filter:
                    `id=eq.${propostaAtual.id}`
            },
            function(payload) {

                console.log(
                    'Atualização recebida:',
                    payload.new
                );


                if(payload.new) {

                    propostaAtual = {
                        ...propostaAtual,
                        ...payload.new
                    };


                    salvarSessao();


                    /*
                     * IMPORTANTE:
                     * redesenha a tela usando
                     * os dados novos do painel.
                     */

                    mostrarProposta(
                        propostaAtual
                    );


                    /*
                     * Se a entrada foi paga,
                     * a tela imediatamente
                     * passa para parcelas.
                     */

                    if(
                        booleano(
                            propostaAtual.entrada_paga
                        )
                    ) {

                        pararCamera();
                    }
                }

            }
        )
        .subscribe(function(status) {

            console.log(
                'Realtime:',
                status
            );

        });
}


/* ==========================================================
   ABRIR PROPOSTA
========================================================== */

function abrirProposta() {

    document
        .getElementById('telaConsulta')
        .classList.add('hidden');


    document
        .getElementById('telaProposta')
        .classList.remove('hidden');


    mostrarProposta(
        propostaAtual
    );
}


/* ==========================================================
   VOLTAR
========================================================== */

function voltarInicio() {

    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;
    }


    pararCamera();

    propostaAtual = null;


    localStorage.removeItem(
        'flashcred_cpf'
    );

    localStorage.removeItem(
        'flashcred_proposta_id'
    );


    document
        .getElementById('telaProposta')
        .classList.add('hidden');


    document
        .getElementById('telaConsulta')
        .classList.remove('hidden');


    document
        .getElementById('cpfConsulta')
        .value = '';
}


/* ==========================================================
   ETAPA
========================================================== */

function determinarEtapa(p) {

    if(!p)
        return 1;


    const status =
        String(
            p.status || ''
        )
        .trim()
        .toLowerCase();


    const aprovado =
        status === 'aprovada' ||
        status === 'aprovado';


    const parcelas =
        Number(
            p.qtd_parcelas_escolhida || 0
        );


    const assinado =
        booleano(
            p.contrato_assinado
        );


    const entradaPaga =
        booleano(
            p.entrada_paga
        );


    /*
     * REGRA PRINCIPAL:
     *
     * Se a entrada foi paga,
     * a proposta está na última etapa.
     *
     * Isso impede que o cliente
     * volte para contrato.
     */

    if(entradaPaga) {
        return 5;
    }


    if(!aprovado)
        return 1;


    if(!parcelas)
        return 2;


    if(!assinado)
        return 3;


    return 4;
}


/* ==========================================================
   BARRA ETAPAS
=
