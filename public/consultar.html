<script>

    // ==========================================================
    // SUPABASE
    // ==========================================================

    const SUPABASE_URL =
        'https://rgcclordmqjmwuzrrfbd.supabase.co';

    const SUPABASE_KEY =
        'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================================
    // VARIÁVEIS
    // ==========================================================

    let propostaAtual = null;

    let assinaturaEmProcessamento = false;


    // ==========================================================
    // INICIA UMA ÚNICA VEZ
    // ==========================================================

    document.addEventListener(
        'DOMContentLoaded',
        iniciar,
        { once: true }
    );


    // ==========================================================
    // INICIAR
    // ==========================================================

    async function iniciar() {

        try {

            const parametros =
                new URLSearchParams(
                    window.location.search
                );


            const cpfRecebido =
                parametros.get('cpf');


            // --------------------------------------------------
            // NÃO REDIRECIONA PARA CONSULTAR.HTML
            // ISSO EVITA O LOOP QUE APARECEU NA SUA FOTO.
            // --------------------------------------------------

            if (!cpfRecebido) {

                mostrarErro(
                    'Nenhuma proposta foi identificada. Abra esta página através do link da sua proposta.'
                );

                return;
            }


            // --------------------------------------------------
            // LIMPA O CPF
            // --------------------------------------------------

            const cpf =
                cpfRecebido.replace(/\D/g, '');


            // --------------------------------------------------
            // VALIDA CPF
            // --------------------------------------------------

            if (cpf.length !== 11) {

                mostrarErro(
                    'O CPF informado é inválido.'
                );

                return;
            }


            // --------------------------------------------------
            // CONSULTA PROPOSTA
            // --------------------------------------------------

            const resultado =
                await supabaseClient
                    .from('propostas')
                    .select('*')
                    .eq('cpf', cpf)
                    .maybeSingle();


            const data =
                resultado.data;

            const error =
                resultado.error;


            // --------------------------------------------------
            // ERRO SUPABASE
            // --------------------------------------------------

            if (error) {

                console.error(
                    'Erro Supabase:',
                    error
                );

                mostrarErro(
                    'Não foi possível consultar a proposta. Verifique a conexão com o sistema.'
                );

                return;
            }


            // --------------------------------------------------
            // PROPOSTA NÃO ENCONTRADA
            // --------------------------------------------------

            if (!data) {

                mostrarErro(
                    'Nenhuma proposta foi encontrada para este CPF.'
                );

                return;
            }


            // --------------------------------------------------
            // GUARDA PROPOSTA
            // --------------------------------------------------

            propostaAtual = data;


            // --------------------------------------------------
            // DADOS
            // --------------------------------------------------

            const nome =
                data.nome || 'Cliente';


            const valorDesejado =
                Number(
                    data.valor_desejado || 0
                );


            const entrada =
                Number(
                    data.valor_entrada || 0
                );


            const juros =
                Number(
                    data.juros_mensal || 5
                );


            const quantidadeParcelas =
                Number(
                    data.quantidade_parcelas || 1
                );


            const diasEntrega =
                Number(
                    data.dias_entrega || 8
                );


            // --------------------------------------------------
            // CÁLCULO
            // --------------------------------------------------

            const valorJuros =
                valorDesejado *
                (juros / 100);


            const valorTotal =
                valorDesejado +
                valorJuros;


            const valorFinanciado =
                Math.max(
                    valorTotal - entrada,
                    0
                );


            const valorParcela =
                quantidadeParcelas > 0
                    ? valorFinanciado /
                      quantidadeParcelas
                    : 0;


            // --------------------------------------------------
            // VERIFICA SE JÁ ESTÁ ASSINADA
            // --------------------------------------------------

            const jaAssinada =
                data.status === 'assinado' ||
                !!data.assinado_em;


            // --------------------------------------------------
            // MOSTRA PROPOSTA
            // --------------------------------------------------

            mostrarProposta({

                nome: nome,

                valorDesejado:
                    valorDesejado,

                valorTotal:
                    valorTotal,

                entrada:
                    entrada,

                juros:
                    juros,

                quantidadeParcelas:
                    quantidadeParcelas,

                valorParcela:
                    valorParcela,

                diasEntrega:
                    diasEntrega,

                jaAssinada:
                    jaAssinada,

                assinadoEm:
                    data.assinado_em || null
            });


        } catch (erro) {

            console.error(
                'Erro geral:',
                erro
            );

            mostrarErro(
                'Ocorreu um erro ao carregar a proposta.'
            );
        }
    }
