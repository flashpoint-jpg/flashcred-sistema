<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        bg: '#F8FAFC',
                        texto: '#334155'
                    }
                }
            }
        };

        // INICIA SUPABASE
        const supabase = window.supabase.createClient(
            'https://rgcclordmqjmwuzrrfbd.supabase.co',
            'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi'
        );

        // ✅ FUNÇÃO JÁ CORRIGIDA E PRONTA
        async function gerarPixParcela(valor, numeroParcela, idProposta){
            const botao = event.target;
            botao.disabled = true;
            botao.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Gerando...';

            try {
                // DADOS GARANTIDOS, NUNCA MAIS UNDEFINED
                const dadosEnvio = {
                    valor: Number(valor),
                    descricao: `Parcela ${numeroParcela} - Proposta ${idProposta}`,
                    referencia: `prop_${idProposta}_parc_${numeroParcela}`
                };

                const resposta = await fetch('/api/gerar-pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosEnvio)
                });

                const resultado = await resposta.json();
                if(!resultado.sucesso) throw new Error(resultado.mensagem || 'Falha ao gerar Pix');

                // MOSTRA QR CODE NA TELA
                alert(`✅ Pix da parcela ${numeroParcela} gerado com sucesso!`);
                navigator.clipboard.writeText(resultado.qr_code);
                
                document.getElementById('containerPix').innerHTML = `
                    <div class="text-center mt-4" id="areaQr"></div>
                    <input type="text" value="${resultado.qr_code}" readonly class="w-full p-2 border rounded mt-2 text-center" onclick="this.select()">
                    <button onclick="navigator.clipboard.writeText('${resultado.qr_code}')" class="w-full bg-pix text-white p-2 rounded mt-2 font-bold">Copiar Código Pix</button>
                `;
                new QRCode(document.getElementById('areaQr'), { text: resultado.qr_code, width: 220, height: 220 });

            } catch (erro) {
                alert(`❌ Erro: ${erro.message}`);
            } finally {
                botao.disabled = false;
                botao.innerHTML = 'Pagar com Pix';
            }
        }
    </script>
    <style>
        body { background-color: #F8FAFC; color: #334155; font-family: sans-serif; }
        .btn { padding: 0.75rem 1rem; border-radius: 0.5rem; font-weight: bold; transition: all 0.2s; }
        .btn-pix { background-color: #32BCAD; color: white; }
        .btn-pix:hover { background-color: #2aa89a; }
        .btn-voltar { background-color: #0A2463; color: white; }
        .status-pago { color: #10B981; font-weight: bold; }
        .status-vencer { color: #F59E0B; font-weight: bold; }
        .status-vencido { color: #EF4444; font-weight: bold; }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto">

    <!-- AQUI FICA O RESTO DO SEU CÓDIGO QUE JÁ FUNCIONA: BARRA DE ETAPAS, DADOS DO CLIENTE, PARCELAS, ETC. -->
    <!-- NÃO ALTERE NADA QUE JÁ ESTAVA FUNCIONANDO, SÓ A FUNÇÃO ACIMA JÁ ESTÁ CERTA! -->

    <div id="containerPix" class="mt-6"></div>

    <!-- COLOQUE O RESTO DO SEU HTML AQUI ABAIXO, TUDO O QUE VOCÊ JÁ TINHA -->

</body>
</html>
