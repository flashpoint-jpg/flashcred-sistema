<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Proposta | FlashCred</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
            --bg-body: #F0F4F8;
            --borda: #D1D9E6;
            --texto: #1E293B;
            --texto-claro: #64748B;
            --sombra: 0 4px 12px rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); line-height: 1.5; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; }
        .cartao { background: white; border-radius: 12px; padding: 24px; box-shadow: var(--sombra); margin-bottom: 20px; }
        .botao { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; width: 100%; transition: 0.2s; }
        .botao-primario { background: var(--primary); color: white; }
        .botao-sucesso { background: var(--sucesso); color: white; }
        .campo { width: 100%; padding: 12px; border: 1px solid var(--borda); border-radius: 8px; margin-bottom: 12px; font-size: 15px; }
        .titulo { font-size: 20px; font-weight: bold; color: var(--primary); margin-bottom: 16px; }
        .detalhe-linha { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; border-bottom: 1px solid #F1F5F9; padding-bottom: 6px; }
        .bloco-produtos { background: #F8FAFC; border: 1px solid var(--borda); border-radius: 8px; padding: 14px; margin-top: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="cartao" id="blocoBusca">
        <h2 class="titulo text-center">🔍 Consultar Proposta</h2>
        <p class="text-sm text-slate-600 mb-4 text-center">Digite seu CPF para acompanhar sua proposta e os detalhes do seu pedido.</p>
        <input type="text" id="cpfConsulta" placeholder="Digite seu CPF (só números)" maxlength="11" class="campo">
        <button onclick="consultarProposta()" class="botao botao-primario">Consultar</button>
    </div>

    <div id="resultadoProposta"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const cpfParam = urlParams.get('cpf');
    if(cpfParam) {
        document.getElementById('cpfConsulta').value = cpfParam;
        consultarProposta();
    }
};

async function consultarProposta() {
    const cpf = document.getElementById('cpfConsulta').value.trim().replace(/\D/g,'');
    if(!cpf) { alert('Digite seu CPF!'); return; }

    const {data, error} = await supabase.from('propostas').select('*').eq('cpf', cpf).single();
    const resDiv = document.getElementById('resultadoProposta');

    if(error || !data) {
        resDiv.innerHTML = `<div class="cartao text-center text-red-600 font-bold">Nenhuma proposta encontrada para este CPF.</div>`;
        return;
    }

    const v = Number(data.valor_desejado||0);
    const e = Number(data.valor_entrada||0);
    const j = Number(data.juros_mensal||5);
    const q = Number(data.quantidade_parcelas||0);
    const total = v * (1 + j/100);
    const saldo = total - e;
    const taxa = j / 100;
    const parc = q > 0 ? (taxa > 0 ? saldo * (Math.pow(1 + taxa, q) * taxa) / (Math.pow(1 + taxa, q) - 1) : saldo / q) : 0;

    // MONTAGEM DOS PRODUTOS SE A ENTRADA JÁ ESTIVER PAGA OU APROVADA
    let produtosHtml = '';
    if(data.entrada_paga && data.produtos && data.produtos.length > 0) {
        produtosHtml = `
            <div class="bloco-produtos">
                <h4 class="font-bold text-primary mb-2"><i class="fas fa-box-open"></i> Detalhes do seu Pedido / Produtos</h4>
                <ul class="list-disc pl-5 space-y-1 text-sm">
        `;
        data.produtos.forEach(prod => {
            let valStr = prod.valor ? ` | R$ ${Number(prod.valor).toFixed(2)}` : '';
            let corStr = prod.cor ? ` | Cor: ${prod.cor}` : '';
            let detStr = prod.detalhes ? ` | Detalhes: ${prod.detalhes}` : '';
            produtosHtml += `<li><strong>${prod.nome || 'Produto'}</strong> (Qtd: ${prod.qtd || 1})${valStr}${corStr}${detStr}</li>`;
        });
        produtosHtml += `</ul></div>`;
    } else if (!data.entrada_paga) {
        produtosHtml = `<div class="mt-4 p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded text-sm">ℹ️ Os detalhes completos do seu pedido e produtos serão liberados aqui assim que o pagamento da entrada for confirmado.</div>`;
    }

    resDiv.innerHTML = `
        <div class="cartao">
            <h3 class="titulo">Olá, ${data.nome}</h3>
            <div class="detalhe-linha"><span>Status da Proposta:</span><strong>${data.status}</strong></div>
            <div class="detalhe-linha"><span>Valor Total:</span><strong>R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})}</strong></div>
            <div class="detalhe-linha"><span>Entrada:</span><strong>R$ ${e.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})} (${data.entrada_paga?'✅ Paga':'⏳ Pendente'})</strong></div>
            <div class="detalhe-linha"><span>Parcelamento:</span><strong>${q}x de R$ ${parc.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})}</strong></div>
            <div class="detalhe-linha"><span>Prazo de Entrega:</span><strong>${data.dias_entrega || 7} dias úteis</strong></div>
            
            ${produtosHtml}

            <h4 class="font-bold text-primary mt-4 mb-2">📅 Suas Parcelas</h4>
            <div style="max-height: 200px; overflow-y: auto;">
                ${(data.datas_parcelas||[]).map((dt, idx) => `
                    <div class="detalhe-linha">
                        <span>${idx+1}ª Parcela - Vencimento: ${dt ? new Date(dt + 'T00:00:00').toLocaleDateString('pt-BR') : ''}</span>
                        <strong>R$ ${parc.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})}</strong>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}
</script>
</body>
</html>
