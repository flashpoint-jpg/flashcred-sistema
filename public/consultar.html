<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 25px; width: 100%; max-width: 520px; border: 1px solid #E2E8F0; }
        .btn { padding: 12px 20px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-sucesso:hover { background: #059669; }
        .btn-primary { background: #0A2463; color: white; margin-top: 8px; }
        .input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; background: #FAFBFC; margin-bottom: 12px; }
        .hidden { display: none !important; }
        .text-primary { color: #0A2463; }
        .text-center { text-align: center; }
        .bg-gray-50 { background: #F9FAFB; }
        .p-4 { padding: 1rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .space-y-2 > * + * { margin-top: 0.5rem; }
        .text-sm { font-size: 0.875rem; }
        .font-medium { font-weight: 500; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .w-48 { width: 12rem; }
        .h-48 { height: 12rem; }
        .border { border-width: 1px; }
        .p-2 { padding: 0.5rem; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .font-mono { font-family: monospace; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-gray-500 { color: #6B7280; }
        .text-perigo { color: #EF4444; }
        .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-aprovada { background: #D1FAE5; color: #065F46; }
        .badge-analise { background: #FEF3C7; color: #92400E; }
        .badge-reprovada { background: #FEE2E2; color: #991B1B; }
    </style>
</head>
<body>

<div class="card">
    <div id="secaoBusca">
        <h2 class="text-xl font-bold text-primary text-center mb-4">🔍 Acompanhar Proposta</h2>
        <p class="text-sm text-gray-600 text-center mb-4">Digite seu CPF para consultar o status, ver parcelas e realizar o pagamento.</p>
        <label class="font-medium text-sm">Seu CPF</label>
        <input type="text" id="cpfConsulta" class="input" placeholder="000.000.000-00" maxlength="14">
        <button class="btn btn-sucesso" onclick="consultarProposta()">Consultar Proposta</button>
    </div>

    <div id="secaoDetalhes" class="hidden">
        <h2 class="text-xl font-bold text-primary text-center mb-4">📋 Detalhes da Proposta</h2>
        <div id="dadosCliente" class="mb-4 text-sm bg-gray-50 p-4 rounded-xl space-y-2"></div>
        
        <div id="areaPagamento" class="hidden text-center">
            <h3 class="font-bold text-md text-primary mb-2">💳 Pagamento da Entrada via Pix</h3>
            <p class="text-sm text-gray-600 mb-3" id="textoValorEntrada"></p>
            
            <div id="loadingPix" class="py-6 text-gray-500 text-sm">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Gerando Pix seguro pelo Mercado Pago...
            </div>

            <div id="conteudoPix" class="hidden">
                <img id="imgQrCode" src="" alt="QR Code Pix" class="mx-auto mb-3 w-48 h-48 border rounded-lg p-2">
                <textarea id="copiaEColaPix" class="input text-xs font-mono" rows="3" readonly></textarea>
                <button class="btn btn-sucesso mt-2" onclick="copiarPix()"><i class="fa-solid fa-copy"></i> Copiar Código Pix</button>
            </div>
        </div>

        <button class="btn btn-primary mt-4" onclick="voltarBusca()">🔎 Consultar Outra Proposta</button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function limparCpf(cpf) { return String(cpf || '').replace(/\D/g, ''); }
function formatarCpf(cpf) { return limparCpf(cpf).replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'); }

async function consultarProposta() {
    const cpfInput = limparCpf(document.getElementById('cpfConsulta').value);
    if(!cpfInput || cpfInput.length !== 11) {
        alert('Digite um CPF válido com 11 números!');
        return;
    }

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .eq('cpf', cpfInput)
        .maybeSingle();
    
    if(error || !data) {
        alert('Proposta não encontrada para este CPF. Verifique se digitou corretamente.');
        return;
    }

    document.getElementById('secaoBusca').classList.add('hidden');
    document.getElementById('secaoDetalhes').classList.remove('hidden');

    let classeStatus = 'badge-analise';
    if(data.status === 'Aprovada') classeStatus = 'badge-aprovada';
    if(data.status === 'Reprovada') classeStatus = 'badge-reprovada';

    const htmlDados = `
        <p><strong>Nome:</strong> ${data.nome || 'Não informado'}</p>
        <p><strong>CPF:</strong> ${formatarCpf(data.cpf)}</p>
        <p><strong>Status:</strong> <span class="badge ${classeStatus}">${data.status || 'Em Análise'}</span></p>
        <p><strong>Valor Solicitado:</strong> R$ ${parseFloat(data.valor_desejado || 0).toFixed(2).replace('.', ',')}</p>
        ${data.qtd_parcelas ? `<p><strong>Quantidade de Parcelas:</strong> ${data.qtd_parcelas}x</p>` : ''}
        ${data.valor_parcela ? `<p><strong>Valor de Cada Parcela:</strong> R$ ${parseFloat(data.valor_parcela || 0).toFixed(2).replace('.', ',')}</p>` : ''}
        ${data.valor_entrada ? `<p><strong>Valor da Entrada:</strong> R$ ${parseFloat(data.valor_entrada || 0).toFixed(2).replace('.', ',')}</p>` : ''}
        ${data.pago ? `<p style="color: #10B981; font-weight: 600;">✅ Entrada já Paga!</p>` : ''}
    `;
    document.getElementById('dadosCliente').innerHTML = htmlDados;

    if(data.status === 'Aprovada' && !data.pago && data.valor_entrada > 0) {
        document.getElementById('areaPagamento').classList.remove('hidden');
        document.getElementById('textoValorEntrada').textContent = `Valor total para pagamento da entrada: R$ ${parseFloat(data.valor_entrada).toFixed(2).replace('.', ',')}`;
        gerarPixAutomatico(data.valor_entrada, `Entrada Proposta - ${data.nome}`, data.telefone || 'cliente@flashcred.com.br');
    } else {
        document.getElementById('areaPagamento').classList.add('hidden');
    }
}

async function gerarPixAutomatico(valor, descricao, contato) {
    const tokenPadrao = 'APP_USR-8158139097874832-072720-d200da044f05a1dd8eb75f90e0551431-18499471';
    const token = localStorage.getItem('tokenMercadoPagoProducao') || tokenPadrao;
    
    try {
        const resposta = await fetch('https://api.mercadopago.com/v1/payments', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'X-Idempotency-Key': 'fp-' + Date.now()
            },
            body: JSON.stringify({
                transaction_amount: parseFloat(valor),
                description: descricao.substring(0, 60),
                payment_method_id: 'pix',
                payer: {
                    email: 'atendimento@flashcred.com.br',
                    identification: { type: 'CPF', number: limparCpf(document.getElementById('cpfConsulta').value) }
                }
            })
        });

        const resultado = await resposta.json();

        if (resultado.point_of_interaction?.transaction_data) {
            const qrCodeBase64 = resultado.point_of_interaction.transaction_data.qr_code_base64;
            const qrCodeCopiaCola = resultado.point_of_interaction.transaction_data.qr_code;

            document.getElementById('imgQrCode').src = `data:image/png;base64,${qrCodeBase64}`;
            document.getElementById('copiaEColaPix').value = qrCodeCopiaCola;
            document.getElementById('loadingPix').classList.add('hidden');
            document.getElementById('conteudoPix').classList.remove('hidden');
        } else {
            throw new Error(resultado.message || 'Resposta inválida do Mercado Pago');
        }
    } catch(err) {
        document.getElementById('loadingPix').innerHTML = `<p class="text-perigo">⚠️ Erro ao gerar Pix: ${err.message}<br>Tente novamente ou contate o atendimento.</p>`;
    }
}

function copiarPix() {
    const campo = document.getElementById('copiaEColaPix');
    campo.select();
    navigator.clipboard.writeText(campo.value)
        .then(() => alert('✅ Código Pix copiado com sucesso!'))
        .catch(() => alert('Não foi possível copiar. Selecione e copie manualmente o código.'));
}

function voltarBusca() {
    document.getElementById('secaoDetalhes').classList.add('hidden');
    document.getElementById('secaoBusca').classList.remove('hidden');
    document.getElementById('cpfConsulta').value = '';
    document.getElementById('loadingPix').classList.remove('hidden');
    document.getElementById('conteudoPix').classList.add('hidden');
}

// Carrega automaticamente se vier CPF no link (?cpf=00000000000)
window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const cpfUrl = urlParams.get('cpf');
    if(cpfUrl) {
        document.getElementById('cpfConsulta').value = cpfUrl;
        consultarProposta();
    }
});
</script>
</body>
</html>
