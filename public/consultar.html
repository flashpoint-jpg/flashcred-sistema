<script>

function formatarMoeda(valor) {
    const num = Number(valor);
    if (isNaN(num)) return '0,00';
    return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function calcularDiasUteis(dataInicio, totalDiasUteis) {
    if (!totalDiasUteis || totalDiasUteis <= 0) return { faltam: 0, porcentagem: 0, classe: 'barra-entrega-verde' };
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    let dataAlvo = new Date(dataInicio);
    let contador = 0;
    while(contador < totalDiasUteis) {
        dataAlvo.setDate(dataAlvo.getDate() + 1);
        const dia = dataAlvo.getDay();
        if(dia !== 0 && dia !== 6) contador++;
    }
    let faltam = 0;
    let temp = new Date(hoje);
    while(temp <= dataAlvo) {
        const d = temp.getDay();
        if(d !== 0 && d !== 6) faltam++;
        temp.setDate(temp.getDate() + 1);
    }
    faltam = Math.max(0, faltam);
    const porcentagem = Math.round(((totalDiasUteis - faltam) / totalDiasUteis) * 100);
    let classe = 'barra-entrega-verde';
    if(faltam <= 2) classe = 'barra-entrega-vermelha';
    else if(faltam <= 5) classe = 'barra-entrega-amarela';
    return { faltam, porcentagem, classe };
}

function prazoParcela(dtStr) {
    if(!dtStr) return {classe:'barra-parcela-verde', texto:'Sem data'};
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const dt = new Date(dtStr); dt.setHours(0,0,0,0);
    const dias = Math.ceil((dt - hoje) / (1000*60*60*24));
    if(dias < 0) return {classe:'barra-parcela-vermelha', texto:`Vencida há ${Math.abs(dias)} dias`};
    if(dias === 0) return {classe:'barra-parcela-vermelha', texto:'Vence HOJE'};
    if(dias <= 5) return {classe:'barra-parcela-amarela', texto:`Faltam ${dias} dias`};
    return {classe:'barra-parcela-verde', texto:`Faltam ${dias} dias`};
}

async function gerarPixViaAPI(valor, descricao) {
    try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/gerar-pix`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
            body: JSON.stringify({ cpf: dadosProposta.cpf, nome: dadosProposta.nome, whatsapp: dadosProposta.whatsapp, valor: Number(valor), descricao: descricao })
        });
        const resultado = await response.json();
        if(resultado && (resultado.copia_e_cola || resultado.pix_copia_e_cola)) return resultado.copia_e_cola || resultado.pix_copia_e_cola;
        throw new Error(resultado.erro || 'Erro ao gerar Pix');
    } catch (err) {
        console.error('Erro Pix:', err);
        const valorStr = Number(valor).toFixed(2);
        const chave = '33552949852';
        const nome = 'FELIPE COSTA';
        const cidade = 'MUZAMBINHO';
        const gui = 'br.gov.bcb.pix';
        const sub26 = '00' + String(gui.length).padStart(2, '0') + gui + '01' + String(chave.length).padStart(2, '0') + chave;
        const campo26 = '26' + String(sub26.length).padStart(2, '0') + sub26;
        const payloadSemCrc = '000201' + campo26 + '5204000053039865802BR59' + String(nome.length).padStart(2, '0') + nome + '60' + String(cidade.length).padStart(2, '0') + cidade + '62070503***54' + String(valorStr.length).padStart(2, '0') + valorStr + '6304';
        
        function calculaCRC16(payload) {
            let polinomio = 0x1021; let res = 0xFFFF; let dados = new TextEncoder().encode(payload);
            for (let i = 0; i < dados.length; i++) { 
                res ^= (dados[i] << 8); 
                for (let j = 0; j < 8; j++) {
                    if ((res & 0x8000) !== 0) {
                        res = ((res << 1) ^ polinomio) & 0xFFFF;
                    } else {
                        res = (res << 1) & 0xFFFF;
                    }
                }
            }
            return res.toString(16).toUpperCase().padStart(4, '0');
        }
        return payloadSemCrc + calculaCRC16(payloadSemCrc);
    }
}

async function buscarProposta() {
    const cpfInput = document.getElementById('cpfConsulta');
    const aviso = document.getElementById('avisoErro');
    if (!cpfInput || !aviso) return;
    
    aviso.classList.add('oculto');
    const cpf = cpfInput.value.replace(/\D/g,'');

    if(cpf.length !== 11) {
        aviso.textContent = `⚠️ O CPF precisa ter 11 dígitos (informado: ${cpf.length})`;
        aviso.classList.remove('oculto');
        return;
    }

    const areaConsulta = document.getElementById('areaConsulta');
    const conteudoProposta = document.getElementById('conteudoProposta');
    if (areaConsulta) areaConsulta.classList.add('hidden');
    if (conteudoProposta) {
        conteudoProposta.innerHTML = `<div class="loading"><i class="fas fa-spinner fa-spin text-2xl"></i><br>Buscando proposta...</div>`;
        conteudoProposta.classList.remove('hidden');
    }

    try {
        const {data, error} = await supabase.from('propostas').select('*').eq('cpf', cpf).single();
        if(error || !data) {
            conteudoProposta.innerHTML = `<div class="card text-center"><i class="fas fa-exclamation-circle text-red-500 text-3xl mb-2"></i><br>Proposta não encontrada.<br><br><button onclick="window.location.reload()" class="btn btn-primary" style="padding:10px; font-size:14px;">Tentar outro CPF</button></div>`;
            return;
        }

        dadosProposta = data; 
        await montarTela(data); 
        ativarTempoReal(cpf);
    } catch (e) {
        console.error("Erro na consulta:", e);
        conteudoProposta.innerHTML = `<div class="card text-center text-red-500"><i class="fas fa-exclamation-triangle text-3xl mb-2"></i><br>Ocorreu um erro ao processar os dados da proposta.<br><button onclick="window.location.reload()" class="btn btn-primary mt-3">Recarregar Página</button></div>`;
    }
}

async function montarTela(p) {
    try {
        const v = Number(p.valor_desejado || 0);
        const e = Number(p.valor_entrada || 0);
        const j = Number(p.juros_mensal || 5);
        const q = Number(p.quantidade_parcelas || 1);
        const qtdEscolhidaFinal = Number(p.qtd_parcelas_escolhida || q);
        const total = v * (1 + j / 100);
        const diasUteisEntrega = p.dias_entrega || 7;
        const datas = p.datas_parcelas || [];
        const pagas = Number(p.parcelas_pagas || 0);

        let passo = 1;
        if(p.status === 'Aprovada') passo = 2;
        if(p.contrato_assinado) passo = 3;
        if(p.entrada_paga) passo = 4;

        const dadosEntrega = calcularDiasUteis(new Date(), diasUteisEntrega);

        let html = `
        <div class="card">
            <h2 class="text-xl font-bold text-primary mb-2 text-center">Olá, ${p.nome || 'Cliente'}!</h2>
            <p class="mb-3 text-center">Sua proposta está: <strong class="${p.status==='Aprovada'?'text-green-600':'text-orange-500'}">${p.status || 'Pendente'}</strong></p>

            <div class="progresso">
                <div class="passo ${passo>=1?'concluido':''}"><div class="bolinha">${passo>1?'✓':'1'}</div><span>Proposta</span></div>
                <div class="passo ${passo>=2?(passo>2?'concluido':'ativo'):''}"><div class="bolinha">${passo>2?'✓':'2'}</div><span>Aprovada</span></div>
                <div class="passo ${passo>=3?(passo>3?'concluido':'ativo'):''}"><div class="bolinha">${passo>3?'✓':'3'}</div><span>Contrato</span></div>
                <div class="passo ${passo>=4?'ativo':''}"><div class="bolinha">4</div><span>Pagamento</span></div>
            </div>

            ${p.status === 'Aprovada' ? `
            <div class="aviso-entrega">
                <i class="fas fa-truck"></i> 🚚 ENTREGA EM ATÉ ${diasUteisEntrega} DIAS ÚTEIS<br>
                <div class="barra-entrega"><div class="${dadosEntrega.classe} h-full" style="width:${dadosEntrega.porcentagem}%"></div></div>
                <div class="texto-entrega">Faltam <strong>${dadosEntrega.faltam}</strong> dias úteis</div>
            </div>` : ''}

            <div class="bg-gray-50 p-3 rounded-lg mb-3">
                <p><strong>👤 Cliente:</strong> ${p.nome || ''}</p>
                <p><strong>📄 CPF:</strong> ${String(p.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')}</p>
                <p><strong>📱 WhatsApp:</strong> ${p.whatsapp || 'Não informado'}</p>
                <p><strong>🏠 Endereço:</strong> ${p.endereco || 'Não informado'}</p>
                <hr class="my-2 border-gray-300">
                <p><strong>Valor do pedido:</strong> R$ ${formatarMoeda(v)}</p>
                <p><strong>Entrada:</strong> R$ ${formatarMoeda(e)}</p>
                <p><strong>Quantidade de parcelas:</strong> ${qtdEscolhidaFinal}x</p>
                <p><strong>Total com juros:</strong> R$ ${formatarMoeda(total)}</p>
            </div>
        `;

        if(p.status === 'Nova' || p.status === 'Em Análise' || !p.status) {
            html += `<div class="text-center p-4 bg-yellow-50 rounded-lg"><i class="fas fa-clock text-yellow-500 text-2xl mb-2"></i><p class="font-semibold">Aguardando análise...</p></div>`;
        }

        if(p.status === 'Aprovada' && !p.contrato_assinado && !p.entrada_paga) {
            html += `
            <div class="card">
                <h3 class="font-bold text-lg mb-2 text-center">Escolha a quantidade de parcelas:</h3>
                <select id="qtdParcelas" class="w-full p-3 border rounded-lg mb-3">
                    ${Array.from({length: q > 0 ? q : 1}, (_, i) => {
                        const n = i + 1;
                        let val = 0;
                        try {
                            const taxa = j / 100;
                            val = ((total - e) * (Math.pow(1 + taxa, n) * taxa)) / (Math.pow(1 + taxa, n) - 1);
                            if (isNaN(val) || !isFinite(val)) val = (total - e) / n;
                        } catch(err) {
                            val = (total - e) / n;
                        }
                        return `<option value="${n}">${n}x de R$ ${formatarMoeda(val)}</option>`;
                    }).join('')}
                </select>
                <button onclick="abrirContrato()" class="btn btn-success">✅ Continuar</button>
            </div>

            <div id="blocoContrato" class="oculto">
                <h3 class="font-bold text-lg mb-2 text-center">📄 Termos do Contrato</h3>
                <div class="texto-contrato">
                    <strong>CONTRATO DE CRÉDITO</strong><br><br>
                    FlashCred e ${p.nome || ''}.<br>
                    Valor total: R$ ${formatarMoeda(total)}<br>
                    Entrada: R$ ${formatarMoeda(e)}<br>
                    Prazo entrega: ${diasUteisEntrega} dias úteis.<br><br>
                    Ao assinar, concorda com todas as condições.
                </div>
                <label class="flex items-center gap-2 mb-3 font-medium">
                    <input type="checkbox" id="aceitoContrato"> Li e aceito os termos
                </label>
                <button onclick="mostrarOpcoesAssinatura()" class="btn btn-primary">✍️ Assinar</button>

                <div id="opcoesAssinatura" class="oculto mt-4">
                    <p class="font-semibold mb-2 text-center">Escolha:</p>
                    <button onclick="mostrarAssinaturaTexto()" class="btn btn-success mb-2">✍️ Escrever nome</button>
                    <button onclick="abrirCamera()" class="btn btn-cam">📸 Tirar foto</button>

                    <div id="areaAssinaturaTexto" class="oculto mt-3">
                        <input type="text" id="assinaturaTexto" class="campo-assinatura" placeholder="Seu nome completo">
                        <button onclick="confirmarAssinatura()" class="btn btn-success mt-2">✅ Confirmar</button>
                    </div>

                    <div id="areaCamera" class="area-cam oculto mt-3">
                        <video id="videoCam" autoplay playsinline></video>
                        <button onclick="tirarFoto()" class="btn btn-success mt-2">📸 Confirmar</button>
                    </div>
                </div>
            </div>`;
        }

        if(p.contrato_assinado && !p.entrada_paga) {
            html += `
            <div class="card text-center">
                <div class="text-green-600 text-xl font-bold mb-3"><i class="fas fa-check-circle"></i> CONTRATO ASSINADO!</div>
                <p class="mb-3">Entrada: <strong>R$ ${formatarMoeda(e)}</strong>.</p>
                <button onclick="carregarPixEntrada(${e})" class="btn btn-pix mb-3"><i class="fas fa-qrcode"></i> Gerar Pix</button>
                <div id="areaPixGerado" class="oculto">
                    <div class="qrcode-pix" id="qrcode-pix"></div>
                    <div class="chave-pix"><strong>Pix Gerado</strong></div>
                    <button id="btnCopiarPix" class="btn btn-pix">📋 Copiar Código</button>
                </div>
            </div>`;
        }

        if(p.entrada_paga) {
            html += `
            <div class="card text-center">
                <div class="text-green-600 text-xl font-bold mb-3"><i class="fas fa-check-double"></i> PAGAMENTO CONFIRMADO!</div>
                <p class="mb-4">Suas parcelas:</p>
                
                <h3 class="font-bold text-lg mb-2 text-primary">📋 PARCELAS</h3>
                ${Array.from({length: qtdEscolhidaFinal}, (_, i) => {
                    const n = i + 1;
                    const dt = datas[i] ? new Date(datas[i]).toLocaleDateString('pt-BR') : 'A definir';
                    const dtOriginal = datas[i] || null;
                    const ok = n <= pagas;
                    const prazo = prazoParcela(dtOriginal);
                    let valorParcela = 0;
                    try {
                        const taxa = j / 100;
                        valorParcela = ((total - e) * (Math.pow(1 + taxa, qtdEscolhidaFinal) * taxa)) / (Math.pow(1 + taxa, qtdEscolhidaFinal) - 1);
                        if (isNaN(valorParcela) || !isFinite(valorParcela)) valorParcela = (total - e) / qtdEscolhidaFinal;
                    } catch(err) {
                        valorParcela = (total - e) / qtdEscolhidaFinal;
                    }

                    return `<div class="item-parcela">
                        <div style="display: flex; justify-content: space-between;">
                            <span><strong>${n}ª</strong> • R$ ${formatarMoeda(valorParcela)} • Venc: ${dt}</span>
                            <span class="font-bold ${ok?'text-green-600':'text-orange-500'}">${ok?'PAGA':'PENDENTE'}</span>
                        </div>
                        ${!ok ? `<div class="barra-parcela"><div class="${prazo.classe} h-full"></div></div><div class="texto-prazo-parcela">${prazo.texto}</div><button onclick="pagarParcela(${n}, ${valorParcela})" class="btn btn-pix" style="padding:8px; font-size:14px;">Gerar Pix</button>` : ''}
                    </div>`;
                }).join('')}

                <div id="areaPixParcelaGerado" class="oculto mt-4">
                    <div class="qrcode-pix" id="qrcode-pix-parcela"></div>
                    <div class="chave-pix"><strong>Pix da Parcela</strong></div>
                    <button id="btnCopiarPixParcela" class="btn btn-pix">📋 Copiar</button>
                </div>
            </div>`;
        }

        html += `
            <div class="mt-4">
                <a href="https://wa.me/5511973294235?text=Suporte CPF: ${p.cpf}" target="_blank" class="btn" style="background:#25D366;color:white;">
                    <i class="fab fa-whatsapp"></i> Falar com Suporte
                </a>
                <button onclick="window.location.reload()" class="btn btn-alerta">🔄 Atualizar</button>
            </div>
        </div>`;

        document.getElementById('conteudoProposta').innerHTML = html;
    } catch (errRender) {
        console.error("Erro ao montar tela:", errRender);
        document.getElementById('conteudoProposta').innerHTML = `<div class="card text-center text-red-500"><i class="fas fa-exclamation-triangle text-3xl mb-2"></i><br>Erro ao exibir as informações da proposta.<br><button onclick="window.location.reload()" class="btn btn-primary mt-3">Recarregar</button></div>`;
    }
}

async function carregarPixEntrada(valor) {
    const btn = event.currentTarget;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Gerando...`;
    const codigo = await gerarPixViaAPI(valor, 'Entrada');
    document.getElementById('areaPixGerado').classList.remove('oculto');
    new QRCode(document.getElementById("qrcode-pix"), { text: codigo, width: 220, height: 220 });
    document.getElementById('btnCopiarPix').onclick = () => { navigator.clipboard.writeText(codigo); alert('Copiado! ✅'); };
    btn.classList.add('oculto');
}

async function pagarParcela(num, valor) {
    const btn = event.currentTarget;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Gerando...`;
    const codigo = await gerarPixViaAPI(valor, `${num}ª Parcela`);
    document.getElementById('areaPixParcelaGerado').classList.remove('oculto');
    new QRCode(document.getElementById("qrcode-pix-parcela"), { text: codigo, width: 220, height: 220 });
    document.getElementById('btnCopiarPixParcela').onclick = () => { navigator.clipboard.writeText(codigo); alert('Copiado! ✅'); };
}

function abrirContrato() {
    const select = document.getElementById('qtdParcelas');
    if(!select || !select.value) { alert('Escolha as parcelas!'); return; }
    qtdEscolhida = Number(select.value);
    dadosProposta.qtd_parcelas_escolhida = qtdEscolhida;
    document.getElementById('blocoContrato').classList.remove('oculto');
}
function mostrarOpcoesAssinatura() { 
    const termos = document.getElementById('aceitoContrato');
    if(!termos || !termos.checked) { alert('Aceite os termos!'); return; } 
    document.getElementById('opcoesAssinatura').classList.remove('oculto'); 
}
function mostrarAssinaturaTexto() { 
    document.getElementById('areaAssinaturaTexto').classList.remove('oculto'); 
    document.getElementById('areaCamera').classList.add('oculto'); 
}
async function abrirCamera() { 
    document.getElementById('areaCamera').classList.remove('oculto'); 
    document.getElementById('areaAssinaturaTexto').classList.add('oculto'); 
    try { 
        streamCam = await navigator.mediaDevices.getUserMedia({video:true}); 
        document.getElementById('videoCam').srcObject = streamCam; 
    } catch { 
        alert('Câmera indisponível, use texto.'); 
    } 
}
async function tirarFoto() { 
    if(!streamCam) return; 
    const c = document.createElement('canvas'); 
    c.width=400; c.height=300; 
    c.getContext('2d').drawImage(document.getElementById('videoCam'),0,0); 
    const foto = c.toDataURL('image/png'); 
    streamCam.getTracks().forEach(t=>t.stop()); 
    await supabase.from('propostas').update({contrato_assinado:true, foto_assinatura:foto}).eq('id',dadosProposta.id); 
    await buscarProposta(); 
}
async function confirmarAssinatura() { 
    const campoAss = document.getElementById('assinaturaTexto');
    if (!campoAss) return;
    const a = campoAss.value.trim(); 
    if(!a) { alert('Digite sua assinatura!'); return; } 
    await supabase.from('propostas').update({contrato_assinado:true, assinatura_texto:a}).eq('id',dadosProposta.id); 
    await buscarProposta(); 
}

function ativarTempoReal(cpf) {
    if(inscricao) supabase.removeChannel(inscricao);
    inscricao = supabase.channel(`proposta_${cpf}`)
    .on('postgres_changes', {event:'*',schema:'public',table:'propostas',filter:`cpf=eq.${cpf}`}, ()=>buscarProposta()).subscribe();
}
</script>
