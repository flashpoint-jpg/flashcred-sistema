<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0A2463', sucesso: '#10B981', alerta: '#F59E0B' } } } };
        const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const CPF = new URLSearchParams(window.location.search).get('cpf');

        async function carregar() {
            document.getElementById('area').innerHTML = `<div class="text-center p-10"><div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-3"></div><p>Carregando...</p></div>`;
            
            if(!CPF) return window.location.href='consultar.html';
            
            const {data:p} = await supabase.from('propostas').select('*').eq('cpf', CPF.replace(/\D/g,'')).single();
            if(!p) return document.getElementById('area').innerHTML=`<p class="text-center p-10 text-red-600">Proposta não encontrada</p>`;

            const v=Number(p.valor_desejado||0), e=Number(p.valor_entrada||0), j=Number(p.juros_mensal||5), q=Number(p.quantidade_parcelas||1);
            const total=v*(1+j/100), parc=q>0?(total-e)/q:0;
            const dias=Number(p.dias_entrega||8);

            document.getElementById('area').innerHTML = `
            <div class="max-w-md mx-auto bg-white p-5 rounded-xl shadow">
                <h2 class="text-xl font-bold text-center text-primary mb-4">Olá, ${p.nome}!</h2>
                <div class="bg-blue-50 p-4 rounded-lg mb-4">
                    <p><strong>Valor Total:</strong> R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                    <p><strong>Entrada:</strong> R$ ${e.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                    <p><strong>Parcelamento:</strong> ${q}x de R$ ${parc.toLocaleString('pt-BR',{minimumFractionDigits:2})}</p>
                    <p><strong>Juros:</strong> ${j}% ao mês</p>
                    <p><strong>Prazo de Entrega:</strong> ${dias} dias úteis</p>
                </div>
                <p class="text-sm mb-4">Valor total R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}, entrada R$ ${e.toLocaleString('pt-BR',{minimumFractionDigits:2})}, ${q} parcelas, juros ${j}% a.m., entrega em ${dias} dias úteis.</p>
                <label class="flex items-center gap-2 mb-4"><input type="checkbox" id="ok"> Li e concordo com o contrato</label>
                <button onclick="assinar()" class="w-full bg-primary text-white py-3 rounded-lg font-bold">Assinar Contrato</button>
                <div class="text-center mt-4"><a href="https://wa.me/5511973294235" target="_blank" class="text-primary">Falar com Suporte</a></div>
            </div>`;
        }

        function assinar() {
            if(!document.getElementById('ok').checked) return alert('Concorde primeiro!');
            alert('Contrato assinado! Agora gere o Pix da entrada.');
        }

        window.onload = carregar;
        supabase.channel('sinc').on('postgres_changes',{event:'UPDATE',schema:'public',table:'propostas',filter:`cpf=eq.${CPF.replace(/\D/g,'')}`},carregar).subscribe();
    </script>
</head>
<body class="bg-gray-100 py-4">
    <div id="area"></div>
</body>
</html>
