 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontSize: { 'base': '15px', 'lg': '16px', 'xl': '18px' },
                    colors: { primary: '#0A2463', sucesso: '#10B981', alerta: '#F59E0B', fundo: '#F8FAFC' } 
                } 
            } 
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-size: 15px; }
        body { background: #F8FAFC; padding: 20px 12px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); border: 1px solid #E2E8F0; }
        .titulo { text-align: center; font-size: 22px; font-weight: 700; color: #0A2463; margin-bottom: 20px; }
        .status { padding: 10px; border-radius: 8px; text-align: center; font-weight: 700; margin-bottom: 16px; font-size: 17px; }
        .aprovada { background: #D1FAE5; color: #065F46; }
        .pendente { background: #FEF3C7; color: #92400E; }
        .reprovada { background: #FEE2E2; color: #B91C1C; }
        .dados { margin: 16px 0; line-height: 1.6; font-size: 15px; }
        .dados strong { color: #0A2463; font-weight: 600; }
        .valor { text-align: center; font-size: 24px; font-weight: 700; margin: 16px 0; color: #0A2463; }
        .qrcode { display: flex; justify-content: center; margin: 16px 0; padding: 12px; background: #F8FAFC; border-radius: 8px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; font-size: 15px; }
        .btn-pix { background: #32BCAD; color: white; }
        .btn-buscar { background: #0A2463; color: white; }
        .input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; margin-bottom: 12px; font-size: 15px; }
        .aviso { color: #0A2463; text-align: center; font-weight: 500; margin: 16px 0; padding: 12px; background: #EFF6FF; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 class="titulo">Consultar Proposta</h1>
        <div id="conteudo"></div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function buscarProposta(cpfBusca) {
    const conteudo = document.getElementById('conteudo');
    const cpfLimpo = cpfBusca.replace(/\D/g, '');
    if(cpfLimpo.length !== 11) {
        conteudo.innerHTML = `
            <p class="aviso">Digite um CPF válido com 11 números</p>
            <input type="text" class="input" id="cpf" placeholder="Digite seu CPF">
            <button class="btn btn-buscar" onclick="buscarProposta(document.getElementById('cpf').value)">Buscar</button>
        `;
        return;
    }

    const { data: proposta, error } = await supabase
        .from('propostas')
        .select('*')
        .eq('cpf', cpfLimpo)
        .order('data_criacao', { ascending: false })
        .limit(1)
        .single();

    if(!proposta) {
        conteudo.innerHTML = `
            <p class="aviso">Nenhuma proposta encontrada para este CPF</p>
            <input type="text" class="input" id="cpf" placeholder="Digite seu CPF">
            <button class="btn btn-buscar" onclick="buscarProposta(document.getElementById('cpf').value)">Buscar</button>
        `;
        return;
    }

    const valorEntrada = (Number(proposta.valor_solicitado || 0) * Number(proposta.percentual_entrada || 40) / 100).toFixed(2).replace('.', ',');
    let html = `
        <div class="status ${proposta.status === 'nova' ? 'pendente' : proposta.status}">${(proposta.status || 'NOVA').toUpperCase()}</div>
        <div class="dados">
            <p><strong>Nome:</strong> ${proposta.nome}</p>
            <p><strong>CPF:</strong> ${proposta.cpf?.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</p>
            <p><strong>Valor Solicitado:</strong> R$ ${Number(proposta.valor_solicitado || 0).toFixed(2).replace('.', ',')}</p>
            <p><strong>Quantidade de Parcelas:</strong> ${proposta.quantidade_parcelas || 0}x</p>
            <p><strong>Valor da Entrada:</strong> R$ ${valorEntrada}</p>
        </div>
    `;

    if(proposta.status === 'nova' || proposta.status === 'pendente') {
        html += `<p class="aviso">⏳ Sua proposta está em análise. Assim que aprovada, os dados de pagamento aparecerão aqui.</p>`;
    } else if(proposta.status === 'aprovada') {
        html += `<h3 style="text-align:center; margin:16px 0; font-size:18px;">Pagamento da Entrada</h3>
        <div class="valor">R$ ${valorEntrada}</div>`;
        if(proposta.qrcode_pix && proposta.copia_cola_pix) {
            html += `
                <p style="text-align:center; margin-bottom:12px;">Escaneie o QR Code ou copie o código Pix:</p>
                <div class="qrcode"><img src="${proposta.qrcode_pix}" alt="QR Code Pix" style="width:200px;"></div>
                <div style="background:#F8FAFC; padding:12px; border-radius:8px; font-size:13px; word-break:break-all; border:1px solid #CBD5E1;">${proposta.copia_cola_pix}</div>
                <button class="btn btn-pix" onclick="navigator.clipboard.writeText('${proposta.copia_cola_pix}').then(() => alert('✅ Código copiado!'))">📋 Copiar Código Pix</button>
            `;
        } else {
            html += `<p class="aviso">🔄 Dados de pagamento sendo gerados, aguarde um instante.</p>`;
        }
    } else {
        html += `<p class="aviso" style="background:#FEE2E2; color:#B91C1C;">❌ Sua proposta foi reprovada. Entre em contato para mais informações.</p>`;
    }

    conteudo.innerHTML = html;
}

const urlParams = new URLSearchParams(window.location.search);
const cpfParam = urlParams.get('cpf');

if(cpfParam) {
    buscarProposta(cpfParam);
    setInterval(() => buscarProposta(cpfParam), 10000);
} else {
    document.getElementById('conteudo').innerHTML = `
        <input type="text" class="input" id="cpf" placeholder="Digite seu CPF">
        <button class="btn btn-buscar" onclick="buscarProposta(document.getElementById('cpf').value)">Consultar Proposta</button>
    `;
}
</script>
</body>
</html>
