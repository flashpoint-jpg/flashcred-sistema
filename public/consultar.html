<body>
<div class="container">

<div id="telaConsulta" class="tela visivel">

        <input type="text" id="cpfConsulta" placeholder="000.000.000-00" maxlength="14" class="campo text-center" oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')">

    <div class="barra-etapas" id="barraEtapas"></div>
    <div class="cartao" id="conteudoProposta"></div>
</div>

</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

let propostaAtual = null;
let inscricaoTempoReal = null;
let webcamStream = null;
let modoAssinatura = 'selfie';
let canvasContext = null;
let desenhando = false;
let fotoBase64 = null;

window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const cpfUrl = params.get('cpf');
    if(cpfUrl) {
        document.getElementById('cpfConsulta').value = cpfUrl.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
        consultar();
    }
};

function voltarInicio() {
    pararCamera();
    if(inscricaoTempoReal) supabase.removeChannel(inscricaoTempoReal);
    propostaAtual = null;
    document.getElementById('cpfConsulta').value = '';
    document.getElementById('telaProposta').classList.remove('visivel');
    document.getElementById('telaConsulta').classList.add('visivel');
    history.pushState({}, '', window.location.pathname);
}

async function consultar() {
    const cpf = document.getElementById('cpfConsulta').value.trim().replace(/\D/g,'');
    if(cpf.length !== 11) return alert('Digite o CPF completo!');

    const btn = document.getElementById('btnConsultar');
    const textoOriginal = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Buscando...`;

    try {
        const {data, error} = await supabase
            .from('propostas')
            .select('*')
            .eq('cpf', cpf)
            .limit(1);
        
        if(error || !data || data.length === 0) {
            alert('Proposta não encontrada! Verifique o CPF.');
            return;
        }

        propostaAtual = data[0];
        mostrarProposta(propostaAtual);
        
        if(inscricaoTempoReal) supabase.removeChannel(inscricaoTempoReal);
        inscricaoTempoReal = supabase.channel(`proposta_${propostaAtual.id}`)
            .on('postgres_changes', {event:'UPDATE', schema:'public', table:'propostas', filter:`id=eq.${propostaAtual.id}`},
                (res)=>{ propostaAtual = res.new; mostrarProposta(res.new); }
            ).subscribe();

    } catch (err) {
        console.error(err);
        alert('Erro ao consultar. Tente novamente.');
    } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
    }
}

function formatarValor(v) { return Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function formatarData(d) { return new Date(d).toLocaleDateString('pt-BR'); }

function calcularDiasUteisRestantes(dataInicio, prazoTotalDias) {
    if (!dataInicio) return prazoTotalDias;
    let inicio = new Date(dataInicio);
    let hoje = new Date();
    let diasUteisPassados = 0;
    let atual = new Date(inicio);
    while (atual < hoje) {
        if ([0,6].includes(atual.getDay()) === false) diasUteisPassados++;
        atual.setDate(atual.getDate() + 1);
    }
    return Math.max(0, prazoTotalDias - diasUteisPassados);
}

function mostrarProposta(p) {
    document.getElementById('telaConsulta').classList.remove('visivel');
    document.getElementById('telaProposta').classList.add('visivel');

    const entradaPaga = !!p.entrada_paga;
    const contratoAssinado = !!p.contrato_assinado;
    let etapa = p.status==='Nova'?1:p.status==='Aprovada'?(p.qtd_parcelas_escolhida?2:2):contratoAssinado?3:entradaPaga?4:5;

    document.getElementById('barraEtapas').innerHTML = `
        <div class="etapa ${etapa>=1?(etapa>1?'concluida':'ativa'):''}"><div class="bolinha">${etapa>1?'✓':'1'}</div><span>Análise</span></div>
        <div class="etapa ${etapa>=2?(etapa>2?'concluida':'ativa'):''}"><div class="bolinha">${etapa>2?'✓':'2'}</div><span>Parcelas</span></div>
        <div class="etapa ${etapa>=3?(etapa>3?'concluida':'ativa'):''}"><div class="bolinha">${etapa>3?'✓':'3'}</div><span>Contrato</span></div>
        <div class="etapa ${entradaPaga?'concluida':'ativa'}"><div class="bolinha">${entradaPaga?'✓':'4'}</div><span>Entrada</span></div>
        <div class="etapa ${etapa>=5?'concluida':'ativa'}"><div class="bolinha">${etapa>=5?'✓':'5'}</div><span>Entrega</span></div>
    `;

    const v=Number(p.valor_desejado||0), e=Number(p.valor_entrada||0), j=Number(p.juros_mensal||5), q=Number(p.qtd_parcelas_escolhida||p.quantidade_parcelas||0);
    const total = v*(1 + j/100);
    const valorParcela = q > 0 ? ((total - e) * (Math.pow(1 + j/100, q) * (j/100)) / (Math.pow(1 + j/100, q) - 1)) : 0;
    const diasTotal = p.dias_entrega || 7;
    const diasRestantes = entradaPaga ? calcularDiasUteisRestantes(p.data_aprovacao_entrada || p.updated_at, diasTotal) : diasTotal;

    let html = `<h2 class="text-xl font-bold text-center mb-4 text-primary">Olá, ${p.nome}!</h2>`;

    if(p.status === 'Nova') {
        html += `<div class="text-center p-6 bg-yellow-50 rounded-lg"><i class="fas fa-clock text-4xl text-alerta mb-4 animate-pulsar-suave"></i><p class="font-bold text-lg">Aguardando aprovação...</p></div>`;
    }

    if(p.status === 'Aprovada' && !p.qtd_parcelas_escolhida) {
        html += `
        <div class="bloco-entrega"><i class="fas fa-truck text-alerta text-xl mb-2"></i><p class="font-bold">ENTREGA EM ATÉ ${diasTotal} DIAS ÚTEIS APÓS PAGAMENTO!</p></div>
        <div class="resumo-contrato">
            <p><strong>Produto:</strong> R$ ${formatarValor(v)}</p>
            <p><strong>Entrada:</strong> R$ ${formatarValor(e)}</p>
            <p><strong>Total:</strong> R$ ${formatarValor(total)}</p>
            <p><strong>Até:</strong> ${q}x — Juros ${j}% a.m.</p>
        </div>
        <select id="qtdEscolhida" class="campo">
            ${Array.from({length:q}, (_,i)=>{
                const n=i+1; const val=((total-e)*(Math.pow(1+j/100,n)*(j/100))/(Math.pow(1+j/100,n)-1));
                return `<option value="${n}">${n}x de R$ ${formatarValor(val)}</option>`;
            }).join('')}
        </select>
        <button onclick="confirmarParcelas()" class="botao botao-sucesso">Continuar</button>`;
    }

    if(p.status === 'Aprovada' && p.qtd_parcelas_escolhida && !contratoAssinado) {
        const qtdEsc = p.qtd_parcelas_escolhida;
        const valParc = ((total-e)*(Math.pow(1+j/100,qtdEsc)*(j/100))/(Math.pow(1+j/100,qtdEsc)-1));
        html += `
        <div class="resumo-contrato">
            <p><strong>Total:</strong> R$ ${formatarValor(total)}</p>
            <p><strong>Entrada:</strong> R$ ${formatarValor(e)}</p>
            <p><strong>${qtdEsc}x:</strong> R$ ${formatarValor(valParc)}</p>
            <p><strong>Entrega:</strong> ${diasTotal} dias úteis</p>
        </div>
        <div class="contrato">
            <strong>CLÁUSULA 1ª - DO OBJETO E VALORES:</strong> O presente instrumento tem por objeto o financiamento para aquisição de produtos/serviços no valor total de <strong>R$ ${formatarValor(total)}</strong>, mediante o pagamento de uma entrada no valor de <strong>R$ ${formatarValor(e)}</strong> e o saldo remanescente parcelado em <strong>${qtdEsc}x de R$ ${formatarValor(valParc)}</strong>, incidindo juros remuneratórios de <strong>${j}% ao mês</strong>.<br><br>
            <strong>CLÁUSULA 2ª - DA ENTREGA E PRAZO:</strong> A entrega do produto/serviço fica estipulada em até <strong>${diasTotal} dias úteis</strong>, contados estritamente após a compensação bancária e confirmação do pagamento da taxa de entrada.<br><br>
            <strong>CLÁUSULA 3ª - DO INADIMPLEMENTO E ENCARGOS:</strong> O atraso no pagamento de qualquer das parcelas acarretará a incidência de multa moratória de 2% (dois por cento) sobre o valor devido, juros de mora de 1% ao mês, além de correção monetária, sujeitando o devedor à inclusão de seu CPF nos órgãos de proteção ao crédito (SPC/SERASA) e protesto em cartório.<br><br>
            <strong>CLÁUSULA 4ª - DA ANTECIPAÇÃO DA DÍVIDA:</strong> Ocorrendo o atraso superior a 15 dias em qualquer parcela ou quebra de qualquer cláusula, vencerão antecipadamente todas as demais obrigações vincendas, tornando a dívida integralmente exigível de uma só vez.<br><br>
            <strong>CLÁUSULA 5ª - DA VALIDADE JURÍDICA:</strong> O Contratante expressamente aceita a assinatura eletrônica e/ou biométrica (selfie/desenho em tela) como válida, reconhecendo-a como prova documental legítima, íntegra e irrevogável para todos os efeitos de direito, nos termos da legislação vigente.
        </div>
        <label class="flex items-center gap-2 mb-4 font-bold text-sm text-primary"><input type="checkbox" id="aceitoContrato"> Li e concordo integralmente com os termos e leis acima descritos.</label>
        <div class="flex gap-2 mb-3">
            <button type="button" onclick="alternarModoAssinatura('selfie')" id="btnModoSelfie" class="botao botao-pequeno bg-primary text-white">📸 Selfie</button>
            <button type="button" onclick="alternarModoAssinatura('manual')" id="btnModoManual" class="botao botao-pequeno bg-slate-200">✏️ Desenhar</button>
        </div>
        <div id="blocoSelfie" class="mb-3">
            <div id="areaCamera" class="text-center mb-3">
                <video id="videoCamera" autoplay playsinline class="w-full rounded mb-2" style="max-height:200px; object-fit:cover;"></video>
                <button type="button" onclick="tirarSelfie()" class="botao botao-pix py-2">Capturar Selfie</button>
            </div>
            <div id="areaPreviewSelfie" class="text-center mb-3 oculto">
                <p class="text-sucesso font-bold mb-2">✅ Selfie capturada!</p>
                <img id="imgSelfie" class="mx-auto rounded border" style="max-height:140px;">
                <button type="button" onclick="refazerSelfie()" class="botao botao-pequeno bg-slate-400 text-white mt-2">Refazer</button>
            </div>
        </div>
        <div id="blocoManual" class="oculto mb-3 text-center">
            <canvas id="canvasAssinatura" class="assinatura-pad" height="140"></canvas>
            <button type="button" onclick="limparCanvas()" class="botao botao-pequeno bg-slate-400 mt-2 text-white">Limpar</button>
        </div>
        <button onclick="assinarContrato()" class="botao botao-sucesso">Assinar e Enviar</button>`;
        setTimeout(()=>{if(modoAssinatura==='selfie') iniciarCamera(); inicializarCanvas();},300);
    }

    if(contratoAssinado && !entradaPaga) {
        html += `
        <div class="sucesso-box"><i class="fas fa-check-circle"></i><h3>CONTRATO ASSINADO!</h3></div>
        <div class="resumo-contrato">
            <p><strong>Total:</strong> R$ ${formatarValor(total)}</p>
            <p><strong>Entrada:</strong> R$ ${formatarValor(e)}</p>
            <p><strong>Restante:</strong> ${q}x de R$ ${formatarValor(valorParcela)}</p>
        </div>
        <button onclick="gerarPixAPI(${e}, 'entrada', ${p.id})" class="botao botao-pix">Gerar Pix da Entrada</button>
        <div id="containerPix" class="mt-4"></div>`;
    }

    if(entradaPaga) {
        let datasParcelas = p.datas_parcelas || [];
        if(datasParcelas.length===0){
            let d=new Date(); for(let i=1;i<=q;i++){d.setMonth(d.getMonth()+1); datasParcelas.push(d.toISOString().split('T')[0]);}
        }
        const parcelasPagas = p.parcelas_pagas || [];

        html += `
        <div class="sucesso-box"><i class="fas fa-check-double"></i><h3>✅ ENTRADA CONFIRMADA — PARCELAS LIBERADAS</h3></div>
        <div class="bloco-entrega" style="background:#ECFDF5;border-color:#10B981;">
            <p class="font-bold">Entrega em até ${diasTotal} dias úteis</p>
            <p class="text-sm mt-1">Faltam ${diasRestantes} dias úteis</p>
        </div>
        <div class="resumo-contrato">
            <p><strong>Total:</strong> R$ ${formatarValor(total)}</p>
            <p><strong>Entrada Paga:</strong> R$ ${formatarValor(e)}</p>
            <p><strong>${q}x de:</strong> R$ ${formatarValor(valorParcela)}</p>
        </div>

        <h4 class="font-bold mt-4 mb-2">📅 Suas Parcelas</h4>`;

        datasParcelas.forEach((data, i)=>{
            const num = i+1;
            const ehPaga = parcelasPagas.includes(num);
            const dtVenc = new Date(data);
            const hoje = new Date();
            const ehVencida = dtVenc < hoje && !ehPaga;
            const classe = ehPaga?'paga':ehVencida?'vencida':'avencer';
            const status = ehPaga?'PAGA':ehVencida?'VENCIDA':'A VENCER';
            const classeStatus = ehPaga?'status-paga':ehVencida?'status-vencida':'status-avencer';

            html += `
            <div class="item-parcela ${classe}">
                <div>
                    <div class="font-semibold">Parcela ${num}/${q} • ${formatarData(data)}</div>
                    <span class="status-parcela ${classeStatus}">${status}</span>
                </div>
                <div class="text-right">
                    <div class="font-bold">R$ ${formatarValor(valorParcela)}</div>
                    ${!ehPaga?`<button onclick="gerarPixParcela(${valorParcela}, ${num}, ${p.id})" class="botao botao-pequeno botao-pix mt-1">Pagar com Pix</button>`:'<i class="fas fa-check-circle text-sucesso mt-1"></i>'}
                </div>
            </div>`;
        });

        html += `
        <div id="containerPix" class="mt-4"></div>
        <div class="mt-6"><a href="https://wa.me/5511973294235?text=Suporte CPF ${p.cpf}" target="_blank" class="botao botao-sucesso text-center block"><i class="fab fa-whatsapp mr-2"></i> Falar com Suporte</a></div>`;
    }

    document.getElementById('conteudoProposta').innerHTML = html;
}

// 🛠️ FUNÇÃO UNIFICADA E CORRIGIDA PARA GERAR PIX (ENTRADA E PARCELAS)
async function gerarPixAPI(valor, tipo, propostaId) {
    const tipoFormatado = typeof tipo === 'number' ? `parcela_${tipo}` : tipo;
    
    let container = document.getElementById('containerPix');
    if (!container) {
        container = document.createElement('div');
        container.id = 'containerPix';
        container.className = 'mt-4';
        document.getElementById('conteudoProposta').appendChild(container);
    }

    container.innerHTML = `<div class="text-center p-4">⏳ Gerando QR Code Pix...</div>`;
    
    try {
        const resposta = await fetch('/api/gerar-pix', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                valor: Number(valor), 
                tipo: tipoFormatado, 
                propostaId: Number(propostaId) 
            })
        });
        
        const data = await resposta.json();
        
        if (!resposta.ok || !data.sucesso) {
            throw new Error(data.erro || `Erro HTTP ${resposta.status}: Falha ao gerar Pix`);
        }

        const codigoCopiaECola = data.copiaECola || data.qr_code || '';
        const imagemQrCode = data.qrCodeUrl || data.qr_code_url || '';

        container.innerHTML = `
            <div style="border: 2px solid #32BCAD; padding: 20px; border-radius: 12px; text-align: center; background: #f9f9f9; margin-top: 15px;">
                <h4 style="margin-bottom: 15px; color: #0A2463; font-weight: bold;">QR Code Pix - ${tipoFormatado.toUpperCase()}:</h4>
                ${imagemQrCode ? `<img src="${imagemQrCode}" alt="QR Code Pix" style="width: 200px; height: 200px; display: block; margin: 0 auto 15px auto; border-radius: 8px; border: 1px solid #ddd;" />` : '<div id="qrcodeCanvas" class="flex justify-center mb-4"></div>'}
                <p style="font-weight: bold; margin-bottom: 5px;">Copia e Cola:</p>
                <input type="text" id="campoPixCopia" value="${codigoCopiaECola}" readonly style="width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px; text-align: center; margin-bottom: 12px; font-size: 12px; background: white;">
                <button onclick="copiarCodigoPix()" class="botao" style="background-color: #0A2463; color: white; padding: 10px; font-size: 14px;">📋 Copiar Código Pix</button>
                <p style="font-size: 12px; color: #10B981; margin-top: 12px; font-weight: 600;">🔄 A baixa é automática via Webhook!</p>
            </div>
        `;

        if(!imagemQrCode && codigoCopiaECola && window.QRCode) {
            new QRCode(document.getElementById("qrcodeCanvas"), {
                text: codigoCopiaECola,
                width: 180,
                height: 180
            });
        }
    } catch (err) {
        console.error("Detalhes do erro Pix:", err);
        container.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-lg text-center font-bold">❌ ${err.message}</div>`;
    }
}

function gerarPixParcela(valor, numeroParcela, idProposta) {
    gerarPixAPI(valor, numeroParcela, idProposta);
}

function copiarCodigoPix() {
    const input = document.getElementById("campoPixCopia");
    if(!input) return;
    input.select();
    input.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(input.value).then(() => {
        alert("Código Pix copiado com sucesso!");
    });
}

async function confirmarParcelas() {
    const qtd = document.getElementById('qtdEscolhida').value;
    const {error} = await supabase.from('propostas').update({qtd_parcelas_escolhida: parseInt(qtd)}).eq('id', propostaAtual.id);
    if(error) alert('Erro ao salvar parcelas');
    else consultar();
}

function alternarModoAssinatura(modo) {
    modoAssinatura = modo;
    if(modo === 'selfie') {
        document.getElementById('blocoSelfie').classList.remove('oculto');
        document.getElementById('blocoManual').classList.add('oculto');
        document.getElementById('btnModoSelfie').className = 'botao botao-pequeno bg-primary text-white';
        document.getElementById('btnModoManual').className = 'botao botao-pequeno bg-slate-200 text-slate-700';
        iniciarCamera();
    } else {
        document.getElementById('blocoSelfie').classList.add('oculto');
        document.getElementById('blocoManual').classList.remove('oculto');
        document.getElementById('btnModoSelfie').className = 'botao botao-pequeno bg-slate-200 text-slate-700';
        document.getElementById('btnModoManual').className = 'botao botao-pequeno bg-primary text-white';
        pararCamera();
        setTimeout(inicializarCanvas, 100);
    }
}

async function iniciarCamera() {
    try {
        webcamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        const video = document.getElementById('videoCamera');
        if(video) video.srcObject = webcamStream;
    } catch(e) { console.error("Erro na câmera:", e); }
}

function pararCamera() {
    if(webcamStream) {
        webcamStream.getTracks().forEach(track => track.stop());
        webcamStream = null;
    }
}

function tirarSelfie() {
    const video = document.getElementById('videoCamera');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 400;
    canvas.height = video.videoHeight || 300;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
    
    document.getElementById('imgSelfie').src = fotoBase64;
    document.getElementById('areaCamera').classList.add('oculto');
    document.getElementById('areaPreviewSelfie').classList.remove('oculto');
    pararCamera();
}

function refazerSelfie() {
    fotoBase64 = null;
    document.getElementById('areaPreviewSelfie').classList.add('oculto');
    document.getElementById('areaCamera').classList.remove('oculto');
    iniciarCamera();
}

function inicializarCanvas() {
    const canvas = document.getElementById('canvasAssinatura');
    if(!canvas) return;
    canvasContext = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = 140;
    
    canvasContext.strokeStyle = '#0A2463';
    canvasContext.lineWidth = 2;
    canvasContext.lineJoin = 'round';
    canvasContext.lineCap = 'round';

    const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const iniciarDesenho = (e) => { desenhando = true; const pos = getPos(e); canvasContext.beginPath(); canvasContext.moveTo(pos.x, pos.y); e.preventDefault(); };
    const desenhar = (e) => { if(!desenhando) return; const pos = getPos(e); canvasContext.lineTo(pos.x, pos.y); canvasContext.stroke(); e.preventDefault(); };
    const pararDesenho = () => { desenhando = false; };

    canvas.onmousedown = iniciarDesenho;
    canvas.onmousemove = desenhar;
    canvas.onmouseup = pararDesenho;
    canvas.onmouseleave = pararDesenho;

    canvas.ontouchstart = iniciarDesenho;
    canvas.ontouchmove = desenhar;
    canvas.ontouchend = pararDesenho;
}

function limparCanvas() {
    if(canvasContext) canvasContext.clearRect(0, 0, document.getElementById('canvasAssinatura').width, document.getElementById('canvasAssinatura').height);
}

async function assinarContrato() {
    const aceito = document.getElementById('aceitoContrato').checked;
    if(!aceito) return alert('Você deve aceitar os termos do contrato!');

    let assinaturaFinal = null;
    if(modoAssinatura === 'selfie') {
        if(!fotoBase64) return alert('Capture a sua selfie para assinar!');
        assinaturaFinal = fotoBase64;
    } else {
        const canvas = document.getElementById('canvasAssinatura');
        assinaturaFinal = canvas.toDataURL('image/png');
    }

    const {error} = await supabase.from('propostas').update({
        contrato_assinado: true,
        assinatura_digital: assinaturaFinal,
        data_assinatura: new Date().toISOString()
    }).eq('id', propostaAtual.id);

    if(error) alert('Erro ao assinar contrato: ' + error.message);
    else {
        alert('Contrato assinado com sucesso!');
        consultar();
    }
}
</script>
