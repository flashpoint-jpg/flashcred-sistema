<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; margin: 10px 0; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; }
        .btn-primary { background: #0A2463; color: white; }
        .status { padding: 8px 12px; border-radius: 8px; font-weight: 600; display: inline-block; margin: 10px 0; }
        .status.Nova { background: #FEF3C7; color: #92400E; }
        .status.Aprovada { background: #D1FAE5; color: #065F46; }
        .status.Recusada { background: #FEE2E2; color: #991B1B; }
        .resumo { background: #F8FAFC; border-radius: 12px; padding: 16px; margin-top: 16px; }
        .linha { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #E2E8F0; }
        .linha.total { font-weight: bold; color: #0A2463; font-size: 16px; border: none; margin-top: 6px; }
        .carregando { display: none; text-align: center; padding: 15px; }
        .spinner { width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #0A2463; border-radius: 50%; animation: girar 0.8s linear infinite; margin: 0 auto; }
        @keyframes girar { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h2 class="text-2xl font-bold text-center text-primary mb-6">Acompanhar Minha Proposta</h2>
    
    <label class="font-medium text-gray-700">Digite seu CPF</label>
    <input type="text" id="cpfBusca" class="input" placeholder="Ex: 123.456.789-00" maxlength="18">
    <button id="btnBuscar" class="btn btn-primary">Verificar Status</button>

    <div id="carregando" class="carregando">
        <div class="spinner"></div>
        <p class="mt-2 text-gray-600">Buscando sua proposta...</p>
    </div>

    <div id="resultado" class="mt-6 hidden"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// LIMPA CPF: TIRA PONTO, TRAÇO, TUDO
function limparCPF(cpf) {
    return cpf.replace(/\D/g, '');
}

document.getElementById('btnBuscar').addEventListener('click', async () => {
    const cpfDigitado = limparCPF(document.getElementById('cpfBusca').value);
    if(cpfDigitado.length !== 11) return alert('Digite um CPF válido!');

    document.getElementById('carregando').style.display = 'block';
    document.getElementById('resultado').style.display = 'none';

    // BUSCA SEM PONTOS, ENCONTRA DE QUALQUER JEITO
    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .eq('cpf', cpfDigitado)
        .order('created_at', { ascending: false })
        .limit(1);

    document.getElementById('carregando').style.display = 'none';

    if(error || !data || data.length === 0) {
        alert('❌ Nenhuma proposta encontrada para esse CPF. Verifique os dados ou aguarde a análise.');
        return;
    }

    const p = data[0];
    const resumo = document.getElementById('resultado');
    resumo.style.display = 'block';

    resumo.innerHTML = `
        <div class="text-center mb-4">
            <span class="status ${p.status}">${p.status === 'Nova' ? '🔎 Em Análise' : p.status}</span>
        </div>

        <h3 class="font-bold text-lg text-primary mb-3">Olá, ${p.nome}!</h3>
        
        ${p.status === 'Aprovada' ? `
        <div class="resumo">
            <h4 class="font-bold text-primary mb-3">📋 Demonstrativo de Valores</h4>
            <div class="linha"><span>Valor Total Aprovado:</span><span>R$ ${parseFloat(p.valor_aprovado || 0).toFixed(2).replace('.', ',')}</span></div>
            <div class="linha"><span>Valor da Entrada:</span><span>R$ ${parseFloat(p.valor_entrada || 0).toFixed(2).replace('.', ',')}</span></div>
            <div class="linha"><span>Quantidade de Parcelas:</span><span>${p.qtd_parcelas}x</span></div>
            <div class="linha"><span>Valor de Cada Parcela:</span><span>R$ ${parseFloat(p.valor_parcela || 0).toFixed(2).replace('.', ',')}</span></div>
            <div class="linha total"><span>Total a Pagar:</span><span>R$ ${(parseFloat(p.valor_entrada || 0) + (parseFloat(p.qtd_parcelas || 0) * parseFloat(p.valor_parcela || 0))).toFixed(2).replace('.', ',')}</span></div>
        </div>

        <div class="mt-4 p-4 bg-green-50 rounded-xl border border-green-200">
            <p class="font-semibold text-green-800 mb-2">💳 Pagamento da Entrada via Pix:</p>
            <p class="font-mono text-sm bg-white p-2 rounded">${p.chave_pix || 'Aguardando geração...'}</p>
        </div>
        ` : `
        <p class="text-gray-600 text-center">Sua proposta está sendo analisada. Em breve você receberá o resultado aqui ou pelo WhatsApp.</p>
        `}
    `;
});
</script>
</body>
</html>
