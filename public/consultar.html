<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Pagamento e Vencimento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .payment-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            text-align: center;
            transition: all 0.3s ease;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        /* Cores dinâmicas para o status */
        .status-pendente {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-pago {
            background-color: #d4edda;
            color: #155724;
        }
        .details-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 14px;
        }
        .details-box p {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }
        .details-box span {
            font-weight: bold;
            color: #495057;
        }
        .btn-pagar {
            background-color: #e74c3c;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-pagar:hover {
            background-color: #c0392b;
        }
        .success-message {
            display: none;
            color: #27ae60;
            font-weight: bold;
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="payment-card" id="cardContainer">
    <h2>Fatura de Serviço</h2>
    
    <!-- Status com alteração de cor dinâmica -->
    <div id="statusBadge" class="status-badge status-pendente">Aguardando Pagamento</div>

    <div class="details-box">
        <p>Valor Total: <span>R$ 150,00</span></p>
        <p>Data de Vencimento: <span>10/06/2026</span></p>
        <p>Forma de Pagamento: <span>Pix Instantâneo</span></p>
    </div>

    <!-- Único botão de pagar -->
    <button id="btnPagar" class="btn-pagar" onclick="realizarPagamento()">Pagar Agora</button>

    <!-- Confirmação de pagamento -->
    <div id="successMsg" class="success-message">Pagamento Confirmado com Sucesso!</div>
</div>

<script>
    function realizarPagamento() {
        // Esconde o botão de pagar
        document.getElementById("btnPagar").style.display = "none";
        
        // Altera o selo de status para Verde e muda o texto
        var badge = document.getElementById("statusBadge");
        badge.className = "status-badge status-pago";
        badge.innerText = "Pago com Sucesso";
        
        // Mostra a mensagem de confirmação
        document.getElementById("successMsg").style.display = "block";
    }
</script>

</body>
</html>
