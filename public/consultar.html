<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0A2463', sucesso: '#10B981', alerta: '#F59E0B', perigo: '#EF4444' } } } }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 24px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .input { width: 100%; padding: 14px; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 16px; margin-bottom: 16px; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; font-size: 16px; cursor: pointer; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-sucesso { background: #10B981; color: white; margin-top: 10px; }
        .alerta { padding: 12px; border-radius: 10px; text-align: center; margin: 16px 0; }
        .alerta.sucesso { background: #D1FAE5; color: #065F46; }
        .alerta.alerta { background: #FEF3C7; color: #92400E; }
        .alerta.perigo { background: #FEE2E2; color: #991B1B; }
        .carregando { display: none; align-items: center; justify-content: center; gap: 8px; color: #0A2463; margin-top: 12px; }
        .carregando.mostrar { display: flex; }
        .bolinha { width: 16px; height: 16px; border: 2px solid #0A2463; border-top-color: transparent; border-radius: 50%; animation: rodar 0.8s linear infinite; }
        @keyframes rodar { to { transform: rotate(360deg); } }
        .dado { padding: 10px 0; border-bottom: 1px solid #F1F5F9; font-size: 15px; }
        .dado strong { color: #0A2463; display: inline-block; width: 150px; }
        .pix-area { text-align: center; padding: 16px; background: #ECFDF5; border-radius: 12px; margin: 16px 0; }
        .contrato { max-height: 250px; overflow-y: auto; padding: 16px; background: #F8FAFC; border-radius: 12px; margin: 16px 0; font-size: 13px; line-height: 1.6; border: 1px solid #E2E8F0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="card">
    <h1 class="text-xl font-bold text-center text-primary mb-2">Acompanhar Minha Proposta</h1>
    <p class="text-center text-gray-500 mb-4">Digite seu CPF para ver o status</p>

    <input type="text" id="cpfCliente" class="input" placeholder="Seu CPF" maxlength="18">
    <button id="btnVerificar" class="btn btn-primary" onclick="verificar()">Verificar Status</button>

    <div id="carregando" class="carregando"><div class="bolinha"></div> Atualizando...</div>
    <div id="mensagem" class="alerta hidden"></div>
    <div id="resultado" class="hidden"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { enabled: true } });

let cpfAtual = '';

function limparCpf(cpf) { return String(cpf || '').replace(/\D/g, ''); }

async function verificar() {
    cpfAtual = limparCpf(document.getElementById('cpfCliente').value);
    if(cpfAtual.length !== 11) {
        document.getElementById('mensagem').textContent = 'Digite um CPF válido com 11 números!';
        document.getElementById('mensagem').className = 'alerta perigo';
        document.getElementById('mensagem').classList.remove('hidden');
        return;
    }
    buscarProposta();
    iniciarAtualizacaoAutomatica();
}

async function buscarProposta() {
    document.getElementById('carregando').classList.add('mostrar');
    document.getElementById('mensagem').classList.add('hidden');
    document.getElementById('resultado').classList.add('hidden');

    try {
        const { data } = await supabase.from('propostas').select('*');
        const proposta = data?.find(item => limparCpf(item.cpf) === cpfAtual);

        if(!proposta) {
            document.getElementById('mensagem').textContent = '❌ Proposta não encontrada ou ainda em análise.';
            document.getElementById('mensagem').className = 'alerta alerta';
            document.getElementById('mensagem').classList.remove('hidden');
            return;
        }

        document.getElementById('resultado').classList.remove('hidden');
        let statusTexto, statusClasse;

        if(proposta.status === 'Aprovada') {
            statusTexto = '✅ PROPOSTA APROVADA!';
            statusClasse = 'sucesso';
        } else if(proposta.status === 'Reprovada') {
            statusTexto = '❌ Proposta reprovada';
            statusClasse = 'perigo';
        } else {
            statusTexto = '⏳ Em análise, aguarde...';
            statusClasse = 'alerta';
        }

        document.getElementById('resultado').innerHTML = `
            <div class="alerta ${statusClasse} mb-4">${statusTexto}</div>
            <div class="dado"><strong>Nome:</strong> ${proposta.nome}</div>
            <div class="dado"><strong>CPF:</strong> ${limparCpf(proposta.cpf).replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</div>

            ${proposta.status === 'Aprovada' ? `
            <div class="dado"><strong>Valor Total:</strong> R$ ${parseFloat(proposta.valor_aprovado||0).toFixed(2).replace('.',',')}</div>
            <div class="dado"><strong>Entrada:</strong> R$ ${parseFloat(proposta.valor_entrada||0).toFixed(2).replace('.',',')}</div>
            <div class="dado"><strong>Parcelas:</strong> ${proposta.qtd_parcelas}x de R$ ${parseFloat(proposta.valor_parcela||0).toFixed(2).replace('.',',')}</div>

            <div class="pix-area">
                <h4 class="font-bold text-lg mb-2">💳 Pague a Entrada via Pix</h4>
                <p class="text-sm mb-2">Chave Pix: <strong>${proposta.chave_pix || 'Aguarde um instante...'}</strong></p>
                <div id="qrcode" class="flex justify-center my-3"></div>
                <button class="btn btn-sucesso" onclick="navigator.clipboard.writeText('${proposta.chave_pix}').then(() => alert('Chave copiada!'))">Copiar Chave Pix</button>
            </div>

            <div class="contrato">
                <h4 class="font-bold mb-2 text-center">📄 CONTRATO DE COMPRA PARCELADA</h4>
                <p>Distribuidora Flash Point</p>
                <p>O cliente se compromete a pagar o valor total acordado. O não pagamento implicará multa de 2% ao mês, inclusão nos órgãos de proteção ao crédito e recolhimento do produto. Após confirmação do pagamento da entrada, faremos a entrega no endereço cadastrado.</p>
                <p class="mt-2"><strong>Ao efetuar o pagamento você confirma que leu e concorda com todos os termos acima.</strong></p>
            </div>
            ` : ''}
        `;

        if(proposta.chave_pix && proposta.status === 'Aprovada') {
            setTimeout(() => {
                new QRCode(document.getElementById('qrcode'), { text: proposta.chave_pix, width: 180, height: 180 });
            }, 200);
        }

    } catch {
        document.getElementById('mensagem').textContent = '⚠️ Erro ao buscar, tente novamente!';
        document.getElementById('mensagem').className = 'alerta perigo';
        document.getElementById('mensagem').classList.remove('hidden');
    } finally {
        document.getElementById('carregando').classList.remove('mostrar');
    }
}

// --- ATUALIZA AUTOMÁTICO ASSIM QUE VOCÊ APROVAR ---
function iniciarAtualizacaoAutomatica() {
    supabase.channel('atualizacoes_cliente')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'propostas', filter: `cpf=eq.${cpfAtual}` }, () => {
            buscarProposta();
        })
        .subscribe();
}

// --- ABRIR DIRETO PELO LINK DO WHATSAPP ---
window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    const cpfUrl = params.get('cpf');
    if(cpfUrl) {
        document.getElementById('cpfCliente').value = limparCpf(cpfUrl);
        verificar();
    }
});
</script>
</body>
</html>
