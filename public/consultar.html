<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
    'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            realtime: true
        }
    );


/* ==========================================================
   VARIÁVEIS
========================================================== */

let propostaAtual = null;

let canalRealtime = null;

let webcamStream = null;

let modoAssinatura = 'texto';


/* ==========================================================
   QUANTIDADE OFICIAL DE PARCELAS
   A quantidade definida no painel é a fonte principal.
   qtd_parcelas_escolhida fica apenas como compatibilidade.
========================================================== */
function obterQuantidadeParcelasOficial(p) {
    if (!p) return 0;

    const oficial = Number(p.quantidade_parcelas);
    if (Number.isFinite(oficial) && oficial > 0) return Math.floor(oficial);

    const escolhida = Number(p.qtd_parcelas_escolhida);
    if (Number.isFinite(escolhida) && escolhida > 0) return Math.floor(escolhida);

    const antiga = Number(p.qtd_parcelas);
    if (Number.isFinite(antiga) && antiga > 0) return Math.floor(antiga);

    return 0;
}

function obterParcelasEscolhidas(p) {
    if (!p) return 0;
    const escolhida = Number(p.qtd_parcelas_escolhida);
    if (Number.isFinite(escolhida) && escolhida > 0) return Math.floor(escolhida);
    const antiga = Number(p.qtd_parcelas);
    if (Number.isFinite(antiga) && antiga > 0) return Math.floor(antiga);
    return 0;
}

async function sincronizarQuantidadeParcelas(p) {
    // quantidade_parcelas é apenas o limite definido no painel.
    // A escolha do cliente permanece em qtd_parcelas_escolhida.
    if (!p || !p.id) return;
}


/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

document.addEventListener(
    'DOMContentLoaded',
    iniciar
);


async function iniciar() {

    const campo =
        document.getElementById(
            'cpfConsulta'
        );

    /*
     * Enter também executa a consulta.
     */
    campo.addEventListener(
        'keydown',
        function(e) {

            if(e.key === 'Enter') {

                e.preventDefault();

                executarConsulta();
            }

        }
    );


    /*
     * Formatação automática do CPF.
     */
    campo.addEventListener(
        'input',
        function() {

            let valor =
                campo.value
                .replace(/\D/g,'')
                .slice(0,11);

            if(valor.length > 9) {

                valor =
                    valor.replace(
                        /(\d{3})(\d{3})(\d{3})(\d{0,2})/,
                        '$1.$2.$3-$4'
                    );

            } else if(valor.length > 6) {

                valor =
                    valor.replace(
                        /(\d{3})(\d{3})(\d{0,3})/,
                        '$1.$2.$3'
                    );

            } else if(valor.length > 3) {

                valor =
                    valor.replace(
                        /(\d{3})(\d{0,3})/,
                        '$1.$2'
                    );
            }

            campo.value = valor;
        }
    );


    /*
     * ======================================================
     * CORREÇÃO PRINCIPAL:
     *
     * Se o cliente recebeu:
     *
     * proposta.html?id=UUID
     *
     * a proposta é carregada automaticamente.
     * ======================================================
     */

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    const id =
        parametros.get('id');


    if(id) {

        const botao =
            document.getElementById(
                'btnConsultar'
            );

        botao.disabled = true;

        botao.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Carregando proposta...';


        await carregarPorId(id);


        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';


        return;
    }


    /*
     * Não abre automaticamente a proposta antiga.
     * Apenas preenche o CPF salvo.
     */
    const cpfSalvo =
        localStorage.getItem(
            'flashcred_cpf'
        );


    const propostaIdSalva = localStorage.getItem('flashcred_proposta_id');

    if(propostaIdSalva) {
        try {
            const botao = document.getElementById('btnConsultar');
            botao.disabled = true;
            botao.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Recuperando proposta...';
            await carregarPorId(propostaIdSalva);
            botao.disabled = false;
            botao.innerHTML = '<i class="fas fa-search"></i> Consultar proposta';
            return;
        } catch(e) {
            console.warn('Falha ao recuperar proposta salva:', e);
            localStorage.removeItem('flashcred_proposta_id');
        }
    }

    if(cpfSalvo) {
        campo.value = formatarCPF(cpfSalvo);
    }
}


/* ==========================================================
   FORMATAR CPF
========================================================== */

function somenteNumeros(valor) {

    return String(
        valor || ''
    ).replace(
        /\D/g,
        ''
    );
}


function formatarCPF(cpf) {

    cpf =
        somenteNumeros(cpf)
        .slice(0,11);


    if(cpf.length <= 3)
        return cpf;


    if(cpf.length <= 6) {

        return cpf.replace(
            /(\d{3})(\d+)/,
            '$1.$2'
        );
    }


    if(cpf.length <= 9) {

        return cpf.replace(
            /(\d{3})(\d{3})(\d+)/,
            '$1.$2.$3'
        );
    }


    return cpf.replace(
        /(\d{3})(\d{3})(\d{3})(\d{2})/,
        '$1.$2.$3-$4'
    );
}


/* ==========================================================
   CONSULTA CPF
========================================================== */

async function executarConsulta(
    cpfInformado = null
) {

    let cpf =
        cpfInformado ||
        document
            .getElementById('cpfConsulta')
            .value;


    cpf =
        somenteNumeros(cpf);


    if(cpf.length !== 11) {

        alert(
            'Digite os 11 números do CPF.'
        );

        return;
    }


    const botao =
        document.getElementById(
            'btnConsultar'
        );


    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';


    try {

        /*
         * Primeira tentativa:
         * CPF somente números.
         */
        let resultado =
            await supabase
                .from('propostas')
                .select('*')
                .eq('cpf', cpf)
                .limit(1);


        /*
         * Se não encontrou,
         * tenta CPF formatado.
         */
        if(
            !resultado.error &&
            (!resultado.data ||
             resultado.data.length === 0)
        ) {

            const cpfFormatado =
                formatarCPF(cpf);


            resultado =
                await supabase
                    .from('propostas')
                    .select('*')
                    .eq(
                        'cpf',
                        cpfFormatado
                    )
                    .limit(1);
        }


        if(resultado.error) {

            throw new Error(
                resultado.error.message
            );
        }


        if(
            !resultado.data ||
            resultado.data.length === 0
        ) {

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );
        }


        /*
         * Se existir mais de uma proposta
         * para o CPF, atualmente pegamos
         * a primeira.
         */
        propostaAtual =
            resultado.data[0];


        salvarSessao();

        abrirProposta();

        configurarRealtime();


    } catch(error) {

        console.error(
            'Erro consulta CPF:',
            error
        );


        alert(
            error.message ||
            'Não foi possível consultar a proposta.'
        );


    } finally {

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';
    }
}


/* ==========================================================
   CARREGAR PROPOSTA POR ID
========================================================== */

async function carregarPorId(id) {

    try {

        if(!id) {

            throw new Error(
                'ID da proposta não informado.'
