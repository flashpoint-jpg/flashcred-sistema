        <button onclick="consultar()" class="botao botao-principal mt-4">
            <i class="fas fa-search"></i> Consultar Proposta
        </button>
    </div>

    <div id="resultado" class="hidden"></div>

    <button onclick="window.open('https://wa.me/5511973294235?text=Olá! Preciso de suporte sobre minha proposta.', '_blank')" 
        class="botao botao-whatsapp nao-imprimir mt-6">
        <i class="fab fa-whatsapp"></i> Falar com Suporte
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CHAVE_PIX_FIXA = '33552949852';
const NOME_RECEBEDOR = 'FLASH POINT';

let proposta = null;
let assinaturaCanvas = null;
let assinaturaCtx = null;
let assinando = false;
let assinaturaFeita = false;
let canalRealtime = null;

function voltar() {
    if (canalRealtime) {
        supabase.removeChannel(canalRealtime);
        canalRealtime = null;
    }
    document.getElementById('resultado').classList.add('hidden');
    document.getElementById('telaConsulta').classList.remove('hidden');
    document.getElementById('cpf').value = '';
}

function formatarCPF(cpf) {
    cpf = cpf.replace(/\D/g, '');
    return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
}

function formatarData(data) {
    if (!data) return '---';
    const d = new Date(data);
    return d.toLocaleDateString('pt-BR');
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function calcularCorVencimento(dataVenc) {
    if (!dataVenc) return 'parcela-verde';
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const ven = new Date(dataVenc); ven.setHours(0,0,0,0);
    const dias = Math.ceil((ven - hoje) / (1000*60*60*24));
    if (dias < 0) return 'parcela-vermelha';
    if (dias <= 7) return 'parcela-vermelha';
    if (dias <= 14) return 'parcela-amarela';
    return 'parcela-verde';
}

function calcularBolinha(dataVenc) {
    if (!dataVenc) return 'bolinha-verde';
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const ven = new Date(dataVenc); ven.setHours(0,0,0,0);
    const dias = Math.ceil((ven - hoje) / (1000*60*60*24));
    if (dias < 0) return 'bolinha-vermelha';
    if (dias <= 7) return 'bolinha-vermelha';
    if (dias <= 14) return 'bolinha-amarela';
    return 'bolinha-verde';
}

function gerarCodigoPix(valor, descricao = 'Pagamento') {
    const valorStr = Number(valor || 0).toFixed(2);
    const chave = CHAVE_PIX_FIXA;
    const nome = NOME_RECEBEDOR;
    const cidade = 'SAO PAULO';
    const txId = '***';

    function montarParte(id, conteudo) {
        const s = String(conteudo || '');
        return id + String(s.length).padStart(2, '0') + s;
    }

    const brCod = montarParte('00', 'BR-GOV.BCB.PIX') + montarParte('01', chave);
    const valorParte = valorStr !== '0.00' ? montarParte('05', valorStr) : '';

    let payload = montarParte('00', '01')
        + montarParte('26', brCod)
        + montarParte('52', '0000')
        + montarParte('53', '986')
        + valorParte
        + montarParte('59', nome)
        + montarParte('60', cidade)
        + montarParte('62', montarParte('05', txId));

    function calcularCRC16(s) {
        let crc = 0xFFFF;
        for (let i = 0; i < s.length; i++) {
            crc ^= s.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1;
            }
        }
        return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }
    return payload + '6304' + calcularCRC16(payload + '6304');
}

async function consultar() {
    let cpf = document.getElementById('cpf').value.replace(/\D/g, '');
    if (cpf.length !== 11) { alert('⚠️ Digite um CPF válido com 11 dígitos!'); return; }

    document.getElementById('telaConsulta').classList.add('hidden');
    document.getElementById('resultado').innerHTML = '<p class="text-center p-10 text-slate-500 text-lg">🔎 Buscando sua proposta...</p>';
    document.getElementById('resultado').classList.remove('hidden');

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .filter('cpf', 'ilike', '%' + cpf + '%')
        .order('created_at', { ascending: false })
        .limit(1);

    if (error) {
        document.getElementById('resultado').innerHTML = `
            <div class="aviso">❌ Erro na busca: ${error.message}</div>
            <button onclick="voltar()" class="botao botao-voltar w-full mt-4">Voltar e tentar novamente</button>`;
        return;
    }

    if (!data || data.length === 0) {
        document.getElementById('resultado').innerHTML = `
            <div class="aviso">⚠️ Proposta não encontrada! Verifique o CPF digitado.</div>
            <button onclick="voltar()" class="botao botao-voltar w-full mt-4">Voltar e corrigir</button>`;
        return;
    }

    proposta = data[0];
    mostrarProposta();
    ativarNotificacaoTempoReal(proposta.id);
}

function ativarNotificacaoTempoReal(propostaId) {
    canalRealtime = supabase
        .channel('proposta-atualizada')
        .on(
            'postgres_changes',
            {
                event: 'UPDATE',
                schema: 'public',
                table: 'propostas',
                filter: `id=eq.${propostaId}`
            },
            (payload) => {
                proposta = payload.new;
                mostrarProposta();
                tocarSomNotificacao();
            }
        )
        .subscribe();
}

function tocarSomNotificacao() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const som = audioCtx.createOscillator();
        const vol = audioCtx.createGain();
        som.connect(vol);
        vol.connect(audioCtx.destination);
        som.type = 'sine';
        som.frequency.value = 880;
        vol.gain.setValueAtTime(0.3, audioCtx.currentTime);
        vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        som.start(audioCtx.currentTime);
        som.stop(audioCtx.currentTime + 0.4);
    } catch (e) {}
}

function getStatusEtapas(status, assinada) {
    return [
        { titulo: 'Proposta enviada', concluida: true },
        { titulo: status === 'Aprovada' ? '✅ Proposta aprovada' : status === 'Reprovada' ? '❌ Reprovada' : '⏳ Em análise', concluida: status === 'Aprovada' || status === 'Entrada Paga', andamento: status === 'Aguardando' },
        { titulo: assinada ? '✅ Contrato assinado' : '📄 Assinar contrato', concluida: assinada },
        { titulo: status === 'Entrada Paga' ? '✅ Entrada confirmada pelo banco' : '💳 Aguardando confirmação do pagamento', concluida: status === 'Entrada Paga', andamento: status === 'Aprovada' },
        { titulo: status === 'Entrada Paga' ? '📊 Pagamento das parcelas' : '🔒 Parcelas liberadas após entrada', concluida: false, liberado: status === 'Entrada Paga' }
    ];
}

function mostrarProposta() {
    const valorTotal = Number(proposta.valor_desejado || 0);
    const percEnt = Number(proposta.percentual_entrada || 20);
    const valorEntrada = valorTotal * percEnt / 100;
    const parcelas = proposta.lista_parcelas || [];
    const quantidadeParc = proposta.quantidade_parcelas || parcelas.length;
    const juros = Number(proposta.juros || 0);
    const codigoPixEntrada = gerarCodigoPix(valorEntrada, 'Entrada');

    let statusTexto, statusCor;
    if (proposta.status === 'Entrada Paga') {
        statusTexto = '✅ ENTRADA CONFIRMADA — Pagamento identificado pelo banco!'; statusCor = 'text-green-600';
    } else if (proposta.status === 'Aprovada') {
        statusTexto = '✅ APROVADA — Aguarda confirmação do pagamento'; statusCor = 'text-blue-600';
    } else if (proposta.status === 'Reprovada') {
        statusTexto = '❌ Reprovada'; statusCor = 'text-red-600';
    } else {
        statusTexto = '⏳ Aguardando Análise'; statusCor = 'text-yellow-600';
    }

    const jaAssinou = proposta.assinatura_assinada;
    const entradaPaga = proposta.status === 'Entrada Paga';
    const etapas = getStatusEtapas(proposta.status, jaAssinou);

    let html = `
    <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-bold text-primary mb-2">📋 Proposta de ${proposta.nome}</h2>
        <p class="text-sm text-slate-500 mb-3">Código: ${proposta.codigo_unico || '---'}</p>
        <p class="${statusCor} font-bold text-lg mb-6 p-3 bg-slate-50 rounded-lg">${statusTexto}</p>

        <div class="resumo-card">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <div class="resumo-titulo">💰 Valor Total</div>
                    <div class="resumo-valor">${real(valorTotal)}</div>
                </div>
                <div>
                    <div class="resumo-titulo">💵 Entrada (${percEnt}%)</div>
                    <div class="resumo-valor text-green-600">${real(valorEntrada)}</div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-3">
                <div>
                    <div class="resumo-titulo">📊 Parcelas</div>
                    <div class="resumo-valor text-blue-600">${quantidadeParc}x</div>
                </div>
                <div>
                    <div class="resumo-titulo">📈 Juros</div>
                    <div class="resumo-valor text-purple-600">${juros}% ao mês</div>
                </div>
            </div>
        </div>

        <div class="info-aviso">
            <strong>📋 Situação da proposta:</strong>
            ${etapas.map(e => `
                <div class="etapa ${e.concluida ? 'etapa-concluida' : e.andamento ? 'etapa-andamento' : 'etapa-pendente'}">
                    ${e.concluida ? '✅' : e.andamento ? '⏳' : '⬜'} ${e.titulo}
                </div>
            `).join('')}
        </div>`;

    if (!entradaPaga && proposta.status === 'Aprovada') {
        html += `
        <div class="pagamento-entrada mt-6">
            <h3 class="text-xl font-bold text-pix mb-4 text-center">💳 PAGAMENTO DA ENTRADA</h3>
            <p class="text-center font-semibold text-lg mb-4">Valor: <span class="text-2xl text-green-700 font-bold">${real(valorEntrada)}</span></p>
            
            <div class="qrcode-box">
                <div id="qrcode-entrada"></div>
                <p class="text-sm text-slate-500 mt-3">📱 Escaneie com a câmera do app do banco</p>
            </div>

            <div class="pix-copia" onclick="copiarPix('${codigoPixEntrada}')">
                <strong>🔑 Chave Pix:</strong> ${CHAVE_PIX_FIXA}<br>
                <span class="copia-nota">👆 Clique para copiar o código Pix e pagar no app do banco</span>
            </div>
        </div>

        <div class="info-aviso">
            🏦 <strong>Atenção:</strong> Após pagar, o banco pode levar até <strong>24h</strong> para notificar. Assim que confirmado, aparecerá abaixo: 
            <strong>"✅ Entrada confirmada pelo banco"</strong> e as parcelas serão liberadas.
        </div>`;

        if (!jaAssinou) {
            html += `
            <div class="lido-check">
                <input type="checkbox" id="liContrato" onchange="verificarLido()">
                <label for="liContrato">Li e concordo com o contrato abaixo. Declaro que os dados são verdadeiros e autorizo os pagamentos nas datas de vencimento.</label>
            </div>

            <div id="areaAssinatura" class="oculto">
                <p class="font-bold text-sm text-slate-700 mb-2">✍️ Assine no quadro abaixo:</p>
                <div class="assinatura-area">
                    <canvas id="assinaturaCanvas" class="assinatura-canvas"></canvas>
                </div>
                <div class="botoes-linha">
                    <button onclick="limparAssinatura()" class="botao botao-voltar flex-1">🗑️ Limpar</button>
                    <button onclick="confirmarAssinatura()" id="btnConfirmarAssinatura" class="botao botao-sucesso flex-1" disabled>✅ Confirmar Assinatura</button>
                </div>
            </div>`;
        } else {
            html += `<div class="aviso">✅ Contrato assinado! Aguarde a confirmação do pagamento pelo banco.</div>`;
        }
    }

    if (entradaPaga && parcelas.length > 0) {
        html += `
        <div class="notificacao-pagamento">
            ✅ <strong>PAGAMENTO CONFIRMADO!</strong> O banco notificou o recebimento. Suas parcelas foram liberadas 👇
        </div>

        <h3 class="text-xl font-bold text-primary mt-6 mb-4">📊 SUAS PARCELAS</h3>
        <p class="text-sm text-slate-500 mb-3">
            <span class="status-bolinha bolinha-verde"></span> Em dia · 
            <span class="status-bolinha bolinha-amarela"></span> Atenção · 
            <span class="status-bolinha bolinha-vermelha"></span> Vencida
        </p>
        <table class="parcelas-tabela">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Vencimento</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>`;
        parcelas.forEach((p, idx) => {
            const cor = calcularCorVencimento(p.vencimento);
            const bolinha = calcularBolinha(p.vencimento);
            const estaPaga = p.status === 'Paga';
            const codigoPixParcela = gerarCodigoPix(p.valor, `Parcela ${p.numero}`);
            html += `
            <tr class="${cor}">
                <td class="font-bold">${p.numero}</td>
                <td>${formatarData(p.vencimento)}</td>
                <td class="font-bold">${real(p.valor)}</td>
                <td class="${estaPaga ? 'parcela-paga' : 'parcela-pendente'}">
                    <span class="status-bolinha ${bolinha}"></span>
                    ${estaPaga ? '✅ Paga' : '⏳ Pendente'}
                </td>
                <td>
                    ${!estaPaga 
                        ? `<button class="botao-pagar-parcela" onclick="pagarParcela(${idx}, '${codigoPixParcela}')">💳 Pagar</button>` 
                        : '<span class="text-green-600 font-semibold">✓</span>'}
                </td>
            </tr>`;
        });
        html += `</tbody></table>`;
    }

    html += `
        <div class="contrato" id="contrato-impressao">
            <h3>📄 CONTRATO DE PRESTAÇÃO DE SERVIÇOS</h3>
            <p class="linha">Pelo presente instrumento, <span class="destaque">${proposta.nome}</span>, CPF ${formatarCPF(proposta.cpf || '')}, abaixo assinado, aceita as condições:</p>
            <p class="linha">1. Valor Total Contratado: <span class="destaque">${real(valorTotal)}</span></p>
            <p class="linha">2. Entrada de <span class="destaque">${percEnt}% (${real(valorEntrada)})</span> e ${quantidadeParc} parcelas mensais com juros de ${juros}% ao mês.</p>
            <p class="linha">3. O não pagamento no vencimento implicará em multa de 2% e juros de 1% ao mês.</p>
            <p class="linha">4. A FlashCred / Distribuidora Flash Point se responsabiliza pela entrega dos móveis conforme combinado, após confirmação do pagamento da entrada.</p>
            <p class="linha">5. Declaro que os dados informados são verdadeiros e autorizo a cobrança nas datas de vencimento.</p>
            <p class="linha">6. Ao deixar de pagar, estará prejudicando a mim que pensei em você primeiro. Pense bem: eu confiei em você. Vamos honrar o compromisso!</p>
            <p class="linha mt-6">São Paulo, ${new Date().toLocaleDateString('pt-BR')}.</p>
            <p class="linha mt-8">Assinatura: ___________________________________________________</p>
            <p class="linha">${proposta.nome}</p>
            <p class="linha">CPF: ${formatarCPF(proposta.cpf || '')}</p>
        </div>

        <div class="botoes-linha nao-imprimir">
            <button onclick="window.print()" class="botao botao-imprimir flex-1">🖨️ Imprimir Contrato</button>
            <button onclick="voltar()" class="botao botao-voltar flex-1">🔄 Consultar Outro</button>
        </div>
    </div>`;

    document.getElementById('resultado').innerHTML = html;
    document.getElementById('resultado').classList.remove('hidden');

    if (!entradaPaga && proposta.status === 'Aprovada') {
        setTimeout(() => {
            const qrDiv = document.getElementById('qrcode-entrada');
            if (qrDiv) {
                new QRCode(qrDiv, {
                    text: codigoPixEntrada,
                    width: 220,
                    height: 220,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });
            }
            if (!jaAssinou) inicializarAssinatura();
        }, 300);
    }
}

function copiarPix(codigo) {
    navigator.clipboard.writeText(codigo).then(() => {
        alert('✅ Código Pix copiado com sucesso!\n\nAbra o aplicativo do seu banco → Pix → Colar código → Confirmar.');
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = codigo;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('✅ Código Pix copiado! Abra o app do banco e cole.');
    });
}

function pagarParcela(indice, codigoPix) {
    copiarPix(codigoPix);
}

function verificarLido() {
    const lido = document.getElementById('liContrato').checked;
    document.getElementById('areaAssinatura').classList.toggle('oculto', !lido);
}

function inicializarAssinatura() {
    const canvas = document.getElementById('assinaturaCanvas');
    if (!canvas) return;
    assinaturaCanvas = canvas;
    assinaturaCtx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    assinaturaCtx.lineWidth = 3;
    assinaturaCtx.lineCap = 'round';
    assinaturaCtx.lineJoin = 'round';
    assinaturaCtx.strokeStyle = '#000000';

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) * scaleX;
        const y = ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) * scaleY;
        return { x, y };
    }

    function iniciar(e) {
        e.preventDefault();
        assinando = true;
        assinaturaFeita = false;
        const pos = getPos(e);
        assinaturaCtx.beginPath();
        assinaturaCtx.moveTo(pos.x, pos.y);
    }

    function desenhar(e) {
        if (!assinando) return;
        e.preventDefault();
        assinaturaFeita = true;
        const pos = getPos(e);
        assinaturaCtx.lineTo(pos.x, pos.y);
        assinaturaCtx.stroke();
    }

    function parar() {
        assinando = false;
        document.getElementById('btnConfirmarAssinatura').disabled = !assinaturaFeita;
    }

    canvas.addEventListener('mousedown', iniciar);
    canvas.addEventListener('mousemove', desenhar);
    canvas.addEventListener('mouseup', parar);
    canvas.addEventListener('mouseout', parar);
    canvas.addEventListener('touchstart', iniciar);
    canvas.addEventListener('touchmove', desenhar);
    canvas.addEventListener('touchend', parar);
}

function limparAssinatura() {
    if (assinaturaCanvas && assinaturaCtx) {
        assinaturaCtx.clearRect(0, 0, assinaturaCanvas.width, assinaturaCanvas.height);
        assinaturaFeita = false;
        document.getElementById('btnConfirmarAssinatura').disabled = true;
    }
}

async function confirmarAssinatura() {
    if (!assinaturaFeita) { alert('⚠️ Assine no quadro antes de confirmar!'); return; }
    if (!confirm('✅ Confirmar minha assinatura no contrato?')) return;

    const { error } = await supabase.from('propostas').update({
        assinatura_assinada: true,
        data_assinatura: new Date().toISOString()
    }).eq('id', proposta.id);

    if (error) alert('❌ Erro ao salvar assinatura: ' + error.message);
    else {
        alert('✅ Contrato assinado com sucesso!\n\nAgora faça o pagamento da entrada pelo Pix acima.\n\nAssim que o banco confirmar, aparecerá automaticamente ✅ Entrada confirmada!');
    }
}
</script>
