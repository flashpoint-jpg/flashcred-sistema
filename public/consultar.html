    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; padding: 20px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 24px; max-width: 520px; margin: 0 auto; }
        .btn { padding: 12px 20px; border-radius: 10px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s; width: 100%; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-whatsapp { background: #25D366; color: white; margin-top: 10px; }
        .input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; margin-bottom: 16px; }
        .bolinha-carregando { display: inline-block; width: 16px; height: 16px; border: 3px solid #0A2463; border-top-color: transparent; border-radius: 50%; animation: girar 1s linear infinite; margin-right: 8px; }
        @keyframes girar { to { transform: rotate(360deg); } }
        .area-qrcode { text-align: center; padding: 16px; background: #F0FDF4; border-radius: 12px; margin: 16px 0; }
        .codigo-pix { font-family: monospace; font-size: 12px; word-break: break-all; background: #E5E7EB; padding: 10px; border-radius: 8px; margin: 10px 0; text-align: left; }
        .badge { padding: 6px 14px; border-radius: 12px; font-weight: 600; display: inline-block; margin: 8px 0; }
        .badge-aprovada { background: #D1FAE5; color: #065F46; }
        .badge-reprovada { background: #FEE2E2; color: #991B1B; }
        .badge-analise { background: #FEF3C7; color: #92400E; }
    </style>
</head>
<body>

<div class="card">
    <h2 class="text-xl font-bold text-center text-primary mb-6">📋 Consultar Sua Proposta</h2>

    <div id="areaBusca">
        <label class="font-medium text-texto">Digite seu CPF:</label>
        <input type="text" id="cpfBusca" class="input" placeholder="000.000.000-00" maxlength="14">
        <button class="btn btn-primary" onclick="buscarProposta()">
            <span id="textoBtn">Consultar</span>
            <span id="carregandoBtn" class="bolinha-carregando hidden"></span>
        </button>
    </div>

    <div id="resultado" class="hidden mt-6"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function limparCpf(cpf) { return String(cpf || '').replace(/\D/g, ''); }

document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const cpfLink = params.get('cpf');
    if(cpfLink) {
        document.getElementById('cpfBusca').value = cpfLink;
        buscarProposta();
    }
});

async function buscarProposta() {
    const cpf = limparCpf(document.getElementById('cpfBusca').value);
    if(cpf.length !== 11) {
        alert('Por favor, digite um CPF válido!');
        return;
    }

    document.getElementById('textoBtn').textContent = 'Buscando...';
    document.getElementById('carregandoBtn').classList.remove('hidden');
    document.getElementById('resultado').classList.add('hidden');

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .eq('cpf', cpf)
        .single();

    document.getElementById('textoBtn').textContent = 'Consultar';
    document.getElementById('carregandoBtn').classList.add('hidden');

    if(error || !data) {
        document.getElementById('resultado').innerHTML = `
            <div class="text-center py-6">
                <div class="bolinha-carregando mx-auto mb-3"></div>
                <p class="text-lg font-medium text-alerta">Proposta em análise</p>
                <p class="text-gray-600 mt-2">Ainda estamos analisando seu pedido. Em breve você receberá o retorno pelo WhatsApp.</p>
            </div>
        `;
        document.getElementById('resultado').classList.remove('hidden');
        return;
    }

    mostrarResultado(data);
}

            </div>
        `;
    }
