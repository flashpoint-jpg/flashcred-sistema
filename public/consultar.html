<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhar Proposta | FlashCred</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{
primary:'#0A2463',pix:'#32BCAD',sucesso:'#10B981',alerta:'#F59E0B',perigo:'#EF4444'
}}}};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#F8FAFC;color:#1E293B;padding:16px;max-width:600px;margin:0 auto}
.cartao{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
.botao{padding:10px 16px;border-radius:8px;border:none;font-weight:600;cursor:pointer;transition:.2s;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.botao:disabled{opacity:.6;cursor:not-allowed}
.botao-pix{background:#32BCAD;color:#fff;min-width:110px}
.botao-pix-menor{padding:6px 10px;font-size:13px;min-width:auto}
.botao-sucesso{background:#10B981;color:#fff;width:100%}
.botao-voltar{background:#94A3B8;color:#fff;margin-bottom:12px;width:100%}
.botao-wpp{background:#25D366;color:#fff;margin-top:12px;width:100%}
.botao-copiar{background:#0A2463;color:#fff;margin-top:8px;font-size:13px;padding:8px 12px}
.campo{width:100%;padding:12px;border:1px solid #CBD5E1;border-radius:8px;font-size:16px;margin-bottom:12px}
.barra-etapas{display:flex;justify-content:space-between;margin-bottom:20px;position:relative;padding:0 4px}
.barra-etapas:before{content:'';position:absolute;top:12px;left:8%;right:8%;height:3px;background:#E2E8F0;z-index:0}
.etapa{display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;font-size:10px;font-weight:500;color:#94A3B8;text-align:center;width:18%}
.etapa.ativa{color:#0A2463;font-weight:700}.etapa.concluida{color:#10B981}
.bolinha{width:24px;height:24px;border-radius:50%;background:#E2E8F0;display:flex;align-items:center;justify-content:center;margin-bottom:4px;font-size:12px;font-weight:bold}
.etapa.ativa .bolinha{background:#0A2463;color:#fff}.etapa.concluida .bolinha{background:#10B981;color:#fff}
.bloco-entrega{background:#FFFBEB;border:2px solid #F59E0B;border-radius:12px;padding:16px;margin:16px 0;text-align:center}
.barra-progresso{width:100%;height:12px;background:#E2E8F0;border-radius:6px;overflow:hidden;margin:8px 0}
.barra-preenchida{height:100%;background:#F59E0B;transition:width .5s ease}
.resumo-contrato{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:18px;margin:16px 0}
.resumo-contrato p{margin:10px 0;font-size:15px}.resumo-contrato strong{color:#0A2463;font-size:16px;font-weight:700}
.contrato{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:16px;max-height:220px;overflow-y:auto;margin:16px 0;font-size:13px;line-height:1.6;text-align:justify}
.qrcode-area{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:10px;border:1px solid #E2E8F0;margin:10px 0}
.codigo-pix{background:#ECFDF5;border:2px solid #10B981;border-radius:12px;padding:12px;text-align:center;font-weight:600;margin:8px 0;word-break:break-all;font-size:12px}
.item-parcela{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 12px;border-bottom:1px solid #E2E8F0;font-size:14px;gap:10px;flex-wrap:wrap}
.item-parcela:last-child{border-bottom:none}.dados-parcela{flex:1;min-width:180px}
.area-pix-parcela{width:100%;margin-top:10px;padding-top:10px;border-top:1px dashed #E2E8F0}
.luz{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}
.luz-verde{background:#10B981}.luz-amarela{background:#F59E0B;animation:piscar 1.2s infinite}.luz-vermelha{background:#EF4444;animation:piscar 1s infinite}
@keyframes piscar{0%,100%{opacity:1}50%{opacity:.4}}
.tela{display:none}.tela.visivel{display:block}.oculto{display:none!important}
.sucesso-box{background:#ECFDF5;border:2px solid #10B981;border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
.sucesso-box i{font-size:48px;color:#10B981;margin-bottom:12px}
.aviso-box{padding:16px;border-radius:10px;text-align:center;margin:12px 0}
</style>
</head>
<body>

<div id="telaConsulta" class="tela visivel">
  <div class="cartao">
    <h2 class="text-xl font-bold text-center mb-6 text-primary">🔍 Acompanhar Proposta</h2>
    <input type="text" id="cpfConsulta" inputmode="numeric" autocomplete="off"
           placeholder="Digite seu CPF (apenas números)" maxlength="11" class="campo">
    <button id="btnConsultar" class="botao botao-pix w-full" onclick="executarConsulta()">
      <i class="fas fa-search"></i> Consultar
    </button>
  </div>
</div>

<div id="telaProposta" class="tela">
  <button onclick="voltarInicio()" class="botao botao-voltar">
    <i class="fas fa-arrow-left"></i> Consultar Outro CPF
  </button>
  <div class="barra-etapas" id="barraEtapas"></div>
  <div class="cartao" id="conteudoProposta"></div>
</div>

<script>
const SUPABASE_URL='https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY='sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:true});

let propostaAtual=null;
let inscricaoTempoReal=null;
let webcamStream=null;
let modoAssinatura='selfie';

function limparCamera(){
  if(webcamStream){
    webcamStream.getTracks().forEach(t=>t.stop());
    webcamStream=null;
  }
}

function normalizarCpf(v){return String(v||'').replace(/\D/g,'').slice(0,11)}
function formatarValor(v){
  return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function escaparHtml(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function calcularParcela(saldo,juros,qtd){
  saldo=Number(saldo||0); juros=Number(juros||0)/100; qtd=Number(qtd||0);
  if(saldo<=0||qtd<=0)return 0;
  if(juros===0)return saldo/qtd;
  return saldo*(juros*Math.pow(1+juros,qtd))/(Math.pow(1+juros,qtd)-1);
}
function calcularDiasUteis(dataInicio,totalDias){
  totalDias=Math.max(0,Number(totalDias||0));
  if(!dataInicio||totalDias<=0)return {restante:totalDias,porcentagem:0};
  const inicio=new Date(dataInicio);
  if(Number.isNaN(inicio.getTime()))return {restante:totalDias,porcentagem:0};
  const hoje=new Date(); inicio.setHours(0,0,0,0); hoje.setHours(0,0,0,0);
  let uteisPassados=0, d=new Date(inicio);
  while(d<hoje){
    const dia=d.getDay();
    if(dia!==0&&dia!==6)uteisPassados++;
    d.setDate(d.getDate()+1);
  }
  const restante=Math.max(0,totalDias-utisPassados);
  const porcentagem=Math.min(100,Math.max(0,(uteisPassados/totalDias)*100));
  return {restante,porcentagem};
}

async function executarConsulta(){
  const cpfInput=document.getElementById('cpfConsulta');
  const btn=document.getElementById('btnConsultar');
  const cpf=normalizarCpf(cpfInput.value);
  cpfInput.value=cpf;
  if(cpf.length!==11){alert('Digite os 11 números do CPF!');return;}

  btn.disabled=true;
  btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Consultando...';

  try{
    const {data,error}=await supabase.from('propostas').select('*').eq('cpf',cpf).limit(1);
    if(error)throw new Error(error.message);
    if(!data||data.length===0)throw new Error('Nenhuma proposta encontrada para este CPF.');

    propostaAtual=data[0];
    sessionStorage.setItem('ultimo_cpf',cpf);
    mostrarProposta(propostaAtual);

    if(inscricaoTempoReal)await supabase.removeChannel(inscricaoTempoReal);
    inscricaoTempoReal=supabase.channel(`proposta_${propostaAtual.id}`)
      .on('postgres_changes',
        {event:'UPDATE',schema:'public',table:'propostas',filter:`id=eq.${propostaAtual.id}`},
        payload=>{
          propostaAtual=payload.new;
          mostrarProposta(propostaAtual);
        }
      ).subscribe();
  }catch(erro){
    alert(erro?.message||'Não foi possível consultar a proposta.');
  }finally{
    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-search"></i> Consultar';
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  const input=document.getElementById('cpfConsulta');
  input.addEventListener('input',()=>input.value=normalizarCpf(input.value));
  input.addEventListener('keydown',e=>{if(e.key==='Enter')executarConsulta();});

  const salvo=sessionStorage.getItem('ultimo_cpf');
  if(salvo){
    input.value=normalizarCpf(salvo);
    executarConsulta();
  }
});

async function voltarInicio(){
  limparCamera();
  if(inscricaoTempoReal){
    await supabase.removeChannel(inscricaoTempoReal);
    inscricaoTempoReal=null;
  }
  propostaAtual=null;
  sessionStorage.removeItem('ultimo_cpf');
  document.getElementById('cpfConsulta').value='';
  document.getElementById('conteudoProposta').innerHTML='';
  document.getElementById('telaProposta').classList.remove('visivel');
  document.getElementById('telaConsulta').classList.add('visivel');
}

function obterEtapa(p){
  if(p.entrada_paga)return 5;
  if(p.contrato_assinado)return 4;
  if(p.qtd_parcelas_escolhida)return 3;
  if(p.status==='Aprovada')return 2;
  return 1;
}

function renderizarEtapas(etapa){
  const nomes=['Análise','Parcelas','Contrato','Entrada','Entrega'];
  document.getElementById('barraEtapas').innerHTML=nomes.map((nome,i)=>{
    const n=i+1,concluida=etapa>n,ativa=etapa===n;
    return `<div class="etapa ${concluida?'concluida':''} ${ativa?'ativa':''}">
      <div class="bolinha">${concluida?'✓':n}</div><span>${nome}</span>
    </div>`;
  }).join('');
}

function mostrarProposta(p){
  limparCamera();
  document.getElementById('telaConsulta').classList.remove('visivel');
  document.getElementById('telaProposta').classList.add('visivel');

  const etapa=obterEtapa(p);
  renderizarEtapas(etapa);

  const nome=escaparHtml(p.nome||'cliente');
  const v=Number(p.valor_desejado||0);
  const e=Number(p.valor_entrada||0);
  const j=Number(p.juros_mensal||5);
  const qMax=Math.max(0,parseInt(p.qtd_parcelas_escolhida||p.quantidade_parcelas||0,10));
  const qEscolhida=parseInt(p.qtd_parcelas_escolhida||0,10);
  const saldo=Math.max(0,v-e);
  const dias=Math.max(0,parseInt(p.dias_entrega||0,10));
  const totalComJuros=Math.max(0,v*(1+j/100));
  const entrega=calcularDiasUteis(p.data_aprovacao_entrada||p.updated_at,new Date(),dias);

  let html=`<h2 class="text-xl font-bold text-center mb-4 text-primary">Olá, ${nome}!</h2>`;

  if(p.status==='Nova'||p.status==='Em análise'||p.status==='Em Analise'){
    html+=`<div class="aviso-box bg-yellow-50 text-yellow-800">
      <i class="fas fa-clock text-4xl text-alerta mb-3"></i>
      <p class="font-bold text-lg">Aguardando aprovação...</p>
      <p class="text-sm mt-2">Sua proposta está em análise.</p>
    </div>`;
  }else if(p.status==='Recusada'||p.status==='Reprovada'){
    html+=`<div class="aviso-box bg-red-50 text-red-700">
      <i class="fas fa-circle-xmark text-4xl text-perigo mb-3"></i>
      <p class="font-bold text-lg">Proposta não aprovada</p>
    </div>`;
  }

  if(p.status==='Aprovada'&&!qEscolhida){
    html+=`<div class="bloco-entrega"><p class="font-bold">ENTREGA EM ATÉ ${dias} DIAS ÚTEIS APÓS O PAGAMENTO!</p></div>
    <div class="resumo-contrato">
      <p>Valor do Produto: <strong>R$ ${formatarValor(v)}</strong></p>
      <p>Valor da Entrada: <strong>R$ ${formatarValor(e)}</strong></p>
      <p>Juros Mensais: <strong>${formatarValor(j)}%</strong></p>
      <p>Valor Total Informado: <strong>R$ ${formatarValor(totalComJuros)}</strong></p>
      <p>Até <strong>${qMax}x</strong> parcelas</p>
    </div>
    <select id="qtdEscolhida" class="campo">
      ${Array.from({length:qMax},(_,i)=>{
        const n=i+1,vl=calcularParcela(saldo,j,n);
        return `<option value="${n}">${n}x de R$ ${formatarValor(vl)}</option>`;
      }).join('')}
    </select>
    <button id="btnConfirmarParcelas" onclick="confirmarParcelas()" class="botao botao-sucesso">Continuar</button>`;
  }

  if(p.status==='Aprovada'&&qEscolhida&&!p.contrato_assinado){
    const parcela=calcularParcela(saldo,j,qEscolhida);
    html+=`<div class="resumo-contrato">
      <p>Valor do Produto: <strong>R$ ${formatarValor(v)}</strong></p>
      <p>Entrada: <strong>R$ ${formatarValor(e)}</strong></p>
      <p>Parcelamento: <strong>${qEscolhida}x de R$ ${formatarValor(parcela)}</strong></p>
      <p>Juros: <strong>${formatarValor(j)}% ao mês</strong></p>
      <p>Prazo de Entrega: <strong>${dias} dias úteis</strong></p>
    </div>
    <div class="contrato">
      <strong>Resumo contratual</strong><br><br>
      Valor do produto: R$ ${formatarValor(v)}.<br>
      Entrada: R$ ${formatarValor(e)}.<br>
      Parcelamento: ${qEscolhida}x de R$ ${formatarValor(parcela)}.<br>
      Juros: ${formatarValor(j)}% ao mês.<br>
      Prazo de entrega: até ${dias} dias úteis após a confirmação do pagamento da entrada.<br><br>
      Ao assinar, o cliente declara que leu e concorda com os termos apresentados.
    </div>
    <label class="flex items-center gap-2 mb-3">
      <input type="checkbox" id="aceitoContrato"> Li e concordo com o contrato
    </label>
    <div class="flex gap-2 mb-3">
      <button onclick="alternarModo('selfie')" id="bs" class="botao botao-pix-menor bg-primary text-white">📸 Selfie</button>
      <button onclick="alternarModo('texto')" id="bt" class="botao botao-pix-menor bg-gray-200">✏️ Assinatura</button>
    </div>
    <div id="s1">
      <video id="vid" autoplay playsinline class="w-full rounded mb-2" style="max-height:180px;background:#111;"></video>
      <button onclick="tirar()" class="botao botao-pix">Capturar Foto</button>
    </div>
    <div id="s2" class="oculto text-center mb-3">
      <img id="img" class="mx-auto rounded" style="max-height:160px;">
      <button onclick="refazer()" class="botao botao-pix-menor bg-gray-400 mt-2">Refazer</button>
    </div>
    <input type="text" id="assTxt" class="campo oculto" placeholder="Digite seu nome completo">
    <button id="btnAssinar" onclick="assinar()" class="botao botao-sucesso mt-2">Assinar Contrato</button>`;

    setTimeout(iniciarCamera,300);
  }

  if(p.contrato_assinado&&!p.entrada_paga){
    html+=`<div class="sucesso-box"><i class="fas fa-check-circle"></i>
      <h3 class="font-bold">CONTRATO ASSINADO!</h3>
      <p class="mt-2">Agora realize o pagamento da entrada para liberar a próxima etapa.</p>
    </div>
    <div class="resumo-contrato">
      <p>Valor da Entrada: <strong>R$ ${formatarValor(e)}</strong></p>
      <p>Valor Total: <strong>R$ ${formatarValor(totalComJuros)}</strong></p>
    </div>
    <button onclick="gerarPixEntrada(${e})" class="botao botao-pix w-full">GERAR PIX DA ENTRADA</button>
    <div id="areaPixEntrada" class="oculto mt-4"></div>`;
  }

  if(p.entrada_paga){
    const datas=Array.isArray(p.datas_parcelas)?p.datas_parcelas:gerarDatasParcelas(qEscolhida);
    const parcela=calcularParcela(saldo,j,qEscolhida);
    html+=`<div class="sucesso-box"><i class="fas fa-check-double"></i>
      <h3 class="font-bold">PAGAMENTO CONFIRMADO!</h3>
    </div>
    <div class="bloco-entrega" style="background:#ECFDF5;border-color:#10B981;">
      <p>Faltam <strong>${entrega.restante} dias úteis</strong> para entrega</p>
      <div class="barra-progresso"><div class="barra-preenchida" style="width:${entrega.porcentagem}%;background:#10B981;"></div></div>
    </div>
    <div class="resumo-contrato">
      <p>Total: <strong>R$ ${formatarValor(totalComJuros)}</strong></p>
      <p>Entrada Paga: <strong>R$ ${formatarValor(e)}</strong></p>
      <p>Restante: <strong>R$ ${formatarValor(Math.max(0,totalComJuros-e))}</strong></p>
      <p>${qEscolhida}x de: <strong>R$ ${formatarValor(parcela)}</strong></p>
    </div>
    <h3 class="font-bold mt-4 mb-3">SUAS PARCELAS</h3>`;

    datas.forEach((d,i)=>{
      const pg=i+1<=Number(p.parcelas_pagas||0);
      const vn=new Date(d+'T00:00:00');
      const classe=pg?'luz-verde':(vn<new Date()?'luz-vermelha':'luz-amarela');
      html+=`<div class="item-parcela">
        <div class="dados-parcela">
          <span class="luz ${classe}"></span>
          <strong>${i+1}ª</strong> | R$ ${formatarValor(parcela)}
          <br>Venc.: ${vn.toLocaleDateString('pt-BR')}
        </div>
        <div>${pg?'<span class="text-green-600 font-bold">PAGO</span>':
          `<button onclick="gerarPixParcela(${parcela},${i+1})" class="botao botao-pix-menor botao-pix">Pagar</button>`}</div>
        <div id="pixParcela${i+1}" class="area-pix-parcela oculto"></div>
      </div>`;
    });

    html+=`<a href="https://wa.me/5511973294235" target="_blank" rel="noopener noreferrer" class="botao botao-wpp">
      <i class="fab fa-whatsapp"></i> Suporte WhatsApp
    </a>`;
  }

  document.getElementById('conteudoProposta').innerHTML=html;
}

function gerarDatasParcelas(q){
  const arr=[]; const d=new Date();
  for(let i=1;i<=Number(q||0);i++){
    const x=new Date(d);
    x.setMonth(x.getMonth()+i);
    arr.push(x.toISOString().slice(0,10));
  }
  return arr;
}

async function confirmarParcelas(){
  const select=document.getElementById('qtdEscolhida');
  const btn=document.getElementById('btnConfirmarParcelas');
  const q=parseInt(select?.value||0,10);
  if(!q||!propostaAtual?.id)return alert('Selecione a quantidade de parcelas.');

  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Salvando...';
  try{
    const {data,error}=await supabase.from('propostas')
      .update({qtd_parcelas_escolhida:q})
      .eq('id',propostaAtual.id)
      .select('*').single();
    if(error)throw new Error(error.message);
    propostaAtual=data||{...propostaAtual,qtd_parcelas_escolhida:q};
    mostrarProposta(propostaAtual);
  }catch(e){
    alert('Não foi possível salvar a quantidade de parcelas: '+(e.message||e));
    btn.disabled=false; btn.innerHTML='Continuar';
  }
}

function iniciarCamera(){
  if(modoAssinatura!=='selfie')return;
  if(!navigator.mediaDevices?.getUserMedia){alternarModo('texto');return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}})
    .then(s=>{webcamStream=s;const vid=document.getElementById('vid');if(vid)vid.srcObject=s;})
    .catch(()=>alternarModo('texto'));
}

function alternarModo(m){
  modoAssinatura=m;
  const s1=document.getElementById('s1'),s2=document.getElementById('s2'),txt=document.getElementById('assTxt');
  if(!s1||!s2||!txt)return;
  s1.classList.toggle('oculto',m!=='selfie');
  s2.classList.toggle('oculto',m!=='texto');
  txt.classList.toggle('oculto',m!=='texto');
  if(m==='selfie')iniciarCamera();else limparCamera();
}

function tirar(){
  const v=document.getElementById('vid');
  if(!v||!v.videoWidth){alert('A câmera ainda não está pronta.');return;}
  const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  document.getElementById('img').src=c.toDataURL('image/jpeg',.85);
  document.getElementById('s1').classList.add('oculto');
  document.getElementById('s2').classList.remove('oculto');
  limparCamera();
}

function refazer(){
  document.getElementById('s2').classList.add('oculto');
  document.getElementById('s1').classList.remove('oculto');
  iniciarCamera();
}

async function assinar(){
  const aceite=document.getElementById('aceitoContrato');
  if(!aceite?.checked)return alert('Concorde com os termos do contrato.');

  let assinatura='';
  if(modoAssinatura==='selfie'){
    assinatura=document.getElementById('img')?.src||'';
    if(!assinatura)return alert('Capture sua foto antes de assinar.');
  }else{
    assinatura=document.getElementById('assTxt')?.value.trim()||'';
    if(!assinatura)return alert('Digite seu nome completo para assinar.');
  }

  const btn=document.getElementById('btnAssinar');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Assinando...';

  try{
    const {data,error}=await supabase.from('propostas')
      .update({contrato_assinado:true,assinatura:assinatura})
      .eq('id',propostaAtual.id)
      .select('*').single();
    if(error)throw new Error(error.message);
    propostaAtual=data||{...propostaAtual,contrato_assinado:true,assinatura};
    limparCamera();
    mostrarProposta(propostaAtual);
  }catch(e){
    alert('Não foi possível assinar o contrato: '+(e.message||e));
    btn.disabled=false; btn.innerHTML='Assinar Contrato';
  }
}

/* PIX — MANTIDO VIA API, SEM ALTERAR O FLUXO ORIGINAL */
async function gerarPixEntrada(valor){
  const a=document.getElementById('areaPixEntrada');
  a.classList.remove('oculto');
  a.innerHTML='<div class="text-center py-3"><i class="fas fa-spinner fa-spin"></i> Gerando...</div>';
  try{
    const cd=await buscarPix(valor,`Entrada - ${propostaAtual.id}`);
    if(!cd)throw new Error('A API não retornou um código Pix.');
    a.innerHTML=`<div class="qrcode-area" id="qrentrada"></div>
      <div class="codigo-pix">${escaparHtml(cd)}</div>
      <button onclick="copiarPix(${JSON.stringify(cd)})" class="botao botao-copiar">📋 Copiar</button>`;
    setTimeout(()=>new QRCode(document.getElementById('qrentrada'),{text:cd,width:200,height:200}),50);
  }catch(e){
    a.innerHTML=`<div class="text-center text-perigo">${escaparHtml(e.message||e)}</div>`;
  }
}

async function gerarPixParcela(valor,num){
  const a=document.getElementById(`pixParcela${num}`);
  if(!a)return;
  a.classList.remove('oculto');
  a.innerHTML='<div class="text-center py-2"><i class="fas fa-spinner fa-spin"></i> Gerando Pix...</div>';
  try{
    const cd=await buscarPix(valor,`Parcela ${num} - ${propostaAtual.id}`);
    if(!cd)throw new Error('A API não retornou um código Pix.');
    a.innerHTML=`<div class="qrcode-area" id="qr${num}"></div>
      <div class="codigo-pix">${escaparHtml(cd)}</div>
      <button onclick="copiarPix(${JSON.stringify(cd)})" class="botao botao-copiar">📋 Copiar</button>`;
    setTimeout(()=>new QRCode(document.getElementById(`qr${num}`),{text:cd,width:180,height:180}),50);
  }catch(e){
    a.innerHTML=`<div class="text-center text-perigo">${escaparHtml(e.message||e)}</div>`;
  }
}

async function copiarPix(cd){
  try{
    await navigator.clipboard.writeText(cd);
    alert('Pix copiado!');
  }catch{
    alert('Não foi possível copiar automaticamente. Selecione e copie o código Pix.');
  }
}

/* NÃO ALTERADO: o Pix continua sendo gerado pela API existente */
async function buscarPix(valor,desc){
  const r=await fetch('/api/gerar-pix',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      valor:parseFloat(valor).toFixed(2),
      descricao:desc
    })
  });
  if(!r.ok)throw new Error('Erro ao gerar Pix');
  const j=await r.json();
  return j.qr_code||j.copia_cola||j.pixCopiaECola||j.codigo;
}

window.addEventListener('beforeunload',limparCamera);
