<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        realtime:true
    }
);


/* =========================================================
   VARIÁVEIS
========================================================= */

let propostaAtual = null;
let canalTempoReal = null;
let webcamStream = null;
let modoAssinatura = 'texto';


/* =========================================================
   FUNÇÕES DE NÚMERO
========================================================= */

/*
 Converte corretamente valores como:

 150
 "150"
 "150,50"
 "1.500,50"
 "R$ 1.500,50"
 "1500.50"

 evitando o problema de aparecerem números
 quebrados ou parcelas erradas.
*/

function numeroSeguro(valor){

    if(valor === null || valor === undefined || valor === ''){
        return 0;
    }

    if(typeof valor === 'number'){
        return isFinite(valor) ? valor : 0;
    }

    let s = String(valor)
        .trim()
        .replace(/R\$/gi,'')
        .replace(/\s/g,'');

    if(s.includes(',') && s.includes('.')){

        if(s.lastIndexOf(',') > s.lastIndexOf('.')){

            s = s
                .replace(/\./g,'')
                .replace(',','.');

        }else{

            s = s.replace(/,/g,'');

        }

    }else if(s.includes(',')){

        s = s.replace(',','.');

    }

    s = s.replace(/[^0-9.-]/g,'');

    const n = parseFloat(s);

    return isFinite(n) ? n : 0;
}


function dinheiro(valor){

    return numeroSeguro(valor).toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================================
   CPF
========================================================= */

function limparCPF(valor){

    return String(valor || '')
        .replace(/\D/g,'')
        .slice(0,11);

}


/* =========================================================
   DATA
========================================================= */

function dataBR(data){

    if(!data) return '--/--/----';

    const d = new Date(data);

    if(isNaN(d.getTime())){

        const partes = String(data).split('-');

        if(partes.length === 3){
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        return '--/--/----';
    }

    return d.toLocaleDateString('pt-BR');

}


/* =========================================================
   DIAS ÚTEIS
========================================================= */

function adicionarDiasUteis(dataInicial, quantidade){

    let data = new Date(dataInicial);

    let adicionados = 0;

    while(adicionados < quantidade){

        data.setDate(data.getDate() + 1);

        const dia = data.getDay();

        if(dia !== 0 && dia !== 6){
            adicionados++;
        }

    }

    return data;

}


function contarDiasUteis(inicio, fim){

    let data = new Date(inicio);
    const final = new Date(fim);

    data.setHours(0,0,0,0);
    final.setHours(0,0,0,0);

    let contador = 0;

    while(data < final){

        data.setDate(data.getDate()+1);

        const dia = data.getDay();

        if(dia !== 0 && dia !== 6){
            contador++;
        }

    }

    return contador;

}


function calcularEntrega(dataInicio, totalDias){

    totalDias = Math.max(
        0,
        Math.floor(numeroSeguro(totalDias))
    );

    if(totalDias <= 0){

        return {
            total:0,
            passados:0,
            restantes:0,
            porcentagem:0,
            concluido:false,
            dataFinal:null
        };

    }

    const inicio = new Date(dataInicio || new Date());

    const hoje = new Date();

    const passados = Math.min(
        totalDias,
        contarDiasUteis(inicio, hoje)
    );

    const restantes =
        Math.max(0,totalDias-passados);

    const porcentagem =
        Math.min(
            100,
            Math.max(
                0,
                (passados/totalDias)*100
            )
        );

    const dataFinal =
        adicionarDiasUteis(inicio,totalDias);

    return {
        total:totalDias,
        passados,
        restantes,
        porcentagem,
        concluido:restantes <= 0,
        dataFinal
    };

}


/* =========================================================
   CÁLCULO DAS PARCELAS
========================================================= */

function calcularFinanceiro(p){

    const valorProduto =
        numeroSeguro(
            p.valor_desejado ??
            p.valor_produto ??
            p.valor
        );

    const entrada =
        numeroSeguro(
            p.valor_entrada ??
            p.entrada
        );

    const juros =
        numeroSeguro(
            p.juros_mensal ??
            p.taxa_juros ??
            0
        );

    const quantidade =
        Math.max(
            0,
            Math.floor(
                numeroSeguro(
                    p.qtd_parcelas_escolhida ??
                    p.quantidade_parcelas ??
                    p.qtd_parcelas ??
                    0
                )
            )
        );

    /*
       TOTAL FINANCIADO =
       produto - entrada
    */

    const totalFinanciado =
        Math.max(
            0,
            valorProduto - entrada
        );

    let valorParcela = 0;

    if(quantidade > 0){

        if(juros <= 0){

            valorParcela =
                totalFinanciado / quantidade;

        }else{

            const i = juros / 100;

            const fator =
                Math.pow(1+i,quantidade);

            valorParcela =
                totalFinanciado *
                ((i*fator)/(fator-1));

        }

    }

    const totalParcelado =
        valorParcela * quantidade;

    const totalFinal =
        entrada + totalParcelado;

    return {
        valorProduto,
        entrada,
        juros,
        quantidade,
        totalFinanciado,
        valorParcela,
        totalParcelado,
        totalFinal
    };

}


/* =========================================================
   DATAS DAS PARCELAS
========================================================= */

function gerarDatasParcelas(p, quantidade){

    if(
        Array.isArray(p.datas_parcelas) &&
        p.datas_parcelas.length >= quantidade
    ){

        return p.datas_parcelas.slice(0,quantidade);

    }

    const datas = [];

    /*
      A primeira parcela vence 30 dias após
      a confirmação da entrada.
    */

    const base =
        p.data_entrada_paga ||
        p.data_pagamento_entrada ||
        p.updated_at ||
        new Date();

    const inicio = new Date(base);

    for(let i=1;i<=quantidade;i++){

        const d = new Date(inicio);

        d.setMonth(
            d.getMonth()+i
        );

        datas.push(
            d.toISOString().split('T')[0]
        );

    }

    return datas;

}


/* =========================================================
   ETAPAS
========================================================= */

function montarEtapas(p){

    const aprovada =
        String(p.status || '').toLowerCase() === 'aprovada';

    const parcelas =
        !!p.qtd_parcelas_escolhida;

    const contrato =
        !!p.contrato_assinado;

    const entrada =
        !!p.entrada_paga;

    let etapa = 1;

    if(aprovada) etapa = 2;

    if(parcelas) etapa = 3;

    if(contrato) etapa = 4;

    if(entrada) etapa = 5;

    const nomes = [
        'Análise',
        'Parcelas',
        'Contrato',
        'Assinatura',
        'Entrada'
    ];

    document.getElementById('barraEtapas').innerHTML =
        nomes.map((nome,index)=>{

            const numero = index+1;

            let classe = '';

            if(numero < etapa){
                classe='concluida';
            }else if(numero === etapa){
                classe='ativa';
            }

            const simbolo =
                numero < etapa ? '✓' : numero;

            return `
                <div class="etapa ${classe}">
                    <div class="bolinha">${simbolo}</div>
                    <span>${nome}</span>
                </div>
            `;

        }).join('');

}


/* =========================================================
   CONSULTA
========================================================= */

async function executarConsulta(){

    const input =
        document.getElementById('cpfConsulta');

    const cpf =
        limparCPF(input.value);

    if(cpf.length !== 11){

        alert('Digite os 11 números do CPF.');

        return;
    }

    const botao =
        document.getElementById('btnConsultar');

    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';

    try{

        const {data,error} =
            await supabase
            .from('propostas')
            .select('*')
            .eq('cpf',cpf)
            .limit(1);

        if(error) throw error;

        if(!data || data.length === 0){

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );

        }

        propostaAtual = data[0];

        sessionStorage.setItem(
            'ultimo_cpf',
            cpf
        );

        mostrarProposta(propostaAtual);

        if(canalTempoReal){

            await supabase.removeChannel(
                canalTempoReal
            );

        }

        canalTempoReal =
            supabase
            .channel(
                'proposta_' + propostaAtual.id
            )
            .on(
                'postgres_changes',
                {
                    event:'UPDATE',
                    schema:'public',
                    table:'propostas',
                    filter:
                        `id=eq.${propostaAtual.id}`
                },
                payload=>{

                    propostaAtual =
                        payload.new;

                    mostrarProposta(
                        propostaAtual
                    );

                }
            )
            .subscribe();

    }catch(e){

        console.error(e);

        alert(
            e.message ||
            'Erro ao consultar proposta.'
        );

    }finally{

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';

    }

}


/* =========================================================
   VOLTAR
========================================================= */

function voltarInicio(){

    if(webcamStream){

        webcamStream
        .getTracks()
        .forEach(t=>t.stop());

        webcamStream=null;

    }

    if(canalTempoReal){

        supabase.removeChannel(
            canalTempoReal
        );

        canalTempoReal=null;

    }

    propostaAtual=null;

async function confirmarParcelas(){

    const select =
        document.getElementById('qtdEscolhida');

    if(!select){

        alert('Selecione a quantidade de parcelas.');

        return;
    }

    const quantidade =
        parseInt(select.value);

    if(!quantidade){

        alert('Selecione a quantidade de parcelas.');

        return;
    }

    try{

        const {error} =
            await supabase
            .from('propostas')
            .update({
                qtd_parcelas_escolhida:
                    quantidade
            })
            .eq(
                'id',
                propostaAtual.id
            );

        if(error) throw error;

        propostaAtual.qtd_parcelas_escolhida =
            quantidade;

        mostrarProposta(
            propostaAtual
        );

    }catch(e){

        console.error(e);

        alert(
            'Não foi possível salvar a quantidade de parcelas.'
        );

    }

}

========================================================= */

function alternarModo(modo){

    modoAssinatura=modo;

    const texto =
        document.getElementById(
            'assinaturaTexto'
        );

    const selfie =
        document.getElementById(
            'assinaturaSelfie'
        );

    if(!texto || !selfie) return;

    if(modo === 'texto'){

        texto.classList.remove('oculto');
        selfie.classList.add('oculto');

        pararCamera();

    }else{

        texto.classList.add('oculto');
        selfie.classList.remove('oculto');

        iniciarCamera();

    }

}


async function iniciarCamera(){

    try{

        if(webcamStream){
            pararCamera();
        }

        webcamStream =
            await navigator.mediaDevices
            .getUserMedia({
                video:{
                    facingMode:'user'
                }
            });

        const video =
            document.getElementById('vid');

        if(video){

            video.srcObject =
                webcamStream;

        }

    }catch(e){

        alert(
            'Não foi possível acessar a câmera. Você pode assinar digitando seu nome.'
        );

        alternarModo('texto');

    }

}


function pararCamera(){

    if(webcamStream){

        webcamStream
        .getTracks()
        .forEach(track=>track.stop());

        webcamStream=null;

    }

}


function tirarFoto(){

    const video =
        document.getElementById('vid');

    if(
        !video ||
        !video.videoWidth
    ){

        alert('A câmera ainda não está pronta.');

        return;
    }

    const canvas =
        document.createElement('canvas');

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const ctx =
        canvas.getContext('2d');

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const imagem =
        canvas.toDataURL(
            'image/jpeg',
            0.75
        );

    document
    .getElementById('img')
    .src=imagem;

    document
    .getElementById('fotoCapturada')
    .classList.remove('oculto');

    pararCamera();

}


function refazerFoto(){

    document
    .getElementById('fotoCapturada')
    .classList.add('oculto');

    iniciarCamera();

}

            .value
            .trim();

            );

            return;

        assinatura =
            document
            .getElementById('img')
            .src;

        if(
            !assinatura ||
            assinatura === ''

            alert(

    try{

                contrato_assinado:true,

            .eq(

        if(error) throw error;

        propostaAtual.contrato_assinado=true;
        propostaAtual.assinatura=assinatura;

        pararCamera();

        mostrarProposta(
            propostaAtual
        );

    }catch(e){

        console.error(e);

        alert(
            'Erro ao registrar assinatura.'
        );

    }

}


/* =========================================================

function montarPrevisaoParcelas(
    p,
    quantidade,
    valorParcela
){

    const datas =
        gerarDatasParcelas(
            p,
            quantidade
        );

    let html='';

    for(let i=0;i<quantidade;i++){

        html += `
            <div class="parcela">

                <div class="parcela-topo">

                    <div>
                        <span class="parcela-numero">
                            ${i+1}ª parcela
                        </span>

                        <div class="vencimento">
                            Vencimento:
                            <strong>
                                ${dataBR(datas[i])}
                            </strong>
                        </div>

                    </div>

                    <div class="parcela-valor">
                        R$ ${dinheiro(valorParcela)}
                    </div>

                </div>

            </div>
        `;

    }

    return html;

}


/* =========================================================
   PARCELAS APÓS ENTRADA
========================================================= */

function montarParcelas(
    p,
    quantidade,
    valorParcela
){

    const datas =
        gerarDatasParcelas(
            p,
            quantidade
        );

    const pagas =
        Math.max(
            0,
            Math.floor(
                numeroSeguro(
                    p.parcelas_pagas
                )
            )
        );

    let html='';

    for(let i=0;i<quantidade;i++){

        const numero=i+1;

        const paga =
            numero <= pagas;

        const venc =
            new Date(
                datas[i]+'T00:00:00'
            );

        const hoje =
            new Date();

        hoje.setHours(0,0,0,0);

        let classe='amarela';

        if(paga){

            classe='verde';

        }else if(venc < hoje){

            classe='vermelha';

        }

        html += `

            <div class="parcela">

                <div class="parcela-topo">

                    <div>

                        <div class="parcela-numero">

                            <span
                                class="luz ${classe}"
                            ></span>

                            ${numero}ª parcela

                        </div>

                        <div class="vencimento">

                            Vencimento:
                            <strong>
                                ${dataBR(datas[i])}
                            </strong>

                        </div>

                    </div>

                    <div class="parcela-valor">

                        R$ ${dinheiro(valorParcela)}

                    </div>

                </div>

                ${
                    paga
                    ?
                    `
                    <div
                        class="mt-3 text-green-600 font-bold text-sm"
                    >
                        <i class="fas fa-check-circle"></i>
                        PAGO
                    </div>
                    `
                    :
                    `
                    <button
                        onclick="gerarPixParcela(
                            ${valorParcela},
                            ${numero}
                        )"
                        class="botao botao-pix"
                        style="margin-top:12px;width:100%"
                    >
                        <i class="fas fa-qrcode"></i>
                        Pagar parcela
                    </button>

                    <div
                        id="pixParcela${numero}"
                        class="area-pix oculto"
                    ></div>
                    `
                }

            </div>

        `;

    }

    return html;

}


/* =========================================================
   BARRA DE ENTREGA
========================================================= */

function montarBarraEntrega(entrega){

    if(!entrega.total){

        return `
            <div class="entrega">

                <div class="entrega-titulo">
                    PRAZO DE ENTREGA
                </div>

                <div class="entrega-info">
                    Prazo de entrega será informado após
                    a confirmação do pagamento.
                </div>

            </div>
        `;

    }

    if(entrega.concluido){

        return `
            <div class="entrega ok">

                <div class="entrega-titulo">
                    PRAZO DE ENTREGA CONCLUÍDO
                </div>

                <div class="entrega-info">

                    Prazo de
                    <strong>
                        ${entrega.total} dias úteis
                    </strong>
                    concluído.

                    <br>

                    Data prevista:
                    <strong>
                        ${dataBR(entrega.dataFinal)}
                    </strong>

                </div>

                <div class="barra-progresso">

                    <div
                        class="barra-preenchida"
                        style="width:100%"
                    ></div>

                </div>

            </div>
        `;

    }

    return `
        <div class="entrega ok">

            <div class="entrega-titulo">
                ACOMPANHAMENTO DA ENTREGA
            </div>

            <div class="entrega-info">

                <strong>
                    Faltam ${entrega.restantes}
                    dias úteis
                </strong>

                <br>

                de ${entrega.total} dias úteis

                <br>

                <span class="pequeno">

                    ${entrega.passados}
                    dias úteis já transcorridos

                    <br>

                    Previsão:
                    ${dataBR(entrega.dataFinal)}

                </span>

            </div>

            <div class="barra-progresso">

                <div
                    class="barra-preenchida"
                    style="width:${entrega.porcentagem}%"
                ></div>

            </div>

        </div>
    `;

}


/* =========================================================
   PIX ENTRADA
========================================================= */

async function gerarPixEntrada(valor){

    const area =
        document.getElementById(
            'areaPixEntrada'
        );

    if(!area) return;

    area.classList.remove('oculto');

    area.innerHTML = `
        <div class="text-center py-5">
            <i class="fas fa-spinner fa-spin"></i>
            <p class="mt-2">
                Gerando Pix da entrada...
            </p>
        </div>
    `;

    try{

        const codigo =
            await buscarPix(
                valor,
                `Entrada - ${propostaAtual.id}`
            );

        area.innerHTML = `

            <div class="qrcode-area">

                <div id="qrEntrada"></div>

            </div>

            <div class="codigo-pix">
                ${codigo}
            </div>

            <button
                onclick='copiarPix(${JSON.stringify(codigo)})'
                class="botao botao-copiar"
                style="width:100%"
            >
                📋 Copiar Pix
            </button>

        `;

        setTimeout(()=>{

            new QRCode(
                document.getElementById(
                    'qrEntrada'
                ),
                {
                    text:codigo,
                    width:210,
                    height:210
                }
            );

        },100);

    }catch(e){

        console.error(e);

        area.innerHTML = `
            <div class="text-center text-red-500 p-4">
                ${e.message || e}
            </div>
        `;

    }

}
