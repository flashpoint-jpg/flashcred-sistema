<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    { realtime:true }
);


/* =========================================================
   VARIÁVEIS
========================================================= */

let propostaAtual = null;
let inscricaoTempoReal = null;
let webcamStream = null;
let modoAssinatura = 'texto';
let fotoCapturada = '';



/* =========================================================
   UTILITÁRIOS
========================================================= */

function dinheiro(valor){

    let n = Number(valor);

    if(!Number.isFinite(n)){
        n = 0;
    }

    return n.toLocaleString('pt-BR',{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}


function dataBR(data){

    if(!data) return '-';

    const d = new Date(data);

    if(isNaN(d.getTime())) return '-';

    return d.toLocaleDateString('pt-BR');
}


function somenteNumeros(valor){

    return String(valor || '').replace(/\D/g,'');
}


function escapar(texto){

    return String(texto ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}


/* =========================================================
   DIAS ÚTEIS
========================================================= */

function ehDiaUtil(data){

    const dia = data.getDay();

    return dia !== 0 && dia !== 6;
}


/*
   Soma somente dias úteis.
*/

function adicionarDiasUteis(dataInicial, quantidade){

    let data = new Date(dataInicial);

    data.setHours(0,0,0,0);

    let adicionados = 0;

    while(adicionados < quantidade){

        data.setDate(data.getDate() + 1);

        if(ehDiaUtil(data)){
            adicionados++;
        }
    }

    return data;
}


/*
   Conta quantos dias úteis já passaram.
*/

function contarDiasUteis(dataInicial, dataFinal){

    let inicio = new Date(dataInicial);
    let fim = new Date(dataFinal);

    inicio.setHours(0,0,0,0);
    fim.setHours(0,0,0,0);

    if(fim <= inicio){
        return 0;
    }

    let contador = 0;

    while(inicio < fim){

        inicio.setDate(inicio.getDate() + 1);

        if(ehDiaUtil(inicio)){
            contador++;
        }
    }

    return contador;
}


/*
   Calcula a barra de entrega.

   Exemplo:
   dias_entrega = 10

   dia 0 = 0%
   dia 5 = 50%
   dia 10 = 100%
*/

function calcularEntrega(dataInicio,totalDias){

    totalDias = Number(totalDias || 0);

    if(!dataInicio || totalDias <= 0){

        return {
            passados:0,
            restantes:totalDias,
            porcentagem:0,
            concluida:false,
            dataFinal:null
        };
    }

    const inicio = new Date(dataInicio);

    const hoje = new Date();

    inicio.setHours(0,0,0,0);
    hoje.setHours(0,0,0,0);

    const passados =
        Math.min(
            contarDiasUteis(inicio,hoje),
            totalDias
        );

    const restantes =
        Math.max(totalDias - passados,0);

    const porcentagem =
        Math.min(
            100,
            Math.round((passados / totalDias) * 100)
        );

    const dataFinal =
        adicionarDiasUteis(inicio,totalDias);

    return {
        passados,
        restantes,
        porcentagem,
        concluida: passados >= totalDias,
        dataFinal
    };
}



/* =========================================================
   PARCELAS
========================================================= */


/*
   Tenta descobrir as parcelas que vieram do painel.
*/

function obterDadosParcelas(p){

    let dados = null;

    if(p.dados_parcelas){

        if(typeof p.dados_parcelas === 'string'){

            try{
                dados = JSON.parse(p.dados_parcelas);
            }catch(e){}
        }else{

            dados = p.dados_parcelas;
        }
    }

    if(!dados && p.parcelas){

        if(typeof p.parcelas === 'string'){

            try{
                dados = JSON.parse(p.parcelas);
            }catch(e){}
        }else{

            dados = p.parcelas;
        }
    }

    if(Array.isArray(dados)){
        return dados;
    }

    if(dados && Array.isArray(dados.parcelas)){
        return dados.parcelas;
    }

    return [];
}


/*
   Procura valor da parcela dentro dos dados salvos.
*/

function descobrirValorParcela(p,numero){

    const dados = obterDadosParcelas(p);

    if(dados.length){

        const item =
            dados.find((x,index)=>{

                const n =
                    Number(
                        x.numero ??
                        x.parcela ??
                        x.n ??
                        index+1
                    );

                return n === numero;
            });

        if(item){

            const valor =
                item.valor ??
                item.valor_parcela ??
                item.valorParcela ??
                item.amount;

            if(valor !== undefined){
                return Number(valor);
            }
        }
    }

    /*
       Se o painel não tiver salvo o valor,
       usa o valor total final dividido pelo número
       de parcelas.
    */

    const total =
        Number(
            p.valor_total_final ??
            p.valor_total ??
            0
        );

    const quantidade =
        Number(
            p.qtd_parcelas_escolhida ??
            p.quantidade_parcelas ??
            p.qtd_parcelas ??
            0
        );

    if(quantidade > 0 && total > 0){

        const entrada =
            Number(p.valor_entrada || 0);

        return (total - entrada) / quantidade;
    }

    return 0;
}


/*
   Cria datas mensais das parcelas.
*/

function gerarDatasParcelas(p,quantidade){

    /*
       Primeiro tenta usar datas já salvas.
    */

    if(Array.isArray(p.datas_parcelas) &&
       p.datas_parcelas.length >= quantidade){

        return p.datas_parcelas.slice(0,quantidade);
    }


    const dados = obterDadosParcelas(p);

    if(dados.length){

        const datas = dados.map(x =>
            x.data_vencimento ??
            x.vencimento ??
            x.data ??
            null
        );

        if(datas.filter(Boolean).length >= quantidade){

            return datas.slice(0,quantidade);
        }
    }


    /*
       Caso o painel ainda não tenha datas,
       gera mês a mês.
    */

    let inicio =
        p.data_primeira_parcela ??
        p.primeiro_vencimento ??
        p.data_vencimento_primeira ??
        p.data_aprovacao_entrada ??
        p.updated_at ??
        new Date();

    let data = new Date(inicio);

    data.setHours(0,0,0,0);

    const resultado = [];

    for(let i=0;i<quantidade;i++){

        const d = new Date(data);

        d.setMonth(d.getMonth()+1);

        resultado.push(
            d.toISOString().split('T')[0]
        );
    }

    return resultado;
}


/*
   Cria lista completa das parcelas.
*/

function montarParcelas(p,quantidade){

    const datas =
        gerarDatasParcelas(p,quantidade);

    const lista = [];

    for(let i=1;i<=quantidade;i++){

        lista.push({

            numero:i,

            valor:
                descobrirValorParcela(p,i),

            data:
                datas[i-1] || null
        });
    }

    return lista;
}



/* =========================================================
   CONSULTA
========================================================= */

async function executarConsulta(){

    const input =
        document.getElementById('cpfConsulta');

    const cpf =
        somenteNumeros(input.value);

    if(cpf.length !== 11){

        alert('Digite os 11 números do CPF.');

        return;
    }

    const botao =
        document.getElementById('btnConsultar');

    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';

    try{

        const {data,error} =
            await supabase
            .from('propostas')
            .select('*')
            .eq('cpf',cpf)
            .order('created_at',{ascending:false})
            .limit(1);

        if(error){
            throw error;
        }

        if(!data || !data.length){

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );
        }

        propostaAtual = data[0];

        sessionStorage.setItem(
            'ultimo_cpf',
            cpf
        );

        mostrarProposta(propostaAtual);


        if(inscricaoTempoReal){

            supabase.removeChannel(
                inscricaoTempoReal
            );
        }


        inscricaoTempoReal =
            supabase
            .channel(
                'proposta_' +
                propostaAtual.id
            )
            .on(
                'postgres_changes',
                {
                    event:'UPDATE',
                    schema:'public',
                    table:'propostas',
                    filter:
                        `id=eq.${propostaAtual.id}`
                },
                payload => {

                    propostaAtual =
                        payload.new;

                    mostrarProposta(
                        propostaAtual
                    );
                }
            )
            .subscribe();

    }catch(erro){

        console.error(erro);

        alert(
            erro.message ||
            'Erro ao consultar proposta.'
        );

    }finally{

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';
    }
}



/* =========================================================
   VOLTAR
========================================================= */

function voltarInicio(){

    if(webcamStream){

        webcamStream
        .getTracks()
        .forEach(track=>track.stop());

        webcamStream = null;
    }

    if(inscricaoTempoReal){

        supabase.removeChannel(
            inscricaoTempoReal
        );

        inscricaoTempoReal = null;
    }

    propostaAtual = null;

    sessionStorage.removeItem(
        'ultimo_cpf'
    );

    document.getElementById(
        'cpfConsulta'
    ).value = '';

    document.getElementById(
        'telaProposta'
    ).classList.remove('visivel');

    document.getElementById(
        'telaConsulta'
    ).classList.add('visivel');
}



/* =========================================================
   ETAPAS
========================================================= */

function mostrarEtapas(p){

    const aprovada =
        String(p.status || '').toLowerCase()
        === 'aprovada';

    const assinatura =
        p.assinatura_assinada === true ||
        (
            p.contrato_assinado &&
            String(p.contrato_assinado)
            !== 'false'
        );

    const entradaPaga =
        p.valor_entrada_pago === true ||
        p.entrada_paga === true;


    let etapa = 1;

    if(aprovada) etapa = 2;

    if(assinatura) etapa = 3;

    if(entradaPaga) etapa = 4;


    document.getElementById(
        'barraEtapas'
    ).innerHTML = `

        <div class="etapa ${etapa>1?'concluida':'ativa'}">
            <div class="bolinha">
                ${etapa>1?'✓':'1'}
            </div>
            Análise
        </div>

        <div class="etapa ${etapa>2?'concluida':etapa===2?'ativa':''}">
            <div class="bolinha">
                ${etapa>2?'✓':'2'}
            </div>
            Parcelas
        </div>

        <div class="etapa ${etapa>3?'concluida':etapa===3?'ativa':''}">
            <div class="bolinha">
                ${etapa>3?'✓':'3'}
            </div>
            Contrato
        </div>

        <div class="etapa ${etapa>4?'concluida':etapa===4?'ativa':''}">
            <div class="bolinha">
                ${etapa>4?'✓':'4'}
            </div>
            Entrada
        </div>

        <div class="etapa ${etapa===5?'ativa':''}">
            <div class="bolinha">5</div>
            Entrega
        </div>
    `;
}



/* =========================================================
   MOSTRAR PROPOSTA
========================================================= */

function mostrarProposta(p){

    document
    .getElementById('telaConsulta')
    .classList.remove('visivel');

    document
    .getElementById('telaProposta')
    .classList.add('visivel');


    mostrarEtapas(p);


    const aprovado =
        String(p.status || '').toLowerCase()
        === 'aprovada';


    const assinatura =
        p.assinatura_assinada === true ||
        (
            p.contrato_assinado &&
            String(p.contrato_assinado)
            !== 'false'
        );


    const entradaPaga =
        p.valor_entrada_pago === true ||
        p.entrada_paga === true;


    const valorProduto =
        Number(
            p.valor_desejado ??
            p.valor_produto ??
            0
        );


    const entrada =
        Number(

/* =========================================================
   CONFIRMAR PARCELAS
========================================================= */

async function confirmarParcelas(){

    const campo =
        document.getElementById(
            'qtdEscolhida'
        );

    if(!campo) return;

    const quantidade =
        parseInt(
            campo.value,
            10
        );


    if(!quantidade || quantidade < 1){

        alert(
            'Selecione a quantidade de parcelas.'
        );

        return;
    }


    try{

        const {error} =
            await supabase
            .from('propostas')
            .update({
                qtd_parcelas_escolhida:
                    quantidade
            })
            .eq(
                'id',
                propostaAtual.id
            );


        if(error){

            console.error(error);

            alert(
                'Não foi possível salvar a quantidade de parcelas.'
            );

            return;
        }


        propostaAtual.qtd_parcelas_escolhida =
            quantidade;


        mostrarProposta(
            propostaAtual
        );

    }catch(e){

        console.error(e);

        alert(
            'Erro ao salvar as parcelas.'
        );
    }
}



/* =========================================================
   ASSINATURA
========================================================= */

function alternarModo(modo){

    modoAssinatura = modo;

}


async function assinar(){

    const aceite =
        document.getElementById(
            'aceitoContrato'
        );


    if(!aceite || !aceite.checked){

        alert(
            'Você precisa ler e aceitar o contrato.'
        );

        return;
    }


    const nome =
        document.getElementById(
            'assTxt'
        ).value.trim();


    if(!nome){

        alert(
            'Digite seu nome completo para assinar.'
        );

        return;
    }


    if(nome.length < 5){

        alert(
            'Digite seu nome completo.'
        );

        return;
    }


    try{

        const agora =
            new Date().toISOString();


        /*
           Compatível com os campos que você mostrou:
           assinatura_assinada = boolean
           contrato_assinado = texto
        */

        const {error} =
            await supabase
            .from('propostas')
            .update({

                assinatura_assinada:true,

                contrato_assinado:nome,

                selfie_cliente:
                    fotoCapturada || null,

                assinado_em:
                    agora

            })
            .eq(
                'id',
                propostaAtual.id
            );


        if(error){

            console.error(error);

            alert(
                'Erro ao registrar assinatura: ' +
                error.message
            );

            return;
        }


        propostaAtual.assinatura_assinada =
            true;

        propostaAtual.contrato_assinado =
            nome;

        propostaAtual.assinado_em =
            agora;


        if(webcamStream){

            webcamStream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

            webcamStream = null;
        }


        mostrarProposta(
            propostaAtual
        );


    }catch(e){

        console.error(e);

        alert(
            'Não foi possível registrar a assinatura.'
        );
    }
}



/* =========================================================
   PIX ENTRADA
========================================================= */

async function gerarPixEntrada(valor){

    const area =
        document.getElementById(
            'areaPixEntrada'
        );


    if(!area) return;


    area.classList.remove(
        'oculto'
    );


    area.innerHTML = `

        <div class="text-center py-5">

            <i class="fas fa-spinner fa-spin text-2xl"></i>

            <p class="mt-2">
                Gerando Pix...
            </p>

        </div>
    `;


    try{

        const codigo =
            await buscarPix(
                valor,
                `Entrada - Proposta ${propostaAtual.id}`
            );


        if(!codigo){

            throw new Error(
                'A API não retornou o código Pix.'
            );
        }


        area.innerHTML = `

            <div class="qrcode-area">

                <div id="qrentrada"></div>

            </div>


            <div class="codigo-pix">

                ${escapar(codigo)}

            </div>


            <button
                onclick="copiarPix(
                    ${JSON.stringify(codigo)}
                )"
                class="botao botao-copiar"
            >
                <i class="fas fa-copy"></i>
                Copiar código Pix
            </button>

        `;


        setTimeout(()=>{

            new QRCode(
                document.getElementById(
                    'qrentrada'
                ),
                {
                    text:codigo,
                    width:210,
                    height:210
                }
            );

        },100);


    }catch(e){

        console.error(e);

        area.innerHTML = `

            <div class="alerta">

                Não foi possível gerar o Pix.

                <br><br>

                ${escapar(e.message || e)}

            </div>
        `;
    }
}

/* =========================================================
   API PIX
========================================================= */

async function buscarPix(valor,descricao){

    const resposta =
        await fetch(
            '/api/gerar-pix',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                    'application/json'
                },

                body:JSON.stringify({

                    valor:
                        Number(valor)
                        .toFixed(2),

                    descricao:
                        descricao

                })
            }
        );


    if(!resposta.ok){

        throw new Error(
            'Erro ao gerar Pix.'
        );
    }


    const dados =
        await resposta.json();


    return (
        dados.qr_code ||
        dados.copia_cola ||
        dados.pixCopiaECola ||
        dados.codigo
    );
}



/* =========================================================
   COPIAR PIX
========================================================= */

async function copiarPix(codigo){

    try{

        await navigator.clipboard.writeText(
            codigo
        );

        alert(
            'Código Pix copiado!'
        );

    }catch(e){

        alert(
            'Não foi possível copiar automaticamente.'
        );
    }
}
