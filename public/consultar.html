<style>

<div class="app">

<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        realtime: true
    }
);


/* ==========================================================
   VARIÁVEIS
========================================================== */

let propostaAtual = null;
let canalRealtime = null;
let webcamStream = null;
let modoAssinatura = 'texto';


/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

document.addEventListener(
    'DOMContentLoaded',
    iniciar
);


async function iniciar() {

    const cpf =
        localStorage.getItem(
            'flashcred_cpf'
        );

    const id =
        localStorage.getItem(
            'flashcred_proposta_id'
        );

    const campo =
        document.getElementById(
            'cpfConsulta'
        );

    campo.addEventListener(
        'keydown',
        function(e) {

            if(e.key === 'Enter') {
                executarConsulta();
            }

        }
    );


    /*
     * Recupera a proposta depois do F5.
     */

    if(id) {

        await carregarPorId(id);

        return;
    }


    if(cpf) {

        campo.value = cpf;

        await executarConsulta(cpf);
    }
}


/* ==========================================================
   CONSULTA CPF
========================================================== */

async function executarConsulta(cpfInformado = null) {

    let cpf =
        cpfInformado ||
        document
            .getElementById('cpfConsulta')
            .value;

    cpf =
        String(cpf)
        .replace(/\D/g,'');


    if(cpf.length !== 11) {

        alert(
            'Digite os 11 números do CPF.'
        );

        return;
    }


    const botao =
        document.getElementById(
            'btnConsultar'
        );

    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';


    try {

        const { data, error } =
            await supabase
                .from('propostas')
                .select('*')
                .eq('cpf', cpf)
                .limit(1);


        if(error) {
            throw new Error(
                error.message
            );
        }


        if(!data || !data.length) {

            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );
        }


        propostaAtual =
            data[0];


        salvarSessao();


        abrirProposta();


        configurarRealtime();


    } catch(error) {

        console.error(
            'Erro consulta:',
            error
        );

        alert(
            error.message ||
            'Não foi possível consultar a proposta.'
        );

    } finally {

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';
    }
}


/* ==========================================================
   CARREGAR POR ID
========================================================== */

async function carregarPorId(id) {

    try {

        const { data, error } =
            await supabase
                .from('propostas')
                .select('*')
                .eq('id', id)
                .maybeSingle();


        if(error) {
            throw new Error(
                error.message
            );
        }


        if(!data) {

            localStorage.removeItem(
                'flashcred_proposta_id'
            );

            localStorage.removeItem(
                'flashcred_cpf'
            );

            return;
        }


        propostaAtual =
            data;


        salvarSessao();


        abrirProposta();


        configurarRealtime();


    } catch(error) {

        console.error(error);

        localStorage.removeItem(
            'flashcred_proposta_id'
        );

        localStorage.removeItem(
            'flashcred_cpf'
        );

        alert(
            'Não foi possível recuperar a proposta.'
        );
    }
}


/* ==========================================================
   SALVAR SESSÃO
========================================================== */

function salvarSessao() {

    if(!propostaAtual)
        return;


    if(propostaAtual.id) {

        localStorage.setItem(
            'flashcred_proposta_id',
            propostaAtual.id
        );
    }


    if(propostaAtual.cpf) {

        localStorage.setItem(
            'flashcred_cpf',
            propostaAtual.cpf
        );
    }
}


/* ==========================================================
   REALTIME
========================================================== */

function configurarRealtime() {

    if(!propostaAtual)
        return;


    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );
    }


    canalRealtime =
        supabase
        .channel(
            'flashcred_' +
            String(propostaAtual.id)
        )
        .on(
            'postgres_changes',
            {
                event: '*',
                schema: 'public',
                table: 'propostas',
                filter:
                    `id=eq.${propostaAtual.id}`
            },
            function(payload) {

                if(
                    payload.eventType === 'UPDATE' ||
                    payload.eventType === 'INSERT'
                ) {

                    propostaAtual =
                        payload.new;

                    salvarSessao();

                    mostrarProposta(
                        propostaAtual
                    );
                }

            }
        )
        .subscribe();
}


/* ==========================================================
   ABRIR PROPOSTA
========================================================== */

function abrirProposta() {

    document
        .getElementById('telaConsulta')
        .classList.add('hidden');


    document
        .getElementById('telaProposta')
        .classList.remove('hidden');


    mostrarProposta(
        propostaAtual
    );
}


/* ==========================================================
   VOLTAR
========================================================== */

function voltarInicio() {

    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;
    }


    pararCamera();


    propostaAtual = null;


    localStorage.removeItem(
        'flashcred_cpf'
    );

    localStorage.removeItem(
        'flashcred_proposta_id'
    );


    document
        .getElementById('telaProposta')
        .classList.add('hidden');


    document
        .getElementById('telaConsulta')
        .classList.remove('hidden');


    document
        .getElementById('cpfConsulta')
        .value = '';
}


/* ==========================================================
   ETAPA
========================================================== */

function determinarEtapa(p) {

    if(!p)
        return 1;


    const status =
        String(
            p.status || ''
        )
        .trim()
        .toLowerCase();


    const aprovado =
        status === 'aprovada' ||
        status === 'aprovado';


    const parcelas =
        Number(
            p.qtd_parcelas_escolhida || 0
        );


    const assinado =
        p.contrato_assinado === true;


    const entradaPaga =
        p.entrada_paga === true;


    if(!aprovado)
        return 1;


    if(!parcelas)
        return 2;


    if(!assinado)
        return 3;


    if(!entradaPaga)
        return 4;


    return 5;
}


/* ==========================================================
   BARRA ETAPAS
========================================================== */

function montarEtapas(etapa) {

    const etapas = [
        ['Análise','fa-magnifying-glass'],
        ['Parcelas','fa-list-check'],
        ['Contrato','fa-file-signature'],
        ['Pix','fa-qrcode'],
        ['Entrega','fa-truck-fast']
    ];


    document.getElementById(
        'barraEtapas'
    ).innerHTML =
        etapas.map(function(item,index) {

            const numero =
                index + 1;

            let classe = '';

            if(numero < etapa)
                classe = 'done';

            else if(numero === etapa)
                classe = 'active';


            return `
                <div class="step ${classe}">

                    <div class="step-circle">

                        ${
                            numero < etapa
                            ? '<i class="fas fa-check"></i>'
                            : numero
                        }

                    </div>

                    <span>
                        ${item[0]}
                    </span>

                </div>
            `;

        }).join('');
}


/* ==========================================================
   UTILITÁRIOS
========================================================== */

function moeda(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


function escapar(valor) {

    return String(
        valor || ''
    )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


function numero(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        'pt-BR',
        {
            maximumFractionDigits: 2
        }
    );
}


/* ==========================================================
   CÁLCULO PARCELA
========================================================== */

function calcularParcela(
    principal,
    juros,
    quantidade
) {

    principal =
        Number(principal || 0);

    juros =
        Number(juros || 0) / 100;

    quantidade =
        Number(quantidade || 0);


    if(
        principal <= 0 ||
        quantidade <= 0
    ) {
        return 0;
    }


    if(juros <= 0) {

        return principal /
            quantidade;
    }


    return (
        principal *
        (
            juros *
            Math.pow(
                1 + juros,
                quantidade
            )
        )
    ) /
    (
        Math.pow(
            1 + juros,
            quantidade
        ) - 1
    );
}


/* ==========================================================
   DATAS
========================================================== */

function adicionarMeses(
    data,
    meses
) {

    const d =
        new Date(data);


    d.setMonth(
        d.getMonth() + meses
    );


    return d;
}


function dataBR(data) {

    if(!data)
        return '--';


    const d =
        new Date(data);


    if(isNaN(d.getTime()))
        return '--';


    return d.toLocaleDateString(
        'pt-BR'
    );
}


function calcularDiasUteis(
    inicio,
    totalDias
) {

    totalDias =
        Number(totalDias || 0);


    if(
        !inicio ||
        totalDias <= 0
    ) {

        return {
            decorridos: 0,
            restantes: totalDias,
            porcentagem: 0
        };
    }


    const inicioData =
        new Date(inicio);


    const hoje =
        new Date();


    inicioData.setHours(
        0,0,0,0
    );

    hoje.setHours(
        0,0,0,0
    );


    if(hoje <= inicioData) {

        return {
            decorridos: 0,
            restantes: totalDias,
            porcentagem: 0
        };
    }


    let decorridos = 0;

    let atual =
        new Date(inicioData);


    while(atual < hoje) {

        const dia =
            atual.getDay();


        if(
            dia !== 0 &&
            dia !== 6
        ) {
            decorridos++;
        }


        atual.setDate(
            atual.getDate() + 1
        );
    }


    decorridos =
        Math.min(
            decorridos,
            totalDias
        );


    const restantes =
        Math.max(
            totalDias - decorridos,
            0
        );


    const porcentagem =
        Math.min(
            100,
            Math.round(
                (decorridos / totalDias) * 100
            )
        );


    return {
        decorridos,
        restantes,
        porcentagem
    };
}

function mostrarProposta(p) {

    const nome =

        );


    const cpf =
        escapar(
            p.cpf || ''
        );


    const telefone =
        p.telefone ||
        p.celular ||
        p.whatsapp ||
        p.numero_whatsapp ||
        '';

        Number(
            p.valor_desejado || 0

/* ==========================================================
   CONFIRMAR PARCELAS
========================================================== */

async function confirmarParcelas() {

    const select =
        document.getElementById(
            'qtdEscolhida'
        );


    if(!select)
        return;


    const quantidade =
        Number(
            select.value
        );


    if(
        !quantidade ||
        quantidade <= 0
    ) {

        alert(
            'Escolha a quantidade de parcelas.'
        );

        return;
    }


    const botao =
        document.getElementById(
            'btnConfirmarParcelas'
        );


    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Salvando...';


    try {

        const { data, error } =
            await supabase
                .from('propostas')
                .update({
                    qtd_parcelas_escolhida:
                        quantidade
                })
                .eq(
                    'id',
                    propostaAtual.id
                )
                .select()
                .single();


        if(error) {

            throw new Error(
                error.message
            );
        }


        propostaAtual = {
            ...propostaAtual,
            ...data,
            qtd_parcelas_escolhida:
                quantidade
        };


        salvarSessao();


        mostrarProposta(
            propostaAtual
        );


    } catch(error) {

        console.error(error);

        alert(
            'Não foi possível salvar a quantidade de parcelas.\n\n' +
            error.message
        );

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-arrow-right"></i> Continuar para o contrato';
    }
}


/* ==========================================================
   MODO ASSINATURA
========================================================== */

async function alternarModo(modo) {

    modoAssinatura =
        modo;


    const texto =
        document.getElementById(
            'areaTextoAssinatura'
        );

    const selfie =
        document.getElementById(
            'areaSelfie'
        );


    const btnTexto =
        document.getElementById(
            'btnModoTexto'
        );

    const btnSelfie =
        document.getElementById(
            'btnModoSelfie'
        );


    if(modo === 'texto') {

        texto.classList.remove(
            'hidden'
        );

        selfie.classList.add(
            'hidden'
        );

        btnTexto.className =
            'btn btn-primary';

        btnSelfie.className =
            'btn btn-secondary';

        pararCamera();

        return;
    }


    texto.classList.add(
        'hidden'
    );

    selfie.classList.remove(
        'hidden'
    );

    btnTexto.className =
        'btn btn-secondary';

    btnSelfie.className =
        'btn btn-primary';


    await iniciarCamera();
}


/* ==========================================================
   CÂMERA
========================================================== */

async function iniciarCamera() {

    try {

        pararCamera();


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                'Câmera não disponível neste navegador.'
            );
        }


        webcamStream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user'
                },
                audio: false
            });


        const video =
            document.getElementById(
                'videoAssinatura'
            );


        if(video) {

            video.srcObject =
                webcamStream;
        }


    } catch(error) {

        console.error(error);

        alert(
            'Não foi possível acessar a câmera. ' +
            'Você pode usar a assinatura por nome.'
        );


        alternarModo(
            'texto'
        );
    }
}


function pararCamera() {

    if(webcamStream) {

        webcamStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        webcamStream = null;
    }
}


/* ==========================================================
   FOTO
========================================================== */

function tirarFoto() {

    const video =
        document.getElementById(
            'videoAssinatura'
        );


    if(
        !video ||
        !video.videoWidth
    ) {

        alert(
            'A câmera ainda não está pronta.'
        );

        return;
    }


    const canvas =
        document.createElement(
            'canvas'
        );


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    const contexto =
        canvas.getContext(
            '2d'
        );


    contexto.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const imagem =
        document.getElementById(
            'imagemAssinatura'
        );


    imagem.src =
        canvas.toDataURL(
            'image/jpeg',
            .85
        );


    document
        .getElementById(
            'fotoCapturada'
        )
        .classList
        .remove('hidden');


    pararCamera();
}


function refazerFoto() {

    document
        .getElementById(
            'fotoCapturada'
        )
        .classList
        .add('hidden');


    iniciarCamera();
}


/* ==========================================================
   ASSINAR CONTRATO
========================================================== */

async function assinarContrato() {

    try {

        const aceite =
            document.getElementById(
                'aceitoContrato'
            );


        if(
            !aceite ||
            !aceite.checked
        ) {

            alert(
                'Marque a opção de concordância com o contrato.'
            );

            return;
        }


        let assinatura = '';


        if(
            modoAssinatura === 'texto'
        ) {

            const campo =
                document.getElementById(
                    'assTxt'
                );


            assinatura =
                campo
                ? campo.value.trim()
                : '';


            if(!assinatura) {

                alert(
                    'Digite seu nome completo para assinar.'
                );

                return;
            }

        } else {

            const imagem =
                document.getElementById(
                    'imagemAssinatura'
                );


            if(
                !imagem ||
                !imagem.src ||
                imagem.src.length < 100
            ) {

                alert(
                    'Capture sua foto antes de assinar.'
                );

                return;
            }


            assinatura =
                imagem.src;
        }


        if(
            !propostaAtual ||
            !propostaAtual.id
        ) {

            alert(
                'Proposta não encontrada.'
            );

            return;
        }


        const botao =
            document.getElementById(
                'btnAssinar'
            );


        botao.disabled = true;

        botao.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Salvando assinatura...';


        /*
         * IMPORTANTE:
         * contrato_assinado só recebe TRUE
         * depois que o UPDATE for confirmado.
         */

        const { data, error } =
            await supabase
                .from('propostas')
                .update({
                    contrato_assinado: true,
                    assinatura: assinatura,
                    data_assinatura:
                        new Date().toISOString()
                })
                .eq(
                    'id',
                    propostaAtual.id
                )
                .select()
                .single();


        if(error) {

            console.error(
                'Erro Supabase:',
                error
            );

            throw new Error(
                error.message ||
                'Erro ao salvar assinatura.'
            );
        }


        if(!data) {

            throw new Error(
                'O banco não confirmou o salvamento da assinatura.'
            );
        }


        propostaAtual = {
            ...propostaAtual,
            ...data,
            contrato_assinado: true,
            assinatura: assinatura
        };


        salvarSessao();


        pararCamera();


        /*
         * Atualiza a tela imediatamente.
         */

        mostrarProposta(
            propostaAtual
        );


    } catch(error) {

        console.error(
            'Erro assinatura:',
            error
        );


        alert(
            'Não foi possível assinar o contrato.\n\n' +
            'Motivo:\n' +
            (error.message || error)
        );


        const botao =
            document.getElementById(
                'btnAssinar'
            );


        if(botao) {

            botao.disabled = false;

            botao.innerHTML =
                '<i class="fas fa-file-signature"></i> Assinar contrato';
        }
    }
}


/* ==========================================================
   PIX
========================================================== */

async function buscarPix(
    valor,
    descricao
) {

    const resposta =
        await fetch(
            '/api/gerar-pix',
            {
                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify({
                    valor:
                        Number(valor)
                        .toFixed(2),

                    descricao:
                        descricao
                })
            }
        );


    if(!resposta.ok) {

        let mensagem =
            'Erro ao gerar Pix.';


        try {

            const erro =
                await resposta.json();

            mensagem =
                erro.message ||
                erro.error ||
                mensagem;

        } catch(e) {}


        throw new Error(
            mensagem
        );
    }


    const dados =
        await resposta.json();


    const codigo =
        dados.qr_code ||
        dados.copia_cola ||
        dados.pixCopiaECola ||
        dados.codigo ||
        dados.qrCode ||
        dados.payload;


    if(!codigo) {

        throw new Error(
            'A API não retornou o código Pix.'
        );
    }


    return codigo;
}


/* ==========================================================
   PIX ENTRADA
========================================================== */

async function gerarPixEntrada(
    valor
) {

    const area =
        document.getElementById(
            'areaPixEntrada'
        );


    if(!area)
        return;


    area.classList.remove(
        'hidden'
    );


    area.innerHTML = `

        <div class="text-center p-4">

            <i class="fas fa-spinner fa-spin text-2xl"></i>

            <p class="mt-2">
                Gerando Pix...
            </p>

        </div>
    `;


    try {

        const codigo =
            await buscarPix(
                valor,
                `Entrada - Proposta ${propostaAtual.id}`
            );


        area.innerHTML = `

            <div class="pix-box">

                <h3 class="font-bold text-lg">
                    Pix da entrada
                </h3>

                <p class="text-sm text-slate-500 mt-1">
                    Valor:
                    <strong>
                        R$ ${moeda(valor)}
                    </strong>
                </p>

                <div
                    id="qrEntrada"
                    class="qrcode-area"
                ></div>

                <div class="codigo-pix">
                    ${escapar(codigo)}
                </div>

                <button
                    onclick="copiarPix(${JSON.stringify(codigo)})"
                    class="btn-copy mt-3"
                >
                    <i class="fas fa-copy"></i>
                    Copiar Pix
                </button>

            </div>
        `;


        setTimeout(
            function() {

                const qr =
                    document.getElementById(
                        'qrEntrada'
                    );


                if(qr) {

                    new QRCode(
                        qr,
                        {
                            text: codigo,
                            width: 210,
                            height: 210
                        }
                    );
                }

            },
            100
        );


    } catch(error) {

        area.innerHTML = `

            <div class="info info-red">

                <strong>
                    Não foi possível gerar o Pix.
                </strong>

                <p class="text-sm mt-2">
                    ${escapar(
                        error.message ||
                        error
                    )}
                </p>

                <button
                    onclick="gerarPixEntrada(${Number(valor)})"
                    class="btn btn-danger mt-3"
                >
                    Tentar novamente
                </button>

            </div>
        `;
    }
}

/* ==========================================================
   COPIAR PIX
========================================================== */

async function copiarPix(
    codigo
) {

    try {

        await navigator.clipboard.writeText(
            codigo
        );


        alert(
            'Código Pix copiado!'
        );

    } catch(error) {

        alert(
            'Não foi possível copiar automaticamente.'
        );
    }
}


/* ==========================================================
   ENTREGA
========================================================== */

function montarEntrega(p) {

    const dias =
        Number(
            p.dias_entrega || 0
        );


    /*
     * Usa a data de pagamento da entrada
     * quando existir.
     */

    const inicio =
        p.data_pagamento_entrada ||
        p.entrada_pago_em ||
        p.data_entrada_paga ||
        p.data_aprovacao_entrada ||
        p.updated_at;


    const progresso =
        calcularDiasUteis(
            inicio,
            dias
        );


    const percentual =
        progresso.porcentagem;


    return `

        <div class="card">

            <div class="entrega">

                <div class="text-center">

                    <i class="fas fa-truck-fast text-3xl text-alerta"></i>

                    <h3 class="font-bold text-lg mt-2">
                        ACOMPANHAMENTO DA ENTREGA
                    </h3>

                    ${
                        dias > 0
                        ? `
                            <p class="text-sm text-slate-600 mt-2">
                                Prazo previsto:
                                <strong>
                                    ${dias} dias úteis
                                </strong>
                            </p>
                        `
                        : `
                            <p class="text-sm text-slate-600 mt-2">
                                Prazo de entrega ainda não informado.
                            </p>
                        `
                    }

                </div>

                ${
                    dias > 0
                    ? `
                        <div class="barra-progresso">

                            <div
                                class="barra-preenchida"
                                style="width:${percentual}%"
                            ></div>

                        </div>

                        <div class="entrega-info">

                            <span>
                                ${percentual}% concluído
                            </span>

                            <span>
                                ${progresso.restantes}
                                dias úteis restantes
                            </span>

                        </div>
                    `
                    : ''
                }

            </div>

        </div>
    `;
}


/* ==========================================================
   PARCELAS
========================================================== */

function montarParcelas(p) {

    const quantidade =
        Number(
            p.qtd_parcelas_escolhida || 0
        );


    if(quantidade <= 0) {

        return `

            <div class="card">

                <div class="info info-yellow">

                    <strong>
                        Parcelas ainda não configuradas.
                    </strong>

                </div>

            </div>
        `;
    }


    const valor =
        Number(
            p.valor_desejado || 0
        );


    const entrada =
        Number(
            p.valor_entrada || 0
        );


    const juros =
        Number(
            p.juros_mensal || 0
        );


    const principal =
        Math.max(
            valor - entrada,
            0
        );


    const valorParcela =
        calcularParcela(
            principal,
            juros,
            quantidade
        );


    const datasSalvas =
        Array.isArray(
            p.datas_parcelas
        )
        ? p.datas_parcelas
        : [];


    const parcelasPagas =
        Number(
            p.parcelas_pagas || 0
        );


    let datas = [];


    if(datasSalvas.length >= quantidade) {

        datas =
            datasSalvas.slice(
                0,
                quantidade
            );

    } else {

        /*
         * Caso o painel ainda não tenha
         * gravado as datas, cria automaticamente
         * uma parcela por mês.
         */

        const base =
            p.data_pagamento_entrada ||
            p.entrada_pago_em ||
            new Date();


        for(
            let i = 1;
            i <= quantidade;
            i++
        ) {

            datas.push(
                adicionarMeses(
                    base,
                    i
                )
                .toISOString()
                .split('T')[0]
            );
        }
    }


    let html = `

        <div class="card">

            <div class="flex items-center justify-between mb-4">

                <div>

                    <h3 class="text-xl font-bold">
                        Suas parcelas
                    </h3>

                    <p class="text-sm text-slate-500">
                        ${quantidade} parcelas
                    </p>

                </div>

                <i class="fas fa-calendar-days text-2xl text-primary"></i>

            </div>

    `;


    for(
        let i = 0;
        i < quantidade;
        i++
    ) {

        const numeroParcela =
            i + 1;


        const vencimento =
            datas[i];


        const dataVencimento =
            new Date(
                vencimento +
                'T00:00:00'
            );


        const hoje =
            new Date();


        hoje.setHours(
            0,0,0,0
        );


        const paga =
            numeroParcela <=
            parcelasPagas;


        const atrasada =
            !paga &&
            dataVencimento < hoje;


        let statusHTML = '';

        if(paga) {

            statusHTML = `
                <span class="status status-pago">
                    <i class="fas fa-check"></i>
                    PAGO
                </span>
            `;

        } else if(atrasada) {

            statusHTML = `
                <span class="status status-atrasado">
                    <i class="fas fa-triangle-exclamation"></i>
                    ATRASADA
                </span>
            `;

        } else {

            statusHTML = `
                <span class="status status-pendente">
                    <i class="fas fa-clock"></i>
                    PENDENTE
                </span>
            `;
        }


        html += `

            <div class="parcela">

                <div class="parcela-topo">

                    <div>

                        <div class="parcela-numero">
                            ${numeroParcela}ª parcela
                        </div>

                        <div class="text-xs text-slate-500 mt-1">
                            Vencimento:
                            ${dataBR(vencimento)}
                        </div>

                    </div>

                    <div class="text-right">

                        <div class="parcela-valor">
                            R$ ${moeda(valorParcela)}
                        </div>

                        <div class="mt-1">
                            ${statusHTML}
                        </div>

                    </div>

                </div>

                <div class="parcela-detalhes">

                    <div class="parcela-info">

                        <small>
                            Parcela
                        </small>

                        <strong>
                            ${numeroParcela} de ${quantidade}
                        </strong>

                    </div>

                    <div class="parcela-info">

                        <small>
                            Vencimento
                        </small>

                        <strong>
                            ${dataBR(vencimento)}
                        </strong>

                    </div>

                </div>

                ${
                    !paga
                    ? `
                        <button
                            onclick="gerarPixParcela(
                                ${Number(valorParcela.toFixed(2))},
                                ${numeroParcela}
                            )"
                            class="btn btn-pix"
                        >
                            <i class="fas fa-qrcode"></i>
                            Gerar Pix para pagar
                        </button>

                        <div
                            id="pixParcela${numeroParcela}"
                            class="hidden"
                        ></div>
                    `
                    : `
                        <div class="info info-green mb-0">

                            <i class="fas fa-circle-check"></i>

                            Esta parcela já está registrada
                            como paga.

                        </div>
                    `
                }

            </div>
        `;
    }


    html += `

        </div>
    `;


    return html;
}

</script>

</html>
