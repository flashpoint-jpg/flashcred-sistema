<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-fundo min-h-screen">

<div class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-bold text-primary text-center mb-6">🔍 Acompanhar Proposta</h1>

    <!-- CAMPO DE CONSULTA -->
    <div class="bg-white p-5 rounded-xl shadow mb-6">
        <label class="block font-semibold mb-2 text-gray-700">Digite seu CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" 
            class="w-full p-3 border-2 border-gray-200 rounded-lg text-lg focus:border-primary focus:outline-none">
        <button onclick="consultar()" class="w-full mt-4 bg-primary text-white p-3 rounded-lg font-bold text-lg hover:bg-opacity-90">
            🔍 Consultar
        </button>
    </div>

    <!-- RESULTADO -->
    <div id="resultado"></div>
</div>

<script>
// ==============================================
// CONFIGURAÇÕES
// ==============================================
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==============================================
// ✅ CORRIGIDO: LER CPF DA URL CORRETAMENTE
// ==============================================
window.onload = () => {
    // PEGA O CPF DIRETO DA URL
    const parametros = new URLSearchParams(window.location.search);
    let cpfDaUrl = parametros.get('cpf') || '';
    
    // LIMPA O CPF (só números)
    cpfDaUrl = cpfDaUrl.replace(/\D/g, '');
    
    if(cpfDaUrl.length === 11) {
        // FORMATA E PREENCHE O CAMPO
        const cpfFormatado = cpfDaUrl.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        document.getElementById('cpf').value = cpfFormatado;
        // JÁ CONSULTA AUTOMATICAMENTE
        consultar();
    } else if(cpfDaUrl && cpfDaUrl.length !== 11) {
        // MOSTRA ERRO APENAS SE TIVER CPF INVÁLIDO NA URL
        alert('CPF não encontrado na URL. Digite seu CPF acima.');
    }
};

// ==============================================
// CONSULTAR PROPOSTA
// ==============================================
async function consultar() {
    let cpf = document.getElementById('cpf').value.replace(/\D/g, '');
    
    if(cpf.length !== 11) {
        alert('Por favor, digite um CPF válido!');
        return;
    }

    document.getElementById('resultado').innerHTML = '<p class="text-center p-4 text-gray-500">🔄 Buscando proposta...</p>';

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .eq('cpf', cpf)
        .order('created_at', { ascending: false })
        .limit(1);

    if(error) {
        document.getElementById('resultado').innerHTML = '<p class="text-center p-4 text-red-500">❌ Erro ao buscar proposta.</p>';
        return;
    }

    if(!data || data.length === 0) {
        document.getElementById('resultado').innerHTML = '<p class="text-center p-4 text-gray-500">❌ Nenhuma proposta encontrada para este CPF.</p>';
        return;
    }

    exibirProposta(data[0]);
}

// ==============================================
// EXIBIR DADOS DA PROPOSTA
// ==============================================
function exibirProposta(p) {
    const status = p.status || 'Nova';
    const valorTotal = Number(p.valor_desejado || 0);
    const valorEntrada = Number(p.valor_entrada || 0);
    const qtd = Number(p.quantidade_parcelas || 1);
    const juros = Number(p.juros || 0);
    const valParc = Number(p.valor_parcela || 0);

    const statusCor = status === 'Aprovada' ? 'text-green-600 bg-green-100' : 
                      status === 'Reprovada' ? 'text-red-600 bg-red-100' : 
                      'text-yellow-600 bg-yellow-100';

    const dados = p.dados_parcelas || [];
    let listaParcelas = '';
    if(dados.length > 0) {
        listaParcelas = '<div class="mt-4 space-y-2">';
        dados.forEach(parc => {
            const data = parc.vencimento ? parc.vencimento.split('-').reverse().join('/') : '---';
            const valor = Number(parc.valor || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            const paga = parc.paga;
            listaParcelas += `
            <div class="p-3 rounded-lg border ${paga ? 'bg-green-50 border-green-200' : 'bg-gray-50 border-gray-200'}">
                <div class="flex justify-between items-center">
                    <span class="font-semibold">${parc.numero}ª Parcela</span>
                    <span class="font-bold ${paga ? 'text-green-600' : ''}">${valor}</span>
                </div>
                <div class="flex justify-between text-sm text-gray-500 mt-1">
                    <span>Venc: ${data}</span>
                    <span>${paga ? '✅ Paga' : '⏳ A vencer'}</span>
                </div>
            </div>`;
        });
        listaParcelas += '</div>';
    }

    // QR Code Pix
    let qrCodeHtml = '';
    if(p.qr_code_entrada && !p.entrada_paga) {
        qrCodeHtml = `
        <div class="mt-6 bg-pix/10 p-5 rounded-xl text-center">
            <h3 class="font-bold text-lg mb-3">💳 Pagamento da Entrada</h3>
            <p class="text-xl font-bold text-pix mb-3">${valorEntrada.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>
            <div id="qrcode" class="flex justify-center my-4"></div>
            <p class="text-sm text-gray-500 mb-2">Escaneie o QR Code ou copie o código abaixo</p>
            <textarea readonly class="w-full p-2 text-xs border rounded bg-gray-50" rows="4">${p.qr_code_entrada}</textarea>
            <button onclick="navigator.clipboard.writeText('${p.qr_code_entrada}')" class="mt-2 bg-pix text-white px-4 py-2 rounded-lg font-bold">
                📋 Copiar Código Pix
            </button>
        </div>`;
    } else if(p.entrada_paga) {
        qrCodeHtml = `
        <div class="mt-6 bg-green-50 p-5 rounded-xl text-center border border-green-200">
            <h3 class="font-bold text-lg text-sucesso">✅ Entrada Paga!</h3>
            <p class="text-gray-600 mt-2">Pagamento confirmado. Confira abaixo suas parcelas.</p>
        </div>`;
    }

    // CONTRATO E DOCUMENTOS
    let contratoHtml = '';
    if(p.contrato_assinado) {
        contratoHtml = `
        <div class="mt-6 bg-white p-5 rounded-xl border">
            <h3 class="font-bold text-lg mb-3">📄 Contrato</h3>
            <p class="text-green-600 font-semibold">✅ Contrato assinado e aprovado</p>
            <a href="${p.contrato_assinado}" target="_blank" class="inline-block mt-3 bg-primary text-white px-4 py-2 rounded-lg font-bold">
                📄 Ver / Imprimir Contrato
            </a>
        </div>`;
    } else if(status === 'Aprovada') {
        contratoHtml = `
        <div class="mt-6 bg-yellow-50 p-5 rounded-xl border border-yellow-200">
            <h3 class="font-bold text-lg mb-3">✍️ Assinar Contrato</h3>
            <p class="text-gray-600 mb-3">Leia e assine o contrato para liberar o pagamento</p>
            <button onclick="window.location.href='assinatura.html?cpf=${p.cpf}'" class="bg-alerta text-white px-4 py-2 rounded-lg font-bold">
                ✍️ Assinar Contrato
            </button>
        </div>`;
    }

    const resultado = `
    <div class="bg-white p-5 rounded-xl shadow">
        <div class="flex justify-between items-start mb-4">
            <div>
                <h2 class="text-xl font-bold text-primary">${p.nome || 'Proposta'}</h2>
                <p class="text-gray-500 text-sm">CPF: ${(p.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-sm font-bold ${statusCor}">${status}</span>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-4">
            <div class="bg-gray-50 p-3 rounded-lg">
                <p class="text-sm text-gray-500">Valor Total</p>
                <p class="font-bold text-lg">${valorTotal.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg">
                <p class="text-sm text-gray-500">Entrada</p>
                <p class="font-bold text-lg text-pix">${valorEntrada.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg">
                <p class="text-sm text-gray-500">Parcelas</p>
                <p class="font-bold text-lg">${qtd}x</p>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg">
                <p class="text-sm text-gray-500">Juros</p>
                <p class="font-bold text-lg">${juros}% ao mês</p>
            </div>
        </div>

        ${listaParcelas}
        ${qrCodeHtml}
        ${contratoHtml}
    </div>`;

    document.getElementById('resultado').innerHTML = resultado;

    // GERAR QR CODE SE EXISTIR
    if(p.qr_code_entrada && !p.entrada_paga) {
        setTimeout(() => {
            const container = document.getElementById('qrcode');
            if(container) {
                container.innerHTML = '';
                new QRCode(container, { text: p.qr_code_entrada, width: 180, height: 180 });
            }
        }, 100);
    }
}
</script>
</body>
</html>
