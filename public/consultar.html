<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento da Entrada | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        fundo: '#F8FAFC',
                        borda: '#E2E8F0'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; padding: 24px 16px; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(10, 36, 99, 0.08); padding: 32px 24px; border: 1px solid #E2E8F0; text-align: center; }
        .titulo { font-size: 22px; font-weight: 700; color: #0A2463; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .valor-pagar { font-size: 28px; font-weight: 700; color: #0A2463; margin: 12px 0 20px; }
        .subtitulo { color: #475569; margin-bottom: 24px; font-size: 15px; }
        .box-qr { border: 2px dashed #CBD5E1; border-radius: 12px; padding: 20px; margin: 0 auto 24px; max-width: 220px; background: #FAFBFC; }
        #qrcode { width: 100%; height: auto; }
        .label-pix { font-weight: 500; color: #334155; margin-bottom: 12px; font-size: 15px; }
        .btn-copiar { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #F59E0B; color: white; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-copiar:hover { background: #D97706; transform: translateY(-1px); }
        .aviso { font-size: 13px; color: #64748B; margin-top: 20px; line-height: 1.5; }
        .btn-voltar { margin-top: 24px; background: #E2E8F0; color: #374151; padding: 12px; border-radius: 10px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; }
        .hidden { display: none !important; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 2px solid #E2E8F0; border-top-color: #0A2463; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 class="titulo"><i class="fa-solid fa-credit-card"></i> Pagamento da Entrada</h1>
        
        <p class="subtitulo">Valor a pagar:</p>
        <p class="valor-pagar" id="valorEntrada">R$ 0,00</p>

        <p class="subtitulo">Escaneie o QR Code ou copie o código:</p>

        <div class="box-qr">
            <div id="qrcode" class="hidden">
                <i class="fa-solid fa-qrcode fa-3x text-gray-400"></i>
            </div>
            <div id="carregandoQr" class="loading mx-auto"></div>
        </div>

        <p class="label-pix">Pix Copia e Cola:</p>
        <button id="btnCopiar" class="btn-copiar" onclick="copiarCodigoPix()" disabled>
            <i class="fa-solid fa-copy"></i> Carregando...
        </button>
        <p id="codigoPix" class="hidden text-xs text-gray-500 mt-2 break-all px-2"></p>

        <p class="aviso">Assim que o pagamento for confirmado, você receberá o comprovante e os dados de entrega no WhatsApp.</p>

        <button class="btn-voltar" onclick="window.location.href='consultar.html'">
            <i class="fa-solid fa-magnifying-glass"></i> Consultar Outra Proposta
        </button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 📌 CONFIGURAÇÃO DO SEU PIX - ALTERE AQUI SE PRECISAR
const CHAVE_PIX_EMPRESA = 'SUA-CHAVE-PIX-AQUI'; // Troque pela sua chave Pix
const NOME_RECEBEDOR = 'Flash Cred / Distribuidora Flash Point';
const CIDADE_RECEBEDOR = 'SAO PAULO';

let codigoPixGerado = '';

// Função para gerar Pix Copia e Cola padrão
function gerarPixValor(valor, descricao = 'Entrada de Móveis') {
    const valorStr = parseFloat(valor).toFixed(2);
    const chave = CHAVE_PIX_EMPRESA;
    
    // Formatação padrão PIX
    let pix = `00020126580014br.gov.bcb.pix0136${chave}5204000053039865802BR5925${NOME_RECEBEDOR}6009${CIDADE_RECEBEDOR}62070503***6304`;
    
    if(parseFloat(valor) > 0) {
        pix = pix.replace('5303986', `53039865406${valorStr.replace('.','')}`);
    }

    // Cálculo CRC16 simples
    function crc16(str) {
        let crc = 0xFFFF;
        for (let i = 0; i < str.length; i++) {
            crc ^= str.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1;
            }
        }
        return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }
    return pix + crc16(pix);
}

async function carregarDadosPagamento() {
    try {
        // Pega o CPF/ID da proposta da URL
        const params = new URLSearchParams(window.location.search);
        const cpf = params.get('cpf') || '';
        const propostaId = params.get('id') || '';

        if(!cpf && !propostaId) {
            alert('Proposta não encontrada!');
            window.location.href = 'consultar.html';
            return;
        }

        // Busca a proposta aprovada
        let consulta = supabase.from('propostas').select('*').eq('status', 'aprovada');
        if(propostaId) consulta = consulta.eq('id', propostaId);
        else consulta = consulta.eq('cpf', cpf.replace(/\D/g, ''));

        const { data: proposta, error } = await consulta.limit(1).single();
        
        if(error || !proposta) {
            alert('Proposta não aprovada ou não encontrada!');
            window.location.href = 'consultar.html';
            return;
        }

        // Calcula valor da entrada corretamente
        const valorTotal = parseFloat(proposta.valor_solicitado || 0);
        const percEntrada = parseFloat(proposta.percentual_entrada || 40);
        const valorEntrada = (valorTotal * percEntrada / 100).toFixed(2);

        // Atualiza na tela
        document.getElementById('valorEntrada').textContent = `R$ ${valorEntrada.replace('.', ',')}`;

        // Gera código Pix e QR Code
        codigoPixGerado = gerarPixValor(valorEntrada, `Entrada ${proposta.nome}`);
        
        const btnCopiar = document.getElementById('btnCopiar');
        const codigoPixEl = document.getElementById('codigoPix');
        const qrBox = document.getElementById('qrcode');
        const carregando = document.getElementById('carregandoQr');

        codigoPixEl.textContent = codigoPixGerado;
        btnCopiar.disabled = false;
        btnCopiar.innerHTML = '<i class="fa-solid fa-copy"></i> Copiar Código Pix';
        
        // Gera QR Code
        await QRCode.toCanvas(qrBox, codigoPixGerado, { width: 200, margin: 2 });
        carregando.classList.add('hidden');
        qrBox.classList.remove('hidden');

    } catch (erro) {
        console.error('Erro:', erro);
        document.getElementById('carregandoQr').classList.add('hidden');
        alert('Erro ao carregar dados de pagamento, tente novamente.');
    }
}

function copiarCodigoPix() {
    if(!codigoPixGerado) return;
    navigator.clipboard.writeText(codigoPixGerado)
        .then(() => {
            const btn = document.getElementById('btnCopiar');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!';
            setTimeout(() => btn.innerHTML = textoOriginal, 2000);
        })
        .catch(() => alert('Não foi possível copiar, selecione e copie manualmente o código abaixo'));
    document.getElementById('codigoPix').classList.remove('hidden');
}

// Inicia carregamento
carregarDadosPagamento();
</script>
</body>
</html>
