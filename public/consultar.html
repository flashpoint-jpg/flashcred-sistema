<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        andamento: '#3B82F6'
                    }
                }
            }
        };
        const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const CPF = new URLSearchParams(window.location.search).get('cpf');
        const NUMERO_SUPORTE = '5511973294235';

        async function carregarProposta() {
            if(!CPF) return window.location.href = 'consultar.html';
            const {data: proposta, error} = await supabase.from('propostas').select('*').eq('cpf', CPF.replace(/\D/g,'')).single();
            if(error || !proposta) return alert('Proposta não encontrada! Verifique o link ou consulte novamente.');

            const v = Number(proposta.valor_desejado||0);
            const e = Number(proposta.valor_entrada||0);
            const j = Number(proposta.juros_mensal||5);
            const q = Number(proposta.quantidade_parcelas||1);
            const total = v*(1+j/100);
            const parcela = q===1 ? total : (q>0 ? (total-e)/q : 0);
            // ✅ NUNCA MAIS APARECE 0 DIAS
            const diasEntrega = Number(proposta.dias_entrega||8);
            const whatsCliente = proposta.whatsapp ? `(${proposta.whatsapp.substring(0,2)}) ${proposta.whatsapp.substring(2)}` : 'Não informado';

            document.getElementById('conteudo').innerHTML = `
            <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-xl font-bold text-primary mb-4">Olá, ${proposta.nome}!</h2>
                
                <div class="bg-gray-50 p-4 rounded-lg mb-4">
                    <p class="mb-2"><strong>Valor Total:</strong> R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits:2})}</p>
                    <p class="mb-2"><strong>Entrada:</strong> R$ ${e.toLocaleString('pt-BR', {minimumFractionDigits:2})}</p>
                    <p class="mb-2"><strong>Parcelamento:</strong> ${q}x de R$ ${parcela.toLocaleString('pt-BR', {minimumFractionDigits:2})}</p>
                    <p class="mb-2"><strong>Juros:</strong> ${j}% ao mês</p>
                    <p class="mb-2"><strong>Prazo de Entrega:</strong> ${diasEntrega} dias úteis</p>
                </div>

                <p class="text-sm mb-4">
                    Valor total R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits:2})}, entrada R$ ${e.toLocaleString('pt-BR', {minimumFractionDigits:2})}, ${q} parcelas, juros ${j}% a.m., entrega em ${diasEntrega} dias úteis.<br>
                    Ao assinar você concorda com todos os termos do contrato.
                </p>

                <label class="flex items-center gap-2 mb-4 cursor-pointer">
                    <input type="checkbox" id="concordo" class="w-4 h-4">
                    Li e concordo com todos os termos do contrato
                </label>

                <div class="flex gap-3 mb-4">
                    <button class="botao bg-primary text-white flex-1 py-2 rounded-lg" onclick="assinarSelfie()">
                        <i class="fas fa-camera mr-1"></i> Assinar com Selfie
                    </button>
                    <button class="botao bg-gray-200 text-gray-800 flex-1 py-2 rounded-lg" onclick="assinarTexto()">
                        <i class="fas fa-pen mr-1"></i> Assinar por Escrito
                    </button>
                </div>

                <div class="text-center text-sm text-gray-600 mt-4">
                    Dúvidas? <a href="https://wa.me/${NUMERO_SUPORTE}?text=Olá ${proposta.nome}, preciso de ajuda com minha proposta" target="_blank" class="text-primary font-semibold">Fale com o Atendimento</a>
                </div>
            </div>`;
        }

        function assinarSelfie(){ alert('Abrindo câmera para assinatura...'); }
        function assinarTexto(){ alert('Abrindo campo para assinatura...'); }
        window.onload = carregarProposta;
    </script>
    <style>
        .botao:hover { opacity: 0.9; }
    </style>
</head>
<body class="bg-gray-100 py-8">
    <div id="conteudo"></div>
</body>
</html>
