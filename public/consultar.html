<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        .contrato {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.7;
        }
        .contrato h3 {
            text-align: center;
            color: #0A2463;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid #0A2463;
            padding-bottom: 10px;
        }
        .parcelas-tabela {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }
        .parcelas-tabela th {
            background: #0A2463;
            color: white;
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
        }
        .parcelas-tabela td {
            padding: 12px 10px;
            border-top: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .pix-copia {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 14px;
            word-break: break-all;
            font-size: 12px;
            color: #166534;
            cursor: pointer;
        }
        .pix-copia:hover { background: #dcfce7; }
        .pagamento-entrada {
            border: 3px solid #32BCAD;
            border-radius: 16px;
            padding: 24px;
            background: linear-gradient(135deg, #F0FDFA 0%, #CCFBF1 100%);
        }
        .oculto { display: none !important; }
        .qrcode-box {
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 12px;
            margin: 16px 0;
        }
        .aviso {
            background: #FEF3C7;
            border-left: 4px solid #F59E0B;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 15px;
        }
        .sucesso-aviso {
            background: #D1FAE5;
            border-left: 4px solid #10B981;
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 15px;
        }
        .info-aviso {
            background: #EFF6FF;
            border-left: 4px solid #3B82F6;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 14px;
        }
        .botao {
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin: 6px 4px;
            font-size: 15px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .botao-principal { background: #0A2463; color: white; width: 100%; }
        .botao-principal:hover { background: #0c3499; }
        .botao-sucesso { background: #10B981; color: white; flex: 1; }
        .botao-sucesso:hover { background: #059669; }
        .botao-pix { background: #32BCAD; color: white; flex: 1; }
        .botao-pix:hover { background: #0d9488; }
        .botao-whatsapp { background: #25D366; color: white; width: 100%; }
        .botao-whatsapp:hover { background: #1fb85c; }
        .botao-voltar { background: #F1F5F9; color: #475569; }
        .botao-voltar:hover { background: #E2E8F0; }
        .botao-imprimir { background: #8B5CF6; color: white; }
        .botao-imprimir:hover { background: #7C3AED; }
        .botao:disabled { opacity: 0.5; cursor: not-allowed; }
        .copia-nota { font-size: 12px; color: #166534; margin-top: 8px; }
        .resumo-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            border-left: 4px solid #0A2463;
        }
        .resumo-titulo { font-size: 13px; color: #64748B; font-weight: 600; }
        .resumo-valor { font-size: 22px; font-weight: 800; color: #0A2463; margin-top: 4px; }
        .etapa {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 4px 0;
            font-size: 14px;
        }
        .etapa-concluida { background: #ECFDF5; color: #065F46; border-left: 3px solid #10B981; }
        .etapa-pendente { background: #F3F4F6; color: #6B7280; border-left: 3px solid #D1D5DB; }
        .flex { display: flex; }
        .gap-3 { gap: 12px; }
        .my-4 { margin: 16px 0; }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .p-4 { padding: 16px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .justify-center { justify-content: center; }
        .inline-block { display: inline-block; }
        .w-full { width: 100%; }
        .break-all { word-break: break-all; }
        .rounded { border-radius: 6px; }
        .border { border-width: 1px; }
        .bg-slate-100 { background: #F1F5F9; }
        .p-2 { padding: 8px; }
        .block { display: block; }
        .text-xs { font-size: 12px; }
        .text-sm { font-size: 14px; }
        .font-bold { font-weight: 700; }
        @media print {
            body * { visibility: hidden; }
            .contrato, .contrato * { visibility: visible; }
            .contrato { position: absolute; left: 0; top: 0; width: 100%; border: none; }
            .nao-imprimir { display: none !important; }
        }
    </style>
</head>
<body class="bg-fundo text-slate-700 min-h-screen">

<div class="max-w-2xl mx-auto p-4">
    <h1 class="text-[clamp(1.5rem,4vw,1.8rem)] font-bold text-primary mb-6 text-center">🔍 Consultar Proposta</h1>

    <button onclick="voltar()" class="botao botao-voltar nao-imprimir mb-4">
        <i class="fas fa-arrow-left"></i> Voltar
    </button>

    <div id="telaConsulta" class="bg-white rounded-xl shadow p-6 mb-6">
        <label class="block font-semibold text-sm text-slate-500 mb-2">Digite seu CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" 
            class="w-full p-3 border border-slate-200 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
        <button onclick="consultar()" class="botao botao-principal mt-4">
            <i class="fas fa-search"></i> Consultar Proposta
        </button>
    </div>

    <div id="resultado"></div>

    <button onclick="window.open('https://wa.me/5511973294235?text=Olá! Preciso de suporte sobre minha proposta.', '_blank')" 
        class="botao botao-whatsapp nao-imprimir mt-6">
        <i class="fab fa-whatsapp"></i> Falar com Suporte
    </button>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔑 SEU TOKEN DO MERCADO PAGO (Produção)
const TOKEN_MP = 'APP_USR-8158139097874832-072720-d200da044f05a1dd8eb75f90e0551431-18499471';
const CHAVE_PIX_FIXA = '33552949852';
const NOME_RECEBEDOR = 'FLASH POINT';

let proposta = null;
let canalRealtime = null;

function voltar() {
    if (canalRealtime) { supabase.removeChannel(canalRealtime); canalRealtime = null; }
    document.getElementById('resultado').innerHTML = '';
    document.getElementById('telaConsulta').style.display = 'block';
    document.getElementById('cpf').value = '';
}

function formatarCPF(cpf) {
    cpf = String(cpf || '').replace(/\D/g, '');
    return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function calcularCRC16(s) {
    let crc = 0xFFFF;
    for (let i = 0; i < s.length; i++) {
        crc ^= s.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
            crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
        }
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
}

function gerarPixLocal(valor, txId = 'FLC001') {
    const valorStr = Number(valor || 0).toFixed(2);
    const chave = CHAVE_PIX_FIXA;
    const nome = NOME_RECEBEDOR.replace(/[^A-Za-z0-9 ]/g, '').substring(0,25).toUpperCase();
    const cidade = 'SAO PAULO';
    function par(id, conteudo) {
        const s = String(conteudo || '');
        return id + String(s.length).padStart(2,'0') + s;
    }
    const brCod = par('00','BR-GOV.BCB.PIX') + par('01',chave);
    let payload = par('00','01') + par('26',brCod) + par('52','0000') + par('53','986');
    if (valorStr !== '0.00') payload += par('54',valorStr);
    payload += par('59',nome) + par('60',cidade) + par('62', par('05', txId.substring(0,25)));
    payload += '6304' + calcularCRC16(payload + '6304');
    return payload;
}

async function consultar() {
    let cpf = document.getElementById('cpf').value.replace(/\D/g, '');
    if (cpf.length !== 11) { alert('⚠️ Digite um CPF válido com 11 dígitos!'); return; }

    document.getElementById('telaConsulta').style.display = 'none';
    document.getElementById('resultado').innerHTML = '<p class="text-center p-10 text-slate-500 text-lg">🔎 Buscando sua proposta...</p>';

    const { data, error } = await supabase
        .from('propostas').select('*')
        .filter('cpf', 'ilike', '%' + cpf + '%')
        .order('created_at', { ascending: false }).limit(1);

    if (error || !data || data.length === 0) {
        document.getElementById('resultado').innerHTML = `
            <div class="aviso">⚠️ Proposta não encontrada! Verifique o CPF digitado.</div>
            <button onclick="voltar()" class="botao botao-voltar w-full mt-4">Voltar e corrigir</button>`;
        return;
    }

    proposta = data[0];
    mostrarProposta();
    ativarRealtime(proposta.id);
}

function ativarRealtime(propostaId) {
    canalRealtime = supabase.channel('proposta-' + propostaId)
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'propostas', filter:`id=eq.${propostaId}` },
            (p) => { proposta = p.new; mostrarProposta(); })
        .subscribe();
}

function copiarPix(texto) {
    navigator.clipboard.writeText(texto)
        .then(() => alert('✅ Código Pix copiado! Cole no app do banco.'))
        .catch(() => {
            const t = document.createElement('textarea'); t.value = texto;
            document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
            alert('✅ Código Pix copiado!');
        });
}

async function gerarPagamentoMP(tipo) {
    const valorEntrada = Number(proposta.valor_desejado || 0) * (Number(proposta.percentual_entrada) || 20) / 100;
    const cpfLimpo = String(proposta.cpf || '').replace(/\D/g, '');
    const nome = String(proposta.nome || 'Cliente').substring(0, 250);

    document.getElementById('loadingPagamento').classList.remove('hidden');
    document.getElementById('containerPix').classList.add('hidden');
    document.getElementById('containerBoleto').classList.add('hidden');

    try {
        const metodoPagto = tipo === 'pix' ? 'pix' : 'boleto';
        const resposta = await fetch('https://api.mercadopago.com/v1/payments', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${TOKEN_MP}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                transaction_amount: Number(valorEntrada.toFixed(2)),
                description: `Entrada - ${nome.substring(0,40)}`,
                payment_method_id: metodoPagto,
                payer: {
                    email: 'pagamento@flashcred.com.br',
                    identification: { type: 'CPF', number: cpfLimpo },
                    first_name: nome.split(' ')[0],
                    last_name: nome.split(' ').slice(1).join(' ') || '---'
                }
            })
        });

        const dados = await resposta.json();
        document.getElementById('loadingPagamento').classList.add('hidden');

        if (dados.error) throw new Error(dados.message || 'Erro na cobrança');

        if (tipo === 'pix' && dados.point_of_interaction?.transaction_data) {
            const pixCode = dados.point_of_interaction.transaction_data.qr_code;
            document.getElementById('containerPix').classList.remove('hidden');
            document.getElementById('pixCopiaCola').innerText = pixCode;
            document.getElementById('qrcode-mp').innerHTML = '';
            new QRCode(document.getElementById('qrcode-mp'), { text: pixCode, width: 180, height: 180 });
            alert('✅ Pix gerado com sucesso! Escaneie o QR Code ou copie o código.');
        } else if (tipo === 'boleto' && dados.external_resource_url) {
            document.getElementById('containerBoleto').classList.remove('hidden');
            document.getElementById('linkBoleto').href = dados.external_resource_url;
            document.getElementById('codigoBoleto').innerText = dados.barcode || 'Disponível no link acima';
            alert('✅ Boleto gerado! Abra o link para visualizar e pagar.');
        } else {
            throw new Error('Resposta inesperada do Mercado Pago');
        }
    } catch (erro) {
        document.getElementById('loadingPagamento').classList.add('hidden');
        console.error(erro);
        // Fallback: usa Pix local se API falhar
        if (tipo === 'pix') {
            const pixLocal = gerarPixLocal(valorEntrada, proposta.codigo_unico);
            document.getElementById('containerPix').classList.remove('hidden');
            document.getElementById('pixCopiaCola').innerText = pixLocal;
            document.getElementById('qrcode-mp').innerHTML = '';
            new QRCode(document.getElementById('qrcode-mp'), { text: pixLocal, width: 180, height: 180 });
            alert('⚠️ Usando chave Pix fixa. Copie e pague pelo app do banco.');
        } else {
            alert('❌ Não foi possível gerar o boleto. Tente o Pix ou entre em contato.');
        }
    }
}

function imprimirContrato() { window.print(); }

function mostrarProposta() {
    const valorTotal = Number(proposta.valor_desejado || 0);
    const percEnt = Number(proposta.percentual_entrada || 20);
    const valorEntrada = valorTotal * percEnt / 100;
    const quantidadeParc = proposta.quantidade_parcelas || 1;
    const juros = Number(proposta.juros || 0);
    const entradaPaga = proposta.valor_entrada_pago;

    let statusTexto, statusCor;
    if (entradaPaga) { statusTexto = '✅ ENTRADA CONFIRMADA!'; statusCor = 'text-green-600'; }
    else if (proposta.status === 'Aprovada') { statusTexto = '✅ APROVADA — Escolha como pagar'; statusCor = 'text-blue-600'; }
    else if (proposta.status === 'Reprovada') { statusTexto = '❌ Reprovada'; statusCor = 'text-red-600'; }
    else { statusTexto = '⏳ Aguardando Análise'; statusCor = 'text-yellow-600'; }

    let html = `
    <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-bold text-primary mb-2">📋 Proposta de ${proposta.nome}</h2>
        <p class="text-sm text-slate-500 mb-3">Código: ${proposta.codigo_unico || '---'}</p>
        <p class="${statusCor} font-bold text-lg mb-6 p-3 bg-slate-50 rounded-lg">${statusTexto}</p>

        <div class="resumo-card">
            <div class="grid grid-cols-2 gap-4">
                <div><div class="resumo-titulo">💰 Valor Total</div><div class="resumo-valor">${real(valorTotal)}</div></div>
                <div><div class="resumo-titulo">💵 Entrada (${percEnt}%)</div><div class="resumo-valor text-green-600">${real(valorEntrada)}</div></div>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-3">
                <div><div class="resumo-titulo">📊 Parcelas</div><div class="resumo-valor text-blue-600">${quantidadeParc}x</div></div>
                <div><div class="resumo-titulo">📈 Juros</div><div class="resumo-valor text-purple-600">${juros}% ao mês</div></div>
            </div>
        </div>`;

    // ÁREA DE PAGAMENTO
    if (!entradaPaga && proposta.status === 'Aprovada') {
        html += `
        <div class="pagamento-entrada mt-6">
            <h3 class="text-xl font-bold text-pix mb-4 text-center">💳 PAGAMENTO DA ENTRADA — ${real(valorEntrada)}</h3>
            
            <div class="flex gap-3 my-4">
                <button onclick="gerarPagamentoMP('pix')" class="botao botao-pix flex-1">
                    <i class="fas fa-qrcode"></i> Pagar com Pix
                </button>
                <button onclick="gerarPagamentoMP('boleto')" class="botao botao-principal flex-1">
                    <i class="fas fa-file-invoice-dollar"></i> Pagar com Boleto
                </button>
            </div>

            <div id="loadingPagamento" class="hidden text-center p-4 text-slate-500">
                <i class="fas fa-spinner fa-spin"></i> Gerando cobrança...
            </div>

            <div id="containerPix" class="hidden qrcode-box">
                <h4 class="font-bold text-pix mb-2">QR Code Pix</h4>
                <div id="qrcode-mp" class="flex justify-center my-3"></div>
                <div class="pix-copia mt-3" onclick="copiarPix(document.getElementById('pixCopiaCola').innerText)">
                    <strong>Copia e Cola Pix:</strong><br>
                    <span id="pixCopiaCola" style="font-size:11px;"></span>
                    <div class="copia-nota">👆 Clique para copiar</div>
                </div>
            </div>

            <div id="containerBoleto" class="hidden bg-white p-4 rounded-xl shadow border border-slate-200 text-center">
                <h4 class="font-bold text-primary mb-2">Boleto Bancário</h4>
                <p class="text-sm text-slate-600 mb-3">Clique abaixo para visualizar e pagar:</p>
                <a id="linkBoleto" href="#" target="_blank" class="botao botao-principal inline-block mb-3">
                    <i class="fas fa-external-link-alt"></i> Abrir Boleto
                </a>
                <p class="text-xs text-slate-500 mt-2">Linha Digitável:</p>
                <code id="codigoBoleto" class="text-xs bg-slate-100 p-2 block rounded mt-1 break-all"></code>
            </div>
        </div>

        <div class="contrato nao-imprimir mt-6">
            <h3>📄 CONTRATO DE PRESTAÇÃO</h3>
            <p>Pelo presente instrumento, eu <strong>${proposta.nome}</strong>, CPF ${formatarCPF(proposta.cpf || '')}, declaro solicitar crédito junto à <strong>FLASH POINT / FLASHCRED</strong>.</p>
            <p><strong>Valor Total:</strong> ${real(valorTotal)}<br>
            <strong>Entrada:</strong> ${real(valorEntrada)}<br>
            <strong>Parcelas:</strong> ${quantidadeParc}x<br>
            <strong>Juros:</strong> ${juros}% ao mês</p>
            <p>Declaro que os dados informados são verdadeiros e me comprometo a honrar o pagamento conforme combinado. O bem será entregue mediante confirmação do pagamento.</p>
            <p style="margin-top:12px;"><strong>Data:</strong> ${new Date().toLocaleDateString('pt-BR')}</p>
        </div>

        <button onclick="imprimirContrato()" class="botao botao-imprimir w-full mt-4 nao-imprimir">
            <i class="fas fa-print"></i> Imprimir Contrato
        </button>`;
    } else if (entradaPaga) {
        html += `
        <div class="sucesso-aviso mt-6">
            <h3 class="text-xl font-bold text-green-700 mb-2">✅ ENTRADA PAGA — Parcelas Liberadas!</h3>
            <p>Obrigado pelo pagamento! Confira abaixo os detalhes do seu crédito.</p>
        </div>
        <div class="contrato">
            <h3>📄 CONTRATO APROVADO</h3>
            <p><strong>Cliente:</strong> ${proposta.nome}<br>
            <strong>CPF:</strong> ${formatarCPF(proposta.cpf || '')}<br>
            <strong>Valor Total:</strong> ${real(valorTotal)}<br>
            <strong>Entrada Paga:</strong> ${real(valorEntrada)} ✅<br>
            <strong>Restante:</strong> ${real(valorTotal - valorEntrada)}<br>
            <strong>Parcelas:</strong> ${quantidadeParc}x de ${real((valorTotal - valorEntrada) * (1 + juros/100) / quantidadeParc)}<br>
            <strong>Juros:</strong> ${juros}% ao mês</p>
        </div>
        <button onclick="imprimirContrato()" class="botao botao-imprimir w-full mt-4">
            <i class="fas fa-print"></i> Imprimir Contrato
        </button>`;
    } else if (proposta.status === 'Reprovada') {
        html += `<div class="aviso mt-6">❌ Sua proposta foi reprovada. Entre em contato para mais informações.</div>`;
    } else {
        html += `<div class="aviso mt-6">⏳ Sua proposta está em análise. Aguarde a aprovação para gerar o pagamento.</div>`;
    }

    html += `</div>`;
    document.getElementById('resultado').innerHTML = html;
}
</script>
</body>
</html>
