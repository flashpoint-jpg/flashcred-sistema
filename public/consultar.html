<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        texto: '#1E293B',
                        borda: '#E2E8F0'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; padding: 16px; max-width: 700px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 16px; border: 1px solid #E2E8F0; }
        .status-aprovada { background: #D1FAE5; color: #065F46; padding: 8px 16px; border-radius: 20px; font-weight: 700; text-align: center; margin-bottom: 20px; font-size: 18px; }
        .linha-dado { padding: 8px 0; border-bottom: 1px solid #E2E8F0; font-size: 16px; }
        .linha-dado strong { color: #0A2463; }
        .aviso { background: #FFFBEB; border-left: 4px solid #F59E0B; padding: 12px; border-radius: 8px; margin: 16px 0; color: #92400E; }
        .pix-area { text-align: center; padding: 20px; background: #F0FDF4; border-radius: 12px; margin: 16px 0; border: 1px solid #10B981; }
        .qrcode { max-width: 220px; margin: 12px auto; border-radius: 8px; border: 2px solid #0A2463; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; font-size: 16px; margin: 8px 0; transition: all 0.2s; }
        .btn-primario { background: #0A2463; color: white; }
        .btn-primario:hover { background: #071A47; }
        .btn-pix { background: #32BCAD; color: white; }
        .btn-pix:hover { background: #239e91; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .contrato { background: white; border: 1px solid #CBD5E1; border-radius: 12px; padding: 20px; margin: 20px 0; max-height: 400px; overflow-y: auto; font-size: 14px; line-height: 1.6; }
        .contrato h3 { text-align: center; margin-bottom: 16px; color: #0A2463; font-weight: 700; }
        .contrato p { margin-bottom: 10px; text-align: justify; }
        .area-selfie { text-align: center; margin: 20px 0; padding: 16px; background: #F8FAFC; border-radius: 12px; border: 2px dashed #CBD5E1; }
        #camera { width: 100%; max-width: 350px; border-radius: 8px; display: none; margin: 10px auto; }
        #foto-tirada { max-width: 220px; border-radius: 8px; display: none; margin: 10px auto; border: 2px solid #10B981; }
        .input-busca { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 16px; margin-bottom: 12px; }
        .carregando { text-align: center; padding: 30px; color: #64748B; }
        .spinner { width: 40px; height: 40px; border: 4px solid #E2E8F0; border-top-color: #0A2463; border-radius: 50%; animation: girar 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes girar { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<header class="text-center mb-6">
    <h1 class="text-2xl font-bold text-primary">Acompanhar Proposta</h1>
    <p class="text-sm text-gray-500">FlashCred - Limite no Pix Parcelado</p>
</header>

<!-- Área de Busca -->
<div id="areaBusca" class="card">
    <label class="font-semibold text-sm text-gray-600">Digite seu CPF para consultar:</label>
    <input type="text" id="cpfBusca" class="input-busca" placeholder="000.000.000-00" maxlength="14">
    <button class="btn btn-primario" onclick="carregarProposta()">Consultar</button>
</div>

<!-- Conteúdo da Proposta -->
<div id="conteudoProposta" style="display: none;">
    <div id="statusProposta"></div>
    <div id="dadosProposta"></div>
    <div id="areaContrato"></div>
    <div id="areaPagamento"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let proposta = null;
let chavePix = 'flashcred@flashpoint.com.br';
let atualizacaoAuto = null;

// Pegar CPF direto da URL
window.addEventListener('load', () => {
    const parametros = new URLSearchParams(window.location.search);
    const cpfUrl = parametros.get('cpf');
    if (cpfUrl) {
        document.getElementById('cpfBusca').value = formatarCpf(cpfUrl);
        carregarProposta();
    }
});

// Atualizar automaticamente a cada 10 segundos
function iniciarAtualizacao() {
    if (atualizacaoAuto) clearInterval(atualizacaoAuto);
    atualizacaoAuto = setInterval(carregarProposta, 10000);
}

async function carregarProposta() {
    const cpf = document.getElementById('cpfBusca').value.replace(/\D/g, '');
    if (!cpf || cpf.length !== 11) return;

    document.getElementById('areaBusca').style.display = 'none';
    document.getElementById('conteudoProposta').innerHTML = `<div class="carregando"><div class="spinner"></div>Carregando sua proposta...</div>`;
    document.getElementById('conteudoProposta').style.display = 'block';

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .eq('cpf', cpf)
        .order('created_at', { ascending: false })
        .limit(1)
        .single();

    if (error || !data) {
        document.getElementById('conteudoProposta').innerHTML = `<div class="card text-center text-gray-500">Nenhuma proposta encontrada para este CPF.</div>`;
        return;
    }

    proposta = data;
    iniciarAtualizacao();
    renderizarProposta();
}

function renderizarProposta() {
    const valorSolicitado = Number(proposta.valor_desejado || 0);
    const percEntrada = Number(proposta.entrada_perc || 40);
    const juros = Number(proposta.juros_perc || 6);
    const qtdParcelas = Number(proposta.quantidade_parcelas || 1);
    
    const valorEntrada = valorSolicitado * (percEntrada / 100);
    const valorFinanciado = valorSolicitado - valorEntrada;
    const fatorJuros = Math.pow(1 + (juros / 100), qtdParcelas);
    const valorTotal = valorEntrada + (valorFinanciado * fatorJuros);
    const valorParcela = (valorTotal - valorEntrada) / qtdParcelas;

    // Status
    let htmlStatus = '';
    if (proposta.status === 'Aprovada') {
        htmlStatus = `<div class="status-aprovada">✅ PROPOSTA APROVADA!</div>`;
    } else if (proposta.status === 'Pendente') {
        htmlStatus = `<div class="card text-center alerta">⏳ Sua proposta está em análise. Aguardando retorno...</div>`;
    } else {
        htmlStatus = `<div class="card text-center">📋 Proposta recebida. Em breve entraremos em contato.</div>`;
    }

    // Dados
    const htmlDados = `
    <div class="card">
        <div class="linha-dado"><strong>Olá, ${proposta.nome}</strong></div>
        <div class="linha-dado">Valor Solicitado: <strong>R$ ${valorSolicitado.toFixed(2).replace('.', ',')}</strong></div>
        <div class="linha-dado">Valor Total com Juros: <strong>R$ ${valorTotal.toFixed(2).replace('.', ',')}</strong></div>
        <div class="linha-dado">Entrada de ${percEntrada}%: <strong>R$ ${valorEntrada.toFixed(2).replace('.', ',')}</strong></div>
        <div class="linha-dado">Quantidade de Parcelas: <strong>${qtdParcelas}x</strong></div>
        <div class="linha-dado">Valor de cada parcela: <strong>R$ ${valorParcela.toFixed(2).replace('.', ',')}</strong></div>
    </div>`;

    // Contrato e Pagamento se aprovado
    let htmlContrato = '';
    let htmlPagamento = '';
    if (proposta.status === 'Aprovada') {
        htmlContrato = `
        <div class="contrato">
            <h3>CONTRATO DE COMPRA E VENDA COM PAGAMENTO PARCELADO</h3>
            <p><strong>1. PARTES:</strong> Este contrato é firmado entre a Distribuidora Flash Point Móveis, doravante denominada VENDEDORA, e o cliente acima qualificado, doravante denominado COMPRADOR.</p>
            <p><strong>2. OBJETO:</strong> O presente contrato tem por objeto a compra de móveis conforme solicitação do COMPRADOR, no valor total informado acima.</p>
            <p><strong>3. CONDIÇÕES DE PAGAMENTO:</strong> O COMPRADOR se compromete a pagar o valor da entrada no prazo informado e o restante dividido nas parcelas acordadas, com juros de ${juros}% ao mês.</p>
            <p><strong>4. OBRIGAÇÕES:</strong> O não pagamento de qualquer parcela no vencimento implicará multa de 2% e juros de mora de 1% ao mês, além de inscrição nos órgãos de proteção ao crédito e perda do direito aos produtos.</p>
            <p><strong>5. ENTREGA:</strong> Os móveis serão entregues no endereço informado após a confirmação do pagamento da entrada.</p>
            <p><strong>6. ACEITE:</strong> Ao tirar a selfie abaixo, o COMPRADOR declara que leu, entendeu e concorda com todas as cláusulas deste contrato.</p>
        </div>

        <div class="area-selfie">
            <p class="font-semibold mb-3">Para liberar o pagamento, tire uma selfie para confirmar que concorda com o contrato:</p>
            <video id="camera" autoplay playsinline></video>
            <img id="foto-tirada" alt="Foto tirada">
            <div id="botoes-camera">
                <button class="btn btn-primario" id="btnAbrirCamera" onclick="abrirCamera()">📷 Abrir Câmera</button>
                <button class="btn btn-sucesso" id="btnTirarFoto" style="display:none" onclick="tirarFoto()">✅ Tirar Foto e Aceitar</button>
            </div>
        </div>`;

        htmlPagamento = `
        <div id="areaPagamentoConteudo" style="display: none;">
            <div class="aviso">⚠️ Para liberar seu pedido, pague a entrada abaixo:</div>
            <div class="pix-area">
                <p class="font-semibold text-lg mb-2">Valor da Entrada: R$ ${valorEntrada.toFixed(2).replace('.', ',')}</p>
                <p class="text-sm mb-3">Escaneie o QR Code ou copie a chave Pix:</p>
                <div id="qrcode-container" class="qrcode"></div>
                <p class="font-medium mt-3">Chave Pix: <strong>${chavePix}</strong></p>
                <button class="btn btn-pix" onclick="copiarChave()">📋 Copiar Chave Pix</button>
            </div>
        </div>`;
    }

    document.getElementById('conteudoProposta').innerHTML = htmlStatus + htmlDados + htmlContrato + htmlPagamento;
    
    // Gerar QR Code
    if (proposta.status === 'Aprovada') {
        const textoPix = `00020126580014br.gov.bcb.pix0136${chavePix}5204000053039865802BR5925FLASHCRED FLASH POINT6009SAO PAULO62070503***6304`;
        QRCode.toCanvas(document.getElementById('qrcode-container'), textoPix, { width: 200 });
    }
}

// Funções da câmera
let streamCamera = null;
async function abrirCamera() {
    try {
        streamCamera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        const video = document.getElementById('camera');
        video.srcObject = streamCamera;
        video.style.display = 'block';
        document.getElementById('btnAbrirCamera').style.display = 'none';
        document.getElementById('btnTirarFoto').style.display = 'block';
    } catch (erro) {
        alert('Não foi possível acessar a câmera. Permita o acesso para continuar.');
    }
}

async function tirarFoto() {
    const video = document.getElementById('camera');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    const fotoBase64 = canvas.toDataURL('image/jpeg');
    
    // Parar câmera
    if (streamCamera) streamCamera.getTracks().forEach(t => t.stop());
    video.style.display = 'none';
    document.getElementById('btnTirarFoto').style.display = 'none';
    
    // Salvar no banco
    await supabase.from('propostas').update({
        foto_aceite: fotoBase64,
        contrato_assinado: true
    }).eq('id', proposta.id);

    alert('✅ Contrato aceito! Agora já pode efetuar o pagamento da entrada.');
    document.getElementById('areaPagamentoConteudo').style.display = 'block';
}

function copiarChave() {
    navigator.clipboard.writeText(chavePix).then(() => {
        alert('✅ Chave copiada!');
    });
}

function formatarCpf(cpf) {
    if (!cpf) return '';
    return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
}

// Máscara de CPF
document.getElementById('cpfBusca')?.addEventListener('input', e => {
    e.target.value = formatarCpf(e.target.value.replace(/\D/g, ''));
});
</script>
</body>
</html>
