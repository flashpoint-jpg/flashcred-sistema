<body>

<div class="app">

    <!-- CONSULTA -->

    <section id="telaConsulta">

        <div class="header">

            <div class="logo">
                <i class="fas fa-building-columns"></i>
            </div>

            <h1 class="text-2xl font-bold">

            </h1>

            <p class="text-sm opacity-80 mt-1">
                Acompanhe sua proposta
            </p>

        </div>

        <div class="card">

            <h2 class="text-xl font-bold mb-2">
                Consultar proposta
            </h2>

            <p class="text-sm text-slate-500 mb-5">
                Informe seu CPF para acessar sua proposta.
            </p>

            <input
                id="cpfConsulta"
                class="input mb-3"
                maxlength="11"
                inputmode="numeric"
                placeholder="CPF — somente números"
            >

            <button
                id="btnConsultar"
                class="btn btn-primary"
                onclick="executarConsulta()"
            >
                <i class="fas fa-search"></i>
                Consultar proposta
            </button>

        </div>

    </section>


    <!-- PROPOSTA -->

    <section id="telaProposta" class="hidden">

        <div class="header">

            <div class="flex items-center justify-between">

                <div>

                    <div class="text-xs opacity-70">
                        FLASHCRED
                    </div>

                    <h1 class="text-2xl font-bold">
                        Minha Proposta
                    </h1>

                </div>

                <i class="fas fa-file-contract text-3xl opacity-80"></i>

            </div>

        <!-- ETAPAS -->

                 class="stepper">
            </div>

        </div>

            onclick="voltarInicio()"
            class="btn btn-secondary"

            Consultar outro CPF
        </button>

    </section>

</div>


<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
'https://rgcclordmqjmwuzrrfbd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    { realtime:true }
);


/* ==========================================================
   VARIÁVEIS
========================================================== */

let propostaAtual = null;
let canalRealtime = null;
let pixAtual = null;


/* ==========================================================
   INICIALIZAÇÃO
========================================================== */

document.addEventListener(
    'DOMContentLoaded',
    iniciar
);


async function iniciar() {

    const cpfSalvo =
        localStorage.getItem(
            'flashcred_cpf'
        );

    const idSalvo =
        localStorage.getItem(
            'flashcred_proposta_id'
        );

    /*
     * Se já existe uma proposta salva,
     * NÃO volta para a consulta no F5.
     */

    if(cpfSalvo || idSalvo) {

        if(cpfSalvo) {

            document.getElementById(
                'cpfConsulta'
            ).value = cpfSalvo;

            await executarConsulta(
                cpfSalvo
            );

        } else if(idSalvo) {

            await carregarPorId(
                idSalvo
            );
        }
    }


    document
        .getElementById('cpfConsulta')
        .addEventListener(
            'keydown',
            function(e) {

                if(e.key === 'Enter') {
                    executarConsulta();
                }

            }
        );
}


/* ==========================================================
   CONSULTA
========================================================== */

async function executarConsulta(cpfInformado=null) {

    let cpf =
        cpfInformado ||
        document
            .getElementById('cpfConsulta')
            .value;

    cpf =
        cpf
        .replace(/\D/g,'');

    if(cpf.length !== 11) {

        alert(
            'Digite os 11 números do CPF.'
        );

        return;
    }


    const botao =
        document.getElementById(
            'btnConsultar'
        );

    botao.disabled = true;

    botao.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Consultando...';


    try {

        const {data,error} =
            await supabase
                .from('propostas')
                .select('*')
                .eq('cpf',cpf)
                .limit(1);

        if(error)
            throw error;


        if(!data || !data.length)
            throw new Error(
                'Nenhuma proposta encontrada para este CPF.'
            );


        propostaAtual =
            data[0];


        /*
         * PERSISTÊNCIA.
         * O F5 continuará nessa proposta.
         */

        localStorage.setItem(
            'flashcred_cpf',
            cpf
        );

        localStorage.setItem(
            'flashcred_proposta_id',
            propostaAtual.id
        );


        abrirProposta();


        configurarRealtime();


    } catch(error) {

        console.error(error);

        alert(
            error.message ||
            'Erro ao consultar proposta.'
        );

    } finally {

        botao.disabled = false;

        botao.innerHTML =
            '<i class="fas fa-search"></i> Consultar proposta';
    }
}


/* ==========================================================
   CARREGAR PELO ID
========================================================== */

async function carregarPorId(id) {

    try {

        const {data,error} =
            await supabase
                .from('propostas')
                .select('*')
                .eq('id',id)
                .maybeSingle();


        if(error)
            throw error;


        if(!data) {

            localStorage.removeItem(
                'flashcred_proposta_id'
            );

            localStorage.removeItem(
                'flashcred_cpf'
            );

            return;
        }


        propostaAtual = data;

        abrirProposta();

        configurarRealtime();


    } catch(error) {

        console.error(error);

    }
}


/* ==========================================================
   REALTIME
========================================================== */

function configurarRealtime() {

    if(!propostaAtual)
        return;


    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );
    }


    canalRealtime =
        supabase
        .channel(
            'flashcred_proposta_' +
            propostaAtual.id
        )
        .on(
            'postgres_changes',
            {
                event:'UPDATE',
                schema:'public',
                table:'propostas',
                filter:
                    `id=eq.${propostaAtual.id}`
            },
            payload => {

                propostaAtual =
                    payload.new;

                localStorage.setItem(
                    'flashcred_proposta_id',
                    propostaAtual.id
                );

                mostrarProposta(
                    propostaAtual
                );
            }
        )
        .subscribe();
}


/* ==========================================================
   ABRIR PROPOSTA
========================================================== */

function abrirProposta() {

    document
        .getElementById(
            'telaConsulta'
        )
        .classList.add('hidden');


    document
        .getElementById(
            'telaProposta'
        )
        .classList.remove('hidden');


    mostrarProposta(
        propostaAtual
    );
}


/* ==========================================================
   VOLTAR
========================================================== */

function voltarInicio() {

    if(canalRealtime) {

        supabase.removeChannel(
            canalRealtime
        );

        canalRealtime = null;
    }


    propostaAtual = null;


    localStorage.removeItem(
        'flashcred_cpf'
    );

    localStorage.removeItem(
        'flashcred_proposta_id'
    );


    document
        .getElementById(
            'telaProposta'
        )
        .classList.add('hidden');


    document
        .getElementById(
            'telaConsulta'
        )
        .classList.remove('hidden');


    document
        .getElementById(
            'cpfConsulta'
        )
        .value = '';
}


/* ==========================================================
   ETAPA
========================================================== */

function determinarEtapa(p) {

    /*
     * 1 = Análise
     * 2 = Aprovado / Parcelas
     * 3 = Contrato
     * 4 = Pix
     * 5 = Pagamento / Liberação
     */


    if(!p)
        return 1;


    const status =
        String(
            p.status || ''
        ).toLowerCase();


    const aprovado =
        status === 'aprovada' ||
        status === 'aprovado' ||
        status === 'aprovada ';


    const parcelas =
        Number(
            p.qtd_parcelas_escolhida || 0
        );


    const contrato =
        p.contrato_assinado === true;


    const pixPago =
        p.entrada_paga === true;


    if(!aprovado)
        return 1;


    if(aprovado && !parcelas)
        return 2;


    if(parcelas && !contrato)
        return 3;


    if(contrato && !pixPago)
        return 4;


    if(pixPago)
        return 5;


    return 2;
}


/* ==========================================================
   BARRA
========================================================== */

function montarEtapas(etapa) {

    const etapas = [
        ['1','Análise','fa-magnifying-glass'],
        ['2','Parcelas','fa-list-check'],
        ['3','Contrato','fa-file-signature'],
        ['4','Pix','fa-qrcode'],
        ['5','Liberação','fa-check-circle']
    ];


    document.getElementById(
        'barraEtapas'
    ).innerHTML =
        etapas.map((e,i)=>{

            const numero =
                i+1;

            let classe='';

            if(numero < etapa)
                classe='done';

            else if(numero === etapa)
                classe='active';


            return `

                <div class="step ${classe}">

                    <div class="step-circle">

                        ${
                            numero < etapa
                            ? '<i class="fas fa-check"></i>'
                            : numero
                        }

                    </div>

                    <span>
                        ${e[1]}
                    </span>

                </div>

            `;

        }).join('');
}


/* ==========================================================
   MOSTRAR PROPOSTA
========================================================== */

function mostrarProposta(p) {

    const etapa =
        determinarEtapa(p);


    montarEtapas(etapa);


    const nome =
        escapar(
            p.nome ||
            'Cliente'
        );


    const valor =
        Number(
            p.valor_desejado || 0
        );


    const entrada =
        Number(
            p.valor_entrada || 0
        );


    const juros =
        Number(
            p.juros_mensal || 5
        );


    const limiteParcelas =
        Number(
            p.quantidade_parcelas ||
            p.qtd_parcelas ||
            0
        );


    const escolhida =
        Number(
            p.qtd_parcelas_escolhida ||
            0
        );


    const total =
        valor *
        (1 + juros/100);


    let html = `

        <div class="card">

            <div class="flex items-center justify-between mb-4">

                <div>

                    <p class="text-xs text-slate-400">
                        CLIENTE
                    </p>

                    <h2 class="text-xl font-bold">
                        ${nome}
                    </h2>

                </div>

                <span class="badge badge-green">
                    <i class="fas fa-shield-halved"></i>
                    FlashCred
                </span>

            </div>

            <div class="row">
                <span class="label">
                    Valor solicitado
                </span>

                <span class="value">
                    R$ ${moeda(valor)}
                </span>
            </div>

            <div class="row">
                <span class="label">
                    Entrada
                </span>

                <span class="value">
                    R$ ${moeda(entrada)}
                </span>
            </div>

            <div class="row">
                <span class="label">
                    Juros
                </span>

                <span class="value">
                    ${numero(juros)}% a.m.
                </span>
            </div>

            <div class="row">
                <span class="label">
                    Valor total
                </span>

                <span class="value">
                    R$ ${moeda(total)}
                </span>
            </div>

        </div>

    `;


    /*
     * ANÁLISE
     */

    const status =
        String(
            p.status || ''
        ).toLowerCase();


    if(
        status !== 'aprovada' &&
        status !== 'aprovado'
    ) {

        html += `

            <div class="card">

                <div class="info info-yellow text-center">

                    <i class="fas fa-clock text-3xl text-alerta"></i>

                    <h3 class="font-bold text-lg mt-3">
                        Proposta em análise
                    </h3>

                    <p class="text-sm text-slate-500 mt-2">
                        Aguarde a conclusão da análise da sua proposta.
                    </p>

                </div>

            </div>

        `;

        document.getElementById(
            'conteudoProposta'
        ).innerHTML = html;

        return;
    }


    /*
     * APROVADA — ESCOLHA OBRIGATÓRIA
     */

    if(!escolhida) {

        html += telaEscolhaParcelas(
