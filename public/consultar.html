<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Proposta | FlashCred</title>
    <!-- Biblioteca QRCode.js para desenhar o QR Code perfeitamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --bg-body: #F0F4F8;
            --borda: #D1D9E6;
            --texto: #1E293B;
            --sombra: 0 4px 12px rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); line-height: 1.5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .cartao { background: white; border-radius: 12px; padding: 24px; box-shadow: var(--sombra); margin-bottom: 20px; text-align: center; }
        .botao { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
        .botao-sucesso { background: var(--sucesso); color: white; }
        .botao-primario { background: var(--primary); color: white; }
        .campo { width: 100%; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; margin-bottom: 10px; font-size: 14px; background: white; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
        #qrcode img { border: 8px solid white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .copia-cola { background: #F8FAFC; border: 1px dashed var(--borda); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; word-break: break-all; margin: 15px 0; cursor: pointer; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div class="cartao">
        <h2 class="text-xl font-bold mb-4" style="color: var(--primary);">💳 Pagamento Pix | FlashCred</h2>
        <p class="text-sm text-slate-600 mb-4">Escaneie o QR Code abaixo ou clique no código Copia e Cola para pagar:</p>

        <!-- Elemento onde o QR Code será renderizado perfeitamente -->
        <div id="qrcode"></div>

        <div class="label-campo text-left font-semibold text-xs text-slate-500 mb-1">Pix Copia e Cola:</div>
        <div id="pixCopiaCola" class="copia-cola" onclick="copiarPixTexto()" title="Clique para copiar">
            Gerando código Pix...
        </div>

        <button onclick="copiarPixTexto()" class="botao botao-sucesso w-full mt-2">
            <i class="fas fa-copy"></i> Copiar Código Pix
        </button>
    </div>
</div>

<script>
// Função padrão para calcular o CRC16 (Obrigatório para o Pix ser válido no banco)
function calcularCRC16(payload) {
    let polinomio = 0x1021;
    let resultado = 0xFFFF;
    
    for (let i = 0; i < payload.length; i++) {
        let c = payload.charCodeAt(i);
        resultado ^= (c << 8);
        for (let j = 0; j < 8; j++) {
            if ((resultado & 0x8000) !== 0) {
                resultado = ((resultado << 1) ^ polinomio) & 0xFFFF;
            } else {
                resultado = (resultado << 1) & 0xFFFF;
            }
        }
    }
    
    let resultadoHex = resultado.toString(16).toUpperCase();
    while (resultadoHex.length < 4) {
        resultadoHex = '0' + resultadoHex;
    }
    return resultadoHex;
}

// Função para formatar campos EMV do Pix
function formatarCampo(id, valor) {
    let tamanho = valor.length.toString().padStart(2, '0');
    return id + tamanho + valor;
}

// Gerador Oficial do Payload Pix Copia e Cola
function gerarPayloadPix(chavePix, nomeRecebedor, cidadeRecebedor, valorStr, txid = '***') {
    let payload = '';
    
    // 00: Payload Format Indicator
    payload += formatarCampo('00', '01');
    
    // 26: Merchant Account Information (Chave Pix)
    let infoConta = formatarCampo('00', 'br.gov.bcb.pix') + formatarCampo('01', chavePix);
    payload += formatarCampo('26', infoConta);
    
    // 52: Merchant Category Code
    payload += formatarCampo('52', '0000');
    
    // 53: Transaction Currency (986 = BRL)
    payload += formatarCampo('53', '986');
    
    // 54: Transaction Amount (Valor opcional ou fixo, ex: "150.00")
    if (valorStr && Number(valorStr) > 0) {
        payload += formatarCampo('54', Number(valorStr).toFixed(2));
    }
    
    // 58: Country Code
    payload += formatarCampo('58', 'BR');
    
    // 59: Merchant Name
    let nomeLimpo = nomeRecebedor.substring(0, 25).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    payload += formatarCampo('59', nomeLimpo);
    
    // 60: Merchant City
    let cidadeLimpa = cidadeRecebedor.substring(0, 15).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    payload += formatarCampo('60', cidadeLimpa);
    
    // 62: Additional Data Field Template (TXID)
    let addData = formatarCampo('05', txid);
    payload += formatarCampo('62', addData);
    
    // 63: CRC16 (Identificador 63 + tamanho 04 + valor calculado)
    payload += '6304';
    payload += calcularCRC16(payload);
    
    return payload;
}

// Inicializar e gerar o Pix na tela com os dados corretos da FlashCred
window.onload = function() {
    // Insira aqui os dados reais da chave Pix e da proposta
    const chavePix = "suporte@flashcred.com.br"; // Chave Pix cadastrada
    const nomeRecebedor = "FLASHCRED SOLUCOES";
    const cidadeRecebedor = "SAO PAULO";
    const valorProposta = "150.00"; // Exemplo de valor da entrada ou parcela
    const identificador = "FLASHCRED01";

    // Gera o payload válido com CRC16 matemático
    const payloadPix = gerarPayloadPix(chavePix, nomeRecebedor, cidadeRecebedor, valorProposta, identificador);

    // Exibe o texto do Copia e Cola na tela
    document.getElementById('pixCopiaCola').innerText = payloadPix;

    // Renderiza o QR Code visual limpo e sem erros
    document.getElementById('qrcode').innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
        text: payloadPix,
        width: 200,
        height: 200,
        colorDark: "#0A2463",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
    });
};

function copiarPixTexto() {
    const texto = document.getElementById('pixCopiaCola').innerText;
    navigator.clipboard.writeText(texto);
    alert('Código Pix Copia e Cola copiado com sucesso!');
}
</script>
</body>
</html>
