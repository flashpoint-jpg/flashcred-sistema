<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444'
                    }
                }
            }
        };

        const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const CPF = new URLSearchParams(window.location.search).get('cpf');
        let jaCarregou = false; // ✅ EVITA CARREGAR VÁRIAS VEZES

        async function carregarProposta() {
            // ✅ SE JÁ CARREGOU, NÃO FAZ NADA MAIS
            if(jaCarregou) return;
            jaCarregou = true;

            document.getElementById('area').innerHTML = `
            <div class="flex flex-col items-center justify-center min-h-screen p-4">
                <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-gray-600">Carregando sua proposta...</p>
            </div>`;

            if(!CPF) {
                setTimeout(() => window.location.href = 'consultar.html', 1200);
                return;
            }

            try {
                const {data: proposta, error} = await supabase
                    .from('propostas')
                    .select('*')
                    .eq('cpf', CPF.replace(/\D/g,''))
                    .single();

                if(error || !proposta) throw new Error('Proposta não encontrada');

                const v = Number(proposta.valor_desejado||0);
                const e = Number(proposta.valor_entrada||0);
                const j = Number(proposta.juros_mensal||5);
                const q = Number(proposta.quantidade_parcelas||1);
                const total = v*(1+j/100);
                const parc = q>0 ? (total-e)/q : 0;
                const dias = Number(proposta.dias_entrega||8);

                document.getElementById('area').innerHTML = `
                <div class="max-w-md mx-auto bg-white p-5 rounded-xl shadow-lg my-4">
                    <h2 class="text-xl font-bold text-center text-primary mb-4">Olá, ${proposta.nome}!</h2>
                    
                    <div class="bg-blue-50 p-4 rounded-lg mb-4">
                        <p class="mb-2"><strong>Valor Total:</strong> R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits:2})}</p>
                        <p class="mb-2"><strong>Entrada:</strong> R$ ${e.toLocaleString('pt-BR', {minimumFractionDigits:2})}</p>
                        <p class="mb-2"><strong>Parcelamento:</strong> ${q}x de R$ ${parc.toLocaleString('pt-BR', {minimumFractionDigits:2})}</p>
                        <p class="mb-2"><strong>Juros:</strong> ${j}% ao mês</p>
                        <p class="mb-2"><strong>Prazo de Entrega:</strong> ${dias} dias úteis</p>
                    </div>

                    <p class="text-sm mb-4">
                        Valor total R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits:2})}, entrada R$ ${e.toLocaleString('pt-BR', {minimumFractionDigits:2})}, ${q} parcelas, juros ${j}% a.m., entrega em ${dias} dias úteis.<br>
                        Ao assinar você concorda com todos os termos do contrato.
                    </p>

                    <label class="flex items-center gap-2 mb-4 cursor-pointer">
                        <input type="checkbox" id="concordo" class="w-4 h-4">
                        Li e concordo com o contrato
                    </label>

                    <button onclick="assinar()" class="w-full bg-primary text-white py-3 rounded-lg font-bold">Assinar Contrato</button>

                    <div class="text-center mt-4 text-sm">
                        Dúvidas? <a href="https://wa.me/5511973294235" target="_blank" class="text-primary font-semibold">Falar com o Suporte</a>
                    </div>
                </div>`;

            } catch (erro) {
                document.getElementById('area').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                    <i class="fas fa-exclamation-triangle text-alerta text-4xl mb-4"></i>
                    <p class="mb-4">${erro.message}</p>
                    <button onclick="window.location.href='consultar.html'" class="bg-primary text-white px-4 py-2 rounded-lg">Voltar e Consultar</button>
                </div>`;
            }
        }

        function assinar() {
            if(!document.getElementById('concordo').checked) return alert('Você precisa concordar com os termos!');
            alert('Contrato assinado com sucesso! Agora você pode gerar o Pix da entrada.');
        }

        // ✅ CARREGA UMA VEZ SÓ AO ABRIR A PÁGINA — SEM LOOP, SEM PISCAR
        window.onload = carregarProposta;

        // ✅ REMOVI O REALTIME QUE ESTAVA CAUSANDO O LOOP INFINITO
    </script>
</head>
<body class="bg-gray-100">
    <div id="area"></div>
</body>
</html>
