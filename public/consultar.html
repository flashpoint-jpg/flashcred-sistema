<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        fundo: '#F8FAFC',
                        erro: '#EF4444',
                        sucesso: '#10B981',
                        alerta: '#F59E0B'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; padding: 16px; min-height: 100vh; }
        .cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; max-width: 480px; margin-left: auto; margin-right: auto; }
        .titulo-topo { font-size: 24px; font-weight: 800; color: #0A2463; }
        .btn-topo { padding: 8px 12px; border-radius: 10px; border: none; font-weight: 500; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-nova { background: white; color: #0A2463; border: 1px solid #0A2463; }
        .btn-admin { background: #0A2463; color: white; }

        .card { max-width: 480px; margin: 0 auto; background: white; border-radius: 20px; padding: 28px; box-shadow: 0 4px 20px rgba(10,36,99,0.08); }
        .titulo-card { text-align: center; font-size: 22px; font-weight: 700; color: #0A2463; margin-bottom: 8px; }
        .subtitulo { text-align: center; font-size: 14px; color: #64748B; margin-bottom: 24px; }
        .input { width: 100%; padding: 14px 16px; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 16px; margin-bottom: 16px; outline: none; }
        .input:focus { border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10,36,99,0.1); }
        .btn-verificar { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #0A2463; color: white; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-verificar:hover { background: #081C49; }
        .btn-verificar:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Status visuais */
        .status-analise { display: none; align-items: center; justify-content: center; gap: 12px; padding: 20px; background: #FFFBEB; border: 1px solid #FCD34D; border-radius: 14px; margin-top: 20px; }
        .spinner { width: 24px; height: 24px; border: 3px solid #FDE68A; border-top-color: #F59E0B; border-radius: 50%; animation: girar 0.8s linear infinite; }
        @keyframes girar { to { transform: rotate(360deg); } }

        .mensagem-erro { display: none; background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626; padding: 16px; border-radius: 14px; margin-top: 16px; text-align: center; font-size: 14px; }
        .resultado { display: none; margin-top: 20px; padding: 16px; border-radius: 14px; text-align: center; }
        .resultado.aprovado { background: #ECFDF5; border: 1px solid #A7F3D0; color: #065F46; }
        .resultado.recusado { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; }
    </style>
</head>
<body>

<div class="cabecalho">
    <h1 class="titulo-topo">FlashCred</h1>
    <div style="display: flex; gap: 10px;">
        <a href="/" class="btn-topo btn-nova">Nova Solicitação</a>
        <a href="/painel" class="btn-topo btn-admin">Painel Admin</a>
    </div>
</div>

<div class="card">
    <h2 class="titulo-card">Consultar Minha Proposta</h2>
    <p class="subtitulo">Digite seu CPF — pode usar ponto, traço ou só números</p>

    <input type="text" id="cpfConsulta" class="input" placeholder="000.000.000-00" maxlength="18">
    <button id="btnVerificar" onclick="buscarProposta()" class="btn-verificar">🔍 Ver Proposta</button>

    <div id="statusAnalise" class="status-analise">
        <div class="spinner"></div>
        <div>
            <strong>🔎 Em análise</strong>
            <p style="font-size:13px; color:#92400E; margin-top:4px;">Aguarde, geralmente respondemos em até 24h.</p>
        </div>
    </div>

    <div id="mensagemErro" class="mensagem-erro">
        <strong>❌ Proposta não encontrada!</strong><br>
        Confira o número ou aguarde o cadastro da solicitação.
    </div>

    <div id="resultado" class="resultado"></div>
</div>

<script>
// Pega CPF direto da URL se vier do formulário
window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    const cpfUrl = params.get('cpf');
    if(cpfUrl) {
        const cpfFormatado = cpfUrl.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        document.getElementById('cpfConsulta').value = cpfFormatado;
        buscarProposta();
    }
});

async function buscarProposta() {
    const cpfDigitado = document.getElementById('cpfConsulta').value;
    const cpfLimpo = cpfDigitado.replace(/\D/g, ''); // Tira tudo que não é número
    const btn = document.getElementById('btnVerificar');
    const statusAnalise = document.getElementById('statusAnalise');
    const mensagemErro = document.getElementById('mensagemErro');
    const resultado = document.getElementById('resultado');

    // Reseta visualizações anteriores
    statusAnalise.style.display = 'none';
    mensagemErro.style.display = 'none';
    resultado.style.display = 'none';

    if(cpfLimpo.length !== 11) {
        mensagemErro.innerHTML = '<strong>⚠️ CPF inválido!</strong><br>Verifique os números digitados.';
        mensagemErro.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Buscando no servidor...';

    try {
        // BUSCA DIRETAMENTE DA API DO SERVIDOR (render.com)
        const response = await fetch('/api/propostas');
        const resultadoApi = await response.json();

        if (!resultadoApi.success) {
            throw new Error('Erro ao carregar dados do servidor');
        }

        const propostas = resultadoApi.data || [];
        
        // Procura a proposta correspondente ignorando formatação do CPF
        const propostaEncontrada = propostas.find(item => {
            const cpfSalvoLimpo = String(item.cpf || '').replace(/\D/g, '');
            return cpfSalvoLimpo === cpfLimpo;
        });

        btn.disabled = false;
        btn.textContent = '🔍 Ver Proposta';

        if(!propostaEncontrada) {
            mensagemErro.style.display = 'block';
            return;
        }

        // MOSTRA O STATUS CORRETO VINDO DO SERVIDOR
        const statusAtual = propostaEncontrada.status || 'Em Análise';
        
        if(statusAtual === 'Nova' || statusAtual === 'Em Análise') {
            statusAnalise.style.display = 'flex';
        } else if(statusAtual === 'Aprovada') {
            resultado.className = 'resultado aprovado';
            resultado.innerHTML = `
                <h3>✅ PROPOSTA APROVADA!</h3>
                <p style="margin: 10px 0;">Valor solicitado: <strong>R$ ${parseFloat(propostaEncontrada.valor_desejado || 0).toFixed(2)}</strong></p>
                <p>Em breve entraremos em contato com as condições de pagamento.</p>
            `;
            resultado.style.display = 'block';
        } else if(statusAtual === 'Recusada') {
            resultado.className = 'resultado recusado';
            resultado.innerHTML = `
                <h3>❌ PROPOSTA RECUSADA</h3>
                <p style="margin: 10px 0;">Entre em contato para entender o motivo ou fazer uma nova solicitação.</p>
            `;
            resultado.style.display = 'block';
        }

    } catch (error) {
        console.error("Erro na busca:", error);
        btn.disabled = false;
        btn.textContent = '🔍 Ver Proposta';
        mensagemErro.innerHTML = '<strong>⚠️ Erro de conexão!</strong><br>Não foi possível conectar ao servidor.';
        mensagemErro.style.display = 'block';
    }
}
</script>
</body>
</html>
