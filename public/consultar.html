<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #F8FAFC; color: #1E293B; padding: 16px; max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; margin: 8px 0; font-size: 16px; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-success { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-cinza { background: #CBD5E1; color: #334155; }
        .loading { text-align: center; padding: 20px; color: #64748B; }
        .spinner { animation: gira 1s linear infinite; }
        @keyframes gira { 100% { transform: rotate(360deg); } }

        /* ✅ BARRA DE PROGRESSO COMPLETA */
        .progresso { display: flex; justify-content: space-between; margin-bottom: 20px; position: relative; }
        .progresso::before { content: ''; position: absolute; top: 12px; left: 10%; right: 10%; height: 3px; background: #E2E8F0; z-index: 0; }
        .passo { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; font-size: 12px; font-weight: 500; color: #94A3B8; }
        .passo.ativo { color: #0A2463; font-weight: 700; }
        .passo.concluido { color: #10B981; }
        .bolinha { width: 24px; height: 24px; border-radius: 50%; background: #E2E8F0; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; font-size: 12px; font-weight: bold; }
        .passo.ativo .bolinha { background: #0A2463; color: white; }
        .passo.concluido .bolinha { background: #10B981; color: white; }

        /* ✅ AVISO DE ENTREGA SÓ APARECE DEPOIS DA APROVAÇÃO */
        .aviso-entrega {
            background: #FFFBEB;
            border: 3px solid #F59E0B;
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #92400E;
        }
    </style>
</head>
<body>

<div id="areaConsulta" class="card">
    <h2 class="text-xl font-bold text-center mb-4 text-primary">🔍 Acompanhar Proposta</h2>
    <input type="text" id="cpfConsulta" placeholder="Digite seu CPF (apenas números)" maxlength="11" class="w-full p-3 border border-gray-300 rounded-lg mb-4 text-center text-lg">
    <button onclick="buscarProposta()" class="btn btn-primary">Consultar</button>
</div>

<div id="conteudoProposta" class="hidden"></div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

let inscricao = null;

window.onload = () => {
    const cpfUrl = new URLSearchParams(window.location.search).get('cpf');
    if(cpfUrl) {
        document.getElementById('cpfConsulta').value = cpfUrl.replace(/\D/g,'');
        buscarProposta();
    }
};

async function buscarProposta() {
    const cpf = document.getElementById('cpfConsulta').value.replace(/\D/g,'');
    if(cpf.length!==11) { alert('Digite um CPF válido!'); return; }

    document.getElementById('areaConsulta').classList.add('hidden');
    document.getElementById('conteudoProposta').innerHTML = `<div class="loading"><i class="fas fa-spinner fa-spin text-2xl"></i><br>Carregando sua proposta...</div>`;
    document.getElementById('conteudoProposta').classList.remove('hidden');

    const {data, error} = await supabase.from('propostas').select('*').eq('cpf',cpf).single();
    if(error || !data) {
        document.getElementById('conteudoProposta').innerHTML = `<div class="card text-center"><i class="fas fa-exclamation-circle text-red-500 text-3xl"></i><br>Proposta não encontrada ou ainda não enviada.</div>`;
        return;
    }

    montarTela(data);
    ativarTempoReal(cpf);
}

function montarTela(p) {
    const v=Number(p.valor_desejado||0), e=Number(p.valor_entrada||0), j=Number(p.juros_mensal||5), q=Number(p.quantidade_parcelas||1);
    const total=v*(1+j/100);
    const parcela = q===1 ? total : ((total-e)*(Math.pow(1+j/100,q)*(j/100)))/(Math.pow(1+j/100,q)-1);
    const dias = p.dias_entrega || 7;

    // ✅ Define qual passo está ativo
    let passoAtual = 1;
    if(p.status === 'Aprovada') passoAtual = 2;
    if(p.status === 'Aprovada' && !p.entrada_paga) passoAtual = 3;
    if(p.entrada_paga) passoAtual = 4;

    let html = `
    <div class="card">
        <h2 class="text-xl font-bold text-primary mb-2">Olá, ${p.nome || 'Cliente'}!</h2>
        <p class="mb-3">Sua proposta está: <strong class="${p.status==='Aprovada'?'text-green-600':'text-orange-500'}">${p.status}</strong></p>

        <!-- ✅ BARRA DE PROGRESSO COMPLETA -->
        <div class="progresso">
            <div class="passo ${passoAtual>=1?'concluido':'ativo'}">
                <div class="bolinha">${passoAtual>1?'✓':'1'}</div>
                <span>Proposta</span>
            </div>
            <div class="passo ${passoAtual>=2?(passoAtual>2?'concluido':'ativo'):''}">
                <div class="bolinha">${passoAtual>2?'✓':'2'}</div>
                <span>Aprovada</span>
            </div>
            <div class="passo ${passoAtual>=3?(passoAtual>3?'concluido':'ativo'):''}">
                <div class="bolinha">${passoAtual>3?'✓':'3'}</div>
                <span>Contrato</span>
            </div>
            <div class="passo ${passoAtual>=4?'ativo':''}">
                <div class="bolinha">4</div>
                <span>Pagamento</span>
            </div>
        </div>

        <!-- ✅ AVISO DE ENTREGA SÓ APARECE SE FOR APROVADA -->
        ${p.status === 'Aprovada' ? `
        <div class="aviso-entrega">
            <i class="fas fa-truck"></i> 🚚 AVISO IMPORTANTE:<br>
            A ENTREGA SERÁ FEITA EM ATÉ <span class="text-2xl">${dias}</span> DIAS ÚTEIS APÓS CONFIRMAÇÃO DO PAGAMENTO!
        </div>` : ''}

        <div class="bg-gray-50 p-3 rounded-lg mb-3">
            <p><strong>Valor do pedido:</strong> R$ ${v.toLocaleString('pt-BR',2)}</p>
            <p><strong>Entrada:</strong> R$ ${e.toLocaleString('pt-BR',2)}</p>
            <p><strong>${q}x de:</strong> R$ ${parcela.toLocaleString('pt-BR',2)}</p>
            <p><strong>Total com juros:</strong> R$ ${total.toLocaleString('pt-BR',2)}</p>
        </div>
    `;

    // ✅ Se ainda não aprovada: só mostra aguardando
    if(p.status === 'Nova' || p.status === 'Em Análise') {
        html += `
        <div class="text-center p-4 bg-yellow-50 rounded-lg">
            <i class="fas fa-clock text-yellow-500 text-2xl mb-2"></i>
            <p class="font-semibold">Aguardando análise da proposta...</p>
            <p class="text-sm text-gray-600">Assim que aprovado você receberá a atualização aqui.</p>
        </div>`;
    }

    // ✅ Se aprovada e não pagou entrada: mostra escolha de parcelas e contrato
    if(p.status === 'Aprovada' && !p.entrada_paga) {
        html += `
        <div class="card">
            <h3 class="font-bold text-lg mb-2">Escolha a quantidade de parcelas:</h3>
            <p class="text-sm text-gray-600 mb-3">Você pode escolher de 1 até ${q} parcelas</p>
            <select id="escolherParcela" class="w-full p-3 border rounded-lg mb-3">
                ${Array.from({length:q}, (_,i)=>`<option value="${i+1}">${i+1}x de R$ ${ ((total-e)*(Math.pow(1+j/100,i+1)*(j/100))/(Math.pow(1+j/100,i+1)-1)).toLocaleString('pt-BR',2) }</option>`).join('')}
            </select>
            <button onclick="liberarContrato()" class="btn btn-success">✅ Aceitar e Assinar Contrato</button>
        </div>`;
    }

    // ✅ Se já pagou entrada: mostra sucesso e parcelas
    if(p.entrada_paga) {
        html += `
        <div class="card text-center">
            <div class="text-green-600 text-xl font-bold mb-3"><i class="fas fa-check-circle"></i> ENTRADA PAGA COM SUCESSO!</div>
            <p class="mb-2">Em breve você receberá acesso às suas parcelas e ao contrato completo.</p>
            <p class="text-sm text-gray-600">Nós já fomos notificados e vamos conferir o pagamento.</p>
        </div>`;
    }

    html += `
        <div class="mt-4">
            <a href="https://wa.me/5511973294235?text=Olá, preciso de suporte sobre minha proposta CPF: ${p.cpf}" target="_blank" class="btn" style="background:#25D366;color:white;">
                <i class="fab fa-whatsapp"></i> Falar com Suporte
            </a>
            <button onclick="window.location.reload()" class="btn btn-alerta">🔄 Atualizar</button>
        </div>
    </div>`;

    document.getElementById('conteudoProposta').innerHTML = html;
}

function liberarContrato() {
    alert('Agora você será direcionado para assinar o contrato e gerar o Pix da entrada!');
}

function ativarTempoReal(cpf) {
    if(inscricao) supabase.removeChannel(inscricao);
    inscricao = supabase.channel('cliente_' + cpf)
        .on('postgres_changes', {event:'UPDATE',schema:'public',table:'propostas',filter:`cpf=eq.${cpf}`}, (m)=>montarTela(m.new))
        .subscribe();
}
</script>
</body>
</html>
