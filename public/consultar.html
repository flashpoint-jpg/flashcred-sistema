<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        .contrato {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.7;
        }
        .contrato h3 {
            text-align: center;
            color: #0A2463;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid #0A2463;
            padding-bottom: 10px;
        }
        .contrato .linha {
            margin: 8px 0;
        }
        .contrato .destaque {
            font-weight: 600;
            color: #0A2463;
        }
        .assinatura-area {
            border: 2px dashed #94a3b8;
            border-radius: 8px;
            height: 120px;
            margin: 16px 0;
            position: relative;
            background: #fafafa;
        }
        .assinatura-canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .parcelas-tabela {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        .parcelas-tabela th {
            background: #f1f5f9;
            padding: 10px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .parcelas-tabela td {
            padding: 10px;
            border-top: 1px solid #e2e8f0;
        }
        .parcela-paga { color: #10B981; font-weight: 600; }
        .parcela-pendente { color: #f59e0b; font-weight: 600; }
        .pix-copia {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 12px;
            word-break: break-all;
            font-size: 12px;
            color: #166534;
        }
        .btn-pix-parcela {
            background: #32BCAD;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-pix-parcela:hover {
            background: #0d9488;
        }
        .pagamento-entrada {
            border: 2px solid #32BCAD;
            border-radius: 12px;
            padding: 20px;
            background: #f0fdfa;
        }
        .info-pagamento {
            background: #e0f2fe;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }
        .oculto { display: none !important; }
        @media print {
            body * { visibility: hidden; }
            .contrato, .contrato * { visibility: visible; }
            .contrato { position: absolute; left: 0; top: 0; width: 100%; border: none; }
            .nao-imprimir { display: none !important; }
        }
    </style>
</head>
<body class="bg-fundo text-slate-700 min-h-screen">

<div class="max-w-2xl mx-auto p-4">
    <h1 class="text-[clamp(1.5rem,4vw,1.8rem)] font-bold text-primary mb-6 text-center">🔍 Consultar Proposta</h1>

    <!-- TELA DE CONSULTA POR CPF -->
    <div id="telaConsulta" class="bg-white rounded-xl shadow p-6 mb-6">
        <label class="block font-semibold text-sm text-slate-500 mb-2">Digite seu CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" 
            class="w-full p-3 border border-slate-200 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
        <button onclick="consultar()" 
            class="w-full mt-4 bg-primary text-white p-3 rounded-lg font-semibold hover:bg-primary/90 transition">
            Consultar
        </button>
    </div>

    <!-- ÁREA QUE APARECE APÓS CONSULTA -->
    <div id="resultado" class="hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CHAVE_PIX_FIXA = '33552949852';

let proposta = null;

function formatarCPF(cpf) {
    cpf = cpf.replace(/\D/g, '');
    return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
}

function formatarData(data) {
    if (!data) return '---';
    const d = new Date(data);
    return d.toLocaleDateString('pt-BR');
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

async function consultar() {
    let cpf = document.getElementById('cpf').value.replace(/\D/g, '');
    if (cpf.length !== 11) { alert('Digite um CPF válido!'); return; }

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .filter('cpf', 'ilike', '%' + cpf + '%')
        .order('created_at', { ascending: false })
        .limit(1);

    if (error || !data || data.length === 0) {
        document.getElementById('resultado').innerHTML = `
            <div class="bg-red-50 text-red-700 p-4 rounded-lg text-center">
                ❌ Nenhuma proposta encontrada para este CPF.
            </div>`;
        document.getElementById('resultado').classList.remove('hidden');
        return;
    }

    proposta = data[0];
    exibirProposta();
}

function exibirProposta() {
    const p = proposta;
    const valorTotal = Number(p.valor_desejado || 0);
    const percEnt = Number(p.percentual_entrada || 20);
    const valorEnt = valorTotal * percEnt / 100;
    const parcelas = p.quantidade_parcelas || 0;
    const juros = Number(p.juros || 0);
    const resto = valorTotal - valorEnt;
    const valorParcela = parcelas ? resto * (1 + juros/100) / parcelas : 0;
    const listaParcelas = p.lista_parcelas || [];

    const entradaPaga = p.entrada_paga === true || p.status === 'Entrada Paga';
    const dataPagamento = p.data_pagamento_entrada ? formatarData(p.data_pagamento_entrada) : '';

    // ==== CONTRATO ====
    const contrato = `
    <div class="contrato" id="contratoImpressao">
        <h3>📄 CONTRATO DE PRESTAÇÃO DE SERVIÇO / VENDA</h3>
        <div class="linha"><span class="destaque">Código da Proposta:</span> ${p.codigo_unico || '---'}</div>
        <div class="linha"><span class="destaque">CONTRATANTE:</span> ${p.nome}</div>
        <div class="linha"><span class="destaque">CPF:</span> ${formatarCPF(p.cpf || '')}</div>
        <div class="linha"><span class="destaque">Valor Total Contratado:</span> ${real(valorTotal)}</div>
        <div class="linha"><span class="destaque">Valor da Entrada:</span> ${real(valorEnt)}</div>
        <div class="linha"><span class="destaque">Quantidade de Parcelas:</span> ${parcelas}x</div>
        <div class="linha"><span class="destaque">Valor de Cada Parcela:</span> ${real(valorParcela)}</div>
        <div class="linha"><span class="destaque">Juros ao Mês:</span> ${juros}%</div>
        ${entradaPaga ? `<div class="linha"><span class="destaque">✅ Entrada Paga em:</span> ${dataPagamento}</div>` : ''}
        <br>
        <p>Pelo presente instrumento, as partes acordam o seguinte:</p>
        <p><strong>Cláusula 1ª:</strong> O CONTRATANTE declara que os dados fornecidos são verdadeiros e se compromete a honrar o pagamento das parcelas conforme valores e vencimentos estabelecidos.</p>
        <p><strong>Cláusula 2ª:</strong> A entrega do bem/produto será efetuada mediante confirmação do pagamento da entrada e assinatura do presente contrato.</p>
        <p><strong>Cláusula 3ª:</strong> O não pagamento de qualquer parcela poderá acarretar em medidas judiciais e inclusão do nome nos órgãos de proteção ao crédito.</p>
        <p><strong>Cláusula 4ª:</strong> Declaro ter lido, compreendido e concordado com todos os termos deste contrato.</p>
        <br><br>
        <p style="text-align: right;">___________________________<br>${p.nome}<br>Data: ${new Date().toLocaleDateString('pt-BR')}</p>
    </div>`;

    // ==== TABELA DE PARCELAS ====
    const tabelaParcelas = listaParcelas.length > 0 ? `
    <div class="bg-white rounded-xl shadow p-5 mb-6">
        <h3 class="font-bold text-lg text-primary mb-4">📋 Suas Parcelas</h3>
        <table class="parcelas-tabela">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Vencimento</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                ${listaParcelas.map(parc => `
                <tr>
                    <td>${parc.numero}</td>
                    <td>${formatarData(parc.vencimento)}</td>
                    <td>${real(parc.valor)}</td>
                    <td class="${parc.status === 'Paga' ? 'parcela-paga' : 'parcela-pendente'}">
                        ${parc.status === 'Paga' ? '✅ Paga' : '⏳ Pendente'}
                    </td>
                </tr>
                `).join('')}
            </tbody>
        </table>
    </div>` : '';

    // ==== TELA DE PAGAMENTO DA ENTRADA (SÓ SE AINDA NÃO PAGOU) ====
    const telaEntrada = !entradaPaga ? `
    <div class="pagamento-entrada mb-6">
        <h3 class="font-bold text-lg text-pix mb-4">💳 PAGAMENTO DA ENTRADA</h3>
        <p class="text-2xl font-bold text-center text-primary mb-4">${real(valorEnt)}</p>
        
        <div class="mb-4">
            <p class="font-semibold text-sm text-slate-500 mb-2">Chave Pix:</p>
            <div class="pix-copia" id="chavePix">${p.copia_cola_pix || CHAVE_PIX_FIXA}</div>
            <button onclick="copiarPix()" class="mt-2 bg-primary text-white px-4 py-2 rounded-lg text-sm font-semibold">
                📋 Copiar Chave Pix
            </button>
        </div>

        <div class="text-center mb-4">
            <p class="font-semibold text-sm text-slate-500 mb-2">QR Code:</p>
            <div id="qrcode" class="inline-block p-2 bg-white rounded-lg border"></div>
        </div>

        <div class="mt-6 p-4 bg-slate-50 rounded-lg border">
            <label class="flex items-center gap-2 cursor-pointer mb-4">
                <input type="checkbox" id="liContrato" onchange="liberaAssinatura()">
                <span>Declaro que li e concordo com o contrato acima</span>
            </label>

            <p class="text-sm font-semibold text-slate-500 mb-2">Assine abaixo:</p>
            <div class="assinatura-area">
                <canvas id="canvasAssinatura" class="assinatura-canvas"></canvas>
            </div>
            <div class="flex gap-2 mt-2">
                <button onclick="limparAssinatura()" class="px-4 py-2 bg-slate-200 rounded-lg text-sm font-semibold">Limpar</button>
                <button id="btnConfirmar" onclick="confirmarAssinatura()" disabled 
                    class="px-4 py-2 bg-slate-300 rounded-lg text-sm font-semibold text-slate-500">
                    ✅ Confirmar Assinatura
                </button>
            </div>
        </div>
    </div>
    ` : '';

    // ==== TELA QUANDO ENTRADA JÁ FOI PAGA ====
    const telaPaga = entradaPaga ? `
    <div class="info-pagamento mb-6">
        <h3 class="font-bold text-lg text-sucesso mb-2">✅ ENTRADA PAGA</h3>
        <p class="text-sm"><strong>Data do pagamento:</strong> ${dataPagamento}</p>
        <p class="text-sm"><strong>Valor pago:</strong> ${real(valorEnt)}</p>
        <p class="text-sm mt-2">Abaixo estão suas parcelas e o contrato completo:</p>
    </div>
    ` : '';

    // ==== MONTAR TUDO ====
    let html = `
    <div class="bg-white rounded-xl shadow p-5 mb-6">
        <h2 class="text-xl font-bold text-primary mb-2">${p.nome}</h2>
        <p class="text-sm text-slate-500">Código: ${p.codigo_unico || '---'} | CPF: ${formatarCPF(p.cpf || '')}</p>
        <p class="text-sm font-semibold mt-2">Valor Total: ${real(valorTotal)}</p>
        <p class="text-sm">Entrada: ${real(valorEnt)} | ${parcelas}x de ${real(valorParcela)} | Juros: ${juros}% a.m.</p>
    </div>

    ${contrato}

    ${entradaPaga ? telaPaga + tabelaParcelas : telaEntrada}

    <div class="nao-imprimir flex gap-3 mt-6">
        <button onclick="window.print()" class="flex-1 bg-primary text-white p-3 rounded-lg font-semibold">
            🖨️ Imprimir Contrato
        </button>
        <button onclick="window.location.reload()" class="bg-slate-200 px-4 rounded-lg font-semibold">
            🔄 Atualizar
        </button>
    </div>
    `;

    document.getElementById('resultado').innerHTML = html;
    document.getElementById('resultado').classList.remove('hidden');

    // Se tem QR Code pra gerar
    if (!entradaPaga) {
        setTimeout(() => gerarQRCode(), 100);
        setTimeout(() => iniciarCanvas(), 150);
    }
}

function gerarQRCode() {
    const chave = proposta.copia_cola_pix || CHAVE_PIX_FIXA;
    const container = document.getElementById('qrcode');
    if (container) {
        container.innerHTML = '';
        new QRCode(container, { text: chave, width: 180, height: 180 });
    }
}

function copiarPix() {
    const chave = document.getElementById('chavePix')?.textContent || '';
    navigator.clipboard.writeText(chave).then(() => alert('✅ Chave copiada!'));
}

// ==== ASSINATURA ====
let canvas, ctx, desenhando = false, assinou = false;

function iniciarCanvas() {
    canvas = document.getElementById('canvasAssinatura');
    if (!canvas) return;
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx = canvas.getContext('2d');
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';

    canvas.onmousedown = canvas.ontouchstart = (e) => {
        if (!document.getElementById('liContrato').checked) return;
        desenhando = true;
        assinou = true;
        ctx.beginPath();
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches?.[0]?.clientX) - r.left;
        const y = (e.clientY || e.touches?.[0]?.clientY) - r.top;
        ctx.moveTo(x, y);
    };
    canvas.onmousemove = canvas.ontouchmove = (e) => {
        if (!desenhando) return;
        e.preventDefault();
        const r = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches?.[0]?.clientX) - r.left;
        const y = (e.clientY || e.touches?.[0]?.clientY) - r.top;
        ctx.lineTo(x, y);
        ctx.stroke();
    };
    canvas.onmouseup = canvas.ontouchend = () => { desenhando = false; liberaAssinatura(); };
}

function liberaAssinatura() {
    const li = document.getElementById('liContrato')?.checked;
    const btn = document.getElementById('btnConfirmar');
    if (li && assinou) {
        btn.disabled = false;
        btn.className = 'px-4 py-2 bg-sucesso rounded-lg text-sm font-semibold text-white';
    } else {
        btn.disabled = true;
        btn.className = 'px-4 py-2 bg-slate-300 rounded-lg text-sm font-semibold text-slate-500';
    }
}

function limparAssinatura() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    assinou = false;
    liberaAssinatura();
}

async function confirmarAssinatura() {
    if (!confirm('✅ Confirmar assinatura?')) return;
    alert('✅ Contrato assinado com sucesso!\n\nApós confirmação do pagamento, suas parcelas serão liberadas.');
}

// Máscara de CPF
document.getElementById('cpf').addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);
    if (v.length > 9) v = `${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6,9)}-${v.slice(9)}`;
    else if (v.length > 6) v = `${v.slice(0,3)}.${v.slice(3,6)}.${v.slice(6)}`;
    else if (v.length > 3) v = `${v.slice(0,3)}.${v.slice(3)}`;
    e.target.value = v;
});
</script>
</body>
</html>
