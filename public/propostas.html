<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propostas - FlashCred ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{primary:'#d40000',secondary:'#1e293b',sucesso:'#10b981',alerta:'#f59e0b',perigo:'#ef4444'}}}}}</script>
    <style>.sidebar-link{@apply flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-primary/10 hover:text-white}.sidebar-link.ativo{@apply bg-primary text-white font-medium}.card{@apply bg-white rounded-xl shadow-sm p-5 border border-gray-100}</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="flex flex-col md:flex-row">
    <aside class="w-full md:w-64 bg-secondary p-4">
        <div class="mb-8 text-center"><h1 class="text-xl font-bold text-white">FLASHCRED ERP</h1></div>
        <nav class="space-y-1">
            <a href="index.html" class="sidebar-link"><i class="fa fa-home"></i><span>Dashboard</span></a>
            <a href="clientes.html" class="sidebar-link"><i class="fa fa-users"></i><span>Clientes</span></a>
            <a href="#" class="sidebar-link ativo"><i class="fa fa-file-text"></i><span>Propostas</span></a>
            <a href="financeiro.html" class="sidebar-link"><i class="fa fa-money"></i><span>Financeiro</span></a>
            <a href="relatorios.html" class="sidebar-link"><i class="fa fa-bar-chart"></i><span>Relatórios</span></a>
        </nav>
    </aside>
    <main class="flex-1 p-4 md:p-6">
        <header class="mb-6 flex justify-between items-center"><h2 class="text-2xl font-bold">Propostas de Crédito</h2><button class="bg-primary text-white px-4 py-2 rounded-lg">+ Nova Proposta</button></header>
        <div class="card overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-left"><tr><th class="p-3">Cliente</th><th class="p-3">Valor Total</th><th class="p-3">Parcelas</th><th class="p-3">Status</th><th class="p-3">Ações</th></tr></thead>
                <tbody id="listaPropostas"><tr><td colspan="5" class="p-4 text-center">Carregando...</td></tr>
            </table>
        </div>
    </main>
</div>
<script>
async function carregarPropostas(){
    const res=await fetch('/api/propostas');
    const propostas=(await res.json()).propostas||[];
    const tbody=document.getElementById('listaPropostas');tbody.innerHTML='';
    propostas.forEach(p=>{
        const cor={EM_ANALISE:'text-alerta',APROVADO:'text-sucesso',REPROVADO:'text-perigo'};
        tbody.innerHTML+=`<tr class="border-t"><td class="p-3">${p.nome}</td><td class="p-3">R$ ${p.valorTotal?.toFixed(2).replace('.',',')||'0,00'}</td><td class="p-3">${p.qtdParcelas||0}x</td><td class="p-3 ${cor[p.status]}">${p.status.replace('_',' ')}</td><td class="p-3 flex gap-2"><button class="text-alerta">Editar</button><button class="text-sucesso">Aprovar</button></td></tr>`;
    });
}
carregarPropostas();
</script>
</body>
</html>
