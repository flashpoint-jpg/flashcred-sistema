<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - FlashCred ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary:'#d40000', secondary:'#1e293b', sucesso:'#10b981', alerta:'#f59e0b', perigo:'#ef4444' } } } }
    </script>
    <style>.sidebar-link{@apply flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-primary/10 hover:text-white}.sidebar-link.ativo{@apply bg-primary text-white font-medium}.card{@apply bg-white rounded-xl shadow-sm p-5 border border-gray-100}</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="flex flex-col md:flex-row">
    <aside class="w-full md:w-64 bg-secondary p-4">
        <div class="mb-8 text-center"><h1 class="text-xl font-bold text-white">FLASHCRED ERP</h1><p class="text-xs text-gray-400">Flashpoint Distribuidora</p></div>
        <nav class="space-y-1">
            <a href="index.html" class="sidebar-link"><i class="fa fa-home w-5"></i><span>Dashboard</span></a>
            <a href="#" class="sidebar-link ativo"><i class="fa fa-users w-5"></i><span>Clientes</span></a>
            <a href="propostas.html" class="sidebar-link"><i class="fa fa-file-text w-5"></i><span>Propostas</span></a>
            <a href="financeiro.html" class="sidebar-link"><i class="fa fa-money w-5"></i><span>Financeiro</span></a>
            <a href="relatorios.html" class="sidebar-link"><i class="fa fa-bar-chart w-5"></i><span>Relatórios</span></a>
        </nav>
    </aside>
    <main class="flex-1 p-4 md:p-6">
        <header class="mb-6 flex justify-between items-center"><h2 class="text-2xl font-bold">Gestão de Clientes</h2></header>
        <div class="card mb-6">
            <input type="text" id="buscaCliente" placeholder="Buscar por Nome ou CPF..." class="w-full p-3 border rounded-lg" oninput="filtrarClientes()">
        </div>
        <div class="card overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-left"><tr><th class="p-3">Nome</th><th class="p-3">CPF</th><th class="p-3">WhatsApp</th><th class="p-3">Status</th><th class="p-3">Ações</th></tr></thead>
                <tbody id="listaClientes"><tr><td colspan="5" class="p-4 text-center text-gray-500">Carregando...</td></tr>
            </table>
        </div>
    </main>
</div>
<script>
async function carregarClientes(){
    const res=await fetch('/api/propostas');
    const dados=await res.json();
    const propostas=dados.propostas||[];
    const tbody=document.getElementById('listaClientes');
    tbody.innerHTML='';
    propostas.forEach(p=>{
        const bloqueado=p.parcelas?.some(parc=>parc.status==='PENDENTE' && new Date(parc.vencimento.split('/').reverse().join('-'))<new Date());
        tbody.innerHTML+=`<tr class="border-t"><td class="p-3">${p.nome}</td><td class="p-3">${p.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</td><td class="p-3">${p.whatsapp||'-'}</td><td class="p-3">${bloqueado?'<span class="text-perigo">Bloqueado</span>':'<span class="text-sucesso">Liberado</span>'}</td><td class="p-3"><button class="text-primary">Ver</button></td></tr>`;
    });
}
function filtrarClientes(){/* função de busca */}
carregarClientes();
</script>
</body>
</html>
