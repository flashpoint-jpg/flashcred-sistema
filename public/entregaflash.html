<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashEntregas Muzambinho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --noite:#12141C;
      --painel:#1B1E29;
      --painel-alt:#232838;
      --linha:#2C3143;
      --mango:#FFB627;
      --mango-escuro:#CC8F14;
      --chama:#FF5A4E;
      --osso:#F3EFE6;
      --poeira:#8D93A6;
      --verde:#4CD787;
      --azul:#3B82F6;
      --bolha-cliente:#2563EB;
      --bolha-motorista:#4CD787;
      --bolha-suporte:#8B5CF6;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:var(--noite);color:var(--osso);font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
    body{min-height:100vh;}
    #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:
      radial-gradient(circle at 15% 0%, rgba(255,182,39,0.08), transparent 40%),
      var(--noite);}

    header.topo{padding:22px 20px 16px;position:relative;}
    .marca{display:flex;align-items:baseline;gap:8px;}
    .marca .icone{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--mango),var(--chama));display:flex;align-items:center;justify-content:center;font-family:'Archivo Black';font-size:16px;color:var(--noite);flex-shrink:0;transform:rotate(-6deg);}
    .marca h1{font-family:'Archivo Black',sans-serif;font-size:28px;letter-spacing:0.5px;margin:0;color:var(--osso);text-transform:uppercase;}
    .marca h1 span{color:var(--mango);}
    .tagline{font-size:12px;color:var(--poeira);margin:4px 0 0 42px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;}

    .toggle-modo{display:flex;margin:18px 20px 4px;background:var(--painel);border-radius:14px;padding:4px;border:1px solid var(--linha);}
    .toggle-modo button{flex:1;padding:11px 0;border:none;background:transparent;color:var(--poeira);font-family:'Barlow';font-weight:700;font-size:14px;border-radius:10px;cursor:pointer;letter-spacing:0.3px;transition:all .2s;}
    .toggle-modo button.ativo{background:var(--mango);color:var(--noite);}

    .aviso{margin:14px 20px 0;font-size:11.5px;color:var(--poeira);background:var(--painel);border:1px solid var(--linha);border-left:3px solid var(--mango);padding:10px 12px;border-radius:8px;line-height:1.5;}

    main{flex:1;padding:18px 20px 90px;}
    .cartao{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px;}
    .cartao h2{font-family:'Archivo Black';font-size:15px;margin:0 0 14px;text-transform:uppercase;letter-spacing:0.5px;color:var(--osso);}
    label{display:block;font-size:12px;font-weight:600;color:var(--poeira);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.4px;}
    label:first-of-type{margin-top:0;}
    input[type=text], input[type=tel], input[type=number], select, textarea{
      width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--linha);background:var(--painel-alt);color:var(--osso);font-family:'Barlow';font-size:14.5px;outline:none;transition:border .15s;
    }
    input:focus, select:focus, textarea:focus{border-color:var(--mango);}
    textarea{resize:vertical;min-height:56px;}
    .veiculos{display:flex;gap:8px;flex-wrap:wrap;}
    .veiculos button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--linha);background:var(--painel-alt);color:var(--poeira);font-family:'Barlow';font-weight:600;font-size:13px;cursor:pointer;min-width:70px;}
    .veiculos button.sel{border-color:var(--mango);color:var(--mango);background:rgba(255,182,39,0.08);}
    .veiculos button .emoji{display:block;font-size:20px;margin-bottom:4px;}

    .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;border:none;font-family:'Barlow';font-weight:700;font-size:15px;letter-spacing:0.3px;cursor:pointer;margin-top:14px;transition:all .2s;}
    .btn-primario{background:var(--mango);color:var(--noite);}
    .btn-primario:hover{background:var(--mango-escuro);}
    .btn-primario:disabled{opacity:0.4;cursor:not-allowed;}
    .btn-secundario{background:transparent;border:1px solid var(--linha);color:var(--osso);}
    .btn-verde{background:var(--verde);color:var(--noite);}
    .btn-chama{background:var(--chama);color:var(--noite);}
    .btn-azul{background:var(--azul);color:#fff;}
    .btn-roxo{background:var(--bolha-suporte);color:#fff;}
    .btn-pequeno{width:auto;padding:8px 14px;font-size:12.5px;margin-top:0;border-radius:8px;}
    .btn-linha{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:none;background:var(--painel-alt);color:var(--osso);font-size:13px;cursor:pointer;}
    .btn-linha:hover{background:var(--linha);}

    .estimativa{display:flex;flex-direction:column;gap:10px;background:var(--painel-alt);border-radius:10px;padding:14px;margin-top:14px;}
    .estimativa .linha{display:flex;justify-content:space-between;align-items:center;}
    .estimativa .valor{font-family:'Archivo Black';font-size:26px;color:var(--mango);}
    .estimativa .valor-destaque{font-family:'Archivo Black';font-size:20px;color:var(--verde);}
    .estimativa .rotulo{font-size:11px;color:var(--poeira);text-transform:uppercase;letter-spacing:0.5px;}
    .estimativa .divisao{font-size:12px;color:var(--poeira);border-top:1px dashed var(--linha);padding-top:8px;}

    .pedido{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:15px;margin-bottom:12px;}
    .pedido .linha-topo{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
    .pedido .end{font-size:13.5px;color:var(--osso);line-height:1.4;}
    .pedido .end b{color:var(--poeira);font-weight:600;font-size:11px;text-transform:uppercase;display:block;letter-spacing:0.4px;margin-bottom:1px;}
    .pedido .preco{font-family:'Archivo Black';font-size:17px;color:var(--mango);white-space:nowrap;margin-left:10px;}
    .selo{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.4px;}
    .selo-aguardando{background:rgba(255,90,78,0.15);color:var(--chama);}
    .selo-andamento{background:rgba(255,182,39,0.15);color:var(--mango);}
    .selo-entregue{background:rgba(76,215,135,0.15);color:var(--verde);}

    .trilha{display:flex;align-items:center;margin:14px 0 6px;}
    .trilha .ponto{width:9px;height:9px;border-radius:50%;background:var(--linha);flex-shrink:0;}
    .trilha .barra{flex:1;height:2px;background:var(--linha);}
    .trilha .ponto.feito, .trilha .barra.feito{background:var(--mango);}
    .trilha .ponto.atual{background:var(--mango);box-shadow:0 0 0 4px rgba(255,182,39,0.25);animation:pulso 1.6s infinite;}
    @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,182,39,0.4);}70%{box-shadow:0 0 0 8px rgba(255,182,39,0);}100%{box-shadow:0 0 0 0 rgba(255,182,39,0);}}
    .etiquetas{display:flex;justify-content:space-between;font-size:9px;color:var(--poeira);text-transform:uppercase;letter-spacing:0.3px;margin-top:5px;}
    .etiquetas span{flex:1;text-align:center;}
    .etiquetas span:first-child{text-align:left;}
    .etiquetas span:last-child{text-align:right;}

    .vazio{text-align:center;padding:34px 10px;color:var(--poeira);font-size:13.5px;line-height:1.6;}
    .vazio .emoji-grande{font-size:32px;display:block;margin-bottom:10px;}

    .rodape-motorista{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
    .rodape-motorista .ganho{flex:1;min-width:140px;}
    .rodape-motorista .ganho .n{font-family:'Archivo Black';font-size:22px;color:var(--verde);}
    .rodape-motorista .ganho .r{font-size:10.5px;color:var(--poeira);text-transform:uppercase;letter-spacing:0.4px;}

    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--painel-alt);border:1px solid var(--mango);color:var(--osso);padding:12px 18px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:50;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
    .toast-chat{border-color:var(--bolha-motorista);background:rgba(76,215,135,0.1);}
    .toast-suporte{border-color:var(--bolha-suporte);background:rgba(139,92,246,0.1);}

    .campo-motorista{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px;}
    .subtitulo{font-size:12px;color:var(--poeira);margin:-6px 0 14px;line-height:1.5;}
    .refresh{font-size:11px;color:var(--poeira);text-align:right;margin:-6px 0 12px;cursor:pointer;text-decoration:underline;}

    #mapa{height:280px;border-radius:12px;margin:12px 0;border:1px solid var(--linha);}
    .info-mapa{font-size:12px;color:var(--poeira);margin-top:8px;display:flex;justify-content:space-between;}
    .tempo-chegada{color:var(--verde);font-weight:600;}
    .saldo-card{background:linear-gradient(135deg,var(--verde),#34b977);color:var(--noite);border-radius:12px;padding:16px;text-align:center;margin-bottom:16px;}
    .saldo-card .valor-saldo{font-family:'Archivo Black';font-size:28px;}
    .saldo-card .rotulo-saldo{font-size:12px;opacity:0.8;text-transform:uppercase;letter-spacing:0.5px;}

    /* 🗨️ ESTILOS DO CHAT */
    .modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;}
    .modal-chat{width:100%;max-width:480px;background:var(--painel);border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 -4px 24px rgba(0,0,0,0.5);}
    .chat-topo{padding:14px 18px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;}
    .chat-topo h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:0.5px;}
    .chat-fechar{background:none;border:none;color:var(--poeira);font-size:20px;cursor:pointer;}
    .chat-mensagens{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:200px;}
    .bolha{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;position:relative;}
    .bolha span{font-size:10px;opacity:0.6;margin-top:4px;display:block;text-align:right;}
    .bolha-cliente{background:var(--bolha-cliente);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
    .bolha-motorista{background:var(--bolha-motorista);color:#000;border-bottom-left-radius:4px;align-self:flex-start;}
    .bolha-suporte{background:var(--bolha-suporte);color:#fff;border-bottom-left-radius:4px;align-self:flex-start;}
    .chat-vazio{text-align:center;padding:30px 10px;color:var(--poeira);font-size:13px;}
    .chat-envio{display:flex;gap:8px;padding:14px;border-top:1px solid var(--linha);}
    .chat-envio input{flex:1;margin:0;}
    .balao-botao{position:relative;}
    .notif-bolinha{position:absolute;top:-6px;right:-6px;background:var(--chama);color:#fff;font-size:10px;font-weight:bold;min-width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pulso 2s infinite;}
    .grupo-botoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  </style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

const CENTRO_MUZAMBINHO = { lat: -21.4836, lng: -46.5144 };

const VEICULOS = {
  bicicleta: { label: 'Bicicleta', emoji: '🚴', base: 5.00, km: 1.50 },
  moto:       { label: 'Moto',      emoji: '🏍️', base: 8.00, km: 2.00 },
  carro:      { label: 'Carro',     emoji: '🚗', base: 12.00, km: 3.00 },
  van:        { label: 'Van',       emoji: '🚐', base: 18.00, km: 4.00 }
};

const TAXA_PLATAFORMA = 0.30;
const ESTAGIOS = ['aguardando','indo_coletar','coletado','a_caminho','entregue'];
const ROTULOS_ESTAGIO = {
  aguardando: 'Aguardando',
  indo_coletar: 'Indo coletar',
  coletado: 'Coletado',
  a_caminho: 'A caminho',
  entregue: 'Entregue'
};

let estado = {
  modo: 'cliente',
  veiculoSelecionado: 'moto',
  filtroTelefoneCliente: '',
  motorista: { nome:'', telefone:'', ativo:false, saldo:0 },
  pedidos: [],
  carregando: true,
  toast: null,
  mapa: null,
  tempoChegada: '--',
  chatAberto: null, // null | { tipo: 'motorista'|'suporte', pedidoId }
  mensagens: [],
  assinaturaChat: null,
  contadorNaoLidas: { motorista:0, suporte:0 }
};

// 💰 CÁLCULOS
function precoEstimado(veiculo, distancia){
  const v = VEICULOS[veiculo];
  const d = Math.max(0.5, Number(distancia) || 1);
  const total = v.base + (v.km * d);
  return {
    total: Math.round(total * 100) / 100,
    plataforma: Math.round(total * TAXA_PLATAFORMA * 100) / 100,
    motorista: Math.round(total * (1 - TAXA_PLATAFORMA) * 100) / 100
  };
}

function mostrarToast(msg, tipo='normal'){
  estado.toast = { texto: msg, tipo };
  render();
  setTimeout(()=>{ estado.toast = null; render(); }, 3000);
}

// 📦 CONVERSÃO DE DADOS
function paraCamposApp(row){
  return {
    id: row.id,
    clienteNome: row.cliente_nome,
    clienteTelefone: row.cliente_telefone,
    motoristaNome: row.motorista_nome || '',
    motoristaTelefone: row.motorista_telefone || '',
    origem: row.origem,
    destino: row.destino,
    veiculo: row.veiculo,
    descricao: row.descricao || '',
    distancia: Number(row.distancia) || 0,
    precoTotal: Number(row.preco_total) || 0,
    precoMotorista: Number(row.preco_motorista) || 0,
    status: row.status,
    criadoEm: Number(row.criado_em),
    atualizadoEm: Number(row.atualizado_em),
    latOrigem: row.lat_origem || CENTRO_MUZAMBINHO.lat,
    lngOrigem: row.lng_origem || CENTRO_MUZAMBINHO.lng,
    latDestino: row.lat_destino || CENTRO_MUZAMBINHO.lat,
    lngDestino: row.lng_destino || CENTRO_MUZAMBINHO.lng
  };
}

function paraCamposDB(p){
  return {
    id: p.id,
    cliente_nome: p.clienteNome,
    cliente_telefone: p.clienteTelefone,
    motorista_nome: p.motoristaNome || null,
    motorista_telefone: p.motoristaTelefone || null,
    origem: p.origem,
    destino: p.destino,
    veiculo: p.veiculo,
    descricao: p.descricao || null,
    distancia: p.distancia,
    preco_total: p.precoTotal,
    preco_motorista: p.precoMotorista,
    status: p.status,
    criado_em: p.criadoEm,
    atualizado_em: p.atualizadoEm,
    lat_origem: p.latOrigem,
    lng_origem: p.lngOrigem,
    lat_destino: p.latDestino,
    lng_destino: p.lngDestino
  };
}

// 💬 MENSAGENS DO CHAT
async function carregarMensagens(pedidoId){
  const { data, error } = await sb
    .from('entrega_chat')
    .select('*')
    .eq('pedido_id', pedidoId)
    .order('criado_em', { ascending: true });
  if(error){ console.error(error); return []; }
  return data || [];
}

async function enviarMensagem(pedidoId, remetenteTipo, remetenteNome, texto){
  if(!texto.trim()) return;
  const mensagem = {
    pedido_id: pedidoId,
    remetente_tipo: remetenteTipo, // 'cliente', 'motorista', 'suporte'
    remetente_nome: remetenteNome,
    texto: texto.trim(),
    lido: false,
    criado_em: Date.now()
  };
  const { error } = await sb.from('entrega_chat').insert(mensagem);
  if(error){ console.error(error); mostrarToast('Erro ao enviar mensagem'); return; }
  
  // Notificação local
  const pedido = estado.pedidos.find(p => p.id === pedidoId);
  if(pedido){
    const nomeOutro = remetenteTipo === 'cliente' ? (pedido.motoristaNome || 'Entregador') : pedido.clienteNome;
    mostrarToast(`💬 ${nomeOutro}: "${texto.substring(0,30)}${texto.length>30?'...':''}"`, 'chat');
  }
}

// 🔌 REALTIME — OUVE NOVAS MENSAGENS
function assinarChat(pedidoId){
  if(estado.assinaturaChat) estado.assinaturaChat.unsubscribe();
  
  estado.assinaturaChat = sb
    .channel(`chat:${pedidoId}`)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'entrega_chat',
      filter: `pedido_id=eq.${pedidoId}`
    }, async (payload) => {
      const msg = payload.new;
      
      // Atualiza lista de mensagens
      estado.mensagens = await carregarMensagens(pedidoId);
      
      // Conta não lidas se chat fechado
      if(!estado.chatAberto){
        if(msg.remetente_tipo === 'suporte'){
          estado.contadorNaoLidas.suporte++;
        } else {
          estado.contadorNaoLidas.motorista++;
        }
      }
      
      render();
    })
    .subscribe();
}

async function abrirChat(tipo, pedidoId){
  estado.chatAberto = { tipo, pedidoId };
  estado.mensagens = await carregarMensagens(pedidoId);
  
  // Zera contador de não lidas
  if(tipo === 'motorista') estado.contadorNaoLidas.motorista = 0;
  if(tipo === 'suporte') estado.contadorNaoLidas.suporte = 0;
  
  assinarChat(pedidoId);
  render();
  
  // Rola pra baixo após render
  setTimeout(() => {
    const caixa = document.querySelector('.chat-mensagens');
    if(caixa) caixa.scrollTop = caixa.scrollHeight;
  }, 50);
}

function fecharChat(){
  if(estado.assinaturaChat) estado.assinaturaChat.unsubscribe();
  estado.chatAberto = null;
  estado.mensagens = [];
  render();
}

// 📦 PEDIDOS
async function carregarPedidos(){
  try{
    const { data, error } = await sb
      .from('entrega_pedidos')
      .select('*')
      .order('criado_em', { ascending: false });
    if(error){ console.error(error); estado.pedidos = []; render(); return; }
    estado.pedidos = (data || []).map(paraCamposApp);
  }catch(e){
    console.error(e);
    estado.pedidos = [];
  }
  estado.carregando = false;
  render();
}

async function salvarPedido(p){
  const { error } = await sb.from('entrega_pedidos').upsert(paraCamposDB(p));
  if(error){ console.error(error); mostrarToast('Erro ao gravar. Tente novamente.'); }
}

function lerFormularioCliente(){
  return {
    nome: (document.getElementById('c-nome')?.value || '').trim(),
    telefone: (document.getElementById('c-telefone')?.value || '').trim(),
    origem: (document.getElementById('c-origem')?.value || '').trim(),
    destino: (document.getElementById('c-destino')?.value || '').trim(),
    veiculo: estado.veiculoSelecionado,
    descricao: (document.getElementById('c-descricao')?.value || '').trim(),
    distancia: parseFloat(document.getElementById('c-distancia')?.value || 3)
  };
}

async function criarPedido(){
  const f = lerFormularioCliente();
  if(!f.nome){ mostrarToast('⚠️ Digite seu nome!'); return; }
  if(!f.telefone){ mostrarToast('⚠️ Digite seu WhatsApp!'); return; }
  if(!f.origem){ mostrarToast('⚠️ Digite o endereço de recolha!'); return; }
  if(!f.destino){ mostrarToast('⚠️ Digite o endereço de entrega!'); return; }

  const precos = precoEstimado(f.veiculo, f.distancia);
  const agora = Date.now();
  const pedido = {
    id: 'p'+agora+Math.floor(Math.random()*1000),
    clienteNome: f.nome,
    clienteTelefone: f.telefone,
    origem: f.origem,
    destino: f.destino,
    veiculo: f.veiculo,
    descricao: f.descricao,
    distancia: f.distancia,
    precoTotal: precos.total,
    precoMotorista: precos.motorista,
    status: 'aguardando',
    motoristaNome: '',
    motoristaTelefone: '',
    criadoEm: agora,
    atualizadoEm: agora,
    latOrigem: CENTRO_MUZAMBINHO.lat,
    lngOrigem: CENTRO_MUZAMBINHO.lng,
    latDestino: CENTRO_MUZAMBINHO.lat + (Math.random()-0.5)*0.02,
    lngDestino: CENTRO_MUZAMBINHO.lng + (Math.random()-0.5)*0.02
  };
  
  await salvarPedido(pedido);
  estado.filtroTelefoneCliente = f.telefone;
  mostrarToast('✅ Pedido criado! Buscando entregador...');
  await carregarPedidos();
}

async function aceitarPedido(id){
  const p = estado.pedidos.find(x => x.id === id);
  if(!p) return;
  p.status = 'indo_coletar';
  p.motoristaNome = estado.motorista.nome;
  p.motoristaTelefone = estado.motorista.telefone;
  p.atualizadoEm = Date.now();
  await salvarPedido(p);
  mostrarToast('✅ Pedido aceito! Vá buscar o produto.');
  await carregarPedidos();
}

async function avancarStatus(id){
  const p = estado.pedidos.find(x => x.id === id);
  if(!p) return;
  const i = ESTAGIOS.indexOf(p.status);
  if(i < ESTAGIOS.length - 1){
    p.status = ESTAGIOS[i+1];
    p.atualizadoEm = Date.now();
    await salvarPedido(p);
    
    if(p.status === 'entregue'){
      estado.motorista.saldo = (estado.motorista.saldo || 0) + p.precoMotorista;
      mostrarToast(`✅ Entregue! Você recebeu R$ ${p.precoMotorista.toFixed(2)}`);
    } else if(p.status === 'coletado'){
      mostrarToast('✅ Produto recolhido! Segua para entrega.');
    } else if(p.status === 'a_caminho'){
      mostrarToast('✅ A caminho do destino!');
    }
    
    await carregarPedidos();
  }
}

// 🗺️ MAPA
function inicializarMapa(pedido){
  setTimeout(() => {
    const container = document.getElementById('mapa');
    if(!container) return;
    if(estado.mapa) estado.mapa.remove();
    
    estado.mapa = L.map('mapa').setView([pedido.latOrigem, pedido.lngOrigem], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(estado.mapa);
    
    L.marker([pedido.latOrigem, pedido.lngOrigem]).addTo(estado.mapa).bindPopup('📦 Recolha');
    L.marker([pedido.latDestino, pedido.lngDestino]).addTo(estado.mapa).bindPopup('🏠 Entrega');
    
    if(pedido.status !== 'aguardando' && pedido.status !== 'entregue'){
      const latMeio = (pedido.latOrigem + pedido.latDestino) / 2;
      const lngMeio = (pedido.lngOrigem + pedido.lngDestino) / 2;
      L.marker([latMeio, lngMeio], {
        icon: L.divIcon({ html: '<div style="font-size:24px;">🛵</div>', iconSize:[30,30], iconAnchor:[15,15] })
      }).addTo(estado.mapa).bindPopup('🛵 Entregador');
      const dist = pedido.distancia || 2;
      estado.tempoChegada = Math.round(dist * 6) + ' - ' + Math.round(dist * 10) + ' min';
    } else {
      estado.tempoChegada = '--';
    }
    
    estado.mapa.fitBounds([[pedido.latOrigem, pedido.lngOrigem],[pedido.latDestino, pedido.lngDestino]], {padding:[40,40]});
    render();
  }, 100);
}

function trilhaHTML(status){
  const i = ESTAGIOS.indexOf(status);
  let pontos = '';
  ESTAGIOS.forEach((e, idx) => {
    pontos += `<div class="ponto ${idx < i ? 'feito' : ''} ${idx === i ? 'atual' : ''}"></div>`;
    if(idx < ESTAGIOS.length - 1) pontos += `<div class="barra ${idx < i ? 'feito' : ''}"></div>`;
  });
  return `<div class="trilha">${pontos}</div><div class="etiquetas"><span>Pedido</span><span>Coleta</span><span>Recolhido</span><span>Rota</span><span>Entregue</span></div>`;
}

function seloHTML(status){
  if(status === 'aguardando') return `<span class="selo selo-aguardando">Aguardando</span>`;
  if(status === 'entregue') return `<span class="selo selo-entregue">Entregue</span>`;
  return `<span class="selo selo-andamento">${ROTULOS_ESTAGIO[status]}</span>`;
}

// 💬 MODAL DO CHAT
function modalChat(){
  if(!estado.chatAberto) return '';
  const { tipo, pedidoId } = estado.chatAberto;
  const pedido = estado.pedidos.find(p => p.id === pedidoId);
  if(!pedido) return '';
  
  const meuTipo = estado.modo === 'entregador' ? 'motorista' : 'cliente';
  const nomeRemetente = meuTipo === 'motorista' ? estado.motorista.nome : pedido.clienteNome;
  const titulo = tipo === 'motorista' 
    ? (meuTipo === 'cliente' ? `Conversa com ${pedido.motoristaNome || 'Entregador'}` : `Conversa com ${pedido.clienteNome}`)
    : 'Atendimento — Suporte FlashEntregas';
  const corBolha = tipo === 'motorista' 
    ? (meuTipo === 'cliente' ? 'bolha-cliente' : 'bolha-motorista')
    : 'bolha-suporte';

  return `
  <div class="modal-fundo" onclick="if(event.target===this)fecharChat()">
    <div class="modal-chat">
      <div class="chat-topo">
        <h3>${titulo}</h3>
        <button class="chat-fechar" onclick="fecharChat()">✕</button>
      </div>
      <div class="chat-mensagens" id="caixa-mensagens">
        ${estado.mensagens.length === 0 
          ? `<div class="chat-vazio">👋 Comece a conversar!</div>`
          : estado.mensagens.map(m => {
              const minha = m.remetente_tipo === meuTipo;
              const classe = minha ? corBolha : (m.remetente_tipo === 'suporte' ? 'bolha-suporte' : (m.remetente_tipo === 'motorista' ? 'bolha-motorista' : 'bolha-cliente'));
              const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
              return `<div class="bolha ${classe}">${m.texto}<span>${hora}</span></div>`;
            }).join('')
        }
      </div>
      <div class="chat-envio">
        <input type="text" id="entrada-chat" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')enviarMsg()">
        <button class="btn btn-primario btn-pequeno" onclick="enviarMsg()">Enviar</button>
      </div>
    </div>
  </div>
  `;
}

async function enviarMsg(){
  const input = document.getElementById('entrada-chat');
  if(!input || !estado.chatAberto) return;
  const texto = input.value;
  if(!texto.trim()) return;
  
  const { pedidoId } = estado.chatAberto;
  const meuTipo = estado.modo === 'entregador' ? 'motorista' : 'cliente';
  const meuNome = meuTipo === 'motorista' ? estado.motorista.nome : (estado.pedidos.find(p => p.id === pedidoId)?.clienteNome || 'Cliente');
  
  input.value = '';
  await enviarMensagem(pedidoId, meuTipo, meuNome, texto);
  estado.mensagens = await carregarMensagens(pedidoId);
  render();
  setTimeout(() => {
    const caixa = document.getElementById('caixa-mensagens');
    if(caixa) caixa.scrollTop = caixa.scrollHeight;
  }, 30);
}
