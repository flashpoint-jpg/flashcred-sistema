<style>

    --noite:#12141C; --painel:#1B1E29; --painel-alt:#232838; --linha:#2C3143;
    --mango:#FFB627; --mango-escuro:#CC8F14; --chama:#FF5A4E;
    --osso:#F3EFE6; --poeira:#8D93A6; --verde:#4CD787; --azul:#3B82F6; --roxo:#8B5CF6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--noite);color:var(--osso);font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 15% 0%, rgba(255,182,39,0.08), transparent 40%),var(--noite);padding-bottom:20px;}

  header.topo{padding:20px 20px 16px;position:relative;text-align:center;}
  .marca{display:flex;flex-direction:column;align-items:center;gap:0;}
  .marca .logo-img{width:min(58%,220px);height:auto;filter:drop-shadow(0 6px 18px rgba(255,182,39,0.25));}
  .tagline{font-size:11.5px;color:var(--poeira);margin:8px 0 0;letter-spacing:1px;text-transform:uppercase;font-weight:600;text-align:center;}

  .toggle-modo{display:flex;margin:18px 20px 4px;background:var(--painel);border-radius:14px;padding:4px;border:1px solid var(--linha);}
  .toggle-modo button{flex:1;padding:11px 0;border:none;background:transparent;color:var(--poeira);font-family:'Barlow';font-weight:700;font-size:14px;border-radius:10px;cursor:pointer;letter-spacing:0.3px;}
  .toggle-modo button.ativo{background:var(--mango);color:var(--noite);}

  .aviso{margin:14px 20px 0;font-size:11.5px;color:var(--poeira);background:var(--painel);border:1px solid var(--linha);border-left:3px solid var(--mango);padding:10px 12px;border-radius:8px;line-height:1.5;}

  main{flex:1;padding:18px 20px 10px;}
  .cartao{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px;}
  .cartao h2{font-family:'Archivo Black';font-size:15px;margin:0 0 14px;text-transform:uppercase;letter-spacing:0.5px;color:var(--osso);}
  label{display:block;font-size:12px;font-weight:600;color:var(--poeira);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.4px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--linha);background:var(--painel-alt);color:var(--osso);font-family:'Barlow';font-size:14.5px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--mango);}
  textarea{resize:vertical;min-height:56px;}
  .veiculos{display:flex;gap:6px;}
  .veiculos button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--linha);background:var(--painel-alt);color:var(--poeira);font-family:'Barlow';font-weight:600;font-size:11.5px;cursor:pointer;}
  .veiculos button.sel{border-color:var(--mango);color:var(--mango);background:rgba(255,182,39,0.08);}
  .veiculos button .emoji{display:block;font-size:18px;margin-bottom:3px;}
  .sugestoes:not(:empty){border:1px solid var(--linha);border-radius:8px;overflow:hidden;margin-top:6px;}
  .sugestao-item{padding:10px 12px;font-size:12.5px;background:var(--painel-alt);cursor:pointer;border-bottom:1px solid var(--linha);}
  .sugestao-item:last-child{border-bottom:none;}
  .sugestao-item:hover, .sugestao-item:active{background:var(--linha);}
  .sugestao-vazia{padding:10px 12px;font-size:11.5px;color:var(--poeira);background:var(--painel-alt);}

  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;border:none;font-family:'Barlow';font-weight:700;font-size:15px;letter-spacing:0.3px;cursor:pointer;margin-top:14px;}
  .btn-primario{background:var(--mango);color:var(--noite);}
  .btn-primario:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-secundario{background:transparent;border:1px solid var(--linha);color:var(--osso);}
  .btn-verde{background:var(--verde);color:var(--noite);}
  .btn-azul{background:var(--azul);color:#fff;}
  .btn-pequeno{width:auto;padding:8px 14px;font-size:12.5px;margin-top:0;border-radius:8px;}

  .estimativa{display:flex;align-items:baseline;justify-content:space-between;background:var(--painel-alt);border-radius:10px;padding:14px;margin-top:14px;}
  .estimativa .valor{font-family:'Archivo Black';font-size:24px;color:var(--mango);}
  .estimativa .rotulo{font-size:11px;color:var(--poeira);text-transform:uppercase;letter-spacing:0.5px;}
  .estimativa .sub{font-size:11px;color:var(--poeira);margin-top:2px;}

  .pedido{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:15px;margin-bottom:12px;}
  .pedido .linha-topo{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
  .pedido .end{font-size:13.5px;color:var(--osso);line-height:1.4;}
  .pedido .end b{color:var(--poeira);font-weight:600;font-size:11px;text-transform:uppercase;display:block;letter-spacing:0.4px;margin-bottom:1px;}
  .pedido .preco{font-family:'Archivo Black';font-size:17px;color:var(--mango);white-space:nowrap;text-align:right;}
  .pedido .preco .ganho{display:block;font-family:'Barlow';font-size:10.5px;color:var(--verde);font-weight:700;margin-top:2px;}
  .selo{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.4px;}
  .selo-aguardando,.selo-buscando{background:rgba(255,90,78,0.15);color:var(--chama);}
  .selo-andamento{background:rgba(255,182,39,0.15);color:var(--mango);}
  .selo-entregue{background:rgba(76,215,135,0.15);color:var(--verde);}

  .trilha{display:flex;align-items:center;margin:14px 0 6px;}
  .trilha .ponto{width:8px;height:8px;border-radius:50%;background:var(--linha);flex-shrink:0;}
  .trilha .barra{flex:1;height:2px;background:var(--linha);}
  .trilha .ponto.feito,.trilha .barra.feito{background:var(--mango);}
  .trilha .ponto.atual{background:var(--mango);box-shadow:0 0 0 4px rgba(255,182,39,0.25);animation:pulso 1.6s infinite;}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,182,39,0.4);}70%{box-shadow:0 0 0 8px rgba(255,182,39,0);}100%{box-shadow:0 0 0 0 rgba(255,182,39,0);}}
  .etiquetas{display:flex;justify-content:space-between;font-size:8.5px;color:var(--poeira);text-transform:uppercase;letter-spacing:0.2px;margin-top:5px;}
  .etiquetas span{flex:1;text-align:center;}
  .etiquetas span:first-child{text-align:left;}
  .etiquetas span:last-child{text-align:right;}

  .mapa{width:100%;height:180px;border-radius:10px;margin-top:12px;background:var(--painel-alt);}
  .eta{font-size:11.5px;color:var(--poeira);margin-top:6px;display:flex;justify-content:space-between;}
  .eta b{color:var(--mango);}
  .eta-banner{background:linear-gradient(135deg,rgba(255,182,39,0.15),rgba(255,90,78,0.1));border:1px solid var(--mango);border-radius:12px;padding:12px 14px;margin-top:12px;text-align:center;}
  .eta-banner .eta-min{font-family:'Archivo Black';font-size:22px;color:var(--mango);}
  .eta-banner .eta-sub{font-size:11px;color:var(--poeira);margin-top:2px;}

  .vazio{text-align:center;padding:34px 10px;color:var(--poeira);font-size:13.5px;line-height:1.6;}
  .vazio .emoji-grande{font-size:32px;display:block;margin-bottom:10px;}

  .buscando-box{text-align:center;padding:26px 20px;background:rgba(255,182,39,0.05);border:1px solid rgba(255,182,39,0.3);border-radius:16px;margin:4px 0 16px;}
  .buscando-icone{font-size:42px;margin-bottom:10px;animation:pulsar 1.2s infinite ease-in-out;}
  @keyframes pulsar{0%{transform:scale(1);opacity:1;}50%{transform:scale(1.15);opacity:0.7;}100%{transform:scale(1);opacity:1;}}
  .buscando-texto{font-size:15px;font-weight:700;color:var(--mango);margin-bottom:4px;}
  .buscando-sub{font-size:12.5px;color:var(--poeira);}

  .a-caminho-icone{font-size:30px;display:inline-block;animation:deslizar 2s infinite ease-in-out;}
  @keyframes deslizar{0%{transform:translateX(-6px);}50%{transform:translateX(6px);}100%{transform:translateX(-6px);}}

  .saldo-card{background:linear-gradient(135deg,var(--verde),#34b977);color:#0d1a12;border-radius:14px;padding:18px;text-align:center;margin-bottom:16px;}
  .saldo-card .valor-saldo{font-family:'Archivo Black';font-size:26px;}
  .saldo-card .rotulo-saldo{font-size:11px;text-transform:uppercase;opacity:0.75;letter-spacing:0.4px;margin-top:2px;}

  .rodape-motorista{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--painel-alt);border:1px solid var(--mango);color:var(--osso);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.4);}

  .alerta-motorista{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:452px;background:linear-gradient(135deg,var(--mango),var(--chama));color:var(--noite);border-radius:14px;padding:14px 16px;z-index:400;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);animation:entrarAlerta 0.4s ease-out;cursor:pointer;}
  @keyframes entrarAlerta{0%{transform:translate(-50%,-30px);opacity:0;}100%{transform:translate(-50%,0);opacity:1;}}
  .alerta-motorista .alerta-emoji{font-size:28px;flex-shrink:0;animation:balancar 0.7s infinite ease-in-out;}
  @keyframes balancar{0%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}100%{transform:rotate(-8deg);}}
  .alerta-motorista .alerta-texto{flex:1;line-height:1.3;}
  .alerta-motorista .alerta-titulo{font-family:'Archivo Black';font-size:13.5px;text-transform:uppercase;letter-spacing:0.3px;}
  .alerta-motorista .alerta-sub{font-size:11.5px;font-weight:600;opacity:0.85;margin-top:2px;}
  .alerta-motorista .alerta-fechar{background:rgba(18,20,28,0.2);border:none;color:var(--noite);width:24px;height:24px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;flex-shrink:0;}

  .foto-bloco{margin-top:10px;}
  .foto-bloco .foto-legenda{font-size:10.5px;color:var(--poeira);text-transform:uppercase;letter-spacing:0.4px;font-weight:700;margin-bottom:5px;}
  .foto-item{position:relative;display:inline-block;cursor:pointer;}
  .foto-item img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--linha);display:block;}
  .foto-item .foto-lupa{position:absolute;bottom:3px;right:3px;background:rgba(18,20,28,0.7);color:#fff;font-size:10px;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .foto-fundo{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
  .foto-fundo img{max-width:100%;max-height:85vh;border-radius:10px;}
  .foto-fundo .foto-fechar{position:absolute;top:18px;right:18px;background:var(--painel);border:1px solid var(--linha);color:var(--osso);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;}

  .campo-motorista{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px;}
  .subtitulo{font-size:12px;color:var(--poeira);margin:-6px 0 14px;line-height:1.5;}
  .refresh{font-size:11px;color:var(--poeira);text-align:right;margin:-6px 0 12px;cursor:pointer;text-decoration:underline;}

  .botao-chat{position:relative;display:inline-flex;align-items:center;gap:6px;}
  .notif-bolinha{position:absolute;top:-7px;right:-7px;background:var(--chama);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
  .modal-chat{width:100%;max-width:480px;background:var(--painel);border-radius:20px 20px 0 0;max-height:80vh;display:flex;flex-direction:column;border:1px solid var(--linha);}
  .chat-topo{padding:16px 18px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;}
  .chat-topo h3{font-size:14px;text-transform:uppercase;margin:0;font-family:'Archivo Black';letter-spacing:0.3px;}
  .chat-fechar{background:none;border:none;color:var(--poeira);font-size:22px;cursor:pointer;line-height:1;}
  .chat-mensagens{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:45vh;}
  .bolha{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.4;}
  .bolha span{font-size:9.5px;opacity:0.65;margin-top:3px;display:block;text-align:right;}
  .bolha-eu{background:var(--mango);color:var(--noite);border-bottom-right-radius:4px;align-self:flex-end;}
  .bolha-outro{background:var(--painel-alt);color:var(--osso);border-bottom-left-radius:4px;align-self:flex-start;border:1px solid var(--linha);}
  .chat-vazio{text-align:center;padding:26px;color:var(--poeira);font-size:12.5px;}
  .chat-envio{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--linha);}
  .chat-envio input{flex:1;}
  .chat-envio button{background:var(--mango);border:none;color:var(--noite);border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer;}

  /* ---- cadastro de motorista (wizard) ---- */
  .passos{display:flex;gap:5px;margin-bottom:16px;}
  .passos .p{flex:1;height:4px;border-radius:3px;background:var(--linha);}
  .passos .p.feito{background:var(--mango);}
  .passos .p.atual{background:var(--mango);opacity:0.5;}
  .etapa-titulo{font-family:'Archivo Black';font-size:14px;text-transform:uppercase;margin:0 0 4px;letter-spacing:0.3px;}
  .etapa-sub{font-size:11.5px;color:var(--poeira);margin:0 0 14px;line-height:1.5;}
  .link-alt{text-align:center;font-size:12.5px;color:var(--poeira);margin-top:14px;}
  .link-alt a{color:var(--mango);text-decoration:none;font-weight:700;cursor:pointer;}
  .erro-campo{font-size:12px;color:var(--chama);margin-top:8px;}
  .upload-slot{border:1.5px dashed var(--linha);border-radius:12px;padding:16px;text-align:center;cursor:pointer;margin-top:8px;}
  .upload-slot.feito{border-style:solid;border-color:var(--verde);}
  .upload-slot .up-emoji{font-size:22px;display:block;margin-bottom:6px;}
  .upload-slot .up-texto{font-size:12px;color:var(--poeira);font-weight:600;}
  .upload-slot.feito .up-texto{color:var(--verde);}
  .upload-slot img{width:100%;max-height:110px;object-fit:cover;border-radius:8px;margin-top:8px;}
  .pix-box{text-align:center;padding:6px 0;}
  .pix-qr{width:190px;height:190px;margin:8px auto;border-radius:12px;border:6px solid #fff;background:#fff;display:block;}
  .pix-copia{display:flex;gap:8px;margin-top:12px;}
  .pix-copia input{flex:1;font-size:11px;}
  .pix-status{margin-top:14px;padding:12px;border-radius:10px;font-size:13px;font-weight:700;}
  .pix-status.aguardando{background:rgba(255,182,39,0.1);color:var(--mango);}
  .pix-status.pago{background:rgba(76,215,135,0.12);color:var(--verde);}
  .spin{display:inline-block;animation:girar 1s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}
  .box-status{text-align:center;padding:38px 18px;}
  .box-status .bs-emoji{font-size:40px;display:block;margin-bottom:12px;}
  .box-status .bs-titulo{font-family:'Archivo Black';font-size:15px;margin-bottom:8px;text-transform:uppercase;}
  .box-status .bs-texto{font-size:13px;color:var(--poeira);line-height:1.6;}

  .admin-link{text-align:center;font-size:10px;color:var(--linha);margin:10px 0 -6px;cursor:pointer;user-select:none;}
  .admin-cartao{background:var(--painel-alt);border:1px solid var(--linha);border-radius:12px;padding:14px;margin-bottom:12px;}
  .admin-cartao .am-linha{display:flex;justify-content:space-between;font-size:12px;color:var(--poeira);margin-top:4px;}
  .admin-cartao .am-linha b{color:var(--osso);}
  .admin-docs{display:flex;gap:8px;margin:10px 0;}
  .admin-docs img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--linha);cursor:pointer;}
</style>
</head>

function distanciaKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=paraRad(lat2-lat1), dLon=paraRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(paraRad(lat1))*Math.cos(paraRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
async function geocodificar(endereco){
  const q = endereco.toLowerCase().includes('mg') ? endereco : endereco+', Muzambinho, MG';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=1`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    if(!dados||dados.length===0) return null;
    const lat=parseFloat(dados[0].lat), lon=parseFloat(dados[0].lon);
    if(lat<REGIAO.minLat||lat>REGIAO.maxLat||lon<REGIAO.minLon||lon>REGIAO.maxLon) return null;
    return {lat,lon};
  }catch(e){ console.error(e); return null; }
}
function precoDeDistancia(veiculo, km){
  const v=VEICULOS[veiculo];
  return Math.round((v.base+v.km*km)*100)/100;
}
function ganhoMotorista(preco){ return Math.round(preco*(1-TAXA_PLATAFORMA)*100)/100; }

async function buscarSugestoes(campo){
  const inputEl = document.getElementById('c-'+campo);
  const cont = document.getElementById('sugestoes-'+campo);
  if(!inputEl || !cont) return;
  const texto = inputEl.value.trim();
  if(texto.length<4){ cont.innerHTML=''; estado.sugestoesTemp[campo]=[]; return; }
  cont.innerHTML = `<div class="sugestao-vazia">Buscando endereços...</div>`;
  const q = texto.toLowerCase().includes('mg') ? texto : texto+', Muzambinho, MG';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=5`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    // o campo pode ter mudado enquanto a busca corria - confere se ainda é o texto atual
    if(document.getElementById('c-'+campo).value.trim() !== texto) return;
    if(!dados || dados.length===0){ cont.innerHTML = `<div class="sugestao-vazia">Nenhum endereço encontrado na região de Muzambinho.</div>`; return; }
    estado.sugestoesTemp[campo] = dados.map(d=>({
      lat: parseFloat(d.lat), lon: parseFloat(d.lon),
      nome: d.display_name.split(',').slice(0,4).join(',').trim()
    }));
    cont.innerHTML = estado.sugestoesTemp[campo].map((s,idx)=>
      `<div class="sugestao-item" onclick="selecionarSugestao('${campo}',${idx})">📍 ${s.nome}</div>`
    ).join('');
  }catch(e){ console.error(e); cont.innerHTML=''; }
}
function selecionarSugestao(campo, idx){
  const s = estado.sugestoesTemp[campo] && estado.sugestoesTemp[campo][idx];
  if(!s) return;
  const inputEl = document.getElementById('c-'+campo);
  if(inputEl) inputEl.value = s.nome;
  estado.form[campo] = s.nome;
  estado.form[campo+'Coord'] = { lat:s.lat, lon:s.lon };
  const cont = document.getElementById('sugestoes-'+campo);
  if(cont) cont.innerHTML='';
  estado.sugestoesTemp[campo] = [];
  autoCalcularSeCompleto();
}
function autoCalcularSeCompleto(){
  if(estado.form.origemCoord && estado.form.destinoCoord) calcularCorrida();
}

// ---------- aviso sonoro + visual: motorista encontrado ----------
function tocarSomAlerta(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const tocarNota=(freq,inicio,duracao)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime+inicio);
      gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime+inicio+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+inicio+duracao);
      osc.start(ctx.currentTime+inicio); osc.stop(ctx.currentTime+inicio+duracao+0.05);
    };
    tocarNota(740,0,0.16); tocarNota(988,0.16,0.22);
  }catch(e){ console.warn('audio indisponível', e); }
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}
function dispararAlertaMotorista(pedido){
  estado.alertaMotorista = { nome: pedido.motoristaNome||'Um entregador', pedidoId: pedido.id };
  render();
  tocarSomAlerta();
  clearTimeout(window._alertaMotoristaTimer);
  window._alertaMotoristaTimer = setTimeout(()=>{ estado.alertaMotorista=null; render(); }, 7000);
}
function fecharAlertaMotorista(){ clearTimeout(window._alertaMotoristaTimer); estado.alertaMotorista=null; render(); }
function detectarMotoristaEncontrado(novos){
  if(estado.modo!=='cliente' || !estado.filtroTelefoneCliente) return;
  novos.forEach(np=>{
    if(np.clienteTelefone!==estado.filtroTelefoneCliente) return;
    const anterior = estado.statusAnterior[np.id];
    if(anterior==='buscando' && np.status!=='buscando'){
      dispararAlertaMotorista(np);
    }
    estado.statusAnterior[np.id] = np.status;
  });
}

function paraCamposApp(row){
  return {
    id:row.id, clienteNome:row.cliente_nome, clienteTelefone:row.cliente_telefone,
    motoristaNome:row.motorista_nome||'', motoristaTelefone:row.motorista_telefone||'',
    origem:row.origem, destino:row.destino,
    origemCoord:(row.origem_lat!=null&&row.origem_lng!=null)?{lat:row.origem_lat,lon:row.origem_lng}:null,
    destinoCoord:(row.destino_lat!=null&&row.destino_lng!=null)?{lat:row.destino_lat,lon:row.destino_lng}:null,
    motoristaCoord:(row.motorista_lat!=null&&row.motorista_lng!=null)?{lat:row.motorista_lat,lon:row.motorista_lng}:null,
    fotoAntesUrl: row.foto_antes_url || null, fotoDepoisUrl: row.foto_depois_url || null,
    veiculo:row.veiculo, descricao:row.descricao||'',
    distancia:Number(row.distancia)||0, preco:Number(row.preco)||0,
    status:row.status, criadoEm:Number(row.criado_em), atualizadoEm:Number(row.atualizado_em)
  };
}
function paraCamposDB(p){
  return {
    id:p.id, cliente_nome:p.clienteNome, cliente_telefone:p.clienteTelefone,
    motorista_nome:p.motoristaNome||null, motorista_telefone:p.motoristaTelefone||null,
    origem:p.origem, destino:p.destino,
    origem_lat:p.origemCoord?p.origemCoord.lat:null, origem_lng:p.origemCoord?p.origemCoord.lon:null,
    destino_lat:p.destinoCoord?p.destinoCoord.lat:null, destino_lng:p.destinoCoord?p.destinoCoord.lon:null,
    veiculo:p.veiculo, descricao:p.descricao||null, distancia:p.distancia, preco:p.preco,
    status:p.status, criado_em:p.criadoEm, atualizado_em:p.atualizadoEm,
    foto_antes_url:p.fotoAntesUrl||null, foto_depois_url:p.fotoDepoisUrl||null
  };
}

async function carregarPedidos(){
  try{
    const {data,error} = await sb.from('entrega_pedidos').select('*').order('criado_em',{ascending:false});
    if(error){
      console.error(error);
      if(!estado.erroMostrado){ estado.erroMostrado=true; mostrarToast('Erro ao ligar à base de dados: '+(error.message||'verifica a ligação')); }
      return;
    }
    estado.erroMostrado = false;
    const novos = (data||[]).map(paraCamposApp);
    const novoJSON = JSON.stringify(novos);
    if(novoJSON===estado.ultimoPedidosJSON){ estado.carregando=false; return; }
    detectarMotoristaEncontrado(novos);
    estado.pedidos=novos; estado.ultimoPedidosJSON=novoJSON; estado.carregando=false;
    render();
  }catch(e){
    console.error(e);
    if(!estado.erroMostrado){ estado.erroMostrado=true; mostrarToast('Falha de ligação à internet ou à base de dados.'); }
  }
}
async function salvarPedido(p){
  const {error} = await sb.from('entrega_pedidos').upsert(paraCamposDB(p));
  if(error){ console.error(error); mostrarToast('Erro ao gravar o pedido.'); }
  estado.ultimoPedidosJSON='';
}

// ---------- ações ----------
async function calcularCorrida(){
  const f = estado.form;
  if(!f.origem || !f.destino){ mostrarToast('Preenche recolha e destino primeiro.'); return; }
  estado.calculando = true; estado.falhaCalculo = false; render();
  const origemCoord = f.origemCoord || await geocodificar(f.origem);
  const destinoCoord = f.destinoCoord || await geocodificar(f.destino);
  estado.calculando = false;
  if(!origemCoord || !destinoCoord){
    f.distancia=null; f.origemCoord=null; f.destinoCoord=null;
    estado.falhaCalculo = true;
    mostrarToast('Não achei o endereço automaticamente. Informa a distância manualmente abaixo.');
    render(); return;
  }
  const kmReal = distanciaKm(origemCoord.lat,origemCoord.lon,destinoCoord.lat,destinoCoord.lon)*1.3;
  f.distancia = Math.round(kmReal*10)/10;
  f.origemCoord = origemCoord; f.destinoCoord = destinoCoord;
  const veloc = VEICULOS[f.veiculo].veloc;
  f.duracaoMin = Math.max(3, Math.round((f.distancia/veloc)*60));
  render();
}

function usarDistanciaManual(){
  const input = document.getElementById('c-distancia-manual');
  const km = parseFloat(input.value);
  if(!km || km<=0){ mostrarToast('Informa um número de km válido.'); return; }
  estado.form.distancia = Math.round(km*10)/10;
  estado.form.origemCoord = null;
  estado.form.destinoCoord = null;
  const veloc = VEICULOS[estado.form.veiculo].veloc;
  estado.form.duracaoMin = Math.max(3, Math.round((estado.form.distancia/veloc)*60));
  estado.falhaCalculo = false;
  render();
}

async function criarPedido(){
  const f = estado.form;
  if(!f.nome||!f.telefone||!f.origem||!f.destino){ mostrarToast('Preenche nome, telefone, recolha e destino.'); return; }
  if(f.distancia==null){ mostrarToast('Calcula a corrida primeiro.'); return; }
  const preco = precoDeDistancia(f.veiculo, f.distancia);
  const agora = Date.now();
  const pedido = {
    id:'p'+agora+Math.floor(Math.random()*1000),
    clienteNome:f.nome, clienteTelefone:f.telefone,
    origem:f.origem, destino:f.destino, origemCoord:f.origemCoord, destinoCoord:f.destinoCoord,
    veiculo:f.veiculo, descricao:f.descricao, distancia:f.distancia, preco:preco,
    status:'buscando', motoristaNome:'', motoristaTelefone:'', criadoEm:agora, atualizadoEm:agora
  };
  await salvarPedido(pedido);
  estado.filtroTelefoneCliente = f.telefone;
  estado.form = { nome:f.nome, telefone:f.telefone, origem:'', destino:'', veiculo:'moto', descricao:'', distancia:null, duracaoMin:null, origemCoord:null, destinoCoord:null };
  mostrarToast('Pedido criado! Buscando um entregador...');
  await carregarPedidos();
}

async function aceitarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const { error } = await sb.from('entrega_pedidos').update({
    status:'indo_coletar', motorista_nome: estado.motorista.nome, motorista_telefone: estado.motorista.telefone, atualizado_em: Date.now()
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao aceitar o pedido.'); return; }
  estado.ultimoPedidosJSON='';
  mostrarToast('Pedido aceito! Toca em "Abrir GPS" para navegar.');
  iniciarRastreioMotorista();
  await carregarPedidos();
}

async function avancarStatus(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const i = ESTAGIOS.indexOf(p.status);
  if(i < ESTAGIOS.length-1){
    const novoStatus = ESTAGIOS[i+1];
    const agora = Date.now();
    const { error } = await sb.from('entrega_pedidos').update({ status: novoStatus, atualizado_em: agora }).eq('id', id);
    if(error){ console.error(error); mostrarToast('Erro ao atualizar o pedido.'); return; }
    estado.ultimoPedidosJSON='';
    if(novoStatus==='entregue'){
      pararRastreioMotorista();
      mostrarToast(`Entrega concluída! R$ ${ganhoMotorista(p.preco).toFixed(2)} creditado.`);
    }
    await carregarPedidos();
  }
}

// ---------- rastreio ao vivo ----------
function iniciarRastreioMotorista(){
  if(!navigator.geolocation || watchId!=null) return;
  watchId = navigator.geolocation.watchPosition(
    (pos)=>{ ultimaPosicaoMotorista = { lat:pos.coords.latitude, lon:pos.coords.longitude }; },
    (err)=>{ console.warn(err); },
    { enableHighAccuracy:true, maximumAge:10000 }
  );
  if(!window._envioIntervalo) window._envioIntervalo = setInterval(enviarPosicaoMotorista, 15000);
}
function pararRastreioMotorista(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }
async function enviarPosicaoMotorista(){
  if(!ultimaPosicaoMotorista || !estado.motorista.ativo) return;
  const ativo = estado.pedidos.find(p=>p.motoristaTelefone===estado.motorista.telefone && p.status!=='buscando' && p.status!=='entregue');
  if(!ativo) return;
  await sb.from('entrega_pedidos').update({
    motorista_lat: ultimaPosicaoMotorista.lat, motorista_lng: ultimaPosicaoMotorista.lon, motorista_atualizado_em: Date.now()
  }).eq('id', ativo.id);
  estado.ultimoPedidosJSON='';
}

// ---------- mapa ----------
function montarMapa(containerId, pedido){
  setTimeout(()=>{
    const el = document.getElementById(containerId);
    if(!el || !pedido.origemCoord || !pedido.destinoCoord) return;
    if(mapasAtivos[containerId]){ try{ mapasAtivos[containerId].remove(); }catch(e){} }
    const map = L.map(containerId,{zoomControl:false, attributionControl:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const pO=[pedido.origemCoord.lat,pedido.origemCoord.lon], pD=[pedido.destinoCoord.lat,pedido.destinoCoord.lon];
    L.marker(pO,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#FF5A4E;border:2px solid #fff"></div>'})}).addTo(map);
    L.marker(pD,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#4CD787;border:2px solid #fff"></div>'})}).addTo(map);
    const pontos=[pO,pD];
    // linha do percurso planejado (recolha -> entrega), fina e discreta
    L.polyline([pO,pD],{color:'#8D93A6',weight:2,opacity:0.35,dashArray:'5,7'}).addTo(map);
    if(pedido.motoristaCoord){
      const pM=[pedido.motoristaCoord.lat,pedido.motoristaCoord.lon];
      const alvo = (pedido.status==='indo_coletar') ? pO : pD;
      // linha do trajeto do motorista até o próximo destino - se move conforme ele se aproxima
      L.polyline([pM,alvo],{color:'#FFB627',weight:5,opacity:0.9,lineCap:'round'}).addTo(map);
      L.marker(pM,{icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#FFB627;border:2px solid #fff;box-shadow:0 0 0 4px rgba(255,182,39,0.3)"></div>'})}).addTo(map);
      pontos.push(pM);
    }
    map.fitBounds(pontos,{padding:[24,24]});
    mapasAtivos[containerId]=map;
  },30);
}
function etaHTML(pedido){
  if(!pedido.motoristaCoord) return `<div class="subtitulo" style="margin-top:8px">Aguardando o entregador iniciar a rota...</div>`;
  const alvo = (pedido.status==='indo_coletar') ? pedido.origemCoord : pedido.destinoCoord;
  if(!alvo) return '';
  const km = distanciaKm(pedido.motoristaCoord.lat,pedido.motoristaCoord.lon,alvo.lat,alvo.lon);
  const min = Math.max(1, Math.round((km/VEICULOS[pedido.veiculo].veloc)*60));
  const txt = pedido.status==='indo_coletar' ? 'até a coleta' : 'até o teu endereço';
  return `<div class="eta-banner"><div class="eta-min">~${min} min</div><div class="eta-sub">${km.toFixed(1)} km ${txt} · atualizado em tempo real</div></div>`;
}

function cartaoPedidoAtivo(p){
  const i = ESTAGIOS.indexOf(p.status);
  const proximo = i<ESTAGIOS.length-1 ? ESTAGIOS[i+1] : null;
  const enderecoGPS = (p.status==='indo_coletar') ? p.origem : p.destino;
  const mapaId = 'mapa-m-'+p.id;
  let botaoAcao = '';
  if(p.status==='indo_coletar'){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="solicitarFoto('${p.id}','antes')">📷 Cheguei / tirar foto e recolher</button>`;

    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="avancarStatus('${p.id}')">Segui viagem</button>`;
  } else if(p.status==='a_caminho'){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="solicitarFoto('${p.id}','depois')">📷 Tirar foto e marcar entregue</button>`;
  }
  return `
  <div class="pedido">
    <div class="linha-topo">
      <div class="end"><b>Recolha</b>${p.origem}<b style="margin-top:8px">Entrega</b>${p.destino}</div>
      <div class="preco">R$ ${p.preco.toFixed(2)}<span class="ganho">você recebe R$ ${ganhoMotorista(p.preco).toFixed(2)}</span></div>

    ${trilhaHTML(p.status)}

    ${fotosHTML(p)}

      <button class="btn btn-azul btn-pequeno" onclick="abrirGPS('${enderecoGPS.replace(/'/g,"\\'")}')">📍 GPS</button>
      ${botaoChatHTML(p.id, 0)}
      ${proximo ? botaoAcao : ''}
    </div>
  </div>`;
}
function fotosHTML(p){
  if(!p.fotoAntesUrl && !p.fotoDepoisUrl) return '';

function pixCorpoHTML(c){
  if(c.pix.gerando) return `<div class="pix-box"><span class="spin" style="font-size:26px">⏳</span><div class="subtitulo" style="margin-top:8px">A gerar a cobrança PIX...</div></div>`;

function telaMotorista(){
  const m = estado.motorista;
  if(!m.ativo){
    return telaAcessoMotorista();
  }
  const disponiveis = estado.pedidos.filter(p=>p.status==='buscando');
  const ativos = estado.pedidos.filter(p=>p.status!=='buscando' && p.status!=='entregue' && p.motoristaTelefone===m.telefone);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const entreguesHojeArr = estado.pedidos.filter(p=>p.status==='entregue' && p.motoristaTelefone===m.telefone && p.atualizadoEm>=hoje.getTime());
  const ganhosHoje = entreguesHojeArr.reduce((s,p)=>s+ganhoMotorista(p.preco),0);
  return `
  <div class="saldo-card">
    <div class="valor-saldo">R$ ${ganhosHoje.toFixed(2)}</div>
    <div class="rotulo-saldo">Creditado hoje · ${entreguesHojeArr.length} entregas</div>
  </div>
  <div class="rodape-motorista">
    <div style="font-size:12px;color:var(--poeira)">Ligado como <b style="color:var(--osso)">${m.nome}</b></div>
    <button class="btn btn-secundario btn-pequeno" onclick="sairMotorista()">Sair</button>
  </div>
  ${ativos.length>0 ? `<div class="cartao"><h2>Em curso</h2>${ativos.map(cartaoPedidoAtivo).join('')}</div>` : ''}
  <div class="cartao">
    <h2>Pedidos disponíveis</h2>
    ${disponiveis.length===0
      ? `<div class="vazio"><span class="emoji-grande">🛵</span>Sem pedidos por agora.</div>`
      : disponiveis.map(cartaoPedidoDisponivel).join('')
    }
  </div>`;
}

        </div>
      </div>
    </div>` : ''}
    <input type="file" id="input-foto" accept="image/*" capture="environment" style="display:none" onchange="processarFotoSelecionada(this)">
  `;
  const bind=(id,path)=>{ const el=document.getElementById(id); if(el) el.addEventListener('input',(e)=>setDeep(path,e.target.value)); };
  bind('c-nome','form.nome'); bind('c-telefone','form.telefone'); bind('c-origem','form.origem');
  bind('c-destino','form.destino'); bind('c-descricao','form.descricao');
  ['origem','destino'].forEach(campo=>{
    const el = document.getElementById('c-'+campo);
    if(el){
      el.addEventListener('input', ()=> debounce(campo, ()=>buscarSugestoes(campo)));
      el.addEventListener('blur', ()=> setTimeout(()=>{ const c=document.getElementById('sugestoes-'+campo); if(c) c.innerHTML=''; }, 200));
    }
  });

  estado.pedidos.forEach(p=>{
    if(estado.modo==='cliente' && p.clienteTelefone===estado.filtroTelefoneCliente && p.status!=='buscando' && p.status!=='entregue' && p.origemCoord && p.destinoCoord){
      montarMapa('mapa-c-'+p.id, p);
    }
    if(estado.modo==='entregador' && estado.motorista.ativo && p.motoristaTelefone===estado.motorista.telefone && p.status!=='buscando' && p.status!=='entregue' && p.origemCoord && p.destinoCoord){
      montarMapa('mapa-m-'+p.id, p);
    }
  });
  if(estado.chatAberto) renderChat();
}

function setDeep(path,value){
  const parts=path.split('.'); let obj=estado;
  for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts[parts.length-1]]=value;
  if(path==='form.origem'||path==='form.destino'){ estado.form.distancia=null; estado.form.origemCoord=null; estado.form.destinoCoord=null; }
}
function mudarVeiculo(k){
  estado.form.veiculo=k;
  if(estado.form.distancia!=null){ estado.form.duracaoMin = Math.max(3, Math.round((estado.form.distancia/VEICULOS[k].veloc)*60)); }
  render();
}
function mudarModo(m){ estado.modo=m; estado.ultimoPedidosJSON=''; render(); carregarPedidos(); }

// =================== CADASTRO DE MOTORISTA (wizard) ===================
async function hashSenha(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function irParaCadastro(){ estado.painelMotorista.tela='cadastro'; estado.painelMotorista.cadastro.etapa=1; estado.painelMotorista.cadastro.erroEtapa=''; render(); }
function irParaLogin(){ estado.painelMotorista.tela='entrar'; estado.painelMotorista.loginErro=''; render(); }

async function loginMotorista(){
  const pm = estado.painelMotorista;
  const telefone = document.getElementById('lm-telefone')?.value.trim();
  const senha = document.getElementById('lm-senha')?.value || '';
  if(!telefone||!senha){ pm.loginErro='Preenche telefone e senha.'; render(); return; }
  pm.loginErro='';
  const senhaHash = await hashSenha(senha);
  const { data, error } = await sb.from('entrega_motoristas').select('*').eq('telefone', telefone).maybeSingle();
  if(error){ pm.loginErro='Erro ao consultar o cadastro. Tenta novamente.'; render(); return; }
  if(!data){ pm.loginErro='Não encontrámos cadastro com este telefone. Cadastra-te abaixo.'; render(); return; }
  if(data.senha_hash !== senhaHash){ pm.loginErro='Senha incorreta.'; render(); return; }
  if(data.status==='incompleto'){ pm.loginErro='O teu cadastro ficou incompleto. Cadastra-te novamente.'; render(); return; }
  if(data.status==='pendente'){ pm.tela='pendente'; render(); return; }
  if(data.status==='reprovado'){ pm.tela='reprovado'; pm.motivoReprovacao=data.motivo_reprovacao||'Não foi indicado um motivo.'; render(); return; }
  // aprovado
  estado.motorista = { nome:data.nome, telefone:data.telefone, ativo:true };
  estado.ultimoPedidosJSON='';
  await carregarPedidos();
  render();
  iniciarRastreioMotorista();
}

async function salvarEtapaCadastro(campos){
  const c = estado.painelMotorista.cadastro;
  const agora = Date.now();
  if(!c.id){ c.id = 'mot'+agora+Math.floor(Math.random()*1000); }
  const base = { id:c.id, criado_em: c.criadoEm||agora, atualizado_em: agora };
  if(c.nome) base.nome = c.nome;
  if(c.cpf) base.cpf = c.cpf;
  if(c.telefone) base.telefone = c.telefone;
  if(c.cidade) base.cidade = c.cidade;
  if(c.senhaHash) base.senha_hash = c.senhaHash;
  const linha = Object.assign(base, campos);
  const { error } = await sb.from('entrega_motoristas').upsert(linha);
  if(error){ console.error(error); mostrarToast('Erro ao gravar o cadastro: '+(error.message||'')); return false; }
  c.criadoEm = c.criadoEm || agora;
  return true;
}

async function avancarEtapa1(){
  const c = estado.painelMotorista.cadastro;
  c.nome = document.getElementById('cm-nome').value.trim();
  c.cpf = document.getElementById('cm-cpf').value.trim();
  c.telefone = document.getElementById('cm-telefone').value.trim();
  c.cidade = document.getElementById('cm-cidade').value.trim();
  c.senha = document.getElementById('cm-senha').value;
  if(!c.nome||!c.cpf||!c.telefone||!c.cidade||!c.senha){ c.erroEtapa='Preenche todos os campos.'; render(); return; }
  if(c.cpf.replace(/\D/g,'').length!==11){ c.erroEtapa='CPF inválido — informa os 11 números.'; render(); return; }
  if(c.senha.length<4){ c.erroEtapa='A senha precisa de pelo menos 4 caracteres.'; render(); return; }
  c.erroEtapa=''; c.enviando=true; render();
  const { data: existente } = await sb.from('entrega_motoristas').select('id,status').eq('telefone', c.telefone).maybeSingle();
  if(existente && existente.status!=='incompleto'){
    c.enviando=false; c.erroEtapa='Já existe cadastro com este telefone. Usa "Já sou cadastrado" para entrar.';
    render(); return;
  }
  if(existente) c.id = existente.id;
  c.senhaHash = await hashSenha(c.senha);
  const ok = await salvarEtapaCadastro({ nome:c.nome, cpf:c.cpf, telefone:c.telefone, cidade:c.cidade, senha_hash:c.senhaHash, status:'incompleto', taxa_valor:TAXA_INSCRICAO_MOTORISTA });
  c.enviando=false;
  if(ok){ c.etapa=2; } else { c.id=null; }
  render();
}
function mudarVeiculoCadastro(k){ estado.painelMotorista.cadastro.veiculo=k; render(); }
async function avancarEtapa2(){
  const c = estado.painelMotorista.cadastro;
  c.marca = document.getElementById('cm-marca').value.trim();
  c.placa = document.getElementById('cm-placa').value.trim();
  c.cor = document.getElementById('cm-cor').value.trim();

  c.erroEtapa=''; c.enviando=true; render();
  const ok = await salvarEtapaCadastro({ veiculo_tipo:c.veiculo, veiculo_marca:c.marca, veiculo_placa:c.placa, veiculo_cor:c.cor });
  c.enviando=false;
  if(ok){ c.etapa=3; }
  render();
}
function voltarEtapa(n){ estado.painelMotorista.cadastro.etapa=n; estado.painelMotorista.cadastro.erroEtapa=''; render(); }

let uploadPendente = null; // 'cnh' | 'crlv' | 'fotoVeiculo'
function solicitarUploadDocumento(tipo){ uploadPendente = tipo; document.getElementById('input-doc-motorista').click(); }
async function processarDocumentoSelecionado(input){
  const file = input.files && input.files[0];
  input.value='';
  if(!file || !uploadPendente) return;
  const tipo = uploadPendente; uploadPendente = null;
  const c = estado.painelMotorista.cadastro;
  mostrarToast('Enviando documento...');
  const nomeArquivo = `${c.id}/${tipo}-${Date.now()}.jpg`;
  const { error: erroUp } = await sb.storage.from('motorista-documentos').upload(nomeArquivo, file, { upsert:true, contentType:file.type||'image/jpeg' });
  if(erroUp){ console.error(erroUp); mostrarToast('Erro ao enviar o documento.'); return; }
  const { data: pub } = sb.storage.from('motorista-documentos').getPublicUrl(nomeArquivo);
  if(tipo==='cnh') c.cnhUrl = pub.publicUrl;
  if(tipo==='crlv') c.crlvUrl = pub.publicUrl;
  if(tipo==='fotoVeiculo') c.fotoVeiculoUrl = pub.publicUrl;
  await salvarEtapaCadastro({ cnh_url:c.cnhUrl, crlv_url:c.crlvUrl, foto_veiculo_url:c.fotoVeiculoUrl });
  render();
}
async function avancarEtapa3(){
  const c = estado.painelMotorista.cadastro;
  if(!c.cnhUrl||!c.crlvUrl||!c.fotoVeiculoUrl){ c.erroEtapa='Envia os 3 documentos para continuar.'; render(); return; }
  c.erroEtapa=''; c.etapa=4; render();
  criarCobrancaPix();
}

async function criarCobrancaPix(){
  const c = estado.painelMotorista.cadastro;
  c.pix.gerando=true; c.pix.erro=''; render();
  try{
    const resp = await fetch(`${FUNCOES_URL}/criar-cobranca-pix`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ motoristaId:c.id, valor:TAXA_INSCRICAO_MOTORISTA, nome:c.nome, cpf:c.cpf })
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro){ throw new Error(dados.erro || 'Falha ao gerar cobrança PIX.'); }
    c.pix.qrCode = dados.qrCodeBase64; c.pix.copiaCola = dados.copiaCola; c.pix.gerando=false;
    render();
    iniciarPollingPix();
  }catch(e){
    console.error(e);
    c.pix.gerando=false; c.pix.erro = 'Não consegui gerar a cobrança PIX. Verifica se a chave MP_ACCESS_TOKEN está configurada nas secrets do Supabase e tenta novamente.';
    render();
  }
}
function iniciarPollingPix(){
  if(pixPollTimer) clearInterval(pixPollTimer);
  pixPollTimer = setInterval(async ()=>{
    const c = estado.painelMotorista.cadastro;
    if(!c.id || c.pix.status==='pago'){ clearInterval(pixPollTimer); pixPollTimer=null; return; }
    const { data } = await sb.from('entrega_motoristas').select('taxa_status').eq('id', c.id).maybeSingle();
    if(data && data.taxa_status==='pago'){
      c.pix.status='pago'; clearInterval(pixPollTimer); pixPollTimer=null; render();
    }
  }, 4000);
}
function copiarPix(){
  const c = estado.painelMotorista.cadastro;
  if(!c.pix.copiaCola) return;
  navigator.clipboard.writeText(c.pix.copiaCola).then(()=>mostrarToast('Código PIX copiado!'));
}
function avancarEtapa4(){
  const c = estado.painelMotorista.cadastro;
  if(c.pix.status!=='pago'){ mostrarToast('Aguarda a confirmação do pagamento.'); return; }
  c.etapa=5; render();
}
async function avancarEtapa5(){
  const c = estado.painelMotorista.cadastro;
  c.chavePix = document.getElementById('cm-chavepix').value.trim();
  if(!c.chavePix){ c.erroEtapa='Informa a chave PIX para receberes pelas entregas.'; render(); return; }
  c.erroEtapa=''; c.enviando=true; render();
  const ok = await salvarEtapaCadastro({ chave_pix:c.chavePix });
  c.enviando=false;
  if(ok) c.etapa=6;
  render();
}
async function finalizarCadastroMotorista(){
  const c = estado.painelMotorista.cadastro;
  if(!c.aceitouTermos){ c.erroEtapa='Aceita os termos de uso e a LGPD para continuar.'; render(); return; }
  c.erroEtapa=''; c.enviando=true; render();
  const ok = await salvarEtapaCadastro({ termos_aceitos:true, status:'pendente' });
  c.enviando=false;
  if(ok){ estado.painelMotorista.tela='pendente'; }
  render();
}

function adminCorpoHTML(){
  const a = estado.admin;
  if(!a.logado){
    return `
    <label>Senha do painel</label>
    <input type="text" id="admin-senha" oninput="digitarSenhaAdmin(this.value)" onkeydown="if(event.key==='Enter') entrarAdmin()" style="-webkit-text-security:disc;text-security:disc;">
    <button class="btn btn-primario" onclick="entrarAdmin()">Entrar</button>`;
  }
  if(a.carregando) return `<div class="subtitulo">A carregar cadastros...</div>`;
  if(a.motoristas.length===0) return `<div class="vazio"><span class="emoji-grande">🛵</span>Nenhum cadastro de entregador ainda.</div>`;
  return a.motoristas.map(m=>`
    <div class="admin-cartao">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${m.nome}</b>
        <span class="selo ${m.status==='pendente'?'selo-andamento':m.status==='aprovado'?'selo-entregue':'selo-aguardando'}">${m.status}</span>
      </div>
      <div class="am-linha"><span>CPF</span><b>${m.cpf}</b></div>
      <div class="am-linha"><span>Telefone</span><b>${m.telefone}</b></div>
      <div class="am-linha"><span>Cidade</span><b>${m.cidade}</b></div>
      <div class="am-linha"><span>Veículo</span><b>${VEICULOS[m.veiculo_tipo]?.emoji||''} ${m.veiculo_marca||''} ${m.veiculo_cor||''} · ${m.veiculo_placa||''}</b></div>
      <div class="am-linha"><span>Chave PIX</span><b>${m.chave_pix||'—'}</b></div>
      <div class="am-linha"><span>Taxa de inscrição</span><b>${m.taxa_status==='pago'?'✅ Paga':'⏳ Pendente'}</b></div>
      <div class="admin-docs">
        ${m.cnh_url?`<img src="${m.cnh_url}" onclick="ampliarFoto('${m.cnh_url}')">`:''}
        ${m.crlv_url?`<img src="${m.crlv_url}" onclick="ampliarFoto('${m.crlv_url}')">`:''}
        ${m.foto_veiculo_url?`<img src="${m.foto_veiculo_url}" onclick="ampliarFoto('${m.foto_veiculo_url}')">`:''}
      </div>
      ${m.status==='pendente' ? `
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-verde btn-pequeno" style="flex:1" onclick="aprovarMotoristaAdmin('${m.id}')">✅ Aprovar</button>
        <button class="btn btn-secundario btn-pequeno" style="flex:1" onclick="reprovarMotoristaAdmin('${m.id}')">❌ Reprovar</button>
      </div>` : ''}
      ${m.status==='reprovado' && m.motivo_reprovacao ? `<div class="subtitulo" style="margin-top:8px">Motivo: ${m.motivo_reprovacao}</div>` : ''}
    </div>`).join('');
}

function abrirAdmin(){ estado.admin.aberto=true; render(); }
function fecharAdmin(){ estado.admin.aberto=false; render(); }
function digitarSenhaAdmin(v){ estado.admin.senhaDigitada=v; }
async function entrarAdmin(){
  if(estado.admin.senhaDigitada!==ADMIN_SENHA){ mostrarToast('Senha incorreta.'); return; }
  estado.admin.logado=true;
  await carregarMotoristasAdmin();
  render();
}
async function carregarMotoristasAdmin(){
  estado.admin.carregando=true; render();
  const { data, error } = await sb.from('entrega_motoristas').select('*').neq('status','incompleto').order('criado_em',{ascending:false});
  estado.admin.carregando=false;
  if(error){ console.error(error); mostrarToast('Erro ao carregar cadastros.'); return; }
  estado.admin.motoristas = data||[];
  render();
}
async function aprovarMotoristaAdmin(id){
  const { error } = await sb.from('entrega_motoristas').update({ status:'aprovado', atualizado_em:Date.now() }).eq('id', id);
  if(error){ mostrarToast('Erro ao aprovar.'); return; }
  mostrarToast('Motorista aprovado!');
  await carregarMotoristasAdmin();
}
async function reprovarMotoristaAdmin(id){
  const motivo = prompt('Motivo da reprovação:');
  if(motivo===null) return;
  const { error } = await sb.from('entrega_motoristas').update({ status:'reprovado', motivo_reprovacao:motivo, atualizado_em:Date.now() }).eq('id', id);
  if(error){ mostrarToast('Erro ao reprovar.'); return; }
  mostrarToast('Cadastro reprovado.');
  await carregarMotoristasAdmin();
}
