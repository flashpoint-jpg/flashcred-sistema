let temporizadoresDebounce = {};
function debounce(chave, fn, delay=450){
  clearTimeout(temporizadoresDebounce[chave]);
  temporizadoresDebounce[chave] = setTimeout(fn, delay);
}

function paraRad(g){ return g*Math.PI/180; }
function distanciaKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=paraRad(lat2-lat1), dLon=paraRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(paraRad(lat1))*Math.cos(paraRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
async function geocodificar(endereco){
  const q = endereco.toLowerCase().includes('mg') ? endereco : endereco+', Muzambinho, MG';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=1`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    if(!dados||dados.length===0) return null;
    const lat=parseFloat(dados[0].lat), lon=parseFloat(dados[0].lon);
    if(lat<REGIAO.minLat||lat>REGIAO.maxLat||lon<REGIAO.minLon||lon>REGIAO.maxLon) return null;
    return {lat,lon};
  }catch(e){ console.error(e); return null; }
}
function precoDeDistancia(veiculo, km, tipoEntrega){
  const v=VEICULOS[veiculo];
  const mult = TIPOS_ENTREGA[tipoEntrega||'padrao'].multiplicador;
  return Math.round((v.base+v.km*km)*mult*100)/100;
}
function ganhoMotorista(preco){ return Math.round(preco*(1-TAXA_PLATAFORMA)*100)/100; }

async function buscarSugestoes(campo){
  const inputEl = document.getElementById('c-'+campo);
  const cont = document.getElementById('sugestoes-'+campo);
  if(!inputEl || !cont) return;
  const texto = inputEl.value.trim();
  if(texto.length<4){ cont.innerHTML=''; estado.sugestoesTemp[campo]=[]; return; }
  cont.innerHTML = `<div class="sugestao-vazia">Buscando endereços...</div>`;
  const q = texto.toLowerCase().includes('mg') ? texto : texto+', Muzambinho, MG';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=5`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    if(document.getElementById('c-'+campo).value.trim() !== texto) return;
    if(!dados || dados.length===0){ cont.innerHTML = `<div class="sugestao-vazia">Nenhum endereço encontrado na região.</div>`; return; }
    estado.sugestoesTemp[campo] = dados.map(d=>({
      lat: parseFloat(d.lat), lon: parseFloat(d.lon),
      nome: d.display_name.split(',').slice(0,4).join(',').trim()
    }));
    cont.innerHTML = estado.sugestoesTemp[campo].map((s,idx)=>
      `<div class="sugestao-item" onclick="selecionarSugestao('${campo}',${idx})">📍 ${s.nome}</div>`
    ).join('');
  }catch(e){ console.error(e); cont.innerHTML=''; }
}
function selecionarSugestao(campo, idx){
  const s = estado.sugestoesTemp[campo] && estado.sugestoesTemp[campo][idx];
  if(!s) return;
  const inputEl = document.getElementById('c-'+campo);
  if(inputEl) inputEl.value = s.nome;
  if(campo === 'origem') estado.form.origemCoord = {lat:s.lat, lon:s.lon};
  if(campo === 'destino') estado.form.destinoCoord = {lat:s.lat, lon:s.lon};
  document.getElementById('sugestoes-'+campo).innerHTML='';
  recalcular();
}

function validarCampos(listaIds){
  for(const id of listaIds){
    const el = document.getElementById(id);
    if(!el || !el.value.trim()){
      alert(`⚠️ Preencha todos os campos obrigatórios`);
      el?.focus();
      return false;
    }
  }
  return true;
}
function conferirSenha(senhaId, confirmaId){
  const s1 = document.getElementById(senhaId)?.value;
  const s2 = document.getElementById(confirmaId)?.value;
  if(s1 !== s2){ alert('⚠️ As senhas não coincidem!'); return false; }
  if((s1||'').length < 6){ alert('⚠️ A senha precisa ter pelo menos 6 caracteres!'); return false; }
  return true;
}

function recalcular(){
  if(!estado.form.origemCoord || !estado.form.destinoCoord) return;
  estado.form.distancia = distanciaKm(
    estado.form.origemCoord.lat, estado.form.origemCoord.lon,
    estado.form.destinoCoord.lat, estado.form.destinoCoord.lon
  );
  estado.form.preco = precoDeDistancia(estado.form.veiculo, estado.form.distancia, estado.form.tipoEntrega);
  estado.form.ganhoMotorista = ganhoMotorista(estado.form.preco);
  renderizar();
}

            <input type="text" id="cl_numero" placeholder="Ex: 123, s/n">

            <label>Bairro *</label>
            <input type="text" id="cl_bairro" placeholder="Nome do bairro">

            <label>Cidade / Estado *</label>
            <input type="text" id="cl_cidade" placeholder="Muzambinho - MG">

            <label>CEP *</label>
            <input type="text" id="cl_cep" placeholder="37890-000" maxlength="10">

            <label>E-mail *</label>
            <input type="email" id="cl_email" placeholder="seu@email.com">

            <label>Login *</label>
            <input type="text" id="cl_login" placeholder="Escolha seu login">

            <label>Senha *</label>
            <input type="password" id="cl_senha" placeholder="Mínimo 6 caracteres">

            <label>Confirmar Senha *</label>
            <input type="password" id="cl_confirma" placeholder="Digite a senha novamente">

            <button class="btn btn-primario" onclick="cadastrarCliente()">✅ Concluir Cadastro</button>
            <div class="sucesso-msg" id="sucessoCliente">✅ Cadastro realizado! Agora você pode solicitar entregas.</div>
          </div>
        ` : `
          <div class="cartao">
            <h2>Cadastro de Entregador</h2>
            
            <label>Nome Completo *</label>
            <input type="text" id="mt_nome" placeholder="Seu nome completo">

            <label>CPF *</label>
            <input type="text" id="mt_cpf" placeholder="000.000.000-00" maxlength="14">

            <label>WhatsApp *</label>
            <input type="tel" id="mt_whatsapp" placeholder="(35) 9XXXX-XXXX" maxlength="15">

            <label>Endereço Completo *</label>
            <input type="text" id="mt_endereco" placeholder="Rua, Avenida, etc.">

            <label>Número do Endereço *</label>
            <input type="text" id="mt_numero" placeholder="Ex: 123, s/n">

            <label>Bairro *</label>
            <input type="text" id="mt_bairro" placeholder="Nome do bairro">

            <label>Cidade / Estado *</label>
            <input type="text" id="mt_cidade" placeholder="Muzambinho - MG">

            <label>CEP *</label>
            <input type="text" id="mt_cep" placeholder="37890-000" maxlength="10">

            <label>E-mail *</label>
            <input type="email" id="mt_email" placeholder="seu@email.com">

            <label>Login *</label>
            <input type="text" id="mt_login" placeholder="Escolha seu login">

            <label>Senha *</label>
            <input type="password" id="mt_senha" placeholder="Mínimo 6 caracteres">

            <label>Confirmar Senha *</label>
            <input type="password" id="mt_confirma" placeholder="Digite a senha novamente">

            <label>Escolha seu Plano *</label>
            <div class="planos">
              <div class="plano plano-premium ${estado.planoEscolhido==='premium'?'selecionado':''}" onclick="escolherPlano('premium')">
                <h3>⭐ Premium</h3>
                <div class="preco">R$35,00<br><small>taxa única</small></div>
                <div class="desc">
                  ✅ Recebe pedidos primeiro<br>
                  ✅ Melhores rotas<br>
                  ✅ Sem limite de entregas<br>
                  ✅ Destaque na plataforma
                </div>
              </div>
              <div class="plano plano-free ${estado.planoEscolhido==='free'?'selecionado':''}" onclick="escolherPlano('free')">
                <h3>🆓 Gratuito</h3>
                <div class="preco">Grátis</div>
                <div class="desc">
                  ✅ Sem taxa de inscrição<br>
                  ⏳ Recebe após Premium<br>
                  ⚠️ Vagas limitadas
                </div>
              </div>
            </div>

            <button class="btn btn-primario" onclick="cadastrarMotorista()">✅ Concluir Cadastro</button>
            <div class="sucesso-msg" id="sucessoMotorista">✅ Cadastro realizado! Você já pode receber entregas.</div>
          </div>
        `}
      </main>
    `;
  } else {
    conteudo = `
      <header class="topo">
        <div class="marca">
          <h1><span class="parte1">ENTREGA</span> <span class="parte2">FLASH</span></h1>
          <p class="tagline">
            <span>RÁPIDO</span>
            <span>SEGURO</span>
            <span>NO PRAZO</span>
          </p>
        </div>
        <button class="btn-sair" onclick="trocarTela('cadastro')">📋</button>
      </header>

      <div class="toggle-modo">
        <button class="${estado.modo==='cliente'?'ativo':''}" onclick="estado.modo='cliente';renderizar();">🧑 Cliente</button>
        <button class="${estado.modo==='motorista'?'ativo':''}" onclick="estado.modo='motorista';renderizar();">🏍️ Entregador</button>
      </div>

      <main>
        <div class="cartao">
          <h2>Nova Entrega ⚡</h2>
          
          <label>Origem (de onde sai)</label>
          <input type="text" id="c-origem" placeholder="Digite o endereço de origem" oninput="debounce('origem', ()=>buscarSugestoes('origem'))">
          <div class="sugestoes" id="sugestoes-origem"></div>

          <label>Destino (para onde vai)</label>
          <input type="text" id="c-destino" placeholder="Digite o endereço de destino" oninput="debounce('destino', ()=>buscarSugestoes('destino'))">
          <div class="sugestoes" id="sugestoes-destino"></div>

          <label>Veículo</label>
          <div class="veiculos">
            ${Object.entries(VEICULOS).map(([chave,v])=>`
              <button class="${estado.form.veiculo===chave?'sel':''}" onclick="estado.form.veiculo='${chave}';recalcular();renderizar();">
                <span class="emoji">${v.emoji}</span>${v.label}
              </button>
            `).join('')}
          </div>

          <label>Tipo de Entrega</label>
          <select onchange="estado.form.tipoEntrega=this.value;recalcular();renderizar();">
            ${Object.entries(TIPOS_ENTREGA).map(([chave,t])=>`<option value="${chave}" ${estado.form.tipoEntrega===chave?'selected':''}>${t.label} — ${t.desc}</option>`).join('')}
          </select>

          ${estado.form.distancia ? `
            <div class="estimativa">
              <div>
                <div class="rotulo">Distância</div>
                <div class="valor">${estado.form.distancia.toFixed(1)} km</div>
              </div>
              <div>
                <div class="rotulo">Valor da entrega</div>
                <div class="valor">R$ ${estado.form.preco.toFixed(2)}</div>
                <div class="sub">Motorista recebe R$ ${estado.form.ganhoMotorista.toFixed(2)}</div>
              </div>
            </div>
            <button class="btn btn-primario">⚡ Solicitar Entrega</button>
          ` : `
            <div class="vazio">
              <span class="emoji-grande">📍</span>
              Selecione origem e destino para calcular o valor
            </div>
          `}
        </div>
      </main>
    `;
  }

  app.innerHTML = conteudo;
}

renderizar();
</script>
</body>
</html>
