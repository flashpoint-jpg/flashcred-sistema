<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashEntregas Muzambinho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --fundo: #1A1A2E;
      --painel: #16213E;
      --painel-claro: #0F3460;
      --borda: #2C3E50;
      --destaque: #FFB627;
      --destaque-escuro: #CC8F14;
      --erro: #FF5A4E;
      --texto: #F8F9FA;
      --texto-claro: #B0BEC5;
      --sucesso: #4CD787;
      --azul: #3B82F6;
      --roxo: #8B5CF6;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{
      background: var(--fundo);
      color: var(--texto);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
    }
    #app{
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: linear-gradient(180deg, #1A1A2E 0%, #16213E 100%);
      padding-bottom: 30px;
    }
    header{
      padding: 24px 20px 16px;
    }
    .marca{display:flex;align-items:center;gap:10px;}
    .marca .icone{
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--destaque), var(--erro));
      display:flex;align-items:center;justify-content:center;
      font-family: 'Archivo Black'; font-size: 18px; color: #000;
      transform: rotate(-5deg);
    }
    .marca h1{font-family: 'Archivo Black'; font-size: 24px; color: var(--texto);}
    .marca h1 span{color: var(--destaque);}
    .tagline{font-size: 12px; color: var(--texto-claro); margin: 4px 0 0 50px;}

    .toggle-modo{
      display:flex; margin: 16px 20px;
      background: var(--painel); border-radius: 12px; padding: 4px; border: 1px solid var(--borda);
    }
    .toggle-modo button{
      flex:1; padding: 10px; border:none; background:transparent;
      color: var(--texto-claro); font-weight: 600; border-radius: 10px; cursor:pointer;
    }
    .toggle-modo button.ativo{background: var(--destaque); color: #000;}

    .aviso{
      margin: 0 20px 16px; padding: 12px;
      background: var(--painel); border: 1px solid var(--borda); border-left: 3px solid var(--destaque);
      border-radius: 8px; font-size: 13px; color: var(--texto-claro);
    }

    main{padding: 0 20px;}
    .cartao{
      background: var(--painel); border: 1px solid var(--borda);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
    }
    .cartao h2{
      font-family: 'Archivo Black'; font-size: 16px; margin-bottom: 16px;
      color: var(--texto); text-transform: uppercase;
    }
    label{
      display:block; font-size: 12px; font-weight: 600;
      color: var(--texto-claro); margin: 14px 0 6px; text-transform: uppercase;
    }
    input, textarea{
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--borda); background: var(--painel-claro);
      color: var(--texto); font-size: 15px; outline:none;
    }
    input:focus, textarea:focus{border-color: var(--destaque);}
    textarea{min-height: 60px; resize: vertical;}

    .veiculos{display:flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;}
    .veiculos button{
      flex:1; min-width: 75px; padding: 12px 8px; border-radius: 10px;
      border: 1px solid var(--borda); background: var(--painel-claro);
      color: var(--texto-claro); cursor:pointer; text-align:center;
    }
    .veiculos button.sel{
      border-color: var(--destaque); color: var(--destaque);
      background: rgba(255,182,39,0.1);
    }
    .veiculos button .emoji{display:block; font-size: 20px; margin-bottom: 4px;}

    .btn{
      width:100%; padding: 14px; border-radius: 12px; border:none;
      font-weight: 700; font-size: 15px; cursor:pointer; margin-top: 16px;
    }
    .btn-primario{background: var(--destaque); color: #000;}
    .btn-primario:hover{background: var(--destaque-escuro);}
    .btn-verde{background: var(--sucesso); color: #000;}
    .btn-pequeno{width:auto; padding: 10px 16px; font-size: 14px; margin-top:0;}
    .btn-linha{
      display:inline-flex; align-items:center; gap:6px;
      padding: 10px 14px; border-radius: 10px; border:none;
      background: var(--painel-claro); color: var(--texto);
      font-size: 14px; cursor:pointer; margin-top: 8px;
    }
    .btn-linha:hover{background: var(--borda);}

    .estimativa{
      background: var(--painel-claro); border-radius: 10px;
      padding: 16px; margin-top: 16px;
    }
    .estimativa .linha{display:flex; justify-content:space-between; align-items:center; padding: 6px 0;}
    .estimativa .valor{font-family: 'Archivo Black'; font-size: 24px; color: var(--destaque);}
    .estimativa .rotulo{font-size: 12px; color: var(--texto-claro); text-transform: uppercase;}
    .estimativa .divisao{border-top: 1px dashed var(--borda); padding-top: 10px; margin-top: 6px;}

    .pedido{
      background: var(--painel); border: 1px solid var(--borda);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .pedido .linha-topo{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom: 10px;}
    .pedido .end{font-size: 14px; line-height: 1.5;}
    .pedido .end b{display:block; font-size: 11px; color: var(--texto-claro); text-transform:uppercase; margin: 8px 0 2px;}
    .pedido .preco{font-family: 'Archivo Black'; font-size: 18px; color: var(--destaque);}
    .selo{
      display:inline-block; padding: 4px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 700; text-transform:uppercase;
    }
    .selo-aguardando{background: rgba(255,90,78,0.15); color: var(--erro);}
    .selo-buscando{background: rgba(255,182,39,0.15); color: var(--destaque);}
    .selo-andamento{background: rgba(76,215,135,0.15); color: var(--sucesso);}
    .selo-entregue{background: rgba(59,130,246,0.15); color: var(--azul);}

    .trilha{display:flex; align-items:center; margin: 14px 0 8px;}
    .trilha .ponto{width:10px; height:10px; border-radius:50%; background: var(--borda); flex-shrink:0;}
    .trilha .barra{flex:1; height:2px; background: var(--borda);}
    .trilha .ponto.feito, .trilha .barra.feito{background: var(--destaque);}
    .trilha .ponto.atual{background: var(--destaque); box-shadow: 0 0 0 4px rgba(255,182,39,0.25); animation: pulso 1.6s infinite;}
    @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,182,39,0.4);}70%{box-shadow:0 0 0 8px rgba(255,182,39,0);}100%{box-shadow:0 0 0 0 rgba(255,182,39,0);}}
    .etiquetas{display:flex; justify-content:space-between; font-size:9px; color:var(--texto-claro); text-transform:uppercase; margin-top:4px;}
    .etiquetas span{flex:1; text-align:center;}

    .vazio{text-align:center; padding: 40px 20px; color:var(--texto-claro);}
    .vazio .emoji-grande{font-size:40px; display:block; margin-bottom:10px;}

    .toast{
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      background: var(--painel); border:1px solid var(--destaque);
      color:var(--texto); padding:12px 20px; border-radius:10px;
      font-weight:600; z-index:200; max-width:90%; text-align:center;
    }

    /* 🎬 ANIMAÇÃO DE BUSCANDO ENTREGADOR */
    .buscando-box{
      text-align:center; padding:30px 20px;
      background: rgba(255,182,39,0.05);
      border:1px solid rgba(255,182,39,0.3);
      border-radius:16px; margin:16px 0;
    }
    .buscando-icone{
      font-size:48px; margin-bottom:12px;
      animation: pulsar 1.2s infinite ease-in-out;
    }
    @keyframes pulsar{
      0%{ transform: scale(1); opacity:1; }
      50%{ transform: scale(1.15); opacity:0.7; }
      100%{ transform: scale(1); opacity:1; }
    }
    .buscando-texto{
      font-size:16px; font-weight:600; color:var(--destaque); margin-bottom:4px;
    }
    .buscando-sub{ font-size:13px; color:var(--texto-claro); }

    /* 🛵 ANIMAÇÃO DE ENTREGADOR A CAMINHO */
    .a-caminho-box{
      text-align:center; padding:24px 20px;
      background: rgba(76,215,135,0.05);
      border:1px solid rgba(76,215,135,0.3);
      border-radius:16px; margin:16px 0;
    }
    .a-caminho-icone{
      font-size:48px; margin-bottom:12px;
      animation: deslizar 2s infinite ease-in-out;
    }
    @keyframes deslizar{
      0%{ transform: translateX(-8px); }
      50%{ transform: translateX(8px); }
      100%{ transform: translateX(-8px); }
    }
    .a-caminho-nome{ font-size:16px; font-weight:700; color:var(--sucesso); margin-bottom:4px; }
    .a-caminho-texto{ font-size:14px; color:var(--texto-claro); }

    /* CHAT */
    .modal-fundo{
      position:fixed; inset:0; background:rgba(0,0,0,0.75);
      z-index:150; display:flex; align-items:flex-end; justify-content:center;
    }
    .modal-chat{
      width:100%; max-width:480px; background:var(--painel);
      border-radius:20px 20px 0 0; max-height:85vh; display:flex; flex-direction:column;
      border:1px solid var(--borda);
    }
    .chat-topo{
      padding:16px 20px; border-bottom:1px solid var(--borda);
      display:flex; justify-content:space-between; align-items:center;
    }
    .chat-topo h3{font-size:15px; text-transform:uppercase;}
    .chat-fechar{background:none; border:none; color:var(--texto-claro); font-size:22px; cursor:pointer;}
    .chat-mensagens{flex:1; padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:200px;}
    .bolha{
      max-width:80%; padding:12px 16px; border-radius:18px; font-size:14px; line-height:1.4;
      position:relative;
    }
    .bolha span{font-size:10px; opacity:0.6; margin-top:4px; display:block; text-align:right;}
    .bolha-cliente{background:var(--azul); color:#fff; border-bottom-right-radius:4px; align-self:flex-end;}
    .bolha-motorista{background:var(--sucesso); color:#000; border-bottom-left-radius:4px; align-self:flex-start;}
    .bolha-suporte{background:var(--roxo); color:#fff; border-bottom-left-radius:4px; align-self:flex-start;}
    .chat-vazio{text-align:center; padding:30px; color:var(--texto-claro);}
    .chat-envio{display:flex; gap:10px; padding:16px; border-top:1px solid var(--borda);}
    .notif-bolinha{
      position:absolute; top:-8px; right:-8px; background:var(--erro); color:#fff;
      font-size:11px; font-weight:bold; min-width:20px; height:20px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
    }
    .balao-botao{position:relative; display:inline-block;}
    .grupo-botoes{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;}

    .saldo-card{
      background:linear-gradient(135deg, var(--sucesso), #34b977);
      color:#000; border-radius:14px; padding:20px; text-align:center; margin-bottom:16px;
    }
    .saldo-card .valor-saldo{font-family:'Archivo Black'; font-size:28px;}
    .saldo-card .rotulo-saldo{font-size:12px; text-transform:uppercase; opacity:0.8;}
    .rodape-motorista{
      background:var(--painel); border:1px solid var(--borda); border-radius:14px;
      padding:16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;
    }
    .rodape-motorista .ganho .n{font-family:'Archivo Black'; font-size:22px; color:var(--sucesso);}
    .rodape-motorista .ganho .r{font-size:11px; color:var(--texto-claro); text-transform:uppercase;}
    .campo-motorista{background:var(--painel); border:1px solid var(--borda); border-radius:16px; padding:20px;}
    .subtitulo{font-size:13px; color:var(--texto-claro); margin:8px 0 16px;}
    #mapa{height:250px; border-radius:12px; margin:12px 0; border:1px solid var(--borda);}
  </style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

const CENTRO_MUZAMBINHO = { lat: -21.4836, lng: -46.5144 };
const VEICULOS = {
  bicicleta: { label: 'Bicicleta', emoji: '🚴', base: 5.00, km: 1.50 },
  moto: { label: 'Moto', emoji: '🏍️', base: 8.00, km: 2.00 },
  carro: { label: 'Carro', emoji: '🚗', base: 12.00, km: 3.00 },
  van: { label: 'Van', emoji: '🚐', base: 18.00, km: 4.00 }
};
const TAXA_PLATAFORMA = 0.30;
const ESTAGIOS = ['aguardando','buscando','indo_coletar','coletado','a_caminho','entregue'];
const ROTULOS_ESTAGIO = {
  aguardando: 'Aguardando', buscando: 'Localizando entregador...',
  indo_coletar: 'Indo coletar', coletado: 'Coletado',
  a_caminho: 'A caminho da entrega', entregue: 'Entregue'
};

let estado = {
  modo: 'cliente', veiculoSelecionado: 'moto',
  filtroTelefoneCliente: '',
  motorista: { nome:'', telefone:'', ativo:false, saldo:0 },
  pedidos: [], carregando: true, toast: null,
  chatAberto: null, mensagens: [], assinaturaChat: null,
  contadorNaoLidas: { motorista:0, suporte:0 }
};

function precoEstimado(veiculo, distancia){
  const v = VEICULOS[veiculo];
  const d = Math.max(0.5, Number(distancia) || 1);
  const total = v.base + (v.km * d);
  return {
    total: Math.round(total * 100) / 100,
    plataforma: Math.round(total * TAXA_PLATAFORMA * 100) / 100,
    motorista: Math.round(total * (1 - TAXA_PLATAFORMA) * 100) / 100
  };
}

function mostrarToast(msg){
  estado.toast = msg; render();
  setTimeout(()=>{ estado.toast = null; render(); }, 3000);
}

function paraCamposApp(row){
  return {
    id: row.id, clienteNome: row.cliente_nome, clienteTelefone: row.cliente_telefone,
    motoristaNome: row.motorista_nome || '', motoristaTelefone: row.motorista_telefone || '',
    origem: row.origem, destino: row.destino, veiculo: row.veiculo,
    descricao: row.descricao || '', distancia: Number(row.distancia) || 0,
    precoTotal: Number(row.preco_total) || 0, precoMotorista: Number(row.preco_motorista) || 0,
    status: row.status, criadoEm: Number(row.criado_em), atualizadoEm: Number(row.atualizado_em),
    latOrigem: row.lat_origem || CENTRO_MUZAMBINHO.lat,
    lngOrigem: row.lng_origem || CENTRO_MUZAMBINHO.lng,
    latDestino: row.lat_destino || CENTRO_MUZAMBINHO.lat,
    lngDestino: row.lng_destino || CENTRO_MUZAMBINHO.lng
  };
}

function paraCamposDB(p){
  return {
    id: p.id, cliente_nome: p.clienteNome, cliente_telefone: p.clienteTelefone,
    motorista_nome: p.motoristaNome || null, motorista_telefone: p.motoristaTelefone || null,
    origem: p.origem, destino: p.destino, veiculo: p.veiculo,
    descricao: p.descricao || null, distancia: p.distancia,
    preco_total: p.precoTotal, preco_motorista: p.precoMotorista,
    status: p.status, criado_em: p.criadoEm, atualizado_em: p.atualizadoEm,
    lat_origem: p.latOrigem, lng_origem: p.lngOrigem,
    lat_destino: p.latDestino, lng_destino: p.lngDestino
  };
}

async function carregarMensagens(pedidoId){
  const { data } = await sb.from('entrega_chat').select('*').eq('pedido_id', pedidoId).order('criado_em', { ascending: true });
  return data || [];
}

async function enviarMensagem(pedidoId, remetenteTipo, remetenteNome, texto){
  if(!texto.trim()) return;
  const mensagem = {
    pedido_id: pedidoId, remetente_tipo: remetenteTipo, remetente_nome: remetenteNome,
    texto: texto.trim(), lido: false, criado_em: Date.now()
  };
  await sb.from('entrega_chat').insert(mensagem);
  const pedido = estado.pedidos.find(p => p.id === pedidoId);
  if(pedido){
    const nomeOutro = remetenteTipo === 'cliente' ? (pedido.motoristaNome || 'Entregador') : pedido.clienteNome;
    mostrarToast(`💬 ${nomeOutro}: "${texto.substring(0,25)}${texto.length>25?'...':''}"`);
  }
}

function assinarChat(pedidoId){
  if(estado.assinaturaChat) estado.assinaturaChat.unsubscribe();
  estado.assinaturaChat = sb.channel(`chat:${pedidoId}`)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'entrega_chat', filter:`pedido_id=eq.${pedidoId}` }, async () => {
      estado.mensagens = await carregarMensagens(pedidoId);
      if(!estado.chatAberto){
        estado.contadorNaoLidas.motorista++;
      }
      render();
    }).subscribe();
}

async function abrirChat(tipo, pedidoId){
  estado.chatAberto = { tipo, pedidoId };
  estado.mensagens = await carregarMensagens(pedidoId);
  estado.contadorNaoLidas.motorista = 0;
  estado.contadorNaoLidas.suporte = 0;
  assinarChat(pedidoId);
  render();
  setTimeout(() => {
    const caixa = document.querySelector('.chat-mensagens');
    if(caixa) caixa.scrollTop = caixa.scrollHeight;
  }, 50);
}

function fecharChat(){
  if(estado.assinaturaChat) estado.assinaturaChat.unsubscribe();
  estado.chatAberto = null; estado.mensagens = []; render();
}

async function carregarPedidos(){
  const { data } = await sb.from('entrega_pedidos').select('*').order('criado_em', { ascending: false });
  estado.pedidos = (data || []).map(paraCamposApp);
  estado.carregando = false; render();
}

async function salvarPedido(p){
  await sb.from('entrega_pedidos').upsert(paraCamposDB(p));
}

function lerFormularioCliente(){
  return {
    nome: (document.getElementById('c-nome')?.value || '').trim(),
    telefone: (document.getElementById('c-telefone')?.value || '').trim(),
    origem: (document.getElementById('c-origem')?.value || '').trim(),
    destino: (document.getElementById('c-destino')?.value || '').trim(),
    veiculo: estado.veiculoSelecionado,
    descricao: (document.getElementById('c-descricao')?.value || '').trim(),
    distancia: parseFloat(document.getElementById('c-distancia')?.value || 3)
  };
}

async function criarPedido(){
  const f = lerFormularioCliente();
  if(!f.nome){ mostrarToast('⚠️ Digite seu nome!'); return; }
  if(!f.telefone){ mostrarToast('⚠️ Digite seu WhatsApp!'); return; }
  if(!f.origem){ mostrarToast('⚠️ Digite o endereço de recolha!'); return; }
  if(!f.destino){ mostrarToast('⚠️ Digite o endereço de entrega!'); return; }

  const precos = precoEstimado(f.veiculo, f.distancia);
  const agora = Date.now();
  const pedido = {
    id: 'p'+agora+Math.floor(Math.random()*1000),
    clienteNome: f.nome, clienteTelefone: f.telefone,
    origem: f.origem, destino: f.destino, veiculo: f.veiculo,
    descricao: f.descricao, distancia: f.distancia,
    precoTotal: precos.total, precoMotorista: precos.motorista,
    status: 'buscando', motoristaNome: '', motoristaTelefone: '',
    criadoEm: agora, atualizadoEm: agora,
    latOrigem: CENTRO_MUZAMBINHO.lat, lngOrigem: CENTRO_MUZAMBINHO.lng,
    latDestino: CENTRO_MUZAMBINHO.lat + (Math.random()-0.5)*0.02,
    lngDestino: CENTRO_MUZAMBINHO.lng + (Math.random()-0.5)*0.02
  };
  await salvarPedido(pedido);
  estado.filtroTelefoneCliente = f.telefone;
  mostrarToast('✅ Pedido enviado! Localizando entregador...');
  await carregarPedidos();
}

async function aceitarPedido(id){
  const p = estado.pedidos.find(x => x.id === id);
  if(!p) return;
  p.status = 'indo_coletar';
  p.motoristaNome = estado.motorista.nome;
  p.motoristaTelefone = estado.motorista.telefone;
  p.atualizadoEm = Date.now();
  await salvarPedido(p);
  mostrarToast('✅ Pedido aceito! Indo buscar o produto.');
  await carregarPedidos();
}

async function avancarStatus(id){
  const p = estado.pedidos.find(x => x.id === id);
  if(!p) return;
  const i = ESTAGIOS.indexOf(p.status);
  if(i < ESTAGIOS.length - 1){
    p.status = ESTAGIOS[i+1];
    p.atualizadoEm = Date.now();
    await salvarPedido(p);
    if(p.status === 'entregue'){
      estado.motorista.saldo = (estado.motorista.saldo || 0) + p.precoMotorista;
      mostrarToast(`✅ Entregue! Você recebeu R$ ${p.precoMotorista.toFixed(2)}`);
    } else if(p.status === 'coletado'){
      mostrarToast('✅ Produto recolhido! A caminho da entrega.');
    } else if(p.status === 'a_caminho'){
      mostrarToast('✅ A caminho do destino!');
    }
    await carregarPedidos();
  }
}

function trilhaHTML(status){
  const i = ESTAGIOS.indexOf(status);
  let pontos = '';
  ESTAGIOS.forEach((e, idx) => {
    pontos += `<div class="ponto ${idx < i ? 'feito' : ''} ${idx === i ? 'atual' : ''}"></div>`;
    if(idx < ESTAGIOS.length - 1) pontos += `<div class="barra ${idx < i ? 'feito' : ''}"></div>`;
  });
  return `<div class="trilha">${pontos}</div><div class="etiquetas"><span>Pedido</span><span>Busca</span><span>Coleta</span><span>Recolhido</span><span>Rota</span><span>Entregue</span></div>`;
}

function seloHTML(status){
  if(status === 'aguardando') return `<span class="selo selo-aguardando">Aguardando</span>`;
  if(status === 'buscando') return `<span class="selo selo-buscando">Localizando entregador</span>`;
  if(status === 'entregue') return `<span class="selo selo-entregue">Entregue</span>`;
  return `<span class="selo selo-andamento">${ROTULOS_ESTAGIO[status]}</span>`;
}

function animacaoStatusHTML(p){
  if(p.status === 'buscando'){
    return `
    <div class="buscando-box">
      <div class="buscando-icone">🔍</div>
      <div class="buscando-texto">Localizando entregador...</div>
      <div class="buscando-sub">Aguarde um momento, estamos procurando o entregador mais próximo</div>
    </div>`;
  }
  if(p.status === 'indo_coletar' || p.status === 'coletado' || p.status === 'a_caminho'){
    return `
    <div class="a-caminho-box">
      <div class="a-caminho-icone">🛵</div>
      <div class="a-caminho-nome">${p.motoristaNome}</div>
      <div class="a-caminho-texto">Entregador a caminho! 📍</div>
    </div>`;
  }
  return '';
}

function cartaoPedidoCliente(p){
  return `
  <div class="pedido">
    <div class="linha-topo">
      <div class="end">
        <b>Recolha</b>${p.origem}
        <b>Entrega</b>${p.destino}
      </div>
      <div class="preco">R$ ${p.precoTotal.toFixed(2)}</div>
    </div>
    ${seloHTML(p.status)}
    ${trilhaHTML(p.status)}
    ${animacaoStatusHTML(p)}
    ${(p.status === 'indo_coletar' || p.status === 'coletado' || p.status === 'a_caminho') ? `
      <div style="margin-top:10px;font-size:13px;color:var(--texto-claro)">
        Entregador: <b style="color:var(--texto)">${p.motoristaNome}</b>
      </div>
      <div class="grupo-botoes">
        <button class="btn-linha balao-botao" onclick="abrirChat('motorista','${p.id}')">
          💬 Falar com Entregador
          ${estado.contadorNaoLidas.motorista>0?`<span class="notif-bolinha">${estado.contadorNaoLidas.motorista}</span>`:''}
        </button>
      </div>
    `:''}
    <div class="grupo-botoes">
      <button class="btn-linha" onclick="abrirChat('suporte','${p.id}')">🛟 Falar com Suporte</button>
    </div>
  </div>`;
}

function cartaoPedidoDisponivel(p){
  const precos = precoEstimado(p.veiculo, p.distancia);
  return `
  <div class="pedido">
    <div class="linha-topo">
      <div class="end"><b>Recolha</b>${p.origem}<b>Entrega</b>${p.destino}</div>
      <div class="preco">R$ ${p.precoTotal.toFixed(2)}</div>
    </div>
    <div style="font-size:13px;color:var(--texto-claro);margin:8px 0">
      ${VEICULOS[p.veiculo].emoji} ${VEICULOS[p.veiculo].label} · ${p.distancia} km
    </div>
    <div class="estimativa">
      <div class="linha"><span class="rotulo">Valor total</span><span>R$ ${precos.total.toFixed(2)}</span></div>
      <div class="linha divisao"><span class="rotulo">Sua parte (70%)</span><span style="color:var(--sucesso);font-weight:700">R$ ${precos.motorista.toFixed(2)}</span></div>
    </div>
    <button class="btn btn-primario btn-pequeno" onclick="aceitarPedido('${p.id}')">Aceitar pedido</button>
  </div>`;
}

function cartaoPedidoAtivo(p){
  const i = ESTAGIOS.indexOf(p.status);
  const proximo = i < ESTAGIOS.length - 1 ? ESTAGIOS[i+1] : null;
  const rotulos = { indo_coletar:'✅ Cheguei / recolhi', coletado:'🚀 Seguir viagem', a_caminho:'🏠 Marcar entregue' };
  return `
  <div class="pedido">
    <div class="linha-topo">
      <div class="end"><b>Recolha</b>${p.origem}<b>Entrega</b>${p.destino}</div>
      <div class="preco">R$ ${p.precoTotal.toFixed(2)}</div>
    </div>
    ${seloHTML(p.status)}
    ${trilhaHTML(p.status)}
    <div style="margin-top:10px;font-size:13px;color:var(--texto-claro)">
      Cliente: <b style="color:var(--texto)">${p.clienteNome}</b> · ${p.clienteTelefone}
    </div>
    <div class="estimativa">
      <div class="linha"><span class="rotulo">Seu ganho</span><span style="color:var(--sucesso);font-weight:700">R$ ${p.precoMotorista.toFixed(2)}</span></div>
    </div>
    <div class="grupo-botoes">
      <button class="btn-linha balao-botao" onclick="abrirChat('motorista','${p.id}')">
        💬 Falar com Cliente
        ${estado.contadorNaoLidas.motorista>0?`<span class="notif-bolinha">${estado.contadorNaoLidas.motorista}</span>`:''}
      </button>
      <button class="btn-linha" onclick="abrirChat('suporte','${p.id}')">🛟 Suporte</button>
    </div>
    ${proximo ? `<button class="btn btn-verde btn-pequeno" style="margin-top:12px" onclick="avancarStatus('${p.id}')">${rotulos[p.status]}</button>` : ''}
  </div>`;
}

function modalChat(){
  if(!estado.chatAberto) return '';
  const { tipo, pedidoId } = estado.chatAberto;
  const pedido = estado.pedidos.find(p => p.id === pedidoId);
  if(!pedido) return '';
  const meuTipo = estado.modo === 'entregador' ? 'motorista' : 'cliente';
  const titulo = tipo === 'motorista' 
    ? (meuTipo === 'cliente' ? `Conversa com ${pedido.motoristaNome || 'Entregador'}` : `Conversa com ${pedido.clienteNome}`)
    : 'Suporte FlashEntregas';

  return `
  <div class="modal-fundo" onclick="if(event.target===this)fecharChat()">
    <div class="modal-chat">
      <div class="chat-topo">
        <h3>${titulo}</h3>
        <button class="chat-fechar" onclick="fecharChat()">✕</button>
      </div>
      <div class="chat-mensagens" id="caixa-msg">
        ${estado.mensagens.length===0
          ?`<div class="chat-vazio">👋 Comece a conversar!</div>`
          :estado.mensagens.map(m=>{
              const minha = m.remetente_tipo === meuTipo;
              const classe = minha ? 'bolha-cliente' : (m.remetente_tipo==='suporte'?'bolha-suporte':'bolha-motorista');
              const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
              return `<div class="bolha ${classe}">${m.texto}<span>${hora}</span></div>`;
            }).join('')
        }
      </div>
      <div class="chat-envio">
        <input type="text" id="entrada-msg" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')enviarMsg()">
        <button class="btn btn-primario btn-pequeno" onclick="enviarMsg()">Enviar</button>
      </div>
    </div>
  </div>`;
}

async function enviarMsg(){
  const input = document.getElementById('entrada-msg');
  if(!input || !estado.chatAberto) return;
  const texto = input.value;
  if(!texto.trim()) return;
  const { pedidoId } = estado.chatAberto;
  const meuTipo = estado.modo === 'entregador' ? 'motorista' : 'cliente';
  const meuNome = meuTipo === 'motorista' ? estado.motorista.nome : (estado.pedidos.find(p=>p.id===pedidoId)?.clienteNome || 'Cliente');
  input.value = '';
  await enviarMensagem(pedidoId, meuTipo, meuNome, texto);
  estado.mensagens = await carregarMensagens(pedidoId);
  render();
  setTimeout(()=>{const c=document.getElementById('caixa-msg');if(c)c.scrollTop=c.scrollHeight;},30);
}

function mudarModo(m){ estado.modo=m; render(); }
function mudarVeiculo(v){ estado.veiculoSelecionado=v; render(); }

function entrarComoMotorista(){
  const nome = (document.getElementById('m-nome')?.value||'').trim();
  const telefone = (document.getElementById('m-telefone')?.value||'').trim();
  if(!nome){ mostrarToast('⚠️ Digite seu nome!'); return; }
  if(!telefone){ mostrarToast('⚠️ Digite seu WhatsApp!'); return; }
  estado.motorista = { nome, telefone, ativo:true, saldo:0 };
  mostrarToast(`✅ Bem-vindo, ${nome}!`);
  render();
}

function sairMotorista(){
  estado.motorista = { nome:'', telefone:'', ativo:false, saldo:0 };
  mostrarToast('Saiu da conta.');
  render();
}

function render(){
  const app = document.getElementById('app');
  const precos = precoEstimado(estado.veiculoSelecionado, 3);
  const meusPedidos = estado.filtroTelefoneCliente
    ? estado.pedidos.filter(p => p.clienteTelefone === estado.filtroTelefoneCliente)
    : [];
  const disponiveis = estado.pedidos.filter(p => p.status === 'buscando' || p.status === 'aguardando');
  const ativos = estado.pedidos.filter(p => (p.status==='indo_coletar' || p.status==='coletado' || p.status==='a_caminho') && p.motoristaTelefone===estado.motorista.telefone);

  let conteudo = '';
  if(estado.modo === 'cliente'){
    conteudo = `
    <div class="cartao">
      <h2>Pedir Entrega — Muzambinho-MG</h2>
      <label>Seu nome</label><input type="text" id="c-nome" placeholder="Ex: Maria Silva">
      <label>Seu WhatsApp</label><input type="tel" id="c-telefone" placeholder="(35) 9XXXX-XXXX">
      <label>Endereço de recolha</label><input type="text" id="c-origem" placeholder="Rua, número, bairro">
      <label>Endereço de entrega</label><input type="text" id="c-destino" placeholder="Rua, número, bairro">
      <label>Veículo</label>
      <div class="veiculos">
        ${Object.entries(VEICULOS).map(([k,v])=>`<button class="${estado.veiculoSelecionado===k?'sel':''}" onclick="mudarVeiculo('${k}')"><span class="emoji">${v.emoji}</span>${v.label}</button>`).join('')}
      </div>
      <label>Distância aproximada (km)</label>
      <input type="number" id="c-distancia" min="0.5" step="0.5" value="3" oninput="render()">
      <label>O que está enviando (opcional)</label>
      <textarea id="c-descricao" placeholder="Ex: caixa, móvel..."></textarea>
      <div class="estimativa">
        <div class="linha"><span class="rotulo">Valor total</span><span class="valor">R$ ${precos.total.toFixed(2)}</span></div>
        <div class="linha divisao"><span class="rotulo">Calculado por km</span><span>✅</span></div>
      </div>
      <button class="btn btn-primario" onclick="criarPedido()">✅ Confirmar Pedido</button>
    </div>
    <div class="cartao">
      <h2>Meus Pedidos</h2>
      ${!estado.filtroTelefoneCliente
        ?`<div class="vazio"><span class="emoji-grande">📦</span>Faça seu primeiro pedido!</div>`
        :meusPedidos.length===0
          ?`<div class="vazio"><span class="emoji-grande">📦</span>Nenhum pedido encontrado.</div>`
          :meusPedidos.map(cartaoPedidoCliente).join('')
      }
    </div>`;
  } else {
    if(!estado.motorista.ativo){
      conteudo = `
      <div class="campo-motorista">
        <h2>Entrar como Entregador</h2>
        <div class="subtitulo">Você fica com 70% do valor de cada entrega.</div>
        <label>Seu nome</label><input type="text" id="m-nome" placeholder="Ex: João Paulo">
        <label>Seu WhatsApp</label><input type="tel" id="m-telefone" placeholder="(35) 9XXXX-XXXX">
        <button class="btn btn-primario" onclick="entrarComoMotorista()">🟢 Começar a Trabalhar</button>
      </div>`;
    } else {
      conteudo = `
      <div class="saldo-card">
        <div class="rotulo-saldo">Saldo Disponível</div>
        <div class="valor-saldo">R$ ${(estado.motorista.saldo||0).toFixed(2)}</div>
      </div>
      <div class="rodape-motorista">
        <div class="ganho"><div class="n">R$ 0,00</div><div class="r">Ganho hoje</div></div>
        <button class="btn btn-secundario btn-pequeno" onclick="sairMotorista()">Sair</button>
      </div>
      ${ativos.length>0?`<div class="cartao"><h2>🚛 Em Andamento</h2>${ativos.map(cartaoPedidoAtivo).join('')}</div>`:''}
      <div class="cartao">
        <h2>Pedidos Disponíveis</h2>
        ${disponiveis.length===0
          ?`<div class="vazio"><span class="emoji-grande">🛵</span>Sem pedidos no momento.</div>`
          :disponiveis.map(cartaoPedidoDisponivel).join('')
        }
      </div>`;
    }
  }

  app.innerHTML = `
    <header>
      <div class="marca"><div class="icone">F</div><h1>FlashEntregas<span>.</span></h1></div>
      <p class="tagline">Muzambinho-MG e região</p>
    </header>
    <div class="toggle-modo">
      <button class="${estado.modo==='cliente'?'ativo':''}" onclick="mudarModo('cliente')">Sou Cliente</button>
      <button class="${estado.modo==='entregador'?'ativo':''}" onclick="mudarModo('entregador')">Sou Entregador</button>
    </div>
    <div class="aviso">📍 Atendemos Muzambinho e cidades próximas. Valor calculado automaticamente por km.</div>
    <main>${conteudo}</main>
    ${modalChat()}
    ${estado.toast?`<div class="toast">${estado.toast}</div>`:''}
  `;
}

carregarPedidos();
</script>
</body>
</html>
