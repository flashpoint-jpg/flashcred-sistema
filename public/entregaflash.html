<style>
  :root{
    --noite:#15181c; --painel:#1e2227; --painel-alt:#242830; --linha:#2c313b;
    --mango:#ffc93c; --mango-escuro:#d9a92c; --chama:#ff5a3c; --escuro:#15181c;
    --osso:#f3efe4; --poeira:#a9a89c; --verde:#7fae72; --azul:#6a9bc4; --roxo:#a091c9;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--noite);color:var(--osso);font-family:'Karla',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 15% 0%, rgba(255,201,60,0.06), transparent 40%),var(--noite);padding-bottom:20px;}

  header.topo{padding:20px 20px 16px;position:relative;text-align:center;}
  .btn-instalar-topo{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,201,60,0.35);background:rgba(255,201,60,0.12);color:var(--mango,#ffc93c);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .btn-instalar-topo:active{transform:scale(0.94);}
  .marca{display:flex;flex-direction:column;align-items:center;gap:0;}
  .marca .logo-img{width:min(58%,220px);height:auto;filter:drop-shadow(0 6px 18px rgba(255,201,60,0.25));}
  .tagline{font-size:11.5px;color:var(--poeira);margin:8px 0 0;letter-spacing:1px;text-transform:uppercase;font-weight:600;text-align:center;}

  .toggle-modo{display:flex;margin:18px 20px 4px;background:var(--painel);border-radius:6px;padding:4px;border:1px solid var(--linha);}
  .toggle-modo button{flex:1;padding:11px 0;border:none;background:transparent;color:var(--poeira);font-family:'Karla';font-weight:700;font-size:14px;border-radius:4px;cursor:pointer;letter-spacing:0.3px;text-transform:uppercase;}

  .bv-wrap{padding:26px 20px 28px;}
  .bv-cabecalho{text-align:center;margin-bottom:22px;}
  .bv-cabecalho .logo-img{width:min(58%,200px);height:auto;filter:drop-shadow(0 6px 18px rgba(255,201,60,0.25));}
  .bv-cabecalho .tagline{font-size:11.5px;color:var(--poeira);margin:8px 0 0;letter-spacing:1px;text-transform:uppercase;font-weight:600;}
  .bv-titulo-grande{position:relative;text-align:center;font-family:'Rajdhani';font-weight:700;font-size:28px;line-height:1.15;text-transform:uppercase;color:var(--osso);margin:22px 0 10px;letter-spacing:0.3px;}
  .bv-titulo-grande::before{content:attr(data-text);position:absolute;left:0;top:0;width:100%;background-image:linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.95) 50%, transparent 70%);background-size:250% 100%;background-position:-120% 0;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;mix-blend-mode:overlay;pointer-events:none;animation:bv-aceso 1.6s ease-in-out 1 both;}
  .bv-titulo-grande .destaque{color:var(--mango);animation:bv-brilho 0.7s ease-out 1.35s 1 both;}
  @keyframes bv-aceso{0%{background-position:-120% 0;}100%{background-position:120% 0;}}
  @keyframes bv-brilho{0%{text-shadow:none;}55%{text-shadow:0 0 20px rgba(255,201,60,0.95),0 0 40px rgba(255,201,60,0.65);}100%{text-shadow:0 0 10px rgba(255,201,60,0.5);}}
  .bv-subtagline{text-align:center;font-size:12px;color:var(--poeira);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-bottom:24px;}
  .bv-pergunta{text-align:center;font-family:'Rajdhani';font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.4px;color:var(--osso);margin:0 0 18px;}
  .bv-cartao{background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:20px;margin-bottom:16px;}
  .bv-cartao.bv-motorista{border-color:rgba(255,201,60,0.35);}
  .bv-cartao .bv-titulo{display:flex;align-items:center;gap:8px;font-family:'Rajdhani';font-weight:700;font-size:17px;text-transform:uppercase;color:var(--osso);margin-bottom:10px;}
  .bv-cartao ul{list-style:none;margin:0 0 14px;padding:0;}

  .avatar-circulo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--linha);flex-shrink:0;cursor:pointer;}
  .avatar-linha{display:flex;align-items:center;gap:10px;}
  .admin-docs img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--linha);cursor:pointer;}

  .selo-cancelado{background:rgba(255,90,60,0.15);color:var(--chama);}
  .selo-prioridade{background:rgba(160,145,201,0.18);color:var(--roxo);margin-right:6px;}
  .linha-parada{display:flex;gap:8px;margin-top:8px;align-items:center;}
  .linha-parada input{flex:1;}
  .linha-parada .badge-parada{font-size:10.5px;font-weight:800;color:var(--poeira);width:20px;flex-shrink:0;text-align:center;}
  .btn-remover-parada{background:rgba(255,90,60,0.14);color:var(--chama);border:none;border-radius:4px;width:38px;height:38px;font-size:17px;cursor:pointer;flex-shrink:0;}
  .btn-add-parada{background:var(--painel-alt);border:1px dashed var(--linha);color:var(--poeira);border-radius:4px;padding:10px;font-size:12.5px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}
  .botoes-parada{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .btn-mover-parada{background:var(--painel-alt);border:1px solid var(--linha);color:var(--osso);border-radius:4px;width:26px;height:18px;font-size:11px;line-height:1;cursor:pointer;padding:0;}
  .btn-mover-parada:disabled{opacity:0.25;cursor:default;}
  .estrelas-input{display:flex;gap:4px;font-size:26px;line-height:1;}
  .estrela-clicavel{cursor:pointer;color:var(--linha);transition:color .15s;}
  .estrela-clicavel:hover, .estrela-clicavel:hover ~ .estrela-clicavel{color:var(--mango);}
  .estrelas-input:hover .estrela-clicavel{color:var(--mango);}
  .estrelas-fixas{color:var(--mango);letter-spacing:1px;font-size:14px;}
  .avaliacao-box{background:var(--painel-alt);border:1px solid var(--linha);border-radius:6px;padding:12px 14px;margin-top:12px;}
  .btn-ligar{background:rgba(127,174,114,0.14);color:var(--verde);border:1px solid rgba(127,174,114,0.4);border-radius:4px;padding:9px 12px;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
  .pedido-id-linha{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--painel-alt);border-radius:4px;padding:8px 12px;margin-top:10px;font-size:11px;color:var(--poeira);}

  .gps-ao-vivo{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--verde);margin-top:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
  .ponto-pulsante{width:9px;height:9px;border-radius:50%;background:var(--verde);flex-shrink:0;animation:pulsar 1.4s infinite;}

function valorExtras(extras){
  if(!extras) return 0;
  let total = 0;
  for(const k in EXTRAS_VALORES){ if(extras[k]) total += EXTRAS_VALORES[k]; }
  return Math.round(total*100)/100;
}

function normalizarTexto(t){
  return (t||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
const CIDADES_PERMITIDAS_NORM = CIDADES_PERMITIDAS.map(normalizarTexto);
function cidadeEhPermitida(item){
  const a = item && item.address ? item.address : {};
  const candidatos = [a.city, a.town, a.village, a.municipality, a.city_district, a.county];
  return candidatos.some(c => c && CIDADES_PERMITIDAS_NORM.includes(normalizarTexto(c)));
}

// ---------- configuração geral (editável no painel administrativo) ----------
async function carregarConfigGeral(){
  try{
    const { data, error } = await sb.from('entrega_config_geral').select('*').eq('id',1).maybeSingle();
    if(error || !data) return;
    aplicarConfigGeral(data);
  }catch(e){ console.error(e); }
}
function aplicarConfigGeral(c){
  PLANOS.free.taxaPlataforma = Number(c.free_taxa_plataforma_pct)/100;
  PLANOS.pro.taxaPlataforma = Number(c.pro_taxa_plataforma_pct)/100;

// ---------- geo ----------
function paraRad(g){ return g*Math.PI/180; }
function distanciaKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=paraRad(lat2-lat1), dLon=paraRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(paraRad(lat1))*Math.cos(paraRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function dentroDaRegiao(lat,lon){
  return lat>=REGIAO.minLat && lat<=REGIAO.maxLat && lon>=REGIAO.minLon && lon<=REGIAO.maxLon;
}
// Busca no Photon (bom para endereços incompletos/digitação parcial, tipo autocomplete de verdade)
async function buscarPhoton(texto, limite){
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(texto)}&lat=${CENTRO_REGIAO.lat}&lon=${CENTRO_REGIAO.lon}&zoom=13&limit=${limite}&lang=pt`;
  const resp = await fetch(url);
  const dados = await resp.json();
  const feats = (dados && dados.features) || [];
  return feats.map(f=>{
    const p = f.properties||{};
    const coords = f.geometry && f.geometry.coordinates; // [lon,lat]
    if(!coords) return null;
    const lon = coords[0], lat = coords[1];
    const cidade = p.city || p.town || p.village || p.county || '';
    const partes = [p.name, p.street, p.housenumber, p.district, cidade, p.state].filter(Boolean);
    return { lat, lon, cidade, nome: partes.join(', ') };
  }).filter(Boolean);
}
// Busca no Nominatim (reforço/fallback; exige texto mais parecido com o endereço completo)
async function buscarNominatim(texto, limite){
  const q = texto.toLowerCase().includes('mg') ? texto : texto+', MG, Brasil';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=${limite}`;
  const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
  const dados = await resp.json();
  return (dados||[]).map(item=>{
    const lat=parseFloat(item.lat), lon=parseFloat(item.lon);
    const a = item.address||{};
    const cidade = a.city||a.town||a.village||a.municipality||a.city_district||a.county||'';
    return { lat, lon, cidade, nome: item.display_name.split(',').slice(0,4).join(',').trim() };
  });
}
// Junta os dois provedores, prioriza resultados nas cidades atendidas, mas não descarta o resto
async function buscarEnderecos(texto, limite){
  let resultados = [];
  try{ resultados = await buscarPhoton(texto, limite); }catch(e){ console.error('Photon falhou', e); }
  resultados = resultados.filter(r=>dentroDaRegiao(r.lat,r.lon));
  if(resultados.length===0){
    try{ resultados = (await buscarNominatim(texto, limite)).filter(r=>dentroDaRegiao(r.lat,r.lon)); }
    catch(e){ console.error('Nominatim falhou', e); }
  }
  const norm = t => normalizarTexto(t);
  const permitidos = resultados.filter(r => r.cidade && CIDADES_PERMITIDAS_NORM.includes(norm(r.cidade)));
  const outros = resultados.filter(r => !(r.cidade && CIDADES_PERMITIDAS_NORM.includes(norm(r.cidade))));
  return [...permitidos, ...outros].slice(0,limite);
}
async function geocodificar(endereco){
  try{
    const achados = await buscarEnderecos(endereco, 5);
    if(!achados.length) return null;
    return { lat: achados[0].lat, lon: achados[0].lon };
  }catch(e){ console.error(e); return null; }
}
function precoDeDistancia(veiculo, km, roca){
  const v=VEICULOS[veiculo];
  const taxaKm = (roca && v.kmRoca!=null) ? v.kmRoca : v.km;
  return Math.round(Math.max(v.minimo||0, taxaKm*km)*100)/100;
}
function ganhoMotorista(preco){ const plano = PLANOS[estado.motorista.plano] || PLANOS.free; return Math.round(preco*(1-plano.taxaPlataforma)*100)/100; }

// ---------- preenchimento automático de endereço ----------
async function buscarSugestoes(campo){
  const inputEl = document.getElementById('c-'+campo);
  const cont = document.getElementById('sugestoes-'+campo);
  if(!inputEl || !cont) return;
  const texto = inputEl.value.trim();
  if(texto.length<3){ cont.innerHTML=''; estado.sugestoesTemp[campo]=[]; return; }
  cont.innerHTML = `<div class="sugestao-vazia">Buscando endereços...</div>`;
  try{
    const achados = await buscarEnderecos(texto, 6);
    // o campo pode ter mudado enquanto a busca corria - confere se ainda é o texto atual
    if(document.getElementById('c-'+campo).value.trim() !== texto) return;
    if(!achados || achados.length===0){ cont.innerHTML = `<div class="sugestao-vazia">Não achei sugestões prontas pra "${texto}". Pode continuar digitando o endereço completo normalmente — ao calcular, se não achar automaticamente, dá pra informar a distância manualmente ou usar "Sítio/roça sem endereço certo?" abaixo.</div>`; return; }
    estado.sugestoesTemp[campo] = achados;
    cont.innerHTML = estado.sugestoesTemp[campo].map((s,idx)=>
      `<div class="sugestao-item" onclick="selecionarSugestao('${campo}',${idx})">📍 ${s.nome}</div>`
    ).join('');
  }catch(e){ console.error(e); cont.innerHTML = `<div class="sugestao-vazia">Não consegui buscar agora. Continua digitando o endereço completo ou tenta de novo em instantes.</div>`; }

function selecionarSugestao(campo, idx){

// ---------- aviso sonoro + visual: motorista encontrado ----------
function tocarSomAlerta(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const tocarNota=(freq,inicio,duracao)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime+inicio);
      gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime+inicio+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+inicio+duracao);
      osc.start(ctx.currentTime+inicio); osc.stop(ctx.currentTime+inicio+duracao+0.05);
    };
    tocarNota(740,0,0.16); tocarNota(988,0.16,0.22);
  }catch(e){ console.warn('audio indisponível', e); }
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}
function dispararAlertaMotorista(pedido){
  estado.alertaMotorista = { nome: pedido.motoristaNome||'Um entregador', pedidoId: pedido.id };
  render();
  tocarSomAlerta();
  clearTimeout(window._alertaMotoristaTimer);
  window._alertaMotoristaTimer = setTimeout(()=>{ estado.alertaMotorista=null; render(); }, 7000);
}
function fecharAlertaMotorista(){ clearTimeout(window._alertaMotoristaTimer); estado.alertaMotorista=null; render(); }
function detectarMotoristaEncontrado(novos){
  if(estado.modo!=='cliente' || !estado.filtroTelefoneCliente) return;
  const MENSAGENS_STATUS = {
    coletado: 'O entregador recolheu o teu pedido!',
    a_caminho: 'O teu pedido está a caminho!',
    entregue: 'O teu pedido foi entregue!',
    cancelado: 'O teu pedido foi cancelado.'
  };
  novos.forEach(np=>{
    if(np.clienteTelefone!==estado.filtroTelefoneCliente) return;
    const anterior = estado.statusAnterior[np.id];
    if(anterior==='buscando' && np.status!=='buscando'){
      dispararAlertaMotorista(np);
      notificar('Entregador encontrado!', `${np.motoristaNome||'Um entregador'} vai levar o teu pedido.`, 'pedido-'+np.id);
    } else if(anterior && anterior!=='buscando' && np.status==='buscando' && np.canceladoPor==='motorista'){
      mostrarToast('O motorista cancelou a corrida. A buscar outro entregador perto de ti...');
      notificar('Entrega Flash', 'O motorista cancelou a corrida. Estamos a buscar outro entregador perto de ti.', 'pedido-'+np.id);
    } else if(anterior && anterior!==np.status && MENSAGENS_STATUS[np.status]){
      notificar('Entrega Flash', MENSAGENS_STATUS[np.status], 'pedido-'+np.id);
    }
    estado.statusAnterior[np.id] = np.status;
  });
}
function detectarNovosPedidosMotorista(novos){
  if(estado.modo!=='entregador' || !estado.motorista.ativo || !estado.motorista.disponivel) return;
  novos.forEach(np=>{
    if(np.status!=='buscando') return;
    if(estado.statusAnteriorMotorista[np.id]) return;
    estado.statusAnteriorMotorista[np.id] = true;
    notificar('Novo pedido disponível!', `${np.origem} → ${np.destino} · R$ ${Number(np.preco).toFixed(2)}`, 'novo-'+np.id);
  });
  const idsAtuais = new Set(novos.map(p=>p.id));
  Object.keys(estado.statusAnteriorMotorista).forEach(id=>{ if(!idsAtuais.has(id)) delete estado.statusAnteriorMotorista[id]; });
}
function detectarCancelamentoClienteMotorista(novos){
  if(estado.modo!=='entregador' || !estado.motorista.ativo) return;
  novos.forEach(np=>{
    if(np.motoristaTelefone!==estado.motorista.telefone) return;
    const anterior = estado.statusAnteriorEntregaMotorista[np.id];
    if(anterior && anterior!=='cancelado' && np.status==='cancelado' && np.canceladoPor==='cliente'){
      mostrarToast('O cliente cancelou a corrida.');
      notificar('Entrega Flash', 'O cliente cancelou a corrida.', 'pedido-cancelado-'+np.id);
    }
    estado.statusAnteriorEntregaMotorista[np.id] = np.status;
  });
  const idsAtuais = new Set(novos.map(p=>p.id));
  Object.keys(estado.statusAnteriorEntregaMotorista).forEach(id=>{ if(!idsAtuais.has(id)) delete estado.statusAnteriorEntregaMotorista[id]; });
}

async function carregarPedidos(){
  try{
    await verificarBloqueioAtivo();
    const {data,error} = await sb.from('entrega_pedidos').select('*').order('criado_em',{ascending:false});
    if(error){
      console.error(error);
      if(!estado.erroMostrado){ estado.erroMostrado=true; mostrarToast('Erro ao ligar à base de dados: '+(error.message||'verifica a ligação')); }
      return;
    }
    estado.erroMostrado = false;
    const novos = (data||[]).map(paraCamposApp);
    const novoJSON = JSON.stringify(novos);
    if(estado.modo==='entregador' && estado.motorista.ativo){ carregarSaldoMotorista(); carregarCancelamentosMotorista(); atualizarBadgeSuporteMotorista(); }
    if(novoJSON===estado.ultimoPedidosJSON){ estado.carregando=false; return; }
    detectarMotoristaEncontrado(novos);
    detectarNovosPedidosMotorista(novos);
    detectarCancelamentoClienteMotorista(novos);
    estado.pedidos=novos; estado.ultimoPedidosJSON=novoJSON; estado.carregando=false;
    await carregarNaoLidasChat();
    render();
  }catch(e){
    console.error(e);
    if(!estado.erroMostrado){ estado.erroMostrado=true; mostrarToast('Falha de ligação à internet ou à base de dados.'); }
  }
}
async function verificarBloqueioAtivo(){
  try{
    if(estado.cliente.logado && estado.cliente.telefone){
      const { data } = await sb.from('entrega_clientes').select('bloqueado').eq('telefone', estado.cliente.telefone).maybeSingle();
      if(data && data.bloqueado){
        sairCliente();
        estado.painelCliente.loginErro='Esta conta foi bloqueada. Fala com o suporte para mais informações.';
        mostrarToast('A tua conta foi bloqueada pelo suporte.');
        render();
        return;
      }
    }
    if(estado.motorista.ativo && estado.motorista.telefone){
      const { data } = await sb.from('entrega_motoristas').select('status').eq('telefone', estado.motorista.telefone).maybeSingle();
      if(data && data.status==='bloqueado'){
        sairMotorista();
        estado.painelMotorista.loginErro='O teu cadastro foi bloqueado. Fala com o suporte para mais informações.';
        mostrarToast('O teu cadastro foi bloqueado pelo suporte.');
        render();
        return;
      }
    }
  }catch(e){ console.error(e); }
}
async function salvarPedido(p){
  const {error} = await sb.from('entrega_pedidos').upsert(paraCamposDB(p));
  if(error){ console.error(error); mostrarToast('Erro ao gravar o pedido.'); }
  estado.ultimoPedidosJSON='';
}

async function enviarMensagem(){

  const eu = estado.modo==='cliente' ? 'cliente' : 'motorista';

function assinarChat(pedidoId){
  if(estado.canalChat) sb.removeChannel(estado.canalChat);
  estado.canalChat = sb.channel('chat:'+pedidoId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'entrega_chat',filter:'pedido_id=eq.'+pedidoId}, async ()=>{
      estado.mensagens = await carregarMensagens(pedidoId);
      renderChat();
    }).subscribe();

async function abrirChat(pedidoId){
  estado.chatAberto = { pedidoId };
  estado.mensagens = await carregarMensagens(pedidoId);
  const outro = estado.modo==='cliente' ? 'motorista' : 'cliente';
  await sb.from('entrega_chat').update({lido:true}).eq('pedido_id',pedidoId).eq('remetente_tipo',outro).eq('lido',false);
  delete estado.chatNaoLidas[pedidoId];
  assinarChat(pedidoId);
  render();
}
// conta mensagens não lidas por pedido (para mostrar o número no botão de chat e notificar)
async function carregarNaoLidasChat(){
  let meusIds = [];
  if(estado.modo==='cliente' && estado.filtroTelefoneCliente){
    meusIds = estado.pedidos.filter(p=>p.clienteTelefone===estado.filtroTelefoneCliente).map(p=>p.id);
  } else if(estado.modo==='entregador' && estado.motorista.ativo && estado.motorista.telefone){
    meusIds = estado.pedidos.filter(p=>p.motoristaTelefone===estado.motorista.telefone).map(p=>p.id);
  }
  if(meusIds.length===0){ estado.chatNaoLidas={}; return; }
  const outro = estado.modo==='cliente' ? 'motorista' : 'cliente';
  const { data, error } = await sb.from('entrega_chat').select('pedido_id').eq('remetente_tipo', outro).eq('lido', false).in('pedido_id', meusIds);
  if(error){ console.error(error); return; }
  const contagem = {};
  (data||[]).forEach(m=>{ contagem[m.pedido_id] = (contagem[m.pedido_id]||0)+1; });
  if(estado.chatAberto) delete contagem[estado.chatAberto.pedidoId];
  estado.chatNaoLidas = contagem;
}

  canalChatGlobalRealtime = sb.channel('chat-global-realtime')

      tratarNovaMensagemChatGlobal(payload.new);

function tratarNovaMensagemChatGlobal(msg){
  const eu = estado.modo==='cliente' ? 'cliente' : (estado.modo==='entregador' ? 'motorista' : null);
  if(!eu || !msg || msg.remetente_tipo===eu) return;
  const p = estado.pedidos.find(x=>x.id===msg.pedido_id);
  if(!p) return;
  const meuPedido = estado.modo==='cliente' ? p.clienteTelefone===estado.filtroTelefoneCliente : p.motoristaTelefone===estado.motorista.telefone;
  if(!meuPedido) return;
  if(estado.chatAberto && estado.chatAberto.pedidoId===msg.pedido_id) return; // já é tratado pelo canal do chat aberto
  estado.chatNaoLidas[msg.pedido_id] = (estado.chatNaoLidas[msg.pedido_id]||0)+1;
  tocarSomAlerta();
  mostrarToast(`💬 Nova mensagem de ${msg.remetente_nome || (eu==='cliente'?'entregador':'cliente')}`);
  notificar('Nova mensagem no chat', msg.texto, 'chat-'+msg.pedido_id);
  render();
}
function fecharChat(){
  if(estado.canalChat){ sb.removeChannel(estado.canalChat); estado.canalChat=null; }
  estado.chatAberto=null; estado.mensagens=[];

function renderChat(){
  const caixa = document.getElementById('chat-mensagens');
  if(!caixa) return;
  const eu = estado.modo==='cliente' ? 'cliente' : 'motorista';
  caixa.innerHTML = estado.mensagens.length===0
    ? `<div class="chat-vazio">Nenhuma mensagem ainda. Diz olá!</div>`
    : estado.mensagens.map(m=>{
        const minha = m.remetente_tipo===eu;
        const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        return `<div class="bolha ${minha?'bolha-eu':'bolha-outro'}">${m.texto}<span>${hora}</span></div>`;
      }).join('');
  caixa.scrollTop = caixa.scrollHeight;
}

async function carregarSuporteAdmin(){
  const { data: msgs } = await sb.from('entrega_suporte').select('*').order('criado_em',{ascending:false});

  const statusMap = {}; (status||[]).forEach(s=>{ statusMap[s.motorista_telefone]=s.status; });
  const porTelefone = {};
  (msgs||[]).forEach(m=>{
    if(!porTelefone[m.motorista_telefone]) porTelefone[m.motorista_telefone] = { telefone:m.motorista_telefone, nome:m.motorista_nome, ultimaEm:m.criado_em, naoLidas:0 };
    if(m.remetente_tipo==='motorista' && !m.lido) porTelefone[m.motorista_telefone].naoLidas++;
  });
  const planoPorTelefone = {};
  (estado.admin.motoristas||[]).forEach(mo=>{ planoPorTelefone[mo.telefone]=mo.plano; });
  estado.admin.suporteConversas = Object.values(porTelefone).map(c=>({
    ...c, status: statusMap[c.telefone]||'aberto', plano: planoPorTelefone[c.telefone]||'free'

    const prioA = a.plano==='pro'?0:1, prioB = b.plano==='pro'?0:1;

}

// ---------- ações ----------
async function calcularCorrida(){
  const f = estado.form;
  if(!f.origem || !f.destino){ mostrarToast('Preenche recolha e destino primeiro.'); return; }
  estado.calculando = true; estado.falhaCalculo = false; render();
  const origemCoord = f.origemCoord || await geocodificar(f.origem);
  const destinoCoord = f.destinoCoord || await geocodificar(f.destino);
  estado.calculando = false;
  if(!origemCoord || !destinoCoord){
    f.distancia=null;
    // preserva a coordenada que já foi encontrada (ex: veio do GPS) — só limpa a que falhou
    if(!origemCoord) f.origemCoord=null;
    if(!destinoCoord) f.destinoCoord=null;
    estado.falhaCalculo = true;
    const qual = !origemCoord && !destinoCoord ? 'o endereço de recolha e o de entrega' : (!origemCoord ? 'o endereço de recolha' : 'o endereço de entrega');
    mostrarToast(`Não achei ${qual} automaticamente. Informa a distância manualmente abaixo, ou usa "Sítio/roça sem endereço certo?" para pegar a localização por GPS.`);
    render(); return;
  }
  const kmReal = distanciaKm(origemCoord.lat,origemCoord.lon,destinoCoord.lat,destinoCoord.lon)*1.3;
  f.distancia = Math.round(kmReal*10)/10;
  f.distanciaGPS = f.distancia; f.distanciaDivergente = false;
  f.origemCoord = origemCoord; f.destinoCoord = destinoCoord;
  const veloc = VEICULOS[f.veiculo].veloc;
  f.duracaoMin = Math.max(3, Math.round((f.distancia/veloc)*60));
  render();
}

function usarDistanciaManual(){
  const input = document.getElementById('c-distancia-manual');
  const km = parseFloat(input.value);
  if(!km || km<=0){ mostrarToast('Informa um número de km válido.'); return; }
  if(km > KM_MANUAL_MAXIMO){ mostrarToast(`Distância máxima permitida: ${KM_MANUAL_MAXIMO} km. Se a entrega é mais longe que isso, fala com a gente antes de confirmar.`); return; }
  const f = estado.form;
  // proteção anti-fraude: só se comparável a uma distância real já calculada por GPS antes
  if(f.distanciaGPS!=null && f.distanciaGPS>0){
    const pct = km / f.distanciaGPS;
    if(pct < 0.4 || pct > 1.3){
      mostrarToast('Valor muito diferente do esperado pelo GPS. Use o valor automático ou ajuste a distância.');
      registrarAlertaAdmin('fraude_distancia', `Tentativa de distância muito fora do esperado: cliente ${estado.cliente.telefone||f.telefone||'?'} digitou ${km} km, GPS calculou ${f.distanciaGPS} km (${Math.round(pct*100)}%).`);
      return;
    }
    if(pct >= 0.4 && pct < 0.7){
      if(!confirm(`A distância que informaste (${km} km) difere bastante do calculado pelo GPS (${f.distanciaGPS} km). Confirma mesmo assim?`)) return;
      f.distanciaDivergente = true;
      registrarAlertaAdmin('distancia_divergente', `Cliente ${estado.cliente.telefone||f.telefone||'?'} confirmou distância divergente: ${km} km informado vs ${f.distanciaGPS} km do GPS (${Math.round(pct*100)}%).`);
    }
  }
  estado.form.distancia = Math.round(km*10)/10;
  estado.form.origemCoord = null;
  estado.form.destinoCoord = null;
  const veloc = VEICULOS[estado.form.veiculo].veloc;
  estado.form.duracaoMin = Math.max(3, Math.round((estado.form.distancia/veloc)*60));
  estado.falhaCalculo = false;
  render();
}

function campoEhParada(campo){ return typeof campo==='string' && campo.indexOf('parada-')===0; }
function paradaIdxDe(campo){ return parseInt(campo.split('-')[1],10); }
function abrirSemEndereco(campo){ estado.semEndereco = { aberto:true, campo: campo||'origem', mapsLink:'', plusCode:'', erro:'', enviandoFoto:false }; render(); }

async function usarGPSSemEndereco(){
  if(!navigator.geolocation){ mostrarToast('Teu navegador não suporta localização por GPS.'); return; }
  const campo = estado.semEndereco.campo;
  estado.semEndereco.erro = '';
  mostrarToast('A obter tua localização...');
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      const texto = `📍 Localização GPS (${lat.toFixed(5)}, ${lon.toFixed(5)})`;
      if(campoEhParada(campo)){
        const idx = paradaIdxDe(campo);
        estado.form.paradas[idx] = texto;
        if(!estado.form.paradasCoords) estado.form.paradasCoords = [];
        estado.form.paradasCoords[idx] = { lat, lon };
      } else {
        estado.form[campo+'Coord'] = { lat, lon };
        estado.form[campo] = texto;
        estado.form.distancia = null;
      }
      fecharSemEndereco();
      mostrarToast('Localização capturada! Agora calcula a corrida.');
      autoCalcularSeCompleto();
    },
    ()=>{ estado.semEndereco.erro = 'Não consegui pegar tua localização. Ativa o GPS e tenta de novo.'; render(); },
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
}
function usarLinkMapsSemEndereco(){
  const campo = estado.semEndereco.campo;
  const input = document.getElementById('se-maps-link');
  const link = (input?.value||'').trim();
  if(!link){ estado.semEndereco.erro = 'Cola o link que a pessoa compartilhou.'; render(); return; }
  const match = link.match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  const ehParada = campoEhParada(campo);
  if(match){
    const lat = parseFloat(match[1]), lon = parseFloat(match[2]);
    const texto = `📍 Localização compartilhada (${lat.toFixed(5)}, ${lon.toFixed(5)})`;
    if(ehParada){
      const idx = paradaIdxDe(campo);
      estado.form.paradas[idx] = texto;
      if(!estado.form.paradasCoords) estado.form.paradasCoords = [];
      estado.form.paradasCoords[idx] = { lat, lon };
    } else {
      estado.form[campo+'Coord'] = { lat, lon };
      estado.form[campo] = texto;
      estado.form.distancia = null;
    }
    fecharSemEndereco();
    mostrarToast('Localização do link capturada! Agora calcula a corrida.');
    autoCalcularSeCompleto();
  } else {
    if(ehParada){
      const idx = paradaIdxDe(campo);
      estado.form.paradas[idx] = link;
    } else {
      estado.form[campo+'Referencia'] = link;
    }
    fecharSemEndereco();
    mostrarToast('Não consegui ler as coordenadas — guardei o link para o motorista abrir direto.');
  }
}

async function criarPedido(){
  const f = estado.form;
  if(!f.nome||!f.telefone||!f.origem||!f.destino){ mostrarToast('Preenche nome, telefone, recolha e destino.'); return; }
  if(f.distancia==null){ mostrarToast('Calcula a corrida primeiro.'); return; }
  if(f.distancia > KM_MANUAL_MAXIMO){ mostrarToast(`Distância acima do limite permitido (${KM_MANUAL_MAXIMO} km). Ajusta a distância antes de confirmar.`); return; }
  const paradasBrutas = (f.paradas||[]).map((texto,idx)=>({ texto:(texto||'').trim(), coord:(f.paradasCoords||[])[idx]||null })).filter(x=>x.texto);
  estado.calculando = true; render();
  for(const item of paradasBrutas){
    if(!item.coord){
      item.coord = await geocodificar(item.texto);
    }
  }
  estado.calculando = false; render();
  const foraDaArea = paradasBrutas.find(x=>!x.coord);
  if(foraDaArea){
    const ehReferencia = /^📍|^📝|Plus Code/.test(foraDaArea.texto);
    if(!ehReferencia){
      if(!confirm(`Não consegui confirmar automaticamente o endereço "${foraDaArea.texto}". Podes continuar mesmo assim (o motorista vai receber só o texto, sem localização automática) ou cancelar e ajustar o endereço. Continuar?`)) return;
    }
  }
  const paradasValidas = paradasBrutas.map(x=>x.texto);
  const paradasCoordsValidas = paradasBrutas.map(x=>x.coord);
  if(f.tipoRetirada==='agendado' && !f.horarioAgendado){ mostrarToast('Escolhe a data e hora da retirada agendada.'); return; }
  const preco = precoDeDistancia(f.veiculo, f.distancia, f.roca) + (f.prioridade ? TAXA_PRIORIDADE_VALOR : 0) + valorExtras(f.extras) + (paradasValidas.length * TAXA_PARADA_EXTRA_VALOR);

  // ---- checagem de saldo: busca o saldo mais atual direto do banco antes de liberar o pedido ----
  const w = estado.cliente.carteira;
  let saldoAtualCliente = 0;
  try{
    const { data:saldoRow } = await sb.from('entrega_clientes_saldos').select('saldo').eq('telefone', estado.cliente.telefone).maybeSingle();
    saldoAtualCliente = saldoRow ? Number(saldoRow.saldo)||0 : 0;
  }catch(e){ console.error(e); mostrarToast('Não consegui checar teu saldo. Tenta novamente.'); return; }
  w.saldo = saldoAtualCliente;
  if(saldoAtualCliente < preco){
    mostrarToast('Você está sem saldo. Adicione saldo para continuar.');
    abrirAdicionarSaldo();
    setTimeout(()=>{ document.querySelector('.pix-box')?.scrollIntoView({behavior:'smooth', block:'center'}); }, 50);
    return;
  }

  // ---- debita o saldo do cliente de forma atômica no banco ANTES de criar o pedido ----
  // (evita saldo negativo por concorrência: duas abas/pedidos ao mesmo tempo)
  let saldoAposDebito;
  try{
    const { data, error: erroDebito } = await sb.rpc('entrega_ajustar_saldo_cliente_pedido', { p_telefone: estado.cliente.telefone, p_delta: -preco });
    if(erroDebito){
      if(erroDebito.message==='saldo_insuficiente'){
        mostrarToast('Você está sem saldo. Adicione saldo para continuar.');
        abrirAdicionarSaldo();
        setTimeout(()=>{ document.querySelector('.pix-box')?.scrollIntoView({behavior:'smooth', block:'center'}); }, 50);
      } else {
        console.error(erroDebito);
        mostrarToast('Não consegui debitar o saldo. Tenta novamente.');
      }
      return;
    }
    saldoAposDebito = Number(data)||0;
  }catch(e){ console.error(e); mostrarToast('Não consegui debitar o saldo. Tenta novamente.'); return; }
  w.saldo = saldoAposDebito;
  estado.cliente.carteira.saldo = saldoAposDebito;

  const agora = Date.now();
  const pedido = {
    id:'p'+agora+Math.floor(Math.random()*1000),
    clienteNome:f.nome, clienteTelefone:f.telefone,
    origem:f.origem, destino:f.destino, origemCoord:f.origemCoord, destinoCoord:f.destinoCoord,
    origemFotoUrl:f.origemFotoUrl||null, origemReferencia:f.origemReferencia||'',
    destinoFotoUrl:f.destinoFotoUrl||null, destinoReferencia:f.destinoReferencia||'',
    paradas:paradasValidas, paradasCoords:paradasCoordsValidas, paradaAtual:0, tipoRetirada:f.tipoRetirada, horarioAgendado:f.tipoRetirada==='agendado'?f.horarioAgendado:null,
    editado:false, canceladoEm:null, taxaCancelamento:0, prioridade:!!f.prioridade,
    veiculo:f.veiculo, descricao:f.descricao, distancia:f.distancia, distanciaGPS:f.distanciaGPS, distanciaDivergente:!!f.distanciaDivergente, preco:preco,
    extras: {...f.extras},
    status:'buscando', motoristaNome:'', motoristaTelefone:'', criadoEm:agora, atualizadoEm:agora
  };
  const { error: erroSalvar } = await sb.from('entrega_pedidos').upsert(paraCamposDB(pedido));
  if(erroSalvar){
    // não conseguiu criar o pedido: estorna o valor já debitado, senão o cliente perde o dinheiro sem receber nada
    console.error(erroSalvar);
    const { error: erroEstorno } = await sb.rpc('entrega_ajustar_saldo_cliente_pedido', { p_telefone: estado.cliente.telefone, p_delta: preco });
    if(erroEstorno){ console.error(erroEstorno); }
    else{ w.saldo = w.saldo + preco; estado.cliente.carteira.saldo = w.saldo; }
    mostrarToast('Não consegui criar o pedido. O valor debitado foi estornado.');
    return;
  }
  estado.ultimoPedidosJSON='';
  estado.filtroTelefoneCliente = f.telefone;
  estado.form = { nome:f.nome, telefone:f.telefone, origem:'', destino:'', paradas:[], tipoRetirada:'agora', horarioAgendado:'', veiculo:'moto', descricao:'', distancia:null, duracaoMin:null, distanciaGPS:null, distanciaDivergente:false, origemCoord:null, destinoCoord:null, prioridade:false, origemFotoUrl:null, origemReferencia:'', destinoFotoUrl:null, destinoReferencia:'', roca:false, extras:extrasVazios() };
  mostrarToast(f.tipoRetirada==='agendado' ? 'Pedido agendado com sucesso!' : 'Pedido criado! Buscando um entregador...');
  await carregarPedidos();
}

// ---------- avaliação do motorista ----------
function starsHTML(nota){
  if(nota==null) return '';
  const cheias = Math.round(nota);
  return `<span class="estrelas-fixas">${'★'.repeat(cheias)}${'☆'.repeat(5-cheias)}</span> <span style="color:var(--poeira)">${Number(nota).toFixed(1)}</span>`;
}
async function avaliarMotorista(pedidoId, nota){
  const p = estado.pedidos.find(x=>x.id===pedidoId);
  if(!p || p.status!=='entregue' || p.avaliacaoNota || !p.motoristaTelefone) return;
  const { error: erroPedido } = await sb.from('entrega_pedidos').update({ avaliacao_nota: nota }).eq('id', pedidoId);
  if(erroPedido){ console.error(erroPedido); mostrarToast('Erro ao salvar a avaliação.'); return; }
  const { data: mot, error: erroMot } = await sb.from('entrega_motoristas').select('nota_media,total_avaliacoes').eq('telefone', p.motoristaTelefone).maybeSingle();
  if(!erroMot && mot){
    const totalAtual = Number(mot.total_avaliacoes)||0;
    const mediaAtual = Number(mot.nota_media)||5;
    const novoTotal = totalAtual+1;
    const novaMedia = Math.round(((mediaAtual*totalAtual)+nota)/novoTotal*100)/100;
    await sb.from('entrega_motoristas').update({ nota_media:novaMedia, total_avaliacoes:novoTotal }).eq('telefone', p.motoristaTelefone);
  }
  mostrarToast('Obrigado pela avaliação!');
  estado.ultimoPedidosJSON='';
  await carregarPedidos();
}

// ---------- cancelamento de pedido ----------
function infoCancelamento(p){
  const dentroDaJanela = (Date.now() - p.criadoEm) <= JANELA_CANCELAMENTO_MS;
  const taxa = dentroDaJanela ? 0 : Math.round(p.preco*TAXA_CANCELAMENTO_TARDIO*100)/100;
  return { dentroDaJanela, taxa };
}
function podeCancelar(p){
  return p.status==='buscando' || p.status==='indo_coletar';
}
async function cancelarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p || !podeCancelar(p)) return;
  const { dentroDaJanela, taxa } = infoCancelamento(p);
  const mensagem = dentroDaJanela
    ? 'Cancelar esta corrida agora? Não haverá cobrança e o valor volta para a tua carteira.'
    : `Já passaram mais de 10 minutos. Cancelar agora vai cobrar uma taxa de R$ ${taxa.toFixed(2)} (10% do valor) — o restante volta para a tua carteira. Confirmar?`;
  if(!confirm(mensagem)) return;
  const agora = Date.now();
  const { error } = await sb.from('entrega_pedidos').update({
    status:'cancelado', atualizado_em:agora, cancelado_em:agora, taxa_cancelamento: dentroDaJanela?0:taxa, cancelado_por:'cliente'
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao cancelar o pedido.'); return; }

  // ---- devolve o valor (menos a taxa, se houver) para a carteira do cliente ----
  const valorDevolver = Math.round((p.preco - (dentroDaJanela?0:taxa))*100)/100;
  if(valorDevolver>0){
    try{
      const { data, error: erroEstorno } = await sb.rpc('entrega_ajustar_saldo_cliente_pedido', { p_telefone: p.clienteTelefone, p_delta: valorDevolver });
      if(erroEstorno){
        console.error(erroEstorno);
        mostrarToast('Pedido cancelado, mas houve um erro ao devolver o valor à carteira. Contacta o suporte.');
        await carregarPedidos();
        return;
      }
      if(estado.cliente.telefone===p.clienteTelefone){ estado.cliente.carteira.saldo = Number(data)||0; }
    }catch(e){
      console.error(e);
      mostrarToast('Pedido cancelado, mas houve um erro ao devolver o valor à carteira. Contacta o suporte.');
      await carregarPedidos();
      return;
    }
  }

  mostrarToast(dentroDaJanela ? 'Pedido cancelado sem custo. Valor devolvido à tua carteira.' : `Pedido cancelado. Taxa de R$ ${taxa.toFixed(2)} aplicada, o restante voltou para a tua carteira.`);
  await carregarPedidos();
}

// ---------- carteira digital do cliente (saldo via Pix) ----------
async function carregarCarteiraCliente(){
  const w = estado.cliente.carteira;
  if(!estado.cliente.telefone) return;
  w.carregando = true; render();
  try{
    const { data } = await sb.from('entrega_clientes_saldos').select('saldo').eq('telefone', estado.cliente.telefone).maybeSingle();
    w.saldo = data ? Number(data.saldo)||0 : 0;
  }catch(e){ console.error(e); }
  w.carregando = false; render();
}
function abrirAdicionarSaldo(){
  const w = estado.cliente.carteira;
  w.adicionando = true; w.pix = { qrCode:null, copiaCola:null, status:'pendente', gerando:false, erro:'', id:null };
  render();
}
function fecharAdicionarSaldo(){
  const w = estado.cliente.carteira;
  w.adicionando = false;
  if(pixPollTimer){ clearInterval(pixPollTimer); pixPollTimer=null; }
  render();
}
async function confirmarValorCarteira(){
  const w = estado.cliente.carteira;
  const valor = parseFloat(document.getElementById('carteira-valor')?.value);
  if(!valor || valor<=0){ mostrarToast('Informa um valor válido.'); return; }
  w.valorInput = String(valor);
  w.gerando = true; w.pix.erro=''; render();
  try{
    const resp = await fetch(`${FUNCOES_URL}/criar-cobranca-pix-carteira`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ telefone:estado.cliente.telefone, nome:estado.cliente.nome, valor })
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro){ throw new Error(dados.erro || 'Falha ao gerar cobrança PIX.'); }
    w.pix.qrCode = dados.qrCodeBase64; w.pix.copiaCola = dados.copiaCola; w.pix.id = dados.id; w.pix.gerando=false;
    render();
    iniciarPollingCarteira();
  }catch(e){
    console.error(e);
    w.pix.gerando=false;
    w.pix.erro = 'Não consegui gerar a cobrança PIX. Tenta novamente em instantes.';
    render();
  }
}
function iniciarPollingCarteira(){
  if(pixPollTimer) clearInterval(pixPollTimer);
  pixPollTimer = setInterval(async ()=>{
    const w = estado.cliente.carteira;
    if(!w.pix.id || w.pix.status==='pago'){ clearInterval(pixPollTimer); pixPollTimer=null; return; }
    const { data } = await sb.from('entrega_carteira_pix').select('status').eq('id', w.pix.id).maybeSingle();
    if(data && data.status==='pago'){
      w.pix.status='pago'; clearInterval(pixPollTimer); pixPollTimer=null;
      await carregarCarteiraCliente();
      mostrarToast('Saldo adicionado com sucesso!');
      w.adicionando = false; render();
    }
  }, 4000);
}
function copiarPixCarteira(){
  const w = estado.cliente.carteira;
  if(!w.pix.copiaCola) return;
  navigator.clipboard.writeText(w.pix.copiaCola).then(()=>mostrarToast('Código PIX copiado!'));
}

function entregasDoMesAtual(telefone){
  const agora = new Date(); const inicioMes = new Date(agora.getFullYear(), agora.getMonth(), 1).getTime();
  return estado.pedidos.filter(p=>p.motoristaTelefone===telefone && p.status!=='buscando' && p.criadoEm>=inicioMes).length;
}
function entregasSimultaneasAtivas(telefone){
  return estado.pedidos.filter(p=>p.motoristaTelefone===telefone && ['indo_coletar','coletado','a_caminho'].includes(p.status)).length;
}
async function aceitarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const plano = PLANOS[estado.motorista.plano] || PLANOS.free;
  if(plano.limiteMensal!=null && entregasDoMesAtual(estado.motorista.telefone)>=plano.limiteMensal){
    mostrarToast(`Limite do plano Free (${plano.limiteMensal} entregas/mês) atingido. Passa para o Pro para entregas ilimitadas.`);
    return;
  }
  if(entregasSimultaneasAtivas(estado.motorista.telefone)>=plano.limiteSimultaneo){
    mostrarToast(`No plano ${plano.label} você pode ter até ${plano.limiteSimultaneo} entregas em andamento ao mesmo tempo. Finaliza uma para aceitar outra.`);
    return;
  }
  const mo = estado.motorista;
  const { error } = await sb.from('entrega_pedidos').update({
    status:'indo_coletar', motorista_nome: mo.nome, motorista_telefone: mo.telefone, atualizado_em: Date.now(),
    motorista_foto_url: mo.fotoMotoristaUrl||null, motorista_veiculo_tipo: mo.veiculo||null,
    motorista_marca: mo.marca||null, motorista_cor: mo.cor||null, motorista_placa: mo.placa||null,
    motorista_nota_media: mo.notaMedia!=null?mo.notaMedia:5, motorista_total_avaliacoes: mo.totalAvaliacoes||0,
    iniciado_em: null
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao aceitar o pedido.'); return; }
  estado.ultimoPedidosJSON='';
  mostrarToast('Pedido aceito! Toca em "Iniciar corrida" quando estiveres pronto para seguir até a coleta.');
  await carregarPedidos();
}
async function iniciarCorrida(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p || p.motoristaTelefone!==estado.motorista.telefone || p.iniciadoEm) return;
  const { error } = await sb.from('entrega_pedidos').update({ iniciado_em: Date.now(), atualizado_em: Date.now() }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao iniciar a corrida.'); return; }
  mostrarToast('Corrida iniciada! Segue até o endereço de coleta.');
  iniciarRastreioMotorista();
  estado.ultimoPedidosJSON='';
  await carregarPedidos();
}

// ---------- cancelamento pelo motorista (com limite diário por plano) ----------
async function cancelarPedidoMotorista(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p || p.motoristaTelefone!==estado.motorista.telefone) return;
  if(!['indo_coletar','coletado','a_caminho'].includes(p.status)) return;
  const plano = PLANOS[estado.motorista.plano] || PLANOS.free;
  await carregarCancelamentosMotorista();
  const usados = estado.motorista.cancelamentosHoje||0;
  if(usados>=plano.limiteCancelamentosDia){
    mostrarToast(`Limite de cancelamentos do dia atingido (${usados}/${plano.limiteCancelamentosDia} no plano ${plano.label}). Não é possível cancelar mais entregas hoje.`);
    return;
  }
  if(!confirm(`Cancelar esta entrega? Ela volta para a lista de pedidos disponíveis. Restam ${plano.limiteCancelamentosDia-usados-1} cancelamentos hoje (plano ${plano.label}).`)) return;
  const agora = Date.now();
  const { error } = await sb.from('entrega_pedidos').update({
    status:'buscando', motorista_nome:null, motorista_telefone:null, motorista_foto_url:null,
    motorista_veiculo_tipo:null, motorista_marca:null, motorista_cor:null, motorista_placa:null,
    motorista_nota_media:null, motorista_total_avaliacoes:null, motorista_lat:null, motorista_lng:null,
    iniciado_em:null, cancelado_por:'motorista', atualizado_em: agora
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao cancelar.'); return; }
  const { error: erroLog } = await sb.from('entrega_cancelamentos_motorista').insert({
    motorista_telefone: estado.motorista.telefone, pedido_id: id, criado_em: agora
  });
  if(erroLog) console.error(erroLog);
  const aindaAtivos = estado.pedidos.some(x=>x.id!==id && x.motoristaTelefone===estado.motorista.telefone && x.iniciadoEm && ['indo_coletar','coletado','a_caminho'].includes(x.status));
  if(!aindaAtivos) pararRastreioMotorista();
  mostrarToast('Entrega cancelada e devolvida à lista de pedidos disponíveis.');
  estado.ultimoPedidosJSON='';
  await carregarCancelamentosMotorista();
  await carregarPedidos();
}

async function creditarSaldoMotorista(telefone, valor){
  const { data } = await sb.from('entrega_saldos').select('saldo').eq('telefone', telefone).maybeSingle();
  const saldoAtual = data ? Number(data.saldo)||0 : 0;
  const novoSaldo = Math.round((saldoAtual + valor)*100)/100;
  await sb.from('entrega_saldos').upsert({ telefone, saldo:novoSaldo, atualizado_em:Date.now() });
  if(estado.motorista.telefone===telefone) estado.motorista.saldo = novoSaldo;
}
async function carregarSaldoMotorista(){
  const m = estado.motorista;
  if(!m.telefone) return;
  const { data } = await sb.from('entrega_saldos').select('saldo').eq('telefone', m.telefone).maybeSingle();
  m.saldo = data ? Number(data.saldo)||0 : 0;
  render();
}
function inicioDoDiaLocalMs(){
  const agora = new Date();
  return new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()).getTime();
}
async function carregarCancelamentosMotorista(){
  const m = estado.motorista;
  if(!m.telefone) return;
  const { data, error } = await sb.from('entrega_cancelamentos_motorista').select('id').eq('motorista_telefone', m.telefone).gte('criado_em', inicioDoDiaLocalMs());
  if(error){ console.error(error); return; }
  m.cancelamentosHoje = (data||[]).length;
  render();
}
async function avancarStatus(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const i = ESTAGIOS.indexOf(p.status);
  if(i < ESTAGIOS.length-1){
    const novoStatus = ESTAGIOS[i+1];
    const agora = Date.now();
    const { error } = await sb.from('entrega_pedidos').update({ status: novoStatus, atualizado_em: agora }).eq('id', id);
    if(error){ console.error(error); mostrarToast('Erro ao atualizar o pedido.'); return; }
    estado.ultimoPedidosJSON='';
    if(novoStatus==='entregue'){
      const aindaAtivos = estado.pedidos.some(x=>x.id!==id && x.motoristaTelefone===p.motoristaTelefone && x.iniciadoEm && ['indo_coletar','coletado','a_caminho'].includes(x.status));
      if(!aindaAtivos) pararRastreioMotorista();
      await creditarSaldoMotorista(p.motoristaTelefone, ganhoMotorista(p.preco));
      mostrarToast(`Entrega concluída! R$ ${ganhoMotorista(p.preco).toFixed(2)} creditado.`);
    }
    await carregarPedidos();
  }
}

// ---------- foto obrigatória antes/depois (com verificação de localização) ----------
let fotoPendente = null; // { pedidoId, tipo }
function obterPosicaoAtual(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos)=>resolve({ lat:pos.coords.latitude, lon:pos.coords.longitude }),
      ()=>resolve(ultimaPosicaoMotorista || null),
      { enableHighAccuracy:true, timeout:8000, maximumAge:5000 }
    );
  });
}
async function verificarNoEndereco(coordAlvo){
  if(!coordAlvo) return { dentro:true, distanciaKm:0 }; // sem coordenada cadastrada, não bloqueia
  const posicao = await obterPosicaoAtual();
  if(!posicao) return { dentro:false, distanciaKm:null, semGps:true };
  const distanciaKmAtual = distanciaKm(posicao.lat, posicao.lon, coordAlvo.lat, coordAlvo.lon);
  return { dentro: distanciaKmAtual<=RAIO_GEOFENCE_KM, distanciaKm: distanciaKmAtual };
}
async function solicitarFoto(pedidoId, tipo){
  const p = estado.pedidos.find(x=>x.id===pedidoId);
  if(!p) return;
  let coordAlvo;
  if(tipo==='antes'){
    coordAlvo = p.origemCoord;
  } else {
    const listaParadas = listaDestinosPedido(p);
    coordAlvo = listaParadas[listaParadas.length-1].coord;
  }
  mostrarToast('Verificando a tua localização...');
  const resultado = await verificarNoEndereco(coordAlvo);
  if(resultado.semGps){
    mostrarToast('Não consegui confirmar a tua localização. Ativa o GPS e tenta novamente.');
    return;
  }
  if(!resultado.dentro){
    const faltam = resultado.distanciaKm!=null ? ` (faltam ~${resultado.distanciaKm.toFixed(2)} km)` : '';
    mostrarToast(`Só podes ${tipo==='antes'?'coletar':'finalizar a entrega'} quando estiveres no endereço${faltam}.`);
    return;
  }
  fotoPendente = { pedidoId, tipo };
  document.getElementById('input-foto').click();
}
async function confirmarParadaIntermediaria(pedidoId){
  const p = estado.pedidos.find(x=>x.id===pedidoId);
  if(!p || p.motoristaTelefone!==estado.motorista.telefone || p.status!=='a_caminho') return;
  const listaParadas = listaDestinosPedido(p);
  const paradaAtualIdx = Math.min(p.paradaAtual||0, listaParadas.length-1);
  if(paradaAtualIdx >= listaParadas.length-1) return; // já é a última, deve usar solicitarFoto
  mostrarToast('Verificando a tua localização...');
  const resultado = await verificarNoEndereco(listaParadas[paradaAtualIdx].coord);
  if(resultado.semGps){
    mostrarToast('Não consegui confirmar a tua localização. Ativa o GPS e tenta novamente.');
    return;
  }
  if(!resultado.dentro){
    const faltam = resultado.distanciaKm!=null ? ` (faltam ~${resultado.distanciaKm.toFixed(2)} km)` : '';
    mostrarToast(`Só podes confirmar essa parada quando estiveres no endereço${faltam}.`);
    return;
  }
  const { error } = await sb.from('entrega_pedidos').update({ parada_atual: paradaAtualIdx+1, atualizado_em: Date.now() }).eq('id', pedidoId);
  if(error){ console.error(error); mostrarToast('Erro ao confirmar a parada.'); return; }
  estado.ultimoPedidosJSON='';
  mostrarToast(`Parada ${paradaAtualIdx+1} de ${listaParadas.length} entregue! Segue para a próxima.`);
  await carregarPedidos();
}
async function processarFotoSelecionada(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file || !fotoPendente) return;
  const pendente = fotoPendente; fotoPendente = null;
  mostrarToast('Enviando foto...');
  const nomeArquivo = `${pendente.pedidoId}-${pendente.tipo}-${Date.now()}.jpg`;
  const { error: erroUpload } = await sb.storage.from('entrega-fotos').upload(nomeArquivo, file, { upsert:true, contentType: file.type || 'image/jpeg' });
  if(erroUpload){ console.error(erroUpload); mostrarToast('Erro ao enviar a foto. Tenta novamente.'); return; }
  const { data: pub } = sb.storage.from('entrega-fotos').getPublicUrl(nomeArquivo);
  const campo = pendente.tipo==='antes' ? 'foto_antes_url' : 'foto_depois_url';
  const { error: erroUpdate } = await sb.from('entrega_pedidos').update({ [campo]: pub.publicUrl }).eq('id', pendente.pedidoId);
  if(erroUpdate){ console.error(erroUpdate); mostrarToast('Foto enviada, mas houve erro ao gravar. Tenta avançar de novo.'); return; }
  estado.ultimoPedidosJSON='';
  await avancarStatus(pendente.pedidoId);
}

function iniciarRastreioMotorista(){
  if(!navigator.geolocation || watchId!=null) return;
  watchId = navigator.geolocation.watchPosition(
    (pos)=>{ ultimaPosicaoMotorista = { lat:pos.coords.latitude, lon:pos.coords.longitude }; },
    (err)=>{ console.warn(err); },
    { enableHighAccuracy:true, maximumAge:10000 }
  );
  if(!window._envioIntervalo) window._envioIntervalo = setInterval(enviarPosicaoMotorista, 8000);
}
function pararRastreioMotorista(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }
async function enviarPosicaoMotorista(){

  }).eq('id', p.id)));

// ---------- mapa ----------
// O app inteiro é re-renderizado via innerHTML a cada atualização (realtime/polling).
// Para o carro "andar" suavemente em vez de saltar a cada atualização, o mapa Leaflet e
// seus marcadores vivem numa div separada, guardada em memória (mapasAtivos), que é
// apenas RE-ENCAIXADA dentro do novo slot do template a cada render — nunca recriada do zero.
function montarMapa(containerId, pedido){
  setTimeout(()=>{
    const slot = document.getElementById(containerId);
    if(!slot || !pedido.origemCoord || !pedido.destinoCoord) return;
    const pO=[pedido.origemCoord.lat,pedido.origemCoord.lon], pD=[pedido.destinoCoord.lat,pedido.destinoCoord.lon];
    const pM = pedido.motoristaCoord ? [pedido.motoristaCoord.lat,pedido.motoristaCoord.lon] : null;
    const alvo = (pedido.status==='indo_coletar') ? pO : pD;
    let m = mapasAtivos[containerId];
    if(!m){
      const div = document.createElement('div');
      div.style.width='100%'; div.style.height='100%';
      slot.appendChild(div);
      const map = L.map(div,{zoomControl:false, attributionControl:false});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      L.marker(pO,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#ff5a3c;border:2px solid #fff"></div>'})}).addTo(map);
      L.marker(pD,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#7fae72;border:2px solid #fff"></div>'})}).addTo(map);
      L.polyline([pO,pD],{color:'#a9a89c',weight:2,opacity:0.35,dashArray:'5,7'}).addTo(map);
      m = { el:div, map, mMotorista:null, linhaMotorista:null, posAtual:null, raf:null };
      mapasAtivos[containerId]=m;
      map.fitBounds(pM?[pO,pD,pM]:[pO,pD],{padding:[24,24]});
      // o card acabou de entrar no DOM (innerHTML recém-renderizado) — o Leaflet às vezes calcula
      // o tamanho do container antes do layout/CSS terminarem de assentar, e o mapa fica em branco.
      // Forçamos um recálculo de tamanho logo depois para garantir que os tiles apareçam.
      setTimeout(()=>{ try{ m.map.invalidateSize(); m.map.fitBounds(pM?[pO,pD,pM]:[pO,pD],{padding:[24,24]}); }catch(e){} }, 200);
    } else if(m.el.parentElement!==slot){
      // o container do template foi recriado no último render — reencaixa o mapa vivo nele
      slot.appendChild(m.el);
      setTimeout(()=>{ try{ m.map.invalidateSize(); }catch(e){} },0);
    }
    if(pM){
      const emoji = (VEICULOS[pedido.veiculo]&&VEICULOS[pedido.veiculo].emoji)||'🚗';
      if(!m.mMotorista){
        m.mMotorista = L.marker(pM,{icon:iconeMotorista(emoji)}).addTo(m.map);
        m.linhaMotorista = L.polyline([pM,alvo],{color:'#ffc93c',weight:5,opacity:0.9,lineCap:'round'}).addTo(m.map);
        m.posAtual = pM;
        m.map.fitBounds([pO,pD,pM],{padding:[24,24]});
      } else if(m.posAtual && (m.posAtual[0]!==pM[0] || m.posAtual[1]!==pM[1])){
        animarMotorista(m, m.posAtual, pM, alvo);
      } else if(m.linhaMotorista){
        m.linhaMotorista.setLatLngs([pM,alvo]);
      }
    }
  },30);
}
function iconeMotorista(emoji){
  return L.divIcon({ className:'', html:`<div class="icone-motorista-anim"><span>${emoji}</span></div>`, iconSize:[30,30], iconAnchor:[15,15] });
}
// desliza o marcador do motorista da posição antiga até a nova em vez de "teleportar"
function animarMotorista(m, de, para, alvo){
  if(m.raf) cancelAnimationFrame(m.raf);
  const inicio = performance.now();
  const duracao = 3500;
  function passo(agora){
    const t = Math.min(1, (agora-inicio)/duracao);
    const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const lat = de[0]+(para[0]-de[0])*ease;
    const lon = de[1]+(para[1]-de[1])*ease;
    if(m.mMotorista) m.mMotorista.setLatLng([lat,lon]);
    if(m.linhaMotorista) m.linhaMotorista.setLatLngs([[lat,lon],alvo]);
    if(t<1){ m.raf=requestAnimationFrame(passo); } else { m.posAtual=para; m.raf=null; }
  }
  m.raf = requestAnimationFrame(passo);
}
// remove mapas de pedidos que já não estão mais visíveis na tela (evita vazamento de memória)
function limparMapasInativos(idsAtivos){
  Object.keys(mapasAtivos).forEach(containerId=>{
    if(!idsAtivos.has(containerId)){
      const m = mapasAtivos[containerId];
      try{ if(m.raf) cancelAnimationFrame(m.raf); m.map.remove(); }catch(e){}
      delete mapasAtivos[containerId];
    }
  });
}
function etaHTML(pedido){
  if(!pedido.motoristaCoord) return `<div class="subtitulo" style="margin-top:8px">Aguardando o entregador iniciar a rota...</div>`;
  const alvo = (pedido.status==='indo_coletar') ? pedido.origemCoord : pedido.destinoCoord;
  if(!alvo) return '';
  const km = distanciaKm(pedido.motoristaCoord.lat,pedido.motoristaCoord.lon,alvo.lat,alvo.lon);
  const min = Math.max(1, Math.round((km/VEICULOS[pedido.veiculo].veloc)*60));
  const txt = pedido.status==='indo_coletar' ? 'até a coleta' : 'até o teu endereço';
  registrarEta(pedido.id, min);
  return `<div class="eta-banner"><div class="eta-min" id="eta-min-${pedido.id}">~${min} min</div><div class="eta-sub" id="eta-sub-${pedido.id}">${km.toFixed(1)} km ${txt} · atualizado em tempo real</div></div>`;
}
// ---------- contagem regressiva do ETA em tempo real ----------
// a cada atualização real de posição (registrarEta) fixamos o valor "oficial"; entre uma
// atualização e outra (a cada 8-15s), o número vai diminuindo sozinho, segundo a segundo
function registrarEta(pedidoId, minutos){
  etaEstado[pedidoId] = { segundos: minutos*60, ultimoOficial: minutos*60 };
}
function iniciarTickEta(){
  if(etaTickInterval) return;
  etaTickInterval = setInterval(()=>{
    Object.keys(etaEstado).forEach(id=>{
      const el = document.getElementById('eta-min-'+id);
      if(!el){ delete etaEstado[id]; return; }
      const e = etaEstado[id];
      if(e.segundos>30) e.segundos -= 1;
      el.textContent = '~'+Math.max(1,Math.round(e.segundos/60))+' min';
    });
  },1000);
}

function cartaoPedidoAtivo(p){
  const i = ESTAGIOS.indexOf(p.status);
  const proximo = i<ESTAGIOS.length-1 ? ESTAGIOS[i+1] : null;
  const listaParadas = listaDestinosPedido(p);
  const paradaAtualIdx = Math.min(p.paradaAtual||0, listaParadas.length-1);
  const temMaisParadas = listaParadas.length>1;
  const ultimaParada = paradaAtualIdx === listaParadas.length-1;
  const enderecoAtualEntrega = listaParadas[paradaAtualIdx].endereco;
  const enderecoGPS = (p.status==='indo_coletar') ? p.origem : enderecoAtualEntrega;
  const mapaId = 'mapa-m-'+p.id;
  const aguardandoInicio = p.status==='indo_coletar' && !p.iniciadoEm;
  let botaoAcao = '';
  if(aguardandoInicio){
    botaoAcao = `<button class="btn btn-primario btn-pequeno" onclick="iniciarCorrida('${p.id}')">▶️ Iniciar corrida</button>`;
  } else if(p.status==='indo_coletar'){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="solicitarFoto('${p.id}','antes')">📷 Cheguei / tirar foto e recolher (obrigatória)</button>`;
  } else if(p.status==='coletado'){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="avancarStatus('${p.id}')">Segui viagem</button>`;
  } else if(p.status==='a_caminho' && temMaisParadas && !ultimaParada){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="confirmarParadaIntermediaria('${p.id}')">✅ Confirmar chegada nesta parada (${paradaAtualIdx+1}/${listaParadas.length})</button>`;
  } else if(p.status==='a_caminho'){
    botaoAcao = `<button class="btn btn-verde btn-pequeno" onclick="solicitarFoto('${p.id}','depois')">📷 ${temMaisParadas?`Tirar foto e finalizar a última parada (${paradaAtualIdx+1}/${listaParadas.length})`:'Tirar foto e marcar entregue'} (obrigatória — precisa estar no endereço)</button>`;
  }
  const plano = PLANOS[estado.motorista.plano] || PLANOS.free;
  const usados = estado.motorista.cancelamentosHoje||0;
  const podeCancelarMotorista = ['indo_coletar','coletado','a_caminho'].includes(p.status);
  return `
  <div class="pedido">
    <div class="linha-topo">
      <div class="end"><b>Recolha</b>${p.origem}<b style="margin-top:8px">Entrega</b>${p.destino}</div>
      <div class="preco">R$ ${p.preco.toFixed(2)}<span class="ganho">você recebe R$ ${ganhoMotorista(p.preco).toFixed(2)}</span></div>
    </div>
    ${p.status==='a_caminho' && temMaisParadas ? `<div class="subtitulo" style="margin-top:6px;background:var(--painel-alt);border-radius:8px;padding:8px 10px">📍 Parada atual (${paradaAtualIdx+1} de ${listaParadas.length}): <b style="color:var(--osso)">${enderecoAtualEntrega}</b></div>` : ''}
    ${p.prioridade ? `<span class="selo selo-prioridade">🚀 Entrega prioritária</span>` : ''}
    ${extrasHTML(p)}
    ${seloHTML(p.status)}
    ${trilhaHTML(p.status)}
    <div style="font-size:12px;color:var(--poeira);margin-top:10px">Cliente: <b style="color:var(--osso)">${p.clienteNome}</b> · ${p.clienteTelefone}</div>
    ${p.status==='indo_coletar' && (p.origemReferencia || p.origemFotoUrl) ? `<div class="subtitulo" style="margin-top:8px;background:var(--painel-alt);border-radius:8px;padding:8px 10px">
      ${p.origemReferencia ? `📝 ${p.origemReferencia}<br>` : ''}
      ${p.origemFotoUrl ? `<a href="${p.origemFotoUrl}" target="_blank" style="color:var(--mango)">📸 Ver foto do local</a>` : ''}
    </div>` : ''}
    ${p.status==='a_caminho' && (p.destinoReferencia || p.destinoFotoUrl) ? `<div class="subtitulo" style="margin-top:8px;background:var(--painel-alt);border-radius:8px;padding:8px 10px">
      ${p.destinoReferencia ? `📝 ${p.destinoReferencia}<br>` : ''}
      ${p.destinoFotoUrl ? `<a href="${p.destinoFotoUrl}" target="_blank" style="color:var(--mango)">📸 Ver foto do local</a>` : ''}
    </div>` : ''}
    ${p.iniciadoEm && p.status!=='entregue' ? `<div class="gps-ao-vivo"><span class="ponto-pulsante"></span> localização a atualizar em tempo real</div>` : ''}
    ${p.origemCoord && p.destinoCoord ? `<div class="mapa" id="${mapaId}"></div>` : ''}
    ${fotosHTML(p)}
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      ${p.status==='indo_coletar' && p.origemCoord
        ? `<button class="btn btn-azul btn-pequeno" onclick="abrirGPSCoord(${p.origemCoord.lat},${p.origemCoord.lon})">📍 GPS</button>`
        : `<button class="btn btn-azul btn-pequeno" onclick="abrirGPS('${enderecoGPS.replace(/'/g,"\\'")}')">📍 GPS</button>`}
      ${botaoChatHTML(p.id, estado.chatNaoLidas[p.id]||0)}
      ${botaoLigarHTML(p.clienteTelefone)}
      ${proximo ? botaoAcao : ''}
    </div>
    ${podeCancelarMotorista ? `
    <div class="cancelamento-motorista-box">
      <div>Cancelamentos hoje: <b>${usados}/${plano.limiteCancelamentosDia}</b> (plano ${plano.label}) — ${plano.label==='Free' ? 'até 3 cancelamentos por dia' : 'até 10 cancelamentos por dia'}</div>
      <button class="btn btn-chama btn-pequeno" style="margin-top:6px" onclick="cancelarPedidoMotorista('${p.id}')">Cancelar esta entrega</button>
    </div>` : ''}
  </div>`;
}
function extrasHTML(p){
  const ativos = extrasAtivos(p.extras);
  if(ativos.length===0) return '';
  return `<div style="font-size:11.5px;color:var(--poeira);margin:4px 0 8px">📦 Extras: ${ativos.map(k=>`${EXTRAS_INFO[k].emoji} ${EXTRAS_INFO[k].label}`).join(' · ')}</div>`;

function fotosHTML(p){
  if(!p.fotoAntesUrl && !p.fotoDepoisUrl) return '';
  return `<div class="foto-bloco">
    <div class="foto-legenda">📦 Foto do produto · toca para ampliar</div>
    <div style="display:flex;gap:8px">
      ${p.fotoAntesUrl ? `<div class="foto-item" onclick="ampliarFoto('${p.fotoAntesUrl}')"><img src="${p.fotoAntesUrl}"><span class="foto-lupa">🔍</span></div>` : ''}

}

  }
  const planoAtual = PLANOS[m.plano] || PLANOS.free;
  const agoraTs = Date.now();

    .filter(p=>p.status==='buscando' && (p.prioridade || planoAtual.prioridade || (agoraTs-p.criadoEm)>=ATRASO_PRIORIDADE_PRO_MS))

  const ativos = estado.pedidos.filter(p=>!['buscando','entregue','cancelado'].includes(p.status) && p.motoristaTelefone===m.telefone);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const entreguesHojeArr = estado.pedidos.filter(p=>p.status==='entregue' && p.motoristaTelefone===m.telefone && p.atualizadoEm>=hoje.getTime());
  const ganhosHoje = entreguesHojeArr.reduce((s,p)=>s+ganhoMotorista(p.preco),0);
  const entregasMes = entregasDoMesAtual(m.telefone);
  return `
  <div class="cartao">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">

// ---------- preserva rolagem e digitação entre re-renderizações (evita "piscar") ----------
function capturarFocoAtivo(){
  const el = document.activeElement;
  if(!el || !el.id || !(el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return null;
  return { id: el.id, value: el.value, selStart: el.selectionStart, selEnd: el.selectionEnd };
}
function restaurarFocoAtivo(foco){
  if(!foco) return;
  const el = document.getElementById(foco.id);
  if(!el || !(el.tagName==='INPUT'||el.tagName==='TEXTAREA')) return;
  if((el.value===''||el.value==null) && foco.value){ el.value = foco.value; }
  el.focus();
  try{ if(typeof foco.selStart==='number') el.setSelectionRange(foco.selStart, foco.selEnd); }catch(e){}
}
function capturarScroll(){
  const adminConteudo = document.querySelector('.admin-conteudo');
  return { janela: window.scrollY, admin: adminConteudo?adminConteudo.scrollTop:null };
}
function restaurarScroll(s){
  if(!s) return;
  window.scrollTo(0, s.janela);
  if(s.admin!=null){ const el = document.querySelector('.admin-conteudo'); if(el) el.scrollTop = s.admin; }
}

async function hashSenha(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function salvarEtapaCadastro(campos){
  const c = estado.painelMotorista.cadastro;
  const agora = Date.now();
  if(!c.id){ c.id = 'mot'+agora+Math.floor(Math.random()*1000); }
  const base = { id:c.id, criado_em: c.criadoEm||agora, atualizado_em: agora };
  if(c.nome) base.nome = c.nome;
  if(c.cpf) base.cpf = c.cpf;
  if(c.telefone) base.telefone = c.telefone;
  if(c.cidade) base.cidade = c.cidade;
  if(c.senhaHash) base.senha_hash = c.senhaHash;
  const linha = Object.assign(base, campos);
  const { error } = await sb.from('entrega_motoristas').upsert(linha);
  if(error){ console.error(error); mostrarToast('Erro ao gravar o cadastro: '+(error.message||'')); return false; }
  c.criadoEm = c.criadoEm || agora;
  return true;
}

function cpfValido(cpf){
  const s = String(cpf||'').replace(/\D/g,'');
  if(s.length!==11) return false;
  if(/^(\d)\1{10}$/.test(s)) return false; // todos os dígitos iguais, ex: 111.111.111-11
  const calcDigito = (base)=>{
    let soma=0, peso=base.length+1;
    for(let i=0;i<base.length;i++){ soma += parseInt(base[i],10)*peso; peso--; }
    const resto = soma % 11;
    return resto<2 ? 0 : 11-resto;
  };
  const d1 = calcDigito(s.slice(0,9));
  if(d1 !== parseInt(s[9],10)) return false;
  const d2 = calcDigito(s.slice(0,10));
  if(d2 !== parseInt(s[10],10)) return false;
  return true;
}

  }catch(e){
    console.error(e);
    c.pix.gerando=false; c.pix.erro = 'Não consegui gerar a cobrança PIX. Verifica se a chave MP_ACCESS_TOKEN está configurada nas secrets do Supabase e tenta novamente.';
    render();
  }
}
function iniciarPollingPix(){
  if(pixPollTimer) clearInterval(pixPollTimer);
  pixPollTimer = setInterval(async ()=>{
    const c = estado.painelMotorista.cadastro;
    if(!c.id || c.pix.status==='pago'){ clearInterval(pixPollTimer); pixPollTimer=null; return; }
    const { data } = await sb.from('entrega_motoristas').select('taxa_status').eq('id', c.id).maybeSingle();
    if(data && data.taxa_status==='pago'){
      c.pix.status='pago'; clearInterval(pixPollTimer); pixPollTimer=null; render();
    }
  }, 4000);
}
function copiarPix(){
  const c = estado.painelMotorista.cadastro;
  if(!c.pix.copiaCola) return;
  navigator.clipboard.writeText(c.pix.copiaCola).then(()=>mostrarToast('Código PIX copiado!'));
}
function avancarEtapa4(){
  const c = estado.painelMotorista.cadastro;
  if(!c.plano){ mostrarToast('Escolhe um plano para continuar.'); return; }
  if(c.plano==='pro' && c.pix.status!=='pago'){ mostrarToast('Aguarda a confirmação do pagamento.'); return; }
  c.etapa=5; render();
}
async function avancarEtapa5(){
  const c = estado.painelMotorista.cadastro;
  c.chavePix = document.getElementById('cm-chavepix').value.trim();
  if(!c.chavePix){ c.erroEtapa='Informa a chave PIX para receberes pelas entregas.'; render(); return; }
  c.erroEtapa=''; c.enviando=true; render();

async function finalizarCadastroMotorista(){
  const c = estado.painelMotorista.cadastro;

async function carregarTodosPedidosAdmin(){
  estado.admin.carregando=true; render();

  estado.admin.carregando=false;

async function carregarClientesAdmin(){

  estado.admin.carregando=false;

function filtrarPedidosAdmin(){
  const a = estado.admin;
  const busca = (a.buscaPedidos||'').trim().toLowerCase();
  return (a.todosPedidos||[]).filter(p=>{
    if(a.filtroPedidos!=='todos' && p.status!==a.filtroPedidos) return false;
    if(!busca) return true;
    return (p.cliente_nome||'').toLowerCase().includes(busca) || (p.cliente_telefone||'').includes(busca)
      || (p.motorista_nome||'').toLowerCase().includes(busca) || (p.motorista_telefone||'').includes(busca) || (p.id||'').includes(busca);
  });
}

async function trocarSenhaAdminPainel(){
  const atual = document.getElementById('cfg-senha-atual')?.value||'';
  const nova = document.getElementById('cfg-senha-nova')?.value||'';
  if(!atual || !nova){ mostrarToast('Preenche a senha atual e a nova.'); return; }
  if(nova.length<6){ mostrarToast('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
  const { data, error } = await sb.rpc('entrega_admin_trocar_senha', { p_senha_atual: atual, p_senha_nova: nova });
  if(error){ console.error(error); mostrarToast('Erro ao trocar a senha.'); return; }
  if(!data){ mostrarToast('Senha atual incorreta.'); return; }
  estado.admin.senhaDigitada = nova;
  mostrarToast('Senha trocada com sucesso!');
  render();
}

async function salvarEdicaoPedidoAdmin(id){
  const nome = document.getElementById('edit-pedido-nome-'+id)?.value.trim();
  const telefoneCliente = document.getElementById('edit-pedido-tel-cliente-'+id)?.value.trim();
  const origem = document.getElementById('edit-pedido-origem-'+id)?.value.trim();
  const destino = document.getElementById('edit-pedido-destino-'+id)?.value.trim();
  const motoristaNome = document.getElementById('edit-pedido-motorista-nome-'+id)?.value.trim();
  const motoristaTel = document.getElementById('edit-pedido-motorista-tel-'+id)?.value.trim();
  const preco = Number(document.getElementById('edit-pedido-preco-'+id)?.value);
  const status = document.getElementById('edit-pedido-status-'+id)?.value;
  if(!origem || !destino){ mostrarToast('Preenche os endereços de recolha e entrega.'); return; }
  const { error } = await sb.rpc('entrega_admin_editar_pedido', {
    p_senha: estado.admin.senhaDigitada, p_id: id,
    p_cliente_nome: nome, p_cliente_telefone: telefoneCliente, p_origem: origem, p_destino: destino,
    p_motorista_nome: motoristaNome || null, p_motorista_telefone: motoristaTel || null,
    p_preco: Number.isNaN(preco) ? 0 : preco, p_status: status
  });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao salvar: '+(error.message||'')); return; }
  mostrarToast('Pedido atualizado!');
  estado.admin.pedidoEditando = null;
  await carregarTodosPedidosAdmin();
}
async function excluirPedidoAdmin(id, nome){
  if(!confirm(`Excluir definitivamente o pedido de ${nome||'cliente'}? Essa ação não pode ser desfeita.`)) return;
  const { error } = await sb.rpc('entrega_admin_deletar_pedido', { p_senha: estado.admin.senhaDigitada, p_id: id });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao excluir: '+(error.message||'')); return; }
  mostrarToast('Pedido excluído.');
  await carregarTodosPedidosAdmin();
}

async function ajustarSaldoMotoristaAdmin(telefone){
  const input = document.getElementById('ajuste-saldo-'+telefone.replace(/\D/g,''));
  const valor = input ? Number(input.value) : NaN;
  if(!valor || Number.isNaN(valor)){ mostrarToast('Informa um valor válido (positivo para creditar, negativo para debitar).'); return; }
  const { data: novoSaldo, error } = await sb.rpc('entrega_admin_ajustar_saldo_motorista', { p_senha: estado.admin.senhaDigitada, p_telefone: telefone, p_valor: valor });
  if(error){ console.error(error); mostrarToast(error.message==='senha_invalida' ? 'Sessão de admin expirada. Sai e entra de novo.' : 'Erro ao ajustar o saldo.'); return; }
  if(input) input.value='';
  mostrarToast(`Saldo ajustado! Novo saldo: R$ ${Number(novoSaldo).toFixed(2)}`);
  if(estado.motorista.telefone===telefone) estado.motorista.saldo = Number(novoSaldo);
}

// =================== PAINEL ADMINISTRATIVO ===================
let canalAdminRealtime = null;
function assinarAdminRealtime(){
  if(canalAdminRealtime) return;
  canalAdminRealtime = sb.channel('admin-realtime')
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_motoristas'}, ()=>{
      debounce('admin-motoristas', carregarMotoristasAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_pedidos'}, ()=>{
      debounce('admin-pedidos', ()=>{ carregarTodosPedidosAdmin(); carregarPedidosEntreguesAdmin(); });
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_clientes'}, ()=>{
      debounce('admin-clientes', carregarClientesAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_saques'}, ()=>{
      debounce('admin-saques', carregarSaquesAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_alertas_admin'}, ()=>{
      debounce('admin-alertas', carregarAlertasAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_suporte'}, ()=>{
      debounce('admin-suporte', carregarSuporteAdmin);
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'entrega_suporte_status'}, ()=>{
      debounce('admin-suporte', carregarSuporteAdmin);
    })
    .subscribe();
}
function encerrarAdminRealtime(){
  if(canalAdminRealtime){ sb.removeChannel(canalAdminRealtime); canalAdminRealtime=null; }
}
function abrirAdmin(){ estado.admin.aberto=true; render(); }
function fecharAdmin(){ estado.admin.aberto=false; render(); }
function digitarSenhaAdmin(v){ estado.admin.senhaDigitada=v; }
async function entrarAdmin(){
  const senha = estado.admin.senhaDigitada;
  if(!senha){ mostrarToast('Digite a senha.'); return; }
  const { data: senhaOk, error: erroSenha } = await sb.rpc('entrega_verificar_senha_admin', { p_senha: senha });
  if(erroSenha){ console.error(erroSenha); mostrarToast('Erro ao verificar a senha. Tenta de novo.'); return; }
  if(!senhaOk){ mostrarToast('Senha incorreta.'); return; }
  estado.admin.logado=true;
  salvarLocal('ef_admin_logado','true');
  try{ sessionStorage.setItem('ef_admin_senha', senha); }catch(e){}
  await Promise.all([carregarMotoristasAdmin(), carregarPedidosEntreguesAdmin(), carregarSaquesAdmin(), carregarTodosPedidosAdmin(), carregarClientesAdmin(), carregarAlertasAdmin()]);
  await carregarSuporteAdmin();
  assinarSuporteAdminGlobal();
  assinarAdminRealtime();
  render();
}
