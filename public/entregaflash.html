<style>
  :root{
    --noite:#12141C; --painel:#1B1E29; --painel-alt:#232838; --linha:#2C3143;
    --mango:#FFB627; --mango-escuro:#CC8F14; --chama:#FF5A4E;
    --osso:#F3EFE6; --poeira:#8D93A6; --verde:#4CD787; --azul:#3B82F6; --roxo:#8B5CF6;

  html,body{margin:0;padding:0;background:var(--noite);color:var(--osso);font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}

  .toggle-modo button.ativo{background:var(--mango);color:var(--noite);}

  .aviso{margin:14px 20px 0;font-size:11.5px;color:var(--poeira);background:var(--painel);border:1px solid var(--linha);border-left:3px solid var(--mango);padding:10px 12px;border-radius:8px;line-height:1.5;}

  main{flex:1;padding:18px 20px 10px;}
  .cartao{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px;}
  .cartao h2{font-family:'Archivo Black';font-size:15px;margin:0 0 14px;text-transform:uppercase;letter-spacing:0.5px;color:var(--osso);}
  label{display:block;font-size:12px;font-weight:600;color:var(--poeira);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.4px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--linha);background:var(--painel-alt);color:var(--osso);font-family:'Barlow';font-size:14.5px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--mango);}

  .veiculos button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--linha);background:var(--painel-alt);color:var(--poeira);font-family:'Barlow';font-weight:600;font-size:11.5px;cursor:pointer;}
  .veiculos button.sel{border-color:var(--mango);color:var(--mango);background:rgba(255,182,39,0.08);}

  .sugestao-item{padding:10px 12px;font-size:12.5px;background:var(--painel-alt);cursor:pointer;border-bottom:1px solid var(--linha);}
  .sugestao-item:last-child{border-bottom:none;}
  .sugestao-item:hover, .sugestao-item:active{background:var(--linha);}
  .sugestao-vazia{padding:10px 12px;font-size:11.5px;color:var(--poeira);background:var(--painel-alt);}

  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;border:none;font-family:'Barlow';font-weight:700;font-size:15px;letter-spacing:0.3px;cursor:pointer;margin-top:14px;}
  .btn-primario{background:var(--mango);color:var(--noite);}
  .btn-primario:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-secundario{background:transparent;border:1px solid var(--linha);color:var(--osso);}
  .btn-verde{background:var(--verde);color:var(--noite);}
  .btn-azul{background:var(--azul);color:#fff;}
  .btn-pequeno{width:auto;padding:8px 14px;font-size:12.5px;margin-top:0;border-radius:8px;}

  .estimativa{display:flex;align-items:baseline;justify-content:space-between;background:var(--painel-alt);border-radius:10px;padding:14px;margin-top:14px;}

  .trilha .barra{flex:1;height:2px;background:var(--linha);}
  .trilha .ponto.feito,.trilha .barra.feito{background:var(--mango);}

  .etiquetas{display:flex;justify-content:space-between;font-size:8.5px;color:var(--poeira);text-transform:uppercase;letter-spacing:0.2px;margin-top:5px;}

  .eta{font-size:11.5px;color:var(--poeira);margin-top:6px;display:flex;justify-content:space-between;}

  .alerta-motorista .alerta-emoji{font-size:28px;flex-shrink:0;animation:balancar 0.7s infinite ease-in-out;}
  @keyframes balancar{0%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}100%{transform:rotate(-8deg);}}
  .alerta-motorista .alerta-texto{flex:1;line-height:1.3;}
  .alerta-motorista .alerta-titulo{font-family:'Archivo Black';font-size:13.5px;text-transform:uppercase;letter-spacing:0.3px;}
  .alerta-motorista .alerta-sub{font-size:11.5px;font-weight:600;opacity:0.85;margin-top:2px;}
  .alerta-motorista .alerta-fechar{background:rgba(18,20,28,0.2);border:none;color:var(--noite);width:24px;height:24px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;flex-shrink:0;}

  .foto-bloco{margin-top:10px;}
  .foto-bloco .foto-legenda{font-size:10.5px;color:var(--poeira);text-transform:uppercase;letter-spacing:0.4px;font-weight:700;margin-bottom:5px;}
  .foto-item{position:relative;display:inline-block;cursor:pointer;}
  .foto-item img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--linha);display:block;}
  .foto-item .foto-lupa{position:absolute;bottom:3px;right:3px;background:rgba(18,20,28,0.7);color:#fff;font-size:10px;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .foto-fundo{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
  .foto-fundo img{max-width:100%;max-height:85vh;border-radius:10px;}
  .foto-fundo .foto-fechar{position:absolute;top:18px;right:18px;background:var(--painel);border:1px solid var(--linha);color:var(--osso);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;}

  .campo-motorista{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px;}
  .subtitulo{font-size:12px;color:var(--poeira);margin:-6px 0 14px;line-height:1.5;}
  .refresh{font-size:11px;color:var(--poeira);text-align:right;margin:-6px 0 12px;cursor:pointer;text-decoration:underline;}

  .botao-chat{position:relative;display:inline-flex;align-items:center;gap:6px;}
  .notif-bolinha{position:absolute;top:-7px;right:-7px;background:var(--chama);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
  .modal-chat{width:100%;max-width:480px;background:var(--painel);border-radius:20px 20px 0 0;max-height:80vh;display:flex;flex-direction:column;border:1px solid var(--linha);}
  .chat-topo{padding:16px 18px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;}
  .chat-topo h3{font-size:14px;text-transform:uppercase;margin:0;font-family:'Archivo Black';letter-spacing:0.3px;}
  .chat-fechar{background:none;border:none;color:var(--poeira);font-size:22px;cursor:pointer;line-height:1;}
  .chat-mensagens{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:45vh;}
  .bolha{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.4;}
  .bolha span{font-size:9.5px;opacity:0.65;margin-top:3px;display:block;text-align:right;}
  .bolha-eu{background:var(--mango);color:var(--noite);border-bottom-right-radius:4px;align-self:flex-end;}
  .bolha-outro{background:var(--painel-alt);color:var(--osso);border-bottom-left-radius:4px;align-self:flex-start;border:1px solid var(--linha);}
  .chat-vazio{text-align:center;padding:26px;color:var(--poeira);font-size:12.5px;}
  .chat-envio{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--linha);}
  .chat-envio input{flex:1;}
  .chat-envio button{background:var(--mango);border:none;color:var(--noite);border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer;}
</style>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnY2Nsb3JkbXFqbXd1enJyZmJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzU5NjgsImV4cCI6MjEwMDkxMTk2OH0.08MeNbE_Tr5sf7APOP9gsSr5KwDjDbdacaXXzDOyqXA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TAXA_PLATAFORMA = 0.30;
// ---------- regras de negócio ----------
const JANELA_EDICAO_MIN = 7;      // minutos após o motorista aceitar em que o cliente pode editar 1x
const JANELA_CANCELAMENTO_MIN = 10; // minutos sem cobrança para cancelar
const TAXA_CANCELAMENTO_PLATAFORMA = 0.15; // 15% da plataforma sobre a taxa de cancelamento
const WHATSAPP_SUPORTE = '5535900000000'; // TODO: trocar pelo número real do suporte
const TIPOS_ENTREGA = {
  padrao:   { label:'Padrão',    desc:'Até 10 entregas na rota do motorista', multiplicador:1.00, maxPorMotorista:10 },
  agrupado: { label:'Agrupado',  desc:'Até 25 entregas, dividindo a rota com outros pedidos', multiplicador:0.80, maxPorMotorista:25 },
  flash:    { label:'Flash',     desc:'Prioridade máxima: o motorista leva só o seu pedido', multiplicador:1.60, maxPorMotorista:1 }
};
const ESTAGIOS = ['buscando','indo_coletar','coletado','a_caminho','entregue'];
const ROTULOS_ESTAGIO = {
  buscando:'Buscando entregador', indo_coletar:'Indo coletar', coletado:'Coletado',
  a_caminho:'A caminho', entregue:'Entregue'
};
const VEICULOS = {
  bicicleta:{label:'Bicicleta', emoji:'🚲', base:4, km:1.2, veloc:15},
  moto:{label:'Moto', emoji:'🏍️', base:6, km:2.0, veloc:30},
  carro:{label:'Carro', emoji:'🚗', base:10, km:3.0, veloc:25},
  van:{label:'Van', emoji:'🚐', base:18, km:4.5, veloc:22}
};
// Região de cobertura: Muzambinho/MG e cidades próximas
const REGIAO = { minLat:-22.1, maxLat:-20.6, minLon:-47.3, maxLon:-45.7 };

let estado = {
  modo:'cliente',
  telaCliente:'cadastro',   // 'cadastro' | 'pedido'
  clienteCadastrado:null,   // {nome,telefone} vindo de entrega_clientes
  saldoCliente:0,
  form:{ nome:'', telefone:'', origem:'', destino:'', veiculo:'moto', descricao:'', distancia:null, duracaoMin:null, origemCoord:null, destinoCoord:null,
         paradas:[], tipoEntrega:'padrao', agendaData:'', agendaHora:'' },
  calculando:false, falhaCalculo:false,
  filtroTelefoneCliente:'',
  motorista:{ nome:'', telefone:'', ativo:false },
  pedidos:[], ultimoPedidosJSON:'',
  carregando:true, toast:null,
  chatAberto:null, mensagens:[], canalChat:null, naoLidas:0,
  sugestoesTemp:{ origem:[], destino:[] },
  alertaMotorista:null, fotoAmpliada:null, statusAnterior:{},
  telaSaldo:false, valorPixDigitado:''
};

let mapasAtivos = {};
let watchId = null;
let ultimaPosicaoMotorista = null;
let temporizadoresDebounce = {};
function debounce(chave, fn, delay=450){
  clearTimeout(temporizadoresDebounce[chave]);
  temporizadoresDebounce[chave] = setTimeout(fn, delay);
}

// ---------- geo ----------
function paraRad(g){ return g*Math.PI/180; }
function distanciaKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=paraRad(lat2-lat1), dLon=paraRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(paraRad(lat1))*Math.cos(paraRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
async function geocodificar(endereco){
  const q = endereco.toLowerCase().includes('mg') ? endereco : endereco+', Muzambinho, MG';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=1`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    if(!dados||dados.length===0) return null;
    const lat=parseFloat(dados[0].lat), lon=parseFloat(dados[0].lon);
    if(lat<REGIAO.minLat||lat>REGIAO.maxLat||lon<REGIAO.minLon||lon>REGIAO.maxLon) return null;
    return {lat,lon};
  }catch(e){ console.error(e); return null; }
}
function precoDeDistancia(veiculo, km, tipoEntrega){
  const v=VEICULOS[veiculo];
  const mult = TIPOS_ENTREGA[tipoEntrega||'padrao'].multiplicador;
  return Math.round((v.base+v.km*km)*mult*100)/100;
}
function ganhoMotorista(preco){ return Math.round(preco*(1-TAXA_PLATAFORMA)*100)/100; }

// ---------- preenchimento automático de endereço ----------
async function buscarSugestoes(campo){
  const inputEl = document.getElementById('c-'+campo);
  const cont = document.getElementById('sugestoes-'+campo);
  if(!inputEl || !cont) return;
  const texto = inputEl.value.trim();
  if(texto.length<4){ cont.innerHTML=''; estado.sugestoesTemp[campo]=[]; return; }
  cont.innerHTML = `<div class="sugestao-vazia">Buscando endereços...</div>`;
  const q = texto.toLowerCase().includes('mg') ? texto : texto+', Muzambinho, MG';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=5`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    // o campo pode ter mudado enquanto a busca corria - confere se ainda é o texto atual
    if(document.getElementById('c-'+campo).value.trim() !== texto) return;
    if(!dados || dados.length===0){ cont.innerHTML = `<div class="sugestao-vazia">Nenhum endereço encontrado na região de Muzambinho.</div>`; return; }
    estado.sugestoesTemp[campo] = dados.map(d=>({
      lat: parseFloat(d.lat), lon: parseFloat(d.lon),
      nome: d.display_name.split(',').slice(0,4).join(',').trim()
    }));
    cont.innerHTML = estado.sugestoesTemp[campo].map((s,idx)=>

// ---------- aviso sonoro + visual: motorista encontrado ----------
function tocarSomAlerta(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const tocarNota=(freq,inicio,duracao)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime+inicio);
      gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime+inicio+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+inicio+duracao);
      osc.start(ctx.currentTime+inicio); osc.stop(ctx.currentTime+inicio+duracao+0.05);
    };
    tocarNota(740,0,0.16); tocarNota(988,0.16,0.22);
  }catch(e){ console.warn('audio indisponível', e); }
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}
function dispararAlertaMotorista(pedido){
  estado.alertaMotorista = { nome: pedido.motoristaNome||'Um entregador', pedidoId: pedido.id };
  render();
  tocarSomAlerta();
  clearTimeout(window._alertaMotoristaTimer);
  window._alertaMotoristaTimer = setTimeout(()=>{ estado.alertaMotorista=null; render(); }, 7000);
}
function fecharAlertaMotorista(){ clearTimeout(window._alertaMotoristaTimer); estado.alertaMotorista=null; render(); }
function detectarMotoristaEncontrado(novos){
  if(estado.modo!=='cliente' || !estado.filtroTelefoneCliente) return;
  novos.forEach(np=>{
    if(np.clienteTelefone!==estado.filtroTelefoneCliente) return;
    const anterior = estado.statusAnterior[np.id];
    if(anterior==='buscando' && np.status!=='buscando'){
      dispararAlertaMotorista(np);
    }
    estado.statusAnterior[np.id] = np.status;
  });
}

async function ajustarSaldo(telefone, delta){

// Gera uma cobrança Pix via Mercado Pago para o cliente carregar saldo.
// IMPORTANTE: o Access Token do Mercado Pago é secreto e NUNCA deve ficar no
// código do navegador. Esta função chama uma Edge Function do Supabase
// (endpoint próprio) que guarda o token com segurança, cria o Pix via API do
// Mercado Pago e, quando o pagamento é aprovado (webhook), credita o saldo
// automaticamente na tabela entrega_saldos. Ajusta a URL abaixo depois de
// publicar a function `criar-pagamento-pix`.
const URL_FUNCAO_PIX = SUPABASE_URL + '/functions/v1/criar-pagamento-pix';
async function solicitarSaldoPix(){
  const valor = parseFloat(document.getElementById('pix-valor').value);
  if(!valor || valor<=0){ mostrarToast('Informa um valor válido para adicionar.'); return; }
  mostrarToast('Gerando cobrança Pix...');
  try{
    const resp = await fetch(URL_FUNCAO_PIX, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY },
      body: JSON.stringify({ telefone: estado.form.telefone, nome: estado.form.nome, valor })
    });
    const dados = await resp.json();
    if(!resp.ok || !dados.qr_code) throw new Error(dados.erro || 'Falha ao gerar Pix');
    estado.pixGerado = { valor, qrCode: dados.qr_code, qrCodeBase64: dados.qr_code_base64, id: dados.id };
    render();
  }catch(e){
    console.error(e);
    mostrarToast('Não consegui gerar o Pix agora. O suporte técnico precisa publicar a Edge Function "criar-pagamento-pix" no Supabase, ligada à API do Mercado Pago.');
  }
}

async function calcularCorrida(){
  const f = estado.form;
  if(!f.origem || !f.destino){ mostrarToast('Preenche recolha e destino primeiro.'); return; }
  estado.calculando = true; estado.falhaCalculo = false; render();
  const origemCoord = f.origemCoord || await geocodificar(f.origem);
  const destinoCoord = f.destinoCoord || await geocodificar(f.destino);
  estado.calculando = false;
  if(!origemCoord || !destinoCoord){
    f.distancia=null; f.origemCoord=null; f.destinoCoord=null;
    estado.falhaCalculo = true;
    mostrarToast('Não achei o endereço automaticamente. Informa a distância manualmente abaixo.');
    render(); return;
  }
  const kmReal = distanciaKm(origemCoord.lat,origemCoord.lon,destinoCoord.lat,destinoCoord.lon)*1.3;
  f.distancia = Math.round(kmReal*10)/10;
  f.origemCoord = origemCoord; f.destinoCoord = destinoCoord;
  const veloc = VEICULOS[f.veiculo].veloc;
  f.duracaoMin = Math.max(3, Math.round((f.distancia/veloc)*60));
  render();
}

function usarDistanciaManual(){

  estado.form.origemCoord = null;
  estado.form.destinoCoord = null;
  const veloc = VEICULOS[estado.form.veiculo].veloc;
  estado.form.duracaoMin = Math.max(3, Math.round((estado.form.distancia/veloc)*60));
  estado.falhaCalculo = false;
  render();
}

async function criarPedido(){
  const f = estado.form;
  if(!f.nome||!f.telefone||!f.origem||!f.destino){ mostrarToast('Preenche nome, telefone, recolha e destino.'); return; }
  if(f.distancia==null){ mostrarToast('Calcula a corrida primeiro.'); return; }
  const preco = precoDeDistancia(f.veiculo, f.distancia, f.tipoEntrega);
  if(estado.saldoCliente < preco){
    mostrarToast(`Saldo insuficiente. Tens R$ ${estado.saldoCliente.toFixed(2)} e a corrida custa R$ ${preco.toFixed(2)}. Adiciona saldo via Pix.`);
    estado.telaSaldo = true; render();
    return;
  }
  const agora = Date.now();
  let agendadoEm = null;
  if(f.agendaData && f.agendaHora){
    const dt = new Date(`${f.agendaData}T${f.agendaHora}:00`);
    if(!isNaN(dt.getTime())) agendadoEm = dt.getTime();
  }
  const pedido = {
    id:'p'+agora+Math.floor(Math.random()*1000),
    clienteNome:f.nome, clienteTelefone:f.telefone,
    origem:f.origem, destino:f.destino, origemCoord:f.origemCoord, destinoCoord:f.destinoCoord,
    veiculo:f.veiculo, descricao:f.descricao, distancia:f.distancia, preco:preco,
    status:'buscando', motoristaNome:'', motoristaTelefone:'', criadoEm:agora, atualizadoEm:agora,
    tipoEntrega:f.tipoEntrega, paradas:f.paradas, agendadoEm, aceitoEm:null, editado:false,
    canceladoEm:null, taxaCancelamento:0
  };
  await salvarPedido(pedido);
  await descontarSaldo(f.telefone, preco);
  estado.filtroTelefoneCliente = f.telefone;
  estado.form = { nome:f.nome, telefone:f.telefone, origem:'', destino:'', veiculo:'moto', descricao:'', distancia:null, duracaoMin:null, origemCoord:null, destinoCoord:null,
                   paradas:[], tipoEntrega:'padrao', agendaData:'', agendaHora:'' };
  mostrarToast(agendadoEm ? 'Pedido agendado com sucesso!' : 'Pedido criado! Buscando um entregador...');
  await carregarPedidos();
}

async function aceitarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const limite = TIPOS_ENTREGA[p.tipoEntrega||'padrao'].maxPorMotorista;
  const emCursoDoTipo = estado.pedidos.filter(x=>x.motoristaTelefone===estado.motorista.telefone && x.status!=='buscando' && x.status!=='entregue' && (x.tipoEntrega||'padrao')===(p.tipoEntrega||'padrao')).length;
  if(emCursoDoTipo >= limite){
    mostrarToast(`Já tens ${limite} entrega(s) do tipo "${TIPOS_ENTREGA[p.tipoEntrega||'padrao'].label}" em curso. Termina uma antes de aceitar outra.`);

function podeEditarPedido(p){
  if(!p.aceitoEm || p.editado) return false;
  if(p.status==='entregue' || p.canceladoEm) return false;
  return (Date.now() - p.aceitoEm) <= JANELA_EDICAO_MIN*60000;
}
function minutosRestantesEdicao(p){
  if(!p.aceitoEm) return 0;
  const restam = JANELA_EDICAO_MIN*60000 - (Date.now()-p.aceitoEm);
  return Math.max(0, Math.ceil(restam/60000));
}

// ---------- cancelamento pelo cliente ----------
function calcularTaxaCancelamento(p){
  // dentro da janela: grátis. depois: cobre deslocamento do motorista (metade do valor base do veículo por km rodado até agora, estimado)
  // + 15% de taxa da plataforma sobre essa taxa de deslocamento.
  const minutosDecorridos = (Date.now() - p.criadoEm)/60000;
  if(minutosDecorridos <= JANELA_CANCELAMENTO_MIN) return 0;
  const v = VEICULOS[p.veiculo];
  const deslocamentoEstimado = Math.round((v.base + v.km*Math.min(p.distancia||2,2))*100)/100; // custo de deslocamento até a coleta
  const taxaPlataforma = Math.round(deslocamentoEstimado*TAXA_CANCELAMENTO_PLATAFORMA*100)/100;
  return Math.round((deslocamentoEstimado+taxaPlataforma)*100)/100;
}
async function cancelarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const taxa = calcularTaxaCancelamento(p);
  const msg = taxa>0
    ? `Já passaram mais de ${JANELA_CANCELAMENTO_MIN} minutos. Será cobrada uma taxa de R$ ${taxa.toFixed(2)} para cobrir o deslocamento do motorista e a taxa da plataforma. Confirmas o cancelamento?`
    : `Cancelamento gratuito (dentro dos ${JANELA_CANCELAMENTO_MIN} minutos). Confirmas?`;
  if(!confirm(msg)) return;
  const agora = Date.now();
  const { error } = await sb.from('entrega_pedidos').update({
    status:'cancelado', cancelado_em: agora, taxa_cancelamento: taxa, atualizado_em: agora
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao cancelar o pedido.'); return; }
  if(taxa>0){ await descontarSaldo(p.clienteTelefone, taxa); }
  else { await estornarSaldo(p.clienteTelefone, p.preco); }
  estado.ultimoPedidosJSON='';
  mostrarToast(taxa>0 ? `Pedido cancelado. Taxa de R$ ${taxa.toFixed(2)} debitada do saldo.` : 'Pedido cancelado sem custo. Valor devolvido ao saldo.');
  await carregarPedidos();
}

async function avancarStatus(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const i = ESTAGIOS.indexOf(p.status);
  if(i < ESTAGIOS.length-1){
    const novoStatus = ESTAGIOS[i+1];
    const agora = Date.now();
    const { error } = await sb.from('entrega_pedidos').update({ status: novoStatus, atualizado_em: agora }).eq('id', id);
    if(error){ console.error(error); mostrarToast('Erro ao atualizar o pedido.'); return; }
    estado.ultimoPedidosJSON='';
    if(novoStatus==='entregue'){
      pararRastreioMotorista();
      mostrarToast(`Entrega concluída! R$ ${ganhoMotorista(p.preco).toFixed(2)} creditado.`);
    }
    await carregarPedidos();
  }
}

let fotoPendente = null; // { pedidoId, tipo }
function solicitarFoto(pedidoId, tipo){
  fotoPendente = { pedidoId, tipo };

async function processarFotoSelecionada(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file || !fotoPendente) return;
  const pendente = fotoPendente; fotoPendente = null;
  mostrarToast('Enviando foto...');
  const nomeArquivo = `${pendente.pedidoId}-${pendente.tipo}-${Date.now()}.jpg`;
  const { error: erroUpload } = await sb.storage.from('entrega-fotos').upload(nomeArquivo, file, { upsert:true, contentType: file.type || 'image/jpeg' });
  if(erroUpload){ console.error(erroUpload); mostrarToast('Erro ao enviar a foto. Tenta novamente.'); return; }
  const { data: pub } = sb.storage.from('entrega-fotos').getPublicUrl(nomeArquivo);

  if(erroUpdate){ console.error(erroUpdate); mostrarToast('Foto enviada, mas houve erro ao gravar. Tenta avançar de novo.'); return; }

// ---------- rastreio ao vivo ----------
function iniciarRastreioMotorista(){
  if(!navigator.geolocation || watchId!=null) return;
  watchId = navigator.geolocation.watchPosition(
    (pos)=>{ ultimaPosicaoMotorista = { lat:pos.coords.latitude, lon:pos.coords.longitude }; },
    (err)=>{ console.warn(err); },
    { enableHighAccuracy:true, maximumAge:10000 }
  );
  if(!window._envioIntervalo) window._envioIntervalo = setInterval(enviarPosicaoMotorista, 15000);
}
function pararRastreioMotorista(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }
async function enviarPosicaoMotorista(){
  if(!ultimaPosicaoMotorista || !estado.motorista.ativo) return;
  const ativo = estado.pedidos.find(p=>p.motoristaTelefone===estado.motorista.telefone && p.status!=='buscando' && p.status!=='entregue' && p.status!=='cancelado');
  if(!ativo) return;
  await sb.from('entrega_pedidos').update({
    motorista_lat: ultimaPosicaoMotorista.lat, motorista_lng: ultimaPosicaoMotorista.lon, motorista_atualizado_em: Date.now()
  }).eq('id', ativo.id);
  estado.ultimoPedidosJSON='';
}

// ---------- mapa ----------
function montarMapa(containerId, pedido){
  setTimeout(()=>{
    const el = document.getElementById(containerId);
    if(!el || !pedido.origemCoord || !pedido.destinoCoord) return;
    if(mapasAtivos[containerId]){ try{ mapasAtivos[containerId].remove(); }catch(e){} }
    const map = L.map(containerId,{zoomControl:false, attributionControl:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const pO=[pedido.origemCoord.lat,pedido.origemCoord.lon], pD=[pedido.destinoCoord.lat,pedido.destinoCoord.lon];
    L.marker(pO,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#FF5A4E;border:2px solid #fff"></div>'})}).addTo(map);
    L.marker(pD,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#4CD787;border:2px solid #fff"></div>'})}).addTo(map);
    const pontos=[pO,pD];
    // linha do percurso planejado (recolha -> entrega), fina e discreta
    L.polyline([pO,pD],{color:'#8D93A6',weight:2,opacity:0.35,dashArray:'5,7'}).addTo(map);
    if(pedido.motoristaCoord){
      const pM=[pedido.motoristaCoord.lat,pedido.motoristaCoord.lon];
      const alvo = (pedido.status==='indo_coletar') ? pO : pD;
      // linha do trajeto do motorista até o próximo destino - se move conforme ele se aproxima
      L.polyline([pM,alvo],{color:'#FFB627',weight:5,opacity:0.9,lineCap:'round'}).addTo(map);
      L.marker(pM,{icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#FFB627;border:2px solid #fff;box-shadow:0 0 0 4px rgba(255,182,39,0.3)"></div>'})}).addTo(map);
      pontos.push(pM);
    }
    map.fitBounds(pontos,{padding:[24,24]});
    mapasAtivos[containerId]=map;
  },30);
}
function etaHTML(pedido){
  if(!pedido.motoristaCoord) return `<div class="subtitulo" style="margin-top:8px">Aguardando o entregador iniciar a rota...</div>`;
  const alvo = (pedido.status==='indo_coletar') ? pedido.origemCoord : pedido.destinoCoord;
  if(!alvo) return '';
  const km = distanciaKm(pedido.motoristaCoord.lat,pedido.motoristaCoord.lon,alvo.lat,alvo.lon);
  const min = Math.max(1, Math.round((km/VEICULOS[pedido.veiculo].veloc)*60));
  const txt = pedido.status==='indo_coletar' ? 'até a coleta' : 'até o teu endereço';
  return `<div class="eta-banner"><div class="eta-min">~${min} min</div><div class="eta-sub">${km.toFixed(1)} km ${txt} · atualizado em tempo real</div></div>`;
}

    <button class="btn btn-primario" onclick="criarPedido()">Confirmar pedido (debita do saldo)</button>
    ` : `<div class="subtitulo" style="margin-top:12px">Cobrimos Muzambinho/MG e cidades próximas.</div>`}
  </div>
  <div class="cartao">
    <h2>Os meus pedidos</h2>
    ${!estado.filtroTelefoneCliente
      ? `<div class="vazio"><span class="emoji-grande">📦</span>Depois de fazeres um pedido, ele aparece aqui.</div>`
      : meusPedidos.length===0
        ? `<div class="vazio"><span class="emoji-grande">📦</span>Ainda não tens pedidos com este número.</div>`
        : meusPedidos.map(cartaoPedidoCliente).join('')
    }
  </div>`;
}

function telaMotorista(){
  const m = estado.motorista;
  if(!m.ativo){
    return `
    <div class="campo-motorista">
      <h2 style="font-family:'Archivo Black';font-size:15px;text-transform:uppercase;margin:0 0 6px">Entrar como entregador</h2>
      <div class="subtitulo">Recebe ${Math.round((1-TAXA_PLATAFORMA)*100)}% do valor de cada corrida.</div>
      <label>O teu nome</label>
      <input type="text" id="m-nome" placeholder="Ex: João Paulo">
      <label>Telefone</label>
      <input type="tel" id="m-telefone" placeholder="(35) 90000-0000">
      <button class="btn btn-primario" onclick="entrarComoMotorista()">Começar a trabalhar</button>
    </div>`;
  }
  const disponiveis = estado.pedidos.filter(p=>p.status==='buscando');
  const ativos = estado.pedidos.filter(p=>p.status!=='buscando' && p.status!=='entregue' && p.status!=='cancelado' && p.motoristaTelefone===m.telefone);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const entreguesHojeArr = estado.pedidos.filter(p=>p.status==='entregue' && p.motoristaTelefone===m.telefone && p.atualizadoEm>=hoje.getTime());
  const ganhosHoje = entreguesHojeArr.reduce((s,p)=>s+ganhoMotorista(p.preco),0);
  return `
  <div class="saldo-card">
    <div class="valor-saldo">R$ ${ganhosHoje.toFixed(2)}</div>
    <div class="rotulo-saldo">Creditado hoje · ${entreguesHojeArr.length} entregas</div>
  </div>
  <div class="rodape-motorista">
    <div style="font-size:12px;color:var(--poeira)">Ligado como <b style="color:var(--osso)">${m.nome}</b></div>
    <button class="btn btn-secundario btn-pequeno" onclick="sairMotorista()">Sair</button>
  </div>
  ${ativos.length>0 ? `<div class="cartao"><h2>Em curso</h2>${ativos.map(cartaoPedidoAtivo).join('')}</div>` : ''}
  <div class="cartao">
    <h2>Pedidos disponíveis</h2>
    ${disponiveis.length===0
      ? `<div class="vazio"><span class="emoji-grande">🛵</span>Sem pedidos por agora.</div>`
      : disponiveis.map(cartaoPedidoDisponivel).join('')
    }
  </div>`;
}

    ${estado.alertaMotorista ? `
    <div class="alerta-motorista" onclick="fecharAlertaMotorista()">
      <div class="alerta-emoji">🛵</div>
      <div class="alerta-texto">
        <div class="alerta-titulo">Motorista encontrado!</div>
        <div class="alerta-sub">${estado.alertaMotorista.nome} aceitou o teu pedido e está a caminho</div>
      </div>
      <button class="alerta-fechar" onclick="event.stopPropagation();fecharAlertaMotorista()">&times;</button>
    </div>` : ''}
    ${estado.fotoAmpliada ? `
    <div class="foto-fundo" onclick="if(event.target===this) fecharFotoAmpliada()">
      <button class="foto-fechar" onclick="fecharFotoAmpliada()">&times;</button>
      <img src="${estado.fotoAmpliada}">
    </div>` : ''}
    ${pedidoEmEdicao ? (() => {
      const p = estado.pedidos.find(x=>x.id===pedidoEmEdicao);
      if(!p) return '';
      return `
      <div class="modal-fundo" onclick="if(event.target===this) fecharEdicaoPedido()">
        <div class="modal-chat">
          <div class="chat-topo"><h3>Editar pedido (1x, até ${JANELA_EDICAO_MIN} min)</h3><button class="chat-fechar" onclick="fecharEdicaoPedido()">&times;</button></div>
          <div style="padding:16px">
            <div class="aviso" style="margin:0 0 12px">Só é possível editar o pedido uma única vez, em até ${JANELA_EDICAO_MIN} minutos após o motorista aceitar. Depois desse prazo não será mais possível editar.</div>
            <label>Endereço de entrega</label>
            <input type="text" id="edicao-destino" value="${p.destino}">
            <label>O que estás a enviar</label>
            <textarea id="edicao-descricao">${p.descricao||''}</textarea>
            <button class="btn btn-primario" onclick="salvarEdicaoPedido('${p.id}')">Salvar edição</button>
          </div>
        </div>
      </div>`;
    })() : ''}
    ${estado.telaSaldo ? `
    <div class="modal-fundo" onclick="if(event.target===this) fecharTelaSaldo()">
      <div class="modal-chat">
        <div class="chat-topo"><h3>Adicionar saldo via Pix</h3><button class="chat-fechar" onclick="fecharTelaSaldo()">&times;</button></div>
        <div style="padding:16px">
          <div class="subtitulo">O saldo é usado para pagar as tuas corridas. O Pix cai na conta da plataforma e é creditado na hora.</div>
          <label>Valor a adicionar (R$)</label>
          <input type="number" id="pix-valor" placeholder="Ex: 50" min="1" step="0.01">
          <button class="btn btn-primario" onclick="solicitarSaldoPix()">Gerar Pix</button>
          ${estado.pixGerado ? `
          <div class="estimativa" style="flex-direction:column;align-items:flex-start;gap:8px">
            <div class="rotulo">Pix de R$ ${estado.pixGerado.valor.toFixed(2)} gerado</div>
            ${estado.pixGerado.qrCodeBase64 ? `<img src="data:image/png;base64,${estado.pixGerado.qrCodeBase64}" style="width:100%;border-radius:10px">` : ''}
            <textarea readonly style="min-height:70px;font-size:11px">${estado.pixGerado.qrCode||''}</textarea>
            <div class="subtitulo">Copia o código "copia e cola" acima ou lê o QR Code no teu banco. O saldo cai automaticamente após o pagamento.</div>
          </div>` : ''}
        </div>
      </div>
    </div>` : ''}
    ${estado.chatAberto ? `
    <div class="modal-fundo" onclick="if(event.target===this) fecharChat()">
      <div class="modal-chat">
        <div class="chat-topo"><h3>Chat do pedido</h3><button class="chat-fechar" onclick="fecharChat()">&times;</button></div>
        <div class="chat-mensagens" id="chat-mensagens"></div>
        <div class="chat-envio">
          <input type="text" id="chat-input" placeholder="Escreve uma mensagem..." onkeydown="if(event.key==='Enter') enviarMensagem()">
          <button onclick="enviarMensagem()">Enviar</button>
        </div>
      </div>
    </div>` : ''}
    <input type="file" id="input-foto" accept="image/*" capture="environment" style="display:none" onchange="processarFotoSelecionada(this)">
  `;
  const bind=(id,path)=>{ const el=document.getElementById(id); if(el) el.addEventListener('input',(e)=>setDeep(path,e.target.value)); };
  bind('c-nome','form.nome'); bind('c-telefone','form.telefone'); bind('c-origem','form.origem');
  bind('c-destino','form.destino'); bind('c-descricao','form.descricao');
  bind('c-agenda-data','form.agendaData'); bind('c-agenda-hora','form.agendaHora');
  bind('cad-nome','form.nome'); bind('cad-telefone','form.telefone');
  ['origem','destino'].forEach(campo=>{
    const el = document.getElementById('c-'+campo);
    if(el){
      el.addEventListener('input', ()=> debounce(campo, ()=>buscarSugestoes(campo)));
      el.addEventListener('blur', ()=> setTimeout(()=>{ const c=document.getElementById('sugestoes-'+campo); if(c) c.innerHTML=''; }, 200));
    }
  });

  estado.pedidos.forEach(p=>{
    if(estado.modo==='cliente' && p.clienteTelefone===estado.filtroTelefoneCliente && p.status!=='buscando' && p.status!=='entregue' && p.status!=='cancelado' && p.origemCoord && p.destinoCoord){
      montarMapa('mapa-c-'+p.id, p);
    }
    if(estado.modo==='entregador' && estado.motorista.ativo && p.motoristaTelefone===estado.motorista.telefone && p.status!=='buscando' && p.status!=='entregue' && p.status!=='cancelado' && p.origemCoord && p.destinoCoord){
      montarMapa('mapa-m-'+p.id, p);
    }
  });
  if(estado.chatAberto) renderChat();
}

function setDeep(path,value){
  const parts=path.split('.'); let obj=estado;
  for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts[parts.length-1]]=value;
  if(path==='form.origem'||path==='form.destino'){ estado.form.distancia=null; estado.form.origemCoord=null; estado.form.destinoCoord=null; }
}
function mudarVeiculo(k){
  estado.form.veiculo=k;
  if(estado.form.distancia!=null){ estado.form.duracaoMin = Math.max(3, Math.round((estado.form.distancia/VEICULOS[k].veloc)*60)); }
  render();
}
function mudarModo(m){ estado.modo=m; estado.ultimoPedidosJSON=''; render(); carregarPedidos(); }
async function entrarComoMotorista(){
  const nome=document.getElementById('m-nome').value.trim();
  const telefone=document.getElementById('m-telefone').value.trim();
  if(!nome||!telefone){ mostrarToast('Preenche nome e telefone.'); return; }
  estado.motorista={ nome, telefone, ativo:true };
  estado.ultimoPedidosJSON='';
  await carregarPedidos();
  render();
  iniciarRastreioMotorista();
}
function sairMotorista(){ pararRastreioMotorista(); estado.motorista={nome:'',telefone:'',ativo:false}; render(); }

window.criarPedido=criarPedido; window.calcularCorrida=calcularCorrida; window.aceitarPedido=aceitarPedido;
window.avancarStatus=avancarStatus; window.mudarVeiculo=mudarVeiculo; window.mudarModo=mudarModo;
window.entrarComoMotorista=entrarComoMotorista; window.sairMotorista=sairMotorista; window.carregarPedidos=carregarPedidos;
window.abrirGPS=abrirGPS; window.abrirChat=abrirChat; window.fecharChat=fecharChat; window.enviarMensagem=enviarMensagem;
window.solicitarFoto=solicitarFoto; window.processarFotoSelecionada=processarFotoSelecionada; window.usarDistanciaManual=usarDistanciaManual;
window.buscarSugestoes=buscarSugestoes; window.selecionarSugestao=selecionarSugestao;
window.ampliarFoto=ampliarFoto; window.fecharFotoAmpliada=fecharFotoAmpliada; window.fecharAlertaMotorista=fecharAlertaMotorista;
window.adicionarParada=adicionarParada; window.removerParada=removerParada; window.mudarTipoEntrega=mudarTipoEntrega;
window.cadastrarCliente=cadastrarCliente; window.sairCadastroCliente=sairCadastroCliente;
window.abrirTelaSaldo=abrirTelaSaldo; window.fecharTelaSaldo=fecharTelaSaldo; window.solicitarSaldoPix=solicitarSaldoPix;
window.abrirEdicaoPedido=abrirEdicaoPedido; window.fecharEdicaoPedido=fecharEdicaoPedido; window.salvarEdicaoPedido=salvarEdicaoPedido;
window.cancelarPedido=cancelarPedido; window.abrirSuporte=abrirSuporte;

if(typeof window.supabase==='undefined' || !window.supabase.createClient){
  document.getElementById('app').innerHTML = `<div style="padding:40px 24px;text-align:center;color:#F3EFE6;font-family:'Barlow',sans-serif"><div style="font-size:32px;margin-bottom:12px">⚠️</div><div style="font-family:'Archivo Black';font-size:16px;margin-bottom:8px">Não consegui carregar a ligação à base de dados</div><div style="font-size:13px;color:#8D93A6;line-height:1.6">Verifica a tua ligação à internet e recarrega a página.</div></div>`;
} else {
  render();
  tentarLoginAutomatico().then(()=>{ render(); carregarPedidos(); });
  setInterval(carregarPedidos, 5000);
}
</script>
</body>
</html>
