<style>
  :root{
    --noite:#12141C; --painel:#1B1E29; --painel-alt:#232838; --linha:#2C3143;
    --mango:#FFB627; --mango-escuro:#CC8F14; --chama:#FF5A4E;
    --osso:#F3EFE6; --poeira:#8D93A6; --verde:#4CD787; --azul:#3B82F6; --roxo:#8B5CF6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--noite);color:var(--osso);font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 15% 0%, rgba(255,182,39,0.08), transparent 40%),var(--noite);padding-bottom:20px;}

  header.topo{padding:20px 20px 16px;position:relative;text-align:center;}
  .marca{display:flex;flex-direction:column;align-items:center;gap:0;}
  .marca .logo-img{width:min(58%,220px);height:auto;filter:drop-shadow(0 6px 18px rgba(255,182,39,0.25));}
  .tagline{font-size:11.5px;color:var(--poeira);margin:8px 0 0;letter-spacing:1px;text-transform:uppercase;font-weight:600;text-align:center;}

  .toggle-modo{display:flex;margin:18px 20px 4px;background:var(--painel);border-radius:14px;padding:4px;border:1px solid var(--linha);}
  .toggle-modo button{flex:1;padding:11px 0;border:none;background:transparent;color:var(--poeira);font-family:'Barlow';font-weight:700;font-size:14px;border-radius:10px;cursor:pointer;letter-spacing:0.3px;}
  .toggle-modo button.ativo{background:var(--mango);color:var(--noite);}

  .aviso{margin:14px 20px 0;font-size:11.5px;color:var(--poeira);background:var(--painel);border:1px solid var(--linha);border-left:3px solid var(--mango);padding:10px 12px;border-radius:8px;line-height:1.5;}

  main{flex:1;padding:18px 20px 10px;}
  .cartao{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px;}
  .cartao h2{font-family:'Archivo Black';font-size:15px;margin:0 0 14px;text-transform:uppercase;letter-spacing:0.5px;color:var(--osso);}
  label{display:block;font-size:12px;font-weight:600;color:var(--poeira);margin:12px 0 6px;text-transform:uppercase;letter-spacing:0.4px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--linha);background:var(--painel-alt);color:var(--osso);font-family:'Barlow';font-size:14.5px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--mango);}
  textarea{resize:vertical;min-height:56px;}
  .veiculos{display:flex;gap:6px;}
  .veiculos button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--linha);background:var(--painel-alt);color:var(--poeira);font-family:'Barlow';font-weight:600;font-size:11.5px;cursor:pointer;}
  .veiculos button.sel{border-color:var(--mango);color:var(--mango);background:rgba(255,182,39,0.08);}
  .veiculos button .emoji{display:block;font-size:18px;margin-bottom:3px;}
  .sugestoes:not(:empty){border:1px solid var(--linha);border-radius:8px;overflow:hidden;margin-top:6px;}
  .sugestao-item{padding:10px 12px;font-size:12.5px;background:var(--painel-alt);cursor:pointer;border-bottom:1px solid var(--linha);}
  .sugestao-item:last-child{border-bottom:none;}
  .sugestao-item:hover, .sugestao-item:active{background:var(--linha);}
  .sugestao-vazia{padding:10px 12px;font-size:11.5px;color:var(--poeira);background:var(--painel-alt);}

  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;border:none;font-family:'Barlow';font-weight:700;font-size:15px;letter-spacing:0.3px;cursor:pointer;margin-top:14px;}
  .btn-primario{background:var(--mango);color:var(--noite);}
  .btn-primario:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-secundario{background:transparent;border:1px solid var(--linha);color:var(--osso);}
  .btn-verde{background:var(--verde);color:var(--noite);}
  .btn-azul{background:var(--azul);color:#fff;}

// ---------- geo ----------
function paraRad(g){ return g*Math.PI/180; }
function distanciaKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=paraRad(lat2-lat1), dLon=paraRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(paraRad(lat1))*Math.cos(paraRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
async function geocodificar(endereco){
  const q = endereco.toLowerCase().includes('mg') ? endereco : endereco+', MG, Brasil';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=1`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    if(!dados||dados.length===0) return null;
    const lat=parseFloat(dados[0].lat), lon=parseFloat(dados[0].lon);
    if(lat<REGIAO.minLat||lat>REGIAO.maxLat||lon<REGIAO.minLon||lon>REGIAO.maxLon) return null;
    return {lat,lon};
  }catch(e){ console.error(e); return null; }
}
function precoDeDistancia(veiculo, km){
  const v=VEICULOS[veiculo];
  return Math.round((v.base+v.km*km)*100)/100;
}
function ganhoMotorista(preco){ const plano = PLANOS[estado.motorista.plano] || PLANOS.pro; return Math.round(preco*(1-plano.taxaPlataforma)*100)/100; }

async function buscarSugestoes(campo){
  const inputEl = document.getElementById('c-'+campo);
  const cont = document.getElementById('sugestoes-'+campo);
  if(!inputEl || !cont) return;
  const texto = inputEl.value.trim();
  if(texto.length<4){ cont.innerHTML=''; estado.sugestoesTemp[campo]=[]; return; }
  cont.innerHTML = `<div class="sugestao-vazia">Buscando endereços...</div>`;
  const q = texto.toLowerCase().includes('mg') ? texto : texto+', MG, Brasil';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=5`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    // o campo pode ter mudado enquanto a busca corria - confere se ainda é o texto atual
    if(document.getElementById('c-'+campo).value.trim() !== texto) return;
    if(!dados || dados.length===0){ cont.innerHTML = `<div class="sugestao-vazia">Nenhum endereço encontrado na região.</div>`; return; }
    estado.sugestoesTemp[campo] = dados.map(d=>({
      lat: parseFloat(d.lat), lon: parseFloat(d.lon),
      nome: d.display_name.split(',').slice(0,4).join(',').trim()
    }));
    cont.innerHTML = estado.sugestoesTemp[campo].map((s,idx)=>
      `<div class="sugestao-item" onclick="selecionarSugestao('${campo}',${idx})">📍 ${s.nome}</div>`
    ).join('');
  }catch(e){ console.error(e); cont.innerHTML=''; }
}
function selecionarSugestao(campo, idx){
  const s = estado.sugestoesTemp[campo] && estado.sugestoesTemp[campo][idx];
  if(!s) return;
  const inputEl = document.getElementById('c-'+campo);
  if(inputEl) inputEl.value = s.nome;
  estado.form[campo] = s.nome;
  estado.form[campo+'Coord'] = { lat:s.lat, lon:s.lon };
  const cont = document.getElementById('sugestoes-'+campo);
  if(cont) cont.innerHTML='';
  estado.sugestoesTemp[campo] = [];
  autoCalcularSeCompleto();
}
function autoCalcularSeCompleto(){
  if(estado.form.origemCoord && estado.form.destinoCoord) calcularCorrida();
}

// ---------- aviso sonoro + visual: motorista encontrado ----------
function tocarSomAlerta(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const tocarNota=(freq,inicio,duracao)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime+inicio);
      gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime+inicio+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+inicio+duracao);
      osc.start(ctx.currentTime+inicio); osc.stop(ctx.currentTime+inicio+duracao+0.05);
    };
    tocarNota(740,0,0.16); tocarNota(988,0.16,0.22);
  }catch(e){ console.warn('audio indisponível', e); }
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}
function dispararAlertaMotorista(pedido){
  estado.alertaMotorista = { nome: pedido.motoristaNome||'Um entregador', pedidoId: pedido.id };
  render();
  tocarSomAlerta();
  clearTimeout(window._alertaMotoristaTimer);
  window._alertaMotoristaTimer = setTimeout(()=>{ estado.alertaMotorista=null; render(); }, 7000);
}
function fecharAlertaMotorista(){ clearTimeout(window._alertaMotoristaTimer); estado.alertaMotorista=null; render(); }
function detectarMotoristaEncontrado(novos){
  if(estado.modo!=='cliente' || !estado.filtroTelefoneCliente) return;
  novos.forEach(np=>{
    if(np.clienteTelefone!==estado.filtroTelefoneCliente) return;
    const anterior = estado.statusAnterior[np.id];
    if(anterior==='buscando' && np.status!=='buscando'){
      dispararAlertaMotorista(np);
    }
    estado.statusAnterior[np.id] = np.status;
  });
}

function paraCamposApp(row){
  return {
    id:row.id, clienteNome:row.cliente_nome, clienteTelefone:row.cliente_telefone,
    motoristaNome:row.motorista_nome||'', motoristaTelefone:row.motorista_telefone||'',
    origem:row.origem, destino:row.destino,
    origemCoord:(row.origem_lat!=null&&row.origem_lng!=null)?{lat:row.origem_lat,lon:row.origem_lng}:null,
    destinoCoord:(row.destino_lat!=null&&row.destino_lng!=null)?{lat:row.destino_lat,lon:row.destino_lng}:null,
    motoristaCoord:(row.motorista_lat!=null&&row.motorista_lng!=null)?{lat:row.motorista_lat,lon:row.motorista_lng}:null,
    fotoAntesUrl: row.foto_antes_url || null, fotoDepoisUrl: row.foto_depois_url || null,
    veiculo:row.veiculo, descricao:row.descricao||'',
    distancia:Number(row.distancia)||0, preco:Number(row.preco)||0,
    status:row.status, criadoEm:Number(row.criado_em), atualizadoEm:Number(row.atualizado_em),
    motoristaFotoUrl: row.motorista_foto_url || null,
    motoristaVeiculoTipo: row.motorista_veiculo_tipo || '',
    motoristaMarca: row.motorista_marca || '', motoristaCor: row.motorista_cor || '', motoristaPlaca: row.motorista_placa || '',
    paradas: Array.isArray(row.paradas) ? row.paradas : (row.paradas ? JSON.parse(row.paradas) : []),
    tipoRetirada: row.tipo_retirada || 'agora', horarioAgendado: row.horario_agendado || null,
    editado: !!row.editado, canceladoEm: row.cancelado_em!=null?Number(row.cancelado_em):null,
    taxaCancelamento: Number(row.taxa_cancelamento)||0
  };
}
function paraCamposDB(p){
  return {
    id:p.id, cliente_nome:p.clienteNome, cliente_telefone:p.clienteTelefone,
    motorista_nome:p.motoristaNome||null, motorista_telefone:p.motoristaTelefone||null,
    origem:p.origem, destino:p.destino,
    origem_lat:p.origemCoord?p.origemCoord.lat:null, origem_lng:p.origemCoord?p.origemCoord.lon:null,
    destino_lat:p.destinoCoord?p.destinoCoord.lat:null, destino_lng:p.destinoCoord?p.destinoCoord.lon:null,
    veiculo:p.veiculo, descricao:p.descricao||null, distancia:p.distancia, preco:p.preco,
    status:p.status, criado_em:p.criadoEm, atualizado_em:p.atualizadoEm,
    foto_antes_url:p.fotoAntesUrl||null, foto_depois_url:p.fotoDepoisUrl||null,
    motorista_foto_url:p.motoristaFotoUrl||null, motorista_veiculo_tipo:p.motoristaVeiculoTipo||null,
    motorista_marca:p.motoristaMarca||null, motorista_cor:p.motoristaCor||null, motorista_placa:p.motoristaPlaca||null,
    paradas: JSON.stringify(p.paradas||[]), tipo_retirada:p.tipoRetirada||'agora', horario_agendado:p.horarioAgendado||null,
    editado: !!p.editado, cancelado_em:p.canceladoEm||null, taxa_cancelamento:p.taxaCancelamento||0
  };
}

async function carregarPedidos(){
  try{
    const {data,error} = await sb.from('entrega_pedidos').select('*').order('criado_em',{ascending:false});
    if(error){
      console.error(error);
      if(!estado.erroMostrado){ estado.erroMostrado=true; mostrarToast('Erro ao ligar à base de dados: '+(error.message||'verifica a ligação')); }
      return;
    }
    estado.erroMostrado = false;
    const novos = (data||[]).map(paraCamposApp);
    const novoJSON = JSON.stringify(novos);
    if(estado.modo==='entregador' && estado.motorista.ativo){ carregarSaldoMotorista(); atualizarBadgeSuporteMotorista(); }
    if(novoJSON===estado.ultimoPedidosJSON){ estado.carregando=false; return; }
    detectarMotoristaEncontrado(novos);
    estado.pedidos=novos; estado.ultimoPedidosJSON=novoJSON; estado.carregando=false;
    render();
  }catch(e){
    console.error(e);
    if(!estado.erroMostrado){ estado.erroMostrado=true; mostrarToast('Falha de ligação à internet ou à base de dados.'); }
  }
}
async function salvarPedido(p){
  const {error} = await sb.from('entrega_pedidos').upsert(paraCamposDB(p));
  if(error){ console.error(error); mostrarToast('Erro ao gravar o pedido.'); }
  estado.ultimoPedidosJSON='';
}

async function carregarMensagens(pedidoId){
  const {data} = await sb.from('entrega_chat').select('*').eq('pedido_id',pedidoId).order('criado_em',{ascending:true});
  return data||[];
}
async function enviarMensagem(){
  const input = document.getElementById('chat-input');
  if(!input) return;
  const texto = input.value.trim();
  if(!texto || !estado.chatAberto) return;
  const eu = estado.modo==='cliente' ? 'cliente' : 'motorista';
  const meuNome = estado.modo==='cliente' ? estado.form.nome : estado.motorista.nome;
  input.value='';
  await sb.from('entrega_chat').insert({
    pedido_id: estado.chatAberto.pedidoId, remetente_tipo:eu, remetente_nome:meuNome||eu,
    texto, lido:false, criado_em:Date.now()
  });
}
function assinarChat(pedidoId){
  if(estado.canalChat) sb.removeChannel(estado.canalChat);
  estado.canalChat = sb.channel('chat:'+pedidoId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'entrega_chat',filter:'pedido_id=eq.'+pedidoId}, async ()=>{
      estado.mensagens = await carregarMensagens(pedidoId);
      renderChat();
    }).subscribe();
}
async function abrirChat(pedidoId){
  estado.chatAberto = { pedidoId };
  estado.mensagens = await carregarMensagens(pedidoId);
  assinarChat(pedidoId);
  render();
}
function fecharChat(){
  if(estado.canalChat){ sb.removeChannel(estado.canalChat); estado.canalChat=null; }
  estado.chatAberto=null; estado.mensagens=[];
  render();
}
function renderChat(){
  const caixa = document.getElementById('chat-mensagens');
  if(!caixa) return;
  const eu = estado.modo==='cliente' ? 'cliente' : 'motorista';
  caixa.innerHTML = estado.mensagens.length===0
    ? `<div class="chat-vazio">Nenhuma mensagem ainda. Diz olá!</div>`
    : estado.mensagens.map(m=>{
        const minha = m.remetente_tipo===eu;
        const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        return `<div class="bolha ${minha?'bolha-eu':'bolha-outro'}">${m.texto}<span>${hora}</span></div>`;
      }).join('');

// ---------- suporte admin ----------
async function carregarSuporteAdmin(){
  const { data: msgs } = await sb.from('entrega_suporte').select('*').order('criado_em',{ascending:false});
  const { data: status } = await sb.from('entrega_suporte_status').select('*');
  const statusMap = {}; (status||[]).forEach(s=>{ statusMap[s.motorista_telefone]=s.status; });
  const porTelefone = {};
  (msgs||[]).forEach(m=>{
    if(!porTelefone[m.motorista_telefone]) porTelefone[m.motorista_telefone] = { telefone:m.motorista_telefone, nome:m.motorista_nome, ultimaEm:m.criado_em, naoLidas:0 };
    if(m.remetente_tipo==='motorista' && !m.lido) porTelefone[m.motorista_telefone].naoLidas++;
  });
  const planoPorTelefone = {};
  (estado.admin.motoristas||[]).forEach(mo=>{ planoPorTelefone[mo.telefone]=mo.plano; });
  estado.admin.suporteConversas = Object.values(porTelefone).map(c=>({
    ...c, status: statusMap[c.telefone]||'aberto', plano: planoPorTelefone[c.telefone]||'free'
  })).sort((a,b)=>{
    const prioA = a.plano==='pro'?0:1, prioB = b.plano==='pro'?0:1;
    if(prioA!==prioB) return prioA-prioB;
    return b.ultimaEm - a.ultimaEm;
  });
  render();
}

// ---------- ações ----------
async function calcularCorrida(){
  const f = estado.form;
  if(!f.origem || !f.destino){ mostrarToast('Preenche recolha e destino primeiro.'); return; }
  estado.calculando = true; estado.falhaCalculo = false; render();
  const origemCoord = f.origemCoord || await geocodificar(f.origem);
  const destinoCoord = f.destinoCoord || await geocodificar(f.destino);
  estado.calculando = false;
  if(!origemCoord || !destinoCoord){
    f.distancia=null; f.origemCoord=null; f.destinoCoord=null;
    estado.falhaCalculo = true;
    mostrarToast('Não achei o endereço automaticamente. Informa a distância manualmente abaixo.');
    render(); return;
  }
  const kmReal = distanciaKm(origemCoord.lat,origemCoord.lon,destinoCoord.lat,destinoCoord.lon)*1.3;
  f.distancia = Math.round(kmReal*10)/10;
  f.origemCoord = origemCoord; f.destinoCoord = destinoCoord;
  const veloc = VEICULOS[f.veiculo].veloc;
  f.duracaoMin = Math.max(3, Math.round((f.distancia/veloc)*60));
  render();
}

function usarDistanciaManual(){
  const input = document.getElementById('c-distancia-manual');
  const km = parseFloat(input.value);
  if(!km || km<=0){ mostrarToast('Informa um número de km válido.'); return; }
  estado.form.distancia = Math.round(km*10)/10;
  estado.form.origemCoord = null;
  estado.form.destinoCoord = null;
  const veloc = VEICULOS[estado.form.veiculo].veloc;
  estado.form.duracaoMin = Math.max(3, Math.round((estado.form.distancia/veloc)*60));
  estado.falhaCalculo = false;
  render();
}

async function criarPedido(){
  const f = estado.form;
  if(!f.nome||!f.telefone||!f.origem||!f.destino){ mostrarToast('Preenche nome, telefone, recolha e destino.'); return; }
  if(f.distancia==null){ mostrarToast('Calcula a corrida primeiro.'); return; }
  const paradasValidas = (f.paradas||[]).map(x=>x.trim()).filter(Boolean);
  if(f.tipoRetirada==='agendado' && !f.horarioAgendado){ mostrarToast('Escolhe a data e hora da retirada agendada.'); return; }
  const preco = precoDeDistancia(f.veiculo, f.distancia);
  const agora = Date.now();
  const pedido = {
    id:'p'+agora+Math.floor(Math.random()*1000),
    clienteNome:f.nome, clienteTelefone:f.telefone,
    origem:f.origem, destino:f.destino, origemCoord:f.origemCoord, destinoCoord:f.destinoCoord,
    paradas:paradasValidas, tipoRetirada:f.tipoRetirada, horarioAgendado:f.tipoRetirada==='agendado'?f.horarioAgendado:null,
    editado:false, canceladoEm:null, taxaCancelamento:0,
    veiculo:f.veiculo, descricao:f.descricao, distancia:f.distancia, preco:preco,
    status:'buscando', motoristaNome:'', motoristaTelefone:'', criadoEm:agora, atualizadoEm:agora
  };
  await salvarPedido(pedido);
  estado.filtroTelefoneCliente = f.telefone;
  estado.form = { nome:f.nome, telefone:f.telefone, origem:'', destino:'', paradas:[], tipoRetirada:'agora', horarioAgendado:'', veiculo:'moto', descricao:'', distancia:null, duracaoMin:null, origemCoord:null, destinoCoord:null };
  mostrarToast(f.tipoRetirada==='agendado' ? 'Pedido agendado com sucesso!' : 'Pedido criado! Buscando um entregador...');
  await carregarPedidos();
}

// ---------- cancelamento de pedido ----------
function infoCancelamento(p){
  const dentroDaJanela = (Date.now() - p.criadoEm) <= JANELA_CANCELAMENTO_MS;
  const taxa = dentroDaJanela ? 0 : Math.round(p.preco*TAXA_CANCELAMENTO_TARDIO*100)/100;
  return { dentroDaJanela, taxa };
}
function podeCancelar(p){
  return p.status==='buscando' || p.status==='indo_coletar';
}
async function cancelarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p || !podeCancelar(p)) return;
  const { dentroDaJanela, taxa } = infoCancelamento(p);
  const mensagem = dentroDaJanela
    ? 'Cancelar esta corrida agora? Não haverá cobrança.'
    : `Já passaram mais de 10 minutos. Cancelar agora vai cobrar uma taxa de R$ ${taxa.toFixed(2)} (10% do valor). Confirmar?`;
  if(!confirm(mensagem)) return;
  const agora = Date.now();
  const { error } = await sb.from('entrega_pedidos').update({
    status:'cancelado', atualizado_em:agora, cancelado_em:agora, taxa_cancelamento: dentroDaJanela?0:taxa
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao cancelar o pedido.'); return; }
  mostrarToast(dentroDaJanela ? 'Pedido cancelado sem custo.' : `Pedido cancelado. Taxa de R$ ${taxa.toFixed(2)} aplicada.`);
  await carregarPedidos();
}

function podeEditar(p){

}
function abrirEdicaoPedido(id){

  estado.edicaoPedido = { id:p.id, origem:p.origem, destino:p.destino, paradas:[...(p.paradas||[])] };

function fecharEdicaoPedido(){ estado.edicaoPedido = null; render(); }
function adicionarParadaEdicao(){

  if((e.paradas||[]).length >= MAX_PARADAS_EXTRA){ mostrarToast('Máximo de 10 endereços de entrega por pedido.'); return; }

function removerParadaEdicao(idx){

async function salvarEdicaoPedido(){

  const destino = document.getElementById('ed-destino')?.value.trim() || e.destino;

  w.carregando = true; render();
  try{

    w.saldo = data ? Number(data.saldo)||0 : 0;
  }catch(e){ console.error(e); }

function abrirAdicionarSaldo(){

  w.adicionando = true; w.pix = { qrCode:null, copiaCola:null, status:'pendente', gerando:false, erro:'', id:null };
  render();
}
function fecharAdicionarSaldo(){
  const w = estado.cliente.carteira;
  w.adicionando = false;
  if(pixPollTimer){ clearInterval(pixPollTimer); pixPollTimer=null; }
  render();
}
async function confirmarValorCarteira(){
  const w = estado.cliente.carteira;
  const valor = parseFloat(document.getElementById('carteira-valor')?.value);
  if(!valor || valor<=0){ mostrarToast('Informa um valor válido.'); return; }
  w.valorInput = String(valor);
  w.gerando = true; w.pix.erro=''; render();
  try{
    const resp = await fetch(`${FUNCOES_URL}/criar-cobranca-pix-carteira`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ telefone:estado.cliente.telefone, nome:estado.cliente.nome, valor })
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro){ throw new Error(dados.erro || 'Falha ao gerar cobrança PIX.'); }
    w.pix.qrCode = dados.qrCodeBase64; w.pix.copiaCola = dados.copiaCola; w.pix.id = dados.id; w.pix.gerando=false;
    render();
    iniciarPollingCarteira();
  }catch(e){
    console.error(e);
    w.pix.gerando=false;
    w.pix.erro = 'Não consegui gerar a cobrança PIX. Tenta novamente em instantes.';
    render();
  }
}
function iniciarPollingCarteira(){
  if(pixPollTimer) clearInterval(pixPollTimer);
  pixPollTimer = setInterval(async ()=>{
    const w = estado.cliente.carteira;
    if(!w.pix.id || w.pix.status==='pago'){ clearInterval(pixPollTimer); pixPollTimer=null; return; }
    const { data } = await sb.from('entrega_carteira_pix').select('status').eq('id', w.pix.id).maybeSingle();
    if(data && data.status==='pago'){
      w.pix.status='pago'; clearInterval(pixPollTimer); pixPollTimer=null;
      await carregarCarteiraCliente();
      mostrarToast('Saldo adicionado com sucesso!');
      w.adicionando = false; render();
    }
  }, 4000);
}
function copiarPixCarteira(){
  const w = estado.cliente.carteira;
  if(!w.pix.copiaCola) return;
  navigator.clipboard.writeText(w.pix.copiaCola).then(()=>mostrarToast('Código PIX copiado!'));
}

function entregasDoMesAtual(telefone){
  const agora = new Date(); const inicioMes = new Date(agora.getFullYear(), agora.getMonth(), 1).getTime();
  return estado.pedidos.filter(p=>p.motoristaTelefone===telefone && p.status!=='buscando' && p.criadoEm>=inicioMes).length;
}
async function aceitarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const plano = PLANOS[estado.motorista.plano] || PLANOS.free;
  if(plano.limiteMensal!=null && entregasDoMesAtual(estado.motorista.telefone)>=plano.limiteMensal){
    mostrarToast(`Limite do plano Free (${plano.limiteMensal} entregas/mês) atingido. Passa para o Pro para entregas ilimitadas.`);
    return;
  }
  const mo = estado.motorista;
  const { error } = await sb.from('entrega_pedidos').update({
    status:'indo_coletar', motorista_nome: mo.nome, motorista_telefone: mo.telefone, atualizado_em: Date.now(),
    motorista_foto_url: mo.fotoMotoristaUrl||null, motorista_veiculo_tipo: mo.veiculo||null,
    motorista_marca: mo.marca||null, motorista_cor: mo.cor||null, motorista_placa: mo.placa||null
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao aceitar o pedido.'); return; }
  estado.ultimoPedidosJSON='';
  mostrarToast('Pedido aceito! Toca em "Abrir GPS" para navegar.');
  iniciarRastreioMotorista();
  await carregarPedidos();
}

async function creditarSaldoMotorista(telefone, valor){
  const { data } = await sb.from('entrega_saldos').select('saldo').eq('telefone', telefone).maybeSingle();
  const saldoAtual = data ? Number(data.saldo)||0 : 0;
  const novoSaldo = Math.round((saldoAtual + valor)*100)/100;
  await sb.from('entrega_saldos').upsert({ telefone, saldo:novoSaldo, atualizado_em:Date.now() });
  if(estado.motorista.telefone===telefone) estado.motorista.saldo = novoSaldo;
}
async function carregarSaldoMotorista(){
  const m = estado.motorista;
  if(!m.telefone) return;
  const { data } = await sb.from('entrega_saldos').select('saldo').eq('telefone', m.telefone).maybeSingle();
  m.saldo = data ? Number(data.saldo)||0 : 0;
  render();
}
async function avancarStatus(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const i = ESTAGIOS.indexOf(p.status);
  if(i < ESTAGIOS.length-1){
    const novoStatus = ESTAGIOS[i+1];
    const agora = Date.now();
    const { error } = await sb.from('entrega_pedidos').update({ status: novoStatus, atualizado_em: agora }).eq('id', id);
    if(error){ console.error(error); mostrarToast('Erro ao atualizar o pedido.'); return; }
    estado.ultimoPedidosJSON='';
    if(novoStatus==='entregue'){
      pararRastreioMotorista();
      await creditarSaldoMotorista(p.motoristaTelefone, ganhoMotorista(p.preco));
      mostrarToast(`Entrega concluída! R$ ${ganhoMotorista(p.preco).toFixed(2)} creditado.`);
    }
    await carregarPedidos();
  }
}

// ---------- rastreio ao vivo ----------
function iniciarRastreioMotorista(){
  if(!navigator.geolocation || watchId!=null) return;
  watchId = navigator.geolocation.watchPosition(
    (pos)=>{ ultimaPosicaoMotorista = { lat:pos.coords.latitude, lon:pos.coords.longitude }; },
    (err)=>{ console.warn(err); },
    { enableHighAccuracy:true, maximumAge:10000 }
  );
  if(!window._envioIntervalo) window._envioIntervalo = setInterval(enviarPosicaoMotorista, 15000);
}
function pararRastreioMotorista(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }
async function enviarPosicaoMotorista(){
  if(!ultimaPosicaoMotorista || !estado.motorista.ativo) return;
  const ativo = estado.pedidos.find(p=>p.motoristaTelefone===estado.motorista.telefone && p.status!=='buscando' && p.status!=='entregue');
  if(!ativo) return;
  await sb.from('entrega_pedidos').update({
    motorista_lat: ultimaPosicaoMotorista.lat, motorista_lng: ultimaPosicaoMotorista.lon, motorista_atualizado_em: Date.now()
  }).eq('id', ativo.id);
  estado.ultimoPedidosJSON='';

// ---------- mapa ----------
function montarMapa(containerId, pedido){
  setTimeout(()=>{
    const el = document.getElementById(containerId);
    if(!el || !pedido.origemCoord || !pedido.destinoCoord) return;
    if(mapasAtivos[containerId]){ try{ mapasAtivos[containerId].remove(); }catch(e){} }
    const map = L.map(containerId,{zoomControl:false, attributionControl:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const pO=[pedido.origemCoord.lat,pedido.origemCoord.lon], pD=[pedido.destinoCoord.lat,pedido.destinoCoord.lon];
    L.marker(pO,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#FF5A4E;border:2px solid #fff"></div>'})}).addTo(map);
    L.marker(pD,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#4CD787;border:2px solid #fff"></div>'})}).addTo(map);
    const pontos=[pO,pD];
    // linha do percurso planejado (recolha -> entrega), fina e discreta
    L.polyline([pO,pD],{color:'#8D93A6',weight:2,opacity:0.35,dashArray:'5,7'}).addTo(map);
    if(pedido.motoristaCoord){
      const pM=[pedido.motoristaCoord.lat,pedido.motoristaCoord.lon];
      const alvo = (pedido.status==='indo_coletar') ? pO : pD;
      // linha do trajeto do motorista até o próximo destino - se move conforme ele se aproxima
      L.polyline([pM,alvo],{color:'#FFB627',weight:5,opacity:0.9,lineCap:'round'}).addTo(map);
      L.marker(pM,{icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#FFB627;border:2px solid #fff;box-shadow:0 0 0 4px rgba(255,182,39,0.3)"></div>'})}).addTo(map);
      pontos.push(pM);
    }
    map.fitBounds(pontos,{padding:[24,24]});
    mapasAtivos[containerId]=map;
  },30);
}
function etaHTML(pedido){
  if(!pedido.motoristaCoord) return `<div class="subtitulo" style="margin-top:8px">Aguardando o entregador iniciar a rota...</div>`;
  const alvo = (pedido.status==='indo_coletar') ? pedido.origemCoord : pedido.destinoCoord;
  if(!alvo) return '';
  const km = distanciaKm(pedido.motoristaCoord.lat,pedido.motoristaCoord.lon,alvo.lat,alvo.lon);
  const min = Math.max(1, Math.round((km/VEICULOS[pedido.veiculo].veloc)*60));
  const txt = pedido.status==='indo_coletar' ? 'até a coleta' : 'até o teu endereço';
  return `<div class="eta-banner"><div class="eta-min">~${min} min</div><div class="eta-sub">${km.toFixed(1)} km ${txt} · atualizado em tempo real</div></div>`;
}

    <textarea id="c-descricao" placeholder="Ex: caixa pequena, documentos...">${f.descricao}</textarea>

    ` : `<div class="subtitulo" style="margin-top:12px">Cobrimos Muzambinho/MG e cidades próximas.</div>`}
  </div>

  <div class="cartao">
    <h2>Carteira</h2>
    <div class="saldo-card">
      <div class="valor-saldo">R$ ${w.saldo.toFixed(2)}</div>

  <div class="cartao">
    <h2>Os meus pedidos</h2>
    <div class="aba-mini">
      <button class="${estado.abaPedidosCliente==='ativos'?'ativo':''}" onclick="estado.abaPedidosCliente='ativos';render()">Em andamento</button>

        ? `<div class="vazio"><span class="emoji-grande">📦</span>${estado.abaPedidosCliente==='ativos'?'Nenhum pedido em andamento.':'Ainda não há pedidos no histórico.'}</div>`

    }

function telaMotorista(){
  const m = estado.motorista;
  if(!m.ativo){
    return telaAcessoMotorista();
  }
  const planoAtual = PLANOS[m.plano] || PLANOS.free;
  const agoraTs = Date.now();
  const disponiveis = m.disponivel ? estado.pedidos.filter(p=>p.status==='buscando' && (planoAtual.prioridade || (agoraTs-p.criadoEm)>=ATRASO_PRIORIDADE_PRO_MS)) : [];
  const ativos = estado.pedidos.filter(p=>p.status!=='buscando' && p.status!=='entregue' && p.motoristaTelefone===m.telefone);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const entreguesHojeArr = estado.pedidos.filter(p=>p.status==='entregue' && p.motoristaTelefone===m.telefone && p.atualizadoEm>=hoje.getTime());
  const ganhosHoje = entreguesHojeArr.reduce((s,p)=>s+ganhoMotorista(p.preco),0);
  const entregasMes = entregasDoMesAtual(m.telefone);
  return `
  <div class="saldo-card">
    <div class="valor-saldo">R$ ${ganhosHoje.toFixed(2)}</div>
    <div class="rotulo-saldo">Creditado hoje · ${entreguesHojeArr.length} entregas · Plano ${planoAtual.label}</div>
    <div class="rotulo-saldo" style="margin-top:6px">Saldo disponível para saque: <b style="color:var(--osso)">R$ ${Number(m.saldo||0).toFixed(2)}</b></div>
    <button class="btn btn-secundario btn-pequeno" style="margin-top:10px" onclick="solicitarSaque()">💰 Pedir saque</button>
  </div>
  <button class="btn ${m.disponivel?'btn-secundario':'btn-verde'}" onclick="alternarDisponibilidade()">${m.disponivel?'🔴 Parar / ficar indisponível':'🟢 Iniciar rota'}</button>
  <div class="rodape-motorista">
    <div style="font-size:12px;color:var(--poeira)">Ligado como <b style="color:var(--osso)">${m.nome}</b>${planoAtual.limiteMensal!=null?` · ${entregasMes}/${planoAtual.limiteMensal} entregas este mês`:''}</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secundario btn-pequeno botao-chat" onclick="abrirSuporte()">💬 Suporte${estado.suporteNaoLidas>0?`<span class="notif-bolinha">${estado.suporteNaoLidas}</span>`:''}</button>
      <button class="btn btn-secundario btn-pequeno" onclick="sairMotorista()">Sair</button>
    </div>
  </div>
  ${ativos.length>0 ? `<div class="cartao"><h2>Em curso</h2>${ativos.map(cartaoPedidoAtivo).join('')}</div>` : ''}
  <div class="cartao">
    <h2>Pedidos disponíveis</h2>
    ${!m.disponivel
      ? `<div class="vazio"><span class="emoji-grande">🛵</span>Toca em "Iniciar rota" para começar a receber pedidos.</div>`
      : disponiveis.length===0
        ? `<div class="vazio"><span class="emoji-grande">🛵</span>Sem pedidos por agora.</div>`
        : disponiveis.map(cartaoPedidoDisponivel).join('')
    }
  </div>`;
}

function setDeep(path,value){
  const parts=path.split('.'); let obj=estado;
  for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts[parts.length-1]]=value;
  if(path==='form.origem'||path==='form.destino'){ estado.form.distancia=null; estado.form.origemCoord=null; estado.form.destinoCoord=null; }
}
function mudarVeiculo(k){

  render();
}

  const m = estado.motorista;

async function hashSenha(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function cadastrarCliente(){
  const c = estado.painelCliente.cadastro;
  c.nome = document.getElementById('cc-nome').value.trim();
  c.telefone = document.getElementById('cc-telefone').value.trim();
  c.senha = document.getElementById('cc-senha').value;
  if(!c.nome||!c.telefone||!c.senha){ c.erro='Preenche todos os campos.'; render(); return; }
  if(c.senha.length<4){ c.erro='A senha precisa de pelo menos 4 caracteres.'; render(); return; }
  const { data: existente, error: erroConsulta } = await sb.from('entrega_clientes').select('telefone,senha_hash').eq('telefone', c.telefone).maybeSingle();
  if(erroConsulta){ console.error(erroConsulta); c.erro='Erro ao verificar o telefone. Tenta novamente.'; render(); return; }
  if(existente && existente.senha_hash){ c.erro='Já existe uma conta com este telefone. Entra na tua conta.'; render(); return; }
  const senhaHash = await hashSenha(c.senha);
  const agora = Date.now();
  const { error } = await sb.from('entrega_clientes').upsert({
    telefone:c.telefone, nome:c.nome,
    senha_hash:senhaHash, criado_em: existente ? undefined : agora, atualizado_em:agora
  });
  if(error){ console.error(error); c.erro='Erro ao criar a conta. Tenta novamente.'; render(); return; }
  estado.cliente = { nome:c.nome, telefone:c.telefone, logado:true, carteira:{ saldo:0, carregando:false, adicionando:false, valorInput:'10', pix:{ qrCode:null, copiaCola:null, status:'pendente', gerando:false, erro:'', id:null } } };
  estado.filtroTelefoneCliente = c.telefone;
  estado.form.nome = c.nome; estado.form.telefone = c.telefone;
  estado.ultimoPedidosJSON='';
  mostrarToast('Conta criada! Bem-vindo(a), '+c.nome+'.');
  await carregarPedidos();
  await carregarCarteiraCliente();
  render();
}

async function salvarEtapaCadastro(campos){
  const c = estado.painelMotorista.cadastro;
  const agora = Date.now();
  if(!c.id){ c.id = 'mot'+agora+Math.floor(Math.random()*1000); }
  const base = { id:c.id, criado_em: c.criadoEm||agora, atualizado_em: agora };
  if(c.nome) base.nome = c.nome;
  if(c.cpf) base.cpf = c.cpf;
  if(c.telefone) base.telefone = c.telefone;
  if(c.cidade) base.cidade = c.cidade;
  if(c.senhaHash) base.senha_hash = c.senhaHash;
  const linha = Object.assign(base, campos);
  const { error } = await sb.from('entrega_motoristas').upsert(linha);
  if(error){ console.error(error); mostrarToast('Erro ao gravar o cadastro: '+(error.message||'')); return false; }
  c.criadoEm = c.criadoEm || agora;
  return true;
}

function cpfValido(cpf){
  const s = String(cpf||'').replace(/\D/g,'');
  if(s.length!==11) return false;
  if(/^(\d)\1{10}$/.test(s)) return false; // todos os dígitos iguais, ex: 111.111.111-11
  const calcDigito = (base)=>{
    let soma=0, peso=base.length+1;
    for(let i=0;i<base.length;i++){ soma += parseInt(base[i],10)*peso; peso--; }
    const resto = soma % 11;
    return resto<2 ? 0 : 11-resto;
  };
  const d1 = calcDigito(s.slice(0,9));
  if(d1 !== parseInt(s[9],10)) return false;
  const d2 = calcDigito(s.slice(0,10));
  if(d2 !== parseInt(s[10],10)) return false;
  return true;
}

async function avancarEtapa1(){
  const c = estado.painelMotorista.cadastro;
  c.nome = document.getElementById('cm-nome').value.trim();
  c.cpf = document.getElementById('cm-cpf').value.trim();
  c.telefone = document.getElementById('cm-telefone').value.trim();
  c.cidade = document.getElementById('cm-cidade').value.trim();
  c.senha = document.getElementById('cm-senha').value;
  if(!c.nome||!c.cpf||!c.telefone||!c.cidade||!c.senha){ c.erroEtapa='Preenche todos os campos.'; render(); return; }
  if(!cpfValido(c.cpf)){ c.erroEtapa='CPF inválido — confere os números.'; render(); return; }
  if(c.senha.length<4){ c.erroEtapa='A senha precisa de pelo menos 4 caracteres.'; render(); return; }
  c.erroEtapa=''; c.enviando=true; render();
  const { data: existente } = await sb.from('entrega_motoristas').select('id,status').eq('telefone', c.telefone).maybeSingle();
  if(existente && existente.status!=='incompleto'){
    c.enviando=false; c.erroEtapa='Já existe cadastro com este telefone. Usa "Já sou cadastrado" para entrar.';
    render(); return;
  }
  if(existente) c.id = existente.id;
  c.senhaHash = await hashSenha(c.senha);
  const ok = await salvarEtapaCadastro({ nome:c.nome, cpf:c.cpf, telefone:c.telefone, cidade:c.cidade, senha_hash:c.senhaHash, status:'incompleto' });
  c.enviando=false;
  if(ok){ c.etapa=2; } else { c.id=null; }
  render();
}

let uploadPendente = null; // 'cnh' | 'crlv' | 'fotoVeiculo' | 'fotoMotorista'
function solicitarUploadDocumento(tipo){ uploadPendente = tipo; document.getElementById('input-doc-motorista').click(); }
async function processarDocumentoSelecionado(input){
  const file = input.files && input.files[0];
  input.value='';
  if(!file || !uploadPendente) return;
  const tipo = uploadPendente; uploadPendente = null;
  const c = estado.painelMotorista.cadastro;
  mostrarToast('Enviando documento...');
  const nomeArquivo = `${c.id}/${tipo}-${Date.now()}.jpg`;
  const { error: erroUp } = await sb.storage.from('motorista-documentos').upload(nomeArquivo, file, { upsert:true, contentType:file.type||'image/jpeg' });
  if(erroUp){ console.error(erroUp); mostrarToast('Erro ao enviar o documento.'); return; }
  const { data: pub } = sb.storage.from('motorista-documentos').getPublicUrl(nomeArquivo);
  if(tipo==='cnh') c.cnhUrl = pub.publicUrl;
  if(tipo==='crlv') c.crlvUrl = pub.publicUrl;
  if(tipo==='fotoVeiculo') c.fotoVeiculoUrl = pub.publicUrl;
  if(tipo==='fotoMotorista') c.fotoMotoristaUrl = pub.publicUrl;
  await salvarEtapaCadastro({ cnh_url:c.cnhUrl, crlv_url:c.crlvUrl, foto_veiculo_url:c.fotoVeiculoUrl, foto_motorista_url:c.fotoMotoristaUrl });
  render();
}

async function escolherPlano(chave){
  const c = estado.painelMotorista.cadastro;
  if(c.plano===chave) return;
  c.plano = chave;
  c.pix = { qrCode:null, copiaCola:null, status:'pendente', gerando:false, erro:'' };
  if(pixPollTimer){ clearInterval(pixPollTimer); pixPollTimer=null; }
  const p = PLANOS[chave];
  await salvarEtapaCadastro({ plano:chave, taxa_valor:p.preco, taxa_status: p.preco>0 ? 'pendente' : 'pago' });
  render();
  if(chave==='pro'){ criarCobrancaPix(); }
}

async function criarCobrancaPix(){
  const c = estado.painelMotorista.cadastro;
  c.pix.gerando=true; c.pix.erro=''; render();
  try{
    const resp = await fetch(`${FUNCOES_URL}/criar-cobranca-pix`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ motoristaId:c.id, valor:PLANOS.pro.preco, nome:c.nome, cpf:c.cpf })
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro){ throw new Error(dados.erro || 'Falha ao gerar cobrança PIX.'); }
    c.pix.qrCode = dados.qrCodeBase64; c.pix.copiaCola = dados.copiaCola; c.pix.gerando=false;
    render();
    iniciarPollingPix();
  }catch(e){
    console.error(e);
    c.pix.gerando=false; c.pix.erro = 'Não consegui gerar a cobrança PIX. Verifica se a chave MP_ACCESS_TOKEN está configurada nas secrets do Supabase e tenta novamente.';
    render();
  }
}
function iniciarPollingPix(){
  if(pixPollTimer) clearInterval(pixPollTimer);
  pixPollTimer = setInterval(async ()=>{
    const c = estado.painelMotorista.cadastro;
    if(!c.id || c.pix.status==='pago'){ clearInterval(pixPollTimer); pixPollTimer=null; return; }
    const { data } = await sb.from('entrega_motoristas').select('taxa_status').eq('id', c.id).maybeSingle();
    if(data && data.taxa_status==='pago'){
      c.pix.status='pago'; clearInterval(pixPollTimer); pixPollTimer=null; render();
    }
  }, 4000);
}
function copiarPix(){
  const c = estado.painelMotorista.cadastro;
  if(!c.pix.copiaCola) return;
  navigator.clipboard.writeText(c.pix.copiaCola).then(()=>mostrarToast('Código PIX copiado!'));
}

async function solicitarSaque(){
  const m = estado.motorista;
  const { data: pendente } = await sb.from('entrega_saques').select('id').eq('motorista_telefone', m.telefone).eq('status','pendente').maybeSingle();
  if(pendente){ mostrarToast('Já tens um pedido de saque pendente. Aguarda o pagamento.'); return; }
  const { data: saldoRow } = await sb.from('entrega_saldos').select('saldo').eq('telefone', m.telefone).maybeSingle();
  const saldo = saldoRow ? Number(saldoRow.saldo)||0 : 0;
  if(saldo<=0){ mostrarToast('Não tens saldo disponível para saque.'); return; }
  const { error } = await sb.from('entrega_saques').insert({
    motorista_nome:m.nome, motorista_telefone:m.telefone, valor:saldo,
    status:'pendente', criado_em:Date.now()
  });
  if(error){ console.error(error); mostrarToast('Erro ao pedir o saque. Tenta novamente.'); return; }
  mostrarToast('Pedido de saque enviado! Vamos avisar-te por WhatsApp assim que for pago.');
}
async function carregarSaquesAdmin(){
  const { data, error } = await sb.from('entrega_saques').select('*').order('criado_em',{ascending:false});
  if(error){ console.error(error); return; }
  estado.admin.saques = data||[];
  render();
}
async function marcarSaquePago(id){
  const { data: saque, error: erroBusca } = await sb.from('entrega_saques').select('*').eq('id', id).maybeSingle();
  if(erroBusca || !saque){ mostrarToast('Erro ao localizar o saque.'); return; }
  const { error } = await sb.from('entrega_saques').update({ status:'pago', atualizado_em:Date.now() }).eq('id', id);
  if(error){ mostrarToast('Erro ao marcar saque como pago.'); return; }
  const { data: saldoRow } = await sb.from('entrega_saldos').select('saldo').eq('telefone', saque.motorista_telefone).maybeSingle();
  const saldoAtual = saldoRow ? Number(saldoRow.saldo)||0 : 0;
  const novoSaldo = Math.max(0, Math.round((saldoAtual - Number(saque.valor))*100)/100);
  await sb.from('entrega_saldos').upsert({ telefone: saque.motorista_telefone, saldo:novoSaldo, atualizado_em:Date.now() });
  mostrarToast('Saque marcado como pago!');
  await carregarSaquesAdmin();
}

  return `
    <div class="admin-cartao">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${s.motorista_nome}</b>
        <span class="selo ${s.status==='pendente'?'selo-andamento':'selo-entregue'}">${s.status}</span>

    </div>`;
}
