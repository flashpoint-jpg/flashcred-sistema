<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega Flash - Portal do Entregador</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { max-width: 500px; width: 100%; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #28a745; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #218838; }
        .error { color: red; font-size: 12px; margin-top: 5px; display: block; }
        .switch-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .switch-link a { color: #007bff; text-decoration: none; cursor: pointer; }
        .switch-link a:hover { text-decoration: underline; }
        .hidden { display: none; }
        .dashboard { text-align: center; }
    </style>
</head>
<body>

<div class="card">

    <!-- TELA DE LOGIN -->
    <div id="telaLogin">
        <h2>Login - Entrega Flash</h2>
        <form onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <div class="switch-link">
            Ainda não tem conta? <a onclick="mostrarCadastro()">Cadastre-se aqui</a>
        </div>
    </div>

    <!-- TELA DE PRÉ-CADASTRO -->
    <div id="telaCadastro" class="hidden">
        <h2>Cadastro - Entrega Flash</h2>
        <form onsubmit="fazerCadastro(event)">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required oninput="mascaraCPF(this)">
                <span id="erroCpf" class="error"></span>
            </div>
            <div class="form-group">
                <label>Data de Nascimento</label>
                <input type="date" id="nascimento" required onchange="validarIdade()">
                <span id="erroIdade" class="error"></span>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" minlength="6" required>
            </div>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
            <div class="form-group">
                <label>CEP</label>
                <input type="text" id="cep" placeholder="00000-000" maxlength="9" required onblur="buscarCep(this.value)">
            </div>
            <div class="form-group">
                <label>Endereço</label>
                <input type="text" id="endereco" required>
            </div>
            <div class="form-group">
                <label>Número</label>
                <input type="text" id="numero" required>
            </div>
            <div class="form-group">
                <label>Escolha o Plano</label>
                <select id="plano" required>
                    <option value="free">Opção Free</option>
                    <option value="premium">Opção Premium - R$ 35,00</option>
                </select>
            </div>
            <button type="submit">Finalizar Cadastro</button>
        </form>
        <div class="switch-link">
            Já tem uma conta? <a onclick="mostrarLogin()">Faça login</a>
        </div>
    </div>

    <!-- PAINEL -->
    <div id="telaPainel" class="hidden dashboard">
        <h2>Bem-vindo à sua Página!</h2>
        <p>Olá, <span id="nomeEntregadorLogado">Entregador</span>!</p>
        <p>Status da sua conta: <strong style="color: orange;">Pendente de Aprovação</strong></p>
        <p style="font-size: 14px; color: #666;">Assim que o administrador validar seus dados, suas entregas aparecerão aqui.</p>
        <button onclick="fazerLogout()" style="background: #dc3545; margin-top: 30px;">Sair</button>
    </div>

</div>

<script>
    function mostrarCadastro() {
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('telaCadastro').classList.remove('hidden');
    }

    function mostrarLogin() {
        document.getElementById('telaCadastro').classList.add('hidden');
        document.getElementById('telaLogin').classList.remove('hidden');
    }

    function mascaraCPF(input) {
        let v = input.value.replace(/\D/g, "");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        input.value = v;
    }

    function validarIdade() {
        const dataNascimento = document.getElementById('nascimento').value;
        const erroIdade = document.getElementById('erroIdade');
        if (!dataNascimento) return true;

        const hoje = new Date();
        const nascimento = new Date(dataNascimento);
        let idade = hoje.getFullYear() - nascimento.getFullYear();
        const m = hoje.getMonth() - nascimento.getMonth();
        
        if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
            idade--;
        }

        if (idade < 18) {
            erroIdade.textContent = "O entregador deve ser maior de 18 anos.";
            return false;
        } else {
            erroIdade.textContent = "";
            return true;
        }
    }

    function buscarCep(cep) {
        cep = cep.replace(/\D/g, '');
        if (cep.length !== 8) return;

        fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(response => response.json())
            .then(data => {
                if (!data.erro) {
                    document.getElementById('endereco').value = `${data.logradouro}, ${data.bairro} - ${data.localidade}/${data.uf}`;
                } else {
                    alert('CEP não encontrado.');
                }
            })
            .catch(() => alert('Erro ao buscar o CEP.'));
    }

    function fazerCadastro(event) {
        event.preventDefault();
        if (!validarIdade()) {
            alert("Cadastro não permitido para menores de idade.");
            return;
        }

        alert("Cadastro realizado com sucesso! Faça login para acessar.");
        mostrarLogin();
    }

    function fazerLogin(event) {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value;
        
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('telaPainel').classList.remove('hidden');
        document.getElementById('nomeEntregadorLogado').textContent = email;
    }

    function fazerLogout() {
        document.getElementById('telaPainel').classList.add('hidden');
        document.getElementById('telaLogin').classList.remove('hidden');
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginSenha').value = '';
    }
</script>

</body>
</html>
