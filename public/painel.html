<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
            --bg-body: #F8FAFC;
            --borda: #E2E8F0;
            --texto: #334155;
            --texto-claro: #64748B;
            --pendente: #FBBF24;
            --paga: #22C55E;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); padding: 16px; line-height: 1.5; }

        .login { max-width: 380px; margin: 80px auto; background: white; padding: 28px; border-radius: 16px; box-shadow: 0 4px 16px rgba(10,36,99,0.06); }
        .login h2 { text-align: center; color: var(--primary); margin-bottom: 22px; font-size: 20px; }
        input { width: 100%; padding: 11px 14px; border: 1px solid var(--borda); border-radius: 8px; font-size: 15px; margin: 6px 0 14px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10,36,99,0.08); }
        button { border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-entrar { width: 100%; padding: 11px; background: var(--primary); color: white; }
        .btn-entrar:hover { background: #0c3499; }
        .erro { color: var(--perigo); text-align: center; margin-top: 8px; display: none; font-size: 14px; }

        .container { max-width: 1100px; margin: 0 auto; display: none; }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
        h1 { color: var(--primary); font-size: 20px; font-weight: 700; }

        .caixa-totais { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        .total-card { background: white; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--borda); }
        .total-label { font-size: 12px; color: var(--texto-claro); font-weight: 600; }
        .total-valor { font-size: 20px; font-weight: 700; color: var(--primary); margin-top: 4px; }
        .total-ent { color: var(--sucesso); }
        .total-falta { color: var(--alerta); }
        .total-parc { color: #8B5CF6; }

        .modos { display: flex; gap: 6px; }
        .modo { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .modo-manual { background: #DBEAFE; color: #1E40AF; }
        .modo-teste { background: #FEF3C7; color: #92400E; }
        .modo-producao { background: #D1FAE5; color: #065F46; }
        .modo-ativo { box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15); }

        .busca { background: white; padding: 16px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 18px; }
        .busca label { font-size: 13px; font-weight: 600; color: var(--texto-claro); display: block; margin-bottom: 6px; }
        .busca-linha { display: flex; gap: 10px; }
        .busca input { flex: 1; margin: 0; }
        .btn-busca { padding: 11px 18px; background: var(--primary); color: white; white-space: nowrap; }

        .alerta-novo { background: #FEF3C7; border-left: 3px solid var(--alerta); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }

        .proposta { background: white; padding: 18px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 14px; }
        .proposta-topo { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .proposta-nome { font-size: 16px; font-weight: 700; color: var(--primary); }
        .proposta-info { font-size: 12px; color: var(--texto-claro); margin-top: 3px; }
        .status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-nova { background: #FEF3C7; color: #92400E; }
        .status-aprovada { background: #D1FAE5; color: #065F46; }
        .status-paga { background: #BBF7D0; color: #166534; }
        .status-reprovada { background: #FEE2E2; color: #991B1B; }

        .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
        .campo label { font-size: 12px; color: var(--texto-claro); font-weight: 600; display: block; margin-bottom: 3px; }
        .campo input { padding: 8px 10px; margin: 0; border: 1px solid var(--borda); border-radius: 6px; font-size: 14px; width: 100%; }
        .campo input[readonly] { background: #F8FAFC; color: var(--sucesso); font-weight: 600; }

        .tabela-parcelas { width: 100%; border-collapse: collapse; margin-top: 14px; }
        .tabela-parcelas th { background: #F1F5F9; padding: 8px 10px; text-align: left; font-size: 13px; color: var(--texto-claro); font-weight: 600; }
        .tabela-parcelas td { padding: 8px 10px; border-top: 1px solid var(--borda); font-size: 14px; }
        .tabela-parcelas tr:hover { background: #FAFBFC; }
        .parcela-paga { color: var(--sucesso); font-weight: 600; }
        .parcela-pendente { color: var(--alerta); font-weight: 600; }
        .btn-marcar-paga { padding: 4px 8px; font-size: 12px; background: var(--sucesso); color: white; border-radius: 4px; }
        .btn-marcar-paga:disabled { background: #D1FAE5; color: #166534; cursor: default; }

        .botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn { padding: 8px 14px; font-size: 13px; border-radius: 7px; }
        .btn-aprovar { background: var(--sucesso); color: white; }
        .btn-aprovar:hover { background: #059669; }
        .btn-aprovar:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-pagar-manual { background: #0284C7; color: white; }
        .btn-pagar-manual:hover { background: #0369A1; }
        .btn-reprovar { background: var(--perigo); color: white; }
        .btn-reprovar:hover { background: #DC2626; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #1fb85c; }
        .btn-excluir { background: #F1F5F9; color: #64748B; }
        .btn-excluir:hover { background: #E2E8F0; }

        .vazio { text-align: center; color: var(--texto-claro); padding: 40px; font-size: 15px; }
        .carregando { text-align: center; padding: 30px; color: var(--texto-claro); display: none; font-size: 14px; }
        .qrcode-img { max-width: 100px; border-radius: 6px; margin-top: 6px; border: 1px solid #ddd; }
        .data-pagamento { background: #E0F2FE; padding: 6px 10px; border-radius: 6px; font-size: 13px; color: #0369A1; display: inline-block; margin-top: 4px; }
        .btn-ver-parcelas { background: #8B5CF6; color: white; margin-left: 8px; }
        .btn-ver-parcelas:hover { background: #7C3AED; }
        .parcelas-container { margin-top: 14px; display: none; }
        .parcelas-container.visivel { display: block; }
    </style>
</head>
<body>

<div id="telaLogin" class="login">
    <h2>🔐 Acesso Administrativo</h2>
    <label style="font-weight:600; font-size:14px; color:#475569;">Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha">
    <button onclick="entrar()" class="btn-entrar">Entrar</button>
    <p id="erroLogin" class="erro">Senha incorreta!</p>
</div>

<div id="telaPainel" class="container">
    <div class="topo">
        <h1>📋 Painel de Controle</h1>
        <div class="modos">
            <button class="modo modo-manual" onclick="definirModo('manual')">Manual</button>
            <button class="modo modo-teste" onclick="definirModo('teste')">Teste</button>
            <button class="modo modo-producao modo-ativo" onclick="definirModo('producao')">Produção</button>
        </div>
    </div>

    <div class="caixa-totais">
        <div class="total-card">
            <div class="total-label">💰 Total Propostas</div>
            <div class="total-valor" id="totalPropostas">0</div>
        </div>
        <div class="total-card">
            <div class="total-label total-ent">✅ Entradas Recebidas</div>
            <div class="total-valor total-ent" id="totalEntradas">R$ 0,00</div>
        </div>
        <div class="total-card">
            <div class="total-label total-falta">⏳ Valor a Receber</div>
            <div class="total-valor total-falta" id="totalFalta">R$ 0,00</div>
        </div>
        <div class="total-card">
            <div class="total-label total-parc">📊 Parcelas Pagas/Pendentes</div>
            <div class="total-valor total-parc" id="totalParcelas">0 / 0</div>
        </div>
    </div>

    <div id="alertaNovas" class="alerta-novo">🔔 Você tem novas propostas!</div>

    <div class="busca">
        <label>🔍 Buscar por CPF ou Código Único</label>
        <div class="busca-linha">
            <input type="text" id="busca" placeholder="Digite o CPF ou Código" oninput="filtrar()">
            <button onclick="carregar()" class="btn-busca">Atualizar</button>
        </div>
    </div>

    <div id="lista"></div>
    <div id="carregando" class="carregando">Carregando propostas...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SENHA = 'flash2026';
const CHAVE_PIX_FIXA = '33552949852';
const TOKEN_MP_PRODUCAO = 'APP_USR-8158139097874832-072720-d200da044f05a1dd8eb75f90e0551431-18499471';

let modo = 'producao';
let propostas = [];
let timer = null;
let processando = false;

function gerarCodigoUnico() {
    const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numeros = '0123456789';
    let codigo = 'FL-';
    for (let i = 0; i < 2; i++) codigo += letras.charAt(Math.floor(Math.random() * letras.length));
    for (let i = 0; i < 3; i++) codigo += numeros.charAt(Math.floor(Math.random() * numeros.length));
    return codigo;
}

function formatarData(data) {
    if (!data) return '---';
    const d = new Date(data);
    return d.toLocaleDateString('pt-BR');
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function calcularParcelas(valorTotal, percEnt, qtdParcelas, juros) {
    const entrada = valorTotal * percEnt / 100;
    const resto = valorTotal - entrada;
    const valorParcela = qtdParcelas > 0 ? resto * (1 + juros/100) / qtdParcelas : 0;
    const lista = [];
    const hoje = new Date();
    for (let i = 1; i <= qtdParcelas; i++) {
        const vencimento = new Date(hoje);
        vencimento.setMonth(vencimento.getMonth() + i);
        lista.push({
            numero: i,
            valor: valorParcela,
            vencimento: vencimento.toISOString().split('T')[0],
            status: 'Pendente'
        });
    }
    return { entrada, valorParcela, lista };
}

function entrar() {
    if (document.getElementById('senha').value === SENHA) {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregar();
        timer = setInterval(() => carregar(true), 10000);
    } else {
        document.getElementById('erroLogin').style.display = 'block';
    }
}

function definirModo(m) {
    modo = m;
    document.querySelectorAll('.modo').forEach(b => b.classList.remove('modo-ativo'));
    event.target.classList.add('modo-ativo');
    alert(`✅ Modo ${m.toUpperCase()} ativado!`);
}

async function carregar(silencioso = false) {
    if (!silencioso) document.getElementById('carregando').style.display = 'block';
    const { data, error } = await supabase.from('propostas').select('*').order('created_at', { ascending: false });
    if (!silencioso) document.getElementById('carregando').style.display = 'none';
    if (error) { alert('Erro: ' + error.message); return; }

    const qtdAnt = propostas.length;
    propostas = data || [];

    const totalEntradas = propostas.reduce((s, p) => s + Number(p.valor_entrada || 0), 0);
    const totalRestante = propostas.reduce((s, p) => {
        const total = Number(p.valor_desejado || 0);
        const entrada = Number(p.valor_entrada || 0);
        return s + (total - entrada);
    }, 0);

    let totalPagas = 0, totalTodas = 0;
    propostas.forEach(p => {
        const parcelas = p.lista_parcelas || [];
        totalTodas += parcelas.length;
        totalPagas += parcelas.filter(x => x.status === 'Paga').length;
    });

    document.getElementById('totalPropostas').textContent = propostas.length;
    document.getElementById('totalEntradas').textContent = real(totalEntradas);
    document.getElementById('totalFalta').textContent = real(totalRestante);
    document.getElementById('totalParcelas').textContent = `${totalPagas} / ${totalTodas}`;

    if (silencioso && propostas.length > qtdAnt) {
        const alerta = document.getElementById('alertaNovas');
        alerta.style.display = 'block';
        setTimeout(() => alerta.style.display = 'none', 5000);
    }
    filtrar();
}

function filtrar() {
    const busca = document.getElementById('busca').value.replace(/\D/g, '');
    let lista = propostas;
    if (busca.length >= 11) {
        lista = propostas.filter(p => (p.cpf || '').replace(/\D/g, '').includes(busca));
    } else if (busca.length >= 4) {
        lista = propostas.filter(p => (p.codigo_unico || '').toUpperCase().includes(busca.toUpperCase()));
    }
    document.getElementById('lista').innerHTML = lista.length === 0 
        ? '<p class="vazio">Nenhuma proposta encontrada</p>'
        : lista.map(criarCard).join('');
}

function criarCard(p) {
    let statusCls, statusTxt;
    if (p.status === 'Entrada Paga') {
        statusCls = 'status-paga'; statusTxt = '💰 Entrada Paga';
    } else if (p.status === 'Aprovada') {
        statusCls = 'status-aprovada'; statusTxt = '✅ Aprovada';
    } else if (p.status === 'Reprovada') {
        statusCls = 'status-reprovada'; statusTxt = '❌ Reprovada';
    } else {
        statusCls = 'status-nova'; statusTxt = '⏳ Aguardando';
    }

    const valorTotal = Number(p.valor_desejado || 0);
    const percEnt = Number(p.percentual_entrada || 20);
    const valorEnt = valorTotal * percEnt / 100;
    const parcelas = p.quantidade_parcelas || 0;
    const juros = Number(p.juros || 0);
    const calc = calcularParcelas(valorTotal, percEnt, parcelas, juros);

    const cpf = (p.cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    const qrExibicao = p.qr_code_entrada 
        ? `<img src="${p.qr_code_entrada}" class="qrcode-img" alt="QR Code">` 
        : '<span style="color:#94a3b8">Aguardando</span>';
    const pixStatus = p.copia_cola_pix 
        ? (p.status === 'Entrada Paga' ? '<span style="color:#0284C7; font-weight:600">✅ ENTRADA PAGA</span>' :
           p.copia_cola_pix.length > 40 ? '<span style="color:#10B981; font-weight:600">✅ MP - Pix</span>' : 
           '<span style="color:#3B82F6">✅ Chave Pix</span>')
        : '<span style="color:#94a3b8">Aguardando</span>';

    const dataPagamento = p.data_pagamento_entrada 
        ? `<div class="data-pagamento">📅 Entrada paga em: ${formatarData(p.data_pagamento_entrada)}</div>` 
        : '';

    const listaParcelas = p.lista_parcelas || calc.lista;
    const tabelaParcelas = p.status === 'Entrada Paga' || p.status === 'Aprovada' ? `
    <div class="parcelas-container" id="parc-${p.id}">
        <table class="tabela-parcelas">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Vencimento</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                ${listaParcelas.map((parc, idx) => `
                <tr>
                    <td>${parc.numero}</td>
                    <td>${formatarData(parc.vencimento)}</td>
                    <td>${real(parc.valor)}</td>
                    <td class="${parc.status === 'Paga' ? 'parcela-paga' : 'parcela-pendente'}">
                        ${parc.status === 'Paga' ? '✅ Paga' : '⏳ Pendente'}
                    </td>
                    <td>
                        <button class="btn-marcar-paga" 
                            ${parc.status === 'Paga' ? 'disabled' : ''}
                            onclick="marcarParcelaPaga(${p.id}, ${idx})">
                            ${parc.status === 'Paga' ? '✓ Paga' : 'Marcar Paga'}
                        </button>
                    </td>
                </tr>
                `).join('')}
            </tbody>
        </table>
    </div>` : '';

    return `
    <div class="proposta">
        <div class="proposta-topo">
            <div>
                <div class="proposta-nome">${p.nome}</div>
                <div class="proposta-info">Código: ${p.codigo_unico || '---'} | CPF: ${cpf}</div>
                <div class="proposta-info">Pix: ${pixStatus}</div>
                ${dataPagamento}
            </div>
            <div>
                <span class="status ${statusCls}">${statusTxt}</span>
                ${parcelas > 0 && p.status !== 'Nova' ? `<button class="btn btn-ver-parcelas" onclick="document.getElementById('parc-${p.id}').classList.toggle('visivel')">📊 Ver Parcelas</button>` : ''}
            </div>
        </div>

        <div class="grade">
            <div class="campo">
                <label>Valor Total (R$)</label>
                <input type="number" id="v-${p.id}" value="${valorTotal}" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (%)</label>
                <input type="number" id="p-${p.id}" value="${percEnt}" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (R$)</label>
                <input type="text" id="e-${p.id}" value="${real(valorEnt)}" readonly>
            </div>
            <div class="campo">
                <label>Parcelas (1-48)</label>
                <input type="number" id="par-${p.id}" value="${parcelas}" min="1" max="48" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Juros % ao mês</label>
                <input type="number" id="j-${p.id}" value="${juros}" step="0.01" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Valor Parcela (R$)</label>
                <input type="text" id="vp-${p.id}" value="${real(calc.valorParcela)}" readonly>
            </div>
        </div>

        ${tabelaParcelas}

        <div class="botoes">
            <button class="btn btn-aprovar" id="btn-aprovar-${p.id}" onclick="aprovar(${p.id})">✅ Aprovar + Gerar Pix</button>
            <button class="btn btn-pagar-manual" onclick="marcarEntradaPaga(${p.id})" ${p.status==='Entrada Paga'?'disabled':''}>💰 Marcar Entrada Paga</button>
            <button class="btn btn-reprovar" onclick="reprovar(${p.id})">❌ Reprovar</button>
            <button class="btn btn-whatsapp" onclick="enviarWhatsApp(${p.id})">📱 WhatsApp</button>
            <button class="btn btn-excluir" onclick="excluir(${p.id})">🗑️ Excluir</button>
        </div>
    </div>`;
}

function atualizar(id) {
    const valor = Number(document.getElementById(`v-${id}`).value) || 0;
    const perc = Number(document.getElementById(`p-${id}`).value) || 0;
    const parcelas = Number(document.getElementById(`par-${id}`).value) || 0;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;
    const calc = calcularParcelas(valor, perc, parcelas, juros);
    document.getElementById(`e-${id}`).value = real(calc.entrada);
    document.getElementById(`vp-${id}`).value = real(calc.valorParcela);
}

async function aprovar(id) {
    if (processando) { alert('⏳ Aguarde...'); return; }
    const proposta = propostas.find(p => p.id === id);
    if (!proposta) return;

    const valor = Number(document.getElementById(`v-${id}`).value) || 0;
    const perc = Number(document.getElementById(`p-${id}`).value) || 0;
    const entrada = valor * perc / 100;
    const parcelas = Number(document.getElementById(`par-${id}`).value) || 1;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;
    const calc = calcularParcelas(valor, perc, parcelas, juros);
    const codigoUnicoFinal = proposta.codigo_unico ? proposta.codigo_unico : gerarCodigoUnico();

    if (!confirm(`✅ Aprovar ${proposta.nome}?\nValor: ${real(valor)}\nEntrada: ${real(entrada)}\nParcelas: ${parcelas}x de ${real(calc.valorParcela)}\nCódigo: ${codigoUnicoFinal}`)) return;

    processando = true;
    const btn = document.getElementById(`btn-aprovar-${id}`);
    if (btn) btn.disabled = true;

    let chavePixGerada = CHAVE_PIX_FIXA;
    let qrCodeImagem = null;
    let mensagem = '';

    if (modo === 'producao') {
        try {
            const urlAlvo = encodeURIComponent('https://api.mercadopago.com/v1/payments');
            const resposta = await fetch(`https://corsproxy.io/?${urlAlvo}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${TOKEN_MP_PRODUCAO}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    transaction_amount: entrada,
                    description: `Entrada - ${proposta.nome} - ${codigoUnicoFinal}`,
                    payment_method_id: 'pix',
                    payer: { email: 'pagamento@flashcred.com.br' }
                })
            });

            const dados = await resposta.json();
            if (dados.point_of_interaction?.transaction_data) {
                chavePixGerada = dados.point_of_interaction.transaction_data.qr_code;
                qrCodeImagem = dados.point_of_interaction.transaction_data.qr_code_base64 || null;
                mensagem = '✅ PIX GERADO PELO MERCADO PAGO!';
            } else {
                mensagem = '⚠️ MP não retornou → Usando chave fixa.';
            }
        } catch {
            mensagem = '⚠️ Sem conexão MP → Usando chave fixa.';
        }
    } else {
        mensagem = 'ℹ️ Usando chave Pix fixa.';
    }

    const { error } = await supabase.from('propostas').update({
        status: 'Aprovada',
        codigo_unico: codigoUnicoFinal,
        valor_desejado: valor,
        percentual_entrada: perc,
        valor_entrada: entrada,
        quantidade_parcelas: parcelas,
        juros: juros,
        lista_parcelas: calc.lista,
        copia_cola_pix: chavePixGerada,
        qr_code_entrada: qrCodeImagem
    }).eq('id', id);

    processando = false;
    if (btn) btn.disabled = false;
    alert(error ? '❌ Erro: ' + error.message : `✅ APROVADA!\n\n${mensagem}`);
    carregar();
}

async function marcarEntradaPaga(id) {
    const proposta = propostas.find(p => p.id === id);
    if (!proposta) return;

    const valor = Number(document.getElementById(`v-${id}`).value) || 0;
    const perc = Number(document.getElementById(`p-${id}`).value) || 0;
    const parcelas = Number(document.getElementById(`par-${id}`).value) || 1;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;
    const calc = calcularParcelas(valor, perc, parcelas, juros);
    const codigoUnicoFinal = proposta.codigo_unico ? proposta.codigo_unico : gerarCodigoUnico();
    const dataHoje = new Date().toISOString();

    if (!confirm(`💰 MARCAR ENTRADA PAGA para ${proposta.nome}?\n\n→ Data de hoje registrada automaticamente.\n→ Parcelas geradas: ${parcelas}x\n→ Cliente NÃO verá mais tela de pagamento.\n→ Vai ver DIRETO: CONTRATO + PARCELAS + VENCIMENTOS.`)) return;

    const { error } = await supabase.from('propostas').update({
        status: 'Entrada Paga',
        entrada_paga: true,
        codigo_unico: codigoUnicoFinal,
        valor_desejado: valor,
        percentual_entrada: perc,
        valor_entrada: calc.entrada,
        quantidade_parcelas: parcelas,
        juros: juros,
        lista_parcelas: calc.lista,
        data_pagamento_entrada: dataHoje,
        copia_cola_pix: 'ENTRADA PAGA - Pagamento em Dinheiro/Transferência',
        qr_code_entrada: null
    }).eq('id', id);

    if (error) {
        alert('❌ Erro: ' + error.message);
    } else {
        alert(`✅ ENTRADA MARCADA COMO PAGA!\n\n📅 Data registrada: ${formatarData(dataHoje)}\n\nCliente digita o CPF e verá DIRETO:\n✅ Contrato\n✅ ${parcelas} parcelas com vencimentos\n✅ Valores\n✅ Opção de pagar cada parcela`);
        carregar();
    }
}

async function marcarParcelaPaga(propostaId, indiceParcela) {
    const proposta = propostas.find(p => p.id === propostaId);
    if (!proposta) return;

    const lista = proposta.lista_parcelas || [];
    if (!lista[indiceParcela] || lista[indiceParcela].status === 'Paga') return;

    if (!confirm(`✅ Marcar parcela ${indiceParcela + 1} como PAGA?\nValor: ${real(lista[indiceParcela].valor)}`)) return;

    lista[indiceParcela].status = 'Paga';
    lista[indiceParcela].data_pagamento = new Date().toISOString();

    const { error } = await supabase.from('propostas').update({ lista_parcelas: lista }).eq('id', propostaId);

    if (error) {
        alert('❌ Erro: ' + error.message);
    } else {
        alert('✅ Parcela marcada como PAGA!');
        carregar();
    }
}

async function reprovar(id) {
    if (!confirm('Reprovar?')) return;
    const { error } = await supabase.from('propostas').update({ status: 'Reprovada' }).eq('id', id);
    alert(error ? 'Erro: ' + error.message : '✅ Reprovada!');
    carregar();
}

async function enviarWhatsApp(id) {
    const p = propostas.find(x => x.id === id);
    if (!p) return;
    const link = `${window.location.origin.replace('painel.', '')}/consultar.html?cpf=${(p.cpf || '').replace(/\D/g, '')}`;
    const msg = `Olá ${p.nome}! ✅ Sua proposta foi APROVADA!\n\nValor: R$ ${real(p.valor_desejado || 0)}\nEntrada: R$ ${real(p.valor_entrada || 0)}\n\nAcesse abaixo para ver o Pix, QR Code e assinar o contrato:\n${link}\n\nObrigado! 📋`;
    window.open(`https://wa.me/55${p.telefone?.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
}

async function excluir(id) {
    if (!confirm('⚠️ Tem certeza?')) return;
    const { error } = await supabase.from('propostas').delete().eq('id', id);
    alert(error ? 'Erro: ' + error.message : '✅ Excluída!');
    carregar();
}
</script>
