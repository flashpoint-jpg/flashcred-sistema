<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix-green: '#32BCAD',
                        bg-body: '#F8FAFC',
                        text-main: '#1E293B',
                        text-muted: '#64748B',
                        border-color: '#E2E8F0',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        modo_teste: '#F59E0B',
                        modo_manual: '#3B82F6',
                        modo_producao: '#10B981'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg-body); min-height: 100vh; }

        /* 🔒 TELA DE LOGIN - COR AZUL ORIGINAL */
        .area-login { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
            background: linear-gradient(135deg, #0A2463 0%, #051236 100%);
        }
        .card-login {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
        }

        .card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 16px; }
        .btn { padding: 10px 14px; border-radius: 10px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-sucesso { background: var(--sucesso); color: white; }
        .btn-alerta { background: var(--alerta); color: white; }
        .btn-perigo { background: var(--perigo); color: white; }
        .btn-limpar { background: #94A3B8; color: white; }
        .btn-modo { padding: 8px 16px; border-radius: 8px; font-weight: 600; border: 2px solid transparent; }
        .btn-modo.ativo { border-color: #1E293B; box-shadow: 0 0 8px rgba(0,0,0,0.15); }
        .btn-modo.teste { background: var(--modo_teste); color: white; }
        .btn-modo.manual { background: var(--modo_manual); color: white; }
        .btn-modo.producao { background: var(--modo_producao); color: white; }
        .input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; }
        .label { font-weight: 500; margin-bottom: 6px; display: block; color: var(--text-main); }
        .hidden { display: none !important; }
        .cliente-nome { font-weight: 700; color: var(--primary); font-size: 18px; margin-bottom: 8px; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; display: inline-block; margin-bottom: 8px; }
        .badge-nova { background: #DBEAFE; color: #1E40AF; }
        .badge-aprovada { background: #D1FAE5; color: #065F46; }
        .badge-reprovada { background: #FEE2E2; color: #DC2626; }
        .badge-paga { background: #D1FAE5; color: #065F46; }
        .badge-pendente { background: #FEF3C7; color: #92400E; }
        .linha-dado { padding: 6px 0; font-size: 14px; border-bottom: 1px solid #F1F5F9; }
        .linha-dado strong { color: var(--text-main); min-width: 160px; display: inline-block; }
        .dados-vencimento { margin-top: 10px; padding: 10px; background: #F8FAFC; border-radius: 8px; }
        .modo-topo { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        
        /* ⚙️ ÁREA DE CONFIGURAÇÕES PIX E TOKEN */
        .config-pagamento { 
            background: #ECFDF5; 
            border: 1px solid #A7F3D0; 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 20px; 
        }
        .resumo-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .card-resumo { text-align: center; padding: 16px; }
        .valor-resumo { font-size: 24px; font-weight: 700; margin: 8px 0; }
        .botoes-acao { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .notificacao { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; color: white; font-weight: 500; z-index: 9999; transform: translateX(120%); transition: 0.3s; }
        .notificacao.mostrar { transform: translateX(0); }
        .notificacao.sucesso { background: var(--sucesso); }
        .notificacao.erro { background: var(--perigo); }
        .item-parcela { padding: 8px; border-radius: 6px; margin: 4px 0; font-size: 13px; }
        .item-parcela.paga { background: #D1FAE5; border-left: 3px solid #10B981; }
        .item-parcela.pendente { background: #FFFBEB; border-left: 3px solid #F59E0B; }
        .item-parcela.atrasada { background: #FEE2E2; border-left: 3px solid #EF4444; }
        .erro-login { color: #EF4444; font-size: 14px; margin: 8px 0; text-align: center; display: none; }
    </style>
</head>
<body>

<!-- 🔒 TELA DE LOGIN CORRIGIDA -->
<div id="telaLogin" class="area-login">
    <div class="card-login">
        <h2 class="text-xl font-bold text-center text-primary mb-6">🔐 Acesso Administrativo</h2>
        <label class="label">Senha de Acesso</label>
        <input type="password" id="senhaAdmin" class="input" placeholder="Digite sua senha" onkeydown="if(event.key === 'Enter') fazerLogin()">
        <div id="erroLogin" class="erro-login">Senha incorreta! Tente novamente.</div>
        <button class="btn btn-primary w-full mt-2" onclick="fazerLogin()">Entrar no Sistema</button>
        <p class="text-xs text-center text-gray-500 mt-4">Senha padrão: flashcred2026</p>
    </div>
</div>

<!-- 📊 PAINEL PRINCIPAL -->
<div id="painel" class="p-4 max-w-5xl mx-auto hidden">
    <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
        <div>
            <h1 class="text-2xl font-bold text-primary">📋 Propostas e Pagamentos</h1>
        </div>
        <div class="flex gap-2">
            <button class="btn btn-alerta" onclick="alterarSenha()">🔑 Alterar Senha</button>
            <button class="btn btn-perigo" onclick="sair()">🚪 Sair</button>
        </div>
    </div>

    <!-- MODOS DE OPERAÇÃO -->
    <div class="modo-topo">
        <button class="btn-modo teste" id="btnModoTeste" onclick="definirModo('teste')">Teste</button>
        <button class="btn-modo manual" id="btnModoManual" onclick="definirModo('manual')">Manual</button>
        <button class="btn-modo producao" id="btnModoProducao" onclick="definirModo('producao')">Produção</button>
    </div>

    <!-- ⚙️ ÁREA PARA INSERIR E SALVAR CHAVE PIX E TOKEN -->
    <div id="configPagamento" class="config-pagamento">
        <h3 class="text-lg font-semibold text-sucesso mb-3">⚙️ Configurações de Pagamento</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
            <div>
                <label class="label">Chave Pix de Recebimento</label>
                <input type="text" id="chavePixGlobal" class="input" placeholder="Sua chave Pix (CPF, telefone, e-mail ou aleatória)">
            </div>
            <div>
                <label class="label">Token da API de Pagamento</label>
                <input type="text" id="tokenPagamento" class="input" placeholder="Token do Mercado Pago / API Pix">
            </div>
        </div>
        <button class="btn btn-sucesso" onclick="salvarConfiguracoes()">💾 Salvar Configurações</button>
        <p id="msgSalvo" class="text-xs text-sucesso mt-2 hidden">✅ Configurações salvas com sucesso!</p>
    </div>

    <!-- RESUMO GERAL -->
    <div class="resumo-cards">
        <div class="card card-resumo">
            <p class="text-muted">Total de Propostas</p>
            <p class="valor-resumo text-primary" id="totalPropostas">0</p>
        </div>
        <div class="card card-resumo">
            <p class="text-muted">Valor Recebido</p>
            <p class="valor-resumo text-sucesso" id="valorRecebido">R$ 0,00</p>
        </div>
        <div class="card card-resumo">
            <p class="text-muted">A Receber</p>
            <p class="valor-resumo text-alerta" id="valorAReceber">R$ 0,00</p>
        </div>
    </div>

    <!-- LISTA DE PROPOSTAS -->
    <div id="listaPropostas"></div>

</div>

<!-- 📢 NOTIFICAÇÃO -->
<div id="notificacao" class="notificacao"></div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔐 DADOS DE ACESSO
const SENHA_PADRAO = 'flashcred2026';
let senhaAdmin = localStorage.getItem('senhaAdmin') || SENHA_PADRAO;
let modoSistema = localStorage.getItem('modoSistema') || 'manual';

// ✅ CARREGAR CONFIGURAÇÕES SALVAS AO ABRIR
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('chavePixGlobal').value = localStorage.getItem('chavePixGlobal') || '';
    document.getElementById('tokenPagamento').value = localStorage.getItem('tokenPagamento') || '';
    definirModo(modoSistema);
    verificarAcesso();
});

// 🔒 LOGIN
function verificarAcesso() {
    if(localStorage.getItem('logado') === 'sim') {
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('painel').classList.remove('hidden');
        carregarPropostas();
    }
}

function fazerLogin() {
    const senhaDigitada = document.getElementById('senhaAdmin').value.trim();
    if(senhaDigitada === senhaAdmin) {
        localStorage.setItem('logado', 'sim');
        document.getElementById('erroLogin').style.display = 'none';
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('painel').classList.remove('hidden');
        carregarPropostas();
    } else {
        document.getElementById('erroLogin').style.display = 'block';
    }
}

function alterarSenha() {
    const novaSenha = prompt('Digite a nova senha de acesso:');
    if(novaSenha && novaSenha.length >= 4) {
        senhaAdmin = novaSenha;
        localStorage.setItem('senhaAdmin', senhaAdmin);
        alert('✅ Senha alterada com sucesso!');
    }
}

function sair() {
    localStorage.removeItem('logado');
    document.getElementById('painel').classList.add('hidden');
    document.getElementById('telaLogin').classList.remove('hidden');
    document.getElementById('senhaAdmin').value = '';
}

// 🛠️ MODO DO SISTEMA
function definirModo(modo) {
    modoSistema = modo;
    localStorage.setItem('modoSistema', modo);
    document.querySelectorAll('.btn-modo').forEach(b => b.classList.remove('ativo'));
    document.getElementById(`btnModo${modo.charAt(0).toUpperCase() + modo.slice(1)}`).classList.add('ativo');
}

// 💾 SALVAR CHAVE PIX E TOKEN
function salvarConfiguracoes() {
    const chave = document.getElementById('chavePixGlobal').value.trim();
    const token = document.getElementById('tokenPagamento').value.trim();
    
    localStorage.setItem('chavePixGlobal', chave);
    localStorage.setItem('tokenPagamento', token);
    
    const msg = document.getElementById('msgSalvo');
    msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 3000);
    
    notificar('Configurações de pagamento salvas!', 'sucesso');
}

// 📋 CARREGAR PROPOSTAS E DEMAIS FUNÇÕES...
async function carregarPropostas() {
    const { data, error } = await supabase.from('propostas').select('*').order('created_at', { ascending: false });
    if(error) return console.error(error);
    
    // Atualiza contadores e lista
    document.getElementById('totalPropostas').textContent = data.length;
    document.getElementById('listaPropostas').innerHTML = data.map(p => `
        <div class="card">
            <div class="cliente-nome">${p.nome || 'Sem nome'}</div>
            <span class="badge ${p.status === 'Nova' ? 'badge-nova' : p.status === 'Aprovada' ? 'badge-aprovada' : 'badge-reprovada'}">${p.status || 'Nova'}</span>
            <div class="linha-dado"><strong>CPF:</strong> ${p.cpf || '-'}</div>
            <div class="linha-dado"><strong>WhatsApp:</strong> ${p.whatsapp || '-'}</div>
            <div class="linha-dado"><strong>Endereço/CEP:</strong> ${p.endereco || '-'} - ${p.cep || '-'}</div>
            <div class="linha-dado"><strong>Valor Total:</strong> R$ ${parseFloat(p.valor_aprovado||0).toFixed(2).replace('.',',')}</div>
            <div class="linha-dado"><strong>Entrada:</strong> R$ ${parseFloat(p.valor_entrada||0).toFixed(2).replace('.',',')}</div>
            <div class="linha-dado"><strong>Parcelas:</strong> ${p.qtd_parcelas_escolhida || 0}x de R$ ${parseFloat(p.valor_parcela||0).toFixed(2).replace('.',',')}</div>
            
            <div class="botoes-acao">
                ${p.status === 'Nova' ? `
                    <button class="btn btn-sucesso" onclick="mudarStatus('${p.cpf}', 'Aprovada')">✅ Aprovar</button>
                    <button class="btn btn-perigo" onclick="mudarStatus('${p.cpf}', 'Reprovada')">❌ Reprovar</button>
                ` : ''}
                <button class="btn btn-alerta" onclick="enviarWhatsApp('${p.whatsapp}')">📱 Enviar no WhatsApp</button>
            </div>
        </div>
    `).join('');
}

async function mudarStatus(cpf, status) {
    const chaveSalva = localStorage.getItem('chavePixGlobal') || '';
    const { error } = await supabase.from('propostas').update({ 
        status: status, 
        chave_pix: chaveSalva 
    }).eq('cpf', cpf);
    
    if(error) return notificar('Erro ao alterar status', 'erro');
    notificar(`Proposta ${status.toLowerCase()} com sucesso!`, 'sucesso');
    carregarPropostas();
}

function enviarWhatsApp(numero) {
    if(!numero) return alert('Sem número de WhatsApp cadastrado.');
    window.open(`https://wa.me/${numero.replace(/\D/g,'')}`, '_blank');
}

function notificar(texto, tipo = 'sucesso') {
    const n = document.getElementById('notificacao');
    n.textContent = texto;
    n.className = `notificacao ${tipo} mostrar`;
    setTimeout(() => n.classList.remove('mostrar'), 3500);
}

// 🔄 ATUALIZAÇÃO AUTOMÁTICA
setInterval(carregarPropostas, 15000);
</script>
</body>
</html>
