<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
            --azul: #3B82F6;
            --roxo: #8B5CF6;
            --whats: #25D366;
            --bg-body: #F8FAFC;
            --borda: #E2E8F0;
            --texto: #334155;
            --texto-claro: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); padding: 16px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        .cartao { background: white; border-radius: 12px; border: 1px solid var(--borda); padding: 18px; margin-bottom: 18px; }
        .linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
        .etiqueta { font-weight: 600; color: var(--texto-claro); min-width: 140px; font-size: 14px; }
        .valor { font-weight: 700; font-size: 15px; }
        .botao { padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .botao:hover { transform: translateY(-1px); }
        .botao-sucesso { background: var(--sucesso); color: white; }
        .botao-perigo { background: var(--perigo); color: white; }
        .botao-azul { background: var(--azul); color: white; }
        .botao-whatsapp { background: var(--whats); color: white; }
        .botao-alerta { background: var(--alerta); color: #1F2937; }
        .botao-cinza { background: #94A3B8; color: white; }
        .botao-pequeno { padding: 8px 12px; font-size: 13px; }
        .status { display: inline-block; padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; }
        .status-nova { background: #FEF3C7; color: #92400E; }
        .status-aprovada { background: #D1FAE5; color: #065F46; }
        .status-reprovada { background: #FEE2E2; color: #991B1B; }
        .status-paga { background: #E0E7FF; color: #3730A3; }
        .barra-superior { display: flex; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .area-senha { max-width: 420px; margin: 80px auto; text-align: center; }
        input { padding: 10px 12px; border: 1px solid var(--borda); border-radius: 6px; font-size: 15px; }
        .oculto { display: none !important; }
        .separador { border-bottom: 1px solid var(--borda); margin: 16px 0; }
        .destaque { background: #F0FDF4; padding: 10px 14px; border-radius: 8px; border-left: 4px solid #10B981; font-size: 15px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
        .modal-conteudo { background: white; border-radius: 12px; padding: 24px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .form-linha { margin-bottom: 14px; }
        .form-linha label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        .form-linha input { width: 100%; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .whatsapp-link { color: #25D366; font-weight: bold; text-decoration: none; }
        .debug-info { background: #F0F0F0; padding: 6px; font-size: 11px; color: #666; border-radius: 4px; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div id="telaLogin" class="area-senha">
        <h1 style="font-size: 24px; margin-bottom: 24px;">🔐 Painel Administrativo FlashCred</h1>
        <input type="password" id="senha" placeholder="Digite a senha" style="width: 100%; margin-bottom: 14px; padding: 14px; font-size: 16px;" onkeydown="if(event.key==='Enter')entrar()">
        <button onclick="entrar()" class="botao botao-primario" style="width: 100%; padding: 14px;">Entrar</button>
    </div>

    <div id="telaPrincipal" class="oculto">
        <div class="barra-superior">
            <h1 class="titulo-secao">📋 Propostas Recebidas</h1>
            <div style="display:flex; gap:8px;">
                <button onclick="filtrar('todas')" class="botao botao-cinza botao-pequeno">Todas</button>
                <button onclick="filtrar('Nova')" class="botao botao-alerta botao-pequeno">Novas</button>
                <button onclick="filtrar('Aprovada')" class="botao botao-sucesso botao-pequeno">Aprovadas</button>
                <button onclick="sair()" class="botao botao-perigo botao-pequeno">Sair</button>
            </div>
        </div>
        <div id="listaPropostas"></div>
    </div>
</div>

<div id="modalEditar" class="modal oculto" onclick="fecharModal(event)">
    <div class="modal-conteudo" onclick="event.stopPropagation()">
        <h3 class="titulo-secao">✏️ Editar Proposta</h3>
        <div id="formEditar"></div>
        <div style="display:flex; gap:10px; margin-top:20px; justify-content:flex-end;">
            <button onclick="fecharModal()" class="botao botao-cinza">Cancelar</button>
            <button onclick="salvarEdicao()" class="botao botao-sucesso">💾 Salvar</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

const SENHA = 'flash2026';
const LINK_CONSULTA = window.location.href.replace('painel.html','consulta.html');

let propostas = [];
let filtroAtual = 'todas';
let propostaEditando = null;

function entrar() {
    if(document.getElementById('senha').value === SENHA) {
        localStorage.setItem('logadoFlashCred', 'SIM');
        document.getElementById('telaLogin').classList.add('oculto');
        document.getElementById('telaPrincipal').classList.remove('oculto');
        carregarPropostas();
        ativarRealtime();
    } else alert('❌ Senha incorreta!');
}

window.onload = () => {
    if(localStorage.getItem('logadoFlashCred') === 'SIM') {
        document.getElementById('telaLogin').classList.add('oculto');
        document.getElementById('telaPrincipal').classList.remove('oculto');
        carregarPropostas();
        ativarRealtime();
    }
};

function sair() {
    localStorage.removeItem('logadoFlashCred');
    location.reload();
}

async function carregarPropostas() {
    try {
        const {data, error} = await supabase.from('propostas').select('*').order('created_at', {ascending:false});
        if(error) throw error;
        propostas = data || [];
        renderizarPropostas();
    } catch(e) {
        console.error('Erro:', e);
        alert('❌ Erro ao carregar: ' + e.message);
    }
}

function ativarRealtime() {
    supabase.channel('propostas').on('postgres_changes', {event:'*', schema:'public', table:'propostas'}, () => carregarPropostas()).subscribe();
}

function filtrar(f) {
    filtroAtual = f;
    renderizarPropostas();
}

// ✅ FUNÇÃO CORRIGIDA: LÊ WHATSAPP DE QUALQUER NOME DE COLUNA
function pegarWhatsapp(proposta) {
    // Tenta TODOS os nomes possíveis de coluna
    return proposta.whatsapp || proposta.telefone || proposta.celular || proposta.contato || '';
}

async function aprovarProposta(id) {
    const valorEnt = prompt('Valor da Entrada (R$):');
    if(!valorEnt) return;
    const qtd = prompt('Quantidade de parcelas:');
    if(!qtd) return;
    const dias = prompt('Dias para entrega:', '7');
    if(dias === null) return;

    const { error } = await supabase.from('propostas').update({
        status: 'Aprovada',
        valor_entrada: parseFloat(valorEnt.replace(',','.')),
        quantidade_parcelas: parseInt(qtd),
        dias_entrega: parseInt(dias||'7')
    }).eq('id', id);

    if(error) { alert('❌ Erro: ' + error.message); return; }

    const p = propostas.find(x=>x.id===id);
    const whats = pegarWhatsapp(p).replace(/\D/g,'');
    
    // ✅ BOTÃO ENVIAR WHATSAPP JÁ NA APROVAÇÃO!
    if(whats && confirm(`✅ APROVADA!\n📱 Enviar mensagem pelo WhatsApp?`)) {
        enviarWhatsApp(p);
    }
    alert('✅ APROVADA!');
}

async function reprovarProposta(id) {
    if(!confirm('❌ Reprovar?')) return;
    const { error } = await supabase.from('propostas').update({status:'Reprovada'}).eq('id', id);
    if(error) alert('❌ Erro: ' + error.message);
}

async function excluirProposta(id) {
    if(!confirm('⚠️ Excluir?')) return;
    const { error } = await supabase.from('propostas').delete().eq('id', id);
    if(error) alert('❌ Erro: ' + error.message);
}

function abrirEditar(id) {
    propostaEditando = propostas.find(x=>x.id===id);
    if(!propostaEditando) return;

    const valor = Number(propostaEditando.valor_desejado||0);
    const juros = Number(propostaEditando.juros_mensal||5);
    const total = valor * (1 + juros/100);
    const entrada = Number(propostaEditando.valor_entrada||0);

    document.getElementById('formEditar').innerHTML = `
        <div class="form-linha"><label>Nome</label><input type="text" id="edt_nome" value="${propostaEditando.nome||''}"></div>
        <div class="form-linha"><label>CPF</label><input type="text" id="edt_cpf" value="${propostaEditando.cpf||''}"></div>
        <div class="form-linha"><label>📱 WhatsApp</label><input type="text" id="edt_whatsapp" value="${pegarWhatsapp(propostaEditando)}"></div>
        <div class="form-linha"><label>Endereço</label><input type="text" id="edt_endereco" value="${propostaEditando.endereco||''}"></div>
        <div class="grid-2">
            <div class="form-linha"><label>Valor Solicitado</label><input type="number" step="0.01" id="edt_valor" value="${valor}" oninput="atualizarCalc()"></div>
            <div class="form-linha"><label>Juros % ao mês</label><input type="number" step="0.1" id="edt_juros" value="${juros}" oninput="atualizarCalc()"></div>
        </div>
        <div class="destaque" id="resumoCalc">💰 Valor Total: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
        <div class="grid-2">
            <div class="form-linha"><label>Valor da Entrada</label><input type="number" step="0.01" id="edt_entrada" value="${entrada}"></div>
            <div class="form-linha"><label>Quantidade de Parcelas</label><input type="number" id="edt_qtd" value="${propostaEditando.quantidade_parcelas||0}"></div>
        </div>
        <div class="form-linha"><label>Dias para Entrega</label><input type="number" id="edt_dias" value="${propostaEditando.dias_entrega||7}"></div>
    `;
    document.getElementById('modalEditar').classList.remove('oculto');
}

function atualizarCalc() {
    const v = parseFloat(document.getElementById('edt_valor').value) || 0;
    const j = parseFloat(document.getElementById('edt_juros').value) || 5;
    const total = v * (1 + j/100);
    document.getElementById('resumoCalc').innerHTML = `💰 Valor Total com Juros: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
}

async function salvarEdicao() {
    if(!propostaEditando) return;
    const { error } = await supabase.from('propostas').update({
        nome: document.getElementById('edt_nome').value,
        cpf: document.getElementById('edt_cpf').value,
        whatsapp: document.getElementById('edt_whatsapp').value,
        endereco: document.getElementById('edt_endereco').value,
        valor_desejado: parseFloat(document.getElementById('edt_valor').value),
        juros_mensal: parseFloat(document.getElementById('edt_juros').value),
        valor_entrada: parseFloat(document.getElementById('edt_entrada').value),
        quantidade_parcelas: parseInt(document.getElementById('edt_qtd').value),
        dias_entrega: parseInt(document.getElementById('edt_dias').value)
    }).eq('id', propostaEditando.id);

    if(error) alert('❌ Erro: ' + error.message);
    else { alert('✅ SALVO!'); fecharModal(); }
}

function fecharModal() {
    document.getElementById('modalEditar').classList.add('oculto');
    propostaEditando = null;
}

function enviarWhatsApp(p) {
    const whats = pegarWhatsapp(p).replace(/\D/g,'');
    if(!whats) { alert('⚠️ WhatsApp não informado!'); return; }

    const valor = Number(p.valor_desejado||0);
    const juros = Number(p.juros_mensal||5)/100;
    const total = valor * (1 + juros);
    const cpfLimpo = (p.cpf||'').replace(/\D/g,'');

    const texto = encodeURIComponent(
        `Olá ${p.nome||'Cliente'}! ✅ Sua proposta foi APROVADA!\n\n💰 Valor: ${valor.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}\n💵 Total com Juros: ${total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}\n\n🔗 Acesse com seu CPF: ${LINK_CONSULTA}?cpf=${cpfLimpo}`
    );
    window.open(`https://wa.me/55${whats}?text=${texto}`, '_blank');
}

function renderizarPropostas() {
    let filtradas = [...propostas];
    if(filtroAtual === 'Nova') filtradas = propostas.filter(p => !p.status || p.status === 'Nova');
    else if(filtroAtual === 'Aprovada') filtradas = propostas.filter(p => p.status === 'Aprovada');

    let html = '';
    filtradas.forEach(p => {
        const valor = Number(p.valor_desejado||0);
        const juros = Number(p.juros_mensal||5)/100;
        const total = valor * (1 + juros);
        const status = p.status || 'Nova';
        
        // ✅ PEGA WHATSAPP DE QUALQUER FORMA
        const whatsBruto = pegarWhatsapp(p);
        const whatsLimpo = whatsBruto.replace(/\D/g,'');

        let classeStatus = 'status-nova';
        if(status === 'Aprovada') classeStatus = 'status-aprovada';
        if(status === 'Reprovada') classeStatus = 'status-reprovada';

        html += `
        <div class="cartao">
            <div class="linha" style="justify-content:space-between;">
                <h3 style="font-size:17px; font-weight:bold; color:var(--primary);">👤 ${p.nome||'Sem nome'}</h3>
                <span class="status ${classeStatus}">${status}</span>
            </div>
            <div class="linha"><span class="etiqueta">CPF:</span><span class="valor">${(p.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</span></div>
            
            <!-- ✅ WHATSAPP APARECE AGORA! -->
            <div class="linha">
                <span class="etiqueta">📱 WhatsApp:</span>
                <span class="valor">
                    ${whatsLimpo 
                        ? `<a href="https://wa.me/55${whatsLimpo}" target="_blank" class="whatsapp-link">📲 ${whatsBruto}</a>` 
                        : '<span style="color:red;">⚠️ NÃO INFORMADO</span>'}
                </span>
            </div>
            
            <div class="linha"><span class="etiqueta">Valor Solicitado:</span><span class="valor">${valor.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</span></div>
            <div class="linha destaque"><span class="etiqueta">💰 TOTAL COM JUROS:</span><span class="valor">${total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</span></div>
            <div class="linha"><span class="etiqueta">Entrada:</span><span class="valor">R$ ${Number(p.valor_entrada||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>
            <span class="etiqueta" style="margin-left:16px;">Parcelas:</span><span class="valor">${p.quantidade_parcelas||0}x</span></div>
            
            <div class="separador"></div>
            <div class="linha" style="flex-wrap:wrap;">
                ${status === 'Nova' ? `
                <button onclick="aprovarProposta(${p.id})" class="botao botao-sucesso botao-pequeno">✅ Aprovar</button>
                <button onclick="reprovarProposta(${p.id})" class="botao botao-perigo botao-pequeno">❌ Reprovar</button>
                ` : ''}
                ${status === 'Aprovada' && whatsLimpo ? `
                <button onclick="enviarWhatsApp(propostas.find(x=>x.id===${p.id}))" class="botao botao-whatsapp botao-pequeno">💬 Enviar WhatsApp</button>
                ` : ''}
                <button onclick="abrirEditar(${p.id})" class="botao botao-azul botao-pequeno">✏️ Editar</button>
                <button onclick="excluirProposta(${p.id})" class="botao botao-perigo botao-pequeno">🗑️ Excluir</button>
            </div>
        </div>`;
    });

    document.getElementById('listaPropostas').innerHTML = html || '<p style="text-align:center; padding:40px; color:var(--texto-claro);">Nenhuma proposta encontrada.</p>';
}
</script>
</body>
</html>
