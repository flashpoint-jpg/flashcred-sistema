<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix-green: '#32BCAD',
                        bg-body: '#F8FAFC',
                        text-main: '#1E293B',
                        text-muted: '#64748B',
                        border-color: '#E2E8F0',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        modo_teste: '#F59E0B',
                        modo_manual: '#3B82F6',
                        modo_producao: '#10B981'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg-body); min-height: 100vh; }
        .card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 16px; }
        .btn { padding: 10px 14px; border-radius: 10px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-sucesso { background: var(--sucesso); color: white; }
        .btn-alerta { background: var(--alerta); color: white; }
        .btn-perigo { background: var(--perigo); color: white; }
        .btn-limpar { background: #94A3B8; color: white; }
        .btn-modo { padding: 8px 16px; border-radius: 8px; font-weight: 600; border: 2px solid transparent; }
        .btn-modo.ativo { border-color: #1E293B; box-shadow: 0 0 8px rgba(0,0,0,0.15); }
        .btn-modo.teste { background: var(--modo_teste); color: white; }
        .btn-modo.manual { background: var(--modo_manual); color: white; }
        .btn-modo.producao { background: var(--modo_producao); color: white; }
        .input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; }
        .label { font-weight: 500; margin-bottom: 6px; display: block; color: var(--text-main); }
        .area-login { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .hidden { display: none !important; }
        .cliente-nome { font-weight: 700; color: var(--primary); font-size: 18px; margin-bottom: 8px; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; display: inline-block; margin-bottom: 8px; }
        .badge-nova { background: #DBEAFE; color: #1E40AF; }
        .badge-aprovada { background: #D1FAE5; color: #065F46; }
        .badge-reprovada { background: #FEE2E2; color: #DC2626; }
        .badge-paga { background: #D1FAE5; color: #065F46; }
        .badge-pendente { background: #FEF3C7; color: #92400E; }
        .linha-dado { padding: 6px 0; font-size: 14px; border-bottom: 1px solid #F1F5F9; }
        .linha-dado strong { color: var(--text-main); min-width: 160px; display: inline-block; }
        .dados-vencimento { margin-top: 10px; padding: 10px; background: #F8FAFC; border-radius: 8px; }
        .modo-topo { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 16px; }
        .config-producao { background: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .resumo-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .card-resumo { text-align: center; padding: 16px; }
        .valor-resumo { font-size: 24px; font-weight: 700; margin: 8px 0; }
        .botoes-acao { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .notificacao { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; color: white; font-weight: 500; z-index: 9999; transform: translateX(120%); transition: 0.3s; }
        .notificacao.mostrar { transform: translateX(0); }
        .notificacao.sucesso { background: var(--sucesso); }
        .notificacao.erro { background: var(--perigo); }
    </style>
</head>
<body>

<!-- 🔒 TELA DE LOGIN -->
<div id="telaLogin" class="area-login">
    <div class="card w-full max-w-md">
        <h2 class="text-xl font-bold text-center text-primary mb-6">🔐 Acesso Administrativo</h2>
        <label class="label">Senha de Acesso</label>
        <input type="password" id="senhaAdmin" class="input" placeholder="Digite sua senha" onkeydown="if(event.key === 'Enter') fazerLogin()">
        <div id="erroLogin" class="text-perigo text-sm mb-3 hidden text-center">Senha incorreta!</div>
        <button class="btn btn-primary w-full" onclick="fazerLogin()">Entrar no Sistema</button>
    </div>
</div>

<!-- 📊 PAINEL PRINCIPAL -->
<div id="painel" class="p-4 max-w-5xl mx-auto hidden">
    <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
        <div>
            <h1 class="text-2xl font-bold text-primary">📋 Propostas e Pagamentos</h1>
        </div>
        <div class="flex gap-2">
            <button class="btn btn-alerta" onclick="alterarSenha()">🔑 Alterar Senha</button>
            <button class="btn btn-perigo" onclick="sair()">🚪 Sair</button>
        </div>
    </div>

    <!-- MODOS DE OPERAÇÃO -->
    <div class="modo-topo">
        <button class="btn-modo teste" id="btnModoTeste" onclick="definirModo('teste')">Teste</button>
        <button class="btn-modo manual" id="btnModoManual" onclick="definirModo('manual')">Manual</button>
        <button class="btn-modo producao" id="btnModoProducao" onclick="definirModo('producao')">Produção</button>
    </div>

    <!-- ⚙️ CONFIGURAÇÕES DE PRODUÇÃO (SÓ APARECE NO MODO PRODUÇÃO) -->
    <div id="configProducao" class="config-producao hidden">
        <h3 class="text-lg font-semibold text-sucesso mb-3">⚙️ Configurações de Produção</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
            <div>
                <label class="label">Chave Pix Recebimento</label>
                <input type="text" id="chavePixGlobal" class="input" placeholder="Sua chave Pix">
            </div>
            <div>
                <label class="label">Token API Pagamento</label>
                <input type="text" id="tokenPagamento" class="input" placeholder="Token de Produção">
            </div>
        </div>
        <button class="btn btn-sucesso" onclick="salvarConfigsProducao()">💾 Salvar Configurações</button>
    </div>

    <!-- RESUMO GERAL -->
    <div class="resumo-cards">
        <div class="card-resumo">
            <button class="btn btn-limpar mb-3" onclick="limparResumos()">Limpar</button>
            <p class="text-text-muted">Total Recebido</p>
            <p class="valor-resumo text-sucesso" id="totalPago">R$ 0,00</p>
        </div>
        <div class="card-resumo">
            <p class="text-text-muted">A Receber</p>
            <p class="valor-resumo text-alerta" id="totalReceber">R$ 0,00</p>
        </div>
    </div>

    <!-- BUSCA -->
    <div class="card mb-4">
        <input type="text" id="buscaProposta" class="input" placeholder="Pesquisar por Nome, CPF..." oninput="filtrarPropostas()">
    </div>

    <!-- LISTA DE PROPOSTAS -->
    <div id="listaPropostas">
        <p class="text-center text-text-muted py-8">Carregando propostas...</p>
    </div>
</div>

<!-- NOTIFICAÇÃO -->
<div id="notificacao" class="notificacao"></div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let senhaCorreta = 'flashcred2026';
let listaPropostas = [];
let propostasFiltradas = [];
let modoAtual = localStorage.getItem('modo_sistema') || 'teste';

// 🔐 LOGIN
document.addEventListener('DOMContentLoaded', () => {
    if(sessionStorage.getItem('logado') === 'sim') {
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('painel').classList.remove('hidden');
        carregarConfigsProducao();
        carregarPropostas();
        iniciarTempoReal();
        atualizarBotoesModo();
    }
});

function fazerLogin() {
    const senha = document.getElementById('senhaAdmin').value.trim();
    if(senha === senhaCorreta) {
        sessionStorage.setItem('logado', 'sim');
        document.getElementById('erroLogin').classList.add('hidden');
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('painel').classList.remove('hidden');
        carregarConfigsProducao();
        carregarPropostas();
        iniciarTempoReal();
        atualizarBotoesModo();
    } else {
        document.getElementById('erroLogin').classList.remove('hidden');
        document.getElementById('senhaAdmin').value = '';
        document.getElementById('senhaAdmin').focus();
    }
}

function sair() {
    sessionStorage.removeItem('logado');
    document.getElementById('painel').classList.add('hidden');
    document.getElementById('telaLogin').classList.remove('hidden');
    document.getElementById('senhaAdmin').value = '';
}

function alterarSenha() {
    const atual = prompt('Digite a senha atual:');
    if(atual !== senhaCorreta) return alert('Senha atual incorreta!');
    const nova = prompt('Digite a nova senha (mínimo 4 caracteres):');
    if(!nova || nova.length < 4) return alert('Nova senha deve ter pelo menos 4 caracteres!');
    senhaCorreta = nova;
    mostrarNotificacao('✅ Senha alterada com sucesso!', 'sucesso');
}

// ⚙️ MODOS E CONFIGURAÇÕES
function definirModo(modo) {
    modoAtual = modo;
    localStorage.setItem('modo_sistema', modo);
    atualizarBotoesModo();
    mostrarNotificacao(`Modo alterado para: ${modo.toUpperCase()}`, 'sucesso');
}

function atualizarBotoesModo() {
    document.querySelectorAll('.btn-modo').forEach(b => b.classList.remove('ativo'));
    document.getElementById(`btnModo${modoAtual.charAt(0).toUpperCase() + modoAtual.slice(1)}`).classList.add('ativo');
    document.getElementById('configProducao').classList.toggle('hidden', modoAtual !== 'producao');
}

function carregarConfigsProducao() {
    document.getElementById('chavePixGlobal').value = localStorage.getItem('chave_pix_global') || '';
    document.getElementById('tokenPagamento').value = localStorage.getItem('token_pagamento') || '';
}

function salvarConfigsProducao() {
    localStorage.setItem('chave_pix_global', document.getElementById('chavePixGlobal').value.trim());
    localStorage.setItem('token_pagamento', document.getElementById('tokenPagamento').value.trim());
    mostrarNotificacao('✅ Configurações salvas com sucesso!', 'sucesso');
}

function limparResumos() {
    document.getElementById('totalPago').textContent = 'R$ 0,00';
    document.getElementById('totalReceber').textContent = 'R$ 0,00';
    mostrarNotificacao('Resumos limpos', 'sucesso');
}

// 📦 FUNÇÕES GERAIS
function limparCpf(cpf) { return String(cpf || '').replace(/\D/g, ''); }
function formatarCpf(cpf) {
    const num = limparCpf(cpf);
    if(num.length === 11) return num.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    return cpf || '';
}

async function carregarPropostas() {
    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .order('created_at', {ascending: false});

    if(error) return mostrarNotificacao('Erro ao carregar: ' + error.message, 'erro');
    
    listaPropostas = data || [];
    propostasFiltradas = [...listaPropostas];
    atualizarResumo();
    renderizarLista();
}

function atualizarResumo() {
    let totalPago = 0, totalReceber = 0;
    listaPropostas.forEach(p => {
        if(p.status === 'Aprovada') {
            if(p.pago) totalPago += parseFloat(p.valor_entrada || 0);
            totalReceber += parseFloat(p.valor_aprovado || 0) - (p.pago ? parseFloat(p.valor_entrada || 0) : 0);
        }
    });
    document.getElementById('totalPago').textContent = `R$ ${totalPago.toFixed(2).replace('.',',')}`;
    document.getElementById('totalReceber').textContent = `R$ ${totalReceber.toFixed(2).replace('.',',')}`;
}

function renderizarLista() {
    const container = document.getElementById('listaPropostas');
    if(propostasFiltradas.length === 0) {
        container.innerHTML = `<div class="card"><p class="text-center text-text-muted py-4">Nenhuma proposta encontrada.</p></div>`;
        return;
    }

    container.innerHTML = propostasFiltradas.map(p => `
        <div class="card">
            <div class="cliente-nome">${p.nome || 'Sem nome'}</div>
            <span class="badge badge-${p.status.toLowerCase()}">${p.status}</span>
            ${p.status === 'Aprovada' ? `<span class="badge ${p.pago ? 'badge-paga' : 'badge-pendente'} ml-2">Entrada: ${p.pago ? 'PAGA' : 'PENDENTE'}</span>` : ''}

            <div class="linha-dado"><strong>CPF:</strong> ${formatarCpf(p.cpf)}</div>
            <div class="linha-dado"><strong>Nascimento:</strong> ${p.data_nascimento || '-'}</div>
            <div class="linha-dado"><strong>WhatsApp:</strong> ${p.whatsapp || '-'}</div>
            <div class="linha-dado"><strong>CEP:</strong> ${p.cep || '-'}</div>
            <div class="linha-dado"><strong>Endereço:</strong> ${p.endereco || ''} ${p.numero || ''} - ${p.bairro || ''}, ${p.cidade || ''} - ${p.uf || ''}</div>
            <div class="linha-dado"><strong>Valor Solicitado:</strong> R$ ${parseFloat(p.valor_solicitado||0).toFixed(2).replace('.',',')}</div>
            <div class="linha-dado"><strong>Valor Aprovado:</strong> R$ ${parseFloat(p.valor_aprovado||0).toFixed(2).replace('.',',')}</div>
            <div class="linha-dado"><strong>Valor da Entrada:</strong> R$ ${parseFloat(p.valor_entrada||0).toFixed(2).replace('.',',')}</div>
            
            ${p.contrato_aceito ? `
            <div class="linha-dado text-sucesso font-medium">✅ Contrato Assinado e Aceito pelo Cliente</div>
            ${p.selfie_contrato ? `<div class="linha-dado"><strong>Foto do Contrato:</strong> <a href="${p.selfie_contrato}" target="_blank" class="text-primary font-medium">👉 Clique para abrir a foto</a></div>` : ''}
            ${p.qtd_parcelas_escolhida ? `
            <div class="linha-dado"><strong>Parcelas Escolhidas:</strong> ${p.qtd_parcelas_escolhida} vezes</div>
            <div class="linha-dado"><strong>Valor da Parcela:</strong> R$ ${parseFloat(p.valor_parcela||0).toFixed(2).replace('.',',')}</div>
            ` : ''}
            ${p.datas_vencimento && p.datas_vencimento.length > 0 ? `
            <div class="dados-vencimento">
                <strong class="block mb-2">📅 Datas de Vencimento:</strong>
                ${p.datas_vencimento.map((d, i) => `<div class="text-sm py-1 border-b border-gray-200">${i+1}ª Parcela: ${d}</div>`).join('')}
            </div>
            ` : ''}
            ` : ''}

            <div class="botoes-acao">
                <button class="btn btn-primary" onclick="copiarDados('${p.cpf}')">📋 Copiar Dados</button>
                <button class="btn btn-alerta" onclick="editarProposta('${p.cpf}')">✏️ Editar/Aprovar</button>
                ${p.status === 'Nova' ? `<button class="btn btn-perigo" onclick="reprovarProposta('${p.cpf}')">❌ Reprovar</button>` : ''}
                <button class="btn btn-primary" onclick="enviarPropostaWhats('${p.cpf}')">📤 Enviar Proposta</button>
                <button class="btn btn-alerta" onclick="cobrarParcela('${p.cpf}')">💬 Cobrar Parcela</button>
                ${p.status === 'Aprovada' && !p.pago ? `<button class="btn btn-sucesso" onclick="marcarEntradaPaga('${p.cpf}')">✅ Entrada Paga</button>` : ''}
                <button class="btn btn-perigo" onclick="excluirProposta('${p.cpf}')">🗑️ Excluir</button>
            </div>
        </div>
    `).join('');
}

function filtrarPropostas() {
    const termo = document.getElementById('buscaProposta').value.trim().toLowerCase();
    if(!termo) {
        propostasFiltradas = [...listaPropostas];
    } else {
        propostasFiltradas = listaPropostas.filter(p => 
            (p.nome || '').toLowerCase().includes(termo) ||
            limparCpf(p.cpf || '').includes(limparCpf(termo))
        );
    }
    renderizarLista();
}

async function editarProposta(cpf) {
    const p = listaPropostas.find(x => x.cpf === cpf);
    if(!p) return;
    const valorAprovado = prompt('Valor Total Aprovado:', p.valor_aprovado || '');
    const valorEntrada = prompt('Valor da Entrada:', p.valor_entrada || '');
    const qtdParcelas = prompt('Máximo de Parcelas (até 48):', p.qtd_parcelas || '');
    const chavePix = prompt('Chave Pix para Pagamento:', p.chave_pix || localStorage.getItem('chave_pix_global') || '');
    
    if(!valorAprovado) return;

    const { error } = await supabase.from('propostas').update({
        valor_aprovado: parseFloat(valorAprovado),
        valor_entrada: parseFloat(valorEntrada || 0),
        qtd_parcelas: parseInt(qtdParcelas || 0),
        chave_pix: chavePix,
        status: 'Aprovada'
    }).eq('cpf', cpf);

    if(error) return mostrarNotificacao('Erro: ' + error.message, 'erro');
    mostrarNotificacao('✅ Proposta atualizada e aprovada!', 'sucesso');
    carregarPropostas();
}

async function reprovarProposta(cpf) {
    if(!confirm('Deseja realmente reprovar esta proposta?')) return;
    const { error } = await supabase.from('propostas').update({status: 'Reprovada'}).eq('cpf', cpf);
    if(error) return mostrarNotificacao('Erro: ' + error.message, 'erro');
    mostrarNotificacao('❌ Proposta reprovada.', 'sucesso');
    carregarPropostas();
}

async function marcarEntradaPaga(cpf) {
    if(!confirm('Confirmar que a entrada já foi paga?')) return;
    const { error } = await supabase.from('propostas').update({pago: true}).eq('cpf', cpf);
    if(error) return mostrarNotificacao('Erro: ' + error.message, 'erro');
    mostrarNotificacao('✅ Entrada marcada como paga!', 'sucesso');
    carregarPropostas();
}

function copiarDados(cpf) {
    const p = listaPropostas.find(x => x.cpf === cpf);
    if(!p) return;
    const texto = `Nome: ${p.nome}\nCPF: ${formatarCpf(p.cpf)}\nWhatsApp: ${p.whatsapp}\nEndereço: ${p.endereco}, ${p.numero} - ${p.bairro}, ${p.cidade}/${p.uf}\nValor Aprovado: R$ ${parseFloat(p.valor_aprovado||0).toFixed(2).replace('.',',')}`;
    navigator.clipboard.writeText(texto).then(() => mostrarNotificacao('✅ Dados copiados!', 'sucesso'));
}

function enviarPropostaWhats(cpf) {
    const p = listaPropostas.find(x => x.cpf === cpf);
    if(!p) return;
    const link = `https://wa.me/${limparCpf(p.whatsapp || '')}?text=${encodeURIComponent(`Olá ${p.nome}! Sua proposta já foi analisada e aprovada! Acesse para conferir os valores e assinar o contrato: https://flashcred-sistema.onrender.com/consultar.html?cpf=${limparCpf(p.cpf)}`)}`;
    window.open(link, '_blank');
}

function cobrarParcela(cpf) {
    const p = listaPropostas.find(x => x.cpf === cpf);
    if(!p) return;
    const link = `https://wa.me/${limparCpf(p.whatsapp || '')}?text=${encodeURIComponent(`Olá ${p.nome}! Passando para lembrar do vencimento da parcela. Acesse sua proposta para conferir os valores e data: https://flashcred-sistema.onrender.com/consultar.html?cpf=${limparCpf(p.cpf)}`)}`;
    window.open(link, '_blank');
}

async function excluirProposta(cpf) {
    if(!confirm('Tem certeza que deseja excluir esta proposta? Essa ação não pode ser desfeita!')) return;
    const { error } = await supabase.from('propostas').delete().eq('cpf', cpf);
    if(error) return mostrarNotificacao('Erro: ' + error.message, 'erro');
    mostrarNotificacao('✅ Proposta excluída.', 'sucesso');
    carregarPropostas();
}

function mostrarNotificacao(texto, tipo = 'sucesso') {
    const n = document.getElementById('notificacao');
    n.textContent = texto;
    n.className = `notificacao ${tipo}`;
    n.classList.add('mostrar');
    setTimeout(() => n.classList.remove('mostrar'), 4000);
}

function iniciarTempoReal() {
    supabase.channel('atualizacoes-propostas')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'propostas' }, () => {
            carregarPropostas();
        })
        .subscribe();
}
</script>
</body>
</html>
