<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        verdeLogo: '#10B981',
                        neutro: '#475569',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #F8FAFC; color: #1E293B; }
        
        nav { background: #FFFFFF; border-bottom: 1px solid #E2E8F0; position: sticky; top: 0; z-index: 50; }
        .nav-link { font-weight: 500; color: #475569; padding: 8px 14px; border-radius: 12px; text-decoration: none; transition: 0.2s; }
        .nav-link:hover { color: #0A2463; background: rgba(16, 185, 129, 0.08); }

        .card { background: #FFFFFF; border-radius: 20px; box-shadow: 0 4px 20px rgba(10, 36, 99, 0.06); padding: 24px; border: 1px solid #E2E8F0; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-nova { background: #FEF3C7; color: #92400E; }
        .badge-aprovada { background: #ECFDF5; color: #065F46; }
        .badge-recusada { background: #FEF2F2; color: #DC2626; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #F1F5F9; color: #0A2463; font-weight: 600; font-size: 13px; padding: 12px 16px; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
        tr:hover td { background: #F8FAFC; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<nav>
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-2xl font-extrabold text-primary">FlashCred</span>
            <span class="text-xs bg-primary/10 text-primary font-semibold px-2.5 py-1 rounded-full">Painel Administrativo</span>
        </div>
        <div class="flex gap-4">
            <a href="/" class="nav-link">Nova Solicitação (Site)</a>
            <a href="consultar.html" class="nav-link">Consulta Cliente</a>
        </div>
    </div>
</nav>

<main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-primary">Propostas Recebidas</h1>
            <p class="text-neutro text-sm">Gerencie todas as solicitações de limite enviadas pelos clientes.</p>
        </div>
        <button onclick="carregarPropostas()" class="bg-primary text-white px-4 py-2 rounded-xl text-sm font-semibold hover:opacity-90 transition">
            🔄 Atualizar Lista
        </button>
    </div>

    <div class="card overflow-x-auto">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Cliente</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>CEP / Endereço</th>
                    <th>Valor Solicitado</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabelaPropostas">
                <tr>
                    <td colspan="7" class="text-center py-6 text-neutro">Carregando propostas do banco de dados...</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- MODAL DE DETALHES -->
<div id="modalDetalhes" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
        <h3 class="text-xl font-bold text-primary mb-4">Detalhes da Proposta</h3>
        <div id="conteudoModal" class="space-y-3 text-sm text-gray-700 mb-6">
            <!-- Preenchido via script -->
        </div>
        <div class="flex gap-3 justify-end">
            <button onclick="mudarStatus('Aprovada')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-semibold hover:bg-emerald-700 transition">Aprovar</button>
            <button onclick="mudarStatus('Recusada')" class="bg-red-600 text-white px-4 py-2 rounded-xl font-semibold hover:bg-red-700 transition">Recusar</button>
            <button onclick="fecharModal()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-xl font-semibold hover:bg-gray-300 transition">Fechar</button>
        </div>
    </div>
</div>

<script>
const supabaseUrl = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const supabaseKey = 'sb_publishable_g5Tcimge2aiMX8JE3mlU3W55Y2s0CjZtxXkT2VjR3K9Rz0NnI2s1M3p5X7z6bX7kY5aQ3dF2gH9jK8lL7mN6bV8cX7z9';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let propostasGlobal = [];
let propostaSelecionadaId = null;

async function carregarPropostas() {
    const tbody = document.getElementById('tabelaPropostas');
    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-neutro">Buscando propostas...</td></tr>`;

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .order('id', { ascending: false });

    if (error) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-red-600">Erro ao carregar: ${error.message}</td></tr>`;
        return;
    }

    propostasGlobal = data || [];
    renderizarTabela();
}

function renderizarTabela() {
    const tbody = document.getElementById('tabelaPropostas');
    tbody.innerHTML = '';

    if (propostasGlobal.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-neutro">Nenhuma proposta encontrada no sistema.</td></tr>`;
        return;
    }

    propostasGlobal.forEach(p => {
        const tr = document.createElement('tr');
        tr.onclick = () => abrirDetalhes(p.id);

        let badgeClass = 'badge-nova';
        if (p.status === 'Aprovada') badgeClass = 'badge-aprovada';
        if (p.status === 'Recusada') badgeClass = 'badge-recusada';

        tr.innerHTML = `
            <td>${p.data_solicitacao || '---'}</td>
            <td class="font-semibold text-primary">${p.nome || '---'}</td>
            <td>${p.cpf || '---'}</td>
            <td>${p.telefone || '---'}</td>
            <td>${p.cep || ''} - ${p.endereco || '---'}</td>
            <td class="font-bold text-emerald-600">R$ ${p.valor_solicitado || '0,00'}</td>
            <td><span class="badge ${badgeClass}">${p.status || 'Nova'}</span></td>
        `;
        tbody.appendChild(tr);
    });
}

function abrirDetalhes(id) {
    const p = propostasGlobal.find(item => item.id === id);
    if (!p) return;

    propostaSelecionadaId = id;
    const conteudo = document.getElementById('conteudoModal');
    conteudo.innerHTML = `
        <p><strong>Nome:</strong> ${p.nome}</p>
        <p><strong>CPF:</strong> ${p.cpf}</p>
        <p><strong>Data de Nascimento:</strong> ${p.nascimento || '---'}</p>
        <p><strong>Telefone:</strong> ${p.telefone}</p>
        <p><strong>CEP:</strong> ${p.cep}</p>
        <p><strong>Endereço:</strong> ${p.endereco}</p>
        <p><strong>Valor Solicitado:</strong> R$ ${p.valor_solicitado}</p>
        <p><strong>Status Atual:</strong> ${p.status}</p>
    `;
    document.getElementById('modalDetalhes').classList.remove('hidden');
    document.getElementById('modalDetalhes').classList.add('flex');
}

function fecharModal() {
    document.getElementById('modalDetalhes').classList.remove('flex');
    document.getElementById('modalDetalhes').classList.add('hidden');
}

async function mudarStatus(novoStatus) {
    if (!propostaSelecionadaId) return;

    const { error } = await supabase
        .from('propostas')
        .update({ status: novoStatus })
        .eq('id', propostaSelecionadaId);

    if (error) {
        alert('Erro ao atualizar status: ' + error.message);
    } else {
        fecharModal();
        carregarPropostas();
    }
}

// Carregar ao iniciar
window.addEventListener('load', carregarPropostas);

// Atualizar automaticamente a cada 15 segundos
setInterval(carregarPropostas, 15000);
</script>
</body>
</html>
