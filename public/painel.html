<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Proposta | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #F8FAFC; color: #1E293B; padding: 16px; max-width: 600px; margin: 0 auto; }
        .cartao { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
        .botao { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .botao-pix { background: #32BCAD; color: white; }
        .botao-sucesso { background: #10B981; color: white; }
        .botao-alerta { background: #F59E0B; color: white; }
        .botao-wpp { background: #25D366; color: white; margin-top: 8px; }
        .botao-voltar { background: #94A3B8; color: white; margin-bottom: 12px; }
        .campo { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 16px; margin-bottom: 12px; }
        .barra-etapas { display: flex; justify-content: space-between; margin-bottom: 18px; position: relative; padding: 0 4px; }
        .barra-etapas::before { content: ''; position: absolute; top: 12px; left: 8%; right: 8%; height: 3px; background: #E2E8F0; z-index: 0; }
        .etapa { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; font-size: 10px; font-weight: 500; color: #94A3B8; text-align: center; width: 18%; }
        .etapa.ativa { color: #0A2463; font-weight: 700; }
        .etapa.concluida { color: #10B981; }
        .bolinha { width: 24px; height: 24px; border-radius: 50%; background: #E2E8F0; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; font-size: 12px; font-weight: bold; }
        .etapa.ativa .bolinha { background: #0A2463; color: white; }
        .etapa.concluida .bolinha { background: #10B981; color: white; }
        .bloco-entrega { background: #FFFBEB; border: 2px solid #F59E0B; border-radius: 12px; padding: 14px; margin: 12px 0; text-align: center; }
        .barra-progresso { margin: 10px 0; }
        .cabecalho-barra { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        .fundo-barra { width: 100%; height: 8px; background: #E2E8F0; border-radius: 4px; overflow: hidden; }
        .preenchimento-entrega { height: 100%; background: #F59E0B; width: 100%; }
        .detalhes { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 10px; padding: 14px; margin: 12px 0; }
        .detalhes p { margin: 6px 0; font-size: 15px; }
        .detalhes strong { color: #0A2463; }
        .qrcode-area { display: flex; justify-content: center; padding: 16px; background: white; border-radius: 10px; border: 1px solid #E2E8F0; margin: 12px 0; }
        .codigo-pix { background: #ECFDF5; border: 2px solid #10B981; border-radius: 12px; padding: 16px; text-align: center; font-weight: 600; margin: 16px 0; word-break: break-all; font-size: 12px; }
        .item-parcela { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
        .item-parcela:last-child { border-bottom: none; }
        .luz { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .luz-verde { background: #10B981; }
        .luz-amarela { background: #F59E0B; animation: piscar 1.2s infinite; }
        .luz-vermelha { background: #EF4444; animation: piscar 1s infinite; }
        @keyframes piscar { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
        .tela { display: none; }
        .tela.visivel { display: block; }
    </style>
</head>
<body>

<!-- TELA INICIAL - CONSULTA CPF -->
<div id="telaConsulta" class="tela visivel">
    <div class="cartao">
        <h2 class="text-xl font-bold text-center mb-6 text-primary">🔍 Acompanhar Proposta</h2>
        <input type="text" id="cpfConsulta" placeholder="Digite seu CPF (apenas números)" maxlength="11" class="campo">
        <button onclick="consultar()" class="botao botao-primario">Consultar</button>
    </div>
</div>

<!-- TELA DADOS DA PROPOSTA -->
<div id="telaProposta" class="tela">
    <button onclick="voltarInicio()" class="botao botao-voltar"><i class="fas fa-arrow-left"></i> Consultar Outro CPF</button>
    
    <div class="barra-etapas" id="barraEtapas"></div>

    <div class="cartao" id="conteudoProposta"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

let propostaAtual = null;

// ✅ LIMPA TUDO AO VOLTAR - NÃO GUARDA DADOS ANTERIORES
function voltarInicio() {
    propostaAtual = null;
    document.getElementById('cpfConsulta').value = '';
    document.getElementById('telaProposta').classList.remove('visivel');
    document.getElementById('telaConsulta').classList.add('visivel');
}

async function consultar() {
    const cpf = document.getElementById('cpfConsulta').value.trim().replace(/\D/g,'');
    if(cpf.length !== 11) return alert('Digite o CPF completo!');

    // BUSCA NOVA - SEM USAR DADOS ANTIGOS
    const {data, error} = await supabase.from('propostas').select('*').eq('cpf', cpf).single();
    if(error || !data) return alert('Proposta não encontrada! Verifique o CPF.');

    propostaAtual = data;
    mostrarProposta(data);
}

function mostrarProposta(p) {
    document.getElementById('telaConsulta').classList.remove('visivel');
    document.getElementById('telaProposta').classList.add('visivel');

    // ATUALIZA BARRA DE ETAPAS
    let etapa = 1;
    if(p.status === 'Aprovada') etapa = 2;
    if(p.contrato_assinado) etapa = 3;
    if(p.entrada_paga) etapa = 4;

    document.getElementById('barraEtapas').innerHTML = `
        <div class="etapa ${etapa>=1?(etapa>1?'concluida':'ativa'):''}"><div class="bolinha">${etapa>1?'✓':'1'}</div><span>Análise</span></div>
        <div class="etapa ${etapa>=2?(etapa>2?'concluida':'ativa'):''}"><div class="bolinha">${etapa>2?'✓':'2'}</div><span>Escolher Parcelas</span></div>
        <div class="etapa ${etapa>=3?(etapa>3?'concluida':'ativa'):''}"><div class="bolinha">${etapa>3?'✓':'3'}</div><span>Assinar Contrato</span></div>
        <div class="etapa ${etapa>=4?'concluida':''}"><div class="bolinha">${etapa>=4?'✓':'4'}</div><span>Pagar Entrada</span></div>
        <div class="etapa ${etapa>=5?'concluida':''}"><div class="bolinha">${etapa>=5?'✓':'5'}</div><span>Pagar Parcelas</span></div>
    `;

    const v=Number(p.valor_desejado||0), e=Number(p.valor_entrada||0), j=Number(p.juros_mensal||5), q=Number(p.quantidade_parcelas||0), total=v*(1+j/100), dias=p.dias_entrega||7;

    let html = `<h2 class="text-xl font-bold text-center mb-4 text-primary">Olá, ${p.nome}!</h2>`;

    if(p.status === 'Nova') {
        html += `<div class="text-center p-6 bg-yellow-50 rounded-lg"><i class="fas fa-clock text-4xl text-alerta mb-4"></i><p class="font-bold text-lg">Aguardando aprovação...</p></div>`;
    }

    if(p.status === 'Aprovada' && !p.contrato_assinado) {
        html += `
        <div class="bloco-entrega">
            <i class="fas fa-truck text-alerta text-xl mb-2"></i>
            <p class="font-bold">ENTREGA EM ATÉ ${dias} DIAS ÚTEIS APÓS PAGAMENTO!</p>
            <div class="barra-progresso">
                <div class="cabecalho-barra"><span>Prazo de Entrega</span><span>${dias} dias úteis</span></div>
                <div class="fundo-barra"><div class="preenchimento-entrega"></div></div>
            </div>
        </div>

        <div class="detalhes">
            <h4 class="font-bold text-lg mb-2">📋 Detalhes da Proposta</h4>
            <p><strong>Valor Total:</strong> R$ ${total.toLocaleString('pt-BR',2)}</p>
            <p><strong>Valor da Entrada:</strong> R$ ${e.toLocaleString('pt-BR',2)}</p>
            <p><strong>Quantidade de Parcelas:</strong> até ${q}x</p>
            <p><strong>Taxa de Juros:</strong> ${j}% ao mês</p>
        </div>

        <p class="text-center font-bold mt-4">Escolha a quantidade de parcelas:</p>
        <select id="qtdEscolhida" class="campo">
            ${Array.from({length:q}, (_,i)=>`<option value="${i+1}">${i+1}x de R$ ${((total-e)*(Math.pow(1+j/100,i+1)*(j/100))/(Math.pow(1+j/100,i+1)-1)).toLocaleString('pt-BR',2)}</option>`).join('')}
        </select>
        <button onclick="confirmarEscolha()" class="botao botao-sucesso mt-2">Confirmar e Ver Contrato</button>`;
    }

    if(p.contrato_assinado && !p.entrada_paga) {
        html += `
        <div class="text-center p-4 bg-green-50 rounded-lg mb-4"><i class="fas fa-check-circle text-4xl text-sucesso mb-2"></i><p class="font-bold">Contrato assinado com sucesso!</p></div>
        
        <div class="detalhes">
            <h4 class="font-bold mb-2">Resumo para Pagamento</h4>
            <p><strong>Valor da Entrada:</strong> R$ ${e.toLocaleString('pt-BR',2)}</p>
            <p><strong>Total do Contrato:</strong> R$ ${total.toLocaleString('pt-BR',2)}</p>
        </div>

        <button onclick="gerarPix(${e})" class="botao botao-pix mt-4">Gerar Pix para Pagamento</button>
        <div id="areaPix" class="hidden"></div>`;
    }

    if(p.entrada_paga) {
        html += `
        <div class="text-center p-4 bg-green-50 rounded-lg mb-4"><i class="fas fa-check-double text-4xl text-sucesso mb-2"></i><p class="font-bold">Entrada confirmada! Confira suas parcelas abaixo:</p></div>
        
        <h3 class="font-bold text-lg mt-4 mb-2">📅 Suas Parcelas</h3>
        ${(p.datas_parcelas||[]).map((dt,idx)=>{
            const valorParc = ((total-e)*(Math.pow(1+j/100,q)*(j/100))/(Math.pow(1+j/100,q)-1));
            const pg = idx+1 <= (p.parcelas_pagas||0);
            return `<div class="item-parcela">
                <div><span class="luz ${pg?'luz-verde':'luz-amarela'}"></span>${idx+1}ª Parcela: R$ ${valorParc.toLocaleString('pt-BR',2)} - Venc: ${new Date(dt).toLocaleDateString('pt-BR')}</div>
                ${pg?'<span class="text-sucesso font-bold">PAGA</span>':'<button onclick="gerarPix(${valorParc})" class="botao botao-pix botao-pequeno">Pagar</button>'}
            </div>`;
        }).join('')}`;
    }

    html += `<a href="https://wa.me/5511973294235" target="_blank" class="botao botao-wpp mt-4">💬 Falar com o Suporte</a>`;

    document.getElementById('conteudoProposta').innerHTML = html;
}

async function confirmarEscolha() {
    const qtd = Number(document.getElementById('qtdEscolhida').value);
    await supabase.from('propostas').update({qtd_escolhida:qtd}).eq('id', propostaAtual.id);
    alert('Escolha confirmada! Agora assine o contrato.');
    mostrarProposta({...propostaAtual, qtd_escolhida:qtd});
}

function gerarPix(valor) {
    const area = document.getElementById('areaPix');
    area.classList.remove('hidden');
    area.innerHTML = `<div class="text-center p-4"><i class="fas fa-spinner fa-spin text-2xl"></i> Gerando código...</div>`;
    
    // FUNÇÃO PADRÃO BACEN - PIX VÁLIDO
    function criarPix(valor, desc) {
        const chave = 'suporte@flashcred.com.br';
        const nome = 'FELIPE COSTA';
        const cidade = 'MUZAMBINHO';
        function campo(id, txt) { return id + String(txt.length).padStart(2,'0') + txt; }
        function crc(str) {
            let crc = 0xFFFF;
            const pol = 0x1021;
            for(let i=0;i<str.length;i++){
                crc ^= str.charCodeAt(i) << 8;
                for(let j=0;j<8;j++){
                    if(crc & 0x8000) crc = (crc << 1) ^ pol;
                    else crc <<= 1;
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4,'0');
        }
        let pix = '';
        pix += campo('00','01');
        pix += campo('26', campo('00','br.gov.bcb.pix') + campo('01', chave));
        pix += campo('52','0000');
        pix += campo('53','986');
        pix += campo('54', valor.toFixed(2));
        pix += campo('58','BR');
        pix += campo('59', nome);
        pix += campo('60', cidade);
        pix += campo('62', campo('05', desc.substring(0,25)));
        pix += '6304' + crc(pix+'6304');
        return pix;
    }

    const codigo = criarPix(valor, `Pagamento proposta ${propostaAtual.nome}`);
    area.innerHTML = `
    <div class="qrcode-area"><div id="qrcode"></div></div>
    <div class="codigo-pix">${codigo}</div>
    <button onclick="navigator.clipboard.writeText('${codigo}').then(()=>alert('Código copiado!'))" class="botao botao-sucesso">Copiar Código Pix</button>`;
    
    new QRCode(document.getElementById('qrcode'), {text:codigo, width:220, height:220});
}

// ATUALIZA EM TEMPO REAL SEM PERDER DADOS
supabase.channel('propostas').on('postgres_changes', {event:'UPDATE', schema:'public', table:'propostas', filter:`cpf=eq.${propostaAtual?.cpf||''}`}, (res)=>{
    propostaAtual = res.new;
    mostrarProposta(res.new);
}).subscribe();
</script>
</body>
</html>
