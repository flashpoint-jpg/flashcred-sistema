<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo | FlashCred</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --primary:#0A2463;
    --primary2:#123B91;
    --sucesso:#10B981;
    --alerta:#F59E0B;
    --perigo:#EF4444;
    --info:#3B82F6;
    --bg:#F0F4F8;
    --borda:#D1D9E6;
    --texto:#1E293B;
    --texto-claro:#64748B;
    --branco:#fff;
    --sombra:0 4px 14px rgba(0,0,0,.07);
    --raio:12px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--texto);
    font-family:Segoe UI,Roboto,Arial,sans-serif;
    line-height:1.5;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:20px;
}

.cartao{
    background:#fff;
    border-radius:var(--raio);
    padding:24px;
    box-shadow:var(--sombra);
}

.login-container{
    max-width:420px;
    margin:110px auto 0;
}

.login-titulo{
    text-align:center;
    font-size:23px;
    font-weight:800;
    color:var(--primary);
    margin-bottom:20px;
}

.campo{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--borda);
    border-radius:8px;
    background:#fff;
    color:var(--texto);
    margin-bottom:10px;
    transition:.2s;
}

.campo:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(10,36,99,.10);
}

.botao{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-weight:700;
    font-size:14px;
    transition:.2s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.botao:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 10px rgba(0,0,0,.10);
}

.botao:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.botao-primario{
    background:var(--primary);
    color:#fff;
}

.botao-sucesso{
    background:var(--sucesso);
    color:#fff;
}

.botao-alerta{
    background:var(--alerta);
    color:#fff;
}

.botao-perigo{
    background:var(--perigo);
    color:#fff;
}

.botao-cinza{
    background:#E2E8F0;
    color:var(--texto);
}

.botao-copiar-campo{
    border:0;
    background:transparent;
    cursor:pointer;
    padding:2px 4px;
    font-size:14px;
    vertical-align:middle;
    opacity:.75;
}

.botao-copiar-campo:hover{
    opacity:1;
    transform:scale(1.08);
}

.botao-wpp{
    background:#25D366;
    color:#fff;
}

.botao-pdf{
    background:var(--info);
    color:#fff;
}

.cabecalho{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.cabecalho h1{
    color:var(--primary);
    font-size:22px;
}

.acoes-cabecalho{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.barra-resumo{
    background:#fff;
    border-radius:var(--raio);
    padding:16px;
    margin-bottom:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    box-shadow:var(--sombra);
}

.item-resumo{
    background:#F8FAFC;
    border-radius:9px;
    padding:12px;
    display:flex;
    flex-direction:column;
}

.item-resumo span:first-child{
    color:var(--texto-claro);
    font-size:12px;
    font-weight:600;
}

.item-resumo span:last-child{
    font-size:18px;
    font-weight:800;
    margin-top:3px;
}

.item-resumo.clicavel{
    cursor:pointer;
    transition:.2s;
    border:2px solid transparent;
}

.item-resumo.clicavel:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.10);
    border-color:var(--primary);
}

.item-resumo.clicavel.ativo{
    border-color:var(--primary);
    background:#EEF4FF;
}

.fluxo-abas{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:0 0 20px;
    padding:10px;
    background:#fff;
    border-radius:var(--raio);
    box-shadow:var(--sombra);
}

.fluxo-aba{
    flex:1 1 160px;
    border:2px solid transparent;
    background:#F8FAFC;
    color:var(--texto);
    border-radius:9px;
    padding:12px 14px;
    cursor:pointer;
    font-weight:800;
    text-align:left;
    transition:.2s;
}

.fluxo-aba:hover{
    transform:translateY(-1px);
    border-color:var(--primary);
}

.fluxo-aba.ativa{
    border-color:var(--primary);
    background:#EEF4FF;
}

.fluxo-aba small{
    display:block;
    margin-top:3px;
    font-size:12px;
    opacity:.7;
}

.filtro-aviso{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
    padding:10px 14px;
    background:#fff;
    border:1px solid var(--borda);
    border-radius:9px;
    box-shadow:var(--sombra);
    font-size:13px;
    font-weight:700;
}

.sininho{
    min-height:72px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#F8FAFC;
    border-radius:9px;
    cursor:pointer;
    color:var(--primary);
}

.contador-notif{
    position:absolute;
    top:5px;
    right:8px;
    min-width:22px;
    height:22px;
    padding:0 5px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--perigo);
    color:#fff;
    font-size:11px;
    font-weight:800;
}

.area-edicao{
    display:none;
    margin:15px 0 20px;
    padding:20px;
    background:#F8FAFC;
    border:1px solid var(--borda);
    border-radius:10px;
    scroll-margin-top:16px;
}

.area-edicao.ativa{
    display:block;
    animation:aparece .2s ease;
    position:relative;
}

.area-edicao.ativa .edicao-resumo-topo{
    position:sticky;
    top:10px;
    z-index:50;
    backdrop-filter:blur(8px);
}

.edicao-resumo-topo .edicao-resumo-item{
    transition:all .15s ease;
}
.edicao-resumo-topo .edicao-resumo-item strong{
    font-variant-numeric:tabular-nums;
}

.edicao-resumo-topo{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
    margin:0 0 18px;
    padding:12px;
    background:#fff;
    border:2px solid var(--primary);
    border-radius:12px;
    box-shadow:0 4px 14px rgba(15,23,42,.08);
}
.edicao-resumo-item{
    padding:10px 12px;
    border:1px solid var(--borda);
    border-radius:9px;
    background:#F8FAFC;
}
.edicao-resumo-item strong{
    display:block;
    margin-top:3px;
    font-size:18px;
}
.edicao-resumo-item.destaque{
    background:#EEF6FF;
    border-color:var(--primary);
}
@media(max-width:700px){
    .edicao-resumo-topo{grid-template-columns:repeat(2,minmax(0,1fr));}
}

@keyframes aparece{
    from{
        opacity:0;
        transform:translateY(-5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:15px;
}

.campo-grande{
    grid-column:1/-1;
}

.label-campo{
    display:block;
    margin-bottom:5px;
    color:var(--texto-claro);
    font-size:13px;
    font-weight:700;
}

.titulo-bloco{
    color:var(--primary);
    font-size:15px;
    font-weight:800;
    padding-bottom:7px;
    margin-bottom:10px;
    border-bottom:1px solid var(--borda);
}

.resumo-valores{
    background:#ECFDF5;
    border:1px solid #A7F3D0;
    color:#065F46;
    padding:12px;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    margin-top:10px;
}

.linha-proposta{
    background:#fff;
    border-radius:var(--raio);
    padding:20px;
    margin-bottom:16px;
    box-shadow:var(--sombra);
    border-left:4px solid var(--borda);
}

.linha-proposta:hover{
    box-shadow:0 7px 18px rgba(0,0,0,.09);
}

.destaque-alerta{
    border-left-color:var(--alerta);
    background:#FFFEF5;
}

.destaque-perigo{
    border-left-color:var(--perigo);
    background:#FFF8F8;
}

.proposta-topo{
    display:flex;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.nome-cliente{
    font-size:19px;
    font-weight:800;
    color:var(--primary);
}

.dados-cliente{
    margin-top:8px;
    font-size:14px;
}

.dados-cliente p{
    margin:5px 0;
}

.botoes-acao{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-content:flex-start;
}

.prazo-entrega{
    background:#FFFBEB;
    border:2px solid var(--alerta);
    border-radius:9px;
    padding:13px;
    margin-top:15px;
    color:#92400E;
}

.prazo-entrega.concluido{
    background:#ECFDF5;
    border-color:var(--sucesso);
    color:#065F46;
}

.prazo-topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    font-weight:700;
}

.info-entrega{
    display:flex;
    justify-content:space-between;
    margin:7px 0 4px;
    font-size:12px;
    font-weight:700;
}

.fundo-barra-entrega{
    height:10px;
    width:100%;
    background:#FDE68A;
    border-radius:10px;
    overflow:hidden;
}

.preenchimento-entrega{
    height:100%;
    background:var(--alerta);
    transition:.4s;
}

.preenchimento-concluido{
    background:var(--sucesso);
}

.bloco-parcelas{
    border:1px solid var(--borda);
    border-radius:9px;
    overflow:hidden;
    margin-top:15px;
}

.cabecalho-cronograma{
    padding:11px 14px;
    background:#F8FAFC;
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    font-weight:800;
}

.corpo-cronograma{
    display:none;
    background:#fff;
}

.corpo-cronograma.aberto{
    display:block;
}

.item-parcela{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px;
    border-top:1px solid var(--borda);
    font-size:13px;
    flex-wrap:wrap;
}

.indicador-status{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.luz-status{
    width:12px;
    height:12px;
    min-width:12px;
    border-radius:50%;
    display:inline-block;
}

.luz-verde{
    background:var(--sucesso);
    animation:piscando 1.2s infinite;
}

.luz-verde-fixa{
    background:var(--sucesso);
}

.luz-amarela{
    background:var(--alerta);
    animation:piscando 1.2s infinite;
}

.luz-vermelha{
    background:var(--perigo);
}

.luz-vermelha-piscando{
    background:var(--perigo);
    animation:piscandoForte 1s infinite;
}

@keyframes piscando{
    0%,100%{opacity:1}
    50%{opacity:.4}
}

@keyframes piscandoForte{
    0%,100%{
        opacity:1;
        box-shadow:0 0 0 rgba(239,68,68,0)
    }
    50%{
        opacity:.65;
        box-shadow:0 0 8px rgba(239,68,68,.5)
    }
}

.aviso-vencimento{
    display:inline-block;
    padding:4px 8px;
    border-radius:6px;
    font-size:11px;
    font-weight:800;
}

.aviso-avencer{
    background:#FFFBEB;
    color:#92400E;
    border:1px solid var(--alerta);
}

.avencer-hoje,
.aviso-vencida{
    background:#FEE2E2;
    color:#991B1B;
    border:1px solid var(--perigo);
    animation:piscandoForte 1s infinite;
}

.tipo-data{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.lista-datas{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;
}

.lista-datas .campo{
    margin-bottom:0;
}

.acoes-form{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.estado{
    text-align:center;
    padding:35px 20px;
    color:var(--texto-claro);
}

.estado i{
    font-size:30px;
    margin-bottom:10px;
}

.alerta{
    background:#FEF2F2;
    border:1px solid #FECACA;
    color:#991B1B;
    border-radius:8px;
    padding:12px;
    margin-bottom:15px;
}

.oculto{
    display:none!important;
}

.texto-sucesso{
    color:var(--sucesso);
}

.texto-alerta{
    color:var(--alerta);
}

.texto-perigo{
    color:var(--perigo);
}

.texto-info{
    color:var(--info);
}

@media(max-width:700px){
    .container{
        padding:12px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .campo-grande{
        grid-column:auto;
    }

    .barra-resumo{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .cabecalho h1{
        font-size:18px;
    }

    .botoes-acao .botao{
        flex:1 1 auto;
    }

    .item-parcela{
        align-items:flex-start;
    }

    .login-container{
        margin-top:50px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="telaLogin" class="container login-container">

    <div class="cartao">

        <div class="login-titulo">
            🔐 Acesso Painel FlashCred
        </div>

        <input
            type="password"
            id="senha"
            class="campo"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter') entrar()"
        >

        <button
            onclick="entrar()"
            class="botao botao-primario"
            style="width:100%"
        >
            <i class="fas fa-sign-in-alt"></i>
            Entrar no Sistema
        </button>

    </div>

</div>


<!-- PAINEL -->
<div id="telaPrincipal" class="container oculto">

    <div class="cabecalho">

        <h1>
            ⚙️ Painel Administrativo | FlashCred
        </h1>

        <div class="acoes-cabecalho">

            <button
                onclick="carregarPropostas()"
                class="botao botao-cinza"
            >
                <i class="fas fa-sync"></i>
                Atualizar
            </button>

            <button
                onclick="sair()"
                class="botao botao-cinza"
            >
                <i class="fas fa-sign-out-alt"></i>
                Sair
            </button>

        </div>

    </div>


    <!-- RESUMO -->
    <div class="barra-resumo">

        <div class="item-resumo">
            <span>💰 Total Recebido</span>
            <span id="totalRecebido" class="texto-sucesso">
                R$ 0,00
            </span>
        </div>

        <div class="item-resumo">
            <span>⏳ A Receber</span>
            <span id="totalReceber" class="texto-alerta">
                R$ 0,00
            </span>
        </div>

        <div class="item-resumo clicavel" id="resumoPagas" onclick="filtrarResumo('pagas')" title="Ver clientes com parcelas pagas">
            <span>🧾 Parcelas Pagas</span>
            <span id="qtdPagas">0</span>
        </div>

        <div class="item-resumo clicavel" id="resumoVencidas" onclick="filtrarResumo('vencidas')" title="Ver parcelas vencidas">
            <span>⚠️ Vencidas</span>
            <span id="qtdVencidas" class="texto-perigo">
                0
            </span>
        </div>

        <div class="item-resumo clicavel" id="resumoProximas" onclick="filtrarResumo('proximas')" title="Ver próximas parcelas">
            <span>🔔 Próximas</span>
            <span id="qtdProximas" class="texto-alerta">
                0
            </span>
        </div>

        <div class="item-resumo">
            <span>📋 Aguardando</span>
            <span id="qtdPendentes">
                0
            </span>
        </div>

        <div
            class="sininho"
            onclick="mostrarNotificacoes()"
            title="Ver propostas novas"
        >
            <i class="fas fa-bell fa-lg"></i>

            <div
                class="contador-notif"
                id="contadorNotif"
            >
                0
            </div>
        </div>

    </div>


    <!-- ABAS PRINCIPAIS (restauradas) -->
    <div class="abas-painel-restauradas" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px">
        <button type="button" id="abaAdminPropostas" class="botao botao-primario" onclick="mostrarAbaPainelRestaurada('propostas')">📋 Propostas</button>
        <button type="button" id="abaAdminRecebidos" class="botao botao-cinza" onclick="mostrarAbaPainelRestaurada('recebidos')">💰 Recebidos</button>
        <button type="button" id="abaAdminFuncionarios" class="botao botao-cinza" onclick="mostrarAbaPainelRestaurada('funcionarios')">👥 Funcionários</button>
    </div>

    <!-- FLUXO DE CLIENTES -->
    <div class="fluxo-abas">
        <button
            type="button"
            class="fluxo-aba ativa"
            id="abaNovos"
            onclick="filtrarFluxo('novos')"
        >
            🆕 Novos Clientes
            <small><span id="qtdNovos">0</span> cliente(s)</small>
        </button>

        <button
            type="button"
            class="fluxo-aba"
            id="abaAprovados"
            onclick="filtrarFluxo('aprovados')"
        >
            ✅ Aprovados
            <small><span id="qtdAprovados">0</span> cliente(s)</small>
        </button>

        <button
            type="button"
            class="fluxo-aba"
            id="abaEntradaPaga"
            onclick="filtrarFluxo('entrada')"
        >
            💵 Entrada Paga
            <small><span id="qtdEntradaPaga">0</span> cliente(s)</small>
        </button>
    </div>


    <!-- NOVA PROPOSTA -->
    <button
        onclick="abrirNovo()"
        class="botao botao-sucesso"
        style="margin-bottom:15px"
    >
        ➕ Cadastrar Nova Proposta
    </button>


    <div id="formNovo" class="area-edicao">

        <h3 class="titulo-bloco">
            📝 Dados da Proposta
        </h3>

        <div class="grid">

            <div>
                <span class="label-campo">
                    👤 Nome Completo
                </span>

                <input
                    type="text"
                    id="nome"
                    class="campo"
                >
            </div>

            <div>
                <span class="label-campo">
                    📄 CPF
                </span>

                <input
                    type="text"
                    id="cpf"
                    class="campo"
                    maxlength="14"
                    placeholder="000.000.000-00"
                    oninput="formatarCPF(this)"
                >
            </div>

            <div>
                <span class="label-campo">
                    📱 WhatsApp com DDD
                </span>

                <input
                    type="text"
                    id="whatsapp"
                    class="campo"
                    maxlength="15"
                    placeholder="(11) 99999-8888"
                    oninput="formatarTelefone(this)"
                >
            </div>

            <div>
                <span class="label-campo">
                    🏠 CEP
                </span>

                <input
                    type="text"
                    id="cep"
                    class="campo"
                    maxlength="9"
                    placeholder="00000-000"
                    oninput="formatarCEP(this)"
                >
            </div>

            <div class="campo-grande">

                <span class="label-campo">
                    📍 Endereço Completo
                </span>

                <input
                    type="text"
                    id="endereco"
                    class="campo"
                >

            </div>

            <div>

                <span class="label-campo">
                    💵 Valor Desejado
                </span>

                <input
                    type="number"
                    id="valor_desejado"
                    class="campo"
                    min="0"
                    step="0.01"
                    oninput="atualizarCalculo(document.getElementById('formNovo'))"
                >

            </div>

            <div>

                <span class="label-campo">
                    💸 Entrada
                </span>

                <input
                    type="number"
                    id="valor_entrada"
                    class="campo"
