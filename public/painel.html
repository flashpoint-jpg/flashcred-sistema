<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; padding: 16px; min-height: 100vh; }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .titulo { font-size: 26px; font-weight: 800; color: #0A2463; }
        .btn-voltar { padding: 10px 16px; background: white; border: 1px solid #0A2463; color: #0A2463; border-radius: 12px; text-decoration: none; font-weight: 500; }
        
        .card { background: white; border-radius: 20px; padding: 24px; box-shadow: 0 4px 20px rgba(10,36,99,0.08); margin-bottom: 20px; }
        .busca { width: 100%; padding: 12px 16px; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 15px; margin-bottom: 20px; }
        .item-proposta { padding: 16px; border-bottom: 1px solid #F1F5F9; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .item-proposta:last-child { border-bottom: none; }
        .status { padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; }
        .status.nova { background: #FFFBEB; color: #92400E; }
        .status.aprovada { background: #ECFDF5; color: #065F46; }
        .status.recusada { background: #FEF2F2; color: #991B1B; }
        .acoes { display: flex; gap: 8px; }
        .btn-acao { padding: 8px 12px; border-radius: 10px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; }
        .btn-aprov { background: #10B981; color: white; }
        .btn-recus { background: #EF4444; color: white; }
        .btn-whats { background: #25D366; color: white; }
        .sem-dados { text-align: center; padding: 40px; color: #64748B; }
    </style>
</head>
<body>

<div class="topo">
    <h1 class="titulo">📊 Painel de Controle - FlashCred</h1>
    <a href="index.html" class="btn-voltar">← Voltar para o site</a>
</div>

<div class="card">
    <input type="text" id="buscaCpf" class="busca" placeholder="🔍 Buscar por CPF ou nome..." oninput="filtrarPropostas()">
    
    <div id="listaPropostas"></div>
    
    <div id="semDados" class="sem-dados" style="display:none;">
        Nenhuma proposta encontrada.
    </div>
</div>

<script>
const supabaseUrl = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const supabaseKey = 'sb_publishable_g5Tcimge2aiMX8JE3mlU3W55Y2s0CjZtxXkT2VjR3K9Rz0NnI2s1M3p5X7z6bX7kY5aQ3dF2gH9jK8lL7mN6bV8cX7z9';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let todasPropostas = [];

async function carregarPropostas() {
    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .order('data_solicitacao', { ascending: false });

    if(!error && data) {
        todasPropostas = data;
        mostrarPropostas(data);
    }
}

function mostrarPropostas(lista) {
    const container = document.getElementById('listaPropostas');
    const semDados = document.getElementById('semDados');
    
    container.innerHTML = '';
    
    if(lista.length === 0) {
        semDados.style.display = 'block';
        return;
    }
    
    semDados.style.display = 'none';
    
    lista.forEach(proposta => {
        const item = document.createElement('div');
        item.className = 'item-proposta';
        
        item.innerHTML = `
            <div>
                <strong>${proposta.nome}</strong><br>
                <span style="font-size:13px; color:#64748B;">CPF: ${proposta.cpf} | Valor: R$ ${parseFloat(proposta.valor_solicitado).toFixed(2)}</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <span class="status ${proposta.status.toLowerCase()}">${proposta.status}</span>
                <div class="acoes">
                    <button class="btn-acao btn-aprov" onclick="alterarStatus('${proposta.cpf}', 'Aprovada')">Aprovar</button>
                    <button class="btn-acao btn-recus" onclick="alterarStatus('${proposta.cpf}', 'Recusada')">Recusar</button>
                    <button class="btn-acao btn-whats" onclick="enviarWhatsapp('${proposta.telefone}', '${proposta.nome}', '${proposta.cpf}')">WhatsApp</button>
                </div>
            </div>
        `;
        
        container.appendChild(item);
    });
}

function filtrarPropostas() {
    const termo = document.getElementById('buscaCpf').value.toLowerCase();
    const filtrado = todasPropostas.filter(p => 
        p.nome.toLowerCase().includes(termo) || 
        p.cpf.replace(/\D/g, '').includes(termo.replace(/\D/g, ''))
    );
    mostrarPropostas(filtrado);
}

async function alterarStatus(cpf, novoStatus) {
    const cpfLimpo = cpf.replace(/\D/g, '');
    await supabase
        .from('propostas')
        .update({ status: novoStatus })
        .ilike('cpf', `%${cpfLimpo}%`);
    
    carregarPropostas();
    alert(`✅ Proposta ${novoStatus.toLowerCase()} com sucesso!`);
}

function enviarWhatsapp(telefone, nome, cpf) {
    const texto = `Olá ${nome}! Tudo bem? Sou da FlashCred. Recebemos sua solicitação de crédito referente ao CPF ${cpf}. Acesse o link para acompanhar: https://flashcred-sistema.onrender.com/consultar.html?cpf=${cpf.replace(/\D/g, '')}`;
    window.open(`https://wa.me/${telefone.replace(/\D/g, '')}?text=${encodeURIComponent(texto)}`, '_blank');
}

// Carrega tudo quando abrir a página
carregarPropostas();
</script>
</body>
</html>
