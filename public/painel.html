<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SENHA = 'flash2026';
const CHAVE_PIX_FIXA = 'suporte@flashcred.com.br'; // Chave Pix padrão para os códigos gerados

let modo = 'producao';
let propostas = [];
let timer = null;
let processando = false;
let qtdAnterior = 0;

function entrar() {
    if (document.getElementById('senha').value === SENHA) {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregar();
        timer = setInterval(() => carregar(true), 15000); 
    } else {
        document.getElementById('erroLogin').style.display = 'block';
    }
}

function definirModo(m) {
    modo = m;
    document.querySelectorAll('.modo').forEach(b => b.classList.remove('modo-ativo'));
    event.target.classList.add('modo-ativo');
    alert(`✅ Modo ${m.toUpperCase()} ativado!`);
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

// Função auxiliar para calcular o CRC16 do Pix dinâmico válido
function calcularCRC16(payload) {
    let polinomio = 0x1021;
    let resultado = 0xFFFF;
    
    for (let i = 0; i < payload.length; i++) {
        resultado ^= (payload.charCodeAt(i) << 8);
        for (let j = 0; j < 8; j++) {
            if ((resultado & 0x8000) !== 0) {
                resultado = ((resultado << 1) ^ polinomio) & 0xFFFF;
            } else {
                resultado = (resultado << 1) & 0xFFFF;
            }
        }
    }
    return resultado.toString(16).toUpperCase().padStart(4, '0');
}

// Função para gerar o payload Pix Copia e Cola válido estruturado
function gerarPayloadPix(chave, nomeRecebedor, cidade, valorStr, identificador) {
    const normalizar = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").substring(0, 25);
    
    nomeRecebedor = normalizar(nomeRecebedor);
    cidade = normalizar(cidade);
    
    let payload = "000201";
    
    let merchantAccount = `0014br.gov.bcb.pix01${String(chave.length).padStart(2, '0')}${chave}`;
    payload += `26${String(merchantAccount.length).padStart(2, '0')}${merchantAccount}`;
    
    payload += "52040000"; 
    payload += "5303986";  
    
    if (valorStr && Number(valorStr) > 0) {
        let valFormatted = Number(valorStr).toFixed(2);
        payload += `54${String(valFormatted.length).padStart(2, '0')}${valFormatted}`;
    }
    
    payload += "5802BR";
    payload += `59${String(nomeRecebedor.length).padStart(2, '0')}${nomeRecebedor}`;
    payload += `60${String(cidade.length).padStart(2, '0')}${cidade}`;
    
    let additionalData = `05${String(identificador.length).padStart(2, '0')}${identificador}`;
    payload += `62${String(additionalData.length).padStart(2, '0')}${additionalData}`;
    
    payload += "6304";
    let crc = calcularCRC16(payload);
    return payload + crc;
}

async function carregar(silencioso = false) {
    if (!silencioso) document.getElementById('carregando').style.display = 'block';
    const { data, error } = await supabase.from('propostas').select('*').order('created_at', { ascending: false });
    if (!silencioso) document.getElementById('carregando').style.display = 'none';
    if (error) { alert('Erro: ' + error.message); return; }

    qtdAnterior = propostas.length;
    propostas = data || [];

    const totalEntradas = propostas.reduce((s, p) => s + Number(p.valor_entrada_pago ? p.valor_entrada : 0), 0);
    const totalRestante = propostas.reduce((s, p) => {
        const total = Number(p.valor_desejado || 0);
        const entrada = Number(p.valor_entrada || 0);
        return s + (total - entrada);
    }, 0);

    document.getElementById('totalPropostas').textContent = propostas.length;
    document.getElementById('totalEntradas').textContent = real(totalEntradas);
    document.getElementById('totalFalta').textContent = real(totalRestante);

    if (silencioso && propostas.length > qtdAnterior) {
        const alerta = document.getElementById('alertaNovas');
        alerta.style.display = 'block';
        setTimeout(() => alerta.style.display = 'none', 6000);
    }
    filtrar();
}

function filtrar() {
    const busca = document.getElementById('busca').value.replace(/\D/g, '');
    let lista = propostas;
    if (busca.length >= 11) {
        lista = propostas.filter(p => (p.cpf || '').replace(/\D/g, '').includes(busca));
    } else if (busca.length >= 4) {
        lista = propostas.filter(p => (p.codigo_unico || '').toUpperCase().includes(busca.toUpperCase()));
    }
    document.getElementById('lista').innerHTML = lista.length === 0 
        ? '<p class="vazio">Nenhuma proposta encontrada</p>'
        : lista.map(criarCard).join('');
}

function criarCard(p) {
    let statusCls, statusTxt;
    if (p.valor_entrada_pago) {
        statusCls = 'status-paga';
        statusTxt = '💰 Entrada Paga';
    } else if (p.status === 'Aprovada') {
        statusCls = 'status-aprovada';
        statusTxt = '✅ Aprovada';
    } else if (p.status === 'Reprovada') {
        statusCls = 'status-reprovada';
        statusTxt = '❌ Reprovada';
    } else {
        statusCls = 'status-nova';
        statusTxt = '⏳ Aguardando';
    }

    const valorTotal = Number(p.valor_desejado || 0);
    const percEnt = Number(p.percentual_entrada || 20);
    const valorEnt = valorTotal * percEnt / 100;
    const parcelas = p.quantidade_parcelas || '';
    const juros = Number(p.juros || 0);
    const resto = valorTotal - valorEnt;
    const valParc = parcelas ? resto * (1 + juros/100) / parcelas : 0;

    const cpf = (p.cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    
    // Gera a URL do QR Code via API pública usando o copia e cola salvo, se existir
    let qrExibicao = '<span style="color:#94a3b8">Aguardando</span>';
    if (p.copia_cola_pix) {
        const urlQr = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(p.copia_cola_pix)}`;
        qrExibicao = `<img src="${urlQr}" class="qrcode-img" alt="QR Code">`;
    }

    const pixStatus = p.copia_cola_pix 
        ? '<span style="color:#10B981; font-weight:600">✅ Pix Gerado</span>'
        : '<span style="color:#94a3b8">Aguardando</span>';

    const botaoPagoDesabilitado = p.valor_entrada_pago ? 'disabled' : '';
    const textoBotaoPago = p.valor_entrada_pago ? '✅ Entrada Confirmada' : '💰 Marcar Entrada Paga';

    return `
    <div class="proposta">
        <div class="proposta-topo">
            <div>
                <div class="proposta-nome">${p.nome || '---'}</div>
                <div class="proposta-info">Código: ${p.codigo_unico || '---'}</div>
                <div class="proposta-info">CPF: ${cpf} | Tel: ${p.telefone || '---'}</div>
                <div class="proposta-info">Pix: ${pixStatus}</div>
                <div class="proposta-info">QR Code: ${qrExibicao}</div>
            </div>
            <span class="status ${statusCls}">${statusTxt}</span>
        </div>

        <div class="grade">
            <div class="campo">
                <label>Valor Total (R$)</label>
                <input type="number" id="v-${p.id}" value="${valorTotal}" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (%)</label>
                <input type="number" id="p-${p.id}" value="${percEnt}" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (R$)</label>
                <input type="text" id="e-${p.id}" value="${real(valorEnt)}" readonly>
            </div>
            <div class="campo">
                <label>Parcelas (1-48)</label>
                <input type="number" id="par-${p.id}" value="${parcelas}" min="1" max="48" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Juros % ao mês</label>
                <input type="number" id="j-${p.id}" value="${juros}" step="0.01" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Valor da Parcela (R$)</label>
                <input type="text" id="vp-${p.id}" value="${real(valParc)}" readonly>
            </div>
        </div>

        <div class="botoes">
            <button class="btn btn-aprovar" id="btn-aprovar-${p.id}" onclick="aprovar(${p.id})" ${p.status === 'Aprovada' ? 'disabled' : ''}>✅ Aprovar + Gerar Pix</button>
            <button class="btn btn-pago" onclick="marcarEntradaPaga(${p.id})" ${botaoPagoDesabilitado}>${textoBotaoPago}</button>
            <button class="btn btn-reprovar" onclick="reprovar(${p.id})">❌ Reprovar</button>
            <button class="btn btn-whatsapp" onclick="enviarWhatsApp(${p.id})">📱 WhatsApp</button>
            <button class="btn btn-excluir" onclick="excluir(${p.id})">🗑️ Excluir</button>
        </div>
    </div>`;
}

function atualizar(id) {
    const valor = Number(document.getElementById(`v-${id}`).value) || 0;
    const perc = Number(document.getElementById(`p-${id}`).value) || 0;
    const parcelas = Number(document.getElementById(`par-${id}`).value) || 0;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;

    const entrada = valor * perc / 100;
    const resto = valor - entrada;
    const valorParc = parcelas > 0 ? resto * (1 + juros/100) / parcelas : 0;

    document.getElementById(`e-${id}`).value = real(entrada);
    document.getElementById(`vp-${id}`).value = real(valorParc);
}

async function aprovar(id) {
    if (processando) return;

    const proposta = propostas.find(p => p.id === id);
    if (!proposta) return;

    const valor = Number(document.getElementById(`v-${id}`).value) || 0;
    const perc = Number(document.getElementById(`p-${id}`).value) || 0;
    const entrada = valor * perc / 100;
    const parcelas = Number(document.getElementById(`par-${id}`).value) || 1;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;

    if (!confirm(`✅ Aprovar proposta de ${proposta.nome}?\nValor: ${real(valor)}\nEntrada: ${real(entrada)}`)) return;

    processando = true;
    const btn = document.getElementById(`btn-aprovar-${id}`);
    if (btn) btn.disabled = true;

    // Gera o código Pix Copia e Cola válido contendo o valor exato da entrada e o ID único do cliente
    const copiaEColaPix = gerarPayloadPix(
        CHAVE_PIX_FIXA,
        "FLASHCRED",
        "SAO PAULO",
        entrada,
        proposta.codigo_unico || "FLC01"
    );

    const urlQrCode = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(copiaEColaPix)}`;

    const { error } = await supabase.from('propostas').update({
        status: 'Aprovada',
        valor_desejado: valor,
        percentual_entrada: perc,
        valor_entrada: entrada,
        quantidade_parcelas: parcelas,
        juros: juros,
        copia_cola_pix: copiaEColaPix,
        qr_code_entrada: urlQrCode
    }).eq('id', id);

    processando = false;
    if (btn) btn.disabled = false;

    if (error) {
        alert('❌ Erro: ' + error.message);
    } else {
        alert('✅ APROVADA!\n\nPix dinâmico e QR Code gerados com sucesso.');
        carregar();
    }
}

async function marcarEntradaPaga(id) {
    const proposta = propostas.find(p => p.id === id);
    if (!proposta) return;

    if (!confirm(`💰 Confirmar que a entrada de ${proposta.nome} foi PAGA?\nValor: ${real(proposta.valor_entrada || 0)}`)) return;

    const { error } = await supabase.from('propostas').update({
        valor_entrada_pago: true,
        data_pagamento_entrada: new Date().toISOString()
    }).eq('id', id);

    if (error) {
        alert('❌ Erro: ' + error.message);
    } else {
        alert('✅ Entrada marcada como PAGA!');
        carregar();
    }
}

async function reprovar(id) {
    if (!confirm('Reprovar esta proposta?')) return;
    await supabase.from('propostas').update({ status: 'Reprovada' }).eq('id', id);
    carregar();
}

async function excluir(id) {
    if (!confirm('Deseja realmente excluir esta proposta?')) return;
    await supabase.from('propostas').delete().eq('id', id);
    carregar();
}

function enviarWhatsApp(id) {
    const p = propostas.find(item => item.id === id);
    if (!p) return;
    const tel = (p.telefone || '').replace(/\D/g, '');
    const msg = encodeURIComponent(`Olá ${p.nome}, sua proposta na FlashCred foi analisada! Acesse o sistema para verificar os detalhes.`);
    window.open(`https://api.whatsapp.com/send?phone=55${tel}&text=${msg}`, '_blank');
}
</script>
