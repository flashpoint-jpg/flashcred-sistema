<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        modo_manual: '#3B82F6',
                        modo_teste: '#F59E0B',
                        modo_producao: '#10B981',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        texto: '#1E293B',
                        textoClaro: '#64748B'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; }
        .card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 20px; margin-bottom: 16px; border: 1px solid #E2E8F0; }
        .btn { padding: 8px 12px; border-radius: 10px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s; font-size: 13px; margin: 2px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-primary:hover { background: #081d45; }
        .btn-editar { background: #3B82F6; color: white; }
        .btn-editar:hover { background: #2563EB; }
        .btn-imprimir { background: #8B5CF6; color: white; }
        .btn-imprimir:hover { background: #7C3AED; }
        .btn-copiar { background: #6366F1; color: white; }
        .btn-copiar:hover { background: #4F46E5; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-sucesso:hover { background: #059669; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-alerta:hover { background: #D97706; }
        .btn-perigo { background: #EF4444; color: white; }
        .btn-perigo:hover { background: #DC2626; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #128C7E; }
        .input { width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 14px; background: #FAFBFC; margin-bottom: 10px; }
        .input:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10, 36, 99, 0.1); }
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-nova { background: #FEF3C7; color: #92400E; }
        .badge-aprovada { background: #D1FAE5; color: #065F46; }
        .badge-reprovada { background: #FEE2E2; color: #991B1B; }
        .badge-pago { background: #D1FAE5; color: #065F46; margin-left: 4px; }
        .modo-selecionado { padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; color: white; }
        .dados-cliente { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #F1F5F9; }
        .dados-cliente p { font-size: 13px; margin: 4px 0; }
        .dados-cliente strong { color: #0A2463; }
        .nome-cliente { font-size: 17px; font-weight: 700; color: #0A2463; margin-bottom: 8px; display: block; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 999; padding: 15px; }
        .modal-conteudo { background: white; border-radius: 16px; max-width: 550px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; }
        .cabecalho { background: white; padding: 16px 20px; border-bottom: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .area-modo { display: flex; gap: 8px; align-items: center; }
        .area-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .atualizacao { animation: destaque 2s ease-out; }
        @keyframes destaque { 0% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.3); } 100% { box-shadow: 0 0 0 0 transparent; } }
        @media print {
            body * { visibility: hidden; }
            .card, .card * { visibility: visible; }
            .card { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; border: none; }
            .btn { display: none; }
        }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="area-login">
    <div class="card w-full max-w-md">
        <h2 class="text-xl font-bold text-center text-primary mb-4">🔐 Acesso Administrativo</h2>
        <label>Senha</label>
        <input type="password" id="senhaAdmin" class="input" placeholder="Digite sua senha">
        <div id="erroLogin" class="text-perigo text-sm mb-2 hidden">Senha incorreta</div>
        <button id="btnEntrar" class="btn btn-primary w-full justify-center">Entrar</button>
    </div>
</div>

<!-- PAINEL PRINCIPAL -->
<div id="painel" class="hidden">
    <div class="cabecalho">
        <div class="flex flex-col md:flex-row md:items-center gap-3">
            <h1 class="text-lg font-bold text-primary">📋 Propostas Recebidas</h1>
            <!-- ✅ MODO DE OPERAÇÃO QUE JÁ TINHA -->
            <div class="area-modo">
                <span class="text-sm text-textoClaro">Modo:</span>
                <span id="modoOperacao" class="modo-selecionado modo_manual">Manual</span>
                <button class="btn text-xs py-1 px-2" onclick="alterarModo('manual')">Manual</button>
                <button class="btn text-xs py-1 px-2" onclick="alterarModo('teste')">Teste</button>
                <button class="btn text-xs py-1 px-2" onclick="alterarModo('producao')">Produção</button>
            </div>
        </div>
        <div>
            <button id="btnAlterarSenha" class="btn btn-alerta text-xs">Alterar Senha</button>
            <button id="btnSair" class="btn btn-perigo text-xs">Sair</button>
        </div>
    </div>

    <div class="p-4 max-w-6xl mx-auto">
        <div id="listaPropostas">
            <p class="text-center text-textoClaro py-6">Carregando propostas...</p>
        </div>
    </div>
</div>

<!-- MODAL EDITAR/VER PROPOSTA -->
<div id="modalEditar" class="modal">
    <div class="modal-conteudo">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-primary">Editar Proposta</h3>
            <button id="fecharModal" class="text-xl text-textoClaro">&times;</button>
        </div>
        <div id="formModal"></div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let senhaCorreta = 'flashcred2026';
let listaPropostas = [];
let autoAtualiza;
let modoAtual = 'manual';

// ✅ ALTERAR MODO DE OPERAÇÃO
function alterarModo(modo) {
    modoAtual = modo;
    const el = document.getElementById('modoOperacao');
    el.textContent = modo.charAt(0).toUpperCase() + modo.slice(1);
    el.className = `modo-selecionado modo_${modo}`;
    alert(`✅ Modo alterado para: ${modo.charAt(0).toUpperCase() + modo.slice(1)}`);
}

// LOGIN
document.getElementById('btnEntrar').addEventListener('click', () => {
    if(document.getElementById('senhaAdmin').value === senhaCorreta) {
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('painel').classList.remove('hidden');
        carregarPropostas();
        autoAtualiza = setInterval(carregarPropostas, 12000);
    } else {
        document.getElementById('erroLogin').classList.remove('hidden');
    }
});

// SAIR
document.getElementById('btnSair').addEventListener('click', () => {
    clearInterval(autoAtualiza);
    document.getElementById('painel').classList.add('hidden');
    document.getElementById('telaLogin').classList.remove('hidden');
    document.getElementById('senhaAdmin').value = '';
    document.getElementById('erroLogin').classList.add('hidden');
});

// ALTERAR SENHA
document.getElementById('btnAlterarSenha').addEventListener('click', () => {
    const nova = prompt('Digite a nova senha:');
    if(nova && nova.length >= 4) {
        senhaCorreta = nova;
        alert('✅ Senha alterada com sucesso!');
    }
});

// CARREGAR PROPOSTAS
async function carregarPropostas() {
    try {
        const { data, error } = await supabase.from('propostas').select('*');
        if(error) throw error;
        
        const anterior = JSON.stringify(listaPropostas);
        listaPropostas = data || [];
        
        if(anterior !== JSON.stringify(listaPropostas)) {
            renderizarLista();
        }
    } catch (e) {
        console.error('Erro ao carregar:', e);
    }
}

function renderizarLista() {
    const container = document.getElementById('listaPropostas');
    container.innerHTML = '';

    if(listaPropostas.length === 0) {
        container.innerHTML = '<p class="text-center text-textoClaro py-8">Nenhuma proposta recebida.</p>';
        return;
    }

    listaPropostas.forEach(proposta => {
        const card = document.createElement('div');
        card.className = `card ${proposta.nova ? 'atualizacao' : ''}`;
        proposta.nova = false;

        card.innerHTML = `
            <div class="flex justify-between items-start flex-wrap gap-2">
                <div>
                    <span class="nome-cliente">${proposta.nome}</span>
                    <span class="badge badge-${proposta.status.toLowerCase()}">${proposta.status}</span>
                    ${proposta.pago ? '<span class="badge badge-pago">Entrada Paga</span>' : ''}
                </div>
                <div class="flex gap-1">
                    <!-- ✅ BOTÕES ORIGINAIS: IMPRIMIR E COPIAR -->
                    <button class="btn btn-imprimir btn-imp" title="Imprimir" onclick="window.print()">
                        <i class="fa-solid fa-print"></i> Imprimir
                    </button>
                    <button class="btn btn-copiar btn-cop" data-cpf="${proposta.cpf}" title="Copiar Dados">
                        <i class="fa-solid fa-copy"></i> Copiar
                    </button>
                </div>
            </div>
            
            <div class="dados-cliente mt-2">
                <p><strong>CPF:</strong> ${proposta.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</p>
                <p><strong>Data de Nascimento:</strong> ${proposta.nascimento || 'Não informado'}</p>
                <p><strong>WhatsApp:</strong> ${proposta.telefone.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3')}</p>
                <p><strong>CEP:</strong> ${proposta.cep.replace(/(\d{5})(\d{3})/, '$1-$3') || 'Não informado'}</p>
                <p><strong>Endereço Completo:</strong> ${proposta.endereco || 'Não informado'}</p>
                <p><strong>Valor Solicitado:</strong> R$ ${parseFloat(proposta.valor_desejado || 0).toFixed(2).replace('.', ',')}</p>
            </div>

            <div class="flex flex-wrap gap-1 mt-3">
                <!-- ✅ TODOS OS BOTÕES QUE EXISTIAM -->
                <button class="btn btn-editar btn-editar-proposta" data-cpf="${proposta.cpf}">
                    <i class="fa-solid fa-pen-to-square"></i> Editar
                </button>
                <button class="btn btn-sucesso btn-aprovar" data-cpf="${proposta.cpf}">
                    <i class="fa-solid fa-check"></i> Aprovar
                </button>
                <button class="btn btn-perigo btn-reprovar" data-cpf="${proposta.cpf}">
                    <i class="fa-solid fa-xmark"></i> Reprovar
                </button>
                
                <!-- ✅ NOVAS FUNÇÕES ADICIONADAS -->
                ${proposta.status === 'Aprovada' ? `
                <button class="btn btn-whatsapp btn-wpp" data-cpf="${proposta.cpf}">
                    <i class="fa-brands fa-whatsapp"></i> Enviar Link
                </button>
                ${!proposta.pago ? `
                <button class="btn btn-alerta btn-pago" data-cpf="${proposta.cpf}">
                    <i class="fa-solid fa-money-bill-wave"></i> Marcar Pago
                </button>
                ` : ''}
                ` : ''}
            </div>
        `;
        container.appendChild(card);
    });

    // ✅ AÇÃO COPIAR DADOS
    document.querySelectorAll('.btn-cop').forEach(btn => {
        btn.addEventListener('click', () => {
            const proposta = listaPropostas.find(p => p.cpf === btn.dataset.cpf);
            const texto = `
NOME: ${proposta.nome}
CPF: ${proposta.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}
NASCIMENTO: ${proposta.nascimento || 'Não informado'}
WHATSAPP: ${proposta.telefone.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3')}
CEP: ${proposta.cep.replace(/(\d{5})(\d{3})/, '$1-$3') || 'Não informado'}
ENDEREÇO: ${proposta.endereco || 'Não informado'}
VALOR SOLICITADO: R$ ${parseFloat(proposta.valor_desejado || 0).toFixed(2).replace('.', ',')}
            `.trim();
            navigator.clipboard.writeText(texto).then(() => {
                alert('✅ Dados copiados!');
            });
        });
    });

    // AÇÕES DOS DEMAIS BOTÕES
    document.querySelectorAll('.btn-editar-proposta').forEach(btn => {
        btn.addEventListener('click', () => abrirModal(btn.dataset.cpf));
    });

    document.querySelectorAll('.btn-aprovar').forEach(btn => {
        btn.addEventListener('click', () => abrirModal(btn.dataset.cpf));
    });

    document.querySelectorAll('.btn-reprovar').forEach(btn => {
        btn.addEventListener('click', async () => {
            if(!confirm('Tem certeza que deseja reprovar esta proposta?')) return;
            await supabase.from('propostas').update({status: 'Reprovada'}).eq('cpf', btn.dataset.cpf);
            carregarPropostas();
        });
    });

    document.querySelectorAll('.btn-wpp').forEach(btn => {
        btn.addEventListener('click', () => {
            const proposta = listaPropostas.find(p => p.cpf === btn.dataset.cpf);
            const link = `https://flashcred-sistema.onrender.com/consultar.html?cpf=${proposta.cpf}`;
            const msg = `✅ Olá ${proposta.nome}! Tudo bem?\nSua proposta foi APROVADA pela FlashCred! 🎉\nAcesse aqui para ver valores, Pix e detalhes: ${link}`;
            window.open(`https://wa.me/${proposta.telefone}?text=${encodeURIComponent(msg)}`, '_blank');
        });
    });

    document.querySelectorAll('.btn-pago').forEach(btn => {
        btn.addEventListener('click', async () => {
            if(!confirm('Confirmar que a entrada foi paga?')) return;
            await supabase.from('propostas').update({pago: true}).eq('cpf', btn.dataset.cpf);
            alert('✅ Pagamento registrado com sucesso!');
            carregarPropostas();
        });
    });
}

// ABRIR MODAL DE EDIÇÃO
function abrirModal(cpf) {
    const proposta = listaPropostas.find(p => p.cpf === cpf);
    const modal = document.getElementById('modalEditar');
    const form = document.getElementById('formModal');

    form.innerHTML = `
        <label>Valor Total Aprovado (R$)</label>
        <input type="number" step="0.01" id="vTotal" class="input" value="${proposta.valor_aprovado || ''}">

        <label>Valor da Entrada (R$)</label>
        <input type="number" step="0.01" id="vEntrada" class="input" value="${proposta.valor_entrada || ''}">

        <label>Quantidade de Parcelas (1 até 48)</label>
        <select id="qtdParc" class="input">
            <option value="">Selecione</option>
            ${Array.from({length:48}, (_,i) => i+1).map(n => `<option value="${n}" ${proposta.qtd_parcelas === n ? 'selected' : ''}>${n} vezes</option>`).join('')}
        </select>

        <label>Valor de Cada Parcela (R$)</label>
        <input type="number" step="0.01" id="vParc" class="input" value="${proposta.valor_parcela || ''}">

        <label>Chave Pix para Pagamento</label>
        <input type="text" id="chavePix" class="input" value="${proposta.chave_pix || ''}">

        <div class="flex gap-2 mt-4">
            <button id="salvarAlteracoes" class="btn btn-sucesso flex-1 justify-center">Salvar e Aprovar</button>
            <button id="cancelarModal" class="btn btn-perigo flex-1 justify-center">Cancelar</button>
        </div>
    `;

    modal.style.display = 'flex';

    document.getElementById('cancelarModal').onclick = () => modal.style.display = 'none';
    document.getElementById('fecharModal').onclick = () => modal.style.display = 'none';

    document.getElementById('salvarAlteracoes').onclick = async () => {
        const dados = {
            status: 'Aprovada',
            valor_aprovado: parseFloat(document.getElementById('vTotal').value) || 0,
            valor_entrada: parseFloat(document.getElementById('vEntrada').value) || 0,
            qtd_parcelas: parseInt(document.getElementById('qtdParc').value) || 0,
            valor_parcela: parseFloat(document.getElementById('vParc').value) || 0,
            chave_pix: document.getElementById('chavePix').value.trim()
        };

        const { error } = await supabase.from('propostas').update(dados).eq('cpf', cpf);
        if(error) return alert('❌ Erro: ' + error.message);
        
        alert('✅ Salvo com sucesso! Já aparece para o cliente.');
        modal.style.display = 'none';
        carregarPropostas();
    };
}

window.addEventListener('click', e => {
    if(e.target.id === 'modalEditar') document.getElementById('modalEditar').style.display = 'none';
});
</script>
</body>
</html>
