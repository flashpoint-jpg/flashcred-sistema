<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        modo_manual: '#3B82F6',
                        modo_teste: '#F59E0B',
                        modo_producao: '#10B981',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        neutro: '#475569',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px 12px; }
        .cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .titulo { font-size: 24px; font-weight: 700; color: #0A2463; }
        .modo-botao { padding: 8px 16px; border-radius: 8px; font-weight: 600; border: none; color: white; cursor: pointer; }
        .modo-ativo { box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .resumo-valores { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card-resumo { background: white; padding: 16px; border-radius: 12px; border: 1px solid #E2E8F0; text-align: center; }
        .card-resumo h4 { font-size: 14px; color: #64748B; margin-bottom: 8px; }
        .card-resumo p { font-size: 22px; font-weight: 700; color: #0A2463; }
        .btn { padding: 10px 14px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { transform: translateY(-1px); }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-perigo { background: #EF4444; color: white; }
        .btn-secundario { background: #F1F5F9; color: #0A2463; border: 1px solid #CBD5E1; }
        .tabela { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 12px; overflow: hidden; border: 1px solid #E2E8F0; background: white; }
        .tabela th { background: #EFF6FF; padding: 12px; text-align: left; font-weight: 600; color: #0A2463; font-size: 13px; }
        .tabela td { padding: 12px; border-bottom: 1px solid #E2E8F0; font-size: 13px; }
        .tabela tr:last-child td { border-bottom: none; }
        .badge { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .badge-aprovada { background: #D1FAE5; color: #065F46; }
        .badge-pendente { background: #FEF3C7; color: #92400E; }
        .badge-reprovada { background: #FEE2E2; color: #B91C1C; }
        .badge-paga { background: #D1FAE5; color: #065F46; }
        .badge-vencer { background: #FEF3C7; color: #92400E; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 12px; display: none; }
        .modal-conteudo { background: white; border-radius: 16px; padding: 24px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .input { width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
        .input[readonly] { background: #F3F4F6; color: #4B5563; }
        .grid { display: grid; gap: 12px; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .label { font-weight: 500; font-size: 13px; margin-bottom: 4px; display: block; }
        .botoes-modal { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="container">
    <div class="cabecalho">
        <h1 class="titulo"><i class="fa-solid fa-chart-line"></i> Painel Administrativo - FlashCred</h1>
        <div class="flex gap-2">
            <button id="btnModoManual" class="modo-botao modo-manual modo-ativo" onclick="definirModo('manual')">Modo Manual</button>
            <button id="btnModoTeste" class="modo-botao modo-teste" onclick="definirModo('teste')">Modo Teste</button>
            <button id="btnModoProducao" class="modo-botao modo-producao" onclick="definirModo('producao')">Modo Produção</button>
            <button class="btn btn-perigo" onclick="sair()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
        </div>
    </div>

    <!-- RESUMO GERAL -->
    <div class="resumo-valores">
        <div class="card-resumo">
            <h4>Total de Propostas</h4>
            <p id="totalPropostas">0</p>
        </div>
        <div class="card-resumo">
            <h4>Entradas Pagas</h4>
            <p id="totalEntradas">0</p>
        </div>
        <div class="card-resumo">
            <h4>Total a Receber</h4>
            <p id="totalReceber">R$ 0,00</p>
        </div>
        <div class="card-resumo">
            <h4>Parcelas Vencendo</h4>
            <p id="totalVencendo">0</p>
        </div>
    </div>

    <!-- LISTA DE PROPOSTAS -->
    <div class="overflow-x-auto">
        <table class="tabela">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome / CPF</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Entrada</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="listaPropostas"></tbody>
        </table>
    </div>
</div>

<!-- MODAL EDITAR PROPOSTA -->
<div id="modalEditar" class="modal">
    <div class="modal-conteudo">
        <h3 class="text-xl font-bold text-primary mb-4">Editar / Aprovar Proposta</h3>
        <div class="grid grid-2">
            <div>
                <label class="label">Valor Solicitado</label>
                <input type="number" step="0.01" id="edtValorSolicitado" class="input" onchange="calcularValoresEdicao()">
            </div>
            <div>
                <label class="label">% Entrada</label>
                <input type="number" id="edtPercEntrada" class="input" value="40" onchange="calcularValoresEdicao()">
            </div>
            <div>
                <label class="label">% Juros ao Mês</label>
                <input type="number" step="0.1" id="edtJuros" class="input" value="6" onchange="calcularValoresEdicao()">
            </div>
            <div>
                <label class="label">Máximo de Parcelas (1 a 48)</label>
                <input type="number" id="edtMaxParcelas" class="input" value="48" min="1" max="48">
            </div>
        </div>

        <div class="grid grid-2 mt-2">
            <div>
                <label class="label">Valor da Entrada</label>
                <input type="text" id="edtValorEntrada" class="input" readonly>
            </div>
            <div>
                <label class="label">Valor Total com Juros</label>
                <input type="text" id="edtValorTotal" class="input" readonly>
            </div>
        </div>

        <div class="mt-4">
            <label class="label">Status da Proposta</label>
            <select id="edtStatus" class="input">
                <option value="pendente">Pendente</option>
                <option value="aprovada">Aprovada</option>
                <option value="reprovada">Reprovada</option>
            </select>
        </div>

        <div class="mt-2">
            <label class="flex items-center gap-2">
                <input type="checkbox" id="edtEntradaPaga">
                <span class="label mb-0">Entrada já foi paga</span>
            </label>
        </div>

        <div class="botoes-modal">
            <button class="btn btn-secundario" onclick="fecharModalEditar()">❌ Cancelar</button>
            <button class="btn btn-alerta" onclick="imprimirProposta()">🖨️ Imprimir</button>
            <button class="btn btn-sucesso" onclick="salvarEGerarPix()">✅ Salvar e Gerar Pix Automático</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let modoSistema = 'manual';
let propostaSelecionada = null;

// Definir modo
function definirModo(modo) {
    modoSistema = modo;
    document.querySelectorAll('.modo-botao').forEach(b => b.classList.remove('modo-ativo'));
    document.getElementById(`btnModo${modo.charAt(0).toUpperCase() + modo.slice(1)}`).classList.add('modo-ativo');
}

// Calcular valores automaticamente
function calcularValoresEdicao() {
    const valorSolicitado = Number(document.getElementById('edtValorSolicitado').value || 0);
    const percEntrada = Number(document.getElementById('edtPercEntrada').value || 40);
    const percJuros = Number(document.getElementById('edtJuros').value || 6);
    const maxParcelas = Number(document.getElementById('edtMaxParcelas').value || 48);

    const valorEntrada = (valorSolicitado * percEntrada / 100).toFixed(2);
    const valorFinanciado = valorSolicitado - Number(valorEntrada);
    const valorJuros = (valorFinanciado * (percJuros / 100) * maxParcelas).toFixed(2);
    const valorTotal = (valorSolicitado + Number(valorJuros)).toFixed(2);

    document.getElementById('edtValorEntrada').value = `R$ ${valorEntrada.replace('.', ',')}`;
    document.getElementById('edtValorTotal').value = `R$ ${valorTotal.replace('.', ',')}`;
}

// Gerar Pix automaticamente
async function gerarPixAutomatico(valor, codigoProposta) {
    const valorCentavos = Math.round(valor * 100);
    const descricao = `Entrada Proposta ${codigoProposta} - FlashCred`;
    const chavePix = modoSistema === 'producao' ? 'sua-chave-pix-aqui' : 'teste@flashcred.com.br';
    
    // Código Pix Copia e Cola padrão
    const pixCopiaECola = `00020126580014br.gov.bcb.pix0136${chavePix}0228${descricao}5204000053039865802BR5919FlashCred Distribuidora6009SAO PAULO62070503***6304${valorCentavos.toString().padStart(10, '0')}`;
    
    // Gerar QR Code como imagem
    const qrCodeUrl = await QRCode.toDataURL(pixCopiaECola);
    
    return {
        copia_cola_pix: pixCopiaECola,
        qrcode_pix: qrCodeUrl
    };
}

// Salvar e gerar tudo automaticamente
async function salvarEGerarPix() {
    if(!propostaSelecionada) return;
    
    const valorEntrada = Number(document.getElementById('edtValorEntrada').value.replace('R$ ', '').replace(',', '.'));
    const status = document.getElementById('edtStatus').value;
    
    let dadosPix = { qrcode_pix: propostaSelecionada.qrcode_pix || '', copia_cola_pix: propostaSelecionada.copia_cola_pix || '' };
    
    // Se for aprovada, gera o Pix automaticamente
    if(status === 'aprovada' && !propostaSelecionada.copia_cola_pix) {
        dadosPix = await gerarPixAutomatico(valorEntrada, propostaSelecionada.codigo_unico);
    }

    const dadosAtualizados = {
        valor_solicitado: Number(document.getElementById('edtValorSolicitado').value),
        percentual_entrada: Number(document.getElementById('edtPercEntrada').value),
        juros: Number(document.getElementById('edtJuros').value),
        quantidade_parcelas: Number(document.getElementById('edtMaxParcelas').value),
        status: status,
        entrada_paga: document.getElementById('edtEntradaPaga').checked,
        ...dadosPix,
        data_atualizacao: new Date()
    };

    try {
        await supabase.from('propostas').update(dadosAtualizados).eq('id', propostaSelecionada.id);
        alert('✅ Proposta salva! Pix gerado automaticamente e já disponível para o cliente.');
        fecharModalEditar();
        carregarListaPropostas();
    } catch(erro) {
        alert('Erro ao salvar: ' + erro.message);
    }
}

// Funções restantes: carregar lista, abrir modal, excluir, imprimir, atualização automática
async function carregarListaPropostas() {
    const { data } = await supabase.from('propostas').select('*').order('data_criacao', { ascending: false });
    const lista = document.getElementById('listaPropostas');
    lista.innerHTML = '';
    
    let totalPropostas = 0, totalEntradas = 0, totalReceber = 0, totalVencendo = 0;

    (data || []).forEach(proposta => {
        totalPropostas++;
        if(proposta.entrada_paga) totalEntradas++;
        
        const valor = Number(proposta.valor_solicitado || 0);
        if(!proposta.entrada_paga && proposta.status === 'aprovada') totalReceber += valor;
        
        lista.innerHTML += `
            <tr>
                <td><strong>${proposta.codigo_unico || 'Sem código'}</strong></td>
                <td>${proposta.nome}<br><small>${proposta.cpf?.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</small></td>
                <td>R$ ${Number(proposta.valor_solicitado || 0).toFixed(2).replace('.', ',')}</td>
                <td><span class="badge badge-${proposta.status}">${proposta.status?.toUpperCase()}</span></td>
                <td>${proposta.entrada_paga ? '<span class="badge badge-paga">PAGA</span>' : '<span class="badge badge-vencer">PENDENTE</span>'}</td>
                <td>
                    <button class="btn btn-secundario btn-sm" onclick="abrirEditar(${JSON.stringify(proposta).replace(/"/g, '&quot;')})"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button class="btn btn-alerta btn-sm" onclick="enviarWhatsapp('${proposta.cpf}', '${proposta.codigo_unico}')"><i class="fa-brands fa-whatsapp"></i></button>
                    <button class="btn btn-perigo btn-sm" onclick="excluirProposta(${proposta.id})"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        `;
    });

    document.getElementById('totalPropostas').textContent = totalPropostas;
    document.getElementById('totalEntradas').textContent = totalEntradas;
    document.getElementById('totalReceber').textContent = `R$ ${totalReceber.toFixed(2).replace('.', ',')}`;
    document.getElementById('totalVencendo').textContent = totalVencendo;
}

function abrirEditar(proposta) {
    propostaSelecionada = proposta;
    document.getElementById('edtValorSolicitado').value = proposta.valor_solicitado || '';
    document.getElementById('edtPercEntrada').value = proposta.percentual_entrada || 40;
    document.getElementById('edtJuros').value = proposta.juros || 6;
    document.getElementById('edtMaxParcelas').value = proposta.quantidade_parcelas || 48;
    document.getElementById('edtStatus').value = proposta.status || 'pendente';
    document.getElementById('edtEntradaPaga').checked = proposta.entrada_paga || false;
    calcularValoresEdicao();
    document.getElementById('modalEditar').style.display = 'flex';
}

function fecharModalEditar() {
    document.getElementById('modalEditar').style.display = 'none';
    propostaSelecionada = null;
}

async function excluirProposta(id) {
    if(confirm('Tem certeza que deseja excluir esta proposta?')) {
        await supabase.from('propostas').delete().eq('id', id);
        carregarListaPropostas();
    }
}

function enviarWhatsapp(cpf, codigo) {
    const link = `${window.location.origin}/consultar.html?cod=${codigo}`;
    const mensagem = `Olá! Sua proposta ${codigo} foi analisada. Acesse aqui para ver o resultado e finalizar: ${link}`;
    window.open(`https://wa.me/55${cpf.replace(/\D/g, '').slice(2)}?text=${encodeURIComponent(mensagem)}`);
}

function imprimirProposta() {
    window.print();
}

function sair() {
    if(confirm('Deseja realmente sair?')) location.reload();
}

// Atualização automática a cada 10 segundos
setInterval(carregarListaPropostas, 10000);
carregarListaPropostas();
</script>
</body>
</html>
