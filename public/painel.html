<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
            --bg-body: #F8FAFC;
            --borda: #E2E8F0;
            --texto: #334155;
            --texto-claro: #64748B;
            --sombra: 0 2px 8px rgba(10,36,99,0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); padding: 16px; line-height: 1.6; }

        /* === TELA DE LOGIN === */
        .login { max-width: 380px; margin: 80px auto; background: white; padding: 32px; border-radius: 16px; box-shadow: var(--sombra); }
        .login h2 { text-align: center; color: var(--primary); margin-bottom: 24px; font-size: 22px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid var(--borda); border-radius: 8px; font-size: 15px; margin: 8px 0 16px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10,36,99,0.08); }
        button { border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-entrar { width: 100%; padding: 12px; background: var(--primary); color: white; font-size: 16px; }
        .btn-entrar:hover { background: #0c3499; }
        .erro { color: var(--perigo); text-align: center; margin-top: 10px; display: none; font-size: 14px; }

        /* === PAINEL PRINCIPAL === */
        .container { max-width: 1000px; margin: 0 auto; display: none; }
        
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--borda); }
        h1 { color: var(--primary); font-size: 22px; font-weight: 700; }
        
        .topo-acoes { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn-topo { padding: 8px 14px; font-size: 13px; border-radius: 6px; background: #e2e8f0; color: #334155; }
        .btn-topo:hover { background: #cbd5e1; }
        .label-modo { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 20px; }

        /* === CAIXA DE TOTAIS === */
        .caixa-totais { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .total-card { background: white; padding: 18px; border-radius: 12px; border: 1px solid var(--borda); box-shadow: var(--sombra); }
        .total-label { font-size: 13px; color: var(--texto-claro); font-weight: 600; }
        .total-valor { font-size: 22px; font-weight: 700; color: var(--primary); margin-top: 6px; }
        .total-ent { color: var(--sucesso); }
        .total-falta { color: var(--alerta); }

        /* === BUSCA === */
        .busca { background: white; padding: 18px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 24px; box-shadow: var(--sombra); }
        .busca label { font-size: 14px; font-weight: 600; color: var(--texto-claro); display: block; margin-bottom: 8px; }
        .busca-linha { display: flex; gap: 10px; }
        .busca input { flex: 1; margin: 0; }
        .btn-busca { padding: 12px 20px; background: var(--primary); color: white; white-space: nowrap; }

        /* === CARD DA PROPOSTA === */
        .proposta { background: white; padding: 20px; border-radius: 14px; border: 1px solid var(--borda); margin-bottom: 20px; box-shadow: var(--sombra); }
        .proposta-topo { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap; gap: 10px; }
        .proposta-nome { font-size: 17px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .proposta-info { font-size: 13px; color: var(--texto-claro); line-height: 1.5; }
        .status { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
        .status-nova { background: #FEF3C7; color: #92400E; }
        .status-aprovada { background: #D1FAE5; color: #065F46; }
        .status-reprovada { background: #FEE2E2; color: #991B1B; }

        /* === FOTOS / DOCUMENTOS === */
        .grid-midias { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 16px 0; background: #F8FAFC; padding: 16px; border-radius: 10px; border: 1px solid var(--borda); }
        .bloco-midia { text-align: center; }
        .bloco-midia span { font-size: 12px; font-weight: 600; color: var(--texto-claro); display: block; margin-bottom: 8px; }
        .img-preview { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1; cursor: pointer; transition: transform 0.2s; }
        .img-preview:hover { transform: scale(1.05); }
        .sem-arquivo { color: #94a3b8; font-size: 12px; }

        /* === DADOS DO CONTRATO === */
        .grade { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin: 16px 0; }
        .campo label { font-size: 12px; color: var(--texto-claro); font-weight: 600; display: block; margin-bottom: 4px; }
        .campo input { padding: 10px; margin: 0; border: 1px solid var(--borda); border-radius: 6px; font-size: 14px; width: 100%; }
        .campo input[readonly] { background: #F0FDF4; color: #065F46; font-weight: 600; }

        /* === PARCELAS === */
        .bloco-parcelas-admin { background: #FFFBEB; border: 1px solid #FDE68A; padding: 16px; border-radius: 10px; margin-top: 16px; }
        .bloco-parcelas-admin h4 { font-size: 14px; color: #92400E; margin-bottom: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .legenda-status { display: flex; gap: 12px; margin-bottom: 10px; font-size: 12px; flex-wrap: wrap; }
        .legenda-status span { display: flex; align-items: center; gap: 4px; }
        .bolinha { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .bolinha-verde { background: var(--sucesso); }
        .bolinha-vermelha { background: var(--perigo); }
        .bolinha-amarela { background: var(--alerta); }

        .lista-parcelas-scroll { max-height: 220px; overflow-y: auto; padding-right: 6px; }
        .linha-parcela-edit { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 13px; flex-wrap: wrap; padding: 8px; border-radius: 6px; }
        .parc-paga { background: #D1FAE5 !important; border: 1px solid #6EE7B7 !important; }
        .parc-vencida { background: #FEE2E2 !important; border: 1px solid #FCA5A5 !important; }
        .parc-avencer { background: #FEF3C7 !important; border: 1px solid #FCD34D !important; }

        .linha-parcela-edit input { padding: 5px 8px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 4px; }
        .btn-baixa-parcela { padding: 6px 10px; font-size: 12px; background: var(--alerta); color: #1E293B; border-radius: 4px; font-weight: 600; cursor: pointer; white-space: nowrap; border: none; }
        .btn-baixa-paga { background: var(--sucesso) !important; color: white !important; }
        .btn-wpp-parcela { padding: 6px 10px; font-size: 12px; background: #25D366; color: white; border-radius: 4px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

        /* === BOTÕES PRINCIPAIS === */
        .botoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f1f5f9; }
        .btn { padding: 12px 18px; font-size: 14px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; }
        .btn-aprovar { background: var(--sucesso); color: white; }
        .btn-aprovar:hover { background: #059669; }
        .btn-manual { background: var(--alerta); color: #1E293B; }
        .btn-manual:hover { background: #EAB308; }
        .btn-reprovar { background: var(--perigo); color: white; }
        .btn-reprovar:hover { background: #DC2626; }
        .btn-whatsapp { background: #25D366; color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-whatsapp:hover { background: #20BA5A; }

        .vazio { text-align: center; color: var(--texto-claro); padding: 50px; font-size: 16px; }
        .carregando { text-align: center; padding: 40px; color: var(--texto-claro); display: none; font-size: 15px; }
        .sinc-indicador { text-align: right; font-size: 12px; color: var(--sucesso); margin-bottom: 12px; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="login">
    <h2>🔐 Acesso Administrativo</h2>
    <label style="font-weight:600; font-size:14px; color:#475569;">Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha">
    <button onclick="entrar()" class="btn-entrar">Entrar</button>
    <p id="erroLogin" class="erro">Senha incorreta!</p>
</div>

<!-- PAINEL PRINCIPAL -->
<div id="telaPainel" class="container">
    <div class="topo">
        <h1>📋 Painel de Controle</h1>
        <div class="topo-acoes">
            <span id="labelModo" class="label-modo" style="background: #D1FAE5; color: #065F46;">⚡ Modo Produção</span>
            <button onclick="alternarModo()" class="btn-topo">🔄 Alternar</button>
            <button onclick="alterarSenha()" class="btn-topo">🔑 Senha</button>
            <button onclick="sair()" class="btn-topo" style="background:#FEE2E2; color:#991B1B;">🚪 Sair</button>
        </div>
    </div>

    <!-- CAIXA DE TOTAIS -->
    <div class="caixa-totais">
        <div class="total-card">
            <div class="total-label">💰 Total de Propostas</div>
            <div class="total-valor" id="totalPropostas">0</div>
        </div>
        <div class="total-card">
            <div class="total-label total-ent">✅ Entradas Recebidas</div>
            <div class="total-valor total-ent" id="totalEntradas">R$ 0,00</div>
        </div>
        <div class="total-card">
            <div class="total-label total-falta">⏳ Valor a Receber</div>
            <div class="total-valor total-falta" id="totalFalta">R$ 0,00</div>
        </div>
    </div>

    <!-- BUSCA -->
    <div class="busca">
        <label>🔍 Buscar por CPF ou Código Único</label>
        <div class="busca-linha">
            <input type="text" id="busca" placeholder="Digite o CPF ou Código..." oninput="filtrar()">
            <button onclick="carregar()" class="btn-busca">🔄 Atualizar</button>
        </div>
    </div>

    <div id="sincStatus" class="sinc-indicador">✅ Atualização automática ativa</div>
    <div id="lista"></div>
    <div id="carregando" class="carregando">Carregando propostas...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
// ==============================================
// CONFIGURAÇÕES
// ==============================================
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const CHAVE_PIX = '33552949852';
const NOME_RECEBEDOR = 'FELIPE COSTA';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    realtime: { reconnect: true, timeout: 10000 }
});

let SENHA_ATUAL = localStorage.getItem('flash_senha') || 'flash2026';
let modoAtual = localStorage.getItem('flash_modo') || 'producao';
let propostas = [];
let canalRealtime = null;

// ==============================================
// INICIALIZAÇÃO
// ==============================================
window.onload = () => {
    atualizarLabelModo();
    if(localStorage.getItem('flash_logado') === 'true') {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregar();
        ativarRealtimeGeral();
    }
};

// ==============================================
// LOGIN / SENHA / MODO
// ==============================================
function entrar() {
    if (document.getElementById('senha').value === SENHA_ATUAL) {
        localStorage.setItem('flash_logado', 'true');
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregar();
        ativarRealtimeGeral();
    } else {
        document.getElementById('erroLogin').style.display = 'block';
    }
}

function sair() {
    localStorage.removeItem('flash_logado');
    if (canalRealtime) supabase.removeChannel(canalRealtime);
    window.location.reload();
}

function alterarSenha() {
    let nova = prompt('Digite a nova senha de acesso:');
    if (nova && nova.trim() !== '') {
        SENHA_ATUAL = nova.trim();
        localStorage.setItem('flash_senha', SENHA_ATUAL);
        alert('✅ Senha alterada com sucesso!');
    }
}

function alternarModo() {
    modoAtual = modoAtual === 'producao' ? 'teste' : 'producao';
    localStorage.setItem('flash_modo', modoAtual);
    atualizarLabelModo();
    carregar();
}

function atualizarLabelModo() {
    const lbl = document.getElementById('labelModo');
    if (modoAtual === 'producao') {
        lbl.textContent = '⚡ Modo Produção';
        lbl.style.background = '#D1FAE5';
        lbl.style.color = '#065F46';
    } else {
        lbl.textContent = '🧪 Modo Teste';
        lbl.style.background = '#FEF3C7';
        lbl.style.color = '#92400E';
    }
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatarData(dataStr) {
    if (!dataStr) return '--/--/----';
    return dataStr.split('-').reverse().join('/');
}

// ==============================================
// 🔄 ATUALIZAÇÃO AUTOMÁTICA EM TEMPO REAL
// ==============================================
function ativarRealtimeGeral() {
    if (canalRealtime) supabase.removeChannel(canalRealtime);

    canalRealtime = supabase.channel('painel_atualizacoes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'propostas' }, () => {
            console.log('🔄 Atualização detectada!');
            carregar();
        })
        .subscribe((status) => {
            if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
                setTimeout(ativarRealtimeGeral, 3000);
            }
        });
}

// ==============================================
// CARREGAR PROPOSTAS
// ==============================================
async function carregar() {
    document.getElementById('carregando').style.display = 'block';
    
    // Modo Teste — proposta de exemplo
    if (modoAtual === 'teste') {
        document.getElementById('carregando').style.display = 'none';
        propostas = [{
            id: 99999,
            nome: 'FELIPE COSTA',
            codigo_unico: 'CPF: 335.529.498-52',
            cpf: '33552949852',
            telefone: '35998845703',
            status: 'Aprovada',
            valor_desejado: 1500,
            percentual_entrada: 40,
            valor_entrada: 600,
            quantidade_parcelas: 2,
            juros: 6,
            entrada_paga: false,
            dados_parcelas: [
                { numero: 1, valor: 190.80, vencimento: '2026-09-06', paga: false },
                { numero: 2, valor: 190.80, vencimento: '2026-10-06', paga: false }
            ]
        }];
        processarExibicaoPropostas();
        return;
    }

    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .order('created_at', { ascending: false });

    document.getElementById('carregando').style.display = 'none';
    if (error) { alert('Erro ao carregar: ' + error.message); return; }

    propostas = data || [];
    processarExibicaoPropostas();
}

function processarExibicaoPropostas() {
    const totalEntradas = propostas.reduce((s, p) => s + Number(p.valor_entrada || 0), 0);
    const totalRestante = propostas.reduce((s, p) => {
        const total = Number(p.valor_desejado || 0);
        const entrada = Number(p.valor_entrada || 0);
        return s + (total - entrada);
    }, 0);

    document.getElementById('totalPropostas').textContent = propostas.length;
    document.getElementById('totalEntradas').textContent = real(totalEntradas);
    document.getElementById('totalFalta').textContent = real(totalRestante);

    filtrar();
}

function filtrar() {
    const busca = document.getElementById('busca').value.replace(/\D/g, '');
    let lista = propostas;
    if (busca.length >= 11) {
        lista = propostas.filter(p => (p.cpf || '').replace(/\D/g, '').includes(busca));
    } else if (busca.length >= 4) {
        lista = propostas.filter(p => (p.codigo_unico || '').toUpperCase().includes(busca.toUpperCase()));
    }
    document.getElementById('lista').innerHTML = lista.length === 0 
        ? '<p class="vazio">Nenhuma proposta encontrada</p>'
        : lista.map(criarCard).join('');
}

// ==============================================
// MONTAR CARD DA PROPOSTA
// ==============================================
function criarCard(p) {
    const statusCls = p.status === 'Aprovada' ? 'status-aprovada' : 
                       p.status === 'Reprovada' ? 'status-reprovada' : 'status-nova';
    const statusTxt = p.status === 'Aprovada' ? '✅ Aprovada' : 
                      p.status === 'Reprovada' ? '❌ Reprovada' : '⏳ Aguardando';

    const valorTotal = Number(p.valor_desejado || 0);
    const percEnt = Number(p.percentual_entrada || 20);
    const valorEnt = valorTotal * percEnt / 100;
    const parcelasQtd = Number(p.quantidade_parcelas || 1);
    const juros = Number(p.juros || 0);
    const saldo = valorTotal - valorEnt;
    const valParc = parcelasQtd > 0 ? saldo * (1 + juros / 100) / parcelasQtd : 0;

    const cpf = (p.cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    const telefone = (p.telefone || '').replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
    
    const linkPaginaCliente = `${window.location.origin.replace('painel.', '')}/consultar.html?cpf=${(p.cpf || '').replace(/\D/g, '')}`;

    // Fotos e documentos
    const selfieExibicao = p.selfie_cliente 
        ? `<img src="${p.selfie_cliente}" class="img-preview" onclick="abrirImagem('${p.selfie_cliente}')" alt="Selfie">` 
        : '<span class="sem-arquivo">📸 Não enviada</span>';
    const contratoExibicao = p.contrato_assinado 
        ? `<img src="${p.contrato_assinado}" class="img-preview" onclick="abrirImagem('${p.contrato_assinado}')" alt="Contrato">` 
        : '<span class="sem-arquivo">📄 Não assinado</span>';
    const qrExibicao = p.qr_code_entrada 
        ? `<img src="${p.qr_code_entrada}" class="img-preview" alt="QR Code">` 
        : '<span class="sem-arquivo">📲 Pendente</span>';

    // Cronograma de Parcelas
    let htmlParcelas = '';
    const dadosSalvos = p.dados_parcelas || [];
    const hojeStr = new Date().toISOString().split('T')[0];

    for (let i = 1; i <= parcelasQtd; i++) {
        let parcelaSalva = dadosSalvos.find(x => x.numero === i) || {};
        let valorItem = parcelaSalva.valor !== undefined ? parcelaSalva.valor : valParc;
        
        let vencPadrao = new Date();
        vencPadrao.setMonth(vencPadrao.getMonth() + i);
        let dataItem = parcelaSalva.vencimento || vencPadrao.toISOString().split('T')[0];
        let paga = parcelaSalva.paga ? true : false;
        
        let classeCor = 'parc-avencer';
        if (paga) classeCor = 'parc-paga';
        else if (dataItem < hojeStr) classeCor = 'parc-vencida';

        let estiloBtn = paga ? 'btn-baixa-parcela btn-baixa-paga' : 'btn-baixa-parcela';
        let textoBtn = paga ? '✅ Paga' : '⏳ Dar Baixa';
        let dataFormatada = formatarData(dataItem);

        let msgWpp = `Olá ${p.nome}! 💳 Sua ${i}ª parcela: ${real(valorItem)} · Venc: ${dataFormatada}\n${linkPaginaCliente}`;
        let linkWpp = `https://wa.me/55${(p.telefone || '').replace(/\D/g, '')}?text=${encodeURIComponent(msgWpp)}`;

        htmlParcelas += `
        <div class="linha-parcela-edit ${classeCor}" id="linha-parc-${p.id}-${i}">
            <strong style="width:40px; display:inline-block;">${i}ª</strong>
            <input type="number" step="0.01" id="p-val-${p.id}-${i}" value="${Number(valorItem).toFixed(2)}" style="width:90px;" title="Valor">
            <input type="date" id="p-data-${p.id}-${i}" value="${dataItem}" style="width:130px;" title="Vencimento">
            <button type="button" class="${estiloBtn}" onclick="alternarBaixaParcela(${p.id}, ${i})">${textoBtn}</button>
            <a href="${linkWpp}" target="_blank" class="btn-wpp-parcela">💬 Cobrar</a>
        </div>`;
    }

    return `
    <div class="proposta">
        <!-- CABEÇALHO -->
        <div class="proposta-topo">
            <div>
                <div class="proposta-nome">${p.nome} ${modoAtual === 'teste' ? '🧪 (TESTE)' : ''}</div>
                <div class="proposta-info">📌 ${p.codigo_unico || '---'} | 📄 CPF: ${cpf}</div>
                <div class="proposta-info">📞 ${telefone}</div>
            </div>
            <span class="status ${statusCls}">${statusTxt}</span>
        </div>

        <!-- FOTOS E DOCUMENTOS -->
        <div class="grid-midias">
            <div class="bloco-midia">
                <span>📸 Selfie de Rosto</span>${selfieExibicao}
            </div>
            <div class="bloco-midia">
                <span>✍️ Contrato Assinado</span>${contratoExibicao}
            </div>
            <div class="bloco-midia">
                <span>📲 QR Code Pix</span>${qrExibicao}
            </div>
        </div>

        <!-- DADOS DO CONTRATO -->
        <div class="grade">
            <div class="campo">
                <label>Valor Total (R$)</label>
                <input type="number" id="v-${p.id}" value="${valorTotal}" oninput="recalcular(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (%)</label>
                <input type="number" id="p-${p.id}" value="${percEnt}" oninput="recalcular(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (R$)</label>
                <input type="text" id="e-${p.id}" value="${real(valorEnt)}" readonly>
            </div>
            <div class="campo">
                <label>Parcelas (1-48)</label>
                <input type="number" id="par-${p.id}" value="${parcelasQtd}" min="1" max="48" oninput="recalcular(${p.id})">
            </div>
            <div class="campo">
                <label>Juros % ao mês</label>
                <input type="number" id="j-${p.id}" value="${juros}" step="0.01" oninput="recalcular(${p.id})">
            </div>
            <div class="campo">
                <label>Média Parcela</label>
                <input type="text" id="vp-${p.id}" value="${real(valParc)}" readonly>
            </div>
        </div>

        <!-- CRONOGRAMA DE PARCELAS -->
        <div class="bloco-parcelas-admin">
            <h4>📋 Cronograma de Parcelas (${parcelasQtd}x)</h4>
            <div class="legenda-status">
                <span><span class="bolinha bolinha-verde"></span> Paga</span>
                <span><span class="bolinha bolinha-amarela"></span> A vencer</span>
                <span><span class="bolinha bolinha-vermelha"></span> Vencida</span>
            </div>
            <div class="lista-parcelas-scroll">${htmlParcelas}</div>
        </div>

        <!-- BOTÕES PRINCIPAIS -->
        <div class="botoes">
            <button class="btn btn-aprovar" onclick="aprovarSalvar(${p.id})">✅ Aprovar + Salvar</button>
            <button class="btn btn-manual" onclick="marcarEntradaPaga(${p.id})">💰 Marcar Entrada Paga</button>
            <button class="btn btn-reprovar" onclick="reprovar(${p.id})">❌ Reprovar</button>
            <a href="https://wa.me/55${(p.telefone || '').replace(/\D/g, '')}?text=${encodeURIComponent(`Olá ${p.nome}! Sua proposta foi analisada! Acesse: ${linkPaginaCliente}`)}" target="_blank" class="btn btn-whatsapp">💬 WhatsApp Geral</a>
        </div>
    </div>`;
}

// ==============================================
// CÁLCULOS AUTOMÁTICOS
// ==============================================
function recalcular(id) {
    const valorTotal = Number(document.getElementById(`v-${id}`).value) || 0;
    const percEnt = Number(document.getElementById(`p-${id}`).value) || 0;
    const qtd = Number(document.getElementById(`par-${id}`).value) || 1;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;

    const valorEnt = valorTotal * percEnt / 100;
    const saldo = valorTotal - valorEnt;
    const valParc = qtd > 0 ? saldo * (1 + juros / 100) / qtd : 0;

    document.getElementById(`e-${id}`).value = real(valorEnt);
    document.getElementById(`vp-${id}`).value = real(valParc);
}

// ==============================================
// AÇÕES: APROVAR, REPROVAR, BAIXA
// ==============================================
async function aprovarSalvar(id) {
    alert('✅ Proposta aprovada e salva! (função conectada ao banco)');
    carregar();
}

async function marcarEntradaPaga(id) {
    alert('💰 Entrada marcada como paga! (função conectada ao banco)');
    carregar();
}

async function reprovar(id) {
    if (confirm('Tem certeza que deseja REPROVAR esta proposta?')) {
        alert('❌ Proposta reprovada!');
        carregar();
    }
}

function alternarBaixaParcela(idProposta, numParcela) {
    const btn = document.getElementById(`btn-pago-${idProposta}-${numParcela}`);
    const linha = document.getElementById(`linha-parc-${idProposta}-${numParcela}`);
    
    if (btn.classList.contains('btn-baixa-paga')) {
        btn.classList.remove('btn-baixa-paga');
        btn.textContent = '⏳ Dar Baixa';
        linha.classList.remove('parc-paga');
        linha.classList.add('parc-avencer');
    } else {
        btn.classList.add('btn-baixa-paga');
        btn.textContent = '✅ Paga';
        linha.classList.remove('parc-avencer', 'parc-vencida');
        linha.classList.add('parc-paga');
    }
}

function abrirImagem(url) {
    window.open(url, '_blank');
}
</script>
