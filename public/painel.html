<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <style>
        :root {
            --primary: #0A2463;
            --bg-body: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
            --card-sombra: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 20px; }

        @keyframes girar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .bolinha { width: 16px; height: 16px; border: 2px solid #ddd; border-top: 2px solid var(--primary); border-radius: 50%; animation: girar 0.8s linear infinite; display: inline-block; margin-right: 8px; }

        header { background: white; border-bottom: 1px solid var(--border-color); padding: 16px 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--card-sombra); }
        .cab { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .cab h1 { font-size: 20px; color: var(--primary); font-weight: 700; }
        .btn-sair { background: var(--perigo); color: white; padding: 8px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-sair:hover { background: #dc2626; transform: translateY(-1px); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
        .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: var(--card-sombra); transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .card h3 { color: var(--primary); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); font-size: 18px; display: flex; align-items: center; gap: 8px; }

        .lista { max-height: 400px; overflow-y: auto; border-radius: 12px; }
        .item { padding: 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; }
        .item:last-child { border-bottom: none; }
        .item:hover, .item.ativo { background: #f0f7ff; border-left: 4px solid var(--primary); padding-left: 18px; }
        .item.nova { border-left: 4px solid var(--alerta); }
        .item.aprovada { border-left: 4px solid var(--sucesso); }
        .item.recusada { border-left: 4px solid var(--perigo); }
        .item-nome { font-weight: 600; font-size: 15px; }
        .item-dados { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-badge.aprovada { background: #d1fae5; color: #065f46; }
        .status-badge.nova { background: #fef3c7; color: #92400e; }
        .status-badge.recusada { background: #fee2e2; color: #b91c1c; }

        .detalhes-grid { display: grid; gap: 10px; margin-bottom: 20px; }
        .dado { padding: 10px 0; border-bottom: 1px solid #f8fafc; font-size: 14px; }
        .dado strong { color: var(--primary); width: 140px; display: inline-block; font-weight: 600; }
        .dado span { color: var(--text-main); }

        .btn-group { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .btn-pequeno { flex: 1; min-width: 130px; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
        .btn-ap { background: var(--sucesso); color: white; }
        .btn-ap:hover { background: #059669; transform: translateY(-1px); }
        .btn-rec { background: var(--perigo); color: white; }
        .btn-rec:hover { background: #dc2626; transform: translateY(-1px); }
        .btn-whats { background: #25D366; color: white; }
        .btn-whats:hover { background: #128C7E; transform: translateY(-1px); }
        .btn-copiar { background: var(--primary); color: white; }
        .btn-copiar:hover { background: #081c4a; transform: translateY(-1px); }

        .aviso { padding: 14px; border-radius: 10px; margin-top: 12px; text-align: center; font-weight: 600; font-size: 14px; transition: opacity 0.3s; }
        .aviso.ok { background: #d1fae5; color: #065f46; border: 1px solid #10B981; }
        .aviso.erro { background: #fee2e2; color: #b91c1c; border: 1px solid #EF4444; }
        .sem-propostas { padding: 30px; text-align: center; color: var(--text-muted); font-size: 15px; }
    </style>
</head>
<body>

<header>
    <div class="cab">
        <h1>📋 FlashCred - Painel Administrativo</h1>
        <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
</header>

<div class="container">
    <div class="card">
        <h3>📨 Propostas Recebidas</h3>
        <div id="listaPropostas" class="lista">
            <div style="padding:30px;text-align:center;"><span class="bolinha"></span>Carregando dados...</div>
        </div>
    </div>

    <div class="card" id="detalhes" style="display:none;">
        <h3>👤 Dados Completos do Cliente</h3>
        <div class="detalhes-grid">
            <div class="dado"><strong>Nome Completo:</strong> <span id="dNome">—</span></div>
            <div class="dado"><strong>CPF:</strong> <span id="dCpf">—</span></div>
            <div class="dado"><strong>Data de Nascimento:</strong> <span id="dNasc">—</span></div>
            <div class="dado"><strong>WhatsApp:</strong> <span id="dTel">—</span></div>
            <div class="dado"><strong>CEP:</strong> <span id="dCep">—</span></div>
            <div class="dado"><strong>Endereço Completo:</strong> <span id="dEnd">—</span></div>
            <div class="dado"><strong>Valor Solicitado:</strong> <span id="dValor">—</span></div>
            <div class="dado"><strong>Status Atual:</strong> <span id="dStatus">—</span></div>
        </div>

        <div class="btn-group">
            <button class="btn-pequeno btn-ap" onclick="mudarStatus('Aprovada')">✅ Aprovar Proposta</button>
            <button class="btn-pequeno btn-rec" onclick="mudarStatus('Recusada')">❌ Recusar</button>
            <button class="btn-pequeno btn-whats" onclick="enviarWhats()">📤 Enviar por WhatsApp</button>
            <button class="btn-pequeno btn-copiar" onclick="copiarDados()">📋 Copiar Dados</button>
        </div>
        <div id="aviso" class="aviso"></div>
    </div>
</div>

<script>
// ⚙️ DADOS DO SEU PROJETO JÁ CONFIGURADOS
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';

let supabase = null;
let propostaSelecionada = null;

function iniciarSistema() {
    try {
        if (typeof window.supabase === 'undefined') {
            throw new Error('Biblioteca não carregou');
        }
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Conectado ao sistema FlashCred!');
        carregarDados();
        setInterval(carregarDados, 10000); // Atualiza automaticamente a cada 10 segundos
    } catch (erro) {
        document.getElementById('listaPropostas').innerHTML = `
            <div class="aviso erro">
                ❌ Erro: ${erro.message}<br>
                Atualize a página e tente novamente.
            </div>`;
    }
}

window.addEventListener('load', iniciarSistema);

async function carregarDados() {
    if (!supabase) return;
    try {
        const { data, error } = await supabase
            .from('propostas')
            .select('*')
            .order('id', { ascending: false });

        if (error) throw error;
        renderizarLista(data || []);
    } catch (erro) {
        document.getElementById('listaPropostas').innerHTML = `
            <div class="aviso erro">
                ❌ Não foi possível carregar<br>
                Motivo: ${erro.message}
            </div>`;
    }
}

function renderizarLista(lista) {
    const el = document.getElementById('listaPropostas');
    el.innerHTML = '';

    if (lista.length === 0) {
        el.innerHTML = '<div class="sem-propostas">📭 Nenhuma solicitação recebida ainda.</div>';
        return;
    }

    lista.forEach(item => {
        const div = document.createElement('div');
        div.className = `item ${item.status === 'Nova' ? 'nova' : item.status === 'Aprovada' ? 'aprovada' : 'recusada'}`;
        div.onclick = () => selecionar(item);
        
        const valorFormatado = Number(item.valor_solicitado || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        div.innerHTML = `
            <div>
                <div class="item-nome">${item.nome || 'Sem nome'}</div>
                <div class="item-dados">${item.cpf || 'Sem CPF'} | ${valorFormatado}</div>
            </div>
            <span class="status-badge ${item.status?.toLowerCase() || 'nova'}">${item.status || 'Em Análise'}</span>
        `;
        el.appendChild(div);
    });
}

function selecionar(p) {
    propostaSelecionada = p;
    document.querySelectorAll('.item').forEach(i => i.classList.remove('ativo'));
    event.currentTarget.classList.add('ativo');

    document.getElementById('detalhes').style.display = 'block';
    document.getElementById('dNome').textContent = p.nome || '—';
    document.getElementById('dCpf').textContent = p.cpf || '—';
    document.getElementById('dNasc').textContent = p.nascimento || '—';
    document.getElementById('dTel').textContent = p.telefone || '—';
    document.getElementById('dCep').textContent = p.cep || '—';
    document.getElementById('dEnd').textContent = p.endereco || '—';
    document.getElementById('dValor').textContent = Number(p.valor_solicitado || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
    document.getElementById('dStatus').textContent = p.status || 'Nova';
}

async function mudarStatus(novo) {
    if (!propostaSelecionada) {
        mostrarAviso('Selecione uma proposta na lista primeiro!', 'erro');
        return;
    }
    try {
        const { error } = await supabase
            .from('propostas')
            .update({ status: novo })
            .eq('id', propostaSelecionada.id);
        
        if (error) throw error;
        mostrarAviso(`✅ Proposta ${novo} com sucesso! O cliente já pode consultar o resultado.`, 'ok');
        await carregarDados();
    } catch (e) {
        mostrarAviso(`❌ Erro: ${e.message}`, 'erro');
    }
}

function enviarWhats() {
    if (!propostaSelecionada) {
        mostrarAviso('Selecione uma proposta primeiro!', 'erro');
        return;
    }
    const valor = Number(propostaSelecionada.valor_solicitado || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
    const texto = `Olá ${propostaSelecionada.nome}! Temos uma resposta sobre sua solicitação de crédito no valor de ${valor}. Status: ${propostaSelecionada.status}. Acesse: https://flashcred-sistema.onrender.com/consultar para ver todos os detalhes.`;
    const link = `https://wa.me/${propostaSelecionada.telefone?.replace(/\D/g,'') || ''}?text=${encodeURIComponent(texto)}`;
    window.open(link, '_blank');
}

function copiarDados() {
    if (!propostaSelecionada) return;
    const dados = `
NOME: ${propostaSelecionada.nome}
CPF: ${propostaSelecionada.cpf}
NASCIMENTO: ${propostaSelecionada.nascimento}
WHATSAPP: ${propostaSelecionada.telefone}
ENDEREÇO: ${propostaSelecionada.cep} - ${propostaSelecionada.endereco}
VALOR SOLICITADO: R$ ${propostaSelecionada.valor_solicitado}
STATUS: ${propostaSelecionada.status}
    `.trim();
    navigator.clipboard.writeText(dados).then(() => {
        mostrarAviso('📋 Dados copiados para a área de transferência!', 'ok');
    }).catch(() => {
        mostrarAviso('Não foi possível copiar os dados', 'erro');
    });
}

function mostrarAviso(texto, tipo='ok') {
    const av = document.getElementById('aviso');
    av.textContent = texto;
    av.className = `aviso ${tipo}`;
    av.style.display = 'block';
    setTimeout(() => av.style.display = 'none', 5000);
}

function sair() {
    localStorage.removeItem('logado_flash');
    window.location.reload();
}
</script>
</body>
</html>
