<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        azul: '#3B82F6'
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #F8FAFC; min-height: 100vh; font-size: 15px; }
        .cartao { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); padding: 16px; }
        .botao { padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; transition: 0.15s; }
        .botao-primario { background: #0A2463; color: white; }
        .botao-sucesso { background: #10B981; color: white; }
        .botao-alerta { background: #F59E0B; color: white; }
        .botao-perigo { background: #EF4444; color: white; }
        .botao-azul { background: #3B82F6; color: white; }
        .botao-cinza { background: #E5E7EB; color: #374151; }
        .linha-proposta { border-bottom: 1px solid #e2e8f0; padding: 10px 0; }
        .area-edicao { display:none; margin-top:15px; padding:12px; background:#f8fafc; border-radius:6px; border:1px solid #e2e8f0; }
        .area-edicao.ativa { display:block; }
        .resumo-valores { font-weight:bold; margin-top:8px; padding:8px; background:#ecfdf5; border-radius:4px; }
        .barra-resumo { background: white; border-radius: 8px; padding: 12px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
        .item-resumo { display: flex; flex-direction: column; font-size: 13px; }
        .item-resumo span:first-child { color: #64748B; }
        .item-resumo span:last-child { font-weight: bold; font-size: 15px; }
        .sininho { position: relative; cursor: pointer; }
        .contador-notif { position: absolute; top: -8px; right: -8px; background: #EF4444; color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
        .label-campo { font-size: 12px; color: #475569; margin-bottom: 2px; display:block; }
    </style>
</head>
<body class="p-3">

<div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-5">
        <h1 class="text-xl font-bold text-primary">⚙️ Painel FlashCred</h1>
        <button onclick="sair()" class="botao botao-cinza">Sair <i class="fas fa-sign-out-alt"></i></button>
    </div>

    <div id="areaLogin" class="cartao p-5 max-w-sm mx-auto">
        <h2 class="text-lg font-bold text-center mb-3">🔐 Acesso Restrito</h2>
        <input type="password" id="senha" placeholder="Digite a senha" class="w-full p-2 border rounded mb-3 text-center">
        <button onclick="entrar()" class="botao botao-primario w-full">Entrar</button>
    </div>

    <div id="areaPrincipal" class="hidden">
        <div class="barra-resumo" id="barraResumo">
            <div class="item-resumo">
                <span>💰 Total Recebido</span>
                <span id="totalRecebido" class="text-sucesso">R$ 0,00</span>
            </div>
            <div class="item-resumo">
                <span>⏳ A Receber</span>
                <span id="totalReceber" class="text-alerta">R$ 0,00</span>
            </div>
            <div class="item-resumo">
                <span>🧾 Parcelas Pagas</span>
                <span id="qtdPagas">0</span>
            </div>
            <div class="item-resumo">
                <span>📋 Aguardando</span>
                <span id="qtdPendentes">0</span>
            </div>
            <div class="sininho">
                <i class="fas fa-bell text-xl text-primary"></i>
                <div class="contador-notif" id="contadorNotif">0</div>
            </div>
        </div>

        <button onclick="abrirNovo()" class="botao botao-sucesso mb-3">➕ Nova Proposta</button>
        <div id="formNovo" class="area-edicao mb-4">
            <h3 class="font-bold mb-3">📝 Cadastrar Nova Proposta</h3>
            ${camposFormulario()}
            <div class="resumo-valores" id="resumoNovo"></div>
            <div class="flex gap-2 mt-3">
                <button onclick="salvarNovo()" class="botao botao-sucesso">Salvar Proposta</button>
                <button onclick="fecharNovo()" class="botao botao-cinza">Cancelar</button>
            </div>
        </div>
        <div id="listaPropostas"></div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

const SENHA = 'flash2026';
const LINK_CONSULTA = window.location.href.replace('painel.html','consultar.html');

let editandoId = null;

// ✅ CAMPOS COM NOMES CLAROS E ENDEREÇO COMPLETO
function camposFormulario() {
    return `
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
            <span class="label-campo">👤 Nome Completo do Cliente</span>
            <input type="text" id="nome" class="w-full p-2 border rounded">
        </div>
        <div>
            <span class="label-campo">📄 CPF do Cliente</span>
            <input type="text" id="cpf" maxlength="11" class="w-full p-2 border rounded">
        </div>
        <div>
            <span class="label-campo">📱 WhatsApp com DDD</span>
            <input type="text" id="whatsapp" maxlength="11" class="w-full p-2 border rounded">
        </div>
        <div>
            <span class="label-campo">🏠 CEP</span>
            <input type="text" id="cep" maxlength="8" class="w-full p-2 border rounded">
        </div>
        <div class="md:col-span-2">
            <span class="label-campo">📍 Endereço Completo (Rua, Número, Bairro)</span>
            <input type="text" id="endereco" class="w-full p-2 border rounded">
        </div>
        <div>
            <span class="label-campo">💵 Valor Total do Produto</span>
            <input type="number" id="valor_desejado" class="w-full p-2 border rounded" oninput="atualizarCalculo(this.closest('.area-edicao'))">
        </div>
        <div>
            <span class="label-campo">💸 Valor da Entrada</span>
            <input type="number" id="valor_entrada" class="w-full p-2 border rounded" oninput="atualizarCalculo(this.closest('.area-edicao'))">
        </div>
        <div>
            <span class="label-campo">📊 Juros Mensal em %</span>
            <input type="number" id="juros_mensal" value="5" class="w-full p-2 border rounded" oninput="atualizarCalculo(this.closest('.area-edicao'))">
        </div>
        <div>
            <span class="label-campo">🧾 Quantidade Máxima de Parcelas</span>
            <input type="number" id="quantidade_parcelas" min="1" max="48" class="w-full p-2 border rounded" oninput="atualizarCalculo(this.closest('.area-edicao'))">
        </div>
        <div>
            <span class="label-campo">🚚 Prazo de Entrega em Dias</span>
            <input type="number" id="dias_entrega" value="7" class="w-full p-2 border rounded">
        </div>
    </div>`;
}

function atualizarCalculo(bloco) {
    const valor = Number(bloco.querySelector('#valor_desejado').value) || 0;
    const entrada = Number(bloco.querySelector('#valor_entrada').value) || 0;
    const juros = Number(bloco.querySelector('#juros_mensal').value) || 0;
    const qtd = Number(bloco.querySelector('#quantidade_parcelas').value) || 1;

    const total = valor * (1 + juros / 100);
    const saldo = total - entrada;
    const valorParcela = qtd > 0 ? saldo / qtd : 0;

    bloco.querySelector('.resumo-valores').innerHTML = `
    💵 Total com juros: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})} | 
    📉 Saldo restante: R$ ${saldo.toLocaleString('pt-BR',{minimumFractionDigits:2})} | 
    🧾 ${qtd} parcelas de R$ ${valorParcela.toLocaleString('pt-BR',{minimumFractionDigits:2})}
    `;
}

function entrar() {
    if(document.getElementById('senha').value === SENHA) {
        document.getElementById('areaLogin').classList.add('hidden');
        document.getElementById('areaPrincipal').classList.remove('hidden');
        carregarPropostas();
        monitorarAtualizacoes();
    } else alert('Senha inválida!');
}
function sair() { location.reload(); }

async function carregarPropostas() {
    const {data} = await supabase.from('propostas').select('*').order('created_at', {ascending:false});
    if(!data) return;

    let totalRecebido = 0, totalReceber = 0, qtdPagas = 0, qtdPendentes = 0, novas = 0;

    data.forEach(item => {
        const valor = Number(item.valor_desejado||0);
        const entrada = Number(item.valor_entrada||0);
        const juros = Number(item.juros_mensal||5);
        const total = valor * (1 + juros / 100);

        if(item.entrada_paga) {
            totalRecebido += entrada;
            qtdPagas += Number(item.quantidade_parcelas||0);
        } else {
            totalReceber += total;
            qtdPendentes += Number(item.quantidade_parcelas||0);
        }
        if(item.status === 'Nova') novas++;
    });

    document.getElementById('totalRecebido').innerText = `R$ ${totalRecebido.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
    document.getElementById('totalReceber').innerText = `R$ ${totalReceber.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
    document.getElementById('qtdPagas').innerText = qtdPagas;
    document.getElementById('qtdPendentes').innerText = qtdPendentes;
    document.getElementById('contadorNotif').innerText = novas;

    let html = '';
    data.forEach(item => {
        const valor = Number(item.valor_desejado||0);
        const entrada = Number(item.valor_entrada||0);
        const juros = Number(item.juros_mensal||5);
        const qtd = Number(item.quantidade_parcelas||1);
        const total = valor * (1 + juros / 100);
        const parcela = (total - entrada) / qtd;

        html += `
        <div class="linha-proposta">
            <div>
                <strong>${item.nome || 'Sem nome'}</strong>
                <div class="text-sm text-gray-600">
                    CPF: ${(item.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')} | 
                    Tel: ${item.whatsapp||'Não informado'}
                </div>
                <div class="text-sm text-gray-600 mt-1">
                    📍 Endereço: ${item.endereco||'Não informado'} | CEP: ${item.cep||'Não informado'}
                </div>
                <div class="text-sm mt-1">
                    Valor: R$ ${valor.toLocaleString('pt-BR',{minFraction:2})} | Entrada: R$ ${entrada.toLocaleString('pt-BR',{minFraction:2})} | 
                    Total: R$ ${total.toLocaleString('pt-BR',{minFraction:2})} | ${qtd}x de R$ ${parcela.toLocaleString('pt-BR',{minFraction:2})}
                </div>
                ${item.entrada_paga ? `<div class="text-sm font-bold text-sucesso mt-1">✅ Entrada Paga</div>` : ''}
            </div>

            <div class="flex gap-2 flex-wrap mt-2">
                ${item.status !== 'Aprovada' ? `
                <button onclick="alterarStatus('${item.id}','Aprovada')" class="botao botao-sucesso text-white">Aprovar</button>
                <button onclick="alterarStatus('${item.id}','Reprovada')" class="botao botao-perigo text-white">Reprovar</button>
                ` : ''}

                <button onclick="editarAqui('${item.id}')" class="botao botao-azul text-white">Editar</button>
                <button onclick="enviarWhatsApp('${item.id}')" class="botao bg-green-600 text-white">WhatsApp</button>

                ${item.status === 'Aprovada' && !item.entrada_paga ? `
                <button onclick="marcarEntradaPaga('${item.id}')" class="botao botao-sucesso text-white font-bold">Marcar Entrada Paga</button>
                ` : ''}

                <button onclick="excluirProposta('${item.id}')" class="botao botao-perigo text-white">Excluir</button>
            </div>

            <div id="editar-${item.id}" class="area-edicao">
                <h3 class="font-bold mb-3">✏️ Alterar Dados da Proposta</h3>
                ${camposFormulario()}
                <div class="resumo-valores"></div>
                <div class="flex gap-2 mt-3">
                    <button onclick="salvarEdicao('${item.id}')" class="botao botao-sucesso">Salvar Alterações</button>
                    <button onclick="fecharEdicao('${item.id}')" class="botao botao-cinza">Cancelar</button>
                </div>
            </div>
        </div>`;
    });

    document.getElementById('listaPropostas').innerHTML = html || '<p class="text-center text-gray-500">Nenhuma proposta encontrada.</p>';
}

async function alterarStatus(id, status) {
    await supabase.from('propostas').update({status}).eq('id',id);
    carregarPropostas();
}

async function marcarEntradaPaga(id) {
    if(!confirm('Confirma recebimento da entrada?')) return;
    await supabase.from('propostas').update({entrada_paga:true, data_pagamento_entrada:new Date().toISOString()}).eq('id',id);
    alert('✅ Entrada confirmada!');
}

function enviarWhatsApp(id) {
    supabase.from('propostas').select('cpf,whatsapp').eq('id',id).single().then(({data}) => {
        if(!data?.whatsapp) return alert('Sem WhatsApp!');
        const msg = `Olá! Acesse sua proposta: ${LINK_CONSULTA}?cpf=${data.cpf}`;
        window.open(`https://wa.me/55${data.whatsapp}?text=${encodeURIComponent(msg)}`);
    });
}

function abrirNovo() { document.getElementById('formNovo').classList.add('ativa'); }
function fecharNovo() { document.getElementById('formNovo').classList.remove('ativa'); }

async function salvarNovo() {
    const dados = pegarDados(document.getElementById('formNovo'));
    await supabase.from('propostas').insert([dados]);
    fecharNovo(); carregarPropostas();
}

function editarAqui(id) {
    fecharTodasEdicoes();
    const bloco = document.getElementById(`editar-${id}`);
    bloco.classList.add('ativa');
    supabase.from('propostas').select('*').eq('id',id).single().then(({data}) => {
        if(!data) return;
        Object.keys(data).forEach(campo => {
            const el = bloco.querySelector(`#${campo}`);
            if(el) el.value = data[campo] || '';
        });
        atualizarCalculo(bloco);
    });
}

function fecharEdicao(id) { document.getElementById(`editar-${id}`).classList.remove('ativa'); }
function fecharTodasEdicoes() { document.querySelectorAll('.area-edicao').forEach(b => b.classList.remove('ativa')); }

async function salvarEdicao(id) {
    const dados = pegarDados(document.getElementById(`editar-${id}`));
    await supabase.from('propostas').update(dados).eq('id',id);
    fecharEdicao(id); carregarPropostas();
}

function pegarDados(bloco) {
    return {
        nome: bloco.querySelector('#nome').value.trim(),
        cpf: bloco.querySelector('#cpf').value.trim(),
        whatsapp: bloco.querySelector('#whatsapp').value.trim(),
        cep: bloco.querySelector('#cep').value.trim(),
        endereco: bloco.querySelector('#endereco').value.trim(),
        valor_desejado: Number(bloco.querySelector('#valor_desejado').value)||0,
        valor_entrada: Number(bloco.querySelector('#valor_entrada').value)||0,
        juros_mensal: Number(bloco.querySelector('#juros_mensal').value)||5,
        quantidade_parcelas: Number(bloco.querySelector('#quantidade_parcelas').value)||1,
        dias_entrega: Number(bloco.querySelector('#dias_entrega').value)||7,
        status: 'Nova', entrada_paga: false
    };
}

async function excluirProposta(id) {
    if(!confirm('Excluir essa proposta?')) return;
    await supabase.from('propostas').delete().eq('id',id);
    carregarPropostas();
}

function monitorarAtualizacoes() {
    supabase.channel('propostas').on('postgres_changes', {event:'*', schema:'public', table:'propostas'}, carregarPropostas).subscribe();
}
</script>
</body>
</html>
