<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #F8FAFC; min-height: 100vh; }
        .login-card { max-width: 420px; margin: 100px auto; padding: 32px; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(10,36,99,0.1); }
        .painel { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .btn { padding: 10px 16px; border-radius: 10px; border: none; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-danger { background: #EF4444; color: white; }
        .btn-success { background: #10B981; color: white; }
        .btn-warning { background: #F59E0B; color: white; }
        .input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; margin: 8px 0; font-size: 15px; }
        .tabela { width: 100%; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .tabela th, .tabela td { padding: 14px; text-align: left; border-bottom: 1px solid #F1F5F9; font-size: 14px; }
        .tabela th { background: #0A2463; color: white; font-weight: 600; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-weight: 500; font-size: 13px; }
        .status-Nova { background: #FEF3C7; color: #92400E; }
        .status-Aprovada { background: #D1FAE5; color: #065F46; }
        .status-Reprovada { background: #FEE2E2; color: #991B1B; }
        .carregando { text-align: center; padding: 40px; color: #64748B; }
        .erro { color: #DC2626; margin-top: 10px; display: none; }
        .atualizacao { text-align: right; font-size: 13px; color: #64748B; margin-bottom: 12px; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="login-card">
    <h2 class="text-2xl font-bold text-center text-primary mb-6">🔐 Acesso Administrativo</h2>
    <label class="font-medium text-primary">Senha de Acesso</label>
    <input type="password" id="senhaAdmin" class="input" placeholder="Digite a senha">
    <div id="erroLogin" class="erro">Senha incorreta!</div>
    <button onclick="fazerLogin()" class="btn btn-primary w-full mt-2">Entrar</button>
</div>

<!-- TELA DO PAINEL -->
<div id="telaPainel" class="painel">
    <div class="cabecalho">
        <div>
            <h1 class="text-2xl font-bold text-primary">📋 Propostas Recebidas</h1>
            <p class="text-sm text-gray-500">Atualizado automaticamente</p>
        </div>
        <button onclick="sairPainel()" class="btn btn-danger">Sair</button>
    </div>

    <div class="atualizacao" id="ultimaAtualizacao"></div>

    <div id="listaPropostas" class="tabela">
        <div class="carregando">Carregando propostas...</div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔒 SENHA PADRÃO (você pode alterar depois)
const SENHA_ADMIN = 'flashcred2026';

function fazerLogin() {
    const senha = document.getElementById('senhaAdmin').value;
    if(senha === SENHA_ADMIN) {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregarPropostas();
        // 🔄 ATUALIZA AUTOMÁTICO A CADA 15 SEGUNDOS
        setInterval(carregarPropostas, 15000);
    } else {
        document.getElementById('erroLogin').style.display = 'block';
    }
}

function sairPainel() {
    document.getElementById('telaPainel').style.display = 'none';
    document.getElementById('telaLogin').style.display = 'block';
    document.getElementById('senhaAdmin').value = '';
    document.getElementById('erroLogin').style.display = 'none';
}

async function carregarPropostas() {
    try {
        // BUSCA TODAS, DA MAIS NOVA PARA A MAIS VELHA
        const { data, error } = await supabase
            .from('propostas')
            .select('*')
            .order('id', { ascending: false });

        if(error) throw error;

        const lista = document.getElementById('listaPropostas');
        document.getElementById('ultimaAtualizacao').textContent = `Última verificação: ${new Date().toLocaleTimeString('pt-BR')}`;

        if(!data || data.length === 0) {
            lista.innerHTML = `<div class="carregando">Nenhuma proposta recebida ainda.</div>`;
            return;
        }

        // MONTA A TABELA COM TODOS OS DADOS
        let html = `
        <table style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Valor Solicitado</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>`;

        data.forEach(proposta => {
            html += `
            <tr>
                <td><strong>${proposta.id}</strong></td>
                <td>${proposta.nome}</td>
                <td>${proposta.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</td>
                <td>R$ ${parseFloat(proposta.valor_desejado).toFixed(2).replace('.', ',')}</td>
                <td><span class="status-badge status-${proposta.status || 'Nova'}">${proposta.status || 'Nova'}</span></td>
                <td>
                    <button onclick="alterarStatus(${proposta.id}, 'Aprovada')" class="btn btn-success text-xs py-1 px-2">Aprovar</button>
                    <button onclick="alterarStatus(${proposta.id}, 'Reprovada')" class="btn btn-danger text-xs py-1 px-2">Reprovar</button>
                </td>
            </tr>`;
        });

        html += `</tbody></table>`;
        lista.innerHTML = html;

    } catch(erro) {
        document.getElementById('listaPropostas').innerHTML = `<div class="carregando text-red-500">Erro ao carregar: ${erro.message}</div>`;
    }
}

// FUNÇÃO PARA MUDAR STATUS
async function alterarStatus(id, novoStatus) {
    if(!confirm(`Deseja marcar esta proposta como ${novoStatus}?`)) return;
    await supabase.from('propostas').update({ status: novoStatus }).eq('id', id);
    carregarPropostas();
}
</script>
</body>
</html>
