<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        modo_manual: '#3B82F6',
                        modo_teste: '#F59E0B',
                        modo_producao: '#10B981',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        texto: '#1E293B',
                        borda: '#E2E8F0'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 20px; border: 1px solid #E2E8F0; }
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .btn-cancelar { background: #E2E8F0; color: #1E293B; }
        .btn-excluir { background: #EF4444; color: white; }
        .btn-pendente { background: #F59E0B; color: white; }
        .btn-aprovar { background: #10B981; color: white; }
        .input { width: 100%; padding: 10px 12px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 14px; margin: 6px 0; }
        .input:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 2px rgba(10, 36, 99, 0.1); }
        .dados-cliente { border-left: 4px solid #0A2463; padding-left: 16px; margin-bottom: 20px; }
        .dados-cliente p { margin: 6px 0; font-size: 14px; }
        .dados-cliente strong { color: #0A2463; }
        .valores-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
        .resultado-valor { font-size: 18px; font-weight: 700; text-align: right; }
        .resultado-valor.pequeno { font-size: 16px; }
        .etiqueta-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-nova { background: #E0E7FF; color: #3730A3; }
        .status-aprovada { background: #D1FAE5; color: #065F46; }
        .status-pendente { background: #FEF3C7; color: #92400E; }
        .linha-botoes { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2 class="text-2xl font-bold text-primary mb-4">Valores e Condições</h2>

        <!-- Dados do Cliente -->
        <div class="dados-cliente">
            <p><strong>Nome:</strong> <span id="nomeCliente"></span></p>
            <p><strong>CPF:</strong> <span id="cpfCliente"></span></p>
            <p><strong>WhatsApp:</strong> <span id="whatsappCliente"></span></p>
            <p><strong>Status:</strong> <span id="statusCliente" class="etiqueta-status"></span></p>
        </div>

        <!-- Campos de Edição -->
        <div class="valores-grid">
            <div>
                <label class="block font-medium mb-1">VALOR SOLICITADO (R$)</label>
                <input type="number" step="0.01" id="valorSolicitado" class="input" placeholder="0,00">
            </div>
            <div>
                <label class="block font-medium mb-1">% ENTRADA</label>
                <input type="number" step="0.1" id="porcentagemEntrada" class="input" placeholder="0">
            </div>
            <div>
                <label class="block font-medium mb-1">% JUROS AO MÊS</label>
                <input type="number" step="0.01" id="jurosMes" class="input" placeholder="0">
            </div>
            <div>
                <label class="block font-medium mb-1">QUANTIDADE DE PARCELAS</label>
                <input type="number" min="1" max="48" id="quantidadeParcelas" class="input" placeholder="Até 48x">
            </div>
        </div>

        <!-- Resultados do Cálculo -->
        <div class="border-t border-b border-borda py-4 my-4">
            <p class="flex justify-between items-center mb-2">
                <span class="font-medium">Valor da Entrada:</span>
                <span id="valorEntrada" class="resultado-valor">R$ 0,00</span>
            </p>
            <p class="flex justify-between items-center mb-2">
                <span class="font-medium">Valor Total com Juros:</span>
                <span id="valorTotalComJuros" class="resultado-valor">R$ 0,00</span>
            </p>
            <p class="flex justify-between items-center">
                <span class="font-bold text-lg">Valor de Cada Parcela:</span>
                <span id="valorParcela" class="resultado-valor text-xl">R$ 0,00</span>
            </p>
        </div>

        <!-- Botões -->
        <div class="linha-botoes">
            <button class="btn btn-cancelar" id="btnCancelar">Cancelar</button>
            <button class="btn btn-excluir" id="btnExcluir">Excluir Proposta</button>
            <button class="btn btn-pendente" id="btnMarcarPendente">Marcar Pendente</button>
            <button class="btn btn-aprovar" id="btnSalvarAprovar">Salvar e Aprovar</button>
        </div>
    </div>
</div>

<script>
// Configuração Supabase
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let propostaId = null;

// ✅ FUNÇÃO DE CÁLCULO CORRIGIDA — APENAS 2 CASAS DECIMAIS
function calcularValores() {
    const valorSolicitado = parseFloat(document.getElementById('valorSolicitado').value) || 0;
    const porcentagemEntrada = parseFloat(document.getElementById('porcentagemEntrada').value) || 0;
    const jurosMes = parseFloat(document.getElementById('jurosMes').value) || 0;
    const quantidadeParcelas = parseInt(document.getElementById('quantidadeParcelas').value) || 1;

    // Cálculos
    const valorEntrada = (valorSolicitado * porcentagemEntrada) / 100;
    const valorFinanciado = valorSolicitado - valorEntrada;
    const montante = valorFinanciado * Math.pow((1 + (jurosMes / 100)), quantidadeParcelas);
    const valorTotalComJuros = parseFloat((valorEntrada + montante).toFixed(2));
    const valorParcela = parseFloat((montante / quantidadeParcelas).toFixed(2));

    // Atualiza na tela — formato brasileiro
    document.getElementById('valorEntrada').textContent = `R$ ${valorEntrada.toFixed(2).replace('.', ',')}`;
    document.getElementById('valorTotalComJuros').textContent = `R$ ${valorTotalComJuros.toFixed(2).replace('.', ',')}`;
    document.getElementById('valorParcela').textContent = `R$ ${valorParcela.toFixed(2).replace('.', ',')}`;
}

// ✅ CARREGA DADOS DA PROPOSTA INCLUINDO WHATSAPP
async function carregarProposta(id) {
    propostaId = id;
    const { data, error } = await supabase.from('propostas').select('*').eq('id', id).single();
    
    if (error) {
        alert('Erro ao carregar proposta: ' + error.message);
        return;
    }

    // Preenche dados do cliente
    document.getElementById('nomeCliente').textContent = data.nome || 'Não informado';
    document.getElementById('cpfCliente').textContent = data.cpf ? data.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : 'Não informado';
    document.getElementById('whatsappCliente').textContent = data.whatsapp || 'Não informado';
    document.getElementById('statusCliente').textContent = (data.status || 'NOVA').toUpperCase();
    document.getElementById('statusCliente').className = `etiqueta-status status-${(data.status || 'nova').toLowerCase()}`;

    // Preenche valores
    document.getElementById('valorSolicitado').value = data.valor_solicitado || '';
    document.getElementById('porcentagemEntrada').value = data.porcentagem_entrada || '';
    document.getElementById('jurosMes').value = data.juros_mes || '';
    document.getElementById('quantidadeParcelas').value = data.quantidade_parcelas || '';

    // Faz o cálculo automaticamente
    calcularValores();
}

// Atualiza cálculo quando alterar qualquer campo
document.getElementById('valorSolicitado').addEventListener('input', calcularValores);
document.getElementById('porcentagemEntrada').addEventListener('input', calcularValores);
document.getElementById('jurosMes').addEventListener('input', calcularValores);
document.getElementById('quantidadeParcelas').addEventListener('input', calcularValores);

// Ações dos botões
document.getElementById('btnSalvarAprovar').addEventListener('click', async () => {
    if(!propostaId) return;
    
    const valorSolicitado = parseFloat(document.getElementById('valorSolicitado').value) || 0;
    const porcentagemEntrada = parseFloat(document.getElementById('porcentagemEntrada').value) || 0;
    const jurosMes = parseFloat(document.getElementById('jurosMes').value) || 0;
    const quantidadeParcelas = parseInt(document.getElementById('quantidadeParcelas').value) || 1;
    const valorEntrada = (valorSolicitado * porcentagemEntrada) / 100;
    const valorFinanciado = valorSolicitado - valorEntrada;
    const montante = valorFinanciado * Math.pow((1 + (jurosMes / 100)), quantidadeParcelas);
    const valorTotalComJuros = parseFloat((valorEntrada + montante).toFixed(2));
    const valorParcela = parseFloat((montante / quantidadeParcelas).toFixed(2));

    const { error } = await supabase.from('propostas').update({
        valor_solicitado: valorSolicitado,
        porcentagem_entrada: porcentagemEntrada,
        juros_mes: jurosMes,
        quantidade_parcelas: quantidadeParcelas,
        valor_entrada: parseFloat(valorEntrada.toFixed(2)),
        valor_total_com_juros: valorTotalComJuros,
        valor_parcela: valorParcela,
        status: 'aprovada',
        data_aprovacao: new Date().toISOString()
    }).eq('id', propostaId);

    if(error) {
        alert('Erro ao salvar: ' + error.message);
    } else {
        alert('✅ Proposta salva e aprovada! Já aparece para o cliente automaticamente.');
        // Volta para lista ou atualiza
        window.location.reload();
    }
});

document.getElementById('btnMarcarPendente').addEventListener('click', async () => {
    if(!propostaId) return;
    const { error } = await supabase.from('propostas').update({ status: 'pendente' }).eq('id', propostaId);
    if(error) alert('Erro: ' + error.message);
    else window.location.reload();
});

document.getElementById('btnExcluir').addEventListener('click', async () => {
    if(!propostaId) return;
    if(confirm('Tem certeza que deseja excluir esta proposta?')) {
        const { error } = await supabase.from('propostas').delete().eq('id', propostaId);
        if(error) alert('Erro: ' + error.message);
        else window.location.href = 'painel.html';
    }
});

document.getElementById('btnCancelar').addEventListener('click', () => {
    window.history.back();
});

// Pega o ID da proposta na URL
const parametros = new URLSearchParams(window.location.search);
const idProposta = parametros.get('id');
if(idProposta) carregarProposta(idProposta);
</script>
</body>
</html>
