<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        modo_teste: '#F59E0B',
                        modo_producao: '#10B981',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        texto: '#1E293B',
                        textoClaro: '#64748B',
                        linha: '#E2E8F0'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', Arial, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; }

        .card { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 4px 16px rgba(10, 36, 99, 0.08); 
            padding: 24px; 
            margin-bottom: 20px; 
            border: 1px solid #E2E8F0; 
        }
        .btn { 
            padding: 10px 16px; 
            border-radius: 12px; 
            font-weight: 600; 
            border: none; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 14px; 
            margin: 4px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-editar { background: #3B82F6; color: white; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-perigo { background: #EF4444; color: white; }

        .input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #CBD5E1; 
            border-radius: 12px; 
            font-size: 15px; 
            background: #FAFBFC; 
            margin-bottom: 12px; 
        }
        .input:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10, 36, 99, 0.1); }
        .input-pequeno { max-width: 130px; text-align: center; }

        .aviso-sistema {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0A2463;
            color: white;
            padding: 16px 24px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            z-index: 9999;
            transform: translateX(120%);
            transition: transform 0.3s ease;
            max-width: 380px;
        }
        .aviso-sistema.mostrar { transform: translateX(0); }

        .modo-operacao {
            display: flex; gap: 12px; align-items: center; margin-bottom: 16px; padding: 12px; background: #F8FAFC; border-radius: 12px;
        }
        .modo-tag { padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; color: white; }
        .modo-teste-tag { background: #F59E0B; }
        .modo-producao-tag { background: #10B981; }

        .dados-cliente { 
            margin: 16px 0; 
            padding: 16px; 
            background: #F8FAFC; 
            border-radius: 16px; 
            border-left: 4px solid #0A2463; 
        }
        .dados-cliente p { padding: 6px 0; border-bottom: 1px dashed #E2E8F0; font-size: 14px; }
        .dados-cliente strong { color: #0A2463; font-weight: 600; }
        .nome-cliente { font-size: 20px; font-weight: 700; color: #0A2463; margin-bottom: 6px; }

        .linha-calculo { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            flex-wrap: wrap; 
            margin-bottom: 10px; 
            padding: 12px; 
            background: #F8FAFC; 
            border-radius: 12px; 
        }
        .resumo-calculo { 
            background: #ECFDF5; 
            border-left: 4px solid #10B981; 
            padding: 14px; 
            border-radius: 12px; 
            margin: 12px 0; 
        }
        .resumo-calculo p { font-size: 15px; padding: 4px 0; }
        .resumo-calculo strong { color: #065F46; font-size: 16px; }

        .modal { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); 
            display: none; align-items: center; justify-content: center; 
            z-index: 999; padding: 20px; 
        }
        .modal-conteudo { 
            background: white; border-radius: 20px; max-width: 620px; width: 100%; 
            max-height: 90vh; overflow-y: auto; padding: 28px; 
        }
        .cabecalho { 
            background: white; padding: 18px 24px; border-bottom: 1px solid #E2E8F0; 
            display: flex; justify-content: space-between; align-items: center; 
            flex-wrap: wrap; gap: 12px; border-radius: 0 0 20px 20px;
        }
        .area-login { 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            padding: 20px; background: linear-gradient(135deg, #0A2463 0%, #051236 100%); 
        }
        .esconder { display: none !important; }
    </style>
</head>
<body>

<div id="avisoSistema" class="aviso-sistema"></div>

<div id="telaLogin" class="area-login">
    <div class="card w-full max-w-md">
        <h2 class="text-xl font-bold text-center text-white mb-6">🔐 Acesso Administrativo</h2>
        <input type="password" id="senhaAdmin" class="input" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter')fazerLogin()">
        <div id="erroLogin" class="text-red-300 text-sm mb-3 esconder text-center">Senha incorreta!</div>
        <button class="btn btn-sucesso w-full" onclick="fazerLogin()">Entrar no Painel</button>
    </div>
</div>

<div id="painel" class="esconder">
    <div class="cabecalho">
        <div>
            <h1 class="text-lg font-bold text-primary">📋 Propostas Recebidas</h1>
            <div class="modo-operacao">
                <span class="modo-tag modo-teste-tag">Modo Teste</span>
                <span class="modo-tag modo-producao-tag">Modo Produção</span>
            </div>
        </div>
        <div>
            <button class="btn btn-alerta text-xs" onclick="alterarSenha()">Alterar Senha</button>
            <button class="btn btn-perigo text-xs" onclick="sair()">Sair</button>
        </div>
    </div>
    <div class="p-5 max-w-6xl mx-auto">
        <div id="listaPropostas"><p class="text-center text-textoClaro py-8">Carregando propostas...</p></div>
    </div>
</div>

<div id="modalEditar" class="modal">
    <div class="modal-conteudo">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-bold text-primary">Editar e Analisar Proposta</h3>
            <button class="text-xl text-textoClaro hover:text-perigo" onclick="fecharModalEditar()">&times;</button>
        </div>
        <div id="formModal"></div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { enabled: true } });

let senhaCorreta = 'flashcred2026';
let listaPropostas = [];

function mostrarAviso(texto) {
    const aviso = document.getElementById('avisoSistema');
    aviso.textContent = '🔔 ' + texto;
    aviso.classList.add('mostrar');
    setTimeout(() => aviso.classList.remove('mostrar'), 5000);
}

document.addEventListener('DOMContentLoaded', () => {
    if(sessionStorage.getItem('logadoAdmin') === 'sim') {
        document.getElementById('telaLogin').classList.add('esconder');
        document.getElementById('painel').classList.remove('esconder');
        carregarPropostas();
        iniciarAtualizacaoAutomatica();
    }
});

function fazerLogin() {
    if(document.getElementById('senhaAdmin').value.trim() === senhaCorreta) {
        sessionStorage.setItem('logadoAdmin', 'sim');
        document.getElementById('telaLogin').classList.add('esconder');
        document.getElementById('painel').classList.remove('esconder');
        carregarPropostas();
        iniciarAtualizacaoAutomatica();
    } else {
        document.getElementById('erroLogin').classList.remove('esconder');
    }
}
function sair() { sessionStorage.removeItem('logadoAdmin'); location.reload(); }
function alterarSenha() { const n = prompt('Digite a nova senha:'); if(n && n.length>=4) { senhaCorreta = n; alert('✅ Senha alterada com sucesso!'); } }
function limparNumeros(v) { return String(v||'').replace(/\D/g,''); }

// ✅ CÁLCULO COMPLETO COM ENTRADA E SOMA DAS PARCELAS
function atualizarCalculo() {
    const valorTotal = parseFloat(document.getElementById('valorTotal')?.value) || 0;
    const percEntrada = parseFloat(document.getElementById('percEntrada')?.value) || 0;
    const percJuros = parseFloat(document.getElementById('percJuros')?.value) || 0;
    const qtdParc = parseInt(document.getElementById('qtdParc')?.value) || 0;

    const valorEntrada = valorTotal * (percEntrada / 100);
    const valorComJuros = valorTotal * (1 + (percJuros / 100));
    const valorTotalParcelas = valorComJuros - valorEntrada;
    const valorParcela = qtdParc > 0 ? valorTotalParcelas / qtdParc : 0;

    if(document.getElementById('valorEntrada')) document.getElementById('valorEntrada').value = valorEntrada.toFixed(2);
    if(document.getElementById('valorTotalParcelas')) document.getElementById('valorTotalParcelas').value = valorTotalParcelas.toFixed(2);
    if(document.getElementById('valorParcela')) document.getElementById('valorParcela').value = valorParcela.toFixed(2);
    if(document.getElementById('mostraEntrada')) document.getElementById('mostraEntrada').textContent = valorEntrada.toFixed(2).replace('.', ',');
    if(document.getElementById('mostraTotalParcelas')) document.getElementById('mostraTotalParcelas').textContent = valorTotalParcelas.toFixed(2).replace('.', ',');
    if(document.getElementById('mostraParcela')) document.getElementById('mostraParcela').textContent = valorParcela.toFixed(2).replace('.', ',');

    const hoje = new Date();
    const dataPrimeira = new Date(hoje.setMonth(hoje.getMonth() + 1));
    const formatarData = (d) => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    if(document.getElementById('dataAprovacao')) document.getElementById('dataAprovacao').value = formatarData(new Date());
    if(document.getElementById('dataPrimeira')) document.getElementById('dataPrimeira').value = formatarData(dataPrimeira);
}

function iniciarAtualizacaoAutomatica() {
    supabase.channel('atualizacoes')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'propostas' }, () => {
            mostrarAviso('Nova proposta recebida!');
            carregarPropostas();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'propostas' }, () => {
            mostrarAviso('Proposta atualizada!');
            carregarPropostas();
        })
        .subscribe();
}

async function carregarPropostas() {
    const { data } = await supabase.from('propostas').select('*').order('created_at', { ascending: false });
    listaPropostas = data || [];
    renderizarLista();
}

function abrirModalEditar(cpf) {
    const p = listaPropostas.find(x => limparNumeros(x.cpf) === limparNumeros(cpf));
    if(!p) return;
    
    document.getElementById('formModal').innerHTML = `
        <div class="nome-cliente mb-3">${p.nome}</div>
        <div class="dados-cliente">
            <p><strong>CPF:</strong> ${p.cpf}</p>
            <p><strong>WhatsApp:</strong> ${limparNumeros(p.telefone||'')}</p>
            <p><strong>Valor Solicitado:</strong> R$ ${parseFloat(p.valor_desejado||0).toFixed(2).replace('.',',')}</p>
            <p><strong>Status Atual:</strong> ${p.status || 'Nova'}</p>
        </div>

        <div class="linha-calculo">
            <label>Valor Total (R$):</label>
            <input type="number" step="0.01" id="valorTotal" class="input input-pequeno" value="${p.valor_aprovado||p.valor_desejado||0}" oninput="atualizarCalculo()">
        </div>
        <div class="linha-calculo">
            <label>Entrada (%):</label>
            <input type="number" min="2" max="70" id="percEntrada" class="input input-pequeno" value="39" oninput="atualizarCalculo()">
        </div>
        <div class="linha-calculo">
            <label>Juros (% ao mês):</label>
            <input type="number" min="0" max="30" id="percJuros" class="input input-pequeno" value="6" oninput="atualizarCalculo()">
        </div>
        <div class="linha-calculo">
            <label>Qtd Parcelas (1 a 48):</label>
            <input type="number" min="1" max="48" id="qtdParc" class="input input-pequeno" value="${p.qtd_parcelas_escolhida||''}" placeholder="Defina" oninput="atualizarCalculo()">
        </div>

        <div class="resumo-calculo">
            <p>📅 <strong>Data da Aprovação:</strong> <input type="text" id="dataAprovacao" class="input input-pequeno" readonly></p>
            <p>📅 <strong>1º Vencimento:</strong> <input type="text" id="dataPrimeira" class="input input-pequeno" readonly></p>
            <hr class="my-2">
            <p>💸 <strong>Valor da Entrada:</strong> R$ <span id="mostraEntrada">0,00</span></p>
            <p>📊 <strong>Total das Parcelas:</strong> R$ <span id="mostraTotalParcelas">0,00</span></p>
            <p>📦 <strong>Valor de Cada Parcela:</strong> R$ <span id="mostraParcela">0,00</span></p>
        </div>

        <div class="flex flex-wrap gap-3 mt-4">
            <button class="btn btn-sucesso" onclick="salvarEProvar('${p.cpf}')">✅ Salvar e Aprovar</button>
            <button class="btn btn-alerta" onclick="fecharModalEditar()">Cancelar</button>
        </div>
    `;
    document.getElementById('modalEditar').style.display = 'flex';
    atualizarCalculo();
}

function fecharModalEditar() { document.getElementById('modalEditar').style.display = 'none'; }

async function salvarEProvar(cpf) {
    const qtd = parseInt(document.getElementById('qtdParc').value);
    if(!qtd || qtd < 1 || qtd > 48) {
        alert('⚠️ Informe a quantidade de parcelas entre 1 e 48!');
        return;
    }
    
    const dadosAtualizados = {
        valor_aprovado: parseFloat(document.getElementById('valorTotal').value),
        valor_entrada: parseFloat(document.getElementById('valorEntrada').value),
        valor_total_parcelas: parseFloat(document.getElementById('valorTotalParcelas').value),
        valor_parcela: parseFloat(document.getElementById('valorParcela').value),
        qtd_parcelas_escolhida: qtd,
        status: 'Aprovada'
    };

    const { error } = await supabase
        .from('propostas')
        .update(dadosAtualizados)
        .eq('cpf', limparNumeros(cpf));

    if(error) {
        alert('❌ Erro ao salvar: ' + error.message);
    } else {
        alert('✅ Proposta salva e aprovada com sucesso!');
        fecharModalEditar();
    }
}

function renderizarLista() {
    const container = document.getElementById('listaPropostas');
    container.innerHTML = '';
    if(listaPropostas.length === 0) { 
        container.innerHTML = '<p class="text-center text-textoClaro py-8">Nenhuma proposta encontrada.</p>'; 
        return; 
    }

    listaPropostas.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="nome-cliente">${p.nome}</div>
            <div class="dados-cliente">
                <p><strong>CPF:</strong> ${p.cpf}</p>
                <p><strong>Status:</strong> ${p.status || 'Nova'}</p>
                <p><strong>Valor Solicitado:</strong> R$ ${parseFloat(p.valor_desejado||0).toFixed(2).replace('.',',')}</p>
            </div>
            <div class="flex flex-wrap gap-2 mt-3">
                <button class="btn btn-editar" onclick="abrirModalEditar('${p.cpf}')"><i class="fa-solid fa-pen-to-square"></i> Editar / Analisar</button>
            </div>
        `;
        container.appendChild(card);
    });
}
</script>
</body>
</html>
