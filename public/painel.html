<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        modo_teste: '#F59E0B',
                        modo_producao: '#10B981'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; }
        .header { background: white; padding: 16px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .modo-tag { padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; color: white; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
        .busca { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .input { padding: 12px 16px; border: 1px solid #CBD5E1; border-radius: 12px; flex: 1; font-size: 15px; min-width: 220px; }
        .btn { padding: 10px 16px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-perigo { background: #EF4444; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-secundario { background: #E2E8F0; color: #0A2463; }
        .btn-whats { background: #25D366; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .dado { padding: 8px 0; font-size: 14px; border-bottom: 1px solid #F1F5F9; }
        .dado strong { color: #0A2463; min-width: 160px; display: inline-block; }
        .status { padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; display: inline-block; }
        .status.Nova { background: #FEF3C7; color: #92400E; }
        .status.Aprovada { background: #D1FAE5; color: #065F46; }
        .status.Recusada { background: #FEE2E2; color: #991B1B; }
        .status-parcela { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; display: inline-block; }
        .parcela-paga { background: #D1FAE5; color: #065F46; }
        .parcela-vencer { background: #FEF3C7; color: #92400E; }
        .parcela-atrasada { background: #FEE2E2; color: #991B1B; }
        .acoes { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .form-aprovacao { margin-top: 16px; padding-top: 16px; border-top: 1px solid #E2E8F0; display: none; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .grid-form label { font-size: 13px; font-weight: 600; color: #0A2463; margin-bottom: 4px; display: block; }
        .lista-parcelas { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #E2E8F0; display: none; }
        .item-parcela { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F8FAFC; font-size: 13px; flex-wrap: wrap; gap: 8px; }
        .spinner { width: 18px; height: 18px; border: 2px solid #ddd; border-top-color: white; border-radius: 50%; animation: girar 0.8s linear infinite; display: none; }
        @keyframes girar { to { transform: rotate(360deg); } }
        .sem-propostas { text-align: center; padding: 40px; color: #64748B; }
        .menu-usuario { display: flex; gap: 8px; align-items: center; }
        .modal-senha { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 999; }
        .modal-conteudo { background: white; padding: 24px; border-radius: 20px; max-width: 400px; width: 90%; }
        .grupo-botoes-modal { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center; gap: 12px;">
        <h1 class="text-xl font-bold text-primary">📋 Painel de Propostas - FlashCred</h1>
        <span id="modoSistema" class="modo-tag modo_teste">🔹 Modo Teste</span>
    </div>
    <div class="menu-usuario">
        <button id="btnAlterarSenha" class="btn btn-secundario text-sm">🔑 Alterar Senha</button>
        <button id="btnSair" class="btn btn-perigo text-sm">🚪 Sair</button>
    </div>
</div>

<div class="container">
    <div class="busca">
        <input type="text" id="campoBusca" class="input" placeholder="Buscar por Nome ou CPF...">
        <button id="btnBuscar" class="btn btn-primary">Buscar</button>
        <button id="btnVerTodas" class="btn btn-alerta">Ver Todas</button>
        <button id="btnAlternarModo" class="btn btn-secundario">🔄 Alternar Modo</button>
    </div>

    <div id="listaPropostas"></div>
</div>

<!-- Modal Alterar Senha -->
<div id="modalAlterarSenha" class="modal-senha">
    <div class="modal-conteudo">
        <h3 class="text-xl font-bold text-primary mb-4">Alterar Senha do Painel</h3>
        <label class="font-semibold text-sm text-primary">Senha Atual</label>
        <input type="password" id="senhaAtual" class="input" placeholder="Digite sua senha atual">
        <label class="font-semibold text-sm text-primary">Nova Senha</label>
        <input type="password" id="novaSenha" class="input" placeholder="Digite a nova senha">
        <label class="font-semibold text-sm text-primary">Confirmar Nova Senha</label>
        <input type="password" id="confirmaNovaSenha" class="input" placeholder="Repita a nova senha">
        <div class="grupo-botoes-modal">
            <button id="btnCancelarSenha" class="btn btn-secundario">Cancelar</button>
            <button id="btnSalvarSenha" class="btn btn-sucesso">Salvar Senha</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let propostas = [];
let senhaAtualPainel = 'flashcred2026';
let modoProducao = false;

function atualizarModo() {
    const tagModo = document.getElementById('modoSistema');
    const btnModo = document.getElementById('btnAlternarModo');
    if(modoProducao) {
        tagModo.textContent = '✅ Modo Produção';
        tagModo.className = 'modo-tag modo_producao';
        btnModo.textContent = '🔄 Voltar p/ Teste';
    } else {
        tagModo.textContent = '🔹 Modo Teste';
        tagModo.className = 'modo-tag modo_teste';
        btnModo.textContent = '🔄 Ir p/ Produção';
    }
}

async function carregarPropostas(busca = '') {
    const lista = document.getElementById('listaPropostas');
    lista.innerHTML = `<div class="sem-propostas">Carregando solicitações...</div>`;

    let query = supabase.from('propostas').select('*').order('id', { ascending: false });
    
    if (busca) {
        const termo = busca.replace(/\D/g, '');
        if (termo.length === 11) {
            query = query.or(`cpf.ilike.%${termo}%,cpf.ilike.%${busca}%`);
        } else {
            query = query.ilike('nome', `%${busca}%`);
        }
    }

    const { data, error } = await query;

    if (error) {
        lista.innerHTML = `<div class="sem-propostas text-perigo">❌ Erro ao carregar: ${error.message}</div>`;
        return;
    }

    propostas = data || [];
    renderizarPropostas();
}

function verificarStatusParcela(dataVencimento) {
    const hoje = new Date();
    const vencimento = new Date(dataVencimento);
    const diasParaVencer = Math.ceil((vencimento - hoje) / (1000 * 60 * 60 * 24));
    
    if (diasParaVencer < 0) return 'atrasada';
    if (diasParaVencer <= 3) return 'vencer';
    return 'paga'; // Ajuste conforme marcação de pagamento
}

function gerarListaParcelas(proposta) {
    if (!proposta.qtd_parcelas || proposta.qtd_parcelas < 1) return '';
    
    const valorParcela = proposta.valor_parcela || 0;
    const dataBase = new Date();
    dataBase.setDate(dataBase.getDate() + 7); // Primeira parcela vence em 7 dias
    
    let htmlParcelas = '';
    for(let i = 1; i <= proposta.qtd_parcelas; i++) {
        const dataVenc = new Date(dataBase);
        dataVenc.setMonth(dataVenc.getMonth() + (i - 1));
        const dataFormatada = dataVenc.toLocaleDateString('pt-BR');
        const status = verificarStatusParcela(dataVenc);
        
        htmlParcelas += `
        <div class="item-parcela">
            <span>📄 Parcela ${i}/${proposta.qtd_parcelas} • R$ ${valorParcela.toFixed(2).replace('.', ',')} • ${dataFormatada}</span>
            <span class="status-parcela parcela-${status}">
                ${status === 'paga' ? '✅ Paga' : status === 'vencer' ? '🟡 A vencer' : '🔴 Atrasada'}
            </span>
            <div style="display: flex; gap: 4px;">
                <button class="btn btn-whats btn-cobrar-parcela" data-tel="${proposta.telefone}" data-nome="${proposta.nome}" data-parcela="${i}" data-valor="${valorParcela.toFixed(2).replace('.', ',')}" data-data="${dataFormatada}">📱 Cobrar</button>
                <button class="btn btn-sucesso btn-marcar-pago" data-id="${proposta.id}" data-parcela="${i}">✓ Paga</button>
            </div>
        </div>`;
    }
    return htmlParcelas;
}

function renderizarPropostas() {
    const lista = document.getElementById('listaPropostas');
    
    if (propostas.length === 0) {
        lista.innerHTML = `<div class="sem-propostas">📭 Nenhuma solicitação encontrada.</div>`;
        return;
    }

    lista.innerHTML = propostas.map(proposta => `
        <div class="card">
            <div class="dado"><strong>Nome:</strong> ${proposta.nome}</div>
            <div class="dado"><strong>CPF:</strong> ${proposta.cpf}</div>
            <div class="dado"><strong>Nascimento:</strong> ${new Date(proposta.nascimento).toLocaleDateString('pt-BR')}</div>
            <div class="dado"><strong>Telefone/WhatsApp:</strong> ${proposta.telefone}</div>
            <div class="dado"><strong>CEP:</strong> ${proposta.cep}</div>
            <div class="dado"><strong>Endereço Completo:</strong> ${proposta.endereco}</div>
            <div class="dado"><strong>💰 Valor Desejado:</strong> R$ ${parseFloat(proposta.valor_desejado).toFixed(2).replace('.', ',')}</div>
            <div class="dado"><strong>Status:</strong> <span class="status ${proposta.status}">${proposta.status}</span></div>
            
            ${proposta.status === 'Aprovada' ? `
                <div class="dado"><strong>Valor Aprovado:</strong> R$ ${proposta.valor_aprovado ? parseFloat(proposta.valor_aprovado).toFixed(2).replace('.', ',') : '---'}</div>
                <div class="dado"><strong>Entrada:</strong> R$ ${proposta.valor_entrada ? parseFloat(proposta.valor_entrada).toFixed(2).replace('.', ',') : '---'}</div>
                <div class="dado"><strong>Parcelas:</strong> ${proposta.qtd_parcelas || '---'}x de R$ ${proposta.valor_parcela ? parseFloat(proposta.valor_parcela).toFixed(2).replace('.', ',') : '---'}</div>
                <div class="dado"><strong>Chave Pix:</strong> ${proposta.chave_pix || '---'}</div>
                <div class="dado"><strong>Modo Pagamento:</strong> ${proposta.modo_pagamento || (modoProducao ? '🔹 Produção' : '⚠️ Teste')}</div>
                
                <button class="btn btn-secundario mt-2 mb-2 btn-ver-parcelas" data-id="${proposta.id}">📋 Ver Parcelas e Cobranças</button>
                <div class="lista-parcelas" id="parcelas-${proposta.id}">
                    ${gerarListaParcelas(proposta)}
                </div>
            ` : ''}

            <div class="acoes">
                ${proposta.status === 'Nova' ? `
                    <button class="btn btn-sucesso btn-aprovar" data-id="${proposta.id}">✅ Aprovar</button>
                    <button class="btn btn-perigo btn-reprovar" data-id="${proposta.id}">❌ Recusar</button>
                ` : ''}
                <button class="btn btn-whats btn-whats-geral" data-telefone="${proposta.telefone}" data-nome="${proposta.nome}">📱 Enviar WhatsApp</button>
            </div>

            <div class="form-aprovacao" id="form-${proposta.id}">
                <h4 class="font-semibold text-primary mb-3">Preencha os dados da aprovação:</h4>
                <div class="grid-form">
                    <div>
                        <label>Valor Aprovado (R$)</label>
                        <input type="number" step="0.01" class="input campo-valor-aprovado" placeholder="0,00">
                    </div>
                    <div>
                        <label>Valor da Entrada (R$)</label>
                        <input type="number" step="0.01" class="input campo-entrada" placeholder="0,00">
                    </div>
                    <div>
                        <label>Quantidade de Parcelas (1 a 48)</label>
                        <input type="number" min="1" max="48" class="input campo-parcelas" placeholder="Até 48x">
                    </div>
                    <div>
                        <label>Valor de Cada Parcela (R$)</label>
                        <input type="number" step="0.01" class="input campo-valor-parcela" placeholder="0,00">
                    </div>
                </div>
                <div style="margin-bottom:12px;">
                    <label>Chave Pix para Pagamento ${modoProducao ? '(Produção - valor real)' : '(Teste - sem valor real)'}</label>
                    <input type="text" class="input campo-pix" placeholder="Sua chave Pix">
                </div>
                <button class="btn btn-sucesso btn-salvar-aprovacao" data-id="${proposta.id}">💾 Salvar Aprovação</button>
            </div>
        </div>
    `).join('');

    adicionarEventos();
}

function adicionarEventos() {
    document.getElementById('btnAlternarModo').addEventListener('click', () => {
        modoProducao = !modoProducao;
        atualizarModo();
        renderizarPropostas();
    });

    document.querySelectorAll('.btn-ver-parcelas').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const lista = document.getElementById(`parcelas-${id}`);
            lista.style.display = lista.style.display === 'block' ? 'none' : 'block';
            btn.textContent = lista.style.display === 'block' ? '📋 Ocultar Parcelas' : '📋 Ver Parcelas e Cobranças';
        });
    });

    document.querySelectorAll('.btn-cobrar-parcela').forEach(btn => {
        btn.addEventListener('click', () => {
            const tel = btn.dataset.tel.replace(/\D/g, '');
            const nome = btn.dataset.nome;
            const parcela = btn.dataset.parcela;
            const valor = btn.dataset.valor;
            const data = btn.dataset.data;
            const msg = `Olá ${nome}! Tudo bem? Passo para lembrar do pagamento da *Parcela ${parcela}* no valor de *R$ ${valor}*, com vencimento em ${data}. Pode efetuar o pagamento via Pix para mantermos tudo em dia? Obrigado!`;
            window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`, '_blank');
        });
    });

    document.querySelectorAll('.btn-marcar-pago').forEach(btn => {
        btn.addEventListener('click', () => {
            alert('✅ Parcela marcada como paga! Atualize a página para ver a alteração.');
            carregarPropostas();
        });
    });

    document.querySelectorAll('.btn-aprovar').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            document.getElementById(`form-${id}`).style.display = 'block';
        });
    });

    document.querySelectorAll('.btn-reprovar').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!confirm('Tem certeza que deseja recusar essa proposta?')) return;
            const id = btn.dataset.id;
            
            const { error } = await supabase
                .from('propostas')
                .update({ status: 'Recusada' })
                .eq('id', id);

            if (error) alert('Erro: ' + error.message);
            else carregarPropostas();
        });
    });

    document.querySelectorAll('.btn-salvar-aprovacao').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const card = btn.closest('.card');
            
            const dados = {
                status: 'Aprovada',
                valor_aprovado: parseFloat(card.querySelector('.campo-valor-aprovado').value) || 0,
                valor_entrada: parseFloat(card.querySelector('.campo-entrada').value) || 0,
                qtd_parcelas: parseInt(card.querySelector('.campo-parcelas').value) || 0,
                valor_parcela: parseFloat(card.querySelector('.campo-valor-parcela').value) || 0,
                chave_pix: card.querySelector('.campo-pix').value.trim(),
                modo_pagamento: modoProducao ? 'Produção' : 'Teste'
            };

            const { error } = await supabase
                .from('propostas')
                .update(dados)
                .eq('id', id);

            if (error) alert('❌ Erro ao salvar: ' + error.message);
            else {
                alert(`✅ Proposta aprovada e salva no ${modoProducao ? 'MODO PRODUÇÃO' : 'MODO TESTE'}! O cliente já pode consultar o resultado.`);
                carregarPropostas();
            }
        });
    });

    document.querySelectorAll('.btn-whats-geral').forEach(btn => {
        btn.addEventListener('click', () => {
            const tel = btn.dataset.telefone.replace(/\D/g, '');
            const nome = btn.dataset.nome;
            const msg = `Olá ${nome}! Recebemos sua solicitação de crédito pela FlashCred, vamos analisar e retornar em breve.`;
            window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`, '_blank');
        });
    });
}

document.getElementById('btnBuscar').addEventListener('click', () => {
    carregarPropostas(document.getElementById('campoBusca').value.trim());
});
document.getElementById('btnVerTodas').addEventListener('click', () => {
    document.getElementById('campoBusca').value = '';
    carregarPropostas();
});

document.getElementById('btnAlterarSenha').addEventListener('click', () => {
    document.getElementById('modalAlterarSenha').style.display = 'flex';
    document.getElementById('senhaAtual').value = '';
    document.getElementById('novaSenha').value = '';
    document.getElementById('confirmaNovaSenha').value = '';
});
document.getElementById('btnCancelarSenha').addEventListener('click', () => {
    document.getElementById('modalAlterarSenha').style.display = 'none';
});
document.getElementById('btnSalvarSenha').addEventListener('click', () => {
    const atual = document.getElementById('senhaAtual').value;
    const nova = document.getElementById('novaSenha').value;
    const confirma = document.getElementById('confirmaNovaSenha').value;

    if(atual !== senhaAtualPainel) {
        alert('❌ Senha atual incorreta!');
        return;
    }
    if(nova.length < 4) {
        alert('❌ Nova senha deve ter pelo menos 4 caracteres!');
        return;
    }
    if(nova !== confirma) {
        alert('❌ As senhas novas não coincidem!');
        return;
    }

    senhaAtualPainel = nova;
    alert('✅ Senha alterada com sucesso! Guarde bem a nova senha.');
    document.getElementById('modalAlterarSenha').style.display = 'none';
});

const senhaInformada = prompt('Digite a senha do painel:');
if (senhaInformada !== senhaAtualPainel) {
    alert('Senha incorreta! Você será redirecionado.');
    window.location.href = 'index.html';
}

document.getElementById('btnSair').addEventListener('click', () => {
    if(confirm('Deseja realmente sair do painel?')) {
        window.location.href = 'index.html';
    }
});

atualizarModo();
carregarPropostas();

setInterval(() => {
    if (!document.querySelector('.form-aprovacao[style*="block"]') && !document.querySelector('.modal-senha[style*="flex"]')) {
        carregarPropostas(document.getElementById('campoBusca').value.trim());
    }
}, 15000);
</script>
</body>
</html>
