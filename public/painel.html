<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        card: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; }
        .btn { padding: 8px 12px; border-radius: 10px; border: none; font-weight: 500; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-primary:hover { background: #081d45; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-perigo { background: #EF4444; color: white; }
        .btn-secundario { background: #E2E8F0; color: #0A2463; }
        .card { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 16px; }
        .input { width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 10px; margin: 6px 0; font-size: 14px; }
        .dado { padding: 6px 0; font-size: 14px; border-bottom: 1px solid #F1F5F9; }
        .dado strong { color: #0A2463; min-width: 140px; display: inline-block; }
        .status { padding: 4px 8px; border-radius: 6px; font-weight: 500; font-size: 12px; }
        .status.Nova { background: #FEF3C7; color: #92400E; }
        .status.Aprovada { background: #D1FAE5; color: #065F46; }
        .status.Recusada { background: #FEE2E2; color: #991B1B; }
        .status.Paga { background: #D1FAE5; color: #065F46; }
        .status.Pendente { background: #FEF3C7; color: #92400E; }
        .status.Atrasada { background: #FEE2E2; color: #991B1B; }
        .spinner { width: 18px; height: 18px; border: 3px solid #ddd; border-top-color: #0A2463; border-radius: 50%; animation: girar 0.8s linear infinite; display: inline-block; }
        @keyframes girar { to { transform: rotate(360deg); } }
        .barra-topo { background: #0A2463; color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 16px 16px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .grade-botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
        .modal-conteudo { background: white; border-radius: 16px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; }
        .login-tela { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .painel-conteudo { display: none; }
        .aviso-novo { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="login-tela">
    <div class="card w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-primary mb-6">🔐 Acesso Administrativo</h2>
        <label class="font-semibold text-sm text-primary">Senha de Acesso</label>
        <input type="password" id="senhaLogin" class="input" placeholder="Digite sua senha">
        <button id="btnEntrar" class="btn btn-primary w-full">Entrar</button>
    </div>
</div>

<!-- PAINEL PRINCIPAL -->
<div id="painelPrincipal" class="painel-conteudo">
    <div class="barra-topo">
        <h1 class="text-xl font-bold">📊 Painel FlashCred - Distribuidora Flash Point</h1>
        <div class="flex gap-2">
            <button id="btnAlterarSenha" class="btn btn-secundario">🔑 Senha</button>
            <button id="btnSair" class="btn btn-perigo">🚪 Sair</button>
        </div>
    </div>

    <div class="container">
        <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
            <h3 class="text-xl font-semibold text-primary">📋 Propostas Recebidas</h3>
            <button id="btnEnviarTodosLembretes" class="btn btn-alerta">🔔 Enviar Lembretes de Vencimento</button>
        </div>
        <div id="listaPropostas"></div>
    </div>
</div>

<!-- MODAL EDITAR PROPOSTA -->
<div id="modalEditar" class="modal">
    <div class="modal-conteudo">
        <h3 class="text-xl font-bold text-primary mb-4">✏️ Editar Proposta</h3>
        <div id="formEditar"></div>
        <div class="flex gap-2 mt-4">
            <button id="btnCancelarEditar" class="btn btn-secundario flex-1">Cancelar</button>
            <button id="btnSalvarEdicao" class="btn btn-sucesso flex-1">Salvar Alterações</button>
        </div>
    </div>
</div>

<!-- MODAL ALTERAR SENHA -->
<div id="modalSenha" class="modal">
    <div class="modal-conteudo max-w-md">
        <h3 class="text-xl font-bold text-primary mb-4">🔑 Alterar Senha</h3>
        <label class="font-semibold text-sm text-primary">Senha Atual</label>
        <input type="password" id="senhaAtual" class="input">
        <label class="font-semibold text-sm text-primary">Nova Senha</label>
        <input type="password" id="novaSenha" class="input">
        <label class="font-semibold text-sm text-primary">Repetir Nova Senha</label>
        <input type="password" id="confirmaNovaSenha" class="input">
        <div class="flex gap-2 mt-4">
            <button id="btnCancelarSenha" class="btn btn-secundario flex-1">Cancelar</button>
            <button id="btnSalvarSenha" class="btn btn-sucesso flex-1">Salvar Senha</button>
        </div>
    </div>
</div>

<script>
// ==============================
// CONFIGURAÇÕES
// ==============================
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// CONFIGURAÇÃO WHATSAPP BUSINESS (COLOQUE SEUS DADOS AQUI)
const CONFIG_WPP = {
    TOKEN: '', // COLOQUE SEU TOKEN DA API AQUI
    NUMERO_REMETENTE: '', // EX: 5535999998888
    DIAS_AVISO: 3,
    API_URL: 'https://graph.facebook.com/v18.0'
};

let senhaAdmin = 'flashcred2026'; // SENHA PADRÃO, VOCÊ ALTERA DEPOIS DE ENTRAR
let propostaEditarId = null;

// ==============================
// LOGIN
// ==============================
document.getElementById('btnEntrar').addEventListener('click', () => {
    const senha = document.getElementById('senhaLogin').value;
    if(senha === senhaAdmin) {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('painelPrincipal').style.display = 'block';
        carregarPropostas();
        setInterval(carregarPropostas, 15000); // ATUALIZA AUTOMÁTICO A CADA 15s
    } else {
        alert('❌ Senha incorreta!');
    }
});

// SAIR
document.getElementById('btnSair').addEventListener('click', () => {
    document.getElementById('painelPrincipal').style.display = 'none';
    document.getElementById('telaLogin').style.display = 'flex';
    document.getElementById('senhaLogin').value = '';
});

// ALTERAR SENHA
document.getElementById('btnAlterarSenha').addEventListener('click', () => {
    document.getElementById('modalSenha').style.display = 'flex';
});
document.getElementById('btnCancelarSenha').addEventListener('click', () => {
    document.getElementById('modalSenha').style.display = 'none';
});
document.getElementById('btnSalvarSenha').addEventListener('click', () => {
    const atual = document.getElementById('senhaAtual').value;
    const nova = document.getElementById('novaSenha').value;
    const confirma = document.getElementById('confirmaNovaSenha').value;
    if(atual !== senhaAdmin) return alert('❌ Senha atual incorreta!');
    if(nova.length < 4) return alert('❌ Nova senha muito curta!');
    if(nova !== confirma) return alert('❌ Senhas não coincidem!');
    senhaAdmin = nova;
    alert('✅ Senha alterada com sucesso!');
    document.getElementById('modalSenha').style.display = 'none';
    document.querySelectorAll('#modalSenha input').forEach(i => i.value = '');
});

// ==============================
// CARREGAR PROPOSTAS
// ==============================
async function carregarPropostas() {
    const { data, error } = await supabase
        .from('propostas')
        .select('*')
        .order('created_at', { ascending: false });

    if(error) return console.error('Erro ao carregar:', error);
    
    const lista = document.getElementById('listaPropostas');
    lista.innerHTML = '';

    if(!data || data.length === 0) {
        lista.innerHTML = '<div class="card text-center text-gray-500">Nenhuma proposta recebida ainda.</div>';
        return;
    }

    data.forEach(p => {
        const card = document.createElement('div');
        card.className = `card ${p.status === 'Nova' ? 'aviso-novo' : ''}`;
        card.innerHTML = `
            <div class="flex justify-between items-start flex-wrap gap-2 mb-3">
                <div>
                    <h4 class="text-lg font-bold text-primary">${p.nome || 'Sem nome'}</h4>
                    <span class="status ${p.status}">${p.status}</span>
                </div>
                <div class="text-sm text-gray-500">Protocolo: ${p.id?.slice(0,8) || '---'}</div>
            </div>
            <div class="dado"><strong>CPF:</strong> ${p.cpf || '---'}</div>
            <div class="dado"><strong>Nascimento:</strong> ${p.nascimento ? new Date(p.nascimento).toLocaleDateString('pt-BR') : '---'}</div>
            <div class="dado"><strong>Idade:</strong> ${p.idade || '---'} anos</div>
            <div class="dado"><strong>CEP / Endereço:</strong> ${p.cep || '---'} - ${p.endereco || '---'}, ${p.numero || '---'}</div>
            <div class="dado"><strong>Cidade/UF:</strong> ${p.cidade || '---'} / ${p.uf || '---'}</div>
            <div class="dado"><strong>WhatsApp:</strong> ${p.whatsapp || '---'}</div>
            <div class="dado"><strong>Valor Desejado:</strong> R$ ${parseFloat(p.valor_desejado || 0).toFixed(2).replace('.', ',')}</div>
            ${p.valor_aprovado ? `<div class="dado"><strong>Valor Aprovado:</strong> R$ ${parseFloat(p.valor_aprovado).toFixed(2).replace('.', ',')}</div>` : ''}
            ${p.valor_entrada ? `<div class="dado"><strong>Valor Entrada:</strong> R$ ${parseFloat(p.valor_entrada).toFixed(2).replace('.', ',')}</div>` : ''}
            ${p.qtd_parcelas ? `<div class="dado"><strong>Parcelas:</strong> ${p.qtd_parcelas}x de R$ ${parseFloat(p.valor_parcela || 0).toFixed(2).replace('.', ',')}</div>` : ''}
            ${p.chave_pix ? `<div class="dado"><strong>Chave Pix:</strong> <span class="font-mono text-xs">${p.chave_pix}</span></div>` : ''}
            <div class="dado"><strong>Contrato Aceito:</strong> ${p.contrato_aceito ? '✅ Sim' : '❌ Não'}</div>
            ${p.selfie_aceite ? `<div class="dado"><strong>Selfie:</strong> <button class="btn btn-secundario btn-ver-foto" data-id="${p.id}">👁️ Ver Foto</button></div>` : ''}
            <div class="grade-botoes">
                ${p.status === 'Nova' ? `
                    <button class="btn btn-sucesso btn-aprovar" data-id="${p.id}">✅ Aprovar</button>
                    <button class="btn btn-perigo btn-reprovar" data-id="${p.id}">❌ Reprovar</button>
                ` : ''}
                <button class="btn btn-alerta btn-editar" data-id="${p.id}">✏️ Editar</button>
                <button class="btn btn-primary btn-whatsapp" data-wpp="${p.whatsapp}" data-nome="${p.nome}" data-valor="${p.valor_aprovado || p.valor_desejado}" data-parcelas="${p.qtd_parcelas || ''}">📱 Enviar WPP</button>
                <button class="btn btn-secundario btn-copiar" data-texto="${encodeURIComponent(`Nome: ${p.nome}%0ACPFC: ${p.cpf}%0ATelefone: ${p.whatsapp}%0AValor: R$ ${p.valor_desejado}%0AEndereço: ${p.endereco || ''}`)}">📋 Copiar Dados</button>
                <button class="btn btn-perigo btn-excluir" data-id="${p.id}">🗑️ Excluir</button>
            </div>
        `;
        lista.appendChild(card);
    });

    adicionarEventosBotoes();
}

// ==============================
// AÇÕES DOS BOTÕES
// ==============================
function adicionarEventosBotoes() {
    // APROVAR
    document.querySelectorAll('.btn-aprovar').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const valorAprovado = prompt('Digite o valor total aprovado:');
            if(!valorAprovado) return;
            const valorEntrada = prompt('Digite o valor da entrada:');
            if(!valorEntrada) return;
            const qtdParcelas = prompt('Quantidade de parcelas (1 a 48):');
            if(!qtdParcelas || qtdParcelas < 1 || qtdParcelas > 48) return alert('Quantidade inválida!');
            const valorParcela = prompt('Valor de cada parcela:');
            if(!valorParcela) return;
            const chavePix = prompt('Digite a chave Pix para pagamento da entrada:');
            if(!chavePix) return;

            const { error } = await supabase.from('propostas').update({
                status: 'Aprovada',
                valor_aprovado: valorAprovado,
                valor_entrada: valorEntrada,
                qtd_parcelas: qtdParcelas,
                valor_parcela: valorParcela,
                chave_pix: chavePix
            }).eq('id', id);

            if(error) return alert('❌ Erro: ' + error.message);
            alert('✅ Proposta aprovada!');
            carregarPropostas();
        });
    });

    // REPROVAR
    document.querySelectorAll('.btn-reprovar').forEach(btn => {
        btn.addEventListener('click', async () => {
            if(!confirm('Deseja realmente reprovar essa proposta?')) return;
            const { error } = await supabase.from('propostas').update({ status: 'Recusada' }).eq('id', btn.dataset.id);
            if(error) return alert('❌ Erro: ' + error.message);
            alert('✅ Proposta reprovada!');
            carregarPropostas();
        });
    });

    // EDITAR
    document.querySelectorAll('.btn-editar').forEach(btn => {
        btn.addEventListener('click', async () => {
            propostaEditarId = btn.dataset.id;
            const { data } = await supabase.from('propostas').select('*').eq('id', propostaEditarId).single();
            if(!data) return;
            
            document.getElementById('formEditar').innerHTML = `
                <label class="font-semibold text-sm text-primary">Valor Aprovado</label>
                <input type="number" step="0.01" id="edt_valor_aprovado" class="input" value="${data.valor_aprovado || ''}">
                <label class="font-semibold text-sm text-primary">Valor da Entrada</label>
                <input type="number" step="0.01" id="edt_valor_entrada" class="input" value="${data.valor_entrada || ''}">
                <label class="font-semibold text-sm text-primary">Quantidade de Parcelas (1 a 48)</label>
                <input type="number" min="1" max="48" id="edt_qtd_parcelas" class="input" value="${data.qtd_parcelas || ''}">
                <label class="font-semibold text-sm text-primary">Valor de Cada Parcela</label>
                <input type="number" step="0.01" id="edt_valor_parcela" class="input" value="${data.valor_parcela || ''}">
                <label class="font-semibold text-sm text-primary">Chave Pix</label>
                <input type="text" id="edt_chave_pix" class="input" value="${data.chave_pix || ''}">
            `;
            document.getElementById('modalEditar').style.display = 'flex';
        });
    });

    // SALVAR EDIÇÃO
    document.getElementById('btnSalvarEdicao').addEventListener('click', async () => {
        const dados = {
            valor_aprovado: document.getElementById('edt_valor_aprovado').value,
            valor_entrada: document.getElementById('edt_valor_entrada').value,
            qtd_parcelas: document.getElementById('edt_qtd_parcelas').value,
            valor_parcela: document.getElementById('edt_valor_parcela').value,
            chave_pix: document.getElementById('edt_chave_pix').value
        };
        const { error } = await supabase.from('propostas').update(dados).eq('id', propostaEditarId);
        if(error) return alert('❌ Erro ao salvar: ' + error.message);
        alert('✅ Alterações salvas!');
        document.getElementById('modalEditar').style.display = 'none';
        carregarPropostas();
    });
    document.getElementById('btnCancelarEditar').addEventListener('click', () => {
        document.getElementById('modalEditar').style.display = 'none';
    });

    // ENVIAR WHATSAPP
    document.querySelectorAll('.btn-whatsapp').forEach(btn => {
        btn.addEventListener('click', () => {
            const wpp = btn.dataset.wpp?.replace(/\D/g, '');
            if(!wpp) return alert('❌ Sem número de WhatsApp!');
            const nome = btn.dataset.nome;
            const valor = btn.dataset.valor;
            const parcelas = btn.dataset.parcelas || 'a definir';
            const mensagem = `Olá ${nome}! Tudo bem? Sua proposta foi analisada e aprovada! Valor: R$ ${parseFloat(valor || 0).toFixed(2).replace('.', ',')}, parcelamento em ${parcelas}x. Acesse o link para conferir e finalizar: https://flashcred-sistema.onrender.com/consultar.html?cpf=SEUCPF`;
            window.open(`https://wa.me/55${wpp}?text=${encodeURIComponent(mensagem)}`, '_blank');
        });
    });

    // COPIAR DADOS
    document.querySelectorAll('.btn-copiar').forEach(btn => {
        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(decodeURIComponent(btn.dataset.texto));
            alert('✅ Dados copiados!');
        });
    });

    // EXCLUIR
    document.querySelectorAll('.btn-excluir').forEach(btn => {
        btn.addEventListener('click', async () => {
            if(!confirm('⚠️ Tem certeza que deseja EXCLUIR essa proposta? Essa ação não pode ser desfeita!')) return;
            const { error } = await supabase.from('propostas').delete().eq('id', btn.dataset.id);
            if(error) return alert('❌ Erro ao excluir: ' + error.message);
            alert('✅ Proposta excluída!');
            carregarPropostas();
        });
    });
}

// ==============================
// LEMBRETES AUTOMÁTICOS WHATSAPP
// ==============================
document.getElementById('btnEnviarTodosLembretes').addEventListener('click', async () => {
    if(!CONFIG_WPP.TOKEN || !CONFIG_WPP.NUMERO_REMETENTE) {
        return alert('⚠️ Configure o Token e Número do WhatsApp Business nas configurações do código primeiro!');
    }
    if(!confirm('Deseja enviar lembretes para todos os clientes com vencimento próximo?')) return;

    const hoje = new Date();
    const limite = new Date();
    limite.setDate(hoje.getDate() + CONFIG_WPP.DIAS_AVISO);

    const { data: propostas, error } = await supabase
        .from('propostas')
        .select('*')
        .eq('status', 'Aprovada')
        .eq('lembrete_enviado', false);

    if(error || !propostas) return alert('❌ Erro ao buscar dados');
    if(propostas.length === 0) return alert('✅ Nenhum lembrete para enviar');

    let enviados = 0;
    for(const p of propostas) {
        if(!p.whatsapp || !p.valor_parcela) continue;
        const mensagem = `📢 *LEMBRETE DE VENCIMENTO - FLASHCRED*

Olá ${p.nome}! Tudo bem?

Lembre-se da sua parcela no valor de *R$ ${parseFloat(p.valor_parcela).toFixed(2).replace('.', ',')}*.

💳 Pagamento via Pix:
\`${p.chave_pix || 'Sua chave Pix cadastrada'}\`

Acesse: https://flashcred-sistema.onrender.com/consultar.html para conferir.
*Distribuidora Flash Point*`;

        try {
            await fetch(`${CONFIG_WPP.API_URL}/${CONFIG_WPP.NUMERO_REMETENTE}/messages`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${CONFIG_WPP.TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ messaging_product: 'whatsapp', to: p.whatsapp.replace(/\D/g, ''), text: { body: mensagem } })
            });
            await supabase.from('propostas').update({ lembrete_enviado: true }).eq('id', p.id);
            enviados++;
            await new Promise(r => setTimeout(r, 1200));
        } catch(e) { console.error('Erro em', p.nome, e); }
    }
    alert(`✅ ${enviados} lembretes enviados com sucesso!`);
    carregarPropostas();
});
</script>
</body>
</html>
