<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; }
        .header { background: white; padding: 16px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
        .busca { display: flex; gap: 12px; margin-bottom: 24px; }
        .input { padding: 12px 16px; border: 1px solid #CBD5E1; border-radius: 12px; flex: 1; font-size: 15px; }
        .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-perigo { background: #EF4444; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .dado { padding: 8px 0; font-size: 14px; border-bottom: 1px solid #F1F5F9; }
        .dado strong { color: #0A2463; min-width: 160px; display: inline-block; }
        .status { padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; display: inline-block; }
        .status.Nova { background: #FEF3C7; color: #92400E; }
        .status.Aprovada { background: #D1FAE5; color: #065F46; }
        .status.Recusada { background: #FEE2E2; color: #991B1B; }
        .acoes { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .form-aprovacao { margin-top: 16px; padding-top: 16px; border-top: 1px solid #E2E8F0; display: none; }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .grid-form label { font-size: 13px; font-weight: 600; color: #0A2463; margin-bottom: 4px; display: block; }
        .spinner { width: 18px; height: 18px; border: 2px solid #ddd; border-top-color: white; border-radius: 50%; animation: girar 0.8s linear infinite; display: none; }
        @keyframes girar { to { transform: rotate(360deg); } }
        .sem-propostas { text-align: center; padding: 40px; color: #64748B; }
    </style>
</head>
<body>

<div class="header">
    <h1 class="text-xl font-bold text-primary">📋 Painel de Propostas - FlashCred</h1>
    <button id="btnSair" class="btn btn-perigo text-sm">Sair</button>
</div>

<div class="container">
    <div class="busca">
        <input type="text" id="campoBusca" class="input" placeholder="Buscar por Nome ou CPF...">
        <button id="btnBuscar" class="btn btn-primary">Buscar</button>
        <button id="btnVerTodas" class="btn btn-alerta">Ver Todas</button>
    </div>

    <div id="listaPropostas"></div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let propostas = [];

// Carregar todas as propostas ao abrir
async function carregarPropostas(busca = '') {
    const lista = document.getElementById('listaPropostas');
    lista.innerHTML = `<div class="sem-propostas">Carregando solicitações...</div>`;

    let query = supabase.from('propostas').select('*').order('id', { ascending: false });
    
    if (busca) {
        const termo = busca.replace(/\D/g, '');
        if (termo.length === 11) {
            query = query.ilike('cpf', `%${termo}%`);
        } else {
            query = query.ilike('nome', `%${busca}%`);
        }
    }

    const { data, error } = await query;

    if (error) {
        lista.innerHTML = `<div class="sem-propostas text-perigo">❌ Erro ao carregar: ${error.message}</div>`;
        return;
    }

    propostas = data || [];
    renderizarPropostas();
}

function renderizarPropostas() {
    const lista = document.getElementById('listaPropostas');
    
    if (propostas.length === 0) {
        lista.innerHTML = `<div class="sem-propostas">📭 Nenhuma solicitação encontrada.</div>`;
        return;
    }

    lista.innerHTML = propostas.map(proposta => `
        <div class="card">
            <div class="dado"><strong>Nome:</strong> ${proposta.nome}</div>
            <div class="dado"><strong>CPF:</strong> ${proposta.cpf}</div>
            <div class="dado"><strong>Nascimento:</strong> ${new Date(proposta.nascimento).toLocaleDateString('pt-BR')}</div>
            <div class="dado"><strong>Telefone/WhatsApp:</strong> ${proposta.telefone}</div>
            <div class="dado"><strong>CEP:</strong> ${proposta.cep}</div>
            <div class="dado"><strong>Endereço Completo:</strong> ${proposta.endereco}</div>
            <div class="dado"><strong>💰 Valor Desejado:</strong> R$ ${parseFloat(proposta.valor_desejado).toFixed(2).replace('.', ',')}</div>
            <div class="dado"><strong>Status:</strong> <span class="status ${proposta.status}">${proposta.status}</span></div>
            ${proposta.status === 'Aprovada' ? `
                <div class="dado"><strong>Valor Aprovado:</strong> R$ ${proposta.valor_aprovado ? parseFloat(proposta.valor_aprovado).toFixed(2).replace('.', ',') : '---'}</div>
                <div class="dado"><strong>Entrada:</strong> R$ ${proposta.valor_entrada ? parseFloat(proposta.valor_entrada).toFixed(2).replace('.', ',') : '---'}</div>
                <div class="dado"><strong>Parcelas:</strong> ${proposta.qtd_parcelas || '---'}x de R$ ${proposta.valor_parcela ? parseFloat(proposta.valor_parcela).toFixed(2).replace('.', ',') : '---'}</div>
                <div class="dado"><strong>Chave Pix:</strong> ${proposta.chave_pix || '---'}</div>
            ` : ''}

            <div class="acoes">
                ${proposta.status === 'Nova' ? `
                    <button class="btn btn-sucesso btn-aprovar" data-id="${proposta.id}">✅ Aprovar</button>
                    <button class="btn btn-perigo btn-reprovar" data-id="${proposta.id}">❌ Recusar</button>
                ` : ''}
                <button class="btn btn-alerta btn-whats" data-telefone="${proposta.telefone}" data-nome="${proposta.nome}">📱 Enviar WhatsApp</button>
            </div>

            <div class="form-aprovacao" id="form-${proposta.id}">
                <h4 class="font-semibold text-primary mb-3">Preencha os dados da aprovação:</h4>
                <div class="grid-form">
                    <div>
                        <label>Valor Aprovado (R$)</label>
                        <input type="number" step="0.01" class="input campo-valor-aprovado" placeholder="0,00">
                    </div>
                    <div>
                        <label>Valor da Entrada (R$)</label>
                        <input type="number" step="0.01" class="input campo-entrada" placeholder="0,00">
                    </div>
                    <div>
                        <label>Quantidade de Parcelas</label>
                        <input type="number" min="1" max="48" class="input campo-parcelas" placeholder="Até 48x">
                    </div>
                    <div>
                        <label>Valor de Cada Parcela (R$)</label>
                        <input type="number" step="0.01" class="input campo-valor-parcela" placeholder="0,00">
                    </div>
                </div>
                <div style="margin-bottom:12px;">
                    <label>Chave Pix para Pagamento</label>
                    <input type="text" class="input campo-pix" placeholder="Sua chave Pix">
                </div>
                <button class="btn btn-sucesso btn-salvar-aprovacao" data-id="${proposta.id}">💾 Salvar Aprovação</button>
            </div>
        </div>
    `).join('');

    adicionarEventos();
}

function adicionarEventos() {
    // Botão Aprovar
    document.querySelectorAll('.btn-aprovar').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            document.getElementById(`form-${id}`).style.display = 'block';
        });
    });

    // Botão Recusar
    document.querySelectorAll('.btn-reprovar').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!confirm('Tem certeza que deseja recusar essa proposta?')) return;
            const id = btn.dataset.id;
            
            const { error } = await supabase
                .from('propostas')
                .update({ status: 'Recusada' })
                .eq('id', id);

            if (error) alert('Erro: ' + error.message);
            else carregarPropostas();
        });
    });

    // Salvar Aprovação
    document.querySelectorAll('.btn-salvar-aprovacao').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const card = btn.closest('.card');
            
            const dados = {
                status: 'Aprovada',
                valor_aprovado: parseFloat(card.querySelector('.campo-valor-aprovado').value) || 0,
                valor_entrada: parseFloat(card.querySelector('.campo-entrada').value) || 0,
                qtd_parcelas: parseInt(card.querySelector('.campo-parcelas').value) || 0,
                valor_parcela: parseFloat(card.querySelector('.campo-valor-parcela').value) || 0,
                chave_pix: card.querySelector('.campo-pix').value.trim()
            };

            const { error } = await supabase
                .from('propostas')
                .update(dados)
                .eq('id', id);

            if (error) alert('❌ Erro ao salvar: ' + error.message);
            else {
                alert('✅ Proposta aprovada e salva! O cliente já pode consultar o resultado.');
                carregarPropostas();
            }
        });
    });

    // Enviar WhatsApp
    document.querySelectorAll('.btn-whats').forEach(btn => {
        btn.addEventListener('click', () => {
            const tel = btn.dataset.telefone.replace(/\D/g, '');
            const nome = btn.dataset.nome;
            const msg = `Olá ${nome}! Recebemos sua solicitação de crédito pela FlashCred, vamos analisar e retornar em breve.`;
            window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`, '_blank');
        });
    });
}

// Botões de busca
document.getElementById('btnBuscar').addEventListener('click', () => {
    carregarPropostas(document.getElementById('campoBusca').value.trim());
});
document.getElementById('btnVerTodas').addEventListener('click', () => {
    document.getElementById('campoBusca').value = '';
    carregarPropostas();
});

// Simples proteção de acesso (ajuste a senha quando quiser)
const senhaCorreta = 'flashcred2026';
const senhaInformada = prompt('Digite a senha do painel:');
if (senhaInformada !== senhaCorreta) {
    alert('Senha incorreta!');
    window.location.href = 'index.html';
}

// Sair
document.getElementById('btnSair').addEventListener('click', () => {
    window.location.href = 'index.html';
});

// Carregar ao abrir
carregarPropostas();

// Atualizar automaticamente a cada 15 segundos para aparecer novas propostas
setInterval(() => {
    if (!document.querySelector('.form-aprovacao[style*="block"]')) {
        carregarPropostas(document.getElementById('campoBusca').value.trim());
    }
}, 15000);
</script>
</body>
</html>
