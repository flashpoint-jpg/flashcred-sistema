<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        pix: '#32BCAD',
                        fundo: '#F8FAFC',
                        texto: '#1E293B',
                        muted: '#64748B',
                        borda: '#E2E8F0',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        teste: '#F59E0B',
                        producao: '#10B981'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .btn { padding: 10px 16px; border-radius: 10px; border: none; font-weight: 500; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-primary { background: #0A2463; color: white; }
        .btn-primary:hover { background: #081C4A; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-perigo { background: #EF4444; color: white; }
        .input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 14px; }
        .input:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10,36,99,0.15); }
        .etiqueta { font-weight: 600; margin-bottom: 6px; display: block; color: #0A2463; }
        .aviso-salvo { background: #ECFDF5; color: #065F46; padding: 10px; border-radius: 8px; text-align: center; margin-top: 8px; display: none; font-size: 13px; }
        .modo-selecionado { padding: 8px 12px; border-radius: 8px; font-weight: 600; color: white; display: inline-block; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="max-w-4xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-primary mb-6">⚙️ Configurações Rápidas</h1>

    <!-- 🎯 SELEÇÃO DE MODO -->
    <div class="card">
        <h3 class="text-lg font-semibold mb-3">Modo do Sistema</h3>
        <div class="flex gap-3 mb-4">
            <button type="button" id="btnModoTeste" class="btn" style="background: #F59E0B; color: white;" onclick="definirModo('teste')">🧪 Modo Teste</button>
            <button type="button" id="btnModoProducao" class="btn" style="background: #10B981; color: white;" onclick="definirModo('producao')">✅ Modo Produção</button>
        </div>
        <div id="textoModoAtual" class="modo-selecionado">Modo atual: <span id="modoTexto">—</span></div>
    </div>

    <!-- 🔑 CHAVES PIX -->
    <div class="card">
        <h3 class="text-lg font-semibold mb-4">🔑 Chaves Pix para Pagamento</h3>

        <div style="margin-bottom: 16px;">
            <label class="etiqueta">🧪 Chave Pix - Modo Teste</label>
            <input type="text" id="chavePixTeste" class="input" placeholder="Digite a chave Pix para testes (CPF, CNPJ, e-mail, telefone ou aleatória)">
        </div>

        <div style="margin-bottom: 16px;">
            <label class="etiqueta">✅ Chave Pix - Modo Produção</label>
            <input type="text" id="chavePixProducao" class="input" placeholder="Digite a chave Pix oficial que vai receber os pagamentos">
        </div>

        <button type="button" class="btn btn-sucesso" onclick="salvarConfiguracoes()">💾 Salvar Configurações</button>
        <div id="avisoSalvo" class="aviso-salvo">✅ Configurações salvas com sucesso!</div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Carrega o que já estava salvo ao abrir a página
window.addEventListener('load', () => {
    document.getElementById('chavePixTeste').value = localStorage.getItem('chavePixTeste') || '';
    document.getElementById('chavePixProducao').value = localStorage.getItem('chavePixProducao') || '';
    const modo = localStorage.getItem('modoSistema') || 'teste';
    atualizarVisualizacaoModo(modo);
});

function definirModo(modo) {
    localStorage.setItem('modoSistema', modo);
    atualizarVisualizacaoModo(modo);
}

function atualizarVisualizacaoModo(modo) {
    const texto = document.getElementById('modoTexto');
    if(modo === 'teste') {
        texto.textContent = '🧪 Teste';
        texto.parentElement.style.background = '#F59E0B';
    } else {
        texto.textContent = '✅ Produção';
        texto.parentElement.style.background = '#10B981';
    }
}

function salvarConfiguracoes() {
    const chaveTeste = document.getElementById('chavePixTeste').value.trim();
    const chaveProd = document.getElementById('chavePixProducao').value.trim();

    localStorage.setItem('chavePixTeste', chaveTeste);
    localStorage.setItem('chavePixProducao', chaveProd);

    const aviso = document.getElementById('avisoSalvo');
    aviso.style.display = 'block';
    setTimeout(() => aviso.style.display = 'none', 3500);
}
</script>
</body>
</html>
