<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        bg-body: '#F8FAFC',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #F8FAFC; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #E2E8F0; margin-bottom: 20px; }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-principal { background: #0A2463; color: white; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-perigo { background: #EF4444; color: white; }
        .btn-secundario { background: #64748B; color: white; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-modoteste { background: #F59E0B; color: white; }
        .btn-modoproducao { background: #10B981; color: white; }
        .btn-modoinativo { background: #CBD5E1; color: #475569; }
        .input { width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; margin: 6px 0; }
        .input:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 2px rgba(10,36,99,0.1); }
        .grid-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .grupo-botoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .grupo-botoes-acoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
        .dados-cliente p { margin: 4px 0; font-size: 15px; }
        .dados-cliente strong { color: #0A2463; }
        .status-aprovado { color: #10B981; font-weight: 600; }
        .status-analise { color: #F59E0B; font-weight: 600; }
        .status-reprovado { color: #EF4444; font-weight: 600; }
        .esconder { display: none !important; }
        .barra-topo { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: white; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .caixa-login { max-width: 420px; margin: 80px auto 0; padding: 30px; }
    </style>
</head>
<body>

<div id="telaLogin" class="esconder">
    <div class="container">
        <div class="card caixa-login">
            <h2 class="text-2xl font-bold text-primary text-center mb-6">🔐 Acesso Administrativo</h2>
            <label class="block text-sm font-medium mb-1">Senha de Acesso:</label>
            <input type="password" id="senhaLogin" class="input" placeholder="Digite sua senha">
            <button class="btn btn-principal w-full mt-2" onclick="fazerLogin()">🔑 Entrar</button>
        </div>
    </div>
</div>

<div id="painelPrincipal" class="esconder">
    <div class="container">
        <div class="barra-topo">
            <h1 class="text-xl font-bold text-primary">⚙️ Painel Administrativo - FlashCred</h1>
            <div class="flex gap-2">
                <button class="btn btn-secundario text-sm" onclick="abrirAlterarSenha()">🔑 Alterar Senha</button>
                <button class="btn btn-perigo text-sm" onclick="sairDoPainel()">🚪 Sair</button>
            </div>
        </div>

        <div class="grid-resumo">
            <div class="card">
                <p class="text-sm text-gray-500">💵 Total de Entradas Recebidas</p>
                <p class="text-2xl font-bold text-sucesso mt-1" id="totalEntradas">R$ 0,00</p>
            </div>
            <div class="card">
                <p class="text-sm text-gray-500">📊 Total a Receber</p>
                <p class="text-2xl font-bold text-primary mt-1" id="totalReceber">R$ 0,00</p>
            </div>
            <div class="card">
                <p class="text-sm text-gray-500">📦 Parcelas Pendentes</p>
                <p class="text-2xl font-bold text-alerta mt-1" id="totalPendentes">0</p>
            </div>
        </div>

        <div class="card">
            <h3 class="text-lg font-semibold mb-4">⚙️ Configuração de Pagamento</h3>
            <div class="flex flex-wrap gap-3 mb-4">
                <button id="btnModoTeste" class="btn btn-modoteste" onclick="selecionarModo('teste')">🧪 Modo Teste</button>
                <button id="btnModoProducao" class="btn btn-modoinativo" onclick="selecionarModo('producao')">✅ Modo Produção</button>
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium mb-1">Chave Pix / Token API:</label>
                <input type="text" id="chavePagamento" class="input" placeholder="Insira sua chave ou token aqui">
            </div>
            <button class="btn btn-principal w-full" onclick="salvarConfiguracao()">💾 Salvar Configuração</button>
        </div>

        <div class="card" id="areaEdicao">
            <div class="dados-cliente mb-4">
                <h4 class="text-xl font-bold text-primary" id="nomeCliente">Felipe Costa</h4>
                <p><strong>CPF:</strong> <span id="cpfCliente">335.529.498-52</span></p>
                <p><strong>Status:</strong> <span id="textoStatus" class="status-analise">Aguardando Análise</span></p>
                <p><strong>Valor Solicitado:</strong> R$ <span id="valorSolicitado">4.000,00</span></p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Qtd Parcelas (1 a 48):</label>
                    <input type="number" id="qtdParcelas" min="1" max="48" value="24" class="input">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Data da Aprovação:</label>
                    <input type="date" id="dataAprovacao" value="2026-08-03" class="input">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">1º Vencimento:</label>
                    <input type="date" id="primeiroVencimento" value="2026-09-03" class="input">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Valor da Entrada:</label>
                    <input type="text" id="valorEntrada" value="1560.00" class="input">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Total das Parcelas:</label>
                    <input type="text" id="totalParcelas" value="2680.00" readonly class="input bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Valor de Cada Parcela:</label>
                    <input type="text" id="valorCadaParcela" value="111.67" readonly class="input bg-gray-50">
                </div>
            </div>

            <div class="grupo-botoes mt-4">
                <button class="btn btn-sucesso" onclick="salvarEAprovar()">✅ Salvar e Aprovar</button>
                <button class="btn btn-perigo" onclick="marcarReprovado()">❌ Reprovar</button>
                <button class="btn btn-alerta" onclick="cancelarEdicao()">🔙 Cancelar</button>
            </div>

            <div class="grupo-botoes-acoes">
                <button class="btn btn-whatsapp" onclick="enviarWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </button>
                <button class="btn btn-secundario" onclick="copiarDados()">
                    <i class="fa-solid fa-copy"></i> Copiar
                </button>
                <button class="btn btn-secundario" onclick="imprimirProposta()">
                    <i class="fa-solid fa-print"></i> Imprimir
                </button>
                <button class="btn btn-perigo" onclick="excluirProposta()">
                    <i class="fa-solid fa-trash"></i> Excluir
                </button>
            </div>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let modoAtual = 'teste';
let propostaAtual = { id: 'id-exemplo', nome: 'Felipe Costa', cpf: '33552949852', telefone: '11999999999' };
let senhaCorreta = localStorage.getItem('senhaAdmin') || 'flashcred2026';

document.addEventListener('DOMContentLoaded', () => {
    const logado = sessionStorage.getItem('adminLogado');
    logado === 'sim' ? mostrarPainel() : mostrarLogin();
    carregarConfiguracoes();
});

function mostrarLogin() { document.getElementById('telaLogin').classList.remove('esconder'); document.getElementById('painelPrincipal').classList.add('esconder'); }
function mostrarPainel() { document.getElementById('telaLogin').classList.add('esconder'); document.getElementById('painelPrincipal').classList.remove('esconder'); calcularTotaisFinanceiros(); }
function fazerLogin() { const s = document.getElementById('senhaLogin').value.trim(); s === senhaCorreta ? (sessionStorage.setItem('adminLogado','sim'), mostrarPainel()) : (alert('❌ Senha incorreta'), document.getElementById('senhaLogin').value=''); }
function abrirAlterarSenha() { const n = prompt('Nova senha:'); if(n?.length>=4) { senhaCorreta=n; localStorage.setItem('senhaAdmin',n); alert('✅ Senha alterada'); } }
function sairDoPainel() { if(confirm('Sair?')) { sessionStorage.removeItem('adminLogado'); mostrarLogin(); document.getElementById('senhaLogin').value=''; } }

function carregarConfiguracoes() { const s = localStorage.getItem('configFlashCred'); if(s) { const c=JSON.parse(s); modoAtual=c.modo||'teste'; document.getElementById('chavePagamento').value=c.chave||''; atualizarBotoesModo(); } }
function selecionarModo(m) { modoAtual=m; atualizarBotoesModo(); }
function atualizarBotoesModo() { document.getElementById('btnModoTeste').className=`btn ${modoAtual==='teste'?'btn-modoteste':'btn-modoinativo'}`; document.getElementById('btnModoProducao').className=`btn ${modoAtual==='producao'?'btn-modoproducao':'btn-modoinativo'}`; }
function salvarConfiguracao() { const c=document.getElementById('chavePagamento').value.trim(); localStorage.setItem('configFlashCred',JSON.stringify({modo:modoAtual,chave:c,data:new Date().toISOString()})); alert(`✅ Salvo! Modo: ${modoAtual==='teste'?'Teste':'Produção'}`); }
function gerarCodigoPix() { const c=document.getElementById('chavePagamento').value.trim()||'33552949852'; const v=parseFloat(document.getElementById('valorEntrada').value)||0; return `00020126580014br.gov.bcb.pix0136${c}0214Entrada FlashCred5204000053039865802BR5925Distribuidora Flash Point6009Muzambinho62070503***6304${v.toFixed(2).replace('.','')}`; }

async function calcularTotaisFinanceiros() { try { const {data}=await supabase.from('propostas').select('valor_entrada,valor_parcela,status_pagamento'); let tE=0,tR=0,p=0; data.forEach(x=>{if(x.status_pagamento==='entrada_paga')tE+=Number(x.valor_entrada)||0; tR+=Number(x.valor_parcela)||0; if(x.status_pagamento!=='pago')p++; }); document.getElementById('totalEntradas').textContent=`R$ ${tE.toFixed(2).replace('.',',')}`; document.getElementById('totalReceber').textContent=`R$ ${tR.toFixed(2).replace('.',',')}`; document.getElementById('totalPendentes').textContent=p; } catch(e) { console.log('Sem dados'); } }

// ✅ SALVAR E APROVAR - AGORA ATUALIZA NO BANCO E RECARREGA
async function salvarEAprovar() {
    try {
        const qtdParc = parseInt(document.getElementById('qtdParcelas').value);
        const valorTotal = 4000;
        const valorEntrada = parseFloat(document.getElementById('valorEntrada').value) || 0;
        const valorComJuros = valorTotal * 1.06;
        const valorRestante = valorComJuros - valorEntrada;
        const valorParcela = valorRestante / qtdParc;
        const codigoPixGerado = gerarCodigoPix();

        const dados = {
            status: 'Aprovada',
            data_aprovacao: document.getElementById('dataAprovacao').value,
            primeiro_vencimento: document.getElementById('primeiroVencimento').value,
            qtd_parcelas_escolhida: qtdParc,
            valor_aprovado: valorTotal,
            valor_entrada: valorEntrada,
            total_parcelas: valorComJuros,
            valor_parcela: valorParcela,
            codigo_pix: codigoPixGerado,
            modo_pagamento: modoAtual,
            atualizado_em: new Date().toISOString()
        };

        const { error } = await supabase.from('propostas').update(dados).eq('id', propostaAtual.id);
        if(error) throw error;
        
        alert('✅ PROPOSTA APROVADA!\nJá está visível para o cliente.\nA página vai atualizar agora.');
        window.location.reload(); // ✅ Recarrega para mostrar a alteração real
    } catch(e) {
        alert('❌ Erro ao aprovar: ' + e.message);
    }
}

// ✅ REPROVAR
async function marcarReprovado() {
    if(confirm('Deseja REPROVAR essa proposta?')) {
        try {
            await supabase.from('propostas').update({status:'Reprovada', atualizado_em: new Date().toISOString()}).eq('id', propostaAtual.id);
            alert('✅ Proposta reprovada!');
            window.location.reload();
        } catch(e) { alert('❌ Erro: ' + e.message); }
    }
}

// ✅ EXCLUIR DEFINITIVAMENTE
async function excluirProposta() {
    if(confirm('⚠️ ATENÇÃO!\nEssa proposta será APAGADA DEFINITIVAMENTE do sistema.\nNão importa se está aprovada ou não, não tem volta!')) {
        try {
            const { error } = await supabase.from('propostas').delete().eq('id', propostaAtual.id);
            if(error) throw error;
            alert('✅ Proposta EXCLUÍDA com sucesso!');
            window.location.reload(); // ✅ Recarrega e some da lista
        } catch(e) {
            alert('❌ Erro ao excluir: ' + e.message);
            console.error('Erro exclusão:', e);
        }
    }
}

function enviarWhatsApp() {
    const msg = `Olá ${propostaAtual.nome}! Sua proposta foi APROVADA ✅\nValor Total: R$ 4.000,00\nEntrada: R$ ${parseFloat(document.getElementById('valorEntrada').value).toFixed(2).replace('.',',')}\nParcelamento: até ${document.getElementById('qtdParcelas').value}x\nAcesse: ${window.location.origin}/consultar.html`;
    window.open(`https://wa.me/55${propostaAtual.telefone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`);
}
function copiarDados() { navigator.clipboard.writeText(`Nome: ${propostaAtual.nome}\nCPF: ${propostaAtual.cpf}\nValor: R$ 4.000,00\nEntrada: R$ ${parseFloat(document.getElementById('valorEntrada').value).toFixed(2).replace('.',',')}`).then(()=>alert('✅ Copiado!')); }
function imprimirProposta() { window.print(); }
function cancelarEdicao() { alert('✅ Edição cancelada.'); }
</script>
</body>
</html>
