<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <!-- BIBLIOTECA FIXA E CONFIÁVEL -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/supabase.min.js"></script>
    <style>
        :root {
            --primary: #0A2463;
            --bg-body: #F8FAFC;
            --text-main: #1E293B;
            --border-color: #E2E8F0;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; }

        @keyframes girar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .bolinha { width: 18px; height: 18px; border: 2px solid #ddd; border-top: 2px solid var(--primary); border-radius: 50%; animation: girar 0.8s linear infinite; display: inline-block; margin-right: 6px; }

        .tela-login { position: fixed; inset: 0; background: linear-gradient(135deg, #0A2463, #153A8C); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card-login { background: white; padding: 32px; border-radius: 20px; width: 100%; max-width: 400px; }
        .card-login h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 15px; margin-bottom: 12px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; }
        .btn-entrar { background: var(--primary); color: white; }
        .erro { color: var(--perigo); text-align: center; display: none; margin-top: 8px; }

        header { background: white; border-bottom: 1px solid var(--border-color); padding: 16px; display: none; }
        .cab { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .btn-sair { background: var(--perigo); color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; display: none; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .card h3 { color: var(--primary); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }

        .lista { max-height: 350px; overflow-y: auto; }
        .item { padding: 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .item:hover, .item.ativo { background: #f0f4ff; border-left: 4px solid var(--primary); }
        .item.nova { border-left: 4px solid var(--alerta); }
        .item.aprovada { border-left: 4px solid var(--sucesso); }
        .item.recusada { border-left: 4px solid var(--perigo); }

        .dado { padding: 8px 0; border-bottom: 1px solid #f8fafc; }
        .dado strong { color: var(--primary); width: 120px; display: inline-block; }

        .btn-group { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .btn-pequeno { flex: 1; min-width: 120px; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .btn-ap { background: var(--sucesso); color: white; }
        .btn-rec { background: var(--perigo); color: white; }
        .btn-whats { background: #25D366; color: white; }

        .aviso { padding: 12px; border-radius: 10px; margin-top: 12px; text-align: center; display: none; font-weight: 600; }
        .aviso.ok { background: #d1fae5; color: #065f46; }
        .aviso.erro { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="tela-login">
    <div class="card-login">
        <h2>Acesso FlashCred</h2>
        <input type="password" id="senha" class="input" placeholder="Digite a senha">
        <button class="btn btn-entrar" onclick="logar()">Entrar</button>
        <div id="msgErro" class="erro">Senha incorreta ou erro de conexão</div>
    </div>
</div>

<header id="topo">
    <div class="cab">
        <strong style="color: var(--primary); font-size: 18px;">FlashCred - Painel Administrativo</strong>
        <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
</header>

<div class="container" id="conteudo">
    <div class="card">
        <h3>📋 Propostas Recebidas</h3>
        <div id="listaPropostas" class="lista">
            <div style="padding:20px;text-align:center;"><span class="bolinha"></span>Carregando dados...</div>
        </div>
    </div>

    <div class="card" id="detalhes" style="display:none;">
        <h3>👤 Dados do Cliente</h3>
        <div class="dado"><strong>Nome:</strong> <span id="dNome">—</span></div>
        <div class="dado"><strong>CPF:</strong> <span id="dCpf">—</span></div>
        <div class="dado"><strong>Nascimento:</strong> <span id="dNasc">—</span></div>
        <div class="dado"><strong>WhatsApp:</strong> <span id="dTel">—</span></div>
        <div class="dado"><strong>CEP / Endereço:</strong> <span id="dEnd">—</span></div>
        <div class="dado"><strong>Valor Solicitado:</strong> <span id="dValor">—</span></div>
        <div class="dado"><strong>Status:</strong> <span id="dStatus">—</span></div>

        <div class="btn-group">
            <button class="btn-pequeno btn-ap" onclick="mudarStatus('Aprovada')">✅ Aprovar</button>
            <button class="btn-pequeno btn-rec" onclick="mudarStatus('Recusada')">❌ Recusar</button>
            <button class="btn-pequeno btn-whats" onclick="enviarWhats()">📤 WhatsApp</button>
        </div>
        <div id="aviso" class="aviso"></div>
    </div>
</div>

<script>
// ⚙️ CONFIGURAÇÃO EXATA - NÃO ALTERE A MENOS QUE TENHA CERTEZA
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3mlU3W55Y2s0CjZtxXkT2VjR3K9Rz0NnI2s1M3p5X7z6bX7kY5aQ3dF2gH9jK8lL7mN6bV8cX7z9';
const SENHA = 'flashcred2026'; // ALTERE AQUI SE QUISER

// INICIA CONEXÃO COM O BANCO
let supabase;
try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false },
        global: { headers: { 'Access-Control-Allow-Origin': '*' } }
    });
} catch(e) {
    console.error('Erro ao iniciar Supabase:', e);
    document.getElementById('msgErro').textContent = 'Erro ao carregar sistema: ' + e.message;
    document.getElementById('msgErro').style.display = 'block';
}

let propostaSelecionada = null;

// VERIFICA SE JÁ ESTAVA LOGADO
window.addEventListener('load', () => {
    if(localStorage.getItem('logado_flash') === 'sim') {
        mostrarSistema();
    }
});

// LOGIN
function logar() {
    const s = document.getElementById('senha').value.trim();
    if(s === SENHA) {
        localStorage.setItem('logado_flash', 'sim');
        document.getElementById('msgErro').style.display = 'none';
        mostrarSistema();
    } else {
        document.getElementById('msgErro').style.display = 'block';
    }
}

function sair() {
    localStorage.removeItem('logado_flash');
    document.getElementById('telaLogin').style.display = 'flex';
    document.getElementById('topo').style.display = 'none';
    document.getElementById('conteudo').style.display = 'none';
    document.getElementById('senha').value = '';
}

async function mostrarSistema() {
    document.getElementById('telaLogin').style.display = 'none';
    document.getElementById('topo').style.display = 'block';
    document.getElementById('conteudo').style.display = 'block';
    await carregarDados();
    setInterval(carregarDados, 10000); // ATUALIZA A CADA 10 SEGUNDOS
}

// CARREGAR PROPOSTAS DO BANCO
async function carregarDados() {
    if(!supabase) return;
    try {
        const { data, error } = await supabase
            .from('propostas')
            .select('*')
            .order('id', { ascending: false });

        if(error) throw error;
        renderizarLista(data || []);
    } catch(e) {
        console.error('Erro ao buscar:', e);
        document.getElementById('listaPropostas').innerHTML = `<div style="padding:20px;text-align:center;color:var(--perigo);">Erro: ${e.message}<br>Verifique as permissões no Supabase!</div>`;
    }
}

function renderizarLista(lista) {
    const el = document.getElementById('listaPropostas');
    el.innerHTML = '';

    if(lista.length === 0) {
        el.innerHTML = '<div style="padding:20px;text-align:center;color:#64748B;">Nenhuma solicitação recebida ainda.</div>';
        return;
    }

    lista.forEach(item => {
        const div = document.createElement('div');
        div.className = `item ${item.status === 'Nova' ? 'nova' : item.status === 'Aprovada' ? 'aprovada' : 'recusada'}`;
        div.onclick = () => selecionar(item);
        div.innerHTML = `<strong>${item.nome}</strong><br><small>${item.cpf} | R$ ${Number(item.valor_solicitado||0).toLocaleString('pt-BR')} | ${item.status||'Nova'}</small>`;
        el.appendChild(div);
    });
}

function selecionar(p) {
    propostaSelecionada = p;
    document.querySelectorAll('.item').forEach(i => i.classList.remove('ativo'));
    event.currentTarget.classList.add('ativo');

    document.getElementById('detalhes').style.display = 'block';
    document.getElementById('dNome').textContent = p.nome || '—';
    document.getElementById('dCpf').textContent = p.cpf || '—';
    document.getElementById('dNasc').textContent = p.nascimento || '—';
    document.getElementById('dTel').textContent = p.telefone || '—';
    document.getElementById('dEnd').textContent = `${p.cep||''} - ${p.endereco||'—'}`;
    document.getElementById('dValor').textContent = Number(p.valor_solicitado||0).toLocaleString('pt-BR', {style:'currency',currency:'BRL'});
    document.getElementById('dStatus').textContent = p.status || 'Nova';
}

// ALTERAR STATUS
async function mudarStatus(novo) {
    if(!propostaSelecionada) {
        mostrarAviso('Selecione uma proposta primeiro!', 'erro');
        return;
    }

    try {
        const { error } = await supabase
            .from('propostas')
            .update({ status: novo })
            .eq('id', propostaSelecionada.id);

        if(error) throw error;
        mostrarAviso(`Proposta ${novo} com sucesso!`, 'ok');
        await carregarDados();
    } catch(e) {
        mostrarAviso('Erro: ' + e.message, 'erro');
    }
}

function enviarWhats() {
    if(!propostaSelecionada) return;
    const msg = encodeURIComponent(`Olá ${propostaSelecionada.nome}! Recebemos sua solicitação. Acesse: https://flashcred-sistema.onrender.com/consultar`);
    window.open(`https://wa.me/${propostaSelecionada.telefone.replace(/\D/g,'')}?text=${msg}`, '_blank');
}

function mostrarAviso(texto, tipo='ok') {
    const av = document.getElementById('aviso');
    av.textContent = texto;
    av.className = `aviso ${tipo}`;
    av.style.display = 'block';
    setTimeout(() => av.style.display = 'none', 4000);
}
</script>
</body>
</html>
