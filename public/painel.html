<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        modo_manual: '#3B82F6',
                        modo_teste: '#F59E0B',
                        modo_producao: '#10B981',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        texto: '#1E293B',
                        textoClaro: '#64748B',
                        linhaDivisoria: '#E2E8F0'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; }

        .card { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 4px 16px rgba(10, 36, 99, 0.08); 
            padding: 24px; 
            margin-bottom: 20px; 
            border: 1px solid #E2E8F0; 
            transition: all 0.2s ease;
        }
        .card:hover { box-shadow: 0 6px 20px rgba(10, 36, 99, 0.12); }

        .btn { 
            padding: 10px 16px; 
            border-radius: 12px; 
            font-weight: 500; 
            border: none; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 13px; 
            margin: 3px; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
        }
        .btn:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-primary { background: #0A2463; color: white; width: 100%; }
        .btn-editar { background: #3B82F6; color: white; }
        .btn-copiar { background: #6366F1; color: white; }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-perigo { background: #EF4444; color: white; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-imprimir { background: #8B5CF6; color: white; }
        .btn-excluir { background: #DC2626; color: white; }

        .input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #CBD5E1; 
            border-radius: 12px; 
            font-size: 15px; 
            background: #FAFBFC; 
            margin-bottom: 12px; 
            transition: border 0.2s;
        }
        .input:focus { outline: none; border-color: #0A2463; box-shadow: 0 0 0 3px rgba(10, 36, 99, 0.1); }
        .input-pequeno { max-width: 100px; text-align: center; }

        .bolinha-status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .bolinha-verde { background: #10B981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); }
        .bolinha-amarela { background: #F59E0B; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15); }
        .bolinha-vermelha { background: #EF4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15); }

        .badge { 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 600; 
            display: inline-block; 
            margin: 4px 0; 
        }
        .badge-nova { background: #FEF3C7; color: #92400E; }
        .badge-aprovada { background: #D1FAE5; color: #065F46; }
        .badge-reprovada { background: #FEE2E2; color: #991B1B; }

        .dados-cliente { 
            margin: 16px 0; 
            padding: 16px; 
            background: #F8FAFC; 
            border-radius: 16px; 
            border-left: 4px solid #0A2463; 
        }
        .dados-cliente p { 
            padding: 6px 0; 
            border-bottom: 1px dashed #E2E8F0; 
            font-size: 14px; 
        }
        .dados-cliente p:last-child { border-bottom: none; }
        .dados-cliente strong { color: #0A2463; font-weight: 600; }

        .nome-cliente { 
            font-size: 20px; 
            font-weight: 700; 
            color: #0A2463; 
            margin-bottom: 6px; 
            display: block; 
        }

        .notificacao { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 9999; 
            padding: 16px 22px; 
            border-radius: 14px; 
            font-weight: 600; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.18); 
            transform: translateX(120%); 
            transition: transform 0.3s ease; 
            max-width: 380px; 
            color: #FFFFFF !important;
        }
        .notificacao.sucesso { background: #10B981; }
        .notificacao.alerta { background: #F59E0B; }
        .notificacao.perigo { background: #EF4444; }
        .notificacao.mostrar { transform: translateX(0); }

        .resumo-valores { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 16px; 
            margin-bottom: 24px; 
        }
        .resumo-card { 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            text-align: center; 
            border-left: 5px solid; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .resumo-card h4 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .resumo-card p { font-size: 13px; color: #64748B; font-weight: 500; }

        .linha-calculo { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            flex-wrap: wrap; 
            margin-bottom: 10px; 
            padding: 12px; 
            background: #F8FAFC; 
            border-radius: 12px; 
        }
        .area-busca { 
            margin-bottom: 20px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            flex-wrap: wrap; 
        }

        .modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.6); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 999; 
            padding: 20px; 
        }
        .modal-conteudo { 
            background: white; 
            border-radius: 20px; 
            max-width: 620px; 
            width: 100%; 
            max-height: 90vh; 
            overflow-y: auto; 
            padding: 28px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .cabecalho { 
            background: white; 
            padding: 18px 24px; 
            border-bottom: 1px solid #E2E8F0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            flex-wrap: wrap; 
            gap: 12px; 
            border-radius: 0 0 20px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .area-modo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn-modo { padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; color: white; }

        .area-login { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            background: linear-gradient(135deg, #0A2463 0%, #051236 100%); 
        }
        .hidden { display: none !important; }
        label { font-weight: 600; margin-bottom: 6px; display: inline-block; color: #334155; }

        @media print {
            body * { visibility: hidden; }
            .impressao-contrato, .impressao-contrato * { visibility: visible; }
            .impressao-contrato { position: absolute; left: 0; top: 0; width: 100%; padding: 30px; }
            .btn, .cabecalho, .area-busca, .resumo-valores { display: none !important; }
        }
    </style>
</head>
<body>

<div id="notificacao" class="notificacao"></div>

<div id="telaLogin" class="area-login">
    <div class="card w-full max-w-md">
        <h2 class="text-xl font-bold text-center text-primary mb-6">🔐 Acesso Administrativo</h2>
        <label class="text-white">Senha de Acesso</label>
        <input type="password" id="senhaAdmin" class="input" placeholder="Digite sua senha de acesso" onkeydown="if(event.key === 'Enter') fazerLogin()">
        <div id="erroLogin" class="text-perigo text-sm mb-3 hidden">Senha incorreta! Tente novamente.</div>
        <button id="btnEntrar" class="btn btn-primary mt-2" onclick="fazerLogin()">Entrar no Sistema</button>
    </div>
</div>

<div id="painel" class="hidden">
    <div class="cabecalho">
        <div><h1 class="text-lg font-bold text-primary">📋 Propostas e Pagamentos</h1></div>
        <div class="area-modo">
            <span class="text-sm font-medium text-textoClaro">Modo:</span>
            <button class="btn-modo bg-modo_teste" onclick="definirModo('teste')">Teste</button>
            <button class="btn-modo bg-modo_manual" onclick="definirModo('manual')">Manual</button>
            <button class="btn-modo bg-modo_producao" onclick="definirModo('producao')">Produção</button>
        </div>
        <div>
            <button class="btn btn-alerta text-xs" onclick="alterarSenha()">Alterar Senha</button>
            <button class="btn btn-perigo text-xs" onclick="sair()">Sair</button>
        </div>
    </div>

    <div class="p-5 max-w-6xl mx-auto">
        <div class="card mb-5">
            <h3 class="text-md font-semibold text-primary mb-3">⚙️ Configurações de Pagamento</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label>Chave Pix de Recebimento</label>
                    <input type="text" id="chavePixGlobal" class="input" placeholder="Sua chave Pix">
                </div>
                <div>
                    <label>Nome do Beneficiário</label>
                    <input type="text" id="nomeBeneficiario" class="input" placeholder="Distribuidora Flash Point" value="Distribuidora Flash Point">
                </div>
            </div>
            <button class="btn btn-sucesso" onclick="salvarConfiguracoes()">💾 Salvar Configurações</button>
        </div>

        <div class="area-busca">
            <input type="text" id="buscaCpf" class="input" placeholder="Buscar por Nome ou CPF" oninput="filtrarPropostas()">
            <button class="btn btn-primary" onclick="filtrarPropostas()"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
            <button class="btn btn-alerta" onclick="document.getElementById('buscaCpf').value=''; filtrarPropostas();">Limpar</button>
        </div>

        <div class="resumo-valores">
            <div class="resumo-card" style="border-color: #10B981;">
                <h4 id="totalPago">R$ 0,00</h4>
                <p>Total Recebido</p>
            </div>
            <div class="resumo-card" style="border-color: #F59E0B;">
                <h4 id="totalReceber">R$ 0,00</h4>
                <p>Total a Receber</p>
            </div>
        </div>

        <div id="listaPropostas"><p class="text-center text-textoClaro py-8">Carregando propostas...</p></div>
    </div>
</div>

<div id="modalEditar" class="modal">
    <div class="modal-conteudo">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-bold text-primary">Editar e Analisar Proposta</h3>
            <button class="text-xl text-textoClaro hover:text-perigo" onclick="fecharModalEditar()">&times;</button>
        </div>
        <div id="formModal"></div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { enabled: true } });

let senhaCorreta = 'flashcred2026';
let listaPropostas = [];
const LINK_SISTEMA = 'https://flashcred-sistema.onrender.com/consultar.html';

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('chavePixGlobal').value = localStorage.getItem('chavePixGlobal') || '';
    document.getElementById('nomeBeneficiario').value = localStorage.getItem('nomeBeneficiario') || 'Distribuidora Flash Point';
    definirModo(localStorage.getItem('modoSistema') || 'manual');
    
    if(sessionStorage.getItem('logadoAdmin') === 'sim') {
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('painel').classList.remove('hidden');
        carregarPropostas();
        iniciarRealtime();
    }
});

function definirModo(modo) {
    localStorage.setItem('modoSistema', modo);
    mostrarNotificacao(`Modo alterado para: ${modo}`, 'alerta');
}

function salvarConfiguracoes() {
    localStorage.setItem('chavePixGlobal', document.getElementById('chavePixGlobal').value.trim());
    localStorage.setItem('nomeBeneficiario', document.getElementById('nomeBeneficiario').value.trim());
    mostrarNotificacao('✅ Configurações salvas com sucesso!', 'sucesso');
}

function mostrarNotificacao(texto, tipo = 'sucesso') {
    const el = document.getElementById('notificacao');
    el.textContent = texto;
    el.className = `notificacao ${tipo} mostrar`;
    setTimeout(() => el.classList.remove('mostrar'), 4500);
}

function limparApenasNumeros(valor) {
    return String(valor || '').replace(/\D/g, '');
}

function formatarCpf(cpf) {
    const n = limparApenasNumeros(cpf);
    if(n.length === 11) return n.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    return n;
}

function formatarCep(cep) {
    const n = limparApenasNumeros(cep);
    if(n.length === 8) return n.replace(/(\d{5})(\d{3})/, '$1-$2');
    return n;
}

function fazerLogin() {
    const senha = document.getElementById('senhaAdmin').value.trim();
    if(senha === senhaCorreta) {
        sessionStorage.setItem('logadoAdmin', 'sim');
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('painel').classList.remove('hidden');
        carregarPropostas();
        iniciarRealtime();
    } else {
        document.getElementById('erroLogin').classList.remove('hidden');
    }
}

function sair() {
    sessionStorage.removeItem('logadoAdmin');
    document.getElementById('painel').classList.add('hidden');
    document.getElementById('telaLogin').classList.remove('hidden');
    document.getElementById('senhaAdmin').value = '';
}

function alterarSenha() {
    const nova = prompt('Digite a nova senha de acesso:');
    if(nova && nova.length >= 4) {
        senhaCorreta = nova;
        mostrarNotificacao('✅ Senha alterada com sucesso!', 'sucesso');
    }
}

function iniciarRealtime() {
    supabase.channel('atualizacoes-propostas')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'propostas' }, () => {
            carregarPropostas();
            mostrarNotificacao('🔔 Novas atualizações recebidas!', 'sucesso');
        })
        .subscribe();
}

// ✅ CÁLCULO AUTOMÁTICO CORRIGIDO E FUNCIONAL
function atualizarCalculo() {
    const valorTotal = parseFloat(document.getElementById('valorTotal')?.value) || 0;
    const percEntrada = parseFloat(document.getElementById('percEntrada')?.value) || 0;
    const percJuros = parseFloat(document.getElementById('percJuros')?.value) || 0;
    const qtdParc = parseInt(document.getElementById('qtdParc')?.value) || 0;

    // Faz todo o cálculo passo a passo
    const valorEntrada = valorTotal * (percEntrada / 100);
    const valorComJuros = valorTotal * (1 + (percJuros / 100));
    const valorParcela = qtdParc > 0 ? (valorComJuros - valorEntrada) / qtdParc : 0;

    // Atualiza os campos na tela automaticamente
    if(document.getElementById('valorEntrada')) document.getElementById('valorEntrada').value = valorEntrada.toFixed(2);
    if(document.getElementById('valorParcela')) document.getElementById('valorParcela').value = valorParcela.toFixed(2);
}

function gerarCodigoPix(valor, descricao = 'Entrada Compra FlashCred') {
    const chave = localStorage.getItem('chavePixGlobal') || '';
    const nomeBenef = localStorage.getItem('nomeBeneficiario') || 'Distribuidora Flash Point';
    if(!chave) return null;
    const valorStr = parseFloat(valor).toFixed(2).replace('.', '');
    return `00020126580014br.gov.bcb.pix01${String(chave.length).padStart(2,'0')}${chave}02${String(descricao.length).padStart(2,'0')}${descricao}5204000053039865802BR59${String(nomeBenef.length).padStart(2,'0')}${nomeBenef}6008BRASIL62070503***6304`;
}

async function carregarPropostas() {
    const { data, error } = await supabase.from('propostas').select('*').order('created_at', { ascending: false });
    if(error) {
        mostrarNotificacao('❌ Erro ao carregar propostas', 'perigo');
        return;
    }
    listaPropostas = data || [];
    
    let totalPago = 0, totalReceber = 0;
    listaPropostas.forEach(p => {
        if(p.status === 'Aprovada') {
            if(p.pago) totalPago += parseFloat(p.valor_entrada || 0);
            totalReceber += parseFloat(p.valor_parcela || 0) * (parseInt(p.qtd_parcelas_escolhida || 0) - (p.pago ? 1 : 0));
        }
    });
    document.getElementById('totalPago').textContent = `R$ ${totalPago.toFixed(2).replace('.', ',')}`;
    document.getElementById('totalReceber').textContent = `R$ ${totalReceber.toFixed(2).replace('.', ',')}`;
    
    renderizarLista();
}

function filtrarPropostas() {
    const termo = document.getElementById('buscaCpf').value.trim().toLowerCase();
    if(!termo) return renderizarLista();
    const filtrado = listaPropostas.filter(p => 
        (p.nome || '').toLowerCase().includes(termo) ||
        limparApenasNumeros(p.cpf || '').includes(limparApenasNumeros(termo))
    );
    renderizarLista(filtrado);
}

function copiarDadosCliente(p) {
    const texto = `📋 DADOS DO CLIENTE
━━━━━━━━━━━━━━━━━━━━━━
👤 Nome: ${p.nome}
📄 CPF: ${formatarCpf(p.cpf)}
📅 Nascimento: ${p.data_nascimento || '-'}
📱 WhatsApp: ${limparApenasNumeros(p.telefone || '')}
📮 CEP: ${formatarCep(p.cep)}
🏠 Endereço: ${p.endereco || '-'} ${p.numero || ''} - ${p.bairro || ''}, ${p.cidade || ''}/${p.uf || ''}
💰 Valor Solicitado: R$ ${parseFloat(p.valor_desejado || 0).toFixed(2).replace('.', ',')}`;
    navigator.clipboard.writeText(texto);
    mostrarNotificacao('✅ Dados copiados!', 'sucesso');
}

function abrirModalEditar(cpf) {
    const proposta = listaPropostas.find(p => limparApenasNumeros(p.cpf) === limparApenasNumeros(cpf));
    if(!proposta) return;
    
    const form = document.getElementById('formModal');
    form.innerHTML = `
        <div class="nome-cliente mb-4">${proposta.nome}</div>
        <div class="linha-calculo">
            <label>Valor Total (R$):</label>
            <input type="number" step="0.01" id="valorTotal" class="input input-pequeno" value="${proposta.valor_aprovado || proposta.valor_desejado || 0}" oninput="atualizarCalculo()">
        </div>
        <div class="linha-calculo">
            <label>Entrada (%):</label>
            <input type="number" min="2" max="70" id="percEntrada" class="input input-pequeno" value="39" oninput="atualizarCalculo()">
        </div>
        <div class="linha-calculo">
            <label>Juros (% ao mês):</label>
            <input type="number" min="0" max="30" id="percJuros" class="input input-pequeno" value="6" oninput="atualizarCalculo()">
        </div>
        <div class="linha-calculo">
            <label>Qtd Parcelas (1-48):</label>
            <input type="number" min="1" max="48" id="qtdParc" class="input input-pequeno" value="${proposta.qtd_parcelas_escolhida || ''}" placeholder="Defina aqui" oninput="atualizarCalculo()">
        </div>
        <hr class="my-4 border-linhaDivisoria">
        <div class="linha-calculo font-medium">
            <span>Valor Entrada: R$ <strong id="valorEntrada">0,00</strong></span>
            <span>Valor Parcela: R$ <strong id="valorParcela">0,00</strong></span>
        </div>
        <div class="flex flex-wrap gap-3 mt-5">
            <button class="btn btn-sucesso" onclick="salvarAprovar('${proposta.cpf}')">✅ Salvar e Aprovar</button>
            <button class="btn btn-perigo" onclick="reprovar('${proposta.cpf}')">❌ Reprovar</button>
            <button class="btn btn-alerta" onclick="fecharModalEditar()">Cancelar</button>
        </div>
    `;
    document.getElementById('modalEditar').style.display = 'flex';
    atualizarCalculo(); // Já calcula automaticamente ao abrir a janela
}

function fecharModalEditar() {
    document.getElementById('modalEditar').style.display = 'none';
}

async function salvarAprovar(cpf) {
    const qtdParc = parseInt(document.getElementById('qtdParc').value);
    if(!qtdParc || qtdParc < 1 || qtdParc > 48) return alert('⚠️ Informe de 1 a 48 parcelas!');
    
    const dados = {
        valor_aprovado: parseFloat(document.getElementById('valorTotal').value),
        valor_entrada: parseFloat(document.getElementById('valorEntrada').value),
        valor_parcela: parseFloat(document.getElementById('valorParcela').value),
        qtd_parcelas_escolhida: qtdParc,
        status: 'Aprovada',
        codigo_pix: gerarCodigoPix(parseFloat(document.getElementById('valorEntrada').value)),
        pago: false,
        parcelas_pagas: 0
    };

    const { error } = await supabase.from('propostas').update(dados).eq('cpf', limparApenasNumeros(cpf));
    if(error) return mostrarNotificacao('❌ Erro ao salvar: ' + error.message, 'perigo');
    
    mostrarNotificacao('✅ Proposta atualizada e aprovada com sucesso!', 'sucesso');
    fecharModalEditar();
}

async function reprovar(cpf) {
    if(!confirm('⚠️ Tem certeza que deseja reprovar esta proposta?')) return;
    const { error } = await supabase.from('propostas').update({ status: 'Reprovada' }).eq('cpf', limparApenasNumeros(cpf));
    if(error) return mostrarNotificacao('❌ Erro ao reprovar', 'perigo');
    mostrarNotificacao('✅ Proposta reprovada', 'alerta');
    fecharModalEditar();
}

async function excluirProposta(cpf) {
    if(!confirm('⚠️ ATENÇÃO: Tem certeza que deseja EXCLUIR? Essa ação não pode ser desfeita!')) return;
    const { error } = await supabase.from('propostas').delete().eq('cpf', limparApenasNumeros(cpf));
    if(error) return mostrarNotificacao('❌ Erro ao excluir', 'perigo');
    mostrarNotificacao('✅ Proposta excluída!', 'sucesso');
}

function imprimirContrato(p) {
    const cpfFmt = formatarCpf(p.cpf);
    const janela = window.open('', '_blank');
    janela.document.write(`
    <html><head><title>Contrato - FlashCred</title>
    <style>body{font-family:Arial,sans-serif;padding:30px;max-width:800px;margin:0 auto;}h2{text-align:center;color:#0A2463;}.dados{margin:20px 0;padding:15px;border:1px solid #ccc;border-radius:8px;}.assinatura{margin-top:50px;text-align:center;}.linha{border-bottom:1px solid #000;width:80%;margin:30px auto 10px;}</style></head>
    <body>
        <h2>CONTRATO DE COMPRA COM PARCELAMENTO PIX</h2>
        <p style="text-align:center;">Distribuidora Flash Point</p>
        <div class="dados">
            <p><strong>Cliente:</strong> ${p.nome}</p>
            <p><strong>CPF:</strong> ${cpfFmt}</p>
            <p><strong>Valor Total:</strong> R$ ${parseFloat(p.valor_aprovado||p.valor_desejado||0).toFixed(2).replace('.',',')}</p>
            <p><strong>Entrada:</strong> R$ ${parseFloat(p.valor_entrada||0).toFixed(2).replace('.',',')}</p>
            <p><strong>Parcelas:</strong> ${p.qtd_parcelas_escolhida||0}x de R$ ${parseFloat(p.valor_parcela||0).toFixed(2).replace('.',',')}</p>
        </div>
        <p>O cliente declara estar ciente e de acordo com todos os termos, comprometendo-se ao pagamento integral. Em caso de atraso ou não pagamento, incidirão multas e juros legais, além de registro nos órgãos de proteção ao crédito e recolhimento do produto.</p>
        <div class="assinatura"><div class="linha"></div>Assinatura do Cliente</div>
    </body></html>`);
    janela.document.close();
    janela.print();
}

function enviarWhatsapp(p) {
    const cpfLimpo = limparApenasNumeros(p.cpf);
    const cpfFmt = formatarCpf(p.cpf);
    const telefoneCliente = limparApenasNumeros(p.telefone || ''); // Pega exatamente o que o cliente digitou
    const linkConsulta = `${LINK_SISTEMA}?cpf=${cpfLimpo}`;

    let mensagem = `✨ *RESULTADO DA SUA PROPOSTA - FLASHCRED* ✨\n\nOlá *${p.nome}*! Tudo bem?\n\nSua proposta na Distribuidora Flash Point está:\n`;

    if(p.status === 'Aprovada') {
        mensagem += `✅ *APROVADA!*\n\n🎉 *PARABÉNS!*\n\n📋 *Dados do seu pedido:*\n💳 Valor Aprovado: *R$ ${parseFloat(p.valor_aprovado||0).toFixed(2).replace('.',',')}*\n💸 Entrada: *R$ ${parseFloat(p.valor_entrada||0).toFixed(2).replace('.',',')}*\n📦 Parcelas: *${p.qtd_parcelas_escolhida||0}x de R$ ${parseFloat(p.valor_parcela||0).toFixed(2).replace('.',',')}*\n\n👉 *Clique aqui para ver detalhes, Pix e contrato:*\n${linkConsulta}\n\n*Agradecemos pela confiança!* ✨`;
    } else if(p.status === 'Reprovada') {
        mensagem += `❌ *REPROVADA*\n\nInfelizmente não foi possível aprovar dessa vez 😔\nMas você pode fazer uma nova solicitação quando quiser!\n\n👉 *Acesse para mais informações:*\n${linkConsulta}\n\nEstamos à disposição! 🤝`;
    } else {
        mensagem += `⏳ *EM ANÁLISE*\n\nAinda estamos analisando sua solicitação.\nEm breve você receberá o retorno aqui mesmo.\n\n👉 *Acompanhe pelo link:*\n${linkConsulta}\n\nAgradecemos a paciência! 🤍`;
    }

    if(!telefoneCliente || telefoneCliente.length < 10) {
        alert('⚠️ Número de WhatsApp inválido ou não informado!');
        return;
    }
    window.open(`https://wa.me/55${telefoneCliente}?text=${encodeURIComponent(mensagem)}`, '_blank');
}

function renderizarLista(lista = listaPropostas) {
    const container = document.getElementById('listaPropostas');
    container.innerHTML = '';
    
    if(lista.length === 0) {
        container.innerHTML = '<p class="text-center text-textoClaro py-8">Nenhuma proposta encontrada.</p>';
        return;
    }

    lista.forEach(p => {
        const statusEntrada = p.pago 
            ? `<span class="bolinha-status bolinha-verde"></span>Entrada Paga` 
            : `<span class="bolinha-status bolinha-amarela"></span>Entrada Pendente`;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="flex justify-between items-start flex-wrap gap-2">
                <div>
                    <span class="nome-cliente">${p.nome || 'Sem nome'}</span>
                    <span class="badge badge-${(p.status || 'nova').toLowerCase()}">${p.status || 'Nova'}</span>
                </div>
            </div>
            <div class="dados-cliente mt-2">
                <p><strong>CPF:</strong> ${formatarCpf(p.cpf)}</p>
                <p><strong>Nascimento:</strong> ${p.data_nascimento || '-'}</p>
                <p><strong>WhatsApp:</strong> ${limparApenasNumeros(p.telefone || '')}</p>
                <p><strong>CEP:</strong> ${formatarCep(p.cep)}</p>
                <p><strong>Endereço:</strong> ${p.endereco || '-'} ${p.numero || ''} - ${p.bairro || ''}, ${p.cidade || ''}/${p.uf || ''}</p>
                <p><strong>Valor Solicitado:</strong> R$ ${parseFloat(p.valor_desejado || 0).toFixed(2).replace('.', ',')}</p>
                ${p.status === 'Aprovada' ? `
                <p><strong>Valor Aprovado:</strong> R$ ${parseFloat(p.valor_aprovado||0).toFixed(2).replace('.',',')}</p>
                <p><strong>Entrada:</strong> R$ ${parseFloat(p.valor_entrada||0).toFixed(2).replace('.',',')}</p>
                <p><strong>Parcelas:</strong> ${p.qtd_parcelas_escolhida||0}x de R$ ${parseFloat(p.valor_parcela||0).toFixed(2).replace('.',',')}</p>
                ` : ''}
                <p>${statusEntrada}</p>
            </div>
            <div class="flex flex-wrap gap-2 mt-3">
                <button class="btn btn-copiar" onclick='copiarDadosCliente(${JSON.stringify(p).replace(/'/g, "&#39;")})'><i class="fa-solid fa-copy"></i> Copiar Dados</button>
                <!-- BOTÃO EDITAR SEMPRE VISÍVEL -->
                <button class="btn btn-editar" onclick="abrirModalEditar('${p.cpf}')"><i class="fa-solid fa-pen-to-square"></i> Editar / Analisar</button>
                ${p.status === 'Aprovada' ? `
                <button class="btn btn-imprimir" onclick='imprimirContrato(${JSON.stringify(p).replace(/'/g, "&#39;")})'><i class="fa-solid fa-file-pdf"></i> Imprimir Contrato</button>
                ` : ''}
                <button class="btn btn-whatsapp" onclick='enviarWhatsapp(${JSON.stringify(p).replace(/'/g, "&#39;")})'><i class="fa-brands fa-whatsapp"></i> Enviar Resultado</button>
                <button class="btn btn-excluir" onclick="excluirProposta('${p.cpf}')"><i class="fa-solid fa-trash"></i> Excluir</button>
            </div>
        `;
        container.appendChild(card);
    });
}
</script>
