<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        whatsapp: '#25D366',
                        fundo: '#F1F5F9',
                        borda: '#CBD5E1'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-fundo min-h-screen">

<!-- LOGIN -->
<div id="telaLogin" class="max-w-md mx-auto p-4 pt-12">
    <div class="bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-xl font-bold text-primary text-center mb-6">🔐 Acesso Administrativo</h2>
        <input type="password" id="senha" placeholder="Digite sua senha..." 
            class="w-full p-3 border-2 border-borda rounded-lg text-lg focus:border-primary focus:outline-none">
        <button onclick="entrar()" class="w-full mt-4 bg-primary text-white p-3 rounded-lg font-bold text-lg">Entrar</button>
        <p id="erroLogin" class="text-red-500 text-center mt-2 hidden">❌ Senha incorreta!</p>
    </div>
</div>

<!-- PAINEL -->
<div id="telaPainel" class="hidden max-w-md mx-auto p-4">
    <div class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold text-primary">📋 Propostas</h1>
        <div class="flex gap-2 items-center">
            <span class="px-3 py-1 rounded-full text-sm font-bold bg-green-100 text-green-700">⚡ Produção</span>
            <button onclick="sair()" class="text-sm text-gray-500">Sair</button>
        </div>
    </div>
    <p class="text-right text-sm text-green-600 mb-4">✅ Atualização automática em tempo real</p>
    <div id="lista"></div>
    <div id="carregando" class="text-center p-8 text-gray-500 hidden">Carregando...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
// ==============================================
// CONFIGURAÇÕES
// ==============================================
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

const SENHA = 'flash2026';
const CHAVE_PIX = '33552949852';

let propostas = [];
let canalRealtime = null;

// ==============================================
// INICIO
// ==============================================
window.onload = () => {
    if(localStorage.getItem('logado') === 'sim') {
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('telaPainel').classList.remove('hidden');
        carregar();
        ativarRealtime();
    }
};

function entrar() {
    if(document.getElementById('senha').value === SENHA) {
        localStorage.setItem('logado', 'sim');
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('telaPainel').classList.remove('hidden');
        carregar();
        ativarRealtime();
    } else {
        document.getElementById('erroLogin').classList.remove('hidden');
    }
}

function sair() {
    localStorage.removeItem('logado');
    location.reload();
}

// ==============================================
// 🔄 TEMPO REAL — SEM F5!
// ==============================================
function ativarRealtime() {
    if(canalRealtime) supabase.removeChannel(canalRealtime);
    canalRealtime = supabase.channel('painel_atualizacao')
        .on('postgres_changes', {event:'*', schema:'public', table:'propostas'}, () => {
            console.log('🔄 Atualizando...');
            carregar();
        })
        .subscribe();
}

// ==============================================
// CARREGAR PROPOSTAS
// ==============================================
async function carregar() {
    document.getElementById('carregando').classList.remove('hidden');
    
    const {data, error} = await supabase
        .from('propostas')
        .select('*')
        .order('created_at', {ascending:false});

    document.getElementById('carregando').classList.add('hidden');
    
    if(error) { alert('Erro: '+error.message); return; }
    propostas = data || [];
    montarLista();
}

function montarLista() {
    document.getElementById('lista').innerHTML = propostas.length === 0 
        ? '<p class="text-center p-8 text-gray-500">Nenhuma proposta encontrada</p>'
        : propostas.map(criarCard).join('');
}

// ==============================================
// ✅ CALCULAR VALORES
// ==============================================
function recalcular(id) {
    const valorTotal = Number(document.getElementById(`v-${id}`).value) || 0;
    const percEnt = Number(document.getElementById(`p-${id}`).value) || 0;
    const qtd = Number(document.getElementById(`par-${id}`).value) || 1;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;

    const valorEntrada = valorTotal * percEnt / 100;
    const saldo = valorTotal - valorEntrada;
    const valorParcela = qtd > 0 ? saldo * Math.pow(1 + juros/100, 1) / qtd : 0;

    document.getElementById(`e-${id}`).value = valorEntrada.toFixed(2).replace('.', ',');
    document.getElementById(`vp-${id}`).value = valorParcela.toFixed(2).replace('.', ',');
}

// ==============================================
// ✅ GERAR CÓDIGO PIX
// ==============================================
function gerarPix(valor, descricao) {
    const valorStr = Number(valor).toFixed(2);
    const nome = 'FLASH POINT';
    const cidade = 'SAO PAULO';
    const chave = CHAVE_PIX;
    
    function pad(id, campo) {
        return String(campo.length).padStart(2,'0') + campo;
    }
    
    let pix = '000201';
    pix += '26' + pad(chave.length + chave.length, '0014br.gov.bcb.pix01' + String(chave.length).padStart(2,'0') + chave);
    pix += '52040000';
    pix += '5303986';
    pix += '5802BR';
    pix += '59' + pad(nome.length, nome);
    pix += '60' + pad(cidade.length, cidade);
    pix += '62' + pad(descricao.length + 4, '05' + String(descricao.length).padStart(2,'0') + descricao);
    pix += '6304';
    
    function crc16(s) {
        let crc = 0xFFFF;
        for(let i=0; i<s.length; i++) {
            crc ^= s.charCodeAt(i) << 8;
            for(let j=0; j<8; j++) crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1;
        }
        return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4,'0');
    }
    return pix + crc16(pix);
}

// ==============================================
// ✅ APROVAR — SALVA TUDO!
// ==============================================
async function aprovar(id) {
    const valorTotal = Number(document.getElementById(`v-${id}`).value) || 0;
    const percEnt = Number(document.getElementById(`p-${id}`).value) || 0;
    const qtd = Number(document.getElementById(`par-${id}`).value) || 1;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;
    const dataInicio = document.getElementById(`data-inicio-${id}`).value;

    const valorEntrada = valorTotal * percEnt / 100;
    const saldo = valorTotal - valorEntrada;
    const valorParcela = qtd > 0 ? saldo * Math.pow(1 + juros/100, 1) / qtd : 0;

    // GERAR PARCELAS
    const parcelas = [];
    let data = dataInicio ? new Date(dataInicio + 'T00:00:00') : new Date();
    for(let i=1; i<=qtd; i++) {
        const d = String(data.getDate()).padStart(2,'0');
        const m = String(data.getMonth()+1).padStart(2,'0');
        const a = data.getFullYear();
        parcelas.push({
            numero: i,
            valor: Number(valorParcela.toFixed(2)),
            vencimento: `${a}-${m}-${d}`,
            paga: false
        });
        data.setMonth(data.getMonth()+1);
    }

    // GERAR PIX
    const codigoPix = gerarPix(valorEntrada, 'Entrada - FlashCred');

    // SALVAR NO BANCO
    const { error } = await supabase
        .from('propostas')
        .update({
            status: 'Aprovada',
            valor_desejado: valorTotal,
            percentual_entrada: percEnt,
            valor_entrada: valorEntrada,
            quantidade_parcelas: qtd,
            juros: juros,
            valor_parcela: valorParcela,
            qr_code_entrada: codigoPix,
            dados_parcelas: parcelas,
            entrada_paga: false
        })
        .eq('id', id);

    if(error) {
        alert('❌ Erro ao aprovar: ' + error.message);
    } else {
        alert('✅ PROPOSTA APROVADA!\n\n👉 Cliente verá os valores e o Pix na hora!');
    }
}

// ==============================================
// ✅ MARCAR ENTRADA PAGA
// ==============================================
async function marcarEntrada(id) {
    if(!confirm('💰 Marcar entrada como PAGA?\n\n✅ Cliente verá as parcelas liberadas!')) return;
    
    const { error } = await supabase
        .from('propostas')
        .update({ entrada_paga: true })
        .eq('id', id);

    if(error) alert('❌ Erro: ' + error.message);
    else alert('✅ Entrada marcada como PAGA! Cliente já vê as parcelas!');
}

// ==============================================
// ✅ MARCAR PARCELA INDIVIDUAL PAGA
// ==============================================
async function marcarParcelaPaga(idProposta, numeroParcela) {
    if(!confirm(`✅ Marcar ${numeroParcela}ª parcela como PAGA?`)) return;

    const {data: propostas} = await supabase.from('propostas').select('dados_parcelas').eq('id', idProposta).limit(1);
    if(!propostas || !propostas.length) return;

    const parcelas = propostas[0].dados_parcelas || [];
    parcelas.forEach(p => {
        if(p.numero === numeroParcela) p.paga = true;
    });

    const { error } = await supabase
        .from('propostas')
        .update({ dados_parcelas: parcelas })
        .eq('id', idProposta);

    if(error) alert('❌ Erro: ' + error.message);
    else alert('✅ Parcela marcada como PAGA!');
}

// ==============================================
// REPROVAR E EXCLUIR
// ==============================================
async function reprovar(id) {
    if(!confirm('❌ Reprovar esta proposta?')) return;
    const { error } = await supabase.from('propostas').update({status:'Reprovada'}).eq('id', id);
    if(error) alert('Erro: ' + error.message);
}

async function excluir(id) {
    if(!confirm('⚠️ EXCLUIR proposta? Não tem volta!')) return;
    const { error } = await supabase.from('propostas').delete().eq('id', id);
    if(error) alert('Erro: ' + error.message);
}

// ==============================================
// 🧩 MONTAR CARD COMPLETO
// ==============================================
function criarCard(p) {
    const status = p.status || 'Nova';
    const statusCor = status === 'Aprovada' ? 'bg-green-100 text-green-700' : 
                      status === 'Reprovada' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700';

    const valorTotal = Number(p.valor_desejado || 0);
    const percEnt = Number(p.percentual_entrada || 0);
    const valorEnt = Number(p.valor_entrada || 0);
    const qtd = Number(p.quantidade_parcelas || 1);
    const juros = Number(p.juros || 0);
    const saldo = valorTotal - valorEnt;
    const valParc = qtd > 0 ? saldo * Math.pow(1 + juros/100, 1) / qtd : 0;

    const cpf = (p.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    const tel = p.telefone?.replace(/\D/g,'') || '';
    const temSelfie = !!p.selfie_cliente;
    const temContrato = !!p.contrato_assinado;
    const entradaPaga = !!p.entrada_paga;
    const parcelas = p.dados_parcelas || [];

    return `
    <div class="bg-white p-4 rounded-xl shadow mb-4 border border-borda">
        <!-- CABEÇALHO -->
        <div class="flex justify-between items-start mb-4 pb-3 border-b border-borda">
            <div>
                <h3 class="font-bold text-lg text-primary">👤 ${p.nome || 'Sem nome'}</h3>
                <p class="text-sm text-gray-500">📌 ${cpf} ${tel? '| 📞 +55 '+tel:''}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-sm font-bold ${statusCor}">${status}</span>
        </div>

        <!-- DOCUMENTOS: SELFIE E CONTRATO -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="text-center p-3 rounded-lg border ${temSelfie?'border-green-400 bg-green-50':'border-borda bg-gray-50'}">
                <p class="text-sm font-semibold mb-2">📸 Selfie</p>
                ${temSelfie 
                    ? `<img src="${p.selfie_cliente}" class="w-full h-32 object-cover rounded-lg cursor-pointer" onclick="window.open('${p.selfie_cliente}')">` 
                    : '<p class="text-yellow-600 text-sm">❌ Pendente</p>'}
            </div>
            <div class="text-center p-3 rounded-lg border ${temContrato?'border-green-400 bg-green-50':'border-borda bg-gray-50'}">
                <p class="text-sm font-semibold mb-2">✍️ Contrato</p>
                ${temContrato 
                    ? `<img src="${p.contrato_assinado}" class="w-full h-32 object-cover rounded-lg cursor-pointer" onclick="window.open('${p.contrato_assinado}')">` 
                    : '<p class="text-yellow-600 text-sm">❌ Pendente</p>'}
            </div>
        </div>

        <!-- VALORES -->
        <div class="bg-gray-50 p-4 rounded-lg mb-4 border">
            <h4 class="font-bold text-primary mb-3">💰 Valores e Condições</h4>
            <div class="grid grid-cols-6 gap-2">
                <div class="text-center">
                    <label class="text-xs font-semibold text-gray-500">Total</label>
                    <input type="number" id="v-${p.id}" value="${valorTotal}" 
                        oninput="recalcular(${p.id})" 
                        class="w-full p-1.5 border-2 border-borda rounded text-center font-bold text-sm">
                </div>
                <div class="text-center">
                    <label class="text-xs font-semibold text-gray-500">Entrada %</label>
                    <input type="number" id="p-${p.id}" value="${percEnt}" 
                        oninput="recalcular(${p.id})" 
                        class="w-full p-1.5 border-2 border-borda rounded text-center font-bold text-sm">
                </div>
                <div class="text-center">
                    <label class="text-xs font-semibold text-gray-500">Entrada R$</label>
                    <input type="text" id="e-${p.id}" value="${valorEnt.toFixed(2).replace('.',',')}" readonly 
                        class="w-full p-1.5 border-2 border-green-300 rounded text-center font-bold text-sm bg-green-50 text-green-700">
                </div>
                <div class="text-center">
                    <label class="text-xs font-semibold text-gray-500">Parcelas</label>
                    <input type="number" id="par-${p.id}" value="${qtd}" min="1" max="48" 
                        oninput="recalcular(${p.id})" 
                        class="w-full p-1.5 border-2 border-borda rounded text-center font-bold text-sm">
                </div>
                <div class="text-center">
                    <label class="text-xs font-semibold text-gray-500">Juros %</label>
                    <input type="number" id="j-${p.id}" value="${juros}" step="0.01" 
                        oninput="recalcular(${p.id})" 
                        class="w-full p-1.5 border-2 border-borda rounded text-center font-bold text-sm">
                </div>
                <div class="text-center">
                    <label class="text-xs font-semibold text-gray-500">Parcela R$</label>
                    <input type="text" id="vp-${p.id}" value="${valParc.toFixed(2).replace('.',',')}" readonly 
                        class="w-full p-1.5 border-2 border-green-300 rounded text-center font-bold text-sm bg-green-50 text-green-700">
                </div>
            </div>
        </div>

        <!-- DATA DA 1ª PARCELA -->
        <div class="bg-blue-50 p-3 rounded-lg mb-4 border border-blue-200">
            <label class="text-sm font-semibold text-primary">📅 Data da 1ª Parcela:</label>
            <input type="date" id="data-inicio-${p.id}" class="w-full mt-2 p-2 border-2 border-borda rounded">
        </div>

        <!-- STATUS ENTRADA -->
        <div class="mb-4 p-3 rounded-lg ${entradaPaga?'bg-green-50 border border-green-300':'bg-yellow-50 border border-yellow-300'}">
            <p class="font-bold ${entradaPaga?'text-green-700':'text-yellow-700'}">
                ${entradaPaga?'✅ ENTRADA PAGA!':'⏳ Entrada pendente'}
            </p>
        </div>

        <!-- LISTA DE PARCELAS COM BOTÕES -->
        ${parcelas.length > 0 ? `
        <div class="border-2 border-borda rounded-lg p-3 mb-4">
            <h4 class="font-bold text-primary mb-3">📋 Parcelas</h4>
            <div class="space-y-2 max-h-80 overflow-y-auto">
                ${parcelas.map(parc => {
                    const dt = parc.vencimento ? parc.vencimento.split('-').reverse().join('/') : '---';
                    const vlr = Number(parc.valor||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
                    const paga = parc.paga;
                    const hoje = new Date();
                    const venc = parc.vencimento ? new Date(parc.vencimento+'T00:00:00') : null;
                    const atrasada = venc && venc < hoje && !paga;
                    const corBorda = paga ? 'border-green-400' : atrasada ? 'border-red-400' : 'border-yellow-400';
                    const corFundo = paga ? 'bg-green-50' : atrasada ? 'bg-red-50' : 'bg-yellow-50/20';
                    const statusTxt = paga ? '✅ PAGA' : atrasada ? '⚠️ VENCIDA' : '⏳ A VENCER';
                    const msgWpp = encodeURIComponent(`Olá ${p.nome}! 🔔 Cobrança: ${parc.numero}ª parcela no valor de ${vlr} — Vencimento: ${dt}. Por favor, realize o pagamento. Obrigado!`);
                    
                    return `
                    <div class="p-3 rounded-lg border-2 ${corBorda} ${corFundo}">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold">${parc.numero}ª</span>
                            <span class="font-bold text-lg text-primary">${vlr}</span>
                        </div>
                        <div class="flex justify-between text-sm mb-2">
                            <span>Venc: ${dt}</span>
                            <span class="font-semibold">${statusTxt}</span>
                        </div>
                        ${!paga ? `
                        <div class="flex gap-2">
                            <button onclick="marcarParcelaPaga(${p.id}, ${parc.numero})" 
                                class="flex-1 bg-alerta text-gray-900 p-2 rounded font-bold text-sm">💰 Dar Baixa</button>
                            <a href="https://wa.me/55${tel}?text=${msgWpp}" target="_blank" 
                                class="flex-1 bg-whatsapp text-white p-2 rounded font-bold text-sm text-center">💬 Cobrar</a>
                        </div>` : '<p class="text-center text-green-600 font-bold text-sm">✅ Pago</p>'}
                    </div>`;
                }).join('')}
            </div>
        </div>` : ''}

        <!-- BOTÕES PRINCIPAIS -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="aprovar(${p.id})" class="bg-sucesso text-white p-3 rounded-lg font-bold text-lg">
                ✅ APROVAR
            </button>
            <button onclick="marcarEntrada(${p.id})" class="bg-alerta text-gray-900 p-3 rounded-lg font-bold text-lg">
                💰 Entrada Paga
            </button>
            <button onclick="reprovar(${p.id})" class="bg-perigo text-white p-3 rounded-lg font-bold">
                ❌ Reprovar
            </button>
            <button onclick="excluir(${p.id})" class="bg-gray-700 text-white p-3 rounded-lg font-bold">
                🗑️ Excluir
            </button>
        </div>
    </div>`;
}
</script>
</body>
</html>
