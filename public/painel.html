<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .escondido { display: none !important; }
        .botao { padding: 8px 14px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; font-size: 13px; }
        .botao-sucesso { background: #10B981; color: white; }
        .botao-sucesso:hover { background: #059669; }
        .botao-aviso { background: #F59E0B; color: #1E293B; }
        .botao-perigo { background: #EF4444; color: white; }
        .botao-secundario { background: #64748B; color: white; }
    </style>
</head>
<body class="bg-fundo min-h-screen p-4">

<div class="max-w-6xl mx-auto">
    <!-- CABEÇALHO -->
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-primary">📋 Painel de Controle — FlashCred</h1>
            <p class="text-sm text-gray-500">Gerenciamento de propostas e aprovações</p>
        </div>
        <button onclick="carregarPropostas()" class="botao botao-secundario">🔄 Atualizar Lista</button>
    </div>

    <!-- BUSCA -->
    <div class="bg-white rounded-2xl shadow-lg p-4 mb-6">
        <input type="text" id="filtroBusca" placeholder="🔍 Buscar por CPF, Nome ou Código Único..." oninput="filtrarPropostas()" class="w-full p-3 border border-gray-200 rounded-lg text-sm">
    </div>

    <!-- LISTA DE PROPOSTAS -->
    <div id="listaPropostas" class="space-y-4">
        <p class="text-center text-gray-500 py-8">Carregando propostas...</p>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const SERVIDOR_URL = 'https://flashcred-sistema.onrender.com';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let todasPropostas = [];

async function carregarPropostas() {
    try {
        const { data, error } = await supabase
            .from('propostas')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;
        todasPropostas = data || [];
        renderizarPropostas(todasPropostas);
    } catch (err) {
        console.error('Erro ao carregar propostas:', err);
        document.getElementById('listaPropostas').innerHTML = `<p class="text-center text-red-500 py-4">❌ Erro ao carregar propostas do banco.</p>`;
    }
}

function renderizarPropostas(propostas) {
    const container = document.getElementById('listaPropostas');
    if (propostas.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 py-8">Nenhuma proposta encontrada.</p>`;
        return;
    }

    let html = '';
    propostas.forEach(p => {
        const valorTotal = Number(p.valor_desejado || 0);
        const percEnt = Number(p.percentual_entrada || 20);
        const valorEnt = valorTotal * percEnt / 100;
        const qtd = p.parcelas_escolhidas || p.quantidade_parcelas || 1;
        const juros = Number(p.juros || 0);
        const valParc = (valorTotal - valorEnt) * (1 + juros/100) / qtd;

        let statusTexto = '⏳ Aguardando aprovação';
        let statusCor = 'text-yellow-600';
        if (p.status === 'Aprovada') {
            statusTexto = p.entrada_paga ? '✅ Entrada Paga' : '🎉 Aprovada (Aguardando Pagamento)';
            statusCor = 'text-green-600';
        } else if (p.status === 'Reprovada') {
            statusTexto = '❌ Reprovada';
            statusCor = 'text-red-600';
        }

        html += `
        <div class="bg-white rounded-2xl shadow-md p-6 border-l-4 ${p.status === 'Aprovada' ? 'border-green-500' : p.status === 'Reprovada' ? 'border-red-500' : 'border-yellow-500'}">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                <div>
                    <h3 class="text-lg font-bold text-primary">${p.nome || 'Cliente sem nome'}</h3>
                    <p class="text-sm text-gray-500">CPF: ${p.cpf || '--'} | Código Único: <span class="font-bold text-gray-700">${p.codigo_unico || '---'}</span></p>
                </div>
                <div class="text-right">
                    <span class="font-bold text-sm ${statusCor}">${statusTexto}</span>
                    <p class="text-xs text-gray-400">Criado em: ${new Date(p.created_at).toLocaleDateString('pt-BR')}</p>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-xl mb-4 text-sm">
                <div>
                    <span class="text-gray-500 block">Valor Total</span>
                    <strong class="text-gray-800">${valorTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong>
                </div>
                <div>
                    <span class="text-gray-500 block">Entrada</span>
                    <strong class="text-green-600">${valorEnt.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })} (${percEnt}%)</strong>
                </div>
                <div>
                    <span class="text-gray-500 block">Parcelas</span>
                    <strong class="text-gray-800">${qtd}x de ${valParc.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong>
                </div>
                <div>
                    <span class="text-gray-500 block">Assinatura</span>
                    <strong class="text-gray-800">${p.assinatura_contrato || 'Pendente'}</strong>
                </div>
            </div>

            <div class="flex flex-wrap gap-2">
                ${p.status !== 'Aprovada' ? `<button onclick="aprovarEGerarPix('${p.id}')" class="botao botao-sucesso">✅ Aprovar + Gerar Pix</button>` : ''}
                ${!p.entrada_paga && p.status === 'Aprovada' ? `<button onclick="marcarEntradaPaga('${p.id}')" class="botao botao-aviso">💰 Marcar Entrada Paga</button>` : ''}
                <button onclick="reprovar('${p.id}')" class="botao botao-perigo">❌ Reprovar</button>
            </div>
        </div>`;
    });

    container.innerHTML = html;
}

function filtrarPropostas() {
    const termo = document.getElementById('filtroBusca').value.toLowerCase();
    const filtradas = todasPropostas.filter(p => 
        (p.nome && p.nome.toLowerCase().includes(termo)) ||
        (p.cpf && p.cpf.includes(termo)) ||
        (p.codigo_unico && p.codigo_unico.toLowerCase().includes(termo))
    );
    renderizarPropostas(filtradas);
}

// ✅ FUNÇÃO CORRIGIDA DE APROVAÇÃO COM GRAVAÇÃO NO SUPABASE
async function aprovarEGerarPix(idProposta) {
    if (!confirm('Deseja aprovar esta proposta e gerar o Pix de entrada?')) return;

    try {
        alert('⏳ Gerando Pix no Mercado Pago, aguarde...');

        // 1. Solicita ao backend no Render a criação da cobrança Pix
        const resposta = await fetch(`${SERVIDOR_URL}/gerar-pix/${idProposta}`, {
            method: 'POST'
        });
        const dados = await resposta.json();

        if (!resposta.ok) {
            throw new Error(dados.erro || 'Erro ao comunicar com o servidor');
        }

        // Extrai o copia e cola do Pix retornado pela API do Mercado Pago
        const copiaCola = dados.point_of_interaction?.transaction_data?.qr_code;
        const qrCodeBase64 = dados.point_of_interaction?.transaction_data?.qr_code_base64;

        if (!copiaCola) {
            throw new Error('O Mercado Pago não retornou o código Copia e Cola.');
        }

        // 2. Atualiza imediatamente o Supabase para mudar o status para Aprovada e salvar o Pix
        const { error: erroSupabase } = await supabase
            .from('propostas')
            .update({
                status: 'Aprovada',
                copia_cola_pix: copiaCola,
                qr_code_base64: qrCodeBase64
            })
            .eq('id', idProposta);

        if (erroSupabase) throw erroSupabase;

        alert('✅ Pix gerado e proposta aprovada com sucesso!');
        carregarPropostas(); // Atualiza a tela do painel

    } catch (erro) {
        alert('❌ Erro ao aprovar: ' + erro.message);
    }
}

async function marcarEntradaPaga(idProposta) {
    if (!confirm('Deseja confirmar o recebimento da entrada desta proposta?')) return;

    try {
        const { error } = await supabase
            .from('propostas')
            .update({
                entrada_paga: true,
                data_pagamento_entrada: new Date().toISOString()
            })
            .eq('id', idProposta);

        if (error) throw error;

        alert('✅ Entrada marcada como paga com sucesso!');
        carregarPropostas();
    } catch (erro) {
        alert('❌ Erro: ' + erro.message);
    }
}

async function reprovar(idProposta) {
    if (!confirm('Deseja realmente reprovar esta proposta?')) return;

    try {
        const { error } = await supabase
            .from('propostas')
            .update({ status: 'Reprovada' })
            .eq('id', idProposta);

        if (error) throw error;

        alert('Proposta reprovada.');
        carregarPropostas();
    } catch (erro) {
        alert('❌ Erro: ' + erro.message);
    }
}

// Carrega as propostas ao abrir a página
carregarPropostas();
</script>
</body>
</html>
