        .botao-sucesso { background: #22C55E; color: white; }
        .botao-alerta { background: #F59E0B; color: #1F2937; }
        .botao-perigo { background: #EF4444; color: white; }
        .botao-azul { background: #3B82F6; color: white; }
        .botao-whatsapp { background: #25D366; color: white; }
        .botao-pdf { background: #8B5CF6; color: white; }
        .botao-pequeno { padding: 6px 10px; font-size: 13px; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; }

        .status-aprovada { background: #D1FAE5; color: #065F46; }

        .input-editar { padding: 6px 8px; border: 1px solid #CBD5E1; border-radius: 6px; width: 130px; font-size: 14px; }

        .barra-superior { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
        .resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .resumo-cartao { padding: 16px; border-radius: 10px; text-align: center; }
        .resumo-cartao h3 { font-size: 26px; }

        .info-parcela { font-size: 13px; padding: 8px 12px; border-radius: 6px; margin: 4px 0; }

        h1 { font-size: 28px; color: var(--primary); margin-bottom: 20px; }
        .botao-grupo { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

        .prazo-entrega { background: #E0F2FE; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #0284C7; margin-top: 4px; }
        .resumo-financeiro { background: #F0FDF4; padding: 12px; border-radius: 8px; margin: 10px 0; }

        .area-pdf { position: absolute; left: -9999px; top: -9999px; background: white; padding: 30px; width: 800px; }

<script>
// ==============================================
// ✅ CONFIGURAÇÕES
// ==============================================
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

const SENHA = 'flash2026';
const URL_CONSULTA = 'https://flashcred-sistema.onrender.com/consulta.html';
let propostas = [];
let editandoId = null;
let qtdAnterior = 0;

// ==============================================
// ✅ LOGIN
// ==============================================
window.onload = function() {
    const logado = localStorage.getItem('painel_logado');
    if(logado === 'SIM') {
        document.getElementById('telaLogin').classList.add('oculto');
        document.getElementById('telaPrincipal').classList.remove('oculto');
        carregarPropostas();
        ativarRealtimeTotal(); // ⚡ LIGA TEMPO REAL!
    }
};
function entrar() {
    const senha = document.getElementById('senha').value.trim();
    if(senha === SENHA) {
        localStorage.setItem('painel_logado', 'SIM');
        document.getElementById('telaLogin').classList.add('oculto');
        document.getElementById('telaPrincipal').classList.remove('oculto');
        carregarPropostas();
        ativarRealtimeTotal(); // ⚡ LIGA AGORA!
    } else alert('❌ Senha incorreta!');
}
function sair() {
    localStorage.removeItem('painel_logado');
    location.reload();
}

// ==============================================
// ✅ FORMATAR VALORES
// ==============================================
function formatarMoeda(valor) {
    return Number(valor||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function formatarTelefone(tel) {
    if(!tel) return '';
    const n = tel.replace(/\D/g,'');
    if(n.length===11) return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`;
    if(n.length===10) return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;
    return tel;
}
function formatarCPF(cpf) {
    if(!cpf) return '';
    const n = cpf.replace(/\D/g,'');
    if(n.length===11) return `${n.slice(0,3)}.${n.slice(3,6)}.${n.slice(6,9)}-${n.slice(9)}`;
    return cpf;
}
function formatarCEP(cep) {
    if(!cep) return '';
    const n = cep.replace(/\D/g,'');
    if(n.length===8) return `${n.slice(0,5)}-${n.slice(5)}`;
    return cep;
}

// ==============================================
// ✅ MONTAR ENDEREÇO
// ==============================================
function montarEndereco(p) {
    const rua = p.rua || p.logradouro || p.endereco || '';
    const numero = p.numero || p.numero_endereco || '';
    const bairro = p.bairro || p.bairro_endereco || '';
    const cidade = p.cidade || p.cidade_endereco || '';
    const uf = p.uf || p.estado || p.estado_endereco || '';
    const partes = [];
    if(rua) partes.push(rua);
    if(numero) partes.push(', ' + numero);
    if(bairro) partes.push(' — ' + bairro);
    if(cidade) partes.push(' — ' + cidade + (uf ? '/' + uf : ''));
    return partes.join('').trim() || 'Não informado';
}

// ==============================================
// ✅ CALCULAR PARCELAS
// ==============================================
function calcularParcelas(valorTotal, valorEntrada, qtd, juros) {
    if(!valorTotal || !qtd || qtd<=0) return [];
    const financiado = valorTotal - valorEntrada;
    const taxa = juros / 100;
    let parcelaValor;
    if(taxa === 0) parcelaValor = financiado / qtd;
    else parcelaValor = financiado * (taxa * Math.pow(1+taxa,qtd)) / (Math.pow(1+taxa,qtd)-1);

    const hoje = new Date();
    hoje.setMonth(hoje.getMonth()+1);
    hoje.setDate(5);

    return Array.from({length:qtd}, (_,i) => {
        const dt = new Date(hoje);
        dt.setMonth(hoje.getMonth()+i);
        return {
            numero: i+1,
            valor: parseFloat(parcelaValor.toFixed(2)),
            vencimento: dt.toISOString().split('T')[0],
            paga: false
        };
    });
}

// ==============================================
// ✅ CARREGAR PROPOSTAS
// ==============================================
async function carregarPropostas() {
    const {data, error} = await supabase.from('propostas').select('*').order('created_at',{ascending:false});
    if(error) return console.error(error);
    propostas = data || [];
    renderizarPropostas();
}

// ==============================================
// ⚡ TEMPO REAL TOTAL — AQUI É A MAGIA!
// ==============================================
function ativarRealtimeTotal() {
    // Escuta TUDO: INSERIR, ALTERAR, EXCLUIR
    supabase.channel('mudancas-propostas')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'propostas' }, (nova) => {
            console.log('📥 NOVA PROPOSTA CHEGOU!', nova);
            tocarSomNotificacao();
            carregarPropostas(); // ⚡ ATUALIZA NA HORA!
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'propostas' }, (mudou) => {
            console.log('🔄 PROPOSTA ALTERADA!', mudou);
            carregarPropostas(); // ⚡ ATUALIZA NA HORA!
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'propostas' }, () => {
            carregarPropostas();
        })
        .subscribe();
}

// 🔊 TOCAR SOM QUANDO CHEGAR NOVA PROPOSTA
function tocarSomNotificacao() {
    const som = document.getElementById('somNotificacao');
    som.currentTime = 0;
    som.play().catch(() => {
        console.log('🔇 Som bloqueado pelo navegador');
    });
}

// ==============================================
// ✅ SALVAR ALTERAÇÕES — INCLUINDO PRAZO!
// ==============================================
async function salvarEdicao(id) {
    const valor = (document.getElementById('edt_valor_'+id).value.replace(/\D/g,''))/100;
    const entrada = (document.getElementById('edt_entrada_'+id).value.replace(/\D/g,''))/100;
    const qtd = parseInt(document.getElementById('edt_parcelas_'+id).value);
    const juros = parseFloat(document.getElementById('edt_juros_'+id).value);
    const prazo = parseInt(document.getElementById('edt_prazo_'+id)?.value || 18); // ✅ PRAZO DE ENTREGA!

    if(!valor || qtd<=0) return alert('⚠️ Valor e quantidade de parcelas são obrigatórios!');

    const parcelas = calcularParcelas(valor, entrada, qtd, juros);

    // ✅ SALVA TUDO — INCLUINDO O PRAZO!
    const {error} = await supabase.from('propostas').update({
        valor_desejado: valor,
        valor_entrada: entrada,
        quantidade_parcelas: qtd,
        juros: juros,
        prazo_entrega: prazo, // ✅ CAMPO DO PRAZO!
        dados_parcelas: parcelas
    }).eq('id', id);

    if(error) alert('❌ Erro: ' + error.message);
    else { alert('✅ Salvo! Cliente já vê as alterações em tempo real! ⚡'); editandoId=null; }
}

// ==============================================
// ✅ GERAR PDF
// ==============================================
async function gerarPDF(proposta) {
    const valor = Number(proposta.valor_desejado||0);
    const entrada = Number(proposta.valor_entrada||0);
    const qtd = Number(proposta.quantidade_parcelas||0);
    const juros = Number(proposta.juros||0);
    const parcelas = proposta.dados_parcelas || calcularParcelas(valor, entrada, qtd, juros);
    const prazo = proposta.prazo_entrega || proposta.prazo || 18;

    const doc = document.getElementById('areaPDF');
    doc.innerHTML = `
        <h1>📄 PROPOSTA DE CRÉDITO — FLASHCRED</h1>
        <p><strong>Data:</strong> ${new Date().toLocaleDateString('pt-BR')}</p>
        <hr>
        <h3>👤 DADOS DO CLIENTE</h3>
        <p><strong>Nome:</strong> ${proposta.nome || proposta.nome_completo || 'Não informado'}</p>
        <p><strong>CPF:</strong> ${formatarCPF(proposta.cpf)}</p>
        <p><strong>Telefone:</strong> ${formatarTelefone(proposta.telefone || proposta.celular || proposta.whatsapp || '')}</p>
        <p><strong>Endereço:</strong> ${montarEndereco(proposta)}</p>
        <hr>
        <h3>💰 CONDIÇÕES DO CRÉDITO</h3>
        <p><strong>Valor Solicitado:</strong> ${formatarMoeda(valor)}</p>
        <p><strong>Valor da Entrada:</strong> ${formatarMoeda(entrada)}</p>
        <p><strong>Quantidade de Parcelas:</strong> ${qtd}x</p>
        <p><strong>Juros:</strong> ${juros}% ao mês</p>
        <p><strong>Prazo de Entrega:</strong> ${prazo} dias</p>
        <hr>
        <h3>📋 PARCELAS</h3>
        <table>
            <tr><th>Parcela</th><th>Valor</th><th>Vencimento</th></tr>
            ${parcelas.map(p=>`<tr><td>${p.numero}ª</td><td>${formatarMoeda(p.valor)}</td><td>${p.vencimento?.split('-').reverse().join('/')||'---'}</td></tr>`).join('')}
        </table>
    `;

    const canvas = await html2canvas(doc, {scale:2});
    const imgData = canvas.toDataURL('image/png');
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const w = pdf.internal.pageSize.getWidth();
    const h = (canvas.height * w) / canvas.width;
    pdf.addImage(imgData, 'PNG', 0, 0, w, h);
    pdf.save(`Proposta_${(proposta.nome||'SemNome').replace(/\s+/g,'_')}_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.pdf`);
}

// ==============================================
// ✅ ENVIAR PROPOSTA NO WHATSAPP — COM LINK
// ==============================================
async function enviarPropostaWhatsApp(proposta) {
    const tel = (proposta.telefone || proposta.celular || proposta.whatsapp || '').replace(/\D/g,'');
    if(!tel || tel.length<11) return alert('⚠️ Telefone do cliente não encontrado!');

    const valor = Number(proposta.valor_desejado||0);
    const entrada = Number(proposta.valor_entrada||0);
    const qtd = Number(proposta.quantidade_parcelas||0);
    const juros = Number(proposta.juros||0);
    const parcelas = proposta.dados_parcelas || calcularParcelas(valor, entrada, qtd, juros);
    const valorParc = parcelas[0]?.valor || 0;
    const prazo = proposta.prazo_entrega || proposta.prazo || 18;
    const cpfLimpo = (proposta.cpf||'').replace(/\D/g,'');
    const linkAcompanhamento = `${URL_CONSULTA}?cpf=${cpfLimpo}`;

    const mensagem = `📄 *PROPOSTA DE CRÉDITO — FLASHCRED*

Olá ${proposta.nome}! Segue sua proposta detalhada:

💰 *Condições:*
• Valor solicitado: ${formatarMoeda(valor)}
• Entrada: ${formatarMoeda(entrada)}
• ${qtd}x de ${formatarMoeda(valorParc)}
• Juros: ${juros}% ao mês
• 📦 Prazo de entrega: ${prazo} dias

✅ Assim que aprovado, você escolhe as parcelas, assina o contrato e gera seu Pix!

🔍 *Acompanhe aqui:* ${linkAcompanhamento}
Basta acessar e ver tudo atualizado em tempo real!
`;

    await gerarPDF(proposta);
    setTimeout(() => {
        window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(mensagem)}`, '_blank');

}

// ==============================================
// ✅ DEMAIS FUNÇÕES
// ==============================================
function editarProposta(id) { editandoId = id; renderizarPropostas(); }
window.atualizarCalculo = function(id) {
    const valor = (document.getElementById('edt_valor_'+id)?.value||'0').replace(/\D/g,'')/100;
    const entrada = (document.getElementById('edt_entrada_'+id)?.value||'0').replace(/\D/g,'')/100;
    const qtd = parseInt(document.getElementById('edt_parcelas_'+id)?.value||0);
    const juros = parseFloat(document.getElementById('edt_juros_'+id)?.value||0);
    const financiado = valor - entrada;
    let parcela = 0;
    if(qtd>0 && financiado>0) {
        const taxa = juros/100;
        parcela = taxa===0 ? financiado/qtd : financiado*(taxa*Math.pow(1+taxa,qtd))/(Math.pow(1+taxa,qtd)-1);
    }
    const el = document.getElementById('calculo_'+id);
    if(el) el.innerHTML = `💡 Valor de cada parcela: <strong>${formatarMoeda(parcela)}</strong> · ${qtd}x · Juros: ${juros}% · Prazo: ${document.getElementById('edt_prazo_'+id)?.value||18} dias`;
};
async function aprovarProposta(id) {
    const p = propostas.find(x=>x.id===id);
    const valor = p.valor_desejado||0;
    const entrada = p.valor_entrada||0;
    const qtd = p.quantidade_parcelas||1;
    const juros = p.juros||0;
    const parcelas = p.dados_parcelas?.length?p.dados_parcelas:calcularParcelas(valor, entrada, qtd, juros);
    const {error} = await supabase.from('propostas').update({status:'Aprovada', dados_parcelas: parcelas}).eq('id', id);
    if(error) alert('❌ Erro: ' + error.message);
    else alert('✅ APROVADA! Cliente já vê em tempo real! ⚡');
}
async function reprovarProposta(id) {
    if(!confirm('Reprovar?')) return;
    const {error} = await supabase.from('propostas').update({status:'Reprovada'}).eq('id', id);
    if(error) alert('❌ Erro: ' + error.message);
    else alert('✅ Reprovada!');
}
async function excluirProposta(id) {
    if(!confirm('Excluir? Sem retorno!')) return;
    const {error} = await supabase.from('propostas').delete().eq('id', id);
    if(error) alert('❌ Erro: ' + error.message);
    else alert('✅ Excluída!');
}
async function marcarEntradaPaga(id) {
    const {error} = await supabase.from('propostas').update({entrada_paga:true}).eq('id', id);
    if(error) alert('❌ Erro: ' + error.message);
    else alert('✅ Entrada marcada como PAGA! Cliente já vê! ⚡');
}

// ==============================================
// ✅ RENDERIZAR LISTA
// ==============================================
function renderizarPropostas() {
    const lista = document.getElementById('listaPropostas');
    let html = '';
    let qtdNovas=0, qtdAprovadas=0, qtdPendentes=0, totalEntrado=0, totalFalta=0;

    propostas.forEach(p => {
        const valor = Number(p.valor_desejado||0);
        const entrada = Number(p.valor_entrada||0);
        const qtd = Number(p.quantidade_parcelas||0);
        const juros = Number(p.juros||0);
        const status = p.status||'Nova';
        const entradaPaga = !!p.entrada_paga;
        const parcelas = p.dados_parcelas||[];
        const estaEditando = editandoId===p.id;
        const prazo = p.prazo_entrega || p.prazo || 18;

        const nome = p.nome||p.nome_completo||'Não informado';
        const cpf = formatarCPF(p.cpf);
        const telefone = formatarTelefone(p.telefone||p.celular||p.whatsapp||'');
        const enderecoCompleto = montarEndereco(p);

        const financiado = valor - entrada;
        let parcelaValor = 0;
        if(qtd>0 && financiado>0) {
            const taxa = juros/100;
            parcelaValor = taxa===0 ? financiado/qtd : financiado*(taxa*Math.pow(1+taxa,qtd))/(Math.pow(1+taxa,qtd)-1);
        }

        if(entradaPaga) totalEntrado += entrada;
        const falta = valor - (entradaPaga?entrada:0);
        if(falta>0) totalFalta += falta;
        if(status==='Nova') qtdNovas++;
        if(status==='Aprovada') { qtdAprovadas++; if(!entradaPaga) qtdPendentes++; }

        const classeStatus = status==='Aprovada'?'status-aprovada':status==='Reprovada'?'status-reprovada':'status-nova';

        html += `
        <div class="cartao ${status==='Nova'?'novo-piscando':''}">
            <div class="linha" style="justify-content:space-between;">
                <h2>👤 ${nome}</h2>
                <span class="status ${classeStatus}">${status}</span>
            </div>

            <div class="dados-cliente">
                <div class="linha"><span class="etiqueta">📋 CPF:</span><span class="valor">${cpf}</span></div>
                ${telefone?`<div class="linha"><span class="etiqueta">📱 Telefone:</span><span class="valor">${telefone}</span></div>`:''}
                <div class="linha"><span class="etiqueta">🏠 Endereço:</span><span class="valor">${enderecoCompleto}</span></div>
            </div>

            ${!estaEditando ? `
            <div class="linha"><span class="etiqueta">Valor Solicitado:</span><span class="valor">${formatarMoeda(valor)}</span></div>
            <div class="linha"><span class="etiqueta">Valor da Entrada:</span><span class="valor">${formatarMoeda(entrada)} ${entradaPaga?'✅ PAGA':'⏳ Pendente'}</span></div>
            <div class="linha"><span class="etiqueta">Parcelas / Juros:</span><span class="valor">${qtd}x · ${juros}% ao mês</span></div>
            <div class="prazo-entrega">📦 Prazo de entrega: <strong>${prazo} dias</strong></div>
            <div class="calculo-resultado">💡 Valor aproximado de cada parcela: <strong>${formatarMoeda(parcelaValor)}</strong></div>

            <div class="resumo-financeiro">
                <h4>📊 Resumo desta Proposta</h4>
                <div class="linha"><span class="etiqueta">Valor Total:</span><span class="valor">${formatarMoeda(valor)}</span></div>
                <div class="linha"><span class="etiqueta">Já Entrou:</span><span style="color:${entradaPaga?'#059669':'#F59E0B'}; font-weight:bold;">${entradaPaga?formatarMoeda(entrada):'Ainda não'}</span></div>
                <div class="linha"><span class="etiqueta">Falta Receber:</span><span class="valor">${formatarMoeda(falta)}</span></div>
            </div>
            ` : `
            <div class="modo-edicao">
                <div class="linha"><span class="etiqueta">Valor Solicitado R$:</span><input type="text" id="edt_valor_${p.id}" class="input-editar" value="${valor.toFixed(2).replace('.',',')}" oninput="atualizarCalculo(${p.id})"></div>
                <div class="linha"><span class="etiqueta">Valor Entrada R$:</span><input type="text" id="edt_entrada_${p.id}" class="input-editar" value="${entrada.toFixed(2).replace('.',',')}" oninput="atualizarCalculo(${p.id})"></div>
                <div class="linha"><span class="etiqueta">Qtd Parcelas:</span><input type="number" id="edt_parcelas_${p.id}" class="input-editar" value="${qtd}" min="1" oninput="atualizarCalculo(${p.id})" style="width:80px;"></div>
                <div class="linha"><span class="etiqueta">Juros (% ao mês):</span><input type="number" step="0.01" id="edt_juros_${p.id}" class="input-editar" value="${juros}" oninput="atualizarCalculo(${p.id})" style="width:80px;"></div>
                <div class="linha"><span class="etiqueta">📦 Prazo Entrega (dias):</span><input type="number" id="edt_prazo_${p.id}" class="input-editar" value="${prazo}" min="1" style="width:80px;"></div>
                <div id="calculo_${p.id}" class="calculo-resultado">💡 Valor de cada parcela: <strong>Calculando...</strong></div>
                <div class="linha" style="margin-top:10px;">
                    <button onclick="salvarEdicao(${p.id})" class="botao botao-sucesso">💾 Salvar e Atualizar</button>
                    <button onclick="editandoId=null; renderizarPropostas();" class="botao botao-perigo">❌ Cancelar</button>
                </div>
            </div>
            `}

            ${parcelas.length>0 ? `
            <div class="separador"></div>
            <h3 style="margin-bottom:8px;">📋 Parcelas com Vencimento:</h3>
            ${parcelas.map(x=>`<div class="info-parcela" style="background:${x.paga?'#D1FAE5':'#FEF3C7'};">${x.numero}ª · ${formatarMoeda(x.valor)} · Vence: ${x.vencimento?.split('-').reverse().join('/')||'---'} · ${x.paga?'✅ PAGA':'⏳ A vencer'}</div>`).join('')}
            `:''}

            <div class="separador"></div>
            <div class="botao-grupo">
                ${!estaEditando ? `
                <button onclick="editarProposta(${p.id})" class="botao botao-alerta">✏️ Editar</button>
                <button onclick="gerarPDF(${JSON.stringify(p).replace(/"/g,'&quot;')})" class="botao botao-pdf">📄 Gerar PDF</button>
                ${telefone?`<button onclick="enviarPropostaWhatsApp(${JSON.stringify(p).replace(/"/g,'&quot;')})" class="botao botao-whatsapp">💬 Enviar Proposta</button>`:''}
                ${status==='Nova'?`
                <button onclick="aprovarProposta(${p.id})" class="botao botao-sucesso">✅ Aprovar</button>
                <button onclick="reprovarProposta(${p.id})" class="botao botao-perigo">❌ Reprovar</button>
                `:''}
                ${status==='Aprovada'&&!entradaPaga?`<button onclick="marcarEntradaPaga(${p.id})" class="botao botao-azul">💰 Marcar Entrada Paga</button>`:''}
                <button onclick="excluirProposta(${p.id})" class="botao botao-perigo">🗑️ Excluir</button>
                `:''}
            </div>
        </div>`;
    });

    lista.innerHTML = html || '<p style="text-align:center; padding:50px; color:var(--texto-claro);">Nenhuma proposta recebida ainda.</p>';

    document.getElementById('qtdNovas').textContent = qtdNovas;
    document.getElementById('qtdAprovadas').textContent = qtdAprovadas;
    document.getElementById('qtdPendentes').textContent = qtdPendentes;
    document.getElementById('badgeSino').textContent = qtdNovas;
    document.getElementById('totalEntrado').textContent = formatarMoeda(totalEntrado);
    document.getElementById('totalFalta').textContent = formatarMoeda(totalFalta);
}
</script>
</body>
</html>
