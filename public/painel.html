<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
            --bg-body: #F8FAFC;
            --borda: #E2E8F0;
            --texto: #334155;
            --texto-claro: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); padding: 16px; line-height: 1.5; }

        .login { max-width: 380px; margin: 80px auto; background: white; padding: 28px; border-radius: 16px; box-shadow: 0 4px 16px rgba(10,36,99,0.06); }
        .login h2 { text-align: center; color: var(--primary); margin-bottom: 22px; font-size: 20px; }
        input { width: 100%; padding: 11px 14px; border: 1px solid var(--borda); border-radius: 8px; font-size: 15px; margin: 6px 0 14px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10,36,99,0.08); }
        button { border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-entrar { width: 100%; padding: 11px; background: var(--primary); color: white; }
        .btn-entrar:hover { background: #0c3499; }
        .erro { color: var(--perigo); text-align: center; margin-top: 8px; display: none; font-size: 14px; }

        .container { max-width: 1000px; margin: 0 auto; display: none; }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
        h1 { color: var(--primary); font-size: 20px; font-weight: 700; }
        
        .topo-acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn-topo { padding: 6px 12px; font-size: 12px; border-radius: 6px; background: #e2e8f0; color: #334155; }
        .btn-topo:hover { background: #cbd5e1; }

        .caixa-totais { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
        .total-card { background: white; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--borda); }
        .total-label { font-size: 12px; color: var(--texto-claro); font-weight: 600; }
        .total-valor { font-size: 20px; font-weight: 700; color: var(--primary); margin-top: 4px; }
        .total-ent { color: var(--sucesso); }
        .total-falta { color: var(--alerta); }

        .busca { background: white; padding: 16px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 18px; }
        .busca label { font-size: 13px; font-weight: 600; color: var(--texto-claro); display: block; margin-bottom: 6px; }
        .busca-linha { display: flex; gap: 10px; }
        .busca input { flex: 1; margin: 0; }
        .btn-busca { padding: 11px 18px; background: var(--primary); color: white; white-space: nowrap; }

        .alerta-novo { background: #FEF3C7; border-left: 3px solid var(--alerta); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }

        .proposta { background: white; padding: 18px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 14px; }
        .proposta-topo { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .proposta-nome { font-size: 16px; font-weight: 700; color: var(--primary); }
        .proposta-info { font-size: 12px; color: var(--texto-claro); margin-top: 3px; }
        .status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-nova { background: #FEF3C7; color: #92400E; }
        .status-aprovada { background: #D1FAE5; color: #065F46; }
        .status-reprovada { background: #FEE2E2; color: #991B1B; }

        .grid-midias { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; background: #F8FAFC; padding: 10px; border-radius: 8px; border: 1px solid var(--borda); }
        .bloco-midia { text-align: center; }
        .bloco-midia span { font-size: 11px; font-weight: 600; color: var(--texto-claro); display: block; margin-bottom: 4px; }
        .img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; transition: transform 0.2s; }
        .img-preview:hover { transform: scale(1.05); }

        .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
        .campo label { font-size: 12px; color: var(--texto-claro); font-weight: 600; display: block; margin-bottom: 3px; }
        .campo input { padding: 8px 10px; margin: 0; border: 1px solid var(--borda); border-radius: 6px; font-size: 14px; width: 100%; }
        .campo input[readonly] { background: #F8FAFC; color: var(--sucesso); font-weight: 600; }

        /* Parcelas com Cores e Botão do WhatsApp */
        .bloco-parcelas-admin { background: #f8fafc; border: 1px solid var(--borda); padding: 12px; border-radius: 8px; margin-top: 12px; }
        .bloco-parcelas-admin h4 { font-size: 13px; color: var(--primary); margin-bottom: 8px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .lista-parcelas-scroll { max-height: 200px; overflow-y: auto; padding-right: 4px; }
        
        .linha-parcela-edit { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; flex-wrap: wrap; padding: 6px; border: 1px solid var(--borda); border-radius: 6px; }
        /* Cores dinâmicas por estado da parcela */
        .parc-paga { background: #D1FAE5 !important; border-color: #6EE7B7 !important; }
        .parc-vencida { background: #FEE2E2 !important; border-color: #FCA5A5 !important; }
        .parc-avencer { background: #FEF3C7 !important; border-color: #FCD34D !important; }

        .linha-parcela-edit input { padding: 3px 6px; font-size: 12px; border: 1px solid var(--borda); border-radius: 4px; }
        .btn-baixa-parcela { padding: 4px 8px; font-size: 11px; background: var(--alerta); color: #1E293B; border-radius: 4px; font-weight: 600; cursor: pointer; }
        .btn-baixa-paga { background: var(--sucesso) !important; color: white !important; }
        .btn-wpp-parcela { padding: 4px 8px; font-size: 11px; background: #25D366; color: white; border-radius: 4px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; }

        .botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn { padding: 8px 14px; font-size: 13px; border-radius: 7px; }
        .btn-aprovar { background: var(--sucesso); color: white; }
        .btn-manual { background: var(--alerta); color: #1E293B; }
        .btn-reprovar { background: var(--perigo); color: white; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-excluir { background: #F1F5F9; color: #64748B; }

        .vazio { text-align: center; color: var(--texto-claro); padding: 40px; font-size: 15px; }
        .carregando { text-align: center; padding: 30px; color: var(--texto-claro); display: none; font-size: 14px; }
        .qrcode-img { max-width: 100px; border-radius: 6px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div id="telaLogin" class="login">
    <h2>🔐 Acesso Administrativo</h2>
    <label style="font-weight:600; font-size:14px; color:#475569;">Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha">
    <button onclick="entrar()" class="btn-entrar">Entrar</button>
    <p id="erroLogin" class="erro">Senha incorreta!</p>
</div>

<div id="telaPainel" class="container">
    <div class="topo">
        <h1>📋 Painel de Controle</h1>
        <div class="topo-acoes">
            <span id="labelModo" style="font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: #FEF3C7; color: #92400E;">⚡ Modo Produção</span>
            <button onclick="alternarModo()" class="btn-topo">🔄 Alternar Modo</button>
            <button onclick="alterarSenha()" class="btn-topo">🔑 Alterar Senha</button>
            <button onclick="sair()" class="btn-topo" style="background:#FEE2E2; color:#991B1B;">🚪 Sair</button>
        </div>
    </div>

    <div class="caixa-totais">
        <div class="total-card">
            <div class="total-label">💰 Total de Propostas</div>
            <div class="total-valor" id="totalPropostas">0</div>
        </div>
        <div class="total-card">
            <div class="total-label total-ent">✅ Entradas Recebidas</div>
            <div class="total-valor total-ent" id="totalEntradas">R$ 0,00</div>
        </div>
        <div class="total-card">
            <div class="total-label total-falta">⏳ Valor a Receber</div>
            <div class="total-valor total-falta" id="totalFalta">R$ 0,00</div>
        </div>
    </div>

    <div id="alertaNovas" class="alerta-novo">🔔 Você tem novas propostas!</div>

    <div class="busca">
        <label>🔍 Buscar por CPF ou Código Único</label>
        <div class="busca-linha">
            <input type="text" id="busca" placeholder="Digite o CPF ou Código" oninput="filtrar()">
            <button onclick="carregar()" class="btn-busca">Atualizar</button>
        </div>
    </div>

    <div id="lista"></div>
    <div id="carregando" class="carregando">Carregando propostas...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let SENHA_ATUAL = localStorage.getItem('flash_senha') || 'flash2026';
let modoAtual = localStorage.getItem('flash_modo') || 'producao';
let propostas = [];
let timer = null;
let processando = false;

window.onload = () => {
    atualizarLabelModo();
    if(localStorage.getItem('flash_logado') === 'true') {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregar();
        timer = setInterval(() => carregar(true), 10000);
    }
};

function entrar() {
    if (document.getElementById('senha').value === SENHA_ATUAL) {
        localStorage.setItem('flash_logado', 'true');
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregar();
        timer = setInterval(() => carregar(true), 10000);
    } else {
        document.getElementById('erroLogin').style.display = 'block';
    }
}

function sair() {
    localStorage.removeItem('flash_logado');
    clearInterval(timer);
    window.location.reload();
}

function alterarSenha() {
    let nova = prompt('Digite a nova senha de acesso:');
    if (nova && nova.trim() !== '') {
        SENHA_ATUAL = nova.trim();
        localStorage.setItem('flash_senha', SENHA_ATUAL);
        alert('✅ Senha alterada com sucesso!');
    }
}

function alternarModo() {
    modoAtual = modoAtual === 'producao' ? 'teste' : 'producao';
    localStorage.setItem('flash_modo', modoAtual);
    atualizarLabelModo();
}

function atualizarLabelModo() {
    const lbl = document.getElementById('labelModo');
    if (modoAtual === 'producao') {
        lbl.textContent = '⚡ Modo Produção';
        lbl.style.background = '#D1FAE5';
        lbl.style.color = '#065F46';
    } else {
        lbl.textContent = '🧪 Modo Teste';
        lbl.style.background = '#FEF3C7';
        lbl.style.color = '#92400E';
    }
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

async function carregar(silencioso = false) {
    if (!silencioso) document.getElementById('carregando').style.display = 'block';
    const { data, error } = await supabase.from('propostas').select('*').order('created_at', { ascending: false });
    if (!silencioso) document.getElementById('carregando').style.display = 'none';
    if (error) { alert('Erro ao carregar: ' + error.message); return; }

    const qtdAnt = propostas.length;
    propostas = data || [];

    const totalEntradas = propostas.reduce((s, p) => s + Number(p.valor_entrada || 0), 0);
    const totalRestante = propostas.reduce((s, p) => {
        const total = Number(p.valor_desejado || 0);
        const entrada = Number(p.valor_entrada || 0);
        return s + (total - entrada);
    }, 0);

    document.getElementById('totalPropostas').textContent = propostas.length;
    document.getElementById('totalEntradas').textContent = real(totalEntradas);
    document.getElementById('totalFalta').textContent = real(totalRestante);

    if (silencioso && propostas.length > qtdAnt) {
        const alerta = document.getElementById('alertaNovas');
        alerta.style.display = 'block';
        setTimeout(() => alerta.style.display = 'none', 5000);
    }
    filtrar();
}

function filtrar() {
    const busca = document.getElementById('busca').value.replace(/\D/g, '');
    let lista = propostas;
    if (busca.length >= 11) {
        lista = propostas.filter(p => (p.cpf || '').replace(/\D/g, '').includes(busca));
    } else if (busca.length >= 4) {
        lista = propostas.filter(p => (p.codigo_unico || '').toUpperCase().includes(busca.toUpperCase()));
    }
    document.getElementById('lista').innerHTML = lista.length === 0 
        ? '<p class="vazio">Nenhuma proposta encontrada</p>'
        : lista.map(criarCard).join('');
}

function criarCard(p) {
    const statusCls = p.status === 'Aprovada' ? 'status-aprovada' : 
                       p.status === 'Reprovada' ? 'status-reprovada' : 'status-nova';
    const statusTxt = p.status === 'Aprovada' ? '✅ Aprovada' : 
                      p.status === 'Reprovada' ? '❌ Reprovada' : '⏳ Aguardando';

    const valorTotal = Number(p.valor_desejado || 0);
    const percEnt = Number(p.percentual_entrada || 20);
    const valorEnt = valorTotal * percEnt / 100;
    const parcelasQtd = Number(p.quantidade_parcelas || 1);
    const juros = Number(p.juros || 0);
    const resto = valorTotal - valorEnt;
    const valParc = parcelasQtd > 0 ? resto * (1 + juros/100) / parcelasQtd : 0;

    const cpf = (p.cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    
    const qrExibicao = p.qr_code_entrada ? `<img src="${p.qr_code_entrada}" class="qrcode-img" alt="QR">` : '<span style="color:#94a3b8; font-size:11px;">Pendente</span>';
    const selfieExibicao = p.selfie_cliente ? `<img src="${p.selfie_cliente}" class="img-preview" onclick="abrirImagem('${p.selfie_cliente}')" alt="Selfie">` : '<span style="color:#94a3b8; font-size:11px;">Não enviada</span>';
    const contratoExibicao = p.contrato_assinado ? `<img src="${p.contrato_assinado}" class="img-preview" onclick="abrirImagem('${p.contrato_assinado}')" alt="Contrato">` : '<span style="color:#94a3b8; font-size:11px;">Não assinado</span>';

    let htmlParcelasAdmin = '';
    const dadosSalvos = p.dados_parcelas || [];
    const hojeStr = new Date().toISOString().split('T')[0];

    for (let i = 1; i <= parcelasQtd; i++) {
        let parcelaSalva = dadosSalvos.find(x => x.numero === i) || {};
        let valorItem = parcelaSalva.valor !== undefined ? parcelaSalva.valor : valParc;
        
        let vencimentoPadrao = new Date();
        vencimentoPadrao.setMonth(vencimentoPadrao.getMonth() + i);
        let dataItem = parcelaSalva.vencimento || vencimentoPadrao.toISOString().split('T')[0];
        
        let paga = parcelaSalva.paga ? true : false;
        
        // Determina a cor com base na data e status da parcela
        let classeCor = 'parc-avencer';
        if (paga) {
            classeCor = 'parc-paga';
        } else if (dataItem < hojeStr) {
            classeCor = 'parc-vencida';
        }

        let estiloBtnBaixa = paga ? 'btn-baixa-parcela btn-baixa-paga' : 'btn-baixa-parcela';
        let textoBtnBaixa = paga ? '✅ Paga' : '⏳ Dar Baixa';

        // Link de WhatsApp para cobrança individual desta parcela
        let msgWpp = `Olá ${p.nome}, passando para lembrar da sua ${i}ª parcela no valor de ${real(valorItem)}, com vencimento em ${dataItem.split('-').reverse().join('/')}. Evite juros!`;
        let linkWppParc = `https://wa.me/55${(p.telefone || '').replace(/\D/g, '')}?text=${encodeURIComponent(msgWpp)}`;

        htmlParcelasAdmin += `
        <div class="linha-parcela-edit ${classeCor}" id="linha-parc-${p.id}-${i}">
            <span><strong>${i}ª</strong></span>
            <input type="number" step="0.01" id="p-val-${p.id}-${i}" value="${Number(valorItem).toFixed(2)}" style="width: 75px;" title="Valor">
            <input type="date" id="p-data-${p.id}-${i}" value="${dataItem}" style="width: 115px;" title="Vencimento">
            <button type="button" class="${estiloBtnBaixa}" id="btn-pago-${p.id}-${i}" onclick="alternarBaixaParcela(${p.id}, ${i})">${textoBtnBaixa}</button>
            <a href="${linkWppParc}" target="_blank" class="btn-wpp-parcela" title="Enviar Cobrança no WhatsApp">💬 Cobrar</a>
        </div>`;
    }

    return `
    <div class="proposta">
        <div class="proposta-topo">
            <div>
                <div class="proposta-nome">${p.nome}</div>
                <div class="proposta-info">Código: ${p.codigo_unico || '---'} | CPF: ${cpf}</div>
                <div class="proposta-info">Telefone: ${p.telefone || '---'}</div>
            </div>
            <span class="status ${statusCls}">${statusTxt}</span>
        </div>

        <div class="grid-midias">
            <div class="bloco-midia">
                <span>📸 Selfie de Rosto</span>
                ${selfieExibicao}
            </div>
            <div class="bloco-midia">
                <span>✍️ Contrato Assinado</span>
                ${contratoExibicao}
            </div>
            <div class="bloco-midia">
                <span>📌 QR Code Pix</span>
                ${qrExibicao}
            </div>
        </div>

        <div class="grade">
            <div class="campo">
                <label>Valor Total (R$)</label>
                <input type="number" id="v-${p.id}" value="${valorTotal}" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (%)</label>
                <input type="number" id="p-${p.id}" value="${percEnt}" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (R$)</label>
                <input type="text" id="e-${p.id}" value="${real(valorEnt)}" readonly>
            </div>
            <div class="campo">
                <label>Parcelas (1-48)</label>
                <input type="number" id="par-${p.id}" value="${parcelasQtd}" min="1" max="48" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Juros % ao mês</label>
                <input type="number" id="j-${p.id}" value="${juros}" step="0.01" oninput="atualizar(${p.id})">
            </div>
            <div class="campo">
                <label>Média Parcela (R$)</label>
                <input type="text" id="vp-${p.id}" value="${real(valParc)}" readonly>
            </div>
        </div>

        <div class="bloco-parcelas-admin">
            <h4>
                <span>📅 Cronograma de Parcelas (${parcelasQtd}x)</span>
                <span style="font-size: 11px; color: var(--texto-claro);">🟨 A vencer | 🟥 Vencida | 🟩 Paga</span>
            </h4>
            <div class="lista-parcelas-scroll" id="container-parc-edit-${p.id}">
                ${htmlParcelasAdmin}
            </div>
        </div>

        <div class="botoes">
            <button class="btn btn-aprovar" onclick="aprovar(${p.id})">✅ Aprovar + Salvar</button>
            <button class="btn btn-manual" onclick="marcarEntradaManual(${p.id})">💰 Marcar Entrada Paga</button>
            <button class="btn btn-reprovar" onclick="reprovar(${p.id})">❌ Reprovar</button>
            <button class="btn btn-whatsapp" onclick="enviarWhatsApp(${p.id})">📱 WhatsApp Geral</button>
            <button class="btn btn-excluir" onclick="excluir(${p.id})">🗑️ Excluir</button>
        </div>
    </div>`;
}

function abrirImagem(base64Str) {
    const win = window.open();
    win.document.write(`<iframe src="${base64Str}" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;"></iframe>`);
}

function atualizar(id) {
    const valor = Number(document.getElementById(`v-${id}`).value) || 0;
    const perc = Number(document.getElementById(`p-${id}`).value) || 0;
    const parcelas = Number(document.getElementById(`par-${id}`).value) || 0;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;

    const entrada = valor * perc / 100;
    const resto = valor - entrada;
    const valorParc = parcelas > 0 ? resto * (1 + juros/100) / parcelas : 0;

    document.getElementById(`e-${id}`).value = real(entrada);
    document.getElementById(`vp-${id}`).value = real(valorParc);

    const container = document.getElementById(`container-parc-edit-${id}`);
    if (container) {
        let html = '';
        const hoje = new Date();
        const hojeStr = hoje.toISOString().split('T')[0];
        
        for (let i = 1; i <= parcelas; i++) {
            let vencimentoPadrao = new Date();
            vencimentoPadrao.setMonth(hoje.getMonth() + i);
            let dataStr = vencimentoPadrao.toISOString().split('T')[0];

            html += `
            <div class="linha-parcela-edit parc-avencer" id="linha-parc-${id}-${i}">
                <span><strong>${i}ª</strong></span>
                <input type="number" step="0.01" id="p-val-${id}-${i}" value="${valorParc.toFixed(2)}" style="width: 75px;" title="Valor">
                <input type="date" id="p-data-${id}-${i}" value="${dataStr}" style="width: 115px;" title="Vencimento">
                <button type="button" class="btn-baixa-parcela" id="btn-pago-${id}-${i}" onclick="alternarBaixaParcela(${id}, ${i})">⏳ Dar Baixa</button>
                <a href="#" target="_blank" class="btn-wpp-parcela">💬 Cobrar</a>
            </div>`;
        }
        container.innerHTML = html;
    }
}

async function alternarBaixaParcela(idProposta, numParcela) {
    const btn = document.getElementById(`btn-pago-${idProposta}-${numParcela}`);
    const linha = document.getElementById(`linha-parc-${idProposta}-${numParcela}`);
    const jaEstaPaga = btn.classList.contains('btn-baixa-paga');
    
    if (jaEstaPaga) {
        btn.classList.remove('btn-baixa-paga');
        btn.textContent = '⏳ Dar Baixa';
        linha.className = 'linha-parcela-edit parc-avencer';
    } else {
        btn.classList.add('btn-baixa-paga');
        btn.textContent = '✅ Paga';
        linha.className = 'linha-parcela-edit parc-paga';
    }

    const proposta = propostas.find(p => p.id === idProposta);
    if (!proposta) return;

    const parcelasQtd = Number(document.getElementById(`par-${idProposta}`).value) || 1;
    let parcelasPersonalizadas = [];

    for (let i = 1; i <= parcelasQtd; i++) {
        let inputVal = document.getElementById(`p-val-${idProposta}-${i}`);
        let inputData = document.getElementById(`p-data-${idProposta}-${i}`);
        let botaoItem = document.getElementById(`btn-pago-${idProposta}-${i}`);

        if (inputVal && inputData && botaoItem) {
            parcelasPersonalizadas.push({
                numero: i,
                valor: Number(inputVal.value),
                vencimento: inputData.value,
                paga: botaoItem.classList.contains('btn-baixa-paga')
            });
        }
    }

    try {
        await supabase.from('propostas').update({ dados_parcelas: parcelasPersonalizadas }).eq('id', idProposta);
    } catch (err) {
        console.error('Erro ao atualizar baixa:', err.message);
    }
}

async function aprovar(id) {
    if (processando) return;
    const proposta = propostas.find(p => p.id === id);
    if (!proposta) return;

    const valor = Number(document.getElementById(`v-${id}`).value) || 0;
    const perc = Number(document.getElementById(`p-${id}`).value) || 0;
    const entrada = valor * perc / 100;
    const parcelas = Number(document.getElementById(`par-${id}`).value) || 1;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;

    let parcelasPersonalizadas = [];
    for (let i = 1; i <= parcelas; i++) {
        const inputVal = document.getElementById(`p-val-${id}-${i}`);
        const inputData = document.getElementById(`p-data-${id}-${i}`);
        const botaoItem = document.getElementById(`btn-pago-${id}-${i}`);
        
        if (inputVal && inputData) {
            parcelasPersonalizadas.push({
                numero: i,
                valor: Number(inputVal.value),
                vencimento: inputData.value,
                paga: botaoItem ? botaoItem.classList.contains('btn-baixa-paga') : false
            });
        }
    }

    if (!confirm(`✅ Aprovar a proposta de ${proposta.nome}?`)) return;

    processando = true;
    try {
        const { error } = await supabase.from('propostas').update({
            status: 'Aprovada',
            valor_desejado: valor,
            percentual_entrada: perc,
            valor_entrada: entrada,
            quantidade_parcelas: parcelas,
            juros: juros,
            dados_parcelas: parcelasPersonalizadas
        }).eq('id', id);

        if (error) throw error;
        alert('✅ Salvo com sucesso!');
        carregar();
    } catch (erro) {
        alert('❌ Erro: ' + erro.message);
    } finally {
        processando = false;
    }
}

async function marcarEntradaManual(id) {
    if (!confirm('Confirmar recebimento da entrada manualmente?')) return;

    try {
        const { error } = await supabase.from('propostas').update({
            status: 'Aprovada',
            entrada_paga: true
        }).eq('id', id);

        if (error) throw error;
        alert('✅ Entrada marcada como paga!');
        carregar();
    } catch (erro) {
        alert('❌ Erro: ' + erro.message);
    }
}

async function reprovar(id) {
    if (!confirm('Reprovar proposta?')) return;
    await supabase.from('propostas').update({ status: 'Reprovada' }).eq('id', id);
    carregar();
}

async function enviarWhatsApp(id) {
    const p = propostas.find(x => x.id === id);
    if (!p) return;
    const link = `${window.location.origin.replace('painel.', '')}/consultar.html?cpf=${(p.cpf || '').replace(/\D/g, '')}`;
    const msg = `Olá ${p.nome}! ✅ Sua proposta foi APROVADA!\nAcesse para ver o contrato e parcelas:\n${link}`;
    window.open(`https://wa.me/55${p.telefone?.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
}

async function excluir(id) {
    if (!confirm('⚠️ Tem certeza que deseja excluir?')) return;
    await supabase.from('propostas').delete().eq('id', id);
    carregar();
}
</script>
</body>
</html>
