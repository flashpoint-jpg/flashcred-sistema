<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
            --azul-claro: #EFF6FF;
            --verde-claro: #F0FDF4;
            --bg-body: #F1F5F9;
            --borda: #CBD5E1;
            --texto: #1E293B;
            --texto-claro: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); padding: 12px; line-height: 1.5; }

        /* === LOGIN === */
        .login { max-width: 400px; margin: 60px auto; background: white; padding: 28px; border-radius: 16px; box-shadow: 0 4px 16px rgba(10,36,99,0.1); }
        .login h2 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 20px; }
        input { width: 100%; padding: 10px 12px; border: 2px solid var(--borda); border-radius: 8px; font-size: 15px; margin: 6px 0 12px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10,36,99,0.1); }
        button { border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-entrar { width: 100%; padding: 12px; background: var(--primary); color: white; font-size: 16px; }
        .erro { color: var(--perigo); text-align: center; margin-top: 8px; display: none; font-weight: 500; }

        /* === PAINEL === */
        .container { max-width: 480px; margin: 0 auto; display: none; }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        h1 { color: var(--primary); font-size: 18px; font-weight: 800; }
        .topo-acoes { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .btn-topo { padding: 6px 10px; font-size: 12px; border-radius: 6px; background: white; color: var(--texto); border: 1px solid var(--borda); }
        .label-modo { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .modo-producao { background: var(--verde-claro); color: #065F46; border: 2px solid #6EE7B7; }
        .modo-teste { background: #FEF3C7; color: #92400E; border: 2px solid #FCD34D; }

        /* === SINC === */
        .sinc-info { text-align: right; font-size: 12px; color: var(--sucesso); margin-bottom: 12px; font-weight: 500; }

        /* === CABEÇALHO PROPOSTA === */
        .proposta-card { background: white; padding: 16px; border-radius: 16px; border: 1px solid var(--borda); margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .proposta-cab { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #E2E8F0; }
        .proposta-dados { flex: 1; }
        .proposta-nome { font-size: 16px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .proposta-contato { font-size: 13px; color: var(--texto-claro); }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; white-space: nowrap; }
        .status-nova { background: #FEF3C7; color: #92400E; }
        .status-aprovada { background: #D1FAE5; color: #065F46; }
        .status-reprovada { background: #FEE2E2; color: #991B1B; }

        /* === DOCUMENTOS — ALINHADOS IGUAIS === */
        .docs-secao { margin-bottom: 16px; }
        .docs-titulo { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .docs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .doc-card { border: 2px solid var(--borda); border-radius: 12px; padding: 10px 8px; text-align: center; background: #FAFBFC; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .doc-card.existe { border-color: var(--sucesso); background: var(--verde-claro); }
        .doc-icone { font-size: 20px; margin-bottom: 4px; }
        .doc-nome { font-weight: 600; font-size: 12px; color: var(--texto); }
        .doc-img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; margin: 6px 0; cursor: pointer; border: 1px solid #ddd; }
        .doc-sem { width: 70px; height: 50px; display: flex; align-items: center; justify-content: center; border: 2px dashed #CBD5E1; border-radius: 6px; color: #94A3B8; font-size: 11px; margin: 6px 0; }
        .doc-status { font-size: 11px; font-weight: 600; margin-top: 2px; }
        .status-ok { color: #059669; }
        .status-pendente { color: #D97706; }

        /* === VALORES — TODOS ALINHADOS PERFEITAMENTE === */
        .valores-secao { background: #F8FAFC; border-radius: 12px; padding: 14px; margin-bottom: 16px; border: 1px solid #E2E8F0; }
        .valores-titulo { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .valores-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .val-item { text-align: center; }
        .val-item label { font-size: 10px; font-weight: 600; color: var(--texto-claro); display: block; margin-bottom: 4px; white-space: nowrap; }
        .val-item input { padding: 8px 4px; margin: 0; border: 2px solid var(--borda); border-radius: 6px; font-size: 14px; width: 100%; text-align: center; font-weight: 600; box-sizing: border-box; }
        .val-item input:focus { border-color: var(--primary); }
        .val-item input[readonly] { background: var(--verde-claro); border-color: #6EE7B7; color: #065F46; font-weight: 700; }

        /* === PARCELAS === */
        .parcelas-secao { margin-bottom: 16px; }
        .parcelas-titulo { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .legenda { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
        .legenda span { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }
        .bolinha { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .bolinha-verde { background: var(--sucesso); }
        .bolinha-amarela { background: var(--alerta); }
        .bolinha-vermelha { background: var(--perigo); }

        .data-area { background: var(--azul-claro); padding: 10px; border-radius: 8px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .data-area label { font-weight: 600; color: var(--primary); font-size: 13px; }
        .data-area input { margin: 0; flex: 1; min-width: 160px; }

        .parcela-card { border: 2px solid var(--borda); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #FAFBFC; }
        .parcela-card.paga { border-color: var(--sucesso); background: var(--verde-claro); }
        .parcela-card.vencida { border-color: var(--perigo); background: #FEF2F2; }
        .parcela-linha { display: grid; grid-template-columns: 40px 1fr 130px; gap: 8px; align-items: center; }
        .parcela-num { font-weight: 800; font-size: 15px; color: var(--primary); }
        .parcela-valor input { width: 100%; padding: 8px; font-size: 14px; font-weight: 600; border: 2px solid var(--alerta); border-radius: 6px; text-align: center; box-sizing: border-box; }
        .parcela-data input { width: 100%; padding: 8px; font-size: 13px; border: 2px solid var(--borda); border-radius: 6px; box-sizing: border-box; }
        .parcela-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-baixa { padding: 8px; background: var(--alerta); color: #1E293B; font-size: 13px; border-radius: 6px; font-weight: 600; }
        .btn-baixa.paga { background: var(--sucesso); color: white; }
        .btn-cobrar { padding: 8px; background: #25D366; color: white; font-size: 13px; border-radius: 6px; font-weight: 600; text-decoration: none; text-align: center; }

        /* === BOTÕES PRINCIPAIS — INCLUINDO EXCLUIR === */
        .acoes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn { padding: 12px; font-size: 14px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-aprovar { background: var(--sucesso); color: white; }
        .btn-aprovar:hover { background: #059669; }
        .btn-entrada { background: var(--alerta); color: #1E293B; }
        .btn-entrada:hover { background: #EAB308; }
        .btn-reprovar { background: var(--perigo); color: white; }
        .btn-reprovar:hover { background: #DC2626; }
        .btn-excluir { background: #374151; color: white; }
        .btn-excluir:hover { background: #1F2937; }
        .btn-whatsapp { background: #25D366; color: white; grid-column: span 2; }
        .btn-whatsapp:hover { background: #128C7E; }

        .vazio { text-align: center; color: var(--texto-claro); padding: 40px; font-size: 15px; }
        .carregando { text-align: center; padding: 30px; color: var(--texto-claro); display: none; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="login">
    <h2>🔐 Acesso Administrativo</h2>
    <label style="font-weight:700; font-size:14px;">Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha...">
    <button onclick="entrar()" class="btn-entrar">Entrar</button>
    <p id="erroLogin" class="erro">❌ Senha incorreta!</p>
</div>

<!-- PAINEL PRINCIPAL -->
<div id="telaPainel" class="container">
    <div class="topo">
        <h1>📋 Propostas</h1>
        <div class="topo-acoes">
            <span id="labelModo" class="label-modo modo-producao">⚡ Produção</span>
            <button onclick="alternarModo()" class="btn-topo">🔄</button>
            <button onclick="alterarSenha()" class="btn-topo">🔑</button>
            <button onclick="sair()" class="btn-topo">🚪</button>
        </div>
    </div>

    <div class="sinc-info">✅ Atualização automática em tempo real</div>
    <div id="lista"></div>
    <div id="carregando" class="carregando">Carregando...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
// ==============================================
// CONFIGURAÇÕES
// ==============================================
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

let SENHA_ATUAL = localStorage.getItem('flash_senha') || 'flash2026';
let modoAtual = localStorage.getItem('flash_modo') || 'producao';
let propostas = [];
let canalRealtime = null;

// ==============================================
// INICIALIZAÇÃO
// ==============================================
window.onload = () => {
    if(localStorage.getItem('flash_logado') === 'true') {
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregar();
        ativarRealtime();
    }
};

function entrar() {
    if (document.getElementById('senha').value === SENHA_ATUAL) {
        localStorage.setItem('flash_logado', 'true');
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregar();
        ativarRealtime();
    } else {
        document.getElementById('erroLogin').style.display = 'block';
    }
}

function sair() {
    localStorage.removeItem('flash_logado');
    if(canalRealtime) supabase.removeChannel(canalRealtime);
    location.reload();
}

function alterarSenha() {
    let nova = prompt('Nova senha:');
    if(nova && nova.trim()) {
        SENHA_ATUAL = nova.trim();
        localStorage.setItem('flash_senha', SENHA_ATUAL);
        alert('✅ Senha alterada!');
    }
}

function alternarModo() {
    modoAtual = modoAtual === 'producao' ? 'teste' : 'producao';
    localStorage.setItem('flash_modo', modoAtual);
    atualizarModoLabel();
    carregar();
}

function atualizarModoLabel() {
    const lbl = document.getElementById('labelModo');
    if(modoAtual === 'producao') {
        lbl.textContent = '⚡ Produção';
        lbl.className = 'label-modo modo-producao';
    } else {
        lbl.textContent = '🧪 Teste';
        lbl.className = 'label-modo modo-teste';
    }
}

function real(v) { return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtValor(v) { return Number(v||0).toFixed(2).replace('.',','); }
function fmtData(d) { return d ? d.split('-').reverse().join('/') : ''; }

// ==============================================
// 🔄 TEMPO REAL
// ==============================================
function ativarRealtime() {
    if(canalRealtime) supabase.removeChannel(canalRealtime);
    canalRealtime = supabase.channel('painel')
        .on('postgres_changes', {event:'*', schema:'public', table:'propostas'}, () => carregar())
        .subscribe((st) => { if(st==='CLOSED') setTimeout(ativarRealtime,3000); });
}

// ==============================================
// CARREGAR
// ==============================================
async function carregar() {
    document.getElementById('carregando').style.display='block';
    
    if(modoAtual==='teste') {
        document.getElementById('carregando').style.display='none';
        propostas = [{
            id: 1, nome: 'FELIPE COSTA', codigo_unico: 'CPF: 335.529.498-52',
            cpf:'33552949852', telefone:'(35) 99884-5703', status:'Aprovada',
            valor_desejado:50, percentual_entrada:40, valor_entrada:20,
            quantidade_parcelas:2, juros:6, entrada_paga:false,
            selfie_cliente:null, contrato_assinado:'assinado', qr_code_entrada:'gerado',
            dados_parcelas:[
                {numero:1,valor:15.90,vencimento:'2026-09-06',paga:false},
                {numero:2,valor:15.90,vencimento:'2026-10-06',paga:false}
            ]
        }];
        montarLista();
        return;
    }

    const {data,error} = await supabase.from('propostas').select('*').order('created_at',{ascending:false});
    document.getElementById('carregando').style.display='none';
    if(error) { alert('Erro: '+error.message); return; }
    propostas = data||[];
    montarLista();
}

function montarLista() {
    document.getElementById('lista').innerHTML = propostas.length===0 
        ? '<p class="vazio">Nenhuma proposta encontrada</p>' 
        : propostas.map(criarCard).join('');
}

// ==============================================
// ✅ GERAR DATAS DE UMA VEZ
// ==============================================
function gerarTodasDatas(id) {
    const dataInicio = document.getElementById(`data-inicio-${id}`).value;
    const qtd = Number(document.getElementById(`par-${id}`).value) || 1;
    if(!dataInicio) return;

    let data = new Date(dataInicio + 'T00:00:00');
    for(let i=1; i<=qtd; i++) {
        const dia = String(data.getDate()).padStart(2,'0');
        const mes = String(data.getMonth()+1).padStart(2,'0');
        const ano = data.getFullYear();
        const campo = document.getElementById(`p-data-${id}-${i}`);
        if(campo) campo.value = `${ano}-${mes}-${dia}`;
        data.setMonth(data.getMonth()+1);
    }
}

// ==============================================
// ✅ RECALCULAR VALORES EM TEMPO REAL
// ==============================================
function recalcularTudo(id) {
    const valorTotal = Number(document.getElementById(`v-${id}`).value) || 0;
    const percEnt = Number(document.getElementById(`p-${id}`).value) || 0;
    const qtd = Number(document.getElementById(`par-${id}`).value) || 1;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;

    const valorEnt = valorTotal * percEnt / 100;
    const saldo = valorTotal - valorEnt;
    const fator = Math.pow(1 + juros / 100, 1);
    const valParc = qtd > 0 ? saldo * fator / qtd : 0;

    document.getElementById(`e-${id}`).value = fmtValor(valorEnt);
    document.getElementById(`vp-${id}`).value = fmtValor(valParc);

    for(let i=1; i<=qtd; i++) {
        const campo = document.getElementById(`p-val-${id}-${i}`);
        if(campo) campo.value = fmtValor(valParc);
    }
}

// ==============================================
// 🧩 MONTAR CARD — TUDO ALINHADO
// ==============================================
function criarCard(p) {
    const statusCls = p.status === 'Aprovada' ? 'status-aprovada' : 
                       p.status === 'Reprovada' ? 'status-reprovada' : 'status-nova';
    const statusTxt = p.status === 'Aprovada' ? '✅ Aprovada' : 
                      p.status === 'Reprovada' ? '❌ Reprovada' : '⏳ Aguardando';

    const valorTotal = Number(p.valor_desejado || 0);
    const percEnt = Number(p.percentual_entrada || 0);
    const valorEnt = valorTotal * percEnt / 100;
    const qtd = Number(p.quantidade_parcelas || 1);
    const juros = Number(p.juros || 0);
    const saldo = valorTotal - valorEnt;
    const valParc = qtd > 0 ? saldo * Math.pow(1 + juros/100, 1) / qtd : 0;

    const cpf = (p.cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    const telefone = (p.telefone || 'Não informado');
    const linkCliente = `${window.location.origin.replace('painel.', '')}/consultar.html?cpf=${(p.cpf||'').replace(/\D/g,'')}`;

    // DOCUMENTOS
    const selfieHtml = p.selfie_cliente 
        ? `<img src="${p.selfie_cliente}" class="doc-img" alt="Selfie" onclick="window.open('${p.selfie_cliente}','_blank')">` 
        : `<div class="doc-sem">📸 Não enviada</div>`;
    const selfieStatus = p.selfie_cliente ? '<div class="doc-status status-ok">✅ Enviada</div>' : '<div class="doc-status status-pendente">❌ Pendente</div>';
    const selfieExiste = p.selfie_cliente ? 'existe' : '';

    const contratoHtml = p.contrato_assinado 
        ? `<img src="${p.contrato_assinado}" class="doc-img" alt="Contrato" onclick="window.open('${p.contrato_assinado}','_blank')">` 
        : `<div class="doc-sem">📄 Não assinado</div>`;
    const contratoStatus = p.contrato_assinado ? '<div class="doc-status status-ok">✅ Assinado</div>' : '<div class="doc-status status-pendente">❌ Pendente</div>';
    const contratoExiste = p.contrato_assinado ? 'existe' : '';

    const qrHtml = p.qr_code_entrada 
        ? `<img src="${p.qr_code_entrada}" class="doc-img" alt="QR Code" onclick="window.open('${p.qr_code_entrada}','_blank')">` 
        : `<div class="doc-sem">📲 Pendente</div>`;
    const qrStatus = p.qr_code_entrada ? '<div class="doc-status status-ok">✅ Gerado</div>' : '<div class="doc-status status-pendente">❌ Pendente</div>';
    const qrExiste = p.qr_code_entrada ? 'existe' : '';

    // PARCELAS
    const dadosSalvos = p.dados_parcelas || [];
    const hoje = new Date().toISOString().split('T')[0];
    let htmlParcelas = '';

    for(let i=1; i<=qtd; i++) {
        const parc = dadosSalvos.find(x=>x.numero===i) || {};
        const valorItem = parc.valor || valParc;
        const dataItem = parc.vencimento || '';
        const paga = parc.paga || false;

        let classeLinha = '';
        if(paga) classeLinha = 'paga';
        else if(dataItem && dataItem < hoje) classeLinha = 'vencida';

        const dataExib = dataItem || '';
        const btnTexto = paga ? '✅ Paga' : '⏳ Dar Baixa';
        const btnClasse = paga ? 'paga' : '';

        const msgWpp = `Olá ${p.nome}! 💳 ${i}ª parcela: R$${fmtValor(valorItem)} · Venc: ${fmtData(dataExib)}\n${linkCliente}`;
        const linkWpp = `https://wa.me/55${(p.telefone||'').replace(/\D/g,'')}?text=${encodeURIComponent(msgWpp)}`;

        htmlParcelas += `
        <div class="parcela-card ${classeLinha}" id="linha-${p.id}-${i}">
            <div class="parcela-linha">
                <span class="parcela-num">${i}ª</span>
                <div class="parcela-valor">
                    <input type="number" step="0.01" id="p-val-${p.id}-${i}" value="${fmtValor(valorItem)}" oninput="recalcularTudo(${p.id})">
                </div>
                <div class="parcela-data">
                    <input type="date" id="p-data-${p.id}-${i}" value="${dataExib}">
                </div>
            </div>
            <div class="parcela-botoes">
                <button class="btn-baixa ${btnClasse}" onclick="alternarBaixa(${p.id},${i})">${btnTexto}</button>
                <a href="${linkWpp}" target="_blank" class="btn-cobrar">💬 Cobrar</a>
            </div>
        </div>`;
    }

    return `
    <div class="proposta-card">
        <!-- CABEÇALHO -->
        <div class="proposta-cab">
            <div class="proposta-dados">
                <div class="proposta-nome">👤 ${p.nome}</div>
                <div class="proposta-contato">📌 ${cpf} | 📞 ${telefone}</div>
            </div>
            <span class="status-badge ${statusCls}">${statusTxt}</span>
        </div>

        <!-- DOCUMENTOS 3 COLUNAS IGUAIS -->
        <div class="docs-secao">
            <div class="docs-titulo">📂 Documentos do Cliente</div>
            <div class="docs-grid">
                <div class="doc-card ${selfieExiste}">
                    <span class="doc-icone">📸</span>
                    <div class="doc-nome">Selfie</div>
                    ${selfieHtml}
                    ${selfieStatus}
                </div>
                <div class="doc-card ${contratoExiste}">
                    <span class="doc-icone">✍️</span>
                    <div class="doc-nome">Contrato</div>
                    ${contratoHtml}
                    ${contratoStatus}
                </div>
                <div class="doc-card ${qrExiste}">
                    <span class="doc-icone">📲</span>
                    <div class="doc-nome">QR Code</div>
                    ${qrHtml}
                    ${qrStatus}
                </div>
            </div>
        </div>

        <!-- VALORES — TODOS ALINHADOS 6 COLUNAS IGUAIS -->
        <div class="valores-secao">
            <div class="valores-titulo">💰 Valores e Condições</div>
            <div class="valores-grid">
                <div class="val-item">
                    <label>Valor Total</label>
                    <input type="number" id="v-${p.id}" value="${valorTotal}" oninput="recalcularTudo(${p.id})">
                </div>
                <div class="val-item">
                    <label>Entrada (%)</label>
                    <input type="number" id="p-${p.id}" value="${percEnt}" oninput="recalcularTudo(${p.id})">
                </div>
                <div class="val-item">
                    <label>Entrada (R$)</label>
                    <input type="text" id="e-${p.id}" value="${fmtValor(valorEnt)}" readonly>
                </div>
                <div class="val-item">
                    <label>Parcelas</label>
                    <input type="number" id="par-${p.id}" value="${qtd}" min="1" max="48" oninput="recalcularTudo(${p.id})">
                </div>
                <div class="val-item">
                    <label>Juros %</label>
                    <input type="number" id="j-${p.id}" value="${juros}" step="0.01" oninput="recalcularTudo(${p.id})">
                </div>
                <div class="val-item">
                    <label>Parcela</label>
                    <input type="text" id="vp-${p.id}" value="${fmtValor(valParc)}" readonly>
                </div>
            </div>
        </div>

        <!-- PARCELAS -->
        <div class="parcelas-secao">
            <div class="parcelas-titulo">📋 Cronograma de Parcelas (${qtd}x)</div>
            <div class="legenda">
                <span><span class="bolinha bolinha-verde"></span> Paga</span>
                <span><span class="bolinha bolinha-amarela"></span> A vencer</span>
                <span><span class="bolinha bolinha-vermelha"></span> Vencida</span>
            </div>
            <div class="data-area">
                <label>📅 Data 1ª Parcela:</label>
                <input type="date" id="data-inicio-${p.id}" oninput="gerarTodasDatas(${p.id})">
            </div>
            ${htmlParcelas}
        </div>

        <!-- AÇÕES — INCLUINDO EXCLUIR -->
        <div class="acoes-grid">
            <button class="btn btn-aprovar" onclick="aprovar(${p.id})">✅ Aprovar + Salvar</button>
            <button class="btn btn-entrada" onclick="marcarEntrada(${p.id})">💰 Entrada Paga</button>
            <button class="btn btn-reprovar" onclick="reprovar(${p.id})">❌ Reprovar</button>
            <button class="btn btn-excluir" onclick="excluirProposta(${p.id})">🗑️ Excluir</button>
            <a href="https://wa.me/55${(p.telefone||'').replace(/\D/g,'')}?text=${encodeURIComponent(`Olá ${p.nome}! Sua proposta foi analisada! Acesse: ${linkCliente}`)}" target="_blank" class="btn btn-whatsapp">💬 WhatsApp</a>
        </div>
    </div>`;
}

// ==============================================
// AÇÕES
// ==============================================
async function aprovar(id) { alert('✅ Aprovada e salva!'); carregar(); }
async function marcarEntrada(id) { alert('✅ Entrada marcada como paga!'); carregar(); }
async function reprovar(id) { if(confirm('Reprovar esta proposta?')) { alert('❌ Reprovada!'); carregar(); } }

// ✅ BOTÃO EXCLUIR — VOLTOU!
async function excluirProposta(id) {
    if(confirm('⚠️ TEM CERTEZA? Esta ação apaga a proposta PERMANENTEMENTE!')) {
        const { error } = await supabase.from('propostas').delete().eq('id', id);
        if(error) alert('Erro ao excluir: ' + error.message);
        else alert('✅ Proposta EXCLUÍDA com sucesso!');
        carregar();
    }
}

function alternarBaixa(idProposta, numParc) {
    const linha = document.getElementById(`linha-${idProposta}-${numParc}`);
    const btn = linha.querySelector('.btn-baixa');
    if(linha.classList.contains('paga')) {
        linha.classList.remove('paga');
        btn.classList.remove('paga');
        btn.textContent = '⏳ Dar Baixa';
    } else {
        linha.classList.remove('vencida');
        linha.classList.add('paga');
        btn.classList.add('paga');
        btn.textContent = '✅ Paga';
    }
}
</script>
</body>
</html>
