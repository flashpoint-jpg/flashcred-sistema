<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <style>
        :root {
            --primary: #0A2463;
            --sucesso: #10B981;
            --alerta: #F59E0B;
            --perigo: #EF4444;
            --azul: #3B82F6;
            --bg-body: #F8FAFC;
            --borda: #E2E8F0;
            --texto: #334155;
            --texto-claro: #64748B;
            --pago: #D1FAE5;
            --pendente: #FEF3C7;
            --vencido: #FEE2E2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-body); color: var(--texto); padding: 16px; line-height: 1.5; }

        .login { max-width: 380px; margin: 80px auto; background: white; padding: 28px; border-radius: 16px; box-shadow: 0 4px 16px rgba(10,36,99,0.06); }
        .login h2 { text-align: center; color: var(--primary); margin-bottom: 22px; font-size: 20px; }
        input { width: 100%; padding: 11px 14px; border: 1px solid var(--borda); border-radius: 8px; font-size: 15px; margin: 6px 0 14px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10,36,99,0.08); }
        button { border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-entrar { width: 100%; padding: 11px; background: var(--primary); color: white; }
        .btn-entrar:hover { background: #0c3499; }
        .erro { color: var(--perigo); text-align: center; margin-top: 8px; display: none; font-size: 14px; }

        .container { max-width: 1100px; margin: 0 auto; display: none; }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
        h1 { color: var(--primary); font-size: 20px; font-weight: 700; }

        .caixa-totais { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        .total-card { background: white; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--borda); }
        .total-label { font-size: 12px; color: var(--texto-claro); font-weight: 600; }
        .total-valor { font-size: 20px; font-weight: 700; color: var(--primary); margin-top: 4px; }
        .total-ent { color: var(--sucesso); }
        .total-falta { color: var(--alerta); }
        .total-parc { color: var(--azul); }

        .modos { display: flex; gap: 6px; }
        .modo { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .modo-manual { background: #DBEAFE; color: #1E40AF; }
        .modo-teste { background: #FEF3C7; color: #92400E; }
        .modo-producao { background: #D1FAE5; color: #065F46; }
        .modo-ativo { box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15); }

        .busca { background: white; padding: 16px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 18px; }
        .busca label { font-size: 13px; font-weight: 600; color: var(--texto-claro); display: block; margin-bottom: 6px; }
        .busca-linha { display: flex; gap: 10px; }
        .busca input { flex: 1; margin: 0; }
        .btn-busca { padding: 11px 18px; background: var(--primary); color: white; white-space: nowrap; }

        .alerta-novo { background: #FEF3C7; border-left: 3px solid var(--alerta); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; animation: piscar 1s infinite alternate; }
        @keyframes piscar { from {opacity:1;} to {opacity:0.7;} }

        .proposta { background: white; padding: 18px; border-radius: 12px; border: 1px solid var(--borda); margin-bottom: 14px; }
        .proposta-topo { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .proposta-nome { font-size: 16px; font-weight: 700; color: var(--primary); }
        .proposta-info { font-size: 12px; color: var(--texto-claro); margin-top: 3px; line-height: 1.6; }
        .status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-nova { background: #FEF3C7; color: #92400E; }
        .status-aprovada { background: #D1FAE5; color: #065F46; }
        .status-reprovada { background: #FEE2E2; color: #991B1B; }
        .status-paga { background: #D1FAE5; color: #065F46; box-shadow: 0 0 0 2px #10B981; }

        .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
        .campo label { font-size: 12px; color: var(--texto-claro); font-weight: 600; display: block; margin-bottom: 3px; }
        .campo input { padding: 8px 10px; margin: 0; border: 1px solid var(--borda); border-radius: 6px; font-size: 14px; width: 100%; }
        .campo input[readonly] { background: #F8FAFC; color: var(--sucesso); font-weight: 600; }

        .parcelas-bloco { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--borda); }
        .parcelas-titulo { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
        .parcela-linha { display: grid; grid-template-columns: 30px 1fr 1fr 1fr 100px; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
        .parcela-paga { background: var(--pago); border-left: 3px solid var(--sucesso); }
        .parcela-pendente { background: var(--pendente); border-left: 3px solid var(--alerta); }
        .parcela-vencida { background: var(--vencido); border-left: 3px solid var(--perigo); }
        .parcela-linha input { padding: 4px 6px; font-size: 13px; width: 100%; border: 1px solid var(--borda); border-radius: 4px; }
        .parcela-linha button { padding: 3px 6px; font-size: 11px; border-radius: 4px; }

        .botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn { padding: 8px 14px; font-size: 13px; border-radius: 7px; }
        .btn-aprovar { background: var(--sucesso); color: white; }
        .btn-aprovar:hover { background: #059669; }
        .btn-aprovar:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-reprovar { background: var(--perigo); color: white; }
        .btn-reprovar:hover { background: #DC2626; }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #1fb85c; }
        .btn-excluir { background: #F1F5F9; color: #64748B; }
        .btn-excluir:hover { background: #E2E8F0; }
        .btn-pago { background: var(--azul); color: white; }
        .btn-pago:hover { background: #2563EB; }
        .btn-contrato { background: #8B5CF6; color: white; }
        .btn-contrato:hover { background: #7C3AED; }
        .btn-cobranca { background: var(--alerta); color: #1E293B; }
        .btn-cobranca:hover { background: #D97706; }

        .pix-bloco { background: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 12px; }
        .pix-codigo { font-family: monospace; font-size: 11px; word-break: break-all; margin-top: 6px; padding: 6px; background: white; border-radius: 4px; }
        .qrcode-img { max-width: 100px; border-radius: 6px; margin-top: 6px; }

        .vazio { text-align: center; color: var(--texto-claro); padding: 40px; font-size: 15px; }
        .carregando { text-align: center; padding: 30px; color: var(--texto-claro); display: none; font-size: 14px; }
        .aviso-prox { color: var(--alerta); font-weight: 600; font-size: 12px; margin-left: 6px; }
    </style>
</head>
<body>

<div id="telaLogin" class="login">
    <h2>🔐 Acesso Administrativo</h2>
    <label style="font-weight:600; font-size:14px; color:#475569;">Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha">
    <button onclick="entrar()" class="btn-entrar">Entrar</button>
    <p id="erroLogin" class="erro">Senha incorreta!</p>
</div>

<div id="telaPainel" class="container">
    <div class="topo">
        <h1>📋 Painel de Controle — FlashCred</h1>
        <div class="modos">
            <button class="modo modo-manual" onclick="definirModo('manual')">Manual</button>
            <button class="modo modo-teste" onclick="definirModo('teste')">Teste</button>
            <button class="modo modo-producao modo-ativo" onclick="definirModo('producao')">Produção</button>
        </div>
    </div>

    <div class="caixa-totais">
        <div class="total-card">
            <div class="total-label">📋 Total Propostas</div>
            <div class="total-valor" id="totalPropostas">0</div>
        </div>
        <div class="total-card">
            <div class="total-label total-ent">✅ Entradas Pagas</div>
            <div class="total-valor total-ent" id="totalEntradas">R$ 0,00</div>
        </div>
        <div class="total-card">
            <div class="total-label total-falta">⏳ A Receber</div>
            <div class="total-valor total-falta" id="totalFalta">R$ 0,00</div>
        </div>
        <div class="total-card">
            <div class="total-label total-parc">📊 Parcelas Ativas</div>
            <div class="total-valor total-parc" id="totalParcelas">0</div>
        </div>
    </div>

    <div id="alertaNovas" class="alerta-novo">🔔 Você tem proposta(s) nova(s)!</div>

    <div class="busca">
        <label>🔍 Buscar por CPF, Nome ou Código Único</label>
        <div class="busca-linha">
            <input type="text" id="busca" placeholder="Digite e aguarde..." oninput="filtrar()">
            <button onclick="carregar()" class="btn-busca">🔄 Atualizar</button>
        </div>
    </div>

    <div id="lista"></div>
    <div id="carregando" class="carregando">Carregando propostas...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SENHA = 'flash2026';
const SERVIDOR_URL = 'https://flashcred-sistema.onrender.com';

let modo = 'producao';
let propostas = [];
let timer = null;
let processando = false;
let ultimaContagem = 0;
let servidorPronto = false;

// Tenta acordar o servidor em background logo que a página abre
window.addEventListener('DOMContentLoaded', () => {
    fetch(SERVIDOR_URL, { method: 'GET', mode: 'no-cors' }).catch(() => {});
});

async function acordarServidor() {
    const btnEntrar = document.querySelector('.btn-entrar');
    btnEntrar.disabled = true;
    btnEntrar.textContent = '⏳ Conectando ao servidor...';

    for (let i = 0; i < 15; i++) {
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 4000);
            await fetch(SERVIDOR_URL, { method: 'GET', mode: 'no-cors', signal: controller.signal });
            clearTimeout(timeout);
            servidorPronto = true;
            break;
        } catch (e) {
            await new Promise(r => setTimeout(r, 2000));
        }
    }

    btnEntrar.disabled = false;
    btnEntrar.textContent = 'Entrar';
}

async function entrar() {
    if (document.getElementById('senha').value === SENHA) {
        document.getElementById('erroLogin').style.display = 'none';
        
        if (!servidorPronto) {
            await acordarServidor();
        }

        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('telaPainel').style.display = 'block';
        carregar();
        ultimaContagem = 0;
        timer = setInterval(() => carregar(true), 15000);
    } else {
        document.getElementById('erroLogin').style.display = 'block';
    }
}

function definirModo(m) {
    modo = m;
    document.querySelectorAll('.modo').forEach(b => b.classList.remove('modo-ativo'));
    event.target.classList.add('modo-ativo');
    alert(`✅ Modo ${m.toUpperCase()} ativado!`);
}

function real(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatarData(dataStr) {
    if (!dataStr) return '--/--/----';
    return new Date(dataStr).toLocaleDateString('pt-BR');
}

function dataMaisMeses(dataBase, qtd) {
    const d = dataBase ? new Date(dataBase) : new Date();
    d.setMonth(d.getMonth() + qtd);
    return d;
}

async function carregar(silencioso = false) {
    if (!silencioso) document.getElementById('carregando').style.display = 'block';
    const { data, error } = await supabase.from('propostas').select('*').order('created_at', { ascending: false });
    if (!silencioso) document.getElementById('carregando').style.display = 'none';
    if (error) { alert('Erro: ' + error.message); return; }

    const qtdAnt = ultimaContagem;
    propostas = data || [];
    ultimaContagem = propostas.length;

    const totalEntradas = propostas.reduce((s, p) => s + (p.entrada_paga ? Number(p.valor_entrada || 0) : 0), 0);
    const totalRestante = propostas.reduce((s, p) => {
        if (!p.entrada_paga) return s;
        const total = Number(p.valor_desejado || 0);
        const entrada = Number(p.valor_entrada || 0);
        return s + (total - entrada);
    }, 0);
    const totalParc = propostas.reduce((s, p) => s + (p.entrada_paga ? (p.parcelas_escolhidas || 0) : 0), 0);

    document.getElementById('totalPropostas').textContent = propostas.length;
    document.getElementById('totalEntradas').textContent = real(totalEntradas);
    document.getElementById('totalFalta').textContent = real(totalRestante);
    document.getElementById('totalParcelas').textContent = totalParc;

    if (silencioso && propostas.length > qtdAnt) {
        const alerta = document.getElementById('alertaNovas');
        alerta.style.display = 'block';
        setTimeout(() => alerta.style.display = 'none', 8000);
    }

    filtrar();
}

function filtrar() {
    const busca = document.getElementById('busca').value.trim().toLowerCase().replace(/\D/g, '');
    let lista = propostas;
    if (busca.length >= 3) {
        lista = propostas.filter(p => 
            (p.nome || '').toLowerCase().includes(busca) ||
            (p.cpf || '').replace(/\D/g, '').includes(busca) ||
            (p.codigo_unico || '').toLowerCase().includes(busca)
        );
    }
    document.getElementById('lista').innerHTML = lista.length === 0 
        ? '<p class="vazio">Nenhuma proposta encontrada</p>'
        : lista.map(criarCard).join('');
}

function criarCard(p) {
    const statusCls = p.status === 'Aprovada' ? (p.entrada_paga ? 'status-paga' : 'status-aprovada') : 
                       p.status === 'Reprovada' ? 'status-reprovada' : 'status-nova';
    const statusTxt = p.status === 'Aprovada' ? (p.entrada_paga ? '✅ ENTRADA PAGA' : '✅ APROVADA') : 
                      p.status === 'Reprovada' ? '❌ Reprovada' : '⏳ Aguardando';

    const valorTotal = Number(p.valor_desejado || 0);
    const percEnt = Number(p.percentual_entrada || 20);
    const valorEnt = valorTotal * percEnt / 100;
    const parcelas = p.parcelas_escolhidas || p.quantidade_parcelas || 0;
    const juros = Number(p.juros || 0);
    const resto = valorTotal - valorEnt;
    const valParc = parcelas ? resto * (1 + juros/100) / parcelas : 0;

    const cpf = (p.cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    const temPix = !!p.copia_cola_pix;
    const temContrato = !!p.assinatura_contrato;

    let htmlParcelas = '';
    if (p.entrada_paga && parcelas > 0) {
        htmlParcelas = `
        <div class="parcelas-bloco">
            <div class="parcelas-titulo">📋 ${parcelas}x Parcelas</div>
            ${gerarLinhasParcelas(p, parcelas, valParc)}
        </div>`;
    }

    return `
    <div class="proposta">
        <div class="proposta-topo">
            <div>
                <div class="proposta-nome">${p.nome || 'Sem nome'}</div>
                <div class="proposta-info">
                    🆔 Código: ${p.codigo_unico || '---'} | CPF: ${cpf} | 📱 ${p.telefone || 'Não informado'}<br>
                    💰 Total: ${real(valorTotal)} | Entrada: ${real(valorEnt)} | ${parcelas}x de ${real(valParc)} (${juros}% a.m.)<br>
                    ${temPix ? '✅ Pix gerado e liberado' : '⚠️ Aguardando aprovação'} 
                    ${temContrato ? '| ✅ Contrato assinado' : '| ⏳ Aguardando assinatura'}
                </div>
            </div>
            <span class="status ${statusCls}">${statusTxt}</span>
        </div>

        ${temPix ? `
        <div class="pix-bloco">
            📱 <strong>Chave Pix / Código Copia e Cola:</strong>
            <div class="pix-codigo">${p.copia_cola_pix}</div>
            ${p.qr_code_entrada ? `<img src="${p.qr_code_entrada}" class="qrcode-img" alt="QR Code">` : ''}
        </div>` : ''}

        <div class="grade">
            <div class="campo">
                <label>Valor Total (R$)</label>
                <input type="number" id="v-${p.id}" value="${valorTotal}" oninput="atualizarCalc(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (%)</label>
                <input type="number" id="p-${p.id}" value="${percEnt}" oninput="atualizarCalc(${p.id})">
            </div>
            <div class="campo">
                <label>Entrada (R$)</label>
                <input type="text" id="e-${p.id}" value="${real(valorEnt)}" readonly>
            </div>
            <div class="campo">
                <label>Parcelas (1-48)</label>
                <input type="number" id="par-${p.id}" value="${parcelas}" min="1" max="48" oninput="atualizarCalc(${p.id})">
            </div>
            <div class="campo">
                <label>Juros % ao mês</label>
                <input type="number" id="j-${p.id}" value="${juros}" step="0.01" oninput="atualizarCalc(${p.id})">
            </div>
            <div class="campo">
                <label>Valor Parcela (R$)</label>
                <input type="text" id="vp-${p.id}" value="${real(valParc)}" readonly>
            </div>
        </div>

        ${htmlParcelas}

        <div class="botoes">
            ${!p.entrada_paga && p.status !== 'Reprovada' ? `
            <button class="btn btn-aprovar" id="btn-aprovar-${p.id}" onclick="aprovar(${p.id})">✅ Aprovar + Gerar Pix</button>
            <button class="btn btn-pago" onclick="marcarEntradaPaga(${p.id})">💰 Marcar Entrada Paga</button>
            ` : ''}
            ${p.entrada_paga ? `<button class="btn btn-contrato" onclick="verContrato(${p.id})">📄 Ver Contrato Assinado</button>` : ''}
            <button class="btn btn-whatsapp" onclick="enviarWhatsApp(${p.id})">📱 Enviar WhatsApp</button>
            <button class="btn btn-reprovar" onclick="reprovar(${p.id})">❌ Reprovar</button>
            <button class="btn btn-excluir" onclick="excluir(${p.id})">🗑️ Excluir</button>
        </div>
    </div>`;
}

function gerarLinhasParcelas(p, qtd, valParc) {
    let html = '';
    const dataBase = p.data_aprovacao ? new Date(p.data_aprovacao) : new Date();
    const hoje = new Date();

    for (let i = 1; i <= qtd; i++) {
        const dataVenc = dataMaisMeses(dataBase, i);
        const vencStr = formatarData(dataVenc);
        const paga = p[`parcela_${i}_paga`] === true;
        const classe = paga ? 'parcela-paga' : (hoje > dataVenc ? 'parcela-vencida' : 'parcela-pendente');
        const avisoProx = !paga && i === 1 && hoje > new Date(dataVenc.getTime() - 7 * 24 * 60 * 60 * 1000) 
            ? '<span class="aviso-prox">⚠️ Próximo!</span>' : '';

        html += `
        <div class="parcela-linha ${classe}">
            <strong>${i}ª</strong>
            <input type="text" value="${vencStr}" onchange="alterarVencimento(${p.id}, ${i}, this.value)">
            <input type="text" value="${real(valParc)}" onchange="alterarValorParcela(${p.id}, ${i}, this.value)">
            <span>${paga ? '✅ PAGO' : '⏳ Pendente'}${avisoProx}</span>
            ${!paga ? `
            <button class="btn btn-pago" onclick="marcarParcelaPaga(${p.id}, ${i})">✓ Pago</button>
            <button class="btn btn-cobranca" onclick="enviarCobrancaParcela(${p.id}, ${i}, '${vencStr}', '${real(valParc)}')">📩 Cobrar</button>
            ` : '<span>—</span>'}
        </div>`;
    }
    return html;
}

function atualizarCalc(id) {
    const valor = Number(document.getElementById(`v-${id}`).value) || 0;
    const perc = Number(document.getElementById(`p-${id}`).value) || 0;
    const qtd = Number(document.getElementById(`par-${id}`).value) || 0;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;

    const entrada = valor * perc / 100;
    const resto = valor - entrada;
    const valParc = qtd ? resto * (1 + juros/100) / qtd : 0;

    document.getElementById(`e-${id}`).value = real(entrada);
    document.getElementById(`vp-${id}`).value = real(valParc);
}

async function aprovar(id) {
    if (processando) { alert('⏳ Aguarde, processando requisição...'); return; }
    const p = propostas.find(x => x.id === id);
    if (!p) return;

    const valor = Number(document.getElementById(`v-${id}`).value) || 0;
    const perc = Number(document.getElementById(`p-${id}`).value) || 0;
    const entrada = valor * perc / 100;
    const qtd = Number(document.getElementById(`par-${id}`).value) || 1;
    const juros = Number(document.getElementById(`j-${id}`).value) || 0;

    if (!confirm(`✅ APROVAR e GERAR PIX?\n\nCliente: ${p.nome}\nEntrada: ${real(entrada)}`)) return;

    processando = true;
    const btn = document.getElementById(`btn-aprovar-${id}`);
    if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Gerando Pix...';
    }

    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 90000);

        const resposta = await fetch(SERVIDOR_URL + '/api/criar-pagamento', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
                valor: Number(entrada.toFixed(2)),
                tipo: 'pix',
                cpf: (p.cpf || '').replace(/\D/g, ''),
                nome: p.nome,
                descricao: `Entrada - ${p.nome} - ${p.codigo_unico || ''}`
            })
        });

        clearTimeout(timeout);

        if (!resposta.ok) throw new Error('Erro na resposta do servidor');

        const dados = await resposta.json();
        if (dados.erro) throw new Error(dados.erro);

        const chavePix = dados.qr_code || '';
        const qrImg = dados.qr_code_base64 || null;

        const { error } = await supabase.from('propostas').update({
            status: 'Aprovada',
            valor_desejado: valor,
            percentual_entrada: perc,
            valor_entrada: entrada,
            quantidade_parcelas: qtd,
            parcelas_escolhidas: qtd,
            juros: juros,
            copia_cola_pix: chavePix,
            qr_code_entrada: qrImg,
            data_aprovacao: new Date().toISOString()
        }).eq('id', id);

        if (error) throw new Error('Banco: ' + error.message);

        alert('✅ PIX GERADO COM SUCESSO!\nLiberado para o cliente!');
        carregar();

    } catch (erro) {
        console.error(erro);
        alert('⚠️ Erro ao gerar Pix. Verifique a conexão com o servidor e tente novamente.');
    }

    processando = false;
    if (btn) {
        btn.disabled = false;
        btn.textContent = '✅ Aprovar + Gerar Pix';
    }
}

async function marcarEntradaPaga(id) {
    if (!confirm('💰 Marcar entrada como PAGA?\nLibera contrato e parcelas para o cliente!')) return;
    const { error } = await supabase.from('propostas').update({
        entrada_paga: true,
        data_pagamento_entrada: new Date().toISOString()
    }).eq('id', id);

    if (error) alert('❌ Erro: ' + error.message);
    else {
        alert('✅ Entrada marcada como PAGA!\n📄 Contrato e parcelas LIBERADAS!');
        carregar();
    }
}

async function marcarParcelaPaga(id, numParc) {
    if (!confirm(`✅ Marcar ${numParc}ª parcela como PAGA?`)) return;
    const campo = `parcela_${numParc}_paga`;
    const { error } = await supabase.from('propostas').update({ [campo]: true }).eq('id', id);
    if (error) alert('❌ Erro: ' + error.message);
    else carregar();
}

function alterarVencimento(id, numParc, novaData) {
    alert(`✅ Vencimento da ${numParc}ª parcela: ${novaData}`);
}

function alterarValorParcela(id, numParc, novoValor) {
    alert(`✅ Valor da ${numParc}ª parcela: ${novoValor}`);
}

function verContrato(id) {
    const p = propostas.find(x => x.id === id);
    if (!p) return;
    alert(`📄 CONTRATO ASSINADO\n\nCliente: ${p.nome}\nCPF: ${(p.cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}\n\nValor Total: ${real(p.valor_desejado || 0)}\nEntrada: ${real(p.valor_entrada || 0)}\nParcelas: ${p.parcelas_escolhidas || 0}x\n\nAssinatura: ${p.assinatura_contrato || 'Registrada'}\nData: ${p.data_assinatura || '--'}`);
}

async function reprovar(id) {
    if (!confirm('❌ Reprovar esta proposta?')) return;
    const { error } = await supabase.from('propostas').update({ status: 'Reprovada' }).eq('id', id);
    if (error) alert('Erro: ' + error.message);
    else carregar();
}

function enviarWhatsApp(id) {
    const p = propostas.find(x => x.id === id);
    if (!p) return;
    const link = `${window.location.origin.replace('painel.', '')}/consultar.html?cpf=${(p.cpf || '').replace(/\D/g, '')}`;
    const msg = `Olá ${p.nome}! ✅ Sua proposta foi APROVADA!\n\n💰 Valor Total: ${real(p.valor_desejado || 0)}\n💵 Entrada: ${real(p.valor_entrada || 0)}\n📋 Parcelamento em ${p.parcelas_escolhidas || p.quantidade_parcelas || 0}x\n\nAcesse abaixo para ver o Pix, QR Code, assinar contrato e pagar:\n${link}\n\nAtenciosamente, FlashCred 📋`;
    window.open(`https://wa.me/55${(p.telefone || '').replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
}

function enviarCobrancaParcela(id, numParc, venc, valor) {
    const p = propostas.find(x => x.id === id);
    if (!p) return;
    const link = `${window.location.origin.replace('painel.', '')}/consultar.html?cpf=${(p.cpf || '').replace(/\D/g, '')}`;
    const msg = `⚠️ COBRANÇA — ${numParc}ª Parcela\n\nOlá ${p.nome},\nA ${numParc}ª parcela vence em ${venc} no valor de ${valor}.\n\n🔗 Acesse para ver detalhes e pagar:\n${link}\n\nFlashCred — Agradecemos sua pontualidade!`;
    window.open(`https://wa.me/55${(p.telefone || '').replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
}

async function excluir(id) {
    if (!confirm('⚠️ TEM CERTEZA? Essa ação NÃO pode ser desfeita!')) return;
    const { error } = await supabase.from('propostas').delete().eq('id', id);
    if (error) alert('❌ Erro: ' + error.message);
    else carregar();
}
</script>
