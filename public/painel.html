<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        modo_manual: '#3B82F6',
                        modo_teste: '#F59E0B',
                        modo_producao: '#10B981',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; padding: 16px 12px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(10, 36, 99, 0.08); padding: 20px; margin-bottom: 16px; border: 1px solid #E2E8F0; }
        .btn { padding: 10px 12px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
        .btn-sucesso { background: #10B981; color: white; }
        .btn-alerta { background: #F59E0B; color: white; }
        .btn-perigo { background: #EF4444; color: white; }
        .btn-secundario { background: #F1F5F9; color: #0A2463; border: 1px solid #CBD5E1; }
        .btn-azul { background: #3B82F6; color: white; }
        .btn-roxo { background: #8B5CF6; color: white; }
        .btn-laranja { background: #F97316; color: white; }
        .btn-verde-claro { background: #059669; color: white; }
        .input { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 14px; background: #FAFBFC; margin-bottom: 12px; }
        .hidden { display: none !important; }
        .badge { padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-aprovada { background: #D1FAE5; color: #065F46; }
        .badge-pendente { background: #FEF3C7; color: #92400E; }
        .badge-reprovada { background: #FEE2E2; color: #991B1B; }
        .badge-pago { background: #D1FAE5; color: #065F46; }
        .badge-pendente-pag { background: #FEF3C7; color: #92400E; }
        .resumo-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .resumo-item { padding: 16px; border-radius: 12px; text-align: center; font-weight: 600; font-size: 18px; }
        .resumo-recebido { background: #ECFDF5; color: #065F46; border-left: 4px solid #10B981; }
        .resumo-a-receber { background: #FFFBEB; color: #92400E; border-left: 4px solid #F59E0B; }
        .modo-botoes { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .modo-botoes .btn { flex: 1; min-width: 90px; }
        .acoes-linha { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .acoes-linha .btn { flex: 1; min-width: auto; }
        .modal-fundo { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
        .modal-conteudo { background: white; border-radius: 16px; padding: 24px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .loading { display: inline-block; width: 28px; height: 28px; border: 3px solid #E2E8F0; border-top-color: #0A2463; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .aviso-calculo { background: #FEF3C7; color: #92400E; padding: 10px; border-radius: 8px; margin: 8px 0; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h2 class="text-xl font-bold text-primary mb-4">📋 Propostas e Pagamentos</h2>
    
    <div class="modo-botoes">
        <button class="btn" id="btnModoTeste" onclick="definirModo('teste')">Teste</button>
        <button class="btn" id="btnModoManual" onclick="definirModo('manual')">Manual</button>
        <button class="btn" id="btnModoProducao" onclick="definirModo('producao')">Produção</button>
    </div>

    <div class="flex gap-3 mb-4">
        <button class="btn btn-secundario" onclick="abrirAlterarSenha()">Alterar Senha</button>
        <button class="btn btn-perigo" onclick="sairPainel()">Sair</button>
    </div>

    <div class="resumo-box">
        <div class="resumo-item resumo-recebido">
            <p class="text-sm font-normal">Total Recebido</p>
            <span id="totalRecebido">R$ 0,00</span>
        </div>
        <div class="resumo-item resumo-a-receber">
            <p class="text-sm font-normal">A Receber</p>
            <span id="totalAReceber">R$ 0,00</span>
        </div>
    </div>
</div>

<div id="listaPropostas"></div>

<!-- MODAL ENTRADA EM DINHEIRO -->
<div id="modalDinheiro" class="modal-fundo hidden">
    <div class="modal-conteudo">
        <h3 class="text-xl font-bold text-primary mb-4">💵 Pagamento em Dinheiro</h3>
        <p class="text-sm text-gray-600 mb-3">Informe o valor recebido em dinheiro:</p>
        
        <input type="text" id="valorDinheiro" class="input" placeholder="R$ 0,00" oninput="mascaraMoeda(this)">
        
        <div class="flex gap-3 mt-6">
            <button class="btn btn-secundario flex-1" onclick="fecharModalDinheiro()">Cancelar</button>
            <button class="btn btn-sucesso flex-1" onclick="confirmarEntradaDinheiro()">✅ Confirmar Recebimento</button>
        </div>
    </div>
</div>

<!-- MODAL EDITAR PROPOSTA -->
<div id="modalEditar" class="modal-fundo hidden">
    <div class="modal-conteudo">
        <h3 class="text-xl font-bold text-primary mb-4">✏️ Editar Proposta</h3>
        <div id="formEditar"></div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let modoAtual = 'teste';
let cpfEdicao = null;
let cpfDinheiro = null;
const VALOR_MINIMO_PARCELA = 10; // Nenhuma parcela pode ser menor que R$10,00

function limparValor(valor) { 
    if(valor === null || valor === undefined || valor === '') return 0;
    if(typeof valor === 'number') return parseFloat(valor);
    const str = String(valor).replace(/\./g, '').replace(',', '.');
    return parseFloat(str) || 0;
}

function formatarMoeda(valor) {
    return `R$ ${parseFloat(valor || 0).toFixed(2).replace('.', ',')}`;
}

function formatarCpf(cpf) { return String(cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'); }
function formatarTelefone(tel) { 
    if(!tel) return 'Não informado';
    const num = String(tel).replace(/\D/g, '');
    return num.length === 11 ? `(${num.slice(0,2)}) ${num.slice(2,7)}-${num.slice(7)}` : num;
}
function formatarCep(cep) { 
    if(!cep) return 'Não informado';
    const num = String(cep).replace(/[^0-9-]/g, '');
    return num.length === 9 ? num : num.replace(/(\d{5})(\d{3})/, '$1-$2');
}

// ✅ CÁLCULO CORRIGIDO COM JUROS E PARCELA MÍNIMA
function calcularValores(valorSolicitado, percEntrada, percJuros, maxParcelas) {
    const valorTotal = limparValor(valorSolicitado);
    const entrada = (valorTotal * percEntrada) / 100;
    let saldo = valorTotal - entrada;
    let opcoesValidas = [];
    let aviso = '';

    for(let qtd = 1; qtd <= maxParcelas; qtd++) {
        // Juros simples mensal aplicado sobre o saldo
        const valorParcela = (saldo * (1 + (percJuros / 100 * qtd))) / qtd;
        const parcelaArredondada = Math.ceil(valorParcela * 100) / 100;

        if(parcelaArredondada >= VALOR_MINIMO_PARCELA) {
            opcoesValidas.push({
                qtd: qtd,
                valor: parcelaArredondada,
                totalComJuros: (parcelaArredondada * qtd) + entrada
            });
        }
    }

    if(opcoesValidas.length === 0) {
        aviso = `⚠️ Valor muito baixo! A menor parcela permitida é ${formatarMoeda(VALOR_MINIMO_PARCELA)}. Aumente a entrada ou o valor solicitado.`;
    }

    return {
        entrada: entrada,
        saldo: saldo,
        opcoes: opcoesValidas,
        aviso: aviso
    };
}

function definirModo(modo) {
    modoAtual = modo;
    document.getElementById('btnModoTeste').classList.remove('modo_teste', 'text-white');
    document.getElementById('btnModoManual').classList.remove('modo_manual', 'text-white');
    document.getElementById('btnModoProducao').classList.remove('modo_producao', 'text-white');
    
    if(modo === 'teste') {
        document.getElementById('btnModoTeste').classList.add('modo_teste', 'text-white');
    } else if(modo === 'manual') {
        document.getElementById('btnModoManual').classList.add('modo_manual', 'text-white');
    } else {
        document.getElementById('btnModoProducao').classList.add('modo_producao', 'text-white');
    }
    carregarPropostas();
}

function mascaraMoeda(input) {
    let v = input.value.replace(/\D/g, '');
    v = (v / 100).toFixed(2) + '';
    v = v.replace('.', ',');
    input.value = v;
}

async function carregarPropostas() {
    const { data, error } = await supabase.from('propostas').select('*').order('created_at', { ascending: false });
    if(error) return console.error(error);

    let totalRecebido = 0;
    let totalAReceber = 0;
    const lista = document.getElementById('listaPropostas');
    lista.innerHTML = '';

    data.forEach(dados => {
        const valorSolicitado = limparValor(dados.valor_solicitado || 0);
        const percEntrada = dados.percentual_entrada || 40;
        const percJuros = dados.juros || 6;
        const maxParc = dados.quantidade_parcelas || 48;
        
        const calc = calcularValores(valorSolicitado, percEntrada, percJuros, maxParc);
        const valorTotal = calc.opcoes.length > 0 ? calc.opcoes[0].totalComJuros : valorSolicitado;
        const valorEntrada = calc.entrada;
        const valorRecebido = limparValor(dados.valor_recebido) || 0;
        
        if(dados.entrada_paga) totalRecebido += valorEntrada;
        totalAReceber += (valorTotal - valorRecebido);

        const status = (dados.status || 'pendente').toLowerCase();
        const statusPag = dados.entrada_paga ? 
            '<span class="badge badge-pago">Entrada Paga</span>' : 
            '<span class="badge badge-pendente-pag">Entrada Pendente</span>';

        lista.innerHTML += `
        <div class="card">
            <h3 class="text-lg font-semibold mb-2">${dados.nome || 'Cliente Sem Nome'}</h3>
            <div class="mb-3">${statusPag} <span class="badge badge-${status} ml-2">${status.toUpperCase()}</span></div>
            
            <p class="mb-1"><strong>CPF:</strong> ${formatarCpf(dados.cpf)}</p>
            <p class="mb-1"><strong>Nascimento:</strong> ${dados.nascimento || 'Não informado'}</p>
            <p class="mb-1"><strong>WhatsApp:</strong> ${formatarTelefone(dados.whatsapp)}</p>
            <p class="mb-1"><strong>CEP:</strong> ${formatarCep(dados.cep)}</p>
            <p class="mb-1"><strong>Endereço:</strong> ${dados.endereco || 'Não informado'}</p>
            <p class="mb-1"><strong>Valor Solicitado:</strong> ${formatarMoeda(valorSolicitado)}</p>
            <p class="mb-1"><strong>% Entrada:</strong> ${percEntrada}% → ${formatarMoeda(valorEntrada)}</p>
            <p class="mb-1"><strong>% Juros:</strong> ${percJuros}% a.m.</p>
            ${calc.aviso ? `<div class="aviso-calculo">${calc.aviso}</div>` : ''}
            ${calc.opcoes.length > 0 ? `<p class="mb-1"><strong>Melhor parcela:</strong> ${calc.opcoes[0].qtd}x de ${formatarMoeda(calc.opcoes[0].valor)}</p>` : ''}

            <div class="acoes-linha">
                <button class="btn btn-azul" onclick="copiarDados('${dados.cpf}')"><i class="fa-solid fa-copy"></i> Copiar</button>
                <button class="btn btn-roxo" onclick="imprimirProposta('${dados.cpf}')"><i class="fa-solid fa-print"></i> Imprimir</button>
                <button class="btn btn-alerta" onclick="abrirEditar('${dados.cpf}')"><i class="fa-solid fa-pen-to-square"></i> Editar</button>
                <button class="btn btn-perigo" onclick="excluirProposta('${dados.cpf}')"><i class="fa-solid fa-trash"></i> Excluir</button>
            </div>
            <div class="acoes-linha mt-2">
                <button class="btn btn-sucesso" onclick="alterarStatus('${dados.cpf}', 'aprovada')"><i class="fa-solid fa-check"></i> Aprovar</button>
                <button class="btn btn-verde-claro" onclick="enviarWhatsApp('${dados.cpf}')"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
            </div>
            <div class="mt-3">
                <button class="btn btn-laranja w-full" onclick="abrirModalDinheiro('${dados.cpf}')">
                    <i class="fa-solid fa-money-bill-wave"></i> Marcar Entrada em Dinheiro
                </button>
            </div>
        </div>
        `;
    });

    document.getElementById('totalRecebido').textContent = formatarMoeda(totalRecebido);
    document.getElementById('totalAReceber').textContent = formatarMoeda(totalAReceber);
}

// FUNÇÃO EXCLUIR PROPOSTA
async function excluirProposta(cpf) {
    if(confirm('Tem certeza que deseja EXCLUIR esta proposta? Essa ação não pode ser desfeita!')) {
        await supabase.from('propostas').delete().eq('cpf', cpf);
        alert('✅ Proposta excluída com sucesso!');
        carregarPropostas();
    }
}

// FUNÇÕES DA OPÇÃO DE DINHEIRO
function abrirModalDinheiro(cpf) {
    cpfDinheiro = cpf;
    document.getElementById('modalDinheiro').classList.remove('hidden');
    document.getElementById('valorDinheiro').value = '';
    document.getElementById('valorDinheiro').focus();
}

function fecharModalDinheiro() {
    document.getElementById('modalDinheiro').classList.add('hidden');
    cpfDinheiro = null;
}

async function confirmarEntradaDinheiro() {
    const valor = limparValor(document.getElementById('valorDinheiro').value);
    if(valor <= 0) { alert('Informe um valor válido!'); return; }

    if(confirm(`Confirma o recebimento de ${formatarMoeda(valor)} em dinheiro para essa proposta?`)) {
        await supabase.from('propostas').update({
            entrada_paga: true,
            valor_recebido: valor,
            forma_pagamento_entrada: 'Dinheiro',
            data_pagamento_entrada: new Date().toISOString(),
            modo: modoAtual
        }).eq('cpf', cpfDinheiro);

        alert('✅ Entrada marcada como paga em dinheiro!');
        fecharModalDinheiro();
        carregarPropostas();
    }
}

// DEMAIS FUNÇÕES QUE JÁ FUNCIONAVAM
async function alterarStatus(cpf, status) {
    if(confirm(`Deseja realmente ${status === 'aprovada' ? 'APROVAR' : 'REPROVAR'} esta proposta?`)) {
        await supabase.from('propostas').update({ status, modo: modoAtual }).eq('cpf', cpf);
        carregarPropostas();
    }
}

async function abrirEditar(cpf) {
    cpfEdicao = cpf;
    const { data } = await supabase.from('propostas').select('*').eq('cpf', cpf).single();
    const d = data;

    document.getElementById('formEditar').innerHTML = `
        <input type="text" class="input" id="edt_nome" value="${d.nome || ''}" placeholder="Nome Completo">
        <div class="grid grid-cols-2 gap-3">
            <input type="number" class="input" id="edt_percentual" value="${d.percentual_entrada || 40}" placeholder="% Entrada" min="10" max="70">
            <input type="number" class="input" id="edt_juros" value="${d.juros || 6}" placeholder="% Juros ao mês" min="1" max="12">
        </div>
        <div class="grid grid-cols-2 gap-3">
            <input type="number" class="input" id="edt_qtd_parcelas" value="${d.quantidade_parcelas || 12}" placeholder="Qtd Máx Parcelas" min="1" max="48">
            <input type="text" class="input" id="edt_valor_solicitado" value="${formatarMoeda(d.valor_solicitado || 0)}" placeholder="Valor Solicitado" oninput="mascaraMoeda(this)">
        </div>
        <div id="avisoCalcEditar" class="aviso-calculo hidden"></div>
        <div class="flex gap-3 mt-4">
            <button class="btn btn-secundario flex-1" onclick="fecharModalEditar()">Cancelar</button>
            <button class="btn btn-sucesso flex-1" onclick="salvarEdicao()">Salvar e Aprovar</button>
        </div>
    `;
    document.getElementById('modalEditar').classList.remove('hidden');
}

function fecharModalEditar() {
    document.getElementById('modalEditar').classList.add('hidden');
    cpfEdicao = null;
}

async function salvarEdicao() {
    const valorSolicitado = limparValor(document.getElementById('edt_valor_solicitado').value);
    const percEntrada = Number(document.getElementById('edt_percentual').value);
    const percJuros = Number(document.getElementById('edt_juros').value);
    const qtdMax = Number(document.getElementById('edt_qtd_parcelas').value);

    const calc = calcularValores(valorSolicitado, percEntrada, percJuros, qtdMax);
    if(calc.aviso) {
        document.getElementById('avisoCalcEditar').textContent = calc.aviso;
        document.getElementById('avisoCalcEditar').classList.remove('hidden');
        return;
    }

    const dadosAtualizados = {
        nome: document.getElementById('edt_nome').value,
        percentual_entrada: percEntrada,
        juros: percJuros,
        quantidade_parcelas: qtdMax,
        valor_solicitado: valorSolicitado,
        valor_total: calc.opcoes[0].totalComJuros,
        valor_de_cada_parcela: calc.opcoes[0].valor,
        status: 'aprovada',
        modo: modoAtual
    };

    await supabase.from('propostas').update(dadosAtualizados).eq('cpf', cpfEdicao);
    alert('✅ Proposta atualizada e aprovada!');
    fecharModalEditar();
    carregarPropostas();
}

function copiarDados(cpf) {
    const dadosCard = document.querySelector(`.card:has(.badge-pendente, .badge-aprovada, .badge-reprovada):has(p:contains('${cpf}'))`).innerText;
    navigator.clipboard.writeText(dadosCard).then(() => alert('✅ Dados copiados!'));
}

function imprimirProposta(cpf) {
    window.open(`consultar.html?cpf=${cpf}`, '_blank');
}

function enviarWhatsApp(cpf) {
    supabase.from('propostas').select('nome, whatsapp').eq('cpf', cpf).single().then(({data}) => {
        if(!data) return;
        const link = `https://wa.me/${String(data.whatsapp).replace(/\D/g, '')}?text=Olá ${data.nome}! Sua proposta já foi analisada e aprovada! Acesse aqui para ver os detalhes, valores corrigidos, assinar o contrato e fazer o pagamento: ${window.location.origin}/consultar.html?cpf=${cpf}`;
        window.open(link, '_blank');
    });
}

function abrirAlterarSenha() {
    alert('Função de alterar senha configurada no sistema');
}

function sairPainel() {
    if(confirm('Deseja realmente sair?')) window.location.href = 'login.html';
}

// ATUALIZAÇÃO AUTOMÁTICA EM TEMPO REAL
supabase.channel('atualizacao-propostas')
.on('postgres_changes', { event: '*', schema: 'public', table: 'propostas' }, payload => {
    carregarPropostas();
})
.subscribe();

carregarPropostas();
</script>
</body>
</html>
