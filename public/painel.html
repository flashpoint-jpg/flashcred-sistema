<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        whatsapp: '#25D366',
                        roxo: '#8B5CF6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<!-- 🔊 SOM DE NOTIFICAÇÃO -->
<audio id="somNotificacao" preload="auto">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" type="audio/mpeg">


<!-- 🔐 TELA DE LOGIN -->
<div id="telaLogin" class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg border border-slate-200 w-full max-w-md">
        <h2 class="text-xl font-bold text-center text-primary mb-6">🔐 Acesso Painel</h2>
        <input type="password" id="senha" placeholder="Digite a senha" 
            class="w-full p-3 border border-slate-300 rounded-lg mb-4 text-lg"
            onkeydown="if(event.key==='Enter') entrar()">
        <button onclick="entrar()" class="w-full bg-primary text-white p-3 rounded-lg font-bold text-lg hover:bg-primary/90">Entrar</button>
    </div>
</div>

<!-- 📊 PAINEL PRINCIPAL -->
<div id="painel" class="hidden">
    <div class="bg-white border-b border-slate-200 p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-primary">📊 Painel FlashCred</h1>
        <div class="flex gap-4 items-center">
            <div class="relative cursor-pointer" onclick="filtrar('todas')">
                <i class="fas fa-bell text-2xl text-slate-600"></i>
                <span id="qtdPendentes" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
            </div>
            <button onclick="sair()" class="bg-slate-200 px-4 py-2 rounded-lg font-bold hover:bg-slate-300">Sair</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-4">
        <!-- FILTROS -->
        <div class="flex gap-2 mb-6 flex-wrap">
            <button onclick="filtrar('todas')" class="px-4 py-2 bg-slate-200 rounded-lg font-bold hover:bg-slate-300">Todas</button>
            <button onclick="filtrar('Nova')" class="px-4 py-2 bg-amber-400 rounded-lg font-bold hover:bg-amber-500">📄 Novas</button>
            <button onclick="filtrar('Aprovada')" class="px-4 py-2 bg-emerald-500 text-white rounded-lg font-bold hover:bg-emerald-600">✅ Aprovadas</button>
            <button onclick="filtrar('Paga')" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700">💳 Pagas</button>
        </div>

        <!-- LISTA DE PROPOSTAS -->
        <div id="listaPropostas" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
        <div id="semPropostas" class="text-center py-12 text-slate-500 hidden">Nenhuma proposta encontrada.</div>
    </div>
</div>

<!-- ✏️ MODAL EDITAR -->
<div id="modalEditar" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden p-4" onclick="fecharModal(event)">
    <div class="bg-white rounded-xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
        <h3 class="text-lg font-bold text-primary mb-4">📝 Editar Proposta</h3>
        <div id="formEditar"></div>
        <div class="flex gap-2 mt-6 flex-wrap justify-end">
            <button onclick="fecharModalEditar()" class="px-4 py-2 bg-slate-200 rounded-lg font-bold">Fechar</button>
            <button onclick="gerarPDFProposta()" class="px-4 py-2 bg-primary text-white rounded-lg font-bold">📄 Gerar PDF</button>
            <button onclick="salvarEdicao()" class="px-4 py-2 bg-emerald-500 text-white rounded-lg font-bold">💾 Salvar</button>
        </div>
    </div>
</div>

<!-- 📄 ÁREA PDF OCULTA -->
<div id="areaPDF" class="hidden">
    <div class="p-6 bg-white max-w-2xl mx-auto">
        <h2 class="text-2xl font-bold text-center text-primary mb-6 pb-4 border-b-2 border-slate-200">PROPOSTA DE CRÉDITO / PARCELAMENTO</h2>
        <div class="grid grid-cols-2 gap-4">
            <div><span class="text-slate-500 text-sm">Nome:</span><div id="pdfNome" class="font-bold"></div></div>
            <div><span class="text-slate-500 text-sm">CPF:</span><div id="pdfCpf" class="font-bold"></div></div>
            <div><span class="text-slate-500 text-sm">WhatsApp:</span><div id="pdfWhatsapp" class="font-bold"></div></div>
            <div class="col-span-2"><span class="text-slate-500 text-sm">Endereço:</span><div id="pdfEndereco" class="font-bold"></div></div>
            <div><span class="text-slate-500 text-sm">Valor Produto:</span><div id="pdfValorProd" class="font-bold text-primary"></div></div>
            <div><span class="text-slate-500 text-sm">Entrada:</span><div id="pdfEntrada" class="font-bold text-primary"></div></div>
            <div><span class="text-slate-500 text-sm">Parcelas:</span><div id="pdfParcelas" class="font-bold text-primary"></div></div>
            <div><span class="text-slate-500 text-sm">Valor Total:</span><div id="pdfTotal" class="font-bold text-primary"></div></div>
        </div>
        <div class="mt-6">
            <span class="text-slate-500 text-sm">Condições de Pagamento:</span>
            <p class="mt-2 text-sm leading-relaxed">O Cliente compromete-se a pagar o valor acima nas datas e valores acordados. A falta de pagamento poderá implicar em restrição cadastral. Após pagamento da entrada, as demais parcelas deverão ser pagas nas datas de vencimento.</p>
        </div>
        <div class="mt-10 text-center">
            <div class="border-b border-black w-3/5 mx-auto mb-2"></div>
            <p>Assinatura do Cliente</p>
            <p class="mt-6 text-sm">Muzambinho - MG, <span id="pdfData"></span></p>
        </div>
    </div>
</div>

<script>
// ==============================================
// ✅ CONFIGURAÇÕES
// ==============================================
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SENHA = 'flash2026';
let propostas = [];
let filtroAtual = 'todas';
let canalRealtime = null;
let propostaEmEdicao = null;

// ==============================================
// ✅ LOGIN
// ==============================================
function entrar() {
    const s = document.getElementById('senha').value;
    if(s === SENHA) {
        document.getElementById('telaLogin').classList.add('hidden');
        document.getElementById('painel').classList.remove('hidden');
        carregarPropostas();
        ativarRealtime();
    } else {
        alert('❌ Senha incorreta!');
    }
}

function sair() {
    if(canalRealtime) supabase.removeChannel(canalRealtime);
    propostas = [];
    filtroAtual = 'todas';
    document.getElementById('painel').classList.add('hidden');
    document.getElementById('telaLogin').classList.remove('hidden');
    document.getElementById('senha').value = '';
}

// ==============================================
// ✅ CARREGAR PROPOSTAS
// ==============================================
async function carregarPropostas() {
    try {
        const { data, error } = await supabase
            .from('propostas')
            .select('*')
            .order('created_at', { ascending: false });

        if(error) throw error;
        propostas = data || [];
        renderizarPropostas();
    } catch(e) {
        console.error('Erro:', e);
    }
}

// ==============================================
// ✅ TEMPO REAL
// ==============================================
function ativarRealtime() {
    if(canalRealtime) supabase.removeChannel(canalRealtime);
    canalRealtime = supabase.channel('atualizacoes')
        .on('postgres_changes', { event:'*', schema:'public', table:'propostas' }, (payload) => {
            tocarSomNotificacao();
            carregarPropostas();
        })
        .subscribe();
}

function tocarSomNotificacao() {
    const som = document.getElementById('somNotificacao');
    som.currentTime = 0;
    som.play().catch(()=>{});
}

// ==============================================
// ✅ MOSTRAR LISTA
// ==============================================
function renderizarPropostas() {
    const lista = document.getElementById('listaPropostas');
    const sem = document.getElementById('semPropostas');
    
    let filtradas = [...propostas];
    if(filtroAtual !== 'todas') {
        filtradas = propostas.filter(p => p.status === filtroAtual || (filtroAtual==='Paga' && p.entrada_paga));
    }

    const pendentes = propostas.filter(p => !p.status || p.status==='Nova').length;
    document.getElementById('qtdPendentes').textContent = pendentes || '';

    if(filtradas.length === 0) {
        lista.innerHTML = '';
        sem.classList.remove('hidden');
        return;
    }
    sem.classList.add('hidden');

    lista.innerHTML = filtradas.map(p => {
        const cpf = String(p.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        const whats = String(p.whatsapp||'').replace(/\D/g,'');
        const endereco = p.endereco || 'Não informado';
        const status = p.status || 'Nova';
        const entradaPaga = p.entrada_paga ? '✅' : '⏳';
        const valorProd = Number(p.valor_desejado||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
        const valorEnt = Number(p.valor_entrada||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
        const qtdParc = p.quantidade_parcelas || '-';
        const criado = new Date(p.created_at).toLocaleDateString('pt-BR');

        let etiquetaClasse = 'bg-indigo-100 text-indigo-800';
        if(status==='Aprovada') etiquetaClasse='bg-blue-100 text-blue-800';
        else if(status==='Reprovada') etiquetaClasse='bg-red-100 text-red-800';
        else if(p.entrada_paga) etiquetaClasse='bg-emerald-100 text-emerald-800';

        return `
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
            <div class="flex justify-between items-start mb-3">
                <h3 class="font-bold text-lg text-primary">${p.nome||'Cliente'}</h3>
                <span class="px-3 py-1 rounded-full text-sm font-bold ${etiquetaClasse}">${p.entrada_paga ? '💳 Paga' : status}</span>
            </div>
            <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span class="text-slate-500">CPF:</span><span class="font-medium">${cpf}</span></div>
                <div class="flex justify-between"><span class="text-slate-500">WhatsApp:</span><span class="font-medium">${whats ? `<a href="https://wa.me/55${whats}" target="_blank" class="text-green-600 font-bold">📲 ${whats}</a>` : 'Não informado'}</span></div>
                <div class="flex justify-between"><span class="text-slate-500">Endereço:</span><span class="font-medium text-xs">${endereco}</span></div>
                <div class="flex justify-between"><span class="text-slate-500">Valor Produto:</span><span class="font-bold text-primary">${valorProd}</span></div>
                ${(status==='Aprovada'||p.entrada_paga) ? `
                <div class="flex justify-between"><span class="text-slate-500">Entrada:</span><span class="font-medium">${valorEnt} ${entradaPaga}</span></div>
                <div class="flex justify-between"><span class="text-slate-500">Parcelas:</span><span class="font-medium">${qtdParc}x</span></div>
                ` : ''}
                <div class="flex justify-between"><span class="text-slate-500">Data:</span><span class="font-medium">${criado}</span></div>
            </div>

            ${p.entrada_paga ? renderizarParcelas(p) : ''}

            <div class="flex gap-2 mt-4 flex-wrap">
                ${status==='Nova' ? `
                <button onclick="aprovar('${p.id}')" class="px-3 py-2 bg-emerald-500 text-white rounded-lg text-sm font-bold hover:bg-emerald-600">✅ Aprovar</button>
                <button onclick="reprovar('${p.id}')" class="px-3 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600">❌ Reprovar</button>
                ` : ''}
                ${status==='Aprovada' && !p.entrada_paga ? `
                <button onclick="marcarEntradaPagaManual('${p.id}')" class="px-3 py-2 bg-roxo text-white rounded-lg text-sm font-bold hover:bg-purple-700">💰 Entrada Paga (Dinheiro)</button>
                ` : ''}
                <button onclick="abrirEditar('${p.id}')" class="px-3 py-2 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90">📝 Editar</button>
                ${whats ? `<button onclick="enviarWhatsAppProposta('${whats}', '${p.nome||'Cliente'}', ${p.valor_desejado||0})" class="px-3 py-2 bg-whatsapp text-white rounded-lg text-sm font-bold hover:bg-green-600">💬 WhatsApp</button>` : ''}
                <button onclick="excluirProposta('${p.id}')" class="px-3 py-2 bg-red-500 text-white rounded-lg text-sm font-bold hover:bg-red-600">🗑️ Excluir</button>
            </div>
        </div>`;
    }).join('');
}

// ==============================================
// ✅ PARCELAS COM CORES
// ==============================================
function renderizarParcelas(p) {
    if(!p.parcelas || !Array.isArray(p.parcelas) || p.parcelas.length===0) {
        return `<div class="mt-3 p-3 bg-slate-50 rounded-lg border border-dashed border-slate-300"><p class="text-sm text-slate-500">Parcelas em processamento...</p></div>`;
    }
    const hoje = new Date();
    return `<div class="mt-3 p-3 bg-slate-50 rounded-lg border border-dashed border-slate-300">
        <p class="font-bold text-sm mb-2">📋 Parcelas:</p>
        <div class="space-y-2">
        ${p.parcelas.map((parc,i)=>{
            const dt = new Date(parc.data_vencimento);
            const dias = Math.ceil((dt - hoje)/(1000*60*60*24));
            let classe = 'bg-amber-50 border-l-4 border-amber-400 text-amber-900', status='';
            if(parc.paga) { classe='bg-emerald-50 border-l-4 border-emerald-500 text-emerald-900'; status='✅ Paga'; }
            else if(dias<0) { classe='bg-red-50 border-l-4 border-red-500 text-red-900'; status=`⚠️ ${Math.abs(dias)}d atraso`; }
            else if(dias<=7) { classe='bg-amber-50 border-l-4 border-amber-400 text-amber-900'; status=`⏳ ${dias}d`; }
            else status = `${dias}d`;
            return `<div class="p-2 rounded text-sm ${classe} flex justify-between items-center">
                <span>${i+1}ª · R$ ${parc.valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>
                <span>${dt.toLocaleDateString('pt-BR')} ${status}</span>
            </div>`;
        }).join('')}
        </div>
    </div>`;
}

// ==============================================
// ✅ FILTRO
// ==============================================
function filtrar(f) {
    filtroAtual = f;
    renderizarPropostas();
}

// ==============================================
// ✅ APROVAR / REPROVAR
// ==============================================
async function aprovar(id) {
    const valorEnt = prompt('Valor da Entrada:');
    if(!valorEnt) return;
    const qtd = prompt('Quantidade máxima de parcelas:');
    if(!qtd) return;
    const diasEntrega = prompt('Dias para entrega:','7');
    if(diasEntrega===null) return;

    await supabase.from('propostas').update({
        status: 'Aprovada',
        valor_entrada: parseFloat(valorEnt.replace(',','.')),
        quantidade_parcelas: parseInt(qtd),
        dias_entrega: parseInt(diasEntrega||'7')
    }).eq('id', id);
    alert('✅ Aprovada! Já aparece pro cliente!');
}

async function reprovar(id) {
    if(!confirm('Reprovar esta proposta?')) return;
    await supabase.from('propostas').update({ status: 'Reprovada' }).eq('id', id);
}

// ==============================================
// ✅ MARCAR ENTRADA PAGA EM DINHEIRO
// ==============================================
async function marcarEntradaPagaManual(id) {
    if(!confirm('💰 Cliente pagou a entrada EM DINHEIRO?\n\nIsso vai LIBERAR as parcelas IMEDIATAMENTE!')) return;

    const p = propostas.find(x=>x.id===id);
    if(!p) return;

    const valorEnt = Number(p.valor_entrada||0);
    const qtd = Number(p.quantidade_parcelas||1);
    const juros = Number(p.juros_mensal||5)/100;
    const valorTotal = Number(p.valor_total_final || (Number(p.valor_desejado) * (1 + juros)));
    const saldo = valorTotal - valorEnt;

    const parcelas = [];
    const dtBase = new Date();
    for(let i=1; i<=qtd; i++) {
        let valorParc;
        if(qtd === 1) {
            valorParc = valorTotal;
        } else {
            valorParc = saldo * Math.pow(1 + juros, qtd) * juros / (Math.pow(1 + juros, qtd) - 1);
        }
        const dtVenc = new Date(dtBase);
        dtVenc.setMonth(dtVenc.getMonth() + i);
        parcelas.push({
            numero: i,
            valor: parseFloat(valorParc.toFixed(2)),
            data_vencimento: dtVenc.toISOString().split('T')[0],
            paga: false
        });
    }

    await supabase.from('propostas').update({
        entrada_paga: true,
        parcelas: parcelas
    }).eq('id', id);

    alert('✅ ENTRADA PAGA! Parcelas LIBERADAS!');
}

// ==============================================
// ✅ EDITAR PROPOSTA
// ==============================================
async function abrirEditar(id) {
    propostaEmEdicao = propostas.find(x=>x.id===id);
    if(!propostaEmEdicao) return;

    const p = propostaEmEdicao;
    const form = document.getElementById('formEditar');
    form.innerHTML = `
        <div class="space-y-3">
            <div><label class="block text-sm font-medium text-slate-700 mb-1">Nome</label><input type="text" id="ed_nome" value="${p.nome||''}" class="w-full p-2 border border-slate-300 rounded-lg"></div>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">CPF</label><input type="text" id="ed_cpf" value="${String(p.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}" class="w-full p-2 border border-slate-300 rounded-lg"></div>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">WhatsApp</label><input type="text" id="ed_whatsapp" value="${p.whatsapp||''}" class="w-full p-2 border border-slate-300 rounded-lg"></div>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">Endereço</label><input type="text" id="ed_endereco" value="${p.endereco||''}" class="w-full p-2 border border-slate-300 rounded-lg"></div>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-sm font-medium text-slate-700 mb-1">Valor Produto (R$)</label><input type="number" step="0.01" id="ed_valor" value="${p.valor_desejado||0}" class="w-full p-2 border border-slate-300 rounded-lg"></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">Valor Entrada (R$)</label><input type="number" step="0.01" id="ed_entrada" value="${p.valor_entrada||0}" class="w-full p-2 border border-slate-300 rounded-lg"></div>
                <div><label class="block text-sm font-medium text-slate-700 mb-1">Qtd Parcelas</label><input type="number" id="ed_qtd" value="${p.quantidade_parcelas||0}" class="w-full p-2 border border-slate-300 rounded-lg"></div
