<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        modo_manual: '#3B82F6',
                        modo_teste: '#F59E0B',
                        modo_producao: '#10B981',
                        bg: '#F8FAFC',
                        texto: '#1E293B',
                        borda: '#E2E8F0',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        info: '#3B82F6'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #F8FAFC; color: #1E293B; min-height: 100vh; padding: 20px 12px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(10, 36, 99, 0.08); padding: 24px; border: 1px solid #E2E8F0; }
        .titulo-pagina { font-size: 24px; font-weight: 700; color: #0A2463; margin-bottom: 24px; text-align: center; }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .campo { display: flex; flex-direction: column; gap: 6px; }
        .campo label { font-weight: 500; font-size: 14px; color: #334155; }
        .campo input { padding: 12px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 15px; background: #FAFBFC; }
        .resumo-valores { background: #F8FAFC; padding: 20px; border-radius: 12px; margin: 20px 0; border: 1px solid #E2E8F0; }
        .resumo-valores p { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
        .resumo-valores strong { color: #0A2463; font-weight: 600; }
        .resumo-valores .valor-parcela { font-size: 18px; font-weight: 700; color: #0A2463; margin-top: 8px; border-top: 1px solid #E2E8F0; padding-top: 12px; }
        .botoes-acao { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .btn { padding: 12px 20px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
        .btn-cancelar { background: #F1F5F9; color: #475569; border: 1px solid #CBD5E1; }
        .btn-excluir { background: #EF4444; color: white; }
        .btn-pendente { background: #F59E0B; color: white; }
        .btn-salvar { background: #14B8A6; color: white; }
        .btn-whatsapp { background: #25D366; color: white; width: 100%; justify-content: center; margin-top: 8px; }
        .proposta-item { padding: 16px; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .proposta-item:last-child { border-bottom: none; }
        .dados-proposta h4 { font-weight: 600; color: #0A2463; margin-bottom: 4px; }
        .dados-proposta p { font-size: 13px; color: #64748B; }
        .acoes-proposta { display: flex; gap: 8px; }
        .btn-acao { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
        .modal-conteudo { width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .hidden { display: none !important; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 2px solid #E2E8F0; border-top-color: #0A2463; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media(max-width: 640px) {
            .grid-form { grid-template-columns: 1fr; }
            .botoes-acao { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="titulo-pagina">📋 Propostas Recebidas</h1>

    <div id="listaPropostas" class="card mb-6">
        <p class="text-center py-8 text-gray-500">Carregando propostas...</p>
    </div>
</div>

<!-- Modal Editar/Aprovar -->
<div id="modalEditar" class="modal hidden">
    <div class="modal-conteudo card">
        <h3 class="text-xl font-bold text-primary mb-4">Valores e Condições</h3>
        
        <div class="grid-form">
            <div class="campo">
                <label>VALOR SOLICITADO (R$)</label>
                <input type="number" step="0.01" id="edtValorSolicitado" placeholder="0,00" oninput="calcularResumo()">
            </div>
            <div class="campo">
                <label>% ENTRADA</label>
                <input type="number" step="0.01" id="edtPercEntrada" placeholder="0" oninput="calcularResumo()">
            </div>
            <div class="campo">
                <label>% JUROS AO MÊS</label>
                <input type="number" step="0.01" id="edtPercJuros" placeholder="0" oninput="calcularResumo()">
            </div>
            <div class="campo">
                <label>QUANTIDADE DE PARCELAS</label>
                <input type="number" min="1" max="48" id="edtQtdParcelas" placeholder="0" oninput="calcularResumo()">
            </div>
        </div>

        <div class="resumo-valores">
            <p>Valor da Entrada: <strong id="resumoEntrada">R$ 0,00</strong></p>
            <p>Valor Total com Juros: <strong id="resumoTotal">R$ 0,00</strong></p>
            <p class="valor-parcela">Valor de Cada Parcela: <strong id="resumoParcela">R$ 0,00</strong></p>
        </div>

        <div class="botoes-acao">
            <button class="btn btn-cancelar" onclick="fecharModal()">Cancelar</button>
            <button class="btn btn-excluir" onclick="excluirProposta()">Excluir Proposta</button>
            <button class="btn btn-pendente" onclick="marcarPendente()">Marcar Pendente</button>
            <button class="btn btn-salvar" onclick="salvarEAprovar()">Salvar e Aprovar</button>
        </div>

        <button class="btn btn-whatsapp" onclick="enviarLinkWhatsApp()">
            <i class="fa-brands fa-whatsapp"></i> Enviar Link WhatsApp
        </button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let propostaAtual = null;
let inscricaoTempoReal = null;

function limparValor(valor) { 
    if(valor === null || valor === undefined || valor === '') return 0;
    if(typeof valor === 'number') return parseFloat(valor);
    const str = String(valor).replace(/\./g, '').replace(',', '.');
    return parseFloat(str) || 0;
}

// MESMA FÓRMULA EXATA USADA NA PÁGINA DO CLIENTE
function calcularValores(valorSolicitado, percEntrada, percJuros, qtdParcelas) {
    const valorEntrada = valorSolicitado * percEntrada / 100;
    const valorFinanciado = valorSolicitado - valorEntrada;
    const taxaJuros = percJuros / 100;
    const valorParcela = (valorFinanciado * Math.pow(1 + taxaJuros, qtdParcelas)) / qtdParcelas;
    const valorTotal = valorEntrada + (valorParcela * qtdParcelas);
    return { valorEntrada, valorFinanciado, taxaJuros, valorParcela, valorTotal };
}

function calcularResumo() {
    const valorSolicitado = limparValor(document.getElementById('edtValorSolicitado').value);
    const percEntrada = limparValor(document.getElementById('edtPercEntrada').value);
    const percJuros = limparValor(document.getElementById('edtPercJuros').value);
    const qtdParcelas = parseInt(document.getElementById('edtQtdParcelas').value) || 0;

    if(valorSolicitado <= 0 || percEntrada <=0 || percJuros <=0 || qtdParcelas <=0) {
        document.getElementById('resumoEntrada').textContent = 'R$ 0,00';
        document.getElementById('resumoTotal').textContent = 'R$ 0,00';
        document.getElementById('resumoParcela').textContent = 'R$ 0,00';
        return;
    }

    const valores = calcularValores(valorSolicitado, percEntrada, percJuros, qtdParcelas);
    
    document.getElementById('resumoEntrada').textContent = `R$ ${valores.valorEntrada.toFixed(2).replace('.', ',')}`;
    document.getElementById('resumoTotal').textContent = `R$ ${valores.valorTotal.toFixed(2).replace('.', ',')}`;
    document.getElementById('resumoParcela').textContent = `R$ ${valores.valorParcela.toFixed(2).replace('.', ',')}`;
}

async function carregarPropostas() {
    try {
        const { data, error } = await supabase
            .from('propostas')
            .select('*')
            .order('created_at', { ascending: false });

        if(error) throw error;
        renderizarLista(data || []);
    } catch (erro) {
        document.getElementById('listaPropostas').innerHTML = `<p class="text-center py-8 text-red-500">Erro ao carregar propostas</p>`;
    }
}

function renderizarLista(propostas) {
    const lista = document.getElementById('listaPropostas');
    if(propostas.length === 0) {
        lista.innerHTML = `<p class="text-center py-8 text-gray-500">Nenhuma proposta recebida ainda</p>`;
        return;
    }

    lista.innerHTML = propostas.map(p => `
        <div class="proposta-item">
            <div class="dados-proposta">
                <h4>${p.nome || 'Cliente sem nome'}</h4>
                <p>CPF: ${String(p.cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</p>
                <p>Valor Solicitado: R$ ${limparValor(p.valor_solicitado || p.valor_desejado || 0).toFixed(2).replace('.', ',')}</p>
            </div>
            <div class="acoes-proposta">
                <button class="btn btn-acao btn-info" onclick="abrirModalEditar(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <i class="fa-solid fa-pen-to-square"></i> Editar
                </button>
                <button class="btn btn-acao btn-sucesso" onclick="abrirModalEditar(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <i class="fa-solid fa-check"></i> Aprovar
                </button>
                <button class="btn btn-acao btn-cancelar" onclick="copiarDados(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <i class="fa-solid fa-copy"></i> Copiar
                </button>
            </div>
        </div>
    `).join('');
}

function abrirModalEditar(proposta) {
    propostaAtual = proposta;
    document.getElementById('edtValorSolicitado').value = limparValor(proposta.valor_solicitado || proposta.valor_desejado || 0);
    document.getElementById('edtPercEntrada').value = limparValor(proposta.percentual_entrada || proposta.entrada_perc || 40);
    document.getElementById('edtPercJuros').value = limparValor(proposta.juros || proposta.juros_perc || 6);
    document.getElementById('edtQtdParcelas').value = parseInt(proposta.quantidade_parcelas || proposta.qtd_parcelas || 4);
    
    calcularResumo();
    document.getElementById('modalEditar').classList.remove('hidden');
}

function fecharModal() {
    propostaAtual = null;
    document.getElementById('modalEditar').classList.add('hidden');
}

async function salvarEAprovar() {
    if(!propostaAtual) return;

    const valorSolicitado = limparValor(document.getElementById('edtValorSolicitado').value);
    const percEntrada = limparValor(document.getElementById('edtPercEntrada').value);
    const percJuros = limparValor(document.getElementById('edtPercJuros').value);
    const qtdParcelas = parseInt(document.getElementById('edtQtdParcelas').value) || 0;

    if(valorSolicitado <=0 || percEntrada <=0 || percJuros <=0 || qtdParcelas <=0) {
        alert('Preencha todos os valores corretamente!');
        return;
    }

    const valores = calcularValores(valorSolicitado, percEntrada, percJuros, qtdParcelas);

    try {
        const { error } = await supabase.from('propostas').update({
            valor_solicitado: valorSolicitado,
            percentual_entrada: percEntrada,
            juros: percJuros,
            quantidade_parcelas: qtdParcelas,
            valor_parcela: valores.valorParcela,
            valor_total: valores.valorTotal,
            valor_entrada: valores.valorEntrada,
            status: 'aprovada'
        }).eq('id', propostaAtual.id);

        if(error) throw error;
        alert('✅ Proposta salva e aprovada com sucesso! O cliente já verá os valores atualizados.');
        fecharModal();
        carregarPropostas();
    } catch (erro) {
        alert('❌ Erro ao salvar: ' + erro.message);
    }
}

async function excluirProposta() {
    if(!propostaAtual || !confirm('Tem certeza que deseja excluir esta proposta? Essa ação não pode ser desfeita.')) return;
    
    try {
        await supabase.from('propostas').delete().eq('id', propostaAtual.id);
        alert('Proposta excluída!');
        fecharModal();
        carregarPropostas();
    } catch {
        alert('Erro ao excluir');
    }
}

async function marcarPendente() {
    if(!propostaAtual) return;
    try {
        await supabase.from('propostas').update({ status: 'pendente' }).eq('id', propostaAtual.id);
        alert('Proposta marcada como pendente!');
        fecharModal();
        carregarPropostas();
    } catch {
        alert('Erro ao alterar status');
    }
}

function enviarLinkWhatsApp() {
    if(!propostaAtual || !propostaAtual.whatsapp) {
        alert('Esse cliente não tem número de WhatsApp cadastrado.');
        return;
    }
    const link = `${window.location.origin}/consultar.html?cpf=${propostaAtual.cpf}`;
    const mensagem = `Olá ${propostaAtual.nome || 'Cliente'}! Sua proposta já foi analisada e está disponível para conferir e finalizar pelo link abaixo: ${link} 🛋️ FlashCred - Aqui acreditamos em você!`;
    window.open(`https://wa.me/${String(propostaAtual.whatsapp).replace(/\D/g, '')}?text=${encodeURIComponent(mensagem)}`, '_blank');
}

function copiarDados(proposta) {
    const texto = `
📋 Dados da Proposta
Nome: ${proposta.nome || 'Não informado'}
CPF: ${String(proposta.cpf || '').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}
WhatsApp: ${proposta.whatsapp || 'Não informado'}
Valor Solicitado: R$ ${limparValor(proposta.valor_solicitado || proposta.valor_desejado || 0).toFixed(2).replace('.', ',')}
    `.trim();
    navigator.clipboard.writeText(texto)
        .then(() => alert('Dados copiados!'))
        .catch(() => alert('Não foi possível copiar, selecione manualmente.'));
}

function iniciarAtualizacaoTempoReal() {
    if(inscricaoTempoReal) inscricaoTempoReal.unsubscribe();
    inscricaoTempoReal = supabase
        .channel('atualizacao-propostas')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'propostas' }, () => {
            carregarPropostas();
        })
        .subscribe();
}

// Iniciar tudo
carregarPropostas();
iniciarAtualizacaoTempoReal();
</script>
</body>
</html>
