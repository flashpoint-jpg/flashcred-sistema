<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | FlashCred</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        sucesso: '#10B981',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        azul: '#3B82F6',
                        fundo: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #F8FAFC; min-height: 100vh; }
        .cartao { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .botao { padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        .botao-primario { background: #0A2463; color: white; }
        .botao-sucesso { background: #10B981; color: white; }
        .botao-alerta { background: #F59E0B; color: white; }
        .botao-perigo { background: #EF4444; color: white; }
        .botao-azul { background: #3B82F6; color: white; }
        .botao-cinza { background: #E5E7EB; color: #374151; }
        .status-nova { color: #3B82F6; font-weight: bold; }
        .status-aprovada { color: #10B981; font-weight: bold; }
        .status-reprovada { color: #EF4444; font-weight: bold; }
        .entrada-paga { color: #10B981; font-weight: bold; }
        .entrada-pendente { color: #F59E0B; font-weight: bold; }
        .linha-proposta { border-bottom: 1px solid #e2e8f0; padding: 12px 0; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; padding:20px; }
        .modal.aberto { display:flex; }
    </style>
</head>
<body class="p-4">

<div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-primary">⚙️ Painel FlashCred</h1>
        <button onclick="sair()" class="botao botao-cinza">Sair <i class="fas fa-sign-out-alt"></i></button>
    </div>

    <!-- Área de Login -->
    <div id="areaLogin" class="cartao p-6 max-w-sm mx-auto">
        <h2 class="text-xl font-bold text-center mb-4">🔐 Acesso Restrito</h2>
        <input type="password" id="senha" placeholder="Digite a senha" class="w-full p-3 border rounded-lg mb-4 text-center">
        <button onclick="entrar()" class="botao botao-primario w-full">Entrar</button>
    </div>

    <!-- Área Principal -->
    <div id="areaPrincipal" class="hidden">
        <button onclick="abrirCadastro()" class="botao botao-sucesso mb-4">➕ Nova Proposta</button>
        <div id="listaPropostas"></div>
    </div>
</div>

<!-- MODAL CADASTRAR/EDITAR -->
<div id="modalProposta" class="modal">
    <div class="cartao p-5 w-full max-w-md max-h-[90vh] overflow-y-auto">
        <h2 id="tituloModal" class="text-xl font-bold mb-4">Nova Proposta</h2>
        <div class="space-y-3">
            <input type="text" id="nome" placeholder="Nome Completo" class="w-full p-2 border rounded">
            <input type="text" id="cpf" placeholder="CPF (apenas números)" maxlength="11" class="w-full p-2 border rounded">
            <input type="text" id="whatsapp" placeholder="WhatsApp com DDD" maxlength="11" class="w-full p-2 border rounded">
            <input type="text" id="valor_desejado" placeholder="Valor do Produto" class="w-full p-2 border rounded">
            <input type="text" id="valor_entrada" placeholder="Valor da Entrada" class="w-full p-2 border rounded">
            <input type="text" id="juros_mensal" placeholder="Juros Mensal %" value="5" class="w-full p-2 border rounded">
            <input type="number" id="quantidade_parcelas" placeholder="Máximo de Parcelas" min="1" max="48" class="w-full p-2 border rounded">
            <input type="number" id="dias_entrega" placeholder="Dias para Entrega" value="7" class="w-full p-2 border rounded">
        </div>
        <div class="mt-4 flex gap-2">
            <button onclick="salvarProposta()" class="botao botao-sucesso flex-1">Salvar</button>
            <button onclick="fecharModal()" class="botao botao-cinza flex-1">Cancelar</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rgcclordmqjmwuzrrfbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g5Tcimge2aiMX8JE3ml1dg_6zbR3uXi';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: true });

const SENHA = 'flash2026';
// ✅ LINK CORRIGIDO: AGORA É "consultar.html"
const LINK_CONSULTA = window.location.href.replace('painel.html','consultar.html');

let editandoId = null;

// LOGIN
function entrar() {
    if(document.getElementById('senha').value === SENHA) {
        document.getElementById('areaLogin').classList.add('hidden');
        document.getElementById('areaPrincipal').classList.remove('hidden');
        carregarPropostas();
        monitorarAtualizacoes();
    } else alert('Senha inválida!');
}
function sair() { location.reload(); }

// CÁLCULO AUTOMÁTICO
function calcular(valor, entrada, juros, qtd) {
    const total = valor * (1 + juros / 100);
    const saldo = total - entrada;
    let parcela = saldo / qtd;
    return {total, parcela};
}

// CARREGAR LISTA
async function carregarPropostas() {
    const {data, error} = await supabase
        .from('propostas')
        .select('*')
        .order('created_at', {ascending:false});

    if(error) return;
    let html = '';

    data.forEach(item => {
        const valor = Number(item.valor_desejado||0);
        const entrada = Number(item.valor_entrada||0);
        const juros = Number(item.juros_mensal||5);
        const qtd = Number(item.quantidade_parcelas||1);
        const calc = calcular(valor, entrada, juros, qtd);

        let statusClasse = 'status-nova';
        if(item.status === 'Aprovada') statusClasse = 'status-aprovada';
        if(item.status === 'Reprovada') statusClasse = 'status-reprovada';

        html += `
        <div class="linha-proposta">
            <div class="flex justify-between items-start flex-wrap gap-2">
                <div>
                    <strong>${item.nome || 'Sem nome'}</strong>
                    <div class="text-sm text-gray-600">CPF: ${(item.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')} | Tel: ${item.whatsapp||'Não informado'}</div>
                    <div class="text-sm mt-1">
                        Valor: R$ ${valor.toLocaleString('pt-BR',{minimumFractionDigits:2})} | 
                        Entrada: R$ ${entrada.toLocaleString('pt-BR',{minimumFractionDigits:2})} | 
                        ${qtd}x de R$ ${calc.parcela.toLocaleString('pt-BR',{minimumFractionDigits:2})}
                    </div>
                    <div class="text-sm mt-1">
                        Status: <span class="${statusClasse}">${item.status||'Nova'}</span> | 
                        Entrada: <span class="${item.entrada_paga?'entrada-paga':'entrada-pendente'}">${item.entrada_paga?'✅ PAGA':'⏳ PENDENTE'}</span>
                    </div>
                </div>
            </div>

            <!-- BOTÕES DE AÇÃO -->
            <div class="flex gap-2 flex-wrap mt-2">
                ${item.status !== 'Aprovada' ? `
                <button onclick="alterarStatus('${item.id}','Aprovada')" class="px-3 py-1.5 text-xs rounded botao-sucesso text-white">
                    <i class="fas fa-check"></i> Aprovar
                </button>
                <button onclick="alterarStatus('${item.id}','Reprovada')" class="px-3 py-1.5 text-xs rounded botao-perigo text-white">
                    <i class="fas fa-times"></i> Reprovar
                </button>
                ` : ''}

                <button onclick="editarProposta('${item.id}')" class="px-3 py-1.5 text-xs rounded botao-azul text-white">
                    <i class="fas fa-edit"></i> Editar
                </button>

                <button onclick="enviarWhatsApp('${item.id}')" class="px-3 py-1.5 text-xs rounded bg-green-600 text-white">
                    <i class="fab fa-whatsapp"></i> Enviar Link
                </button>

                ${item.status === 'Aprovada' && !item.entrada_paga ? `
                <button onclick="marcarEntradaPaga('${item.id}')" class="px-3 py-1.5 text-xs rounded botao-sucesso text-white font-bold">
                    <i class="fas fa-hand-holding-usd"></i> Marcar Entrada Paga
                </button>
                ` : ''}

                <button onclick="excluirProposta('${item.id}')" class="px-3 py-1.5 text-xs rounded botao-perigo text-white">
                    <i class="fas fa-trash"></i> Excluir
                </button>
            </div>
        </div>`;
    });

    document.getElementById('listaPropostas').innerHTML = html || '<p class="text-center text-gray-500">Nenhuma proposta encontrada.</p>';
}

// AÇÕES
async function alterarStatus(id, status) {
    await supabase.from('propostas').update({status}).eq('id',id);
    carregarPropostas();
}

async function marcarEntradaPaga(id) {
    if(!confirm('Confirma pagamento manual da entrada?\nIrá liberar as parcelas para o cliente!')) return;
    await supabase.from('propostas').update({
        entrada_paga: true,
        data_pagamento_entrada: new Date().toISOString()
    }).eq('id',id);
    alert('✅ Entrada marcada como PAGA!');
}

function enviarWhatsApp(id) {
    // ✅ PEGA OS DADOS DIRETO DO BANCO PARA MONTAR O LINK CERTO
    supabase.from('propostas').select('cpf, whatsapp').eq('id',id).single().then(({data}) => {
        if(!data || !data.whatsapp) { alert('WhatsApp não informado nessa proposta!'); return; }
        const texto = `Olá ${data.nome||''}! Sua proposta foi aprovada, acompanhe aqui: ${LINK_CONSULTA}?cpf=${data.cpf}`;
        window.open(`https://wa.me/55${data.whatsapp}?text=${encodeURIComponent(texto)}`);
    });
}

async function editarProposta(id) {
    editandoId = id;
    const {data} = await supabase.from('propostas').select('*').eq('id',id).single();
    if(!data) return;
    document.getElementById('tituloModal').innerText = 'Editar Proposta';
    Object.keys(data).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = data[k] });
    document.getElementById('modalProposta').classList.add('aberto');
}

async function salvarProposta() {
    const dados = {
        nome: document.getElementById('nome').value.trim(),
        cpf: document.getElementById('cpf').value.trim(),
        whatsapp: document.getElementById('whatsapp').value.trim(),
        valor_desejado: Number(document.getElementById('valor_desejado').value) || 0,
        valor_entrada: Number(document.getElementById('valor_entrada').value) || 0,
        juros_mensal: Number(document.getElementById('juros_mensal').value) || 5,
        quantidade_parcelas: Number(document.getElementById('quantidade_parcelas').value) || 1,
        dias_entrega: Number(document.getElementById('dias_entrega').value) || 7,
        status: 'Nova',
        entrada_paga: false
    };

    if(editandoId) {
        await supabase.from('propostas').update(dados).eq('id',editandoId);
    } else {
        await supabase.from('propostas').insert([dados]);
    }

    fecharModal();
    carregarPropostas();
}

async function excluirProposta(id) {
    if(!confirm('Tem certeza que deseja excluir?')) return;
    await supabase.from('propostas').delete().eq('id',id);
}

function abrirCadastro() {
    editandoId = null;
    document.getElementById('tituloModal').innerText = 'Nova Proposta';
    document.querySelectorAll('#modalProposta input').forEach(i => i.value='');
    document.getElementById('juros_mensal').value = 5;
    document.getElementById('dias_entrega').value = 7;
    document.getElementById('modalProposta').classList.add('aberto');
}
function fecharModal() { document.getElementById('modalProposta').classList.remove('aberto'); }

// ATUALIZAÇÃO EM TEMPO REAL
function monitorarAtualizacoes() {
    supabase.channel('propostas')
        .on('postgres_changes', {event:'*', schema:'public', table:'propostas'}, () => carregarPropostas())
        .subscribe();
}
</script>
</body>
</html>
