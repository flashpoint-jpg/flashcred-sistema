  .subtitulo{font-size:12px;color:var(--poeira);margin:-6px 0 14px;line-height:1.5;}

  .botao-chat{position:relative;display:inline-flex;align-items:center;gap:6px;}
  .notif-bolinha{position:absolute;top:-7px;right:-7px;background:var(--chama);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
  .modal-chat{width:100%;max-width:480px;background:var(--painel);border-radius:20px 20px 0 0;max-height:80vh;display:flex;flex-direction:column;border:1px solid var(--linha);}

  .chat-topo h3{font-size:14px;text-transform:uppercase;margin:0;font-family:'Archivo Black';letter-spacing:0.3px;}
  .chat-fechar{background:none;border:none;color:var(--poeira);font-size:22px;cursor:pointer;line-height:1;}
  .chat-mensagens{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:45vh;}
  .bolha{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.4;}
  .bolha span{font-size:9.5px;opacity:0.65;margin-top:3px;display:block;text-align:right;}
  .bolha-eu{background:var(--mango);color:var(--noite);border-bottom-right-radius:4px;align-self:flex-end;}
  .bolha-outro{background:var(--painel-alt);color:var(--osso);border-bottom-left-radius:4px;align-self:flex-start;border:1px solid var(--linha);}
  .chat-vazio{text-align:center;padding:26px;color:var(--poeira);font-size:12.5px;}
  .chat-envio{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--linha);}
  .chat-envio input{flex:1;}
  .chat-envio button{background:var(--mango);border:none;color:var(--noite);border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer;}
</style>

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TAXA_PLATAFORMA = 0.30;
const ESTAGIOS = ['buscando','indo_coletar','coletado','a_caminho','entregue'];
const ROTULOS_ESTAGIO = {
  buscando:'Buscando entregador', indo_coletar:'Indo coletar', coletado:'Coletado',
  a_caminho:'A caminho', entregue:'Entregue'
};
const VEICULOS = {
  bicicleta:{label:'Bicicleta', emoji:'🚲', base:4, km:1.2, veloc:15},
  moto:{label:'Moto', emoji:'🏍️', base:6, km:2.0, veloc:30},
  carro:{label:'Carro', emoji:'🚗', base:10, km:3.0, veloc:25},
  van:{label:'Van', emoji:'🚐', base:18, km:4.5, veloc:22}
};
// Região de cobertura: Muzambinho/MG e cidades próximas
const REGIAO = { minLat:-22.1, maxLat:-20.6, minLon:-47.3, maxLon:-45.7 };

let estado = {
  modo:'cliente',
  form:{ nome:'', telefone:'', origem:'', destino:'', veiculo:'moto', descricao:'', distancia:null, duracaoMin:null, origemCoord:null, destinoCoord:null },
  calculando:false, falhaCalculo:false,
  filtroTelefoneCliente:'',
  motorista:{ nome:'', telefone:'', ativo:false },
  pedidos:[], ultimoPedidosJSON:'',
  carregando:true, toast:null,
  chatAberto:null, mensagens:[], canalChat:null, naoLidas:0,
  sugestoesTemp:{ origem:[], destino:[] }
};

let mapasAtivos = {};
let watchId = null;
let ultimaPosicaoMotorista = null;
let temporizadoresDebounce = {};
function debounce(chave, fn, delay=450){
  clearTimeout(temporizadoresDebounce[chave]);
  temporizadoresDebounce[chave] = setTimeout(fn, delay);
}

// ---------- geo ----------
function paraRad(g){ return g*Math.PI/180; }
function distanciaKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=paraRad(lat2-lat1), dLon=paraRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(paraRad(lat1))*Math.cos(paraRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
async function geocodificar(endereco){
  const q = endereco.toLowerCase().includes('mg') ? endereco : endereco+', Muzambinho, MG';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=1`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    if(!dados||dados.length===0) return null;
    const lat=parseFloat(dados[0].lat), lon=parseFloat(dados[0].lon);
    if(lat<REGIAO.minLat||lat>REGIAO.maxLat||lon<REGIAO.minLon||lon>REGIAO.maxLon) return null;
    return {lat,lon};
  }catch(e){ console.error(e); return null; }
}
function precoDeDistancia(veiculo, km){
  const v=VEICULOS[veiculo];
  return Math.round((v.base+v.km*km)*100)/100;
}
function ganhoMotorista(preco){ return Math.round(preco*(1-TAXA_PLATAFORMA)*100)/100; }

// ---------- preenchimento automático de endereço ----------
async function buscarSugestoes(campo){
  const inputEl = document.getElementById('c-'+campo);
  const cont = document.getElementById('sugestoes-'+campo);
  if(!inputEl || !cont) return;
  const texto = inputEl.value.trim();
  if(texto.length<4){ cont.innerHTML=''; estado.sugestoesTemp[campo]=[]; return; }
  cont.innerHTML = `<div class="sugestao-vazia">Buscando endereços...</div>`;
  const q = texto.toLowerCase().includes('mg') ? texto : texto+', Muzambinho, MG';
  const viewbox = `${REGIAO.minLon},${REGIAO.maxLat},${REGIAO.maxLon},${REGIAO.minLat}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&viewbox=${viewbox}&bounded=1&countrycodes=br&limit=5`;
  try{
    const resp = await fetch(url,{headers:{'Accept-Language':'pt-BR'}});
    const dados = await resp.json();
    // o campo pode ter mudado enquanto a busca corria - confere se ainda é o texto atual
    if(document.getElementById('c-'+campo).value.trim() !== texto) return;
    if(!dados || dados.length===0){ cont.innerHTML = `<div class="sugestao-vazia">Nenhum endereço encontrado na região de Muzambinho.</div>`; return; }
    estado.sugestoesTemp[campo] = dados.map(d=>({
      lat: parseFloat(d.lat), lon: parseFloat(d.lon),
      nome: d.display_name.split(',').slice(0,4).join(',').trim()
    }));
    cont.innerHTML = estado.sugestoesTemp[campo].map((s,idx)=>
      `<div class="sugestao-item" onclick="selecionarSugestao('${campo}',${idx})">📍 ${s.nome}</div>`
    ).join('');
  }catch(e){ console.error(e); cont.innerHTML=''; }
}
function selecionarSugestao(campo, idx){
  const s = estado.sugestoesTemp[campo] && estado.sugestoesTemp[campo][idx];
  if(!s) return;
  const inputEl = document.getElementById('c-'+campo);
  if(inputEl) inputEl.value = s.nome;
  estado.form[campo] = s.nome;
  estado.form[campo+'Coord'] = { lat:s.lat, lon:s.lon };
  const cont = document.getElementById('sugestoes-'+campo);
  if(cont) cont.innerHTML='';
  estado.sugestoesTemp[campo] = [];
  autoCalcularSeCompleto();
}
function autoCalcularSeCompleto(){
  if(estado.form.origemCoord && estado.form.destinoCoord) calcularCorrida();
}

function mostrarToast(msg){
  estado.toast = msg; render();
  setTimeout(()=>{ estado.toast=null; render(); }, 2800);
}

// ---------- dados pedidos ----------
function paraCamposApp(row){
  return {
    id:row.id, clienteNome:row.cliente_nome, clienteTelefone:row.cliente_telefone,
    motoristaNome:row.motorista_nome||'', motoristaTelefone:row.motorista_telefone||'',
    origem:row.origem, destino:row.destino,
    origemCoord:(row.origem_lat!=null&&row.origem_lng!=null)?{lat:row.origem_lat,lon:row.origem_lng}:null,
    destinoCoord:(row.destino_lat!=null&&row.destino_lng!=null)?{lat:row.destino_lat,lon:row.destino_lng}:null,
    motoristaCoord:(row.motorista_lat!=null&&row.motorista_lng!=null)?{lat:row.motorista_lat,lon:row.motorista_lng}:null,
    fotoAntesUrl: row.foto_antes_url || null, fotoDepoisUrl: row.foto_depois_url || null,
    veiculo:row.veiculo, descricao:row.descricao||'',
    distancia:Number(row.distancia)||0, preco:Number(row.preco)||0,
    status:row.status, criadoEm:Number(row.criado_em), atualizadoEm:Number(row.atualizado_em)
  };
}
function paraCamposDB(p){
  return {
    id:p.id, cliente_nome:p.clienteNome, cliente_telefone:p.clienteTelefone,
    motorista_nome:p.motoristaNome||null, motorista_telefone:p.motoristaTelefone||null,
    origem:p.origem, destino:p.destino,
    origem_lat:p.origemCoord?p.origemCoord.lat:null, origem_lng:p.origemCoord?p.origemCoord.lon:null,
    destino_lat:p.destinoCoord?p.destinoCoord.lat:null, destino_lng:p.destinoCoord?p.destinoCoord.lon:null,
    veiculo:p.veiculo, descricao:p.descricao||null, distancia:p.distancia, preco:p.preco,
    status:p.status, criado_em:p.criadoEm, atualizado_em:p.atualizadoEm,
    foto_antes_url:p.fotoAntesUrl||null, foto_depois_url:p.fotoDepoisUrl||null
  };
}

async function carregarPedidos(){
  try{
    const {data,error} = await sb.from('entrega_pedidos').select('*').order('criado_em',{ascending:false});
    if(error){
      console.error(error);
      if(!estado.erroMostrado){ estado.erroMostrado=true; mostrarToast('Erro ao ligar à base de dados: '+(error.message||'verifica a ligação')); }
      return;
    }
    estado.erroMostrado = false;
    const novos = (data||[]).map(paraCamposApp);
    const novoJSON = JSON.stringify(novos);
    if(novoJSON===estado.ultimoPedidosJSON){ estado.carregando=false; return; }
    estado.pedidos=novos; estado.ultimoPedidosJSON=novoJSON; estado.carregando=false;
    render();
  }catch(e){
    console.error(e);
    if(!estado.erroMostrado){ estado.erroMostrado=true; mostrarToast('Falha de ligação à internet ou à base de dados.'); }
  }
}
async function salvarPedido(p){
  const {error} = await sb.from('entrega_pedidos').upsert(paraCamposDB(p));
  if(error){ console.error(error); mostrarToast('Erro ao gravar o pedido.'); }
  estado.ultimoPedidosJSON='';
}

// ---------- chat ----------
async function carregarMensagens(pedidoId){
  const {data} = await sb.from('entrega_chat').select('*').eq('pedido_id',pedidoId).order('criado_em',{ascending:true});
  return data||[];
}
async function enviarMensagem(){
  const input = document.getElementById('chat-input');
  if(!input) return;
  const texto = input.value.trim();
  if(!texto || !estado.chatAberto) return;
  const eu = estado.modo==='cliente' ? 'cliente' : 'motorista';
  const meuNome = estado.modo==='cliente' ? estado.form.nome : estado.motorista.nome;
  input.value='';
  await sb.from('entrega_chat').insert({
    pedido_id: estado.chatAberto.pedidoId, remetente_tipo:eu, remetente_nome:meuNome||eu,
    texto, lido:false, criado_em:Date.now()
  });
}
function assinarChat(pedidoId){
  if(estado.canalChat) sb.removeChannel(estado.canalChat);
  estado.canalChat = sb.channel('chat:'+pedidoId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'entrega_chat',filter:'pedido_id=eq.'+pedidoId}, async ()=>{
      estado.mensagens = await carregarMensagens(pedidoId);
      renderChat();
    }).subscribe();
}
async function abrirChat(pedidoId){
  estado.chatAberto = { pedidoId };
  estado.mensagens = await carregarMensagens(pedidoId);
  assinarChat(pedidoId);
  render();
}
function fecharChat(){
  if(estado.canalChat){ sb.removeChannel(estado.canalChat); estado.canalChat=null; }
  estado.chatAberto=null; estado.mensagens=[];
  render();
}
function renderChat(){
  const caixa = document.getElementById('chat-mensagens');
  if(!caixa) return;
  const eu = estado.modo==='cliente' ? 'cliente' : 'motorista';
  caixa.innerHTML = estado.mensagens.length===0
    ? `<div class="chat-vazio">Nenhuma mensagem ainda. Diz olá!</div>`
    : estado.mensagens.map(m=>{
        const minha = m.remetente_tipo===eu;
        const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        return `<div class="bolha ${minha?'bolha-eu':'bolha-outro'}">${m.texto}<span>${hora}</span></div>`;
      }).join('');
  caixa.scrollTop = caixa.scrollHeight;
}

// ---------- ações ----------
async function calcularCorrida(){
  const f = estado.form;
  if(!f.origem || !f.destino){ mostrarToast('Preenche recolha e destino primeiro.'); return; }
  estado.calculando = true; estado.falhaCalculo = false; render();
  const origemCoord = f.origemCoord || await geocodificar(f.origem);
  const destinoCoord = f.destinoCoord || await geocodificar(f.destino);
  estado.calculando = false;
  if(!origemCoord || !destinoCoord){
    f.distancia=null; f.origemCoord=null; f.destinoCoord=null;
    estado.falhaCalculo = true;
    mostrarToast('Não achei o endereço automaticamente. Informa a distância manualmente abaixo.');
    render(); return;
  }
  const kmReal = distanciaKm(origemCoord.lat,origemCoord.lon,destinoCoord.lat,destinoCoord.lon)*1.3;
  f.distancia = Math.round(kmReal*10)/10;
  f.origemCoord = origemCoord; f.destinoCoord = destinoCoord;
  const veloc = VEICULOS[f.veiculo].veloc;
  f.duracaoMin = Math.max(3, Math.round((f.distancia/veloc)*60));
  render();
}

function usarDistanciaManual(){
  const input = document.getElementById('c-distancia-manual');
  const km = parseFloat(input.value);
  if(!km || km<=0){ mostrarToast('Informa um número de km válido.'); return; }
  estado.form.distancia = Math.round(km*10)/10;
  estado.form.origemCoord = null;
  estado.form.destinoCoord = null;
  const veloc = VEICULOS[estado.form.veiculo].veloc;
  estado.form.duracaoMin = Math.max(3, Math.round((estado.form.distancia/veloc)*60));
  estado.falhaCalculo = false;
  render();
}

async function criarPedido(){
  const f = estado.form;
  if(!f.nome||!f.telefone||!f.origem||!f.destino){ mostrarToast('Preenche nome, telefone, recolha e destino.'); return; }
  if(f.distancia==null){ mostrarToast('Calcula a corrida primeiro.'); return; }
  const preco = precoDeDistancia(f.veiculo, f.distancia);
  const agora = Date.now();
  const pedido = {
    id:'p'+agora+Math.floor(Math.random()*1000),
    clienteNome:f.nome, clienteTelefone:f.telefone,
    origem:f.origem, destino:f.destino, origemCoord:f.origemCoord, destinoCoord:f.destinoCoord,
    veiculo:f.veiculo, descricao:f.descricao, distancia:f.distancia, preco:preco,
    status:'buscando', motoristaNome:'', motoristaTelefone:'', criadoEm:agora, atualizadoEm:agora
  };
  await salvarPedido(pedido);
  estado.filtroTelefoneCliente = f.telefone;
  estado.form = { nome:f.nome, telefone:f.telefone, origem:'', destino:'', veiculo:'moto', descricao:'', distancia:null, duracaoMin:null, origemCoord:null, destinoCoord:null };
  mostrarToast('Pedido criado! Buscando um entregador...');
  await carregarPedidos();
}

async function aceitarPedido(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const { error } = await sb.from('entrega_pedidos').update({
    status:'indo_coletar', motorista_nome: estado.motorista.nome, motorista_telefone: estado.motorista.telefone, atualizado_em: Date.now()
  }).eq('id', id);
  if(error){ console.error(error); mostrarToast('Erro ao aceitar o pedido.'); return; }
  estado.ultimoPedidosJSON='';
  mostrarToast('Pedido aceito! Toca em "Abrir GPS" para navegar.');
  iniciarRastreioMotorista();
  await carregarPedidos();
}

async function avancarStatus(id){
  const p = estado.pedidos.find(x=>x.id===id);
  if(!p) return;
  const i = ESTAGIOS.indexOf(p.status);
  if(i < ESTAGIOS.length-1){
    const novoStatus = ESTAGIOS[i+1];
    const agora = Date.now();
    const { error } = await sb.from('entrega_pedidos').update({ status: novoStatus, atualizado_em: agora }).eq('id', id);
    if(error){ console.error(error); mostrarToast('Erro ao atualizar o pedido.'); return; }
    estado.ultimoPedidosJSON='';
    if(novoStatus==='entregue'){
      pararRastreioMotorista();
      mostrarToast(`Entrega concluída! R$ ${ganhoMotorista(p.preco).toFixed(2)} creditado.`);
    }
    await carregarPedidos();
  }
}

function abrirGPS(endereco){
  window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(endereco+', Muzambinho, MG'), '_blank');
}

// ---------- foto obrigatória antes/depois ----------
let fotoPendente = null; // { pedidoId, tipo }
function solicitarFoto(pedidoId, tipo){
  fotoPendente = { pedidoId, tipo };
  document.getElementById('input-foto').click();
}
async function processarFotoSelecionada(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file || !fotoPendente) return;
  const pendente = fotoPendente; fotoPendente = null;
  mostrarToast('Enviando foto...');
  const nomeArquivo = `${pendente.pedidoId}-${pendente.tipo}-${Date.now()}.jpg`;
  const { error: erroUpload } = await sb.storage.from('entrega-fotos').upload(nomeArquivo, file, { upsert:true, contentType: file.type || 'image/jpeg' });
  if(erroUpload){ console.error(erroUpload); mostrarToast('Erro ao enviar a foto. Tenta novamente.'); return; }
  const { data: pub } = sb.storage.from('entrega-fotos').getPublicUrl(nomeArquivo);
  const campo = pendente.tipo==='antes' ? 'foto_antes_url' : 'foto_depois_url';
  const { error: erroUpdate } = await sb.from('entrega_pedidos').update({ [campo]: pub.publicUrl }).eq('id', pendente.pedidoId);
  if(erroUpdate){ console.error(erroUpdate); mostrarToast('Foto enviada, mas houve erro ao gravar. Tenta avançar de novo.'); return; }
  estado.ultimoPedidosJSON='';
  await avancarStatus(pendente.pedidoId);
}

// ---------- rastreio ao vivo ----------
function iniciarRastreioMotorista(){
  if(!navigator.geolocation || watchId!=null) return;
  watchId = navigator.geolocation.watchPosition(
    (pos)=>{ ultimaPosicaoMotorista = { lat:pos.coords.latitude, lon:pos.coords.longitude }; },
    (err)=>{ console.warn(err); },
    { enableHighAccuracy:true, maximumAge:10000 }
  );
  if(!window._envioIntervalo) window._envioIntervalo = setInterval(enviarPosicaoMotorista, 15000);
}
function pararRastreioMotorista(){ if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } }
async function enviarPosicaoMotorista(){
  if(!ultimaPosicaoMotorista || !estado.motorista.ativo) return;
  const ativo = estado.pedidos.find(p=>p.motoristaTelefone===estado.motorista.telefone && p.status!=='buscando' && p.status!=='entregue');
  if(!ativo) return;
  await sb.from('entrega_pedidos').update({
    motorista_lat: ultimaPosicaoMotorista.lat, motorista_lng: ultimaPosicaoMotorista.lon, motorista_atualizado_em: Date.now()
  }).eq('id', ativo.id);
  estado.ultimoPedidosJSON='';
}

// ---------- mapa ----------
function montarMapa(containerId, pedido){
  setTimeout(()=>{
    const el = document.getElementById(containerId);
    if(!el || !pedido.origemCoord || !pedido.destinoCoord) return;
    if(mapasAtivos[containerId]){ try{ mapasAtivos[containerId].remove(); }catch(e){} }
    const map = L.map(containerId,{zoomControl:false, attributionControl:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const pO=[pedido.origemCoord.lat,pedido.origemCoord.lon], pD=[pedido.destinoCoord.lat,pedido.destinoCoord.lon];
    L.marker(pO,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#FF5A4E;border:2px solid #fff"></div>'})}).addTo(map);
    L.marker(pD,{icon:L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#4CD787;border:2px solid #fff"></div>'})}).addTo(map);
    const pontos=[pO,pD];
    if(pedido.motoristaCoord){
      L.marker([pedido.motoristaCoord.lat,pedido.motoristaCoord.lon],{icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#FFB627;border:2px solid #fff;box-shadow:0 0 0 4px rgba(255,182,39,0.3)"></div>'})}).addTo(map);
      pontos.push([pedido.motoristaCoord.lat,pedido.motoristaCoord.lon]);
    }
    map.fitBounds(pontos,{padding:[24,24]});
    mapasAtivos[containerId]=map;
  },30);
}
function etaHTML(pedido){
  if(!pedido.motoristaCoord) return `<div class="subtitulo" style="margin-top:8px">Aguardando o entregador iniciar a rota...</div>`;
  const alvo = (pedido.status==='indo_coletar') ? pedido.origemCoord : pedido.destinoCoord;
  if(!alvo) return '';
  const km = distanciaKm(pedido.motoristaCoord.lat,pedido.motoristaCoord.lon,alvo.lat,alvo.lon);
  const min = Math.max(1, Math.round((km/VEICULOS[pedido.veiculo].veloc)*60));
  const txt = pedido.status==='indo_coletar' ? 'até a coleta' : 'até o teu endereço';
  return `<div class="eta-banner"><div class="eta-min">~${min} min</div><div class="eta-sub">${km.toFixed(1)} km ${txt} · atualizado em tempo real</div></div>`;
}

  }
  const disponiveis = estado.pedidos.filter(p=>p.status==='buscando');
  const ativos = estado.pedidos.filter(p=>p.status!=='buscando' && p.status!=='entregue' && p.motoristaTelefone===m.telefone);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const entreguesHojeArr = estado.pedidos.filter(p=>p.status==='entregue' && p.motoristaTelefone===m.telefone && p.atualizadoEm>=hoje.getTime());
  const ganhosHoje = entreguesHojeArr.reduce((s,p)=>s+ganhoMotorista(p.preco),0);
  return `
  <div class="saldo-card">
    <div class="valor-saldo">R$ ${ganhosHoje.toFixed(2)}</div>
    <div class="rotulo-saldo">Creditado hoje · ${entreguesHojeArr.length} entregas</div>
  </div>
  <div class="rodape-motorista">
    <div style="font-size:12px;color:var(--poeira)">Ligado como <b style="color:var(--osso)">${m.nome}</b></div>
    <button class="btn btn-secundario btn-pequeno" onclick="sairMotorista()">Sair</button>
  </div>
  ${ativos.length>0 ? `<div class="cartao"><h2>Em curso</h2>${ativos.map(cartaoPedidoAtivo).join('')}</div>` : ''}
  <div class="cartao">
    <h2>Pedidos disponíveis</h2>
    ${disponiveis.length===0
      ? `<div class="vazio"><span class="emoji-grande">🛵</span>Sem pedidos por agora.</div>`
      : disponiveis.map(cartaoPedidoDisponivel).join('')
    }
  </div>`;
}

// ---------- render ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="topo">
      <div class="marca"><div class="icone">E</div><h1>ENTREGA<span>.</span></h1></div>
      <div class="tagline">Entregas rápidas em Muzambinho e região</div>
    </header>
    <div class="toggle-modo">
      <button class="${estado.modo==='cliente'?'ativo':''}" onclick="mudarModo('cliente')">Sou cliente</button>
      <button class="${estado.modo==='entregador'?'ativo':''}" onclick="mudarModo('entregador')">Sou entregador</button>
    </div>
    <div class="aviso">Ligado à tua base de dados Supabase. Cálculo automático cobre Muzambinho/MG e cidades próximas.</div>
    <div class="refresh" onclick="carregarPedidos()">↻ atualizar pedidos</div>
    <main>${estado.modo==='cliente' ? telaCliente() : telaMotorista()}</main>
    ${estado.toast ? `<div class="toast">${estado.toast}</div>` : ''}
    ${estado.chatAberto ? `
    <div class="modal-fundo" onclick="if(event.target===this) fecharChat()">
      <div class="modal-chat">
        <div class="chat-topo"><h3>Chat do pedido</h3><button class="chat-fechar" onclick="fecharChat()">&times;</button></div>
        <div class="chat-mensagens" id="chat-mensagens"></div>
        <div class="chat-envio">
          <input type="text" id="chat-input" placeholder="Escreve uma mensagem..." onkeydown="if(event.key==='Enter') enviarMensagem()">
          <button onclick="enviarMensagem()">Enviar</button>
        </div>
      </div>
    </div>` : ''}
    <input type="file" id="input-foto" accept="image/*" capture="environment" style="display:none" onchange="processarFotoSelecionada(this)">
  `;
  const bind=(id,path)=>{ const el=document.getElementById(id); if(el) el.addEventListener('input',(e)=>setDeep(path,e.target.value)); };
  bind('c-nome','form.nome'); bind('c-telefone','form.telefone'); bind('c-origem','form.origem');
  bind('c-destino','form.destino'); bind('c-descricao','form.descricao');
  ['origem','destino'].forEach(campo=>{
    const el = document.getElementById('c-'+campo);
    if(el){
      el.addEventListener('input', ()=> debounce(campo, ()=>buscarSugestoes(campo)));
      el.addEventListener('blur', ()=> setTimeout(()=>{ const c=document.getElementById('sugestoes-'+campo); if(c) c.innerHTML=''; }, 200));
    }
  });

  estado.pedidos.forEach(p=>{
    if(estado.modo==='cliente' && p.clienteTelefone===estado.filtroTelefoneCliente && p.status!=='buscando' && p.status!=='entregue' && p.origemCoord && p.destinoCoord){
      montarMapa('mapa-c-'+p.id, p);
    }
    if(estado.modo==='entregador' && estado.motorista.ativo && p.motoristaTelefone===estado.motorista.telefone && p.status!=='buscando' && p.status!=='entregue' && p.origemCoord && p.destinoCoord){
      montarMapa('mapa-m-'+p.id, p);
    }
  });
  if(estado.chatAberto) renderChat();
}

function setDeep(path,value){
  const parts=path.split('.'); let obj=estado;
  for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts[parts.length-1]]=value;
  if(path==='form.origem'||path==='form.destino'){ estado.form.distancia=null; estado.form.origemCoord=null; estado.form.destinoCoord=null; }
}
function mudarVeiculo(k){
  estado.form.veiculo=k;
  if(estado.form.distancia!=null){ estado.form.duracaoMin = Math.max(3, Math.round((estado.form.distancia/VEICULOS[k].veloc)*60)); }
  render();
}
function mudarModo(m){ estado.modo=m; estado.ultimoPedidosJSON=''; render(); carregarPedidos(); }
async function entrarComoMotorista(){
  const nome=document.getElementById('m-nome').value.trim();
  const telefone=document.getElementById('m-telefone').value.trim();
  if(!nome||!telefone){ mostrarToast('Preenche nome e telefone.'); return; }
  estado.motorista={ nome, telefone, ativo:true };
  estado.ultimoPedidosJSON='';
  await carregarPedidos();
  render();
  iniciarRastreioMotorista();
}
function sairMotorista(){ pararRastreioMotorista(); estado.motorista={nome:'',telefone:'',ativo:false}; render(); }

window.criarPedido=criarPedido; window.calcularCorrida=calcularCorrida; window.aceitarPedido=aceitarPedido;
window.avancarStatus=avancarStatus; window.mudarVeiculo=mudarVeiculo; window.mudarModo=mudarModo;
window.entrarComoMotorista=entrarComoMotorista; window.sairMotorista=sairMotorista; window.carregarPedidos=carregarPedidos;
window.abrirGPS=abrirGPS; window.abrirChat=abrirChat; window.fecharChat=fecharChat; window.enviarMensagem=enviarMensagem;
window.solicitarFoto=solicitarFoto; window.processarFotoSelecionada=processarFotoSelecionada; window.usarDistanciaManual=usarDistanciaManual;
window.buscarSugestoes=buscarSugestoes; window.selecionarSugestao=selecionarSugestao;

if(typeof window.supabase==='undefined' || !window.supabase.createClient){
  document.getElementById('app').innerHTML = `<div style="padding:40px 24px;text-align:center;color:#F3EFE6;font-family:'Barlow',sans-serif"><div style="font-size:32px;margin-bottom:12px">⚠️</div><div style="font-family:'Archivo Black';font-size:16px;margin-bottom:8px">Não consegui carregar a ligação à base de dados</div><div style="font-size:13px;color:#8D93A6;line-height:1.6">Verifica a tua ligação à internet e recarrega a página.</div></div>`;
} else {
  render();
  carregarPedidos();
  setInterval(carregarPedidos, 5000);
}
</script>
</body>
</html>
