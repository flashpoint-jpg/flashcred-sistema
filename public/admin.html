<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Propostas | FlashCred ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C8102E',
                        secundaria: '#1E293B',
                        destaque: '#059669',
                        alerta: '#F59E0B',
                        perigo: '#EF4444',
                        fundo: '#F8FAFC',
                        menu: '#0F172A'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F8FAFC; min-height: 100vh; }
        .sidebar { background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%); min-height: 100vh; width: 240px; padding: 1.75rem 1.25rem; position: fixed; left: 0; top: 0; }
        .logo { margin-bottom: 2.5rem; }
        .logo h1 { color: white; font-size: 1.35rem; font-weight: 700; }
        .logo p { color: #94A3B8; font-size: 0.85rem; margin-top: 0.25rem; }
        .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1rem; border-radius: 0.875rem; color: #CBD5E1; text-decoration: none; font-weight: 500; font-size: 0.95rem; margin-bottom: 0.5rem; transition: all 0.2s ease; }
        .nav-item:hover { background: rgba(200, 16, 46, 0.15); color: white; transform: translateX(3px); }
        .nav-item.ativo { background: #C8102E; color: white; box-shadow: 0 4px 12px rgba(200, 16, 46, 0.3); }
        .btn-sair { margin-top: 2rem; width: 100%; padding: 0.875rem; border: 1px solid #EF4444; background: transparent; color: #EF4444; border-radius: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-sair:hover { background: #EF4444; color: white; }
        .conteudo { margin-left: 240px; padding: 2rem 2.5rem; }
        .cabecalho-pagina { margin-bottom: 2rem; }
        .cabecalho-pagina h2 { font-size: 1.875rem; font-weight: 700; color: #1E293B; margin-bottom: 0.5rem; }
        .cabecalho-pagina p { color: #64748B; font-size: 1rem; }
        .tabela-container { background: white; border-radius: 1.25rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #F8FAFC; padding: 1.25rem 1rem; text-align: left; font-weight: 600; color: #475569; font-size: 0.9rem; border-bottom: 1px solid #E2E8F0; }
        td { padding: 1.25rem 1rem; border-bottom: 1px solid #F1F5F9; font-size: 0.95rem; color: #1E293B; }
        tr:hover { background: #FAFBFF; }
        .tag-status { padding: 0.4rem 0.85rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
        .tag-analise { background: #FEF3C7; color: #B45309; }
        .tag-aprovado { background: #D1FAE5; color: #047857; }
        .tag-rejeitado { background: #FEE2E2; color: #B91C1C; }
        .btn { padding: 0.6rem 1rem; border: none; border-radius: 0.75rem; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; margin: 0 0.25rem; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
        .btn-aprovar { background: #059669; color: white; }
        .btn-aprovar:hover { background: #047857; }
        .btn-rejeitar { background: #EF4444; color: white; }
        .btn-rejeitar:hover { background: #DC2626; }
        .btn-editar { background: #F59E0B; color: white; }
        .btn-editar:hover { background: #D97706; }
        .vazio { text-align: center; padding: 3rem; color: #64748B; font-weight: 500; }
    </style>
</head>
<body>
<!-- 🔒 PROTEÇÃO DE LOGIN -->
<script>
if(sessionStorage.getItem('logadoFlashCred') !== 'sim'){
    window.location.href = 'login.html';
}
</script>

    <!-- Menu Lateral -->
    <aside class="sidebar">
        <div class="logo">
            <h1>ADMINISTRATIVO</h1>
            <p>Flashpoint Distribuidora</p>
        </div>

        <a href="index.html" class="nav-item">
            <i class="fa fa-home"></i> Painel Inicial
        </a>
        <a href="clientes.html" class="nav-item">
            <i class="fa fa-users"></i> Clientes
        </a>
        <a href="admin.html" class="nav-item ativo">
            <i class="fa fa-file-text-o"></i> Gerenciar Propostas
        </a>
        <a href="financeiro.html" class="nav-item">
            <i class="fa fa-money"></i> Financeiro
        </a>
        <a href="proposta-cliente.html" target="_blank" class="nav-item">
            <i class="fa fa-external-link"></i> Link para Cliente
        </a>

        <button onclick="sairDoSistema()" class="btn-sair">
            <i class="fa fa-sign-out"></i> Sair do Sistema
        </button>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="conteudo">
        <div class="cabecalho-pagina">
            <h2>Gerenciar Propostas</h2>
            <p>Avalie, aprove ou edite todas as solicitações recebidas</p>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>CPF</th>
                        <th>Valor Solicitado</th>
                        <th>Status</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPropostas">
                    <tr>
                        <td colspan="5" class="vazio">Carregando propostas...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

<script>
let todasPropostas = [];

// Carrega os dados ao abrir a página
async function carregarPropostas(){
    try {
        const res = await fetch('/api/propostas');
        if(!res.ok) throw new Error('Erro na resposta');
        const dados = await res.json();
        todasPropostas = dados.propostas || [];
        preencherTabela();
    } catch (erro) {
        document.getElementById('listaPropostas').innerHTML = `<tr><td colspan="5" class="vazio text-perigo">❌ Erro ao carregar os dados</td></tr>`;
        console.error(erro);
    }
}

// Preenche a tabela com os dados
function preencherTabela(){
    const tbody = document.getElementById('listaPropostas');
    tbody.innerHTML = '';

    if(todasPropostas.length === 0){
        tbody.innerHTML = `<tr><td colspan="5" class="vazio">📭 Nenhuma solicitação recebida ainda</td></tr>`;
        return;
    }

    todasPropostas.forEach(proposta => {
        let tagClasse, statusTexto;
        if(proposta.status === 'APROVADO') {
            tagClasse = 'tag-aprovado';
            statusTexto = 'Aprovado';
        } else if(proposta.status === 'REPROVADO') {
            tagClasse = 'tag-rejeitado';
            statusTexto = 'Rejeitado';
        } else {
            tagClasse = 'tag-analise';
            statusTexto = 'Em Análise';
        }

        tbody.innerHTML += `
        <tr>
            <td style="font-weight: 500;">${proposta.nome}</td>
            <td>${proposta.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</td>
            <td style="font-weight: 600;">R$ ${(proposta.valorSolicitado || 0).toFixed(2).replace('.', ',')}</td>
            <td><span class="tag-status ${tagClasse}">${statusTexto}</span></td>
            <td style="text-align: center;">
                ${proposta.status === 'EM_ANALISE' ? `
                <button class="btn btn-aprovar" onclick="alterarStatus('${proposta.cpf}', 'APROVADO')">
                    <i class="fa fa-check"></i> Aprovar
                </button>
                <button class="btn btn-rejeitar" onclick="alterarStatus('${proposta.cpf}', 'REPROVADO')">
                    <i class="fa fa-times"></i> Rejeitar
                </button>
                ` : ''}
                <button class="btn btn-editar" onclick="irParaEditar('${proposta.cpf}')">
                    <i class="fa fa-pencil"></i> Editar
                </button>
            </td>
        </tr>`;
    });
}

// Função para alterar status
async function alterarStatus(cpf, novoStatus){
    const mensagem = novoStatus === 'APROVADO' 
        ? '✅ Deseja realmente APROVAR esta solicitação?' 
        : '❌ Deseja realmente REJEITAR esta solicitação?';
    
    if(!confirm(mensagem)) return;

    try {
        const res = await fetch('/api/propostas/status', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ cpf: cpf, status: novoStatus })
        });

        if(res.ok){
            alert(novoStatus === 'APROVADO' ? '✅ Proposta aprovada com sucesso!' : '❌ Proposta rejeitada!');
            carregarPropostas();
        } else {
            alert('⚠️ Erro ao alterar o status. Tente novamente.');
        }
    } catch {
        alert('⚠️ Falha na conexão. Tente novamente.');
    }
}

// ✅ FUNÇÃO DE EDITAR CORRIGIDA E FUNCIONANDO
function irParaEditar(cpf){
    window.location.href = `consulta-cliente.html?cpf=${encodeURIComponent(cpf)}`;
}

// Função para sair
function sairDoSistema(){
    if(confirm('🚪 Deseja realmente sair do sistema?')){
        sessionStorage.clear();
        window.location.href = 'login.html';
    }
}

// Inicia carregando os dados
carregarPropostas();
</script>
</body>
</html>
