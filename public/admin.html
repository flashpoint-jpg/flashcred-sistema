<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - FlashCred ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#d40000',
                        primaryDark: '#b00000',
                        secondary: '#0f172a',
                        sucesso: '#10b981',
                        alerta: '#f59e0b',
                        perigo: '#ef4444',
                        fundo: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <style>
        .sidebar-link { @apply flex items-center gap-3 p-3 rounded-xl text-gray-300 hover:bg-primary/10 hover:text-white transition-all; }
        .sidebar-link.ativo { @apply bg-primary text-white font-medium; }
        .card { @apply bg-white rounded-2xl shadow p-5; }
        .btn { @apply px-3 py-1.5 rounded-lg text-sm font-medium; }
        .btn-success { @apply bg-sucesso text-white; }
        .btn-warning { @apply bg-alerta text-white; }
        .btn-danger { @apply bg-perigo text-white; }
    </style>
</head>
<body class="bg-fundo min-h-screen">
<div class="flex flex-col md:flex-row">
    <!-- Menu Lateral -->
    <aside class="w-full md:w-64 bg-secondary min-h-screen p-4">
        <div class="mb-8 text-center">
            <h1 class="text-xl font-bold text-white">🛋️ ADMINISTRATIVO</h1>
            <p class="text-xs text-gray-400">Flashpoint Distribuidora</p>
        </div>
        <nav class="space-y-1">
            <a href="index.html" class="sidebar-link"><i class="fa fa-home"></i> Dashboard</a>
            <a href="#" class="sidebar-link ativo"><i class="fa fa-list"></i> Todas Propostas</a>
            <a href="financeiro.html" class="sidebar-link"><i class="fa fa-money"></i> Financeiro</a>
            <a href="relatorios.html" class="sidebar-link"><i class="fa fa-bar-chart"></i> Relatórios</a>
            <hr class="border-gray-700 my-4">
            <a href="proposta-cliente.html" target="_blank" class="sidebar-link text-alerta"><i class="fa fa-link"></i> Link para Cliente</a>
        </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-4 md:p-6">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold">Gerenciar Propostas</h2>
                <p class="text-sm text-gray-500">Avalie, aprove ou edite as solicitações</p>
            </div>
            <a href="proposta-cliente.html" target="_blank" class="btn btn-success">
                <i class="fa fa-plus mr-1"></i> Nova Proposta
            </a>
        </header>

        <div class="card overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-left">
                    <tr>
                        <th class="p-3">Cliente</th>
                        <th class="p-3">CPF</th>
                        <th class="p-3">Valor Solicitado</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPropostas">
                    <tr><td colspan="5" class="p-4 text-center text-gray-500">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
async function carregarPropostas(){
    const res = await fetch('/api/propostas');
    const dados = await res.json();
    const lista = dados.propostas || [];
    const tbody = document.getElementById('listaPropostas');
    tbody.innerHTML = '';

    lista.forEach(p => {
        const statusCor = {
            'EM_ANALISE': 'text-alerta bg-alerta/10',
            'APROVADO': 'text-sucesso bg-sucesso/10',
            'REPROVADO': 'text-perigo bg-perigo/10'
        };
        const statusTexto = {
            'EM_ANALISE': 'Em Análise',
            'APROVADO': 'Aprovado',
            'REPROVADO': 'Reprovado'
        };

        tbody.innerHTML += `
        <tr class="border-t hover:bg-gray-50">
            <td class="p-3 font-medium">${p.nome}</td>
            <td class="p-3">${p.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')}</td>
            <td class="p-3">R$ ${p.valorTotal?.toFixed(2).replace('.', ',') || '0,00'}</td>
            <td class="p-3"><span class="px-2 py-1 rounded text-xs font-medium ${statusCor[p.status]}">${statusTexto[p.status]}</span></td>
            <td class="p-3 flex gap-2">
                ${p.status === 'EM_ANALISE' ? `
                <button class="btn btn-success" onclick="alterarStatus('${p.cpf}','APROVADO')">Aprovar</button>
                <button class="btn btn-danger" onclick="alterarStatus('${p.cpf}','REPROVADO')">Recusar</button>
                ` : ''}
                <button class="btn btn-warning">Editar</button>
            </td>
        </tr>`;
    });
}

async function alterarStatus(cpf, status){
    if(!confirm(`Deseja realmente ${status === 'APROVADO' ? 'APROVAR' : 'RECUSAR'} esta proposta?`)) return;
    await fetch('/api/propostas/status', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cpf, status, valorEntrada: '', qtdParcelas: 6, juros: 6})
    });
    carregarPropostas();
}

carregarPropostas();
</script>
</body>
</html>
