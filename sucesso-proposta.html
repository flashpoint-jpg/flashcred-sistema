<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação Enviada | Flashpoint Distribuidora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#C8102E', sucesso: '#059669' } } } }
    </script>
    <style>
        * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #F8FAFC; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: white; border-radius: 1.25rem; padding: 2.5rem; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .icone { font-size: 4rem; color: #059669; margin-bottom: 1rem; }
        h1 { color: #1E293B; font-size: 1.75rem; margin-bottom: 0.75rem; }
        p { color: #64748B; font-size: 1rem; margin-bottom: 1.5rem; line-height: 1.7; }
        .destaque { color: #1E293B; font-weight: 500; }
        .btn { display: inline-block; padding: 0.875rem 2rem; background: #C8102E; color: white; border-radius: 0.75rem; text-decoration: none; font-weight: 600; transition: background 0.2s; margin: 0.5rem; }
        .btn:hover { background: #9B0000; }
        .btn-secundario { background: #F1F5F9; color: #374151; }
        .btn-secundario:hover { background: #E2E8F0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icone">✅</div>
        <h1>Solicitação Enviada!</h1>
        <p>Recebemos seus dados com sucesso. <strong class="destaque">Nesta página você acompanha tudo: se sua proposta foi aprovada, recusada, vê as parcelas, valores e paga tudo usando só o seu CPF.</strong></p>
        
        <a href="consulta-cliente-publico.html" class="btn">🔎 Acompanhar Minha Proposta</a>
        <br>
        <a href="proposta-cliente.html" class="btn btn-secundario">Voltar para o início</a>
    </div>
</body>
</html>
