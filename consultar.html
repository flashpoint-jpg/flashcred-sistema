<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashpoint - Consultar Proposta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between p-4">

    <div class="max-w-md mx-auto w-full bg-gray-900 p-6 rounded-2xl shadow-2xl border border-gray-800 my-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-red-500">🛋️ Flashpoint</h1>
            <p class="text-xs text-gray-400 mt-1">Acompanhe sua proposta e pagamento de entrada</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Informe seu CPF</label>
                <input type="text" id="cpfConsulta" placeholder="000.000.000-00" class="w-full p-3.5 bg-gray-950 border border-gray-800 rounded-xl text-white focus:ring-2 focus:ring-red-500 outline-none text-sm">
            </div>
            <button onclick="consultarProposta()" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold p-3.5 rounded-xl transition shadow-lg text-sm">Consultar Status</button>
        </div>

        <div id="resultadoConsulta" class="mt-6 hidden"></div>
    </div>

    <script>
        let intervaloVerificacao = null;
        const config = JSON.parse(localStorage.getItem('configFlashpoint') || '{}');

        function consultarProposta() {
            const cpf = document.getElementById('cpfConsulta').value.replace(/\D/g, '');
            if (!cpf || cpf.length !== 11) { alert('Digite um CPF válido'); return; }

            if (intervaloVerificacao) clearInterval(intervaloVerificacao);
            buscarDadosProposta(cpf);
            intervaloVerificacao = setInterval(() => buscarDadosProposta(cpf), 5000);
        }

        function buscarDadosProposta(cpf) {
            const propostas = JSON.parse(localStorage.getItem('propostasFlashpoint') || '[]');
            const proposta = propostas.find(p => p.cpf.replace(/\D/g, '') === cpf);
            const resDiv = document.getElementById('resultadoConsulta');
            resDiv.classList.remove('hidden');

            if (!proposta) {
                resDiv.innerHTML = `<div class="p-4 bg-red-950/40 border border-red-800/60 rounded-xl text-center text-red-400 text-xs">Nenhuma proposta encontrada para este CPF.</div>`;
                clearInterval(intervaloVerificacao);
                return;
            }

            let statusBadge = '';
            if (proposta.status === 'EM_ANALISE') statusBadge = '<span class="px-2 py-1 rounded bg-amber-500/20 text-amber-400 text-xs font-bold border border-amber-500/30">Em Análise</span>';
            else if (proposta.status === 'APROVADO') statusBadge = '<span class="px-2 py-1 rounded bg-green-500/20 text-green-400 text-xs font-bold border border-green-500/30">Aprovado ✅</span>';
            else statusBadge = '<span class="px-2 py-1 rounded bg-red-500/20 text-red-400 text-xs font-bold border border-red-500/30">Recusado</span>';

            let valorEntrada = 0;
            if (config.entradaPct && proposta.valorSolicitado) {
                valorEntrada = (proposta.valorSolicitado * config.entradaPct) / 100;
            }

            let conteudoHtml = `
                <div class="space-y-4 text-left">
                    <div class="p-4 bg-gray-950 rounded-xl border border-gray-800 space-y-2 text-xs">
                        <div class="flex justify-between"><span class="text-gray-400">Cliente:</span> <strong class="text-white">${proposta.nome}</strong></div>
                        <div class="flex justify-between"><span class="text-gray-400">Valor Solicitado:</span> <strong class="text-red-400">R$ ${(proposta.valorSolicitado || 0).toFixed(2).replace('.', ',')}</strong></div>
                        <div class="flex justify-between items-center"><span class="text-gray-400">Status:</span> ${statusBadge}</div>
                    </div>
            `;

            if (proposta.status === 'APROVADO') {
                const entradaPaga = proposta.pagamentoEntradaStatus === 'PAGO';
                if (entradaPaga) {
                    clearInterval(intervaloVerificacao);
                    conteudoHtml += `
                        <div class="p-5 bg-green-950/50 border border-green-500/40 rounded-xl text-center space-y-3">
                            <div class="text-3xl">🎉</div>
                            <h2 class="text-sm font-bold text-green-400">Entrada Confirmada!</h2>
                            <p class="text-xs text-gray-300">Seu pagamento foi processado com sucesso.</p>
                        </div>
                    `;
                } else {
                    conteudoHtml += `
                        <div class="p-4 bg-gray-950 rounded-xl border border-gray-800 space-y-3">
                            <div class="text-center">
                                <p class="text-xs font-bold text-red-400">Pagamento da Entrada (Sinal)</p>
                                ${config.entradaPct ? `<p class="text-xs text-gray-400">Valor: R$ ${valorEntrada.toFixed(2).replace('.', ',')} — ${config.entradaPct}% do valor total</p>` : ''}
                                <p class="text-xs text-gray-400">Pague via Pix para liberar seu crédito</p>
                            </div>
                            ${config.chavePix ? `
                            <div class="flex justify-center">
                                <div id="qrcode" class="bg-white p-2 rounded-lg shadow"></div>
                            </div>
                            <div>
                                <label class="block text-[10px] text-gray-400 mb-1">Pix Copia e Cola:</label>
                                <input type="text" readonly value="${config.chavePix}" id="pixCopiaECola" class="w-full bg-gray-900 p-2 text-xs text-red-300 border border-gray-800 rounded select-all">
                                <button onclick="copiarPix()" class="w-full mt-2 bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded text-xs transition">📋 Copiar Chave Pix</button>
                            </div>
                            ` : `<p class="text-center text-xs text-amber-400">Aguardando configuração de pagamento pela empresa.</p>`}
                            <div class="text-center text-[10px] text-amber-400/80 animate-pulse pt-1">
                                ⏳ Após pagar, volte aqui que atualizamos automaticamente...
                            </div>
                        </div>
                    `;
                    setTimeout(() => {
                        const qrcodeContainer = document.getElementById("qrcode");
                        if (qrcodeContainer && qrcodeContainer.innerHTML === '' && config.chavePix) {
                            new QRCode(qrcodeContainer, {
                                text: config.chavePix,
                                width: 140,
                                height: 140,
                                colorDark: "#000000",
                                colorLight: "#ffffff",
                                correctLevel: QRCode.CorrectLevel.H
                            });
                        }
                    }, 100);
                }
            } else if (proposta.status === 'EM_ANALISE') {
                conteudoHtml += `
                    <div class="p-4 bg-amber-950/30 border border-amber-800/50 rounded-xl text-center text-amber-300 text-xs">
                        Sua proposta está sendo analisada. Aguardamos em breve uma resposta!
                    </div>
                `;
            }

            conteudoHtml += `</div>`;
            resDiv.innerHTML = conteudoHtml;
        }

        function copiarPix() {
            const input = document.getElementById('pixCopiaECola');
            if(!input) return;
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value);
            alert('Chave Pix copiada!');
        }
    </script>
</body>
</html>
