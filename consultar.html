<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred - Consultar Proposta e Entrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between p-4">

    <div class="max-w-md mx-auto w-full bg-gray-900 p-6 rounded-2xl shadow-2xl border border-gray-800 my-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">FlashCred</h1>
            <p class="text-xs text-gray-400 mt-1">Acompanhe sua proposta e pagamento de entrada</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Informe seu CPF</label>
                <input type="text" id="cpfConsulta" placeholder="000.000.000-00" class="w-full p-3.5 bg-gray-950 border border-gray-800 rounded-xl text-white focus:ring-2 focus:ring-amber-400 outline-none text-sm">
            </div>
            <button onclick="consultarProposta()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-extrabold p-3.5 rounded-xl transition shadow-lg text-sm">Consultar Status</button>
        </div>

        <div id="resultadoConsulta" class="mt-6 hidden"></div>
    </div>

    <script>
        let intervaloVerificacao = null;
        let cpfAtual = '';

        async function consultarProposta() {
            const cpf = document.getElementById('cpfConsulta').value;
            if (!cpf) { alert('Digite seu CPF'); return; }
            cpfAtual = cpf;

            if (intervaloVerificacao) clearInterval(intervaloVerificacao);
            buscarDadosProposta();

            // Fica checando automaticamente a cada 5 segundos se a entrada foi aprovada
            intervaloVerificacao = setInterval(buscarDadosProposta, 5000);
        }

        async function buscarDadosProposta() {
            try {
                const response = await fetch(`/api/propostas/${cpfAtual}`);
                const data = await response.json();
                const resDiv = document.getElementById('resultadoConsulta');
                resDiv.classList.remove('hidden');

                if (data.sucesso) {
                    const p = data.proposta;

                    let statusBadge = '';
                    if (p.status === 'EM_ANALISE') statusBadge = '<span class="px-2 py-1 rounded bg-amber-500/20 text-amber-400 text-xs font-bold border border-amber-500/30">Em Análise</span>';
                    else if (p.status === 'APROVADO') statusBadge = '<span class="px-2 py-1 rounded bg-green-500/20 text-green-400 text-xs font-bold border border-green-500/30">Aprovado ✅</span>';
                    else statusBadge = '<span class="px-2 py-1 rounded bg-red-500/20 text-red-400 text-xs font-bold border border-red-500/30">Recusado</span>';

                    let conteudoHtml = `
                        <div class="space-y-4 text-left">
                            <div class="p-4 bg-gray-950 rounded-xl border border-gray-800 space-y-2 text-xs">
                                <div class="flex justify-between"><span class="text-gray-400">Cliente:</span> <strong class="text-white">${p.nome}</strong></div>
                                <div class="flex justify-between"><span class="text-gray-400">Crédito Solicitado:</span> <strong class="text-amber-400">R$ ${p.valorSolicitado}</strong></div>
                                <div class="flex justify-between items-center"><span class="text-gray-400">Status:</span> ${statusBadge}</div>
                            </div>
                    `;

                    if (p.status === 'APROVADO' && p.cobrancaPix) {
                        if (p.pagamentoEntradaStatus === 'PAGO') {
                            // ENTRADA PAGA AUTOMATICAMENTE! Redireciona para o carnê de parcelas
                            clearInterval(intervaloVerificacao);
                            conteudoHtml += `
                                <div class="p-5 bg-green-950/50 border border-green-500/40 rounded-xl text-center space-y-3">
                                    <div class="text-3xl">🎉</div>
                                    <h2 class="text-sm font-bold text-green-400">Entrada Confirmada com Sucesso!</h2>
                                    <p class="text-xs text-gray-300">Seu sinal/entrada foi processado e confirmado em tempo real pelo sistema.</p>
                                    <a href="parcelas.html" class="block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg">Acessar Meu Carnê de Parcelas Agora ➔</a>
                                </div>
                            `;
                        } else {
                            // Entrada pendente, mostra o Pix
                            conteudoHtml += `
                                <div class="p-4 bg-gray-950 rounded-xl border border-gray-800 space-y-3">
                                    <div class="text-center">
                                        <p class="text-xs font-bold text-amber-400">Pagamento da Entrada (Sinal)</p>
                                        <p class="text-xs text-gray-400">Escaneie o QR Code abaixo para liberar seu crédito</p>
                                    </div>
                                    <div class="flex justify-center">
                                        <div id="qrcode" class="bg-white p-2 rounded-lg shadow"></div>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] text-gray-400 mb-1">Pix Copia e Cola:</label>
                                        <input type="text" readonly value="${p.cobrancaPix.copiaECola}" id="pixCopiaECola" class="w-full bg-gray-900 p-2 text-xs text-amber-300 border border-gray-800 rounded select-all">
                                        <button onclick="copiarPix()" class="w-full mt-2 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2 rounded text-xs transition">📋 Copiar Código Pix</button>
                                    </div>
                                    <div class="text-center text-[10px] text-amber-400/80 animate-pulse pt-1">
                                        ⏳ Aguardando confirmação automática do pagamento...
                                    </div>
                                </div>
                            `;
                        }
                    } else if (p.status === 'EM_ANALISE') {
                        conteudoHtml += `
                            <div class="p-4 bg-amber-950/30 border border-amber-800/50 rounded-xl text-center text-amber-300 text-xs">
                                Sua proposta está sendo analisada pela nossa equipe de crédito. Volte em instantes.
                            </div>
                        `;
                    }

                    conteudoHtml += `</div>`;
                    resDiv.innerHTML = conteudoHtml;

                    // Renderizar QR Code se houver cobrança pendente
                    if (p.status === 'APROVADO' && p.pagamentoEntradaStatus !== 'PAGO' && p.cobrancaPix) {
                        const qrcodeContainer = document.getElementById("qrcode");
                        if (qrcodeContainer && qrcodeContainer.innerHTML === '') {
                            new QRCode(qrcodeContainer, {
                                text: p.cobrancaPix.copiaECola,
                                width: 140,
                                height: 140,
                                colorDark: "#000000",
                                colorLight: "#ffffff",
                                correctLevel: QRCode.CorrectLevel.H
                            });
                        }
                    }
                } else {
                    resDiv.innerHTML = `<div class="p-4 bg-red-950/40 border border-red-800/60 rounded-xl text-center text-red-400 text-xs">Nenhuma proposta encontrada para este CPF.</div>`;
                }
            } catch (err) {
                console.log('Erro ao buscar status');
            }
        }

        function copiarPix() {
            const input = document.getElementById('pixCopiaECola');
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value);
            alert('Código Pix copiado com sucesso!');
        }
    </script>
</body>
</html>
