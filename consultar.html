<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCred Móveis - Consultar Proposta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-xl mx-auto w-full bg-gray-800 p-6 rounded-xl shadow-2xl border border-gray-700 my-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">Consultar Proposta</h1>
            <p class="text-sm text-gray-400">Digite seu CPF para ver o status da sua solicitação</p>
        </div>

        <div class="flex gap-2 mb-6">
            <input type="text" id="buscaCpf" placeholder="Digite seu CPF" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:border-amber-400 focus:outline-none">
            <button onclick="consultar()" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold px-6 rounded-lg transition">Buscar</button>
        </div>

        <div id="resultado" class="space-y-4"></div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-amber-400 hover:underline">Voltar para Nova Solicitação</a>
        </div>
    </div>

    <script>
        async function consultar() {
            const cpf = document.getElementById('buscaCpf').value.replace(/\D/g, '');
            const div = document.getElementById('resultado');
            if (!cpf) {
                alert('Digite um CPF válido.');
                return;
            }

            div.innerHTML = '<p class="text-center text-gray-400">Buscando proposta...</p>';

            try {
                const res = await fetch(`/api/propostas/${cpf}`);
                const data = await res.json();

                if (data.sucesso) {
                    const p = data.proposta;
                    div.innerHTML = `
                        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 space-y-2">
                            <p><strong>Nome:</strong> ${p.nome}</p>
                            <p><strong>Valor Solicitado:</strong> R$ ${p.valorSolicitado}</p>
                            <p><strong>Parcelas:</strong> ${p.qtdParcelas}x</p>
                            <p><strong>Status:</strong> <span class="px-2 py-1 rounded text-xs font-bold ${p.status === 'APROVADO' ? 'bg-green-600 text-white' : p.status === 'REPROVADO' ? 'bg-red-600 text-white' : 'bg-yellow-600 text-gray-950'}">${p.status}</span></p>
                            ${p.status === 'APROVADO' ? '<div class="mt-4 p-3 bg-amber-500/10 border border-amber-500 rounded text-amber-300 text-sm">Parabéns! Sua proposta foi aprovada. Entraremos em contato em breve.</div>' : ''}
                        </div>
                    `;
                } else {
                    div.innerHTML = '<p class="text-center text-red-400">Nenhuma proposta encontrada para este CPF.</p>';
                }
            } catch (err) {
                div.innerHTML = '<p class="text-center text-red-400">Erro ao buscar dados.</p>';
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const cpfParam = urlParams.get('cpf');
            if (cpfParam) {
                document.getElementById('buscaCpf').value = cpfParam;
                consultar();
            }
        }
    </script>
</body>
</html>
